const MCQS=[
["Which constitutional provision mandates that federal regulations have priority over state law?", ["Third Amendment", "Supremacy Clause", "Prioritization Clause", "Federalist Number 10"], 1, "Supremacy Clause, Article VI: Constitution, federal law, treaties, and federal regulations trump state law.", "Foundations"],
["Which doctrine is used by U.S. courts to align current cases with prior legal decisions?", ["Stare decisis", "Judicial review", "Equitable estoppel", "Respondeat superior"], 0, "Stare decisis = 'let the decision stand,' follow precedent. Judicial review = testing laws against the Constitution.", "Foundations"],
["Two corporations have combined their management and operations into a single place with 30 total employees. Which type of business relationship is formed that now requires both companies to comply with federal employment law?", ["Joint employer", "Sole proprietorship", "Integrated enterprise", "Limited liability partnership"], 2, "Combined management + operations = integrated enterprise, counted as ONE employer. Joint employer = two separate entities controlling the same worker.", "Foundations"],
["Which test is used to distinguish an independent contractor from an employee?", ["Covered employer test", "Economic realities test", "Integrated enterprise test", "Scope of employment test"], 1, "Economic realities test: is the worker economically dependent on the employer? (Common law control test and IRS 20-factor are the others.)", "Foundations"],
["The employee handbook used by a temporary employment agency stated, 'Employees may not be terminated except after first receiving an oral warning, then a formal written warning.' Which principle is demonstrated in the handbook?", ["Express term", "Implied contract", "Contract exemption", "Constructive discharge"], 1, "Handbook promising a termination procedure = implied contract, the at-will exception. Express terms come from formal negotiation.", "Foundations"],
["No employee with a company has ever been terminated without strict adherence to the progressive discipline procedures outlined in the employee handbook. How does the employee handbook apply in this situation?", ["It makes employees at-will.", "It is an implied contract for employees.", "Oral modifications supersede the written handbook.", "The employer may deviate from it for particular employees."], 1, "Consistent practice of following the handbook creates an implied contract binding the employer to it.", "Foundations"],
["What determines employer liability under the respondeat superior doctrine?", ["Employee accountability", "Employee compensation", "The scope of employment", "The dual purpose doctrine"], 2, "Employer is liable only for employee actions within the scope of employment.", "Foundations"],
["Which term indicates that an employer may terminate an employee at any time, for any legal reason, without incurring liability?", ["Employment-at-will", "Respondeat superior", "Scope of employment", "Dual purpose mission"], 0, "At-will: either side can end employment anytime for any legal reason. Every state except Montana.", "Foundations"],
["Which type of employment contract is created by the actions of the employer and employee rather than through a formal contract negotiation?", ["Oral", "Explicit", "Implied", "Written"], 2, "Implied contract = created by conduct. Explicit/express = terms stated in formal agreement (oral or written).", "Foundations"],
["An employee claimed the need for special treatment based on Title VII. What is the first question an HR professional should ask to determine if this law applies to the employee?", ["Is the employee an at-will employee?", "What have similar referents done in this situation?", "Does the employee meet the eligibility requirements?", "What type of special treatment is the employee requesting?"], 2, "Step one is always coverage/eligibility: does the law even apply (employer size, protected class, covered employee)?", "Title VII & Discrimination"],
["To which agency did Title VII give authority to conduct its own enforcement litigation?", ["ADA", "BFOQ", "OSHA", "EEOC"], 3, "EEOC, created by CRA 1964; got its own litigation authority via the 1972 EEO Act amendment.", "Title VII & Discrimination"],
["A women's shelter hires only women as intake specialists and is being sued for disparate treatment. Which role does HR have in relation to the EEOC in this scenario?", ["Establishing indirect evidence", "Providing comparative evidence", "Demonstrating pattern and practice", "Showing bona fide occupational qualification"], 3, "Facially discriminatory policy defended by proving gender is a BFOQ, reasonably necessary to the shelter's operations.", "Title VII & Discrimination"],
["A 65-year-old woman was passed over for a job. The employer told her, 'We're looking to create a younger workforce.' Which type of discrimination is reflected?", ["Systemic bias", "Direct retaliation", "Disparate impact", "Disparate treatment"], 3, "Intentional adverse treatment of an individual with direct evidence ('younger workforce') = disparate treatment.", "Title VII & Discrimination"],
["An organization requires at least a bachelor's degree. Protected-class applicants claim this puts them at a disadvantage. Which rule determines whether there was substantial impact on the protected class?", ["Four-fifths rule", "Equal opportunity rule", "Business necessity rule", "Respondeat superior rule"], 0, "Four-fifths rule: adverse impact flagged when protected class selection rate is under 80% of the majority's rate.", "Title VII & Discrimination"],
["Which practice is descriptive of a church requiring clergy to be of a particular denomination?", ["Adverse impact", "Disparate treatment", "Reverse discrimination", "Bona fide occupational qualification"], 3, "Religion as BFOQ, reasonably necessary to the religious organization's operations (Section 702).", "Title VII & Discrimination"],
["A company reduced a pregnant employee's hours from 40 per week to eight on the basis that she could no longer perform the fundamental requirements of her position. Which statute will help the employee's case?", ["Family Medical Leave Act", "Women in the Workplace Act", "Pregnancy Discrimination Act", "Americans with Disabilities Act"], 2, "PDA (1978, Title VII amendment): treat pregnancy like any other temporary disability, no unilateral hour-cutting.", "Title VII & Discrimination"],
["Which claim alleges that the work atmosphere has become sexually charged with offensive behaviors that interfere with an employee's work performance?", ["Quid pro quo", "Hostile environment", "Gender discrimination", "Reverse discrimination"], 1, "Atmosphere + interference with performance = hostile environment. Quid pro quo requires authority + a tangible job action.", "Title VII & Discrimination"],
["A company sets a goal to hire 30% women in engineering jobs. A class action alleges this preference will deny jobs to otherwise qualified males. Which theory does this illustrate from the male's perspective?", ["National origin", "Affirmative action", "Disparate impact", "Reverse discrimination"], 3, "Preference applied as a fixed number denying qualified majority-group members = reverse discrimination.", "Title VII & Discrimination"],
["Which legislation prohibits discrimination based on physical limitations?", ["Family Medical Leave Act", "Americans with Disabilities Act", "Older Worker's Benefit Protection Act", "Age Discrimination in Employment Act"], 1, "Physical limitations = disability = ADA (1990, private sector 15+).", "Title VII & Discrimination"],
["A city firefighter posting lists essential functions including running. An applicant cannot run due to a former injury and requests a reasonable accommodation. What are the city's duties under the ADA?", ["The city may reject the application because the applicant has a physical disability.", "The city must consider the application and find a position that will not require running.", "The city may reject the application as the applicant cannot perform one of the essential job functions.", "The city must consider the application even though the applicant cannot perform one of the essential job functions."], 2, "Qualified individual = can perform ESSENTIAL functions with or without accommodation. Can't run = not qualified. No duty to create a new job or waive essential functions.", "Title VII & Discrimination"],
["Whose duty is it to suggest a reasonable accommodation that is not readily obvious?", ["Jury", "Judge", "Employer", "Employee"], 3, "Unless the disability is patently obvious, the EMPLOYEE must request/suggest the accommodation to start the interactive process.", "Title VII & Discrimination"],
["Which action demonstrates a goal of affirmative action?", ["Hiring underqualified women candidates", "Meeting ethnic or gender quotas", "Correcting discriminatory practices", "Promoting unqualified minority candidates"], 2, "AA = correcting effects of past/current discrimination. Never quotas, never hiring the unqualified.", "Title VII & Discrimination"],
["Which employer action is a possible employer defense to a claim asserted under the federal ADEA?", ["Employing fewer than 10 employees so the ADEA does not apply", "Stating that job advertisements are not covered under the ADEA", "Requiring all full-time employees over the age of 60 to retire", "Stating that the supervisor who disciplined the employee is over the age of 40"], 0, "ADEA covers employers with more than 20 employees; fewer than 10 = not covered at all. Mandatory retirement is illegal; ads are covered; the supervisor's age is irrelevant.", "Title VII & Discrimination"],
["An employee requests a schedule change for religious practices. According to Title VII, which action is considered an undue hardship for the employer?", ["Mandating that other employees change their schedules against their objections.", "Permitting the employee to go to lunch at 12:00 pm instead of 1:00 pm once a month.", "Incurring minimal costs for temporary staff one week a year.", "Allowing the employee to leave two-hours early on a specific date once a year."], 0, "Religious hardship bar is de minimis, but forcing OTHER employees to change shifts over their objections crosses it. Voluntary swaps ok, forced ones not.", "Title VII & Discrimination"],
["Which race discrimination claim can be based on an employer's policy of racial animosity, steering assignments or yielding to customer discriminatory preference?", ["Disparate treatment", "Racial impact", "Harassment", "Segregation"], 0, "Animus, steering, and customer-preference policies are intentional = disparate treatment.", "Title VII & Discrimination"],
["Which two types of conduct make a company liable for race-based harassment?", ["Unwelcome conduct and pervasive conduct", "Disparate conduct and adverse conduct", "Unwelcome conduct and comparative conduct", "Adverse conduct and pervasive conduct"], 0, "Race harassment liability = conduct that is (1) unwelcome and (2) severe or pervasive enough to alter employment conditions.", "Title VII & Discrimination"],
["Which system for employers determines worker eligibility using Form I-9?", ["E-Verify", "Web Verify", "I-Verification", "Verify Online"], 0, "E-Verify: USCIS internet system confirming work eligibility from I-9 data. Mandatory for covered federal contractors.", "Hiring & Compliance"],
["An employee has demonstrated violent tendencies that developed over several years and were not discernable at hire. The employer is aware but does not terminate. Which legal risk does the employer face?", ["Retaliation", "Defamation", "Negligent hiring", "Negligent retention"], 3, "Danger apparent AFTER hire + kept anyway = negligent retention. Negligent hiring requires the risk to be knowable at hire.", "Hiring & Compliance"],
["Which type of employee would be considered exempt from overtime under the FLSA?", ["An employee who performs janitorial services and earns Federal minimum wage", "A manager with two direct reports who receives high pay", "A computer specialist who earns $20 an hour", "A lead machine operator who oversees minor repairs and earns $10 an hour"], 1, "Exempt = white-collar duties + salary (executive/administrative/professional). High-paid manager with direct reports fits. Duties control, not titles.", "Hiring & Compliance"],
["A Department of Defense supervisor searches an employee's office to investigate misconduct. Which two standards must this search meet to satisfy constitutional requirements?", ["It must be (1) justified at its start, and (2) limited in scope.", "It may not (1) be highly offensive to a reasonable person, or (2) intrude into private matters.", "It may not (1) place the employee in a false light, or (2) appropriate the employee's likeness.", "It must be (1) conducted while the employee is present, and (2) terminate upon the employee's objection."], 0, "O'Connor v. Ortega: public-employer search must be justified at inception and limited in scope. The other options are privacy-tort elements.", "Privacy"],
["An employee sends a personal e-mail using the company's e-mail service. The employer reads it to check whether the employee is wasting time. Which legal principle governs?", ["Because the employer is a large company, the employer may read the e-mail.", "Because the employer read a private e-mail, the employer has violated the law.", "Because the employee sent the e-mail during the workday, the employer may read the e-mail.", "Because the employee used the company's e-mail service, the employer may read the e-mail."], 3, "ECPA service-provider exemption: employer owns the system, so it may monitor business-purpose use. The system, not the time of day, is what matters.", "Privacy"],
["When is a search of personal items by an employer lawful under the Privacy Act and as determined by the Supreme Court without actually deciding the merits of the matter?", ["The search is justified at the start.", "The search is thorough and unlimited.", "The employee is suspected of frolic and detour.", "The employee is engaged in a dual purpose mission."], 0, "O'Connor v. Ortega again (SCOTUS remanded without deciding merits): justified at its start, limited in scope.", "Privacy"],
["A government agency conducts pre-employment drug screening and quarterly random drug testing. Should the firm be concerned about legal challenges to its policy?", ["No. The agency can conduct more thorough drug testing including testing any employee without prior notice.", "Yes. The agency can require random testing of its own employees but not of individuals not already employed.", "No. Public workers must submit to quarterly random tests under the 1991 Omnibus Transportation Testing Act.", "Yes. Because the agency is a government entity, employees are protected from drug searches unless there is reasonable suspicion of drug use."], 3, "Public-employee drug test = 4th Amendment search, requires reasonable suspicion (or a special-need job). Blanket random testing of ordinary government workers fails.", "Privacy"],
["Which type of information is covered by the Fair Credit Reporting Act?", ["Medical records", "Employer injury claims", "Average employee salary", "Workers' compensation costs"], 0, "FCRA consumer reports cover medical records/payments, tenant history, check writing, employment history, insurance claims.", "Privacy"],
["Which penalty is imposed by the Immigration Reform and Control Act?", ["A company that facilitates an illegal border crossing may face criminal liability.", "An undocumented worker who supplies false paperwork may be deported.", "An individual HR employee who fails to check a new worker's eligibility to work in the United States may face civil liability.", "A company that discriminates against undocumented workers by hiring only United States citizens may face civil liability."], 2, "IRCA imposes PERSONAL civil liability on individuals who fail to verify eligibility (I-9), not just the firm. And IRCA actually permits preferring citizens over equally qualified aliens.", "Hiring & Compliance"],
["A firm with 370 employees closes a plant, laying off 56 with only 40 days notice and no severance due to financial troubles. Which circumstance allows this without violating the WARN Act?", ["Layoffs in a NAFTA free-trade zone", "Layoffs due to a certified economic recession", "Layoffs of foreign nationals working in the U.S.", "Layoffs due to a severe unforeseen loss of capital"], 3, "WARN's three notice exceptions: natural disaster, severe unforeseen loss of capital, faltering company. Recession isn't one.", "Hiring & Compliance"],
["An employee uses chemicals to clean metals on an assembly line. Which requirement will the firm face regarding this employee under OSHA regulations?", ["The employee must be trained in life-saving techniques.", "The employee must be trained in safe handling of chemicals.", "The employee must sign a waiver acknowledging the risks.", "The employee must be certified to supervise other employees nearby."], 1, "OSHA compliance requirement: training in the specific hazard (chemical handling). Waivers can't sign away OSHA duties. Training is OSHA's most-violated regulation.", "Regulation & Benefits"],
["Which right does an employee relinquish in exchange for worker's compensation?", ["To take medical leave", "To sue the employer in tort", "To remain employed at-will", "To receive retirement vesting"], 1, "The compensation bargain: assured no-fault benefits in exchange for giving up the right to sue the employer for negligence. Exclusive remedy.", "Regulation & Benefits"],
["An employee's parent was recently diagnosed with a terminal illness. The employee was full-time last year and worked 2000 hours. How much time off is the employee entitled to under the FMLA?", ["12 weeks", "15 weeks", "120 days", "180 days"], 0, "FMLA: 12 weeks unpaid, job-protected. 2000 hours clears the 1,250-hour eligibility bar; parent is a covered family member.", "Regulation & Benefits"],
["Which three types of statutory authority does the National Labor Relations Board (NLRB) have?", ["Judicial, executive, and rule-making authority", "Implied, traditional, and transactional authority", "Judicial, implied, and executive authority", "Executive, rule-making, and traditional authority"], 0, "NLRB holds all three: executive (enforcement), legislative (rule-making), judicial (ALJ adjudication).", "Labor Law"],
["What is the common name of the Labor Management Relations Act of 1947?", ["Clayton Act", "Taft-Hartley Act", "Occupational Health and Safety Act", "Labor Management Reporting and Disclosure Act"], 1, "LMRA 1947 = Taft-Hartley, the union-curbing act. LMRDA 1959 = Landrum-Griffin, the union-corruption act.", "Labor Law"],
["Which restraints does the Labor Management Reporting and Disclosure Act include?", ["Employers are prohibited from disciplining candidates and union election officials.", "Unions are required to hold officer elections every three years, and candidates must have access to voter rolls.", "Employers must permit union members one day off to vote and provide on-site election space.", "Unions are prohibited from charging more than 1% of gross pay in dues."], 1, "Landrum-Griffin polices union internals: elections every 3 years, voter-roll access, financial reports to DOL, no felon officers.", "Labor Law"],
["What are the employer's responsibilities after the NLRB has authorized a union election?", ["Allow time off to workers to attend a union meeting prior to the election", "Allow union organizers into the workplace to speak to employees", "Provide the NLRB with contact information of workers eligible to vote in the election", "Provide the NLRB and union with payroll records of workers eligible to vote"], 2, "Employer must furnish the NLRB names and addresses of eligible workers, and not interfere. No duty to host organizers or hand over payroll.", "Labor Law"],
["Which three outcomes are legally possible if parties reach a deadlock on mandatory issues during collective bargaining?", ["Union may strike, employer may lock out, either party may resume discussions", "Union may lock out management, employer may poll members, issues become prohibited", "Union may strike, employer may poll the union members, issues become prohibited", "Employer may lock out, union may lock out management, either party may resume discussions"], 0, "Impasse is a deadlock, not an ending: strike, lockout, or resumed talks. Unions can't lock out management and impasse doesn't make issues prohibited.", "Labor Law"],
["Employees at a motor company are unionized and negotiating a new collective bargaining agreement. Under which circumstance has the union committed an unfair labor practice?", ["The union fails to attend a scheduled bargaining session with the employer.", "The union requests an excessive number of vacation days.", "The union abruptly leaves a session after three hours of disagreement about benefits.", "The union demands a wage increase exceeding the current cost of living."], 0, "Skipping a scheduled session = failure to bargain in good faith = ULP. Aggressive demands are just bargaining.", "Labor Law"],
["After good faith negotiations, an employer and union cannot resolve an issue and have reached an impasse. What does the NLRA require in this situation?", ["The parties must submit their last best offers to arbitration.", "The Federal Mediation and Conciliation Service must be notified.", "The parties must wait 90 days as a cooling-off period.", "The prior contract terms continue to govern until negotiations resume."], 1, "At impasse the NLRA requires notifying the FMCS. Then strike or lockout become available.", "Labor Law"],
["Which principle may prevent termination of an at-will employment relationship?", ["Dual purpose", "Respondeat superior", "Common law agency", "Good faith and fair dealing"], 3, "The implied covenant of good faith and fair dealing is one of the three at-will exceptions (about 13 states).", "Foundations"],
["When does the employer have the burden of proof in an EEOC discrimination claim?", ["Throughout the entire process", "After the case has been decided by the court", "During the period that the EEOC investigates", "After the plaintiff has established the prima facie case"], 3, "McDonnell Douglas: plaintiff builds the prima facie case first, THEN the burden shifts to the employer to produce a lawful motive.", "Title VII & Discrimination"]
];
const FLASHCARDS=[
["Supremacy Clause", "Article VI: Constitution, federal law, treaties, and federal regulations take priority over state law.", "Foundations"],
["Stare decisis vs judicial review", "Stare decisis = follow precedent ('let the decision stand'). Judicial review = SCOTUS power to test laws against the Constitution.", "Foundations"],
["Employee vs independent contractor: 3 tests", "Common law agency (right to CONTROL the method of work), economic realities (economically DEPENDENT on employer), IRS 20-factor (mostly control).", "Foundations"],
["Economic realities test: 6 factors", "Control, opportunity for profit/loss, worker's investment, permanence of relationship, skill required, integral to the business.", "Foundations"],
["Integrated enterprise vs joint employer", "Integrated = two firms so intertwined (operations, management, labor relations, ownership) they count as ONE employer. Joint = two separate entities each controlling the same worker (temp agency + client), employee counts for BOTH.", "Foundations"],
["Respondeat superior family", "Scope of employment = liable. Frolic and detour = substantial personal departure, not liable. Going and coming = commute never covered. Dual purpose mission = personal + work at once, employer IS liable.", "Foundations"],
["At-will 3 exceptions (with state counts)", "Public policy (~44 states: refusing to break law, legal rights, whistleblowing), implied contract (41 states: handbooks, oral assurances), good faith covenant (only 13 states: firing before pension vests).", "Foundations"],
["Montana WDEA 1987", "Only non-at-will state: good cause required after probation, damages capped at 4 years compensation.", "Foundations"],
["Implied vs express contract", "Implied = created by conduct (handbook practice, assurances). Express/explicit = terms formally stated, oral or written.", "Foundations"],
["Constructive discharge", "Conditions made so intolerable that any reasonable employee would quit. Counts as termination.", "Foundations"],
["Retaliatory discharge", "Firing as punishment for protected activity (jury duty, workers' comp claim, whistleblowing). Public policy exception.", "Foundations"],
["Title VII coverage math", "15+ employees each working day in 20+ calendar weeks. Coverage persists 1 year after hitting 15.", "Discrimination"],
["Disparate treatment vs disparate impact", "Treatment = intentional, individual, motive matters. Impact = facially neutral policy, class harm, NO intent needed.", "Discrimination"],
["Four-fifths rule", "Adverse impact flagged when protected class selection rate < 80% of the majority group's rate.", "Discrimination"],
["McDonnell Douglas burden-shifting", "Plaintiff prima facie (protected class, applied, job open, qualified, denied, employer kept looking) -> employer produces lawful motive -> plaintiff proves pretext.", "Discrimination"],
["Burden of proof shift point", "Employer gets the burden AFTER the plaintiff establishes the prima facie case. Never before.", "Discrimination"],
["BFOQ", "Facially discriminatory requirement lawful when reasonably necessary to the essence of the business (clergy denomination, women's shelter staff). NEVER available for race.", "Discrimination"],
["Retaliation prima facie", "Protected activity + adverse employment action + causal nexus. Survives even if the underlying discrimination claim fails.", "Discrimination"],
["Quid pro quo vs hostile environment", "QPQ = authority + tangible job action (demotion yes, lateral transfer no). Hostile = severe OR pervasive unwelcome conduct, no tangible action needed.", "Discrimination"],
["Race harassment liability: 2 elements", "Conduct (1) unwelcome and (2) severe or pervasive enough to alter conditions, judged by totality of circumstances.", "Discrimination"],
["Ellerth/Faragher defense", "Supervisor harassment without tangible action: employer escapes if it (1) exercised reasonable care to prevent/correct AND (2) plaintiff unreasonably failed to use those opportunities.", "Discrimination"],
["Harassment liability by harasser", "Supervisor + tangible action = strict liability. Supervisor, no action = Ellerth/Faragher defense. Coworker/customer = negligence (knew or should have known).", "Discrimination"],
["Religious undue hardship", "De minimis: anything more than minimal cost. Forced shift changes over coworker objections = hardship. Voluntary swaps = reasonable.", "Discrimination"],
["Religion vs ADA hardship bars", "Religion = de minimis (low bar, easy for employer). ADA = significant burden or expense (high bar). Guaranteed swap question.", "Discrimination"],
["ADA qualified individual", "Can perform ESSENTIAL functions with or without accommodation. Can't perform one essential function = employer may reject. No duty to create a job or drop essential functions.", "Discrimination"],
["Who suggests the accommodation?", "The EMPLOYEE, unless the disability is patently obvious. That request starts the interactive process.", "Discrimination"],
["Mitigating measures rule", "Fully corrective device (glasses) = not disabled. Medication controlling a condition (seizure-free epileptic) = STILL disabled and covered.", "Discrimination"],
["ADEA burden rule", "Burden NEVER shifts under ADEA disparate treatment. Plaintiff must prove but-for causation. Big delta from Title VII.", "Discrimination"],
["ADEA defenses", "Under-20 employees (not covered), BFOQ (public safety, age as proxy), same actor defense (same person hired and fired you), RFOA for impact claims.", "Discrimination"],
["OWBPA waiver numbers", "21 days to consider, 7 days to rescind, must name the ADEA, attorney-consult language, employer bears validity burden. Never blocks an EEOC charge.", "Discrimination"],
["General Dynamics v. Cline", "Favoring the OLD over the young is always legal, even within the 40+ class. No reverse-age claims.", "Discrimination"],
["Hazen Paper v. Biggins", "Age and pension vesting are 'analytically distinct.' Firing before vesting is not an ADEA violation (maybe a good-faith covenant one).", "Discrimination"],
["Griggs v. Duke Power (1971)", "Birth of disparate impact: diploma/IQ requirements with no job connection and discriminatory effect violate Title VII without intent.", "Discrimination"],
["Bostock v. Clayton County (2020)", "Title VII 'sex' includes sexual orientation and gender identity.", "Discrimination"],
["Meritor v. Vinson", "Hostile environment violates Title VII even with NO tangible job action or financial injury; 'voluntary' doesn't mean welcome.", "Discrimination"],
["Price Waterhouse v. Hopkins", "Sex stereotyping (act more feminine, charm school) = gender discrimination.", "Discrimination"],
["Ricci v. DeStefano", "Throwing out a validated test because of the racial results = race-conscious Title VII violation.", "Discrimination"],
["PDA rule", "Pregnancy = temporary disability. Treat the same: no forced hour cuts, same leave/benefits/insurance treatment.", "Discrimination"],
["EPA vs Title VII pay claims", "EPA: no EEOC exhaustion, no compensatory/punitive damages, 4 defenses (seniority, merit, incentive, any factor other than sex). Ledbetter 2009: clock restarts each paycheck.", "Discrimination"],
["Reverse discrimination", "Preference operating as a fixed number (30% target denying qualified majority applicants) = unequal treatment of majority members. Goals must stay flexible aspirations.", "Discrimination"],
["Affirmative action goal", "Correcting discriminatory effects of past/current practices. Never quotas, never the unqualified, temporary by design.", "Discrimination"],
["AA plan 3 requirements", "Reasonable self-analysis, reasonable rationale, reasonable action (placement goals with timetables, not quotas).", "Discrimination"],
["IRCA (1986) essentials", "4+ employees. Verify within 3 business days via Form I-9. Keep I-9 in a SEPARATE file 3 years after hire or 1 year after termination, whichever is longer. PERSONAL civil liability for individuals who skip verification.", "Compliance"],
["IRCA citizenship quirk", "Unlike Title VII, IRCA permits preferring a citizen over an EQUALLY qualified legal alien.", "Compliance"],
["E-Verify", "USCIS internet system confirming eligibility from I-9 data. Required for federal contractors >$100k/120+ days. No pre-screening applicants. TNC = employee gets 8 days to contest, no adverse action until final.", "Compliance"],
["WARN Act numbers", "100+ employees, 60 days written notice to employees + union + state AND local government. Plant closing = 50+ affected. Mass layoff = 50+ AND 33%, or 500+. 90-day aggregation. Remedy capped at 60 days back pay.", "Compliance"],
["WARN 3 exceptions", "Natural disaster, severe unforeseen loss of capital, faltering company (notice would kill the financing). Still give what notice you can.", "Compliance"],
["Negligent hiring vs retention vs referral", "Hiring = should have known BEFORE hire. Retention = danger apparent AFTER hire, kept anyway. Referral = reference omitting known danger.", "Compliance"],
["Reference defamation defenses", "Truth is the absolute defense but the EMPLOYER bears the burden of proving it. Qualified privilege dies on malice or reckless disregard.", "Compliance"],
["FLSA exempt test", "Duties, not titles: executive/administrative/professional duties + salary + high responsibility. Manager with direct reports and high pay = exempt. Hourly operators and janitors = nonexempt.", "Compliance"],
["FLSA mechanics", "Overtime 1.5x past 40/WEEK (never daily). Comp time: public employers only. Tipped: $2.13 cash if tips reach minimum. Opportunity wage $4.25 first 90 days under 20.", "Compliance"],
["OSHA two duties", "Compliance requirement (specific DOL standards; TRAINING = most violated) and general duty clause (free of recognized hazards, fills gaps with no standard).", "Regulation"],
["Workers' comp bargain", "No-fault wage replacement (~two-thirds pay) + medical, in exchange for giving up the right to sue the employer in tort. Exclusive remedy.", "Regulation"],
["Workers' comp coverage logic", "Commute no, employer property yes, horseplay instigator no, innocent bystander yes, intoxicated = abandoned the job, heart attack needs unusual exertion.", "Regulation"],
["Killed common-law defenses", "Contributory negligence, assumption of risk, fellow servant rule: the trio workers' comp and OSHA neutralized.", "Regulation"],
["FMLA eligibility", "50+ employees within 75 miles, 1,250 hours worked in prior 12 months. 12 weeks unpaid (26 for injured servicemember family). Self/spouse/child/PARENT, not in-laws, not bereavement.", "Regulation"],
["FMLA mechanics", "Birth/adoption = continuous leave. Health condition = can be intermittent. Health benefits continue. Restore to substantially same position (key-employee exception). Employer may require certification + second opinion it pays for.", "Regulation"],
["ERISA (1974)", "Preempts ALL state law (unique). Doesn't require benefits, governs offered ones. SPD within 90 days controls. Own contributions always vested. Fiduciary duty on fund managers.", "Regulation"],
["COBRA (1986)", "20+ employees. Continue group health at your own cost 18 months (36 some events) + 2% admin fee. Elect within 60 days. DOL + IRS jointly enforce.", "Regulation"],
["HIPAA (1996)", "Health info released only with signed authorization. Pre-existing = treated within 6 months before enrollment; pregnancy may NEVER be pre-existing.", "Regulation"],
["Whistleblower statutes by employer", "False Claims Act 1863 (government fraud, 15-25% reward), 1982 statute (defense contractors), WPA 1989 (federal employees), SOX 806 (public companies).", "Regulation"],
["USERRA", "ANY size employer. 5-year service window, escalator principle (position you WOULD have attained), first 180 days back = for-cause termination only.", "Regulation"],
["Constitutional privacy scope", "Applies to GOVERNMENT employers only. Private sector = statutes + the four privacy torts.", "Privacy"],
["Four privacy torts", "Intrusion upon seclusion (COLLECTING), public disclosure of private facts (SPREADING true info), false light (publishing UNTRUE statements), appropriation (commercial use of name/image).", "Privacy"],
["O'Connor v. Ortega", "Public-employer search must be (1) justified at its inception and (2) limited in scope. SCOTUS remanded without deciding merits.", "Privacy"],
["Public employee drug testing", "It's a 4th Amendment search: needs reasonable suspicion or a special-need job (railway, DEA). Blanket random testing of ordinary staff fails.", "Privacy"],
["Drug Free Workplace vs Omnibus Act", "DFWA 1988 ($100k+ contractors): policy required, testing NOT required. Omnibus 1991 (airlines, rail, trucking, transit): testing MANDATED, pre-hire + random.", "Privacy"],
["Medical testing timeline (ADA)", "Pre-employment: prohibited. Post-conditional-offer: allowed only if ALL applicants tested. Post-hire: job-related + business necessity only.", "Privacy"],
["Polygraph (EPPA 1988)", "Banned for hiring/retention. Exempt: government, defense/security contractors, security firms, pharma. Allowed with reasonable suspicion of theft + access. Refusal can't be sole firing basis. $10k/violation.", "Privacy"],
["ECPA + email", "Service-provider exemption: employer owns the system, may monitor. Reading stored email is not 'interception.' Off-limits: union organizing, attorney-client privilege. It's the SYSTEM ownership that matters, not work hours.", "Privacy"],
["FCRA sequence", "(1) Written consent on a SEPARATE document, (2) certify to the CRA, (3) pre-adverse action disclosure with report copy + rights, (4) adverse action notice. Covers medical records, tenant/check/employment history.", "Privacy"],
["Social media + NLRA", "Posts are public, but concerted activity about working conditions is protected (union or not). Personal gripes and malicious false posts are not (Butler Medical).", "Privacy"],
["Labor statute arc", "Sherman 1890 (used against unions) -> Clayton 1914 (weak fix) -> Norris-LaGuardia 1932 (killed yellow-dog contracts + injunctions) -> NLRA/Wagner 1935 (organize/bargain/strike, NLRB) -> Taft-Hartley 1947 (curbed unions) -> Landrum-Griffin 1959 (union internals).", "Labor Law"],
["NLRA Section 7", "Protects concerted activity: joint action for collective bargaining or mutual aid/protection, union or not.", "Labor Law"],
["NLRB three authorities", "Executive (enforcement), legislative (rule-making), judicial (ALJ adjudication). All three in one agency.", "Labor Law"],
["Taft-Hartley bans", "Closed shops, wildcat strikes, solidarity/political strikes, secondary boycotts, mass picketing, union donations to federal campaigns. Authorized right-to-work states + national emergency injunctions.", "Labor Law"],
["Landrum-Griffin (LMRDA 1959)", "Union member bill of rights, officer elections every 3 YEARS with voter-roll access, annual financial reports to DOL, no felon officers, banned hot cargo agreements.", "Labor Law"],
["Union election steps", "Community of interests -> NLRB defines bargaining unit -> 30% sign authorization cards -> NLRB investigates -> employer furnishes names/addresses -> election ~30 days -> majority vote -> certification as exclusive representative.", "Labor Law"],
["Employer duties during election", "Furnish the NLRB eligible workers' contact info, don't interfere. No duty to host organizers, give time off, or share payroll.", "Labor Law"],
["Bargaining subjects", "Mandatory (wages, hours, benefits, layoff procedures), permissive (may raise, other side may decline), illegal (proposing one = bad faith).", "Labor Law"],
["Impasse", "Deadlock, not final. NLRA requires notifying the FMCS. Then: union may strike, employer may lock out, or talks resume.", "Labor Law"],
["Good faith bargaining ULP", "Skipping a scheduled session = ULP. Hard bargaining (big demands, walking out after real talks) is not.", "Labor Law"],
["Economic vs ULP strike", "Economic (over wages/benefits): PERMANENT replacements allowed, strikers get recall list only. ULP strike (over employer illegality): TEMPORARY replacements only, strikers RETURN to jobs.", "Labor Law"],
["Closed vs union shop", "Closed (join BEFORE hire) = illegal under Taft-Hartley. Union shop (join after hire) = restricted, dead in 24 right-to-work states. Free riders may owe service fees.", "Labor Law"],
["Employer ULPs (5)", "Interfere with concerted activity, dominate/assist a union, discriminate for union activity, punish NLRB filings, refuse to bargain in good faith.", "Labor Law"],
["Mediation vs arbitration vs conciliation", "Mediation = facilitator, non-binding. Arbitration = third party imposes BINDING decision. Conciliation = intermediary helps parties settle.", "Labor Law"]
];
const MATCHES=[
["Law -> threshold", [["USERRA / NLRA", "Any employer size"], ["IRCA", "4+ employees"], ["Title VII / ADA", "15+ employees"], ["ADEA / COBRA", "20+ employees"], ["FMLA", "50+ employees within 75 miles"], ["WARN Act", "100+ employees"]]],
["Foundations term -> meaning", [["Supremacy Clause", "Federal law trumps state law"], ["Stare decisis", "Courts follow precedent"], ["Economic realities test", "Worker economically dependent = employee"], ["Integrated enterprise", "Two firms counted as one employer"], ["Dual purpose mission", "Personal + work errand, employer liable"], ["Going and coming rule", "Commute injuries not covered"]]],
["At-will exception -> example", [["Public policy", "Fired for refusing to commit perjury"], ["Implied contract", "Handbook promises progressive discipline"], ["Good faith covenant", "Fired right before pension vests"], ["Constructive discharge", "Conditions force a reasonable person to quit"], ["Retaliatory discharge", "Fired for filing workers' comp claim"]]],
["Case -> holding", [["Griggs v. Duke Power", "Disparate impact born, no intent needed"], ["McDonnell Douglas v. Green", "Burden-shifting prima facie framework"], ["Meritor v. Vinson", "Hostile environment needs no tangible action"], ["O'Connor v. Ortega", "Search justified at start, limited in scope"], ["General Dynamics v. Cline", "Favoring old over young always legal"], ["Bostock v. Clayton County", "Sex includes orientation and gender identity"]]],
["Discrimination concept -> definition", [["Disparate treatment", "Intentional, individual, motive-based"], ["Disparate impact", "Neutral policy, class harm, no intent"], ["Four-fifths rule", "Selection rate under 80% of majority"], ["BFOQ", "Discriminatory requirement necessary to the business"], ["Reverse discrimination", "Fixed preference denying qualified majority applicants"], ["Retaliation", "Adverse action for protected activity"]]],
["Compliance tort/law -> trigger", [["Negligent hiring", "Should have known before hire"], ["Negligent retention", "Danger apparent, kept anyway"], ["Negligent referral", "Reference omits known danger"], ["IRCA violation", "No I-9 within 3 business days"], ["WARN violation", "Under 60 days notice, no exception"], ["FLSA exempt status", "White-collar duties + salary, not title"]]],
["Privacy rule -> scope", [["Intrusion upon seclusion", "Collecting private info"], ["Public disclosure", "Spreading true private facts"], ["False light", "Publishing untrue statements"], ["Appropriation", "Commercial use of name or image"], ["ECPA provider exemption", "Employer owns the system, may monitor"], ["FCRA pre-adverse disclosure", "Report copy + rights before denial"]]],
["Labor term -> meaning", [["Taft-Hartley Act", "LMRA 1947, curbed union power"], ["Landrum-Griffin Act", "LMRDA 1959, union elections every 3 years"], ["Authorization cards", "30% triggers election petition"], ["Economic strike", "Permanent replacements allowed"], ["ULP strike", "Strikers return, temporary replacements only"], ["FMCS notification", "Required at bargaining impasse"]]]
];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";$("#fcdef").classList.add("hide");$("#fcpos").textContent="0 / 0";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

const NOTES=`
<div class="warn"><b>These are the real questions.</b> Built from the 48-item PGZC pre-assessment. Coaching bands: everything except the C232-overlap domain came back Unsatisfactory, so the money topics are compliance thresholds, privacy rules, and labor law. Clear the MCQ tab twice, then grind the drill at <a href="https://niggerfaggot.club/c233-drill" style="color:inherit">/c233-drill</a>.</div>
<h3>Threshold ladder (the #1 target)</h3>
<div class="mn">ANY size = <b>USERRA, NLRA</b>. <span class="k">4+</span> = IRCA. <span class="k">15+</span> = Title VII, ADA. <span class="k">20+</span> = ADEA, COBRA. <span class="k">50+</span> = FMLA (75-mile radius, 1,250 hrs). <span class="k">100+</span> = WARN (60 days notice). Numbers to pair: I-9 within <span class="k">3 business days</span>; OWBPA <span class="k">21 consider / 7 rescind</span>; COBRA <span class="k">18 months, elect in 60 days</span>; FMLA <span class="k">12 weeks</span>; WARN remedy capped at 60 days back pay.</div>
<h3>Foundations</h3>
<div class="mn">Supremacy Clause = federal beats state. Stare decisis = follow precedent. Employee tests: common law = <span class="k">control of method</span>; economic realities = <span class="k">dependence</span>; IRS 20-factor. Integrated enterprise (one employer) vs joint employer (both count the worker). Respondeat superior = liability within <span class="k">scope of employment</span>; frolic/detour kills it, dual purpose keeps it, commuting never covered. At-will exceptions: public policy (~44 states), implied contract (41, <span class="k">handbooks + consistent practice</span>), good faith covenant (13). Montana = only good-cause state.</div>
<h3>Discrimination (C232 overlap + deltas)</h3>
<div class="mn">Treatment = intent, individual; impact = neutral policy, class, <span class="k">four-fifths rule (80%)</span>. McDonnell Douglas: burden shifts to employer only <span class="k">after the prima facie case</span>. BFOQ never for race; church clergy and women's shelter = classic BFOQs. Religious hardship = <span class="k">de minimis</span> (forcing coworkers to swap shifts crosses it); ADA hardship = significant burden. ADA: reject if applicant can't perform an <span class="k">essential function</span>; the <span class="k">employee</span> suggests non-obvious accommodations. ADEA: 20+ employees, burden never shifts, mandatory retirement illegal. AA = correcting discrimination, never quotas; fixed 30% preference = reverse discrimination. Race harassment = <span class="k">unwelcome + severe or pervasive</span>.</div>
<h3>Compliance + benefits</h3>
<div class="mn">IRCA: I-9 in 3 days, <span class="k">personal civil liability</span> for the HR person who skips it; E-Verify runs on I-9 data. Negligent hiring (before) vs <span class="k">retention (after, kept anyway)</span> vs referral (reference omits danger). FLSA exempt = duties + salary, the high-paid manager, never the hourly operator. WARN exceptions: natural disaster, <span class="k">unforeseen loss of capital</span>, faltering company. OSHA = train on the specific hazard (chemicals); training is the most-violated reg. Workers' comp = give up the <span class="k">right to sue in tort</span> for two-thirds wages + medical. FMLA: parent counts, 2,000 hrs clears 1,250, 12 weeks.</div>
<h3>Privacy</h3>
<div class="mn">Constitution restrains <span class="k">government employers only</span>. O'Connor v. Ortega: search <span class="k">justified at its start + limited in scope</span>. Public-employee drug testing needs <span class="k">reasonable suspicion</span> (random quarterly testing fails). Company email = readable because the <span class="k">employer owns the system</span> (ECPA provider exemption). FCRA covers <span class="k">medical records</span>, tenant/check/employment history; consent on a separate doc, pre-adverse disclosure before denial. Four torts: intrusion (collect), disclosure (spread true), false light (spread untrue), appropriation (commercial use).</div>
<h3>Labor law</h3>
<div class="mn">Arc: Norris-LaGuardia 1932 (yellow-dog ban) &rarr; <b>NLRA/Wagner 1935</b> (organize/bargain/strike, NLRB with <span class="k">executive + rule-making + judicial</span> authority) &rarr; <b>Taft-Hartley 1947</b> = LMRA (closed shops illegal, right-to-work states) &rarr; <b>Landrum-Griffin 1959</b> = LMRDA (<span class="k">elections every 3 years, voter rolls</span>, DOL reports). Election: 30% cards &rarr; employer furnishes <span class="k">contact info of eligible voters</span> &rarr; majority wins. Impasse: notify <span class="k">FMCS</span>, then strike / lockout / resume talks. Skipping a scheduled bargaining session = <span class="k">ULP</span>; hard demands are not. Economic strike = permanent replacements; ULP strike = strikers return.</div>
`;
$("#notes").innerHTML=NOTES;

renderChips();buildFC();buildMC();buildMA();
</script></body></html>
