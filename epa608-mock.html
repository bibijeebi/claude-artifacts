<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPA 608 Mock Exam — Universal</title>
<meta property="og:title" content="EPA 608 Mock Exam — Universal">
<meta property="og:description" content="Timed 100-question EPA 608 Universal simulation: 25 per section, 18/25 to pass each, flagging, palette, full review.">
<meta property="og:image" content="https://niggerfaggot.club/epa608-og.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e0d;--card:#111614;--card2:#161d1a;--line:#23302b;--ink:#e8efe9;--mut:#8aa093;--lime:#d4ff3a;--good:#5ad17a;--bad:#ff6b6b;--warn:#ffb454}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-family:"Fraunces",serif;font-weight:700;font-size:25px;letter-spacing:-.4px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.btn{font:inherit;font-size:13.5px;font-weight:700;color:var(--bg);background:var(--lime);border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.ghost{color:var(--ink);background:var(--card2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.timer{font-family:"Fraunces",serif;font-weight:700;font-size:20px;color:var(--lime)}
.timer.warn{color:var(--warn)}.timer.crit{color:var(--bad)}
.meta{font-size:12px;color:var(--mut);margin-left:auto}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin:14px 0 4px}
.pcell{font:inherit;font-size:12px;font-weight:700;aspect-ratio:1;border-radius:8px;background:var(--card2);border:1.5px solid var(--line);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcell.ans{background:#11231a;border-color:var(--good);color:var(--good)}
.pcell.cur{outline:2px solid var(--lime);outline-offset:1px;color:var(--ink)}
.pcell.flag{border-color:var(--warn);color:var(--warn)}
.pcell.flag.ans{background:#2a2410}
.topic{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--lime);font-weight:700;margin:2px 0 9px}
.q{font-size:16.5px;line-height:1.5;margin:0 0 16px}
.opt{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.45;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin:9px 0;cursor:pointer;transition:.1s}
.opt:hover{border-color:#33453d}
.opt.sel{border-color:var(--lime);background:#1a2410}
.opt .ltr{flex:0 0 auto;width:23px;height:23px;border-radius:6px;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.opt.sel .ltr{background:var(--lime);color:var(--bg)}
.opt.correct{border-color:var(--good);background:#11231a}.opt.correct .ltr{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:#231414}.opt.wrong .ltr{background:var(--bad);color:var(--bg)}
.exp{margin-top:14px;padding:13px 15px;border-radius:10px;background:#0e1512;border:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--mut)}
.exp b{color:var(--ink)}
.nav{display:flex;gap:8px;margin-top:18px;align-items:center}
.nav .sp{margin-left:auto}
.flagbtn{font:inherit;font-size:12px;font-weight:600;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer}
.flagbtn.on{color:var(--warn);border-color:var(--warn)}
.big{font-family:"Fraunces",serif;font-weight:700;font-size:54px;line-height:1;margin:6px 0}
.big.pass{color:var(--good)}.big.fail{color:var(--bad)}
.verdict{font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:18px}
.verdict.pass{color:var(--good)}.verdict.fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--lime)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px;margin:10px 0}
.rev .rh{font-size:12px;color:var(--mut);margin-bottom:7px;display:flex;justify-content:space-between}
.rev .rh .ok{color:var(--good);font-weight:700}.rev .rh .no{color:var(--bad);font-weight:700}
.rev .rq{font-size:14.5px;line-height:1.45;margin-bottom:10px}
.ro{font-size:13px;padding:8px 11px;border-radius:8px;margin:5px 0;border:1px solid var(--line);color:var(--mut)}
.ro.c{border-color:var(--good);color:var(--ink);background:#11231a}
.ro.w{border-color:var(--bad);color:var(--ink);background:#231414}
.muted{color:var(--mut);font-size:12.5px;line-height:1.6}
.hide{display:none}
kbd{font:inherit;font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mut)}
</style></head>
<body><div class="wrap">
<h1>EPA 608 Mock</h1>

<script>
const $=s=>document.getElementById(s);
const QS=[{"q": "A new hire at a scrap yard will be removing refrigerant from junked AC units. Before doing this work, the law requires them to:", "o": ["Hold EPA Section 608 certification", "Hold a state HVAC contractor license", "Register with the DOT", "Nothing, disposal work is exempt"], "c": 0, "e": "Servicing, repairing, OR disposing of stationary refrigerant equipment requires 608 certification.", "t": "Core"}, {"q": "A technician certified in 2004 asks when their 608 certification must be renewed. The answer:", "o": ["Never, it's valid for life", "Every 5 years", "Every 10 years", "When the refrigerant they use is phased out"], "c": 0, "e": "608 certification never expires.", "t": "Core"}, {"q": "A tech wants to legally work on window units, rooftop packaged units, and centrifugal chillers. The single certification covering all of them is:", "o": ["Universal", "Type II", "Type III", "Core only"], "c": 0, "e": "Universal = Core + Types I, II, and III. Everything stationary.", "t": "Core"}, {"q": "On each section of the 608 exam, the minimum passing performance is:", "o": ["18 of 25 questions", "20 of 25 questions", "15 of 25 questions", "25 of 25 questions"], "c": 0, "e": "72% per section = 18/25. Sections score independently.", "t": "Core"}, {"q": "While recovering with certified equipment and low-loss fittings, a small puff of refrigerant escapes as a hose is disconnected. This is:", "o": ["A legal de minimis release", "A federal violation", "Legal only for HFCs", "Legal only indoors"], "c": 0, "e": "Trace losses during good-faith recovery with proper equipment are de minimis, not venting.", "t": "Core"}, {"q": "A tech says venting R-410A is fine since it contains no chlorine. This is:", "o": ["Wrong, knowingly venting HFCs and substitutes is also illegal", "Correct, only CFCs and HCFCs are protected", "Correct if the charge is under 5 lbs", "Correct outdoors"], "c": 0, "e": "The venting prohibition covers CFCs, HCFCs, HFCs, and substitutes.", "t": "Core"}, {"q": "Rank these by ozone depletion potential, highest first:", "o": ["CFC, HCFC, HFC", "HFC, HCFC, CFC", "HCFC, CFC, HFC", "All equal"], "c": 0, "e": "Chlorine content drives ODP: CFCs most, HCFCs some, HFCs none (ODP zero).", "t": "Core"}, {"q": "The specific atom released from a CFC in the stratosphere that destroys ozone is:", "o": ["Chlorine", "Fluorine", "Carbon", "Hydrogen"], "c": 0, "e": "UV frees the chlorine; one chlorine atom destroys ozone repeatedly.", "t": "Core"}, {"q": "Depleting stratospheric ozone matters because ozone up there:", "o": ["Absorbs ultraviolet radiation before it reaches the surface", "Traps heat like a blanket", "Produces oxygen for breathing", "Blocks acid rain"], "c": 0, "e": "Less ozone = more UV = skin cancer, cataracts, crop damage.", "t": "Core"}, {"q": "The HFC phasedown in the United States is driven by:", "o": ["The AIM Act", "The Montreal Protocol's original text", "Section 609", "OSHA"], "c": 0, "e": "AIM Act = HFC phasedown (climate). Montreal Protocol = ozone-depleting substances.", "t": "Core"}, {"q": "R-22 is classified as a(n):", "o": ["HCFC", "CFC", "HFC", "HFO"], "c": 0, "e": "R-22 = HCFC. R-12 = CFC. R-134a/R-410A = HFC.", "t": "Core"}, {"q": "A customer's R-22 system needs a recharge in 2026. The refrigerant must come from:", "o": ["Recovered or reclaimed stock, since production and import ended Jan 1, 2020", "New virgin R-22 from the factory", "Any R-410A cylinder", "It cannot legally be recharged"], "c": 0, "e": "R-22 service continues indefinitely on recovered/reclaimed supply only.", "t": "Core"}, {"q": "Since January 1, 2018, a supply house may sell refrigerant only to:", "o": ["Certified technicians or their employers", "Anyone with a business card", "Homeowners doing DIY work", "Anyone buying under 5 lbs"], "c": 0, "e": "The sales restriction covers HFCs too.", "t": "Core"}, {"q": "The EPA's SNAP program exists to:", "o": ["Identify acceptable substitute refrigerants", "Set cylinder colors", "License contractors", "Fund recovery equipment"], "c": 0, "e": "SNAP = Significant New Alternatives Policy, the approved-substitutes list.", "t": "Core"}, {"q": "A shop owner tells a tech to vent a burnt charge to save time. If caught, penalties can include:", "o": ["Fines in the tens of thousands of dollars per day per violation", "A written warning only", "Loss of the shop's business license only", "Nothing, employers are exempt"], "c": 0, "e": "Civil penalties run to roughly $59k+ per day per violation, and there are bounty provisions for reporting.", "t": "Core"}, {"q": "The '2L' in an A2L refrigerant classification means:", "o": ["Mildly flammable", "Highly toxic", "Non-flammable", "Two-component blend"], "c": 0, "e": "Number = flammability (1 none, 2L mild, 2, 3 high). Letter = toxicity.", "t": "Core"}, {"q": "R-290 used in a reach-in cooler is:", "o": ["Propane, an A3 highly flammable refrigerant", "A CFC", "Non-flammable", "A low-pressure refrigerant"], "c": 0, "e": "R-290 = propane, A3. Spark-proof tools, no ignition sources.", "t": "Core"}, {"q": "'Recovering' refrigerant means:", "o": ["Removing it and storing it in an external container without processing", "Cleaning it with filter-driers", "Restoring it to new purity", "Destroying it"], "c": 0, "e": "Recover = remove and store. Recycle cleans on-site. Reclaim restores to AHRI 700.", "t": "Core"}, {"q": "A contractor recovers R-410A from one customer and wants to sell it to a different customer. First it must be:", "o": ["Reclaimed to AHRI 700 purity by a certified reclaimer", "Recycled through a filter-drier once", "Weighed", "Nothing, resale is always allowed"], "c": 0, "e": "Change of ownership = reclaim. Recycled refrigerant stays with the same owner.", "t": "Core"}, {"q": "System-dependent (passive) recovery equipment is legal only on appliances containing:", "o": ["15 pounds of refrigerant or less", "50 pounds or less", "200 pounds or less", "5 pounds or less"], "c": 0, "e": "Over 15 lbs requires self-contained (active) recovery equipment.", "t": "Core"}, {"q": "Recovery equipment manufactured after November 15, 1993 must be:", "o": ["EPA-certified (lab tested to the applicable standard)", "Painted gray and yellow", "Rebuilt every 5 years", "Registered with the DOT"], "c": 0, "e": "Post-1993 recovery machines must be certified. That date shows up all over this exam.", "t": "Core"}, {"q": "Recovery cylinders are limited to 80% fill because:", "o": ["Liquid refrigerant expands with temperature and a hydraulically full cylinder can rupture", "Scales are inaccurate above 80%", "The last 20% is reserved for oil", "Vapor cannot be compressed"], "c": 0, "e": "Thermal expansion of liquid = burst tank. 80% by weight, period.", "t": "Core"}, {"q": "A refillable recovery cylinder (gray body, yellow top) must be hydrostatically retested:", "o": ["Every 5 years", "Every year", "Every 10 years", "Never"], "c": 0, "e": "5-year hydro on refillables. Disposable DOT-39s are never refilled at all.", "t": "Core"}, {"q": "Pressurizing a system with oxygen for leak testing:", "o": ["Can cause an explosion when oxygen meets compressor oil under pressure", "Is the standard method", "Is safe below 50 psig", "Works if mixed with nitrogen"], "c": 0, "e": "Oil + pressurized oxygen detonates. Dry nitrogen only.", "t": "Core"}, {"q": "Vapor measured at a temperature above its saturation temperature is:", "o": ["Superheated", "Subcooled", "Saturated", "Fractionated"], "c": 0, "e": "Superheat = vapor above saturation. Subcooling = liquid below saturation.", "t": "Core"}, {"q": "Which appliance qualifies as a 'small appliance' under 608?", "o": ["A factory-sealed dehumidifier holding 3 lbs of refrigerant", "A field-charged mini-split holding 4 lbs", "A supermarket rack", "Any appliance under 50 lbs"], "c": 0, "e": "Small appliance = factory-manufactured, hermetically sealed, 5 lbs or less.", "t": "Type I"}, {"q": "Which is NOT a small appliance?", "o": ["A central air conditioning system charged in the field", "A household refrigerator", "A window AC unit", "A water cooler"], "c": 0, "e": "Field-charged central systems fail the factory-sealed test regardless of charge size.", "t": "Type I"}, {"q": "Recovering from a refrigerator with its compressor RUNNING, self-contained equipment must capture:", "o": ["90% of the refrigerant", "80% of the refrigerant", "99% of the refrigerant", "50% of the refrigerant"], "c": 0, "e": "90 running / 80 dead / or 4 in Hg. The Type I trinity.", "t": "Type I"}, {"q": "The same refrigerator with a SEIZED compressor requires recovery of:", "o": ["80% of the refrigerant", "90% of the refrigerant", "95% of the refrigerant", "No recovery required"], "c": 0, "e": "Dead compressor = 80%, because refrigerant hides in the oil.", "t": "Type I"}, {"q": "Instead of the percentage standards, a small appliance may be evacuated to:", "o": ["4 inches Hg vacuum", "25 mm Hg absolute", "10 inches Hg vacuum", "0 psig"], "c": 0, "e": "4 in Hg is the alternative small-appliance standard.", "t": "Type I"}, {"q": "Why does a running compressor make small-appliance recovery more complete?", "o": ["Heat and circulation drive refrigerant out of the compressor oil", "It pressurizes the recovery cylinder", "It filters the refrigerant", "It doesn't, the standards are identical"], "c": 0, "e": "Refrigerant dissolves in cold oil. A running compressor warms and frees it, hence 90% vs 80%.", "t": "Type I"}, {"q": "Using a bare vacuum pump to 'recover' refrigerant from a fridge is:", "o": ["Illegal venting, the pump exhausts refrigerant to the room", "Acceptable for under 5 lbs", "Acceptable if done outdoors", "The preferred method"], "c": 0, "e": "A vacuum pump captures nothing. Recovery requires equipment that stores the refrigerant.", "t": "Type I"}, {"q": "During passive recovery, placing the recovery cylinder in ice water:", "o": ["Speeds recovery by lowering cylinder pressure so refrigerant migrates in", "Slows recovery", "Is prohibited", "Prevents the 80% fill limit from applying"], "c": 0, "e": "Cold cylinder = low pressure = bigger pressure difference pulling refrigerant across.", "t": "Type I"}, {"q": "For passive recovery from a small appliance with a dead compressor, you should:", "o": ["Heat and gently tap the compressor and access both high and low sides", "Access the low side only", "Replace the compressor first", "Freeze the compressor"], "c": 0, "e": "Heat and vibration free oil-bound refrigerant; both-side access speeds migration.", "t": "Type I"}, {"q": "A clamp-on piercing valve used to access a sealed system should be:", "o": ["Removed or replaced with a permanent leak-tight fitting after service", "Left installed for future service", "Welded shut", "Reused on the next appliance without leak-checking"], "c": 0, "e": "Solderless piercing valves leak over time. Never leave one as a permanent fitting.", "t": "Type I"}, {"q": "Low-loss fittings are required on recovery hoses to:", "o": ["Minimize refrigerant release when connecting and disconnecting", "Increase recovery speed", "Filter oil out of the refrigerant", "Measure pressure"], "c": 0, "e": "They seal the hose ends so hookup/breakdown loses only trace amounts.", "t": "Type I"}, {"q": "EPA leak-repair requirements for a leaking household refrigerator:", "o": ["Do not exist, small appliances have no repair mandate", "Require repair within 30 days", "Require repair within 24 hours", "Apply only to R-600a units"], "c": 0, "e": "Leak-repair rules start at 50 lbs of charge. Small appliances are exempt.", "t": "Type I"}, {"q": "Before a junked window unit is shredded at a scrap yard, refrigerant recovery is the responsibility of:", "o": ["The final person in the disposal chain, who must recover it or verify it was recovered", "Nobody once it leaves the home", "The original manufacturer", "The city"], "c": 0, "e": "The last handler before destruction owns the recovery obligation.", "t": "Type I"}, {"q": "R-600a (isobutane) is an EPA-approved refrigerant for:", "o": ["Household refrigerators and freezers", "Centrifugal chillers", "Automotive AC", "Supermarket racks"], "c": 0, "e": "Approved via SNAP for household refrigeration with small charges.", "t": "Type I"}, {"q": "The primary jobsite precaution when servicing an R-600a refrigerator is:", "o": ["Eliminating ignition sources and using spark-proof tools", "Wearing a respirator", "Working in a sealed room", "Chilling the appliance first"], "c": 0, "e": "A3 flammable. The hazard is ignition, not toxicity.", "t": "Type I"}, {"q": "Refrigerant recovered from a customer's fridge can be reused without reclamation:", "o": ["Only in equipment belonging to the same owner", "In any equipment", "Never", "Only after 30 days"], "c": 0, "e": "Same-owner reuse is fine. Ownership change triggers AHRI 700 reclamation.", "t": "Type I"}, {"q": "Using a disposable DOT-39 cylinder as a recovery tank is:", "o": ["Prohibited, they are never refilled", "Fine for small appliances", "Fine below 80% fill", "Required for flammables"], "c": 0, "e": "DOT-39s are single-fill. Recover the heel, puncture, recycle the steel.", "t": "Type I"}, {"q": "After recovering from a small appliance, system pressure slowly climbs back up. You should:", "o": ["Wait and continue recovering, refrigerant is still boiling out of the oil", "Consider the job complete", "Add nitrogen", "Vent the remainder"], "c": 0, "e": "Pressure rebound = trapped refrigerant releasing. Keep recovering until it holds.", "t": "Type I"}, {"q": "Self-contained recovery equipment differs from system-dependent equipment because it:", "o": ["Has its own pump or compressor to move refrigerant", "Uses the appliance's compressor", "Only works on operating appliances", "Cannot be certified"], "c": 0, "e": "Active = own pump, works regardless of appliance condition. Passive = rides the appliance.", "t": "Type I"}, {"q": "A recovered mixed/contaminated charge from a small appliance should be:", "o": ["Sent to a reclaimer or approved destruction facility in a dedicated cylinder", "Vented since it's worthless", "Mixed into the shop's virgin cylinder", "Poured into the oil drain"], "c": 0, "e": "Mixed refrigerants can't be recycled on-site; they ship out. Venting is still illegal.", "t": "Type I"}, {"q": "The small-appliance recovery percentages (90%/80%) apply when using recovery equipment built:", "o": ["After November 15, 1993", "Before 1990 only", "In the same year as the appliance", "The date doesn't matter"], "c": 0, "e": "Post-Nov-15-1993 equipment gets the modern standards. That date again.", "t": "Type I"}, {"q": "A tech vents 2 lbs of R-134a from a junked mini-fridge 'because it's such a small amount.' This is:", "o": ["A federal violation regardless of quantity", "Legal under the small-appliance exemption", "Legal for HFCs", "Legal at a licensed scrap yard"], "c": 0, "e": "There is no small-quantity venting exemption. De minimis covers recovery losses, not deliberate venting.", "t": "Type I"}, {"q": "Which of these IS a small appliance?", "o": ["A packaged terminal air conditioner (PTAC) with 4 lbs, factory sealed", "A field-erected walk-in cooler", "A 20-lb rooftop unit", "An automotive AC system"], "c": 0, "e": "Factory-sealed and 5 lbs or less qualifies. MVACs are Section 609 territory.", "t": "Type I"}, {"q": "The reason recovery is required even on a 6-oz dehumidifier charge is:", "o": ["The venting prohibition applies to all stationary appliances regardless of size", "Dehumidifiers use CFCs only", "Resale value", "It isn't required under 1 lb"], "c": 0, "e": "No charge-size floor on the venting rule.", "t": "Type I"}, {"q": "When recovering from a small appliance, you know recovery is complete when:", "o": ["The required vacuum/percentage is reached AND holds after equipment shutoff", "The cylinder feels heavy", "Exactly 10 minutes pass", "Frost forms on the hose"], "c": 0, "e": "Reach the standard, then verify no pressure rebound.", "t": "Type I"}, {"q": "Type II certification covers:", "o": ["High-pressure appliances such as split systems and supermarket racks", "Small appliances only", "Low-pressure centrifugal chillers", "Motor vehicle AC"], "c": 0, "e": "Type II = high-pressure (R-22, R-410A, R-134a class equipment).", "t": "Type II"}, {"q": "Post-1993 equipment, a 150-lb R-22 split system, required evacuation level:", "o": ["0 inches Hg (atmospheric)", "10 inches Hg", "15 inches Hg", "25 mm Hg absolute"], "c": 0, "e": "High-pressure under 200 lbs = 0. At 200+ it becomes 10 in Hg.", "t": "Type II"}, {"q": "Post-1993 equipment, a 700-lb R-410A supermarket rack, required evacuation level:", "o": ["10 inches Hg vacuum", "0 inches Hg", "15 inches Hg", "4 inches Hg"], "c": 0, "e": "High-pressure 200 lbs or more = 10 in Hg.", "t": "Type II"}, {"q": "Post-1993 equipment, a medium-pressure appliance holding 150 lbs is evacuated to:", "o": ["10 inches Hg vacuum", "0 inches Hg", "15 inches Hg", "25 mm Hg"], "c": 0, "e": "Medium-pressure under 200 = 10 in Hg.", "t": "Type II"}, {"q": "Post-1993 equipment, a medium-pressure appliance holding 400 lbs is evacuated to:", "o": ["15 inches Hg vacuum", "10 inches Hg", "0 inches Hg", "25 inches Hg"], "c": 0, "e": "Medium-pressure 200+ = 15 in Hg, the deepest level on the high/medium table.", "t": "Type II"}, {"q": "A very-high-pressure appliance (e.g., CO2, R-503) must be evacuated to:", "o": ["0 inches Hg (0 psig)", "10 inches Hg", "15 inches Hg", "25 mm Hg"], "c": 0, "e": "Very high pressure = 0. The refrigerant is too jumpy to pull deeper.", "t": "Type II"}, {"q": "A leaking system cannot hold the required vacuum during recovery. Before repair, evacuate it to:", "o": ["0 psig", "The full table value anyway", "25 mm Hg", "Skip evacuation entirely"], "c": 0, "e": "Pulling vacuum on a leaker sucks in air. Go to 0 psig, fix the leak, then finish.", "t": "Type II"}, {"q": "The fastest way to remove 400 lbs of refrigerant from a rack system:", "o": ["Recover liquid first, then finish with vapor", "Vapor only", "Vapor first, then liquid", "Recover through the oil drain"], "c": 0, "e": "Liquid moves pounds; vapor is slow. Always liquid first on big charges.", "t": "Type II"}, {"q": "Vapor refrigerant is charged into an operating system through the:", "o": ["Low side", "High side", "Oil port", "Condenser drain"], "c": 0, "e": "Vapor to the low side. Liquid to the high side. Reverse either and you risk slugging.", "t": "Type II"}, {"q": "Liquid refrigerant is charged into which side of the system?", "o": ["High side (liquid line)", "Low side", "Suction line while running", "Compressor crankcase"], "c": 0, "e": "Liquid goes in the high side; liquid into the suction line can slug the compressor.", "t": "Type II"}, {"q": "While brazing a repair on an opened high-pressure system, you should flow ______ through the tubing:", "o": ["Dry nitrogen", "Oxygen", "Compressed shop air", "Refrigerant vapor"], "c": 0, "e": "Nitrogen displaces oxygen and prevents oxide scale inside the tubes.", "t": "Type II"}, {"q": "An open-drive compressor that sat idle all winter most commonly leaks at the:", "o": ["Shaft seal", "Discharge line", "Sight glass", "Terminal plate"], "c": 0, "e": "The rotating shaft seal dries out when idle. Hermetics don't have one.", "t": "Type II"}, {"q": "Mandatory leak-repair rules kick in for appliances holding at least:", "o": ["50 lbs of refrigerant (15 lbs for high-GWP HFCs under the 2026 rules)", "5 lbs", "200 lbs", "Any amount"], "c": 0, "e": "50 lbs is the classic trigger; the HFC rules added a 15-lb tier for high-GWP refrigerants.", "t": "Type II"}, {"q": "Annual leak rate that triggers mandatory repair on an office building's comfort-cooling chiller:", "o": ["10%", "20%", "30%", "35%"], "c": 0, "e": "Comfort 10, commercial 20, industrial 30. Legacy exams said 15/35/35.", "t": "Type II"}, {"q": "Annual leak rate triggering repair on a grocery store's commercial refrigeration:", "o": ["20%", "10%", "30%", "15%"], "c": 0, "e": "Commercial refrigeration = 20% under current law.", "t": "Type II"}, {"q": "Annual leak rate triggering repair on an industrial process refrigeration system:", "o": ["30%", "10%", "20%", "50%"], "c": 0, "e": "Industrial process = 30%.", "t": "Type II"}, {"q": "Once an appliance exceeds its leak threshold, repair must generally be completed within:", "o": ["30 days", "24 hours", "90 days", "One year"], "c": 0, "e": "30 days, followed by verification testing.", "t": "Type II"}, {"q": "A 500-lb system took 100 lbs of refrigerant this year. Its annual leak rate is:", "o": ["20%", "5%", "100%", "50%"], "c": 0, "e": "Pounds added per year / full charge = 100/500 = 20%. Trips the commercial threshold exactly.", "t": "Type II"}, {"q": "Owners of appliances over 50 lbs must keep records of:", "o": ["Refrigerant added and service performed", "Employee names only", "Electricity usage", "Nothing"], "c": 0, "e": "Servicing records prove or disprove leak-rate compliance.", "t": "Type II"}, {"q": "After an appliance trips its leak threshold and gets repaired, current rules require:", "o": ["Periodic follow-up leak inspections", "Immediate replacement of the appliance", "Weekly EPA reporting forever", "Nothing further"], "c": 0, "e": "Annual inspections for comfort cooling, quarterly for large commercial/IPR.", "t": "Type II"}, {"q": "The target vacuum for dehydrating a system before charging is about:", "o": ["500 microns", "5,000 microns", "29 inches Hg on the gauge is sufficient proof", "50 microns"], "c": 0, "e": "Deep vacuum ~500 microns; a compound gauge can't resolve it, use a micron gauge.", "t": "Type II"}, {"q": "You pull 500 microns, stop the pump, and pressure climbs steadily to 2,000+ microns and keeps rising. This indicates:", "o": ["A leak (or refrigerant still boiling out of oil), not a dry tight system", "Perfect dehydration", "The pump is too large", "Normal behavior"], "c": 0, "e": "Rise-and-hold = moisture boiling off. Continuous rise = leak or trapped refrigerant.", "t": "Type II"}, {"q": "A system runs high head pressure and the condenser outlet is cooler than expected near the top. Likely cause:", "o": ["Non-condensables (air) trapped in the condenser", "Too much subcooling", "Undercharge", "Dirty evaporator"], "c": 0, "e": "Air collects at the condenser top and jacks head pressure.", "t": "Type II"}, {"q": "Before recovering into a reusable cylinder, you should:", "o": ["Check the appliance nameplate for refrigerant type and use a cylinder dedicated to it", "Mix refrigerants freely, the reclaimer sorts it out", "Fill whatever cylinder is emptiest to 100%", "Warm the cylinder with a torch"], "c": 0, "e": "Nameplate identifies the refrigerant; cross-contamination ruins the whole batch.", "t": "Type II"}, {"q": "A supermarket sells its old rack system, refrigerant included, to another store. The refrigerant:", "o": ["Transfers legally with the appliance; reclamation applies to refrigerant sold separately", "Must be vented first", "Must be destroyed", "Must be re-tested every 30 days"], "c": 0, "e": "Refrigerant inside equipment conveys with it. Reclaim rules bite when refrigerant itself changes hands.", "t": "Type II"}, {"q": "Type III covers low-pressure appliances, which typically use:", "o": ["R-11 and R-123", "R-22 and R-410A", "R-134a and R-404A", "R-290 and R-600a"], "c": 0, "e": "Centrifugal chillers on R-11 (CFC, gone) and R-123 (HCFC).", "t": "Type III"}, {"q": "A defining trait of a low-pressure chiller is that it:", "o": ["Operates below atmospheric pressure, in a vacuum", "Runs at 400+ psig", "Uses flammable refrigerants", "Has no compressor"], "c": 0, "e": "The refrigerant boils above room temp at atmospheric pressure, so the machine runs in a vacuum.", "t": "Type III"}, {"q": "Because the system runs in a vacuum, a leak in a low-pressure chiller causes:", "o": ["Air and moisture to be drawn INTO the system", "Refrigerant to spray out", "Immediate shutdown", "Oil loss"], "c": 0, "e": "Leaks run backward in the vacuum world. That's the whole Type III mindset.", "t": "Type III"}, {"q": "The purge unit on a low-pressure chiller removes:", "o": ["Air and non-condensables from the top of the condenser", "Moisture from the oil", "Acid from the refrigerant", "Refrigerant from the evaporator"], "c": 0, "e": "Air rises to the condenser top; the purge skims it off and returns entrained refrigerant.", "t": "Type III"}, {"q": "A chiller's purge unit runs almost continuously. This means:", "o": ["The system has an air leak that needs finding and fixing", "The chiller is working perfectly", "The charge is too high", "The water is too warm"], "c": 0, "e": "Constant purging = constant air ingress = leak. Excess purging also bleeds refrigerant.", "t": "Type III"}, {"q": "Excessive water collecting in the purge unit indicates:", "o": ["Leaking chiller tubes (water side into refrigerant side)", "Normal humidity", "Overcharge", "A bad oil heater"], "c": 0, "e": "Water in the purge = tube leak. Confirm with a hydrostatic tube test kit.", "t": "Type III"}, {"q": "The tool used to confirm a suspected chiller tube leak is a:", "o": ["Hydrostatic tube test kit", "Halide torch", "Megohmmeter", "Micron gauge"], "c": 0, "e": "Hydrostatic tube testing finds the leaking tube.", "t": "Type III"}, {"q": "Required evacuation for a low-pressure appliance with post-Nov-15-1993 equipment:", "o": ["25 mm Hg absolute", "25 inches Hg", "0 psig", "10 inches Hg"], "c": 0, "e": "25 MILLIMETERS absolute. The units are the trap.", "t": "Type III"}, {"q": "Required evacuation for a low-pressure appliance with PRE-1993 equipment:", "o": ["25 inches Hg vacuum", "25 mm Hg absolute", "0 psig", "4 inches Hg"], "c": 0, "e": "Old equipment gets the old standard: 25 INCHES. New equipment: 25 mm absolute, far deeper.", "t": "Type III"}, {"q": "25 mm Hg absolute compared to 25 inches Hg vacuum is:", "o": ["A much deeper vacuum (25 mm is roughly 1 inch Hg absolute)", "The same thing in different units", "A shallower vacuum", "A positive pressure"], "c": 0, "e": "25 mm ≈ 1 inch of mercury absolute, near-total evacuation. The most-missed Type III fact.", "t": "Type III"}, {"q": "Maximum pressure for leak-testing a low-pressure chiller:", "o": ["10 psig", "15 psig", "25 psig", "50 psig"], "c": 0, "e": "Exceed 10 psig and the rupture disc goes.", "t": "Type III"}, {"q": "Over-pressurizing a low-pressure chiller with nitrogen fails which component first?", "o": ["The rupture disc", "The evaporator tubes", "The compressor seals", "The purge tank"], "c": 0, "e": "The rupture disc on the evaporator relieves at about 15 psig, by design.", "t": "Type III"}, {"q": "Refrigerant vapor is charged into an evacuated chiller BEFORE liquid because:", "o": ["Liquid entering a deep vacuum boils violently and can freeze water in the tubes", "Vapor is cheaper", "Liquid won't flow through the valve", "Vapor charges faster"], "c": 0, "e": "Boiling liquid drops tube temps below 32 F, freezes the water side, cracks tubes.", "t": "Type III"}, {"q": "Charge vapor into the evacuated chiller until:", "o": ["System pressure corresponds to a saturation temperature of about 36 F", "The rupture disc lifts", "15 minutes pass", "The purge unit starts"], "c": 0, "e": "Above-freezing saturation temperature (~36 F), then switch to liquid.", "t": "Type III"}, {"q": "A centrifugal chiller is charged through the:", "o": ["Evaporator charging valve", "Condenser vent", "High-side service valve", "Purge connection"], "c": 0, "e": "Evaporator charging valve, the standard charge point.", "t": "Type III"}, {"q": "To prevent freezing the water side during chiller evacuation:", "o": ["Circulate water through the chiller tubes", "Close all water valves", "Evacuate faster", "Add glycol to the refrigerant"], "c": 0, "e": "Moving water resists freezing and brings heat. Alternative on a wet system: raise pressure with nitrogen.", "t": "Type III"}, {"q": "During evacuation of a system holding lots of moisture, freezing can be prevented by raising pressure with:", "o": ["Nitrogen", "Oxygen", "Compressed air", "More refrigerant liquid"], "c": 0, "e": "Nitrogen breaks the vacuum enough to keep water liquid. Never oxygen or air.", "t": "Type III"}, {"q": "Before removing oil from a low-pressure system, heat it to about 130 F because:", "o": ["Hot oil holds less dissolved refrigerant, so less refrigerant leaves with the oil", "Cold oil damages the pump", "It sanitizes the oil", "It resets the low-oil switch"], "c": 0, "e": "Refrigerant boils out of warm oil and gets recovered instead of lost.", "t": "Type III"}, {"q": "Correct recovery order on a chiller:", "o": ["Liquid first, then remaining vapor", "Vapor first, then liquid", "Oil first", "Simultaneous from both"], "c": 0, "e": "Same as Type II: liquid moves the bulk, vapor finishes the job.", "t": "Type III"}, {"q": "After all liquid R-11 is removed from a large (350-ton) chiller at 0 psig, roughly how much refrigerant remains as vapor?", "o": ["About 100 lbs", "Almost none", "About 5 lbs", "About 1,000 lbs"], "c": 0, "e": "EPA's own figure: ~100 lbs of vapor remains, which is why vapor recovery to 25 mm matters.", "t": "Type III"}, {"q": "ASHRAE 15 requires equipment rooms containing R-123 chillers to have:", "o": ["A refrigerant-specific detector for R-123 plus an oxygen deprivation sensor", "No special sensors", "Only a smoke detector", "A CO detector only"], "c": 0, "e": "Oxygen deprivation sensors for ALL refrigerants; R-123 also needs its own specific sensor.", "t": "Type III"}, {"q": "R-123 compared to the R-11 it replaced is:", "o": ["Lower ozone depletion but HIGHER toxicity (B1)", "Safer in every way", "More flammable", "Identical chemically"], "c": 0, "e": "The classic gotcha: the ozone-friendlier replacement is the more toxic one.", "t": "Type III"}, {"q": "Under EPA rules, a 'major repair' on a chiller that triggers full evacuation includes replacing:", "o": ["The compressor, condenser, or evaporator", "A gasket", "The oil filter", "A sight glass"], "c": 0, "e": "Major components = major repair = full evacuation levels apply.", "t": "Type III"}, {"q": "Pressurizing a low-pressure system for a NON-major repair is properly done with:", "o": ["Controlled hot water or the built-in heating/pressurization system, never exceeding 10 psig", "A nitrogen blast to 50 psig", "Oxygen", "Steam directly into the refrigerant side"], "c": 0, "e": "Warm the refrigerant to raise pressure gently; the 10 psig ceiling always applies.", "t": "Type III"}, {"q": "After recovering a chiller to 25 mm Hg, pressure slowly climbs when the machine is closed off. You should:", "o": ["Wait and recover again, refrigerant is still off-gassing from oil or trapped liquid", "Consider it done", "Vent the difference", "Open the system immediately"], "c": 0, "e": "Pressure rebound = more refrigerant coming out of solution. Recover until it holds.", "t": "Type III"}];
const PASS=0.72, LIMIT=120*60, LSK="epa608mock_v1";
const LT="ABCDEFGH";
let S=load();

function load(){try{const r=JSON.parse(localStorage.getItem(LSK));if(r&&r.qn===QS.length)return r;}catch(e){}return null;}
function save(){if(S)localStorage.setItem(LSK,JSON.stringify(S));}
function fresh(){S={qn:QS.length,ans:{},flag:{},cur:0,start:Date.now(),left:LIMIT,done:false,reviewIdx:null};save();}
function isMulti(i){return Array.isArray(QS[i].c);}
function answered(i){const a=S.ans[i];return a!==undefined&&a!==null&&(!isMulti(i)||(Array.isArray(a)&&a.length));}
function correct(i){const a=S.ans[i],c=QS[i].c;if(isMulti(i)){const aa=(a||[]).slice().sort().join(",");return aa===c.slice().sort().join(",");}return a===c;}

let tick=null;
function startTimer(){clearInterval(tick);tick=setInterval(()=>{const el=Math.floor((Date.now()-S.start)/1000);S.left=Math.max(0,LIMIT-el);const t=$("timer");if(t){t.textContent=fmt(S.left);t.className="timer"+(S.left<300?" crit":S.left<600?" warn":"");}if(S.left<=0){clearInterval(tick);submit();}save();},1000);}
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}

function render(){
  if(!S){intro();return;}
  if(S.done){results();return;}
  exam();
}

function intro(){
  $("app").innerHTML=`<div class="card">
   <div style="font-family:Fraunces,serif;font-weight:600;font-size:19px;margin-bottom:10px">Ready?</div>
   <div class="muted" style="margin-bottom:16px">${QS.length} multiple-choice questions drawn across all six competencies, including the data-security &amp; BI material the pre-assessment skipped. Timer is ${LIMIT/60} minutes. You can flag questions and jump around with the palette. Auto-submits at 0:00.<br><br>Keys: <kbd>1-4</kbd> answer &middot; <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> move &middot; <kbd>F</kbd> flag</div>
   <button class="btn" id="start">Start exam</button></div>`;
  $("start").onclick=()=>{fresh();startTimer();render();};
}

function exam(){
  const i=S.cur,q=QS[i],a=S.ans[i],multi=isMulti(i);
  const pal=QS.map((_,j)=>`<button class="pcell ${answered(j)?'ans':''} ${S.flag[j]?'flag':''} ${j===i?'cur':''}" onclick="go(${j})">${j+1}</button>`).join("");
  const opts=q.o.map((o,k)=>{
    let sel = multi ? (Array.isArray(a)&&a.includes(k)) : a===k;
    return `<div class="opt ${sel?'sel':''}" onclick="pick(${k})"><span class="ltr">${LT[k]}</span><span>${o}</span></div>`;
  }).join("");
  const nA=QS.filter((_,j)=>answered(j)).length;
  $("app").innerHTML=`
   <div class="topbar"><span class="timer" id="timer">${fmt(S.left)}</span>
     <button class="btn ghost" style="padding:9px 16px" onclick="confirmSubmit()">Submit</button>
     <span class="meta">${nA}/${QS.length} answered</span></div>
   <div class="palette">${pal}</div>
   <div class="card" style="margin-top:10px">
     <div class="topic">${q.t} &middot; Q${i+1}${multi?' &middot; select all':''}</div>
     <div class="q">${q.q}</div>${opts}
     <div class="nav">
       <button class="btn ghost" onclick="go(${i-1})" ${i===0?'disabled':''}>&larr; Prev</button>
       <button class="flagbtn ${S.flag[i]?'on':''}" onclick="flag()">${S.flag[i]?'&#9873; Flagged':'&#9873; Flag'}</button>
       <span class="sp"></span>
       <button class="btn" onclick="go(${i+1})" ${i===QS.length-1?'disabled':''}>Next &rarr;</button>
     </div></div>`;
}

window.go=j=>{if(j<0||j>=QS.length)return;S.cur=j;save();exam();};
window.pick=k=>{const i=S.cur;if(isMulti(i)){let a=Array.isArray(S.ans[i])?S.ans[i].slice():[];const x=a.indexOf(k);x>=0?a.splice(x,1):a.push(k);S.ans[i]=a;}else{S.ans[i]=k;}save();exam();};
window.flag=()=>{const i=S.cur;S.flag[i]=!S.flag[i];save();exam();};
window.confirmSubmit=()=>{const n=QS.filter((_,j)=>!answered(j)).length;if(n>0&&!confirm(n+" question(s) unanswered. Submit anyway?"))return;submit();};
function submit(){clearInterval(tick);S.done=true;S.left=Math.max(0,S.left);save();results();}

function results(){
  const tot=QS.length;let right=0;const byT={};
  QS.forEach((q,i)=>{const ok=correct(i);if(ok)right++;byT[q.t]=byT[q.t]||{c:0,n:0};byT[q.t].n++;if(ok)byT[q.t].c++;});
  const pct=right/tot, pass=Object.values(byT).every(o=>o.c>=Math.ceil(o.n*0.72));
  const rows=Object.keys(byT).sort((a,b)=>byT[b].n-byT[a].n).map(t=>{const o=byT[t],p=Math.round(o.c/o.n*100);return `<tr><td>${t}</td><td class="n">${o.c}/${o.n}</td><td><div class="bar"><i style="width:${p}%;background:${p>=PASS*100?'var(--good)':p>=50?'var(--lime)':'var(--bad)'}"></i></div></td><td class="n">${p}%</td></tr>`;}).join("");
  const used=LIMIT-S.left;
  const rev=QS.map((q,i)=>{const a=S.ans[i],ok=correct(i),multi=isMulti(i);
    const opts=q.o.map((o,k)=>{const isC=multi?q.c.includes(k):k===q.c;const isP=multi?(Array.isArray(a)&&a.includes(k)):a===k;let cl=isC?'c':(isP?'w':'');return `<div class="ro ${cl}">${LT[k]}. ${o}${isC?' &check;':''}${isP&&!isC?' &times; (your pick)':''}</div>`;}).join("");
    return `<div class="rev"><div class="rh"><span>Q${i+1} &middot; ${q.t}</span><span class="${ok?'ok':'no'}">${ok?'CORRECT':'WRONG'}</span></div><div class="rq">${q.q}</div>${opts}<div class="exp"><b>Why:</b> ${q.e}</div></div>`;}).join("");
  $("app").innerHTML=`
   <div class="card" style="text-align:center">
     <div class="big ${pass?'pass':'fail'}">${Math.round(pct*100)}%</div>
     <div class="verdict ${pass?'pass':'fail'}">${pass?'UNIVERSAL PASS':'SECTION BELOW 18/25'} &middot; ${right}/${tot} correct &middot; need 18/25 per section</div>
     <div class="muted">Time used ${fmt(used)} of ${fmt(LIMIT)} &middot; cut line ${Math.round(PASS*100)}%</div>
   </div>
   <div class="card" style="margin-top:12px"><div class="topic">By competency</div>
     <table><thead><tr><th>Competency</th><th class="n">Score</th><th></th><th class="n">%</th></tr></thead><tbody>${rows}</tbody></table>
   </div>
   <div class="row" style="margin:16px 0 8px"><button class="btn ghost" onclick="toggleRev()" id="rvb">Show review</button><button class="btn" onclick="again()">New attempt</button></div>
   <div id="rev" class="hide">${rev}</div>`;
}
window.toggleRev=()=>{const r=$("rev"),b=$("rvb");r.classList.toggle("hide");b.textContent=r.classList.contains("hide")?"Show review":"Hide review";};
window.again=()=>{if(confirm("Start a new attempt? Current results are cleared."))(fresh(),startTimer(),render());};

document.addEventListener("keydown",e=>{
  if(!S||S.done)return;const i=S.cur;
  if(e.key>="1"&&e.key<="8"){const k=+e.key-1;if(k<QS[i].o.length)pick(k);}
  else if(e.key==="ArrowLeft")go(i-1);
  else if(e.key==="ArrowRight")go(i+1);
  else if(e.key.toLowerCase()==="f")flag();
});

if(S&&!S.done){const el=Math.floor((Date.now()-S.start)/1000);S.left=Math.max(0,LIMIT-el);if(S.left<=0){S.done=true;save();}else startTimer();}
render();
</script></body></html>
