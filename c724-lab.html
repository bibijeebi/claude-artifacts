<script>
const SECTIONS=[{"key": "s1", "name": "1 · Information Systems Foundations", "cards": [{"f": "Information system", "b": "A set of people, processes, and technology (hardware, software, data) that collects, stores, and processes data to support an organization."}, {"f": "Data vs information", "b": "Data is raw, unprocessed facts. Information is data that's been processed into something meaningful."}, {"f": "Knowledge", "b": "Information combined with experience and judgment so it can be applied to decisions."}, {"f": "Transaction Processing System (TPS)", "b": "Operational-level system that records day-to-day transactions like sales, payments, and payroll."}, {"f": "Management Information System (MIS)", "b": "Produces summary reports for middle managers to support routine, structured decisions."}, {"f": "Decision Support System (DSS)", "b": "Analytical system with models and what-if analysis for semi-structured decisions."}, {"f": "Executive Support System (ESS)", "b": "Strategic-level system giving executives dashboards and external data for big-picture decisions."}, {"f": "The IS pyramid", "b": "Operational TPS at the bottom, then MIS, then DSS, then ESS at the strategic top. The higher the level, the less structured the decision."}, {"f": "Customer Relationship Management (CRM)", "b": "System that manages a company's interactions and data for current and potential customers."}, {"f": "Supply Chain Management (SCM)", "b": "System that manages the flow of goods and information from suppliers to customers."}, {"f": "Knowledge Management System (KMS)", "b": "System that captures, stores, and shares an organization's knowledge."}, {"f": "Enterprise Resource Planning (ERP)", "b": "Integrates core business processes (finance, HR, operations) into one shared system, giving real-time enterprise-wide access."}, {"f": "Business process", "b": "A set of related activities that work together to produce a specific business result."}, {"f": "Competitive advantage via IS", "b": "Using information systems to do something rivals can't easily match, through cost, differentiation, or better decisions."}], "notes": "<b>The most-tested idea is the IS pyramid by level:</b> TPS (operational, records transactions) → MIS (middle managers, summary reports, structured) → DSS (analysts, what-if, semi-structured) → ESS (executives, dashboards, strategic). Match the user and the decision type to the system.\n<b>Data → Information → Knowledge:</b> raw facts, then processed/meaningful, then applied with experience.\n<b>Enterprise systems:</b> ERP integrates everything; CRM is customers; SCM is the supply chain; KMS is knowledge.\n<b>Scenario tells:</b> \"records daily sales\" = TPS. \"weekly summary report\" = MIS. \"what-if analysis\" = DSS. \"executive dashboard / strategic\" = ESS.", "mcqs": [{"q": "A cashier records daily sales, processes payments, and issues receipts. Which system supports this?", "o": ["Decision support system (DSS)", "Transaction processing system (TPS)", "Executive support system (ESS)", "Knowledge management system (KMS)"], "a": 1, "e": "Recording routine day-to-day transactions is the job of a TPS."}, {"q": "An executive needs a dashboard of company-wide and external data to make strategic decisions. Which system fits?", "o": ["TPS", "MIS", "Executive support system (ESS)", "CRM"], "a": 2, "e": "Strategic, executive-level dashboards are an ESS."}, {"q": "A middle manager needs weekly summary reports built from structured data for routine decisions. Which system?", "o": ["Management information system (MIS)", "DSS", "ESS", "TPS"], "a": 0, "e": "Summary reports for structured, routine decisions are an MIS."}, {"q": "An analyst runs what-if models on semi-structured problems. Which system supports this best?", "o": ["TPS", "Decision support system (DSS)", "MIS", "ERP"], "a": 1, "e": "What-if, semi-structured analysis is a DSS."}, {"q": "Which system manages a company's interactions and data with its customers?", "o": ["SCM", "ERP", "Customer relationship management (CRM)", "KMS"], "a": 2, "e": "CRM manages customer interactions and data."}, {"q": "Raw, unprocessed facts with no context are best described as:", "o": ["Information", "Knowledge", "Data", "Wisdom"], "a": 2, "e": "Raw, unprocessed facts are data; processing makes them information."}, {"q": "Which system integrates core business processes into one shared, enterprise-wide system?", "o": ["TPS", "Enterprise resource planning (ERP)", "DSS", "CRM"], "a": 1, "e": "ERP integrates core processes enterprise-wide."}]}, {"key": "s2", "name": "2 · Computer Hardware and Software", "cards": [{"f": "Hardware vs software", "b": "Hardware is the physical equipment. Software is the programs and instructions that run on it."}, {"f": "System software", "b": "Software that runs and manages the computer itself, like the operating system and utilities."}, {"f": "Application software", "b": "Programs that let users do specific tasks, like word processing or accounting."}, {"f": "Operating system", "b": "System software that manages the computer's hardware and software resources."}, {"f": "Proprietary software", "b": "Software owned by a vendor with closed source code, used under a license."}, {"f": "Open-source software", "b": "Software whose source code is available to view, modify, and distribute, so skilled users can change it faster."}, {"f": "Cloud computing", "b": "On-demand computing resources delivered over the internet, where you pay only for what you use."}, {"f": "IaaS / PaaS / SaaS", "b": "Cloud models: Infrastructure, Platform, and Software as a service, with the provider managing more as you move up."}, {"f": "CPU", "b": "The processor that carries out instructions; the brain of the computer."}, {"f": "RAM vs storage", "b": "RAM is fast, temporary (volatile) working memory. Storage (drive) holds data permanently."}, {"f": "Input vs output devices", "b": "Input sends data in (keyboard, mouse). Output sends data out (monitor, printer)."}, {"f": "Why cloud is popular", "b": "It's cost-effective and scalable; the company only pays for the infrastructure it actually uses."}], "notes": "<b>System vs application software:</b> system software runs the machine (the OS); application software does user tasks (Word, a CRM app).\n<b>Open-source vs proprietary:</b> open-source exposes the source code so it can be modified and shared; proprietary keeps it closed and licensed. The course's tell: \"programmers can modify the source code\" = open-source.\n<b>Cloud:</b> on-demand, pay-for-use, scalable. Models stack IaaS → PaaS → SaaS (you manage less as you go up; SaaS = ready-to-use apps).\n<b>Memory:</b> RAM is temporary/volatile; storage is permanent.", "mcqs": [{"q": "A company pays only for the computing resources it uses and can scale up or down on demand. This describes:", "o": ["On-premise servers", "Cloud computing", "Open-source software", "An operating system"], "a": 1, "e": "Pay-for-use, on-demand, scalable computing is cloud computing."}, {"q": "Sparkit's programmers can directly modify the program's source code. This software is:", "o": ["Proprietary", "Open-source", "Firmware", "Cloud-based"], "a": 1, "e": "Source code that can be modified is open-source software."}, {"q": "Which software manages the computer's hardware and other software resources?", "o": ["Application software", "Operating system", "A spreadsheet", "A web browser"], "a": 1, "e": "The operating system (system software) manages hardware and resources."}, {"q": "A cloud provider delivers complete, ready-to-use applications over the web. This model is:", "o": ["IaaS", "PaaS", "SaaS", "On-premise"], "a": 2, "e": "Ready-to-use applications over the web is SaaS."}, {"q": "Which type of memory is fast but temporary and loses its contents when power is off?", "o": ["Hard drive", "RAM", "SSD storage", "ROM"], "a": 1, "e": "RAM is volatile working memory; it clears when power is lost."}, {"q": "A payroll program an employee uses to do a task is an example of:", "o": ["System software", "Application software", "An operating system", "Firmware"], "a": 1, "e": "Programs for user tasks are application software."}]}, {"key": "s3", "name": "3 · Data Resource Management", "cards": [{"f": "Database", "b": "A structured collection of data that allows efficient storage, retrieval, and management of information."}, {"f": "Database management system (DBMS)", "b": "Software used to create, manage, and control access to a database."}, {"f": "Column / field", "b": "Defines the data type for a specific attribute, such as text, number, or date."}, {"f": "Row / record / tuple", "b": "An individual data entry in a table."}, {"f": "Primary key", "b": "A column or combination of columns that uniquely identifies each row in a table."}, {"f": "Foreign key", "b": "A column that links to the primary key of another table to relate the two."}, {"f": "Relational database", "b": "Stores data in related tables connected by keys."}, {"f": "Data warehouse", "b": "A central repository of integrated, historical data used for analysis and reporting."}, {"f": "Data mining", "b": "Analyzing large datasets to find patterns and relationships."}, {"f": "Big data", "b": "Extremely large datasets defined by high volume, velocity, and variety."}, {"f": "Entity vs attribute", "b": "An entity is a thing data is stored about (a customer); an attribute is a property of it (the customer's name)."}, {"f": "Data governance", "b": "The policies and processes that keep data accurate, secure, and usable."}], "notes": "<b>Table anatomy (memorize the synonyms):</b> a <i>column</i> is a field (defines an attribute's data type); a <i>row</i> is a record or tuple (one entry). The course uses these terms interchangeably, and the OA tests the synonyms.\n<b>Keys:</b> a primary key uniquely identifies each row; a foreign key links to another table's primary key. That's how relational tables connect.\n<b>Storage vs analysis:</b> a database runs daily operations; a data warehouse stores historical data for analysis; data mining finds the patterns in it; big data is the high volume/velocity/variety case.", "mcqs": [{"q": "Which element uniquely identifies each row in a database table?", "o": ["Foreign key", "Primary key", "Field", "Index"], "a": 1, "e": "The primary key uniquely identifies each row."}, {"q": "A single entry (one line) in a database table is also called a:", "o": ["Field", "Column", "Record or tuple", "Schema"], "a": 2, "e": "A row is also called a record or a tuple."}, {"q": "A column in a table is also known as a field, and it defines:", "o": ["The number of rows", "The data type for an attribute", "The primary key only", "The table name"], "a": 1, "e": "A field/column defines the data type for a specific attribute."}, {"q": "A central repository of integrated, historical data used mainly for analysis and reporting is a:", "o": ["Database", "Data warehouse", "DBMS", "Spreadsheet"], "a": 1, "e": "That describes a data warehouse, optimized for analysis."}, {"q": "What software is used to create and manage a database?", "o": ["Operating system", "Database management system (DBMS)", "Web server", "Compiler"], "a": 1, "e": "A DBMS creates, manages, and controls access to a database."}, {"q": "A column that links to the primary key of another table is a:", "o": ["Composite key", "Foreign key", "Candidate key", "Surrogate key"], "a": 1, "e": "A foreign key references another table's primary key."}]}, {"key": "s4", "name": "4 · Networking Foundations", "cards": [{"f": "Computer network", "b": "A system that lets users receive, share, and transmit data between devices."}, {"f": "The internet", "b": "The largest computer network in the world."}, {"f": "LAN vs WAN", "b": "A LAN covers a small area like one building; a WAN spans a wide geographic area."}, {"f": "Network architecture", "b": "The design and structure of the hardware, software, wireless networks, and protocols that let devices communicate."}, {"f": "Client-server model", "b": "A central server provides resources and services to client devices that request them."}, {"f": "Peer-to-peer (P2P) model", "b": "Individual devices are linked and share equally distributed responsibilities and permissions, with no central server."}, {"f": "Protocol", "b": "A set of rules that governs how data is transmitted across a network (for example TCP/IP)."}, {"f": "Bandwidth", "b": "The maximum rate at which data can be transferred across a network."}, {"f": "Latency", "b": "The delay before a data transfer begins or completes."}, {"f": "Network topology", "b": "The physical or logical layout of a network (bus, star, ring, or mesh)."}, {"f": "Router vs switch", "b": "A router connects and forwards data between different networks; a switch connects devices within one network."}, {"f": "IP address", "b": "A unique numeric address that identifies a device on a network."}], "notes": "<b>Client-server vs P2P (the key contrast):</b> client-server has a central server handing out resources to clients; P2P links devices as equals with equally distributed responsibilities and permissions, no central authority.\n<b>Bandwidth vs latency:</b> bandwidth is how much data can move (capacity/rate); latency is the delay. They're different, don't mix them up.\n<b>Scope:</b> LAN = one building; WAN = wide geographic area; the internet is the largest network.\n<b>Devices:</b> a switch connects devices inside one network; a router connects different networks.", "mcqs": [{"q": "In which network model are devices linked with equally distributed responsibilities and permissions?", "o": ["Client-server", "Peer-to-peer (P2P)", "Mainframe", "Cloud"], "a": 1, "e": "P2P links devices as equals with no central server."}, {"q": "A central computer provides resources and services to devices that request them. This is the:", "o": ["Peer-to-peer model", "Client-server model", "Mesh model", "Hybrid model"], "a": 1, "e": "A central server serving clients is the client-server model."}, {"q": "The largest computer network in the world is the:", "o": ["LAN", "WAN", "Internet", "Intranet"], "a": 2, "e": "The internet is the largest network worldwide."}, {"q": "The maximum rate at which data can be transferred across a network is called:", "o": ["Latency", "Bandwidth", "Throughput delay", "Jitter"], "a": 1, "e": "Bandwidth is the maximum data transfer rate; latency is delay."}, {"q": "A network that covers a single building or office is a:", "o": ["WAN", "LAN", "MAN", "PAN"], "a": 1, "e": "A LAN covers a small area such as one building."}, {"q": "A set of rules that governs how data is transmitted across a network is a:", "o": ["Topology", "Protocol", "Bandwidth", "Node"], "a": 1, "e": "Rules governing transmission are a protocol (e.g., TCP/IP)."}]}, {"key": "s5", "name": "5 · Systems Development and Decision-Making", "cards": [{"f": "Systems Development Life Cycle (SDLC)", "b": "A structured, phase-by-phase approach to building a system; also called the waterfall method."}, {"f": "SDLC phases", "b": "Planning, systems analysis, design, development and testing, implementation, and maintenance."}, {"f": "Systems analysis vs design", "b": "Analysis defines what the system must do (requirements); design defines how it will do it."}, {"f": "Prototyping", "b": "Building a quick working model of the system and refining it through user feedback."}, {"f": "Application software package", "b": "Buying prewritten, commercial software instead of building from scratch."}, {"f": "End-user development", "b": "Users build their own applications using tools, with little IT involvement."}, {"f": "Outsourcing", "b": "Hiring an external vendor to develop or run an information system."}, {"f": "Conversion", "b": "The transition from the old system to the new system."}, {"f": "Direct conversion", "b": "Switching off the old system and turning on the new one all at once (cutover)."}, {"f": "Parallel conversion", "b": "Running the old and new systems at the same time until the new one is trusted."}, {"f": "Pilot conversion", "b": "Rolling the new system out to one location or group first."}, {"f": "Phased conversion", "b": "Introducing the new system in stages over time."}, {"f": "Agile development", "b": "Building software iteratively in small increments with frequent feedback."}], "notes": "<b>SDLC = the waterfall method.</b> Phases in order: planning → analysis → design → development/testing → implementation → maintenance.\n<b>Development methodologies (know them as options):</b> SDLC/waterfall, prototyping, application software packages, end-user development, and outsourcing. Prototyping = quick model refined with users; outsourcing = hand it to a vendor.\n<b>Conversion = moving old to new.</b> Four types: direct (all at once), parallel (both run together), pilot (one site first), phased (in stages). Parallel is safest; direct is riskiest.", "mcqs": [{"q": "The Systems Development Life Cycle is also known as the:", "o": ["Agile method", "Waterfall method", "Spiral method", "Prototyping method"], "a": 1, "e": "The SDLC is also called the waterfall method."}, {"q": "The transition from the old system to the new system is called:", "o": ["Migration testing", "Conversion", "Deployment analysis", "Maintenance"], "a": 1, "e": "Conversion is the transition from the old system to the new."}, {"q": "Running the old and new systems at the same time until the new one is proven is which conversion type?", "o": ["Direct", "Parallel", "Pilot", "Phased"], "a": 1, "e": "Parallel conversion runs both systems simultaneously."}, {"q": "Building a quick working model and refining it with user feedback is:", "o": ["Outsourcing", "Prototyping", "End-user development", "Direct conversion"], "a": 1, "e": "Prototyping builds and refines a quick working model."}, {"q": "Hiring an external vendor to develop the information system is:", "o": ["End-user development", "Outsourcing", "Prototyping", "An application package"], "a": 1, "e": "Outsourcing hands development to an external vendor."}, {"q": "Which SDLC phase defines what the system must do (its requirements)?", "o": ["Design", "Systems analysis", "Implementation", "Maintenance"], "a": 1, "e": "Systems analysis defines requirements (the what); design defines the how."}]}, {"key": "s6", "name": "6 · Information Security and Threats", "cards": [{"f": "CIA triad", "b": "The three goals of information security: Confidentiality, Integrity, and Availability."}, {"f": "Confidentiality", "b": "Keeping data private and accessible only to authorized people."}, {"f": "Integrity", "b": "Keeping data accurate and unaltered by unauthorized changes."}, {"f": "Availability", "b": "Ensuring authorized users can access data and systems when needed."}, {"f": "ISO", "b": "The International Organization for Standardization, an independent, non-governmental body that sets global standards."}, {"f": "ISO 27001", "b": "The international standard for an information security management system (ISMS)."}, {"f": "PCI DSS", "b": "The Payment Card Industry Data Security Standard, which protects cardholder data."}, {"f": "Malware", "b": "Malicious software such as viruses, worms, trojans, and ransomware."}, {"f": "Phishing", "b": "Deceptive messages that trick people into revealing credentials or sensitive information."}, {"f": "Social engineering", "b": "Manipulating people into breaking security procedures or giving up information."}, {"f": "Encryption", "b": "Encoding data so only authorized parties with the key can read it."}, {"f": "Authentication", "b": "Verifying that a user is who they claim to be."}, {"f": "Denial of service (DoS)", "b": "Flooding a system with traffic so legitimate users can't access it."}], "notes": "<b>Security goals = the CIA triad:</b> Confidentiality (kept private), Integrity (kept accurate/unaltered), Availability (accessible when needed). Match a scenario to the goal it protects.\n<b>Two standards the course hits:</b> ISO 27001 = the standard for an information security management system (ISMS); PCI DSS = the standard for protecting payment card data. Don't swap them.\n<b>Threats:</b> malware (malicious software), phishing (deceptive messages for credentials), social engineering (manipulating people), DoS (flooding to deny access). Phishing is technical bait; social engineering is human manipulation.", "mcqs": [{"q": "The three core goals of information security are:", "o": ["Control, identity, and access", "Confidentiality, integrity, and availability", "Compliance, encryption, and auditing", "Confidentiality, identity, and authorization"], "a": 1, "e": "The CIA triad is Confidentiality, Integrity, and Availability."}, {"q": "Which standard defines requirements for an information security management system (ISMS)?", "o": ["PCI DSS", "ISO 27001", "HIPAA", "GDPR"], "a": 1, "e": "ISO 27001 is the standard for an ISMS."}, {"q": "Which standard specifically protects payment cardholder data?", "o": ["ISO 27001", "PCI DSS", "SOX", "COBIT"], "a": 1, "e": "PCI DSS protects payment card data."}, {"q": "A deceptive email designed to trick an employee into entering their login credentials is:", "o": ["Malware", "Phishing", "A denial-of-service attack", "Encryption"], "a": 1, "e": "Tricking someone into revealing credentials via a deceptive message is phishing."}, {"q": "An attacker calls an employee pretending to be IT to get a password. This is:", "o": ["A virus", "Social engineering", "A DoS attack", "Encryption"], "a": 1, "e": "Manipulating a person to give up information is social engineering."}, {"q": "Keeping data accurate and protected from unauthorized changes addresses which security goal?", "o": ["Confidentiality", "Integrity", "Availability", "Authentication"], "a": 1, "e": "Protecting data from unauthorized alteration is integrity."}]}, {"key": "s7", "name": "7 · E-commerce and Social Media", "cards": [{"f": "E-commerce", "b": "Buying and selling goods and services over the internet."}, {"f": "B2B", "b": "Business-to- let scope='all', tab='cards';
let fc={i:0,flip:false,pool:[]}, mc={i:0,lock:false,score:{r:0,t:0},pool:[]};

function esc(s){return(''+s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function inscope(){return scope==='all'?SECTIONS:SECTIONS.filter(s=>s.key===scope)}
function allCards(){return inscope().flatMap(s=>s.cards.map(c=>({...c,sec:s.name})))}
function allMcqs(){return inscope().flatMap(s=>s.mcqs.map(m=>({...m,sec:s.name})))}

function renderSecs(){const h=document.getElementById('secs');
  const opts=[['all','All']].concat(SECTIONS.map(s=>[s.key,s.name.split(' · ')[0]]));
  h.innerHTML=opts.map(([k,lbl])=>`<button class="chip ${k===scope?'on':''}" onclick="pick('${k}')">${lbl}</button>`).join('')}
function pick(k){scope=k;fc={i:0,flip:false,pool:shuffle(allCards())};mc={i:0,lock:false,score:{r:0,t:0},pool:shuffle(allMcqs())};renderSecs();render()}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}

function render(){const v=document.getElementById('view');
  if(tab==='cards'){
    if(!fc.pool.length)fc.pool=shuffle(allCards());
    const c=fc.pool[fc.i];
    v.innerHTML=`<div class="fade"><div class="fcprog"><span>${c.sec.split(' · ')[0]} · flashcards</span><span>${fc.i+1} / ${fc.pool.length}</span></div>
      <div class="flash" onclick="flip()"><span class="side">${fc.flip?'definition':'term'}</span>
        ${fc.flip?`<div class="bk">${esc(c.b)}</div>`:`<div class="ft">${esc(c.f)}</div>`}</div>
      <div class="tap">tap card to flip</div>
      <div class="fcrow"><button class="again" onclick="next()">↻ Again</button><button class="know" onclick="next()">✓ Got it</button></div></div>`;
  } else if(tab==='mcq'){
    if(!mc.pool.length)mc.pool=shuffle(allMcqs());
    const it=mc.pool[mc.i];
    const opts=it._opts||(it._opts=shuffle(it.o.map((txt,i)=>({txt,ok:i===it.a}))));
    v.innerHTML=`<div class="fade"><div class="qhead"><span>${it.sec.split(' · ')[0]} · MCQ</span><span>${mc.i+1}/${mc.pool.length}</span><span class="sc">${mc.score.t?mc.score.r+'/'+mc.score.t:''}</span></div>
      <div class="qtext">${esc(it.q)}</div><div id="mo"></div><div id="mf"></div></div>`;
    const box=document.getElementById('mo');
    opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span>${esc(o.txt)}</span>`;b.onclick=()=>pickMC(i);box.appendChild(b)});
  } else {
    v.innerHTML=inscope().map(s=>`<div class="notes fade"><h3>${esc(s.name)}</h3>${s.notes.split('\n').filter(x=>x.trim()).map(l=>`<div class="ln">${l}</div>`).join('')}</div>`).join('');
  }
}
function flip(){fc.flip=!fc.flip;render()}
function next(){fc.i=(fc.i+1)%fc.pool.length;fc.flip=false;if(fc.i===0)fc.pool=shuffle(fc.pool);render()}
function pickMC(i){if(mc.lock)return;mc.lock=true;const it=mc.pool[mc.i];const ok=it._opts[i].ok;mc.score.t++;if(ok)mc.score.r++;
  document.querySelectorAll('#mo .opt').forEach((e,idx)=>{e.classList.add('lock');if(it._opts[idx].ok)e.classList.add('correct');else if(idx===i)e.classList.add('wrong')});
  document.getElementById('mf').innerHTML=`<div class="expl ${ok?'':'bad'}"><strong style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Correct.':'Wrong.'}</strong> ${esc(it.e)}</div><button class="btn" onclick="nextMC()">${mc.i+1>=mc.pool.length?'Restart ▶':'Next ▶'}</button>`;
  document.querySelector('.qhead .sc').textContent=mc.score.r+'/'+mc.score.t}
function nextMC(){mc.lock=false;mc.i++;if(mc.i>=mc.pool.length){mc.i=0;mc.pool=shuffle(mc.pool);mc.score={r:0,t:0};mc.pool.forEach(q=>delete q._opts)}render()}
renderSecs();pick('all');
</script></body></html>
