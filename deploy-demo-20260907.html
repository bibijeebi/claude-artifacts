<style>
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:#101815;color:#eef4dc;font-family:system-ui,sans-serif;min-height:100svh;padding:32px;display:grid;place-items:center}main{width:min(100%,1000px)}header,footer{display:flex;justify-content:space-between;gap:20px;font-size:12px;letter-spacing:.13em;text-transform:uppercase}header{border-bottom:1px solid #425144;padding-bottom:22px}.badge{color:#c6f56a}.content{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:65px 0}.eyebrow{font-size:12px;letter-spacing:.2em;color:#afbf9f}h1{font-size:clamp(54px,8vw,100px);letter-spacing:-.075em;line-height:.96;margin:24px 0}p{line-height:1.7;color:#acb7a9;max-width:340px}button{border:0;border-radius:100px;background:#ccfa75;color:#192412;padding:17px 29px;font-size:16px;font-weight:650;margin-top:20px;cursor:pointer}button:hover{background:#dfff9c}button:focus-visible{outline:3px solid white;outline-offset:5px}button:disabled{opacity:.6;cursor:wait}.scene{position:relative;height:360px;border:1px solid #425144;border-radius:50% 50% 16px 16px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at bottom,#314333,transparent 65%)}.orbit{position:absolute;width:260px;height:260px;border:1px solid #697b50;border-radius:50%;transform:rotate(-35deg) scaleY(.45)}.rocket{font-size:95px;z-index:1;transition:transform 1s ease-in,opacity 1s}.scene.flying .rocket{transform:translate(190px,-320px);opacity:0}.star{position:absolute;color:#c6f56a}.s1{top:55px;left:70px}.s2{top:115px;right:50px}.s3{bottom:55px;left:45px}.status{min-height:28px;font-size:13px;color:#ccfa75;margin-top:18px}footer{border-top:1px solid #425144;padding-top:22px;color:#91a08b;letter-spacing:.08em}@media(max-width:650px){body{padding:24px}.content{grid-template-columns:1fr;padding:35px 0;gap:20px}.scene{height:260px}footer{font-size:10px}header{font-size:10px}}@media(prefers-reduced-motion:reduce){.rocket{transition:none}}
</style></head>
<body><main><header><span>Benny / Small experiments</span><span class="badge">● Deploy skill demo</span></header><div class="content"><section><div class="eyebrow">Experiment 001</div><h1>Small page.<br>Big launch.</h1><p>A little proof that an idea can become a live link. Your deploy skill got this one off the ground.</p><button id="launch">Launch rocket ↗</button><div class="status" role="status" id="status">Standing by. The launch pad is yours.</div></section><div class="scene" aria-hidden="true"><span class="star s1">✦</span><span class="star s2">✧</span><span class="star s3">+</span><div class="orbit"></div><span class="rocket">🚀</span></div></div><footer><span>Built small. Shipped live.</span><span>September 07, 2026</span></footer></main>
<script>
const button=document.querySelector('#launch'),scene=document.querySelector('.scene'),status=document.querySelector('#status');let launches=0;
button.addEventListener('click',()=>{button.disabled=true;scene.classList.add('flying');status.textContent='Liftoff!';setTimeout(()=>{launches++;status.textContent=`Mission ${launches} complete. Ready for another?`;scene.classList.remove('flying');button.textContent='Launch again ↗';button.disabled=false},1400)});
</script></body></html>
