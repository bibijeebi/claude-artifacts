<style>
:root{--bg:#0a0e0d;--card:#111614;--card2:#161d1a;--line:#23302b;--ink:#e8efe9;--mut:#8aa093;--lime:#d4ff3a;--good:#5ad17a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:16px}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.pos{color:var(--mut);font-size:12px;margin-left:auto}
button.nav{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
button.nav:hover{border-color:var(--lime);color:var(--lime)}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 24px;cursor:pointer;position:relative;user-select:none}
.fc .face{font-size:21px;line-height:1.4}.fc .term{font-family:"Fraunces",serif;font-weight:600}

.q{font-size:16px;line-height:1.5;margin:0 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:8px 0;cursor:pointer;transition:.12s}
.opt:hover{border-color:#33453d}.opt .ltr{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.opt.correct{border-color:var(--good);background:#11231a}.opt.correct .ltr{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:#231414}.opt.wrong .ltr{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.5}
.exp{margin-top:13px;padding:12px 14px;border-radius:10px;background:#0e1512;border:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--mut);display:none}
.exp.show{display:block}.exp b{color:var(--ink)}
.hint{font-size:12px;color:var(--mut);margin:-6px 0 12px}
.seqitem,.mitem{font:inherit;font-size:14px;text-align:left;width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:7px 0;cursor:pointer;color:var(--ink);display:flex;gap:11px;align-items:center;transition:.12s}
.seqitem:hover,.mitem:hover{border-color:#33453d}
.seqitem .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.seqitem.picked .num{background:var(--lime);color:var(--bg)}
.seqitem.ok{border-color:var(--good)}.seqitem.no{border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mitem.sel{border-color:var(--lime)}.mitem.matched{border-color:var(--good);opacity:.85}.mitem.miss{border-color:var(--bad)}
.act{display:flex;gap:8px;margin-top:12px}
.check{font:inherit;font-size:13px;font-weight:700;color:var(--bg);background:var(--lime);border:0;border-radius:9px;padding:10px 18px;cursor:pointer}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}

.res{font-size:12.5px;color:var(--mut);margin-top:8px}

<script>
const FLASH=[["Data", "Raw facts captured on printed or digital media."], ["Information", "Data that has been processed and placed in context for decision-making."], ["Structured data", "Data that conforms to a fixed data model, stored in rows and columns."], ["Unstructured data", "Data with no predefined data model (video, images, free text)."], ["Semi-structured data", "Self-describing data with tags but no rigid schema (JSON, XML)."], ["Flat file", "A single file with no internal hierarchy or relationships between records."], ["Entity", "A uniquely identifiable thing about which data is stored (person, place, event)."], ["Attribute", "A property/characteristic of an entity (a column)."], ["Tuple", "A single row in a relation."], ["Domain", "The set of valid values an attribute may hold (its data type + range)."], ["Cardinality", "The MAXIMUM number of related instances in a relationship (1 or many)."], ["Modality", "The MINIMUM participation in a relationship (0 = optional, 1 = mandatory)."], ["Unary relationship", "A relationship between an entity and itself (recursive)."], ["Binary relationship", "A relationship between two different entity types."], ["Many-to-many (M:N)", "Each instance of A relates to many B and vice versa; resolved with a junction table."], ["Associative/junction entity", "A table that resolves an M:N relationship, holding both foreign keys."], ["Intersection data", "Data attached to a relationship (e.g., Quantity on Salesperson-Product)."], ["Weak entity", "An entity with no key of its own; depends on a parent entity's key."], ["Primary key (PK)", "Attribute(s) that uniquely identify each tuple; cannot be null."], ["Candidate key", "Any column set that COULD serve as the primary key."], ["Alternate key", "A candidate key not chosen as the primary key."], ["Foreign key (FK)", "An attribute referencing the primary key of another relation."], ["Composite key", "A primary key made of two or more attributes."], ["Surrogate key", "A system-generated, meaningless unique identifier used as PK."], ["Entity integrity", "No part of a primary key may be null."], ["Referential integrity", "An FK value must match an existing PK value (or be null)."], ["Index", "A structure that copies key values + pointers for fast direct retrieval."], ["Functional dependency", "A -> B: one value of A determines exactly one value of B."], ["Transitive dependency", "A -> B -> C where C depends on a non-key attribute (3NF violation)."], ["Partial dependency", "A non-key attribute depends on only part of a composite key (2NF violation)."], ["Normalization", "Organizing attributes into tables to reduce redundancy and anomalies."], ["1NF", "All attributes are atomic (single-valued); a key exists."], ["2NF", "1NF + no partial dependencies on a composite key."], ["3NF", "2NF + no transitive dependencies."], ["BCNF", "Every determinant (left side of an FD) is a candidate key."], ["Insertion anomaly", "Can't add a fact without an unrelated fact also being present."], ["DDL", "Data Definition Language: CREATE, ALTER, DROP (defines structure)."], ["DML", "Data Manipulation Language: SELECT, INSERT, UPDATE, DELETE (works on rows)."], ["DCL", "Data Control Language: GRANT, REVOKE (controls access)."], ["WHERE vs HAVING", "WHERE filters rows before grouping; HAVING filters groups after aggregation."], ["INNER JOIN", "Returns only rows with matches in both tables."], ["LEFT OUTER JOIN", "Returns all left rows + matches from right, NULLs where no match."], ["Aggregate functions", "COUNT, SUM, AVG, MIN, MAX over a set of rows."], ["Business intelligence", "Tools/processes that turn data into decisions; aims for profit + throughput."], ["ETL", "Extract, Transform, Load: pull data, clean/aggregate it, write to a warehouse."], ["OLTP", "Online Transaction Processing: many short read/write transactions."], ["OLAP", "Online Analytical Processing: complex analytical queries over historical data."], ["Data warehouse", "Central integrated store of historical data for analysis."], ["Data mart", "A subject- or department-specific subset of a data warehouse."], ["Star schema", "A central fact table (measures) surrounded by dimension tables."], ["Fact table", "The central table of measures + FKs to dimensions."], ["Classification", "Assigning records to KNOWN/predefined classes."], ["Clustering", "Grouping similar records with NO predefined labels."], ["Estimation", "Producing a continuous numeric value from data."], ["Prediction", "Assigning a future class or value (forward-looking)."], ["Affinity grouping", "Market-basket / association: which items occur together."], ["CIA triad", "Confidentiality, Integrity, Availability."], ["Data governance", "Policies, roles, and standards for managing data assets."], ["View table", "A table name bound to a stored SELECT; queries run against its base tables."], ["Base table", "A real table named in a view query's FROM clause."], ["Materialized view", "A view whose result is physically stored. NOT supported by MySQL."], ["Outer join", "Any join that also keeps unmatched rows (LEFT / RIGHT / FULL)."], ["FULL JOIN", "Keeps unmatched rows from both sides. NOT supported by MySQL."], ["Equijoin", "A join comparing columns with the = operator."], ["Self-join", "A table joined to itself; requires aliases."], ["Cross join", "Every combination of rows from both tables."], ["Supertype / subtype", "Shared attributes live on the supertype; specific ones on subtypes (Person -> Student)."], ["Independent entity", "Has its own key, can exist alone. A master entity is always independent."], ["Dependent (weak) entity", "Identified through a parent's key; exactly one dependency relationship."], ["Discovery", "The analysis-phase step that identifies entities, relationships, and attributes."], ["Data independence", "Query results are unaffected by how data is physically stored."], ["Relational algebra", "Operations on tables that return tables: select, project, union, join."], ["ACID", "Atomicity, Consistency, Isolation, Durability: transaction guarantees."], ["Two-phase commit", "Distributed all-or-nothing: every node votes prepared, then all commit or all roll back."], ["Distributed database", "One logical database spread across networked nodes."], ["Replicated database", "Full copies on multiple nodes: availability + fast local reads."], ["Federated database", "Independent DBMSs presented as one via a global catalog and wrappers."], ["Global catalog", "The federated component that maps where data lives."], ["In-memory database", "Data held in RAM; universally fast queries; must back up to durable storage."], ["Embedded database", "Runs inside an application. SQLite is the dominant one."], ["Data lake", "Raw files in any format; favored by data scientists (warehouse = transformed, structured)."], ["Staging area", "The temporary database where extracted data lands during ETL."], ["Slowly changing dimension (Type 2)", "Tracks history by inserting a new row for each change."], ["Dimension hierarchy", "Drill-down levels, like Year -> Quarter -> Month."], ["Key-value store", "NoSQL: values retrieved by unique key only."], ["Document database", "NoSQL storing JSON-like documents (MongoDB)."], ["Column family store", "NoSQL organizing data into column groups."], ["Graph database", "NoSQL of nodes and edges; ideal for social networks."], ["InnoDB", "MySQL's default, transaction-capable storage engine."], ["Query optimizer", "Determines the execution plan for a query."], ["Query cache", "Detects and reuses recently executed queries."], ["Parser", "Catches SQL syntax errors, like a missing semicolon."], ["Middleware", "A software layer between the operating system and applications."]], MCQS=[["What is a broad definition of data?", ["Numbers that are captured on digital media", "Raw facts that are captured on printed or digital media", "Alphanumeric combinations that can be captured on media that a computer can read", "Any information that can be transferred from print to digital"], 1, "Data = raw facts on printed or digital media. 'Information' is processed data; don't confuse the two.", "Intro to Data"], ["What are data?", ["Facts that have been organized in a meaningful way", "Facts that are the result of a query of a database system", "Facts that are collected and stored in a database system", "Facts that have been processed and used for decision making"], 2, "Data are collected and stored facts. 'Organized meaningfully' / 'processed for decisions' = information.", "Intro to Data"], ["What is a determining characteristic of unstructured data?", ["It does not allow copying and pasting.", "It is easy to query and retrieve by business applications.", "It does not follow a data model.", "It is stored in rows and columns."], 2, "Unstructured data has no predefined data model (video, images, free text). Rows/columns = structured.", "Intro to Data"], ["In a flow diagram, which item represents unstructured data? (A=Training Video Content, B=SQL tables of training instructors, C=Relational DB, D=Training DB backup)", ["A (Training Video Content)", "B (SQL tables)", "C (Relational database)", "D (Database backup)"], 0, "Video content has no data model = unstructured. SQL tables and the relational DB are structured.", "Intro to Data"], ["Which is true about flat files?", ["They contain no internal hierarchical organization.", "They have a limit of 256 records.", "They can only contain two-dimensional data.", "They are always encrypted."], 0, "Flat files have no internal hierarchy. No record limit, not 2D-only, not inherently encrypted.", "Intro to Data"], ["Which technology has no internal hierarchy?", ["Flat files", "Heap files", "Hashed tables", "Relational databases"], 0, "Flat files store data with no internal hierarchy or relationships.", "Intro to Data"], ["How were data retrieved before database management systems?", ["Randomly from linked files", "Sequentially from simple files", "Using set operations on complex files", "Using relationships between logical entities"], 1, "Pre-DBMS, data was read sequentially from simple/flat files. Set ops and logical relationships are DBMS features.", "Intro to Data"], ["What is the uniquely identifiable element about which data can be categorized in an entity-relationship diagram?", ["Entity types", "Primary keys", "Unary relationships", "Intersection data points"], 0, "An entity type is the identifiable thing data is categorized about. Keys/relationships describe it, they aren't it.", "Data Modeling"], ["In an ERD where Quantity hangs off the Sells/Sold-by relationship between Salesperson and Product, which classification is correct for the box marked 'Quantity'?", ["Quantity data", "Modality data", "Intersection data", "Product sales data"], 2, "Data on the relationship between two entities (M:N) is intersection data. It belongs to neither entity alone.", "Data Modeling"], ["Which data classification is an entity?", ["Event", "Duration", "Directions", "Attendance"], 0, "An event is a thing you store data about = an entity. Duration/directions/attendance are attributes or measures.", "Data Modeling"], ["An ERD shows Manufacturer (PK Manufacturer Name) --Manufactured/Manufactured-by--< Car (PK Car Serial Number). What is it showing?", ["An agency's cars were provided by multiple manufacturers.", "One manufacturer created at least one of the agency's cars.", "The model, year, and class of the car are part of the primary key.", "The manufacturer maintains database records for its sales representatives."], 1, "The crow's foot reads one manufacturer to many cars: one maker built at least one car. PK is the serial number only.", "Data Modeling"], ["A salesperson is authorized to sell 12 products; a product can be sold by 10 salespersons. Which binary relationship is this?", ["One-to-one", "One-to-many", "Many-to-many", "Associative"], 2, "Many salespersons to many products = many-to-many (M:N). 'Associative' is the resolving table, not the relationship type.", "Data Modeling"], ["Customer >--Purchased/Purchased-by--< Product, crow's foot on both ends. Which relationship does the cardinality represent?", ["Many customers to many products", "One customer to many products", "One customer to many product numbers", "One customer to one product number"], 0, "Crow's foot on both sides = many-to-many: many customers to many products.", "Data Modeling"], ["Salesperson |--Sells-to/Buys-from--| Customers, with a single bar (one) on the Customers side. How is the cardinality of customers misrepresented?", ["There is one customer number, but the cardinality indicates many customers.", "There are many customers, but the cardinality indicates one customer.", "There is more than one salesperson, but the cardinality indicates multiple salespersons.", "The cardinality of the salesperson number and the customer number do not match."], 1, "A salesperson serves many customers, but the single-bar cardinality wrongly shows only one customer.", "Data Modeling"], ["Reading modality on the right side: the symbol is an open circle (zero) next to 'No Customers'. How do you read it?", ["A maximum of one customer", "A maximum of many customers", "A minimum of zero customers", "A maximum of zero customers"], 2, "Modality is the MINIMUM. The circle/zero means minimum of zero (participation is optional).", "Data Modeling"], ["SALES >--Sold/Sold-Product--|| PRODUCT, with a single bar (one) on the Product side. What is the modality of the product?", ["Two", "At least one", "Two or more", "Dependent on the quantity"], 1, "The bar nearest the entity is the modality = minimum participation of one, so 'at least one'.", "Data Modeling"], ["SALESPERSON relates to itself via Backs-up / Backed-up by, one on each end. Which kind of relationship is this?", ["Unary one-to-one", "Binary one-to-one", "Unary one-to-many", "Binary one-to-many"], 0, "An entity related to itself = unary (recursive). One backs up one = one-to-one.", "Data Modeling"], ["PRODUCT and COMPONENT (PK Product Number + Subassembly Number) relate via Part-of / Includes, crow's foot on both. Which relationship is this?", ["Unary one-to-many", "Binary one-to-many", "Unary many-to-many", "Binary many-to-many"], 2, "A product is built from many components and a component is part of many products, and it loops on the same concept = unary many-to-many (bill of materials).", "Data Modeling"], ["Which three rules for referential integrity are provided by modern RDBMSs? (Choose 3)", ["Sort", "Insert", "Query", "Delete", "Update", "Retrieve"], [1, 3, 4], "Referential integrity rules govern Insert, Update, and Delete (the operations that can break FK references).", "Relational Model"], ["What is an important aspect of referential integrity?", ["Primary keys refer to data in a particular relation.", "Reference points are placed by the database in each record during backups.", "The relationships between entities and attributes are called referrals.", "Reference to data in one relation is based on values in another relation."], 3, "Referential integrity = a value in one relation (FK) must match values in another relation (PK).", "Relational Model"], ["SELECT SPNUM, SPNAME FROM SALESPERSON  -- add a line to find salespersons with commission percentage of 15.", ["* COMMPERCT=15;", "IF COMMPERCT=15;", "AND COMMPERCT=15;", "WHERE COMMPERCT=15;"], 3, "Row filtering uses WHERE. AND only chains an existing WHERE; IF/* aren't filter clauses.", "SQL"], ["SELECT COMMPERCT, YEARHIRE FROM SALESPERSON WHERE SPNUM=22;  -- change it to retrieve the ENTIRE record.", ["Replace WHERE SPNUM=22; with WHERE SPNUM=*", "Replace COMMPERCT, YEARHIRE with an asterisk", "Replace COMMPERCT, YEARHIRE with ALL", "Replace SALESPERSON with ALL"], 1, "SELECT * returns all columns. The asterisk goes in the column list, not the WHERE clause.", "SQL"], ["SELECT CUSTNUM, CUSTNAME, HQCITY FROM CUSTOMER WHERE HQCITY='Los Angeles'  -- also limit to customer number above 1000.", ["AND CUSTNUM>1000;", "AND CUSTNUM>=1000;", "WHERE CUSTNUM<1000", "WHERE CUSTNUM>=1000;"], 0, "A second condition chains with AND, not a second WHERE. 'Higher than 1000' = strictly greater than (>), not >=.", "SQL"], ["What is a key difference between DISTINCT and ORDER BY in SQL SELECT commands?", ["ORDER BY does not alter the presentation of data results and DISTINCT modifies data results.", "ORDER BY modifies the presentation of data results and DISTINCT filters data results.", "ORDER BY changes the order of results in the database and DISTINCT changes the order of results in the view only.", "ORDER BY changes the order of results in the view only and DISTINCT changes the order of results in the database."], 1, "ORDER BY sorts the presentation; DISTINCT filters out duplicate rows. Neither changes data in the database.", "SQL"], ["Which SQL statement alphabetizes customer names WITHIN the same satellite-office city?", ["ORDER BY CUSTNAME, SATCITY;", "ALPHA BY CUSTNAME, SATCITY;", "ORDER BY SATCITY, CUSTNAME;", "ALPHA BY SATCITY, CUSTNAME;"], 2, "Group by city first, then sort names within it: ORDER BY SATCITY, CUSTNAME. There is no ALPHA BY.", "SQL"], ["SELECT PRODNAME FROM SALESPERSON, SALES, PRODUCT ? ? AND SPNAME='Fox' AND QUANTITY>500;  -- pick the join lines.", ["WHERE SALESPERSON.SPNUM=PRODUCT.PRODNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM=SALES.SPNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM>SALES.SPNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM=SALES.SPNUM AND SALES.PRODNUM=SALES.SPNUM"], 1, "Join on matching keys: SALESPERSON.SPNUM=SALES.SPNUM and SALES.PRODNUM=PRODUCT.PRODNUM. The bridge table SALES links the two.", "SQL"], ["SELECT COUNT(*) ? WHERE PUBLISHER.PUBNAME=BOOK.PUBNAME AND CITY='Los Angeles' AND COUNTRY='United States' AND PAGES>=800;  -- pick the FROM line.", ["FROM PUBNAME.BOOK", "FROM PUBLISHER, BOOK", "WHERE PUBNAME = BOOK", "WHERE PUBLISHER = BOOK"], 1, "Two tables are referenced, so FROM PUBLISHER, BOOK. The WHERE already does the join on PUBNAME.", "SQL"], ["Which SQL retrieves rows for all stores in Atlanta OR Los Angeles OR New York?", ["SELECT StoreID, City FROM Suppliers WHERE City IN ('Atlanta', 'Los Angeles', 'New York');", "SELECT StoreID, City FROM Suppliers WHERE City BETWEEN 'Atlanta' AND 'Los Angeles' AND 'New York';", "SELECT StoreID, City FROM Suppliers WHERE City BETWEEN 'Atlanta' OR 'Los Angeles' OR 'New York';", "SELECT StoreID, City FROM Suppliers WHERE (City='Atlanta' AND City='Los Angeles' AND City='New York');"], 0, "IN ('a','b','c') matches any value in the list. A single column can't equal three values with AND.", "SQL"], ["SELECT * FROM PRODUCT;  -- what does this accomplish?", ["List all PRODUCT from the * table.", "Delete all products from the PRODUCT table view.", "Delete all entries in the PRODUCT table.", "List all entries in the PRODUCT table."], 3, "SELECT * FROM PRODUCT lists every row and column of PRODUCT. SELECT never deletes.", "SQL"], ["A product-marketing company adds an RDBMS to store customer info. What advantage do they gain?", ["Increased sales", "Lower advertising costs", "Improved query response times", "Decreased skill acquisition times"], 2, "An RDBMS's concrete technical benefit is faster querying/retrieval. Sales/ad cost are indirect business hopes.", "Relational Model"], ["In which two ways does a DBMS environment increase effectiveness when working with data? (Choose 2)", ["It enables data sharing.", "It duplicates redundant data for security.", "It permits storage of vast volumes of data.", "It increases the complexity rules by which data is organized."], [0, 2], "A DBMS enables data sharing and stores vast volumes. It REDUCES redundancy and complexity, not increases them.", "Relational Model"], ["Sales data has customer names, products sold, and salespersons. Which qualifies as intersection data of BOTH product and salesperson?", ["Quantity", "Products", "Salespersons", "Customer names"], 0, "Quantity sits on the M:N relationship between salesperson and product = intersection data. (The exam keyed Quantity; watch the wording.)", "Data Modeling"], ["What is an attribute or group of attributes that uniquely identifies a tuple in a relation?", ["Index key", "Foreign key", "Primary key", "Physical key"], 2, "The primary key uniquely identifies each tuple (row). FK references another table; index is a lookup structure.", "Relational Model"], ["What is necessary for a primary key in one relation to match its corresponding foreign key in another relation of the same database?", ["A domain of values", "Intersection data", "An attribute name", "A quantity"], 0, "PK and FK must share the same domain (data type and set of valid values) to match.", "Relational Model"], ["What uniquely identifies each entity in a collection but is NOT the primary key?", ["The foreign key", "The secondary key", "The alternate key", "The master key"], 2, "A candidate key not chosen as the primary key is the alternate key.", "Relational Model"], ["What is a term for a set of columns that can uniquely identify any record in a table without referring to other data?", ["Foreign key", "Primary key", "Alternate key", "Candidate key"], 3, "A candidate key is any column set that could serve as PK (self-sufficient unique identifier). The chosen one becomes PK; the rest are alternate keys.", "Relational Model"], ["What happens to the original data in database indexing?", ["It is moved to the index.", "It is copied to the index.", "It is compiled by the DBMS.", "It is translated into hexadecimals."], 1, "Indexing copies key values (plus pointers) into the index; the original rows stay put.", "Relational Model"], ["Why are indexes created in a physical database design?", ["To group data into aggregations", "To iterate across data in a sequence", "To retrieve data directly using a pointer", "To summarize data into dimensions for a cube"], 2, "Indexes give direct pointer-based access to rows, avoiding full scans.", "Relational Model"], ["Why is an index created on a database column?", ["To optimize data integrity", "To optimize data updates", "To optimize data retrievals", "To optimize data insertions"], 2, "Indexes optimize retrieval/lookups. They actually slow inserts/updates (the index must be maintained).", "Relational Model"], ["What is a methodology for organizing attributes into tables?", ["Data normalization", "Data redundancy", "Data indexing", "Data compression"], 0, "Normalization organizes attributes into well-structured tables to reduce redundancy and anomalies.", "Normalization"], ["What is the term for the value of one particular attribute being associated with a specific single value of another attribute?", ["Functional dependency", "Transitive dependency", "Decomposition", "Normalization"], 0, "A determines B = functional dependency (A -> B). Transitive is A->B->C; decomposition splits tables.", "Normalization"], ["A table repeats Project Code with Employee, Department, and Hourly Rate across many rows, all single-valued. In which state are the attributes?", ["Unnormalized", "First normal form", "Second normal form", "Third normal form"], 1, "All cells single-valued with a defined key = 1NF. Partial dependencies on a composite key still exist, so not yet 2NF.", "Normalization"], ["A Students table (IDSt, LastName, IDProf, Prof, Grade) — which factor determines it is in first normal form?", ["There are no functional dependencies.", "The fourth column shows the foreign keys.", "The attributes are all single valued.", "The first column is in numerical order."], 2, "1NF requires atomic (single-valued) attributes. Ordering and FKs are irrelevant to 1NF.", "Normalization"], ["Two tables: (ID, Contract, Code) keyed on ID, and (Code, City, Country) keyed on Code. How advanced in normalization?", ["Unnormalized", "First normal form", "Second normal form", "Third normal form"], 3, "Splitting out Code->City,Country removes the transitive dependency. Single-key tables with no transitive deps = 3NF.", "Normalization"], ["Four split tables (SALESPERSON, DEPARTMENT, PRODUCT, QUANTITY). Which characteristic points to third normal form?", ["Each primary key has a functional dependency on every other primary key in the table.", "'Salesperson Number' appears in more than one table.", "The tables are completely free of data redundancy.", "The attributes are all single valued."], 2, "3NF eliminates transitive dependencies, leaving the design free of redundancy. Single-valued alone is just 1NF.", "Normalization"], ["Which set of results should a company expect from implementing a business intelligence system?", ["Increased profitability and increased throughput", "Reduced hardware redundancy and decreased workloads", "Increased profitability and reduced hardware redundancy", "Riskier capital and asset investments and increased throughput"], 0, "BI drives better decisions -> increased profitability and throughput. Hardware redundancy isn't a BI outcome.", "Business Intelligence"], ["Which issue is focused on the LOADING component of extract, transform, load (ETL)?", ["Monitor refreshing volume and frequency", "Denormalizing and renormalizing the data", "Mapping keys from one system to another", "Determining the content of the data"], 0, "Loading concerns how/when data refreshes into the target: volume and frequency. Mapping/denormalizing happen in Transform.", "Business Intelligence"], ["During which ETL step are raw data sets aggregated?", ["Loading", "Extraction", "Conversion", "Transformation", "Denormalization"], 3, "Aggregation, cleansing, and conversion happen in Transformation. Extract pulls; Load writes.", "Business Intelligence"], ["How is prediction distinguished from estimation in data mining?", ["Prediction is used to look at historical data only.", "Estimation assumptions do not need to be tested.", "Prediction classifies objects according to an expected future behavior.", "Estimation divides small collections of entities into smaller groups of similar entities."], 2, "Prediction assigns a future class/value (forward-looking). Estimation produces a continuous value from known data.", "Business Intelligence"], ["Where does affinity grouping occur in data mining?", ["Among entities and target applications", "Between entity group names", "Between objects", "Among clusters"], 2, "Affinity grouping (market-basket/association) finds which objects occur together. It's between objects.", "Business Intelligence"]], SEQ=[["ETL pipeline order", ["Extract raw data from sources", "Transform: cleanse, convert, aggregate", "Load into the target warehouse"]], ["Normalization progression", ["Unnormalized", "1NF (atomic values)", "2NF (no partial dependencies)", "3NF (no transitive dependencies)", "BCNF (every determinant is a candidate key)"]], ["SQL clause execution order", ["FROM (and JOIN)", "WHERE", "GROUP BY", "HAVING", "SELECT", "ORDER BY"]], ["Database design phases (zyBooks)", ["Analysis: discover entities, relationships, attributes", "Logical design: tables, columns, keys", "Normalization (last step of logical design)", "Physical design: indexes, partitions, storage"]], ["Resolving a many-to-many relationship", ["Identify the M:N relationship", "Create an associative/junction table", "Add a foreign key to each parent", "Move intersection data into the junction table"]], ["Two-phase commit", ["Coordinator asks every node to prepare", "Each node votes yes or no", "All yes: every node commits", "Any no: every node rolls back"]], ["MySQL query path", ["Connection manager accepts the connection", "Query cache checked for a recent identical query", "Parser validates syntax", "Optimizer builds the execution plan", "Storage engine (InnoDB) executes"]]], MATCH=[["Key types", [["Primary key", "Uniquely identifies a tuple; not null"], ["Foreign key", "References another table's PK"], ["Candidate key", "Could serve as the PK"], ["Alternate key", "Candidate key not chosen as PK"], ["Surrogate key", "System-generated meaningless ID"]]], ["Normal forms", [["1NF", "Atomic single-valued attributes"], ["2NF", "No partial dependencies"], ["3NF", "No transitive dependencies"], ["BCNF", "Every determinant is a candidate key"]]], ["SQL sub-languages", [["DDL", "CREATE / ALTER / DROP"], ["DML", "SELECT / INSERT / UPDATE / DELETE"], ["DCL", "GRANT / REVOKE"], ["TCL", "COMMIT / ROLLBACK"]]], ["Cardinality vs modality", [["Cardinality", "Maximum related instances"], ["Modality", "Minimum participation"], ["Crow's foot", "Many"], ["Single bar", "One / mandatory"], ["Open circle", "Zero / optional"]]], ["Join types", [["INNER JOIN", "Matches in both tables only"], ["LEFT JOIN", "All left rows + right matches"], ["RIGHT JOIN", "All right rows + left matches"], ["CROSS JOIN", "Every row combination"], ["Self-join", "Table joined to itself (aliases)"]]], ["MySQL components", [["Parser", "Syntax errors"], ["Connection manager", "Wrong server address"], ["Query cache", "Recently executed query"], ["Optimizer", "Execution plan"], ["InnoDB", "Transactions"]]], ["Architectures", [["Distributed", "One logical DB across nodes"], ["Replicated", "Full copies on many nodes"], ["Federated", "Independent DBMSs unified"], ["In-memory", "Data lives in RAM"], ["Embedded", "Runs inside an app (SQLite)"]]], ["NoSQL types", [["Key-value", "Lookup by unique key"], ["Document", "JSON-like documents (MongoDB)"], ["Column family", "Column-group storage"], ["Graph", "Nodes + edges, social networks"]]], ["Data mining tasks", [["Classification", "Assign to known classes"], ["Clustering", "Group with no labels"], ["Estimation", "Continuous value"], ["Prediction", "Future class/value"], ["Affinity", "Items bought together"]]], ["BI / warehouse terms", [["OLTP", "Short transactions"], ["OLAP", "Analytical queries"], ["Fact table", "Holds measures"], ["Dimension table", "Holds descriptors"], ["Data mart", "Department subset"]]]], NOTES=[["Read first: how to beat this OA", ["The OA is a vocabulary-matching test: map the keyword in the stem to the one formal term it defines. Lock the cut rules below and the taxonomies in Matching, then master the drill's Core mode (161 Q) twice.", "RULE: trust your stated reasoning. If you articulate the answer while reading the stem, pick it. Don't talk yourself out of it.", "RULE: when two options both seem true, pick the DEFINING characteristic, not a side effect. Index = faster RETRIEVAL (not 'better integrity'). BI = profitability + throughput (not 'less hardware').", "RULE: SQL questions are which-clause-does-this-job exercises. Filter rows = WHERE. Filter groups = HAVING. Sort output = ORDER BY. Chain conditions = AND/OR, never a second WHERE.", "Vocab bridge: zyBooks says maximum/minimum cardinality. Older exam items say CARDINALITY (max) and MODALITY (min). Same concept, two names.", "Pace: about 2 min per question. Flag hard ones and move."]], ["C1 · Databases & database systems", ["Data = raw facts. Information = data processed into context. 'Organized meaningfully' or 'used for decisions' = information, not data.", "Structured = fixed model, rows/columns. Unstructured = no data model (video, images, free text). Semi-structured = self-describing tags (JSON, XML).", "Flat file = no internal hierarchy, no relationships. No record limit, not 2D-only, not encrypted. Pre-DBMS retrieval = SEQUENTIAL reads of simple files.", "Database vs DBMS: the DATABASE stores the data; the database SYSTEM manages it: rules (valid data), access control (security), concurrency (no partial reads), recovery.", "Roles: ADMINISTRATOR grants access and secures. DESIGNER produces the detailed schema. USER queries and runs reports through applications.", "Logical design = either a process or a specification. A schema is depicted in a TABLE DIAGRAM.", "DBMS wins: data sharing + vast volumes; it REDUCES redundancy. The concrete RDBMS benefit = faster query response, not 'increased sales'."]], ["C2 · Relational model, keys, NULLs", ["Relation = table. Tuple = row. Attribute = column. Domain = valid value set. The result of every relational operation is A TABLE.", "Row order and column order never matter: same rows in a different order = THE SAME table. Every cell holds exactly ONE value.", "KEYS, the prom-court scene: many CANDIDATES run. One gets crowned PRIMARY. The runner-up who could have won = ALTERNATE. The FOREIGN exchange student points at another school's royalty (references another table's PK). A COMPOSITE is a couple crowned together (multi-column). The SURROGATE is a stand-in wearing a meaningless number badge.", "Cut rules: 'uniquely identifies a tuple' -> PRIMARY. 'could identify, self-sufficient' -> CANDIDATE. 'identifies but is not the PK' -> ALTERNATE. 'references another PK' -> FOREIGN. PK and FK must share a DOMAIN.", "Integrity: ENTITY = no null in a PK. REFERENTIAL = FK must match an existing PK (or be wholly null); its rules fire on INSERT, UPDATE, DELETE. DOMAIN = value within the allowed set.", "NULL = missing. Value exists in reality but wasn't recorded -> UNKNOWN. Value cannot exist at all -> INAPPLICABLE. NULL is NOT zero and NOT empty string: Bonus 0 = 'earned no bonus'; Bonus NULL = missing.", "Three-valued logic: any comparison with NULL -> NULL (row NOT selected). FALSE AND NULL -> FALSE. TRUE OR NULL -> TRUE. Test with IS NULL, never = NULL.", "Composite FK: all columns null together or none. (NULL, NULL) is legal; half-null is not.", "Index: COPIES key values + pointers, originals stay put. Optimizes RETRIEVAL via direct pointer access; slows writes.", "Relational algebra: select (rows), project (columns), union, join. One SQL statement can implement SEVERAL operations."]], ["C2 · Joins & views", ["Family-dinner joins: INNER = only couples where BOTH sides showed up. LEFT = the whole left family attends, right side only if matched (unmatched left rows get NULLs). RIGHT = the mirror image. CROSS = speed dating, every possible pairing. OUTER = any join that keeps unmatched rows.", "MySQL supports LEFT and RIGHT but NOT FULL JOIN, and does NOT support materialized views (avoids refresh overhead).", "Equijoin compares with =. Non-equijoin uses < or >. Self-join = a table joined to itself, and it REQUIRES aliases.", "View = a name for a stored SELECT. Tables in its FROM clause = BASE tables. Querying a normal view executes against the base tables; a MATERIALIZED view physically stores its rows.", "View wins: hide sensitive COLUMNS (select list) and ROWS (WHERE), simplify complex queries, present computed data. Writes through views are disallowed or severely limited: avoid. WITH CHECK OPTION rejects writes that fall outside the view's WHERE."]], ["C3 · SQL", ["Sub-languages: DDL = CREATE/ALTER/DROP (structure). DML = SELECT/INSERT/UPDATE/DELETE (rows). DCL = GRANT/REVOKE (access). TCL = COMMIT/ROLLBACK (transactions).", "Admin basics: SHOW DATABASES; USE db; SHOW TABLES; SHOW COLUMNS FROM t;. String literals take SINGLE quotes. Statements end with a semicolon.", "Data type cut rules: whole number -> INT family (UNSIGNED if never negative). Money -> DECIMAL(p,s). Fixed-length code or letter grade -> CHAR(n). Variable text/email -> VARCHAR(n). Date+time -> DATETIME. Yes/no -> TINYINT.", "Constraints live in CREATE TABLE: NOT NULL, DEFAULT 'x', PRIMARY KEY, FOREIGN KEY ... REFERENCES, UNIQUE.", "INSERT INTO t (cols) VALUES (...); the column list is optional only when supplying every column in order. Omitted columns get their DEFAULT or NULL.", "UPDATE t SET col = val WHERE ...; DELETE FROM t WHERE ...; NO WHERE CLAUSE = EVERY ROW changed or deleted. Classic exam trap.", "WHERE filters rows; chain with AND/OR, never a second WHERE. 'above 1000' = strictly >, 'at least' = >=.", "IN ('a','b','c') matches any listed value. BETWEEN x AND y is an inclusive range. LIKE 'Sm%' (% = any run of characters including none, _ = exactly one); case-insensitive by default, BINARY makes it case-sensitive.", "DISTINCT removes duplicate rows. ORDER BY sorts OUTPUT only, ascending by default, DESC flips it. Sorting within groups = list the group column FIRST: ORDER BY City, Name.", "Aggregates: COUNT / SUM / AVG / MIN / MAX. GROUP BY = one output row per group. HAVING filters GROUPS after aggregation; WHERE can't see aggregates.", "Logical evaluation order: FROM -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY. 'Fat Wizards Grill Hot Sausages Onstage': picture a wizard barbecue concert.", "Multi-table SELECT: FROM lists every table touched; join keys match in WHERE (or JOIN ... ON). Bridge tables link parents: SALES joins SALESPERSON to PRODUCT via SPNUM and PRODNUM."]], ["C4 · ER design", ["Phases: ANALYSIS (discovery of entities, relationships, attributes from requirements) -> LOGICAL design (tables, columns, keys; normalization is its LAST step) -> PHYSICAL design (indexes, partitions, storage).", "In requirements text: NOUNS -> entities or attributes (a thing you store data about = entity; a property of a thing = attribute). VERBS -> relationships. Identify FIRST, document second. Synonyms must follow naming conventions.", "Maximum cardinality = at most how many can relate, asked on EACH side separately. Student-Takes-Course = many-many. City-IsCapitalOf-State = one-one. Airport-Has-Runway = one-many.", "Minimum cardinality = required (1) or optional (0). Person-Has-Passport: a passport REQUIRES a person; a person optionally has a passport. Attributes too: SpouseName = singular, optional; LanguageCode = plural, required.", "Crow's foot reading: the crow's FOOT (many toes) = MANY. Single BAR = ONE. Open CIRCLE = ZERO/optional. The symbol NEAREST the entity = the MINIMUM (the bouncer at the door checks the minimum to get in); the FAR symbol = the MAXIMUM (the parking lot shows how many could show up).", "Older exam vocab: CARDINALITY = the maximum, MODALITY = the minimum. 'Open circle by the entity' = minimum of zero = optional participation.", "Unary = an entity related to ITSELF (backs-up, manages, product/component bill-of-materials). Binary = two entities. Data hanging on an M:N relationship (like Quantity) = INTERSECTION data; it belongs to the relationship, not either entity.", "Independent entity = own key, exists alone; a MASTER entity is ALWAYS independent. Dependent (weak) entity = identified through a parent's key; each dependent has EXACTLY ONE dependency relationship; one independent can support MANY dependents.", "Supertype/subtype: shared attributes go UP to the supertype (Person holds Name); subtype-specific attributes stay DOWN (Student holds GPA).", "Implementation: entity -> table. 1-M relationship -> FK on the MANY side. M:N relationship -> junction/associative table holding both FKs plus the intersection data. Plural attributes get their own table."]], ["C5 · Normalization", ["The courtroom oath: 'the key, the whole key, and nothing but the key, so help me Codd.' Picture raising your right hand on a database in court. 1NF = depends on THE KEY (and every cell atomic). 2NF = the WHOLE key (no partial dependencies). 3NF = NOTHING BUT the key (no transitive dependencies).", "Functional dependency A -> B: one A value determines exactly one B value. PARTIAL = a non-key column depends on part of a composite key (violates 2NF). TRANSITIVE = A -> B -> C through a non-key column (violates 3NF).", "A table with a SIMPLE (single-column) PK cannot have partial dependencies, so it is automatically at least 2NF.", "BCNF: every determinant (left side of any FD) is a candidate key. Fix a violation by splitting the offending dependency into its own table. 3NF is the practical gold standard; 4NF/5NF kill multivalued and join dependencies.", "Anomalies: UPDATE = the same fact must be edited in many rows. INSERTION = can't add a fact without an unrelated fact. DELETION = removing a row destroys data you wanted to keep.", "Normalization = organizing attributes into more, narrower tables to cut redundancy. Two single-key tables with the transitive dependency split out = 3NF.", "Operational databases stay normalized (3NF) to protect writes. Data warehouses DEnormalize (star schema) to speed analytic reads."]], ["C6 · Architecture: MySQL, cloud, distributed", ["The MySQL restaurant: the HOST seats you = CONNECTION MANAGER (catches a wrong server address). The WAITER checks whether the kitchen already made that dish = QUERY CACHE (recently executed query). The CHEF rejects a gibberish ticket = PARSER (syntax errors like a missing semicolon). The SOUS-CHEF plans the cooking steps = OPTIMIZER (execution plan). The PANTRY hands over ingredients = STORAGE ENGINE.", "Storage engines: InnoDB = MySQL's default, handles TRANSACTIONS; its buffer discards the least recently used block. MyISAM and Memory are other MySQL engines. Oracle and SQL Server have ONE storage engine, not several.", "ACID: Atomicity = all-or-nothing. Consistency = valid state to valid state. Isolation = concurrent transactions don't interfere. Durability = committed work survives crashes.", "Middleware = a software layer between the OS and applications (web server, message queue). VMs on one machine can run DIFFERENT operating systems. SaaS = 3 tiers. SQL Server ships as licensed software AND a cloud service.", "Hardware taxonomy: PARALLEL computer = multiple processors sharing ONE memory (a multi-core CPU). CLUSTER = separate computers on a LOCAL network. DISTRIBUTED system = computers in DIFFERENT locations over a WAN. LAN = one site; WAN = spans sites.", "Distributed database = one logical DB across nodes (shared-nothing). Where data is placed changes PERFORMANCE, never a SELECT's results. A NODE = one computer in the system.", "TWO-PHASE COMMIT: every node votes prepared, then all commit; any no vote = all roll back. Guarantees all-or-nothing across nodes.", "REPLICATED database = full copies on several nodes -> availability + fast local reads. Asynchronous replication can briefly serve STALE data.", "FEDERATED database = independent DBMSs presented as one: the GLOBAL CATALOG maps where data lives, WRAPPERS translate for each source, one component DECOMPOSES the query and another MERGES results. Referential integrity across sources is NOT maintained.", "IN-MEMORY database = data in RAM: fast queries universal, transaction support varies, must back up to storage because RAM is volatile. EMBEDDED database = runs inside an application; SQLite is dominant; best for local single-application data.", "Cloud database = elastic, managed capacity with no hardware ownership. DATA LAKE = raw files in ANY format (warehouse = transformed, structured); lakes suit DATA SCIENTISTS.", "The NoSQL locker room: LOCKERS opened by one key = KEY-VALUE. A FILING cabinet of JSON folders = DOCUMENT (MongoDB). A sign-in sheet organized in column groups = COLUMN FAMILY. The team photo with strings between friends = GRAPH (social networks). Choose NoSQL for massive scale, flexible schema, or unstructured data."]], ["C6 · Data warehousing & BI", ["Operational data = current, detailed, read-write, kept in 3NF. Analytic data = historical, summarized, read-mostly, denormalized.", "Warehouse = the central integrated store of historical data. DATA MART = a department or subject subset. The refresh process = ETL.", "Moving-day ETL: EXTRACT = pack only what changed since the last trip. TRANSFORM = clean and repaint in the truck (cleanse, convert, AGGREGATE). LOAD = unload into the warehouse; Load's concern is refresh VOLUME and FREQUENCY. Boxes wait in the STAGING AREA between trips.", "Star schema (dimensional design): a central FACT table (measures + FKs) ringed by DIMENSION tables (descriptors). Fact table PK = a COMPOSITE of the dimension FKs. Dimension PK = a SURROGATE key.", "Column triage: a number you'd sum or average (Discount, Quantity, Revenue) -> FACT. A descriptor you'd filter or group by (DriverLicenseNumber, City) -> DIMENSION.", "Dimension hierarchy = drill-down levels (Year -> Quarter -> Month). Slowly changing dimensions TYPE 2 = keep history by inserting a NEW ROW per change.", "BI expected results: increased PROFITABILITY and THROUGHPUT. Not hardware savings, not reduced workloads.", "The county-fair mining tent: the judge sorts pies into KNOWN ribbon categories = CLASSIFICATION. The crowd clumps naturally with no signs = CLUSTERING. The guess-your-weight guy outputs a NUMBER = ESTIMATION. The fortune teller reads the FUTURE = PREDICTION. Corn dogs and lemonade sell TOGETHER = AFFINITY, 'between objects'."]], ["Low-probability extras: security & governance", ["Not a v5 competency and absent from the PFKO. Skim once, don't grind.", "CIA triad: Confidentiality, Integrity, Availability. Backups serve availability and recovery. GRANT/REVOKE = access control (DCL). Encryption = ciphertext at rest and in transit.", "Data governance = policies, roles, ownership, standards. Quality dimensions: accuracy, completeness, consistency, timeliness, validity."]]];
const $=s=>document.getElementById(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TABS=[["fc","Flashcards"],["mc","MCQs"],["sq","Sequencing"],["mt","Matching"],["nt","Notes"]];

TABS.forEach(([k,lbl],i)=>{const b=document.createElement("button");b.className="tab"+(i?"":" on");b.textContent=lbl;b.onclick=()=>showTab(k);b.id="t-"+k;$("tabs").appendChild(b)});
function showTab(k){TABS.forEach(([x])=>{$("t-"+x).classList.toggle("on",x===k);$(x+"-panel").classList.toggle("on",x===k)})}

/* FLASHCARDS */
let fcOrder=sh(FLASH.map((_,i)=>i)),fcI=0,fcFlip=false;
function fcRender(){
  const [term,def]=FLASH[fcOrder[fcI]];
  $("fc-panel").innerHTML=
   '<div class="bar"><button class="nav" id="fcShuf">shuffle</button><span class="pos">'+(fcI+1)+' / '+FLASH.length+'</span></div>'+
   '<div class="fc" id="fcCard"><div class="tag">'+(fcFlip?"definition":"term")+'</div>'+
   '<div class="face '+(fcFlip?"fcdef":"term")+'">'+esc(fcFlip?def:term)+'</div>'+
   '<div class="flip">tap to flip</div></div>'+
   '<div class="act"><button class="nav" id="fcPrev">‹ prev</button><button class="nav" id="fcNext">next ›</button></div>';
  $("fcCard").onclick=()=>{fcFlip=!fcFlip;fcRender()};
  $("fcShuf").onclick=()=>{fcOrder=sh(fcOrder);fcI=0;fcFlip=false;fcRender()};
  $("fcPrev").onclick=()=>{fcI=(fcI-1+FLASH.length)%FLASH.length;fcFlip=false;fcRender()};
  $("fcNext").onclick=()=>{fcI=(fcI+1)%FLASH.length;fcFlip=false;fcRender()};
}

/* MCQS */
const isMulti=i=>Array.isArray(MCQS[i][2]);
const corrSet=i=>new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]]);
let mcFilter="",mcList=[],mcI=0,mcOpts=[],mcDone=false,mcSel=new Set();
function mcBuild(){mcList=MCQS.map((_,i)=>i).filter(i=>!mcFilter||MCQS[i][4]===mcFilter);mcI=0;mcRender()}
function mcRender(){
  if(!mcList.length){$("mc-panel").innerHTML="<p>None.</p>";return}
  const i=mcList[mcI],m=MCQS[i],multi=isMulti(i);
  mcOpts=sh(m[1].map((t,oi)=>({oi,text:t})));mcDone=false;mcSel=new Set();
  const tops=[...new Set(MCQS.map(x=>x[4]))];
  let h='<div class="bar"><select id="mcTopic"><option value="">All topics</option>'+tops.map(t=>'<option'+(t===mcFilter?' selected':'')+'>'+t+'</option>').join('')+'</select><span class="pos">'+(mcI+1)+' / '+mcList.length+'</span></div>';
  h+='<div class="mcq"><div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="mcOpts">';
  mcOpts.forEach((o,d)=>{h+='<div class="opt" data-d="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></div>'});
  h+='</div>';
  if(multi)h+='<div class="act"><button class="check" id="mcChk">Check</button></div>';
  h+='<div class="exp" id="mcExp"></div></div>';
  h+='<div class="act"><button class="nav" id="mcPrev">‹ prev</button><button class="nav" id="mcNext">next ›</button></div>';
  $("mc-panel").innerHTML=h;
  $("mcTopic").onchange=()=>{mcFilter=$("mcTopic").value;mcBuild()};
  document.querySelectorAll("#mcOpts .opt").forEach(o=>o.onclick=()=>mcPick(+o.dataset.d));
  if(multi)$("mcChk").onclick=mcReveal;
  $("mcPrev").onclick=()=>{mcI=(mcI-1+mcList.length)%mcList.length;mcRender()};
  $("mcNext").onclick=()=>{mcI=(mcI+1)%mcList.length;mcRender()};
}
function mcPick(d){
  if(mcDone)return;const i=mcList[mcI];
  if(isMulti(i)){const el=document.querySelector('#mcOpts .opt[data-d="'+d+'"]');if(mcSel.has(d)){mcSel.delete(d);el.classList.remove("sel")}else{mcSel.add(d);el.classList.add("sel")}return}
  mcSel=new Set([d]);mcReveal();
}
function mcReveal(){
  mcDone=true;const i=mcList[mcI],cs=corrSet(i);
  const chosen=new Set([...mcSel].map(d=>mcOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#mcOpts .opt").forEach(el=>{const oi=mcOpts[+el.dataset.d].oi;el.style.pointerEvents="none";el.classList.remove("sel");
    if(cs.has(oi))el.classList.add("correct");else if(chosen.has(oi))el.classList.add("wrong");else el.classList.add("dim")});
  const e=$("mcExp");e.className="exp show";e.innerHTML="<b>"+(ok?"Correct.":"Answer above.")+"</b> "+esc(MCQS[i][3]);
}

/* SEQUENCING */
let sqI=0,sqOrder=[],sqPick=[];
function sqRender(){
  const [title,steps]=SEQ[sqI];sqPick=[];
  if(!sqOrder.length||sqOrder._for!==sqI){sqOrder=sh(steps.map((_,i)=>i));sqOrder._for=sqI}
  let h='<div class="bar"><select id="sqSel">'+SEQ.map((s,i)=>'<option'+(i===sqI?' selected':'')+'>'+esc(s[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap the steps in the correct order.</div><div id="sqList">';
  sqOrder.forEach(oi=>{h+='<button class="seqitem" data-oi="'+oi+'"><span class="num"></span><span>'+esc(steps[oi])+'</span></button>'});
  h+='</div><div class="act"><button class="check" id="sqChk">Check order</button><button class="nav" id="sqRst">reset</button></div><div class="res" id="sqRes"></div>';
  $("sq-panel").innerHTML=h;
  $("sqSel").onchange=()=>{sqI=$("sqSel").selectedIndex;sqOrder=[];sqRender()};
  document.querySelectorAll("#sqList .seqitem").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi;if(sqPick.includes(oi))return;sqPick.push(oi);
    b.classList.add("picked");b.querySelector(".num").textContent=sqPick.length;
  });
  $("sqChk").onclick=()=>{
    if(sqPick.length<steps.length){$("sqRes").textContent="Place all "+steps.length+" steps first.";return}
    let right=0;document.querySelectorAll("#sqList .seqitem").forEach(b=>{const oi=+b.dataset.oi;const pos=sqPick.indexOf(oi);
      b.classList.remove("ok","no");if(pos===oi){b.classList.add("ok");right++}else b.classList.add("no")});
    $("sqRes").innerHTML=right===steps.length?'<span style="color:var(--good)">Correct order ✓</span>':right+' / '+steps.length+' in the right spot. Red = wrong position.';
  };
  $("sqRst").onclick=()=>{sqRender()};
}

/* MATCHING */
let mtI=0,mtRight=[],mtLeftSel=null,mtPairs={};
function mtRender(){
  const [title,pairs]=MATCH[mtI];mtLeftSel=null;mtPairs={};
  mtRight=sh(pairs.map((p,i)=>({i,text:p[1]})));
  let h='<div class="bar"><select id="mtSel">'+MATCH.map((m,i)=>'<option'+(i===mtI?' selected':'')+'>'+esc(m[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap a term, then its match.</div><div class="cols"><div id="mtL"></div><div id="mtR"></div></div>';
  h+='<div class="act"><button class="check" id="mtChk">Check</button><button class="nav" id="mtRst">reset</button></div><div class="res" id="mtRes"></div>';
  $("mt-panel").innerHTML=h;
  let L='';pairs.forEach((p,i)=>{L+='<button class="mitem" data-li="'+i+'"><span>'+esc(p[0])+'</span></button>'});$("mtL").innerHTML=L;
  let R='';mtRight.forEach(r=>{R+='<button class="mitem" data-ri="'+r.i+'"><span>'+esc(r.text)+'</span></button>'});$("mtR").innerHTML=R;
  $("mtSel").onchange=()=>{mtI=$("mtSel").selectedIndex;mtRender()};
  document.querySelectorAll("#mtL .mitem").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#mtL .mitem").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");mtLeftSel=+b.dataset.li});
  document.querySelectorAll("#mtR .mitem").forEach(b=>b.onclick=()=>{
    if(mtLeftSel===null)return;const ri=+b.dataset.ri;
    Object.keys(mtPairs).forEach(k=>{if(mtPairs[k]===ri)delete mtPairs[k]});
    mtPairs[mtLeftSel]=ri;
    document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.toggle("matched",li in mtPairs);if(li===mtLeftSel)x.classList.remove("sel")});
    document.querySelectorAll("#mtR .mitem").forEach(x=>{const r=+x.dataset.ri;x.classList.toggle("matched",Object.values(mtPairs).includes(r))});
    mtLeftSel=null;
  });
  $("mtChk").onclick=()=>{
    let right=0;document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.remove("miss");
      if(mtPairs[li]===li)right++;else if(li in mtPairs)x.classList.add("miss")});
    $("mtRes").innerHTML=right===pairs.length?'<span style="color:var(--good)">All matched ✓</span>':right+' / '+pairs.length+' correct. Red = wrong match.';
  };
  $("mtRst").onclick=()=>mtRender();
}

/* NOTES */
function ntRender(){
  let h='';NOTES.forEach((n,i)=>{h+='<div class="note'+(i?'':' open')+'"><h3>'+esc(n[0])+'<span class="ch">'+(i?'+':'–')+'</span></h3><ul>'+n[1].map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>'});
  $("nt-panel").innerHTML=h;
  document.querySelectorAll(".note h3").forEach(hd=>hd.onclick=()=>{const n=hd.parentElement;n.classList.toggle("open");hd.querySelector(".ch").textContent=n.classList.contains("open")?'–':'+'});
}

fcRender();mcBuild();sqRender();mtRender();ntRender();showTab("fc");
</script></body></html>
