<script>
const TOPICS=[["1", "Strategic Human Resource Management"], ["2", "The Role of HRM in Business"], ["3", "The Legal Context of HRM"], ["4", "Analyzing Work and HR Planning"], ["5", "Sourcing and Recruiting"], ["6", "Selection and Hiring"], ["7", "Training and Development"], ["8", "Performance Management"], ["9", "Base Compensation"], ["10", "Incentives"], ["11", "Benefits"], ["12", "Creating a Healthy Work Environment"], ["13", "Employee-Management Relations"], ["14", "Managing Engagement and Turnover"]];
const NOTES={"1": "<p class=\"lede\">Competency 3020.1.2, strategic HRM. This topic is the map for the whole course: every later topic is one of the six functions below in detail. The test questions from here are mostly \"which function, which risk, which kind of reward, who does this.\"<\/p>\n\n<h3>The one idea<\/h3>\n<p>Employees create, carry out, and sustain every competitive advantage. HRM builds the system that <b>attracts, hires, develops, rewards, and retains<\/b> them, and it handles employment-law compliance. HRM never brings in revenue itself. It pays off through better performance, lower turnover, and less risk.<\/p>\n\n<h3>Should, can, will<\/h3>\n<p>HRM moves organizational performance through three levers. Most scenario questions in this topic are one of these in disguise.<\/p>\n<table><tr><th>Lever<\/th><th>Means<\/th><th>Shaped by<\/th><th>HRM tools<\/th><\/tr>\n<tr><td><b>Should<\/b> do<\/td><td>Direction<\/td><td>Strategy, competition, the law<\/td><td>HR planning, legal compliance<\/td><\/tr>\n<tr><td><b>Can<\/b> do<\/td><td>Ability<\/td><td>Who you hire, how you train<\/td><td>Staffing, training and development<\/td><\/tr>\n<tr><td><b>Will<\/b> do<\/td><td>Motivation<\/td><td>Goals, feedback, rewards<\/td><td>Performance management, compensation<\/td><\/tr><\/table>\n<div class=\"mn\"><b>Memory hook.<\/b> Think of a mission. <b>Should<\/b> = the orders. <b>Can<\/b> = whether you were trained for it. <b>Will<\/b> = whether you care enough to do it well. Missing any one and the mission fails.<\/div>\n<p class=\"cut\">Untrained people making errors → <b>can<\/b>. People chasing the wrong target because of how they're paid → <b>will<\/b>. Workforce planning off the strategy, or a legal requirement → <b>should<\/b>.<\/p>\n\n<h3>The six HRM functions<\/h3>\n<div class=\"mn\"><b>Sergeants Train Privates, Reward Hard Effort.<\/b> Picture a drill field: a sergeant trains a private, then hands over a reward for the hard effort. <b>S<\/b>taffing, <b>T<\/b>raining and development, <b>P<\/b>erformance management, <b>R<\/b>ewards and benefits, <b>H<\/b>ealth and safety, <b>E<\/b>mployee-management relations.<\/div>\n<table><tr><th>Function<\/th><th>What it covers<\/th><th>Watch for<\/th><\/tr>\n<tr><td>Staffing<\/td><td>Planning, acquiring, deploying, retaining. Talent moving into, through, and out of the firm.<\/td><td>Layoffs, firings, and quits are staffing too. Sourcing finds people, recruiting attracts them.<\/td><\/tr>\n<tr><td>Training and development<\/td><td>Building capabilities, career planning, organizational development.<\/td><td>Succession planning lives here. Don't over-invest where turnover is huge.<\/td><\/tr>\n<tr><td>Performance management<\/td><td>Align individual goals with company goals, appraise, suggest improvements.<\/td><td>Needs specific goals and frequent feedback. Feedback also keeps behavior ethical.<\/td><\/tr>\n<tr><td>Rewards and benefits<\/td><td>Total rewards (next section).<\/td><td>Stock options are direct pay.<\/td><\/tr>\n<tr><td>Health and safety<\/td><td>Safety = toxins, accidents, injuries. Health = physical and mental wellbeing.<\/td><td>Wellness and stress programs are health, not safety.<\/td><\/tr>\n<tr><td>Employee-management relations<\/td><td>Relationship between employees and owners. Unions, bargaining, surveys.<\/td><td>Matters in union and nonunion firms. Company must recognize a union and bargain in good faith.<\/td><\/tr><\/table>\n<p><b>The functions are one system.<\/b> If training teaches a skill but pay and feedback ignore it, the skill dies. If even one function pulls against the rest, strategy execution suffers. When an answer choice says the functions must \"reinforce each other\" or be \"consistent in what they reinforce,\" that's the one.<\/p>\n\n<h3>Total rewards<\/h3>\n<table><tr><th>Type<\/th><th>What it is<\/th><th>Examples<\/th><\/tr>\n<tr><td><b>Direct<\/b> financial<\/td><td>Money paid to you<\/td><td>Salary, wages, commissions, stock options, bonuses<\/td><\/tr>\n<tr><td><b>Indirect<\/b> financial<\/td><td>Benefits with money value<\/td><td>Health insurance, wellness, paid vacation, retirement, free meals<\/td><\/tr>\n<tr><td><b>Nonfinancial<\/b><\/td><td>Not money at all<\/td><td>Feeling appreciated, the work itself, flexible hours, casual dress<\/td><\/tr><\/table>\n<div class=\"mn\"><b>Memory hook.<\/b> Payday. <b>Direct<\/b> lands in your bank account. <b>Indirect<\/b> is the stuff on the benefits page of the offer letter. <b>Nonfinancial<\/b> is why you'd still like the job if both of those were average.<\/div>\n<p>Always compare offers on total rewards, not salary. High pay can be a competitive advantage (Costco: double the market rate, repaid through low turnover and high productivity), but paying top dollar is a waste if the job doesn't need top talent.<\/p>\n\n<h3>Four risks HRM manages<\/h3>\n<div class=\"mn\"><b>Some Officers Fear Court.<\/b> <b>S<\/b>trategic, <b>O<\/b>perational, <b>F<\/b>inancial, <b>C<\/b>ompliance. Court is the legal one.<\/div>\n<table><tr><th>Risk<\/th><th>Cue words<\/th><\/tr>\n<tr><td>Strategic<\/td><td>Talent strategy, culture, ethics, investing in people, change initiatives<\/td><\/tr>\n<tr><td>Operational<\/td><td>Executing the strategy: hiring speed and quality, developing skills, keeping top performers<\/td><\/tr>\n<tr><td>Financial<\/td><td>Cost and productivity: compensation, benefits, turnover, overtime, time-to-hire, errors, delays<\/td><\/tr>\n<tr><td>Compliance<\/td><td>Legal: diversity, health and safety, unions, whistleblowers, harassment<\/td><\/tr><\/table>\n<p class=\"cut\">Ethics and culture → <b>strategic<\/b> (not compliance). Anything about dollars → <b>financial<\/b>. Anything about law → <b>compliance<\/b>.<\/p>\n<p>Also know: Moody's uses HRM factors in bond ratings, so good HRM lowers the interest rate a company pays to borrow.<\/p>\n\n<h3>Strategy vocabulary<\/h3>\n<table><tr><th>Term<\/th><th>Meaning<\/th><\/tr>\n<tr><td>Business strategy<\/td><td>How the firm will compete in its market<\/td><\/tr>\n<tr><td>Competitive advantage<\/td><td>Doing something differently that lets you outperform. Porter: superior value for the money.<\/td><\/tr>\n<tr><td>Talent philosophy<\/td><td>Beliefs about how employees should be treated. Set by founders. Diversity, ethics, short stay vs career, assets vs investors.<\/td><\/tr>\n<tr><td>Human resource strategy<\/td><td>Links the whole HR function to the business strategy<\/td><\/tr><\/table>\n\n<h3>Match the HRM to the competitive advantage<\/h3>\n<table><tr><th>Advantage<\/th><th>Examples<\/th><th>HRM that fits<\/th><\/tr>\n<tr><td>Operational excellence (low cost)<\/td><td>Discount retailers<\/td><td>Tight margins, teamwork over stars, modest pay. Hire people who follow procedures and control costs.<\/td><\/tr>\n<tr><td>Product innovation<\/td><td>Apple, Nintendo, 3M, pharma<\/td><td>Innovative culture. Hire creative, analytical team players. Reward persistence.<\/td><\/tr>\n<tr><td>Customer focus and customization<\/td><td>Starbucks, consulting, banking<\/td><td>Active learners, customer skills, emotional resilience. Cut HR investment and the advantage erodes.<\/td><\/tr>\n<tr><td>Growth<\/td><td>Chipotle, Panera<\/td><td>Organic = recruit, select, train. M&amp;A = check culture fit, because mergers fail on culture, not money or tech.<\/td><\/tr><\/table>\n\n<h3>Global issues<\/h3>\n<p><b>Global mindset<\/b> = attributes that let you influence people from different cultural systems. It is learned, so experience can build it or damage it. HSBC builds it with long international assignments.<\/p>\n<p><b>Power distance.<\/b> Small gap between boss and employee: US, Sweden, Germany. Large gap: Japan, Mexico. In high power-distance, paternalistic cultures, managers tend not to give job enrichment or empowerment. Match HRM practices to the culture.<\/p>\n<p><b>Volunteers and NGOs.<\/b> No pay lever. Use clear goals, training, feedback, flexibility, and appreciation.<\/p>\n\n<h3>Who does HRM<\/h3>\n<table><tr><th>Who<\/th><th>Role<\/th><\/tr>\n<tr><td>HRM professionals<\/td><td>Not the police. Align HR with business strategy, build supervisors' skills, act as a resource, <b>manage organizational change<\/b>. Need business acumen.<\/td><\/tr>\n<tr><td>Managers<\/td><td>Every supervising manager carries out HRM. HR supplies tools, managers have to use them.<\/td><\/tr>\n<tr><td>Employees<\/td><td>Lead their own career development. Learn policy from the <b>employee handbook<\/b>.<\/td><\/tr>\n<tr><td>Shared service center<\/td><td><b>Internal<\/b> unit centralizing routine HR (payroll, benefits admin, exit surveys)<\/td><\/tr>\n<tr><td>Outside vendors<\/td><td><b>Outsourcing<\/b>. External company does the task. Popular with small firms.<\/td><\/tr>\n<tr><td>PEO<\/td><td><b>Leases<\/b> workers for 2 to 7% of gross wages and is technically their employer. Don't need them anymore? Don't renew.<\/td><\/tr><\/table>\n<div class=\"mn\"><b>Memory hook.<\/b> Three ways to get payroll off HR's desk. <b>Shared service center<\/b> = our own people, one room. <b>Outsourcing<\/b> = someone else's people do the task. <b>PEO<\/b> = someone else's people ARE the employees.<\/div>\n<p><b>HRMS<\/b> (human resource management system): the technology platform for records, recruiting metrics, and analytics. Choose one based on how the company will actually use it.<\/p>\n\n<h3>Cases worth knowing<\/h3>\n<table><tr><th>Company<\/th><th>Point<\/th><\/tr>\n<tr><td>Patagonia<\/td><td>HR practices reinforce culture and strategy. 4% turnover.<\/td><\/tr>\n<tr><td>SAS<\/td><td>Trust culture and rich benefits. \"Happy employees. Great work. No coincidence.\"<\/td><\/tr>\n<tr><td>IBM<\/td><td>Split admin HR from strategic HR, used global service centers, moved to continuous feedback.<\/td><\/tr>\n<tr><td>Wells Fargo<\/td><td>Quotas and incentives drove fraud. Think through unintended consequences.<\/td><\/tr>\n<tr><td>Costco<\/td><td>High pay pays for itself.<\/td><\/tr>\n<tr><td>Citigroup vs Google<\/td><td>No succession plan vs a planned handoff.<\/td><\/tr>\n<tr><td>Caribou Coffee<\/td><td>Careful staffing of store managers raised revenue.<\/td><\/tr>\n<tr><td>Mattel<\/td><td>Made managers partners with HR in managing talent.<\/td><\/tr><\/table>\n\n<h3>Quick facts<\/h3>\n<p>First personnel department: National Cash Register, 1901, after a strike, focused on compliance and records. HRM became strategic once technology took over the transactional work. Small firms (under 500 workers) are 99%+ of businesses, and their top HR problems are recruitment and training. SHRM is the largest HRM professional body, and its code says HR adds value and contributes to the ethical success of the organization. Union membership in 2019: 33.6% public sector, 6.2% private.<\/p>\n"};
const FLASHCARDS=[["Human resource management (HRM)", "The function that attracts, hires, develops, rewards, and retains talent. Also owns employment-law compliance.", "1"], ["Competitive advantage", "Doing something differently from competitors that lets you outperform them. It's always employees who create, carry out, or sustain it.", "1"], ["Three ways HRM drives performance", "What employees SHOULD do (direction), CAN do (ability), WILL do (motivation). When all three line up, work processes are most effective.", "1"], ["SHOULD do: what shapes it?", "Strategy, competitive environment, and the law. HR planning and legal compliance.", "1"], ["CAN do: what shapes it?", "Staffing (bring ability in) and training and development (build it). The foundation of effective HRM.", "1"], ["WILL do: what shapes it?", "Performance management (goals + feedback) and compensation (rewards). People do what they're rewarded for.", "1"], ["The six HRM functions", "Staffing. Training and development. Performance management. Rewards and benefits. Health and safety. Employee-management relations. (Sergeants Train Privates, Reward Hard Effort.)", "1"], ["Staffing", "Planning, acquiring, deploying, and retaining employees. Talent moving INTO, THROUGH, and OUT OF the organization, so layoffs and quits count too.", "1"], ["Sourcing vs recruiting", "Sourcing finds people likely to meet the job's requirements. Recruiting gets them to apply, keeps them in the pool, and gets them to accept.", "1"], ["Training and development", "Builds employee capabilities, formal and informal. Also covers career planning, organizational development, succession planning, and often legal-compliance training.", "1"], ["Succession planning", "Having people ready to step into key roles. Citigroup didn't (drifted with no CEO). Google did (Pichai worked beside Page for years).", "1"], ["Performance management", "Aligning individual goals and behavior with organizational goals, appraising performance, and suggesting improvements. Runs on specific goals + frequent feedback.", "1"], ["Total rewards", "Everything of value an employee gets from the job: direct pay + indirect (benefits) + nonfinancial.", "1"], ["Direct financial compensation", "Salary, wages, commissions, STOCK OPTIONS, bonuses. Money paid to you.", "1"], ["Indirect financial compensation", "Benefits: health insurance, wellness, paid vacation, retirement, free meals. Worth money, but not pay.", "1"], ["Nonfinancial compensation", "Rewards that aren't money: feeling successful or appreciated, the work itself, flexible hours, casual dress.", "1"], ["Workplace safety vs workplace health", "Safety = protecting people from toxins, accidents, injuries. Health = physical and mental wellbeing (wellness programs, stress).", "1"], ["Employee-management relations", "The relationship between employees and the owners of capital. Sets the employment rights of both sides. Matters in union AND nonunion firms.", "1"], ["Union facts from Topic 1", "If employees want a union, the company must recognize it and bargain in good faith. Result = collective bargaining agreement. 2019 membership: 33.6% public sector, 6.2% private.", "1"], ["Four HRM risk types", "Strategic, Operational, Financial, Compliance. (Some Officers Fear Court.)", "1"], ["Strategic risk cues", "Talent strategy, culture, ethics, investments in people, change initiatives.", "1"], ["Operational risk cues", "Ability to execute the strategy: speed and quality of hiring, developing skills, keeping top performers.", "1"], ["Financial risk cues", "Workforce cost and productivity: compensation, benefits, turnover, overtime, time-to-hire, errors, accidents, delays.", "1"], ["Compliance risk cues", "Legal: diversity, health and safety, union relations, whistleblowers, harassment.", "1"], ["Moody's and HRM", "Recruiting, retention, leadership development, and training now affect Moody's bond ratings, so good HRM lowers the interest rate a company pays to borrow.", "1"], ["Is HRM a revenue generator?", "No, never. Its payoff comes through higher performance, stronger capability, lower turnover, and risk-management savings.", "1"], ["Business strategy", "How the firm will compete in its marketplace. Reflects what customers want, what the firm wants, and what it can cost-effectively deliver.", "1"], ["Talent philosophy", "Beliefs about how employees should be treated: value on diversity, ethics, short stay vs whole career, assets to manage vs investors of their time. Usually set by founders.", "1"], ["Human resource strategy", "Links the entire HR function to the business strategy.", "1"], ["Porter on competitive advantage", "You must give customers superior value for their money: a better product worth a premium, or a good product for less.", "1"], ["HRM fit: operational excellence", "Tight margins, teamwork over stars, usually can't pay high. Hire people who follow consistent procedures and control costs.", "1"], ["HRM fit: product innovation", "Apple, Nintendo, 3M. Build an innovative culture. Hire creative, analytical team players. Motivate persistence.", "1"], ["HRM fit: customer focus", "Starbucks. Consulting, retail, banking. Hire active learners with customer skills and emotional resilience. Cut HR investment and the advantage erodes.", "1"], ["Growth strategy: two routes", "Organic (expand from within, so invest in recruiting, selecting, training) or mergers and acquisitions (can also be a way to acquire talent).", "1"], ["Why mergers fail", "Culture, not finances or technology. DaimlerChrysler, HP-Compaq, AOL-Time Warner.", "1"], ["Global mindset", "Attributes that let you influence people from different cultural and institutional systems. It's LEARNED. HSBC builds it with long international assignments.", "1"], ["Power distance and HRM", "Small gap: US, Sweden, Germany. Large gap: Japan, Mexico. In high power-distance cultures, managers tend not to offer job enrichment or empowerment.", "1"], ["Managing volunteers", "No pay lever, so use flexibility, clear goals, training, feedback, and appreciation. (Railroad museum: 200 thank-you cards per supervisor per year.)", "1"], ["Who does HRM? (six)", "HRM professionals, managers, employees, shared service centers, outside vendors, professional employer organizations.", "1"], ["HRM professionals' role", "NOT the police. Align HR strategy with business strategy, build supervisors' skills, act as a resource, manage organizational change. Need business acumen.", "1"], ["The manager's role in HRM", "Every supervising manager carries out HRM. HR is a support function that supplies the tools. Tools unused = no value. (Mattel made managers partners with HR.)", "1"], ["The employee's role in HRM", "Lead your own career development. Help keep your skills and certifications current in the HR system.", "1"], ["Employee handbook", "Documents the organization's HRM policies and procedures. The best tool for helping employees learn them.", "1"], ["Shared service center", "INTERNAL unit that centralizes routine transactional HR (payroll, benefits admin, exit surveys). Alternative to outsourcing.", "1"], ["Outsourcing", "Paying an EXTERNAL vendor to do the work. Common: payroll, time and attendance, benefits. Especially attractive to small firms.", "1"], ["Professional employer organization (PEO)", "Leases workers to companies for 2 to 7 percent of gross wages. The PEO is technically the employer. Flexibility: just don't renew the lease.", "1"], ["HRMS", "Human resource management system. Technology platform for employee records, recruiting metrics, and analytics. Pick one based on how you'll actually use it.", "1"], ["IBM's HR transformation", "Split core HR (policy design, consulting) from admin (payroll, data entry), sent admin to global service centers, and swapped annual reviews for continuous feedback (Checkpoint app).", "1"], ["SHRM", "Society for Human Resource Management. World's largest HRM professional association. Code core principle: add value and contribute to the ETHICAL success of the organization.", "1"], ["History of HRM in one line", "1901 National Cash Register 'Personnel' dept after a strike (compliance, records), then labor relations, then post-WWII hiring and training, then 1980s change, culture, M&A, then tech made it strategic.", "1"], ["Small organizations and HRM", "Under 500 workers = 99%+ of businesses, about half the workforce. Often no HR function. Recruitment and training are their top problems. HRM is an investment, not just an expense.", "1"], ["Wells Fargo lesson", "5,000+ fired for fake accounts opened to hit quotas. Think through the unintended consequences of incentive plans.", "1"], ["Costco lesson", "Pays about double the market rate, yet similar return on labor cost through lower turnover and higher productivity. High pay can be a competitive advantage.", "1"], ["Patagonia lesson", "HR reinforces culture and strategy: hires for environmental values ('What drew you here?'), 2 months paid volunteer leave, on-site childcare. 4% turnover.", "1"], ["SAS lesson", "'Happy employees. Great work. No coincidence.' Trust culture, results-based performance, rich benefits, low turnover.", "1"], ["Caribou Coffee lesson", "The most important district manager skill was staffing the store manager job well instead of promoting by tenure. Staffing hits revenue.", "1"]];
const MCQS=[["A bank's strategy is premium personal service, but tellers are paid bonuses for the number of customers served per hour. Which HRM problem does this show?", ["Rewards are misaligned with what the strategy needs", "Staffing failed to supply tellers with enough ability", "Training never covered the bank's service standards", "Safety rules are slowing down the bank's teller lines"], 0, "People do what they're rewarded for doing. Rewards have to match the behavior the strategy needs. This is the 'will do' lever pointed the wrong way.", "1", "1-c5ba5f09"], ["A hospital buys a complex new infusion pump. Nurses want to do well but keep making errors because nobody showed them how to use it. Which lever of HRM influence broke down?", ["What employees can do", "What employees may do", "What employees will do", "What employees should do"], 0, "CAN = ability. Staffing and training build it. The nurses had the motivation (will) and the direction (should), just not the skill.", "1", "1-14b80b4e"], ["After choosing a growth strategy, leaders work out how many engineers and which skills they'll need in two years. This HR planning mainly shapes what employees ____.", ["should do", "can do", "will do", "want to do"], 0, "SHOULD = direction. It comes from strategy, the competitive environment, and the law. HR planning and legal compliance live here.", "1", "1-290ed6eb"], ["Clear goals, regular feedback, and pay tied to results mainly influence what employees ____.", ["will do", "can do", "should do", "may do"], 0, "WILL = motivation. Performance management and compensation drive effort and persistence.", "1", "1-cd6b3295"], ["Which pair of HRM functions builds what employees CAN do?", ["Staffing, and training and development", "Performance management, and rewards", "HR planning, and legal compliance", "Health and safety, and labor relations"], 0, "Staffing brings ability in the door, training develops it. The text calls these two the foundation of effective HRM.", "1", "1-b5aa0b8a"], ["A retailer lays off 40 workers during a restructuring. Which HRM function owns this activity?", ["Staffing", "Performance management", "Employee-management relations", "Training and development"], 0, "Staffing covers talent moving into, through, AND out of the organization. Layoffs, firings, and quits all count.", "1", "1-b75cfad2"], ["A call center adopts new software and the agents' skills are suddenly out of date. Which HRM function is responsible for closing the gap?", ["Training and development", "Performance management", "Rewards and benefits", "Staffing"], 0, "Training and development builds employee capabilities to meet changing business needs.", "1", "1-32abae80"], ["A CEO resigns without warning. The board has nobody prepared, and the firm drifts for months while rivals pull ahead. Which activity was neglected?", ["Succession planning", "Performance appraisal", "Compensation surveys", "Workforce outsourcing"], 0, "This is the Citigroup story. Google did the opposite: Pichai worked alongside Page for years before taking over.", "1", "1-fe610517"], ["Succession planning and career development fall under which HRM function?", ["Training and development", "Staffing", "Performance management", "Employee-management relations"], 0, "The text places career planning, organizational development, and succession planning under training and development.", "1", "1-e3923399"], ["A manager sets quarterly goals tied to the company plan, reviews each rep's results, and coaches them on how to improve. Which HRM function is this?", ["Performance management", "Training and development", "Rewards and benefits", "Staffing"], 0, "Performance management = align individual goals with organizational goals, appraise performance, suggest improvements.", "1", "1-06ac9197"], ["Besides helping employees adjust their behavior, what does the text say is important for maintaining ethical behavior and communicating expectations?", ["Regular performance feedback", "Larger team incentive bonuses", "Annual exit interviews", "Stricter hiring quotas"], 0, "Performance feedback does double duty: it guides performance and keeps behavior ethical. Big incentives do the opposite (see Wells Fargo).", "1", "1-9041dae8"], ["A job offer includes a signing bonus and stock options. How are these two items classified?", ["Direct financial compensation", "Indirect financial compensation", "Nonfinancial compensation", "Deferred benefit compensation"], 0, "Direct = salary, wages, commissions, stock options, bonuses. Stock options are the trap: they feel like a perk, but the text lists them as direct.", "1", "1-79e66e4f"], ["Employer-paid health insurance, paid vacation, and free lunches are examples of ____.", ["indirect financial compensation", "direct financial compensation", "nonfinancial compensation", "variable incentive compensation"], 0, "Indirect = benefits. They have financial value but aren't pay.", "1", "1-eb64e84a"], ["A nurse says the best parts of her job are feeling appreciated by patients and her flexible schedule. These are examples of ____.", ["nonfinancial compensation", "indirect financial compensation", "direct financial compensation", "total financial compensation"], 0, "Nonfinancial = intrinsic rewards from the job itself or the work environment. Flexible hours and casual dress also land here.", "1", "1-81b5f400"], ["Job A pays $70,000 with full benefits and tuition help. Job B pays $76,000 with almost no benefits. What does the text advise?", ["Compare the total rewards of each offer", "Choose the offer with the higher base pay", "Compare only the direct compensation", "Weigh only the nonfinancial rewards"], 0, "Total rewards = direct + indirect + nonfinancial. A lower salary can be worth more once benefits are counted.", "1", "1-bab42cf2"], ["Costco pays far above market and above Sam's Club, yet earns a similar return on its labor costs. Why?", ["Lower turnover and higher productivity", "Leaner benefits and smaller store crews", "Higher prices and larger store footprints", "Outsourced payroll and leased store labor"], 0, "High pay can be a competitive advantage when it buys retention and productivity.", "1", "1-62ce2ed1"], ["A firm requires an MBA for every marketing job and pays a premium for it, even though most of the work doesn't need one. What is the text's view?", ["The extra productivity often won't offset the extra pay", "Premium pay reliably produces a competitive advantage", "Credential rules may lower the firm's compliance risk", "Top talent removes the need for employee training"], 0, "Paying top dollar isn't always the best strategy if the company doesn't need top talent for that role.", "1", "1-bc44eab1"], ["HR launches an ethics-awareness program and works to reshape the company culture. Which type of risk is HR managing?", ["Strategic risk", "Operational risk", "Financial risk", "Compliance risk"], 0, "Strategic risk cues: talent strategy, culture, ethics, investments in people, change initiatives.", "1", "1-2703cc50"], ["Open engineering jobs take so long to fill that a product launch slips, and two top performers quit. Which type of risk is this?", ["Operational risk", "Strategic risk", "Financial risk", "Compliance risk"], 0, "Operational risk = ability to EXECUTE the strategy. Cues: speed and effectiveness of hiring, developing skills, retaining top performers. Trap: the text lists 'time-to-hire' as a COST measure under financial risk. If the scenario is about executing the strategy, it's operational. If it's about dollars, it's financial.", "1", "1-462dec8a"], ["HR tracks overtime, turnover costs, and compensation spending to protect workforce productivity. Which type of risk is this?", ["Financial risk", "Strategic risk", "Operational risk", "Compliance risk"], 0, "Financial risk cues: compensation, benefits, turnover, overtime, time-to-hire, plus errors, accidents, delays, lost production.", "1", "1-056c481c"], ["HR reviews how the company handles harassment complaints, whistleblowers, and safety rules. Which type of risk is this?", ["Compliance risk", "Strategic risk", "Operational risk", "Financial risk"], 0, "Compliance risk = legal. Cues: diversity, health and safety, union relations, whistleblowers, harassment.", "1", "1-c7bae338"], ["Moody's now considers recruiting, retention, and leadership development when it rates companies. Through this, good HRM can lower ____.", ["the interest rate the company pays to borrow", "the tax rate the company pays on its payroll", "the premium the company pays for insurance", "the dividend the company pays to investors"], 0, "Better HRM, better bond rating, cheaper credit.", "1", "1-859da315"], ["Which statement about the HRM department is NOT supported by the text?", ["It directly generates revenue for the firm", "It lowers the firm's employment legal liability", "It improves the firm's ability to manage change", "It links rewards fairly to employee performance"], 0, "The text says HRM will never be a revenue generator. Its return comes through performance, capability, lower turnover, and risk management.", "1", "1-c90a05b3"], ["A company's plan for how it will compete in its marketplace is its ____.", ["business strategy", "talent philosophy", "human resource strategy", "competitive advantage"], 0, "Business strategy = how the firm competes. It reflects what customers want, what the firm wants, and what it can cost-effectively deliver.", "1", "1-efcd584a"], ["A firm's founders believe employees should be treated as partners and kept for their whole careers. This system of beliefs is the firm's ____.", ["talent philosophy", "business strategy", "human resource strategy", "global mindset"], 0, "Talent philosophy = beliefs about how employees should be treated: value on diversity, ethics, short stay vs career, assets vs investors.", "1", "1-dd082d5d"], ["An organization's talent philosophy is typically shaped by ____.", ["company founders", "HRM professionals", "line supervisors", "outside vendors"], 0, "Founders set it. HR then carries it out.", "1", "1-e7bf5ac2"], ["What links all of the HR functions to the way the firm has chosen to compete?", ["Human resource strategy", "Talent philosophy", "Employee handbook", "Professional employer contract"], 0, "Chain of command: business strategy at the top, HR strategy links to it, talent philosophy guides it, the six functions carry it out.", "1", "1-1deaa8a7"], ["According to Michael Porter, a company with a competitive advantage must ultimately give customers ____.", ["superior value for their money", "the lowest price in its market", "the newest product in its market", "the widest selection of products"], 0, "Value = a mix of quality, service, and acceptable price. It can be a better product at a premium OR a good product for less.", "1", "1-e30663f7"], ["A discount grocer competes on low cost with tight margins. Which HRM approach fits this strategy?", ["Hire people who follow set procedures and control costs", "Hire creative people who challenge the set procedures", "Offer premium pay to attract individual star talent", "Reward individual results ahead of any team results"], 0, "Operational excellence: tight margins, teamwork over individual stars, usually can't offer high pay, needs consistent procedure-followers.", "1", "1-bab871d8"], ["A pharmaceutical firm competes on product innovation. Beyond related job experience, what should it assess when hiring?", ["Creativity, analytical skill, and teamwork", "Seniority, tenure, and cost discipline", "Rule-following, speed, and consistency", "Sales record, charm, and local connections"], 0, "Innovation strategy (Apple, Nintendo, 3M): HRM builds an innovative culture, hires creative analytical team players, motivates persistence.", "1", "1-bcd43e8f"], ["A coffee chain charges premium prices because of its customer relationships. It cuts benefits and hires cheaper staff who dislike dealing with customers. What is the likely result?", ["Its advantage erodes and its prices have to fall", "Its labor savings lift profit with no service loss", "Its product pipeline slows and its menu goes stale", "Its legal exposure shrinks along with its payroll"], 0, "The Starbucks example. Talent is the most critical element of a customer-oriented company.", "1", "1-51033255"], ["Which hiring profile best supports a customer-oriented competitive advantage?", ["Active learners with people skills and emotional resilience", "Procedure followers with cost discipline and steady routines", "Technical experts with patents and research credentials", "Senior managers with merger and acquisition experience"], 0, "Straight from the customer-intimacy section: active learners, good customer relations skills, emotional resilience under pressure.", "1", "1-e8292208"], ["A restaurant chain grows by opening new locations with its own people and money. This is ____.", ["organic growth", "merger growth", "acquired growth", "leased growth"], 0, "Organic = expanding from within. It requires investing in recruiting, selecting, and training. The other route is mergers and acquisitions.", "1", "1-cf19ad66"], ["Two banks merge. The finances and the IT systems fit together well, but the combined firm underperforms and talented people leave. What is the most likely cause?", ["Mismatched cultures and values", "Mismatched debts and balance sheets", "Mismatched software and systems", "Mismatched products and prices"], 0, "M&A usually fails on culture, not technical or financial issues. DaimlerChrysler, HP-Compaq, AOL-Time Warner.", "1", "1-b8c32416"], ["HSBC sends promising managers on long assignments in several countries. What is it trying to build?", ["A global mindset", "A talent philosophy", "A shared service center", "A compliance program"], 0, "Global mindset = attributes that let you influence people from different cultural and institutional systems.", "1", "1-f28630f0"], ["Which statement about global mindset matches the text?", ["It is learned, so experience can help or hurt it", "It is innate, so firms must screen for it at hire", "It is fixed, so training has little effect on it", "It is cultural, so it only matters for expatriates"], 0, "Because it's learned, experiences can influence it in a positive or negative way.", "1", "1-53e83bd0"], ["In paternalistic, high power-distance cultures, managers tend NOT to ____.", ["give employees job enrichment and empowerment", "give employees close direction and supervision", "respect the formal ranks in the hierarchy", "make decisions on behalf of their employees"], 0, "If big power gaps feel legitimate, supervisors are uncomfortable with HRM practices that promote autonomy and development.", "1", "1-a4c1df8c"], ["Which pair of countries does the text describe as having a LARGE power difference between supervisors and employees?", ["Japan and Mexico", "Sweden and Germany", "United States and Sweden", "Germany and United States"], 0, "Small power difference: United States, Sweden, Germany. Large: Japan, Mexico.", "1", "1-878cd8c8"], ["A relief organization runs on unpaid volunteers, so it has no financial incentives to offer. What does the text recommend instead?", ["Clear goals, regular feedback, and appreciation", "Small stipends, gift cards, and prize raffles", "Strict quotas, written warnings, and fast dismissal", "Longer shifts, fewer roles, and less training"], 0, "Volunteers run on intangible rewards. Flexibility, goal setting, training, feedback, thanks. The railroad museum gives supervisors 200 thank-you cards a year.", "1", "1-13f6f0ec"], ["Which party is responsible for managing organizational change such as expansion, restructuring, and downsizing?", ["HRM professionals", "Line managers", "Shared service centers", "Outside vendors"], 0, "HRM professionals manage change. They also align HR strategy with business strategy, coach supervisors, and need real business acumen.", "1", "1-4ccdd993"], ["HR builds a structured interview guide, but supervisors ignore it and hire on gut feel. What does this illustrate?", ["HRM's value depends on managers carrying it out", "HRM's tools should be run by outside vendors", "HRM's policies should be written by managers", "HRM's main role is to police managers' decisions"], 0, "Policies are created by the company but EXECUTED by managers. HR is a support function. The text also says HR pros are 'not the organization's police.'", "1", "1-d3a76a9e"], ["According to the text, which HRM responsibility increasingly belongs to individual employees?", ["Leading their own career development", "Designing their own pay structure", "Drafting their own job descriptions", "Auditing their own safety records"], 0, "Employees take the lead on their own development and help keep their skills and certifications current in the HR system.", "1", "1-8497a378"], ["What is the best tool for helping employees learn the organization's HRM policies and procedures?", ["Employee handbook", "Union contract", "Values statement", "Code of ethics"], 0, "Handbooks document HRM policies and procedures. Many are online now.", "1", "1-08d0b690"], ["A company pulls payroll, benefits administration, and exit surveys into one internal unit that serves every division. This is ____.", ["a shared service center", "a professional employer organization", "an outsourcing arrangement", "a human resource management system"], 0, "Shared service center = INTERNAL centralization of routine transactional HR work. It's an alternative to outsourcing.", "1", "1-b61508f5"], ["A 30-person firm pays an external company to process its payroll and manage its benefits. This is ____.", ["outsourcing", "a shared service center", "employee leasing", "succession planning"], 0, "Outsourcing = hiring an external vendor to do the work. Especially attractive to small firms. Most common: payroll, time and attendance, benefits.", "1", "1-696e6b1c"], ["A startup gets its staff from a company that remains the workers' legal employer and handles their payroll, discipline, and benefits for a fee of 2 to 7 percent of wages. This company is ____.", ["a professional employer organization", "a shared service center", "an outsourced payroll vendor", "a human resource management system"], 0, "PEO = leases workers and IS technically their employer. The 2 to 7 percent of gross wages fee is the giveaway.", "1", "1-6a376999"], ["What flexibility advantage does leasing workers through a PEO give a company?", ["It can simply not renew the lease in a downturn", "It can pay leased workers below minimum wage", "It can skip all training for the leased workers", "It can ignore employment laws for leased staff"], 0, "Instead of laying off permanent employees, the company just doesn't renew the lease.", "1", "1-909c5409"], ["IBM separated core HR roles, like designing policy and internal consulting, from administrative tasks like payroll and data entry. What was the main purpose?", ["Free HR to focus on strategy while cutting costs", "Move HR decisions to each line supervisor", "Replace HR professionals with outside vendor staff", "Shift HR's focus back to legal record-keeping"], 0, "Admin work went to global employee service centers. HR pros got time for talent, skills, and growth. IBM also replaced annual reviews with continuous feedback (Checkpoint).", "1", "1-aee1d023"], ["When choosing a human resource management system (HRMS), what should drive the decision?", ["How the company will actually use the system", "How many features the platform has in total", "How recently the platform was first released", "How many competitors already use the system"], 0, "There are so many features available that actual use has to drive the pick. If employees and managers use it too, it must be easy for them.", "1", "1-3b23d5de"], ["The earliest personnel departments, starting with National Cash Register in 1901, focused mainly on ____.", ["legal compliance and record-keeping", "culture change and employee motivation", "mergers and strategic talent planning", "analytics and cloud-based HR platforms"], 0, "Timeline: 1901 compliance and records, then labor relations, then post-WWII efficiency and hiring/training, then 1980s change, M&A, motivation, culture.", "1", "1-8075fce7"], ["How has technology changed the HRM function since the 1980s?", ["It made HRM more strategic and less transactional", "It made HRM a direct source of the firm's revenue", "It moved HRM back toward payroll and records", "It removed managers from all HRM activities"], 0, "Transactional work like paychecks is now automated or outsourced, so HRM can focus on aligning talent with business strategy.", "1", "1-a854be18"], ["According to studies cited in the text, which two HRM areas are among the most important management problems facing small businesses?", ["Recruitment and training", "Stress and feedback", "Compensation and benefits", "Safety and union relations"], 0, "Small firms often have no HR function and managers untrained in HRM. One study found HRM practices to be the leading cause of small-firm failure.", "1", "1-3e9325b2"], ["How does the text say small organizations should view spending on HRM?", ["As an investment in company performance", "As an overhead expense to keep minimal", "As a legal requirement for large firms only", "As a cost that is justified by outsourcing"], 0, "HRM raises talent-related costs but improves productivity and profitability for firms of every size.", "1", "1-757cc027"], ["Employees learn a new skill in training, but they aren't rewarded for using it and get no feedback on it, so they stop. What does this show about HRM functions?", ["They must reinforce each other to be effective", "They must each be managed by a separate HR team", "They must be outsourced to stay consistent", "They must put training ahead of other areas"], 0, "HRM is a SYSTEM. If even one function pulls against the others, shaping behavior and executing strategy gets much harder.", "1", "1-b5aeeb63"], ["Wells Fargo fired more than 5,000 employees for opening fake accounts to hit the sales quotas they needed to keep their jobs. What is the lesson for HRM?", ["Think through the unintended effects of incentive plans", "Replace all incentive pay with straight base salary", "Move sales staff into a professional employer organization", "Measure sales staff only on their customers' complaints"], 0, "The bigger the reward (or threat), the bigger the temptation to cheat. Same pattern as the subprime mortgage bonuses.", "1", "1-a714afeb"], ["Which professional body publishes the main code of ethics for the HRM field?", ["Society for Human Resource Management", "Equal Employment Opportunity Commission", "Bureau of Labor Statistics", "Occupational Information Network"], 0, "SHRM, the Society for Human Resource Management, is the world's largest professional association devoted to HRM. Its core principle: add value and contribute to the ETHICAL success of the organization.", "1", "1-6dcac840"], ["If employees want a union to represent them, what does the law require the company to do?", ["Recognize the union and bargain in good faith", "Recognize the union and accept its first offer", "Delay recognition until a court certifies it", "Offer a nonunion committee as an alternative"], 0, "The two sides then negotiate a collective bargaining agreement covering the terms and conditions of employment.", "1", "1-4a8a8fb1"], ["Which statement about union membership matches the text?", ["It is far higher in the public sector than the private", "It is far higher in the private sector than the public", "It is about equal in the public and private sectors", "It has been rising steadily in both sectors for years"], 0, "2019: 33.6 percent public sector vs 6.2 percent private. Declining for years but still common enough to matter.", "1", "1-884d02fe"], ["Stress-management classes and a stop-smoking program mainly address workplace ____.", ["health", "safety", "compliance", "relations"], 0, "Safety = protection from toxins, accidents, injuries. Health = physical and mental wellbeing. Wellness programs are health.", "1", "1-fb31b017"], ["Positive employee-management relations improve communication, problem solving, and performance in ____.", ["both unionized and nonunionized organizations", "unionized organizations but not nonunion ones", "nonunion organizations but not unionized ones", "public sector organizations but not private ones"], 0, "It matters everywhere, union or not.", "1", "1-cd22cae7"]];
const MATCHES=[["HRM function and what it does", [["Staffing", "Moves talent into, through, and out of the firm"], ["Training and development", "Builds capabilities and plans succession"], ["Performance management", "Aligns goals, appraises, gives feedback"], ["Rewards and benefits", "Pay, benefits, and nonfinancial rewards"], ["Health and safety", "Wellness, accidents, toxins, injuries"], ["Employee-management relations", "Unions, bargaining, employee surveys"]], "1"], ["Reward and its category", [["Stock options", "Direct financial"], ["Paid vacation", "Indirect financial"], ["Feeling appreciated", "Nonfinancial"], ["Sales commission", "Direct financial"], ["Health insurance", "Indirect financial"], ["Flexible schedule", "Nonfinancial"]], "1"], ["Risk type and its cue", [["Strategic risk", "Culture, ethics, change initiatives"], ["Operational risk", "Hiring speed, skills, keeping top performers"], ["Financial risk", "Overtime, turnover cost, compensation spend"], ["Compliance risk", "Harassment, whistleblowers, safety law"]], "1"], ["Who does the HR work", [["Shared service center", "Internal unit centralizing routine HR tasks"], ["Outsourcing", "External vendor performs the task"], ["PEO", "Leases workers and is their legal employer"], ["HRM professionals", "Align HR with strategy, manage change"], ["Managers", "Carry out HRM day to day with their people"], ["Employees", "Own their career development"]], "1"], ["Competitive advantage and the HRM that fits", [["Operational excellence", "Procedure followers who control costs"], ["Product innovation", "Creative, analytical team players"], ["Customer focus", "Active learners with emotional resilience"], ["Organic growth", "Heavy recruiting, selection, and training"], ["Growth by acquisition", "Check the culture match first"]], "1"], ["Company and its lesson", [["Wells Fargo", "Incentives can drive unethical behavior"], ["Costco", "High pay repaid by low turnover"], ["Citigroup", "No CEO succession plan"], ["Patagonia", "HR practices reinforce culture"], ["IBM", "Split admin HR from strategic HR"], ["HSBC", "International assignments build global mindset"]], "1"], ["Lever and its HRM tools", [["Should do", "HR planning and legal compliance"], ["Can do", "Staffing and training"], ["Will do", "Performance management and rewards"]], "1"]];

if(S.topic!=="all"&&!built(S.topic))S.topic="1";
const qid=m=>m[5];
$("#topic").innerHTML=`<option value="all">All finished topics</option>`+TOPICS.map(t=>`<option value="${t[0]}"${built(t[0])?"":" disabled"}>Topic ${t[0]}: ${esc(t[1])}${built(t[0])?"":" (coming)"}</option>`).join("");
$("#topic").value=S.topic;
$("#topic").onchange=e=>{S.topic=e.target.value;save();renderAll()};
function setTab(t){S.tab=t;save();$$(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t==t));$$(".panel").forEach(p=>p.classList.toggle("hide",p.id!=t));window.scrollTo(0,0)}
$$(".tab").forEach(t=>t.onclick=()=>setTab(t.dataset.t));
const inTopic=t=>S.topic=="all"||t==S.topic;

function renderNotes(){const ts=S.topic=="all"?TOPICS.map(t=>t[0]).filter(built):[S.topic];
  $("#notes").innerHTML=ts.map(t=>{const nm=TOPICS.find(x=>x[0]==t)[1];return (ts.length>1?`<h3 style="font-size:23px;color:var(--ink)">Topic ${t}: ${esc(nm)}</h3>`:"")+NOTES[t]}).join("");
  $$("#notes table").forEach(tb=>{const w=document.createElement("div");w.className="tw";tb.replaceWith(w);w.appendChild(tb)})}

let fcArr=[],fcI=0,fcFlip=false;
function buildFC(){fcArr=FLASHCARDS.filter(c=>inTopic(c[2]));fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards for this topic yet";$("#fcdef").classList.add("hide");$("#fcpos").textContent="";$("#fchint").textContent="";return}
  const c=fcArr[fcI];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);
  $("#fchint").textContent=fcFlip?"Tap to see the term":"Say the answer out loud, then tap";$("#fcpos").textContent=`Card ${fcI+1} of ${fcArr.length}`}
const flip=()=>{fcFlip=!fcFlip;showFC()},fcGo=d=>{if(!fcArr.length)return;fcI=(fcI+d+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fccard").onclick=flip;$("#fcnext").onclick=()=>fcGo(1);$("#fcprev").onclick=()=>fcGo(-1);
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};
document.addEventListener("keydown",e=>{if(S.tab!="fc"||e.target.tagName=="SELECT")return;if(e.key==" "||e.key=="Enter"){e.preventDefault();flip()}if(e.key=="ArrowRight")fcGo(1);if(e.key=="ArrowLeft")fcGo(-1)});

let missOnly=false,order=null;
function mcList(){let l=MCQS.map((m,i)=>i).filter(i=>inTopic(MCQS[i][4]));if(order)l=order.filter(i=>l.includes(i));
  if(missOnly)l=l.filter(i=>{const a=S.ans[qid(MCQS[i])];return a!=null&&a!=MCQS[i][2]});return l}
function buildMC(){const l=mcList();
  $("#mclist").innerHTML=l.length?l.map((gi,n)=>{const m=MCQS[gi],a=S.ans[qid(m)],done=a!=null;
    const opts=shuf(m[1].map((o,oi)=>[o,oi])).map(([o,oi])=>`<button class="opt${done&&oi==m[2]?" correct":""}${done&&oi==a&&a!=m[2]?" wrong":""}" data-q="${gi}" data-o="${oi}"${done?" disabled":""}>${esc(o)}</button>`).join("");
    return `<div class="q" id="q${gi}"><div class="qn">Question ${n+1} · Topic ${m[4]}</div><div class="qt">${esc(m[0])}</div>${opts}<div class="exp${done?" show":""}">${esc(m[3])}</div></div>`}).join("")
    :`<div class="soon">${missOnly?"Nothing missed here. Turn off Missed only to see every question.":"No practice questions for this topic yet."}</div>`;
  score()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=+b.dataset.q,o=+b.dataset.o,m=MCQS[q];S.ans[qid(m)]=o;save();
  $$(`#q${q} .opt`).forEach(x=>{const xo=+x.dataset.o;if(xo==m[2])x.classList.add("correct");if(xo==o&&o!=m[2])x.classList.add("wrong");x.disabled=true});
  $(`#q${q} .exp`).classList.add("show");score();meter()});
function score(){const l=MCQS.map((m,i)=>i).filter(i=>inTopic(MCQS[i][4]));let d=0,r=0;l.forEach(i=>{const a=S.ans[qid(MCQS[i])];if(a!=null){d++;if(a==MCQS[i][2])r++}});
  $("#mcscore").textContent=d?`${r} right of ${d} answered (${Math.round(100*r/d)}%), ${l.length-d} to go`:`${l.length} questions`}
$("#mcmiss").onclick=e=>{missOnly=!missOnly;e.target.classList.toggle("on",missOnly);buildMC()};
$("#mcshuf").onclick=()=>{order=shuf(MCQS.map((m,i)=>i));buildMC()};
$("#mcreset").onclick=()=>{if(!confirm("Clear your answers for this topic selection?"))return;MCQS.forEach(m=>{if(inTopic(m[4]))delete S.ans[qid(m)]});save();missOnly=false;$("#mcmiss").classList.remove("on");buildMC();meter()};

function buildMA(){const l=MATCHES.map((m,i)=>[m,i]).filter(x=>inTopic(x[0][2]));
  $("#malist").innerHTML=l.length?l.map(([m,mi])=>{const rights=shuf([...new Set(m[1].map(p=>p[1]))]);
    const rows=m[1].map(p=>`<div class="mrow"><div class="mleft">${esc(p[0])}</div><div class="msel"><select data-m="${mi}" data-correct="${esc(p[1])}" aria-label="Match for ${esc(p[0])}"><option value="">Choose</option>${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div></div>`).join("");
    return `<div class="q"><div class="qt" style="font-weight:600">${esc(m[0])}</div>${rows}<div class="bar" style="margin:10px 0 0"><span data-res="${mi}"></span><button class="btn" data-checkm="${mi}">Check matches</button></div></div>`}).join(""):`<div class="soon">No matching sets for this topic yet.</div>`}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;let ok=0,n=0;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const g=s.value==s.dataset.correct;n++;if(g)ok++;s.classList.toggle("ok",g);s.classList.toggle("no",!g)});$(`[data-res="${b.dataset.checkm}"]`).textContent=`${ok} of ${n} matched`});

function meter(){const l=MCQS.filter(m=>inTopic(m[4]));const r=l.filter(m=>S.ans[qid(m)]==m[2]).length;const done=TOPICS.filter(t=>built(t[0])).length;
  $("#meter").innerHTML=`<b>${r} of ${l.length}</b> practice questions answered right in this selection. ${done} of ${TOPICS.length} topics are built so far.`}
function renderAll(){renderNotes();buildFC();buildMC();buildMA();meter()}
renderAll();setTab(S.tab);
</script></body></html>
