<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | muh shit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding: 40px 20px; }
    .header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #34d399, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #666; font-size: 1rem; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #818cf8; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .albums-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
    .album-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
    .album-card:hover { border-color: rgba(52, 211, 153, 0.4); transform: translateY(-2px); }
    .album-preview { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; aspect-ratio: 1; background: #111; }
    .album-preview img { width: 100%; height: 100%; object-fit: cover; }
    .album-preview .more { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: #888; font-size: 1.2rem; }
    .album-info { padding: 16px; }
    .album-title { font-size: 1.1rem; margin-bottom: 4px; }
    .album-count { color: #666; font-size: 0.85rem; }
    .album-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 1000; overflow-y: auto; padding: 40px 20px; }
    .album-view.active { display: block; }
    .album-view-header { max-width: 1400px; margin: 0 auto 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .album-view-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .album-view-close:hover { background: rgba(255,255,255,0.2); }
    .album-view-title { font-size: 1.8rem; flex: 1; }
    .btn { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.3); color: #34d399; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .btn:hover { background: rgba(52, 211, 153, 0.25); border-color: rgba(52, 211, 153, 0.5); }
    .album-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; max-width: 1400px; margin: 0 auto; }
    .image-card { position: relative; border-radius: 12px; overflow: hidden; }
    .image-card img { width: 100%; display: block; cursor: pointer; transition: transform 0.2s; }
    .image-card:hover img { transform: scale(1.02); }
    .image-card .download-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
    .image-card:hover .download-btn { opacity: 1; }
    .image-card .download-btn:hover { background: rgba(52, 211, 153, 0.8); }
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; align-items: center; justify-content: center; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 95%; max-height: 90%; object-fit: contain; }
    .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 2rem; color: #fff; cursor: pointer; opacity: 0.7; }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; color: #fff; cursor: pointer; opacity: 0.7; padding: 20px; user-select: none; }
    .lightbox-nav:hover { opacity: 1; }
    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }
    .lightbox-download { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); }
    .lightbox-counter { position: absolute; bottom: 30px; right: 30px; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <a href="/" class="back-link">← Back to dashboard</a>
  <div class="header">
    <h1>Gallery</h1>
    <p class="subtitle" id="gallery-subtitle"></p>
  </div>
  <div class="albums-grid" id="albums-grid"></div>
  <div class="album-view" id="album-view">
    <div class="album-view-header">
      <button class="album-view-close" onclick="closeAlbum()" title="Back to albums">←</button>
      <h2 class="album-view-title" id="album-view-title"></h2>
      <button class="btn" onclick="downloadAlbum()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Album
      </button>
    </div>
    <div class="album-images" id="album-images"></div>
  </div>
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">×</span>
    <span class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#10094;</span>
    <img id="lightbox-img" src="" alt="">
    <span class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#10095;</span>
    <button class="btn lightbox-download" onclick="downloadCurrentImage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
    <span class="lightbox-counter" id="lightbox-counter"></span>
  </div>
  <script>
    const R2 = 'https://claude-deploy.bennyforeman1.workers.dev/r2/file/';
    const thumb = (img) => R2 + 'thumb-' + img.replace(/\.png$/, '.webp');  // WebP thumbnail
    const full = (img) => R2 + img;  // Full image
    
    const albums = [
      { id: 'quotes', title: 'Quotes', icon: '💬', images: ['album-quotes-1.png','album-quotes-2.png','album-quotes-3.png'] },
      { id: 'please-bro', title: 'Please Bro', icon: '🙏', images: ['album-please-bro-1.png','album-please-bro-2.png'] },
      { id: 'collages', title: 'Collages', icon: '🎨', images: ['album-collages-1.png','album-collages-2.png'] },
      { id: 'memes', title: 'Memes', icon: '😂', images: ['gallery-memes-1.png','gallery-memes-2.png','gallery-memes-3.png'] },
      { id: 'jacked-women', title: 'Jacked Double-Chinned Women', icon: '💪', images: ['gallery-jacked-women-1.png','gallery-jacked-women-2.png','gallery-jacked-women-3.png','gallery-jacked-women-4.png'] },
      { id: 'want-to-anyway', title: 'But I Want To Anyway', icon: '📰', images: ['gallery-want-to-anyway-1.png','gallery-want-to-anyway-2.png','gallery-want-to-anyway-3.png','gallery-want-to-anyway-4.png','gallery-want-to-anyway-5.png','gallery-want-to-anyway-6.png'] }
    ];
    let currentAlbum = null, currentImageIndex = 0;
    const totalImages = albums.reduce((s,a) => s + a.images.length, 0);
    document.getElementById('gallery-subtitle').textContent = `${albums.length} albums · ${totalImages} images`;

    function renderAlbums() {
      document.getElementById('albums-grid').innerHTML = albums.map(album => {
        let previews = album.images.slice(0,4).map((img,i) => 
          i === 3 && album.images.length > 4 ? `<div class="more">+${album.images.length-4}</div>` : `<img src="${thumb(img)}" loading="lazy">`
        ).join('');
        if (album.images.length < 4) previews += '<div style="background:#111"></div>'.repeat(4 - album.images.length);
        return `<div class="album-card" onclick="openAlbum('${album.id}')"><div class="album-preview">${previews}</div><div class="album-info"><div class="album-title">${album.icon} ${album.title}</div><div class="album-count">${album.images.length} images</div></div></div>`;
      }).join('');
    }

    function openAlbum(id) {
      currentAlbum = albums.find(a => a.id === id);
      if (!currentAlbum) return;
      history.pushState(null, '', `#${id}`);
      document.getElementById('album-view-title').textContent = `${currentAlbum.icon} ${currentAlbum.title}`;
      document.getElementById('album-images').innerHTML = currentAlbum.images.map((img, i) => 
        `<div class="image-card"><img src="${thumb(img)}" onclick="openLightbox(${i})" loading="lazy"><button class="download-btn" onclick="event.stopPropagation();downloadImage('${img}')" title="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button></div>`
      ).join('');
      document.getElementById('album-view').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeAlbum() {
      document.getElementById('album-view').classList.remove('active');
      document.body.style.overflow = '';
      history.pushState(null, '', window.location.pathname);
      currentAlbum = null;
    }

    function openLightbox(i) {
      currentImageIndex = i;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }
    function updateLightbox() {
      // Use FULL image in lightbox
      document.getElementById('lightbox-img').src = full(currentAlbum.images[currentImageIndex]);
      document.getElementById('lightbox-counter').textContent = `${currentImageIndex + 1} / ${currentAlbum.images.length}`;
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
    function navigateLightbox(d) {
      currentImageIndex = (currentImageIndex + d + currentAlbum.images.length) % currentAlbum.images.length;
      updateLightbox();
    }

    async function downloadImage(filename) {
      // Download FULL image
      const res = await fetch(full(filename));
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function downloadCurrentImage() { downloadImage(currentAlbum.images[currentImageIndex]); }
    async function downloadAlbum() {
      for (const img of currentAlbum.images) {
        await downloadImage(img);
        await new Promise(r => setTimeout(r, 300));
      }
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('lightbox').classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigateLightbox(-1);
        if (e.key === 'ArrowRight') navigateLightbox(1);
      } else if (document.getElementById('album-view').classList.contains('active')) {
        if (e.key === 'Escape') closeAlbum();
      }
    });

    function handleHash() {
      const h = window.location.hash.slice(1);
      if (h && albums.find(a => a.id === h)) openAlbum(h);
    }
    window.addEventListener('hashchange', handleHash);
    renderAlbums();
    handleHash();
  </script>
</body>
</html>
