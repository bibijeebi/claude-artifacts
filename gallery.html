<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Claude Artifacts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem;
        }
        
        header { text-align: center; margin-bottom: 2rem; }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .stats { color: #888; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .stats span { color: #667eea; font-weight: 600; }
        
        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        
        nav a {
            padding: 0.6rem 1.5rem;
            border: 1px solid #333;
            border-radius: 25px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        nav a:hover { border-color: #667eea; color: #667eea; }
        nav a.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        
        .controls {
            max-width: 800px;
            margin: 0 auto 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        
        #search {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
            padding: 0.75rem 1rem;
            border: 1px solid #333;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
        }
        #search:focus {
            outline: none;
            border-color: #667eea;
        }
        #search::placeholder { color: #666; }
        
        .tabs {
            display: flex;
            gap: 0.4rem;
        }
        
        .tab {
            padding: 0.5rem 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #667eea; color: #667eea; }
        .tab.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            color: #667eea;
        }
        .tab .count {
            margin-left: 0.3rem;
            opacity: 0.7;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card-preview {
            height: 140px;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-preview .icon {
            font-size: 3rem;
            opacity: 0.4;
        }
        
        .card-body { padding: 1rem; }
        
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-file {
            font-size: 0.7rem;
            color: #667eea;
            font-family: monospace;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-meta { display: flex; gap: 0.5rem; }
        
        .badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
        }
        .badge.pdf { background: rgba(234, 102, 102, 0.15); color: #ea6666; }
        .badge.image { background: rgba(102, 234, 156, 0.15); color: #66ea9c; }
        .badge.audio { background: rgba(234, 180, 102, 0.15); color: #eab466; }
        .badge.size { background: rgba(255,255,255,0.1); color: #888; }
        
        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .refresh-btn:hover { transform: scale(1.05); }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gallery</h1>
        <div class="stats">Assets: <span id="asset-count">0</span></div>
    </header>
    
    <nav>
        <a href="index.html">Sites</a>
        <a href="gallery.html" class="active">Gallery</a>
    </nav>
    
    <div class="controls">
        <input type="text" id="search" placeholder="Search assets...">
        <div class="tabs">
            <button class="tab active" data-filter="all">All<span class="count" id="count-all"></span></button>
            <button class="tab" data-filter="image">Images<span class="count" id="count-image"></span></button>
            <button class="tab" data-filter="pdf">PDFs<span class="count" id="count-pdf"></span></button>
            <button class="tab" data-filter="audio">Audio<span class="count" id="count-audio"></span></button>
        </div>
    </div>
    
    <div class="grid" id="grid"></div>
    
    <button class="refresh-btn" onclick="loadAssets()">↻ Refresh</button>
    
    <script>
        const R2_BASE = 'https://claude-deploy.bennyforeman1.workers.dev/r2/file/';
        const THUMB_BASE = 'https://claude-deploy.bennyforeman1.workers.dev/r2/thumb/';
        let allAssets = [];
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function titleCase(str) {
            return str
                .replace(/[-_]/g, ' ')
                .replace(/\.[^.]+$/, '')
                .replace(/\d+$/, '')
                .trim()
                .replace(/\b\w/g, c => c.toUpperCase());
        }
        
        function getType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'pdf') return 'pdf';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
            if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return 'audio';
            return 'other';
        }
        
        function getIcon(type) {
            switch(type) {
                case 'pdf': return '📄';
                case 'audio': return '🎵';
                default: return '📁';
            }
        }
        
        async function loadAssets() {
            try {
                const res = await fetch('https://claude-deploy.bennyforeman1.workers.dev/r2/list');
                const data = await res.json();
                
                allAssets = data.files
                    .filter(f => {
                        if (f.key.startsWith('thumb-')) return false;
                        if (f.key.startsWith('_')) return false;
                        if (f.key.includes('/')) return false;
                        const type = getType(f.key);
                        return ['pdf', 'image', 'audio'].includes(type);
                    })
                    .map(f => ({
                        title: titleCase(f.key),
                        file: f.key,
                        url: R2_BASE + f.key,
                        size: f.size,
                        type: getType(f.key),
                        uploaded: f.uploaded
                    }))
                    .sort((a, b) => a.title.localeCompare(b.title));
                
                updateCounts();
                filterAssets();
            } catch (e) {
                console.error('Failed to load assets:', e);
            }
        }
        
        function updateCounts() {
            const counts = { all: allAssets.length, image: 0, pdf: 0, audio: 0 };
            allAssets.forEach(a => { if (counts[a.type] !== undefined) counts[a.type]++; });
            
            document.getElementById('asset-count').textContent = counts.all;
            document.getElementById('count-all').textContent = counts.all;
            document.getElementById('count-image').textContent = counts.image;
            document.getElementById('count-pdf').textContent = counts.pdf;
            document.getElementById('count-audio').textContent = counts.audio;
        }
        
        function filterAssets() {
            const search = document.getElementById('search').value.toLowerCase();
            const activeFilter = document.querySelector('.tab.active').dataset.filter;
            
            let filtered = allAssets;
            
            if (activeFilter !== 'all') {
                filtered = filtered.filter(a => a.type === activeFilter);
            }
            
            if (search) {
                filtered = filtered.filter(a => 
                    a.title.toLowerCase().includes(search) || 
                    a.file.toLowerCase().includes(search)
                );
            }
            
            const grid = document.getElementById('grid');
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">No assets found</div>';
                return;
            }
            
            grid.innerHTML = filtered.map(asset => {
                let preview;
                if (asset.type === 'image') {
                    preview = `<img src="${asset.url}" alt="${asset.title}" loading="lazy">`;
                } else {
                    preview = `<span class="icon">${getIcon(asset.type)}</span>`;
                }
                
                return `
                    <a href="${asset.url}" target="_blank" class="card">
                        <div class="card-preview">${preview}</div>
                        <div class="card-body">
                            <div class="card-title">${asset.title}</div>
                            <div class="card-file">${asset.file}</div>
                            <div class="card-meta">
                                <span class="badge ${asset.type}">${asset.type}</span>
                                <span class="badge size">${formatSize(asset.size)}</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }
        
        document.getElementById('search').addEventListener('input', filterAssets);
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                filterAssets();
            });
        });
        
        loadAssets();
    </script>
</body>
</html>
