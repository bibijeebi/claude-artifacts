<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D080 Mock OA</title>
<meta property="og:title" content="D080 Mock OA - Global Business">
<meta property="og:description" content="70-question mock objective assessment for WGU D080, all-new scenarios, exam mode with per-topic scoring.">
<meta property="og:url" content="https://niggerfaggot.club/d080-mock">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e0d;--bg2:#101614;--bg3:#161e1b;--line:#1d2926;--ink:#e8efe9;--dim:#7e918a;--lime:#d4ff3a;--green:#3ad47e;--amber:#ffc24b;--red:#ff5c5c;--blue:#5cc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace}
h1,.fr{font-family:'Fraunces',serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 120px}
.title{font-size:28px;font-weight:900;letter-spacing:-.5px}.title b{color:var(--lime)}
.sub{color:var(--dim);font-size:12px;margin-top:4px;margin-bottom:6px}
#results{margin:14px 0}
.rcard{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px}
.rscore{font-family:'Fraunces',serif;font-size:40px;font-weight:900;line-height:1}
.rverd{font-size:14px;font-weight:700;letter-spacing:1px;margin-top:4px}
.rmsg{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.5}
.rtab{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.rtab td{border-bottom:1px solid var(--line);padding:6px 4px}
.q{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.qn{color:var(--lime);font-size:11px;font-weight:700}
.qt{font-size:14px;margin:6px 0 12px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.1s}
.opt:hover{border-color:var(--lime)}
.opt.sel{border-color:var(--lime);background:rgba(212,255,58,.12)}
.opt.correct{border-color:var(--green);background:rgba(58,212,126,.14)}
.opt.wrong{border-color:var(--red);background:rgba(255,92,92,.14)}
.opt:disabled{cursor:default}
.exp{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px;padding:10px;background:var(--bg3);border-radius:8px;border-left:2px solid var(--lime);display:none}
.exp.show{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,14,13,.95);border-top:1px solid var(--line);padding:12px 14px;backdrop-filter:blur(6px)}
.barin{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
#count{font-size:12px;color:var(--dim)}#count b{color:var(--lime)}
.sbtn{background:var(--lime);color:#0a0e0d;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:13px;padding:11px 22px;cursor:pointer}
.sbtn.ghost{background:var(--bg3);color:var(--ink);border:1px solid var(--line)}
</style></head><body><div class="wrap">
<div class="title">D080 <b>Mock OA</b></div>
<div class="sub">70 all-new scenarios · same concept mix as the real OA · exam mode, no feedback until you submit</div>
<div id="results"></div>
<div id="list"></div>
</div>
<div id="bar"><div class="barin"><span id="count">answered <b>0</b> / 70</span><span id="submitbar"><button class="sbtn" id="submit">submit exam</button></span></div></div>
<script>
const MCQS=[
["As global trade expanded, Country M's legislature passed laws restricting imports and limiting foreign influence to insulate itself. Which effect of globalization on political systems is this?",["Creation of new tax brackets","Rise of isolationist and protectionist policies","Mandatory translation of all laws","Expansion of voting rights"],1,"Globalization can provoke a political backlash toward isolationist/protectionist policy.","Globalization & Economies"],
["A regional government wants to accelerate its integration into the global economy. Which change would most increase its rate of globalization?",["Raising import tariffs","Restricting foreign investment","Lowering trade barriers","Increasing the cost of doing business"],2,"Lower trade barriers accelerate globalization.","Globalization & Economies"],
["A consulting team evaluates how different a target market is in culture, legal/political system, physical distance, and wealth. Which framework are they using?",["SWOT","CAGE","PESTLE","Porter's Five Forces"],1,"CAGE = Cultural, Administrative, Geographic, Economic distance.","Globalization & Economies"],
["A US appliance manufacturer relocates all assembly to a lower-wage country. What is the primary drawback for the home country?",["Higher product quality","Loss of domestic manufacturing jobs","Lower transportation costs","Increased local tax revenue"],1,"Offshoring production costs the home country manufacturing jobs.","Globalization & Economies"],
["Country T runs largely on barter and subsistence farming with weak infrastructure and limited opportunity. What is the impact on its globalization?",["It is unaffected by globalization","It is at a disadvantage due to a low standard of living","It globalizes faster than wealthy nations","It gains a comparative advantage automatically"],1,"A poor traditional economy is disadvantaged in globalizing.","Globalization & Economies"],
["In Country K, prices are set by supply and demand, businesses are privately owned, and firms compete to maximize profit. What type of economy is this?",["Command economy","Traditional economy","Market economy","Mixed subsistence economy"],2,"Market economy: private ownership, profit maximization, supply/demand pricing.","Globalization & Economies"],
["Which institution provides financing to help nations manage balance-of-payments and trade-deficit problems?",["The World Bank","The International Monetary Fund","The World Trade Organization","The Federal Reserve"],1,"The IMF stabilizes the monetary system and helps with trade deficits.","Trade & Institutions"],
["Which institution's current mission centers on reducing poverty and raising living standards in developing nations?",["The World Bank","The IMF","The WTO","The Federal Reserve"],0,"The World Bank focuses on poverty reduction / quality of life.","Trade & Institutions"],
["The World Trade Organization has drawn criticism for which of the following?",["Setting global minimum wages","High agricultural tariffs that harm developing nations","Banning all foreign direct investment","Eliminating national currencies"],1,"WTO is criticized for high agricultural tariffs hurting poorer countries.","Trade & Institutions"],
["The value of the IMF's Special Drawing Right (SDR) is based on what?",["The price of gold","The US dollar alone","A basket of the five major world currencies","The combined GDP of all members"],2,"The SDR is valued on a basket of the five major currencies.","Trade & Institutions"],
["Two nations open trade with each other. Where are jobs most likely to grow?",["In non-comparative-advantage industries","In each nation's comparative-advantage industries","Equally across all industries","Only in government sectors"],1,"Opening trade grows jobs in comparative-advantage industries.","Trade & Institutions"],
["A country imposes import quotas on foreign steel. What happens to domestic steel prices?",["They fall","They rise","They stay the same","They cannot be determined"],1,"Quotas limit supply, raising domestic prices.","Trade & Institutions"],
["Why would a developing nation shield a young domestic industry behind tariffs?",["To encourage dumping","To protect an infant industry","To increase foreign competition","To lower domestic prices"],1,"Protectionism shields infant industries until they can compete.","Trade & Institutions"],
["Country B places heavy tariffs on imported electronics. What is the most likely reasoning?",["To help the exporting country's economy","To protect its own economy and allow long-term growth","To increase imports","To create a trade deficit"],1,"Tariffs are protectionist: shield the domestic economy for long-term growth.","Trade & Institutions"],
["A nation leverages advanced technology infrastructure to dominate production of a good. What is the effect on trade?",["It lowers its own productivity","It creates barriers to entry for rival nations","It reduces its natural resources","It guarantees a trade deficit"],1,"Superior infrastructure raises barriers to entry for competitors.","Trade & Institutions"],
["Country B wants to attract investment from a firm in Country A. Which action best supports that goal?",["Raise trade tariffs","Offer tax exemptions","Impose protectionist policies","Limit privatization"],1,"Tax exemptions attract foreign investment.","Trade & Institutions"],
["A tariff placed on imported goods generally does what?",["Lowers the price of imports","Raises the price of imports and protects domestic producers","Eliminates domestic competition","Increases foreign market share"],1,"A tariff is a tax on imports that raises their price and shields domestic producers.","Trade & Institutions"],
["A trade bloc allows free trade among its members and charges an identical tariff to all non-member countries. Which level of integration is this?",["Free trade area","Customs union","Common market","Economic union"],1,"Customs union = free internal trade + common external tariff.","Regional Integration"],
["What is a key drawback of forming a regional trade bloc?",["It lowers prices for all global consumers","It diverts trade away from more efficient non-member producers","It eliminates all tariffs worldwide","It guarantees full employment"],1,"Trade diversion: members buy from less-efficient insiders instead of cheaper outsiders.","Regional Integration"],
["The USMCA (NAFTA's successor) established which auto-industry rule?",["All vehicles must be electric by 2025","Roughly 40-45% of auto parts must come from workers earning at least $16/hr by 2023","No tariffs on any imported cars","100% of steel must be recycled"],1,"USMCA's auto-labor rule: ~$16/hr content threshold by 2023.","Regional Integration"],
["A US firm wants to invest in a telecommunications company in Costa Rica. Which agreement supports this Central American investment?",["NAFTA","CAFTA","The European Union","ASEAN"],1,"CAFTA covers Central America, including Costa Rica.","Regional Integration"],
["What was a major economic effect of NAFTA?",["A sharp rise in tariffs","A shift of jobs away from low comparative-advantage industries","The creation of a single North American currency","A ban on agricultural trade"],1,"NAFTA shifted jobs out of low comparative-advantage industries.","Regional Integration"],
["Which is a drawback of regional economic integration?",["Lower consumer prices","Increased exclusive trade within the bloc","Greater global competition","More efficient producers everywhere"],1,"Members trade more exclusively with each other, excluding efficient outsiders.","Regional Integration"],
["How does Islamic (Sharia) law most directly affect business practices?",["It forbids charging interest","It requires all contracts in Arabic","It bans foreign ownership","It mandates state ownership"],0,"Sharia forbids riba (charging interest).","Legal & Ethics"],
["Which factor can create a monopoly?",["Control of a scarce natural resource","High employee turnover","Low interest rates","A flat organizational structure"],0,"Controlling a scarce natural resource is a barrier to entry that creates monopoly.","Legal & Ethics"],
["Which convention supplies default 'gap-filler' terms not expressly stated in an international sales contract?",["The Common Law","The Uniform Commercial Code","The Contracts for the International Sale of Goods (CISG)","The Geneva Convention"],2,"CISG provides gap-filler terms for international sales contracts.","Legal & Ethics"],
["Price-fixing, restraints of trade, and monopolization violate which category of law?",["Contract law","Antitrust law","Intellectual property law","Tax law"],1,"Antitrust law prohibits price-fixing and monopolization.","Legal & Ethics"],
["A firm adopts eco-friendly packaging that raises production costs. Which concern does this create?",["Decreased profitability","Improved community reputation","Increased shareholder count","Lower employee turnover"],0,"Higher green-production costs reduce profitability.","Legal & Ethics"],
["A company expanding globally wants to strengthen corporate social responsibility. Which CSR goal should it keep central?",["Maximizing short-term revenue","Building shareholder trust through high ethical standards","Minimizing transparency","Cutting all charitable giving"],1,"A core CSR goal is shareholder trust via high ethical standards.","Legal & Ethics"],
["A manager abroad is told a small payment to officials is normal practice there. What makes this ethical dilemma so challenging?",["The payment is always cheap","Ethical standards are not standardized across countries","Bribery is universally legal","The home office never finds out"],1,"Cross-cultural ethics is hard because norms aren't standardized (ethical relativism).","Legal & Ethics"],
["A CEO requires all employees to follow the firm's stated values, mission, and vision regardless of situation. Which ethical standard is emphasized?",["Transparency","Code of ethics","Corporate social responsibility","Ethical relativism"],1,"A code of ethics is the formal values/mission statement employees must follow.","Legal & Ethics"],
["What is an effective strategy for taking CSR initiatives to a global level?",["Improve only local worker processes","Engage stakeholders on broad issues such as environmental quality","Fund a single local charity","Host a career day at headquarters"],1,"Global CSR works by engaging stakeholders on broad issues like the environment.","Legal & Ethics"],
["A company groups employees into departments such as marketing, finance, HR, and IT. Which organizational structure is this?",["Matrix","Divisional","Functional","Team-based"],2,"Grouping by specialty/function = functional structure.","Org Structure"],
["Engineers at a tech firm work on temporary projects and report to both a functional manager and a project manager. Which structure?",["Functional","Matrix","Divisional","Geographic"],1,"Dual reporting on projects = matrix structure.","Org Structure"],
["Which organizational structure most increases employee creativity, productivity, and mutual accountability?",["Functional","Divisional","Team-based","Matrix"],2,"A team-based structure drives creativity and shared accountability.","Org Structure"],
["A company is organized around three product lines: washers, dryers, and refrigerators. Which type of departmentalization?",["Geographic","Product","Functional","Customer"],1,"Organizing by product line = product departmentalization.","Org Structure"],
["An MNC centralizes all major decisions at headquarters. What is a likely result?",["Greater local flexibility","Increased consistency in operations","Reduced economies of scale","More autonomy for subsidiaries"],1,"Centralized decision-making increases operational consistency.","Org Structure"],
["A German automaker builds a brand-new plant from scratch in the US and owns 100% of it, purchasing no existing company. Which entry mode?",["Acquisition","Joint venture","Greenfield venture","Franchising"],2,"Building new from the ground up with full ownership = greenfield.","Market Entry"],
["A firm wants a direct operating presence abroad but is concerned about the highest risk level and a slow market entry. Which mode fits that concern?",["Exporting","Franchising","Joint venture","Wholly owned subsidiary"],3,"A wholly owned subsidiary carries the highest risk and slowest entry.","Market Entry"],
["A beverage company exports to a new market, one of its cheapest entry options. What is a key downside it faces?",["High transportation costs","Loss of its brand name","Mandatory local ownership","Forced technology transfer"],0,"Exporting is cheap to start but transport costs are a key downside.","Market Entry"],
["A firm enters a new foreign market by hiring a local distributor to handle its products. Which entry strategy is this?",["Exporting","Greenfield venture","Joint venture","Acquisition"],0,"Selling through a foreign distributor is exporting.","Market Entry"],
["A US software firm forms a 50/50 company with a Japanese partner, splitting the investment and the risk. Which entry mode?",["Wholly owned subsidiary","Joint venture","Exporting","Licensing"],1,"Shared 50/50 ownership and risk = joint venture.","Market Entry"],
["A clothing brand uses the exact same logo, name, and advertising in all 40 countries it operates in. Which strategy?",["Adaptation","Standardization","Glocalization","Localization"],1,"Identical branding everywhere = standardization.","Market Entry"],
["Repeated shipping delays push a company to begin producing its goods locally in the overseas market. Which strategy is this?",["Economies of scale","Flexible sourcing","Decentralized manufacturing","Market skimming"],2,"Producing locally in the target market = decentralized manufacturing.","Market Entry"],
["In Country X, employees expect the boss to make every decision and rarely question authority; steep hierarchy is simply accepted. Which Hofstede dimension is high?",["Individualism","Power distance","Long-term orientation","Masculinity"],1,"Acceptance of hierarchy/unequal power = high power distance.","Culture & HR"],
["In Country Y, people want detailed rules and feel anxious in unstructured, ambiguous situations. Which dimension is high?",["Power distance","Uncertainty avoidance","Individualism","Long-term orientation"],1,"Low tolerance for ambiguity = high uncertainty avoidance.","Culture & HR"],
["In a society where people prioritize themselves and their immediate family over the broader group, which dimension is dominant?",["Collectivism","Individualism","Uncertainty avoidance","Power distance"],1,"Self/close-circle focus = individualism.","Culture & HR"],
["An employee returns to US headquarters after a multi-year posting in Asia and feels disoriented at work. What caused this?",["Loss of pay","Changes in work culture and customs","A different time zone","A new job title"],1,"Reverse culture shock comes from changed work culture/customs.","Culture & HR"],
["What is a disadvantage of a polycentric HR approach, where host-country nationals run each subsidiary locally?",["Rigid top-down control from HQ","Possible dual demands for shared resources","No adaptation to local culture","Identical management worldwide"],1,"Polycentric/locally run units can create dual demands for shared resources.","Culture & HR"],
["An expatriate manager in a harmony-focused country learns the local culture and language and is seen as an insider. How will the local culture likely shape the evaluation?",["A very favorable performance evaluation","A very harsh evaluation","A refusal to evaluate","Confusion over the process"],0,"Adapting to local culture earns a favorable evaluation.","Culture & HR"],
["A manufacturer redesigns its production process to dramatically reduce waste. Which supply-chain practice is this?",["Lean manufacturing","Just-in-time only","Channel spanning","Mass customization"],0,"Reducing waste in production = lean manufacturing.","Supply & Distribution"],
["A firm chooses a facility location specifically to minimize distribution shipping costs. Which factor drives this decision?",["Value-to-weight ratio","Minimum efficient scale","Fixed overhead","Tax incentives"],0,"Value-to-weight ratio drives location/shipping-cost decisions.","Supply & Distribution"],
["A company assembles its product locally, but consumers reject it because of where it is made. Which phenomenon is this?",["Value chain effect","Country-of-origin effect","Mass customization","Channel conflict"],1,"Consumer judgments based on where a product is made = country-of-origin effect.","Supply & Distribution"],
["A distribution channel runs producer to wholesaler to retailer to consumer. This channel is best described as:",["Direct","Indirect","Zero-level","Exclusive"],1,"Any channel with intermediaries between producer and consumer is indirect.","Supply & Distribution"],
["A startup sells its product straight to consumers through its own website with no middlemen. How many intermediary layers are there?",["0","1","2","3"],0,"Direct-to-consumer = zero intermediaries.","Supply & Distribution"],
["What is a key advantage of using intermediaries in an indirect distribution channel?",["Total control of marketing","Lower up-front costs by using an existing channel","Direct ownership of products","Elimination of all middleman fees"],1,"Intermediaries provide an existing channel, lowering up-front cost.","Supply & Distribution"],
["Which form of funding offers a low cost of capital and requires no time to mature?",["Loans","Bonds","Equity shares","Venture capital"],0,"Loans have a low cost of capital and no maturity wait.","Finance & Risk"],
["A US company acquires a US-based supplier in California. Which accounting standard should it use?",["IFRS","GAAP","A custom internal standard","ISO 9001"],1,"US domestic transactions use GAAP.","Finance & Risk"],
["A company will owe a foreign supplier in 90 days and locks in today's exchange rate to avoid currency swings. Which tool is this?",["Transfer pricing","Forward contract","Equity swap","Letter of credit"],1,"A forward contract locks an exchange rate to hedge currency risk.","Finance & Risk"],
["An MNC uses internal transfer pricing to move profit out of a high-tax subsidiary. What is the effect on that subsidiary?",["Increased reported profit","Lowered reported profit","Higher employee morale","Reduced regulation"],1,"Shifting profit out lowers the subsidiary's reported profit.","Finance & Risk"],
["Which is an example of a micro (firm-specific) risk?",["Government nationalization of assets","A nationwide regime change","Loss of intellectual property","A country-wide currency collapse"],2,"Micro risk is firm/industry-specific, such as IP loss.","Finance & Risk"],
["A foreign government passes a law seizing all foreign-owned factories in the country. This is an example of:",["Micro risk","Macro risk","Exchange-rate risk","Operational risk"],1,"Country-wide nationalization = macro risk.","Finance & Risk"],
["A US firm manufactures abroad and pays workers in the local currency. Maximum profit occurs when the home (dollar) currency is:",["Weak relative to the foreign currency","Strong relative to the foreign currency","Equal to the foreign currency","Pegged to gold"],1,"A strong home currency makes foreign wages cheaper, maximizing profit.","Finance & Risk"],
["A community can physically access computers and the internet but does not value the technology. Which stage of the digital divide must be addressed?",["Accessibility","Usability","Empowerment","Affordability"],2,"Empowerment is the stage about valuing/adopting the technology.","Technology"],
["A global firm wants employees to access and store shared business files anywhere, 24/7. Which tool fits?",["Cloud-based file share","Email attachments","A desktop publishing program","A local hard drive"],0,"A cloud-based file share gives anytime, anywhere access.","Technology"],
["Which practice best illustrates AI deep learning in manufacturing?",["Scanning bar codes at packaging","Machines learning to recognize common product defects over time","Using fingerprint door locks","Auto-populating orders as they arrive"],1,"Deep learning = machines learning patterns, e.g., recognizing defects.","Technology"],
["A company wants technology to securely and privately store personal data such as SSNs and card numbers, tamper-resistant and accessible worldwide. Which technology?",["Blockchain","Antivirus software","Virtual reality","A spreadsheet"],0,"Blockchain offers secure, decentralized, tamper-resistant storage.","Technology"],
["Autonomous cars, 3D printing, biometrics, nanotechnology, and quantum computing define which era?",["The Second Industrial Revolution","The Fourth Industrial Revolution","The Information Age","The Market Revolution"],1,"These cyber-physical technologies define the Fourth Industrial Revolution.","Technology"],
["A company's departments use information systems that don't communicate with each other, slowing daily work. What should it implement?",["An enterprise resource planning (ERP) system","A deep learning system","A standalone spreadsheet","A social media page"],0,"An ERP integrates data/processes across all departments.","Technology"],
["A multinational notices one economic sector lags all others in adopting AI, limiting its global opportunities. Which sector is it?",["Financial services","Healthcare","Transportation","Education"],3,"Education lags in AI adoption relative to finance, healthcare, transportation.","Technology"]
];
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const QORD=sh(MCQS.map((_,i)=>i));
const DISP={};MCQS.forEach((m,i)=>DISP[i]=sh(m[1].map((_,k)=>k)));
let answers={},submitted=false;
const $=s=>document.querySelector(s);
function render(){
  $("#list").innerHTML=QORD.map((qi,p)=>{
    const m=MCQS[qi];
    const opts=DISP[qi].map((oi,disp)=>{
      let cls="opt";
      if(submitted){if(oi===m[2])cls+=" correct";else if(answers[qi]===oi)cls+=" wrong";}
      else if(answers[qi]===oi)cls+=" sel";
      return `<button class="${cls}" data-q="${qi}" data-o="${oi}" ${submitted?"disabled":""}>${"ABCD"[disp]}. ${m[1][oi]}</button>`;
    }).join("");
    const exp=submitted?`<div class="exp show">${m[3]}</div>`:"";
    return `<div class="q" id="q${qi}"><div class="qn">Q${p+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}${exp}</div>`;
  }).join("");
  count();
}
function count(){$("#count").innerHTML=`answered <b>${Object.keys(answers).length}</b> / 70`;}
$("#list").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||submitted)return;answers[+b.dataset.q]=+b.dataset.o;render();});
$("#submit").addEventListener("click",()=>{
  const un=70-Object.keys(answers).length;
  if(un>0&&!confirm(`${un} question${un>1?"s":""} still blank. Submit anyway? Blanks count as wrong.`))return;
  submitted=true;render();results();
});
function results(){
  let correct=0;const bt={};
  MCQS.forEach((m,qi)=>{const t=m[4];bt[t]=bt[t]||{c:0,n:0};bt[t].n++;if(answers[qi]===m[2]){correct++;bt[t].c++;}});
  const pct=Math.round(correct/70*100);
  const v=pct>=80?["READY TO SIT","var(--green)","Strong. Sit the OA."]:pct>=70?["BORDERLINE","var(--amber)","Close. Drill the weak topics below, then retake."]:["NOT YET","var(--red)","Keep drilling the weak topics, then retake."];
  const rows=Object.entries(bt).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([t,o])=>{const p=Math.round(o.c/o.n*100);const col=p>=80?"var(--green)":p>=60?"var(--amber)":"var(--red)";return `<tr><td>${t}</td><td style="color:${col};text-align:right">${o.c}/${o.n} · ${p}%</td></tr>`;}).join("");
  $("#results").innerHTML=`<div class="rcard"><div class="rscore" style="color:${v[1]}">${correct} / 70 · ${pct}%</div><div class="rverd" style="color:${v[1]}">${v[0]}</div><div class="rmsg">${v[2]} Topics below are sorted weakest first. Scroll down to review every question with the correct answer and a one-line explanation.</div><table class="rtab">${rows}</table></div>`;
  $("#submitbar").innerHTML=`<button class="sbtn ghost" onclick="location.reload()">retake · new shuffle</button>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script></body></html>
