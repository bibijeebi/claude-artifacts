<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#1f2733;--mut:#6b7888;--line:#d9e0e7;--teal:#159fc9;--green:#43a047;--red:#e23b3b}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,40,60,.06)}
.htxt h1{margin:0;font-size:18px;letter-spacing:-.2px}.htxt p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.rings{margin-left:auto;display:flex;gap:10px;align-items:flex-start}
.ring{position:relative;width:54px;display:flex;flex-direction:column;align-items:center}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;top:0;left:0;width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.ring span{margin-top:4px;text-align:center;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.bar{display:flex;align-items:center;gap:10px;margin:16px 2px 10px}
select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.count{margin-left:auto;font-size:12.5px;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 18px;box-shadow:0 1px 3px rgba(20,40,60,.06)}
.topic{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);font-weight:700;margin-bottom:8px}
.q{font-size:17px;line-height:1.45;margin:0 0 16px}
.hint{font-size:12px;color:var(--mut);margin:-8px 0 12px}
.ans{display:block;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.35;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;margin:8px 0;cursor:pointer;transition:.12s;display:flex;gap:11px;align-items:flex-start}
.ans:hover{border-color:var(--teal);background:#f5fbfd}
.ans .ltr{flex:0 0 auto;width:23px;height:23px;border-radius:6px;background:#eef2f6;color:var(--mut);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ans.sel{border-color:var(--teal);background:#eaf7fc}.ans.sel .ltr{background:var(--teal);color:#fff}
.ans.correct{border-color:var(--green);background:#edf7ee}.ans.correct .ltr{background:var(--green);color:#fff}
.ans.wrong{border-color:var(--red);background:#fdeeee}.ans.wrong .ltr{background:var(--red);color:#fff}
.ans.dim{opacity:.55}.ans b{color:var(--ink)}
.chk{font:inherit;font-size:14px;font-weight:600;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;margin-top:6px}
.chk:disabled{opacity:.4;cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f3f6f9;border:1px solid var(--line);font-size:14px;line-height:1.45;display:none}
.explain.show{display:block}.explain.ok{background:#edf7ee;border-color:#bfe3c2}.explain.no{background:#fdeeee;border-color:#f4cccc}
.cont{font-size:12.5px;color:var(--mut);margin-top:10px;text-align:center;display:none}.cont.show{display:block}
.done{text-align:center;padding:40px 18px}.done h2{margin:0 0 6px;font-size:22px}.done p{color:var(--mut);margin:0 0 18px}
.btn{font:inherit;font-size:14px;font-weight:600;background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
footer{text-align:center;font-size:11.5px;color:var(--mut);margin:18px 0 6px}
footer a{color:var(--teal);cursor:pointer}
</style></head>
<body><div class="wrap">
<header>
  <div class="htxt"><h1>C175 Drill</h1><p>Data Management Foundations · PFKO answer key · 50 Q</p></div>
  <div class="rings">
    <div class="ring"><svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="#e3e9ef" stroke-width="6"/><circle id="seenR" cx="27" cy="27" r="22" fill="none" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="138"/></svg><b id="seenN">0%</b><span>Seen</span></div>
    <div class="ring"><svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="#e3e9ef" stroke-width="6"/><circle id="aptR" cx="27" cy="27" r="22" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="138"/></svg><b id="aptN">0%</b><span>Apt</span></div>

<script>
const MCQS = [["What is a broad definition of data?", ["Numbers that are captured on digital media", "Raw facts that are captured on printed or digital media", "Alphanumeric combinations that can be captured on media that a computer can read", "Any information that can be transferred from print to digital"], 1, "Data = raw facts on printed or digital media. 'Information' is processed data; don't confuse the two.", "Intro to Data"], ["What are data?", ["Facts that have been organized in a meaningful way", "Facts that are the result of a query of a database system", "Facts that are collected and stored in a database system", "Facts that have been processed and used for decision making"], 2, "Data are collected and stored facts. 'Organized meaningfully' / 'processed for decisions' = information.", "Intro to Data"], ["What is a determining characteristic of unstructured data?", ["It does not allow copying and pasting.", "It is easy to query and retrieve by business applications.", "It does not follow a data model.", "It is stored in rows and columns."], 2, "Unstructured data has no predefined data model (video, images, free text). Rows/columns = structured.", "Intro to Data"], ["In a flow diagram, which item represents unstructured data? (A=Training Video Content, B=SQL tables of training instructors, C=Relational DB, D=Training DB backup)", ["A (Training Video Content)", "B (SQL tables)", "C (Relational database)", "D (Database backup)"], 0, "Video content has no data model = unstructured. SQL tables and the relational DB are structured.", "Intro to Data"], ["Which is true about flat files?", ["They contain no internal hierarchical organization.", "They have a limit of 256 records.", "They can only contain two-dimensional data.", "They are always encrypted."], 0, "Flat files have no internal hierarchy. No record limit, not 2D-only, not inherently encrypted.", "Intro to Data"], ["Which technology has no internal hierarchy?", ["Flat files", "Heap files", "Hashed tables", "Relational databases"], 0, "Flat files store data with no internal hierarchy or relationships.", "Intro to Data"], ["How were data retrieved before database management systems?", ["Randomly from linked files", "Sequentially from simple files", "Using set operations on complex files", "Using relationships between logical entities"], 1, "Pre-DBMS, data was read sequentially from simple/flat files. Set ops and logical relationships are DBMS features.", "Intro to Data"], ["What is the uniquely identifiable element about which data can be categorized in an entity-relationship diagram?", ["Entity types", "Primary keys", "Unary relationships", "Intersection data points"], 0, "An entity type is the identifiable thing data is categorized about. Keys/relationships describe it, they aren't it.", "Data Modeling"], ["In an ERD where Quantity hangs off the Sells/Sold-by relationship between Salesperson and Product, which classification is correct for the box marked 'Quantity'?", ["Quantity data", "Modality data", "Intersection data", "Product sales data"], 2, "Data on the relationship between two entities (M:N) is intersection data. It belongs to neither entity alone.", "Data Modeling"], ["Which data classification is an entity?", ["Event", "Duration", "Directions", "Attendance"], 0, "An event is a thing you store data about = an entity. Duration/directions/attendance are attributes or measures.", "Data Modeling"], ["An ERD shows Manufacturer (PK Manufacturer Name) --Manufactured/Manufactured-by--< Car (PK Car Serial Number). What is it showing?", ["An agency's cars were provided by multiple manufacturers.", "One manufacturer created at least one of the agency's cars.", "The model, year, and class of the car are part of the primary key.", "The manufacturer maintains database records for its sales representatives."], 1, "The crow's foot reads one manufacturer to many cars: one maker built at least one car. PK is the serial number only.", "Data Modeling"], ["A salesperson is authorized to sell 12 products; a product can be sold by 10 salespersons. Which binary relationship is this?", ["One-to-one", "One-to-many", "Many-to-many", "Associative"], 2, "Many salespersons to many products = many-to-many (M:N). 'Associative' is the resolving table, not the relationship type.", "Data Modeling"], ["Customer >--Purchased/Purchased-by--< Product, crow's foot on both ends. Which relationship does the cardinality represent?", ["Many customers to many products", "One customer to many products", "One customer to many product numbers", "One customer to one product number"], 0, "Crow's foot on both sides = many-to-many: many customers to many products.", "Data Modeling"], ["Salesperson |--Sells-to/Buys-from--| Customers, with a single bar (one) on the Customers side. How is the cardinality of customers misrepresented?", ["There is one customer number, but the cardinality indicates many customers.", "There are many customers, but the cardinality indicates one customer.", "There is more than one salesperson, but the cardinality indicates multiple salespersons.", "The cardinality of the salesperson number and the customer number do not match."], 1, "A salesperson serves many customers, but the single-bar cardinality wrongly shows only one customer.", "Data Modeling"], ["Reading modality on the right side: the symbol is an open circle (zero) next to 'No Customers'. How do you read it?", ["A maximum of one customer", "A maximum of many customers", "A minimum of zero customers", "A maximum of zero customers"], 2, "Modality is the MINIMUM. The circle/zero means minimum of zero (participation is optional).", "Data Modeling"], ["SALES >--Sold/Sold-Product--|| PRODUCT, with a single bar (one) on the Product side. What is the modality of the product?", ["Two", "At least one", "Two or more", "Dependent on the quantity"], 1, "The bar nearest the entity is the modality = minimum participation of one, so 'at least one'.", "Data Modeling"], ["SALESPERSON relates to itself via Backs-up / Backed-up by, one on each end. Which kind of relationship is this?", ["Unary one-to-one", "Binary one-to-one", "Unary one-to-many", "Binary one-to-many"], 0, "An entity related to itself = unary (recursive). One backs up one = one-to-one.", "Data Modeling"], ["PRODUCT and COMPONENT (PK Product Number + Subassembly Number) relate via Part-of / Includes, crow's foot on both. Which relationship is this?", ["Unary one-to-many", "Binary one-to-many", "Unary many-to-many", "Binary many-to-many"], 2, "A product is built from many components and a component is part of many products, and it loops on the same concept = unary many-to-many (bill of materials).", "Data Modeling"], ["Which three rules for referential integrity are provided by modern RDBMSs? (Choose 3)", ["Sort", "Insert", "Query", "Delete", "Update", "Retrieve"], [1, 3, 4], "Referential integrity rules govern Insert, Update, and Delete (the operations that can break FK references).", "Relational Model"], ["What is an important aspect of referential integrity?", ["Primary keys refer to data in a particular relation.", "Reference points are placed by the database in each record during backups.", "The relationships between entities and attributes are called referrals.", "Reference to data in one relation is based on values in another relation."], 3, "Referential integrity = a value in one relation (FK) must match values in another relation (PK).", "Relational Model"], ["SELECT SPNUM, SPNAME FROM SALESPERSON  -- add a line to find salespersons with commission percentage of 15.", ["* COMMPERCT=15;", "IF COMMPERCT=15;", "AND COMMPERCT=15;", "WHERE COMMPERCT=15;"], 3, "Row filtering uses WHERE. AND only chains an existing WHERE; IF/* aren't filter clauses.", "SQL"], ["SELECT COMMPERCT, YEARHIRE FROM SALESPERSON WHERE SPNUM=22;  -- change it to retrieve the ENTIRE record.", ["Replace WHERE SPNUM=22; with WHERE SPNUM=*", "Replace COMMPERCT, YEARHIRE with an asterisk", "Replace COMMPERCT, YEARHIRE with ALL", "Replace SALESPERSON with ALL"], 1, "SELECT * returns all columns. The asterisk goes in the column list, not the WHERE clause.", "SQL"], ["SELECT CUSTNUM, CUSTNAME, HQCITY FROM CUSTOMER WHERE HQCITY='Los Angeles'  -- also limit to customer number above 1000.", ["AND CUSTNUM>1000;", "AND CUSTNUM>=1000;", "WHERE CUSTNUM<1000", "WHERE CUSTNUM>=1000;"], 0, "A second condition chains with AND, not a second WHERE. 'Higher than 1000' = strictly greater than (>), not >=.", "SQL"], ["What is a key difference between DISTINCT and ORDER BY in SQL SELECT commands?", ["ORDER BY does not alter the presentation of data results and DISTINCT modifies data results.", "ORDER BY modifies the presentation of data results and DISTINCT filters data results.", "ORDER BY changes the order of results in the database and DISTINCT changes the order of results in the view only.", "ORDER BY changes the order of results in the view only and DISTINCT changes the order of results in the database."], 1, "ORDER BY sorts the presentation; DISTINCT filters out duplicate rows. Neither changes data in the database.", "SQL"], ["Which SQL statement alphabetizes customer names WITHIN the same satellite-office city?", ["ORDER BY CUSTNAME, SATCITY;", "ALPHA BY CUSTNAME, SATCITY;", "ORDER BY SATCITY, CUSTNAME;", "ALPHA BY SATCITY, CUSTNAME;"], 2, "Group by city first, then sort names within it: ORDER BY SATCITY, CUSTNAME. There is no ALPHA BY.", "SQL"], ["SELECT PRODNAME FROM SALESPERSON, SALES, PRODUCT ? ? AND SPNAME='Fox' AND QUANTITY>500;  -- pick the join lines.", ["WHERE SALESPERSON.SPNUM=PRODUCT.PRODNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM=SALES.SPNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM>SALES.SPNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM=SALES.SPNUM AND SALES.PRODNUM=SALES.SPNUM"], 1, "Join on matching keys: SALESPERSON.SPNUM=SALES.SPNUM and SALES.PRODNUM=PRODUCT.PRODNUM. The bridge table SALES links the two.", "SQL"], ["SELECT COUNT(*) ? WHERE PUBLISHER.PUBNAME=BOOK.PUBNAME AND CITY='Los Angeles' AND COUNTRY='United States' AND PAGES>=800;  -- pick the FROM line.", ["FROM PUBNAME.BOOK", "FROM PUBLISHER, BOOK", "WHERE PUBNAME = BOOK", "WHERE PUBLISHER = BOOK"], 1, "Two tables are referenced, so FROM PUBLISHER, BOOK. The WHERE already does the join on PUBNAME.", "SQL"], ["Which SQL retrieves rows for all stores in Atlanta OR Los Angeles OR New York?", ["SELECT StoreID, City FROM Suppliers WHERE City IN ('Atlanta', 'Los Angeles', 'New York');", "SELECT StoreID, City FROM Suppliers WHERE City BETWEEN 'Atlanta' AND 'Los Angeles' AND 'New York';", "SELECT StoreID, City FROM Suppliers WHERE City BETWEEN 'Atlanta' OR 'Los Angeles' OR 'New York';", "SELECT StoreID, City FROM Suppliers WHERE (City='Atlanta' AND City='Los Angeles' AND City='New York');"], 0, "IN ('a','b','c') matches any value in the list. A single column can't equal three values with AND.", "SQL"], ["SELECT * FROM PRODUCT;  -- what does this accomplish?", ["List all PRODUCT from the * table.", "Delete all products from the PRODUCT table view.", "Delete all entries in the PRODUCT table.", "List all entries in the PRODUCT table."], 3, "SELECT * FROM PRODUCT lists every row and column of PRODUCT. SELECT never deletes.", "SQL"], ["A product-marketing company adds an RDBMS to store customer info. What advantage do they gain?", ["Increased sales", "Lower advertising costs", "Improved query response times", "Decreased skill acquisition times"], 2, "An RDBMS's concrete technical benefit is faster querying/retrieval. Sales/ad cost are indirect business hopes.", "Relational Model"], ["In which two ways does a DBMS environment increase effectiveness when working with data? (Choose 2)", ["It enables data sharing.", "It duplicates redundant data for security.", "It permits storage of vast volumes of data.", "It increases the complexity rules by which data is organized."], [0, 2], "A DBMS enables data sharing and stores vast volumes. It REDUCES redundancy and complexity, not increases them.", "Relational Model"], ["Sales data has customer names, products sold, and salespersons. Which qualifies as intersection data of BOTH product and salesperson?", ["Quantity", "Products", "Salespersons", "Customer names"], 0, "Quantity sits on the M:N relationship between salesperson and product = intersection data. (The exam keyed Quantity; watch the wording.)", "Data Modeling"], ["What is an attribute or group of attributes that uniquely identifies a tuple in a relation?", ["Index key", "Foreign key", "Primary key", "Physical key"], 2, "The primary key uniquely identifies each tuple (row). FK references another table; index is a lookup structure.", "Relational Model"], ["What is necessary for a primary key in one relation to match its corresponding foreign key in another relation of the same database?", ["A domain of values", "Intersection data", "An attribute name", "A quantity"], 0, "PK and FK must share the same domain (data type and set of valid values) to match.", "Relational Model"], ["What uniquely identifies each entity in a collection but is NOT the primary key?", ["The foreign key", "The secondary key", "The alternate key", "The master key"], 2, "A candidate key not chosen as the primary key is the alternate key.", "Relational Model"], ["What is a term for a set of columns that can uniquely identify any record in a table without referring to other data?", ["Foreign key", "Primary key", "Alternate key", "Candidate key"], 3, "A candidate key is any column set that could serve as PK (self-sufficient unique identifier). The chosen one becomes PK; the rest are alternate keys.", "Relational Model"], ["What happens to the original data in database indexing?", ["It is moved to the index.", "It is copied to the index.", "It is compiled by the DBMS.", "It is translated into hexadecimals."], 1, "Indexing copies key values (plus pointers) into the index; the original rows stay put.", "Relational Model"], ["Why are indexes created in a physical database design?", ["To group data into aggregations", "To iterate across data in a sequence", "To retrieve data directly using a pointer", "To summarize data into dimensions for a cube"], 2, "Indexes give direct pointer-based access to rows, avoiding full scans.", "Relational Model"], ["Why is an index created on a database column?", ["To optimize data integrity", "To optimize data updates", "To optimize data retrievals", "To optimize data insertions"], 2, "Indexes optimize retrieval/lookups. They actually slow inserts/updates (the index must be maintained).", "Relational Model"], ["What is a methodology for organizing attributes into tables?", ["Data normalization", "Data redundancy", "Data indexing", "Data compression"], 0, "Normalization organizes attributes into well-structured tables to reduce redundancy and anomalies.", "Normalization"], ["What is the term for the value of one particular attribute being associated with a specific single value of another attribute?", ["Functional dependency", "Transitive dependency", "Decomposition", "Normalization"], 0, "A determines B = functional dependency (A -> B). Transitive is A->B->C; decomposition splits tables.", "Normalization"], ["A table repeats Project Code with Employee, Department, and Hourly Rate across many rows, all single-valued. In which state are the attributes?", ["Unnormalized", "First normal form", "Second normal form", "Third normal form"], 1, "All cells single-valued with a defined key = 1NF. Partial dependencies on a composite key still exist, so not yet 2NF.", "Normalization"], ["A Students table (IDSt, LastName, IDProf, Prof, Grade) — which factor determines it is in first normal form?", ["There are no functional dependencies.", "The fourth column shows the foreign keys.", "The attributes are all single valued.", "The first column is in numerical order."], 2, "1NF requires atomic (single-valued) attributes. Ordering and FKs are irrelevant to 1NF.", "Normalization"], ["Two tables: (ID, Contract, Code) keyed on ID, and (Code, City, Country) keyed on Code. How advanced in normalization?", ["Unnormalized", "First normal form", "Second normal form", "Third normal form"], 3, "Splitting out Code->City,Country removes the transitive dependency. Single-key tables with no transitive deps = 3NF.", "Normalization"], ["Four split tables (SALESPERSON, DEPARTMENT, PRODUCT, QUANTITY). Which characteristic points to third normal form?", ["Each primary key has a functional dependency on every other primary key in the table.", "'Salesperson Number' appears in more than one table.", "The tables are completely free of data redundancy.", "The attributes are all single valued."], 2, "3NF eliminates transitive dependencies, leaving the design free of redundancy. Single-valued alone is just 1NF.", "Normalization"], ["Which set of results should a company expect from implementing a business intelligence system?", ["Increased profitability and increased throughput", "Reduced hardware redundancy and decreased workloads", "Increased profitability and reduced hardware redundancy", "Riskier capital and asset investments and increased throughput"], 0, "BI drives better decisions -> increased profitability and throughput. Hardware redundancy isn't a BI outcome.", "Business Intelligence"], ["Which issue is focused on the LOADING component of extract, transform, load (ETL)?", ["Monitor refreshing volume and frequency", "Denormalizing and renormalizing the data", "Mapping keys from one system to another", "Determining the content of the data"], 0, "Loading concerns how/when data refreshes into the target: volume and frequency. Mapping/denormalizing happen in Transform.", "Business Intelligence"], ["During which ETL step are raw data sets aggregated?", ["Loading", "Extraction", "Conversion", "Transformation", "Denormalization"], 3, "Aggregation, cleansing, and conversion happen in Transformation. Extract pulls; Load writes.", "Business Intelligence"], ["How is prediction distinguished from estimation in data mining?", ["Prediction is used to look at historical data only.", "Estimation assumptions do not need to be tested.", "Prediction classifies objects according to an expected future behavior.", "Estimation divides small collections of entities into smaller groups of similar entities."], 2, "Prediction assigns a future class/value (forward-looking). Estimation produces a continuous value from known data.", "Business Intelligence"], ["Where does affinity grouping occur in data mining?", ["Among entities and target applications", "Between entity group names", "Between objects", "Among clusters"], 2, "Affinity grouping (market-basket/association) finds which objects occur together. It's between objects.", "Business Intelligence"]];
const LS = "c175drill_v1";
const C=27*2*Math.PI;
let queue=[], cur=0, curOpts=[], waiting=false, picked=new Set(), filter="";
const $=s=>document.getElementById(s);
let state=load();

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.length===MCQS.length)return s;}catch(e){}return MCQS.map(()=>({c:0,seen:false}));}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function isMulti(i){return Array.isArray(MCQS[i][2])}
function corrSet(i){return new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]])}

function idxs(){return MCQS.map((_,i)=>i).filter(i=>!filter||MCQS[i][4]===filter)}
function rebuild(){queue=idxs().filter(i=>state[i].c<2);if(queue.length)shuffle(queue);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function rings(){
  const pool=idxs();const seen=pool.filter(i=>state[i].seen).length;
  const apt=pool.reduce((s,i)=>s+Math.min(state[i].c,2)/2,0)/(pool.length||1);
  const sp=pool.length?seen/pool.length:0;
  $("seenR").style.strokeDashoffset=C*(1-sp);$("seenN").textContent=Math.round(sp*100)+"%";
  $("aptR").style.strokeDashoffset=C*(1-apt);$("aptN").textContent=Math.round(apt*100)+"%";
  const mastered=pool.filter(i=>state[i].c>=2).length;
  $("count").textContent=mastered+" / "+pool.length+" mastered";
}

function render(){
  rings();
  if(!queue.length){
    const pool=idxs();
    $("stage").innerHTML='<div class="done"><h2>'+(pool.every(i=>state[i].c>=2)?"Pool mastered ✓":"Nothing left in queue")+'</h2><p>Every question answered correctly twice.</p><button class="btn" id="again">Study again</button></div>';
    $("again").onclick=()=>{idxs().forEach(i=>state[i].c=0);save();rebuild();render()};return;
  }
  cur=queue[0];waiting=false;picked=new Set();
  const m=MCQS[cur],multi=isMulti(cur);
  curOpts=m[1].map((t,oi)=>({oi,text:t}));shuffle(curOpts);
  let h='<div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="opts">';
  curOpts.forEach((o,d)=>{h+='<button class="ans" data-disp="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  h+='</div>';
  if(multi)h+='<button class="chk" id="chk" disabled>Check</button>';
  h+='<div class="explain" id="exp"></div><div class="cont" id="cont">tap or press space to continue</div>';
  $("stage").innerHTML=h;
  [...document.querySelectorAll("#opts .ans")].forEach(b=>b.onclick=()=>pick(+b.dataset.disp));
  if(multi)$("chk").onclick=submit;
}

function pick(d){
  if(waiting)return;
  if(isMulti(cur)){
    const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');
    if(picked.has(d)){picked.delete(d);b.classList.remove("sel")}else{picked.add(d);b.classList.add("sel")}
    $("chk").disabled=picked.size===0;return;
  }
  picked=new Set([d]);submit();
}

function submit(){
  if(waiting)return;waiting=true;
  const m=MCQS[cur],cs=corrSet(cur);
  const chosen=new Set([...picked].map(d=>curOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#opts .ans").forEach(b=>{
    const oi=curOpts[+b.dataset.disp].oi;b.style.pointerEvents="none";
    if(cs.has(oi))b.classList.add("correct");
    else if(chosen.has(oi))b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(isMulti(cur))$("chk").style.display="none";
  state[cur].seen=true;
  if(ok)state[cur].c++;else state[cur].c=0;
  save();
  const e=$("exp");e.className="explain show "+(ok?"ok":"no");
  e.innerHTML="<b>"+(ok?"Correct.":"Not quite.")+"</b> "+esc(m[3]);
  // requeue
  queue.shift();
  if(ok&&state[cur].c>=2){/* retire */}
  else{const off=ok?Math.min(10,queue.length):Math.min(3,queue.length);queue.splice(off,0,cur)}
  rings();
  if(ok){$("cont").classList.remove("show");setTimeout(()=>{if(waiting)next()},460)}
  else $("cont").classList.add("show");
}

function next(){if(waiting){waiting=false;render()}}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

document.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){if(waiting){e.preventDefault();next()}return}
  const n="1234".indexOf(e.key),a="abcd".indexOf(e.key.toLowerCase());
  const d=n>=0?n:a;if(d>=0){const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');if(b)pick(d)}
});

// topic dropdown
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("topic").appendChild(o)});
$("topic").onchange=()=>{filter=$("topic").value;rebuild();render()};
$("reset").onclick=()=>{if(confirm("Wipe all drill progress?")){state=MCQS.map(()=>({c:0,seen:false}));save();rebuild();render()}};

rebuild();render();
</script></body></html>
