["Which set of results should a company expect from implementing a business intelligence system?", ["Increased profitability and increased throughput", "Reduced hardware redundancy and decreased workloads", "Increased profitability and reduced hardware redundancy", "Riskier capital and asset investments and increased throughput"], 0, "BI drives better decisions -> increased profitability and throughput. Hardware redundancy isn't a BI outcome.", "Data Warehousing", 1],

["What does a LEFT JOIN return?", ["All rows from the left table, plus only the matching rows from the right table.", "All rows from the right table, plus only the matching rows from the left table.", "Only the rows that match in both tables.", "All rows from both tables regardless of matches."], 0, "LEFT JOIN keeps every left-table row and fills right-table columns only where a match exists.", "Joins & Views", 1],
["What does a RIGHT JOIN return?", ["All rows from the right table, plus only the matching rows from the left table.", "All rows from the left table, plus only the matching rows from the right table.", "Only the rows that match in both tables."], 0, "RIGHT JOIN keeps every right-table row and matches left rows where possible. Mirror image of LEFT JOIN.", "Joins & Views"],
["What is an outer join?", ["Any join that selects unmatched rows, including left, right, and full joins.", "A join that selects only rows matching in both tables.", "A join that compares columns with an operator other than =."], 0, "'Outer' means it keeps unmatched rows. An inner join drops them; left, right, and full joins keep them.", "Joins & Views", 1],

["A join that compares columns using the = operator is called a:", ["Equijoin", "Non-equijoin", "Self-join", "Cross-join"], 0, "An equijoin uses =. Most joins are equijoins. A non-equijoin uses an operator like < or >.", "Joins & Views"],
["A join that compares columns with an operator other than =, such as < or >, is a:", ["Non-equijoin", "Equijoin", "Cross-join", "Inner join"], 0, "A non-equijoin uses a non-equal operator. Ex: match buyers to properties priced below their maximum.", "Joins & Views"],
["A table that is joined to itself uses a:", ["Self-join", "Cross-join", "Equijoin", "Outer join"], 0, "A self-join joins a table to itself; aliases are required to tell the two copies apart.", "Joins & Views", 1],
["In a self-join, what is required to distinguish the left and right copies of the table?", ["Aliases", "Foreign keys", "A FULL JOIN", "A subquery"], 0, "An alias is a temporary name for a table or column. A self-join needs aliases (e.g. A and B) to reference each copy.", "Joins & Views"],

["An INNER JOIN returns:", ["Only rows that have a match in both tables.", "All rows from the left table.", "All rows from both tables."], 0, "An inner join keeps only matched rows. Use an outer join to keep unmatched rows.", "Joins & Views", 1],
["What is a view table?", ["A table name associated with a SELECT statement, called the view query.", "A permanent stored copy of a base table.", "A disk backup of a table."], 0, "A view is a named SELECT. CREATE VIEW names it; the database stores the query, not the data (unless materialized).", "Joins & Views", 1],
["A table named in a view query's FROM clause is called a:", ["Base table", "View table", "Materialized table", "Result table"], 0, "The tables a view is built from are its base tables.", "Joins & Views", 1],
["A view whose data is physically stored at all times is a:", ["Materialized view", "Base table", "Cross-join", "Staging table"], 0, "A materialized view stores its result. A normal view stores only the query and merges it at runtime.", "Joins & Views", 1],
["Why do MySQL and many databases NOT support materialized views?", ["To avoid the overhead of refreshing the stored view whenever base tables change.", "Because views cannot contain joins.", "Because views cannot be queried."], 0, "A materialized view must refresh on every base-table change, so MySQL skips them to avoid that cost.", "Joins & Views", 1],
["When a non-materialized view is queried, the database executes the query against:", ["The base tables (the view query is merged with the user query).", "The stored view data.", "A temporary copy of the view."], 0, "A non-materialized view stores no data; its query merges with the user query and runs against the base tables.", "Joins & Views"],
["Which is a genuine advantage of using a view?", ["It can hide sensitive columns from users granted access to the view but not the base table.", "It always runs faster than the equivalent base-table query.", "It permanently reduces table storage."], 0, "Views protect sensitive data, save complex queries, and save optimized queries. A non-materialized view runs at the same speed as the merged query.", "Joins & Views", 1],
["Can a view hide rows as well as columns?", ["Yes: columns via the SELECT clause and rows via the WHERE clause of the view query.", "No, a view can only hide columns.", "No, a view can only hide rows."], 0, "Exclude columns in SELECT and rows in WHERE. A view-only user sees neither the excluded columns nor the excluded rows.", "Joins & Views"],
["INSERT, UPDATE, and DELETE through a view are:", ["Disallowed or severely limited, and best avoided.", "Always allowed and recommended.", "Allowed only on materialized views."], 0, "View writes have undefined effects (NULL primary keys, aggregates, join deletes), so databases disallow or limit them. Views are best for SELECT.", "Joins & Views", 1],
["What does the WITH CHECK OPTION clause do?", ["Rejects inserts or updates that would not satisfy the view query's WHERE clause.", "Forces the view to be materialized.", "Checks the view for syntax errors before saving."], 0, "Without it, a view insert can create a row that falls outside the view and appears to vanish. WITH CHECK OPTION blocks those.", "Joins & Views"],
["Which operator correctly tests whether a column value is NULL in a WHERE clause?", ["IS NULL", "= NULL", "== NULL", "LIKE NULL"], 0, "Use IS NULL or IS NOT NULL. The = operator never matches NULL, since any comparison with NULL evaluates to NULL.", "SQL", 1],
["What does the DISTINCT clause do in a SELECT statement?", ["Returns only unique values, removing duplicate result rows.", "Sorts the results in ascending order.", "Filters rows by a condition."], 0, "DISTINCT collapses duplicate result rows down to unique ones.", "SQL"],

["In a LIKE pattern, what does the _ wildcard match?", ["Exactly one character.", "Any number of characters.", "A literal underscore only."], 0, "_ matches exactly one character. 'L_t' matches Lot and Lit, but not Lt or Loot.", "SQL", 1],

["A WHERE condition compares a column to a value, but the column is NULL (e.g. Population > 1000 where Population is NULL). The condition evaluates to:", ["NULL, so the row is not selected.", "TRUE", "FALSE"], 0, "Any comparison with NULL yields NULL, not TRUE, so the row is not selected. This is why you must use IS NULL.", "SQL", 1],
["In a WHERE clause, what does FALSE AND NULL evaluate to?", ["FALSE", "NULL", "TRUE"], 0, "FALSE AND anything is FALSE, even FALSE AND NULL. But TRUE AND NULL is NULL. Watch this three-valued-logic trap.", "SQL", 1],
["What is the definition of Boyce-Codd normal form (BCNF)?", ["Whenever any column A depends on column B, B must be unique (the rule applies to all columns).", "Whenever a non-key column depends on another column, that column must be unique.", "All non-key columns depend on the whole primary key."], 0, "BCNF is the 3NF rule with 'non-key' removed: it applies to ALL columns, so it eliminates redundancy that 3NF still allows.", "Normalization", 1],
["What is the key difference between third normal form and BCNF?", ["3NF's rule applies only to non-key columns; BCNF applies to all columns.", "3NF allows multivalued dependencies; BCNF does not.", "3NF requires a composite key; BCNF requires a simple key."], 0, "That one difference (non-key vs all columns) is why BCNF removes redundancy that can still slip through 3NF.", "Normalization", 1],
["Which normal form is considered the practical 'gold standard' of table design?", ["Boyce-Codd normal form", "First normal form", "Fifth normal form"], 0, "BCNF eliminates all common redundancy. 4NF and 5NF remove rare redundancies of little practical concern.", "Normalization", 1],
["What is a candidate key?", ["A simple or composite column that is both unique and minimal.", "Any column the designer chooses as the primary key.", "A foreign key that references a primary key."], 0, "Unique means no duplicate values; minimal means every column is needed for uniqueness. The designer picks one candidate key as the primary key.", "Normalization", 1],
["What is a non-key column?", ["A column not contained in any candidate key.", "A column that is not the primary key.", "A foreign key column."], 0, "'Non-key' means outside every candidate key, not merely 'not the primary key'. A column inside an alternate key is still a key column.", "Normalization", 1],
["The notation B -> A (A depends on B) means:", ["Each value of B is related to at most one value of A.", "Each value of A is related to at most one value of B.", "A and B are both primary keys."], 0, "Functional dependence: one B determines one A. Ex: FareClass -> BoardingZoneNumber means each fare class has one boarding zone.", "Normalization", 1],
["What does normalization do to a table?", ["Decomposes it into two or more tables in a higher normal form, with no information lost.", "Merges several tables into one wide table.", "Adds redundant columns to speed up queries."], 0, "Normalization splits a redundant table; the moved column lands in a new table keyed on the column it depended on, so nothing is lost.", "Normalization", 1],
["Normalization is the last step of which design phase?", ["Logical design", "Conceptual design", "Physical design"], 0, "Implementing entities, relationships, and attributes can leave redundancy; normalization removes it as the final logical-design step.", "Normalization", 1],
["Fourth and fifth normal forms eliminate which kinds of dependencies?", ["Multivalued and join dependencies, respectively.", "Partial and transitive dependencies, respectively.", "Functional and referential dependencies, respectively."], 0, "4NF removes multivalued dependencies, 5NF removes join dependencies. Both are rare and mostly of theoretical interest.", "Normalization", 1],
["Redundancy in a table is:", ["The repetition of related values, which can cause inconsistent data.", "The use of more than one primary key.", "Storing data across more than one table."], 0, "Redundancy = repeated related values (e.g. (222, Elvira Yin) in many rows). If copies are not updated uniformly, data becomes inconsistent.", "Normalization", 1],
["To normalize to BCNF, when column A depends on a non-unique column B, you:", ["Remove A from the table and put A and B in a new table where B is the primary key.", "Delete column A entirely.", "Make B the primary key of the original table."], 0, "Move the dependent column out: the new table has A and B (B is its primary key and a foreign key in the original). No information is lost.", "Normalization", 1],
["How does operational data differ from analytic data?", ["Operational data runs daily business and changes in real time; analytic data is summarized and updated at fixed intervals.", "Operational data is summarized; analytic data is detailed and real-time.", "They are identical and stored in the same database."], 0, "Operational = volatile, detailed, single-function. Analytic = summarized, periodic, integrated, historical. Different designs, usually separate databases.", "Data Warehousing", 1],
["What is a data warehouse?", ["A separate database optimized for analytics rather than operations.", "The operational database used for daily transactions.", "A temporary staging area used during ETL."], 0, "A warehouse holds data extracted from operational databases and restructured for analytic queries, with a known reference time.", "Data Warehousing", 1],
["What is a data mart?", ["A data warehouse designed for a specific business area, with smaller scope.", "A raw, uncleansed copy of all operational data.", "The middleware layer in a federated database."], 0, "A data mart (e.g. sales or HR) is a narrower warehouse, easier to build, derived from operational data or from a full warehouse.", "Data Warehousing", 1],
["A dimensional design for a data warehouse is also called a:", ["Star schema", "Snowflake schema", "Relational schema"], 0, "Dimensional design = star schema: one central fact table surrounded by dimension tables.", "Data Warehousing", 1],
["What does a fact table contain?", ["Numeric measures of business performance plus foreign keys to dimension tables.", "Textual descriptions of the data.", "Only primary keys, with no measures."], 0, "Facts are figures (revenue, counts). The fact table also holds the foreign keys pointing at the descriptive dimension tables.", "Data Warehousing", 1],
["What does a dimension table contain?", ["Textual data that describes the facts, such as product line or region.", "Numeric measures that get aggregated in reports.", "The composite of all foreign keys."], 0, "Dimensions describe (the who/what/where you filter and group by). Mnemonic: facts are figures, dimensions describe.", "Data Warehousing", 1],
["What is the primary key of a fact table?", ["The composite of all foreign keys referencing the dimension tables.", "A single small meaningless integer.", "The largest numeric measure in the row."], 0, "A fact row is identified by its combination of dimension references, so the primary key is all those foreign keys together.", "Data Warehousing", 1],
["What is typically used as the primary key of a dimension table?", ["A small, meaningless integer.", "The natural business key, such as a license number.", "A composite of all descriptive columns."], 0, "A small meaningless integer keeps the huge fact tables compact and never changes, so the foreign keys never change either.", "Data Warehousing", 1],

["Operational databases are typically kept in which normal form, and why?", ["Third normal form, because it minimizes redundancy for frequent updates.", "First normal form, for fast analytic joins.", "They are deliberately denormalized like a warehouse."], 0, "3NF is update-optimized but produces many tables and slow analytic joins, which is why warehouses use a denormalized star schema instead.", "Data Warehousing", 1],

["What is an embedded database?", ["A database packaged with a programming language that runs in the same process as the application.", "A database that stores all of its data in main memory.", "A collection of autonomous databases under a middleware layer."], 0, "An embedded (in-process) database runs with the app in one process, used in single-user apps needing no administration, such as mobile.", "Database Architecture"],
["Which is the dominant embedded relational database?", ["SQLite", "MongoDB", "Oracle Database"], 0, "SQLite is the open-source dominant embedded database, supporting all major programming languages.", "Database Architecture", 1],
["Embedded databases are best suited for:", ["Single-user applications that need no database administration, such as mobile apps.", "Large multi-user enterprise systems.", "Analytic queries over terabytes of data."], 0, "Embedded databases emphasize ease of development and low resource use, not scalability to many users.", "Database Architecture"],
["What is a data lake?", ["An analytic database of raw, unprocessed data copied from multiple sources in its original format.", "A cleansed, integrated, and restructured analytic database.", "A single-user embedded database."], 0, "A data lake stores data as-is, not cleansed/integrated/restructured. Image: dump it in raw, versus shelve it labeled in a warehouse.", "Database Architecture", 1],

["In a federated database, what is the global catalog?", ["A directory of the participating databases' objects, such as tables, columns, and indexes.", "The component that merges query results.", "The middleware that translates query syntax."], 0, "Global catalog = the directory. The global query processor decomposes and merges; the wrapper translates syntax per database.", "Database Architecture"],

["Why must in-memory database data be periodically backed up to storage media?", ["Main memory is volatile and is lost on a power failure or crash.", "Main memory is too small to hold a full database.", "Backups make queries run faster."], 0, "RAM is fast but volatile, so in-memory databases back up to disk and often log inserts/updates/deletes to recover after a crash.", "Database Architecture"],

const LS = "c175drill_v1";
const C=22*2*Math.PI;
let queue=[], cur=0, curOpts=[], waiting=false, picked=new Set(), filter="", waitAt=0;
let mode=localStorage.getItem("c175drill_mode")||"core";
const $=s=>document.getElementById(s);
let state=load();

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(Array.isArray(s)){while(s.length<MCQS.length)s.push({c:0,seen:false,lta:[]});const t=s.slice(0,MCQS.length);t.forEach(p=>{if(!Array.isArray(p.lta))p.lta=[]});return t;}}catch(e){}return MCQS.map(()=>({c:0,seen:false,lta:[]}));}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function isMulti(i){return Array.isArray(MCQS[i][2])}
function corrSet(i){return new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]])}

const APTW=[.5,.25,.15,.1];
function qApt(i){const l=state[i].lta||[];let a=0;for(let k=0;k<4;k++)a+=APTW[k]*(l[k]===undefined?.25:l[k]);return a}
function idxs(){return MCQS.map((_,i)=>i).filter(i=>(mode==="full"||MCQS[i][5]===1)&&(!filter||MCQS[i][4]===filter))}
function rebuild(){queue=idxs().filter(i=>state[i].c<2);if(queue.length){shuffle(queue);queue.sort((a,b)=>(state[a].seen?1:0)-(state[b].seen?1:0));}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function rings(){
  const pool=idxs();const seen=pool.filter(i=>state[i].seen).length;
  const apt=pool.reduce((s,i)=>s+(state[i].seen?qApt(i):0),0)/(pool.length||1);
  const sp=pool.length?seen/pool.length:0;
  $("seenR").style.strokeDashoffset=C*(1-sp);$("seenN").textContent=Math.round(sp*100)+"%";
  $("aptR").style.strokeDashoffset=C*(1-apt);$("aptN").textContent=Math.round(apt*100)+"%";
  const mastered=pool.filter(i=>state[i].c>=2).length;
  $("count").textContent=mastered+" / "+pool.length+" mastered";
}

function render(){
  rings();
  if(!queue.length){
    const pool=idxs();
    $("stage").innerHTML='<div class="done"><h2>'+(pool.every(i=>state[i].c>=2)?"Pool mastered ✓":"Nothing left in queue")+'</h2><p>Every question answered correctly twice.</p><button class="btn" id="again">Study again</button></div>';
    SND.win();GAME.win();
    $("again").onclick=()=>{idxs().forEach(i=>state[i].c=0);save();rebuild();render()};return;
  }
  cur=queue[0];waiting=false;picked=new Set();
  const m=MCQS[cur],multi=isMulti(cur);
  curOpts=m[1].map((t,oi)=>({oi,text:t}));shuffle(curOpts);
  let h='<div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="opts">';
  curOpts.forEach((o,d)=>{h+='<button class="ans" data-disp="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  h+='</div>';
  if(multi)h+='<button class="chk" id="chk" disabled>Check</button>';
  h+='<div class="explain" id="exp"></div><div class="cont" id="cont">tap or press space to continue</div>';
  $("stage").innerHTML=h;
  [...document.querySelectorAll("#opts .ans")].forEach(b=>b.onclick=()=>pick(+b.dataset.disp));
  if(multi)$("chk").onclick=submit;
}

// --- gamification layer ---
var GAME=(function(){
var xp=0,streak=0,best=+(localStorage.getItem(LS+"_bestStreak")||0),rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var st=document.createElement("style");st.textContent="@keyframes gPop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}.gPop{position:fixed;left:50%;top:38%;z-index:99;font-family:'Nunito',-apple-system,sans-serif;font-size:21px;font-weight:800;color:#37b06f;animation:gPop .9s ease-out forwards;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.18)}@keyframes gFall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}.gCf{position:fixed;z-index:98;width:8px;height:12px;border-radius:2px;animation:gFall var(--t) ease-out forwards;pointer-events:none}@keyframes gTick{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}.chip.tick{animation:gTick .3s ease-out}";
document.head.appendChild(st);
var elS=document.getElementById("hudStreak"),elX=document.getElementById("hudXP"),elB=document.getElementById("hudBest");
function hud(t){
if(elS){elS.textContent="\uD83D\uDD25 "+streak;elS.classList.toggle("warm",streak>=3&&streak<6);elS.classList.toggle("hot",streak>=6);
if(t&&!rm){elS.classList.remove("tick");void elS.offsetWidth;elS.classList.add("tick")}}
if(elX){elX.textContent=xp+" XP";if(t&&!rm){elX.classList.remove("tick");void elX.offsetWidth;elX.classList.add("tick")}}
if(elB){elB.textContent="best "+best;elB.style.display=best>1?"":"none"}}
function pop(txt,color){var d=document.createElement("div");d.className="gPop";if(color)d.style.color=color;d.textContent=txt;document.body.appendChild(d);setTimeout(function(){d.remove()},950)}
function burst(n,fromTop){if(rm)return;var cols=["#1f93cc","#a3ddc6","#f4d79a","#f6a8a0","#c4b4e6"];for(var i=0;i<n;i++){var c=document.createElement("div");c.className="gCf";c.style.background=cols[i%5];c.style.left=(fromTop?Math.random()*100:45+Math.random()*10)+"%";c.style.top=fromTop?"-16px":"36%";c.style.setProperty("--dx",(Math.random()*260-130)+"px");c.style.setProperty("--dy",(fromTop?300+Math.random()*500:120+Math.random()*260)+"px");c.style.setProperty("--rot",(Math.random()*720-360)+"deg");c.style.setProperty("--t",(0.7+Math.random()*0.8)+"s");document.body.appendChild(c);setTimeout(function(e){return function(){e.remove()}}(c),1600)}}
function ok(mastered){streak++;if(streak>best){best=streak;try{localStorage.setItem(LS+"_bestStreak",best)}catch(e){}}
var pts=10*Math.min(streak,5)+(mastered?25:0);xp+=pts;pop("+"+pts+" XP"+(mastered?" \u2605":""),mastered?"#e8b23a":"#37b06f");if(mastered)burst(14);else if(streak%5===0)burst(10);hud(true)}
function no(){streak=0;hud(false)}
function win(){burst(90,true);pop("POOL MASTERED","#e8b23a")}
hud(false);
return{ok:ok,no:no,win:win}
})();
// --- audio feedback (Web Audio synth, no assets) ---
var SND=(function(){
var ctx=null,muted=(localStorage.getItem("drillSnd")==="0"),streak=0;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,t0,dur,type,vol){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02)}
function ok(mastered){streak++;if(muted)return;var s=Math.min(streak,12),b=660*Math.pow(2,(s-1)/24);tone(b,0,.09);tone(b*1.5,.07,.12);if(mastered){tone(1318.5,.16,.1,"triangle",.09);tone(1760,.24,.14,"triangle",.09)}if(streak%5===0){tone(b*2,.2,.18,"sine",.08)}}
function no(){streak=0;if(muted)return;tone(196,0,.16,"triangle",.08);tone(147,.09,.2,"triangle",.08)}
function win(){if(muted||!ctx)return;[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*.11,.22,"sine",.1)});tone(1318.5,.5,.4,"triangle",.08)}
function toggle(){muted=!muted;localStorage.setItem("drillSnd",muted?"0":"1");return muted}
return{ok:ok,no:no,win:win,toggle:toggle,muted:function(){return muted}}
})();
(function(){var a=document.getElementById("sndBtn");if(!a)return;function r(){a.textContent=SND.muted()?"\uD83D\uDD07 sound":"\uD83D\uDD0A sound"}a.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();SND.toggle();r()});r()})();

function pick(d){
  if(waiting)return;
  if(isMulti(cur)){
    const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');
    if(picked.has(d)){picked.delete(d);b.classList.remove("sel")}else{picked.add(d);b.classList.add("sel")}
    $("chk").disabled=picked.size===0;return;
  }
  picked=new Set([d]);submit();
}

function submit(){
  if(waiting)return;waiting=true;waitAt=Date.now();
  const m=MCQS[cur],cs=corrSet(cur);
  const chosen=new Set([...picked].map(d=>curOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#opts .ans").forEach(b=>{
    const oi=curOpts[+b.dataset.disp].oi;b.style.pointerEvents="none";
    if(cs.has(oi))b.classList.add("correct");
    else if(chosen.has(oi))b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(isMulti(cur))$("chk").style.display="none";
  state[cur].seen=true;
  if(ok)state[cur].c++;else state[cur].c=0;
  state[cur].lta=[ok?1:0].concat(state[cur].lta||[]).slice(0,4);
  if(ok)SND.ok(state[cur].c>=2);else SND.no();
  if(ok)GAME.ok(state[cur].c>=2);else GAME.no();
  save();
  const e=$("exp");e.className="explain show "+(ok?"ok":"no");
  e.innerHTML="<b>"+(ok?"Correct.":"Not quite.")+"</b> "+esc(m[3]);
  // requeue
  queue.shift();
  if(ok&&state[cur].c>=2){/* retire */}
  else{const uns=queue.reduce((n,i)=>n+(state[i].seen?0:1),0);const off=ok?Math.min(uns+8,queue.length):Math.min(3,queue.length);queue.splice(off,0,cur)}
  rings();
  if(ok){$("cont").classList.remove("show");setTimeout(()=>{if(waiting)next()},460)}
  else $("cont").classList.add("show");
}

function next(){if(waiting){waiting=false;render()}}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

document.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){if(waiting){e.preventDefault();next()}return}
  const n="1234".indexOf(e.key),a="abcd".indexOf(e.key.toLowerCase());
  const d=n>=0?n:a;if(d>=0){const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');if(b)pick(d)}
});
$("stage").addEventListener("click",()=>{if(waiting&&Date.now()-waitAt>250)next()});

// topic dropdown
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("topic").appendChild(o)});
$("topic").onchange=()=>{filter=$("topic").value;rebuild();render()};
$("reset").onclick=()=>{if(confirm("Wipe all drill progress?")){state=MCQS.map(()=>({c:0,seen:false,lta:[]}));save();rebuild();render()}};

function setMode(m){mode=m;localStorage.setItem("c175drill_mode",m);$("mCore").classList.toggle("on",m==="core");$("mFull").classList.toggle("on",m==="full");rebuild();render()}
$("mCore").onclick=()=>setMode("core");$("mFull").onclick=()=>setMode("full");
setMode(mode);

document.addEventListener("click", function(e){
  if(!waiting) return;
  if(Date.now()-waitAt<250) return;
  var t=e.target;
  if(t.closest && t.closest("select,a,#themeBtn,.seg,.reset")) return;
  next();
});
</script>
<button id="themeBtn" class="themeb" aria-label="toggle theme">☾</button>
<script>
(function(){
  var K="drill_theme", btn=document.getElementById("themeBtn");
  var qp=null; try{qp=new URLSearchParams(location.search).get("theme");}catch(e){}
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  var t=qp||saved||"light";
  function apply(x){document.documentElement.setAttribute("data-theme",x);btn.textContent=x==="dark"?"\u2600":"\u263e";}
  apply(t);
  btn.addEventListener("click",function(){t=(t==="dark")?"light":"dark";try{localStorage.setItem(K,t)}catch(e){}apply(t);});

</script>
