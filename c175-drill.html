<script>
const MCQS = [["Where would a bank customer's account data be directly stored?", ["In the Banking database system", "In the customer banking application", "In the Bank database"], 2, "A customer's banking data is stored in a database.", "Intro to Databases"], ["Which of the following manages the Bank database?", ["The customer banking application", "The banking database system", "The computer the Banking database system resides on"], 1, "A database system provides support for database management, security, and access.", "Intro to Databases"], ["Which of the following would prevent unauthorized access to the Bank database?", ["The banking database system", "The Bank database", "The customer banking application"], 0, "Database systems ensure data is secure and safe.", "Intro to Databases"], ["How would a bank customer access their bank data?", ["Through the banking database system", "Through the customer banking application", "Through the Bank Database"], 1, "Applications interact with a database system to access data that is stored in databases.", "Intro to Databases"], ["Which role is responsible for providing access to the database?", ["Database administrator", "Database designer", "Database programmer", "Database users"], 0, "Database administrators establish procedures for database security and user access.", "Intro to Databases"], ["Which role is responsible for defining the detailed database design?", ["Database administrator", "Database designer", "Database programmer", "Database users"], 1, "Database designers are responsible for the database design, deciding how data should be organized for quick access.", "Intro to Databases"], ["Which role uses an application to query a database and generate a report?", ["Database designer", "Database administrator", "Database programmer", "Database users"], 3, "Database users typically access the database via an application. Advanced users may use a query language instead.", "Intro to Databases"], ["If program A writes to bookkeeping.txt the same time that program B reads from bookkeeping.txt, what can potentially go wrong?", ["Nothing can go wrong.", "Program A may be writing only partial data.", "Program B may be reading only partial data."], 2, "Program B may miss a recent update made to the file by Program A. A database can manage reading and writing to shared data to avoid such problems.", "Intro to Databases"], ["How might a database help avoid invalid data in transactions, such as that posted on 13/31 for the amount +6z@yy?", ["By applying rules", "By encrypting data", "By preventing access"], 0, "Databases can enforce structural rules, such as valid date formats and numeric data types, to help avoid invalid data from being stored.", "Intro to Databases"], ["What security can a database provide to help prevent unauthorized transactions, such as the $999999 deposit added to bookkeeping.txt?", ["File hiding", "Access control", "Data mirroring"], 1, "A database can restrict access to specific data and operations based on user authentication and role-based permissions, helping to prevent unauthorized transactions.", "Intro to Databases"], ["Logical design is:", ["A process only", "A specification only", "Either a process or a specification"], 2, "Depending on context, logical design means either a specification for tables, keys, and columns, or the process that creates the specification.", "Intro to Databases"], ["A schema is depicted in:", ["An ER diagram", "A table diagram"], 1, "A schema specifies the result of logical design, not the result of conceptual design.", "Intro to Databases"], ["What is a broad definition of data?", ["Numbers that are captured on digital media", "Raw facts that are captured on printed or digital media", "Alphanumeric combinations that can be captured on media that a computer can read", "Any information that can be transferred from print to digital"], 1, "Data = raw facts on printed or digital media. 'Information' is processed data; don't confuse the two.", "Intro to Databases"], ["What are data?", ["Facts that have been organized in a meaningful way", "Facts that are the result of a query of a database system", "Facts that are collected and stored in a database system", "Facts that have been processed and used for decision making"], 2, "Data are collected and stored facts. 'Organized meaningfully' / 'processed for decisions' = information.", "Intro to Databases"], ["What is a determining characteristic of unstructured data?", ["It does not allow copying and pasting.", "It is easy to query and retrieve by business applications.", "It does not follow a data model.", "It is stored in rows and columns."], 2, "Unstructured data has no predefined data model (video, images, free text). Rows/columns = structured.", "Intro to Databases"], ["In a flow diagram, which item represents unstructured data? (A=Training Video Content, B=SQL tables of training instructors, C=Relational DB, D=Training DB backup)", ["A (Training Video Content)", "B (SQL tables)", "C (Relational database)", "D (Database backup)"], 0, "Video content has no data model = unstructured. SQL tables and the relational DB are structured.", "Intro to Databases"], ["Which is true about flat files?", ["They contain no internal hierarchical organization.", "They have a limit of 256 records.", "They can only contain two-dimensional data.", "They are always encrypted."], 0, "Flat files have no internal hierarchy. No record limit, not 2D-only, not inherently encrypted.", "Intro to Databases"], ["Which technology has no internal hierarchy?", ["Flat files", "Heap files", "Hashed tables", "Relational databases"], 0, "Flat files store data with no internal hierarchy or relationships.", "Intro to Databases"], ["How were data retrieved before database management systems?", ["Randomly from linked files", "Sequentially from simple files", "Using set operations on complex files", "Using relationships between logical entities"], 1, "Pre-DBMS, data was read sequentially from simple/flat files. Set ops and logical relationships are DBMS features.", "Intro to Databases"], ["Which database is relational?", ["Oracle Database", "IDMS", "MongoDB"], 0, "Oracle Database, initially released in 1979, is the first commercial database to support Structured Query Language (SQL). Oracle Database is now one of the most widely used relational database systems.", "Relational Databases"], ["The relational model was originally developed for which types of applications?", ["Big data storage and analysis", "Transactional applications like banking and airline reservations", "Desktop applications with small databases"], 1, "At the time the relational model was designed, transactional applications were most important. Today, most transactional systems like banking and airline reservations are built on relational databases.", "Relational Databases"], ["What was the initial impediment to commercial adoption of relational databases in the early 1980s?", ["Reliability", "Processing speed", "Cost"], 1, "Early relational products were not as fast as more established non-relational products. However, as relational databases matured, processing speed rapidly caught up with non-relational databases.", "Relational Databases"], ["Which terms are commonly used in database processing?", ["Tuple, relation, attribute", "Row, table, column", "Record, file, field"], 1, "The most commonly used terms in relational database are row, column, and table. Occasionally tuple, relation, attribute and record, file, field are also used.", "Relational Databases"], ["Are these tables the same? { (8, mango, FALSE), (-11, watermelon, FALSE) } { (-11, watermelon, FALSE), (8, mango, FALSE) }", ["Yes", "No"], 0, "Both tables contain the same rows. Since a table is a set, the order of the rows does not matter.", "Relational Databases"], ["In the relational data structure, which components are named?", ["Data type, row, table", "Data type, table", "Data type, table, column"], 2, "Data type, table, and column are all named. Rows are not named.", "Relational Databases"], ["Can a query select one specific row from a table?", ["Yes, by specifying the row name", "Yes, by specifying one or more row values", "No"], 1, "A query selects a specific row by specifying one or more row values. Ex: SELECT EmployeeName FROM Employee WHERE EmployeeID = 2594; selects rows with the value 2594 in the EmployeeID column. If each row has a different value, only one row is selected.", "Relational Databases"], ["What is the result of a relational operation?", ["A row", "A column", "A table"], 2, "All relational operations result in a table. The result table is not stored in the database but has the same structure as stored tables.", "Relational Databases"], ["Name three relational operations.", ["Select, project, and union", "Square root, exponent, and logarithm", "Integrate and differentiate"], 0, "Relational algebra is based on operations of mathematical set theory, such as select, project, and union.", "Relational Databases"], ["An SQL statement can implement only one relational operation.", ["True", "False"], 1, "Most SQL queries implement several operations. Ex: SELECT Name FROM Employee WHERE Salary > 50000; implements both a select and a project operation.", "Relational Databases"], ["Which choice is a column name?", ["6381", "Sam Snead", "Salary"], 2, "Salary is the name of the third column of the Employee table. Column names are highlighted and appear in the top row of a table.", "Relational Databases"], ["What are the components of a column?", ["Name only", "Data type only", "Name and data type"], 2, "A column has both a name and a data type. The name and data type are specified in the SQL language when a table is created.", "Relational Databases"], ["Must a table have at least one row?", ["Yes", "No"], 1, "A table without rows is called an empty table.", "Relational Databases"], ["How often do column names and data types change?", ["Never", "Occasionally", "Often"], 1, "The database administrator can change column names and data types, but this may affect programs that use the database, and does not happen often.", "Relational Databases"], ["How does a database administrator specify column names and data types?", ["In a special file managed by the database administrator", "With the Python language", "With the SQL language"], 2, "The SQL language contains statements to define and change column names and data types for relational databases.", "Relational Databases"], ["How many values may appear in each cell?", ["Any number of values", "Exactly one value", "No values or one value"], 1, "Tables must be normalized, so only one value may appear in each cell.", "Relational Databases"], ["Where are duplicate column names allowed?", ["Within a single table.", "In different tables.", "Never."], 1, "Duplicate column names are not allowed within the same table, but are allowed in different tables. Programmers can distinguish identical column names in different tables by adding the table name as a prefix to a column name.", "Relational Databases"], ["What does the principle of data independence state?", ["The performance of a query is not related to the physical organization of data.", "Data in each row is independent of data in all other rows.", "The result of a database query is not affected by the physical organization of data on storage devices."], 2, "In relational databases, query results are not dependent on physical storage. This allows database administrators to tune storage for optimal performance at any time.", "Relational Databases"], ["How can driver's license information be added to the Employee table?", ["Driver's licenses cannot be added, since the Employee table already has an ID column.", "By creating another column named ID.", "By creating another column with a new name, such as ID2 or DriverLicense."], 2, "A table may have several columns with similar information, as long as the column names are different.", "Relational Databases"], ["What does a NULL in the Name column represent?", ["Unknown", "Inapplicable", "Either unknown or inapplicable"], 0, "Every employee has a name, so NULL indicates the name exists but has not been entered. The name is unknown to the database.", "Relational Databases"], ["In the Bonus column of the Lisa Ellison row, what does the zero represent?", ["Lisa Ellison's bonus is unknown.", "Lisa Ellison is not eligible for a bonus.", "Lisa Ellison has earned no bonus."], 2, "Zero is a valid bonus amount. Zero is not the same as unknown or inapplicable data.", "Relational Databases"], ["If the Department column is designated NOT NULL, what happens when a user attempts to insert a new employee without a department value?", ["The database accepts the insert and stores a blank string as the Department name.", "The database accepts the insert and saves NULL in the column.", "The database rejects the insert."], 2, "A database does not accept an insert with missing Department data. The insert statement fails.", "Relational Databases"], ["Does the NULL in the Manager column violate referential integrity?", ["Yes", "No"], 1, "Manager is a single-column, or simple, foreign key. A NULL in a simple foreign key does not violate referential integrity.", "Relational Databases"], ["In the HealthPlan table, which foreign key value is fully NULL?", ["(6381, NULL)", "(NULL, NULL)", "No foreign key values are fully NULL"], 1, "(NULL, NULL) is fully NULL, since all foreign key columns are NULL.", "Relational Databases"], ["Which columns can be compared in a join?", ["Only primary and foreign key columns.", "Only columns with comparable data types.", "Any columns."], 1, "A join can compare any columns with comparable data types. Most often, a foreign key of one join table is compared to the primary key of another.", "Relational Databases"], ["In a join, what are the first and second tables in the FROM clause called?", ["Left and right tables, respectively.", "Right and left tables, respectively.", "Table one and table two, respectively."], 0, "The first table that appears in the FROM clause of a join statement is called the left table. The second is called the right table.", "Relational Databases"], ["Which three rules for referential integrity are provided by modern RDBMSs? (Choose 3)", ["Sort", "Insert", "Query", "Delete", "Update", "Retrieve"], [1, 3, 4], "Referential integrity rules govern Insert, Update, and Delete (the operations that can break FK references).", "Relational Databases"], ["What is an important aspect of referential integrity?", ["Primary keys refer to data in a particular relation.", "Reference points are placed by the database in each record during backups.", "The relationships between entities and attributes are called referrals.", "Reference to data in one relation is based on values in another relation."], 3, "Referential integrity = a value in one relation (FK) must match values in another relation (PK).", "Relational Databases"], ["A product-marketing company adds an RDBMS to store customer info. What advantage do they gain?", ["Increased sales", "Lower advertising costs", "Improved query response times", "Decreased skill acquisition times"], 2, "An RDBMS's concrete technical benefit is faster querying/retrieval. Sales/ad cost are indirect business hopes.", "Relational Databases"], ["In which two ways does a DBMS environment increase effectiveness when working with data? (Choose 2)", ["It enables data sharing.", "It duplicates redundant data for security.", "It permits storage of vast volumes of data.", "It increases the complexity rules by which data is organized."], [0, 2], "A DBMS enables data sharing and stores vast volumes. It REDUCES redundancy and complexity, not increases them.", "Relational Databases"], ["What is an attribute or group of attributes that uniquely identifies a tuple in a relation?", ["Index key", "Foreign key", "Primary key", "Physical key"], 2, "The primary key uniquely identifies each tuple (row). FK references another table; index is a lookup structure.", "Relational Databases"], ["What is necessary for a primary key in one relation to match its corresponding foreign key in another relation of the same database?", ["A domain of values", "Intersection data", "An attribute name", "A quantity"], 0, "PK and FK must share the same domain (data type and set of valid values) to match.", "Relational Databases"], ["What uniquely identifies each entity in a collection but is NOT the primary key?", ["The foreign key", "The secondary key", "The alternate key", "The master key"], 2, "A candidate key not chosen as the primary key is the alternate key.", "Relational Databases"], ["What is a term for a set of columns that can uniquely identify any record in a table without referring to other data?", ["Foreign key", "Primary key", "Alternate key", "Candidate key"], 3, "A candidate key is any column set that could serve as PK (self-sufficient unique identifier). The chosen one becomes PK; the rest are alternate keys.", "Relational Databases"], ["What happens to the original data in database indexing?", ["It is moved to the index.", "It is copied to the index.", "It is compiled by the DBMS.", "It is translated into hexadecimals."], 1, "Indexing copies key values (plus pointers) into the index; the original rows stay put.", "Relational Databases"], ["Why are indexes created in a physical database design?", ["To group data into aggregations", "To iterate across data in a sequence", "To retrieve data directly using a pointer", "To summarize data into dimensions for a cube"], 2, "Indexes give direct pointer-based access to rows, avoiding full scans.", "Relational Databases"], ["Why is an index created on a database column?", ["To optimize data integrity", "To optimize data updates", "To optimize data retrievals", "To optimize data insertions"], 2, "Indexes optimize retrieval/lookups. They actually slow inserts/updates (the index must be maintained).", "Relational Databases"], ["The INSERT statement adds a student to the Student table. How many clauses are in the INSERT statement? INSERT INTO Student VALUES (888, 'Smith', 'Jim', 3.0);", ["1", "2", "3"], 1, "The INSERT INTO clause is followed by the VALUES clause.", "SQL"], ["The SQL statement below is used to select students with the last name \"Smith\". What is wrong with the statement? SELECT FirstName FROM Student WHERE LastName = Smith;", ["The literal \"Smith\" must be surrounded by single quotes or double quotes.", "The WHERE clause should be removed.", "The last name \"Smith\" may not exist in the database."], 0, "'Single' or \"double\" quotes must surround string literals.", "SQL"], ["What is wrong with the SQL statement below? SELECT FirstName from Student", ["The keyword from must be written FROM.", "The WHERE clause is missing.", "A terminating semicolon is missing."], 2, "The semicolon indicates the end of an SQL statement. All SQL statements require a terminating semicolon.", "SQL"], ["Which statement shows all databases in a database system?", ["SHOW TABLES;", "SHOW DATABASES;", "SHOW COLUMNS;"], 1, "SHOW DATABASES lists all databases in a database system.", "SQL"], ["Which statement shows all tables in the database petStore?", ["SHOW TABLES;", "SHOW TABLES FROM petStore;", "SHOW DATABASES;"], 0, "SHOW TABLES lists the tables in the currently selected database.", "SQL"], ["Which statement must precede a SHOW TABLES statement to see the tables from the bikeStore database?", ["SHOW DATABASES;", "USE bikeStore;", "SHOW COLUMNS FROM bikeStore;"], 1, "The USE statement selects the bikeStore database.", "SQL"], ["Which statement shows all the columns in the Country table?", ["SHOW COLUMNS;", "SHOW COLUMNS Country;", "SHOW COLUMNS FROM Country;"], 2, "SHOW COLUMNS lists the columns of a table named with the FROM clause.", "SQL"], ["Storing a city's population, which ranges from a dozen to 24 million people.", ["unsigned MEDIUMINT", "unsigned INTEGER", "unsigned BIGINT"], 1, "An INTEGER requires 4 bytes and is sufficient to represent populations that are up to 4.3 billion people. The next smallest data type, MEDIUMINT, can only represent populations up to 16.8 million.", "SQL"], ["Storing the annual gain or loss in a city's population, which ranges from -1 million to 1 million.", ["signed SMALLINT", "unsigned MEDIUMINT", "signed MEDIUMINT"], 2, "A signed MEDIUMINT requires 3 bytes and can store -8,388,608 to 8,388,607.", "SQL"], ["Storing the price of an item that ranges from a few dollars to a few hundred dollars.", ["FLOAT", "DECIMAL(2,5)", "DECIMAL(5,2)"], 2, "M = 5 and N = 2, so the number of significant digits is 5, and the number of places after the decimal point is 2. A price like $599.27 has 5 significant digits and 2 numbers after the decimal point.", "SQL"], ["Storing the date and time an item is purchased.", ["DATE", "TIME", "DATETIME"], 2, "DATETIME stores both a date and a time. Ex: If an item is purchased on July 4, 2020 at 2:30 pm, the value stored in DATETIME is '2020-07-04 14:30:00'.", "SQL"], ["Storing a student's assigned letter grade, like A or D.", ["TINYINT", "CHAR(1)", "VARCHAR(1)"], 1, "A grade is a single character, and N = 1 uses 1 byte to store each grade.", "SQL"], ["Storing a student's email address.", ["VARCHAR(100)", "VARCHAR(10)", "CHAR(100)"], 0, "Each student's email address varies in length, so a VARCHAR is ideal. Using N = 100 means no email address can exceed 100 characters, which is a reasonable assumption.", "SQL"], ["Storing a yes or no value.", ["TINYINT", "CHAR(3)", "VARCHAR(3)"], 0, "Typically, a yes/no or true/false value is stored as a 1-byte TINYINT, where 1 means yes/true, and 0 means no/false. A common term that refers to yes/no is Boolean.", "SQL"], ["Which alteration to the CREATE TABLE statement prevents ManagerID from being NULL?", ["ManagerID NOT NULL SMALLINT,", "ManagerID NOT NULL,", "ManagerID SMALLINT NOT NULL,"], 2, "The NOT NULL constraint must be listed after the column name and data type.", "SQL"], ["Which alteration to the CREATE TABLE statement sets the default Name to Accounting?", ["Name VARCHAR(20) DEFAULT Accounting,", "Name VARCHAR(20) DEFAULT 'Accounting',", "Name VARCHAR(20) 'Accounting',"], 1, "The default value is listed after the DEFAULT keyword.", "SQL"], ["Which statement correctly inserts Engineering?", ["INSERT INTO Department Code, Name, ManagerID VALUES (44, 'Engineering', 2538);", "INSERT INTO (Code, Name, ManagerID) VALUES (44, 'Engineering', 2538);", "INSERT INTO Department (Code, Name, ManagerID) VALUES (44, 'Engineering', 2538);"], 2, "The INSERT INTO clause names the table and columns, and the VALUES clause names the column values.", "SQL"], ["Which statement correctly inserts Sales?", ["INSERT Department VALUES (82, 'Sales', 6381);", "INSERT INTO Department VALUES ('Sales', 82, 6381);", "INSERT INTO Department (82, 'Sales', 6381);"], 0, "The keyword INTO and column names are optional and may be omitted. When column names are omitted, values must be in the order of columns in the CREATE TABLE statement.", "SQL"], ["Which statement correctly inserts Technical Support?", ["INSERT INTO Department (Code, Name) VALUES (99);", "INSERT INTO Department (Code, Name) VALUES (99, 'Technical Support');", "INSERT INTO Department (Code, Name) VALUES (99, 'Technical Support', NULL);"], 1, "The INSERT INTO clause lists Code and Name, and the VALUES clause lists the two matching values. The unspecified ManagerID value is NULL.", "SQL"], ["Which statement correctly inserts Sales if the only Employee IDs are 2538 and 6381?", ["INSERT INTO Department (Name, ManagerID) VALUES (2538, 'Sales');", "INSERT INTO Department (Name, ManagerID) VALUES ('Sales', 0202);", "INSERT INTO Department (Name, ManagerID) VALUES ('Sales', 6381);"], 2, "The foreign key value 6381 matches the existing primary key value 6381.", "SQL"], ["What is missing to change \"Sales\" to \"Custodial\"? UPDATE Department SET ___ WHERE Code = 82;", ["'Sales' = 'Custodial'", "Department = 'Custodial'", "Name = 'Custodial'"], 2, "The SET clause names the column to change and the new value.", "SQL"], ["What department managers are changed? UPDATE Department SET ManagerID = 2538;", ["All managers", "No managers", "Only the Engineering manager"], 0, "No WHERE clause exists, so all departments are assigned the same manager.", "SQL"], ["What departments are deleted? DELETE FROM Department;", ["All departments", "No departments", "Engineering only"], 0, "No WHERE clause is specified, so all rows are deleted.", "SQL"], ["What does a NULL in the Population column represent?", ["Unknown", "Inapplicable", "Either unknown or inapplicable"], 0, "All countries have a population, so NULL in the Population column must represent unknown rather than inapplicable.", "SQL"], ["Barueri São Paulo 208426 Embu São Paulo 222223 Mossoró Rio Grande do Norte 214901 Petrolina Pernambuco 210540 Várzea Grande Mato Grosso 214435", ["ORDER BY Name", "ORDER BY CountryCode", "ORDER BY District"], 0, "The rows are in ascending order by Name. Text is ordered in a case-insensitive fashion.", "SQL"], ["Barueri São Paulo 208426 Petrolina Pernambuco 210540 Várzea Grande Mato Grosso 214435 Mossoró Rio Grande do Norte 214901 Embu São Paulo 222223", ["ORDER BY Name", "ORDER BY Population", "ORDER BY District"], 1, "The Population column is in ascending order.", "SQL"], ["Embu São Paulo 222223 Barueri São Paulo 208426 Mossoró Rio Grande do Norte 214901 Petrolina Pernambuco 210540 Várzea Grande Mato Grosso 214435", ["ORDER BY Name DESC", "ORDER BY District", "ORDER BY District DESC"], 2, "The rows are ordered by District in descending order.", "SQL"], ["Várzea Grande Mato Grosso 214435 Petrolina Pernambuco 210540 Mossoró Rio Grande do Norte 214901 Barueri São Paulo 208426 Embu São Paulo 222223", ["ORDER BY Name, Population", "ORDER BY Population, District", "ORDER BY District, Population"], 2, "The rows are ordered by District then population.", "SQL"], ["SELECT SPNUM, SPNAME FROM SALESPERSON  -- add a line to find salespersons with commission percentage of 15.", ["* COMMPERCT=15;", "IF COMMPERCT=15;", "AND COMMPERCT=15;", "WHERE COMMPERCT=15;"], 3, "Row filtering uses WHERE. AND only chains an existing WHERE; IF/* aren't filter clauses.", "SQL"], ["SELECT COMMPERCT, YEARHIRE FROM SALESPERSON WHERE SPNUM=22;  -- change it to retrieve the ENTIRE record.", ["Replace WHERE SPNUM=22; with WHERE SPNUM=*", "Replace COMMPERCT, YEARHIRE with an asterisk", "Replace COMMPERCT, YEARHIRE with ALL", "Replace SALESPERSON with ALL"], 1, "SELECT * returns all columns. The asterisk goes in the column list, not the WHERE clause.", "SQL"], ["SELECT CUSTNUM, CUSTNAME, HQCITY FROM CUSTOMER WHERE HQCITY='Los Angeles'  -- also limit to customer number above 1000.", ["AND CUSTNUM>1000;", "AND CUSTNUM>=1000;", "WHERE CUSTNUM<1000", "WHERE CUSTNUM>=1000;"], 0, "A second condition chains with AND, not a second WHERE. 'Higher than 1000' = strictly greater than (>), not >=.", "SQL"], ["What is a key difference between DISTINCT and ORDER BY in SQL SELECT commands?", ["ORDER BY does not alter the presentation of data results and DISTINCT modifies data results.", "ORDER BY modifies the presentation of data results and DISTINCT filters data results.", "ORDER BY changes the order of results in the database and DISTINCT changes the order of results in the view only.", "ORDER BY changes the order of results in the view only and DISTINCT changes the order of results in the database."], 1, "ORDER BY sorts the presentation; DISTINCT filters out duplicate rows. Neither changes data in the database.", "SQL"], ["Which SQL statement alphabetizes customer names WITHIN the same satellite-office city?", ["ORDER BY CUSTNAME, SATCITY;", "ALPHA BY CUSTNAME, SATCITY;", "ORDER BY SATCITY, CUSTNAME;", "ALPHA BY SATCITY, CUSTNAME;"], 2, "Group by city first, then sort names within it: ORDER BY SATCITY, CUSTNAME. There is no ALPHA BY.", "SQL"], ["SELECT PRODNAME FROM SALESPERSON, SALES, PRODUCT ? ? AND SPNAME='Fox' AND QUANTITY>500;  -- pick the join lines.", ["WHERE SALESPERSON.SPNUM=PRODUCT.PRODNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM=SALES.SPNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM>SALES.SPNUM AND SALES.PRODNUM=PRODUCT.PRODNUM", "WHERE SALESPERSON.SPNUM=SALES.SPNUM AND SALES.PRODNUM=SALES.SPNUM"], 1, "Join on matching keys: SALESPERSON.SPNUM=SALES.SPNUM and SALES.PRODNUM=PRODUCT.PRODNUM. The bridge table SALES links the two.", "SQL"], ["SELECT COUNT(*) ? WHERE PUBLISHER.PUBNAME=BOOK.PUBNAME AND CITY='Los Angeles' AND COUNTRY='United States' AND PAGES>=800;  -- pick the FROM line.", ["FROM PUBNAME.BOOK", "FROM PUBLISHER, BOOK", "WHERE PUBNAME = BOOK", "WHERE PUBLISHER = BOOK"], 1, "Two tables are referenced, so FROM PUBLISHER, BOOK. The WHERE already does the join on PUBNAME.", "SQL"], ["Which SQL retrieves rows for all stores in Atlanta OR Los Angeles OR New York?", ["SELECT StoreID, City FROM Suppliers WHERE City IN ('Atlanta', 'Los Angeles', 'New York');", "SELECT StoreID, City FROM Suppliers WHERE City BETWEEN 'Atlanta' AND 'Los Angeles' AND 'New York';", "SELECT StoreID, City FROM Suppliers WHERE City BETWEEN 'Atlanta' OR 'Los Angeles' OR 'New York';", "SELECT StoreID, City FROM Suppliers WHERE (City='Atlanta' AND City='Los Angeles' AND City='New York');"], 0, "IN ('a','b','c') matches any value in the list. A single column can't equal three values with AND.", "SQL"], ["SELECT * FROM PRODUCT;  -- what does this accomplish?", ["List all PRODUCT from the * table.", "Delete all products from the PRODUCT table view.", "Delete all entries in the PRODUCT table.", "List all entries in the PRODUCT table."], 3, "SELECT * FROM PRODUCT lists every row and column of PRODUCT. SELECT never deletes.", "SQL"], ["An entity-relationship model is completely described by:", ["An ER diagram", "A glossary", "Both an ER diagram and a glossary"], 2, "The ER diagram provides an intuitive overview of the model, and the glossary provides full detail. Both ER diagram and glossary, together, describe an entity-relationship model.", "Database Design"], ["What is included in a glossary?", ["Descriptions only", "Names and synonyms only", "Names, synonyms, and descriptions only", "Names, synonyms, descriptions, and ER diagrams"], 2, "A glossary includes names, synonyms, and descriptions of all entities, relationships, and attributes.", "Database Design"], ["Which noun is an entity?", ["information", "name", "professor"], 2, "\"Professor\" is a set of people. Since the database tracks professor names and courses taught, \"Professor\" is an entity.", "Database Design"], ["Which verb is a relationship?", ["taken", "track", "have"], 0, "\"Taken\" suggests the relationship Student-Takes-Course. Since student and course are entities, and the database tracks courses taken by students, \"taken\" is a relationship.", "Database Design"], ["Which noun is an attribute?", ["record", "Assistant Professor", "title", "course"], 2, "\"Title\" is a property that describes the professor entity, and is therefore an attribute.", "Database Design"], ["Must entity, relationship, and attribute synonyms follow naming conventions?", ["Yes", "Only attribute synonyms must follow naming conventions.", "No"], 2, "Synonyms help users map commonly used terms to official names. Synonyms should reflect common usage, not naming conventions.", "Database Design"], ["What is wrong with the following entity description? The difference between a course and a class is that a course refers to the catalog description, while a class is an individual offering of a course in a specific term.", ["Description does not begin with entity name.", "Description does not include counterexamples.", "Description does not use complete sentences."], 0, "The first noun in the description is \"difference\". Description should begin with the name of the entity being described, such as \"class\" or \"course\".", "Database Design"], ["What is wrong with the following relationship description? \"Student-Takes-Course\" describes all course instances taken by a student instance.", ["Description should begin with an entity name.", "Description does not use complete sentences.", "Description does not include examples and counterexamples."], 2, "The description does not clarify the meaning of \"takes\" with examples and counterexamples. Ex: The description might state that failing grades are not included in the \"Student-Takes-Course\" relationship.", "Database Design"], ["Discovery is a step in which phase?", ["Conceptual design", "Logical design", "Database design"], 0, "Discovery is the first step of the conceptual design phase.", "Database Design"], ["Identification of entities, relationships, and attributes precedes documentation.", ["Always", "Usually", "Never"], 1, "Usually, database designers identify entities, relationships, and attributes before documentation. However, the steps are iterative. Additional identification often takes place after names, synonyms, and descriptions are documented.", "Database Design"], ["Standard attribute types are determined after the ER diagram is drawn.", ["Always", "Usually", "Never"], 1, "Usually, database designers draw high-level ER diagrams before determining attribute types. However, steps are iterative, and different database designers might follow a different order of steps.", "Database Design"], ["Student-Takes-Course", ["one-one", "one-many", "many-one", "many-many"], 3, "Each student can take many courses, and each course has many students, so Student-Takes-Course is many-many.", "Database Design"], ["City-IsCapitalOf-State", ["one-one", "one-many", "many-one", "many-many"], 0, "A city is capital of at most one state, and each state has one capital city. City-IsCapitalOf-State is one-one.", "Database Design"], ["Airport-Has-Runway", ["one-one", "one-many", "many-one", "many-many"], 1, "A runway is located in only one airport. So Airport is singular. An airport can have many runways. So Runway is plural.", "Database Design"], ["Person-Owns-Vehicle", ["one-one", "one-many", "many-one", "many-many"], 3, "A person can own many vehicles and, in most states, a vehicle can have many registered owners. Person-Owns-Vehicle is many-many.", "Database Design"], ["Person-Marries-Person", ["zero-zero", "zero-one", "one-zero", "one-one"], 0, "Since a person can be unmarried, Person-Marries-Person is zero-zero.", "Database Design"], ["Person-Has-Passport", ["zero-zero", "zero-one", "one-zero", "one-one"], 2, "Every passport must belong to a person, so Person is required. A person may have no passport, so Passport is optional. Since Person-Has-Passport is required-optional, the minima are one-zero.", "Database Design"], ["Flight-ArrivesAt-Airport", ["zero-zero", "zero-one", "one-zero", "one-one"], 3, "All flights must arrive at an airport. Assuming the database does not track new or inactive airports, all airports have arriving flights. Flight-ArrivesAt-Airport is one-one.", "Database Design"], ["Entity Airport, attribute AirportCode", ["singular-required", "singular-optional", "plural-required"], 0, "Several different code systems describe airports, however the three-letter IATA code is commonly used. Assuming the database uses only the IATA system, each airport has at most one code, so AirportCode is singular. Every airport has a code, so AirportCode is required.", "Database Design"], ["Entity Person, attribute SpouseName", ["singular-required", "plural-required", "singular-optional"], 2, "In most countries, each person has at most one legal spouse, so SpouseName is singular. A person may be unmarried, so SpouseName is optional.", "Database Design"], ["Entity Employee, attribute LanguageCode", ["singular-required", "plural-optional", "plural-required"], 2, "An employee may speak several languages, so LanguageCode is plural. Each employee speaks at least one language, so LanguageCode is required.", "Database Design"], ["How often is a master entity also an independent entity?", ["Never", "Sometimes", "Always"], 1, "Master entities may or may not depend on another entity, and therefore are sometimes independent. Ex: Passport depends on Country, since a passport cannot exist without a sponsor country. Therefore, Country is a master entity. However, a country does not depend on any other entity, so Country is also independent.", "Database Design"], ["How many dependency relationships can each dependent entity have?", ["Zero or one", "Exactly one", "One or many"], 2, "A dependent entity must have at least one dependency relationship. Some dependent entities depend on several different entities and therefore have several dependency relationships. Ex: Passport is dependent on Person and Country.", "Database Design"], ["How many dependent entities can depend on one independent entity?", ["Zero or one", "One or many", "Zero, one, or many"], 2, "An independent entity can have any number of dependent entities, including none. Ex: Person is an independent entity with dependent entities Passport, Education, and Language. Education describes degrees received by a person, and Language lists the languages a person speaks.", "Database Design"], ["Which entity does GradePointAverage belong to?", ["Person", "Student", "Faculty", "Administrator"], 1, "GradePointAverage describes students only, not faculty or administrators, and belongs to the Student subtype entity.", "Database Design"], ["Which entity does TelephoneNumber belong to?", ["Person", "Student", "Faculty", "Administrator"], 0, "TelephoneNumber describes all people and should be assigned to the supertype Person.", "Database Design"], ["What is the uniquely identifiable element about which data can be categorized in an entity-relationship diagram?", ["Entity types", "Primary keys", "Unary relationships", "Intersection data points"], 0, "An entity type is the identifiable thing data is categorized about. Keys/relationships describe it, they aren't it.", "Database Design"], ["In an ERD where Quantity hangs off the Sells/Sold-by relationship between Salesperson and Product, which classification is correct for the box marked 'Quantity'?", ["Quantity data", "Modality data", "Intersection data", "Product sales data"], 2, "Data on the relationship between two entities (M:N) is intersection data. It belongs to neither entity alone.", "Database Design"], ["Which data classification is an entity?", ["Event", "Duration", "Directions", "Attendance"], 0, "An event is a thing you store data about = an entity. Duration/directions/attendance are attributes or measures.", "Database Design"], ["An ERD shows Manufacturer (PK Manufacturer Name) --Manufactured/Manufactured-by--< Car (PK Car Serial Number). What is it showing?", ["An agency's cars were provided by multiple manufacturers.", "One manufacturer created at least one of the agency's cars.", "The model, year, and class of the car are part of the primary key.", "The manufacturer maintains database records for its sales representatives."], 1, "The crow's foot reads one manufacturer to many cars: one maker built at least one car. PK is the serial number only.", "Database Design"], ["A salesperson is authorized to sell 12 products; a product can be sold by 10 salespersons. Which binary relationship is this?", ["One-to-one", "One-to-many", "Many-to-many", "Associative"], 2, "Many salespersons to many products = many-to-many (M:N). 'Associative' is the resolving table, not the relationship type.", "Database Design"], ["Customer >--Purchased/Purchased-by--< Product, crow's foot on both ends. Which relationship does the cardinality represent?", ["Many customers to many products", "One customer to many products", "One customer to many product numbers", "One customer to one product number"], 0, "Crow's foot on both sides = many-to-many: many customers to many products.", "Database Design"], ["Salesperson |--Sells-to/Buys-from--| Customers, with a single bar (one) on the Customers side. How is the cardinality of customers misrepresented?", ["There is one customer number, but the cardinality indicates many customers.", "There are many customers, but the cardinality indicates one customer.", "There is more than one salesperson, but the cardinality indicates multiple salespersons.", "The cardinality of the salesperson number and the customer number do not match."], 1, "A salesperson serves many customers, but the single-bar cardinality wrongly shows only one customer.", "Database Design"], ["Reading modality on the right side: the symbol is an open circle (zero) next to 'No Customers'. How do you read it?", ["A maximum of one customer", "A maximum of many customers", "A minimum of zero customers", "A maximum of zero customers"], 2, "Modality is the MINIMUM. The circle/zero means minimum of zero (participation is optional).", "Database Design"], ["SALES >--Sold/Sold-Product--|| PRODUCT, with a single bar (one) on the Product side. What is the modality of the product?", ["Two", "At least one", "Two or more", "Dependent on the quantity"], 1, "The bar nearest the entity is the modality = minimum participation of one, so 'at least one'.", "Database Design"], ["SALESPERSON relates to itself via Backs-up / Backed-up by, one on each end. Which kind of relationship is this?", ["Unary one-to-one", "Binary one-to-one", "Unary one-to-many", "Binary one-to-many"], 0, "An entity related to itself = unary (recursive). One backs up one = one-to-one.", "Database Design"], ["PRODUCT and COMPONENT (PK Product Number + Subassembly Number) relate via Part-of / Includes, crow's foot on both. Which relationship is this?", ["Unary one-to-many", "Binary one-to-many", "Unary many-to-many", "Binary many-to-many"], 2, "A product is built from many components and a component is part of many products, and it loops on the same concept = unary many-to-many (bill of materials).", "Database Design"], ["Sales data has customer names, products sold, and salespersons. Which qualifies as intersection data of BOTH product and salesperson?", ["Quantity", "Products", "Salespersons", "Customer names"], 0, "Quantity sits on the M:N relationship between salesperson and product = intersection data. (The exam keyed Quantity; watch the wording.)", "Database Design"], ["A table with a simple primary key must be in what normal form?", ["First normal form only, and no higher", "Second normal form or higher", "Third normal form"], 1, "Non-key columns always depend on the primary key. If the primary key is simple, non-key columns necessarily depend on the whole primary key, and therefore the table must be in second normal form.", "Normalization"], ["What is a methodology for organizing attributes into tables?", ["Data normalization", "Data redundancy", "Data indexing", "Data compression"], 0, "Normalization organizes attributes into well-structured tables to reduce redundancy and anomalies.", "Normalization"], ["What is the term for the value of one particular attribute being associated with a specific single value of another attribute?", ["Functional dependency", "Transitive dependency", "Decomposition", "Normalization"], 0, "A determines B = functional dependency (A -> B). Transitive is A->B->C; decomposition splits tables.", "Normalization"], ["A table repeats Project Code with Employee, Department, and Hourly Rate across many rows, all single-valued. In which state are the attributes?", ["Unnormalized", "First normal form", "Second normal form", "Third normal form"], 1, "All cells single-valued with a defined key = 1NF. Partial dependencies on a composite key still exist, so not yet 2NF.", "Normalization"], ["A Students table (IDSt, LastName, IDProf, Prof, Grade) — which factor determines it is in first normal form?", ["There are no functional dependencies.", "The fourth column shows the foreign keys.", "The attributes are all single valued.", "The first column is in numerical order."], 2, "1NF requires atomic (single-valued) attributes. Ordering and FKs are irrelevant to 1NF.", "Normalization"], ["Two tables: (ID, Contract, Code) keyed on ID, and (Code, City, Country) keyed on Code. How advanced in normalization?", ["Unnormalized", "First normal form", "Second normal form", "Third normal form"], 3, "Splitting out Code->City,Country removes the transitive dependency. Single-key tables with no transitive deps = 3NF.", "Normalization"], ["Four split tables (SALESPERSON, DEPARTMENT, PRODUCT, QUANTITY). Which characteristic points to third normal form?", ["Each primary key has a functional dependency on every other primary key in the table.", "'Salesperson Number' appears in more than one table.", "The tables are completely free of data redundancy.", "The attributes are all single valued."], 2, "3NF eliminates transitive dependencies, leaving the design free of redundancy. Single-valued alone is just 1NF.", "Normalization"], ["Which component detects a missing semicolon at the end of an SQL statement?", ["Connection manager", "Query parser", "Query optimizer"], 1, "The query parser checks each SQL statement for correct syntax and converts the statement to an internal representation.", "Database Architecture"], ["Which component detects an incorrect database server address?", ["Connection manager", "Query optimizer", "Cache manager"], 0, "The connection manager processes connection requests from the tools layer. A connection includes database name, server address, and logon credentials.", "Database Architecture"], ["Which component determines that a query was recently executed?", ["Connection manager", "Query optimizer", "Cache manager"], 2, "The cache is an area of main memory that contains recent queries, execution plans, and results, for possible reuse.", "Database Architecture"], ["What block does InnoDB discard when more space is needed in the buffer?", ["The block that was loaded to the buffer first.", "The block that was loaded to the buffer last.", "The block that has not been accessed for the longest time."], 2, "The InnoDB buffer uses a least recently used algorithm, which discards the block that has not been accessed for the longest time.", "Database Architecture"], ["Which is not a MySQL storage engine?", ["MEMORY", "MongoDB", "CSV"], 1, "MongoDB is a NoSQL database, not a MySQL storage engine.", "Database Architecture"], ["Which storage engine is commonly used for transaction management?", ["InnoDB", "ARCHIVE", "MEMORY"], 0, "InnoDB has robust transaction management capabilities and thus is the default MySQL storage engine.", "Database Architecture"], ["Oracle Database has multiple storage engines.", ["True", "False"], 1, "Oracle Database, like most other relational databases, has a built-in storage engine that cannot be changed. The MySQL architecture, with multiple storage engines, is unusual.", "Database Architecture"], ["'Middleware' is a software layer between the operating system and applications, such as a web server or messaging software. Which category provides middleware in the cloud?", ["On-premise", "IaaS", "PaaS"], 2, "PaaS provides all layers below application software in the cloud, including middleware.", "Database Architecture"], ["Can virtual machines running on the same computer contain different operating systems?", ["Yes", "No"], 0, "The operating system is contained within the virtual machine, and therefore hidden from the computer and other virtual machines.", "Database Architecture"], ["How many tiers are contained in a SaaS environment?", ["1", "3", "Depends on cloud provider and application"], 2, "Most SaaS cloud systems have complex architectures with multiple tiers. The exact number depends on the cloud provider and application.", "Database Architecture"], ["In what form is Microsoft SQL Server available?", ["On-premise only", "As a cloud service only", "Either on-premise or as a cloud service"], 2, "Like most databases, SQL Server is available both on-premise and in the cloud. The Azure cloud service called SQL Database runs SQL Server.", "Database Architecture"], ["Four computers in one building are connected by cables. The computers connect to a bank of disk drives, also on the network, via the Ethernet protocol.", ["Shared memory", "Shared storage", "Shared nothing"], 1, "The four computers are four nodes of a cluster. The cluster shares the bank of disk drives but not memory.", "Database Architecture"], ["A parallel computer has one CPU containing a dozen processors, called 'cores'. The CPU and main memory are in separate integrated circuits on one circuit board. The circuit board connects to a flash drive via an internal communications 'bus'.", ["Shared memory", "Shared storage", "Shared nothing"], 0, "All core processors are in one integrated circuit with access to main memory in another integrated circuit on the same circuit board.", "Database Architecture"], ["Two computers in different cities communicate via the internet. Each computer has a local disk drive. Each computer can access the remote disk drive indirectly by communicating with the other computer.", ["Shared memory", "Shared storage", "Shared nothing"], 2, "Computers communicating over the internet between different cities are connected by a wide area network. Wide area networks are too slow and unreliable for either shared memory or shared storage.", "Database Architecture"], ["The Passenger table is stored on one disk drive: SELECT * FROM Passenger;", ["Yes", "No"], 1, "Query execution time is limited by the speed of reading the Passenger table on the disk drive. Multiple processors will not have a significant impact on performance.", "Database Architecture"], ["Passenger table rows are stored on 26 disk drives, depending on the first letter of the passenger's last name: SELECT * FROM Passenger ORDER BY LastName;", ["Yes", "No"], 0, "Multiple processors can retrieve and sort subsets of passengers in parallel. After each subset is sorted, the subsets can be quickly merged into a single result.", "Database Architecture"], ["The Employee and Department tables are stored on the same disk drive: SELECT EmployeeName, DepartmentName FROM Employee, Department WHERE Employee.DepartmentCode = Department.DepartmentCode;", ["Yes", "No"], 0, "Retrieval time of Employee and Department rows is limited by the disk drive. However, joins are sometimes executed by first sorting the join tables and then merging the sorted tables in one pass. The two tables can potentially be sorted in parallel.", "Database Architecture"], ["A telephone company employee, located in the Eastern Time Zone, runs a report that counts telephone calls by hour and area code. The report always runs quickly during early mornings but slowly during late mornings.", ["Database design", "Interference", "Reference time"], 1, "By late morning Eastern time customers are making calls all around the United States, generating heavy loads on the call database. The heavy loads are probably interfering with the report.", "Database Architecture"], ["A medical assistant for a large healthcare company reports the percentage of each type of illness over all hospitals. The report always runs slowly, regardless of day or time.", ["Database design", "Interference", "Reference time"], 0, "Database design problems often affect query performance regardless of operational database load. Since the report runs slowly at all times, the problem may be that the database is optimized for operations, not analytics.", "Database Architecture"], ["Just before a meeting, two employees generate a report of total sales revenue by day and state. The employees run the same query but the reports conflict.", ["Database design", "Interference", "Reference time"], 2, "The two employees probably ran the query at different times. Apparently, the operational database changed between the two times, causing the same query to generate different results.", "Database Architecture"], ["In a dimensional design for a motor vehicles data warehouse, is the DriverLicenseNumber column in a fact or dimension table?", ["Fact table", "Dimension table", "Either fact or dimension table"], 1, "Driver's license numbers are descriptive information about a driver, not numeric facts, and belong in a dimension table.", "Database Architecture"], ["In a dimensional design for a sales data warehouse, is Discount in a fact or dimension table?", ["Fact table", "Dimension table", "Either fact or dimension table"], 0, "Discount is usually a percentage or currency amount. Either way, Discount is a numeric value and belongs in a fact table.", "Database Architecture"], ["Transactions", ["Always", "Sometimes", "Never"], 1, "Transaction management is not dependent on storage media. Some in-memory databases support transactions but others do not.", "Database Architecture"], ["Fast query execution", ["Always", "Sometimes", "Never"], 0, "All in-memory systems offer fast query execution, compared to databases that utilize disk and flash storage media.", "Database Architecture"], ["Which component merges query results from participating databases?", ["Wrapper", "Global query processor", "Global catalog"], 1, "The global query processor decomposes federated queries and also merges the results of decomposed queries into a federated result.", "Database Architecture"], ["Which component determines the execution plan for a decomposed query?", ["Database", "Wrapper", "Global query processor"], 0, "Individual databases process decomposed queries, independent of the global query processor.", "Database Architecture"], ["Is referential integrity maintained when a federated query inserts, updates, or deletes primary and foreign keys?", ["Always", "Sometimes", "Never"], 1, "Referential integrity is not enforced by InfoSphere when primary and foreign keys are in different databases. When primary and foreign keys are in the same database, the database itself may enforce referential integrity.", "Database Architecture"], ["Which set of results should a company expect from implementing a business intelligence system?", ["Increased profitability and increased throughput", "Reduced hardware redundancy and decreased workloads", "Increased profitability and reduced hardware redundancy", "Riskier capital and asset investments and increased throughput"], 0, "BI drives better decisions -> increased profitability and throughput. Hardware redundancy isn't a BI outcome.", "Database Architecture"], ["Which issue is focused on the LOADING component of extract, transform, load (ETL)?", ["Monitor refreshing volume and frequency", "Denormalizing and renormalizing the data", "Mapping keys from one system to another", "Determining the content of the data"], 0, "Loading concerns how/when data refreshes into the target: volume and frequency. Mapping/denormalizing happen in Transform.", "Database Architecture"], ["During which ETL step are raw data sets aggregated?", ["Loading", "Extraction", "Conversion", "Transformation", "Denormalization"], 3, "Aggregation, cleansing, and conversion happen in Transformation. Extract pulls; Load writes.", "Database Architecture"], ["How is prediction distinguished from estimation in data mining?", ["Prediction is used to look at historical data only.", "Estimation assumptions do not need to be tested.", "Prediction classifies objects according to an expected future behavior.", "Estimation divides small collections of entities into smaller groups of similar entities."], 2, "Prediction assigns a future class/value (forward-looking). Estimation produces a continuous value from known data.", "Database Architecture"], ["Where does affinity grouping occur in data mining?", ["Among entities and target applications", "Between entity group names", "Between objects", "Among clusters"], 2, "Affinity grouping (market-basket/association) finds which objects occur together. It's between objects.", "Database Architecture"]];
const LS = "c175drill_v1";
const C=27*2*Math.PI;
let queue=[], cur=0, curOpts=[], waiting=false, picked=new Set(), filter="", waitAt=0;
const $=s=>document.getElementById(s);
let state=load();

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.length===MCQS.length)return s;}catch(e){}return MCQS.map(()=>({c:0,seen:false}));}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function isMulti(i){return Array.isArray(MCQS[i][2])}
function corrSet(i){return new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]])}

function idxs(){return MCQS.map((_,i)=>i).filter(i=>!filter||MCQS[i][4]===filter)}
function rebuild(){queue=idxs().filter(i=>state[i].c<2);if(queue.length)shuffle(queue);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function rings(){
  const pool=idxs();const seen=pool.filter(i=>state[i].seen).length;
  const apt=pool.reduce((s,i)=>s+Math.min(state[i].c,2)/2,0)/(pool.length||1);
  const sp=pool.length?seen/pool.length:0;
  $("seenR").style.strokeDashoffset=C*(1-sp);$("seenN").textContent=Math.round(sp*100)+"%";
  $("aptR").style.strokeDashoffset=C*(1-apt);$("aptN").textContent=Math.round(apt*100)+"%";
  const mastered=pool.filter(i=>state[i].c>=2).length;
  $("count").textContent=mastered+" / "+pool.length+" mastered";
}

function render(){
  rings();
  if(!queue.length){
    const pool=idxs();
    $("stage").innerHTML='<div class="done"><h2>'+(pool.every(i=>state[i].c>=2)?"Pool mastered ✓":"Nothing left in queue")+'</h2><p>Every question answered correctly twice.</p><button class="btn" id="again">Study again</button></div>';
    $("again").onclick=()=>{idxs().forEach(i=>state[i].c=0);save();rebuild();render()};return;
  }
  cur=queue[0];waiting=false;picked=new Set();
  const m=MCQS[cur],multi=isMulti(cur);
  curOpts=m[1].map((t,oi)=>({oi,text:t}));shuffle(curOpts);
  let h='<div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="opts">';
  curOpts.forEach((o,d)=>{h+='<button class="ans" data-disp="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  h+='</div>';
  if(multi)h+='<button class="chk" id="chk" disabled>Check</button>';
  h+='<div class="explain" id="exp"></div><div class="cont" id="cont">tap or press space to continue</div>';
  $("stage").innerHTML=h;
  [...document.querySelectorAll("#opts .ans")].forEach(b=>b.onclick=()=>pick(+b.dataset.disp));
  if(multi)$("chk").onclick=submit;
}

function pick(d){
  if(waiting)return;
  if(isMulti(cur)){
    const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');
    if(picked.has(d)){picked.delete(d);b.classList.remove("sel")}else{picked.add(d);b.classList.add("sel")}
    $("chk").disabled=picked.size===0;return;
  }
  picked=new Set([d]);submit();
}

function submit(){
  if(waiting)return;waiting=true;waitAt=Date.now();
  const m=MCQS[cur],cs=corrSet(cur);
  const chosen=new Set([...picked].map(d=>curOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#opts .ans").forEach(b=>{
    const oi=curOpts[+b.dataset.disp].oi;b.style.pointerEvents="none";
    if(cs.has(oi))b.classList.add("correct");
    else if(chosen.has(oi))b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(isMulti(cur))$("chk").style.display="none";
  state[cur].seen=true;
  if(ok)state[cur].c++;else state[cur].c=0;
  save();
  const e=$("exp");e.className="explain show "+(ok?"ok":"no");
  e.innerHTML="<b>"+(ok?"Correct.":"Not quite.")+"</b> "+esc(m[3]);
  // requeue
  queue.shift();
  if(ok&&state[cur].c>=2){/* retire */}
  else{const off=ok?Math.min(10,queue.length):Math.min(3,queue.length);queue.splice(off,0,cur)}
  rings();
  if(ok){$("cont").classList.remove("show");setTimeout(()=>{if(waiting)next()},460)}
  else $("cont").classList.add("show");
}

function next(){if(waiting){waiting=false;render()}}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

document.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){if(waiting){e.preventDefault();next()}return}
  const n="1234".indexOf(e.key),a="abcd".indexOf(e.key.toLowerCase());
  const d=n>=0?n:a;if(d>=0){const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');if(b)pick(d)}
});
$("stage").addEventListener("click",()=>{if(waiting&&Date.now()-waitAt>250)next()});

// topic dropdown
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("topic").appendChild(o)});
$("topic").onchange=()=>{filter=$("topic").value;rebuild();render()};
$("reset").onclick=()=>{if(confirm("Wipe all drill progress?")){state=MCQS.map(()=>({c:0,seen:false}));save();rebuild();render()}};

rebuild();render();
</script></body></html>
