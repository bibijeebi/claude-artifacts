<style>
:root{
  --bg:#e9edf0; --panel:#ffffff; --ink:#1a2330; --muted:#5b6573;
  --line:#d4dae1; --teal:#159fc9; --green:#43a047; --red:#e23b3b;
  --shadow:0 1px 3px rgba(20,40,70,.10),0 6px 18px rgba(20,40,70,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:6px 2px 14px}
.h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
.h2{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500}
.reset{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);
  padding:5px 9px;border-radius:8px;background:var(--panel);white-space:nowrap;cursor:pointer}
@media(hover:hover){.reset:hover{color:var(--red);border-color:var(--red)}}
.stats{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:9px}
.ring svg{display:block}
.ring .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.ring .val{font-size:16px;font-weight:800;line-height:1}
.counts{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.5}
.counts b{color:var(--ink);font-weight:700}
.selwrap{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:2px}
select{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;
  box-shadow:var(--shadow)}
.qtopic{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);font-weight:800;margin-bottom:8px}
.q{font-size:17px;line-height:1.4;font-weight:650;margin-bottom:14px}
#opts{display:flex;flex-direction:column;gap:9px}
.ans{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
  font:inherit;font-size:15px;line-height:1.35;color:var(--ink);transition:border-color .12s,background .12s}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{flex:0 0 22px;height:22px;border-radius:6px;background:#eef2f6;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
.ans.correct{border-color:var(--green);background:#edf7ee}
.ans.correct .ltr{background:var(--green);color:#fff}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.wrong .ltr{background:var(--red);color:#fff}
.ans b{font-weight:800}
.ans.lock{cursor:default}
.explain{margin-top:13px;border-left:3px solid var(--teal);background:#f3f8fb;border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:13.5px;line-height:1.45;color:#2a3645;display:none}
.explain.show{display:block}
.cont{margin-top:11px;font-size:12px;color:var(--muted);text-align:center;display:none}
.cont.show{display:block}
.finish{display:none;text-align:center;padding:34px 18px}
.finish.done{display:block}
.finish .big{font-size:40px}
.finish h3{font-size:21px;margin:8px 0 4px}
.finish p{color:var(--muted);font-size:14px;margin:0 0 18px}
.btn{font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:10px;border:none;
  background:var(--teal);color:#fff;cursor:pointer}
@media(hover:hover){.btn:hover{filter:brightness(1.05)}}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f6;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;font-size:11px}
@media(max-width:480px){.q{font-size:16px}.ans{font-size:14px}}

*{-webkit-tap-highlight-color:transparent}

[data-theme="dark"]{--bg:#0f1318;--panel:#171e27;--ink:#e7edf4;--muted:#8b98a9;--line:#2a3441;--teal:#2cb5dd;--green:#4bc251;--red:#f0625f;--shadow:0 1px 3px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.3)}
[data-theme="dark"] .ans .ltr,[data-theme="dark"] .kbd{background:#232d3a}
[data-theme="dark"] .ans.correct{background:#16301b}
[data-theme="dark"] .ans.wrong{background:#38191c}
[data-theme="dark"] .explain{background:#14222b}
[data-theme="dark"] circle[stroke="#e7ecf1"]{stroke:#232d3a}
.ans:active{border-color:var(--teal)}

.themeb{position:fixed;right:14px;bottom:14px;z-index:60;width:38px;height:38px;border-radius:50%;
border:1px solid var(--line);background:var(--panel,var(--bg3,var(--bg2,#fff)));color:var(--ink);
font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);line-height:1;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="h1">EPA 608 Mastery Drill</div>
      <div class="h2">Core &middot; Type I &middot; Type II &middot; Type III &mdash; one at a time, requeued until mastered</div>
    </div>
    <a class="reset" id="resetBtn">reset</a>
  </header>

  <div class="stats">
    <div class="ring">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="#e7ecf1" stroke-width="6"/>
        <circle id="seenRing" cx="23" cy="23" r="19" fill="none" stroke="var(--teal)" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 23 23)" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
      </svg>
      <div><div class="lab">Seen</div><div class="val" id="seenVal" style="color:var(--teal)">0%</div></div>
    </div>
    <div class="ring">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="#e7ecf1" stroke-width="6"/>
        <circle id="aptRing" cx="23" cy="23" r="19" fill="none" stroke="var(--green)" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 23 23)" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
      </svg>
      <div><div class="lab">Aptitude</div><div class="val" id="aptVal" style="color:var(--green)">0%</div></div>
    </div>
    <div class="counts">
      <div><b id="mastN">0</b> mastered / <b id="totN">0</b></div>
      <div><b id="queueN">0</b> in queue</div>
    </div>
    <div class="selwrap">
      <span class="lab" style="font-size:11px;color:var(--muted);font-weight:700">Topic</span>
      <select id="topicSel"></select>
    </div>
  </div>

  <div class="card" id="card">
    <div class="qtopic" id="qtopic"></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="cont" id="cont">Tap or press <span class="kbd">space</span> to continue</div>
  </div>

  <div class="finish" id="finish">
    <div class="big">&#10003;</div>
    <h3>Pool mastered</h3>
    <p>Every question answered correctly twice. Go take it.</p>
    <button class="btn" id="againBtn">Study again</button>
  </div>
</div>

<script>
var MCQS = [
["Which agency administers refrigerant-handling certification under Section 608?", ["EPA", "OSHA", "DOT", "DOE"], 0, "Section 608 of the Clean Air Act is administered and enforced by the EPA.", "Core: Regs & Ozone"],
["Section 608 certification is required to do what to stationary equipment?", ["Only to sell refrigerant", "Service, maintain, repair, or dispose of equipment containing refrigerant", "Only to install ductwork", "Only to design systems"], 1, "608 cert is required for anyone who maintains, services, repairs, or disposes of equipment containing refrigerant.", "Core: Regs & Ozone"],
["How long is a Section 608 certification valid?", ["1 year", "5 years", "10 years", "For life, it never expires"], 3, "608 certification is lifetime; no renewal or continuing-ed is required by the EPA.", "Core: Regs & Ozone"],
["To work on every type of stationary equipment, which certification do you need?", ["Type I", "Type II", "Type III", "Universal"], 3, "Universal covers all stationary refrigeration and AC equipment. It requires passing Core plus Type I, II, and III.", "Core: Regs & Ozone"],
["What is the minimum score to pass each section of the 608 exam?", ["50%", "60%", "70% (18 of 25)", "90%"], 2, "Each section is 25 questions; you must answer 18 correctly (70%) to pass that section.", "Core: Regs & Ozone"],
["Motor vehicle air conditioners (MVACs) are certified under which section?", ["Section 608", "Section 609", "Section 610", "Section 611"], 1, "MVAC work falls under Section 609, not 608. 608 covers stationary equipment.", "Core: Regs & Ozone"],
["Knowingly venting which refrigerants is illegal?", ["Only CFCs", "Only HCFCs", "CFCs, HCFCs, and HFC substitutes", "Only ammonia"], 2, "Venting is banned for CFCs/HCFCs (since 1992) and was extended to HFC substitutes (since 1995).", "Core: Regs & Ozone"],
["Which release does NOT violate the venting prohibition?", ["Dumping refrigerant to atmosphere during service", "A small de minimis release made in good faith during recovery or recycling", "Venting during disposal", "Releasing after a leak repair"], 1, "De minimis (minimal, unavoidable) releases during good-faith recovery/recycling are not violations.", "Core: Regs & Ozone"],
["Which class of refrigerant has the highest ozone depletion potential (ODP)?", ["CFCs", "HCFCs", "HFCs", "HCs"], 0, "CFCs (e.g., R-12) have the highest ODP. HCFCs are lower; HFCs have zero ODP.", "Core: Regs & Ozone"],
["HFC refrigerants like R-134a and R-410A have what ozone depletion potential?", ["The highest of any refrigerant", "Zero ODP (but they do have global warming potential)", "Equal to CFCs", "Undefined"], 1, "HFCs contain no chlorine, so their ODP is zero. They are regulated instead for their GWP.", "Core: Regs & Ozone"],
["The Montreal Protocol is an international agreement to do what?", ["Set HVAC wages", "Phase out ozone-depleting substances", "Standardize tools", "Tax refrigerant"], 1, "The Montreal Protocol commits nations to phasing out ozone-depleting substances like CFCs and HCFCs.", "Core: Regs & Ozone"],
["The AIM Act drives the phasedown of which refrigerants?", ["CFCs", "HCFCs", "HFCs", "Ammonia"], 2, "The AIM Act mandates an 85% phasedown of HFC production/consumption and pushes low-GWP (A2L) substitutes.", "Core: Regs & Ozone"],
["Complete phaseout of R-22 production and import took effect on what date?", ["January 1, 2010", "January 1, 2015", "January 1, 2020", "January 1, 2025"], 2, "Jan 1, 2010 banned R-22 in new equipment; Jan 1, 2020 banned all production/import. Only reclaimed/stockpiled R-22 remains.", "Core: Regs & Ozone"],
["Since January 1, 2018, refrigerant (including HFCs) may be sold only to whom?", ["Anyone over 18", "Certified technicians (or those buying for resale)", "Licensed plumbers", "Homeowners with a permit"], 1, "The sales restriction limits refrigerant purchases to 608/609-certified technicians.", "Core: Regs & Ozone"],
["The EPA's SNAP program identifies what?", ["Approved tool brands", "Acceptable substitute refrigerants", "Technician test centers", "Recovery cylinder colors"], 1, "SNAP (Significant New Alternatives Policy) lists acceptable substitutes for ozone-depleting refrigerants.", "Core: Regs & Ozone"],
["Civil penalties for knowingly venting refrigerant can reach what level?", ["$500 total", "A one-time $5,000 fine", "Tens of thousands of dollars per day, per violation", "No penalty"], 2, "Fines run per day, per violation, in the tens of thousands. The figure has escalated over time ($25,000 to $37,500 to ~$44,539); pick the per-day, per-violation answer.", "Core: Regs & Ozone"],
["A2L refrigerants such as R-32 and R-454B are classified as what?", ["Highly toxic", "Mildly flammable, lower toxicity", "Non-flammable, high toxicity", "Ozone-depleting"], 1, "A2L = lower toxicity (A), mildly flammable (2L). They are low-GWP replacements for R-410A.", "Core: Regs & Ozone"],
["Which is a flammable (A3) refrigerant?", ["R-410A", "R-22", "R-290 (propane)", "R-134a"], 2, "R-290 (propane) and R-600a (isobutane) are A3, highly flammable hydrocarbons used in some small appliances.", "Core: Regs & Ozone"],
["What does 'recover' refrigerant mean?", ["Process it to like-new purity", "Remove it from a system and store it in an external container", "Sell it to another shop", "Vent it safely"], 1, "Recover = remove refrigerant and store it externally, with no cleaning or testing.", "Core: Recover/Recycle/Reclaim"],
["What does 'recycle' refrigerant mean?", ["Reprocess to AHRI 700 purity", "Clean it on-site by oil separation and passes through filter-driers for reuse by the same owner", "Vent it", "Recover only"], 1, "Recycle = field cleaning (oil separation, moisture/acid removal via filter-driers) for reuse on equipment owned by the same person.", "Core: Recover/Recycle/Reclaim"],
["What does 'reclaim' refrigerant mean?", ["A quick field cleanup", "Reprocess it to meet the AHRI 700 purity standard, the only way to certify it for resale", "Recover into a cylinder", "Mix two refrigerants"], 1, "Reclaim = reprocess to AHRI 700 (like-new) purity. It is the only path to legally change ownership of recovered refrigerant.", "Core: Recover/Recycle/Reclaim"],
["Reclaimed refrigerant must be purified to meet which standard?", ["ASHRAE 15", "AHRI/ARI 700", "DOT 39", "OSHA 1910"], 1, "Reclaimed refrigerant must meet the AHRI 700 standard (about 99.5% purity).", "Core: Recover/Recycle/Reclaim"],
["Recovered refrigerant may be reused without reclaiming on what?", ["Any customer's system", "The same system or another system owned by the same person", "A system owned by anyone", "Only brand-new equipment"], 1, "Recovered/recycled refrigerant can go back to the same system or another owned by the same person. Changing ownership requires reclaiming.", "Core: Recover/Recycle/Reclaim"],
["Recovery equipment manufactured after November 15, 1993 must be what?", ["Painted gray", "Certified by an EPA-approved testing organization (e.g., UL/ETL)", "Made of copper", "Rated for 600V"], 1, "Post-Nov-15-1993 recovery/recycling equipment must be third-party certified to meet EPA recovery efficiency standards.", "Core: Recover/Recycle/Reclaim"],
["Self-contained (active) recovery equipment is defined by what?", ["It uses the appliance's own compressor", "It has its own compressor or pump to remove refrigerant", "It only works on small appliances", "It vents to atmosphere"], 1, "Active (self-contained) recovery units have their own compressor/pump. Passive (system-dependent) units rely on the appliance.", "Core: Recover/Recycle/Reclaim"],
["System-dependent (passive) recovery may be used only on appliances containing how much refrigerant?", ["Any amount", "15 pounds or less", "100 pounds or less", "200 pounds or more"], 1, "Passive recovery is limited to appliances with 15 lbs or less of refrigerant.", "Core: Recover/Recycle/Reclaim"],
["Before transferring recovered refrigerant into a recovery cylinder, you should do what?", ["Fill it completely", "Evacuate the empty cylinder first", "Heat the cylinder", "Add nitrogen"], 1, "Always evacuate an empty recovery cylinder before charging it, to avoid non-condensables and contamination.", "Core: Recover/Recycle/Reclaim"],
["Which is prohibited when handling recovery cylinders?", ["Labeling the cylinder", "Mixing different refrigerants in the same cylinder", "Evacuating before use", "Keeping it upright"], 1, "Never mix refrigerant types in one recovery cylinder; mixed refrigerant cannot be reclaimed and must be destroyed.", "Core: Recover/Recycle/Reclaim"],
["Refrigerant/recovery cylinders must never be filled above what level?", ["50% by weight", "80% of capacity by weight", "95% by weight", "100% by weight"], 1, "Never exceed 80% fill by weight, leaving room for liquid expansion as temperature rises (prevents rupture).", "Core: Safety & Handling"],
["A standard refrigerant recovery cylinder is colored how?", ["All green", "Gray body with a yellow top", "All blue", "Red with white top"], 1, "Recovery cylinders are gray with a yellow shoulder/top.", "Core: Safety & Handling"],
["DOT requires refillable refrigerant cylinders be hydrostatically retested how often?", ["Every year", "Every 5 years", "Every 10 years", "Never"], 1, "Refillable DOT cylinders must be hydrostatically tested and stamped every 5 years.", "Core: Safety & Handling"],
["Disposable (single-use) refrigerant cylinders are DOT-39 and must be what?", ["Refilled when empty", "Never refilled", "Hydro-tested yearly", "Painted gray"], 1, "DOT-39 disposable cylinders are non-refillable; refilling them is illegal and dangerous.", "Core: Safety & Handling"],
["The maximum recommended storage temperature for a refrigerant cylinder is about what?", ["80 F", "100 F", "125 F", "200 F"], 2, "Keep cylinders below 125 F. Heat raises internal pressure and risks rupture.", "Core: Safety & Handling"],
["The main danger of refrigerant leaking into a confined, poorly ventilated space is what?", ["Fire", "Oxygen displacement and asphyxiation", "Electrocution", "Ozone creation"], 1, "Most refrigerants are heavier than air, settle low, and displace oxygen, risking suffocation.", "Core: Safety & Handling"],
["Liquid refrigerant contacting skin or eyes can cause what?", ["Sunburn", "Frostbite", "Mild rash only", "Nothing"], 1, "Liquid refrigerant boils at low temperature and causes frostbite on contact. Wear gloves and eye protection.", "Core: Safety & Handling"],
["When refrigerant contacts an open flame or very high heat, it can break down into what?", ["Harmless water vapor", "Toxic, corrosive gases such as phosgene and acids", "Pure oxygen", "Nitrogen"], 1, "Heat decomposes refrigerant into toxic/corrosive byproducts (phosgene, hydrofluoric/hydrochloric acid). Ventilate and avoid open flame.", "Core: Safety & Handling"],
["To pressure-test a system for leaks, you should use what?", ["Oxygen", "Acetylene", "Dry nitrogen (with a trace of refrigerant if using an electronic detector)", "Compressed air only"], 2, "Use dry nitrogen. Add a trace of refrigerant only if needed for an electronic detector. Never use oxygen or acetylene.", "Core: Safety & Handling"],
["Why must you never pressurize a system with oxygen?", ["It is too expensive", "It can violently explode in the presence of oil", "It freezes the lines", "It is illegal to buy"], 1, "Oxygen reacting with compressor oil under pressure can cause a violent explosion.", "Core: Safety & Handling"],
["A halide torch leak detector changes flame color in the presence of what?", ["Any refrigerant", "Chlorinated refrigerants (CFCs/HCFCs) only", "HFCs only", "Nitrogen"], 1, "A halide torch turns the flame green/blue when chlorine is present, so it works on CFCs/HCFCs but not chlorine-free HFCs.", "Core: Safety & Handling"],
["Non-condensables (air) trapped in a system cause what symptom?", ["Low head pressure", "Abnormally high head/discharge pressure", "No effect", "Frozen evaporator only"], 1, "Air will not condense, so it raises discharge/head pressure above the P-T chart value for the ambient.", "Core: Safety & Handling"],
["A strong acrid odor while recovering refrigerant usually indicates what?", ["Normal operation", "A compressor burnout (acid present)", "Low charge", "A clogged filter only"], 1, "Acrid odor signals a burnout. Recover, then install a suction-line filter-drier and change the oil to remove acid.", "Core: Safety & Handling"],
["It is a violation to change compressor oil at a pressure higher than what?", ["0 psig", "5 psig", "15 psig", "50 psig"], 1, "Reduce system pressure to no more than 5 psig before removing oil so dissolved refrigerant in the oil is recovered.", "Core: Safety & Handling"],
["You should never energize a hermetic compressor motor under what condition?", ["Full charge", "A deep vacuum", "Normal pressure", "With gauges attached"], 1, "Energizing windings under deep vacuum can arc and damage the motor. Never run a compressor in a vacuum.", "Core: Safety & Handling"],
["Pulling a vacuum too quickly on a wet system can do what?", ["Speed up evacuation safely", "Freeze the moisture into ice, trapping it", "Overcharge the system", "Nothing"], 1, "Rapid pressure drop can freeze water into ice. Slow down or introduce nitrogen to keep moisture in vapor form.", "Core: Safety & Handling"],
["As the pressure of a refrigerant increases, its saturation (boiling) temperature does what?", ["Decreases", "Increases", "Stays the same", "Becomes zero"], 1, "Higher pressure raises the saturation temperature. This pressure-temperature relationship is the basis of the P-T chart.", "Core: Refrigerants & Cylinders"],
["A pressure-temperature (P-T) chart is used to do what?", ["Size ductwork", "Find the saturation temperature for a given pressure (and vice versa)", "Measure airflow", "Rate a compressor"], 1, "A P-T chart relates a refrigerant's pressure to its saturation temperature, used to set superheat and subcooling.", "Core: Refrigerants & Cylinders"],
["Superheat is best described as what?", ["Liquid below its saturation temperature", "Vapor temperature above its saturation temperature", "The condenser pressure", "The full charge weight"], 1, "Superheat is how many degrees the vapor is above saturation, measured at the evaporator outlet/suction line.", "Core: Refrigerants & Cylinders"],
["Subcooling is best described as what?", ["Vapor above its saturation temperature", "Liquid refrigerant below its saturation temperature", "The suction pressure", "Airflow across the coil"], 1, "Subcooling is how many degrees the liquid is below saturation, measured at the condenser outlet/liquid line.", "Core: Refrigerants & Cylinders"],
["A filter-drier is installed in a system to do what?", ["Add oil", "Remove moisture and acid", "Increase pressure", "Meter refrigerant"], 1, "The filter-drier removes moisture, acid, and particulate. A suction-line drier is added after a burnout.", "Core: Refrigerants & Cylinders"],
["Which pressure class does R-410A fall into?", ["Low-pressure", "Medium-pressure", "High-pressure", "Not a refrigerant"], 2, "R-410A is a high-pressure (Type II) refrigerant; it operates at notably higher pressures than R-22.", "Core: Refrigerants & Cylinders"],
["A2L refrigerants commonly replacing R-410A in new equipment include which?", ["R-12 and R-22", "R-32 and R-454B", "R-11 and R-123", "R-502 and R-13"], 1, "R-32 and R-454B are the primary low-GWP A2L replacements for R-410A in new residential/light-commercial systems.", "Core: Refrigerants & Cylinders"],
["A 'small appliance' is one factory-manufactured, charged, and hermetically sealed with how much refrigerant?", ["5 pounds or less", "15 pounds or less", "50 pounds or less", "Any amount"], 0, "A small appliance is factory-sealed with 5 lbs or less of refrigerant.", "Type I: Small Appliance"],
["Which of these is a small appliance?", ["A 30-ton rooftop unit", "A residential central AC", "A household refrigerator or window air conditioner", "A centrifugal chiller"], 2, "Household refrigerators, window ACs, PTACs, dehumidifiers, vending machines, and water coolers are small appliances.", "Type I: Small Appliance"],
["Using self-contained recovery equipment on a small appliance with an OPERATING compressor, you must recover what?", ["80% of the refrigerant", "90% of the refrigerant", "100% of the refrigerant", "50% of the refrigerant"], 1, "Compressor working: recover 90%. Compressor not working: recover 80%.", "Type I: Small Appliance"],
["With a NON-operating compressor (post-1993 self-contained equipment), the small-appliance recovery requirement is what?", ["90%", "80%", "70%", "60%"], 1, "If the compressor is not functional, you must recover at least 80% of the charge.", "Type I: Small Appliance"],
["Recovery requirements for a small appliance can alternatively be met by evacuating it to what vacuum?", ["1 inch Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 1, "Evacuating a small appliance to 4 inches of mercury vacuum satisfies the recovery rule.", "Type I: Small Appliance"],
["Does the EPA require leak repair on small appliances?", ["Yes, within 30 days", "No, but repair leaks when possible to conserve refrigerant", "Yes, within 1 year", "Only on window units"], 1, "Leak repair rules do not apply to small appliances, though good practice is to fix leaks anyway.", "Type I: Small Appliance"],
["The final person in the disposal chain of a small appliance (e.g., scrap recycler) must do what?", ["Crush it immediately", "Recover the refrigerant or verify it was already recovered", "Vent the refrigerant", "Refill it"], 1, "The last disposer must ensure and document that refrigerant was recovered before final disposal.", "Type I: Small Appliance"],
["Isobutane (R-600a) is approved as a substitute for use in what?", ["Retrofitting old chillers", "New household refrigerators and freezers", "Car AC", "Commercial rooftop units"], 1, "R-600a is approved for NEW household refrigerators/freezers, not as a retrofit into existing small appliances.", "Type I: Small Appliance"],

var LS_KEY = "epa608drill_v1";
var C = 2 * Math.PI * 19; // ring circumference ~119.38

var prog = {};
function load(){ try{ prog = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ prog = {}; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(prog)); }catch(e){} }
function P(i){ if(!prog[i]) prog[i] = {c:0, seen:false, hist:[]}; return prog[i]; }

var activeTopic = "All";
var pool = [];
var queue = [];
var cur = -1;
var curOpts = [];
var waiting = false;
var lastCorrect = false;
var advTimer = null;

function shuffle(a){ for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; } return a; }

function distinctTopics(){ var s=[]; for(var i=0;i<MCQS.length;i++){ if(s.indexOf(MCQS[i][4])<0) s.push(MCQS[i][4]); } return s; }
function buildPool(){ pool=[]; for(var i=0;i<MCQS.length;i++){ if(activeTopic==="All"||MCQS[i][4]===activeTopic) pool.push(i); } }
function buildQueue(){ queue = pool.filter(function(i){ return P(i).c < 2; }); shuffle(queue); }

function seenPct(){ var n=0; for(var k=0;k<pool.length;k++){ if(P(pool[k]).seen) n++; } return pool.length? n/pool.length*100 : 0; }
function aptPct(){ var s=0; for(var k=0;k<pool.length;k++){ s += Math.min(P(pool[k]).c,2)/2; } return pool.length? s/pool.length*100 : 0; }
function masteredCount(){ var n=0; for(var k=0;k<pool.length;k++){ if(P(pool[k]).c>=2) n++; } return n; }

function setRing(id, pct){ var el=document.getElementById(id); if(el) el.setAttribute("stroke-dashoffset", (C*(1-pct/100)).toFixed(2)); }
function rings(){
  var sp=seenPct(), ap=aptPct();
  setRing("seenRing", sp); setRing("aptRing", ap);
  document.getElementById("seenVal").textContent = Math.round(sp)+"%";
  document.getElementById("aptVal").textContent = Math.round(ap)+"%";
  document.getElementById("mastN").textContent = masteredCount();
  document.getElementById("totN").textContent = pool.length;
  document.getElementById("queueN").textContent = queue.length;
}

var LETTERS = ["A","B","C","D","E","F"];

function uniqueWords(correctText, allTexts){
  var clean=function(s){ return s.toLowerCase().replace(/[^a-z0-9%. ]/g,"").split(/\s+/).filter(Boolean); };
  var others={}; for(var i=0;i<allTexts.length;i++){ if(allTexts[i]===correctText) continue; clean(allTexts[i]).forEach(function(w){ others[w]=1; }); }
  var set={}; clean(correctText).forEach(function(w){ if(!others[w] && w.length>2) set[w]=1; }); return set;
}
function boldUnique(text, uniq){
  return text.split(/(\s+)/).map(function(tok){
    var key=tok.toLowerCase().replace(/[^a-z0-9%.]/g,"");
    return (key && uniq[key]) ? "<b>"+tok+"</b>" : tok;
  }).join("");
}

function render(){
  if(queue.length===0){ finish(); return; }
  document.getElementById("finish").classList.remove("done");
  document.getElementById("card").style.display="block";
  cur = queue[0];
  var m = MCQS[cur];
  curOpts = m[1].map(function(t,oi){ return {oi:oi, text:t}; });
  shuffle(curOpts);
  waiting=false;
  document.getElementById("qtopic").textContent = m[4];
  document.getElementById("q").textContent = m[0];
  var box=document.getElementById("opts"); box.innerHTML="";
  for(var d=0; d<curOpts.length; d++){
    var b=document.createElement("button");
    b.className="ans"; b.dataset.disp=d; b.setAttribute("data-disp", d);
    b.innerHTML='<span class="ltr">'+LETTERS[d]+'</span><span class="txt">'+
       curOpts[d].text.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>';
    (function(dd){ b.addEventListener("click", function(){ pick(dd); }); })(d);
    box.appendChild(b);
  }
  document.getElementById("explain").classList.remove("show");
  document.getElementById("cont").classList.remove("show");
  rings();
}

function pick(disp){
  if(waiting) return;
  var m = MCQS[cur];
  var chosen = curOpts[disp].oi;
  lastCorrect = (chosen === m[2]);
  var p = P(cur); p.seen=true;
  p.c = lastCorrect ? (p.c+1) : 0;
  p.hist.push(lastCorrect?1:0);
  save();
  waiting=true;

  var btns = document.querySelectorAll("#opts .ans");
  var uniq = uniqueWords(m[1][m[2]], m[1]);
  for(var i=0;i<btns.length;i++){
    btns[i].classList.add("lock");
    var oi = curOpts[i].oi;
    var txtSpan = btns[i].querySelector(".txt");
    if(oi === m[2]){
      btns[i].classList.add("correct");
      txtSpan.innerHTML = boldUnique(curOpts[i].text.replace(/&/g,"&amp;").replace(/</g,"&lt;"), uniq);
    } else if(i===disp){
      btns[i].classList.add("wrong");
    }
  }
  rings();
  if(lastCorrect){
    advTimer = setTimeout(next, 420);
  } else {
    var ex=document.getElementById("explain"); ex.textContent=m[3]; ex.classList.add("show");
    document.getElementById("cont").classList.add("show");
  }
}

function next(){
  if(!waiting) return;
  waiting=false;
  if(advTimer){ clearTimeout(advTimer); advTimer=null; }
  var idx = cur;
  queue.shift();
  var p = P(idx);
  if(lastCorrect && p.c>=2){
    // mastered -> retire
  } else if(lastCorrect){
    var pos = Math.min(10, queue.length);
    queue.splice(pos,0,idx);
  } else {
    var pos2 = Math.min(3, queue.length);
    queue.splice(pos2,0,idx);
  }
  render();
}

function finish(){
  cur=-1;
  document.getElementById("card").style.display="none";
  document.getElementById("finish").classList.add("done");
  rings();
}

document.addEventListener("keydown", function(e){
  if(waiting){
    if(e.key===" "||e.key==="Enter"||e.key==="Spacebar"){ e.preventDefault(); next(); }
    return;
  }
  var map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  var k=(e.key||"").toLowerCase();
  if(k in map && map[k] < curOpts.length){ e.preventDefault(); pick(map[k]); }
});

function buildTopicSel(){
  var sel=document.getElementById("topicSel"); sel.innerHTML="";
  var opts=["All"].concat(distinctTopics());
  for(var i=0;i<opts.length;i++){ var o=document.createElement("option"); o.value=opts[i]; o.textContent=opts[i]; sel.appendChild(o); }
  sel.value=activeTopic;
  sel.addEventListener("change", function(){ activeTopic=sel.value; buildPool(); buildQueue(); render(); });
}

document.getElementById("resetBtn").addEventListener("click", function(){
  if(!confirm("Wipe all drill progress?")) return;
  prog={}; try{ localStorage.removeItem(LS_KEY); }catch(e){}
  buildPool(); buildQueue(); render();
});
document.getElementById("againBtn").addEventListener("click", function(){
  for(var k=0;k<pool.length;k++){ var p=P(pool[k]); p.c=0; }
  save(); buildQueue(); render();
});

load();
buildTopicSel();
buildPool();
buildQueue();
render();
</script>

  var qp=null; try{qp=new URLSearchParams(location.search).get("theme");}catch(e){}
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  var t=qp||saved||"light";
  function apply(x){document.documentElement.setAttribute("data-theme",x);btn.textContent=x==="dark"?"\u2600":"\u263e";}
  apply(t);
