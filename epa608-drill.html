  - Day/night toggle: floating button bottom-right. Persists to localStorage key

    overrides for screenshots/sharing without persisting.
  - Core/Full mode toggle, index-keyed progress (append-only banks preserve progress).

  EPA 608 Mastery Drill      e.g. "D196 Drill"

  MCQS array     rows: [question, [opts], correctIndex, explanation, "Topic", coreFlag]

Mobile tap-to-advance: document-level click handler with 250ms debounce (waitAt) so the

const MCQS=[
["Which agency administers refrigerant-handling certification under Section 608?", ["EPA", "OSHA", "DOT", "DOE"], 0, "Section 608 of the Clean Air Act is administered and enforced by the EPA.", "Core: Regs & Ozone", 1],

["How long is a Section 608 certification valid?", ["5 years, then an open-book retest", "10 years, with a refresher course", "It never expires or needs renewal", "Until covered refrigerants phase out"], 2, "608 certification is lifetime; no renewal or continuing-ed is required by the EPA.", "Core: Regs & Ozone", 1],

["What is the minimum score to pass each section of the 608 exam?", ["60% (15 of 25)", "70% (18 of 25)", "80% (20 of 25)", "84% (21 of 25)"], 1, "Each section is 25 questions; you must answer 18 correctly (70%) to pass that section.", "Core: Regs & Ozone", 1],
["Motor vehicle air conditioners (MVACs) are certified under which section?", ["Section 608", "Section 609", "Section 610", "Section 611"], 1, "MVAC work falls under Section 609, not 608. 608 covers stationary equipment.", "Core: Regs & Ozone", 1],
["Knowingly venting which refrigerants is illegal?", ["CFCs and HCFCs only", "CFCs only, since HFCs contain no chlorine", "CFCs, HCFCs, and HFC substitutes", "Only refrigerants listed as Class I substances"], 2, "Venting is banned for CFCs/HCFCs (since 1992) and was extended to HFC substitutes (since 1995).", "Core: Regs & Ozone", 1],
["Which release does NOT violate the venting prohibition?", ["Releases during disposal of small appliances", "De minimis losses during good-faith recovery", "Releases within 30 days of a leak repair", "Releases under one pound per service call"], 1, "De minimis (minimal, unavoidable) releases during good-faith recovery/recycling are not violations.", "Core: Regs & Ozone", 1],
["Which class of refrigerant has the highest ozone depletion potential (ODP)?", ["CFCs", "HCFCs", "HFCs", "HCs"], 0, "CFCs (e.g., R-12) have the highest ODP. HCFCs are lower; HFCs have zero ODP.", "Core: Regs & Ozone", 1],
["HFC refrigerants like R-134a and R-410A have what ozone depletion potential?", ["The highest of any class", "Zero, they contain no chlorine", "About half that of CFCs", "Roughly equal to HCFCs"], 1, "HFCs contain no chlorine, so their ODP is zero. They are regulated instead for their GWP. HFCs have zero ODP (no chlorine) but real global warming potential, hence the AIM Act phasedown.", "Core: Regs & Ozone", 1],
["The Montreal Protocol is an international agreement to do what?", ["Set international refrigerant purity standards", "Phase out ozone-depleting substances", "License technicians across member countries", "Ban all synthetic refrigerants by 2030"], 1, "The Montreal Protocol commits nations to phasing out ozone-depleting substances like CFCs and HCFCs.", "Core: Regs & Ozone", 1],
["The AIM Act drives the phasedown of which refrigerants?", ["CFCs", "HCFCs", "HFCs", "Ammonia"], 2, "The AIM Act mandates an 85% phasedown of HFC production/consumption and pushes low-GWP (A2L) substitutes.", "Core: Regs & Ozone", 1],
["Complete phaseout of R-22 production and import took effect on what date?", ["January 1, 2010", "January 1, 2015", "January 1, 2020", "January 1, 2025"], 2, "Jan 1, 2010 banned R-22 in new equipment; Jan 1, 2020 banned all production/import. Only reclaimed/stockpiled R-22 remains.", "Core: Regs & Ozone", 1],
["Since January 1, 2018, refrigerant (including HFCs) may be sold only to whom?", ["Licensed HVAC contractors regardless of certification", "EPA-certified technicians or their employers", "Anyone 18 or older with a business license", "Certified techs for CFCs only, anyone for HFCs"], 1, "The sales restriction limits refrigerant purchases to 608/609-certified technicians.", "Core: Regs & Ozone", 1],
["The EPA's SNAP program identifies what?", ["Certified recovery equipment models", "Acceptable substitute refrigerants", "Approved refrigerant reclaimers", "Exempt small-appliance categories"], 1, "SNAP (Significant New Alternatives Policy) lists acceptable substitutes for ozone-depleting refrigerants.", "Core: Regs & Ozone", 1],
["Civil penalties for knowingly venting refrigerant can reach what level?", ["A flat $5,000 per incident", "Tens of thousands per day, per violation", "Up to $1,000 plus decertification", "Criminal charges only, no civil fines"], 1, "Fines run per day, per violation, in the tens of thousands. The figure has escalated over time ($25,000 to $37,500 to ~$44,539); pick the per-day, per-violation answer.", "Core: Regs & Ozone", 1],
["A2L refrigerants such as R-32 and R-454B are classified as what?", ["Non-flammable, higher toxicity", "Mildly flammable, lower toxicity", "Highly flammable, low toxicity", "Non-flammable, low toxicity"], 1, "A2L = lower toxicity (A), mildly flammable (2L). They are low-GWP replacements for R-410A.", "Core: Regs & Ozone", 1],
["Which is a flammable (A3) refrigerant?", ["R-410A", "R-22", "R-290", "R-123"], 2, "R-290 (propane) and R-600a (isobutane) are A3, highly flammable hydrocarbons used in some small appliances. R-290 is propane, an A3 highly flammable hydrocarbon.", "Core: Regs & Ozone", 1],

["Reclaimed refrigerant must be purified to meet which standard?", ["ASHRAE 34", "AHRI 700", "SAE J2843", "ISO 5149"], 1, "Reclaimed refrigerant must meet the AHRI 700 standard (about 99.5% purity).", "Core: Recover/Recycle/Reclaim", 1],

["Which is prohibited when handling recovery cylinders?", ["Storing cylinders upright in a service van", "Mixing different refrigerants in one cylinder", "Reusing a cylinder for the same refrigerant", "Filling a recovery cylinder to 80% by weight"], 1, "Never mix refrigerant types in one recovery cylinder; mixed refrigerant cannot be reclaimed and must be destroyed.", "Core: Recover/Recycle/Reclaim", 1],
["Refrigerant/recovery cylinders must never be filled above what level?", ["60% of capacity by weight", "80% of capacity by weight", "90% of capacity by weight", "Whatever the pressure gauge allows"], 1, "Never exceed 80% fill by weight, leaving room for liquid expansion as temperature rises (prevents rupture).", "Core: Safety & Handling", 1],
["A standard refrigerant recovery cylinder is colored how?", ["Yellow body with a gray top", "Gray body with a yellow top", "Green body with a white top", "Gray body with a red top"], 1, "Recovery cylinders are gray with a yellow shoulder/top.", "Core: Safety & Handling", 1],
["DOT requires refillable refrigerant cylinders be hydrostatically retested how often?", ["Every year", "Every 5 years", "Every 10 years", "Never"], 1, "Refillable DOT cylinders must be hydrostatically tested and stamped every 5 years.", "Core: Safety & Handling", 1],
["Disposable (single-use) refrigerant cylinders are DOT-39 and must be what?", ["Refilled when empty", "Never refilled", "Hydro-tested yearly", "Painted gray"], 1, "DOT-39 disposable cylinders are non-refillable; refilling them is illegal and dangerous.", "Core: Safety & Handling", 1],
["The maximum recommended storage temperature for a refrigerant cylinder is about what?", ["80 F", "100 F", "125 F", "200 F"], 2, "Keep cylinders below 125 F. Heat raises internal pressure and risks rupture.", "Core: Safety & Handling", 1],
["The main danger of refrigerant leaking into a confined, poorly ventilated space is what?", ["Ignition of the refrigerant vapor", "Oxygen displacement and asphyxiation", "Frostbite from vapor contact", "Long-term neurological toxicity"], 1, "Most refrigerants are heavier than air, settle low, and displace oxygen, risking suffocation.", "Core: Safety & Handling", 1],
["Liquid refrigerant contacting skin or eyes can cause what?", ["Sunburn", "Frostbite", "Mild rash only", "Nothing"], 1, "Liquid refrigerant boils at low temperature and causes frostbite on contact. Wear gloves and eye protection.", "Core: Safety & Handling", 1],
["When refrigerant contacts an open flame or very high heat, it can break down into what?", ["Harmless carbon dioxide and water vapor", "Toxic acid gases (hydrofluoric, hydrochloric)", "Pure chlorine gas only", "Flammable hydrogen and methane"], 1, "Heat decomposes refrigerant into toxic/corrosive byproducts (phosgene, hydrofluoric/hydrochloric acid). Ventilate and avoid open flame.", "Core: Safety & Handling", 1],
["To pressure-test a system for leaks, you should use what?", ["Compressed shop air", "Dry nitrogen", "CO2 from a welding cylinder", "Refrigerant vapor at full cylinder pressure"], 1, "Use dry nitrogen. Add a trace of refrigerant only if needed for an electronic detector. Never use oxygen or acetylene. Add a trace of refrigerant only if sniffing with an electronic detector.", "Core: Safety & Handling", 1],
["Why must you never pressurize a system with oxygen?", ["It contaminates the system with moisture", "It can explode on contact with compressor oil", "It corrodes aluminum evaporator coils", "It gives false readings on leak detectors"], 1, "Oxygen reacting with compressor oil under pressure can cause a violent explosion.", "Core: Safety & Handling", 1],
["A halide torch leak detector changes flame color in the presence of what?", ["All refrigerants including HFCs", "Chlorinated refrigerants (CFCs and HCFCs)", "Hydrocarbons such as propane only", "Any gas heavier than air"], 1, "A halide torch turns the flame green/blue when chlorine is present, so it works on CFCs/HCFCs but not chlorine-free HFCs.", "Core: Safety & Handling", 1],
["Non-condensables (air) trapped in a system cause what symptom?", ["Low suction pressure", "High head pressure", "High superheat at the evaporator outlet", "Short-cycling on the low-pressure switch"], 1, "Air will not condense, so it raises discharge/head pressure above the P-T chart value for the ambient.", "Core: Safety & Handling", 1],
["A strong acrid odor while recovering refrigerant usually indicates what?", ["An overcharged system", "Compressor burnout acids", "Non-condensables in the condenser", "Moisture freezing at the metering device"], 1, "Acrid odor signals a burnout. Recover, then install a suction-line filter-drier and change the oil to remove acid.", "Core: Safety & Handling", 1],
["It is a violation to change compressor oil at a pressure higher than what?", ["0 psig", "5 psig", "15 psig", "50 psig"], 1, "Reduce system pressure to no more than 5 psig before removing oil so dissolved refrigerant in the oil is recovered.", "Core: Safety & Handling", 1],
["You should never energize a hermetic compressor motor under what condition?", ["Full charge", "A deep vacuum", "Normal pressure", "With gauges attached"], 1, "Energizing windings under deep vacuum can arc and damage the motor. Never run a compressor in a vacuum.", "Core: Safety & Handling", 1],
["Pulling a vacuum too quickly on a wet system can do what?", ["Boil the oil out of the compressor", "Freeze the moisture into ice, trapping it", "Collapse the evaporator tubing", "Overheat the vacuum pump motor"], 1, "Rapid pressure drop can freeze water into ice. Slow down or introduce nitrogen to keep moisture in vapor form.", "Core: Safety & Handling", 1],
["As the pressure of a refrigerant increases, its saturation (boiling) temperature does what?", ["Decreases", "Increases", "Stays the same", "Becomes zero"], 1, "Higher pressure raises the saturation temperature. This pressure-temperature relationship is the basis of the P-T chart.", "Core: Refrigerants & Cylinders", 1],
["A pressure-temperature (P-T) chart is used to do what?", ["Convert gauge pressure to absolute pressure", "Find saturation temperature for a given pressure", "Determine the correct oil charge", "Size the liquid line for a given tonnage"], 1, "A P-T chart relates a refrigerant's pressure to its saturation temperature, used to set superheat and subcooling.", "Core: Refrigerants & Cylinders", 1],
["Superheat is best described as what?", ["Liquid cooled below its saturation temperature", "Vapor heated above its saturation temperature", "The temperature rise across the compressor", "The condenser-to-evaporator temperature split"], 1, "Superheat is how many degrees the vapor is above saturation, measured at the evaporator outlet/suction line.", "Core: Refrigerants & Cylinders", 1],
["Subcooling is best described as what?", ["Vapor heated above its saturation temperature", "Liquid cooled below its saturation temperature", "The temperature drop across the metering device", "The evaporator outlet temperature at design load"], 1, "Subcooling is how many degrees the liquid is below saturation, measured at the condenser outlet/liquid line.", "Core: Refrigerants & Cylinders", 1],
["A filter-drier is installed in a system to do what?", ["Separate oil from the refrigerant", "Remove moisture and acid", "Regulate liquid-line pressure", "Trap non-condensables"], 1, "The filter-drier removes moisture, acid, and particulate. A suction-line drier is added after a burnout.", "Core: Refrigerants & Cylinders", 1],
["Which pressure class does R-410A fall into?", ["Low-pressure", "Medium-pressure", "High-pressure", "Not a refrigerant"], 2, "R-410A is a high-pressure (Type II) refrigerant; it operates at notably higher pressures than R-22.", "Core: Refrigerants & Cylinders", 1],
["A2L refrigerants commonly replacing R-410A in new equipment include which?", ["R-12 and R-22", "R-32 and R-454B", "R-11 and R-123", "R-502 and R-13"], 1, "R-32 and R-454B are the primary low-GWP A2L replacements for R-410A in new residential/light-commercial systems.", "Core: Refrigerants & Cylinders", 1],
["A 'small appliance' is one factory-manufactured, charged, and hermetically sealed with how much refrigerant?", ["5 pounds or less", "15 pounds or less", "50 pounds or less", "Any amount"], 0, "A small appliance is factory-sealed with 5 lbs or less of refrigerant.", "Type I: Small Appliance", 1],
["Which of these is a small appliance?", ["A residential central AC charged with 4 lbs", "A household refrigerator or window AC", "A packaged rooftop unit under 5 tons", "A water-cooled chiller with a 5-lb charge"], 1, "Household refrigerators, window ACs, PTACs, dehumidifiers, vending machines, and water coolers are small appliances. Field-charged central systems fail the factory-sealed test regardless of charge size.", "Type I: Small Appliance", 1],
["Using self-contained recovery equipment on a small appliance with an OPERATING compressor, you must recover what?", ["80% of the refrigerant", "90% of the refrigerant", "100% of the refrigerant", "50% of the refrigerant"], 1, "Compressor working: recover 90%. Compressor not working: recover 80%.", "Type I: Small Appliance", 1],
["With a NON-operating compressor (post-1993 self-contained equipment), the small-appliance recovery requirement is what?", ["90%", "80%", "70%", "60%"], 1, "If the compressor is not functional, you must recover at least 80% of the charge.", "Type I: Small Appliance", 1],
["Recovery requirements for a small appliance can alternatively be met by evacuating it to what vacuum?", ["1 inch Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 1, "Evacuating a small appliance to 4 inches of mercury vacuum satisfies the recovery rule.", "Type I: Small Appliance", 1],
["Does the EPA require leak repair on small appliances?", ["Yes, within 30 days of discovery", "No, small appliances are exempt", "Yes, when the leak rate exceeds 10%", "Only when the charge exceeds one pound"], 1, "Leak repair rules do not apply to small appliances, though good practice is to fix leaks anyway. Repair anyway when practical to conserve refrigerant, but the rules start at 50 lbs.", "Type I: Small Appliance", 1],
["The final person in the disposal chain of a small appliance (e.g., scrap recycler) must do what?", ["Notify the EPA before crushing the appliance", "Recover the refrigerant or verify prior recovery", "Remove the compressor and drain the oil", "Hold the appliance 30 days before destruction"], 1, "The last disposer must ensure and document that refrigerant was recovered before final disposal.", "Type I: Small Appliance", 1],
["Isobutane (R-600a) is approved as a substitute for use in what?", ["Retrofits of existing R-134a refrigerators", "New household refrigerators and freezers", "Commercial walk-in coolers of any size", "Automotive air conditioning systems"], 1, "R-600a is approved for NEW household refrigerators/freezers, not as a retrofit into existing small appliances.", "Type I: Small Appliance", 1],
["Low-loss fittings on recovery hoses are required to do what?", ["Prevent oil migrating into the recovery unit", "Minimize release at connect and disconnect", "Maintain deep vacuum during long recoveries", "Keep moisture out of the recovery cylinder"], 1, "Low-loss fittings close manually or automatically to limit refrigerant loss at the hose connections.", "Type I: Small Appliance", 1],
["Type II certification covers which appliances?", ["Low-pressure centrifugal chillers", "High-pressure and very-high-pressure appliances", "Factory-sealed appliances under 5 lbs", "Motor vehicle air conditioning systems"], 1, "Type II = high-pressure systems: most residential/commercial split systems, rooftop units, and commercial refrigeration.", "Type II: High-Pressure", 1],
["Using post-Nov-15-1993 equipment, a high-pressure appliance with LESS than 200 lbs must be evacuated to what?", ["0 in Hg", "4 in Hg", "10 in Hg", "15 in Hg"], 0, "Current EPA table: high-pressure under 200 lbs = 0 inches Hg. Note: some older exam versions list 10 inches Hg for this; if 0 is not offered, pick 10.", "Type II: High-Pressure", 1],
["Using post-1993 equipment, a high-pressure appliance with 200 lbs OR MORE must be evacuated to what?", ["0 inches Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 2, "High-pressure, 200 lbs or more: 10 inches Hg vacuum.", "Type II: High-Pressure", 1],
["Using post-1993 equipment, a medium-pressure appliance with LESS than 200 lbs is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 1, "Medium-pressure under 200 lbs: 10 inches Hg vacuum.", "Type II: High-Pressure", 1],
["Using post-1993 equipment, a medium-pressure appliance with 200 lbs OR MORE is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 2, "Medium-pressure 200 lbs or more: 15 inches Hg vacuum.", "Type II: High-Pressure", 1],
["A very high-pressure appliance must be evacuated to what level?", ["0 in Hg (0 psig)", "10 in Hg vacuum", "15 in Hg vacuum", "25 mm Hg absolute"], 0, "Very high-pressure equipment is evacuated to 0 inches Hg (0 psig). Pulling a deep vacuum risks damage.", "Type II: High-Pressure", 1],
["Mandatory leak-repair rules apply only to systems containing how much refrigerant?", ["5 lbs or more", "15 lbs or more", "50 lbs or more", "200 lbs or more"], 2, "Leak-repair thresholds apply at 50 lbs for ODS systems; the AIM Act lowered it to 15 lbs for high-GWP HFCs effective Jan 2026. 15 lbs is the new tier for high-GWP HFCs under the 2026 rules; 50 lbs is the classic answer.", "Type II: High-Pressure", 1],
["What annual leak rate triggers mandatory repair for a comfort-cooling system?", ["5%", "10%", "20%", "35%"], 1, "Comfort cooling = 10% per year (current 2019-revision rule). Older exam versions used 15%.", "Type II: High-Pressure", 1],
["What annual leak rate triggers mandatory repair for a commercial refrigeration system?", ["10%", "20%", "30%", "35%"], 1, "Commercial refrigeration = 20% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure", 1],
["What annual leak rate triggers mandatory repair for an industrial process refrigeration system?", ["10%", "20%", "30%", "50%"], 2, "Industrial process refrigeration = 30% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure", 1],
["Once a leak exceeds the applicable threshold, repair must be completed within how long?", ["24 hours", "7 days", "30 days", "1 year"], 2, "Repair (and verification) must be completed within 30 days, or a retrofit/retirement plan must be filed.", "Type II: High-Pressure", 1],
["Annual leak rate is calculated how?", ["Pounds added per year over pounds recovered", "Pounds added per year over the full charge", "Charge lost since install over system age", "Pounds added per visit over the charge"], 1, "Annual leak rate = (refrigerant added over 12 months / full charge) x 100.", "Type II: High-Pressure", 1],
["Owners of systems over 50 lbs must keep servicing records of what?", ["Certification numbers of all technicians used", "Amount and type of refrigerant added or removed", "Monthly pressure and temperature logs", "Purchase receipts for replacement parts"], 1, "Records of refrigerant added and removed must be kept (commonly retained for 3 years) for large systems.", "Type II: High-Pressure", 1],
["When charging a high-pressure system, liquid refrigerant should be added where?", ["Directly into the suction line at full flow", "Into the liquid line on the high side", "Into the crankcase through the oil port", "Into the low side with the compressor off"], 1, "Charge liquid into the high side with the unit off; if adding to the low side of a running unit, throttle to vapor to avoid slugging.", "Type II: High-Pressure", 1],
["The deep-vacuum (dehydration) target before charging a system is about what?", ["29 inches Hg only", "500 microns", "5 psig", "10 inches Hg"], 1, "Pull the system down to roughly 500 microns and confirm it holds before charging.", "Type II: High-Pressure", 1],
["After reaching the target vacuum, you should do what?", ["Break the vacuum with refrigerant immediately", "Isolate the pump and watch for pressure rise", "Run the pump another hour as a margin", "Open the service valves to equalize"], 1, "Valve off the pump and watch the micron gauge; a rising pressure means remaining moisture or a leak. A rise that levels off = moisture still boiling; a steady climb = leak.", "Type II: High-Pressure", 1],
["Type III certification covers which appliances?", ["High-pressure split systems and heat pumps", "Low-pressure appliances such as centrifugal chillers", "Factory-sealed appliances holding 5 lbs or less", "Very-high-pressure CO2 systems"], 1, "Type III = low-pressure systems, typically centrifugal chillers using R-11, R-113, or R-123.", "Type III: Low-Pressure", 1],
["A low-pressure refrigerant has a boiling point at atmospheric pressure of what?", ["Below -50 F", "Above 50 F", "Between 0 and 32 F", "Exactly 32 F at sea level"], 1, "Low-pressure refrigerants boil above 10 C (50 F) at atmospheric pressure, so the system runs in a vacuum.", "Type III: Low-Pressure", 1],
["Using post-1993 equipment, a low-pressure appliance must be evacuated to what?", ["25 in Hg vacuum", "10 in Hg vacuum", "25 mm Hg absolute", "0 psig"], 2, "Low-pressure equipment must be evacuated to 25 mm Hg absolute.", "Type III: Low-Pressure", 1],
["The low side of a low-pressure chiller normally operates at what?", ["Well above atmospheric pressure", "In a vacuum (below atmospheric)", "Exactly atmospheric", "At 410 psig"], 1, "Low-pressure systems run in a vacuum on the low side, which is why air/moisture tends to leak in.", "Type III: Low-Pressure", 1],
["A purge unit on a low-pressure chiller removes what?", ["Excess oil returning from the evaporator", "Air and other non-condensables", "Refrigerant vapor for storage during service", "Scale and sludge from the water tubes"], 1, "Because the system runs in a vacuum, air leaks in; the purge unit removes those non-condensables.", "Type III: Low-Pressure", 1],
["When leak-testing a low-pressure appliance, you must NOT pressurize it above what?", ["10 psig", "30 psig", "50 psig", "150 psig"], 0, "Low-pressure shells are not built for high pressure; do not pressurize above 10 psig for leak testing.", "Type III: Low-Pressure", 1],
["A rupture disc on a low-pressure chiller is typically set to relieve at about what pressure?", ["5 psig", "15 psig", "150 psig", "500 psig"], 1, "Low-pressure chiller rupture discs commonly relieve around 15 psig to protect the low-pressure shell.", "Type III: Low-Pressure", 1],
["Recovery from a low-pressure chiller is slow and is often aided by what?", ["Chilling the evaporator to condense vapor", "Warming the refrigerant to raise its pressure", "Venting non-condensables to speed transfer", "Adding nitrogen to push liquid across"], 1, "High-boiling low-pressure refrigerant recovers slowly; warming the liquid and pulling pressure down speeds removal.", "Type III: Low-Pressure", 1],
["Where is the ozone layer that Section 608 aims to protect located?", ["In the stratosphere", "At ground level", "In the troposphere", "Inside cloud formations"], 0, "Stratospheric ozone absorbs harmful UV radiation. Ground-level ozone is smog, a different problem.", "Core: Regs & Ozone", 1],
["Why is stratospheric ozone depletion harmful?", ["Ground-level smog concentrations increase", "More ultraviolet radiation reaches the surface", "Global average temperatures rise sharply", "Acid rain becomes more frequent and severe"], 1, "Less ozone = more UV at the surface = skin cancer, cataracts, crop damage. That's the whole point of the CFC phaseout.", "Core: Regs & Ozone", 1],
["What actually destroys ozone molecules when a CFC reaches the stratosphere?", ["The fluorine atom freed by UV radiation", "The chlorine atom freed by UV radiation", "The carbon backbone reacting with ozone", "Water vapor carried up with the refrigerant"], 1, "UV cracks the CFC, freeing chlorine. One chlorine atom destroys ozone molecules over and over. Chlorine content is why CFC > HCFC > HFC in ODP.", "Core: Regs & Ozone", 1],
["R-22 belongs to which refrigerant class?", ["CFC", "HFC", "HCFC", "Natural refrigerant"], 2, "R-22 = HCFC (some chlorine, lower ODP than CFCs). R-12 = CFC. R-134a/R-410A = HFC (no chlorine).", "Core: Regs & Ozone", 1],
["Can an uncertified apprentice handle refrigerant?", ["Yes, after registering with the EPA as an apprentice", "Yes, under direct supervision of a certified tech", "Only on small appliances holding under 5 lbs", "No, certification is required before any handling"], 1, "The apprentice exemption: allowed while closely and continually supervised by a certified tech.", "Core: Regs & Ozone", 1],
["400-series blends like R-410A and R-407C are which type of blend?", ["Azeotropic", "Zeotropic", "Single-compound refrigerants", "Inorganic refrigerants"], 1, "400-series = ZEOtropic: components boil at different temps, so the blend has glide and can fractionate. 500-series = azeotropic, acts like one refrigerant. Zeotropic 400s have temperature glide and can fractionate. Azeotropic 500s act as one compound.", "Core: Refrigerants & Cylinders", 1],
["Why must zeotropic blends be charged as a liquid?", ["Liquid charging prevents compressor slugging", "Vapor charging fractionates the blend", "Vapor charging overheats the recovery cylinder", "Liquid charging keeps superheat within range"], 1, "Pull vapor off a zeotrope and the lighter component leaves first: the blend left behind is off-spec. Charge liquid to keep the recipe intact. Pulling vapor takes the lighter component first, leaving an off-spec blend behind.", "Core: Refrigerants & Cylinders", 1],
["What is temperature glide?", ["The high-side to low-side temperature difference", "A blend's evaporating temperature range at one pressure", "The saturation temperature change per psi", "The temperature drop across the metering device"], 1, "Zeotropic blends don't boil at one temperature; they slide across a range. Single compounds and azeotropes have no glide.", "Core: Refrigerants & Cylinders", 1],
["Can a vacuum pump alone be used to recover refrigerant from a small appliance?", ["Yes, if it pulls at least 4 in Hg on the appliance", "No, its exhaust vents refrigerant to the room", "Yes, if the exhaust runs through a filter-drier", "Only on appliances built before November 1993"], 1, "A vacuum pump just moves refrigerant into the room. Recovery requires certified recovery equipment that captures it.", "Type I: Small Appliance", 1],
["During system-dependent (passive) recovery, chilling the recovery cylinder in ice does what?", ["Prevents the cylinder from exceeding 80% fill", "Lowers the cylinder's pressure to speed migration", "Condenses moisture out of the refrigerant", "Keeps the cylinder below its 125 F storage limit"], 1, "Cold cylinder = low pressure = pressure difference pulls refrigerant in. Classic passive-recovery speed trick.", "Type I: Small Appliance", 1],
["What should be done with a solderless piercing-type access valve after service?", ["Leave it installed for future service access", "Replace it with a permanent leak-tight fitting", "Torque it to spec and leak-check it annually", "Back-seat it and cap it with a brass flare cap"], 1, "Clamp-on piercing valves leak with age. Don't leave them on the appliance as permanent fittings. Clamp-on piercing valves leak over time; they are not permanent fittings.", "Type I: Small Appliance", 1],
["When recovering from a small appliance with a non-operating compressor using passive recovery, you should:", ["Recover from the high side only, then vacuum", "Heat and tap the compressor; access both sides", "Replace the compressor before recovering", "Chill the compressor to condense the refrigerant"], 1, "Non-running compressor traps refrigerant in the oil. Heating/tapping frees it; accessing both sides speeds migration.", "Type I: Small Appliance", 1],
["When working on an R-600a (isobutane) appliance, which precaution applies?", ["Wear supplied-air respiratory protection", "Eliminate ignition sources; use spark-proof tools", "Ground the appliance chassis before opening", "Recover into a glass-lined cylinder only"], 1, "R-600a is A3, highly flammable. Small charge sizes keep it legal in fridges, but sparks near a leak are the hazard.", "Type I: Small Appliance", 1],
["Refrigerant recovered from a small appliance that will be sold to another owner must first be:", ["Reclaimed to AHRI 700 purity by a certified reclaimer", "Recycled on-site with any machine", "Filtered through a drier once", "Nothing, recovered refrigerant can always be resold"], 0, "Change of ownership = reclaim to AHRI 700. Reuse without reclaiming is only allowed back into the same owner's equipment.", "Type I: Small Appliance", 1],
["A high-pressure system has leaks so bad it cannot reach the required recovery vacuum. Before repair you should evacuate it to:", ["0 psig (atmospheric pressure)", "10 in Hg vacuum anyway", "25 mm Hg absolute", "No evacuation is required"], 0, "Leaky-system exception: pulling a vacuum would just suck air in through the leak. Take it to 0 psig, repair, then finish the job.", "Type II: High-Pressure", 1],
["Which gas should flow through tubing while brazing on an opened system?", ["Dry nitrogen", "Oxygen", "Compressed air", "Refrigerant vapor"], 0, "A nitrogen sweep prevents oxidation scale inside the tubing. Never oxygen or air (explosion risk with oil).", "Type II: High-Pressure", 1],
["To speed recovery from a large high-pressure system, you should remove:", ["Vapor first, then the remaining liquid", "Liquid first, then the remaining vapor", "Vapor only; liquid stays for disposal", "Oil first, then liquid and vapor together"], 1, "Liquid moves pounds fast; vapor recovery is slow. Pull liquid first, finish with vapor.", "Type II: High-Pressure", 1],
["An open (non-hermetic) compressor that has sat unused for months is most likely to leak from the:", ["Shaft seal", "Discharge valve", "Oil plug", "Terminal box"], 0, "The rotating shaft seal dries out when idle. Classic exam answer for open-drive compressors.", "Type II: High-Pressure", 1],
["Under the leak-repair rules, appliances that have exceeded the leak threshold are subject to:", ["Mandatory retirement within five years", "Periodic follow-up leak inspections", "Monthly refrigerant purity sampling", "A permanent ban on adding refrigerant"], 1, "Post-2019 rules add follow-up inspections once an appliance over 50 lbs trips its threshold. Annual for comfort cooling; quarterly for 500+ lb commercial and industrial process.", "Type II: High-Pressure", 1],
["Refrigerant should be charged into a high-pressure system as vapor through the:", ["Low side", "High side", "Oil fill port", "Purge unit"], 0, "Vapor charges through the low side; liquid through the high side (liquid line). Reversing either can slug the compressor.", "Type II: High-Pressure", 1],
["Which refrigerants are used in low-pressure (Type III) chillers?", ["R-11 and R-123", "R-22 and R-410A", "R-134a and R-404A", "R-290 and R-600a"], 0, "R-11 (CFC, phased out) and its replacement R-123 (HCFC). Both boil above room temperature at atmospheric pressure.", "Type III: Low-Pressure", 1],
["Because a low-pressure chiller operates in a vacuum, a leak causes:", ["Air to leak INTO the system", "Refrigerant to spray out under pressure", "Immediate compressor failure", "Oil loss only"], 0, "Below atmospheric pressure, leaks run backward: air and moisture get pulled in. That's why purge units exist.", "Type III: Low-Pressure", 1],
["Where do air and non-condensables collect in a low-pressure chiller, and what removes them?", ["At the top of the condenser; the purge unit removes them", "In the evaporator; the filter-drier removes them", "In the oil sump; the oil heater removes them", "In the cooling tower; the fan removes them"], 0, "Air rises to the highest-pressure point, the top of the condenser. The purge unit vents it while recovering entrained refrigerant.", "Type III: Low-Pressure", 1],
["Excessive purge-unit run time on a low-pressure chiller usually indicates:", ["An overcharge of refrigerant", "An air leak somewhere in the machine", "Chilled-water flow below design", "Normal operation for R-123 chillers"], 1, "Purge running constantly = air constantly entering = leak. Fix the leak, don't just let the purge eat refrigerant.", "Type III: Low-Pressure", 1],
["Why is refrigerant vapor charged into an evacuated chiller before any liquid?", ["Liquid cannot pass the evaporator charging valve", "Boiling liquid in the vacuum can freeze the tube water", "Vapor establishes the oil return path first", "Liquid charging would overload the purge unit"], 1, "Boiling liquid in a vacuum pulls tube temps below 32 F and freezes the water side: cracked tubes. Vapor first, always.", "Type III: Low-Pressure", 1],
["You should charge vapor into an evacuated chiller until:", ["Pressure reads exactly 0 psig on the gauge", "Pressure reaches a saturation temperature near 36 F", "The purge unit begins cycling automatically", "Half the nameplate charge has been added"], 1, "Raise pressure until the saturation temperature is safely above 32 F (about 36 F), then switch to liquid.", "Type III: Low-Pressure", 1],
["A centrifugal chiller is charged through the:", ["Evaporator charging valve", "High-side compressor service valve", "Condenser drain", "Purge unit connection"], 0, "The evaporator charging valve is the standard (lowest) charge point on a centrifugal machine.", "Type III: Low-Pressure", 1],
["During evacuation of a chiller, freezing of the water in the tubes is prevented by:", ["Adding glycol to the chilled-water loop", "Circulating water through the chiller tubes", "Pulling the vacuum as rapidly as possible", "Isolating and closing all chilled-water valves"], 1, "Moving water resists freezing and carries heat in. Alternative on a wet system: break the vacuum with nitrogen to raise pressure.", "Type III: Low-Pressure", 1],
["Before removing oil from a low-pressure system, the oil should be heated to about 130 F because:", ["Cold oil is too viscous for the drain pump", "Hot oil releases its dissolved refrigerant", "Heat separates acid from the oil before disposal", "The oil heater protects bearings during pump-down"], 1, "Refrigerant dissolves in cold oil. Heat it and the refrigerant boils out for recovery instead of leaving with the oil.", "Type III: Low-Pressure", 1],
["A hydrostatic tube test kit is used on a chiller to:", ["Verify the rupture disc's relief setting", "Determine whether a water tube leaks", "Measure moisture content in the refrigerant", "Pressure-test the purge unit's return line"], 1, "Suspected tube leak = hydrostatic tube test. Moisture collecting in the purge unit is the telltale symptom of leaking tubes.", "Type III: Low-Pressure", 1],
["Recovering refrigerant from small appliances or MVACs solely to prepare them for disposal requires what certification?", ["Type I minimum", "Universal", "No technician certification, but EPA-certified recovery equipment", "A state-approved disposal license"], 2, "The disposal exemption: recovery for disposal of small appliances/MVACs needs no tech certification, only certified equipment. Certification is required for maintenance, service, and repair.", "Type I: Small Appliance", 1],

const $=s=>document.getElementById(s);

try{const s=JSON.parse(localStorage.getItem(LS));if(Array.isArray(s)){while(s.length<MCQS.length)s.push({c:0,seen:false,lta:[],t:0,n:"",tg:false});const t=s.slice(0,MCQS.length);t.forEach(p=>{if(!Array.isArray(p.lta))p.lta=[];if(typeof p.t!=="number")p.t=(p.c>=2?1:(p.seen?2:0));if(typeof p.n!=="string")p.n="";if(typeof p.tg!=="boolean")p.tg=false});return t;}}catch(e){}return MCQS.map(()=>({c:0,seen:false,lta:[],t:0,n:"",tg:false}));}

function isMulti(i){return Array.isArray(MCQS[i][2])}

function rebuild(){queue=drillIdxs().filter(i=>state[i].c<2);if(queue.length){shuffle(queue);queue.sort((a,b)=>(state[a].seen?1:0)-(state[b].seen?1:0));}}

  curOpts=m[1].map((t,oi)=>({oi,text:t}));shuffle(curOpts);

  curOpts.forEach((o,d)=>{h+='<button class="ans" data-disp="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  h+='</div>';
  if(multi)h+='<button class="chk" id="chk" disabled>Check</button>';
  h+='<div class="explain" id="exp"></div><div class="cont" id="cont">tap or press space to continue</div>';
  $("stage").innerHTML=h;
  [...document.querySelectorAll("#opts .ans")].forEach(b=>b.onclick=()=>pick(+b.dataset.disp));

function pick(d){

  if(isMulti(cur)){

    if(picked.has(d)){picked.delete(d);b.classList.remove("sel")}else{picked.add(d);b.classList.add("sel")}

  if(ok)state[cur].c++;else state[cur].c=0;
  state[cur].lta=[ok?1:0].concat(state[cur].lta||[]).slice(0,4);
  if(ok)SND.ok(state[cur].c>=2);else SND.no();
  if(ok)GAME.ok(state[cur].c>=2);else GAME.no();
  save();
  hist.push({i:cur,opts:curOpts.slice(),ch:[...picked],ok:ok});if(hist.length>10)hist.shift();
  const e=$("exp");e.className="explain show "+(ok?"ok":"no");
  e.innerHTML="<b>"+(ok?"Correct.":"Not quite.")+"</b> "+esc(m[3])+((view!=="triage"&&state[cur].n)?"<br><i>note: "+esc(state[cur].n)+"</i>":"");
  if(view==="triage"){state[cur].t=ok?1:2;}
  // requeue
  else{
  queue.shift();
  if(ok&&state[cur].c>=2){/* retire */}
  else{const uns=queue.reduce((n,i)=>n+(state[i].seen?0:1),0);const off=ok?Math.min(uns+8,queue.length):Math.min(3,queue.length);queue.splice(off,0,cur)}
  }
  rings();drawPiles();
  if(ok){$("cont").classList.remove("show");setTimeout(()=>{if(waiting)next()},460)}
  else $("cont").classList.add("show");
}

function next(){if(!waiting)return;waiting=false;
  if(view==="triage"){const ni=$("noteIn");if(ni&&ni.value.trim()){state[cur].n=ni.value.trim();save()}tq.shift();renderTriage()}
  else render()}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

document.addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT"){if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();next()}return}
  if(view==="triage"&&!waiting){const k=(e.key||"").toLowerCase();if(k==="s"){e.preventDefault();triStar();return}if(k==="n"){e.preventDefault();triNo();return}}
  if(e.key==="ArrowLeft"){e.preventDefault();histNav(-1);return}
  if(e.key==="ArrowRight"){if(histPos>=0){e.preventDefault();histNav(1)}return}
  if(e.key===" "||e.key==="Enter"){if(histPos>=0){e.preventDefault();histNav(1);return}if(waiting){e.preventDefault();next()}return}
  const n="1234".indexOf(e.key),a="abcd".indexOf(e.key.toLowerCase());
  const d=n>=0?n:a;if(d>=0){const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');if(b)pick(d)}
});
$("stage").addEventListener("click",e=>{if(e.target.closest&&e.target.closest("input,.tbtn"))return;if(histPos>=0)return;if(waiting&&Date.now()-waitAt>250)next()});

// topic dropdown
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("topic").appendChild(o)});
$("topic").onchange=()=>{filter=$("topic").value;refresh()};
$("histBtn").onclick=e=>{e.preventDefault();e.stopPropagation();histNav(-1)};
$("reset").onclick=()=>{if(confirm("Wipe all drill progress?")){state=MCQS.map(()=>({c:0,seen:false,lta:[],t:0,n:"",tg:false}));save();refresh()}};

function setMode(m){mode=m;localStorage.setItem("epa608drill2_mode",m);$("mCore").classList.toggle("on",m==="core");$("mFull").classList.toggle("on",m==="full");refresh()}
$("mCore").onclick=()=>setMode("core");$("mFull").onclick=()=>setMode("full");
$("vTriage").onclick=()=>setView("triage");$("vDrill").onclick=()=>setView("drill");
view=localStorage.getItem("epa608drill2_view")||"";
setMode(mode);
if(!view)view=idxs().some(i=>state[i].t===0)?"triage":"drill";
setView(view);

document.addEventListener("click", function(e){
  var t=e.target;
  if(t.closest && t.closest("select,a,#themeBtn,.seg,.reset,input,.tbtn,.pchip")) return;
  if(histPos>=0){ histNav(1); return; }
  if(!waiting) return;
  if(Date.now()-waitAt<250) return;
  next();
});
</script>
<button id="themeBtn" class="themeb" aria-label="toggle theme">☾</button>
<script>
(function(){
  var K="drill_theme", btn=document.getElementById("themeBtn");
  var qp=null; try{qp=new URLSearchParams(location.search).get("theme");}catch(e){}
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  var t=qp||saved||"light";
  function apply(x){document.documentElement.setAttribute("data-theme",x);btn.textContent=x==="dark"?"\u2600":"\u263e";}
  apply(t);
  btn.addEventListener("click",function(){t=(t==="dark")?"light":"dark";try{localStorage.setItem(K,t)}catch(e){}apply(t);});
})();
</script>
