<style>
:root{
  --bg:#e9edf0; --panel:#ffffff; --ink:#1a2330; --muted:#5b6573;
  --line:#d4dae1; --teal:#159fc9; --green:#43a047; --red:#e23b3b;
  --shadow:0 1px 3px rgba(20,40,70,.10),0 6px 18px rgba(20,40,70,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:6px 2px 14px}
.h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
.h2{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500}
.reset{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);
  padding:5px 9px;border-radius:8px;background:var(--panel);white-space:nowrap;cursor:pointer}
@media(hover:hover){.reset:hover{color:var(--red);border-color:var(--red)}}
.stats{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:9px}
.ring svg{display:block}
.ring .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.ring .val{font-size:16px;font-weight:800;line-height:1}
.counts{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.5}
.counts b{color:var(--ink);font-weight:700}
.selwrap{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:2px}
select{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;
  box-shadow:var(--shadow)}
.qtopic{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);font-weight:800;margin-bottom:8px}
.q{font-size:17px;line-height:1.4;font-weight:650;margin-bottom:14px}
#opts{display:flex;flex-direction:column;gap:9px}
.ans{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
  font:inherit;font-size:15px;line-height:1.35;color:var(--ink);transition:border-color .12s,background .12s}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{flex:0 0 22px;height:22px;border-radius:6px;background:#eef2f6;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
.ans.correct{border-color:var(--green);background:#edf7ee}
.ans.correct .ltr{background:var(--green);color:#fff}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.wrong .ltr{background:var(--red);color:#fff}
.ans b{font-weight:800}
.ans.lock{cursor:default}
.explain{margin-top:13px;border-left:3px solid var(--teal);background:#f3f8fb;border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:13.5px;line-height:1.45;color:#2a3645;display:none}
.explain.show{display:block}
.cont{margin-top:11px;font-size:12px;color:var(--muted);text-align:center;display:none}
.cont.show{display:block}
.finish{display:none;text-align:center;padding:34px 18px}
.finish.done{display:block}
.finish .big{font-size:40px}
.finish h3{font-size:21px;margin:8px 0 4px}
.finish p{color:var(--muted);font-size:14px;margin:0 0 18px}
.btn{font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:10px;border:none;
  background:var(--teal);color:#fff;cursor:pointer}
@media(hover:hover){.btn:hover{filter:brightness(1.05)}}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f6;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;font-size:11px}
@media(max-width:480px){.q{font-size:16px}.ans{font-size:14px}}

*{-webkit-tap-highlight-color:transparent}

[data-theme="dark"]{--bg:#0f1318;--panel:#171e27;--ink:#e7edf4;--muted:#8b98a9;--line:#2a3441;--teal:#2cb5dd;--green:#4bc251;--red:#f0625f;--shadow:0 1px 3px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.3)}
[data-theme="dark"] .ans .ltr,[data-theme="dark"] .kbd{background:#232d3a}
[data-theme="dark"] .ans.correct{background:#16301b}
[data-theme="dark"] .ans.wrong{background:#38191c}
[data-theme="dark"] .explain{background:#14222b}
[data-theme="dark"] circle[stroke="#e7ecf1"]{stroke:#232d3a}
.ans:active{border-color:var(--teal)}

.themeb{position:fixed;right:14px;bottom:14px;z-index:60;width:38px;height:38px;border-radius:50%;
border:1px solid var(--line);background:var(--panel,var(--bg3,var(--bg2,#fff)));color:var(--ink);
font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);line-height:1;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="h1">EPA 608 Mastery Drill</div>
      <div class="h2">Core &middot; Type I &middot; Type II &middot; Type III &mdash; one at a time, requeued until mastered</div>
    </div>
    <a class="reset" id="resetBtn">reset</a>
  </header>

  <div class="stats">
    <div class="ring">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="#e7ecf1" stroke-width="6"/>
        <circle id="seenRing" cx="23" cy="23" r="19" fill="none" stroke="var(--teal)" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 23 23)" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
      </svg>
      <div><div class="lab">Seen</div><div class="val" id="seenVal" style="color:var(--teal)">0%</div></div>
    </div>
    <div class="ring">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="#e7ecf1" stroke-width="6"/>
        <circle id="aptRing" cx="23" cy="23" r="19" fill="none" stroke="var(--green)" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 23 23)" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
      </svg>
      <div><div class="lab">Aptitude</div><div class="val" id="aptVal" style="color:var(--green)">0%</div></div>
    </div>
    <div class="counts">
      <div><b id="mastN">0</b> mastered / <b id="totN">0</b></div>
      <div><b id="queueN">0</b> in queue</div>
    </div>
    <div class="selwrap">
      <span class="lab" style="font-size:11px;color:var(--muted);font-weight:700">Topic</span>
      <select id="topicSel"></select>
    </div>
  </div>

  <div class="card" id="card">
    <div class="qtopic" id="qtopic"></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="cont" id="cont">Tap or press <span class="kbd">space</span> to continue</div>
  </div>

  <div class="finish" id="finish">
    <div class="big">&#10003;</div>
    <h3>Pool mastered</h3>
    <p>Every question answered correctly twice. Go take it.</p>
    <button class="btn" id="againBtn">Study again</button>
  </div>
</div>

<script>
var MCQS = [["Which agency administers refrigerant-handling certification under Section 608?", ["EPA", "OSHA", "DOT", "DOE"], 0, "Section 608 of the Clean Air Act is administered and enforced by the EPA.", "Core: Regs & Ozone"], ["Section 608 certification is required to do what to stationary equipment?", ["Sell or transport refrigerant in bulk quantities", "Service, maintain, repair, or dispose of it", "Install ductwork and air-side components", "Design refrigerant piping for new construction"], 1, "608 cert is required for anyone who maintains, services, repairs, or disposes of equipment containing refrigerant.", "Core: Regs & Ozone"], ["How long is a Section 608 certification valid?", ["5 years, then an open-book retest", "10 years, with a refresher course", "It never expires or needs renewal", "Until covered refrigerants phase out"], 2, "608 certification is lifetime; no renewal or continuing-ed is required by the EPA.", "Core: Regs & Ozone"], ["To work on every type of stationary equipment, which certification do you need?", ["Type I", "Type II", "Type III", "Universal"], 3, "Universal covers all stationary refrigeration and AC equipment. It requires passing Core plus Type I, II, and III.", "Core: Regs & Ozone"], ["What is the minimum score to pass each section of the 608 exam?", ["60% (15 of 25)", "70% (18 of 25)", "80% (20 of 25)", "84% (21 of 25)"], 1, "Each section is 25 questions; you must answer 18 correctly (70%) to pass that section.", "Core: Regs & Ozone"], ["Motor vehicle air conditioners (MVACs) are certified under which section?", ["Section 608", "Section 609", "Section 610", "Section 611"], 1, "MVAC work falls under Section 609, not 608. 608 covers stationary equipment.", "Core: Regs & Ozone"], ["Knowingly venting which refrigerants is illegal?", ["CFCs and HCFCs only", "CFCs only, since HFCs contain no chlorine", "CFCs, HCFCs, and HFC substitutes", "Only refrigerants listed as Class I substances"], 2, "Venting is banned for CFCs/HCFCs (since 1992) and was extended to HFC substitutes (since 1995).", "Core: Regs & Ozone"], ["Which release does NOT violate the venting prohibition?", ["Releases during disposal of small appliances", "De minimis losses during good-faith recovery", "Releases within 30 days of a leak repair", "Releases under one pound per service call"], 1, "De minimis (minimal, unavoidable) releases during good-faith recovery/recycling are not violations.", "Core: Regs & Ozone"], ["Which class of refrigerant has the highest ozone depletion potential (ODP)?", ["CFCs", "HCFCs", "HFCs", "HCs"], 0, "CFCs (e.g., R-12) have the highest ODP. HCFCs are lower; HFCs have zero ODP.", "Core: Regs & Ozone"], ["HFC refrigerants like R-134a and R-410A have what ozone depletion potential?", ["The highest of any class", "Zero, they contain no chlorine", "About half that of CFCs", "Roughly equal to HCFCs"], 1, "HFCs contain no chlorine, so their ODP is zero. They are regulated instead for their GWP. HFCs have zero ODP (no chlorine) but real global warming potential, hence the AIM Act phasedown.", "Core: Regs & Ozone"], ["The Montreal Protocol is an international agreement to do what?", ["Set international refrigerant purity standards", "Phase out ozone-depleting substances", "License technicians across member countries", "Ban all synthetic refrigerants by 2030"], 1, "The Montreal Protocol commits nations to phasing out ozone-depleting substances like CFCs and HCFCs.", "Core: Regs & Ozone"], ["The AIM Act drives the phasedown of which refrigerants?", ["CFCs", "HCFCs", "HFCs", "Ammonia"], 2, "The AIM Act mandates an 85% phasedown of HFC production/consumption and pushes low-GWP (A2L) substitutes.", "Core: Regs & Ozone"], ["Complete phaseout of R-22 production and import took effect on what date?", ["January 1, 2010", "January 1, 2015", "January 1, 2020", "January 1, 2025"], 2, "Jan 1, 2010 banned R-22 in new equipment; Jan 1, 2020 banned all production/import. Only reclaimed/stockpiled R-22 remains.", "Core: Regs & Ozone"], ["Since January 1, 2018, refrigerant (including HFCs) may be sold only to whom?", ["Licensed HVAC contractors regardless of certification", "EPA-certified technicians or their employers", "Anyone 18 or older with a business license", "Certified techs for CFCs only, anyone for HFCs"], 1, "The sales restriction limits refrigerant purchases to 608/609-certified technicians.", "Core: Regs & Ozone"], ["The EPA's SNAP program identifies what?", ["Certified recovery equipment models", "Acceptable substitute refrigerants", "Approved refrigerant reclaimers", "Exempt small-appliance categories"], 1, "SNAP (Significant New Alternatives Policy) lists acceptable substitutes for ozone-depleting refrigerants.", "Core: Regs & Ozone"], ["Civil penalties for knowingly venting refrigerant can reach what level?", ["A flat $5,000 per incident", "Tens of thousands per day, per violation", "Up to $1,000 plus decertification", "Criminal charges only, no civil fines"], 1, "Fines run per day, per violation, in the tens of thousands. The figure has escalated over time ($25,000 to $37,500 to ~$44,539); pick the per-day, per-violation answer.", "Core: Regs & Ozone"], ["A2L refrigerants such as R-32 and R-454B are classified as what?", ["Non-flammable, higher toxicity", "Mildly flammable, lower toxicity", "Highly flammable, low toxicity", "Non-flammable, low toxicity"], 1, "A2L = lower toxicity (A), mildly flammable (2L). They are low-GWP replacements for R-410A.", "Core: Regs & Ozone"], ["Which is a flammable (A3) refrigerant?", ["R-410A", "R-22", "R-290", "R-123"], 2, "R-290 (propane) and R-600a (isobutane) are A3, highly flammable hydrocarbons used in some small appliances. R-290 is propane, an A3 highly flammable hydrocarbon.", "Core: Regs & Ozone"], ["What does 'recover' refrigerant mean?", ["Clean it on-site with filter-driers for reuse", "Remove it and store it in an external container", "Reprocess it to meet AHRI 700 purity", "Transfer it directly into another appliance"], 1, "Recover = remove refrigerant and store it externally, with no cleaning or testing.", "Core: Recover/Recycle/Reclaim"], ["What does 'recycle' refrigerant mean?", ["Remove and store it without any processing", "Clean it on-site with oil separation and filter-driers", "Reprocess it at a certified facility to AHRI 700", "Blend it with virgin refrigerant to restore purity"], 1, "Recycle = field cleaning (oil separation, moisture/acid removal via filter-driers) for reuse on equipment owned by the same person.", "Core: Recover/Recycle/Reclaim"], ["What does 'reclaim' refrigerant mean?", ["Clean it on-site for same-owner reuse", "Reprocess it to the AHRI 700 purity standard", "Remove and store it in an approved cylinder", "Distill it in the field until the sight glass clears"], 1, "Reclaim = reprocess to AHRI 700 (like-new) purity. It is the only path to legally change ownership of recovered refrigerant. Reclaiming to AHRI 700 is the only path to certifying refrigerant for resale.", "Core: Recover/Recycle/Reclaim"], ["Reclaimed refrigerant must be purified to meet which standard?", ["ASHRAE 34", "AHRI 700", "SAE J2843", "ISO 5149"], 1, "Reclaimed refrigerant must meet the AHRI 700 standard (about 99.5% purity).", "Core: Recover/Recycle/Reclaim"], ["Recovered refrigerant may be reused without reclaiming on what?", ["Any system containing the same refrigerant type", "Another system owned by the same person", "Systems serviced by the same technician", "Any system, if the refrigerant is filtered first"], 1, "Recovered/recycled refrigerant can go back to the same system or another owned by the same person. Changing ownership requires reclaiming.", "Core: Recover/Recycle/Reclaim"], ["Recovery equipment manufactured after November 15, 1993 must be what?", ["Registered with the DOT as a pressure vessel", "Certified by an EPA-approved testing organization", "Rebuilt and recalibrated every five years", "Rated to pull at least 25 mm Hg absolute"], 1, "Post-Nov-15-1993 recovery/recycling equipment must be third-party certified to meet EPA recovery efficiency standards.", "Core: Recover/Recycle/Reclaim"], ["Self-contained (active) recovery equipment is defined by what?", ["It relies on the appliance's own compressor", "It has its own compressor or pump", "It recovers vapor only, never liquid", "It is shop-installed rather than portable"], 1, "Active (self-contained) recovery units have their own compressor/pump. Passive (system-dependent) units rely on the appliance.", "Core: Recover/Recycle/Reclaim"], ["System-dependent (passive) recovery may be used only on appliances containing how much refrigerant?", ["Any amount", "15 pounds or less", "100 pounds or less", "200 pounds or more"], 1, "Passive recovery is limited to appliances with 15 lbs or less of refrigerant.", "Core: Recover/Recycle/Reclaim"], ["Before transferring recovered refrigerant into a recovery cylinder, you should do what?", ["Warm the cylinder to raise its pressure", "Evacuate the empty cylinder first", "Fill it with a nitrogen holding charge", "Chill the appliance to slow the transfer"], 1, "Always evacuate an empty recovery cylinder before charging it, to avoid non-condensables and contamination.", "Core: Recover/Recycle/Reclaim"], ["Which is prohibited when handling recovery cylinders?", ["Storing cylinders upright in a service van", "Mixing different refrigerants in one cylinder", "Reusing a cylinder for the same refrigerant", "Filling a recovery cylinder to 80% by weight"], 1, "Never mix refrigerant types in one recovery cylinder; mixed refrigerant cannot be reclaimed and must be destroyed.", "Core: Recover/Recycle/Reclaim"], ["Refrigerant/recovery cylinders must never be filled above what level?", ["60% of capacity by weight", "80% of capacity by weight", "90% of capacity by weight", "Whatever the pressure gauge allows"], 1, "Never exceed 80% fill by weight, leaving room for liquid expansion as temperature rises (prevents rupture).", "Core: Safety & Handling"], ["A standard refrigerant recovery cylinder is colored how?", ["Yellow body with a gray top", "Gray body with a yellow top", "Green body with a white top", "Gray body with a red top"], 1, "Recovery cylinders are gray with a yellow shoulder/top.", "Core: Safety & Handling"], ["DOT requires refillable refrigerant cylinders be hydrostatically retested how often?", ["Every year", "Every 5 years", "Every 10 years", "Never"], 1, "Refillable DOT cylinders must be hydrostatically tested and stamped every 5 years.", "Core: Safety & Handling"], ["Disposable (single-use) refrigerant cylinders are DOT-39 and must be what?", ["Refilled when empty", "Never refilled", "Hydro-tested yearly", "Painted gray"], 1, "DOT-39 disposable cylinders are non-refillable; refilling them is illegal and dangerous.", "Core: Safety & Handling"], ["The maximum recommended storage temperature for a refrigerant cylinder is about what?", ["80 F", "100 F", "125 F", "200 F"], 2, "Keep cylinders below 125 F. Heat raises internal pressure and risks rupture.", "Core: Safety & Handling"], ["The main danger of refrigerant leaking into a confined, poorly ventilated space is what?", ["Ignition of the refrigerant vapor", "Oxygen displacement and asphyxiation", "Frostbite from vapor contact", "Long-term neurological toxicity"], 1, "Most refrigerants are heavier than air, settle low, and displace oxygen, risking suffocation.", "Core: Safety & Handling"], ["Liquid refrigerant contacting skin or eyes can cause what?", ["Sunburn", "Frostbite", "Mild rash only", "Nothing"], 1, "Liquid refrigerant boils at low temperature and causes frostbite on contact. Wear gloves and eye protection.", "Core: Safety & Handling"], ["When refrigerant contacts an open flame or very high heat, it can break down into what?", ["Harmless carbon dioxide and water vapor", "Toxic acid gases (hydrofluoric, hydrochloric)", "Pure chlorine gas only", "Flammable hydrogen and methane"], 1, "Heat decomposes refrigerant into toxic/corrosive byproducts (phosgene, hydrofluoric/hydrochloric acid). Ventilate and avoid open flame.", "Core: Safety & Handling"], ["To pressure-test a system for leaks, you should use what?", ["Compressed shop air", "Dry nitrogen", "CO2 from a welding cylinder", "Refrigerant vapor at full cylinder pressure"], 1, "Use dry nitrogen. Add a trace of refrigerant only if needed for an electronic detector. Never use oxygen or acetylene. Add a trace of refrigerant only if sniffing with an electronic detector.", "Core: Safety & Handling"], ["Why must you never pressurize a system with oxygen?", ["It contaminates the system with moisture", "It can explode on contact with compressor oil", "It corrodes aluminum evaporator coils", "It gives false readings on leak detectors"], 1, "Oxygen reacting with compressor oil under pressure can cause a violent explosion.", "Core: Safety & Handling"], ["A halide torch leak detector changes flame color in the presence of what?", ["All refrigerants including HFCs", "Chlorinated refrigerants (CFCs and HCFCs)", "Hydrocarbons such as propane only", "Any gas heavier than air"], 1, "A halide torch turns the flame green/blue when chlorine is present, so it works on CFCs/HCFCs but not chlorine-free HFCs.", "Core: Safety & Handling"], ["Non-condensables (air) trapped in a system cause what symptom?", ["Low suction pressure", "High head pressure", "High superheat at the evaporator outlet", "Short-cycling on the low-pressure switch"], 1, "Air will not condense, so it raises discharge/head pressure above the P-T chart value for the ambient.", "Core: Safety & Handling"], ["A strong acrid odor while recovering refrigerant usually indicates what?", ["An overcharged system", "Compressor burnout acids", "Non-condensables in the condenser", "Moisture freezing at the metering device"], 1, "Acrid odor signals a burnout. Recover, then install a suction-line filter-drier and change the oil to remove acid.", "Core: Safety & Handling"], ["It is a violation to change compressor oil at a pressure higher than what?", ["0 psig", "5 psig", "15 psig", "50 psig"], 1, "Reduce system pressure to no more than 5 psig before removing oil so dissolved refrigerant in the oil is recovered.", "Core: Safety & Handling"], ["You should never energize a hermetic compressor motor under what condition?", ["Full charge", "A deep vacuum", "Normal pressure", "With gauges attached"], 1, "Energizing windings under deep vacuum can arc and damage the motor. Never run a compressor in a vacuum.", "Core: Safety & Handling"], ["Pulling a vacuum too quickly on a wet system can do what?", ["Boil the oil out of the compressor", "Freeze the moisture into ice, trapping it", "Collapse the evaporator tubing", "Overheat the vacuum pump motor"], 1, "Rapid pressure drop can freeze water into ice. Slow down or introduce nitrogen to keep moisture in vapor form.", "Core: Safety & Handling"], ["As the pressure of a refrigerant increases, its saturation (boiling) temperature does what?", ["Decreases", "Increases", "Stays the same", "Becomes zero"], 1, "Higher pressure raises the saturation temperature. This pressure-temperature relationship is the basis of the P-T chart.", "Core: Refrigerants & Cylinders"], ["A pressure-temperature (P-T) chart is used to do what?", ["Convert gauge pressure to absolute pressure", "Find saturation temperature for a given pressure", "Determine the correct oil charge", "Size the liquid line for a given tonnage"], 1, "A P-T chart relates a refrigerant's pressure to its saturation temperature, used to set superheat and subcooling.", "Core: Refrigerants & Cylinders"], ["Superheat is best described as what?", ["Liquid cooled below its saturation temperature", "Vapor heated above its saturation temperature", "The temperature rise across the compressor", "The condenser-to-evaporator temperature split"], 1, "Superheat is how many degrees the vapor is above saturation, measured at the evaporator outlet/suction line.", "Core: Refrigerants & Cylinders"], ["Subcooling is best described as what?", ["Vapor heated above its saturation temperature", "Liquid cooled below its saturation temperature", "The temperature drop across the metering device", "The evaporator outlet temperature at design load"], 1, "Subcooling is how many degrees the liquid is below saturation, measured at the condenser outlet/liquid line.", "Core: Refrigerants & Cylinders"], ["A filter-drier is installed in a system to do what?", ["Separate oil from the refrigerant", "Remove moisture and acid", "Regulate liquid-line pressure", "Trap non-condensables"], 1, "The filter-drier removes moisture, acid, and particulate. A suction-line drier is added after a burnout.", "Core: Refrigerants & Cylinders"], ["Which pressure class does R-410A fall into?", ["Low-pressure", "Medium-pressure", "High-pressure", "Not a refrigerant"], 2, "R-410A is a high-pressure (Type II) refrigerant; it operates at notably higher pressures than R-22.", "Core: Refrigerants & Cylinders"], ["A2L refrigerants commonly replacing R-410A in new equipment include which?", ["R-12 and R-22", "R-32 and R-454B", "R-11 and R-123", "R-502 and R-13"], 1, "R-32 and R-454B are the primary low-GWP A2L replacements for R-410A in new residential/light-commercial systems.", "Core: Refrigerants & Cylinders"], ["A 'small appliance' is one factory-manufactured, charged, and hermetically sealed with how much refrigerant?", ["5 pounds or less", "15 pounds or less", "50 pounds or less", "Any amount"], 0, "A small appliance is factory-sealed with 5 lbs or less of refrigerant.", "Type I: Small Appliance"], ["Which of these is a small appliance?", ["A residential central AC charged with 4 lbs", "A household refrigerator or window AC", "A packaged rooftop unit under 5 tons", "A water-cooled chiller with a 5-lb charge"], 1, "Household refrigerators, window ACs, PTACs, dehumidifiers, vending machines, and water coolers are small appliances. Field-charged central systems fail the factory-sealed test regardless of charge size.", "Type I: Small Appliance"], ["Using self-contained recovery equipment on a small appliance with an OPERATING compressor, you must recover what?", ["80% of the refrigerant", "90% of the refrigerant", "100% of the refrigerant", "50% of the refrigerant"], 1, "Compressor working: recover 90%. Compressor not working: recover 80%.", "Type I: Small Appliance"], ["With a NON-operating compressor (post-1993 self-contained equipment), the small-appliance recovery requirement is what?", ["90%", "80%", "70%", "60%"], 1, "If the compressor is not functional, you must recover at least 80% of the charge.", "Type I: Small Appliance"], ["Recovery requirements for a small appliance can alternatively be met by evacuating it to what vacuum?", ["1 inch Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 1, "Evacuating a small appliance to 4 inches of mercury vacuum satisfies the recovery rule.", "Type I: Small Appliance"], ["Does the EPA require leak repair on small appliances?", ["Yes, within 30 days of discovery", "No, small appliances are exempt", "Yes, when the leak rate exceeds 10%", "Only when the charge exceeds one pound"], 1, "Leak repair rules do not apply to small appliances, though good practice is to fix leaks anyway. Repair anyway when practical to conserve refrigerant, but the rules start at 50 lbs.", "Type I: Small Appliance"], ["The final person in the disposal chain of a small appliance (e.g., scrap recycler) must do what?", ["Notify the EPA before crushing the appliance", "Recover the refrigerant or verify prior recovery", "Remove the compressor and drain the oil", "Hold the appliance 30 days before destruction"], 1, "The last disposer must ensure and document that refrigerant was recovered before final disposal.", "Type I: Small Appliance"], ["Isobutane (R-600a) is approved as a substitute for use in what?", ["Retrofits of existing R-134a refrigerators", "New household refrigerators and freezers", "Commercial walk-in coolers of any size", "Automotive air conditioning systems"], 1, "R-600a is approved for NEW household refrigerators/freezers, not as a retrofit into existing small appliances.", "Type I: Small Appliance"], ["Low-loss fittings on recovery hoses are required to do what?", ["Prevent oil migrating into the recovery unit", "Minimize release at connect and disconnect", "Maintain deep vacuum during long recoveries", "Keep moisture out of the recovery cylinder"], 1, "Low-loss fittings close manually or automatically to limit refrigerant loss at the hose connections.", "Type I: Small Appliance"], ["Type II certification covers which appliances?", ["Low-pressure centrifugal chillers", "High-pressure and very-high-pressure appliances", "Factory-sealed appliances under 5 lbs", "Motor vehicle air conditioning systems"], 1, "Type II = high-pressure systems: most residential/commercial split systems, rooftop units, and commercial refrigeration.", "Type II: High-Pressure"], ["Using post-Nov-15-1993 equipment, a high-pressure appliance with LESS than 200 lbs must be evacuated to what?", ["0 in Hg", "4 in Hg", "10 in Hg", "15 in Hg"], 0, "Current EPA table: high-pressure under 200 lbs = 0 inches Hg. Note: some older exam versions list 10 inches Hg for this; if 0 is not offered, pick 10.", "Type II: High-Pressure"], ["Using post-1993 equipment, a high-pressure appliance with 200 lbs OR MORE must be evacuated to what?", ["0 inches Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 2, "High-pressure, 200 lbs or more: 10 inches Hg vacuum.", "Type II: High-Pressure"], ["Using post-1993 equipment, a medium-pressure appliance with LESS than 200 lbs is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 1, "Medium-pressure under 200 lbs: 10 inches Hg vacuum.", "Type II: High-Pressure"], ["Using post-1993 equipment, a medium-pressure appliance with 200 lbs OR MORE is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 2, "Medium-pressure 200 lbs or more: 15 inches Hg vacuum.", "Type II: High-Pressure"], ["A very high-pressure appliance must be evacuated to what level?", ["0 in Hg (0 psig)", "10 in Hg vacuum", "15 in Hg vacuum", "25 mm Hg absolute"], 0, "Very high-pressure equipment is evacuated to 0 inches Hg (0 psig). Pulling a deep vacuum risks damage.", "Type II: High-Pressure"], ["Mandatory leak-repair rules apply only to systems containing how much refrigerant?", ["5 lbs or more", "15 lbs or more", "50 lbs or more", "200 lbs or more"], 2, "Leak-repair thresholds apply at 50 lbs for ODS systems; the AIM Act lowered it to 15 lbs for high-GWP HFCs effective Jan 2026. 15 lbs is the new tier for high-GWP HFCs under the 2026 rules; 50 lbs is the classic answer.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for a comfort-cooling system?", ["5%", "10%", "20%", "35%"], 1, "Comfort cooling = 10% per year (current 2019-revision rule). Older exam versions used 15%.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for a commercial refrigeration system?", ["10%", "20%", "30%", "35%"], 1, "Commercial refrigeration = 20% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for an industrial process refrigeration system?", ["10%", "20%", "30%", "50%"], 2, "Industrial process refrigeration = 30% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure"], ["Once a leak exceeds the applicable threshold, repair must be completed within how long?", ["24 hours", "7 days", "30 days", "1 year"], 2, "Repair (and verification) must be completed within 30 days, or a retrofit/retirement plan must be filed.", "Type II: High-Pressure"], ["Annual leak rate is calculated how?", ["Pounds added per year over pounds recovered", "Pounds added per year over the full charge", "Charge lost since install over system age", "Pounds added per visit over the charge"], 1, "Annual leak rate = (refrigerant added over 12 months / full charge) x 100.", "Type II: High-Pressure"], ["Owners of systems over 50 lbs must keep servicing records of what?", ["Certification numbers of all technicians used", "Amount and type of refrigerant added or removed", "Monthly pressure and temperature logs", "Purchase receipts for replacement parts"], 1, "Records of refrigerant added and removed must be kept (commonly retained for 3 years) for large systems.", "Type II: High-Pressure"], ["When charging a high-pressure system, liquid refrigerant should be added where?", ["Directly into the suction line at full flow", "Into the liquid line on the high side", "Into the crankcase through the oil port", "Into the low side with the compressor off"], 1, "Charge liquid into the high side with the unit off; if adding to the low side of a running unit, throttle to vapor to avoid slugging.", "Type II: High-Pressure"], ["The deep-vacuum (dehydration) target before charging a system is about what?", ["29 inches Hg only", "500 microns", "5 psig", "10 inches Hg"], 1, "Pull the system down to roughly 500 microns and confirm it holds before charging.", "Type II: High-Pressure"], ["After reaching the target vacuum, you should do what?", ["Break the vacuum with refrigerant immediately", "Isolate the pump and watch for pressure rise", "Run the pump another hour as a margin", "Open the service valves to equalize"], 1, "Valve off the pump and watch the micron gauge; a rising pressure means remaining moisture or a leak. A rise that levels off = moisture still boiling; a steady climb = leak.", "Type II: High-Pressure"], ["Type III certification covers which appliances?", ["High-pressure split systems and heat pumps", "Low-pressure appliances such as centrifugal chillers", "Factory-sealed appliances holding 5 lbs or less", "Very-high-pressure CO2 systems"], 1, "Type III = low-pressure systems, typically centrifugal chillers using R-11, R-113, or R-123.", "Type III: Low-Pressure"], ["A low-pressure refrigerant has a boiling point at atmospheric pressure of what?", ["Below -50 F", "Above 50 F", "Between 0 and 32 F", "Exactly 32 F at sea level"], 1, "Low-pressure refrigerants boil above 10 C (50 F) at atmospheric pressure, so the system runs in a vacuum.", "Type III: Low-Pressure"], ["Using post-1993 equipment, a low-pressure appliance must be evacuated to what?", ["25 in Hg vacuum", "10 in Hg vacuum", "25 mm Hg absolute", "0 psig"], 2, "Low-pressure equipment must be evacuated to 25 mm Hg absolute.", "Type III: Low-Pressure"], ["The low side of a low-pressure chiller normally operates at what?", ["Well above atmospheric pressure", "In a vacuum (below atmospheric)", "Exactly atmospheric", "At 410 psig"], 1, "Low-pressure systems run in a vacuum on the low side, which is why air/moisture tends to leak in.", "Type III: Low-Pressure"], ["A purge unit on a low-pressure chiller removes what?", ["Excess oil returning from the evaporator", "Air and other non-condensables", "Refrigerant vapor for storage during service", "Scale and sludge from the water tubes"], 1, "Because the system runs in a vacuum, air leaks in; the purge unit removes those non-condensables.", "Type III: Low-Pressure"], ["When leak-testing a low-pressure appliance, you must NOT pressurize it above what?", ["10 psig", "30 psig", "50 psig", "150 psig"], 0, "Low-pressure shells are not built for high pressure; do not pressurize above 10 psig for leak testing.", "Type III: Low-Pressure"], ["A rupture disc on a low-pressure chiller is typically set to relieve at about what pressure?", ["5 psig", "15 psig", "150 psig", "500 psig"], 1, "Low-pressure chiller rupture discs commonly relieve around 15 psig to protect the low-pressure shell.", "Type III: Low-Pressure"], ["Recovery from a low-pressure chiller is slow and is often aided by what?", ["Chilling the evaporator to condense vapor", "Warming the refrigerant to raise its pressure", "Venting non-condensables to speed transfer", "Adding nitrogen to push liquid across"], 1, "High-boiling low-pressure refrigerant recovers slowly; warming the liquid and pulling pressure down speeds removal.", "Type III: Low-Pressure"], ["Where is the ozone layer that Section 608 aims to protect located?", ["In the stratosphere", "At ground level", "In the troposphere", "Inside cloud formations"], 0, "Stratospheric ozone absorbs harmful UV radiation. Ground-level ozone is smog, a different problem.", "Core: Regs & Ozone"], ["Why is stratospheric ozone depletion harmful?", ["Ground-level smog concentrations increase", "More ultraviolet radiation reaches the surface", "Global average temperatures rise sharply", "Acid rain becomes more frequent and severe"], 1, "Less ozone = more UV at the surface = skin cancer, cataracts, crop damage. That's the whole point of the CFC phaseout.", "Core: Regs & Ozone"], ["What actually destroys ozone molecules when a CFC reaches the stratosphere?", ["The fluorine atom freed by UV radiation", "The chlorine atom freed by UV radiation", "The carbon backbone reacting with ozone", "Water vapor carried up with the refrigerant"], 1, "UV cracks the CFC, freeing chlorine. One chlorine atom destroys ozone molecules over and over. Chlorine content is why CFC > HCFC > HFC in ODP.", "Core: Regs & Ozone"], ["R-22 belongs to which refrigerant class?", ["CFC", "HFC", "HCFC", "Natural refrigerant"], 2, "R-22 = HCFC (some chlorine, lower ODP than CFCs). R-12 = CFC. R-134a/R-410A = HFC (no chlorine).", "Core: Regs & Ozone"], ["Can an uncertified apprentice handle refrigerant?", ["Yes, after registering with the EPA as an apprentice", "Yes, under direct supervision of a certified tech", "Only on small appliances holding under 5 lbs", "No, certification is required before any handling"], 1, "The apprentice exemption: allowed while closely and continually supervised by a certified tech.", "Core: Regs & Ozone"], ["400-series blends like R-410A and R-407C are which type of blend?", ["Azeotropic", "Zeotropic", "Single-compound refrigerants", "Inorganic refrigerants"], 1, "400-series = ZEOtropic: components boil at different temps, so the blend has glide and can fractionate. 500-series = azeotropic, acts like one refrigerant. Zeotropic 400s have temperature glide and can fractionate. Azeotropic 500s act as one compound.", "Core: Refrigerants & Cylinders"], ["Why must zeotropic blends be charged as a liquid?", ["Liquid charging prevents compressor slugging", "Vapor charging fractionates the blend", "Vapor charging overheats the recovery cylinder", "Liquid charging keeps superheat within range"], 1, "Pull vapor off a zeotrope and the lighter component leaves first: the blend left behind is off-spec. Charge liquid to keep the recipe intact. Pulling vapor takes the lighter component first, leaving an off-spec blend behind.", "Core: Refrigerants & Cylinders"], ["What is temperature glide?", ["The high-side to low-side temperature difference", "A blend's evaporating temperature range at one pressure", "The saturation temperature change per psi", "The temperature drop across the metering device"], 1, "Zeotropic blends don't boil at one temperature; they slide across a range. Single compounds and azeotropes have no glide.", "Core: Refrigerants & Cylinders"], ["Can a vacuum pump alone be used to recover refrigerant from a small appliance?", ["Yes, if it pulls at least 4 in Hg on the appliance", "No, its exhaust vents refrigerant to the room", "Yes, if the exhaust runs through a filter-drier", "Only on appliances built before November 1993"], 1, "A vacuum pump just moves refrigerant into the room. Recovery requires certified recovery equipment that captures it.", "Type I: Small Appliance"], ["During system-dependent (passive) recovery, chilling the recovery cylinder in ice does what?", ["Prevents the cylinder from exceeding 80% fill", "Lowers the cylinder's pressure to speed migration", "Condenses moisture out of the refrigerant", "Keeps the cylinder below its 125 F storage limit"], 1, "Cold cylinder = low pressure = pressure difference pulls refrigerant in. Classic passive-recovery speed trick.", "Type I: Small Appliance"], ["What should be done with a solderless piercing-type access valve after service?", ["Leave it installed for future service access", "Replace it with a permanent leak-tight fitting", "Torque it to spec and leak-check it annually", "Back-seat it and cap it with a brass flare cap"], 1, "Clamp-on piercing valves leak with age. Don't leave them on the appliance as permanent fittings. Clamp-on piercing valves leak over time; they are not permanent fittings.", "Type I: Small Appliance"], ["When recovering from a small appliance with a non-operating compressor using passive recovery, you should:", ["Recover from the high side only, then vacuum", "Heat and tap the compressor; access both sides", "Replace the compressor before recovering", "Chill the compressor to condense the refrigerant"], 1, "Non-running compressor traps refrigerant in the oil. Heating/tapping frees it; accessing both sides speeds migration.", "Type I: Small Appliance"], ["When working on an R-600a (isobutane) appliance, which precaution applies?", ["Wear supplied-air respiratory protection", "Eliminate ignition sources; use spark-proof tools", "Ground the appliance chassis before opening", "Recover into a glass-lined cylinder only"], 1, "R-600a is A3, highly flammable. Small charge sizes keep it legal in fridges, but sparks near a leak are the hazard.", "Type I: Small Appliance"], ["Refrigerant recovered from a small appliance that will be sold to another owner must first be:", ["Reclaimed to AHRI 700 purity by a certified reclaimer", "Recycled on-site with any machine", "Filtered through a drier once", "Nothing, recovered refrigerant can always be resold"], 0, "Change of ownership = reclaim to AHRI 700. Reuse without reclaiming is only allowed back into the same owner's equipment.", "Type I: Small Appliance"], ["A high-pressure system has leaks so bad it cannot reach the required recovery vacuum. Before repair you should evacuate it to:", ["0 psig (atmospheric pressure)", "10 in Hg vacuum anyway", "25 mm Hg absolute", "No evacuation is required"], 0, "Leaky-system exception: pulling a vacuum would just suck air in through the leak. Take it to 0 psig, repair, then finish the job.", "Type II: High-Pressure"], ["Which gas should flow through tubing while brazing on an opened system?", ["Dry nitrogen", "Oxygen", "Compressed air", "Refrigerant vapor"], 0, "A nitrogen sweep prevents oxidation scale inside the tubing. Never oxygen or air (explosion risk with oil).", "Type II: High-Pressure"], ["To speed recovery from a large high-pressure system, you should remove:", ["Vapor first, then the remaining liquid", "Liquid first, then the remaining vapor", "Vapor only; liquid stays for disposal", "Oil first, then liquid and vapor together"], 1, "Liquid moves pounds fast; vapor recovery is slow. Pull liquid first, finish with vapor.", "Type II: High-Pressure"], ["An open (non-hermetic) compressor that has sat unused for months is most likely to leak from the:", ["Shaft seal", "Discharge valve", "Oil plug", "Terminal box"], 0, "The rotating shaft seal dries out when idle. Classic exam answer for open-drive compressors.", "Type II: High-Pressure"], ["Under the leak-repair rules, appliances that have exceeded the leak threshold are subject to:", ["Mandatory retirement within five years", "Periodic follow-up leak inspections", "Monthly refrigerant purity sampling", "A permanent ban on adding refrigerant"], 1, "Post-2019 rules add follow-up inspections once an appliance over 50 lbs trips its threshold. Annual for comfort cooling; quarterly for 500+ lb commercial and industrial process.", "Type II: High-Pressure"], ["Refrigerant should be charged into a high-pressure system as vapor through the:", ["Low side", "High side", "Oil fill port", "Purge unit"], 0, "Vapor charges through the low side; liquid through the high side (liquid line). Reversing either can slug the compressor.", "Type II: High-Pressure"], ["Which refrigerants are used in low-pressure (Type III) chillers?", ["R-11 and R-123", "R-22 and R-410A", "R-134a and R-404A", "R-290 and R-600a"], 0, "R-11 (CFC, phased out) and its replacement R-123 (HCFC). Both boil above room temperature at atmospheric pressure.", "Type III: Low-Pressure"], ["Because a low-pressure chiller operates in a vacuum, a leak causes:", ["Air to leak INTO the system", "Refrigerant to spray out under pressure", "Immediate compressor failure", "Oil loss only"], 0, "Below atmospheric pressure, leaks run backward: air and moisture get pulled in. That's why purge units exist.", "Type III: Low-Pressure"], ["Where do air and non-condensables collect in a low-pressure chiller, and what removes them?", ["At the top of the condenser; the purge unit removes them", "In the evaporator; the filter-drier removes them", "In the oil sump; the oil heater removes them", "In the cooling tower; the fan removes them"], 0, "Air rises to the highest-pressure point, the top of the condenser. The purge unit vents it while recovering entrained refrigerant.", "Type III: Low-Pressure"], ["Excessive purge-unit run time on a low-pressure chiller usually indicates:", ["An overcharge of refrigerant", "An air leak somewhere in the machine", "Chilled-water flow below design", "Normal operation for R-123 chillers"], 1, "Purge running constantly = air constantly entering = leak. Fix the leak, don't just let the purge eat refrigerant.", "Type III: Low-Pressure"], ["Why is refrigerant vapor charged into an evacuated chiller before any liquid?", ["Liquid cannot pass the evaporator charging valve", "Boiling liquid in the vacuum can freeze the tube water", "Vapor establishes the oil return path first", "Liquid charging would overload the purge unit"], 1, "Boiling liquid in a vacuum pulls tube temps below 32 F and freezes the water side: cracked tubes. Vapor first, always.", "Type III: Low-Pressure"], ["You should charge vapor into an evacuated chiller until:", ["Pressure reads exactly 0 psig on the gauge", "Pressure reaches a saturation temperature near 36 F", "The purge unit begins cycling automatically", "Half the nameplate charge has been added"], 1, "Raise pressure until the saturation temperature is safely above 32 F (about 36 F), then switch to liquid.", "Type III: Low-Pressure"], ["A centrifugal chiller is charged through the:", ["Evaporator charging valve", "High-side compressor service valve", "Condenser drain", "Purge unit connection"], 0, "The evaporator charging valve is the standard (lowest) charge point on a centrifugal machine.", "Type III: Low-Pressure"], ["During evacuation of a chiller, freezing of the water in the tubes is prevented by:", ["Adding glycol to the chilled-water loop", "Circulating water through the chiller tubes", "Pulling the vacuum as rapidly as possible", "Isolating and closing all chilled-water valves"], 1, "Moving water resists freezing and carries heat in. Alternative on a wet system: break the vacuum with nitrogen to raise pressure.", "Type III: Low-Pressure"], ["Before removing oil from a low-pressure system, the oil should be heated to about 130 F because:", ["Cold oil is too viscous for the drain pump", "Hot oil releases its dissolved refrigerant", "Heat separates acid from the oil before disposal", "The oil heater protects bearings during pump-down"], 1, "Refrigerant dissolves in cold oil. Heat it and the refrigerant boils out for recovery instead of leaving with the oil.", "Type III: Low-Pressure"], ["A hydrostatic tube test kit is used on a chiller to:", ["Verify the rupture disc's relief setting", "Determine whether a water tube leaks", "Measure moisture content in the refrigerant", "Pressure-test the purge unit's return line"], 1, "Suspected tube leak = hydrostatic tube test. Moisture collecting in the purge unit is the telltale symptom of leaking tubes.", "Type III: Low-Pressure"]];
var LS_KEY = "epa608drill_v1";
var C = 2 * Math.PI * 19; // ring circumference ~119.38

var prog = {};
function load(){ try{ prog = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ prog = {}; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(prog)); }catch(e){} }
function P(i){ if(!prog[i]) prog[i] = {c:0, seen:false, hist:[]}; return prog[i]; }

var activeTopic = "All";
var pool = [];
var queue = [];
var cur = -1;
var curOpts = [];
var waiting = false;
var lastCorrect = false;
var advTimer = null;

function shuffle(a){ for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; } return a; }

function distinctTopics(){ var s=[]; for(var i=0;i<MCQS.length;i++){ if(s.indexOf(MCQS[i][4])<0) s.push(MCQS[i][4]); } return s; }
function buildPool(){ pool=[]; for(var i=0;i<MCQS.length;i++){ if(activeTopic==="All"||MCQS[i][4]===activeTopic) pool.push(i); } }
function buildQueue(){ queue = pool.filter(function(i){ return P(i).c < 2; }); shuffle(queue); }

function seenPct(){ var n=0; for(var k=0;k<pool.length;k++){ if(P(pool[k]).seen) n++; } return pool.length? n/pool.length*100 : 0; }
function aptPct(){ var s=0; for(var k=0;k<pool.length;k++){ s += Math.min(P(pool[k]).c,2)/2; } return pool.length? s/pool.length*100 : 0; }
function masteredCount(){ var n=0; for(var k=0;k<pool.length;k++){ if(P(pool[k]).c>=2) n++; } return n; }

function setRing(id, pct){ var el=document.getElementById(id); if(el) el.setAttribute("stroke-dashoffset", (C*(1-pct/100)).toFixed(2)); }
function rings(){
  var sp=seenPct(), ap=aptPct();
  setRing("seenRing", sp); setRing("aptRing", ap);
  document.getElementById("seenVal").textContent = Math.round(sp)+"%";
  document.getElementById("aptVal").textContent = Math.round(ap)+"%";
  document.getElementById("mastN").textContent = masteredCount();
  document.getElementById("totN").textContent = pool.length;
  document.getElementById("queueN").textContent = queue.length;
}

var LETTERS = ["A","B","C","D","E","F"];

function uniqueWords(correctText, allTexts){
  var clean=function(s){ return s.toLowerCase().replace(/[^a-z0-9%. ]/g,"").split(/\s+/).filter(Boolean); };
  var others={}; for(var i=0;i<allTexts.length;i++){ if(allTexts[i]===correctText) continue; clean(allTexts[i]).forEach(function(w){ others[w]=1; }); }
  var set={}; clean(correctText).forEach(function(w){ if(!others[w] && w.length>2) set[w]=1; }); return set;
}
function boldUnique(text, uniq){
  return text.split(/(\s+)/).map(function(tok){
    var key=tok.toLowerCase().replace(/[^a-z0-9%.]/g,"");
    return (key && uniq[key]) ? "<b>"+tok+"</b>" : tok;
  }).join("");
}

function render(){
  if(queue.length===0){ finish(); return; }
  document.getElementById("finish").classList.remove("done");
  document.getElementById("card").style.display="block";
  cur = queue[0];
  var m = MCQS[cur];
  curOpts = m[1].map(function(t,oi){ return {oi:oi, text:t}; });
  shuffle(curOpts);
  waiting=false;
  document.getElementById("qtopic").textContent = m[4];
  document.getElementById("q").textContent = m[0];
  var box=document.getElementById("opts"); box.innerHTML="";
  for(var d=0; d<curOpts.length; d++){
    var b=document.createElement("button");
    b.className="ans"; b.dataset.disp=d; b.setAttribute("data-disp", d);
    b.innerHTML='<span class="ltr">'+LETTERS[d]+'</span><span class="txt">'+
       curOpts[d].text.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>';
    (function(dd){ b.addEventListener("click", function(){ pick(dd); }); })(d);
    box.appendChild(b);
  }
  document.getElementById("explain").classList.remove("show");
  document.getElementById("cont").classList.remove("show");
  rings();
}

var waitAt=0;
function pick(disp){
  if(waiting) return;
  var m = MCQS[cur];
  var chosen = curOpts[disp].oi;
  lastCorrect = (chosen === m[2]);
  var p = P(cur); p.seen=true;
  p.c = lastCorrect ? (p.c+1) : 0;
  p.hist.push(lastCorrect?1:0);
  save();
  waiting=true; waitAt=Date.now();

  var btns = document.querySelectorAll("#opts .ans");
  var uniq = uniqueWords(m[1][m[2]], m[1]);
  for(var i=0;i<btns.length;i++){
    btns[i].classList.add("lock");
    var oi = curOpts[i].oi;
    var txtSpan = btns[i].querySelector(".txt");
    if(oi === m[2]){
      btns[i].classList.add("correct");
      txtSpan.innerHTML = boldUnique(curOpts[i].text.replace(/&/g,"&amp;").replace(/</g,"&lt;"), uniq);
    } else if(i===disp){
      btns[i].classList.add("wrong");
    }
  }
  rings();
  if(lastCorrect){
    advTimer = setTimeout(next, 420);
  } else {
    var ex=document.getElementById("explain"); ex.textContent=m[3]; ex.classList.add("show");
    document.getElementById("cont").classList.add("show");
  }
}

function next(){
  if(!waiting) return;
  waiting=false;
  if(advTimer){ clearTimeout(advTimer); advTimer=null; }
  var idx = cur;
  queue.shift();
  var p = P(idx);
  if(lastCorrect && p.c>=2){
    // mastered -> retire
  } else if(lastCorrect){
    var pos = Math.min(10, queue.length);
    queue.splice(pos,0,idx);
  } else {
    var pos2 = Math.min(3, queue.length);
    queue.splice(pos2,0,idx);
  }
  render();
}

function finish(){
  cur=-1;
  document.getElementById("card").style.display="none";
  document.getElementById("finish").classList.add("done");
  rings();
}

document.addEventListener("keydown", function(e){
  if(waiting){
    if(e.key===" "||e.key==="Enter"||e.key==="Spacebar"){ e.preventDefault(); next(); }
    return;
  }
  var map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  var k=(e.key||"").toLowerCase();
  if(k in map && map[k] < curOpts.length){ e.preventDefault(); pick(map[k]); }
});

function buildTopicSel(){
  var sel=document.getElementById("topicSel"); sel.innerHTML="";
  var opts=["All"].concat(distinctTopics());
  for(var i=0;i<opts.length;i++){ var o=document.createElement("option"); o.value=opts[i]; o.textContent=opts[i]; sel.appendChild(o); }
  sel.value=activeTopic;
  sel.addEventListener("change", function(){ activeTopic=sel.value; buildPool(); buildQueue(); render(); });
}

document.getElementById("resetBtn").addEventListener("click", function(){
  if(!confirm("Wipe all drill progress?")) return;
  prog={}; try{ localStorage.removeItem(LS_KEY); }catch(e){}
  buildPool(); buildQueue(); render();
});
document.getElementById("againBtn").addEventListener("click", function(){
  for(var k=0;k<pool.length;k++){ var p=P(pool[k]); p.c=0; }
  save(); buildQueue(); render();
});

load();
buildTopicSel();
buildPool();
buildQueue();
render();

document.addEventListener("click", function(e){
  if(!waiting) return;
  if(Date.now()-waitAt<250) return;
  var t=e.target;
  if(t.closest && t.closest("select,a,#themeBtn,.seg,.reset")) return;
  next();
});
</script>

<button id="themeBtn" class="themeb" aria-label="toggle theme">☾</button>
<script>
(function(){
  var K="drill_theme", btn=document.getElementById("themeBtn");
  var qp=null; try{qp=new URLSearchParams(location.search).get("theme");}catch(e){}
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  var t=qp||saved||"light";
  function apply(x){document.documentElement.setAttribute("data-theme",x);btn.textContent=x==="dark"?"\u2600":"\u263e";}
  apply(t);
  btn.addEventListener("click",function(){t=(t==="dark")?"light":"dark";try{localStorage.setItem(K,t)}catch(e){}apply(t);});
})();
</script>
</body>
</html>
