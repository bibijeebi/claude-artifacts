<style>
:root{--bg:#0a0e0d;--bg2:#101614;--bg3:#161e1b;--line:#1d2926;--ink:#e8efe9;--dim:#7e918a;--lime:#d4ff3a;--green:#3ad47e;--amber:#ffc24b;--red:#ff5c5c;--blue:#5cc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.tab:hover{border-color:var(--lime)}.tab.on{background:var(--lime);color:#0a0e0d;font-weight:700}

.btn:hover{border-color:var(--lime)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:30px 22px;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}

.nav{display:flex;gap:8px;margin-top:10px}.nav .btn{flex:1}

.opt:hover{border-color:var(--lime)}

.exp{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px;padding:10px;background:var(--bg3);border-radius:8px;border-left:2px solid var(--lime);display:none}

.mrow{display:flex;gap:8px;margin-bottom:7px;align-items:stretch}

.msel{flex:1}
.msel select{width:100%;height:100%;background:var(--bg3);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12px;border-radius:9px;padding:9px}
.msel select.ok{border-color:var(--green)}.msel select.no{border-color:var(--red)}
.note h3{color:var(--lime);font-size:16px;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}

.note .mn{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;font-size:12.5px;margin:7px 0}

.note th,.note td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.note th{color:var(--lime);background:var(--bg2)}

.k{color:var(--lime);font-weight:700}

<script>
const MCQS=[
["What does an individualized education program (IEP) mean according to the Individuals with Disabilities Education Act (IDEA)?", ["Students with disabilities must be able to access educational services tailored to their individual needs without incurring personal costs.", "An outline of educational goals and support services must be provided for each student with a disability.", "Funding should be provided to states and school districts to support English learners in achieving English proficiency and academic success.", "Individuals with disabilities are protected against discrimination in any program or activity that receives federal financial assistance."], 1, "IEP = the written outline of goals + services for each student with a disability. FAPE is the no-cost one; 504 is the anti-discrimination one; the EL-funding one is Title III.", "IDEA"],
["What must be included as a key component of a student's individualized education program (IEP)?", ["Demographic data", "Team participant signatures", "Past report cards", "Duration of services"], 3, "Duration of services is one of the 9 IEP parts (with start dates, frequency, location). Signatures, report cards, demographics aren't listed parts.", "IDEA"],
["A student, for a short time, is in a hospital program that has unique capabilities required by the IEP. What is the name of the least restrictive environment (LRE) in this scenario?", ["Special education class", "General education with support", "Partial mainstream/inclusion", "Specialized outside program"], 3, "Hospital, residential, private school = specialized program OUTSIDE the district. It's the most restrictive rung of the LRE ladder.", "IDEA"],
["What is a general education teacher responsible for under the Individuals with Disabilities Education Act (IDEA) when teaching a student with a disability?", ["Determine when to pull the student out of the classroom for extra assistance", "Attend district-wide trainings about special education", "Decide which paraprofessionals need to be in the classroom", "Communicate regularly and effectively with the student and their family"], 3, "Gen ed AND sped teachers must communicate regularly and effectively with the student and family. Deciding paras/pull-outs isn't the gen ed teacher's call.", "IDEA"],
["What is a general education teacher responsible for under the Individuals with Disabilities Education Act (IDEA) when teaching a student with a disability?", ["Organize the annual IEP meeting with the parents and the special education teacher", "Work with the special education teacher to supervise the paraprofessional's classroom activities", "Send reports about the student's academic progress at least twice per week", "Approve the lesson plans that are developed by the special education teacher"], 1, "Gen ed role list includes working with the sped teacher to supervise the paraprofessional's classroom activities. The sped teacher organizes IEP meetings, not gen ed.", "IDEA"],
["What is one of the responsibilities of the special education teacher that is described by the Individuals with Disabilities Education Act (IDEA)?", ["Work with coaches and administrators to ensure equal access to the school's athletic program", "Continue communicating with families on job placements once the student has graduated", "Cultivate partnerships with families and be involved in educational decision-making processes", "Create daily lesson plans that are adjusted versions of the general education classroom plans"], 2, "CEC standard: cultivate partnerships with families and be involved in educational decision making.", "IDEA"],
["What does the Individuals with Disabilities Education Act (IDEA) require of special education teachers?", ["Create daily lesson plans that are adjusted versions of the general education classroom plans", "Train general education teachers on the legal requirements of working with students with disabilities", "Avoid any actions that may harm individuals with exceptionalities and adhere to professional ethics and standards", "Adjust the least restrictive environment (LRE) for students based on real-time academic data"], 2, "CEC standard: do no harm, follow professional ethics and standards. Training gen ed teachers on law and adjusting LRE aren't sped-teacher duties.", "IDEA"],
["What is a special education teacher responsible for under the Individuals with Disabilities Education Act (IDEA)?", ["Develop district policies and processes to locate, identify, and evaluate all children with disabilities", "Ensure that students with disabilities have access to wraparound services such as transportation and food", "Demonstrate professionalism by maintaining high competence and integrity while supporting students and their families", "Supervise and evaluate the work of all paraprofessionals who are working with students in their caseload"], 2, "CEC: demonstrate professionalism (competence + integrity). Child Find policy is district-level; para supervision of the whole caseload isn't on the list.", "IDEA"],
["What is a special education teacher responsible for under the Individuals with Disabilities Education Act (IDEA)?", ["Advocate for adequate resources and favorable conditions to improve educational outcomes for students with exceptionalities", "Supervise and evaluate the work of all paraprofessionals who are working with students in their caseload", "Advocate for better working conditions and salaries for special education teachers within the district", "Develop district policies and processes to locate, identify, and evaluate all children with disabilities"], 0, "CEC: advocate for professional conditions and resources that improve outcomes for students with exceptionalities. Salary advocacy is the trap.", "IDEA"],
["What does Section 504 of the Rehabilitation Act ensure for students?", ["Adjustments to individual curriculum", "Equal access to public education", "Federal funding for modifications", "Medical care for physical impairments"], 1, "504 = civil rights law = equal ACCESS. It doesn't adjust curriculum (that's a modification) or pay for medical care.", "Section 504"],
["What is an example of an accommodation provided in educational settings?", ["Curriculum simplification", "Alternative projects", "Tailored content", "Graphic organizers"], 3, "Graphic organizers change HOW material is presented = accommodation. Alternative projects, simplified curriculum, tailored content change WHAT = modifications.", "Section 504"],
["How does Section 504 differ from IDEA?", ["It guarantees special education and related services.", "It requires an individual education plan.", "It offers protection for 13 specific disabilities.", "It is funded by state and local governments."], 3, "504 is funded by state and local sources; IDEA is federally funded. The 13 categories, guaranteed sped services, and the IEP are all IDEA.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Becoming familiar with each student's needs", "Ordering materials with a simplified format", "Identifying needed modifications to curriculum", "Creating an alternate plan as a backup"], 0, "504 strategy #1: know the plan. Familiarize yourself with each student's 504 plan and needs.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Splitting responsibilities with other educators", "Creating assignments for extra practice", "Preparing an isolated learning environment", "Coordinating with others to provide consistent support"], 3, "504 strategy #2: collaborate with colleagues, support staff, admins to provide consistent support.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Accommodating students by creating simplified exams", "Gathering student preferences for accommodations", "Scheduling medication to align with assessments", "Implementing specified accommodations proactively"], 3, "504 strategy #3: implement accommodations proactively and apply them consistently. Gen ed doesn't write simplified exams (modification).", "Section 504"],
["What is one critical strategy for effectively implementing 504 plans?", ["Inviting parents to regularly contribute to instruction", "Addressing challenges and changes with flexibility", "Obtaining technology to automate instruction", "Conducting daily assessments to monitor progress"], 1, "504 strategy #4: monitor and adjust. Be flexible as challenges and needs change.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Assigning peer partners to affected students", "Celebrating an environment of inclusivity and diversity", "Splitting students into heterogeneous groups", "Prioritizing visual instruction methods when possible"], 1, "504 strategy #5: foster an inclusive environment that celebrates diversity and belonging.", "Section 504"],
["Which strategy is critical for effectively implementing 504 plans?", ["Providing separate and individual instruction", "Adjusting the academic calendar to slow instruction", "Ensuring that students' rights are protected", "Designing an alternative grading rubric for projects"], 2, "504 strategy #6: advocate. Make sure students' needs are met and rights are protected.", "Section 504"],
["What is the name of the federal law that assists English learners in meeting challenging academic standards?", ["Title I of the Elementary and Secondary Education Act", "Individuals with Disabilities Education Act (IDEA)", "Title III of the Elementary and Secondary Education Act", "Title IX of the Education Amendments of 1972"], 2, "Title III (of ESEA) = English learners. Title I = low-income funding; Title IX = sex discrimination; IDEA = disabilities.", "Title III"],
["What is considered a valid expense when using Title III funds to support English learners (ELs)?", ["Food service for lunch and breakfast", "Childcare for parents during LIEP meetings", "Improved lab equipment for science classes", "Professional development for teachers"], 3, "Title III funds PD for teachers of ELs, language instruction programs, upgraded curricula, parent outreach. Not meals, childcare, lab equipment.", "Title III"],
["What is the Home Language Survey (HLS) used for?", ["Constructing a language instruction educational program (LIEP)", "Helping to determine eligibility for assistance under Title III", "Assessing a student's cultural backgrounds and traditions", "Evaluating a student's proficiency in multiple languages"], 1, "Home Language Survey is given at enrollment to flag students who may need language support, i.e. Title III eligibility. It's a screen, not a proficiency test.", "Title III"],
["What are educators expected to do under Title III?", ["Report suspected child abuse regarding English learners", "Engage with parents of English learners", "Provide English learners with a path to citizenship", "Place English learners into an immersive setting"], 1, "Title III purpose #5: promote parent, family, and community engagement.", "Title III"],
["What is one responsibility of educators under Title III?", ["Provide English learners with adequate transportation to school", "Assist English learners in college or career placement after graduation", "Provide non-citizens with the resources to obtain citizenship", "Provide professional development for teachers of English learners"], 3, "Title III purpose #3: enhance educators' capacity through professional development.", "Title III"],
["What is a key strategy used by teachers for meeting the requirements of Title III for English learners (ELs)?", ["Ensuring that the student has basic needs, such as food, met", "Encouraging at-home learning in the student's native language", "Conducting oral assessments in order to simplify the testing process", "Avoiding the use of technology in English language classrooms"], 1, "Family engagement strategy: involve families with translated materials and at-home learning support, including in the home language.", "Title III"],
["What is a key strategy used by teachers for meeting the requirements of Title III for English learners (ELs)?", ["Focusing on grammar drills in isolation from other academic content", "Simplifying the testing process by using all-oral assessments", "Tailoring lessons and assessments to ELs' varied language proficiency levels", "Avoiding the use of technology in English language classrooms"], 2, "Differentiated instruction for ELs: tailor lessons and assessments to each EL's proficiency level.", "Title III"],
["What is a critical strategy used by teachers to meet Title III requirements for instructing English learners (ELs)?", ["Refraining from using the student's native language to accelerate English acquisition", "Focusing on grammar drills in isolation from other academic content", "Conducting oral assessments in order to simplify the testing process", "Modeling correct language use and providing sentence frames to guide students' responses"], 3, "Language modeling: model correct use and give sentence frames. Krashen and the course both say use the home language, don't ban it.", "Title III"],
["What is a critical strategy used by teachers to meet Title III requirements for instructing English learners (ELs)?", ["Limited grammar", "Oral-only assessments", "Simplified language", "Extracurricular support"], 2, "Simplified language = clear, concise, no idioms. One of the 10 EL classroom strategies.", "Title III"],
["What is one of the exceptionalities covered in the Individuals with Disabilities Education Act (IDEA)?", ["Orthopedic impairment", "Artistic giftedness", "Behavior challenges", "Intellectual talent"], 0, "Orthopedic impairment is one of IDEA's 13. Giftedness, talent, and 'behavior challenges' are not categories.", "Exceptionalities"],
["Which accommodation is specifically found in the category of other health impairment?", ["Medication management", "Extra time on assessments", "Explicit phonics instruction", "Mathematical pictures"], 0, "OHI accommodations: individualized healthcare plan, medication management, flexible scheduling, environmental accommodations.", "Exceptionalities"],
["Which condition is classified as a psychiatric disorder?", ["Dyslexia", "Fragile X syndrome", "Attention-deficit/hyperactivity disorder", "Obsessive-compulsive disorder"], 3, "OCD is a psychiatric/mental disorder (with anxiety, depression, ODD, CD, PTSD). ADHD is filed under developmental/OHI; dyslexia is SLD; Fragile X is genetic/developmental.", "Exceptionalities"],
["Which strategy can assist a student with dysgraphia?", ["Providing visual representations of mathematical concepts", "Developing a range of accommodations for writing tasks", "Providing varied opportunities for interactions with peers", "Allowing for the use of an assistive listening device"], 1, "Dysgraphia = writing. Provide accommodations for writing tasks, explicit handwriting/spelling instruction, word processors. Visual math = dyscalculia.", "Exceptionalities"],
["What is Tourette syndrome?", ["A genetic disorder caused by changes in the FMR1 gene", "A developmental disorder affecting movement and balance", "A developmental disorder that affects a person's social interactions", "A disorder causing uncontrollable twitches and sounds"], 3, "Tourette = nervous-system condition with uncontrollable tics (motor + vocal). FMR1 = Fragile X; movement/balance = cerebral palsy; social interaction = ASD.", "Exceptionalities"],
["What is one indication that a student might have a specific learning disability?", ["Struggling to read the board in the front of the classroom", "Having difficulty distinguishing between the directions of right and left", "Having difficulty hearing individual voices in a conversation", "Demonstrating extreme difficulty standing up from a seated position"], 1, "SLD warning signs: right/left confusion, mixing letters/numbers, pattern trouble, organization, remembering what was heard. Board/hearing problems are sensory.", "Exceptionalities"],
["How does the dual language program model help English learners (ELs)?", ["It allows ELs to learn English in English-only classes with help from teachers trained to support EL students.", "It improves ELs' understanding of math and science lessons in English using activities, visuals, and simplified language.", "It allows ELs to learn in both English and another language to become bilingual and proficient in both languages across various subjects.", "It uses both the ELs' primary language and English, helping them maintain skills in both while preparing for English-only classes."], 2, "Dual language = learn in English AND another language to become bilingual/biliterate across subjects. 'Maintain both while moving to English-only' = transitional bilingual.", "ELs & Language"],
["What is the name of the hypothesis from Krashen's theory of second-language acquisition stating that language learners acquire grammatical structures in a predictable sequence?", ["Input", "Monitor", "Natural order", "Affective filter"], 2, "Natural order = grammar acquired in a predictable sequence.", "ELs & Language"],
["Which stage of second-language acquisition will a student enter after moving through the beginning fluency stage?", ["Intermediate fluency", "Speech emergent", "Advanced fluency", "Pre-production"], 0, "Order: pre-production, early production, speech emergent, beginning fluency, INTERMEDIATE fluency, advanced fluency.", "ELs & Language"],
["What is one of the four main principles of culturally responsive teaching, according to Gloria Ladson-Billings?", ["Giving students books representing their culture", "Allowing students to learn in two languages", "Honoring the affective factors in learning", "Promoting the importance of cultural competence"], 3, "Ladson-Billings' 4: shift away from deficit mindset, address implicit bias, promote cultural competence, students valued and empowered.", "CRT & UDL"],
["Which framework focuses on adapting instruction to reflect students' diverse backgrounds and experiences?", ["Culturally responsive teaching", "Universal design for learning", "Krashen's second-language acquisition theory", "Stages of second-language acquisition"], 0, "Reflecting students' backgrounds and experiences = culturally responsive teaching. UDL is about flexible design for learner variability.", "CRT & UDL"],
["Which framework seeks to create an inclusive and affirming learning environment?", ["Culturally responsive teaching", "Stages of second-language acquisition", "Universal design for learning", "Krashen's second-language acquisition theory"], 0, "Inclusive and AFFIRMING environment for cultural identity = culturally responsive teaching.", "CRT & UDL"],
["What characterizes the pre-production stage when a person is learning a second language?", ["The learner absorbs the new language but does not yet speak it.", "The individual begins to speak using short words and sentences.", "The learner first uses speech in social situations with minimal errors.", "Communication becomes common and mostly accurate, especially in social settings."], 0, "Pre-production = silent period. Absorbs, doesn't speak yet. Short words/sentences = early production.", "ELs & Language"],
["What is a common trait of a gifted student?", ["A profound curiosity about diverse subjects", "The holding of others to lower standards", "A struggle to use imaginative thinking", "A preference for work that involves details"], 0, "Gifted traits: profound curiosity across subjects.", "Gifted"],
["What is a common trait of a gifted student?", ["Setting low standards for others' performance", "A preference for work that involves details and minutiae", "Struggling with imaginative problem-solving", "An ability to grasp concepts several grade levels ahead"], 3, "Gifted traits: grasp concepts several grade levels ahead.", "Gifted"],
["What is a common trait of a gifted student?", ["An unconventional sense of humor", "An attraction to routine tasks", "A lack of social consciousness", "Little emotional depth and sensitivity"], 0, "Gifted traits: unconventional sense of humor.", "Gifted"],
["Which trait is commonly exhibited by students with gifts and talents?", ["A lack of emotional depth and sensitivity", "Little to no interest in international issues", "A singular approach to learning and problem-solving", "The ability to absorb information rapidly"], 3, "Gifted traits: absorb information rapidly, fewer repetitions.", "Gifted"],
["Which characteristic is associated with student giftedness?", ["Giftedness is primarily about a brain-based difference.", "Giftedness is solely a matter of genetic inheritance.", "Gifted traits can be seen mostly by academic achievements.", "Giftedness is always apparent through outward success in school."], 0, "Course line: giftedness is a brain-based difference, not grades or outward success, and not purely inherited.", "Gifted"],
["Which of the following represents one of the six guiding principles of the Individuals with Disabilities Education Act (IDEA)?", ["Least restrictive environment", "Universal Design for Learning", "Differentiated instruction", "School choice option"], 0, "IDEA's 6: FAPE, appropriate evaluation, IEP, LRE, parent/student participation, procedural safeguards. UDL and DI are teaching frameworks, not IDEA principles.", "IDEA"],
["The eligibility categories outlined in the Individuals with Disabilities Education Act (IDEA) are exhaustive and cover all possible disabilities.", ["True", "False"], 1, "False. The 13 categories are specific; conditions outside them may still get a 504 plan, which uses a broader disability definition.", "IDEA"],
["What is one key component of an Individualized Education Program (IEP)?", ["Generalized instruction", "Annual goals", "Standardized testing", "Group activities"], 1, "Annual goals are one of the 9 IEP parts.", "IDEA"],
["Which principle of IDEA emphasizes that students with disabilities should be educated alongside their non-disabled peers to the greatest extent possible?", ["Special education placement", "Least restrictive environment", "Separate education model", "Specialized education approach"], 1, "LRE = educated with nondisabled peers to the maximum extent appropriate.", "IDEA"],
["What is the primary goal of an Individualized Education Program (IEP) for a student with a disability?", ["To standardize educational practices for all students", "To outline specific goals and services tailored to the individual needs of the student", "To assess a student's general academic achievement", "To designate a student's eligibility for special education services"], 1, "IEP = specific goals and services tailored to the student. Eligibility is decided by evaluation, not the IEP.", "IDEA"],
["How many categories of disability are recognized under the Individuals with Disabilities Education Act (IDEA)?", ["7", "13", "15", "10"], 1, "13 IDEA eligibility categories.", "IDEA"],
["What does the Least Restrictive Environment (LRE) concept emphasize for students with disabilities?", ["Students with disabilities should be educated with their peers to the greatest extent appropriate.", "Students with disabilities should be grouped together in the same classroom to facilitate targeted instruction.", "Students with disabilities benefit from being in smaller classes with lower student-to-teacher ratios throughout the school day.", "Students with disabilities should be educated in separate, specialized classrooms."], 0, "LRE = with peers to the greatest extent appropriate.", "IDEA"],
["Ms. Johnson, a general education teacher, designs a science experiment that can be conducted by all students. She provides written instructions, a demonstration, and allows students to work in pairs. Which of the six roles and responsibilities of general education teachers required by IDEA is demonstrated in this scenario?", ["Regularly update the special education teacher on student performance.", "Develop lesson plans that facilitate learning and engagement for all students.", "Communicate with students and their families.", "Collaborate with the special education teacher to develop and implement accommodations."], 1, "Designing one activity everyone can do = developing lesson plans that facilitate learning and engagement for ALL students.", "IDEA"],
["Why do special education teachers use evidence, instructional data, research, and professional knowledge to enhance learning outcomes for students with disabilities?", ["To limit the scope of teaching strategies", "To personalize instruction and interventions", "To ensure compliance with federal regulations", "To increase administrative oversight"], 1, "CEC: use evidence, data, research to personalize instruction and interventions.", "IDEA"],
["Ms. Patel, a special education teacher, regularly assesses her students' progress in math and notices that one student has been struggling with the new concepts. She adjusts her teaching approach, provides positive reinforcement, and communicates her observations with the general education teacher to better support the student's learning. Which of the eleven roles and responsibilities of special education teachers required by IDEA is demonstrated in this scenario?", ["Encourage active involvement and participation.", "Collaborate with colleagues to ensure comprehensive support.", "Demonstrate professionalism.", "Contribute actively to professional development."], 1, "Adjusts AND shares observations with the gen ed teacher = collaborate with colleagues to ensure comprehensive support.", "IDEA"],
["What is one of the primary roles of special education teachers in inclusive classrooms according to the Council for Exceptional Children's (CEC) Standards for Professional Practice?", ["To prioritize the completion of Individualized Education Program (IEP) paperwork and compliance with administrative tasks", "To focus primarily on the emotional well-being of students with disabilities while leaving academic instruction to general education teachers", "To provide effective support for students with disabilities by following research-based practices", "To provide one-on-one instruction to students with disabilities"], 2, "CEC Standards: provide effective support by following research-based practices.", "IDEA"],

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";$("#fcdef").classList.add("hide");$("#fcpos").textContent="0 / 0";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
