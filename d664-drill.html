<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#2b3238;--dim:#7a8590;--teal:#159fc9;--green:#43a047;--red:#e23b3b;--line:#dde3e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:640px;margin:0 auto}
.head{background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.head h1{font-size:17px;line-height:1.2}
.head .sub{font-size:12px;color:var(--dim)}
.rings{margin-left:auto;display:flex;gap:10px}
.ring{width:52px;text-align:center;font-size:10px;color:var(--dim)}
.ring svg{display:block;margin:0 auto 2px}
.ring .val{font-weight:700;font-size:11px;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.reset{font-size:12px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none}
.card{background:var(--panel);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtopic{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px}
.qtext{font-size:16.5px;line-height:1.45;margin-bottom:14px}
.ans{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;line-height:1.4;margin-bottom:8px;cursor:pointer;color:var(--ink)}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{font-weight:700;color:var(--dim);flex:none}
.ans.correct{border-color:var(--green);background:#eef7ee}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.reveal{border-color:var(--green)}
.ans:disabled{cursor:default}
.explain{display:none;margin-top:10px;border-left:3px solid var(--red);background:#fdf3f3;padding:10px 12px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
.explain b{color:var(--green)}
.explain .cont{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.meta{margin-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.done{background:var(--panel);border-radius:10px;padding:30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.done h2{color:var(--green);margin-bottom:8px}
.done p{color:var(--dim);font-size:14px;margin-bottom:16px}
.done button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>D664 Drill</h1>
      <div class="sub">Learners and Learning Science · 183 questions, mastered twice each</div>
    </div>
    <div class="rings">
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="seenArc" cx="22" cy="22" r="19" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="seenVal">0%</span>Seen</div>
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="aptArc" cx="22" cy="22" r="19" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="aptVal">0%</span>Apt</div>

  </div>
  <div class="bar">
    <select id="topicSel"><option value="">All topics</option></select>
    <button class="reset" id="resetBtn">reset</button>

<script>
const MCQS=[
["A student feels the emotional and anxious before a test, which affects memory. Which brain structure is involved?", ["Limbic system", "Cerebrum", "Cerebellum", "Brain stem"], 0, "Limbic system = emotions + emotional memory. Test anxiety hitting memory is limbic. Cerebellum = balance/coordination; brain stem = breathing/heart.", "Brain"],
["What is the function of the cerebrum?", ["It supports thinking, reasoning, and problem-solving.", "It regulates breathing, heart rate, and digestion.", "It controls balance, posture, and motor coordination.", "It processes emotions and forms emotional memories."], 0, "Cerebrum = thinking, reasoning, problem-solving (largest part). Breathing/heart = brain stem; balance = cerebellum; emotions = limbic.", "Brain"],
["What are the mental processes used to acquire, process, store, and use information?", ["Cognition", "Neuroplasticity", "Motor function", "Autonomic regulation"], 0, "Cognition = mental processes to acquire, process, store, use information. Neuroplasticity = rewiring.", "Brain"],
["What is neurodevelopment?", ["The way the brain grows and changes across the human lifespan", "The process that reduces attention by limiting sensory input over time", "The group of emotions that shapes behavior during social experiences", "The system of body movements that supports posture and coordination"], 0, "Neurodevelopment = how the brain grows and changes (myelination strengthens, pruning trims).", "Brain"],
["A learner remembers a historical term during class discussion without looking at notes. Which term describes this process?", ["Retrieval", "Encoding", "Storage", "Feedback"], 0, "Pulling a stored term back out = retrieval. Encoding = first processing; storage = keeping it.", "Learning Processes"],
["What is feedback-driven metacognition?", ["Using assessment results to reflect on and regulate one's own learning", "Distributing study sessions over time to improve long-term retention", "Recalling information from memory without the use of study materials", "Mixing different types of problems in a single study session"], 0, "Feedback-driven metacognition = use assessment feedback to reflect on and regulate your learning.", "Learning Processes"],
["In learning science, what does storage mean in the memory process?", ["Maintaining information in memory over time", "Processing information into memory initially", "Accessing information from memory later", "Directing attention during learning tasks"], 0, "Storage = maintaining encoded info over time. Encoding = initial processing; retrieval = accessing later.", "Learning Processes"],
["What is neuroplasticity?", ["The brain’s ability to reorganize and adapt through experience", "The brain’s tendency to preserve fixed pathways across development", "The brain’s preference for one sensory input during instruction", "The brain’s reliance on inherited traits over classroom conditions"], 0, "Neuroplasticity = brain reorganizes and adapts through experience. Kills the cognitive-rigidity myth.", "Brain"],
["How should a teacher support students who are in Erikson's industry versus inferiority stage?", ["Provide structured opportunities for success and use constructive feedback", "Encourage students to dress and feed themselves during class routines", "Allow students to lead group activities and choose their own projects freely", "Limit comparisons between students by avoiding any academic evaluation"], 0, "Industry vs inferiority (5-12): opportunities for success, praise, constructive feedback. Dressing/feeding self = autonomy (toddlers).", "Erikson"],
["A teacher shows a preschool class two identical glasses of juice. She then pours one glass into a taller, thinner cup. When asked which container has more juice, most students point to the taller cup. Which concept from Piaget's theory explains the students' response?", ["Centration", "Reversibility", "Egocentrism", "Seriation"], 0, "Tall glass looks like more = centration (focus on one dimension, height). Preoperational. Conservation is what they lack.", "Piaget"],
["At the end of a lesson on the water cycle, a teacher gives students a blank diagram and asks them to label each stage from memory before leaving class. Students may not refer to their notes. Which learning strategy does this single in-class activity most directly apply?", ["Retrieval practice", "Spacing", "Interleaving", "Feedback-driven metacognition"], 0, "Label from memory, no notes = retrieval practice. One session, so not spacing.", "Learning Strategies"],
["During a math study session, a student works through a set of problems that includes addition, multiplication, and algebra questions together. Which learning strategy does this student's approach reflect?", ["Interleaving", "Spacing", "Retrieval practice", "Encoding"], 0, "Mixed problem types in one session = interleaving.", "Learning Strategies"],
["Which method should a teacher use to structure the classroom environment to promote cognitive development according to Vygotsky?", ["Design learning activities that encourage collaboration, discussion, and shared problem-solving.", "Minimize verbal interaction during instruction so students can focus on independent practice.", "Focus instruction on individual seatwork so teachers can assess each student's independent ability.", "Limit peer interaction to prevent students from developing misconceptions through incorrect explanations."], 0, "Vygotsky = social: collaboration, discussion, shared problem-solving.", "Vygotsky"],
["A student studies the same material several times over many days instead of during one long session. Which term describes this approach?", ["Spacing", "Interleaving", "Encoding", "Retrieval"], 0, "Same material over many days = spacing (distributed practice).", "Learning Strategies"],
["A teacher adds manageable challenges to practice so students must work harder to remember and apply learning. Which term describes this approach?", ["Desirable difficulty", "Feedback", "Storage", "Encoding"], 0, "Manageable challenges that make you work harder = desirable difficulty.", "Learning Strategies"],
["What is the impact of retrieval practice on learners?", ["It strengthens recall pathways for later remembering.", "It moves all learning into short-term memory.", "It replaces the need for storing information.", "It improves learning by avoiding self-testing."], 0, "Retrieval practice strengthens recall pathways (long-term retention).", "Learning Strategies"],
["Which student statement shows a fixed mindset about academic ability?", ["“I am not good at science, so I cannot learn it.”", "“I can improve in science when I practice and revise.”", "“I learn science through movement during instruction.”", "“I have learned other subjects, so I can learn science.”"], 0, "Fixed mindset = ability can't change. 'I'm not good at X so I can't learn it.'", "Neuromyths & Mindset"],
["What is differentiated instruction?", ["Teaching tailored to student needs, interests, and readiness", "Teaching limited to one method, sequence, and pacing pattern", "Teaching designed to keep all students on identical tasks", "Teaching centered on whole-group lecture across all lessons"], 0, "Differentiated instruction = tailored to needs, interests, readiness.", "Neuromyths & Mindset"],
["Which term refers to introducing challenges or obstacles during learning that are neither too easy, nor too difficult, but just right for learning?", ["Desirable difficulty", "Spacing", "Interleaving", "Retrieval practice"], 0, "Just right challenge, not too easy or too hard = desirable difficulty.", "Learning Strategies"],
["Which effect does interleaving have on learning?", ["It improves transfer by mixing topics during practice.", "It improves recall by using one topic per practice set.", "It reduces speed by reducing variation during practice.", "It reduces fluency by grouping similar problems together."], 0, "Interleaving improves transfer by mixing topics.", "Learning Strategies"],
["Which statement refutes the myth that neurological differences such as ADHD, dyslexia, and autism are deficits that must be corrected?", ["Neurological differences are natural and valuable aspects of human variation that enrich learning environments.", "Neurological differences are temporary conditions that respond well to early behavioral intervention.", "Neurological differences are caused by environmental factors and can be reversed through targeted instruction.", "Neurological differences are most effectively addressed by modifying a student's environment rather than instruction."], 0, "Neurodiversity: differences are natural and valuable variation, not deficits.", "Neuromyths & Mindset"],
["Which practice counteracts the myth of cognitive rigidity in the classroom?", ["Fostering a growth mindset culture that frames effort and challenges as pathways to brain development.", "Placing students in ability groups based on early test scores to target instruction efficiently.", "Dissuading students from attempting tasks they have previously found difficult, so they remain confident.", "Lowering academic expectations for older students whose cognitive processing speed has naturally slowed."], 0, "Counteract cognitive rigidity = growth mindset culture; effort and challenges grow the brain.", "Neuromyths & Mindset"],
["A learner studies while texting, watching videos, and completing practice questions. Which effect can result from this learning approach?", ["The learner may reduce focus by switching attention repeatedly.", "The learner may improve learning retention by combining several tasks.", "The learner will easily be able to give equal attention to each task.", "The learner will be able to reduce the time necessary to learn and study."], 0, "Multitasking = task switching, reduced focus, more errors, worse retention.", "Neuromyths & Mindset"],
["Which statement reflects the myth of cramming?", ["Cramming may result in short-term memorization.", "Cramming supports long-term recall and retrieval.", "Cramming supports deep learning and concept transfer.", "Cramming supports durable memory and reduces cognitive fatigue."], 0, "WGU's key: the 'may result in short-term memorization' line. Course: cramming gives short-term memorization but shallow understanding and poor long-term retention. Every 'cramming supports long-term...' option is false.", "Neuromyths & Mindset"],
["Human brains are incredibly varied, and individuals vary widely in their strengths and weaknesses. Which common myth does this statement refute?", ["Normality", "Preferred learning styles", "Cognitive Rigidity", "Tabula Rasa"], 0, "'Brains are incredibly varied' is the course's exact refutation of the myth of NORMAL.", "Neuromyths & Mindset"],
["Which statement is consistent with a growth mindset after a setback?", ["“This shows what I need to improve next.”", "“This shows I do not have enough ability.”", "“This shows I learn with easy assignments.”", "“I should choose tasks that fit my strengths.”"], 0, "Growth mindset after setback: 'this shows what I need to improve next.'", "Neuromyths & Mindset"],
["How does a fixed mindset interpret feedback?", ["It takes feedback personally, resists criticism, and sees it as judgment.", "It takes feedback as guidance for better skills, useful advice, and learning.", "It takes feedback as support for future growth, effort, and improvement.", "It takes feedback as practice for steady progress, reflection, and change."], 0, "Fixed mindset takes feedback personally, resists criticism, sees it as judgment.", "Neuromyths & Mindset"],
["How is constructive feedback viewed in a growth mindset?", ["As useful input for skill enhancement", "As proof ability comes from natural talent", "As a signal to choose goals that fit existing ability", "As unnecessary pressure during performance"], 0, "Growth mindset sees constructive feedback as useful input for skill growth.", "Neuromyths & Mindset"],
["Which practice counteracts the myth that students learn best when instruction is standardized, by applying evidence-based cognitive style principles?", ["Tailoring instruction to individual student needs, interests, and readiness levels through differentiated approaches.", "Pacing all students through identical lessons to ensure consistent exposure to grade-level content.", "Providing remediation after assessments as the primary method for addressing differences in student performance.", "Focusing instruction on the most common cognitive profile in the classroom to benefit the majority of students."], 0, "Counter 'standardized instruction' = differentiate to needs, interests, readiness.", "Neuromyths & Mindset"],
["Which teaching strategy is aligned with behaviorist principles?", ["Using direct instruction to model a skill, followed by guided practice and corrective feedback.", "Using concept maps to help students organize new information with prior knowledge.", "Designing hands-on group activities that promote collaborative knowledge construction.", "Encouraging students to pursue topics of personal interest through self-directed projects."], 0, "Behaviorism (Skinner): direct instruction, model, guided practice, corrective feedback, reinforcement. Concept maps = cognitivism; group construction = constructivism.", "Learning Theories"],
["Using cognitivist principles, what should a teacher do to help students transfer new information into long-term memory?", ["Encourage students to elaborate on new information by connecting it to what they already know.", "Allow students to explore the topic freely and construct their own understanding through discovery.", "Reward students each time they demonstrate recall of the information during class practice.", "Assign group tasks in which students collaborate to apply new content to real-world scenarios."], 0, "Cognitivism: elaboration, connect new info to prior knowledge to move it into long-term memory.", "Learning Theories"],
["What role should a teacher take in a constructivist classroom?", ["Facilitating student-led exploration and providing scaffolding as students construct understanding.", "Delivering structured lessons that break content into small steps for student mastery.", "Providing consistent rewards and consequences to reinforce desired student behaviors.", "Modeling problem-solving strategies and guiding students through prescribed practice steps."], 0, "Constructivist teacher = facilitator: student-led exploration plus scaffolding.", "Learning Theories"],
["Learning is shaped by social interaction and cultural experience. Which view of development does this statement reflect?", ["Vygotsky’s cognitive development theory", "Piaget’s cognitive development theory", "Erikson’s psychosocial theory", "Skinner’s behavioral theory"], 0, "Social interaction + culture = Vygotsky.", "Vygotsky"],
["Which theory is associated with the idea that healthy development depends on resolving stage-related crises?", ["Erikson’s psychosocial theory", "Piaget’s cognitive development theory", "Vygotsky’s cognitive development theory", "Skinner’s behavioral theory"], 0, "Stage crises you must resolve = Erikson's psychosocial theory.", "Erikson"],
["Which stage in Erikson’s theory is associated with birth-12 months?", ["Trust versus mistrust", "Initiative versus guilt", "Industry versus inferiority", "Identity versus role confusion"], 0, "Trust vs mistrust = birth to 12 months.", "Erikson"],
["Which stage in Erikson’s theory is associated with adolescence?", ["Identity versus role confusion", "Autonomy versus shame and doubt", "Initiative versus guilt", "Industry versus inferiority"], 0, "Identity vs role confusion = adolescence (12-17).", "Erikson"],
["Which behavior most clearly reflects Erikson’s initiative versus guilt stage?", ["A preschool child invents games, asks questions, and starts new activities.", "An infant becomes upset when a caregiver leaves the room.", "A school-age child compares grades with classmates and seeks recognition.", "An adolescent examines personal beliefs and future goals."], 0, "Initiative vs guilt (3-6): invents games, asks questions, starts activities. Comparing grades = industry; caregiver leaving = trust.", "Erikson"],
["Which cognitive skill is most closely associated with the sensorimotor stage?", ["Understanding object permanence", "Solving conservation problems", "Using abstract reasoning", "Applying systematic logic"], 0, "Sensorimotor (0-2) = object permanence. Conservation = concrete; abstract = formal.", "Piaget"],
["Which task is the clearest example of fine motor skill development in a preschool child?", ["Threading beads onto a string", "Running across a playground", "Climbing up a ladder", "Jumping over a line"], 0, "Fine motor = small hand muscles: threading beads. Running/climbing/jumping = gross motor.", "Development"],
["A teacher introduces a new sorting task by modeling one step at a time, then gradually lets children complete more of the task independently. Which strategy is the teacher using?", ["Scaffolding", "Egocentrism", "Object permanence", "Interleaving"], 0, "Model one step at a time, then fade support = scaffolding.", "Vygotsky"],
["Which cognitive ability is associated with Piaget’s concrete operational stage?", ["Thinking logically about concrete objects and events", "Developing trust through consistent care from caregivers", "Exploring personal identity through beliefs and values", "Forming abstract hypotheses without concrete referents"], 0, "Concrete operational (7-11) = logic about concrete objects and events.", "Piaget"],
["What does reversibility mean?", ["Understanding that an action can be mentally undone to return to its starting point", "Understanding that an object can still exist when it is hidden from plain sight", "Understanding that a symbol can still stand for an object in pretend-based play", "Understanding that another person can still view a situation from a different perspective"], 0, "Reversibility = mentally undo an action back to its start. Hidden object = object permanence; another's view = egocentrism opposite.", "Piaget"],
["Learning experiences that support critical thinking, self-reflection, and independent inquiry are appropriate for which age group?", ["Adolescents", "Infants", "Toddlers", "Preschoolers"], 0, "Critical thinking, self-reflection, independent inquiry = adolescents (formal operational).", "Development"],
["Which level of Bloom’s revised taxonomy involves using learning in real-world contexts?", ["Applying", "Remembering", "Understanding", "Evaluating"], 0, "Applying = using learning in real-world contexts/new situations.", "Bloom's"],
["Which classroom practice aligns with direct instruction?", ["Teaching a skill in small steps and giving feedback after each step", "Giving students a difficult task before explaining the skill", "Asking students to create their own method before seeing an example", "Letting students discuss any topic instead of practicing the skill"], 0, "Direct instruction = small steps with feedback after each.", "Learning Theories"],
["Which of the following best describes cognition?", ["The mental processes involved in acquiring, processing, storing, and using information", "The process of moving and coordinating muscles", "The physical structure of the brain", "The ability to see and hear"], 0, "Cognition = acquire, process, store, use information.", "Brain"],
["Cognition encompasses processes such as memory, perception, reasoning, problem-solving, and decision-making.", ["True", "False"], 0, "True. Cognition covers memory, perception, reasoning, problem-solving, decisions.", "Brain"],
["The prefrontal cortex is responsible for balance, coordination, and motor control.", ["False", "True"], 0, "False. Balance/coordination = cerebellum. Prefrontal cortex = decisions, impulse control, emotional regulation.", "Brain"],
["What is functional magnetic resonance imaging (fMRI) primarily used for?", ["Mapping brain activity", "Detecting fractures in bones", "Visualizing soft tissue organs", "Evaluating blood flow in arteries"], 0, "fMRI maps brain activity during learning.", "Brain"],
["Storage involves actively recalling information from memory.", ["False", "True"], 0, "False. Storage = retaining. Actively recalling = retrieval.", "Learning Processes"],
["How does cramming affect the cerebrum?", ["It overwhelms the cerebrum, impairing cognitive functions.", "It minimizes the role of the cerebrum in learning and memory.", "It activates the cerebrum, leading to improved memory formation.", "It strengthens the cerebrum and enhances cognitive abilities."], 0, "Cramming overwhelms the cerebrum, impairing cognitive function (fatigue, stress, focus).", "Neuromyths & Mindset"],
["A student reads a textbook chapter while replying to messages on a phone. Because of the distractions, the student needs to reread several paragraphs to understand them.", ["The brain switches attention between tasks, increasing mental effort and lowering memory retention.", "The brain processes both tasks at the same time, dividing memory storage equally between them.", "The brain sends each task to a different hemisphere, preventing information from being stored in long-term memory.", "The brain shifts attention control to the brainstem, which slows the processing of new information."], 0, "Multitasking = switching attention, more effort, lower retention.", "Neuromyths & Mindset"],
["What effect can multitasking have on the cerebrum?", ["Overwhelming its limited capacity and impairing cognitive functions", "Strengthening its cognitive abilities and executive functions", "Enhancing its efficiency in processing emotional stimuli", "Reducing stress levels and inducing relaxation"], 0, "Multitasking overwhelms limited capacity, impairing cognition.", "Neuromyths & Mindset"],
["Which effect does cramming have on learning?", ["It leads to shallow memorization and poor long-term retention of material.", "It weakens motivation by making learning feel repetitive and unengaging.", "It deepens encoding by concentrating study into a single focused session.", "It reduces cognitive load by focusing the brain on one extended session."], 0, "Cramming = shallow memorization, poor long-term retention.", "Neuromyths & Mindset"],
["What does the \"myth of normal\" refer to from a neuroscience perspective?", ["There is a single, universally optimal learning style or cognitive functioning.", "Individual differences in learning preferences and abilities are insignificant.", "Learning outcomes are solely determined by innate intelligence or ability.", "Academic success can only be achieved through standardized testing and assessment."], 0, "Myth of normal = one standard way to learn/think.", "Neuromyths & Mindset"],
["Which term describes the concept that neurological variations are natural and valuable aspects of human variety that should be recognized and respected?", ["Neurodiversity", "Neuroplasticity", "Differentiated instruction", "Cognitive style"], 0, "Neurodiversity = neurological variation is natural and valuable.", "Neuromyths & Mindset"],
["What characterizes multisensory learning?", ["Engaging various senses during learning", "Limiting instruction to visual stimuli only", "Focusing on auditory learning strategies", "Employing traditional lecture-based teaching methods"], 0, "Multisensory = engage various senses.", "Neuromyths & Mindset"],
["What is the primary characteristic of neuroplasticity?", ["The ability of the brain to adapt and reorganize in response to experience and learning", "The fixed and unchanging nature of the brain's structure and function throughout life", "The decline in cognitive function and memory retention with age", "The predetermined and unalterable genetic factors that influence brain development"], 0, "Neuroplasticity = adapt and reorganize through experience.", "Neuromyths & Mindset"],
["Neurodiversity refers to promoting uniformity in cognitive functioning and neurological development among individuals.", ["False", "True"], 0, "False. Neurodiversity celebrates variation, not uniformity.", "Neuromyths & Mindset"],
["What does the term \"cognitive style\" refer to?", ["The way individuals approach and process information", "The ability to regulate emotions and manage stress in challenging situations", "The specific content knowledge acquired through education and experience", "The level of intelligence as measured by standardized tests"], 0, "Cognitive style = consistent way of approaching and processing information. Not the same as the unsupported 'learning styles'.", "Neuromyths & Mindset"],
["What does neuroplasticity allow the brain to do?", ["Reorganize, adapt, and grow in response to experiences.", "Store memories without forming any new connections.", "Remain fixed and unchangeable across a person's life.", "Grow new abilities without any repeated effort."], 0, "Neuroplasticity lets the brain reorganize, adapt, grow.", "Neuromyths & Mindset"],
["A teacher praises students for the strategies they use to solve a difficult problem, rather than focusing on whether they got the right answer and encourages them to keep trying after making mistakes. Which mindset is the teacher fostering?", ["A growth mindset", "A competitive mindset", "A performance mindset", "A fixed mindset"], 0, "Praising strategy and persistence after mistakes = growth mindset.", "Neuromyths & Mindset"],
["Social and emotional learning (SEL) primarily emphasizes academic achievement over the development of interpersonal skills.", ["False", "True"], 0, "False. SEL builds interpersonal and life skills, not just academics.", "Neuromyths & Mindset"],
["The analogy of the brain as a computer accurately represents the brain's functioning and capabilities.", ["False", "True"], 0, "False. The computer analogy oversimplifies the brain and misses the body connection.", "Neuromyths & Mindset"],
["What represents the most advanced level of Maslow's Hierarchy of Needs?", ["Self-actualization", "Love and belongingness", "Shelter and clothing", "Safety"], 0, "Top of Maslow = self-actualization.", "Neuromyths & Mindset"],
["Whole body listening involves only focusing one's eyes on the speaker.", ["False", "True"], 0, "False. Whole body listening = eyes, still body, brain focused, caring about the speaker.", "Neuromyths & Mindset"],
["What characterizes Information Processing Theory?", ["It focuses on the stages through which information is processed by the brain.", "It relies on observations to study the cognitive process.", "It suggests that intelligence is fixed and unchangeable throughout life.", "It emphasizes the role of genetics in determining cognitive abilities."], 0, "Information processing theory = stages info moves through (encode, store, retrieve).", "Learning Theories"],
["What is the danger of comparing the brain to a computer?", ["It oversimplifies the brain's complexity and misses its holistic nature.", "It causes learners to underestimate the role of memory in the learning process.", "It discourages educators from using technology as an instructional tool.", "It causes educators to rely too heavily on technology in the classroom."], 0, "Danger: oversimplifies the brain, misses its holistic nature.", "Neuromyths & Mindset"],
["Which needs in Maslow's hierarchy encompasses feelings of acceptance, affection, and connection with others?", ["Love and belongingness needs", "Physiological needs", "Esteem needs", "Safety needs"], 0, "Acceptance, affection, connection = love and belongingness.", "Neuromyths & Mindset"],
["What is the prefrontal cortex responsible for?", ["Decision-making, impulse control, and emotional regulation", "Handling feelings like happiness, fear, and sadness", "Connecting the brain to the spinal cord and regulating breathing", "Controlling voluntary muscle movements, posture, and balance"], 0, "Prefrontal cortex = decisions, impulse control, emotional regulation.", "Brain"],
["What is the function of the cerebellum?", ["Controlling voluntary muscle movements, posture, and balance", "Handling feelings like happiness, fear, and sadness", "Overseeing heartbeat, breathing, and automatic actions", "Managing thinking skills like problem-solving and decision-making"], 0, "Cerebellum = voluntary movement, posture, balance.", "Brain"],
["Which part of learning involves processing information from sensory input?", ["Encoding", "Retrieval", "Metacognition", "Storage"], 0, "Processing sensory input into storable form = encoding.", "Learning Processes"],
["Which task is associated with executive function?", ["Regulating emotions", "Coordinating movement", "Regulating breathing", "Maintaining reflexes"], 0, "Executive function includes self-regulation (managing emotions). Breathing/reflexes = brain stem; coordination = cerebellum.", "Learning Processes"],

["A growth mindset push, retrieval practice, and praise for achievements align with which principle?", ["Effort and strategy", "Deep thinking", "Autonomy and meaningful choice", "Collaboration"], 0, "Course alignment table: effort and strategy.", "Principles"],
["Peer teaching, think-pair-share, and role-playing belong to which instructional context?", ["Social context", "Cognitive context", "Motivational context", "Physical context"], 0, "Social = who we learn with. Cognitive = how we think. Motivational = why we try.", "Instructional Techniques"],
["Reward systems, achievable goals, and student choices belong to which instructional context?", ["Motivational context", "Social context", "Cognitive context", "Embodied context"], 0, "Why we try = motivational.", "Instructional Techniques"]
];
const LS_KEY='llscdrill_v1';
let state={};
try{state=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){state={}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function st(i){if(!state[i])state[i]={c:0,hist:[]};return state[i]}

let topic='';
let queue=[],cur=-1,curOpts=[],waiting=false;

function pool(){return MCQS.map((m,i)=>i).filter(i=>!topic||MCQS[i][4]===topic)}
function buildQueue(){
  queue=pool().filter(i=>st(i).c<2);
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}
}
function shuffleOpts(m){
  const o=m[1].map((t,oi)=>({t,oi}));
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  return o;
}
function uniqueWords(correct,others){
  const otherSet=new Set(others.join(' ').toLowerCase().match(/[a-z0-9$%.,']+/g)||[]);
  return correct.split(' ').map(w=>{
    const k=w.toLowerCase();
    return (k.length>2&&!otherSet.has(k))?'<b>'+w+'</b>':w;
  }).join(' ');
}
function rings(){
  const p=pool();
  const seen=p.filter(i=>st(i).hist.length>0).length/(p.length||1);
  const apt=p.reduce((a,i)=>a+Math.min(st(i).c,2)/2,0)/(p.length||1);
  document.getElementById('seenArc').style.strokeDashoffset=119.4*(1-seen);
  document.getElementById('aptArc').style.strokeDashoffset=119.4*(1-apt);
  document.getElementById('seenVal').textContent=Math.round(seen*100)+'%';
  document.getElementById('aptVal').textContent=Math.round(apt*100)+'%';
}
function render(){
  rings();
  const stage=document.getElementById('stage');
  if(!queue.length){
    stage.innerHTML='<div class="done"><h2>Set mastered.</h2><p>Every question in this filter answered correctly twice in a row. Book the OA.</p><button id="againBtn">Study again</button></div>';
    document.getElementById('againBtn').onclick=()=>{pool().forEach(i=>{delete state[i]});save();buildQueue();render()};
    return;
  }
  cur=queue[0];
  const m=MCQS[cur];
  curOpts=shuffleOpts(m);
  const mastered=pool().filter(i=>st(i).c>=2).length;
  stage.innerHTML='<div class="card"><div class="qtopic">'+m[4]+'</div><div class="qtext">'+m[0]+'</div>'+
    curOpts.map((o,d)=>'<button class="ans" data-disp="'+d+'"><span class="ltr">'+'ABCD'[d]+'</span><span class="txt">'+o.t+'</span></button>').join('')+
    '<div class="explain" id="explain"></div>'+
    '<div class="meta"><span>'+mastered+' / '+pool().length+' mastered</span><span>streak: '+st(cur).c+'/2</span></div></div>';
  document.querySelectorAll('#opts .ans, .ans').forEach(b=>b.onclick=()=>answer(+b.dataset.disp));
}
function answer(disp){
  if(waiting)return;
  const m=MCQS[cur],p=st(cur);
  const picked=curOpts[disp],correctDisp=curOpts.findIndex(x=>x.oi===m[2]);
  const ok=picked.oi===m[2];
  p.hist.push(ok?1:0);
  document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.ans');
  if(ok){
    p.c+=1;
    btns[disp].classList.add('correct');
    btns[disp].querySelector('.txt').innerHTML=uniqueWords(picked.t,m[1].filter((_,i)=>i!==m[2]));
    queue.shift();
    if(p.c<2)queue.splice(Math.min(10,queue.length),0,cur);
    save();
    waiting=true;
    setTimeout(()=>{waiting=false;render()},420);
  }else{
    p.c=0;
    btns[disp].classList.add('wrong');
    btns[correctDisp].classList.add('reveal');
    btns[correctDisp].querySelector('.txt').innerHTML=uniqueWords(m[1][m[2]],m[1].filter((_,i)=>i!==m[2]));
    const ex=document.getElementById('explain');
    ex.style.display='block';
    ex.innerHTML=m[3]+'<span class="cont">tap anywhere or press space to continue</span>';
    queue.shift();
    queue.splice(Math.min(3,queue.length),0,cur);
    save();
    waiting=true;
  }
  rings();
}
function next(){if(!waiting)return;waiting=false;render()}
document.addEventListener('keydown',e=>{
  if(waiting&&(e.key===' '||e.key==='Enter')){e.preventDefault();next();return}
  if(waiting)return;
  const k=e.key.toUpperCase();
  const i='1234'.indexOf(e.key)>-1?'1234'.indexOf(e.key):'ABCD'.indexOf(k);
  if(i>-1&&i<curOpts.length)answer(i);
});
document.addEventListener('click',e=>{if(waiting&&!e.target.closest('.ans'))next()});
const sel=document.getElementById('topicSel');
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)});
sel.onchange=()=>{topic=sel.value;buildQueue();render()};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Wipe all drill progress?')){state={};save();buildQueue();render()}};
buildQueue();render();
</script>
</body>
</html>
