<style>
:root{--bg:#0a0e0d;--card:#111614;--card2:#161d1a;--line:#23302b;--ink:#e8efe9;--mut:#8aa093;--lime:#d4ff3a;--good:#5ad17a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-family:"Fraunces",serif;font-weight:700;font-size:25px;letter-spacing:-.4px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tab{font:inherit;font-size:12.5px;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.12s}
.tab.on{color:var(--bg);background:var(--lime);border-color:var(--lime)}
@media(hover:hover){.tab:hover:not(.on){color:var(--ink);border-color:#33453d}}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.pos{color:var(--mut);font-size:12px;margin-left:auto}
button.nav{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
@media(hover:hover){button.nav:hover{border-color:var(--lime);color:var(--lime)}}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 24px;cursor:pointer;position:relative;user-select:none}
.fc .face{font-size:21px;line-height:1.4}.fc .term{font-family:"Fraunces",serif;font-weight:600}
.fc .tag{position:absolute;top:14px;left:16px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.fc .flip{position:absolute;bottom:12px;right:16px;font-size:10.5px;color:var(--mut)}
.fcdef{color:var(--lime)}
.mcq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.topic{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--lime);font-weight:700;margin-bottom:8px}
.q{font-size:16px;line-height:1.5;margin:0 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:8px 0;cursor:pointer;transition:.12s}
@media(hover:hover){.opt:hover{border-color:#33453d}}.opt .ltr{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.opt.correct{border-color:var(--good);background:#11231a}.opt.correct .ltr{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:#231414}.opt.wrong .ltr{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.5}
.exp{margin-top:13px;padding:12px 14px;border-radius:10px;background:#0e1512;border:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--mut);display:none}
.exp.show{display:block}.exp b{color:var(--ink)}
.hint{font-size:12px;color:var(--mut);margin:-6px 0 12px}
.seqitem,.mitem{font:inherit;font-size:14px;text-align:left;width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:7px 0;cursor:pointer;color:var(--ink);display:flex;gap:11px;align-items:center;transition:.12s}
@media(hover:hover){.seqitem:hover,.mitem:hover{border-color:#33453d}}
.seqitem .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.seqitem.picked .num{background:var(--lime);color:var(--bg)}
.seqitem.ok{border-color:var(--good)}.seqitem.no{border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mitem.sel{border-color:var(--lime)}.mitem.matched{border-color:var(--good);opacity:.85}.mitem.miss{border-color:var(--bad)}
.act{display:flex;gap:8px;margin-top:12px}
.check{font:inherit;font-size:13px;font-weight:700;color:var(--bg);background:var(--lime);border:0;border-radius:9px;padding:10px 18px;cursor:pointer}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.note h3{font-family:"Fraunces",serif;font-weight:600;font-size:16px;margin:0;padding:15px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.note h3 .ch{color:var(--lime);font-size:13px}
.note ul{margin:0;padding:0 20px 16px 36px;display:none}.note.open ul{display:block}
.note li{font-size:13.5px;line-height:1.6;margin:6px 0;color:var(--mut)}.note li::marker{color:var(--lime)}
.res{font-size:12.5px;color:var(--mut);margin-top:8px}

*{-webkit-tap-highlight-color:transparent}

<script>
const FLASH=[["Section 608", "Clean Air Act section requiring certification to service, repair, or dispose of stationary refrigerant equipment."], ["Section 609", "Motor vehicle air conditioning. Separate cert, not part of 608."], ["Universal certification", "Core + Type I + II + III passed. Works on everything stationary."], ["Passing score", "18 of 25 per section (72%)."], ["Certification validity", "Lifetime. Never expires, no renewal."], ["Venting prohibition", "Knowingly releasing CFC, HCFC, HFC, and substitute refrigerants is illegal."], ["De minimis release", "Trace loss during good-faith recovery with proper equipment. Not a violation."], ["Montreal Protocol", "International treaty phasing out ozone-depleting substances."], ["AIM Act", "U.S. law phasing DOWN HFCs (climate, not ozone)."], ["SNAP program", "EPA list of acceptable substitute refrigerants."], ["ODP ranking", "CFC (highest, most chlorine) > HCFC > HFC (zero ODP, no chlorine)."], ["R-12", "CFC. R-22 = HCFC. R-134a / R-410A = HFC. R-32 / R-454B = A2L HFC blends."], ["Stratospheric ozone", "Absorbs UV. Chlorine freed from CFCs by UV destroys it, one Cl kills many O3."], ["R-22 phaseout", "No production or import since January 1, 2020. Service with recovered/reclaimed stock only."], ["Sales restriction", "Since Jan 1, 2018 refrigerant sells only to certified techs (or employers of)."], ["Apprentice exemption", "Uncertified apprentice may handle refrigerant under direct supervision of a certified tech."], ["Max civil penalty", "Venting fines can reach roughly $59k+ per day per violation (inflation-adjusted)."], ["Recover", "Remove refrigerant and store it in an external container. No processing."], ["Recycle", "Clean on-site with oil separation and filter-driers, reuse in same owner's equipment."], ["Reclaim", "Restore to AHRI 700 purity at a certified reclaimer. Required before resale/change of ownership."], ["AHRI 700", "The purity standard reclaimed refrigerant must meet."], ["Self-contained recovery", "Active: has its own compressor/pump. Required for appliances over 15 lbs."], ["System-dependent recovery", "Passive: uses the appliance's own compressor/pressure. Only on 15 lbs or less."], ["Recovery equipment cert", "Equipment made after Nov 15, 1993 must be EPA-certified (ARI 740 tested)."], ["Low-loss fittings", "Required on recovery hoses to minimize release when connecting/disconnecting."], ["Vacuum pump alone", "NOT recovery. It exhausts refrigerant to the room = venting."], ["80% fill rule", "Never fill a recovery cylinder past 80% of capacity by weight. Hydrostatic expansion bursts tanks."], ["Recovery cylinder colors", "Gray body, yellow top."], ["Hydrostatic retest", "Refillable cylinders: every 5 years."], ["DOT-39 cylinder", "Disposable. NEVER refill, never use for recovery. Recover heel, puncture, recycle steel."], ["Cylinder storage temp", "Keep below about 125 F."], ["Oxygen rule", "NEVER pressurize a system with oxygen or air: oil + oxygen under pressure explodes. Use dry nitrogen."], ["Nitrogen + trace", "Pressure/leak testing uses dry nitrogen (optionally with trace refrigerant)."], ["Halide torch", "Old leak detector, flame turns green near halogenated refrigerant."], ["Refrigerant + flame", "Decomposes into toxic gases (hydrochloric/hydrofluoric acid, phosgene-like)."], ["Confined space danger", "Refrigerant displaces oxygen: asphyxiation. It's heavier than air, sinks low."], ["Liquid refrigerant on skin", "Frostbite."], ["Oil change pressure", "Don't change compressor oil above 5 psig."], ["Non-condensables symptom", "Air in system = high head pressure."], ["Acrid odor during recovery", "Compressor burnout acids."], ["Deep vacuum target", "About 500 microns for dehydration before charging."], ["Saturation relationship", "Pressure up = saturation temperature up. The P-T chart maps it."], ["Superheat", "Vapor heated above its saturation temperature."], ["Subcooling", "Liquid cooled below its saturation temperature."], ["Filter-drier", "Removes moisture and acid from the system."], ["Zeotropic blends (400s)", "Components boil separately: temperature glide, can fractionate, CHARGE AS LIQUID."], ["Azeotropic blends (500s)", "Behave as a single compound. No glide."], ["A2L refrigerants", "Mildly flammable, lower-GWP HFCs (R-32, R-454B) replacing R-410A in new gear."], ["A3 refrigerants", "Highly flammable hydrocarbons: R-290 propane, R-600a isobutane. Spark-proof tools."], ["Safety classification", "Letter = toxicity (A low, B high). Number = flammability (1 none to 3 high, 2L mildly)."], ["Small appliance", "Factory-made, hermetically sealed, 5 lbs or less of refrigerant."], ["Small appliance recovery", "90% with compressor operating, 80% not operating, OR evacuate to 4 in Hg."], ["Passive recovery tricks", "Chill the recovery cylinder (lowers its pressure); heat and tap a dead compressor; access both sides."], ["Piercing valves", "Solderless clamp-on valves leak over time. Don't leave them on the appliance."], ["Small appliance leak repair", "NOT required by EPA. Leak rules start at 50 lbs."], ["Disposal chain", "The final person in the chain (scrap/landfill) must recover remaining refrigerant or verify recovery."], ["Type II scope", "High-pressure appliances (R-22, R-410A, R-134a systems and up): split ACs, supermarket racks."], ["HP evacuation <200 lbs", "0 in Hg (atmospheric) with post-1993 equipment."], ["HP evacuation 200+ lbs", "10 in Hg vacuum."], ["MP evacuation <200 lbs", "10 in Hg vacuum."], ["MP evacuation 200+ lbs", "15 in Hg vacuum."], ["Very-high-pressure evac", "0 in Hg (0 psig). CO2, R-503 class."], ["Leaky system exception", "Can't hold vacuum because of leaks: evacuate to 0 psig, repair, then finish."], ["Leak-repair trigger", "Rules apply at 50 lbs+ of charge (15 lbs for high-GWP HFCs as of Jan 2026)."], ["Leak rates (current)", "Comfort cooling 10%, commercial 20%, industrial process 30% per year. Legacy exams said 15/35/35."], ["Repair window", "30 days after exceeding the threshold."], ["Follow-up inspections", "Tripped appliances get periodic leak inspections (annual comfort, quarterly large commercial/IPR)."], ["Recovery speed", "Remove LIQUID first, then vapor."], ["Charging rule", "Vapor through the low side. Liquid through the high side."], ["Nitrogen sweep", "Flow dry nitrogen through tubing while brazing to prevent oxide scale."], ["Open compressor weak spot", "The rotating shaft seal, especially after sitting idle."], ["Type III scope", "Low-pressure appliances: centrifugal chillers on R-11 and R-123."], ["Low-pressure definition", "Refrigerant boils ABOVE room temp at atmospheric pressure; system runs in a vacuum."], ["Vacuum-world leaks", "Air leaks IN (through gaskets/fittings), refrigerant doesn't spray out."], ["Purge unit", "Removes air/non-condensables from the TOP OF THE CONDENSER. Runs constantly = find the leak."], ["Moisture in purge unit", "Excess water collecting there = leaking chiller tubes. Confirm with a hydrostatic tube test kit."], ["LP evacuation", "25 mm Hg ABSOLUTE with post-1993 equipment (25 in Hg with pre-1993). mm vs inches is the trap."], ["LP leak test max", "10 psig. Above that the rupture disc fails."], ["Rupture disc", "Relief device on the evaporator, lets go at about 15 psig."], ["Charge vapor first", "Liquid into a deep vacuum boils, freezes water in the tubes, cracks them."], ["Vapor charge target", "Until system pressure = saturation temperature of about 36 F (above freezing), then liquid."], ["Charging valve", "Centrifugal chillers charge through the EVAPORATOR charging valve."], ["Freeze prevention (evac)", "Circulate water through the tubes during evacuation; nitrogen can raise pressure on a wet system."], ["Oil removal", "Heat oil to about 130 F first: hot oil holds less dissolved refrigerant."], ["R-123 room requirements", "ASHRAE 15: refrigerant-specific sensor for R-123; oxygen deprivation sensor for all refrigerants."], ["Major repair", "Compressor, condenser, or evaporator replacement. Triggers full evacuation levels."], ["MVAC", "Car AC = Section 609, not on this exam."]], MCQS=[["Which agency administers refrigerant-handling certification under Section 608?", ["EPA", "OSHA", "DOT", "DOE"], 0, "Section 608 of the Clean Air Act is administered and enforced by the EPA.", "Core: Regs & Ozone"], ["Section 608 certification is required to do what to stationary equipment?", ["Only to sell refrigerant", "Service, maintain, repair, or dispose of equipment containing refrigerant", "Only to install ductwork", "Only to design systems"], 1, "608 cert is required for anyone who maintains, services, repairs, or disposes of equipment containing refrigerant.", "Core: Regs & Ozone"], ["How long is a Section 608 certification valid?", ["1 year", "5 years", "10 years", "For life, it never expires"], 3, "608 certification is lifetime; no renewal or continuing-ed is required by the EPA.", "Core: Regs & Ozone"], ["To work on every type of stationary equipment, which certification do you need?", ["Type I", "Type II", "Type III", "Universal"], 3, "Universal covers all stationary refrigeration and AC equipment. It requires passing Core plus Type I, II, and III.", "Core: Regs & Ozone"], ["What is the minimum score to pass each section of the 608 exam?", ["50%", "60%", "70% (18 of 25)", "90%"], 2, "Each section is 25 questions; you must answer 18 correctly (70%) to pass that section.", "Core: Regs & Ozone"], ["Motor vehicle air conditioners (MVACs) are certified under which section?", ["Section 608", "Section 609", "Section 610", "Section 611"], 1, "MVAC work falls under Section 609, not 608. 608 covers stationary equipment.", "Core: Regs & Ozone"], ["Knowingly venting which refrigerants is illegal?", ["Only CFCs", "Only HCFCs", "CFCs, HCFCs, and HFC substitutes", "Only ammonia"], 2, "Venting is banned for CFCs/HCFCs (since 1992) and was extended to HFC substitutes (since 1995).", "Core: Regs & Ozone"], ["Which release does NOT violate the venting prohibition?", ["Dumping refrigerant to atmosphere during service", "A small de minimis release made in good faith during recovery or recycling", "Venting during disposal", "Releasing after a leak repair"], 1, "De minimis (minimal, unavoidable) releases during good-faith recovery/recycling are not violations.", "Core: Regs & Ozone"], ["Which class of refrigerant has the highest ozone depletion potential (ODP)?", ["CFCs", "HCFCs", "HFCs", "HCs"], 0, "CFCs (e.g., R-12) have the highest ODP. HCFCs are lower; HFCs have zero ODP.", "Core: Regs & Ozone"], ["HFC refrigerants like R-134a and R-410A have what ozone depletion potential?", ["The highest of any refrigerant", "Zero ODP (but they do have global warming potential)", "Equal to CFCs", "Undefined"], 1, "HFCs contain no chlorine, so their ODP is zero. They are regulated instead for their GWP.", "Core: Regs & Ozone"], ["The Montreal Protocol is an international agreement to do what?", ["Set HVAC wages", "Phase out ozone-depleting substances", "Standardize tools", "Tax refrigerant"], 1, "The Montreal Protocol commits nations to phasing out ozone-depleting substances like CFCs and HCFCs.", "Core: Regs & Ozone"], ["The AIM Act drives the phasedown of which refrigerants?", ["CFCs", "HCFCs", "HFCs", "Ammonia"], 2, "The AIM Act mandates an 85% phasedown of HFC production/consumption and pushes low-GWP (A2L) substitutes.", "Core: Regs & Ozone"], ["Complete phaseout of R-22 production and import took effect on what date?", ["January 1, 2010", "January 1, 2015", "January 1, 2020", "January 1, 2025"], 2, "Jan 1, 2010 banned R-22 in new equipment; Jan 1, 2020 banned all production/import. Only reclaimed/stockpiled R-22 remains.", "Core: Regs & Ozone"], ["Since January 1, 2018, refrigerant (including HFCs) may be sold only to whom?", ["Anyone over 18", "Certified technicians (or those buying for resale)", "Licensed plumbers", "Homeowners with a permit"], 1, "The sales restriction limits refrigerant purchases to 608/609-certified technicians.", "Core: Regs & Ozone"], ["The EPA's SNAP program identifies what?", ["Approved tool brands", "Acceptable substitute refrigerants", "Technician test centers", "Recovery cylinder colors"], 1, "SNAP (Significant New Alternatives Policy) lists acceptable substitutes for ozone-depleting refrigerants.", "Core: Regs & Ozone"], ["Civil penalties for knowingly venting refrigerant can reach what level?", ["$500 total", "A one-time $5,000 fine", "Tens of thousands of dollars per day, per violation", "No penalty"], 2, "Fines run per day, per violation, in the tens of thousands. The figure has escalated over time ($25,000 to $37,500 to ~$44,539); pick the per-day, per-violation answer.", "Core: Regs & Ozone"], ["A2L refrigerants such as R-32 and R-454B are classified as what?", ["Highly toxic", "Mildly flammable, lower toxicity", "Non-flammable, high toxicity", "Ozone-depleting"], 1, "A2L = lower toxicity (A), mildly flammable (2L). They are low-GWP replacements for R-410A.", "Core: Regs & Ozone"], ["Which is a flammable (A3) refrigerant?", ["R-410A", "R-22", "R-290 (propane)", "R-134a"], 2, "R-290 (propane) and R-600a (isobutane) are A3, highly flammable hydrocarbons used in some small appliances.", "Core: Regs & Ozone"], ["What does 'recover' refrigerant mean?", ["Process it to like-new purity", "Remove it from a system and store it in an external container", "Sell it to another shop", "Vent it safely"], 1, "Recover = remove refrigerant and store it externally, with no cleaning or testing.", "Core: Recover/Recycle/Reclaim"], ["What does 'recycle' refrigerant mean?", ["Reprocess to AHRI 700 purity", "Clean it on-site by oil separation and passes through filter-driers for reuse by the same owner", "Vent it", "Recover only"], 1, "Recycle = field cleaning (oil separation, moisture/acid removal via filter-driers) for reuse on equipment owned by the same person.", "Core: Recover/Recycle/Reclaim"], ["What does 'reclaim' refrigerant mean?", ["A quick field cleanup", "Reprocess it to meet the AHRI 700 purity standard, the only way to certify it for resale", "Recover into a cylinder", "Mix two refrigerants"], 1, "Reclaim = reprocess to AHRI 700 (like-new) purity. It is the only path to legally change ownership of recovered refrigerant.", "Core: Recover/Recycle/Reclaim"], ["Reclaimed refrigerant must be purified to meet which standard?", ["ASHRAE 15", "AHRI/ARI 700", "DOT 39", "OSHA 1910"], 1, "Reclaimed refrigerant must meet the AHRI 700 standard (about 99.5% purity).", "Core: Recover/Recycle/Reclaim"], ["Recovered refrigerant may be reused without reclaiming on what?", ["Any customer's system", "The same system or another system owned by the same person", "A system owned by anyone", "Only brand-new equipment"], 1, "Recovered/recycled refrigerant can go back to the same system or another owned by the same person. Changing ownership requires reclaiming.", "Core: Recover/Recycle/Reclaim"], ["Recovery equipment manufactured after November 15, 1993 must be what?", ["Painted gray", "Certified by an EPA-approved testing organization (e.g., UL/ETL)", "Made of copper", "Rated for 600V"], 1, "Post-Nov-15-1993 recovery/recycling equipment must be third-party certified to meet EPA recovery efficiency standards.", "Core: Recover/Recycle/Reclaim"], ["Self-contained (active) recovery equipment is defined by what?", ["It uses the appliance's own compressor", "It has its own compressor or pump to remove refrigerant", "It only works on small appliances", "It vents to atmosphere"], 1, "Active (self-contained) recovery units have their own compressor/pump. Passive (system-dependent) units rely on the appliance.", "Core: Recover/Recycle/Reclaim"], ["System-dependent (passive) recovery may be used only on appliances containing how much refrigerant?", ["Any amount", "15 pounds or less", "100 pounds or less", "200 pounds or more"], 1, "Passive recovery is limited to appliances with 15 lbs or less of refrigerant.", "Core: Recover/Recycle/Reclaim"], ["Before transferring recovered refrigerant into a recovery cylinder, you should do what?", ["Fill it completely", "Evacuate the empty cylinder first", "Heat the cylinder", "Add nitrogen"], 1, "Always evacuate an empty recovery cylinder before charging it, to avoid non-condensables and contamination.", "Core: Recover/Recycle/Reclaim"], ["Which is prohibited when handling recovery cylinders?", ["Labeling the cylinder", "Mixing different refrigerants in the same cylinder", "Evacuating before use", "Keeping it upright"], 1, "Never mix refrigerant types in one recovery cylinder; mixed refrigerant cannot be reclaimed and must be destroyed.", "Core: Recover/Recycle/Reclaim"], ["Refrigerant/recovery cylinders must never be filled above what level?", ["50% by weight", "80% of capacity by weight", "95% by weight", "100% by weight"], 1, "Never exceed 80% fill by weight, leaving room for liquid expansion as temperature rises (prevents rupture).", "Core: Safety & Handling"], ["A standard refrigerant recovery cylinder is colored how?", ["All green", "Gray body with a yellow top", "All blue", "Red with white top"], 1, "Recovery cylinders are gray with a yellow shoulder/top.", "Core: Safety & Handling"], ["DOT requires refillable refrigerant cylinders be hydrostatically retested how often?", ["Every year", "Every 5 years", "Every 10 years", "Never"], 1, "Refillable DOT cylinders must be hydrostatically tested and stamped every 5 years.", "Core: Safety & Handling"], ["Disposable (single-use) refrigerant cylinders are DOT-39 and must be what?", ["Refilled when empty", "Never refilled", "Hydro-tested yearly", "Painted gray"], 1, "DOT-39 disposable cylinders are non-refillable; refilling them is illegal and dangerous.", "Core: Safety & Handling"], ["The maximum recommended storage temperature for a refrigerant cylinder is about what?", ["80 F", "100 F", "125 F", "200 F"], 2, "Keep cylinders below 125 F. Heat raises internal pressure and risks rupture.", "Core: Safety & Handling"], ["The main danger of refrigerant leaking into a confined, poorly ventilated space is what?", ["Fire", "Oxygen displacement and asphyxiation", "Electrocution", "Ozone creation"], 1, "Most refrigerants are heavier than air, settle low, and displace oxygen, risking suffocation.", "Core: Safety & Handling"], ["Liquid refrigerant contacting skin or eyes can cause what?", ["Sunburn", "Frostbite", "Mild rash only", "Nothing"], 1, "Liquid refrigerant boils at low temperature and causes frostbite on contact. Wear gloves and eye protection.", "Core: Safety & Handling"], ["When refrigerant contacts an open flame or very high heat, it can break down into what?", ["Harmless water vapor", "Toxic, corrosive gases such as phosgene and acids", "Pure oxygen", "Nitrogen"], 1, "Heat decomposes refrigerant into toxic/corrosive byproducts (phosgene, hydrofluoric/hydrochloric acid). Ventilate and avoid open flame.", "Core: Safety & Handling"], ["To pressure-test a system for leaks, you should use what?", ["Oxygen", "Acetylene", "Dry nitrogen (with a trace of refrigerant if using an electronic detector)", "Compressed air only"], 2, "Use dry nitrogen. Add a trace of refrigerant only if needed for an electronic detector. Never use oxygen or acetylene.", "Core: Safety & Handling"], ["Why must you never pressurize a system with oxygen?", ["It is too expensive", "It can violently explode in the presence of oil", "It freezes the lines", "It is illegal to buy"], 1, "Oxygen reacting with compressor oil under pressure can cause a violent explosion.", "Core: Safety & Handling"], ["A halide torch leak detector changes flame color in the presence of what?", ["Any refrigerant", "Chlorinated refrigerants (CFCs/HCFCs) only", "HFCs only", "Nitrogen"], 1, "A halide torch turns the flame green/blue when chlorine is present, so it works on CFCs/HCFCs but not chlorine-free HFCs.", "Core: Safety & Handling"], ["Non-condensables (air) trapped in a system cause what symptom?", ["Low head pressure", "Abnormally high head/discharge pressure", "No effect", "Frozen evaporator only"], 1, "Air will not condense, so it raises discharge/head pressure above the P-T chart value for the ambient.", "Core: Safety & Handling"], ["A strong acrid odor while recovering refrigerant usually indicates what?", ["Normal operation", "A compressor burnout (acid present)", "Low charge", "A clogged filter only"], 1, "Acrid odor signals a burnout. Recover, then install a suction-line filter-drier and change the oil to remove acid.", "Core: Safety & Handling"], ["It is a violation to change compressor oil at a pressure higher than what?", ["0 psig", "5 psig", "15 psig", "50 psig"], 1, "Reduce system pressure to no more than 5 psig before removing oil so dissolved refrigerant in the oil is recovered.", "Core: Safety & Handling"], ["You should never energize a hermetic compressor motor under what condition?", ["Full charge", "A deep vacuum", "Normal pressure", "With gauges attached"], 1, "Energizing windings under deep vacuum can arc and damage the motor. Never run a compressor in a vacuum.", "Core: Safety & Handling"], ["Pulling a vacuum too quickly on a wet system can do what?", ["Speed up evacuation safely", "Freeze the moisture into ice, trapping it", "Overcharge the system", "Nothing"], 1, "Rapid pressure drop can freeze water into ice. Slow down or introduce nitrogen to keep moisture in vapor form.", "Core: Safety & Handling"], ["As the pressure of a refrigerant increases, its saturation (boiling) temperature does what?", ["Decreases", "Increases", "Stays the same", "Becomes zero"], 1, "Higher pressure raises the saturation temperature. This pressure-temperature relationship is the basis of the P-T chart.", "Core: Refrigerants & Cylinders"], ["A pressure-temperature (P-T) chart is used to do what?", ["Size ductwork", "Find the saturation temperature for a given pressure (and vice versa)", "Measure airflow", "Rate a compressor"], 1, "A P-T chart relates a refrigerant's pressure to its saturation temperature, used to set superheat and subcooling.", "Core: Refrigerants & Cylinders"], ["Superheat is best described as what?", ["Liquid below its saturation temperature", "Vapor temperature above its saturation temperature", "The condenser pressure", "The full charge weight"], 1, "Superheat is how many degrees the vapor is above saturation, measured at the evaporator outlet/suction line.", "Core: Refrigerants & Cylinders"], ["Subcooling is best described as what?", ["Vapor above its saturation temperature", "Liquid refrigerant below its saturation temperature", "The suction pressure", "Airflow across the coil"], 1, "Subcooling is how many degrees the liquid is below saturation, measured at the condenser outlet/liquid line.", "Core: Refrigerants & Cylinders"], ["A filter-drier is installed in a system to do what?", ["Add oil", "Remove moisture and acid", "Increase pressure", "Meter refrigerant"], 1, "The filter-drier removes moisture, acid, and particulate. A suction-line drier is added after a burnout.", "Core: Refrigerants & Cylinders"], ["Which pressure class does R-410A fall into?", ["Low-pressure", "Medium-pressure", "High-pressure", "Not a refrigerant"], 2, "R-410A is a high-pressure (Type II) refrigerant; it operates at notably higher pressures than R-22.", "Core: Refrigerants & Cylinders"], ["A2L refrigerants commonly replacing R-410A in new equipment include which?", ["R-12 and R-22", "R-32 and R-454B", "R-11 and R-123", "R-502 and R-13"], 1, "R-32 and R-454B are the primary low-GWP A2L replacements for R-410A in new residential/light-commercial systems.", "Core: Refrigerants & Cylinders"], ["A 'small appliance' is one factory-manufactured, charged, and hermetically sealed with how much refrigerant?", ["5 pounds or less", "15 pounds or less", "50 pounds or less", "Any amount"], 0, "A small appliance is factory-sealed with 5 lbs or less of refrigerant.", "Type I: Small Appliance"], ["Which of these is a small appliance?", ["A 30-ton rooftop unit", "A residential central AC", "A household refrigerator or window air conditioner", "A centrifugal chiller"], 2, "Household refrigerators, window ACs, PTACs, dehumidifiers, vending machines, and water coolers are small appliances.", "Type I: Small Appliance"], ["Using self-contained recovery equipment on a small appliance with an OPERATING compressor, you must recover what?", ["80% of the refrigerant", "90% of the refrigerant", "100% of the refrigerant", "50% of the refrigerant"], 1, "Compressor working: recover 90%. Compressor not working: recover 80%.", "Type I: Small Appliance"], ["With a NON-operating compressor (post-1993 self-contained equipment), the small-appliance recovery requirement is what?", ["90%", "80%", "70%", "60%"], 1, "If the compressor is not functional, you must recover at least 80% of the charge.", "Type I: Small Appliance"], ["Recovery requirements for a small appliance can alternatively be met by evacuating it to what vacuum?", ["1 inch Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 1, "Evacuating a small appliance to 4 inches of mercury vacuum satisfies the recovery rule.", "Type I: Small Appliance"], ["Does the EPA require leak repair on small appliances?", ["Yes, within 30 days", "No, but repair leaks when possible to conserve refrigerant", "Yes, within 1 year", "Only on window units"], 1, "Leak repair rules do not apply to small appliances, though good practice is to fix leaks anyway.", "Type I: Small Appliance"], ["The final person in the disposal chain of a small appliance (e.g., scrap recycler) must do what?", ["Crush it immediately", "Recover the refrigerant or verify it was already recovered", "Vent the refrigerant", "Refill it"], 1, "The last disposer must ensure and document that refrigerant was recovered before final disposal.", "Type I: Small Appliance"], ["Isobutane (R-600a) is approved as a substitute for use in what?", ["Retrofitting old chillers", "New household refrigerators and freezers", "Car AC", "Commercial rooftop units"], 1, "R-600a is approved for NEW household refrigerators/freezers, not as a retrofit into existing small appliances.", "Type I: Small Appliance"], ["Low-loss fittings on recovery hoses are required to do what?", ["Increase flow", "Minimize refrigerant release when hoses are connected or disconnected", "Filter the oil", "Measure pressure"], 1, "Low-loss fittings close manually or automatically to limit refrigerant loss at the hose connections.", "Type I: Small Appliance"], ["Type II certification covers which appliances?", ["Small sealed appliances", "High-pressure appliances (R-22, R-410A, R-404A, etc.)", "Low-pressure chillers", "Motor vehicle AC"], 1, "Type II = high-pressure systems: most residential/commercial split systems, rooftop units, and commercial refrigeration.", "Type II: High-Pressure"], ["Using post-Nov-15-1993 equipment, a high-pressure appliance with LESS than 200 lbs must be evacuated to what?", ["0 inches Hg vacuum", "4 inches Hg", "15 inches Hg", "25 inches Hg"], 0, "Current EPA table: high-pressure under 200 lbs = 0 inches Hg. Note: some older exam versions list 10 inches Hg for this; if 0 is not offered, pick 10.", "Type II: High-Pressure"], ["Using post-1993 equipment, a high-pressure appliance with 200 lbs OR MORE must be evacuated to what?", ["0 inches Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 2, "High-pressure, 200 lbs or more: 10 inches Hg vacuum.", "Type II: High-Pressure"], ["Using post-1993 equipment, a medium-pressure appliance with LESS than 200 lbs is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 1, "Medium-pressure under 200 lbs: 10 inches Hg vacuum.", "Type II: High-Pressure"], ["Using post-1993 equipment, a medium-pressure appliance with 200 lbs OR MORE is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 2, "Medium-pressure 200 lbs or more: 15 inches Hg vacuum.", "Type II: High-Pressure"], ["A very high-pressure appliance must be evacuated to what level?", ["0 inches Hg (0 psig)", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 0, "Very high-pressure equipment is evacuated to 0 inches Hg (0 psig). Pulling a deep vacuum risks damage.", "Type II: High-Pressure"], ["Mandatory leak-repair rules apply only to systems containing how much refrigerant?", ["5 lbs or more", "15 lbs or more", "50 lbs or more (15 lbs for high-GWP HFCs as of Jan 2026)", "200 lbs or more"], 2, "Leak-repair thresholds apply at 50 lbs for ODS systems; the AIM Act lowered it to 15 lbs for high-GWP HFCs effective Jan 2026.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for a comfort-cooling system?", ["5%", "10%", "20%", "35%"], 1, "Comfort cooling = 10% per year (current 2019-revision rule). Older exam versions used 15%.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for a commercial refrigeration system?", ["10%", "20%", "30%", "35%"], 1, "Commercial refrigeration = 20% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for an industrial process refrigeration system?", ["10%", "20%", "30%", "50%"], 2, "Industrial process refrigeration = 30% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure"], ["Once a leak exceeds the applicable threshold, repair must be completed within how long?", ["24 hours", "7 days", "30 days", "1 year"], 2, "Repair (and verification) must be completed within 30 days, or a retrofit/retirement plan must be filed.", "Type II: High-Pressure"], ["Annual leak rate is calculated how?", ["Charge divided by run hours", "Refrigerant added over 12 months divided by full charge, times 100", "Leaks counted per month", "System age in years"], 1, "Annual leak rate = (refrigerant added over 12 months / full charge) x 100.", "Type II: High-Pressure"], ["Owners of systems over 50 lbs must keep servicing records of what?", ["Only the technician's name", "The amount and type of refrigerant added/removed", "Customer phone numbers", "Tool inventory"], 1, "Records of refrigerant added and removed must be kept (commonly retained for 3 years) for large systems.", "Type II: High-Pressure"], ["When charging a high-pressure system, liquid refrigerant should be added where?", ["Into the suction of a running compressor directly", "Into the liquid line / high side with the system off (or throttled to vapor on the low side)", "Into the crankcase", "Anywhere"], 1, "Charge liquid into the high side with the unit off; if adding to the low side of a running unit, throttle to vapor to avoid slugging.", "Type II: High-Pressure"], ["The deep-vacuum (dehydration) target before charging a system is about what?", ["29 inches Hg only", "500 microns", "5 psig", "10 inches Hg"], 1, "Pull the system down to roughly 500 microns and confirm it holds before charging.", "Type II: High-Pressure"], ["After reaching the target vacuum, you should do what?", ["Charge immediately", "Isolate the pump and watch for a pressure rise (indicates moisture or a leak)", "Open the system", "Add nitrogen"], 1, "Valve off the pump and watch the micron gauge; a rising pressure means remaining moisture or a leak.", "Type II: High-Pressure"], ["Type III certification covers which appliances?", ["Window units", "Low-pressure appliances (R-11, R-113, R-123)", "High-pressure split systems", "Car AC"], 1, "Type III = low-pressure systems, typically centrifugal chillers using R-11, R-113, or R-123.", "Type III: Low-Pressure"], ["A low-pressure refrigerant has a boiling point at atmospheric pressure of what?", ["Below -50 C", "Above 50 F (10 C)", "Exactly 0 F", "Below -100 F"], 1, "Low-pressure refrigerants boil above 10 C (50 F) at atmospheric pressure, so the system runs in a vacuum.", "Type III: Low-Pressure"], ["Using post-1993 equipment, a low-pressure appliance must be evacuated to what?", ["10 inches Hg", "15 inches Hg", "25 mm Hg absolute", "0 psig"], 2, "Low-pressure equipment must be evacuated to 25 mm Hg absolute.", "Type III: Low-Pressure"], ["The low side of a low-pressure chiller normally operates at what?", ["Well above atmospheric pressure", "In a vacuum (below atmospheric)", "Exactly atmospheric", "At 410 psig"], 1, "Low-pressure systems run in a vacuum on the low side, which is why air/moisture tends to leak in.", "Type III: Low-Pressure"], ["A purge unit on a low-pressure chiller removes what?", ["Excess oil", "Non-condensables (air and moisture) that accumulate", "Refrigerant for storage", "Scale from tubes"], 1, "Because the system runs in a vacuum, air leaks in; the purge unit removes those non-condensables.", "Type III: Low-Pressure"], ["When leak-testing a low-pressure appliance, you must NOT pressurize it above what?", ["10 psig", "30 psig", "50 psig", "150 psig"], 0, "Low-pressure shells are not built for high pressure; do not pressurize above 10 psig for leak testing.", "Type III: Low-Pressure"], ["A rupture disc on a low-pressure chiller is typically set to relieve at about what pressure?", ["5 psig", "15 psig", "150 psig", "500 psig"], 1, "Low-pressure chiller rupture discs commonly relieve around 15 psig to protect the low-pressure shell.", "Type III: Low-Pressure"], ["Recovery from a low-pressure chiller is slow and is often aided by what?", ["Cooling the refrigerant", "Warming the refrigerant / using the recovery unit to lower system pressure", "Adding oil", "Venting non-condensables to speed it up"], 1, "High-boiling low-pressure refrigerant recovers slowly; warming the liquid and pulling pressure down speeds removal.", "Type III: Low-Pressure"], ["Where is the ozone layer that Section 608 aims to protect located?", ["In the stratosphere", "At ground level", "In the troposphere", "Inside cloud formations"], 0, "Stratospheric ozone absorbs harmful UV radiation. Ground-level ozone is smog, a different problem.", "Core: Regs & Ozone"], ["Why is stratospheric ozone depletion harmful?", ["More ultraviolet radiation reaches the earth's surface", "It causes acid rain", "It cools the planet too quickly", "It increases oxygen levels"], 0, "Less ozone = more UV at the surface = skin cancer, cataracts, crop damage. That's the whole point of the CFC phaseout.", "Core: Regs & Ozone"], ["What actually destroys ozone molecules when a CFC reaches the stratosphere?", ["The chlorine atom released when UV breaks the CFC apart", "The fluorine atom", "The carbon backbone", "The refrigerant oil carried with it"], 0, "UV cracks the CFC, freeing chlorine. One chlorine atom destroys ozone molecules over and over. Chlorine content is why CFC > HCFC > HFC in ODP.", "Core: Regs & Ozone"], ["R-22 belongs to which refrigerant class?", ["CFC", "HCFC", "HFC", "HFO"], 1, "R-22 = HCFC (some chlorine, lower ODP than CFCs). R-12 = CFC. R-134a/R-410A = HFC (no chlorine).", "Core: Regs & Ozone"], ["Can an uncertified apprentice handle refrigerant?", ["Yes, under the direct supervision of a certified technician", "No, never under any circumstances", "Yes, with no restrictions", "Only if the appliance holds under 5 pounds"], 0, "The apprentice exemption: allowed while closely and continually supervised by a certified tech.", "Core: Regs & Ozone"], ["400-series blends like R-410A and R-407C are which type of blend?", ["Zeotropic (temperature glide, can fractionate)", "Azeotropic (behaves as one compound)", "Single-compound refrigerants", "Inorganic refrigerants"], 0, "400-series = ZEOtropic: components boil at different temps, so the blend has glide and can fractionate. 500-series = azeotropic, acts like one refrigerant.", "Core: Refrigerants & Cylinders"], ["Why must zeotropic blends be charged as a liquid?", ["Vapor charging lets components fractionate, changing the blend's composition", "Liquid charging is faster in all systems", "Vapor charging overheats the compressor", "Liquid keeps the cylinder cooler"], 0, "Pull vapor off a zeotrope and the lighter component leaves first: the blend left behind is off-spec. Charge liquid to keep the recipe intact.", "Core: Refrigerants & Cylinders"], ["What is temperature glide?", ["The range of temperatures over which a blend evaporates or condenses at constant pressure", "The temperature drop across a filter-drier", "The superheat added by the compressor", "The difference between high-side and low-side pressure"], 0, "Zeotropic blends don't boil at one temperature; they slide across a range. Single compounds and azeotropes have no glide.", "Core: Refrigerants & Cylinders"], ["Can a vacuum pump alone be used to recover refrigerant from a small appliance?", ["No, a vacuum pump exhausts to the atmosphere, which is illegal venting", "Yes, if it pulls at least 4 in Hg", "Yes, on appliances under 5 pounds", "Only on systems built before 1993"], 0, "A vacuum pump just moves refrigerant into the room. Recovery requires certified recovery equipment that captures it.", "Type I: Small Appliance"], ["During system-dependent (passive) recovery, chilling the recovery cylinder in ice does what?", ["Lowers cylinder pressure so refrigerant migrates into it faster", "Prevents the cylinder from overfilling", "Raises the cylinder's saturation temperature", "Nothing, temperature has no effect"], 0, "Cold cylinder = low pressure = pressure difference pulls refrigerant in. Classic passive-recovery speed trick.", "Type I: Small Appliance"], ["What should be done with a solderless piercing-type access valve after service?", ["Remove it or replace it with a permanent leak-tight fitting, since they tend to leak over time", "Leave it installed for the next technician", "Cap it with tape", "Nothing, they are permanently leak-tight"], 0, "Clamp-on piercing valves leak with age. Don't leave them on the appliance as permanent fittings.", "Type I: Small Appliance"], ["When recovering from a small appliance with a non-operating compressor using passive recovery, you should:", ["Heat and gently tap the compressor, and recover from both the high and low sides", "Recover from the high side only", "Run the compressor anyway", "Skip recovery entirely"], 0, "Non-running compressor traps refrigerant in the oil. Heating/tapping frees it; accessing both sides speeds migration.", "Type I: Small Appliance"], ["When working on an R-600a (isobutane) appliance, which precaution applies?", ["Eliminate ignition sources and use spark-proof tools, it's an A3 flammable", "No special precautions, it's non-flammable", "Ventilation must be sealed off", "Only glass-lined recovery cylinders may be used"], 0, "R-600a is A3, highly flammable. Small charge sizes keep it legal in fridges, but sparks near a leak are the hazard.", "Type I: Small Appliance"], ["Refrigerant recovered from a small appliance that will be sold to another owner must first be:", ["Reclaimed to AHRI 700 purity by a certified reclaimer", "Recycled on-site with any machine", "Filtered through a drier once", "Nothing, recovered refrigerant can always be resold"], 0, "Change of ownership = reclaim to AHRI 700. Reuse without reclaiming is only allowed back into the same owner's equipment.", "Type I: Small Appliance"], ["A high-pressure system has leaks so bad it cannot reach the required recovery vacuum. Before repair you should evacuate it to:", ["0 psig (atmospheric pressure)", "10 in Hg vacuum anyway", "25 mm Hg absolute", "No evacuation is required"], 0, "Leaky-system exception: pulling a vacuum would just suck air in through the leak. Take it to 0 psig, repair, then finish the job.", "Type II: High-Pressure"], ["Which gas should flow through tubing while brazing on an opened system?", ["Dry nitrogen", "Oxygen", "Compressed air", "Refrigerant vapor"], 0, "A nitrogen sweep prevents oxidation scale inside the tubing. Never oxygen or air (explosion risk with oil).", "Type II: High-Pressure"], ["To speed recovery from a large high-pressure system, you should remove:", ["Liquid refrigerant first, then vapor", "Vapor first, then liquid", "Only vapor", "Oil first"], 0, "Liquid moves pounds fast; vapor recovery is slow. Pull liquid first, finish with vapor.", "Type II: High-Pressure"], ["An open (non-hermetic) compressor that has sat unused for months is most likely to leak from the:", ["Shaft seal", "Discharge valve", "Oil plug", "Terminal box"], 0, "The rotating shaft seal dries out when idle. Classic exam answer for open-drive compressors.", "Type II: High-Pressure"], ["Under the leak-repair rules, appliances that have exceeded the leak threshold are subject to:", ["Periodic leak inspections (quarterly for large commercial/IPR, annual for comfort cooling)", "Immediate mandatory retirement", "Weekly refrigerant sampling", "Nothing further after the repair"], 0, "Post-2019 rules add follow-up inspections once an appliance over 50 lbs trips its threshold.", "Type II: High-Pressure"], ["Refrigerant should be charged into a high-pressure system as vapor through the:", ["Low side", "High side", "Oil fill port", "Purge unit"], 0, "Vapor charges through the low side; liquid through the high side (liquid line). Reversing either can slug the compressor.", "Type II: High-Pressure"], ["Which refrigerants are used in low-pressure (Type III) chillers?", ["R-11 and R-123", "R-22 and R-410A", "R-134a and R-404A", "R-290 and R-600a"], 0, "R-11 (CFC, phased out) and its replacement R-123 (HCFC). Both boil above room temperature at atmospheric pressure.", "Type III: Low-Pressure"], ["Because a low-pressure chiller operates in a vacuum, a leak causes:", ["Air to leak INTO the system", "Refrigerant to spray out under pressure", "Immediate compressor failure", "Oil loss only"], 0, "Below atmospheric pressure, leaks run backward: air and moisture get pulled in. That's why purge units exist.", "Type III: Low-Pressure"], ["Where do air and non-condensables collect in a low-pressure chiller, and what removes them?", ["At the top of the condenser; the purge unit removes them", "In the evaporator; the filter-drier removes them", "In the oil sump; the oil heater removes them", "In the cooling tower; the fan removes them"], 0, "Air rises to the highest-pressure point, the top of the condenser. The purge unit vents it while recovering entrained refrigerant.", "Type III: Low-Pressure"], ["Excessive purge-unit run time on a low-pressure chiller usually indicates:", ["The system has an air leak that needs to be found and repaired", "The refrigerant charge is too high", "The chilled water is too cold", "Normal operation"], 0, "Purge running constantly = air constantly entering = leak. Fix the leak, don't just let the purge eat refrigerant.", "Type III: Low-Pressure"], ["Why is refrigerant vapor charged into an evacuated chiller before any liquid?", ["Liquid entering a deep vacuum boils violently and can freeze the water in the tubes", "Vapor is cheaper than liquid", "Liquid cannot flow through the charging valve", "Vapor charges faster"], 0, "Boiling liquid in a vacuum pulls tube temps below 32 F and freezes the water side: cracked tubes. Vapor first, always.", "Type III: Low-Pressure"], ["You should charge vapor into an evacuated chiller until:", ["System pressure corresponds to a saturation temperature of about 36 F (above freezing)", "The rupture disc lifts", "The purge unit starts", "Exactly 15 minutes have passed"], 0, "Raise pressure until the saturation temperature is safely above 32 F (about 36 F), then switch to liquid.", "Type III: Low-Pressure"], ["A centrifugal chiller is charged through the:", ["Evaporator charging valve", "High-side compressor service valve", "Condenser drain", "Purge unit connection"], 0, "The evaporator charging valve is the standard (lowest) charge point on a centrifugal machine.", "Type III: Low-Pressure"], ["During evacuation of a chiller, freezing of the water in the tubes is prevented by:", ["Circulating water through the chiller tubes during evacuation", "Adding antifreeze to the refrigerant", "Evacuating as fast as possible", "Closing all water valves"], 0, "Moving water resists freezing and carries heat in. Alternative on a wet system: break the vacuum with nitrogen to raise pressure.", "Type III: Low-Pressure"], ["Before removing oil from a low-pressure system, the oil should be heated to about 130 F because:", ["Hot oil holds less dissolved refrigerant, minimizing refrigerant loss", "Cold oil is too thick to pump", "Heating sterilizes the oil", "It resets the oil pressure switch"], 0, "Refrigerant dissolves in cold oil. Heat it and the refrigerant boils out for recovery instead of leaving with the oil.", "Type III: Low-Pressure"], ["A hydrostatic tube test kit is used on a chiller to:", ["Determine whether a water tube leaks", "Measure refrigerant purity", "Calibrate the purge unit", "Test the rupture disc"], 0, "Suspected tube leak = hydrostatic tube test. Moisture collecting in the purge unit is the telltale symptom of leaking tubes.", "Type III: Low-Pressure"]], SEQ=[["Refrigeration cycle", ["Compressor (low-pressure vapor in, high-pressure vapor out)", "Condenser (vapor rejects heat, becomes liquid)", "Metering device (pressure drops)", "Evaporator (liquid absorbs heat, boils to vapor)"]], ["Recovery procedure on a large system", ["Connect with low-loss fittings", "Recover liquid refrigerant first", "Recover remaining vapor", "Reach the required evacuation level", "Verify the vacuum holds (no pressure rebound from trapped liquid)"]], ["Charging an evacuated low-pressure chiller", ["System sits at deep vacuum after evacuation", "Charge VAPOR through the evaporator charging valve", "Continue until pressure = saturation temp of about 36 F", "Switch to liquid charging", "Complete the charge"]], ["How a CFC destroys ozone", ["CFC released at ground level", "Drifts to the stratosphere", "UV radiation breaks off a chlorine atom", "Chlorine destroys ozone molecules repeatedly", "More UV reaches the surface"]], ["Leak-repair compliance timeline", ["Appliance over 50 lbs exceeds its leak rate", "Repair within 30 days", "Verification test the repair", "Periodic follow-up leak inspections"]], ["Small appliance disposal chain", ["Owner discards appliance", "Technician or final processor recovers remaining refrigerant", "Recovery verified before scrapping", "Appliance crushed/recycled"]]], MATCH=[["Evacuation levels (post-1993 equipment)", [["High-pressure, under 200 lbs", "0 in Hg"], ["High-pressure, 200 lbs or more", "10 in Hg"], ["Medium-pressure, under 200 lbs", "10 in Hg"], ["Medium-pressure, 200 lbs or more", "15 in Hg"], ["Very high-pressure", "0 in Hg (0 psig)"], ["Low-pressure", "25 mm Hg ABSOLUTE"]]], ["Small appliance numbers", [["Compressor operating", "Recover 90%"], ["Compressor not operating", "Recover 80%"], ["Alternative standard", "Evacuate to 4 in Hg"], ["Small appliance charge limit", "5 lbs or less"], ["Passive recovery limit", "15 lbs or less"]]], ["Leak rates (current law)", [["Comfort cooling", "10% per year"], ["Commercial refrigeration", "20% per year"], ["Industrial process", "30% per year"], ["Repair deadline", "30 days"], ["Rule threshold", "50 lbs charge"]]], ["Cylinder facts", [["Maximum fill", "80% by weight"], ["Recovery cylinder colors", "Gray body, yellow top"], ["Hydrostatic retest", "Every 5 years"], ["Disposable DOT-39", "Never refill"], ["Max storage temp", "About 125 F"]]], ["Refrigerant classes", [["R-12", "CFC"], ["R-22", "HCFC"], ["R-410A", "HFC blend"], ["R-32", "A2L (mildly flammable)"], ["R-290 / R-600a", "A3 (flammable hydrocarbon)"], ["R-11 / R-123", "Low-pressure (Type III)"]]], ["Three Rs", [["Recover", "Remove and store, no processing"], ["Recycle", "Clean on-site, reuse same owner"], ["Reclaim", "AHRI 700 purity, required for resale"]]], ["Certification types", [["Type I", "Small appliances, 5 lbs or less"], ["Type II", "High-pressure (splits, racks)"], ["Type III", "Low-pressure chillers"], ["Universal", "All of the above"], ["Section 609", "Car AC, different exam"]]], ["Type III specifics", [["Leak test maximum", "10 psig"], ["Rupture disc setting", "15 psig"], ["Purge unit removes", "Air from top of condenser"], ["Charging valve", "Evaporator"], ["Charge first with", "Vapor (to about 36 F sat temp)"], ["Oil removal prep", "Heat to about 130 F"]]], ["Safety numbers", [["Oil change max pressure", "5 psig"], ["Deep vacuum target", "About 500 microns"], ["Pressure testing gas", "Dry nitrogen, never oxygen"], ["Confined space risk", "Oxygen displacement"], ["Refrigerant + flame", "Toxic decomposition gases"]]], ["P-T concepts", [["Superheat", "Vapor above saturation temp"], ["Subcooling", "Liquid below saturation temp"], ["Pressure rises", "Saturation temp rises"], ["Zeotropic blend (400s)", "Glide, charge as liquid"], ["Azeotropic blend (500s)", "Acts as one compound"]]]], NOTES=[["Read first: how to beat this exam", ["Structure: 25 questions per section (Core + Type I + II + III for Universal), 18 of 25 passes each. Sections score independently, and on SkillCat you retake only what you miss.", "MEMORY DUMP: the second you get scratch paper, write the numbers wall before question 1: the evacuation table, 10/20/30 leak rates, 90/80/4, 80%, 5-year, 125 F, 5 psig, 500 microns, 10 psig, 15 psig, 25 mm Hg, 36 F, 130 F, Nov 15 1993.", "CUT RULE: any question containing 'November 15, 1993' is asking whether the equipment is grandfathered. Post-1993 = the strict modern table.", "CUT RULE: 'mm Hg' belongs to LOW-PRESSURE only (25 mm Hg absolute). If the option says 25 INCHES Hg for a post-1993 low-pressure question, it's the legacy trap.", "Two dual-answer landmines, both flagged in the drill: leak rates (current 10/20/30 vs legacy 15/35/35) and HP-under-200 evacuation (current 0 vs legacy 10 in Hg). Modern proctored exams score current law. Read the stem for era hints before answering."]], ["The numbers wall (evacuation table)", ["Post-1993 equipment: HP under 200 lbs -> 0. HP 200+ -> 10. MP under 200 -> 10. MP 200+ -> 15. Very high pressure -> 0. Low pressure -> 25 mm Hg ABSOLUTE.", "MNEMONIC: a bouncer at a pressure nightclub. The heavyweights (200+ lbs) get patted down harder: HP goes 0 -> 10 as weight crosses 200, MP goes 10 -> 15. The very-high-pressure guy is so twitchy (CO2) the bouncer just waves him through at 0. The low-pressure guy lives in the basement (vacuum) and gets the microscope: 25 mm, measured in millimeters because he's that far down.", "Small appliance: 90% compressor running, 80% dead, or 4 in Hg. HOOK: a 90s kid with a working stereo, an 80s kid whose stereo died, and a 4th grader with a vacuum cleaner.", "Leaky-system exception: if leaks make the target vacuum impossible, evacuate to 0 psig, fix the leak, then finish. Pulling vacuum on a leaker just inhales air."]], ["Leak rates and repair rules", ["Current thresholds, alphabetical and climbing: Comfort cooling 10, Commercial 20, Industrial 30. HOOK: C-C-I in dictionary order, counting by tens.", "Applies to appliances holding 50 lbs or more (15 lbs for high-GWP HFCs under the 2026 HFC rules). Small appliances: no repair requirement at all.", "Trip the threshold -> repair within 30 days -> verification test -> periodic inspections (annual comfort cooling, quarterly for 500+ lb commercial/IPR).", "Annual leak rate = pounds added per year / total charge. Owners of 50+ lb systems keep service records.", "Legacy exams taught 15/35/35. If a question smells old, the explanation in the drill gives the decision rule. Default: current numbers."]], ["Ozone and the regs story", ["The chain: CFC released -> drifts to stratosphere -> UV cracks it -> chlorine destroys ozone over and over -> more UV hits the surface. Chlorine content IS the villain: CFC (most Cl) > HCFC > HFC (none, ODP zero).", "HFCs dodge the ozone problem but are potent greenhouse gases, so the AIM Act phases them DOWN (not out) and A2Ls take over. Montreal Protocol = ozone treaty. SNAP = EPA's approved-substitutes list.", "Dates: R-22 production/import ended Jan 1 2020. Refrigerant sales restricted to certified techs since Jan 1 2018.", "Venting any refrigerant (including HFCs and substitutes) is illegal. De minimis release during proper recovery is the one free pass. Fines run to about $59k per day per violation.", "Apprentices can handle refrigerant only under direct supervision of a certified tech. MVACs are Section 609, a different world."]], ["The three Rs", ["RECOVER = remove and store, zero processing. RECYCLE = clean it on-site (oil separation + filter-driers), reuse in the SAME owner's equipment. RECLAIM = certified reclaimer restores it to AHRI 700, mandatory before it changes owners or gets resold.", "HOOK: recover is bagging leftovers, recycle is reheating them for yourself, reclaim is a restaurant re-serving food, which the health inspector (AHRI 700) has to sign off on.", "Equipment: self-contained (active) machines have their own pump, required over 15 lbs. System-dependent (passive) rides the appliance's own compressor/pressure, legal only at 15 lbs or less. A bare vacuum pump is VENTING, never recovery.", "Recovery equipment built after Nov 15, 1993 must be EPA-certified, with low-loss fittings on the hoses."]], ["Cylinders and safety", ["Cylinder wall: fill to 80% max by weight (liquid expands, full tanks explode). Recovery cylinders are gray with yellow tops. Refillables get hydro-tested every 5 years. DOT-39 disposables are NEVER refilled. Store under about 125 F.", "HOOK: the gray-bodied, yellow-capped guy at the gym: never more than 80% effort, physical every 5 years, keeps it under 125.", "Never pressurize with oxygen or compressed air: oil plus oxygen under pressure detonates. Dry nitrogen only, trace refrigerant optional for sniffing.", "Refrigerant is heavier than air and displaces oxygen: confined-space asphyxiation is the kill mechanism. On skin it's frostbite. In a flame it decomposes into acid gases.", "Numbers: oil changes below 5 psig. Dehydration vacuum about 500 microns. High head pressure = non-condensables (air). Acrid smell during recovery = burnout acid."]], ["Type I: small appliances", ["Definition: factory-made, hermetically sealed, 5 lbs or less. Fridges, window units, dehumidifiers, water coolers.", "The 90/80/4 rule is the whole section: 90% recovery with the compressor running, 80% with it dead, or pull 4 in Hg.", "Dead compressor tricks: heat it, tap it, access high AND low sides. Passive recovery speeds up if you chill the recovery cylinder (cold cylinder = low pressure = refrigerant migrates in).", "Piercing valves are temporary: clamp-on solderless valves leak over time, don't leave them installed. Recovered refrigerant that changes owners must be reclaimed to AHRI 700 first.", "No leak-repair requirement for small appliances. The last person in the disposal chain (scrapper/landfill) must recover or verify recovery. R-600a (isobutane) is approved for household fridges: A3 flammable, spark-proof tools."]], ["Type II: high-pressure", ["Scope: everything from splits to supermarket racks (R-22, R-410A, R-134a and friends). Evacuation table lives in the numbers wall above.", "Recovery speed: LIQUID FIRST, then vapor. Charging: vapor into the low side, liquid into the high side.", "Brazing on an open system: sweep dry nitrogen through the tubing or you cook oxide scale into it. Open-drive compressors leak at the shaft seal, especially after sitting.", "Deep vacuum to about 500 microns for dehydration; if the vacuum won't hold after you stop, refrigerant is still boiling out of oil or a leak is feeding it."]], ["Type III: the upside-down world", ["Low-pressure chillers (R-11, R-123) run in a VACUUM. Everything inverts: leaks pull air IN through gaskets and fittings, so a purge unit sits on top of the condenser skimming air out. Purge running constantly = go find the leak. Water collecting in the purge = leaking tubes, confirm with a hydrostatic tube test kit.", "THE section trap: 25 mm Hg ABSOLUTE (post-1993), not 25 inches. Millimeters for the basement dweller.", "Freeze physics drive everything: liquid refrigerant hitting a deep vacuum boils violently and freezes the water in the tubes. So: charge VAPOR first (through the EVAPORATOR charging valve) until pressure = about 36 F saturation, then liquid. During evacuation, circulate water through the tubes (or break vacuum with nitrogen on a wet system).", "Pressure ceilings: leak test at 10 psig max, because the rupture disc on the evaporator lets go around 15 psig.", "Oil holds dissolved refrigerant: heat to about 130 F before removal so the refrigerant boils out for recovery. Recover liquid first, then vapor, same as Type II.", "ASHRAE 15 machinery rooms: oxygen deprivation sensor for ALL refrigerants, plus a refrigerant-specific sensor for R-123 (it's more toxic than the R-11 it replaced, the classic gotcha).", "Major repair = compressor, condenser, or evaporator replacement: full evacuation required. Non-major work on a leak-free system can use lesser levels."]], ["Refrigerant chemistry quick hits", ["P-T law: pressure up, saturation temperature up. Superheat = vapor hotter than saturation. Subcooling = liquid cooler than saturation. The P-T chart converts pressure to temperature and is usually provided on the exam.", "Blends: 400-series = zeotropic, has temperature glide, can fractionate, CHARGE AS LIQUID. 500-series = azeotropic, behaves as one compound. HOOK: the 400s are a garage band (members leave one at a time), the 500s are one solo artist.", "Safety matrix: letter = toxicity (A low, B high), number = flammability (1 none, 2L mild, 2, 3 high). R-410A = A1. R-32/R-454B = A2L. R-290/R-600a = A3. R-123 = B1.", "Filter-drier catches moisture and acid. Non-condensables ride the top of the condenser and jack up head pressure."]]];
const $=s=>document.getElementById(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TABS=[["fc","Flashcards"],["mc","MCQs"],["sq","Sequencing"],["mt","Matching"],["nt","Notes"]];

TABS.forEach(([k,lbl],i)=>{const b=document.createElement("button");b.className="tab"+(i?"":" on");b.textContent=lbl;b.onclick=()=>showTab(k);b.id="t-"+k;$("tabs").appendChild(b)});
function showTab(k){TABS.forEach(([x])=>{$("t-"+x).classList.toggle("on",x===k);$(x+"-panel").classList.toggle("on",x===k)})}

/* FLASHCARDS */
let fcOrder=sh(FLASH.map((_,i)=>i)),fcI=0,fcFlip=false;
function fcRender(){
  const [term,def]=FLASH[fcOrder[fcI]];
  $("fc-panel").innerHTML=
   '<div class="bar"><button class="nav" id="fcShuf">shuffle</button><span class="pos">'+(fcI+1)+' / '+FLASH.length+'</span></div>'+
   '<div class="fc" id="fcCard"><div class="tag">'+(fcFlip?"definition":"term")+'</div>'+
   '<div class="face '+(fcFlip?"fcdef":"term")+'">'+esc(fcFlip?def:term)+'</div>'+
   '<div class="flip">tap to flip</div></div>'+
   '<div class="act"><button class="nav" id="fcPrev">‹ prev</button><button class="nav" id="fcNext">next ›</button></div>';
  $("fcCard").onclick=()=>{fcFlip=!fcFlip;fcRender()};
  $("fcShuf").onclick=()=>{fcOrder=sh(fcOrder);fcI=0;fcFlip=false;fcRender()};
  $("fcPrev").onclick=()=>{fcI=(fcI-1+FLASH.length)%FLASH.length;fcFlip=false;fcRender()};
  $("fcNext").onclick=()=>{fcI=(fcI+1)%FLASH.length;fcFlip=false;fcRender()};
}

/* MCQS */
const isMulti=i=>Array.isArray(MCQS[i][2]);
const corrSet=i=>new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]]);
let mcFilter="",mcList=[],mcI=0,mcOpts=[],mcDone=false,mcSel=new Set();
function mcBuild(){mcList=MCQS.map((_,i)=>i).filter(i=>!mcFilter||MCQS[i][4]===mcFilter);mcI=0;mcRender()}
function mcRender(){
  if(!mcList.length){$("mc-panel").innerHTML="<p>None.</p>";return}
  const i=mcList[mcI],m=MCQS[i],multi=isMulti(i);
  mcOpts=sh(m[1].map((t,oi)=>({oi,text:t})));mcDone=false;mcSel=new Set();
  const tops=[...new Set(MCQS.map(x=>x[4]))];
  let h='<div class="bar"><select id="mcTopic"><option value="">All topics</option>'+tops.map(t=>'<option'+(t===mcFilter?' selected':'')+'>'+t+'</option>').join('')+'</select><span class="pos">'+(mcI+1)+' / '+mcList.length+'</span></div>';
  h+='<div class="mcq"><div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="mcOpts">';
  mcOpts.forEach((o,d)=>{h+='<div class="opt" data-d="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></div>'});
  h+='</div>';
  if(multi)h+='<div class="act"><button class="check" id="mcChk">Check</button></div>';
  h+='<div class="exp" id="mcExp"></div></div>';
  h+='<div class="act"><button class="nav" id="mcPrev">‹ prev</button><button class="nav" id="mcNext">next ›</button></div>';
  $("mc-panel").innerHTML=h;
  $("mcTopic").onchange=()=>{mcFilter=$("mcTopic").value;mcBuild()};
  document.querySelectorAll("#mcOpts .opt").forEach(o=>o.onclick=()=>mcPick(+o.dataset.d));
  if(multi)$("mcChk").onclick=mcReveal;
  $("mcPrev").onclick=()=>{mcI=(mcI-1+mcList.length)%mcList.length;mcRender()};
  $("mcNext").onclick=()=>{mcI=(mcI+1)%mcList.length;mcRender()};
}
function mcPick(d){
  if(mcDone)return;const i=mcList[mcI];
  if(isMulti(i)){const el=document.querySelector('#mcOpts .opt[data-d="'+d+'"]');if(mcSel.has(d)){mcSel.delete(d);el.classList.remove("sel")}else{mcSel.add(d);el.classList.add("sel")}return}
  mcSel=new Set([d]);mcReveal();
}
function mcReveal(){
  mcDone=true;const i=mcList[mcI],cs=corrSet(i);
  const chosen=new Set([...mcSel].map(d=>mcOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#mcOpts .opt").forEach(el=>{const oi=mcOpts[+el.dataset.d].oi;el.style.pointerEvents="none";el.classList.remove("sel");
    if(cs.has(oi))el.classList.add("correct");else if(chosen.has(oi))el.classList.add("wrong");else el.classList.add("dim")});
  const e=$("mcExp");e.className="exp show";e.innerHTML="<b>"+(ok?"Correct.":"Answer above.")+"</b> "+esc(MCQS[i][3]);
}

/* SEQUENCING */
let sqI=0,sqOrder=[],sqPick=[];
function sqRender(){
  const [title,steps]=SEQ[sqI];sqPick=[];
  if(!sqOrder.length||sqOrder._for!==sqI){sqOrder=sh(steps.map((_,i)=>i));sqOrder._for=sqI}
  let h='<div class="bar"><select id="sqSel">'+SEQ.map((s,i)=>'<option'+(i===sqI?' selected':'')+'>'+esc(s[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap the steps in the correct order.</div><div id="sqList">';
  sqOrder.forEach(oi=>{h+='<button class="seqitem" data-oi="'+oi+'"><span class="num"></span><span>'+esc(steps[oi])+'</span></button>'});
  h+='</div><div class="act"><button class="check" id="sqChk">Check order</button><button class="nav" id="sqRst">reset</button></div><div class="res" id="sqRes"></div>';
  $("sq-panel").innerHTML=h;
  $("sqSel").onchange=()=>{sqI=$("sqSel").selectedIndex;sqOrder=[];sqRender()};
  document.querySelectorAll("#sqList .seqitem").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi;if(sqPick.includes(oi))return;sqPick.push(oi);
    b.classList.add("picked");b.querySelector(".num").textContent=sqPick.length;
  });
  $("sqChk").onclick=()=>{
    if(sqPick.length<steps.length){$("sqRes").textContent="Place all "+steps.length+" steps first.";return}
    let right=0;document.querySelectorAll("#sqList .seqitem").forEach(b=>{const oi=+b.dataset.oi;const pos=sqPick.indexOf(oi);
      b.classList.remove("ok","no");if(pos===oi){b.classList.add("ok");right++}else b.classList.add("no")});
    $("sqRes").innerHTML=right===steps.length?'<span style="color:var(--good)">Correct order ✓</span>':right+' / '+steps.length+' in the right spot. Red = wrong position.';
  };
  $("sqRst").onclick=()=>{sqRender()};
}

/* MATCHING */
let mtI=0,mtRight=[],mtLeftSel=null,mtPairs={};
function mtRender(){
  const [title,pairs]=MATCH[mtI];mtLeftSel=null;mtPairs={};
  mtRight=sh(pairs.map((p,i)=>({i,text:p[1]})));
  let h='<div class="bar"><select id="mtSel">'+MATCH.map((m,i)=>'<option'+(i===mtI?' selected':'')+'>'+esc(m[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap a term, then its match.</div><div class="cols"><div id="mtL"></div><div id="mtR"></div></div>';
  h+='<div class="act"><button class="check" id="mtChk">Check</button><button class="nav" id="mtRst">reset</button></div><div class="res" id="mtRes"></div>';
  $("mt-panel").innerHTML=h;
  let L='';pairs.forEach((p,i)=>{L+='<button class="mitem" data-li="'+i+'"><span>'+esc(p[0])+'</span></button>'});$("mtL").innerHTML=L;
  let R='';mtRight.forEach(r=>{R+='<button class="mitem" data-ri="'+r.i+'"><span>'+esc(r.text)+'</span></button>'});$("mtR").innerHTML=R;
  $("mtSel").onchange=()=>{mtI=$("mtSel").selectedIndex;mtRender()};
  document.querySelectorAll("#mtL .mitem").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#mtL .mitem").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");mtLeftSel=+b.dataset.li});
  document.querySelectorAll("#mtR .mitem").forEach(b=>b.onclick=()=>{
    if(mtLeftSel===null)return;const ri=+b.dataset.ri;
    Object.keys(mtPairs).forEach(k=>{if(mtPairs[k]===ri)delete mtPairs[k]});
    mtPairs[mtLeftSel]=ri;
    document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.toggle("matched",li in mtPairs);if(li===mtLeftSel)x.classList.remove("sel")});
    document.querySelectorAll("#mtR .mitem").forEach(x=>{const r=+x.dataset.ri;x.classList.toggle("matched",Object.values(mtPairs).includes(r))});
    mtLeftSel=null;
  });
  $("mtChk").onclick=()=>{
    let right=0;document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.remove("miss");
      if(mtPairs[li]===li)right++;else if(li in mtPairs)x.classList.add("miss")});
    $("mtRes").innerHTML=right===pairs.length?'<span style="color:var(--good)">All matched ✓</span>':right+' / '+pairs.length+' correct. Red = wrong match.';
  };
  $("mtRst").onclick=()=>mtRender();
}

/* NOTES */
function ntRender(){
  let h='';NOTES.forEach((n,i)=>{h+='<div class="note'+(i?'':' open')+'"><h3>'+esc(n[0])+'<span class="ch">'+(i?'+':'–')+'</span></h3><ul>'+n[1].map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>'});
  $("nt-panel").innerHTML=h;
  document.querySelectorAll(".note h3").forEach(hd=>hd.onclick=()=>{const n=hd.parentElement;n.classList.toggle("open");hd.querySelector(".ch").textContent=n.classList.contains("open")?'–':'+'});
}

fcRender();mcBuild();sqRender();mtRender();ntRender();showTab("fc");
</script></body></html>
