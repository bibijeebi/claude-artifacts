<style>
:root{--bg:#0a0e0d;--card:#111614;--card2:#161d1a;--line:#23302b;--ink:#e8efe9;--mut:#8aa093;--lime:#d4ff3a;--good:#5ad17a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-family:"Fraunces",serif;font-weight:700;font-size:25px;letter-spacing:-.4px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tab{font:inherit;font-size:12.5px;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.12s}
.tab.on{color:var(--bg);background:var(--lime);border-color:var(--lime)}
@media(hover:hover){.tab:hover:not(.on){color:var(--ink);border-color:#33453d}}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.pos{color:var(--mut);font-size:12px;margin-left:auto}
button.nav{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
@media(hover:hover){button.nav:hover{border-color:var(--lime);color:var(--lime)}}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 24px;cursor:pointer;position:relative;user-select:none}
.fc .face{font-size:21px;line-height:1.4}.fc .term{font-family:"Fraunces",serif;font-weight:600}
.fc .tag{position:absolute;top:14px;left:16px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.fc .flip{position:absolute;bottom:12px;right:16px;font-size:10.5px;color:var(--mut)}
.fcdef{color:var(--lime)}
.mcq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.topic{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--lime);font-weight:700;margin-bottom:8px}
.q{font-size:16px;line-height:1.5;margin:0 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:8px 0;cursor:pointer;transition:.12s}
@media(hover:hover){.opt:hover{border-color:#33453d}}.opt .ltr{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.opt.correct{border-color:var(--good);background:#11231a}.opt.correct .ltr{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:#231414}.opt.wrong .ltr{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.5}
.exp{margin-top:13px;padding:12px 14px;border-radius:10px;background:#0e1512;border:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--mut);display:none}
.exp.show{display:block}.exp b{color:var(--ink)}
.hint{font-size:12px;color:var(--mut);margin:-6px 0 12px}
.seqitem,.mitem{font:inherit;font-size:14px;text-align:left;width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:7px 0;cursor:pointer;color:var(--ink);display:flex;gap:11px;align-items:center;transition:.12s}
@media(hover:hover){.seqitem:hover,.mitem:hover{border-color:#33453d}}
.seqitem .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#1d2723;color:var(--mut);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.seqitem.picked .num{background:var(--lime);color:var(--bg)}
.seqitem.ok{border-color:var(--good)}.seqitem.no{border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mitem.sel{border-color:var(--lime)}.mitem.matched{border-color:var(--good);opacity:.85}.mitem.miss{border-color:var(--bad)}
.act{display:flex;gap:8px;margin-top:12px}
.check{font:inherit;font-size:13px;font-weight:700;color:var(--bg);background:var(--lime);border:0;border-radius:9px;padding:10px 18px;cursor:pointer}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.note h3{font-family:"Fraunces",serif;font-weight:600;font-size:16px;margin:0;padding:15px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.note h3 .ch{color:var(--lime);font-size:13px}
.note ul{margin:0;padding:0 20px 16px 36px;display:none}.note.open ul{display:block}
.note li{font-size:13.5px;line-height:1.6;margin:6px 0;color:var(--mut)}.note li::marker{color:var(--lime)}
.res{font-size:12.5px;color:var(--mut);margin-top:8px}

<script>
const FLASH=[["Section 608", "Clean Air Act section requiring certification to service, repair, or dispose of stationary refrigerant equipment."], ["Section 609", "Motor vehicle air conditioning. Separate cert, not part of 608."], ["Universal certification", "Core + Type I + II + III passed. Works on everything stationary."], ["Passing score", "18 of 25 per section (72%)."], ["Certification validity", "Lifetime. Never expires, no renewal."], ["Venting prohibition", "Knowingly releasing CFC, HCFC, HFC, and substitute refrigerants is illegal."], ["De minimis release", "Trace loss during good-faith recovery with proper equipment. Not a violation."], ["Montreal Protocol", "International treaty phasing out ozone-depleting substances."], ["AIM Act", "U.S. law phasing DOWN HFCs (climate, not ozone)."], ["SNAP program", "EPA list of acceptable substitute refrigerants."], ["ODP ranking", "CFC (highest, most chlorine) > HCFC > HFC (zero ODP, no chlorine)."], ["R-12", "CFC. R-22 = HCFC. R-134a / R-410A = HFC. R-32 / R-454B = A2L HFC blends."], ["Stratospheric ozone", "Absorbs UV. Chlorine freed from CFCs by UV destroys it, one Cl kills many O3."], ["R-22 phaseout", "No production or import since January 1, 2020. Service with recovered/reclaimed stock only."], ["Sales restriction", "Since Jan 1, 2018 refrigerant sells only to certified techs (or employers of)."], ["Apprentice exemption", "Uncertified apprentice may handle refrigerant under direct supervision of a certified tech."], ["Max civil penalty", "Venting fines can reach roughly $59k+ per day per violation (inflation-adjusted)."], ["Recover", "Remove refrigerant and store it in an external container. No processing."], ["Recycle", "Clean on-site with oil separation and filter-driers, reuse in same owner's equipment."], ["Reclaim", "Restore to AHRI 700 purity at a certified reclaimer. Required before resale/change of ownership."], ["AHRI 700", "The purity standard reclaimed refrigerant must meet."], ["Self-contained recovery", "Active: has its own compressor/pump. Required for appliances over 15 lbs."], ["System-dependent recovery", "Passive: uses the appliance's own compressor/pressure. Only on 15 lbs or less."], ["Recovery equipment cert", "Equipment made after Nov 15, 1993 must be EPA-certified (ARI 740 tested)."], ["Low-loss fittings", "Required on recovery hoses to minimize release when connecting/disconnecting."], ["Vacuum pump alone", "NOT recovery. It exhausts refrigerant to the room = venting."], ["80% fill rule", "Never fill a recovery cylinder past 80% of capacity by weight. Hydrostatic expansion bursts tanks."], ["Recovery cylinder colors", "Gray body, yellow top."], ["Hydrostatic retest", "Refillable cylinders: every 5 years."], ["DOT-39 cylinder", "Disposable. NEVER refill, never use for recovery. Recover heel, puncture, recycle steel."], ["Cylinder storage temp", "Keep below about 125 F."], ["Oxygen rule", "NEVER pressurize a system with oxygen or air: oil + oxygen under pressure explodes. Use dry nitrogen."], ["Nitrogen + trace", "Pressure/leak testing uses dry nitrogen (optionally with trace refrigerant)."], ["Halide torch", "Old leak detector, flame turns green near halogenated refrigerant."], ["Refrigerant + flame", "Decomposes into toxic gases (hydrochloric/hydrofluoric acid, phosgene-like)."], ["Confined space danger", "Refrigerant displaces oxygen: asphyxiation. It's heavier than air, sinks low."], ["Liquid refrigerant on skin", "Frostbite."], ["Oil change pressure", "Don't change compressor oil above 5 psig."], ["Non-condensables symptom", "Air in system = high head pressure."], ["Acrid odor during recovery", "Compressor burnout acids."], ["Deep vacuum target", "About 500 microns for dehydration before charging."], ["Saturation relationship", "Pressure up = saturation temperature up. The P-T chart maps it."], ["Superheat", "Vapor heated above its saturation temperature."], ["Subcooling", "Liquid cooled below its saturation temperature."], ["Filter-drier", "Removes moisture and acid from the system."], ["Zeotropic blends (400s)", "Components boil separately: temperature glide, can fractionate, CHARGE AS LIQUID."], ["Azeotropic blends (500s)", "Behave as a single compound. No glide."], ["A2L refrigerants", "Mildly flammable, lower-GWP HFCs (R-32, R-454B) replacing R-410A in new gear."], ["A3 refrigerants", "Highly flammable hydrocarbons: R-290 propane, R-600a isobutane. Spark-proof tools."], ["Safety classification", "Letter = toxicity (A low, B high). Number = flammability (1 none to 3 high, 2L mildly)."], ["Small appliance", "Factory-made, hermetically sealed, 5 lbs or less of refrigerant."], ["Small appliance recovery", "90% with compressor operating, 80% not operating, OR evacuate to 4 in Hg."], ["Passive recovery tricks", "Chill the recovery cylinder (lowers its pressure); heat and tap a dead compressor; access both sides."], ["Piercing valves", "Solderless clamp-on valves leak over time. Don't leave them on the appliance."], ["Small appliance leak repair", "NOT required by EPA. Leak rules start at 50 lbs."], ["Disposal chain", "The final person in the chain (scrap/landfill) must recover remaining refrigerant or verify recovery."], ["Type II scope", "High-pressure appliances (R-22, R-410A, R-134a systems and up): split ACs, supermarket racks."], ["HP evacuation <200 lbs", "0 in Hg (atmospheric) with post-1993 equipment."], ["HP evacuation 200+ lbs", "10 in Hg vacuum."], ["MP evacuation <200 lbs", "10 in Hg vacuum."], ["MP evacuation 200+ lbs", "15 in Hg vacuum."], ["Very-high-pressure evac", "0 in Hg (0 psig). CO2, R-503 class."], ["Leaky system exception", "Can't hold vacuum because of leaks: evacuate to 0 psig, repair, then finish."], ["Leak-repair trigger", "Rules apply at 50 lbs+ of charge (15 lbs for high-GWP HFCs as of Jan 2026)."], ["Leak rates (current)", "Comfort cooling 10%, commercial 20%, industrial process 30% per year. Legacy exams said 15/35/35."], ["Repair window", "30 days after exceeding the threshold."], ["Follow-up inspections", "Tripped appliances get periodic leak inspections (annual comfort, quarterly large commercial/IPR)."], ["Recovery speed", "Remove LIQUID first, then vapor."], ["Charging rule", "Vapor through the low side. Liquid through the high side."], ["Nitrogen sweep", "Flow dry nitrogen through tubing while brazing to prevent oxide scale."], ["Open compressor weak spot", "The rotating shaft seal, especially after sitting idle."], ["Type III scope", "Low-pressure appliances: centrifugal chillers on R-11 and R-123."], ["Low-pressure definition", "Refrigerant boils ABOVE room temp at atmospheric pressure; system runs in a vacuum."], ["Vacuum-world leaks", "Air leaks IN (through gaskets/fittings), refrigerant doesn't spray out."], ["Purge unit", "Removes air/non-condensables from the TOP OF THE CONDENSER. Runs constantly = find the leak."], ["Moisture in purge unit", "Excess water collecting there = leaking chiller tubes. Confirm with a hydrostatic tube test kit."], ["LP evacuation", "25 mm Hg ABSOLUTE with post-1993 equipment (25 in Hg with pre-1993). mm vs inches is the trap."], ["LP leak test max", "10 psig. Above that the rupture disc fails."], ["Rupture disc", "Relief device on the evaporator, lets go at about 15 psig."], ["Charge vapor first", "Liquid into a deep vacuum boils, freezes water in the tubes, cracks them."], ["Vapor charge target", "Until system pressure = saturation temperature of about 36 F (above freezing), then liquid."], ["Charging valve", "Centrifugal chillers charge through the EVAPORATOR charging valve."], ["Freeze prevention (evac)", "Circulate water through the tubes during evacuation; nitrogen can raise pressure on a wet system."], ["Oil removal", "Heat oil to about 130 F first: hot oil holds less dissolved refrigerant."], ["R-123 room requirements", "ASHRAE 15: refrigerant-specific sensor for R-123; oxygen deprivation sensor for all refrigerants."], ["Major repair", "Compressor, condenser, or evaporator replacement. Triggers full evacuation levels."], ["MVAC", "Car AC = Section 609, not on this exam."]], MCQS=[["Which agency administers refrigerant-handling certification under Section 608?", ["EPA", "OSHA", "DOT", "DOE"], 0, "Section 608 of the Clean Air Act is administered and enforced by the EPA.", "Core: Regs & Ozone"], ["Section 608 certification is required to do what to stationary equipment?", ["Sell or transport refrigerant in bulk quantities", "Service, maintain, repair, or dispose of it", "Install ductwork and air-side components", "Design refrigerant piping for new construction"], 1, "608 cert is required for anyone who maintains, services, repairs, or disposes of equipment containing refrigerant.", "Core: Regs & Ozone"], ["How long is a Section 608 certification valid?", ["5 years, then an open-book retest", "10 years, with a refresher course", "It never expires or needs renewal", "Until covered refrigerants phase out"], 2, "608 certification is lifetime; no renewal or continuing-ed is required by the EPA.", "Core: Regs & Ozone"], ["To work on every type of stationary equipment, which certification do you need?", ["Type I", "Type II", "Type III", "Universal"], 3, "Universal covers all stationary refrigeration and AC equipment. It requires passing Core plus Type I, II, and III.", "Core: Regs & Ozone"], ["What is the minimum score to pass each section of the 608 exam?", ["60% (15 of 25)", "70% (18 of 25)", "80% (20 of 25)", "84% (21 of 25)"], 1, "Each section is 25 questions; you must answer 18 correctly (70%) to pass that section.", "Core: Regs & Ozone"], ["Motor vehicle air conditioners (MVACs) are certified under which section?", ["Section 608", "Section 609", "Section 610", "Section 611"], 1, "MVAC work falls under Section 609, not 608. 608 covers stationary equipment.", "Core: Regs & Ozone"], ["Knowingly venting which refrigerants is illegal?", ["CFCs and HCFCs only", "CFCs only, since HFCs contain no chlorine", "CFCs, HCFCs, and HFC substitutes", "Only refrigerants listed as Class I substances"], 2, "Venting is banned for CFCs/HCFCs (since 1992) and was extended to HFC substitutes (since 1995).", "Core: Regs & Ozone"], ["Which release does NOT violate the venting prohibition?", ["Releases during disposal of small appliances", "De minimis losses during good-faith recovery", "Releases within 30 days of a leak repair", "Releases under one pound per service call"], 1, "De minimis (minimal, unavoidable) releases during good-faith recovery/recycling are not violations.", "Core: Regs & Ozone"], ["Which class of refrigerant has the highest ozone depletion potential (ODP)?", ["CFCs", "HCFCs", "HFCs", "HCs"], 0, "CFCs (e.g., R-12) have the highest ODP. HCFCs are lower; HFCs have zero ODP.", "Core: Regs & Ozone"], ["HFC refrigerants like R-134a and R-410A have what ozone depletion potential?", ["The highest of any class", "Zero, they contain no chlorine", "About half that of CFCs", "Roughly equal to HCFCs"], 1, "HFCs contain no chlorine, so their ODP is zero. They are regulated instead for their GWP. HFCs have zero ODP (no chlorine) but real global warming potential, hence the AIM Act phasedown.", "Core: Regs & Ozone"], ["The Montreal Protocol is an international agreement to do what?", ["Set international refrigerant purity standards", "Phase out ozone-depleting substances", "License technicians across member countries", "Ban all synthetic refrigerants by 2030"], 1, "The Montreal Protocol commits nations to phasing out ozone-depleting substances like CFCs and HCFCs.", "Core: Regs & Ozone"], ["The AIM Act drives the phasedown of which refrigerants?", ["CFCs", "HCFCs", "HFCs", "Ammonia"], 2, "The AIM Act mandates an 85% phasedown of HFC production/consumption and pushes low-GWP (A2L) substitutes.", "Core: Regs & Ozone"], ["Complete phaseout of R-22 production and import took effect on what date?", ["January 1, 2010", "January 1, 2015", "January 1, 2020", "January 1, 2025"], 2, "Jan 1, 2010 banned R-22 in new equipment; Jan 1, 2020 banned all production/import. Only reclaimed/stockpiled R-22 remains.", "Core: Regs & Ozone"], ["Since January 1, 2018, refrigerant (including HFCs) may be sold only to whom?", ["Licensed HVAC contractors regardless of certification", "EPA-certified technicians or their employers", "Anyone 18 or older with a business license", "Certified techs for CFCs only, anyone for HFCs"], 1, "The sales restriction limits refrigerant purchases to 608/609-certified technicians.", "Core: Regs & Ozone"], ["The EPA's SNAP program identifies what?", ["Certified recovery equipment models", "Acceptable substitute refrigerants", "Approved refrigerant reclaimers", "Exempt small-appliance categories"], 1, "SNAP (Significant New Alternatives Policy) lists acceptable substitutes for ozone-depleting refrigerants.", "Core: Regs & Ozone"], ["Civil penalties for knowingly venting refrigerant can reach what level?", ["A flat $5,000 per incident", "Tens of thousands per day, per violation", "Up to $1,000 plus decertification", "Criminal charges only, no civil fines"], 1, "Fines run per day, per violation, in the tens of thousands. The figure has escalated over time ($25,000 to $37,500 to ~$44,539); pick the per-day, per-violation answer.", "Core: Regs & Ozone"], ["A2L refrigerants such as R-32 and R-454B are classified as what?", ["Non-flammable, higher toxicity", "Mildly flammable, lower toxicity", "Highly flammable, low toxicity", "Non-flammable, low toxicity"], 1, "A2L = lower toxicity (A), mildly flammable (2L). They are low-GWP replacements for R-410A.", "Core: Regs & Ozone"], ["Which is a flammable (A3) refrigerant?", ["R-410A", "R-22", "R-290", "R-123"], 2, "R-290 (propane) and R-600a (isobutane) are A3, highly flammable hydrocarbons used in some small appliances. R-290 is propane, an A3 highly flammable hydrocarbon.", "Core: Regs & Ozone"], ["What does 'recover' refrigerant mean?", ["Clean it on-site with filter-driers for reuse", "Remove it and store it in an external container", "Reprocess it to meet AHRI 700 purity", "Transfer it directly into another appliance"], 1, "Recover = remove refrigerant and store it externally, with no cleaning or testing.", "Core: Recover/Recycle/Reclaim"], ["What does 'recycle' refrigerant mean?", ["Remove and store it without any processing", "Clean it on-site with oil separation and filter-driers", "Reprocess it at a certified facility to AHRI 700", "Blend it with virgin refrigerant to restore purity"], 1, "Recycle = field cleaning (oil separation, moisture/acid removal via filter-driers) for reuse on equipment owned by the same person.", "Core: Recover/Recycle/Reclaim"], ["What does 'reclaim' refrigerant mean?", ["Clean it on-site for same-owner reuse", "Reprocess it to the AHRI 700 purity standard", "Remove and store it in an approved cylinder", "Distill it in the field until the sight glass clears"], 1, "Reclaim = reprocess to AHRI 700 (like-new) purity. It is the only path to legally change ownership of recovered refrigerant. Reclaiming to AHRI 700 is the only path to certifying refrigerant for resale.", "Core: Recover/Recycle/Reclaim"], ["Reclaimed refrigerant must be purified to meet which standard?", ["ASHRAE 34", "AHRI 700", "SAE J2843", "ISO 5149"], 1, "Reclaimed refrigerant must meet the AHRI 700 standard (about 99.5% purity).", "Core: Recover/Recycle/Reclaim"], ["Recovered refrigerant may be reused without reclaiming on what?", ["Any system containing the same refrigerant type", "Another system owned by the same person", "Systems serviced by the same technician", "Any system, if the refrigerant is filtered first"], 1, "Recovered/recycled refrigerant can go back to the same system or another owned by the same person. Changing ownership requires reclaiming.", "Core: Recover/Recycle/Reclaim"], ["Recovery equipment manufactured after November 15, 1993 must be what?", ["Registered with the DOT as a pressure vessel", "Certified by an EPA-approved testing organization", "Rebuilt and recalibrated every five years", "Rated to pull at least 25 mm Hg absolute"], 1, "Post-Nov-15-1993 recovery/recycling equipment must be third-party certified to meet EPA recovery efficiency standards.", "Core: Recover/Recycle/Reclaim"], ["Self-contained (active) recovery equipment is defined by what?", ["It relies on the appliance's own compressor", "It has its own compressor or pump", "It recovers vapor only, never liquid", "It is shop-installed rather than portable"], 1, "Active (self-contained) recovery units have their own compressor/pump. Passive (system-dependent) units rely on the appliance.", "Core: Recover/Recycle/Reclaim"], ["System-dependent (passive) recovery may be used only on appliances containing how much refrigerant?", ["Any amount", "15 pounds or less", "100 pounds or less", "200 pounds or more"], 1, "Passive recovery is limited to appliances with 15 lbs or less of refrigerant.", "Core: Recover/Recycle/Reclaim"], ["Before transferring recovered refrigerant into a recovery cylinder, you should do what?", ["Warm the cylinder to raise its pressure", "Evacuate the empty cylinder first", "Fill it with a nitrogen holding charge", "Chill the appliance to slow the transfer"], 1, "Always evacuate an empty recovery cylinder before charging it, to avoid non-condensables and contamination.", "Core: Recover/Recycle/Reclaim"], ["Which is prohibited when handling recovery cylinders?", ["Storing cylinders upright in a service van", "Mixing different refrigerants in one cylinder", "Reusing a cylinder for the same refrigerant", "Filling a recovery cylinder to 80% by weight"], 1, "Never mix refrigerant types in one recovery cylinder; mixed refrigerant cannot be reclaimed and must be destroyed.", "Core: Recover/Recycle/Reclaim"], ["Refrigerant/recovery cylinders must never be filled above what level?", ["60% of capacity by weight", "80% of capacity by weight", "90% of capacity by weight", "Whatever the pressure gauge allows"], 1, "Never exceed 80% fill by weight, leaving room for liquid expansion as temperature rises (prevents rupture).", "Core: Safety & Handling"], ["A standard refrigerant recovery cylinder is colored how?", ["Yellow body with a gray top", "Gray body with a yellow top", "Green body with a white top", "Gray body with a red top"], 1, "Recovery cylinders are gray with a yellow shoulder/top.", "Core: Safety & Handling"], ["DOT requires refillable refrigerant cylinders be hydrostatically retested how often?", ["Every year", "Every 5 years", "Every 10 years", "Never"], 1, "Refillable DOT cylinders must be hydrostatically tested and stamped every 5 years.", "Core: Safety & Handling"], ["Disposable (single-use) refrigerant cylinders are DOT-39 and must be what?", ["Refilled when empty", "Never refilled", "Hydro-tested yearly", "Painted gray"], 1, "DOT-39 disposable cylinders are non-refillable; refilling them is illegal and dangerous.", "Core: Safety & Handling"], ["The maximum recommended storage temperature for a refrigerant cylinder is about what?", ["80 F", "100 F", "125 F", "200 F"], 2, "Keep cylinders below 125 F. Heat raises internal pressure and risks rupture.", "Core: Safety & Handling"], ["The main danger of refrigerant leaking into a confined, poorly ventilated space is what?", ["Ignition of the refrigerant vapor", "Oxygen displacement and asphyxiation", "Frostbite from vapor contact", "Long-term neurological toxicity"], 1, "Most refrigerants are heavier than air, settle low, and displace oxygen, risking suffocation.", "Core: Safety & Handling"], ["Liquid refrigerant contacting skin or eyes can cause what?", ["Sunburn", "Frostbite", "Mild rash only", "Nothing"], 1, "Liquid refrigerant boils at low temperature and causes frostbite on contact. Wear gloves and eye protection.", "Core: Safety & Handling"], ["When refrigerant contacts an open flame or very high heat, it can break down into what?", ["Harmless carbon dioxide and water vapor", "Toxic acid gases (hydrofluoric, hydrochloric)", "Pure chlorine gas only", "Flammable hydrogen and methane"], 1, "Heat decomposes refrigerant into toxic/corrosive byproducts (phosgene, hydrofluoric/hydrochloric acid). Ventilate and avoid open flame.", "Core: Safety & Handling"], ["To pressure-test a system for leaks, you should use what?", ["Compressed shop air", "Dry nitrogen", "CO2 from a welding cylinder", "Refrigerant vapor at full cylinder pressure"], 1, "Use dry nitrogen. Add a trace of refrigerant only if needed for an electronic detector. Never use oxygen or acetylene. Add a trace of refrigerant only if sniffing with an electronic detector.", "Core: Safety & Handling"], ["Why must you never pressurize a system with oxygen?", ["It contaminates the system with moisture", "It can explode on contact with compressor oil", "It corrodes aluminum evaporator coils", "It gives false readings on leak detectors"], 1, "Oxygen reacting with compressor oil under pressure can cause a violent explosion.", "Core: Safety & Handling"], ["A halide torch leak detector changes flame color in the presence of what?", ["All refrigerants including HFCs", "Chlorinated refrigerants (CFCs and HCFCs)", "Hydrocarbons such as propane only", "Any gas heavier than air"], 1, "A halide torch turns the flame green/blue when chlorine is present, so it works on CFCs/HCFCs but not chlorine-free HFCs.", "Core: Safety & Handling"], ["Non-condensables (air) trapped in a system cause what symptom?", ["Low suction pressure", "High head pressure", "High superheat at the evaporator outlet", "Short-cycling on the low-pressure switch"], 1, "Air will not condense, so it raises discharge/head pressure above the P-T chart value for the ambient.", "Core: Safety & Handling"], ["A strong acrid odor while recovering refrigerant usually indicates what?", ["An overcharged system", "Compressor burnout acids", "Non-condensables in the condenser", "Moisture freezing at the metering device"], 1, "Acrid odor signals a burnout. Recover, then install a suction-line filter-drier and change the oil to remove acid.", "Core: Safety & Handling"], ["It is a violation to change compressor oil at a pressure higher than what?", ["0 psig", "5 psig", "15 psig", "50 psig"], 1, "Reduce system pressure to no more than 5 psig before removing oil so dissolved refrigerant in the oil is recovered.", "Core: Safety & Handling"], ["You should never energize a hermetic compressor motor under what condition?", ["Full charge", "A deep vacuum", "Normal pressure", "With gauges attached"], 1, "Energizing windings under deep vacuum can arc and damage the motor. Never run a compressor in a vacuum.", "Core: Safety & Handling"], ["Pulling a vacuum too quickly on a wet system can do what?", ["Boil the oil out of the compressor", "Freeze the moisture into ice, trapping it", "Collapse the evaporator tubing", "Overheat the vacuum pump motor"], 1, "Rapid pressure drop can freeze water into ice. Slow down or introduce nitrogen to keep moisture in vapor form.", "Core: Safety & Handling"], ["As the pressure of a refrigerant increases, its saturation (boiling) temperature does what?", ["Decreases", "Increases", "Stays the same", "Becomes zero"], 1, "Higher pressure raises the saturation temperature. This pressure-temperature relationship is the basis of the P-T chart.", "Core: Refrigerants & Cylinders"], ["A pressure-temperature (P-T) chart is used to do what?", ["Convert gauge pressure to absolute pressure", "Find saturation temperature for a given pressure", "Determine the correct oil charge", "Size the liquid line for a given tonnage"], 1, "A P-T chart relates a refrigerant's pressure to its saturation temperature, used to set superheat and subcooling.", "Core: Refrigerants & Cylinders"], ["Superheat is best described as what?", ["Liquid cooled below its saturation temperature", "Vapor heated above its saturation temperature", "The temperature rise across the compressor", "The condenser-to-evaporator temperature split"], 1, "Superheat is how many degrees the vapor is above saturation, measured at the evaporator outlet/suction line.", "Core: Refrigerants & Cylinders"], ["Subcooling is best described as what?", ["Vapor heated above its saturation temperature", "Liquid cooled below its saturation temperature", "The temperature drop across the metering device", "The evaporator outlet temperature at design load"], 1, "Subcooling is how many degrees the liquid is below saturation, measured at the condenser outlet/liquid line.", "Core: Refrigerants & Cylinders"], ["A filter-drier is installed in a system to do what?", ["Separate oil from the refrigerant", "Remove moisture and acid", "Regulate liquid-line pressure", "Trap non-condensables"], 1, "The filter-drier removes moisture, acid, and particulate. A suction-line drier is added after a burnout.", "Core: Refrigerants & Cylinders"], ["Which pressure class does R-410A fall into?", ["Low-pressure", "Medium-pressure", "High-pressure", "Not a refrigerant"], 2, "R-410A is a high-pressure (Type II) refrigerant; it operates at notably higher pressures than R-22.", "Core: Refrigerants & Cylinders"], ["A2L refrigerants commonly replacing R-410A in new equipment include which?", ["R-12 and R-22", "R-32 and R-454B", "R-11 and R-123", "R-502 and R-13"], 1, "R-32 and R-454B are the primary low-GWP A2L replacements for R-410A in new residential/light-commercial systems.", "Core: Refrigerants & Cylinders"], ["A 'small appliance' is one factory-manufactured, charged, and hermetically sealed with how much refrigerant?", ["5 pounds or less", "15 pounds or less", "50 pounds or less", "Any amount"], 0, "A small appliance is factory-sealed with 5 lbs or less of refrigerant.", "Type I: Small Appliance"], ["Which of these is a small appliance?", ["A residential central AC charged with 4 lbs", "A household refrigerator or window AC", "A packaged rooftop unit under 5 tons", "A water-cooled chiller with a 5-lb charge"], 1, "Household refrigerators, window ACs, PTACs, dehumidifiers, vending machines, and water coolers are small appliances. Field-charged central systems fail the factory-sealed test regardless of charge size.", "Type I: Small Appliance"], ["Using self-contained recovery equipment on a small appliance with an OPERATING compressor, you must recover what?", ["80% of the refrigerant", "90% of the refrigerant", "100% of the refrigerant", "50% of the refrigerant"], 1, "Compressor working: recover 90%. Compressor not working: recover 80%.", "Type I: Small Appliance"], ["With a NON-operating compressor (post-1993 self-contained equipment), the small-appliance recovery requirement is what?", ["90%", "80%", "70%", "60%"], 1, "If the compressor is not functional, you must recover at least 80% of the charge.", "Type I: Small Appliance"], ["Recovery requirements for a small appliance can alternatively be met by evacuating it to what vacuum?", ["1 inch Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 1, "Evacuating a small appliance to 4 inches of mercury vacuum satisfies the recovery rule.", "Type I: Small Appliance"], ["Does the EPA require leak repair on small appliances?", ["Yes, within 30 days of discovery", "No, small appliances are exempt", "Yes, when the leak rate exceeds 10%", "Only when the charge exceeds one pound"], 1, "Leak repair rules do not apply to small appliances, though good practice is to fix leaks anyway. Repair anyway when practical to conserve refrigerant, but the rules start at 50 lbs.", "Type I: Small Appliance"], ["The final person in the disposal chain of a small appliance (e.g., scrap recycler) must do what?", ["Notify the EPA before crushing the appliance", "Recover the refrigerant or verify prior recovery", "Remove the compressor and drain the oil", "Hold the appliance 30 days before destruction"], 1, "The last disposer must ensure and document that refrigerant was recovered before final disposal.", "Type I: Small Appliance"], ["Isobutane (R-600a) is approved as a substitute for use in what?", ["Retrofits of existing R-134a refrigerators", "New household refrigerators and freezers", "Commercial walk-in coolers of any size", "Automotive air conditioning systems"], 1, "R-600a is approved for NEW household refrigerators/freezers, not as a retrofit into existing small appliances.", "Type I: Small Appliance"], ["Low-loss fittings on recovery hoses are required to do what?", ["Prevent oil migrating into the recovery unit", "Minimize release at connect and disconnect", "Maintain deep vacuum during long recoveries", "Keep moisture out of the recovery cylinder"], 1, "Low-loss fittings close manually or automatically to limit refrigerant loss at the hose connections.", "Type I: Small Appliance"], ["Type II certification covers which appliances?", ["Low-pressure centrifugal chillers", "High-pressure and very-high-pressure appliances", "Factory-sealed appliances under 5 lbs", "Motor vehicle air conditioning systems"], 1, "Type II = high-pressure systems: most residential/commercial split systems, rooftop units, and commercial refrigeration.", "Type II: High-Pressure"], ["Using post-Nov-15-1993 equipment, a high-pressure appliance with LESS than 200 lbs must be evacuated to what?", ["0 in Hg", "4 in Hg", "10 in Hg", "15 in Hg"], 0, "Current EPA table: high-pressure under 200 lbs = 0 inches Hg. Note: some older exam versions list 10 inches Hg for this; if 0 is not offered, pick 10.", "Type II: High-Pressure"], ["Using post-1993 equipment, a high-pressure appliance with 200 lbs OR MORE must be evacuated to what?", ["0 inches Hg", "4 inches Hg", "10 inches Hg", "25 inches Hg"], 2, "High-pressure, 200 lbs or more: 10 inches Hg vacuum.", "Type II: High-Pressure"], ["Using post-1993 equipment, a medium-pressure appliance with LESS than 200 lbs is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 1, "Medium-pressure under 200 lbs: 10 inches Hg vacuum.", "Type II: High-Pressure"], ["Using post-1993 equipment, a medium-pressure appliance with 200 lbs OR MORE is evacuated to what?", ["0 inches Hg", "10 inches Hg", "15 inches Hg", "25 inches Hg"], 2, "Medium-pressure 200 lbs or more: 15 inches Hg vacuum.", "Type II: High-Pressure"], ["A very high-pressure appliance must be evacuated to what level?", ["0 in Hg (0 psig)", "10 in Hg vacuum", "15 in Hg vacuum", "25 mm Hg absolute"], 0, "Very high-pressure equipment is evacuated to 0 inches Hg (0 psig). Pulling a deep vacuum risks damage.", "Type II: High-Pressure"], ["Mandatory leak-repair rules apply only to systems containing how much refrigerant?", ["5 lbs or more", "15 lbs or more", "50 lbs or more", "200 lbs or more"], 2, "Leak-repair thresholds apply at 50 lbs for ODS systems; the AIM Act lowered it to 15 lbs for high-GWP HFCs effective Jan 2026. 15 lbs is the new tier for high-GWP HFCs under the 2026 rules; 50 lbs is the classic answer.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for a comfort-cooling system?", ["5%", "10%", "20%", "35%"], 1, "Comfort cooling = 10% per year (current 2019-revision rule). Older exam versions used 15%.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for a commercial refrigeration system?", ["10%", "20%", "30%", "35%"], 1, "Commercial refrigeration = 20% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure"], ["What annual leak rate triggers mandatory repair for an industrial process refrigeration system?", ["10%", "20%", "30%", "50%"], 2, "Industrial process refrigeration = 30% per year (current rule). Older exam versions used 35%.", "Type II: High-Pressure"], ["Once a leak exceeds the applicable threshold, repair must be completed within how long?", ["24 hours", "7 days", "30 days", "1 year"], 2, "Repair (and verification) must be completed within 30 days, or a retrofit/retirement plan must be filed.", "Type II: High-Pressure"], ["Annual leak rate is calculated how?", ["Pounds added per year over pounds recovered", "Pounds added per year over the full charge", "Charge lost since install over system age", "Pounds added per visit over the charge"], 1, "Annual leak rate = (refrigerant added over 12 months / full charge) x 100.", "Type II: High-Pressure"], ["Owners of systems over 50 lbs must keep servicing records of what?", ["Certification numbers of all technicians used", "Amount and type of refrigerant added or removed", "Monthly pressure and temperature logs", "Purchase receipts for replacement parts"], 1, "Records of refrigerant added and removed must be kept (commonly retained for 3 years) for large systems.", "Type II: High-Pressure"], ["When charging a high-pressure system, liquid refrigerant should be added where?", ["Directly into the suction line at full flow", "Into the liquid line on the high side", "Into the crankcase through the oil port", "Into the low side with the compressor off"], 1, "Charge liquid into the high side with the unit off; if adding to the low side of a running unit, throttle to vapor to avoid slugging.", "Type II: High-Pressure"], ["The deep-vacuum (dehydration) target before charging a system is about what?", ["29 inches Hg only", "500 microns", "5 psig", "10 inches Hg"], 1, "Pull the system down to roughly 500 microns and confirm it holds before charging.", "Type II: High-Pressure"], ["After reaching the target vacuum, you should do what?", ["Break the vacuum with refrigerant immediately", "Isolate the pump and watch for pressure rise", "Run the pump another hour as a margin", "Open the service valves to equalize"], 1, "Valve off the pump and watch the micron gauge; a rising pressure means remaining moisture or a leak. A rise that levels off = moisture still boiling; a steady climb = leak.", "Type II: High-Pressure"], ["Type III certification covers which appliances?", ["High-pressure split systems and heat pumps", "Low-pressure appliances such as centrifugal chillers", "Factory-sealed appliances holding 5 lbs or less", "Very-high-pressure CO2 systems"], 1, "Type III = low-pressure systems, typically centrifugal chillers using R-11, R-113, or R-123.", "Type III: Low-Pressure"], ["A low-pressure refrigerant has a boiling point at atmospheric pressure of what?", ["Below -50 F", "Above 50 F", "Between 0 and 32 F", "Exactly 32 F at sea level"], 1, "Low-pressure refrigerants boil above 10 C (50 F) at atmospheric pressure, so the system runs in a vacuum.", "Type III: Low-Pressure"], ["Using post-1993 equipment, a low-pressure appliance must be evacuated to what?", ["25 in Hg vacuum", "10 in Hg vacuum", "25 mm Hg absolute", "0 psig"], 2, "Low-pressure equipment must be evacuated to 25 mm Hg absolute.", "Type III: Low-Pressure"], ["The low side of a low-pressure chiller normally operates at what?", ["Well above atmospheric pressure", "In a vacuum (below atmospheric)", "Exactly atmospheric", "At 410 psig"], 1, "Low-pressure systems run in a vacuum on the low side, which is why air/moisture tends to leak in.", "Type III: Low-Pressure"], ["A purge unit on a low-pressure chiller removes what?", ["Excess oil returning from the evaporator", "Air and other non-condensables", "Refrigerant vapor for storage during service", "Scale and sludge from the water tubes"], 1, "Because the system runs in a vacuum, air leaks in; the purge unit removes those non-condensables.", "Type III: Low-Pressure"], ["When leak-testing a low-pressure appliance, you must NOT pressurize it above what?", ["10 psig", "30 psig", "50 psig", "150 psig"], 0, "Low-pressure shells are not built for high pressure; do not pressurize above 10 psig for leak testing.", "Type III: Low-Pressure"], ["A rupture disc on a low-pressure chiller is typically set to relieve at about what pressure?", ["5 psig", "15 psig", "150 psig", "500 psig"], 1, "Low-pressure chiller rupture discs commonly relieve around 15 psig to protect the low-pressure shell.", "Type III: Low-Pressure"], ["Recovery from a low-pressure chiller is slow and is often aided by what?", ["Chilling the evaporator to condense vapor", "Warming the refrigerant to raise its pressure", "Venting non-condensables to speed transfer", "Adding nitrogen to push liquid across"], 1, "High-boiling low-pressure refrigerant recovers slowly; warming the liquid and pulling pressure down speeds removal.", "Type III: Low-Pressure"], ["Where is the ozone layer that Section 608 aims to protect located?", ["In the stratosphere", "At ground level", "In the troposphere", "Inside cloud formations"], 0, "Stratospheric ozone absorbs harmful UV radiation. Ground-level ozone is smog, a different problem.", "Core: Regs & Ozone"], ["Why is stratospheric ozone depletion harmful?", ["Ground-level smog concentrations increase", "More ultraviolet radiation reaches the surface", "Global average temperatures rise sharply", "Acid rain becomes more frequent and severe"], 1, "Less ozone = more UV at the surface = skin cancer, cataracts, crop damage. That's the whole point of the CFC phaseout.", "Core: Regs & Ozone"], ["What actually destroys ozone molecules when a CFC reaches the stratosphere?", ["The fluorine atom freed by UV radiation", "The chlorine atom freed by UV radiation", "The carbon backbone reacting with ozone", "Water vapor carried up with the refrigerant"], 1, "UV cracks the CFC, freeing chlorine. One chlorine atom destroys ozone molecules over and over. Chlorine content is why CFC > HCFC > HFC in ODP.", "Core: Regs & Ozone"], ["R-22 belongs to which refrigerant class?", ["CFC", "HFC", "HCFC", "Natural refrigerant"], 2, "R-22 = HCFC (some chlorine, lower ODP than CFCs). R-12 = CFC. R-134a/R-410A = HFC (no chlorine).", "Core: Regs & Ozone"], ["Can an uncertified apprentice handle refrigerant?", ["Yes, after registering with the EPA as an apprentice", "Yes, under direct supervision of a certified tech", "Only on small appliances holding under 5 lbs", "No, certification is required before any handling"], 1, "The apprentice exemption: allowed while closely and continually supervised by a certified tech.", "Core: Regs & Ozone"], ["400-series blends like R-410A and R-407C are which type of blend?", ["Azeotropic", "Zeotropic", "Single-compound refrigerants", "Inorganic refrigerants"], 1, "400-series = ZEOtropic: components boil at different temps, so the blend has glide and can fractionate. 500-series = azeotropic, acts like one refrigerant. Zeotropic 400s have temperature glide and can fractionate. Azeotropic 500s act as one compound.", "Core: Refrigerants & Cylinders"], ["Why must zeotropic blends be charged as a liquid?", ["Liquid charging prevents compressor slugging", "Vapor charging fractionates the blend", "Vapor charging overheats the recovery cylinder", "Liquid charging keeps superheat within range"], 1, "Pull vapor off a zeotrope and the lighter component leaves first: the blend left behind is off-spec. Charge liquid to keep the recipe intact. Pulling vapor takes the lighter component first, leaving an off-spec blend behind.", "Core: Refrigerants & Cylinders"], ["What is temperature glide?", ["The high-side to low-side temperature difference", "A blend's evaporating temperature range at one pressure", "The saturation temperature change per psi", "The temperature drop across the metering device"], 1, "Zeotropic blends don't boil at one temperature; they slide across a range. Single compounds and azeotropes have no glide.", "Core: Refrigerants & Cylinders"], ["Can a vacuum pump alone be used to recover refrigerant from a small appliance?", ["Yes, if it pulls at least 4 in Hg on the appliance", "No, its exhaust vents refrigerant to the room", "Yes, if the exhaust runs through a filter-drier", "Only on appliances built before November 1993"], 1, "A vacuum pump just moves refrigerant into the room. Recovery requires certified recovery equipment that captures it.", "Type I: Small Appliance"], ["During system-dependent (passive) recovery, chilling the recovery cylinder in ice does what?", ["Prevents the cylinder from exceeding 80% fill", "Lowers the cylinder's pressure to speed migration", "Condenses moisture out of the refrigerant", "Keeps the cylinder below its 125 F storage limit"], 1, "Cold cylinder = low pressure = pressure difference pulls refrigerant in. Classic passive-recovery speed trick.", "Type I: Small Appliance"], ["What should be done with a solderless piercing-type access valve after service?", ["Leave it installed for future service access", "Replace it with a permanent leak-tight fitting", "Torque it to spec and leak-check it annually", "Back-seat it and cap it with a brass flare cap"], 1, "Clamp-on piercing valves leak with age. Don't leave them on the appliance as permanent fittings. Clamp-on piercing valves leak over time; they are not permanent fittings.", "Type I: Small Appliance"], ["When recovering from a small appliance with a non-operating compressor using passive recovery, you should:", ["Recover from the high side only, then vacuum", "Heat and tap the compressor; access both sides", "Replace the compressor before recovering", "Chill the compressor to condense the refrigerant"], 1, "Non-running compressor traps refrigerant in the oil. Heating/tapping frees it; accessing both sides speeds migration.", "Type I: Small Appliance"], ["When working on an R-600a (isobutane) appliance, which precaution applies?", ["Wear supplied-air respiratory protection", "Eliminate ignition sources; use spark-proof tools", "Ground the appliance chassis before opening", "Recover into a glass-lined cylinder only"], 1, "R-600a is A3, highly flammable. Small charge sizes keep it legal in fridges, but sparks near a leak are the hazard.", "Type I: Small Appliance"], ["Refrigerant recovered from a small appliance that will be sold to another owner must first be:", ["Reclaimed to AHRI 700 purity by a certified reclaimer", "Recycled on-site with any machine", "Filtered through a drier once", "Nothing, recovered refrigerant can always be resold"], 0, "Change of ownership = reclaim to AHRI 700. Reuse without reclaiming is only allowed back into the same owner's equipment.", "Type I: Small Appliance"], ["A high-pressure system has leaks so bad it cannot reach the required recovery vacuum. Before repair you should evacuate it to:", ["0 psig (atmospheric pressure)", "10 in Hg vacuum anyway", "25 mm Hg absolute", "No evacuation is required"], 0, "Leaky-system exception: pulling a vacuum would just suck air in through the leak. Take it to 0 psig, repair, then finish the job.", "Type II: High-Pressure"], ["Which gas should flow through tubing while brazing on an opened system?", ["Dry nitrogen", "Oxygen", "Compressed air", "Refrigerant vapor"], 0, "A nitrogen sweep prevents oxidation scale inside the tubing. Never oxygen or air (explosion risk with oil).", "Type II: High-Pressure"], ["To speed recovery from a large high-pressure system, you should remove:", ["Vapor first, then the remaining liquid", "Liquid first, then the remaining vapor", "Vapor only; liquid stays for disposal", "Oil first, then liquid and vapor together"], 1, "Liquid moves pounds fast; vapor recovery is slow. Pull liquid first, finish with vapor.", "Type II: High-Pressure"], ["An open (non-hermetic) compressor that has sat unused for months is most likely to leak from the:", ["Shaft seal", "Discharge valve", "Oil plug", "Terminal box"], 0, "The rotating shaft seal dries out when idle. Classic exam answer for open-drive compressors.", "Type II: High-Pressure"], ["Under the leak-repair rules, appliances that have exceeded the leak threshold are subject to:", ["Mandatory retirement within five years", "Periodic follow-up leak inspections", "Monthly refrigerant purity sampling", "A permanent ban on adding refrigerant"], 1, "Post-2019 rules add follow-up inspections once an appliance over 50 lbs trips its threshold. Annual for comfort cooling; quarterly for 500+ lb commercial and industrial process.", "Type II: High-Pressure"], ["Refrigerant should be charged into a high-pressure system as vapor through the:", ["Low side", "High side", "Oil fill port", "Purge unit"], 0, "Vapor charges through the low side; liquid through the high side (liquid line). Reversing either can slug the compressor.", "Type II: High-Pressure"], ["Which refrigerants are used in low-pressure (Type III) chillers?", ["R-11 and R-123", "R-22 and R-410A", "R-134a and R-404A", "R-290 and R-600a"], 0, "R-11 (CFC, phased out) and its replacement R-123 (HCFC). Both boil above room temperature at atmospheric pressure.", "Type III: Low-Pressure"], ["Because a low-pressure chiller operates in a vacuum, a leak causes:", ["Air to leak INTO the system", "Refrigerant to spray out under pressure", "Immediate compressor failure", "Oil loss only"], 0, "Below atmospheric pressure, leaks run backward: air and moisture get pulled in. That's why purge units exist.", "Type III: Low-Pressure"], ["Where do air and non-condensables collect in a low-pressure chiller, and what removes them?", ["At the top of the condenser; the purge unit removes them", "In the evaporator; the filter-drier removes them", "In the oil sump; the oil heater removes them", "In the cooling tower; the fan removes them"], 0, "Air rises to the highest-pressure point, the top of the condenser. The purge unit vents it while recovering entrained refrigerant.", "Type III: Low-Pressure"], ["Excessive purge-unit run time on a low-pressure chiller usually indicates:", ["An overcharge of refrigerant", "An air leak somewhere in the machine", "Chilled-water flow below design", "Normal operation for R-123 chillers"], 1, "Purge running constantly = air constantly entering = leak. Fix the leak, don't just let the purge eat refrigerant.", "Type III: Low-Pressure"], ["Why is refrigerant vapor charged into an evacuated chiller before any liquid?", ["Liquid cannot pass the evaporator charging valve", "Boiling liquid in the vacuum can freeze the tube water", "Vapor establishes the oil return path first", "Liquid charging would overload the purge unit"], 1, "Boiling liquid in a vacuum pulls tube temps below 32 F and freezes the water side: cracked tubes. Vapor first, always.", "Type III: Low-Pressure"], ["You should charge vapor into an evacuated chiller until:", ["Pressure reads exactly 0 psig on the gauge", "Pressure reaches a saturation temperature near 36 F", "The purge unit begins cycling automatically", "Half the nameplate charge has been added"], 1, "Raise pressure until the saturation temperature is safely above 32 F (about 36 F), then switch to liquid.", "Type III: Low-Pressure"], ["A centrifugal chiller is charged through the:", ["Evaporator charging valve", "High-side compressor service valve", "Condenser drain", "Purge unit connection"], 0, "The evaporator charging valve is the standard (lowest) charge point on a centrifugal machine.", "Type III: Low-Pressure"], ["During evacuation of a chiller, freezing of the water in the tubes is prevented by:", ["Adding glycol to the chilled-water loop", "Circulating water through the chiller tubes", "Pulling the vacuum as rapidly as possible", "Isolating and closing all chilled-water valves"], 1, "Moving water resists freezing and carries heat in. Alternative on a wet system: break the vacuum with nitrogen to raise pressure.", "Type III: Low-Pressure"], ["Before removing oil from a low-pressure system, the oil should be heated to about 130 F because:", ["Cold oil is too viscous for the drain pump", "Hot oil releases its dissolved refrigerant", "Heat separates acid from the oil before disposal", "The oil heater protects bearings during pump-down"], 1, "Refrigerant dissolves in cold oil. Heat it and the refrigerant boils out for recovery instead of leaving with the oil.", "Type III: Low-Pressure"], ["A hydrostatic tube test kit is used on a chiller to:", ["Verify the rupture disc's relief setting", "Determine whether a water tube leaks", "Measure moisture content in the refrigerant", "Pressure-test the purge unit's return line"], 1, "Suspected tube leak = hydrostatic tube test. Moisture collecting in the purge unit is the telltale symptom of leaking tubes.", "Type III: Low-Pressure"]], SEQ=[["Refrigeration cycle", ["Compressor (low-pressure vapor in, high-pressure vapor out)", "Condenser (vapor rejects heat, becomes liquid)", "Metering device (pressure drops)", "Evaporator (liquid absorbs heat, boils to vapor)"]], ["Recovery procedure on a large system", ["Connect with low-loss fittings", "Recover liquid refrigerant first", "Recover remaining vapor", "Reach the required evacuation level", "Verify the vacuum holds (no pressure rebound from trapped liquid)"]], ["Charging an evacuated low-pressure chiller", ["System sits at deep vacuum after evacuation", "Charge VAPOR through the evaporator charging valve", "Continue until pressure = saturation temp of about 36 F", "Switch to liquid charging", "Complete the charge"]], ["How a CFC destroys ozone", ["CFC released at ground level", "Drifts to the stratosphere", "UV radiation breaks off a chlorine atom", "Chlorine destroys ozone molecules repeatedly", "More UV reaches the surface"]], ["Leak-repair compliance timeline", ["Appliance over 50 lbs exceeds its leak rate", "Repair within 30 days", "Verification test the repair", "Periodic follow-up leak inspections"]], ["Small appliance disposal chain", ["Owner discards appliance", "Technician or final processor recovers remaining refrigerant", "Recovery verified before scrapping", "Appliance crushed/recycled"]]], MATCH=[["Evacuation levels (post-1993 equipment)", [["High-pressure, under 200 lbs", "0 in Hg"], ["High-pressure, 200 lbs or more", "10 in Hg"], ["Medium-pressure, under 200 lbs", "10 in Hg"], ["Medium-pressure, 200 lbs or more", "15 in Hg"], ["Very high-pressure", "0 in Hg (0 psig)"], ["Low-pressure", "25 mm Hg ABSOLUTE"]]], ["Small appliance numbers", [["Compressor operating", "Recover 90%"], ["Compressor not operating", "Recover 80%"], ["Alternative standard", "Evacuate to 4 in Hg"], ["Small appliance charge limit", "5 lbs or less"], ["Passive recovery limit", "15 lbs or less"]]], ["Leak rates (current law)", [["Comfort cooling", "10% per year"], ["Commercial refrigeration", "20% per year"], ["Industrial process", "30% per year"], ["Repair deadline", "30 days"], ["Rule threshold", "50 lbs charge"]]], ["Cylinder facts", [["Maximum fill", "80% by weight"], ["Recovery cylinder colors", "Gray body, yellow top"], ["Hydrostatic retest", "Every 5 years"], ["Disposable DOT-39", "Never refill"], ["Max storage temp", "About 125 F"]]], ["Refrigerant classes", [["R-12", "CFC"], ["R-22", "HCFC"], ["R-410A", "HFC blend"], ["R-32", "A2L (mildly flammable)"], ["R-290 / R-600a", "A3 (flammable hydrocarbon)"], ["R-11 / R-123", "Low-pressure (Type III)"]]], ["Three Rs", [["Recover", "Remove and store, no processing"], ["Recycle", "Clean on-site, reuse same owner"], ["Reclaim", "AHRI 700 purity, required for resale"]]], ["Certification types", [["Type I", "Small appliances, 5 lbs or less"], ["Type II", "High-pressure (splits, racks)"], ["Type III", "Low-pressure chillers"], ["Universal", "All of the above"], ["Section 609", "Car AC, different exam"]]], ["Type III specifics", [["Leak test maximum", "10 psig"], ["Rupture disc setting", "15 psig"], ["Purge unit removes", "Air from top of condenser"], ["Charging valve", "Evaporator"], ["Charge first with", "Vapor (to about 36 F sat temp)"], ["Oil removal prep", "Heat to about 130 F"]]], ["Safety numbers", [["Oil change max pressure", "5 psig"], ["Deep vacuum target", "About 500 microns"], ["Pressure testing gas", "Dry nitrogen, never oxygen"], ["Confined space risk", "Oxygen displacement"], ["Refrigerant + flame", "Toxic decomposition gases"]]], ["P-T concepts", [["Superheat", "Vapor above saturation temp"], ["Subcooling", "Liquid below saturation temp"], ["Pressure rises", "Saturation temp rises"], ["Zeotropic blend (400s)", "Glide, charge as liquid"], ["Azeotropic blend (500s)", "Acts as one compound"]]]], NOTES=[["Read first: how to beat this exam", ["Structure: 25 questions per section (Core + Type I + II + III for Universal), 18 of 25 passes each. Sections score independently, and on SkillCat you retake only what you miss.", "MEMORY DUMP: the second you get scratch paper, write the numbers wall before question 1: the evacuation table, 10/20/30 leak rates, 90/80/4, 80%, 5-year, 125 F, 5 psig, 500 microns, 10 psig, 15 psig, 25 mm Hg, 36 F, 130 F, Nov 15 1993.", "CUT RULE: any question containing 'November 15, 1993' is asking whether the equipment is grandfathered. Post-1993 = the strict modern table.", "CUT RULE: 'mm Hg' belongs to LOW-PRESSURE only (25 mm Hg absolute). If the option says 25 INCHES Hg for a post-1993 low-pressure question, it's the legacy trap.", "Two dual-answer landmines, both flagged in the drill: leak rates (current 10/20/30 vs legacy 15/35/35) and HP-under-200 evacuation (current 0 vs legacy 10 in Hg). Modern proctored exams score current law. Read the stem for era hints before answering."]], ["The numbers wall (evacuation table)", ["Post-1993 equipment: HP under 200 lbs -> 0. HP 200+ -> 10. MP under 200 -> 10. MP 200+ -> 15. Very high pressure -> 0. Low pressure -> 25 mm Hg ABSOLUTE.", "MNEMONIC: a bouncer at a pressure nightclub. The heavyweights (200+ lbs) get patted down harder: HP goes 0 -> 10 as weight crosses 200, MP goes 10 -> 15. The very-high-pressure guy is so twitchy (CO2) the bouncer just waves him through at 0. The low-pressure guy lives in the basement (vacuum) and gets the microscope: 25 mm, measured in millimeters because he's that far down.", "Small appliance: 90% compressor running, 80% dead, or 4 in Hg. HOOK: a 90s kid with a working stereo, an 80s kid whose stereo died, and a 4th grader with a vacuum cleaner.", "Leaky-system exception: if leaks make the target vacuum impossible, evacuate to 0 psig, fix the leak, then finish. Pulling vacuum on a leaker just inhales air."]], ["Leak rates and repair rules", ["Current thresholds, alphabetical and climbing: Comfort cooling 10, Commercial 20, Industrial 30. HOOK: C-C-I in dictionary order, counting by tens.", "Applies to appliances holding 50 lbs or more (15 lbs for high-GWP HFCs under the 2026 HFC rules). Small appliances: no repair requirement at all.", "Trip the threshold -> repair within 30 days -> verification test -> periodic inspections (annual comfort cooling, quarterly for 500+ lb commercial/IPR).", "Annual leak rate = pounds added per year / total charge. Owners of 50+ lb systems keep service records.", "Legacy exams taught 15/35/35. If a question smells old, the explanation in the drill gives the decision rule. Default: current numbers."]], ["Ozone and the regs story", ["The chain: CFC released -> drifts to stratosphere -> UV cracks it -> chlorine destroys ozone over and over -> more UV hits the surface. Chlorine content IS the villain: CFC (most Cl) > HCFC > HFC (none, ODP zero).", "HFCs dodge the ozone problem but are potent greenhouse gases, so the AIM Act phases them DOWN (not out) and A2Ls take over. Montreal Protocol = ozone treaty. SNAP = EPA's approved-substitutes list.", "Dates: R-22 production/import ended Jan 1 2020. Refrigerant sales restricted to certified techs since Jan 1 2018.", "Venting any refrigerant (including HFCs and substitutes) is illegal. De minimis release during proper recovery is the one free pass. Fines run to about $59k per day per violation.", "Apprentices can handle refrigerant only under direct supervision of a certified tech. MVACs are Section 609, a different world."]], ["The three Rs", ["RECOVER = remove and store, zero processing. RECYCLE = clean it on-site (oil separation + filter-driers), reuse in the SAME owner's equipment. RECLAIM = certified reclaimer restores it to AHRI 700, mandatory before it changes owners or gets resold.", "HOOK: recover is bagging leftovers, recycle is reheating them for yourself, reclaim is a restaurant re-serving food, which the health inspector (AHRI 700) has to sign off on.", "Equipment: self-contained (active) machines have their own pump, required over 15 lbs. System-dependent (passive) rides the appliance's own compressor/pressure, legal only at 15 lbs or less. A bare vacuum pump is VENTING, never recovery.", "Recovery equipment built after Nov 15, 1993 must be EPA-certified, with low-loss fittings on the hoses."]], ["Cylinders and safety", ["Cylinder wall: fill to 80% max by weight (liquid expands, full tanks explode). Recovery cylinders are gray with yellow tops. Refillables get hydro-tested every 5 years. DOT-39 disposables are NEVER refilled. Store under about 125 F.", "HOOK: the gray-bodied, yellow-capped guy at the gym: never more than 80% effort, physical every 5 years, keeps it under 125.", "Never pressurize with oxygen or compressed air: oil plus oxygen under pressure detonates. Dry nitrogen only, trace refrigerant optional for sniffing.", "Refrigerant is heavier than air and displaces oxygen: confined-space asphyxiation is the kill mechanism. On skin it's frostbite. In a flame it decomposes into acid gases.", "Numbers: oil changes below 5 psig. Dehydration vacuum about 500 microns. High head pressure = non-condensables (air). Acrid smell during recovery = burnout acid."]], ["Type I: small appliances", ["Definition: factory-made, hermetically sealed, 5 lbs or less. Fridges, window units, dehumidifiers, water coolers.", "The 90/80/4 rule is the whole section: 90% recovery with the compressor running, 80% with it dead, or pull 4 in Hg.", "Dead compressor tricks: heat it, tap it, access high AND low sides. Passive recovery speeds up if you chill the recovery cylinder (cold cylinder = low pressure = refrigerant migrates in).", "Piercing valves are temporary: clamp-on solderless valves leak over time, don't leave them installed. Recovered refrigerant that changes owners must be reclaimed to AHRI 700 first.", "No leak-repair requirement for small appliances. The last person in the disposal chain (scrapper/landfill) must recover or verify recovery. R-600a (isobutane) is approved for household fridges: A3 flammable, spark-proof tools."]], ["Type II: high-pressure", ["Scope: everything from splits to supermarket racks (R-22, R-410A, R-134a and friends). Evacuation table lives in the numbers wall above.", "Recovery speed: LIQUID FIRST, then vapor. Charging: vapor into the low side, liquid into the high side.", "Brazing on an open system: sweep dry nitrogen through the tubing or you cook oxide scale into it. Open-drive compressors leak at the shaft seal, especially after sitting.", "Deep vacuum to about 500 microns for dehydration; if the vacuum won't hold after you stop, refrigerant is still boiling out of oil or a leak is feeding it."]], ["Type III: the upside-down world", ["Low-pressure chillers (R-11, R-123) run in a VACUUM. Everything inverts: leaks pull air IN through gaskets and fittings, so a purge unit sits on top of the condenser skimming air out. Purge running constantly = go find the leak. Water collecting in the purge = leaking tubes, confirm with a hydrostatic tube test kit.", "THE section trap: 25 mm Hg ABSOLUTE (post-1993), not 25 inches. Millimeters for the basement dweller.", "Freeze physics drive everything: liquid refrigerant hitting a deep vacuum boils violently and freezes the water in the tubes. So: charge VAPOR first (through the EVAPORATOR charging valve) until pressure = about 36 F saturation, then liquid. During evacuation, circulate water through the tubes (or break vacuum with nitrogen on a wet system).", "Pressure ceilings: leak test at 10 psig max, because the rupture disc on the evaporator lets go around 15 psig.", "Oil holds dissolved refrigerant: heat to about 130 F before removal so the refrigerant boils out for recovery. Recover liquid first, then vapor, same as Type II.", "ASHRAE 15 machinery rooms: oxygen deprivation sensor for ALL refrigerants, plus a refrigerant-specific sensor for R-123 (it's more toxic than the R-11 it replaced, the classic gotcha).", "Major repair = compressor, condenser, or evaporator replacement: full evacuation required. Non-major work on a leak-free system can use lesser levels."]], ["Refrigerant chemistry quick hits", ["P-T law: pressure up, saturation temperature up. Superheat = vapor hotter than saturation. Subcooling = liquid cooler than saturation. The P-T chart converts pressure to temperature and is usually provided on the exam.", "Blends: 400-series = zeotropic, has temperature glide, can fractionate, CHARGE AS LIQUID. 500-series = azeotropic, behaves as one compound. HOOK: the 400s are a garage band (members leave one at a time), the 500s are one solo artist.", "Safety matrix: letter = toxicity (A low, B high), number = flammability (1 none, 2L mild, 2, 3 high). R-410A = A1. R-32/R-454B = A2L. R-290/R-600a = A3. R-123 = B1.", "Filter-drier catches moisture and acid. Non-condensables ride the top of the condenser and jack up head pressure."]]];
const $=s=>document.getElementById(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TABS=[["fc","Flashcards"],["mc","MCQs"],["sq","Sequencing"],["mt","Matching"],["nt","Notes"]];

TABS.forEach(([k,lbl],i)=>{const b=document.createElement("button");b.className="tab"+(i?"":" on");b.textContent=lbl;b.onclick=()=>showTab(k);b.id="t-"+k;$("tabs").appendChild(b)});
function showTab(k){TABS.forEach(([x])=>{$("t-"+x).classList.toggle("on",x===k);$(x+"-panel").classList.toggle("on",x===k)})}

/* FLASHCARDS */
let fcOrder=sh(FLASH.map((_,i)=>i)),fcI=0,fcFlip=false;
function fcRender(){
  const [term,def]=FLASH[fcOrder[fcI]];
  $("fc-panel").innerHTML=
   '<div class="bar"><button class="nav" id="fcShuf">shuffle</button><span class="pos">'+(fcI+1)+' / '+FLASH.length+'</span></div>'+
   '<div class="fc" id="fcCard"><div class="tag">'+(fcFlip?"definition":"term")+'</div>'+
   '<div class="face '+(fcFlip?"fcdef":"term")+'">'+esc(fcFlip?def:term)+'</div>'+
   '<div class="flip">tap to flip</div></div>'+
   '<div class="act"><button class="nav" id="fcPrev">‹ prev</button><button class="nav" id="fcNext">next ›</button></div>';
  $("fcCard").onclick=()=>{fcFlip=!fcFlip;fcRender()};
  $("fcShuf").onclick=()=>{fcOrder=sh(fcOrder);fcI=0;fcFlip=false;fcRender()};
  $("fcPrev").onclick=()=>{fcI=(fcI-1+FLASH.length)%FLASH.length;fcFlip=false;fcRender()};
  $("fcNext").onclick=()=>{fcI=(fcI+1)%FLASH.length;fcFlip=false;fcRender()};
}

/* MCQS */
const isMulti=i=>Array.isArray(MCQS[i][2]);
const corrSet=i=>new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]]);
let mcFilter="",mcList=[],mcI=0,mcOpts=[],mcDone=false,mcSel=new Set();
function mcBuild(){mcList=MCQS.map((_,i)=>i).filter(i=>!mcFilter||MCQS[i][4]===mcFilter);mcI=0;mcRender()}
function mcRender(){
  if(!mcList.length){$("mc-panel").innerHTML="<p>None.</p>";return}
  const i=mcList[mcI],m=MCQS[i],multi=isMulti(i);
  mcOpts=sh(m[1].map((t,oi)=>({oi,text:t})));mcDone=false;mcSel=new Set();
  const tops=[...new Set(MCQS.map(x=>x[4]))];
  let h='<div class="bar"><select id="mcTopic"><option value="">All topics</option>'+tops.map(t=>'<option'+(t===mcFilter?' selected':'')+'>'+t+'</option>').join('')+'</select><span class="pos">'+(mcI+1)+' / '+mcList.length+'</span></div>';
  h+='<div class="mcq"><div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="mcOpts">';
  mcOpts.forEach((o,d)=>{h+='<div class="opt" data-d="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></div>'});
  h+='</div>';
  if(multi)h+='<div class="act"><button class="check" id="mcChk">Check</button></div>';
  h+='<div class="exp" id="mcExp"></div></div>';
  h+='<div class="act"><button class="nav" id="mcPrev">‹ prev</button><button class="nav" id="mcNext">next ›</button></div>';
  $("mc-panel").innerHTML=h;
  $("mcTopic").onchange=()=>{mcFilter=$("mcTopic").value;mcBuild()};
  document.querySelectorAll("#mcOpts .opt").forEach(o=>o.onclick=()=>mcPick(+o.dataset.d));
  if(multi)$("mcChk").onclick=mcReveal;
  $("mcPrev").onclick=()=>{mcI=(mcI-1+mcList.length)%mcList.length;mcRender()};
  $("mcNext").onclick=()=>{mcI=(mcI+1)%mcList.length;mcRender()};
}
function mcPick(d){
  if(mcDone)return;const i=mcList[mcI];
  if(isMulti(i)){const el=document.querySelector('#mcOpts .opt[data-d="'+d+'"]');if(mcSel.has(d)){mcSel.delete(d);el.classList.remove("sel")}else{mcSel.add(d);el.classList.add("sel")}return}
  mcSel=new Set([d]);mcReveal();
}
function mcReveal(){
  mcDone=true;const i=mcList[mcI],cs=corrSet(i);
  const chosen=new Set([...mcSel].map(d=>mcOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#mcOpts .opt").forEach(el=>{const oi=mcOpts[+el.dataset.d].oi;el.style.pointerEvents="none";el.classList.remove("sel");
    if(cs.has(oi))el.classList.add("correct");else if(chosen.has(oi))el.classList.add("wrong");else el.classList.add("dim")});
  const e=$("mcExp");e.className="exp show";e.innerHTML="<b>"+(ok?"Correct.":"Answer above.")+"</b> "+esc(MCQS[i][3]);
}

/* SEQUENCING */
let sqI=0,sqOrder=[],sqPick=[];
function sqRender(){
  const [title,steps]=SEQ[sqI];sqPick=[];
  if(!sqOrder.length||sqOrder._for!==sqI){sqOrder=sh(steps.map((_,i)=>i));sqOrder._for=sqI}
  let h='<div class="bar"><select id="sqSel">'+SEQ.map((s,i)=>'<option'+(i===sqI?' selected':'')+'>'+esc(s[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap the steps in the correct order.</div><div id="sqList">';
  sqOrder.forEach(oi=>{h+='<button class="seqitem" data-oi="'+oi+'"><span class="num"></span><span>'+esc(steps[oi])+'</span></button>'});
  h+='</div><div class="act"><button class="check" id="sqChk">Check order</button><button class="nav" id="sqRst">reset</button></div><div class="res" id="sqRes"></div>';
  $("sq-panel").innerHTML=h;
  $("sqSel").onchange=()=>{sqI=$("sqSel").selectedIndex;sqOrder=[];sqRender()};
  document.querySelectorAll("#sqList .seqitem").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi;if(sqPick.includes(oi))return;sqPick.push(oi);
    b.classList.add("picked");b.querySelector(".num").textContent=sqPick.length;
  });
  $("sqChk").onclick=()=>{
    if(sqPick.length<steps.length){$("sqRes").textContent="Place all "+steps.length+" steps first.";return}
    let right=0;document.querySelectorAll("#sqList .seqitem").forEach(b=>{const oi=+b.dataset.oi;const pos=sqPick.indexOf(oi);
      b.classList.remove("ok","no");if(pos===oi){b.classList.add("ok");right++}else b.classList.add("no")});
    $("sqRes").innerHTML=right===steps.length?'<span style="color:var(--good)">Correct order ✓</span>':right+' / '+steps.length+' in the right spot. Red = wrong position.';
  };
  $("sqRst").onclick=()=>{sqRender()};
}

/* MATCHING */
let mtI=0,mtRight=[],mtLeftSel=null,mtPairs={};
function mtRender(){
  const [title,pairs]=MATCH[mtI];mtLeftSel=null;mtPairs={};
  mtRight=sh(pairs.map((p,i)=>({i,text:p[1]})));
  let h='<div class="bar"><select id="mtSel">'+MATCH.map((m,i)=>'<option'+(i===mtI?' selected':'')+'>'+esc(m[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap a term, then its match.</div><div class="cols"><div id="mtL"></div><div id="mtR"></div></div>';
  h+='<div class="act"><button class="check" id="mtChk">Check</button><button class="nav" id="mtRst">reset</button></div><div class="res" id="mtRes"></div>';
  $("mt-panel").innerHTML=h;
  let L='';pairs.forEach((p,i)=>{L+='<button class="mitem" data-li="'+i+'"><span>'+esc(p[0])+'</span></button>'});$("mtL").innerHTML=L;
  let R='';mtRight.forEach(r=>{R+='<button class="mitem" data-ri="'+r.i+'"><span>'+esc(r.text)+'</span></button>'});$("mtR").innerHTML=R;
  $("mtSel").onchange=()=>{mtI=$("mtSel").selectedIndex;mtRender()};
  document.querySelectorAll("#mtL .mitem").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#mtL .mitem").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");mtLeftSel=+b.dataset.li});
  document.querySelectorAll("#mtR .mitem").forEach(b=>b.onclick=()=>{
    if(mtLeftSel===null)return;const ri=+b.dataset.ri;
    Object.keys(mtPairs).forEach(k=>{if(mtPairs[k]===ri)delete mtPairs[k]});
    mtPairs[mtLeftSel]=ri;
    document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.toggle("matched",li in mtPairs);if(li===mtLeftSel)x.classList.remove("sel")});
    document.querySelectorAll("#mtR .mitem").forEach(x=>{const r=+x.dataset.ri;x.classList.toggle("matched",Object.values(mtPairs).includes(r))});
    mtLeftSel=null;
  });
  $("mtChk").onclick=()=>{
    let right=0;document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.remove("miss");
      if(mtPairs[li]===li)right++;else if(li in mtPairs)x.classList.add("miss")});
    $("mtRes").innerHTML=right===pairs.length?'<span style="color:var(--good)">All matched ✓</span>':right+' / '+pairs.length+' correct. Red = wrong match.';
  };
  $("mtRst").onclick=()=>mtRender();
}

/* NOTES */
function ntRender(){
  let h='';NOTES.forEach((n,i)=>{h+='<div class="note'+(i?'':' open')+'"><h3>'+esc(n[0])+'<span class="ch">'+(i?'+':'–')+'</span></h3><ul>'+n[1].map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>'});
  $("nt-panel").innerHTML=h;
  document.querySelectorAll(".note h3").forEach(hd=>hd.onclick=()=>{const n=hd.parentElement;n.classList.toggle("open");hd.querySelector(".ch").textContent=n.classList.contains("open")?'–':'+'});
}

fcRender();mcBuild();sqRender();mtRender();ntRender();showTab("fc");
</script></body></html>
