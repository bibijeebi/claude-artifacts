{k:'ref',t:'Contents',tags:['start'],x:`This is a job book, not a diary. Every job below is written start to finish, but the parts that repeat on every job are pulled out into their own modules and transcluded in. Change the module once and every job that uses it updates.

{k:'job',t:'JOB-001 Durham County Courthouse',tags:['job','commercial','ptac','portable','2025'],d:'Fri 12/19/2025',s:'Durham County Courthouse, Durham NC',h:'10:00a - 3:00p (5.5 hr)',sys:'PTAC / in-wall fan coil',x:`Your first shift with CQA. Known on the paperwork as the Jet Fast job. Five and a half hours at 15 an hour, and it landed on check #51360 alongside [[JOB-002 Greensboro PD]].

!! Roll out
You drove your own Tesla and parked in the Third Street parking garage. Arrived about ten minutes early for a 10:00 start. On day one the deal was pay for work plus commute reimbursed. Door-to-door came later. That gas and parking reimbursement was promised on the next check and has never appeared on a stub since. ~~still open~~

Crew: [[Jeff]] running it, plus Thomas, Andrew, Nate, Jack, Bryson, and one more you heard as Hi. Will never showed. His van blew a tire on the way, and his van had the adapter plug for the portable vacuum.

!! The equipment problem
That missing adapter is the whole logistics story of the day. You ended up at Home Depot buying a replacement plug, then sent Jeff an Amazon three-pack for about ten bucks so it would not happen again. This is the job that taught you the real rule: the tool that strands a crew is never the expensive one.

{{Equip: electric portable vacuum}}

!! The system
{{Sys: PTAC and fan coil}}

Because the units were in-wall and inside the building, the truck was the wrong tool. Short accessible runs, no reason to drag 200 feet of hose from the street. Portable was correct.

!! The work
# Trace the ductwork off each unit to a spot you can actually reach
# Find an existing access or cut one
# Feed the negative pressure hose in with the agitator on the end, the whip with the noodles, and knock the debris off the walls
# Pull it into the portable collection unit
# Move to the next unit, repeat across the building

{{Proc: whip and forward a run}}

!! What you got right on day one
Your read of the job was accurate: source removal cleaning is negative air plus mechanical agitation, and that is the NADCA-compliant method. Choosing portable over truck for in-wall units was the right instinct, not a shortcut.

!! Carry-forward
Cutting access is normal, not damage. Good crews cap holes with sheet metal access doors so the next cleaning does not need a new cut. See [[Proc: patch a sheet metal access]].`},

{k:'job',t:'JOB-006 Hallway fan-coil run',tags:['job','commercial','ptac','coil','2026'],d:'Fri 3/27/2026',s:'Site unconfirmed, hallway of fan-coil units',sys:'In-room fan coil / PTAC, one per room off a corridor',x:`This one you captured live. It is a recording of the on-site brief at the start of the shift, so it is the best record you have of how a crew actually gets split up.

{k:'job',t:'JOB-013 Two-story residential, attic AHU and package unit',tags:['job','residential','attic','package','2026','flagship'],d:'August 2026, exact date ~~unconfirmed~~',s:'Two-story single family home, NC',sys:'Two independent systems: attic air handler upstairs, package unit downstairs',x:`The most complete residential write-up you have. Two systems in one house, both cleaned in a day, and the debrief caught the reasoning, not just the steps.

!! Roll out
Met at Jeff's house. The vans were a clusterfuck and Jeff was managing it. Drove out, stopped at Sheetz to eat, then to the house.

Consequence of the van shuffle: the soaker hose attachment and the Cool Jet were in Jeff's van and did not come with you. You cleaned coils with a pump sprayer instead. That worked, but it is slower and less even than the airline-fed soaker.

{{Proc: roll out}}

!! Reading the house
Two independent systems, which is normal for a two-story in NC:
* ''Second floor'': air handler in the attic, evaporator coil in it, matched to a conventional outdoor condenser.
* ''First floor'': package unit outside. Compressor, condenser, evap coil, and blower all in one outdoor cabinet with the ducts running straight into it.

{{Sys: attic air handler}}
{{Sys: package unit}}

You asked why nobody touched the condenser sitting right there. The answer is scope, not laziness.

{{Rule: what is in scope}}

Andrew did not know what the condenser was. Worth knowing that the guy next to you may not have the vocabulary even if he can do the work.

---

!! Upstairs: the attic system

!!! Getting the vac up
Carried the electric vacuum up the stairs rather than rolling it. The flooring in the house was ripped out, so bare subfloor, and rolling on subfloor is no problem. The reason you carried it anyway traces back to an apartment job where the vac wheels had picked up paint from a previous job and tracked it all over.

''Rule of thumb'': check the wheels before you roll anything across a customer floor.

!!! Power
{{Equip: electric portable vacuum}}

Duct-taped the flex line to the top of the vacuum, long enough to reach the air handler in the attic.

!!! Coils and blower
{{Proc: clean the air handler}}

!!! Access hole
The return plenum was on the left side of the air handler. Cut an 8 inch access there. The hole cutter on the drill was set slightly too big, which made it fight.

{{Proc: cut an 8 inch access}}

Hooked the flex hose to the hole, then ''tied the hose off to a beam'' for strain relief. Without the tie-off the whole run wants to snake back down out of the attic into the second story.

!!! Cleaning the return side
One return. That is normal for a residential second-floor system: a single large hallway ceiling grille, one flex run up to the plenum box. There was no return trunk, because there was nothing for a trunk to collect. That answers the thing you could not remember.

Whip to knock debris off the wall, forward nozzle to push it up-line toward the negative air sitting at the plenum.

{{Proc: whip and forward a run}}

!!! Supply side
Supply is where the actual distribution lives, so that is where the trunk was. ''Round sheet metal trunk'', insulated, which matters at patch time because a flat patch has to be bent to the radius before it goes on.

Cut fairbairn-bit holes into the trunk to whip the runs back toward the negative air access. One bit fell into the trunk. Had to cut a 4 inch hole to reach in and retrieve it.

''Carry-forward'': a bit dropped into a trunk costs you a hole you did not plan on. Keep a hand on it going in.

---

!! Downstairs: the package unit
Gas negative air machine hooked into the package unit outside. Same rule as upstairs, just mirrored, because the suction was in a different place.

{{Equip: gas negative air machine}}

You flagged this as doing it backwards and it is not. Both floors are the same rule: agitate with the whip, push toward the suction with the forward nozzle. Which tool you reach for first only depends on where you are standing relative to the negative air.

---

!! Patching
{{Proc: patch a sheet metal access}}
{{Proc: pop-plug a bit hole}}

!! What this job settled
# With the system off there is no airflow, so ''supply-first versus return-first does not matter physically''. What matters is branches before trunk, and air handler last. See [[Rule: order of operations]].
# Never run the blower to help move debris while ducts are open. That recirculates through a dirty coil and blows it out the open supply registers into the house.
# The condenser is out of scope on every duct cleaning job unless it is sold separately.`},

{k:'job',t:'JOB-014 Lenoir County Jail',tags:['job','institutional','jail','2026','lint'],d:'Thu 8/20/2026',s:'Lenoir County Jail, Kinston NC',h:'6:05a - 2:20p (8h15m)',x:`Detention facility. Short day for a jail, which usually means either a partial scope or an access window that closed.

!! What to expect in a correctional facility
This is the job type the crew warns you about, and New Bern prison is the standing example. Constant laundry of uniforms and bedding plus high occupancy plus poor filtration equals lint. Not fluffy lint. It compresses into a ''solid disc'' at the return grille, and it does that even on buildings that get cleaned on a regular schedule.

Mechanism: lint hits the grille, the air slows, and layers stack up and press together.

!! Access is the real constraint
Corrections work is slower than the equivalent square footage anywhere else:
* security clearance and badge in
* escort requirements to move between areas
* lockdown schedules that stop work with no notice
* tool control. Every blade, bit, and screwdriver counts out and counts back in

That is also why these buildings go longer between cleanings than they should, which is why the buildup is that bad when you finally get in.

{k:'proc',t:'Proc: roll out',tags:['procedure','phase-1'],x:`The part of the day that is not the job but decides how the job goes.

# Meet point. Either Jeff's house or the site directly. Van assignments get sorted here and they get sorted badly.
# ''Check what is in your van before it leaves.'' The recurring failure mode is a specialty attachment sitting in the wrong van. Soaker hose, Cool Jet, coil jet, adapter plugs, hole cutters.
# Confirm the tool that only exists once. Adapter plugs, hole cutters, the good bits.
# Food stop happens on the way, not on site.
# Clock starts when you leave the house. Hours are door to door, minus an auto-deducted 30 minute lunch.

''The two jobs that prove this'': [[JOB-001 Durham County Courthouse]] lost time because the only vacuum adapter plug was in a van that blew a tire. [[JOB-013 Two-story residential, attic AHU and package unit]] cleaned coils with a pump sprayer because the soaker and the Cool Jet rode with Jeff.`},

{k:'proc',t:'Proc: walk the job',tags:['procedure','phase-2'],x:`Before anything gets cut, opened, or plugged in. This is the phase that separates a helper from someone who runs jobs.

# ''Find the air handler.'' Attic, mechanical room, rooftop, or a package unit outside. That tells you the system type.
# ''Count the systems.'' A two-story is often two independent systems with nothing shared. Do not assume one.
# ''Trace supply versus return.'' Follow the trunk from the handler. Supply fans out to many branches. Return is often one or two big runs.
# ''Count registers and grilles.'' That is your production number for the day.
# ''Find where negative air can sit.'' It needs power or gas, a place to stand, and a short path to a plenum or trunk.
# ''Find the access points that already exist.'' Every hole you do not cut is a hole you do not patch.
# ''Look for the red flags now'', not after you open a duct. See [[Rule: hazards and stop-work]].

You are not cleaning ducts, you are managing airflow through a tree structure. Once you see it that way you can predict where debris collects before you open anything.`},

{k:'proc',t:'Proc: stage and protect',tags:['procedure','phase-3'],x:`# ''Plastic sheeting'' under and around every work area. This is a major setup step, not an afterthought.
# ''Check the wheels'' on anything you are about to roll across a finished floor. Paint, mastic, and grit on vacuum casters transfer straight onto the customer floor. This is a real thing that has happened on an apartment job.
# ''Pull registers and grilles'' ahead of the cleaning crew and ''stack them in one place''. Scattered registers get lost, stepped on, and slow reinstall to a crawl.
# ''Pull ceiling tiles'' where the trunk runs above a drop ceiling, before cutting anything.
# ''Cut access holes ahead of the cleaners'' if you have the bodies and a second hole cutter. If you only have one cutter the whole crew balances around it and the cleaners wait.
# Assume the ''back side'' of every register is dirty even if someone wiped the fronts.`},

{k:'proc',t:'Proc: set the negative air',tags:['procedure','phase-4','equipment'],x:`Containment is the job. If the machine is not pulling on the side you are agitating, you are just redistributing dirt.

# Pick the tier. Electric portable for indoor, short-run, in-wall units. Gas squirrel cage for real duct volume, outdoor placement, package units and rooftops. Truck-mounted for long runs with parking access.
# Assemble tube from 8 to 10 inch sections. Duct-tape the joints or use the quick connects.
# Connect at the plenum or trunk, as close to the air handler as the access allows.
# ''Tie the hose off to a beam or a solid point for strain relief.'' In an attic, an untied hose snakes itself back down through the access into the floor below.
# Gas units: prime the bulb, check the gas can, and put the machine where the exhaust is not getting pulled back into the building.
# Machine runs the whole time you are agitating on that side. That is the actual rule, not the sequence.`},

{k:'proc',t:'Proc: cut an 8 inch access',tags:['procedure','phase-5','cutting'],x:`Standard access hole in insulated sheet metal duct. Round trunk, rectangular trunk, or plenum, same method.

# ''Score the insulation on three sides only'', in a square, and roll the flap back. Three sides, not four, so it folds back and re-seats when you patch.
# ''Drill a pilot hole'' dead center of where the access goes.
# ''Hole saw on the pilot, run clockwise, and go slow.'' Speed leaves knurled burr edges on the sheet metal that will open your hand up.
# Check the cutter is set to the size you actually want before you start. An oversized setting fights you the whole way through.
# Deburr the lip if it is rough.

''Sizes'': 8 inch is the standard access. 4 inch when you need to reach a hand in, for example to fish out a dropped bit. 1 inch fairbairn-bit holes for whip access along a trunk, which get pop plugs rather than a patch.

Every hole gets patched. See [[Proc: patch a sheet metal access]] and [[Proc: pop-plug a bit hole]].`},

{k:'proc',t:'Proc: whip and forward a run',tags:['procedure','phase-6','cleaning'],x:`Two tools, one rule.

* ''Whip'' with the noodles or skipper balls: mechanical agitation. Knocks the debris off the duct wall.
* ''Forward nozzle'', the air pusher on the compressor airline: directional air. Moves the loosened debris.

''The rule'': agitate, then push toward the negative air. Which one you pick up first only depends on where you are standing relative to the suction. There is no supply-side method and a different return-side method.

# Start at the ''far end'' of a run and work back toward your negative air access.
# ''Branches before the trunk.'' Whipping the trunk first and then the branches means you dumped branch debris into a trunk you already called clean.
# Feed in, agitate, forward, retract. Repeat down the run.
# On ''internally lined'' duct, do not whip hard. The liner releases fiber. Air washing is the right tool there.
# Watch the machine. If the pull drops off, you have a kink, a clogged filter, or a leak at a joint.

''Hose handling'': loose figure-eight or big loops. Corrugated hose has memory, and a kink becomes a permanent flat spot that costs you airflow. Nobody is doing careful over-under on a 6 inch corrugated hose at the end of a job, and nobody needs to.`},

{k:'proc',t:'Proc: clean the air handler',tags:['procedure','phase-7','coil'],x:`The air handler is the last thing you clean, because it sits between the supply and return sides and catches whatever either side knocks loose.

# Pull the side panel off the air handler.
# Mix the ''enzymatic coil cleaner'' and load the pump sprayer, or run the soaker hose off the airline if you have it. The airline-fed soaker or Cool Jet is faster and more even. The pump sprayer is the backup.
# ''Spray the evaporator coils'', a couple of passes, and let it work.
# ''Wipe the blower housing'' exterior in place. It does not need to come out for a standard clean.
# Reinstall the panel.

{{Equip: coil cleaner and pump sprayer}}

The ''condenser'' coil does not get touched. It is not in the airstream. See [[Rule: what is in scope]].`},

{k:'proc',t:'Proc: patch a sheet metal access',tags:['procedure','phase-8','patching'],x:`Every access hole gets closed properly. This is the part a customer or an inspector actually sees.

# Cut the patch from sheet metal stock, oversized past the hole on all sides.
# ''On a round trunk, bend the patch to the radius first.'' A flat patch on a curved trunk will not seat.
# ''Screws first at all four corners'', then one at the midpoint of each side. 1/4 inch sheet metal screws. Corners first because they hold the curve while you do the sides.
# ''Mastic the full perimeter'' of the patch to seal it.
# ''Mastic an X across the face'' of the patch so the insulation flap sticks back down to it.
# Roll the insulation flap back over.
# ''Tape the cut with 3 inch FSK tape.'' That is foil-scrim-kraft, the foil tape with the reinforcing grid in it. Not duct tape. Duct tape dries out and lets go.

''Naming note'': you have called this F94. The product is FSK tape.

Small holes do not get this treatment. See [[Proc: pop-plug a bit hole]].`},

{k:'proc',t:'Proc: pop-plug a bit hole',tags:['procedure','phase-8','patching'],x:`For the 1 inch fairbairn-bit holes you cut along a trunk to get the whip in.

# Seat the pop plug in the hole.
# The V or flap you cut in the insulation to get to the metal gets folded back over.
# Tape the V shut with FSK tape.

That is the whole thing. No sheet metal patch, no screws, no mastic.`},

{k:'proc',t:'Proc: pressure wash grilles and registers',tags:['procedure','cleaning','optional'],x:`Applies when the register count is high enough to justify setting up, which on a dorm or a hallway of fan coils it usually is.

# Pull and stack registers in one staging area, keeping track of which zone they came from if they are not identical.
# Pressure wash off site or in a contained area. Not over a customer floor.
# ''Straighten bent grilles.'' A bent grille is its own task: remove, clean, straighten, reinstall. It is not optional cosmetics, a crushed grille restricts airflow.
# Dry before reinstall so you are not putting wet steel back in a duct.
# ''Check the back side.'' Fronts get wiped by janitorial. Backs never do.`},

{k:'proc',t:'Proc: close out',tags:['procedure','phase-8'],x:`# Every access hole patched or plugged. Walk it and count against the holes you cut.
# Registers and grilles reinstalled, right zone, right orientation.
# Ceiling tiles back in.
# Plastic sheeting pulled and hauled out, not left in a dumpster corner.
# Blower and system back to the state you found it. ''Nothing runs until everything is closed.''
# Before and after photos. Liability protection and the basis for any upsell.
# Load out. Coil hose in big loops, not tight ones.
# ''Log your hours door to door'' and send them.

{{Ref: the Meredith hours text}}`},

{k:'equip',t:'Equip: electric portable vacuum',tags:['equipment','negative-air'],x:`The indoor tier. Used on in-wall PTAC and fan coil work, and on residential attic air handlers.

* ''Power'': a 20 amp male plug on the machine. You need a ''20A adapter'' plus an extension cord to get into a normal wall outlet. This is the single part that has stranded a crew.
* ''Connections'': quick connect for the airline that feeds the wand you whip with.
* ''Controls'': an on switch. That is it. It really is that simple.
* ''Hose'': flex line duct-taped to the top of the unit and run to the access hole.
* ''Wheels'': check them before rolling across a finished floor. They pick up paint and mastic from previous jobs.

Carry it up stairs rather than rolling it when the floor is finished. Bare subfloor, roll it.`},

{k:'equip',t:'Equip: gas negative air machine',tags:['equipment','negative-air'],x:`The squirrel cage. This is the machine that actually pulls, and it is gas powered, so it lives outside or in a space you can exhaust.

* ''Start'': prime the bulb, pull it. Keep the gas can with the machine.
* ''Connection'': 8 to 10 inch tube, assembled from sections out of the trailer stock, joints duct-taped or quick-connected.
* ''Placement'': outside at the package unit, at a rooftop unit, or feeding in through a window or door. Put it where the engine exhaust is not getting drawn back into the building.
* ''Filtration'': HEPA final stage is the standard.

Do not confuse this with the truck-mounted unit. See [[Equip: truck-mounted compressor]].`},

{k:'equip',t:'Equip: truck-mounted compressor',tags:['equipment','airline'],x:`The unit mounted in the truck is a ''compressor'', not a vacuum. It feeds compressed air down a small hose to the agitation wand heads. Getting this backwards is the most common way to describe the job wrong.

Truck-mounted vacuum systems do exist in the trade, big diesel units pulling 10,000+ CFM, but they need parking access, they are loud, and long hose runs lose suction fast. Know your run limit.

Three tiers, three jobs:
|!Tier|!What it does|!When|
|Truck-mounted compressor|Supplies air to the whip and forward nozzle|Whenever the truck is on site|
|[[Equip: gas negative air machine]]|Pulls. Containment.|Real duct volume, outdoor placement|
|[[Equip: electric portable vacuum]]|Pulls, small scale. Also spot cleanup.|In-wall units, attics, short runs|`},

{k:'equip',t:'Equip: air whip and forward nozzle',tags:['equipment','airline','tools'],x:`Both run off the compressor airline.

* ''Whip'': flexible lines, noodles, or skipper balls on the end. Spins and beats the duct wall. General debris.
* ''Forward nozzle'': the air pusher. Directional jet that moves loosened debris down the run toward the suction.
* ''Rotating brush'': for stuck buildup a whip will not take off.
* ''Air washing'': compressed air only, no contact. The right tool on internally lined duct, where a whip would release fiber.
* ''Contact vacuuming'': hand tool for registers, grilles, and anything you can reach.

''Airline reach is a planning constraint.'' On the hallway job the blue airline could not cover the whole corridor, so the crew did one side, then switched to the black line for the rest. Know how far each line reaches before you assign zones.`},

{k:'equip',t:'Equip: hole saw and fairbairn bit',tags:['equipment','tools','cutting'],x:`* ''Hole cutter / hole saw'' on a drill, adjustable. Standard 8 inch access, 4 inch reach-in. Check the setting before you start, an oversized setting fights the whole cut.
* ''Fairbairn bit''. Cuts the roughly 1 inch holes along a trunk that you feed the whip through. These get pop plugs, not patches.
* ''Step bit'' works for smaller holes.
* ''Tin snips'' for cutting patch stock.

''Hole cutters are a crew bottleneck.'' With one cutter on site, the entire cleaning line balances around it. Two lets one person cut ahead of the cleaners. Confirm you have two before you leave.

''If a bit drops into the trunk'', you are cutting a 4 inch hole to reach in and get it, and patching a hole you did not plan on. Keep a hand on it going in.`},

{k:'equip',t:'Equip: coil cleaner and pump sprayer',tags:['equipment','coil','chemicals'],x:`* ''Enzymatic coil cleaner'', mixed to dilution. This is the standard for evaporator coils.
* ''Cool Jet'' cleaner is the other product that gets called for by name.
* ''Diluted degreaser'' when the coil is greasy rather than dusty.
* ''Pump sprayer'': mix in it and pump it. Always works, slower, less even coverage.
* ''Soaker hose'': an attachment on the airline that sits in a bucket and sprays. Faster and more even than the pump sprayer.
* ''Coil jet'': the dedicated airline-fed coil cleaning attachment.

The airline-fed options are better. The pump sprayer is what you use when the good attachments are in the wrong van, which has already happened.

Also on the truck for coil work: ''a lot of rags''. More than you think.`},

{k:'equip',t:'Equip: patch stock, mastic, FSK tape',tags:['equipment','patching','materials'],x:`* ''Sheet metal patch stock'', cut oversized to the hole.
* ''1/4 inch sheet metal screws''. Four corners first, then side midpoints.
* ''Mastic'', in a bucket, brushed on. Perimeter seal plus an X across the face so insulation re-adheres.
* ''FSK tape'', 3 inch. Foil-scrim-kraft, the foil tape with a reinforcing scrim grid. Seals the insulation cut.
* ''Pop plugs'' for 1 inch bit holes.

''Never duct tape a duct.'' It dries out and releases. FSK is the code-compliant product for sealing the insulation cut and it is what an inspector expects to see.`},

{k:'sys',t:'Sys: PTAC and fan coil',tags:['system','commercial'],x:`In-wall or in-room units. Hotel-style. One per room or per zone, no long distribution.

''Where you see them'': courthouses, dorms, hotels, jails, older office buildings. [[JOB-001 Durham County Courthouse]], [[JOB-006 Hallway fan-coil run]], [[JOB-011 ECU Garrett Hall]], [[JOB-012 ECU Clement Hall]].

''What it means for the job'':
* Short accessible duct runs. Portable equipment, not the truck.
* Very high unit count. The job is a production line, not a technical challenge.
* Crew splitting and pre-cut access decide the schedule, not cleaning speed.
* Access panel usually folds out from the top once you push the top in, like a residential filter door.
* Coil cleaning is normally part of the scope on these because the coil is right there behind the panel.`},

{k:'sys',t:'Sys: attic air handler',tags:['system','residential'],x:`Air handler and evaporator coil in the attic, matched to an outdoor condenser. Standard for the second floor of a two-story NC house.

''Shape of the ductwork'':
* ''Return'': usually ''one'' run. A single large hallway ceiling grille, one flex duct up to a return plenum box bolted to the side of the handler. Often no return trunk at all, because there is nothing to collect.
* ''Supply'': a real trunk, frequently ''round insulated sheet metal'', with branch runs fanning off to each room.

''Working it'':
* Negative air goes at the return plenum. Access hole in the plenum, hose tied off to a beam.
* Heat. Attics in NC summer are the hazard, not the ductwork.
* Watch your footing on joists if there is no decking.
* Round trunk means patches get bent to the radius.

Worked in full at [[JOB-013 Two-story residential, attic AHU and package unit]].`},

{k:'sys',t:'Sys: package unit',tags:['system','residential','commercial'],x:`One outdoor cabinet containing compressor, condenser, evaporator coil, and blower. Supply and return duct run straight into it. Common on first floors over slab or crawl in NC, and on small commercial.

''What it means for the job'':
* Negative air hooks up outside, at the unit. Nothing to drag indoors.
* Everything is at one point, so setup is fast.
* The evaporator coil and blower are in the same cabinet, so the air handler phase happens outside too.

Do not confuse it with a split system, where the outdoor unit is a condenser only. On a package unit the outdoor cabinet is the whole system.`},

{k:'sys',t:'Sys: rooftop unit and VAV',tags:['system','commercial'],x:`Commercial. Rooftop air handler feeding a trunk above a drop ceiling, branch runs to ceiling diffusers, and ''VAV boxes'' on the supply side that modulate airflow per zone.

''What it means for the job'':
* Long hose runs from the roof or from a mechanical room. Suction drops over distance.
* The work happens above the ceiling. Pull tiles first, then cut.
* VAV boxes are real components you have to work around and sometimes open.
* Fire dampers must be closed during cleaning and reopened after, or worked around entirely.
* Occupied space means containment, timing, and noise management. Usually that means nights.`},

{k:'sys',t:'Sys: return side vs supply side',tags:['system','core'],x:`The single most useful thing to know before opening a duct: what should be in it.

''Return'' is pulling unfiltered room air. Dust, hair, skin, pet dander, cooking grease, lint, paper dust, whatever is floating in that building. Returns are ''always'' gross. That is not a finding, that is the nature of it.

''Supply'' has already passed the filter at the air handler. It should be relatively clean. If the supply side is visibly nasty, that means one of two things:
# Something is growing in the ductwork itself. Mold, mildew, microbial buildup.
# Filters were neglected so long that dirty air got pushed through.

''Dirty supply is a red flag, not the norm.'' Call it out and document it. See [[Rule: hazards and stop-work]].

Building type predicts the debris:
|!Building|!What is in the return|
|Jail or prison|Compressed lint discs from constant laundry|
|Print plant|Paper dust plus ink particulate, greasy not fluffy|
|Dorm|Dust, hair, fabric|
|Restaurant|Grease. Different trade if it is the hood.|
|Courthouse or office|General dust|`},

{k:'rule',t:'Rule: order of operations',tags:['rule','core'],x:`''Supply first or return first does not matter physically.'' With the air handler off there is no airflow, so debris only moves where your whip and your negative air move it.

What actually matters:
# ''Branches before the trunk'', working from the far end back toward your negative air access. Clean the trunk first and the branches after, and you just dumped branch debris into a trunk you already called clean.
# ''Air handler last.'' Coils and blower sit between both sides and catch whatever either side knocks loose. Clean it after both sides, or at minimum after the return.
# ''Negative air runs the whole time you are agitating on that side.'' Containment is the real rule. Sequence is convenience.

Crews tend to do return first for practical reasons: the return side is smaller, often one run, the access lands at the plenum right next to the handler, and opening it early lets you see what you are dealing with. Supply first is equally fine for the mirrored reason.

''One hard no'': do not run the system blower to help push debris while the ducts are open. Some outfits do a blow-and-go. It recirculates through a dirty coil and blows debris out the open supply registers into the building.`},

{k:'rule',t:'Rule: what is in scope',tags:['rule','core','scope'],x:`Duct cleaning scope is ''everything the conditioned air touches''.

''In'':
* supply and return ductwork, trunks and branches
* plenums
* the evaporator coil
* the blower
* registers, grilles, and diffusers

''Out'':
* the ''condenser coil''. It sits outside rejecting heat. Its cleanliness affects efficiency, not indoor air quality. Separate upsell or maintenance item.
* refrigerant work of any kind
* equipment replacement
* kitchen exhaust hoods, which are a separate trade with grease fire liability

This is why you wipe the blower housing but never touch the outdoor unit, even when it is standing three feet away. It is a scope line, not an oversight.

For CQA as a company the same line holds on bids: source-removal duct cleaning, dryer vent cleaning, coil cleaning, and NADCA-certified encapsulation and lining. No refrigerant, no replacement.`},

{k:'rule',t:'Rule: hazards and stop-work',tags:['rule','safety','core'],x:`Spot these on the [[Proc: walk the job]] walkthrough, not after you have opened a duct.

''Stop work and escalate'':
* ''Asbestos''. Pre-1980s buildings. Duct wrap, mastic, and pipe insulation. Stop, do not disturb.
* ''Vermiculite insulation''. Assume asbestos until it is tested.
* ''Visible mold''. Different protocol entirely: containment, antimicrobial treatment, and documentation. Not a whip-and-vac job.
* ''Bird or rodent infestation''. Biohazard protocol.
* ''Lead paint'' on duct exteriors in older buildings.

''Job hazards to manage, not stop for'':
* ''Heat''. Attics and unconditioned mechanical rooms in NC summer. Fan, water, ice, rotate people. Called out explicitly on the hallway fan-coil job.
* ''Sheet metal edges''. Cut slow and clockwise so you are not leaving burrs, and deburr what you leave.
* ''Electrical''. Power off before pulling a panel on an air handler.
* ''Fall exposure'' on attic joists and rooftops.

''If you feel dizzy'', get out of the space, hydrate, and assess. That is heat or air quality, and it does not improve by pushing through.`},

{k:'ref',t:'Ref: how CQA pay actually works',tags:['reference','pay'],x:`This is settled ground now, reconciled line by line against the stubs.

!! Structure
* ''Base hourly.'' 15, then 16 after the Perry raise, then ''18'' per Jeff's text on 8/6/26.
* ''OVTIME'' is hours over 40 in a week.
* ''RATEDIF'' is the premium line. Printed at 22.50 in 2025 and 24 in 2026. On an 18 base it should print 27. It has never actually printed at 27 yet, so that is the thing to verify on the next check.
* ''OTHER H'' is bonuses.

!! Hours
* ''Door to door'', including commute, from the moment you leave the house.
* ''Minus an auto-deducted 30 minutes for lunch per shift.'' Confirmed on the 7/18-7/31 period: 75.42 logged minus seven half-hours equals 71.92 against 72.00 paid.

!! What earns the premium
Two competing rules, and reality is that Jeff applies both:
* ''Temporal.'' Weekend or after-hours work. That is Jeff's own wording in his 4/27/26 text.
* ''Discretionary.'' He grants per-job time and a half to fill a crew that is hard to staff.
* The purely geographic out-of-town theory is ''dead''. An all-Greenville period still paid 10.50 premium hours.

!! Periods
Saturday to Friday, 14 days. Direct deposit lands about 6 days after period end. Direct deposit went live April 2026, paper checks before that, drawn on Towne Bank with the pay period printed on the face.

!! Open items
* Gas and parking reimbursement for the December Durham and Greensboro runs. Promised on the next check, never sighted on any stub.
* Verify the first check covering work after 8/6 prints 18 regular and 27 premium.
* Exempt withholding filed 8/17/26. Next stub should show 0 federal and 0 state. Must be renewed by Feb 15 each year.`},

{k:'ref',t:'Ref: the Meredith hours text',tags:['reference','pay','admin'],x:`Standard format, confirmed against screenshots of the thread.

Single day:
@@Hello Meredith! This is Benjamin Foreman. I worked with Carolina Quality Air today (Day M/D), H:MMam to H:MMpm at [site or address].@@

Multi-day:

Rules:

The full logged history lives on the private hours dashboard, Cloudflare worker @@cqa-hours@@, gated to your and Bekah's email.`},

Also appearing across job debriefs: Nate, Jack, Bryson, Will, Marcus, Devin. One name transcribed as Jaw on the hallway job is ~~unconfirmed~~, likely Yari.

Vocabulary is not evenly distributed. Guys who can do the work perfectly well may not know what a condenser is.`},

{k:'ref',t:'Ref: glossary',tags:['reference','glossary'],x:`* ''ACR 2021'' - the NADCA standard for assessment, cleaning, and restoration of HVAC systems.
* ''Airline'' - the compressed air hose from the truck compressor that feeds the whip and forward nozzle. Blue line and black line on a job means two of them with different reach.
* ''ASCS'' - Air Systems Cleaning Specialist. NADCA certification. Jeff holds it.
* ''Fairbairn bit'' - the bit used to cut roughly 1 inch whip-access holes in a trunk.
* ''Forward'' - the directional air nozzle that pushes debris toward the suction.
* ''FSK tape'' - foil-scrim-kraft. The foil tape with the reinforcing grid, used to seal insulation cuts. Not duct tape.
* ''Mastic'' - brush-on sealant. Perimeter seal and an X across a patch face.
* ''Negative air'' - the machine that pulls, and by extension the containment it creates.
* ''Noodles'' or ''skipper balls'' - the agitation ends on a whip.
* ''Package unit'' - one outdoor cabinet with compressor, condenser, evap coil, and blower.
* ''Plenum'' - the box at the air handler where duct connects. Return plenum and supply plenum.
* ''Pop plug'' - the plug that closes a 1 inch bit hole.
* ''PTAC'' - packaged terminal air conditioner. The in-wall hotel-style unit.
* ''RATEDIF'' - the premium pay line on a CQA stub.
* ''Source removal'' - the industry-standard method. Negative air plus mechanical agitation.
* ''Trunk'' - the main duct off the plenum that branches feed off of.
* ''VAV box'' - variable air volume box, modulates airflow to a zone on the supply side.
* ''VSMR'' - Ventilation System Mold Remediator. NADCA certification.
* ''Whip'' - the agitation tool.`},

{k:'ref',t:'HowTo: add a job',tags:['start','meta'],x:`The whole point of building it this way is that a new job should take ten minutes, not an hour, because the procedures are already written.

!! What goes in a job tiddler
''Only what is specific to that job.'' Site, date, hours, crew, the system you found, the decisions you made, what went wrong, and what you would do differently. Everything that happens the same way every time gets ''transcluded'', not retyped.

!! Template
@@{k:'job', t:'JOB-0NN Site name', tags:['job','...'], d:'Day M/D/YYYY', s:'Full address', h:'start - end (total)', sys:'System type', x:BODY}@@

!! Body skeleton
@@!! Roll out@@ - who, what vans, what was missing
@@{{Proc: roll out}}@@
@@!! The system@@ - what you found on the walkthrough
@@{{Sys: whatever it was}}@@
@@!! The work@@ - the actual narrative of the day
@@{{Proc: whip and forward a run}}@@
@@!! What went wrong@@ - this is the part worth writing
@@!! Carry-forward@@ - the one thing you would do differently

!! Markup
* @@!!@@ heading, @@!!!@@ sub-heading
* @@[[Tiddler name]]@@ or @@[[Label|Tiddler name]]@@ to link
* @@{{Tiddler name}}@@ on its own line to transclude a module
* Two single quotes around ''bold''
* Two at-signs around a spec, a literal, or a part number
* Two tildes around ~~unconfirmed~~ to flag something you are not sure of
* @@|!Header|!Header|@@ then @@|cell|cell|@@ for a table

!! The rule about facts
If you are not sure, flag it ~~unconfirmed~~ rather than writing it as fact. A wrong spec in here costs a wasted trip later.

!! When a procedure changes
Change the module. Do not edit the jobs. That is the entire reason it is built this way.`},

{k:'ref',t:'Jeff',tags:['people'],x:`Jeff Bagley. Owner-operator of Carolina Quality Air, Winterville NC. NADCA member, ASCS and VSMR certified since January 2005.

Manages van logistics himself, and that is the recurring failure point. Specialty attachments end up in his van and not on the job. Check before the vans split up.`},

/* ---------------- engine ---------------- */
const BY = new Map(TIDDLERS.map(t=>[t.t,t]));
const KINDNAME = {job:'Job',proc:'Procedure',equip:'Equipment',sys:'System',rule:'Rule',ref:'Reference'};
const river = document.getElementById('river');
const side  = document.getElementById('side');
let open = [];
let activeTag = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inline(s){
  s = esc(s);
  s = s.replace(/~~([^~]+)~~/g, (m,a)=>'<span class="warn">'+a+'</span>');
  s = s.replace(/@@([^@]+)@@/g, (m,a)=>'<span class="spec">'+a+'</span>');
  s = s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (m,label,target)=>link(target,label));
  s = s.replace(/\[\[([^\]|]+)\]\]/g, (m,target)=>link(target,target));
  s = s.replace(/''(.+?)''/g, (m,a)=>'<strong>'+a+'</strong>');
  return s;
}
function link(target,label){
  target = target.trim();
  const missing = BY.has(target) ? '' : ' missing';
  return '<a class="wl'+missing+'" data-go="'+esc(target)+'" tabindex="0" role="link">'+label.trim()+'</a>';
}

function render(text, depth){
  depth = depth||0;
  const lines = String(text).split('\n');
  let out = '', i = 0;
  const flushList = (marker) => {
    const tag = marker === '#' ? 'ol' : 'ul';
    let html = '<'+tag+'>';
    while(i < lines.length && lines[i].trimEnd().startsWith(marker+' ')){
      html += '<li>'+inline(lines[i].trim().slice(2))+'</li>'; i++;
    }
    return html+'</'+tag+'>';
  };
  while(i < lines.length){
    const raw = lines[i], line = raw.trim();
    if(!line){ i++; continue; }

    const tr = line.match(/^\{\{([^}]+)\}\}$/);
    if(tr){ out += transclude(tr[1].trim(), depth); i++; continue; }

    if(line === '---'){ out += '<hr>'; i++; continue; }

    if(line.startsWith('!!! ')){ out += '<h5>'+inline(line.slice(4))+'</h5>'; i++; continue; }
    if(line.startsWith('!! ')){ out += '<h4>'+inline(line.slice(3))+'</h4>'; i++; continue; }

    if(line.startsWith('* ')){ out += flushList('*'); continue; }
    if(line.startsWith('# ')){ out += flushList('#'); continue; }

    if(line.startsWith('|') && line.endsWith('|')){
      let html = '<table>';
      while(i < lines.length){
        const L = lines[i].trim();
        if(!(L.startsWith('|') && L.endsWith('|'))) break;
        const cells = L.slice(1,-1).split('|');
        const isHead = cells.every(c=>c.startsWith('!'));
        html += '<tr>' + cells.map(c=>{
          const h = c.startsWith('!');
          const v = inline(h ? c.slice(1) : c);
          return h ? '<th>'+v+'</th>' : '<td>'+v+'</td>';
        }).join('') + '</tr>';
        i++;
      }
      out += html+'</table>'; continue;
    }

    let para = [];
    while(i < lines.length){
      const L = lines[i].trim();
      if(!L || L === '---' || L.startsWith('!!') || L.startsWith('* ') || L.startsWith('# ')
         || (L.startsWith('|') && L.endsWith('|')) || /^\{\{[^}]+\}\}$/.test(L)) break;
      para.push(L); i++;
    }
    if(para.length) out += '<p>'+inline(para.join(' '))+'</p>';
  }
  return out;
}

function transclude(title, depth){
  const t = BY.get(title);
  if(!t) return '<div class="trans"><div class="trans-head"><span class="lbl">missing</span><span class="tt">'+esc(title)+'</span></div></div>';
  if(depth > 3) return '';
  return '<div class="trans"><div class="trans-head">'
    + '<span class="lbl">'+ (KINDNAME[t.k]||'Module') +'</span>'
    + '<span class="tt" data-go="'+esc(t.t)+'" tabindex="0" role="link">'+esc(t.t.replace(/^(Proc|Equip|Sys|Rule|Ref):\s*/,''))+'</span>'
    + '</div><div class="trans-body">'+render(t.x, depth+1)+'</div></div>';
}

function tidHTML(t){
  const stamp = [];
  if(t.d)   stamp.push('<span><b>Date</b> '+inline(t.d)+'</span>');
  if(t.h)   stamp.push('<span><b>Hours</b> '+inline(t.h)+'</span>');
  if(t.s)   stamp.push('<span><b>Site</b> '+inline(t.s)+'</span>');
  if(t.sys) stamp.push('<span><b>System</b> '+inline(t.sys)+'</span>');
  return '<article class="tid '+(t.k==='job'?'job':'')+'" data-title="'+esc(t.t)+'">'
    + '<div class="tid-head"><div class="row1">'
    +   '<h2 class="tid-title">'+esc(t.t)+'</h2>'
    +   '<span class="kind '+t.k+'">'+(KINDNAME[t.k]||t.k)+'</span>'
    +   '<button class="closebtn" data-close="'+esc(t.t)+'" aria-label="Close">&times;</button>'
    + '</div>'
    + (stamp.length ? '<div class="stamp">'+stamp.join('')+'</div>' : '')
    + '</div>'
    + (t.tags && t.tags.length ? '<div class="tid-tags">'+t.tags.map(g=>'<span class="tag" data-tag="'+esc(g)+'">'+esc(g)+'</span>').join('')+'</div>' : '')
    + '<div class="tid-body">'+render(t.x,0)+'</div></article>';
}

function draw(){
  if(!open.length){
    river.innerHTML = '<div class="emptystate"><h2>Nothing open</h2><p>Pick a job or a module from the index. Start with <a class="wl" data-go="Contents">Contents</a> or <a class="wl" data-go="The job, generically">The job, generically</a>.</p></div>';
  } else {
    river.innerHTML = '<div class="riverhead"><span>'+open.length+' open</span><span class="line"></span>'
      + '<button data-act="closeall">Close all</button></div>'
      + open.map(n=>{const t=BY.get(n); return t?tidHTML(t):'';}).join('');
  }
  location.hash = open.length ? encodeURIComponent(open.join('|')) : '';
}

function go(title, after){
  if(!BY.has(title)) return;
  const at = open.indexOf(title);
  if(at === -1){
    if(after != null){ const idx = open.indexOf(after); open.splice(idx<0?open.length:idx+1, 0, title); }
    else open.unshift(title);
  }
  draw();
  requestAnimationFrame(()=>{
    const el = river.querySelector('[data-title="'+CSS.escape(title)+'"]');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

/* ---------------- sidebar ---------------- */
function sortJobs(){
  return TIDDLERS.filter(t=>t.k==='job').sort((a,b)=>a.t.localeCompare(b.t));
}
function group(k){ return TIDDLERS.filter(t=>t.k===k).sort((a,b)=>a.t.localeCompare(b.t)); }

function listHTML(arr, sub){
  return '<ul class="lnklist">'+arr.map(t=>'<li><button data-go="'+esc(t.t)+'">'+esc(t.t)
    + (sub && t[sub] ? '<span class="meta">'+esc(t[sub])+'</span>' : '')+'</button></li>').join('')+'</ul>';
}

function tagCounts(){
  const m = new Map();
  TIDDLERS.forEach(t=>(t.tags||[]).forEach(g=>m.set(g,(m.get(g)||0)+1)));
  return [...m.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}

function drawSide(){
  const q = (document.getElementById('q')?.value || '').trim().toLowerCase();
  let body = '';
  if(q){
    const hits = TIDDLERS.filter(t => t.t.toLowerCase().includes(q) || String(t.x).toLowerCase().includes(q)
      || (t.s||'').toLowerCase().includes(q) || (t.tags||[]).some(g=>g.includes(q)));
    body = '<p class="hits">'+hits.length+' match'+(hits.length===1?'':'es')+'</p>'+listHTML(hits,'d');
  } else if(activeTag){
    const hits = TIDDLERS.filter(t=>(t.tags||[]).includes(activeTag));
    body = '<div class="sidesec"><h3>Tagged <span class="tag on">'+esc(activeTag)+'</span></h3>'
      + listHTML(hits,'d') + '<button class="mast-btn" data-act="cleartag" style="color:var(--ink);border-color:var(--ink)">Clear tag</button></div>';
  } else {
    body = '<div class="sidesec"><h3>Start here</h3>'+listHTML([BY.get('Contents'),BY.get('The job, generically'),BY.get('HowTo: add a job'),BY.get('Site log')])+'</div>'
      + '<div class="sidesec"><h3>Jobs</h3>'+listHTML(sortJobs(),'s')+'</div>'
      + '<div class="sidesec"><h3>Procedures</h3>'+listHTML(group('proc'))+'</div>'
      + '<div class="sidesec"><h3>Equipment</h3>'+listHTML(group('equip'))+'</div>'
      + '<div class="sidesec"><h3>Systems</h3>'+listHTML(group('sys'))+'</div>'
      + '<div class="sidesec"><h3>Rules</h3>'+listHTML(group('rule'))+'</div>'
      + '<div class="sidesec"><h3>Reference</h3>'+listHTML(group('ref'))+'</div>'
      + '<div class="sidesec"><h3>Tags</h3><div class="tagcloud">'
        + tagCounts().map(([g,n])=>'<span class="tag" data-tag="'+esc(g)+'">'+esc(g)+' <span class="n">'+n+'</span></span>').join('')
      + '</div></div>';
  }
  side.innerHTML = '<div class="searchbox"><span class="mag">&#9906;</span><input id="q" type="search" placeholder="Search the job book" value="'+esc(q)+'" autocomplete="off"></div>' + body;
  const inp = document.getElementById('q');
  if(q){ inp.focus(); inp.setSelectionRange(q.length,q.length); }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if(goEl){
    const host = goEl.closest('.tid');
    go(goEl.dataset.go, host ? host.dataset.title : null);
    if(window.innerWidth <= 960) side.classList.remove('open');
    return;
  }
  const cl = e.target.closest('[data-close]');
  if(cl){ open = open.filter(n=>n!==cl.dataset.close); draw(); return; }
  const tg = e.target.closest('[data-tag]');
  if(tg){ activeTag = (activeTag===tg.dataset.tag)?null:tg.dataset.tag; drawSide();
    if(window.innerWidth<=960) side.classList.add('open'); side.scrollTop=0; return; }
  const act = e.target.closest('[data-act]');
  if(act){
    if(act.dataset.act==='closeall'){ open=[]; draw(); }
    if(act.dataset.act==='cleartag'){ activeTag=null; drawSide(); }
    return;
  }
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.matches('[data-go]')){ e.target.click(); }
  if(e.key==='/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); side.classList.add('open'); document.getElementById('q').focus();
  }
});
document.addEventListener('input', e => { if(e.target.id==='q'){ activeTag=null; drawSide(); } });
document.getElementById('btn-home').onclick = () => { open=['Contents']; draw(); window.scrollTo({top:0,behavior:'smooth'}); };
document.getElementById('btn-side').onclick = () => side.classList.toggle('open');

document.getElementById('foot').textContent =
  TIDDLERS.length + ' tiddlers \u00B7 ' + TIDDLERS.filter(t=>t.k==='job').length + ' jobs \u00B7 '
  + TIDDLERS.filter(t=>['proc','equip','sys','rule'].includes(t.k)).length + ' reusable modules \u00B7 press / to search';

const boot = decodeURIComponent(location.hash.slice(1));
open = boot ? boot.split('|').filter(n=>BY.has(n)) : ['Contents'];
if(!open.length) open = ['Contents'];
drawSide(); draw();
</script>
</body>
</html>
