<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D080 Gap Drill</title>
<meta property="og:title" content="D080 Gap Drill - Beyond the Pre-Assessment">
<meta property="og:description" content="HamStudy-style drill for WGU D080 concepts the pre-assessment never tested: trade theories, FDI, all integration levels, full Hofstede, staffing orientations, financing, FX risk, IP, and more.">
<meta property="og:url" content="https://niggerfaggot.club/d080-gaps">
<style>
:root{--bg:#e9edf0;--panel:#ffffff;--ink:#2b3a42;--mut:#7b8794;--line:#dde3e8;--teal:#159fc9;--green:#43a047;--greenbg:#e3f4e4;--red:#e23b3b;--redbg:#fbe6e6;--shadow:0 1px 3px rgba(20,40,60,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
.hdr{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.hdr-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pool{font-size:14px;font-weight:700;line-height:1.2}
.pool .sub{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
.poolsel{margin-top:4px}
.poolsel select{font:inherit;font-size:11px;color:var(--teal);background:#f1f7fa;border:1px solid #d4e6ee;border-radius:14px;padding:3px 8px;font-weight:600;cursor:pointer;max-width:180px}
.reset{font:inherit;font-size:11px;color:var(--mut);background:none;border:0;cursor:pointer;text-decoration:underline;padding:3px 4px}
.meters{display:flex;gap:12px;flex:none}
.meter{text-align:center}
.meter svg{display:block}
.meter .lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.ring-bg{fill:none;stroke:#eceff1;stroke-width:5}
.ring-fg{fill:none;stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dasharray .3s}
.ring-pct{font-size:13px;font-weight:700;fill:var(--ink)}
.body{max-width:680px;margin:0 auto;padding:clamp(28px,7vh,72px) 16px 60px}
.q{font-size:20px;line-height:1.4;font-weight:500;text-align:center;margin-bottom:14px;color:#1f2d35}
.hist{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.hist:empty{display:none}
.pip{width:11px;height:11px;border-radius:2px;background:#cfd6db}
.pip.ok{background:var(--green)}.pip.no{background:var(--red)}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;border-radius:8px;padding:14px 15px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:.1s}
.ans:hover{border-color:var(--teal);background:#f7fbfd}
.ans .ltr{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mut)}
.ans b{font-weight:800}
.ans.correct{background:var(--greenbg);border-color:var(--green);color:#1b5e20}
.ans.correct .ltr{border-color:var(--green);background:var(--green);color:#fff}
.ans.wrong{background:var(--redbg);border-color:var(--red);color:#b71c1c}
.ans.wrong .ltr{border-color:var(--red);background:var(--red);color:#fff}
.ans.dim{opacity:.45}
.explain{background:#f1f7fa;border:1px solid #d4e6ee;border-radius:8px;padding:11px 13px;font-size:13px;line-height:1.5;color:#3a4a52;margin:2px 0 10px}
.explain .et{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--teal);font-weight:700;margin-bottom:3px}
.cont{text-align:center;font-size:12.5px;color:var(--mut);min-height:20px;cursor:pointer}
.cont b{color:var(--teal)}
.done{text-align:center;padding:50px 16px}
.done .big{font-size:30px;font-weight:800;color:var(--green)}
.done .sm{color:var(--mut);font-size:14px;margin:10px 0 20px}
.btn{font:inherit;font-size:13px;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer;font-weight:600}
</style></head><body>
<div class="hdr"><div class="hdr-in">
  <div class="pool">D080 Gap Drill<span class="sub">Beyond the pre-assessment - concepts the OA can still test</span>
    <div class="poolsel"><select id="sel"></select> <button id="reset" class="reset">reset</button></div>
  </div>
  <div class="meters">
    <div class="meter"><svg width="52" height="52" viewBox="0 0 52 52"><circle class="ring-bg" cx="26" cy="26" r="22"></circle><circle class="ring-fg" id="ringSeen" cx="26" cy="26" r="22" stroke="#159fc9"></circle><text class="ring-pct" id="pctSeen" x="26" y="30" text-anchor="middle">0%</text></svg><div class="lbl">Seen</div></div>
    <div class="meter"><svg width="52" height="52" viewBox="0 0 52 52"><circle class="ring-bg" cx="26" cy="26" r="22"></circle><circle class="ring-fg" id="ringApt" cx="26" cy="26" r="22" stroke="#43a047"></circle><text class="ring-pct" id="pctApt" x="26" y="30" text-anchor="middle">0%</text></svg><div class="lbl">Apt</div></div>
  </div>
</div></div>
<div class="body"><div class="qbox" id="qbox"></div></div>
<script>
const MCQS=[["A 16th-century theory held that a nation's wealth is measured by its gold and silver holdings, achieved by maximizing exports and minimizing imports to run a trade surplus. Which theory?", ["Absolute advantage", "Mercantilism", "Comparative advantage", "Heckscher-Ohlin"], 1, "Mercantilism: wealth = gold/silver, promote exports, restrict imports, run a trade surplus.", "Trade Theories"], ["A country can produce a good using fewer resources or more efficiently than any other country. Which trade theory describes that edge?", ["Comparative advantage", "Mercantilism", "Absolute advantage", "Product life cycle"], 2, "Absolute advantage (Adam Smith): produce what you can make most efficiently in absolute terms.", "Trade Theories"], ["Even though Country A is less efficient at producing everything, it should still specialize in the good where it has the lowest opportunity cost. Which theory?", ["Comparative advantage", "Absolute advantage", "Mercantilism", "New trade theory"], 0, "Comparative advantage (Ricardo): specialize where your opportunity cost is lowest, even without absolute advantage.", "Trade Theories"], ["A theory holds that nations export goods that use their abundant, cheap factors of production and import goods that require scarce factors. Which theory?", ["Mercantilism", "Heckscher-Ohlin (factor proportions)", "Absolute advantage", "Product life cycle"], 1, "Heckscher-Ohlin: trade is driven by factor endowments, export goods using your abundant factors.", "Trade Theories"], ["A theory holds that a new product is first made and exported by the innovating developed country, then production shifts abroad as the product matures. Which theory?", ["Comparative advantage", "Mercantilism", "Product life cycle theory", "Heckscher-Ohlin"], 2, "Product life cycle theory (Vernon): production migrates from the innovator country outward as a product matures.", "Trade Theories"], ["Under mercantilism, a nation promotes a trade surplus primarily by doing what?", ["Encouraging imports", "Restricting imports through protectionism", "Eliminating all exports", "Floating its currency"], 1, "Mercantilists run a surplus by restricting imports, the origin of modern protectionism.", "Trade Theories"], ["An investment made to acquire and control foreign assets, typically as a long-term strategy, is called what?", ["Portfolio investment", "Foreign direct investment (FDI)", "A forward contract", "Franchising"], 1, "FDI = investing in/acquiring foreign assets with intent to control and manage them, long-term.", "FDI"], ["A retailer builds a store in a new country to sell the same products to that local market. Which type of FDI is this?", ["Vertical FDI", "Horizontal FDI", "Backward FDI", "Portfolio FDI"], 1, "Horizontal FDI: same business operation replicated in a new foreign market.", "FDI"], ["A manufacturer invests abroad in a facility that produces parts for its own final assembly. Which type of FDI?", ["Horizontal FDI", "Vertical FDI", "Greenfield-only FDI", "Portfolio FDI"], 1, "Vertical FDI: investing within the company's own supply chain (supplier or distribution side).", "FDI"], ["A firm invests in a foreign supplier one step BACK in its supply chain. This is specifically called?", ["Forward vertical FDI", "Backward vertical FDI", "Horizontal FDI", "Lateral FDI"], 1, "Backward vertical FDI: investing upstream toward suppliers.", "FDI"], ["A producer invests abroad in distribution, selling its goods directly into the foreign market. This is?", ["Backward vertical FDI", "Forward vertical FDI", "Horizontal FDI", "Portfolio FDI"], 1, "Forward vertical FDI: investing downstream toward distribution/sales.", "FDI"], ["Members remove all tariffs and quotas among themselves but each keeps its OWN trade policy toward non-members. Which integration level?", ["Customs union", "Free trade area", "Common market", "Economic union"], 1, "Free trade area: no internal barriers, but each member sets its own external policy (e.g., NAFTA/USMCA).", "Integration Levels"], ["Free trade among members PLUS a single common external tariff applied to all non-members. Which level?", ["Free trade area", "Customs union", "Common market", "Political union"], 1, "Customs union = free internal trade + common external tariff.", "Integration Levels"], ["A bloc has free internal trade, a common external tariff, AND free movement of labor and capital across members. Which level?", ["Customs union", "Common market", "Free trade area", "Political union"], 1, "Common market adds free movement of factors of production (labor and capital).", "Integration Levels"], ["Members share free trade, a common external tariff, free factor movement, AND a common currency with harmonized economic policy. Which level?", ["Common market", "Economic union", "Customs union", "Free trade area"], 1, "Economic union adds a common currency and coordinated economic policy (e.g., the Eurozone).", "Integration Levels"], ["The European Union is generally cited as which kind of economic cooperation?", ["The least integrated form", "A simple free trade area", "The most integrated form", "A customs union only"], 2, "The EU is the most integrated form of economic cooperation.", "Integration Levels"], ["NAFTA (now USMCA) among the US, Canada, and Mexico is an example of which integration level?", ["Customs union", "Free trade area", "Economic union", "Political union"], 1, "NAFTA/USMCA is a free trade area: members keep their own external trade policies.", "Integration Levels"], ["Which sequence orders economic integration correctly from LEAST to MOST integrated?", ["Customs union, free trade area, common market, economic union", "Free trade area, customs union, common market, economic union", "Common market, customs union, free trade area, economic union", "Economic union, common market, customs union, free trade area"], 1, "Order: free trade area, customs union, common market, economic union (then political union).", "Integration Levels"], ["In this legal system, judges interpret law and their rulings set binding precedent; it is used in the US, UK, and Canada. Which system?", ["Civil law", "Common law", "Theocratic law", "Socialist law"], 1, "Common law: judge-made, precedent-based, adversarial.", "Legal Systems"], ["This legal system is based on comprehensive written codes and statutes rather than judicial precedent, and is used across most of Europe and Latin America. Which system?", ["Common law", "Civil law", "Theocratic law", "Tribal law"], 1, "Civil law: codified statutes are the primary source of law, not precedent.", "Legal Systems"], ["A legal system based on religious guidelines, such as Sharia, is known as what?", ["Common law", "Civil law", "Theocratic (religious) law", "Customary law"], 2, "Theocratic/religious law derives from religious doctrine (e.g., Sharia).", "Legal Systems"], ["Most countries actually operate under a mix of common, civil, and religious law. What is such a blended system called?", ["A pure common-law system", "A hybrid legal system", "A theocratic system", "A socialist system"], 1, "Most real-world systems are hybrid, blending common, civil, and/or religious law.", "Legal Systems"], ["A culture that prizes competition, achievement, assertiveness, and material success over cooperation and quality of life scores high on which Hofstede dimension?", ["Power distance", "Masculinity", "Uncertainty avoidance", "Indulgence"], 1, "Masculinity = achievement, competition, assertiveness (vs femininity's cooperation/quality of life).", "Hofstede Full"], ["A culture that values cooperation, modesty, caring for others, and quality of life sits at which end of the masculinity dimension?", ["The masculine end", "The feminine end", "High power distance", "High individualism"], 1, "Femininity: cooperation, modesty, caring, quality of life.", "Hofstede Full"], ["A society emphasizing perseverance, thrift, and future rewards over tradition and quick results scores high on which dimension?", ["Indulgence", "Long-term orientation", "Power distance", "Individualism"], 1, "Long-term orientation: future-focused, persevering, thrifty (vs short-term tradition/quick results).", "Hofstede Full"], ["A culture that freely allows gratification of human desires and having fun scores high on which dimension?", ["Restraint", "Indulgence", "Uncertainty avoidance", "Masculinity"], 1, "Indulgence: free gratification of desires and enjoyment of life.", "Hofstede Full"], ["A society that suppresses gratification of needs and regulates it through strict social norms scores high on which end?", ["Indulgence", "Restraint", "Individualism", "Long-term orientation"], 1, "Restraint: gratification is curbed and controlled by social norms.", "Hofstede Full"], ["An MNC fills all key foreign positions with managers from its HOME country and keeps control at headquarters. Which staffing orientation?", ["Polycentric", "Ethnocentric", "Geocentric", "Regiocentric"], 1, "Ethnocentric: home-country nationals in key roles, HQ-centered control.", "HR Staffing"], ["Each foreign subsidiary is run by LOCAL host-country nationals and controls its own HR policies. Which orientation?", ["Ethnocentric", "Polycentric", "Geocentric", "Regiocentric"], 1, "Polycentric: host-country nationals run autonomous local subsidiaries.", "HR Staffing"], ["Key positions are filled by the best people WORLDWIDE on a meritocracy, with an integrated global HR system that shares resources. Which orientation?", ["Polycentric", "Geocentric", "Ethnocentric", "Regiocentric"], 1, "Geocentric: best person regardless of nationality, integrated worldwide system.", "HR Staffing"], ["Managers are selected from within a particular REGION (e.g., a Europe-wide talent pool) to staff that region's operations. Which orientation?", ["Geocentric", "Regiocentric", "Ethnocentric", "Polycentric"], 1, "Regiocentric: staffing drawn from within a defined region.", "HR Staffing"], ["What is a drawback of the ethnocentric staffing approach?", ["Too much local autonomy", "Home-country managers may struggle to adapt to the local culture", "No headquarters control at all", "Over-reliance on local talent"], 1, "Ethnocentric managers often face an adjustment period and may not fit the local culture.", "HR Staffing"], ["A company funds expansion using internally generated cash from past profits instead of paying it out to owners. This financing source is?", ["Bonds", "Retained earnings", "Equity issuance", "Bank loans"], 1, "Retained earnings: reinvesting internal profits rather than distributing them.", "Financing & Accounting"], ["Which debt financing has a relatively low cost of capital, is repaid in installments, and is among the FIRST repaid in bankruptcy?", ["Equity shares", "Loans", "Common stock", "Retained earnings"], 1, "Loans are low-cost debt, repaid in installments, and senior in bankruptcy (hence lower risk).", "Financing & Accounting"], ["Debt securities that investors purchase and that mature over time with a set rate of return. Which financing source?", ["Equity", "Bonds", "Retained earnings", "Venture capital"], 1, "Bonds are debt securities that mature over time at a set return.", "Financing & Accounting"], ["Raising capital by selling ownership shares in the company is which source of financing?", ["Loans", "Equity", "Bonds", "Retained earnings"], 1, "Equity financing: selling ownership stakes (shares) to raise capital.", "Financing & Accounting"], ["In the United States, which body establishes Generally Accepted Accounting Principles (GAAP)?", ["The IASB", "The FASB (Financial Accounting Standards Board)", "The SEC", "The IMF"], 1, "The FASB has set US GAAP since 1973.", "Financing & Accounting"], ["Which set of accounting standards is used internationally across numerous countries as the alternative to US GAAP?", ["GAAP", "IFRS (International Financial Reporting Standards)", "FASB", "Sarbanes-Oxley"], 1, "IFRS is the international standard (set by the IASB); GAAP is US-specific.", "Financing & Accounting"], ["A US company acquiring a domestic US supplier reports the transaction under which accounting standard?", ["IFRS", "GAAP", "IASB rules", "ISO standards"], 1, "US domestic transactions use GAAP.", "Financing & Accounting"], ["A real-time exchange rate used for an immediate currency exchange is called the?", ["Forward rate", "Spot rate", "Cross rate", "Fixed rate"], 1, "Spot rate: the current, real-time exchange rate for immediate settlement.", "FX & Risk"], ["A firm agrees today to a fixed rate for currency delivery at a future date. That agreed rate is the?", ["Spot rate", "Forward rate", "Floating rate", "Prime rate"], 1, "Forward rate: the rate locked today for future delivery (used in forward contracts).", "FX & Risk"], ["Currency risk arising from a SPECIFIC cross-border transaction that will settle in the future is called?", ["Translation exposure", "Transaction exposure", "Economic exposure", "Political exposure"], 1, "Transaction exposure: risk on a specific transaction settling at a future exchange rate.", "FX & Risk"], ["Currency risk that arises when a parent company CONSOLIDATES a foreign subsidiary's financial statements into its home currency is?", ["Translation exposure", "Transaction exposure", "Economic exposure", "Operational exposure"], 0, "Translation exposure: arises from consolidating/translating foreign subsidiary financials.", "FX & Risk"], ["The long-term risk that exchange-rate shifts will affect a firm's future cash flows and competitive position is?", ["Transaction exposure", "Translation exposure", "Economic (operating) exposure", "Credit exposure"], 2, "Economic exposure: long-run impact of currency moves on competitiveness and future cash flows.", "FX & Risk"], ["Coca-Cola uses one global brand with consistent marketing everywhere, gaining economies of scale. Which strategy?", ["Adaptation", "Standardization", "Glocalization", "Localization"], 1, "Standardization: one consistent global brand and marketing approach.", "Marketing & Sourcing"], ["A food company reformulates its products and rewrites its ads to fit each country's tastes. Which strategy?", ["Standardization", "Adaptation", "Mercantilism", "Exporting"], 1, "Adaptation (localization): customizing product and marketing per market.", "Marketing & Sourcing"], ["A global brand tailored with local elements per market, 'think globally, act locally', is called?", ["Standardization", "Glocalization", "Mercantilism", "Franchising"], 1, "Glocalization: a global approach adapted with local elements.", "Marketing & Sourcing"], ["A firm contracts an external, often foreign, company to perform a business function it used to do in-house. This is?", ["Insourcing", "Outsourcing", "Reshoring", "Vertical integration"], 1, "Outsourcing: contracting a function out to an external provider.", "Marketing & Sourcing"], ["A company brings a previously outsourced function back IN-HOUSE to control quality. This is?", ["Outsourcing", "Insourcing", "Offshoring", "Franchising"], 1, "Insourcing: bringing a function back in-house.", "Marketing & Sourcing"], ["Which IP protection covers inventions and grants exclusive rights, as in the Apple v. Samsung dispute over device features?", ["Trademark", "Patent", "Copyright", "Trade secret"], 1, "Patents protect inventions and functional/design features.", "IP, Tax & Tech Law"], ["Which IP protection covers brand identifiers such as logos, names, and slogans?", ["Patent", "Trademark", "Copyright", "Trade secret"], 1, "Trademarks protect brand identifiers (names, logos, slogans).", "IP, Tax & Tech Law"], ["Which IP protection covers original creative works such as books, music, and software code?", ["Patent", "Copyright", "Trademark", "Trade secret"], 1, "Copyright protects original creative/authored works.", "IP, Tax & Tech Law"], ["Confidential business information kept secret for competitive advantage, like the Coca-Cola formula, is protected as a?", ["Patent", "Trade secret", "Trademark", "Copyright"], 1, "Trade secret: confidential info protected by keeping it secret (e.g., a formula).", "IP, Tax & Tech Law"], ["A country with very low or no corporate income tax, such as Bermuda or the Cayman Islands, used to shelter profits, is a?", ["Customs union", "Tax haven", "Free trade zone", "Common market"], 1, "Tax haven: a jurisdiction with very low/no corporate tax used to shelter income.", "IP, Tax & Tech Law"], ["Major international legislation regulating how global businesses collect and use personal data, such as the EU's GDPR, falls under which area?", ["Antitrust law", "Data privacy (data protection) law", "Contract law", "Tax law"], 1, "Data privacy/protection law (e.g., GDPR) governs collection and use of personal data.", "IP, Tax & Tech Law"]];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const STOP=new Set("the a an of to in is are and or for on with by that this it its as be will at from which not more than into up down each all two one no any has have can do does what when where who why how a/an".split(" "));
function boldUnique(correct,distractors){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
  const dw=new Set();distractors.forEach(d=>norm(d).forEach(w=>dw.add(w)));
  return correct.split(/(\s+)/).map(tok=>{const w=tok.toLowerCase().replace(/[^a-z0-9]/g,"");if(w&&w.length>2&&!STOP.has(w)&&!dw.has(w))return "<b>"+tok+"</b>";return tok;}).join("");
}
function revealBold(btns,m){const cb=btns.find(b=>+b.dataset.oi===m[2]);if(!cb)return;const t=cb.querySelector(".txt");t.innerHTML=boldUnique(t.textContent,m[1].filter((_,k)=>k!==m[2]));}
const CIRC=2*Math.PI*22;
function setRing(id,pid,frac){const c=$(id);c.style.strokeDasharray=`${frac*CIRC} ${CIRC}`;$(pid).textContent=Math.round(frac*100)+"%";}

let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function buildSel(){$("#sel").innerHTML=TOPICS.map(t=>`<option value="${t}"${t==topic?" selected":""}>${t==="All"?"All topics":t}</option>`).join("")}
$("#sel").addEventListener("change",e=>{topic=e.target.value;init()});
$("#reset").addEventListener("click",()=>{if(confirm("Reset all study progress?"))resetSet(true);});

const LS_KEY='d080gapdrill_v1';
let PROG={};
function load(){try{PROG=JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){PROG={};}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(PROG));}catch(e){}}
function allIdx(){return MCQS.map((m,i)=>i).filter(i=>topic==="All"||MCQS[i][4]===topic);}
let queue=[],total=0,mastered=0,seen=new Set(),cur=null,curOpts=[],locked=false,waiting=false;
function init(){
  load();
  const items=allIdx();
  total=items.length;
  items.forEach(i=>{if(!PROG[i])PROG[i]={c:0,hist:[]};});
  recount();
  queue=sh(items.filter(i=>PROG[i].c<2));
  next();
}
function recount(){const items=allIdx();mastered=items.filter(i=>PROG[i].c>=2).length;seen=new Set(items.filter(i=>PROG[i].hist.length>0));}
function resetSet(all){const items=all?MCQS.map((m,i)=>i):allIdx();items.forEach(i=>{PROG[i]={c:0,hist:[]};});save();init();}
function meters(){
  let conf=0;allIdx().forEach(i=>{conf+=Math.min((PROG[i]?PROG[i].c:0),2)/2;});
  setRing("#ringSeen","#pctSeen",total?seen.size/total:0);
  setRing("#ringApt","#pctApt",total?conf/total:0);
}
function next(){
  locked=false;waiting=false;
  if(!queue.length){done();return;}
  cur=queue.shift();const p=PROG[cur];seen.add(cur);
  const m=MCQS[cur];
  const opts=sh(m[1].map((o,oi)=>({o,oi})));curOpts=opts;
  const pips=p.hist.map(h=>`<span class="pip ${h?'ok':'no'}"></span>`).join("");
  let html=`<div class="q">${m[0]}</div><div class="hist">${pips}</div><div id="opts">`;
  html+=opts.map((x,disp)=>`<button class="ans" data-disp="${disp}" data-oi="${x.oi}"><span class="ltr">${"ABCD"[disp]}</span><span class="txt">${x.o}</span></button>`).join("");
  html+=`</div><div class="cont" id="cont"></div>`;
  $("#qbox").innerHTML=html;
  meters();
}
function pick(disp){
  if(locked||waiting)return;
  const m=MCQS[cur],x=curOpts[disp];if(!x)return;
  const p=PROG[cur],right=x.oi===m[2],btns=$$("#opts .ans");
  if(right){
    locked=true;p.hist.push(true);
    btns.forEach(b=>{if(+b.dataset.disp===disp)b.classList.add("correct");else b.classList.add("dim");b.style.pointerEvents="none"});
    revealBold(btns,m);
    p.c++;if(p.c>=2)mastered++;else queue.splice(Math.min(10,queue.length),0,cur);
    save();meters();setTimeout(next,420);
  } else {
    locked=true;waiting=true;p.hist.push(false);p.c=0;
    btns.forEach(b=>{const bi=+b.dataset.oi;if(+b.dataset.disp===disp)b.classList.add("wrong");if(bi===m[2])b.classList.add("correct");b.style.pointerEvents="none"});
    revealBold(btns,m);
    $("#cont").innerHTML=`<div class="explain"><div class="et">Explain</div>${m[3]}</div><div class="cont">tap or press <b>space</b> to continue ▸</div>`;
    queue.splice(Math.min(3,queue.length),0,cur);
    save();
  }
}
$("#qbox").addEventListener("click",e=>{if(waiting){next();return;}const b=e.target.closest(".ans");if(!b)return;pick(+b.dataset.disp);});
document.addEventListener("keydown",e=>{
  if(waiting&&(e.key===" "||e.key==="Enter")){e.preventDefault();next();return;}
  const k=e.key.toLowerCase();const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  if(!locked&&!waiting&&k in map)pick(map[k]);
});
function done(){
  $("#qbox").innerHTML=`<div class="done"><div class="big">100% Aptitude</div><div class="sm">All ${total} questions answered correctly twice. You have seen and mastered the set.</div><button class="btn" onclick="resetSet(false)">Study again</button></div>`;
  setRing("#ringSeen","#pctSeen",1);setRing("#ringApt","#pctApt",1);
}
buildSel();init();
</script></body></html>
