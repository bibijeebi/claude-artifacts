<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Duct Sim: residential attic system</title>
<meta name="description" content="Click-and-hold 2D duct cleaning trainer. Attic air handler, supply trunk with flex branches, one return. Cut access, whip, forward, patch, plug. Scored on the rules that matter.">
<meta property="og:type" content="website">
<meta property="og:title" content="Duct Sim: residential attic system">
<meta property="og:description" content="Click-and-hold 2D duct cleaning trainer. Cut access, whip, forward toward the negative air, patch every hole. Scored on branches-before-trunk, containment, and close-out.">
<meta property="og:url" content="https://niggerfaggot.club/duct-sim-2d.html">
<meta property="og:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/duct-sim-2d-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/duct-sim-2d-og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a2e;--paper:#f6efe2;--yellow:#f4c33a;--blue:#3e63c8;--metal:#c9ccd3;--metal2:#9ea3ad;--grime:#5a3d21;--attic:#6b4a2f;--wall:#e9dcc4;--room:#f3e6d0;--green:#4fb36a;--red:#d9463e}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--ink);color:var(--paper);font-family:Fredoka,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-rows:auto 1fr auto auto;height:100dvh;max-width:1180px;margin:0 auto;min-width:0;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 14px;font-size:15px}
header b{font-size:19px;font-weight:700;color:var(--yellow)}
header .m{display:flex;align-items:center;gap:6px}
.bar{width:90px;height:10px;background:#3a3650;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .2s}
header button{margin-left:auto}
#scene{position:relative;min-height:0}
svg{width:100%;height:100%;display:block;touch-action:none}
#msgs{padding:6px 14px;font-size:15px;line-height:1.35;min-height:52px}
#msgs .why{color:#b9b3d6;font-size:13.5px}
#msgs .bad{color:#ff9b95}
#msgs .good{color:#8fe0a5}
#belt{display:flex;gap:6px;padding:6px 10px 10px;overflow-x:auto;scrollbar-width:none}
#belt::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;border:3px solid #3a3650;background:#2a2740;color:var(--paper);border-radius:14px;padding:5px 8px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;min-width:58px;text-align:center}
.tool small{display:block;font-weight:400;font-size:11px;color:#b9b3d6}
.tool.on{border-color:var(--yellow);background:#4a4020}
button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:12px;padding:8px 14px;background:var(--yellow);color:var(--ink);cursor:pointer}
button.alt{background:#3a3650;color:var(--paper)}
button:disabled{opacity:.4}
#panel{position:absolute;right:10px;top:10px;width:260px;background:#2a2740;border:3px solid #3a3650;border-radius:16px;padding:12px;font-size:14px;display:none;z-index:5}
#panel h3{margin:0 0 6px;font-size:16px;color:var(--yellow)}
#panel p{margin:4px 0 8px;color:#d9d3ef}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#panel svg{height:150px;width:100%;touch-action:none}
.hold{position:relative}
.hold.active{background:#ffd966}
#overlay{position:absolute;inset:0;background:rgba(29,26,46,.94);display:none;overflow:auto;padding:20px;z-index:10}
#overlay .card{max-width:620px;margin:0 auto;font-size:15px;line-height:1.4}
#overlay h2{color:var(--yellow);margin:0 0 6px;font-size:26px}
#overlay .big{font-size:48px;font-weight:700}
#overlay ul{padding-left:18px}
#overlay li{margin:6px 0}
#overlay .why{color:#b9b3d6;font-size:13.5px;display:block}
.sel{filter:drop-shadow(0 0 6px #f4c33a)}
.hit{cursor:pointer}
@media (max-width:700px){#panel{left:10px;right:10px;width:auto;top:auto;bottom:6px}header{font-size:13px;gap:6px 8px;padding:6px 10px}header b{font-size:16px}header>span:first-of-type{display:none}.bar{width:56px}header button{padding:6px 10px;font-size:13px}#msgs{font-size:14px}}
@media (max-height:520px){header{padding:3px 10px;font-size:12px;gap:4px 10px}header b{font-size:14px}header>span:first-of-type{display:none}header button{padding:4px 9px;font-size:12px}#msgs{font-size:12.5px;min-height:34px;padding:3px 10px;line-height:1.25}#msgs .why{font-size:11.5px}#belt{padding:3px 8px 6px;gap:4px}.tool{padding:3px 7px;font-size:12px;min-width:50px;border-width:2px;border-radius:10px}.tool small{font-size:9.5px}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{animation:flow .6s linear infinite}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
<header><b>Duct Sim</b><span>residential attic system</span>
<span class="m">supply <span class="bar"><i id="bS"></i></span></span>
<span class="m">return <span class="bar"><i id="bR"></i></span></span>
<span class="m" id="vio">0 flags</span>
<button class="alt" id="hintBtn">Hint</button><button id="finish">Finish job</button></header>
<div id="scene">
<svg id="svg" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cutaway of a house with an attic HVAC system"></svg>
<div id="panel"></div>
<div id="overlay"><div class="card"></div></div>
</div>
<div id="msgs"><div id="m1">Walk the job first. Hand on the air handler and both plenums (the square boxes beside it). Then 8 inch saw on a plenum, that is where the machine hooks up.</div><div class="why" id="m2"></div></div>
<div id="belt"></div>
</div>
<script>
const S = {
  tool:'hand', sel:null, negSide:null, negOn:false, tied:false, walked:{AH:false,SP:false,RP:false}, holes:[], vio:[], defects:[], hint:false, showFlags:false,
  ah:{power:true, panel:true, coil:0, blower:0},
  reg:{R1:'in',R2:'in',R3:'in',RG:'in'},
  seg:{}
};
const LAYOUT = {
  RP:{x:385,y:140,w:70,h:60,side:'return',kind:'plenum',label:'return plenum',up:null},
  RT1:{x:265,y:150,w:120,h:40,side:'return',kind:'trunk',label:'return trunk, near',up:'RP'},
  RT2:{x:145,y:150,w:120,h:40,side:'return',kind:'trunk',label:'return trunk, far',up:'RT1'},
  RB:{x:150,y:190,w:30,h:80,side:'return',kind:'flex',label:'return flex drop',up:'RT2',reg:'RG'},
  SP:{x:545,y:140,w:70,h:60,side:'supply',kind:'plenum',label:'supply plenum',up:null},
  ST1:{x:615,y:150,w:110,h:40,side:'supply',kind:'trunk',label:'supply trunk, near',up:'SP'},
  ST2:{x:725,y:150,w:110,h:40,side:'supply',kind:'trunk',label:'supply trunk, mid',up:'ST1'},
  ST3:{x:835,y:150,w:110,h:40,side:'supply',kind:'trunk',label:'supply trunk, far',up:'ST2'},
  B1:{x:658,y:190,w:24,h:80,side:'supply',kind:'flex',label:'flex branch 1',up:'ST1',reg:'R1'},
  B2:{x:768,y:190,w:24,h:80,side:'supply',kind:'flex',label:'flex branch 2',up:'ST2',reg:'R2'},
  B3:{x:878,y:190,w:24,h:80,side:'supply',kind:'flex',label:'flex branch 3',up:'ST3',reg:'R3'}
};
const REGS = {R1:{x:670,seg:'B1',name:'register 1'},R2:{x:780,seg:'B2',name:'register 2'},R3:{x:890,seg:'B3',name:'register 3'},RG:{x:165,seg:'RB',name:'return grille'}};
const TOOLS = [['hand','Hand','pull, flip, inspect'],['saw','8" saw','hole saw kit'],['bit','1" bit','fairbairn bit'],['hose','Neg air','hose + machine'],['whiph','Hard rod','whip, straight runs'],['whips','Soda rod','whip, coils, flex + 90s'],['nozzle','Nozzle','hold to push'],['patch','Patch','metal + mastic + FSK'],['plug','Plug','pop plug + FSK'],['spray','Sprayer','coil cleaner'],['rag','Rag','blower wipe']];
const MIN_HOLES = 2;
function resetSegs(){ for(const k in LAYOUT) S.seg[k]={grime:75+Math.floor(Math.random()*20),loose:0,noteNoNeg:false}; }
resetSegs();

const svg=document.getElementById('svg'), panel=document.getElementById('panel'), overlay=document.getElementById('overlay');
const say=(a,b,cls)=>{const m1=document.getElementById('m1'),m2=document.getElementById('m2');m1.textContent=a;m1.className=cls||'';m2.textContent=b||'';};
const clean=k=>S.seg[k].grime<8&&S.seg[k].loose<8;
const allClean=()=>Object.keys(LAYOUT).every(clean);
const sideClean=s=>Object.keys(LAYOUT).filter(k=>LAYOUT[k].side===s).every(clean);
const negRunning=side=>S.negSide===side&&S.negOn;
function flag(code,text,why){ if(S.vio.some(v=>v.code===code)) return; S.vio.push({code,text,why}); say(text,why,'bad'); render(); }
function pathUp(k){ const out=[]; let c=LAYOUT[k].up; while(c){ out.push(c); c=LAYOUT[c].up; } return out; }
function downstream(k){ return Object.keys(LAYOUT).filter(o=>o!==k&&pathUp(o).includes(k)); }
function holeAt(k){ return S.holes.find(h=>h.seg===k); }
function downChain(k){ const out=[]; let c=k; for(;;){ const n=Object.keys(LAYOUT).find(o=>LAYOUT[o].up===c&&LAYOUT[o].kind==='trunk'); if(!n) break; out.push(n); c=n; } return out; }
function entryOf(t,tool){
  const soda=tool==='whips', hard=tool==='whiph', noz=tool==='nozzle';
  if(REGS[t]){ const R=REGS[t]; if(S.reg[t]!=='out') return {err:['Register is still in.','Hand to pull it first.']};
    if(hard&&!noz) return {err:['Hard rod will not make the 90.','Flex needs the soda rod. It coils, so it goes up the flex and around into the trunk.']};
    return {segs:[R.seg,LAYOUT[R.seg].up],name:R.name+' boot',cx:R.x,cy:276}; }
  const L=LAYOUT[t]; if(!L) return {err:['Nothing there.','']};
  const h=holeAt(t);
  if(L.reg) return {err:['Come in at the register.','Tap the pulled register, the rod goes up from the boot.']};
  if(!h||!h.cut) return {err:['No way in here.',L.kind==='plenum'?'Cut the 8 inch access.':'Come in from an open boot with the soda rod, from the plenum access with the hard rod, or cut a bit hole.']};
  const c=center(t);
  if(L.kind==='plenum'){ if(soda&&!noz) return {err:['Soda rod coils up before it gets down the trunk.','Hard rod for a straight push. Stack four and it goes where you point it.']};
    return {segs:[t,...downChain(t).slice(0,2)],name:L.label+' access',cx:c.cx,cy:c.cy}; }
  if(soda&&!noz) return {segs:[t],name:L.label+' bit hole',cx:c.cx,cy:c.cy};
  const up=LAYOUT[L.up].kind==='trunk'?[L.up]:[]; return {segs:[...up,t,...downChain(t).slice(0,1)],name:L.label+' bit hole',cx:c.cx,cy:c.cy};
}
function reaches(k){ const out=[];
  for(const r in REGS){ const e=entryOf(r,'whips'); if(e.segs&&e.segs.includes(k)) out.push('soda rod from the '+REGS[r].name+' boot'); }
  for(const o in LAYOUT){ const h=holeAt(o); if(!h||!h.cut) continue; for(const tl of ['whiph','whips']){ const e=entryOf(o,tl); if(e.segs&&e.segs.includes(k)){ out.push((tl==='whiph'?'hard':'soda')+' rod from the '+LAYOUT[o].label+(h.type==='8'?' access':' bit hole')); break; } } }
  return out; }

// ---------- drawing ----------
const NS='http://www.w3.org/2000/svg';
const el=(t,a,parent)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(parent||svg).appendChild(e);return e;};
let rngSeed=7; const rnd=()=>{rngSeed=(rngSeed*9301+49297)%233280;return rngSeed/233280;};
function speckles(L,n,fill,op,cls){
  rngSeed=L.x*3+L.y; const g=el('g',{class:cls,opacity:op});
  for(let i=0;i<n;i++){ el('circle',{cx:L.x+4+rnd()*(L.w-8),cy:L.y+4+rnd()*(L.h-8),r:1.5+rnd()*2.5,fill},g); }
  return g;
}
function render(){
  svg.innerHTML='';
  // house shell
  el('rect',{x:0,y:0,width:1000,height:600,fill:'#2c2a3f'});
  el('polygon',{points:'20,282 500,22 980,282',fill:'#5a3e2b',stroke:'var(--ink)','stroke-width':6,'stroke-linejoin':'round'});
  el('polygon',{points:'48,276 500,40 952,276',fill:'#7a5a3e'});
  el('rect',{x:40,y:276,width:920,height:290,fill:'var(--room)',stroke:'var(--ink)','stroke-width':6});
  el('rect',{x:40,y:270,width:920,height:14,fill:'var(--wall)',stroke:'var(--ink)','stroke-width':4});
  for(let x=60;x<960;x+=40) el('rect',{x,y:262,width:12,height:12,fill:'#8a6a4a'});
  el('rect',{x:40,y:552,width:920,height:16,fill:'#b98a5a',stroke:'var(--ink)','stroke-width':4});
  el('rect',{x:300,y:340,width:120,height:110,fill:'#bcd8ef',stroke:'var(--ink)','stroke-width':5,rx:6});
  el('line',{x1:360,y1:340,x2:360,y2:450,stroke:'var(--ink)','stroke-width':4});
  el('rect',{x:560,y:430,width:230,height:80,rx:16,fill:'#6f8fc9',stroke:'var(--ink)','stroke-width':5});
  el('rect',{x:575,y:410,width:200,height:40,rx:14,fill:'#7d9dd6',stroke:'var(--ink)','stroke-width':5});
  // attic hatch
  el('rect',{x:214,y:266,width:56,height:22,fill:'#4a3320',stroke:'var(--ink)','stroke-width':4,rx:3});
  // negative air machine (room)
  const mg=el('g',{class:'hit',id:'hit-NEG'});
  el('rect',{x:60,y:470,width:100,height:82,rx:10,fill:'var(--yellow)',stroke:'var(--ink)','stroke-width':5},mg);
  if(validTarget('NEG')) el('rect',{x:54,y:464,width:112,height:94,rx:12,fill:'none',stroke:'#ffe9a3','stroke-width':2,'stroke-dasharray':'5 4',class:'flow'},mg);
  el('circle',{cx:110,cy:505,r:22,fill:'#2a2740',stroke:'var(--ink)','stroke-width':4},mg);
  el('circle',{cx:110,cy:505,r:8,fill:S.negOn?'var(--green)':'#6b6588'},mg);
  el('text',{x:110,y:543,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'var(--ink)'},mg).textContent=S.negOn?'RUNNING':'OFF';
  el('text',{x:110,y:462,'text-anchor':'middle','font-size':12,fill:'#d9d3ef'}).textContent='negative air';
  // hose
  if(S.negSide){ const h=holeAt(S.negSide==='supply'?'SP':'RP'); const L=LAYOUT[h.seg]; const hg=el('g',{class:'hit'+(S.sel==='HOSE'?' sel':''),id:'hit-HOSE'});
    const pts=`110,470 110,300 242,300 242,232 ${L.x+L.w/2},232 ${L.x+L.w/2},${L.y+L.h}`;
    el('polyline',{points:pts,fill:'none',stroke:'#3a3650','stroke-width':14,'stroke-linejoin':'round','stroke-linecap':'round'},hg);
    el('polyline',{points:pts,fill:'none',stroke:'#8f89b3','stroke-width':8,'stroke-dasharray':'6 6','stroke-linejoin':'round','stroke-linecap':'round',class:S.negOn?'flow':''},hg);
    if(S.tied){ el('line',{x1:242,y1:232,x2:242,y2:200,stroke:'#e0c070','stroke-width':4},hg); el('circle',{cx:242,cy:232,r:7,fill:'#e0c070',stroke:'var(--ink)','stroke-width':2},hg); }
    else { el('text',{x:242,y:222,'text-anchor':'middle','font-size':10,fill:'#ffe9a3'},hg).textContent='untied'; if(validTarget('HOSE')) el('circle',{cx:242,cy:232,r:14,fill:'none',stroke:'#ffe9a3','stroke-width':2,'stroke-dasharray':'5 4',class:'flow'},hg); }
  }
  // ducts
  for(const k in LAYOUT){ const L=LAYOUT[k], s=S.seg[k], g=el('g',{class:'hit'+(S.sel===k?' sel':''),id:'hit-'+k});
    const flex=L.kind==='flex', fill=flex?'#a8adb8':'var(--metal)';
    el('rect',{x:L.x-14,y:L.y-6,width:L.w+28,height:L.h+12,fill:'transparent'},g);
    el('rect',{x:L.x,y:L.y,width:L.w,height:L.h,rx:flex?12:(L.kind==='plenum'?4:L.h/2),fill,stroke:'var(--ink)','stroke-width':5},g);
    if(flex) for(let y=L.y+8;y<L.y+L.h-4;y+=8) el('line',{x1:L.x+3,y1:y,x2:L.x+L.w-3,y2:y,stroke:'#7d828c','stroke-width':2},g);
    else if(L.kind==='trunk') el('rect',{x:L.x,y:L.y+L.h*.55,width:L.w,height:L.h*.25,fill:'var(--metal2)',opacity:.6},g);
    g.appendChild(speckles(L,Math.round(L.w*L.h/120),'var(--grime)',s.grime/100));
    g.appendChild(speckles({x:L.x+1,y:L.y+1,w:L.w,h:L.h},Math.round(L.w*L.h/150),'#b78b5b',s.loose/100));
    const h=holeAt(k); if(h){ const cx=L.x+L.w/2, cy=L.y+L.h/2, r=h.type==='8'?14:5;
      if(h.patched) el('rect',{x:cx-r-6,y:cy-r-6,width:2*r+12,height:2*r+12,fill:'#b9bfca',stroke:'var(--ink)','stroke-width':3,rx:2},g);
      else if(h.cut) el('circle',{cx,cy,r,fill:'#1d1a2e',stroke:'var(--yellow)','stroke-width':3},g);
      else el('circle',{cx,cy,r,fill:'none',stroke:'var(--yellow)','stroke-width':2,'stroke-dasharray':'3 3'},g);
    }
    if(L.kind==='plenum'){ el('text',{x:L.side==='return'?L.x+L.w-8:L.x+8,y:L.y-10,'text-anchor':L.side==='return'?'end':'start','font-size':11,fill:'#d9d3ef'},g).textContent=L.side+' plenum'; }
    if(k==='ST3') el('text',{x:L.x+L.w/2,y:L.y-8,'text-anchor':'middle','font-size':11,fill:'#d9d3ef'},g).textContent='supply trunk';
    if(k==='RT2') el('text',{x:L.x+L.w/2,y:L.y-8,'text-anchor':'middle','font-size':11,fill:'#d9d3ef'},g).textContent='return trunk';
    if(validTarget(k)) el('rect',{x:L.x-4,y:L.y-4,width:L.w+8,height:L.h+8,rx:8,fill:'none',stroke:'#ffe9a3','stroke-width':2,'stroke-dasharray':'5 4',class:'flow'},g);
    if(S.hint){ el('text',{x:L.x+L.w/2,y:L.y-6,'text-anchor':'middle','font-size':11,fill:'#ffe9a3'},g).textContent=k+' '+Math.round(s.grime+s.loose)+'%'; }
  }
  // air handler
  const ag=el('g',{class:'hit'+(S.sel==='AH'?' sel':''),id:'hit-AH'});
  el('rect',{x:455,y:105,width:90,height:130,rx:8,fill:'#8b93a3',stroke:'var(--ink)','stroke-width':5},ag);
  if(validTarget2('AH')) el('rect',{x:449,y:78,width:102,height:162,rx:10,fill:'none',stroke:'#ffe9a3','stroke-width':2,'stroke-dasharray':'5 4',class:'flow'},ag);
  if(!S.ah.panel){ el('rect',{x:463,y:113,width:74,height:114,fill:'#3a3650',stroke:'var(--ink)','stroke-width':3},ag);
    el('rect',{x:470,y:120,width:60,height:40,fill:S.ah.coil>=100?'#9fd6b8':'#6e5a3f',stroke:'var(--ink)','stroke-width':2},ag);
    for(let y=126;y<158;y+=6) el('line',{x1:472,y1:y,x2:528,y2:y,stroke:'#2a2740','stroke-width':1.5},ag);
    el('circle',{cx:500,cy:195,r:22,fill:S.ah.blower>=100?'#b8c4d6':'#6e5a3f',stroke:'var(--ink)','stroke-width':3},ag);
    el('rect',{x:395,y:235,width:60,height:28,rx:3,fill:'#8b93a3',stroke:'var(--ink)','stroke-width':3},ag);
  } else el('rect',{x:463,y:113,width:74,height:114,fill:'#a3abba',stroke:'var(--ink)','stroke-width':3},ag);
  el('rect',{x:452,y:82,width:26,height:20,rx:3,fill:'#c9ccd3',stroke:'var(--ink)','stroke-width':3},ag);
  el('rect',{x:462,y:S.ah.power?85:92,width:6,height:8,fill:S.ah.power?'var(--red)':'var(--green)'},ag);
  el('text',{x:500,y:250,'text-anchor':'middle','font-size':11,fill:'#d9d3ef'}).textContent='air handler';
  // registers
  for(const r in REGS){ const R=REGS[r], g=el('g',{class:'hit'+(S.sel===r?' sel':''),id:'hit-'+r});
    el('rect',{x:R.x-36,y:256,width:72,height:40,fill:'transparent'},g);
    if(validTarget(r)) el('rect',{x:R.x-30,y:264,width:60,height:24,rx:6,fill:'none',stroke:'#ffe9a3','stroke-width':2,'stroke-dasharray':'5 4',class:'flow'},g);
    if(S.reg[r]==='in'){ el('rect',{x:R.x-26,y:268,width:52,height:16,rx:3,fill:'#eef0f3',stroke:'var(--ink)','stroke-width':4},g);
      for(let x=R.x-18;x<=R.x+18;x+=9) el('line',{x1:x,y1:272,x2:x,y2:280,stroke:'#8a8f9a','stroke-width':3},g); }
    else { el('rect',{x:R.x-26,y:268,width:52,height:16,fill:'#1d1a2e',stroke:'var(--ink)','stroke-width':4},g);

function techPos(){

const TOOL_INTRO={

    panel.querySelectorAll('[data-side]').forEach(n=>n.addEventListener('pointerdown',e=>{ const s=n.dataset.side; if(done.includes(s)) return; if(done.length>=3){ hole.fourth=true; flag('four-sides','Fourth side scored. The flap is loose now.','Three sides only, so it folds back and re-seats over the patch.'); return; } done.push(s); if(done.length===3) say('Three sides scored, flap rolled back.','Pilot hole next.'); draw(); }));
    const pc=panel.querySelector('[data-pilot]'); pc&&pc.addEventListener('pointerdown',()=>{ if(stage!=='pilot') return; hole.pilot=true; say('Pilot drilled dead center.','Hole saw on the pilot.'); draw(); });
    const sh=panel.querySelector('#sawhold'); if(sh){ let iv=null; const up=()=>{ if(!iv) return; clearInterval(iv); iv=null; if(hole.saw>=65&&hole.saw<=85){ hole.cut=true; say(`8 inch access cut on ${L.label}. Clean edge.`,L.kind==='plenum'?'Hose hooks up here. Whip reaches the near trunk segment through it too.':'','good'); panel.style.display='none'; render(); } else if(hole.saw>85){ hole.burr=true; S.defects.push('Burred the lip on '+L.label); say('You leaned on it. Knurled burr on the lip.','That edge opens hands. Deburr it.','bad'); draw(); } else { say('Not through yet.','Keep going, release in the band.'); draw(); } };
      sh.addEventListener('pointerdown',e=>{e.preventDefault(); sh.classList.add('active'); iv=setInterval(()=>{hole.saw=Math.min(100,hole.saw+1.1); const b=panel.querySelector('#sawbar'); if(b){b.style.width=hole.saw+'%'; b.style.background=hole.saw>85?'var(--red)':hole.saw>=65?'var(--green)':'var(--yellow)';}},50);});
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>sh.addEventListener(ev,up)); }
    const db=panel.querySelector('#deburr'); db&&db.addEventListener('click',()=>{ hole.burr=false; hole.cut=true; say(`Deburred. 8 inch access open on ${L.label}.`,'','good'); panel.style.display='none'; render(); });
    panel.querySelector('#closep').addEventListener('click',()=>{ panel.style.display='none'; if(!hole.cut){ S.holes=S.holes.filter(x=>x!==hole); } render(); });
  };
  draw(); render();
}
function openPatch(k){
  const L=LAYOUT[k], h=holeAt(k), round=L.kind==='trunk'; let st={bent:!round,screws:[],step:0}; const corners=[0,2,4,6];
  const draw=()=>{ const steps=['Mastic the full perimeter','Mastic an X across the face','Fold the insulation flap back','Tape the cut with 3 inch FSK'];
    const pts=[[30,20],[100,20],[170,20],[170,65],[170,110],[100,110],[30,110],[30,65]];
    showPanel(`<h3>Patch ${L.label}</h3><p>${st.screws.length<8?'Sheet metal patch, oversized. Set 8 screws. Tap them in.':st.step<4?steps[st.step]+'.':'Done.'}</p>
    <svg viewBox="0 0 200 130"><rect x="20" y="10" width="160" height="110" fill="#c9ccd3" stroke="#1d1a2e" stroke-width="3" ${round&&!st.bent?'rx="0"':'rx="12"'}/>${st.step>=1?'<rect x="26" y="16" width="148" height="98" fill="none" stroke="#5a5a5a" stroke-width="5" stroke-dasharray="4 3"/>':''}${st.step>=2?'<path d="M30 20 L170 110 M170 20 L30 110" stroke="#5a5a5a" stroke-width="5"/>':''}${st.step>=3?'<rect x="20" y="10" width="160" height="110" fill="#e7d8b1" opacity=".9"/>':''}${st.step>=4?'<rect x="20" y="10" width="160" height="110" fill="none" stroke="#dcdcdc" stroke-width="8"/>':''}
    ${st.step<3?pts.map((p,i)=>`<circle data-s="${i}" cx="${p[0]}" cy="${p[1]}" r="8" fill="${st.screws.includes(i)?'#1d1a2e':'#f4c33a'}" stroke="#1d1a2e" stroke-width="2" style="cursor:pointer"/>`).join(''):''}</svg>
    <div class="row">${round&&!st.bent?'<button id="bend">Bend to radius</button>':''}${st.screws.length===8&&st.step<4?`<button id="next">${steps[st.step]}</button>`:''}<button class="alt" id="closep">Close</button></div>`);
    panel.querySelectorAll('[data-s]').forEach(n=>n.addEventListener('pointerdown',()=>{ const i=+n.dataset.s; if(st.screws.includes(i)) return; if(!st.bent&&!st.flatFlag){ st.flatFlag=true; flag('flat-'+k,'Flat patch on a round trunk. It will not seat.','Bend the patch to the radius first.'); }
      if(!corners.includes(i)&&!corners.every(c=>st.screws.includes(c))&&!st.midFlag){ st.midFlag=true; flag('screws-'+k,'Side screw before the corners were in.','Corners first. They hold the curve while you do the sides.'); }
      st.screws.push(i); if(st.screws.length===8) say('Eight screws in.','Mastic next.','good'); draw(); }));
    const b=panel.querySelector('#bend'); b&&b.addEventListener('click',()=>{st.bent=true;say('Patch bent to the trunk radius.','');draw();});
    const nx=panel.querySelector('#next'); nx&&nx.addEventListener('click',()=>{ st.step++; if(st.step===4){ h.patched=true; say(`${L.label} closed. FSK, not duct tape.`,'Duct tape dries out and lets go.','good'); panel.style.display='none'; } draw(); render(); });
    panel.querySelector('#closep').addEventListener('click',()=>{panel.style.display='none';});
  }; draw();
}
function openPlug(k){ const L=LAYOUT[k], h=holeAt(k); let seated=false;
  const draw=()=>{ showPanel(`<h3>Plug bit hole, ${L.label}</h3><p>${seated?'Fold the insulation V back and tape it shut.':'Seat the pop plug in the hole.'}</p><div class="row"><button id="go">${seated?'Fold V + FSK':'Seat plug'}</button><button class="alt" id="closep">Close</button></div>`);
    panel.querySelector('#go').addEventListener('click',()=>{ if(!seated){seated=true;draw();} else { h.patched=true; say(`Bit hole on ${L.label} plugged and taped.`,'No patch, no screws, no mastic.','good'); panel.style.display='none'; render(); } });
    panel.querySelector('#closep').addEventListener('click',()=>{panel.style.display='none';}); }; draw(); }

// ---------- finish ----------
function finish(){
  const segs=Object.keys(LAYOUT); const cleanPct=Math.round(segs.reduce((a,k)=>a+Math.max(0,100-S.seg[k].grime-S.seg[k].loose),0)/segs.length);
  const open=S.holes.filter(h=>h.cut&&!h.patched), regsOut=Object.keys(S.reg).filter(r=>S.reg[r]==='out');
  const ahDone=S.ah.coil>=100&&S.ah.blower>=100&&S.ah.panel;
  const holes=S.holes.filter(h=>h.cut).length;
  let score=cleanPct; score-=S.vio.length*8; score-=open.length*10; score-=regsOut.length*5; score-=Math.max(0,holes-MIN_HOLES)*4; score-=ahDone?0:12; score-=S.defects.length*3; if(S.negSide) score-=3; score=Math.max(0,Math.round(score));
  const li=(t,w)=>`<li>${t}${w?`<span class="why">${w}</span>`:''}</li>`;
  overlay.querySelector('.card').innerHTML=`<h2>Job scored</h2><div class="big">${score}</div>
  <ul>${li(`Ducts ${cleanPct}% clean.`)}${li(`${holes} holes cut, ${MIN_HOLES} was the minimum.`,'Two plenum accesses for the hose. Everything else reaches with the soda rod from an open boot, or the hard rod through the plenum access. Bit holes are for when neither reaches.')}
  ${open.length?li(`${open.length} hole${open.length>1?'s':''} left open.`,'Walk it and count against the holes you cut.'):li('Every hole closed.')}
  ${regsOut.length?li(`${regsOut.length} register${regsOut.length>1?'s':''} still off.`):''}
  ${ahDone?li('Air handler done.'):li('Air handler not finished.','Coil sprayed, blower wiped, panel on, power back.')}
  ${S.negSide?li('Hose still hooked up.'):''}
  ${S.vio.map(v=>li(v.text,v.why)).join('')}${S.defects.map(d=>li(d)).join('')}</ul>
  <div class="row" style="display:flex;gap:8px"><button id="again">Run it again</button><button class="alt" id="back">Back to the job</button></div>`;
  overlay.style.display='block';
  overlay.querySelector('#again').onclick=()=>location.reload();
  overlay.querySelector('#back').onclick=()=>{overlay.style.display='none';};
}
document.getElementById('finish').onclick=finish;
document.getElementById('vio').style.cursor='pointer';
document.getElementById('vio').onclick=()=>{ if(panel.style.display==='block'&&panel.dataset.flags){ panel.style.display='none'; delete panel.dataset.flags; return; }
  showPanel(`<h3>Flags so far</h3>${S.vio.length?'<ul style="padding-left:16px;margin:0">'+S.vio.map(v=>`<li style="margin:4px 0">${v.text}<span style="display:block;color:#b9b3d6;font-size:12.5px">${v.why}</span></li>`).join('')+'</ul>':'<p>None yet.</p>'}<div class="row"><button class="alt" id="closep">Close</button></div>`); panel.dataset.flags='1'; panel.querySelector('#closep').onclick=()=>{panel.style.display='none';delete panel.dataset.flags;}; };
document.getElementById('hintBtn').onclick=()=>{ S.hint=!S.hint; render(); if(S.hint) hint(); };
function hint(){
  if(!(S.walked.AH&&S.walked.SP&&S.walked.RP)) return say('Hint: walk it first.','Hand on the air handler and both plenums.');
  if(!holeAt('SP')&&!holeAt('RP')) return say('Hint: the machine needs somewhere to pull from.','8 inch saw on a plenum. Pick either side, it does not matter physically.');
  if(!S.negSide) return say('Hint: hose on the plenum access.','Neg air tool, tap the plenum with the access.');
  if(!S.tied) return say('Hint: tie the hose off.','Hand on the hose. Then flip the machine on.');
  if(!S.negOn) return say('Hint: flip the machine on before you whip.','Hand on the machine.');
  const side=S.negSide; const dirty=Object.keys(LAYOUT).filter(k=>LAYOUT[k].side===side&&!clean(k));
  if(dirty.length){ const far=dirty.sort((a,b)=>pathUp(b).length-pathUp(a).length)[0]; const rc=reaches(far); const lo=S.seg[far].loose>=3&&S.seg[far].grime<3; return say(`Hint: farthest dirty thing on this side is ${LAYOUT[far].label}.`,rc.length?(lo?'Nozzle from the same way in: ':'Far end first, working back toward the machine. ')+rc[0].charAt(0).toUpperCase()+rc[0].slice(1)+'.':LAYOUT[far].reg?'Pull its register first.':'Nothing reaches it. Pull the register on the branch below it.'); }
  if(!sideClean(side==='supply'?'return':'supply')) return say('Hint: this side is done. Move the hose to the other plenum.','Hose tool on the current plenum pulls it off.');
  if(!(S.ah.coil>=100&&S.ah.blower>=100&&S.ah.panel)) return say('Hint: both sides clean. Air handler is last.','Power off, panel off, spray, wipe, panel on.');
  return say('Hint: close out.','Hose off. Patch the 8 inch accesses, plug the bit holes, registers back on. Then Finish job.');
}
// belt
const belt=document.getElementById('belt');
TOOLS.forEach(([id,name,sub])=>{ const b=document.createElement('button'); b.className='tool'+(id===S.tool?' on':''); b.innerHTML=`${name}<small>${sub}</small>`; b.onclick=()=>{S.tool=id; belt.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===b)); panel.style.display='none'; say(TOOL_INTRO[id][0],TOOL_INTRO[id][1]); render();}; belt.appendChild(b); });
render();
window.__SIM={S,LAYOUT,act,finish};
</script>
