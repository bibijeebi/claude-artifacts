<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="D196 Miss Drill">
<meta property="og:description" content="Mastery drill for the D196 pre-assessment misses and Excel analysis questions: budget sequence, cost classification, ABC, common-size, and cash budgets.">
<meta property="og:url" content="https://niggerfaggot.club/d196-drill">
<meta name="twitter:card" content="summary">
<title>D196 Miss Drill</title>
<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#2b3238;--dim:#7a8590;--teal:#159fc9;--green:#43a047;--red:#e23b3b;--line:#dde3e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:640px;margin:0 auto}
.head{background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.head h1{font-size:17px;line-height:1.2}
.head .sub{font-size:12px;color:var(--dim)}
.rings{margin-left:auto;display:flex;gap:10px}
.ring{width:52px;text-align:center;font-size:10px;color:var(--dim)}
.ring svg{display:block;margin:0 auto 2px}
.ring .val{font-weight:700;font-size:11px;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.reset{font-size:12px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none}
.card{background:var(--panel);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtopic{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px}
.qtext{font-size:16.5px;line-height:1.45;margin-bottom:14px}
.ans{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;line-height:1.4;margin-bottom:8px;cursor:pointer;color:var(--ink)}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{font-weight:700;color:var(--dim);flex:none}
.ans.correct{border-color:var(--green);background:#eef7ee}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.reveal{border-color:var(--green)}
.ans:disabled{cursor:default}
.explain{display:none;margin-top:10px;border-left:3px solid var(--red);background:#fdf3f3;padding:10px 12px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
.explain b{color:var(--green)}
.explain .cont{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.meta{margin-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.done{background:var(--panel);border-radius:10px;padding:30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.done h2{color:var(--green);margin-bottom:8px}
.done p{color:var(--dim);font-size:14px;margin-bottom:16px}
.done button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>D196 Miss Drill</h1>
      <div class="sub">PA misses + Excel analysis, mastered twice each</div>
    </div>
    <div class="rings">
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="seenArc" cx="22" cy="22" r="19" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="seenVal">0%</span>Seen</div>
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="aptArc" cx="22" cy="22" r="19" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="aptVal">0%</span>Apt</div>
    </div>
  </div>
  <div class="bar">
    <select id="topicSel"><option value="">All topics</option></select>
    <button class="reset" id="resetBtn">reset</button>
  </div>
  <div id="stage"></div>
</div>
<script>
const MCQS=[
["What is the correct sequence of budgets in a manufacturing business?", ["Sales, production, direct materials", "Production, direct materials, sales", "Direct materials, sales, production", "Sales, direct materials, production"], 0, "Sell it, build it, buy the sticks. Sales forecast drives production, production drives materials.", "Budget Sequence"],
["Which budget must be prepared first in the master budget process?", ["Sales budget", "Production budget", "Cash budget", "Direct materials budget"], 0, "Everything downstream depends on forecasted sales volume.", "Budget Sequence"],
["Which budget must be completed before the direct materials budget can be prepared?", ["Production budget", "Sales budget only, materials come directly from it", "Cash budget", "Administrative expense budget"], 0, "Units to produce determine materials to buy. Sales -> production -> materials.", "Budget Sequence"],
["Which budget must be completed before the direct labor budget can be prepared?", ["Production budget", "Direct materials budget", "Sales budget, labor is planned straight from sales", "Cash budget"], 0, "Labor hours are planned from units to produce, not from sales or materials.", "Budget Sequence"],
["Which budget is typically prepared last?", ["Cash budget", "Sales budget", "Production budget", "Direct materials budget"], 0, "Cash collects the consequences of every other budget, so it comes last.", "Budget Sequence"],
["Why does the sales budget come first in the budgeting sequence?", ["Production and purchasing plans depend on forecasted sales volume", "It is the easiest budget to prepare", "Sales managers outrank production managers", "It is required by GAAP"], 0, "It is a pull system. The forecast pulls the factory, the factory pulls the suppliers.", "Budget Sequence"],
["How are the wages of cashiers classified in a merchandising company?", ["Selling expense", "Cost of goods sold", "Manufacturing overhead", "Work-in-process inventory"], 0, "Merchandisers manufacture nothing. Store labor is a period cost, and cashiers are store operations.", "Cost Classification"],
["What is included in cost of goods sold for a merchandising company?", ["The cost of the merchandise purchased for resale", "Merchandise cost plus store employee wages", "Merchandise cost plus store rent and utilities", "All costs of operating the business"], 0, "Only the merchandise itself. The greeter's paycheck is not inside the TV box.", "Cost Classification"],
["Which inventory account does NOT exist in a merchandising company?", ["Work-in-process inventory", "Merchandise inventory", "Inventory reported as a current asset", "Inventory measured at purchase cost"], 0, "No production means no WIP and no raw materials. One inventory account: merchandise.", "Cost Classification"],
["How are the wages of furniture assemblers classified at a furniture manufacturer?", ["Direct labor, a product cost", "Selling expense", "Administrative expense", "Period cost"], 0, "Hands on the product at a manufacturer = direct labor, capitalized into inventory.", "Cost Classification"],
["How are the wages of sales clerks classified at a furniture MANUFACTURER?", ["Selling expense, a period cost", "Direct labor", "Manufacturing overhead", "Cost of goods sold when incurred"], 0, "Selling people are period costs at any company type. Manufacturing status changes factory labor, not sales labor.", "Cost Classification"],
["A merchandiser buys goods for resale. When do those goods hit the income statement?", ["As cost of goods sold when the goods are sold", "As an expense when purchased", "As a selling expense over time", "They stay on the balance sheet permanently"], 0, "Product cost rule: sit in inventory as an asset until sold, then expense as COGS.", "Cost Classification"],
["Which cost is a period cost at a manufacturer?", ["Utility bills for the headquarters building", "Utility bills for the factory", "Wages of factory maintenance workers", "Depreciation on production equipment"], 0, "Factory anything = manufacturing overhead (product cost). Headquarters anything = period cost.", "Cost Classification"],
["How is overhead allocated in an ABC system?", ["Activity rate multiplied by number of cost driver events", "Cost pool multiplied by number of cost driver events", "Sum of materials and labor cost multiplied by number of units", "Budgeted overhead multiplied by expected direct labor hours"], 0, "A pool is a bucket, a rate is a price. Allocation always uses the price: rate x events consumed.", "ABC Costing"],
["How is the activity rate computed in an ABC system?", ["Total cost pool divided by total expected cost driver volume", "Cost pool multiplied by driver volume", "Total overhead divided by direct labor hours", "Driver events divided by the cost pool"], 0, "Ladle the pool into a per-scoop price: pool / total driver volume.", "ABC Costing"],
["A setup cost pool is $200,000 and 400 setups are expected. Product X used 25 setups. How much overhead is allocated to X?", ["$12,500", "$500", "$8,000", "$200,000"], 0, "Rate = 200,000/400 = $500 per setup. X = 25 x 500 = $12,500.", "ABC Costing"],
["An inspection cost pool is $90,000 and 3,000 inspections are expected. What is the activity rate?", ["$30 per inspection", "$300 per inspection", "$3,000 per inspection", "$27 per inspection"], 0, "90,000 / 3,000 = $30 per inspection. Pool over volume, always.", "ABC Costing"],
["In an ABC system, what is a cost driver?", ["The activity or event that causes overhead cost to be incurred", "The total dollars in a cost pool", "The manager responsible for a department", "The product with the highest overhead"], 0, "Drivers are the causes: setups, inspections, machine hours. Pools are the dollars they explain.", "ABC Costing"],
["What distinguishes ABC from a single plantwide overhead rate?", ["ABC allocates overhead based on multiple activities", "ABC eliminates overhead costs", "ABC requires only direct labor hours", "ABC ignores cost drivers"], 0, "Many pools, many rates, each tied to its own driver, instead of one blanket rate.", "ABC Costing"],
["What is the formula for horizontal (year-to-year) analysis?", ["(Current year minus prior year) divided by prior year", "Current year divided by prior year", "(Prior year minus current year) divided by current year", "Current year divided by net sales"], 0, "Percentage change is always (new - old) / old. Divide by where you started.", "Horizontal & Vertical"],
["What is the formula for vertical (common-size) analysis on an income statement?", ["Each line item divided by net sales", "Each line item divided by net income", "Each line item divided by prior year sales", "(Current minus prior) divided by prior"], 0, "Divide by the top. Every line becomes a % of net sales.", "Horizontal & Vertical"],
["Net sales grew from $500,000 to $650,000. What is the year-to-year percentage change?", ["30%", "23%", "77%", "130%"], 0, "(650-500)/500 = 30%. Dividing by the new year (23%) is the classic wrong direction.", "Horizontal & Vertical"],
["Cost of goods sold is $420,000 and net sales are $600,000. What is COGS as a percentage of sales?", ["70%", "30%", "143%", "42%"], 0, "420/600 = 70%. Common-size = line over net sales.", "Horizontal & Vertical"],
["Why are common-size income statements useful?", ["They allow comparison of cost structure across years or companies of different sizes", "They show exact dollar changes between years", "They are required for tax reporting", "They eliminate the need for horizontal analysis"], 0, "Percentages strip out size, so structure is comparable across years and firms.", "Horizontal & Vertical"],
["Operating expenses were 18%, 21%, and 24% of sales over three years while COGS % of sales fell. What should management be concerned about?", ["The increase in operating expenses as a proportion of sales", "The increase in production cost", "The level of interest expense", "The change in income taxes"], 0, "Find the row whose % of sales climbs every year. Dollar growth is bait, proportion is the signal.", "Common-Size Reading"],
["A cost increased in dollars but decreased as a percentage of sales. What does that indicate?", ["The cost grew more slowly than sales", "The cost is out of control", "Sales must have decreased", "The company became less efficient"], 0, "Proportion falling while dollars rise means sales outgrew the cost. That is improvement.", "Common-Size Reading"],
["Income before tax is 3% of sales this year versus 5% two years ago. Which action restores prior profitability?", ["Increasing the proportion of gross profit to sales by about 2%", "Increasing operating expenses by about 2% of sales", "Decreasing the proportion of operating income to sales by 2%", "Paying interest expense earlier in the year"], 0, "Quantify the gap (2 points) and pick the option that moves profit UP by that much. Timing of payments never touches the income statement.", "Common-Size Reading"],
["Interest expense stayed at $22,000 for three straight years. What does horizontal analysis show for it?", ["0% change each year", "A steady increase", "It cannot be computed", "22% each year"], 0, "No dollar change means 0% year-to-year. Flat lines cannot be the growing concern.", "Common-Size Reading"],
["Credit sales are collected 40% in the month of sale, 40% the month after, 20% two months after. December credit sales are $310,000. How much of that is collected in December?", ["$124,000", "$310,000", "$248,000", "$62,000"], 0, "Month-of collection: 310,000 x 40% = 124,000. The rest lands in January and February.", "Cash Budget"],
["Same schedule (40/40/20). November credit sales were $200,000 and October's were $150,000. What does December collect from PRIOR months' credit sales?", ["$110,000", "$80,000", "$140,000", "$70,000"], 0, "Nov x 40% = 80,000 plus Oct x 20% = 30,000. The staircase reaches back one month per row.", "Cash Budget"],
["Why can net cash flow be negative in the month with the highest total sales?", ["A high volume of credit sales means cash receipts lag the sales", "Sales figures are usually overstated", "High sales always increase cash immediately", "Depreciation reduces cash in high-sales months"], 0, "Sales are not receipts. Credit sales pay you on the collection schedule, not at the register.", "Cash Budget"],
["A company faces a $60,000 cash shortfall in December. Which action avoids it?", ["Postpone a $40,000 equipment purchase and skip a $30,000 dividend", "Accelerate collections, gaining $15,000 of receipts", "Promote cash sales, adding $35,000 of December receipts", "Stretch supplier payments, saving $20,000"], 0, "The deficit is a number, so every option is a number. Only 40k + 30k = 70k covers 60k.", "Cash Budget"],
["Which December cash outflow is most controllable in the short run?", ["Cash dividends to shareholders", "Income tax payments", "Debt repayments", "Credit purchases already made"], 0, "Dividends and capex are choices. Taxes, debt service, and bills already incurred are obligations.", "Cash Budget"],
["Inventory bought on credit is paid the month after purchase. Whose credit purchases does December pay?", ["November's", "December's", "October's", "Half of November's and half of December's"], 0, "Pay last month's bill. December's own credit purchases hit January.", "Cash Budget"],
["On a cash budget, what does 'Total Cash Available' from operations include?", ["Cash sales plus collections of credit sales", "Total sales for the month", "All sales minus all expenses", "Net income plus depreciation"], 0, "It is a receipts number. Only money that actually arrived counts.", "Cash Budget"],
["If a company shifts its sales mix toward cash sales and away from credit sales, what happens to cash receipts?", ["They arrive sooner", "They arrive later", "They decrease permanently", "Nothing changes"], 0, "Cash sales collect at the register instead of over the collection schedule, pulling receipts forward.", "Cash Budget"]
];
const LS_KEY='d196drill_v1';
let state={};
try{state=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){state={}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function st(i){if(!state[i])state[i]={c:0,hist:[]};return state[i]}

let topic='';
let queue=[],cur=-1,curOpts=[],waiting=false;

function pool(){return MCQS.map((m,i)=>i).filter(i=>!topic||MCQS[i][4]===topic)}
function buildQueue(){
  queue=pool().filter(i=>st(i).c<2);
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}
}
function shuffleOpts(m){
  const o=m[1].map((t,oi)=>({t,oi}));
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  return o;
}
function uniqueWords(correct,others){
  const otherSet=new Set(others.join(' ').toLowerCase().match(/[a-z0-9$%.,']+/g)||[]);
  return correct.split(' ').map(w=>{
    const k=w.toLowerCase();
    return (k.length>2&&!otherSet.has(k))?'<b>'+w+'</b>':w;
  }).join(' ');
}
function rings(){
  const p=pool();
  const seen=p.filter(i=>st(i).hist.length>0).length/(p.length||1);
  const apt=p.reduce((a,i)=>a+Math.min(st(i).c,2)/2,0)/(p.length||1);
  document.getElementById('seenArc').style.strokeDashoffset=119.4*(1-seen);
  document.getElementById('aptArc').style.strokeDashoffset=119.4*(1-apt);
  document.getElementById('seenVal').textContent=Math.round(seen*100)+'%';
  document.getElementById('aptVal').textContent=Math.round(apt*100)+'%';
}
function render(){
  rings();
  const stage=document.getElementById('stage');
  if(!queue.length){
    stage.innerHTML='<div class="done"><h2>Set mastered.</h2><p>Every question in this filter answered correctly twice in a row. Book the OA.</p><button id="againBtn">Study again</button></div>';
    document.getElementById('againBtn').onclick=()=>{pool().forEach(i=>{delete state[i]});save();buildQueue();render()};
    return;
  }
  cur=queue[0];
  const m=MCQS[cur];
  curOpts=shuffleOpts(m);
  const mastered=pool().filter(i=>st(i).c>=2).length;
  stage.innerHTML='<div class="card"><div class="qtopic">'+m[4]+'</div><div class="qtext">'+m[0]+'</div>'+
    curOpts.map((o,d)=>'<button class="ans" data-disp="'+d+'"><span class="ltr">'+'ABCD'[d]+'</span><span class="txt">'+o.t+'</span></button>').join('')+
    '<div class="explain" id="explain"></div>'+
    '<div class="meta"><span>'+mastered+' / '+pool().length+' mastered</span><span>streak: '+st(cur).c+'/2</span></div></div>';
  document.querySelectorAll('#opts .ans, .ans').forEach(b=>b.onclick=()=>answer(+b.dataset.disp));
}
function answer(disp){
  if(waiting)return;
  const m=MCQS[cur],p=st(cur);
  const picked=curOpts[disp],correctDisp=curOpts.findIndex(x=>x.oi===m[2]);
  const ok=picked.oi===m[2];
  p.hist.push(ok?1:0);
  document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.ans');
  if(ok){
    p.c+=1;
    btns[disp].classList.add('correct');
    btns[disp].querySelector('.txt').innerHTML=uniqueWords(picked.t,m[1].filter((_,i)=>i!==m[2]));
    queue.shift();
    if(p.c<2)queue.splice(Math.min(10,queue.length),0,cur);
    save();
    waiting=true;
    setTimeout(()=>{waiting=false;render()},420);
  }else{
    p.c=0;
    btns[disp].classList.add('wrong');
    btns[correctDisp].classList.add('reveal');
    btns[correctDisp].querySelector('.txt').innerHTML=uniqueWords(m[1][m[2]],m[1].filter((_,i)=>i!==m[2]));
    const ex=document.getElementById('explain');
    ex.style.display='block';
    ex.innerHTML=m[3]+'<span class="cont">tap anywhere or press space to continue</span>';
    queue.shift();
    queue.splice(Math.min(3,queue.length),0,cur);
    save();
    waiting=true;
  }
  rings();
}
function next(){if(!waiting)return;waiting=false;render()}
document.addEventListener('keydown',e=>{
  if(waiting&&(e.key===' '||e.key==='Enter')){e.preventDefault();next();return}
  if(waiting)return;
  const k=e.key.toUpperCase();
  const i='1234'.indexOf(e.key)>-1?'1234'.indexOf(e.key):'ABCD'.indexOf(k);
  if(i>-1&&i<curOpts.length)answer(i);
});
document.addEventListener('click',e=>{if(waiting&&!e.target.closest('.ans'))next()});
const sel=document.getElementById('topicSel');
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)});
sel.onchange=()=>{topic=sel.value;buildQueue();render()};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Wipe all drill progress?')){state={};save();buildQueue();render()}};
buildQueue();render();
</script>
</body>
</html>
