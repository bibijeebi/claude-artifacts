<script>
const MCQS=[
["What is the effect of a company's accounting department maintaining high ethical standards?", ["The company's accounting information will increase in value.", "The company can hire fewer accountants to do the same amount of work.", "The company's accounting information will decrease in value.", "The company can report more favorable results in its financial statements."], 0, "Ethical accounting = trustworthy data = investors/lenders/regulators rely on it = info is MORE valuable. Ethics doesn't reduce workload or manipulate results — those are red flags.", "Intro & Ethics", 1],
["Why might employees be interested in their company's financial accounting information?", ["Financial statement data provide item-by-item product cost information.", "Financial statement data provide detailed internal budget information.", "Financial statement data are often used in determining employee bonuses.", "Financial statement data are used to record long term liabilities."], 2, "Employees care because bonuses and profit-sharing tie directly to financial performance. Product costs and internal budgets are managerial accounting (private), not financial statements.", "Intro & Ethics", 1],
["Which group establishes financial accounting rules in the United States?", ["Financial Accounting Standards Board (FASB)", "International Accounting Standards Board (IASB)", "American Institute of Certified Public Accountants (AICPA)", "Internal Revenue Service (IRS)"], 0, "FASB = US GAAP rules. IASB = international (IFRS). AICPA = profession organization, doesn't set rules. IRS = tax rules only.", "Intro & Ethics", 1],
["Which report is one of the three primary financial statements?", ["Statement of the accounting cycle", "Statement of stakeholder funds", "Statement of cash flows", "Statement of management accounting"], 2, "The Big 3: Income Statement, Balance Sheet, Statement of Cash Flows. (Statement of Retained Earnings is sometimes counted as a 4th.)", "Financial Statements", 1],
["A company paid $5,000 cash in advertising costs. How does this transaction affect the paying company's accounting equation?", ["Assets increase by $5,000; expenses increase by $5,000.", "Assets decrease by $5,000; liabilities increase by $5,000.", "Assets decrease by $5,000; owner equity decreases by $5,000.", "Assets decrease by $5,000; revenues increase by $5,000."], 2, "Cash out = assets down. Advertising is an expense → expenses reduce profit → profit reduces equity. So assets DOWN $5k, equity DOWN $5k. Equation stays balanced.", "Equation & Entries", 1],
["What is a transaction?", ["Two parties exchanging something of value", "A type of commonly used accounting software", "A category of merchandiser or retailer", "An example of an online business document"], 0, "A transaction = any exchange of value between two parties. Buying, selling, borrowing, paying — all transactions.", "Equation & Entries", 1],
["A company borrowed $80,000 cash from a bank. How does this transaction affect the accounting equation of the borrowing company?", ["Assets increase by $80,000; liabilities increase by $80,000.", "Assets increase by $80,000; owners' equity increases by $80,000.", "Assets increase by $80,000; liabilities decrease by $80,000.", "Assets increase by $80,000; revenues increase by $80,000."], 0, "Cash comes in (asset UP) and you owe the bank (liability UP). Borrowing doesn't earn revenue — it creates debt. Equation: +$80k Assets = +$80k Liabilities + $0 Equity.", "Equation & Entries", 1],
["What is the impact of expenses on the accounting equation?", ["Expenses increase liabilities.", "Expenses decrease owners' equity.", "Expenses decrease liabilities.", "Expenses increase owners' equity."], 1, "Expenses reduce profit → profit flows to retained earnings → retained earnings is part of equity. So expenses DECREASE equity.", "Equation & Entries", 1],
["Which type of account are accounts payable and notes payable both examples of?", ["Liability", "Asset", "Expense", "Equity"], 0, "'Payable' = you OWE someone. All payables are liabilities. Accounts payable = owe suppliers. Notes payable = owe lenders.", "Equation & Entries", 1],
["What is the purpose of the financial accounting cycle?", ["To collect confidential information for management to use as a competitive tool", "To gather information related to the expenses and income generated by a company", "To turn information about transactions into financial statements", "To produce and analyze a company's monthly bank statement"], 2, "The accounting cycle = the workflow that converts raw transactions into the big three financial statements. That's its whole job.", "Financial Statements", 1],
["According to the accounting equation, the amount of liabilities and equity must always be equal to another amount. What is that other amount?", ["The sum of revenues and expenses", "Assets", "Cash", "The sum of expenses and dividends"], 1, "The accounting equation: Assets = Liabilities + Equity. So L + E = Assets. Always. Every balance sheet.", "Equation & Entries", 1],
["Which item is an expense item?", ["Loans payable", "Cost of goods sold", "Accounts receivable", "Accounts payable"], 1, "COGS = expense (income statement). Payables = liabilities (balance sheet). Receivables = assets (balance sheet).", "Financial Statements", 1],
["How is gross profit computed?", ["Sales minus cost of goods sold", "Total assets minus total liabilities", "Accounts receivable minus accounts payable", "Total revenues minus total expenses"], 0, "Gross Profit = Sales − COGS. It's the first profit line on the income statement. Net income is Revenues − ALL expenses (the bottom line, different concept).", "Financial Statements", 1],
["Which type of account is retained earnings?", ["Revenue", "Liability", "Equity", "Asset"], 2, "Retained earnings = profits the company kept (didn't pay out as dividends). It's a component of EQUITY on the balance sheet.", "Equation & Entries", 1],
["For purposes of cash flow classification in the statement of cash flows, which item is an operating activity?", ["Buying equipment", "Paying employees", "Distributing dividends", "Selling bonds"], 1, "CFS has 3 sections: Operating (day-to-day: paying employees, paying suppliers, receiving from customers), Investing (buying/selling long-term assets like equipment), Financing (stocks, bonds, dividends, loans).", "Financial Statements", 1],
["How does a classified balance sheet provide useful information to a decision maker?", ["It distinguishes between current and long-term assets.", "It distinguishes liabilities from expenses.", "It provides data that are not publicly disclosed.", "It provides data for a period of time instead of as a point in time."], 0, "'Classified' balance sheet means assets/liabilities are grouped into CURRENT (≤1 year) and LONG-TERM (>1 year). Helps users see liquidity at a glance.", "Financial Statements", 1],
["What information does a balance sheet provide to a decision maker?", ["Summary of the operating performance of a company during a period", "Summary of the cash flows of a company during a period", "Summary of the operating performance of a company at a particular date", "Summary of the financial position of a company at a particular date"], 3, "Balance sheet = SNAPSHOT at a single date (Dec 31, etc.). Shows financial position: what you own, owe, and equity. Income statement and cash flows cover a PERIOD.", "Financial Statements", 1],
["What is an account payable?", ["The amount owed to a company that sold goods or services to a customer on credit", "The amount to be paid by a company in repayment of both loans and dividends", "The amount to be paid by a company for dividends to shareholders", "The amount owed by a company that purchased goods or services from a supplier on credit"], 3, "Accounts PAYABLE = what YOU owe suppliers (credit purchases). Accounts RECEIVABLE = what customers owe YOU. Trap answer A is receivable.", "Equation & Entries", 1],
["What is an example of a financial cost that would result from poor direct labor budgeting and planning?", ["Delayed cash collections from credit customers", "Increased depreciation costs for facilities", "Increased hiring, training, and overtime costs", "Excessive inventory storage costs"], 2, "Poor labor planning → emergency hiring, rushed training, paying overtime. Those are direct consequences of not forecasting workforce needs right.", "Budgeting & Cash Flow", 1],
["What does a manager have control over in a cost center?", ["Revenues", "Assets", "Costs", "Dividends"], 2, "4 responsibility centers: Cost (costs only), Revenue (revenues only), Profit (both), Investment (profit + assets). The name tells you what's controlled.", "Managerial Accounting", 1],
["What should be considered when developing a measure to evaluate the performance of a manager?", ["Only indirect costs", "Only controllable costs", "Only noncontrollable costs", "Only centralized costs"], 1, "Cardinal rule of performance evaluation: only hold managers accountable for what they can CONTROL. Judging them on uncontrollable costs is unfair and demotivating.", "Managerial Accounting", 1],
["In some companies, the performance measures for profit center managers are heavily influenced by cost allocations downward from organizational units (such as company headquarters). Why is this a mistake?", ["Revenues should not be included in the performance evaluation measure of a profit center manager.", "Direct costs should not be included in the performance evaluation measure of a profit center manager.", "Controllable costs should not be included in the performance evaluation measure of a profit center manager.", "Uncontrollable costs should not be included in the performance evaluation measure of a profit center manager."], 3, "HQ allocations (rent, exec salaries) are UNCONTROLLABLE by division managers. Including them in performance measures punishes managers for things they can't change.", "Managerial Accounting", 1],
["Which budget should include the expected cost of supplies used by the office staff of the corporate headquarters?", ["Production budget", "Sales budget", "Administrative expense budget", "Direct materials budget"], 2, "HQ office supplies = admin expense (period cost). Production/materials budgets are for manufacturing. Sales budget = revenue forecast.", "Budgeting & Cash Flow", 1],
["Which items are uncontrollable, external variables that make it difficult to forecast the level of sales?", ["Direct labor and advertising expenditures", "Selling price and sales effort", "Customer tastes and economic conditions", "Inventory level and product management"], 2, "Customer tastes and the economy are OUTSIDE the company's control. Pricing, advertising, labor, inventory are INTERNAL variables the company controls.", "Budgeting & Cash Flow", 1],
["What is the correct sequence of budgets in a manufacturing business?", ["Direct materials, sales, production", "Sales, production, direct materials", "Sales, direct materials, production", "Production, direct materials, sales"], 1, "Master budget flow: SALES first (how much will we sell?) → PRODUCTION (how much do we make?) → DIRECT MATERIALS (what do we buy to make it?). Sales drives everything.", "Budgeting & Cash Flow", 1],
["Which type of business organization has a major focus on direct materials, direct labor, and overhead?", ["Retail", "Manufacturing", "Service", "Merchandising"], 1, "DM + DL + MOH = the 3 MANUFACTURING product costs. Retail/merchandising buy finished goods. Service has no physical product.", "Managerial Accounting", 1],
["What are the three primary functions that company managers use managerial accounting information for?", ["Borrowing, repaying, and lending", "Reporting, allowing, and negotiating", "Operating, investing, and financing", "Planning, controlling, and evaluating"], 3, "PCE: Planning (budgets), Controlling (vs actual), Evaluating (performance). Operating/investing/financing are CFS categories, different concept.", "Managerial Accounting", 1],
["What is the proper accounting for a product cost?", ["Record as a financing cash flow", "Record immediately as an expense", "Record as an inventory cost until the item is sold", "Record as a liability on the balance sheet"], 2, "Product costs (DM + DL + MOH) = capitalized as INVENTORY (asset) until the product is sold, then flow to COGS. Period costs expense immediately.", "Cost Classification", 1],
["How could a period cost be reported in an income statement?", ["As cost of goods manufactured", "As cost of goods sold", "As an administrative expense", "As manufacturing overhead"], 2, "Period costs = Selling + Administrative. They show up as S&A expenses on the income statement, never touched inventory. COGS and COGM are product cost concepts.", "Cost Classification", 1],
["A retail company purchased inventory costing $100,000. By the end of the year, inventory costing $75,000 had been sold. How is the remaining $25,000 in inventory reported in the financial statements?", ["As an asset in the balance sheet", "As manufacturing overhead in the income statement", "As an administrative expense in the income statement", "As a liability in the balance sheet"], 0, "Unsold inventory = ASSET on balance sheet (current asset). Only the $75k sold becomes COGS. This is why product costs are inventoriable — they sit as an asset until sold.", "Financial Statements", 1],
["How are the wages of cashiers classified in a merchandising company?", ["Cost of goods sold", "Manufacturing overhead", "Work-in-process inventory", "Selling expense"], 3, "Cashiers = point-of-sale staff = SELLING expense (period cost). Merchandising has no manufacturing, no WIP. COGS is the cost of goods, not the people who sell them.", "Cost Classification", 1],
["How are wages of office staff in a company headquarters building classified?", ["Direct labor", "Indirect labor", "Manufacturing overhead", "Administrative expense"], 3, "HQ office staff = ADMIN expense (period cost, not tied to production). Direct/indirect labor and MOH are all manufacturing concepts — HQ is not in the factory.", "Cost Classification", 1],
["Which label is given to the cost of the wood used in the construction of a piece of wooden furniture?", ["Direct labor", "Manufacturing overhead", "Selling and administrative", "Direct materials"], 3, "Wood = primary input physically in the furniture = DIRECT MATERIALS. If it can be traced directly to the product in measurable amounts, it's DM.", "Cost Classification", 1],
["Which label is given to the cost of electricity in a furniture factory?", ["Direct labor", "Manufacturing overhead", "Administrative expenses", "Direct materials"], 1, "Factory electricity = supports production but not traceable to a specific product = MANUFACTURING OVERHEAD (indirect). If it were HQ electricity, it'd be admin expense.", "Cost Classification", 1],
["What is the sequence of the flow of costs through a manufacturing operation?", ["Raw materials, work-in-process, finished goods, cost of goods sold", "Finished goods, cost of goods sold, raw materials, work-in-process", "Cost of goods sold, raw materials, work-in-process, finished goods", "Work-in-process, raw materials, finished goods, cost of goods sold"], 0, "Flow: RM → WIP → FG → COGS. Buy materials, start making them (WIP), finish them (FG), sell them (COGS). MEMORIZE THIS ORDER.", "Costing Methods", 1],
["What is the CVP equation?", ["Sales - fixed costs - administrative costs = profit", "Sales - cost of goods sold - fixed costs = profit", "Sales - variable costs - overhead costs = profit", "Sales - variable costs - fixed costs = profit"], 3, "CVP (Cost-Volume-Profit): Sales − Variable Costs − Fixed Costs = Profit. The core managerial accounting equation. Everything else derives from this.", "CVP & Break-Even", 1],
["Which cost category is not formally tracked in a company's accounting system?", ["Direct costs", "Indirect costs", "Out-of-pocket costs", "Opportunity costs"], 3, "Opportunity costs = value of the road NOT taken. Real but never recorded. Direct, indirect, and out-of-pocket are all actually spent dollars that hit the books.", "Cost Classification", 1],
["A company reports: Total sales revenue = $250,000. Number of units sold = 50,000 units. Variable costs = $100,000. If the company is operating at its break-even point, what is the company's total contribution margin?", ["$200,000", "$50,000", "$100,000", "$150,000"], 3, "CM = Sales − Variable Costs = $250,000 − $100,000 = $150,000. At break-even, CM EQUALS Fixed Costs (so Fixed Costs also = $150k). CM itself is just Sales − VC.", "CVP & Break-Even", 1],
["A company reports: Price per unit = $25. Variable costs per unit = $15. Fixed costs = $15,000. Given these data, what is the variable cost ratio?", ["60%", "50%", "40%", "20%"], 0, "VC Ratio = Variable Cost per unit ÷ Price per unit = $15 ÷ $25 = 60%. CM Ratio would be the other 40%. Fixed costs are irrelevant to this ratio.", "CVP & Break-Even", 1],
["Why is the concept of relevant range important to a manager?", ["Inside the relevant range, the total fixed cost can change.", "Inside the relevant range, the variable cost per unit can increase.", "Outside the relevant range, the variable cost per unit can change.", "Outside the relevant range, the variable cost per unit stays constant."], 2, "Relevant range = the activity level where cost behavior assumptions HOLD. INSIDE: fixed costs stay fixed, variable costs per unit stay constant. OUTSIDE: all bets off (bulk discounts, new machinery needed, etc.).", "CVP & Break-Even", 1],
["Which statement correctly describes applied manufacturing overhead?", ["The total manufacturing costs other than direct materials", "The amount of manufacturing overhead that is assigned to each employee", "The total manufacturing costs other than direct labor", "The amount of manufacturing overhead that is assigned to the goods produced"], 3, "APPLIED overhead = the MOH charged to products using the predetermined rate. It's what lands on the goods produced, not on employees or totals.", "Costing Methods", 1],
["What is the label given to the quantity computed as estimated overhead costs divided by estimated level of activity?", ["Underapplied overhead rate", "Predetermined overhead rate", "Forecasted overhead rate", "Indirect overhead rate"], 1, "Predetermined Overhead Rate = Estimated MOH ÷ Estimated Activity (like machine hours or labor hours). Set at start of year, used to apply MOH. Under/over-applied happens when actual differs from applied.", "Costing Methods", 1],
["In a job order costing system, what is the proper accounting for a product cost?", ["It is reported as a part of general expenses.", "It is reported as a part of administrative expenses.", "It is reported as a part of cost of goods sold.", "It is reported as an expense when it occurs."], 2, "Product costs in any system (job order, process, ABC) flow through inventory → COGS when sold. They are NEVER expensed immediately and NEVER part of general/admin expenses.", "Costing Methods", 1],
["Which item is a period cost?", ["Wages for factory quality control inspectors", "Rent on factory robotic equipment in an airplane manufacturer", "Wages of maintenance workers in the factory building", "Utility bills to heat the headquarters building"], 3, "HQ utilities = period cost (admin). Anything with 'factory' in the description = product cost (MOH). QC inspectors, factory equipment rent, factory maintenance are all MOH.", "Cost Classification", 1],
["Which statement is true with respect to activity-based costing (ABC) systems?", ["Implementing an ABC system requires only a careful calculation of total direct labor hours.", "Implementing an ABC system requires very little analysis of the factors that create overhead costs.", "An ABC system allocates overhead based on multiple activities.", "An ABC system completely eliminates all overhead costs."], 2, "ABC uses MULTIPLE cost drivers (setups, inspections, machine hours, etc.) instead of one blunt rate. It requires DETAILED analysis. It doesn't eliminate overhead — it allocates it more accurately.", "Costing Methods", 1],
["How is overhead allocated in an ABC system?", ["Cost pool multiplied by number of cost driver events", "Activity rate multiplied by number of cost driver events", "Budgeted overhead multiplied by expected number of direct labor hours", "Sum of materials and labor cost multiplied by number of units"], 1, "ABC formula: Activity Rate × # of Cost Driver Events. Activity Rate = cost pool ÷ total driver events. Then applied per product/job by multiplying times the events consumed.", "Costing Methods", 1],
["In an ABC system, which name is given to a numerical measure reflecting the amount of a cost associated with a particular overhead cost activity?", ["Cost system", "Cost driver", "Cost metric", "Cost pool"], 3, "Cost POOL = the dollar amount grouped by activity (e.g., 'setup costs = $50,000'). Cost DRIVER = what causes it (e.g., 'number of setups'). Don't swap them.", "Costing Methods", 1],
["How are production costs treated in a process costing system?", ["Costs are accumulated by process and averaged over all products made during the period.", "Costs are assigned to a selling, general, and administrative expense account during the period.", "Costs are assigned to the actual manufacturing overhead account during the period.", "Costs are assigned to specific jobs or products made during the period."], 0, "Process costing = mass production (cereal, gasoline). Accumulate costs by PROCESS (mixing, bottling), average over all units. Job order assigns to specific jobs.", "Costing Methods", 1],
["How is the production cost per unit computed in a process costing system?", ["Amount of direct labor cost divided by the number of direct labor hours used during a particular period of time", "Amount of overhead cost divided by the number of units completed during a particular period of time", "Amount of direct materials cost divided by the quantity of direct materials used during a particular period of time", "Amount of total production cost divided by the number of units completed during a particular period of time"], 3, "Process cost per unit = TOTAL PRODUCTION COSTS ÷ UNITS COMPLETED. Simple average across all identical units. The other options use partial numerators — wrong.", "Costing Methods", 1],

const LS = "d196drill_v1";
const C=22*2*Math.PI;
let queue=[], cur=0, curOpts=[], waiting=false, picked=new Set(), filter="", waitAt=0;
let mode=localStorage.getItem("d196drill_mode")||"core";
const $=s=>document.getElementById(s);
let state=load();

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(Array.isArray(s)){while(s.length<MCQS.length)s.push({c:0,seen:false});return s.slice(0,MCQS.length);}}catch(e){}return MCQS.map(()=>({c:0,seen:false}));}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function isMulti(i){return Array.isArray(MCQS[i][2])}
function corrSet(i){return new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]])}

function idxs(){return MCQS.map((_,i)=>i).filter(i=>(mode==="full"||MCQS[i][5]===1)&&(!filter||MCQS[i][4]===filter))}
function rebuild(){queue=idxs().filter(i=>state[i].c<2);if(queue.length)shuffle(queue);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function rings(){
  const pool=idxs();const seen=pool.filter(i=>state[i].seen).length;
  const apt=pool.reduce((s,i)=>s+Math.min(state[i].c,2)/2,0)/(pool.length||1);
  const sp=pool.length?seen/pool.length:0;
  $("seenR").style.strokeDashoffset=C*(1-sp);$("seenN").textContent=Math.round(sp*100)+"%";
  $("aptR").style.strokeDashoffset=C*(1-apt);$("aptN").textContent=Math.round(apt*100)+"%";
  const mastered=pool.filter(i=>state[i].c>=2).length;
  $("count").textContent=mastered+" / "+pool.length+" mastered";
}

function render(){
  rings();
  if(!queue.length){
    const pool=idxs();
    $("stage").innerHTML='<div class="done"><h2>'+(pool.every(i=>state[i].c>=2)?"Pool mastered ✓":"Nothing left in queue")+'</h2><p>Every question answered correctly twice.</p><button class="btn" id="again">Study again</button></div>';
    SND.win();
    $("again").onclick=()=>{idxs().forEach(i=>state[i].c=0);save();rebuild();render()};return;
  }
  cur=queue[0];waiting=false;picked=new Set();
  const m=MCQS[cur],multi=isMulti(cur);
  curOpts=m[1].map((t,oi)=>({oi,text:t}));shuffle(curOpts);
  let h='<div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="opts">';
  curOpts.forEach((o,d)=>{h+='<button class="ans" data-disp="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  h+='</div>';
  if(multi)h+='<button class="chk" id="chk" disabled>Check</button>';
  h+='<div class="explain" id="exp"></div><div class="cont" id="cont">tap or press space to continue</div>';
  $("stage").innerHTML=h;
  [...document.querySelectorAll("#opts .ans")].forEach(b=>b.onclick=()=>pick(+b.dataset.disp));
  if(multi)$("chk").onclick=submit;
}

function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,t0,dur,type,vol){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02)}
function ok(mastered){streak++;if(muted)return;var s=Math.min(streak,12),b=660*Math.pow(2,(s-1)/24);tone(b,0,.09);tone(b*1.5,.07,.12);if(mastered){tone(1318.5,.16,.1,"triangle",.09);tone(1760,.24,.14,"triangle",.09)}if(streak%5===0){tone(b*2,.2,.18,"sine",.08)}}
function no(){streak=0;if(muted)return;tone(196,0,.16,"triangle",.08);tone(147,.09,.2,"triangle",.08)}
function win(){if(muted||!ctx)return;[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*.11,.22,"sine",.1)});tone(1318.5,.5,.4,"triangle",.08)}
function toggle(){muted=!muted;localStorage.setItem("drillSnd",muted?"0":"1");return muted}
return{ok:ok,no:no,win:win,toggle:toggle,muted:function(){return muted}}
})();
(function(){var a=document.getElementById("sndBtn");if(!a)return;function r(){a.textContent=SND.muted()?"\uD83D\uDD07 sound":"\uD83D\uDD0A sound"}a.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();SND.toggle();r()});r()})();

function pick(d){
  if(waiting)return;
  if(isMulti(cur)){
    const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');
    if(picked.has(d)){picked.delete(d);b.classList.remove("sel")}else{picked.add(d);b.classList.add("sel")}
    $("chk").disabled=picked.size===0;return;
  }
  picked=new Set([d]);submit();
}

function submit(){
  if(waiting)return;waiting=true;waitAt=Date.now();
  const m=MCQS[cur],cs=corrSet(cur);
  const chosen=new Set([...picked].map(d=>curOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#opts .ans").forEach(b=>{
    const oi=curOpts[+b.dataset.disp].oi;b.style.pointerEvents="none";
    if(cs.has(oi))b.classList.add("correct");
    else if(chosen.has(oi))b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(isMulti(cur))$("chk").style.display="none";
  state[cur].seen=true;
  if(ok)state[cur].c++;else state[cur].c=0;
  if(ok)SND.ok(state[cur].c>=2);else SND.no();
  save();
  const e=$("exp");e.className="explain show "+(ok?"ok":"no");
  e.innerHTML="<b>"+(ok?"Correct.":"Not quite.")+"</b> "+esc(m[3]);
  // requeue
  queue.shift();
  if(ok&&state[cur].c>=2){/* retire */}
  else{const off=ok?Math.min(10,queue.length):Math.min(3,queue.length);queue.splice(off,0,cur)}
  rings();
  if(ok){$("cont").classList.remove("show");setTimeout(()=>{if(waiting)next()},460)}
  else $("cont").classList.add("show");
}

function next(){if(waiting){waiting=false;render()}}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

document.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){if(waiting){e.preventDefault();next()}return}
  const n="1234".indexOf(e.key),a="abcd".indexOf(e.key.toLowerCase());
  const d=n>=0?n:a;if(d>=0){const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');if(b)pick(d)}
});
$("stage").addEventListener("click",()=>{if(waiting&&Date.now()-waitAt>250)next()});

// topic dropdown
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("topic").appendChild(o)});
$("topic").onchange=()=>{filter=$("topic").value;rebuild();render()};
$("reset").onclick=()=>{if(confirm("Wipe all drill progress?")){state=MCQS.map(()=>({c:0,seen:false}));save();rebuild();render()}};

function setMode(m){mode=m;localStorage.setItem("d196drill_mode",m);$("mCore").classList.toggle("on",m==="core");$("mFull").classList.toggle("on",m==="full");rebuild();render()}
$("mCore").onclick=()=>setMode("core");$("mFull").onclick=()=>setMode("full");
setMode(mode);

document.addEventListener("click", function(e){
  if(!waiting) return;
  if(Date.now()-waitAt<250) return;
  var t=e.target;
  if(t.closest && t.closest("select,a,#themeBtn,.seg,.reset")) return;
  next();
});
</script>
<button id="themeBtn" class="themeb" aria-label="toggle theme">☾</button>
<script>
(function(){
  var K="drill_theme", btn=document.getElementById("themeBtn");
  var qp=null; try{qp=new URLSearchParams(location.search).get("theme");}catch(e){}
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  var t=qp||saved||"light";
  function apply(x){document.documentElement.setAttribute("data-theme",x);btn.textContent=x==="dark"?"\u2600":"\u263e";}
  apply(t);
  btn.addEventListener("click",function(){t=(t==="dark")?"light":"dark";try{localStorage.setItem(K,t)}catch(e){}apply(t);});
})();
</script>
</body></html>
