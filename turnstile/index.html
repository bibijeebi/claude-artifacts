<style>
:root{
  --bg:#0d0d0f; --surface:#17171a; --text:#ffffff; --text2:#9a9aa2; --hair:#2a2a2e;
  --w1:#00933c; --w2:#ee352e; --brass:#c9a227; --brass2:#8a6d1d;
  --font:-apple-system,"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;
}
html.light{ --bg:#f5f2ea; --surface:#ffffff; --text:#111111; --text2:#55555c; --hair:#d8d4c8; }
html{background:var(--bg);}
html,body{overflow-x:hidden;margin:0;padding:0;}
body{
  background:transparent; color:var(--text); font-family:var(--font);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
}
#app{max-width:430px;margin:0 auto;padding:12px 16px 32px;}
button{font-family:var(--font);color:var(--text);background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.game{user-select:none;-webkit-user-select:none;}
.caps{text-transform:uppercase;letter-spacing:.06em;}
.tnum{font-variant-numeric:tabular-nums;}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 18px;border:1px solid var(--hair);border-radius:999px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);}
.pill:active{border-color:var(--line,var(--text2));transform:scale(.97);}
.pill.primary{background:var(--line);border-color:var(--line);color:#fff;}
.hidden{display:none !important;}

/* header */
header{display:flex;align-items:center;gap:12px;padding:10px 0 4px;}
.logo{width:44px;height:44px;border-radius:10px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:26px;font-weight:600;}
.wordmark{font-size:22px;font-weight:700;letter-spacing:.08em;}
.tagline{font-size:10px;letter-spacing:.14em;color:var(--text2);margin-top:2px;}
header .spacer{flex:1;}
#themeBtn{width:44px;height:44px;border:1px solid var(--hair);border-radius:50%;font-size:18px;background:var(--surface);}

/* route map */
.world{margin-top:26px;}
.world.w1{--line:var(--w1);} .world.w2{--line:var(--w2);}
.lineHead{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--hair);}
.lineBadge{width:30px;height:30px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;flex:none;}
.lineName{font-size:15px;font-weight:700;}
.lineSub{font-size:11px;color:var(--text2);letter-spacing:.1em;margin-left:auto;text-transform:uppercase;}
.stations{list-style:none;margin:0;padding:6px 0 0;position:relative;}
.stations::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:4px;background:var(--line);border-radius:2px;}
.station{position:relative;}
.station button{display:flex;align-items:center;width:100%;min-height:56px;padding:6px 4px 6px 40px;text-align:left;gap:8px;}
.station button:active .stName{color:var(--line);}
.dot{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--line);z-index:1;}
.station.solved .dot{background:var(--line);}
.station.current .dot{animation:pulse 1.6s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--line) 60%,transparent);}70%{box-shadow:0 0 0 9px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.stMain{flex:1;min-width:0;}
.stName{display:block;font-size:14px;font-weight:600;letter-spacing:.06em;}
.stSeq{display:block;font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tokens{display:flex;gap:4px;flex:none;}
.token{width:13px;height:13px;border-radius:50%;border:1px solid var(--hair);}
.token.got{border:none;background:radial-gradient(circle at 35% 30%,#e8cd62,var(--brass) 55%,var(--brass2));}
.mapFoot{display:flex;gap:10px;justify-content:center;margin-top:34px;}
.ver{color:var(--text2);font-size:10px;text-align:center;letter-spacing:.1em;margin-top:14px;}

/* play screen */
#screen-play.w1{--line:var(--w1);} #screen-play.w2{--line:var(--w2);}
.playBar{display:flex;align-items:center;gap:8px;padding:8px 0 2px;}
.playBar .pill{padding:0 14px;}
.playTitle{flex:1;text-align:center;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.playTitle .ldot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px;}
.stepsRow{text-align:center;color:var(--text2);font-size:12px;letter-spacing:.1em;margin:12px 0 14px;text-transform:uppercase;}
.goalCard{background:var(--surface);border-radius:14px;border-top:3px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:18px 16px 22px;overflow:hidden;}
.goalCard.slideIn{animation:cardIn .14s ease-out;}
@keyframes cardIn{from{transform:translateX(28px);opacity:0;}to{transform:none;opacity:1;}}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;align-items:center;justify-content:center;}
.noFares{color:var(--text2);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.chip{min-height:44px;padding:8px 14px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);font-size:17px;font-weight:500;}
.chip:active{border-color:var(--line);transform:scale(.97);}
.chip.in{animation:chipIn .12s ease-out;}
@keyframes chipIn{from{transform:translateY(-8px);opacity:0;}to{transform:none;opacity:1;}}
.chip.shake,.goalFormula.shake{animation:shake .18s linear;}
@keyframes shake{25%{transform:translateX(-4px);}50%{transform:translateX(4px);}75%{transform:translateX(-3px);}}
.gcRule{border:none;border-top:1px solid var(--hair);margin:16px 0;}
.goalRow{text-align:center;}
.turnstileSym{font-size:26px;color:var(--text2);margin-right:10px;vertical-align:baseline;}
.goalFormula{font-size:28px;font-weight:500;min-height:44px;padding:4px 10px;border:1px solid transparent;border-radius:10px;display:inline-block;}
.goalFormula.tappable{border-color:var(--hair);}
.goalFormula:active{border-color:var(--line);transform:scale(.97);}
.conn{color:var(--line);padding:0 .08em;}
.advisory{display:flex;align-items:center;gap:10px;background:var(--surface);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;letter-spacing:.08em;color:var(--text2);text-transform:uppercase;line-height:1.6;}
.advisory .advTag{color:var(--line);font-weight:700;flex:none;}
.advisory button{margin-left:auto;flex:none;min-width:44px;min-height:44px;border:1px solid var(--hair);border-radius:999px;font-size:11px;letter-spacing:.06em;background:var(--bg);color:var(--text);}

.boardWrap{background:var(--surface);border:1px solid var(--hair);border-radius:14px;margin-bottom:12px;padding:8px 4px;max-height:38vh;overflow:auto;-webkit-overflow-scrolling:touch;}
.boardWrap svg{display:block;margin:0 auto;}
.bEdge{stroke:var(--line);stroke-width:4;stroke-linecap:round;}
.bEdgeLbl{font-size:9.5px;fill:var(--text2);paint-order:stroke;stroke:var(--surface);stroke-width:3px;}
.bLbl{font-size:12px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:3px;}
.bNode.closed .bLbl{fill:var(--text2);font-weight:400;}
.bDot{fill:var(--surface);stroke:var(--line);stroke-width:3;}
.bNode.passed .bDot{fill:var(--line);}
.bNode.closed .bDot{fill:var(--brass);stroke:var(--brass2);stroke-width:2;}
.bRing{fill:none;stroke:var(--line);opacity:0;}
.bNode.active .bRing{animation:ringPulse 1.6s ease-out infinite;}
@keyframes ringPulse{0%{r:9px;opacity:.7;stroke-width:3;}100%{r:19px;opacity:0;stroke-width:1;}}
.bTap{fill:transparent;}
.bNode.open{cursor:pointer;}
.bNew{animation:bIn .15s ease-out;}
@keyframes bIn{from{opacity:0;}}
.preview{display:flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.5;}
.preview.bad{border-color:var(--hair);}
.pvName{color:var(--line);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;flex:none;}
.preview.bad .pvName{color:var(--text2);}
.pvHint{margin-left:auto;flex:none;color:var(--text2);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding-left:8px;}
.chip.armed,.goalFormula.armed{border-color:var(--line);}

/* victory */
#screen-win.w1{--line:var(--w1);} #screen-win.w2{--line:var(--w2);}
.placard{background:var(--surface);border-top:8px solid var(--line);border-bottom:8px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center;padding:30px 16px 26px;margin-top:18px;}
.placard.stamp{animation:stamp .08s ease-out;}
@keyframes stamp{from{transform:scale(1.15);}to{transform:scale(1);}}
.notice{font-size:10px;letter-spacing:.3em;color:var(--text2);text-transform:uppercase;}
.qed{font-size:72px;font-weight:800;letter-spacing:.04em;margin:6px 0 2px;}
.winStation{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;}
.winStats{color:var(--text2);font-size:13px;letter-spacing:.1em;margin-top:10px;text-transform:uppercase;}
.bigTokens{display:flex;gap:10px;justify-content:center;margin-top:14px;}
.bigToken{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;font-size:14px;color:transparent;}
.bigToken.got{border:none;background:radial-gradient(circle at 35% 30%,#e8cd62,var(--brass) 55%,var(--brass2));color:var(--brass2);font-weight:700;}
.treeWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:18px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);}
.treeWrap svg{display:block;margin:0 auto;}
.winBtns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

/* dialog */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10;padding:20px;}
.dlgCard{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:380px;}
.dlgCard h3{margin:0 0 10px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;}
.dlgCard textarea{width:100%;box-sizing:border-box;height:110px;background:var(--bg);color:var(--text);border:1px solid var(--hair);border-radius:8px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;}
.dlgBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
.dlgMsg{font-size:12px;color:var(--text2);margin-top:8px;min-height:14px;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
</style>

    <div class="goalCard" id="goalCard">
      <div class="chips" id="chips"></div>

      <div class="goalRow">
        <span class="turnstileSym">⊢</span><button class="goalFormula" id="goalFormula"></button>
      </div>

  </section>

  <section id="screen-win" class="hidden">

</div>
<div id="dlg" class="hidden">
  <div class="dlgCard">
    <h3 id="dlgTitle"></h3>
    <textarea id="dlgText" spellcheck="false"></textarea>

    <div class="dlgBtns">
      <button class="pill" id="dlgClose">Close</button>
      <button class="pill" id="dlgAction"></button>
    </div>
  </div>
</div>

<script>// Turnstile core: G4ip (Dyckhoff contraction-free LJT), fragment: atoms, ∧, →
'use strict';

// ---- formulas ----
const atom = n => ({ t: 'a', n });
const and = (l, r) => ({ t: '&', l, r });
const imp = (l, r) => ({ t: '>', l, r });

function fkey(f) {
  if (f.t === 'a') return f.n;
  return '(' + fkey(f.l) + f.t + fkey(f.r) + ')';
}
const feq = (a, b) => fkey(a) === fkey(b);

// parser: atoms = single token letters/emoji ids, & binds tighter than >, > right-assoc
// accepts ∧ for & and → for >
function parse(src) {
  const s = src.replace(/∧/g, '&').replace(/→/g, '>').replace(/\s+/g, '');
  let i = 0;
  function prim() {
    if (s[i] === '(') { i++; const f = impExpr(); if (s[i] !== ')') throw new Error('expected ) in ' + src); i++; return f; }
    const m = /^[A-Za-z][A-Za-z0-9]*/.exec(s.slice(i));
    if (!m) throw new Error('bad atom at ' + i + ' in ' + src);
    i += m[0].length;
    return atom(m[0]);
  }
  function andExpr() { let f = prim(); while (s[i] === '&') { i++; f = and(f, prim()); } return f; }
  function impExpr() { const f = andExpr(); if (s[i] === '>') { i++; return imp(f, impExpr()); } return f; }
  const f = impExpr();
  if (i !== s.length) throw new Error('trailing junk in ' + src);
  return f;
}

// sequent: { hyps: [formula...], goal: formula }  (hyps is a multiset; array order = display order)
function seqKey(sq) {
  return sq.hyps.map(fkey).sort().join('|') + '⊢' + fkey(sq.goal);
}
const withHyps = (hyps, goal) => ({ hyps, goal });
function replaceHyp(hyps, i, ...subs) {
  const h = hyps.slice();
  h.splice(i, 1, ...subs);
  return h;
}

// ---- moves ----
// enumerate legal rule applications at a sequent.
// tap: {kind:'goal'} or {kind:'hyp', i}
// returns [{rule, tap, principal, prems:[seq...]}]
function moves(sq) {
  const out = [];
  const { hyps, goal } = sq;
  const gk = fkey(goal);
  for (let i = 0; i < hyps.length; i++) {
    const h = hyps[i];
    if (fkey(h) === gk) {
      // trap 5: identical chip always closes as axiom, no other effect offered on it
      out.push({ rule: 'ax', tap: { kind: 'hyp', i }, principal: gk, prems: [] });
      continue;
    }
    if (h.t === '&') {
      out.push({ rule: 'andL', tap: { kind: 'hyp', i }, principal: fkey(h), prems: [withHyps(replaceHyp(hyps, i, h.l, h.r), goal)] });
    } else if (h.t === '>') {
      const A = h.l, B = h.r;
      if (A.t === 'a') {
        // →L case 1: requires the atom present in Γ (trap 1)
        if (hyps.some((x, j) => j !== i && x.t === 'a' && x.n === A.n)) {
          out.push({ rule: 'impL1', tap: { kind: 'hyp', i }, principal: fkey(h), prems: [withHyps(replaceHyp(hyps, i, B), goal)] });
        }
      } else if (A.t === '&') {
        // →L case 2: (C∧D)→B  ⇒  C→(D→B), in place
        out.push({ rule: 'impL2', tap: { kind: 'hyp', i }, principal: fkey(h), prems: [withHyps(replaceHyp(hyps, i, imp(A.l, imp(A.r, B))), goal)] });
      } else if (A.t === '>') {
        // →L case 4: (C→D)→B ⇒ [Γ, D→B ⊢ C→D]  and  [Γ, B ⊢ G]  (trap 2: chip replaced in both)
        out.push({
          rule: 'impL4', tap: { kind: 'hyp', i }, principal: fkey(h), prems: [
            withHyps(replaceHyp(hyps, i, imp(A.r, B)), imp(A.l, A.r)),
            withHyps(replaceHyp(hyps, i, B), goal),
          ]
        });
      }
      // A.t === '|' would be case 3; v2 slot in this dispatch
    }
  }
  if (goal.t === '&') {
    out.push({ rule: 'andR', tap: { kind: 'goal' }, principal: gk, prems: [withHyps(hyps, goal.l), withHyps(hyps, goal.r)] });
  } else if (goal.t === '>') {
    out.push({ rule: 'impR', tap: { kind: 'goal' }, principal: gk, prems: [withHyps(hyps.concat([goal.l]), goal.r)] });
  }
  return out;
}

// ---- decider: exact minimal proof (par) via memoized recursion ----
// termination: every premise strictly smaller in Dyckhoff's multiset weight ordering,
// so plain recursion terminates with no loop check.
// cost convention: every tap = 1 step (axiom taps included); par = total taps.
function solve(sq, memo) {
  memo = memo || new Map();
  const key = seqKey(sq);
  if (memo.has(key)) return memo.get(key);
  let best = null;
  for (const mv of moves(sq)) {
    if (mv.rule === 'ax') { best = { cost: 1, rule: 'ax', principal: mv.principal, prems: [] }; break; }
  }
  if (!best) {
    for (const mv of moves(sq)) {
      let cost = 1;
      const prems = [];
      let ok = true;
      for (const p of mv.prems) {
        const sub = solve(p, memo);
        if (!sub) { ok = false; break; }
        cost += sub.cost;
        prems.push(sub);
      }
      if (ok && (!best || cost < best.cost)) best = { cost, rule: mv.rule, principal: mv.principal, prems };
    }
  }
  memo.set(key, best);
  return best;
}

function decide(sq) {
  const proof = solve(sq);
  return proof ? { provable: true, par: proof.cost, minimalProof: proof } : { provable: false, par: null, minimalProof: null };
}

// ---- structural validator: checks a derivation tree is a legal G4ip derivation ----
// node: { seq, rule, principalKey, children:[node...] }  (as built by the checker)
function multisetEq(a, b) {
  if (a.length !== b.length) return false;
  const ka = a.map(fkey).sort(), kb = b.map(fkey).sort();
  return ka.every((k, i) => k === kb[i]);
}
function validate(node) {
  if (!node.rule) return false;
  const legal = moves(node.seq).filter(m => m.rule === node.rule && m.principal === node.principalKey);
  for (const mv of legal) {
    if (mv.prems.length !== node.children.length) continue;
    let match = true;
    for (let i = 0; i < mv.prems.length; i++) {
      const p = mv.prems[i], c = node.children[i].seq;
      if (!multisetEq(p.hyps, c.hyps) || !feq(p.goal, c.goal)) { match = false; break; }
    }
    if (match) return node.children.every(validate);
  }
  return false;
}

// ---- classical truth-table check (soundness oracle: int. provable ⇒ classically valid) ----
function atomsOf(f, s) { s = s || new Set(); if (f.t === 'a') s.add(f.n); else { atomsOf(f.l, s); atomsOf(f.r, s); } return s; }
function evalF(f, v) {
  if (f.t === 'a') return v[f.n];
  if (f.t === '&') return evalF(f.l, v) && evalF(f.r, v);
  return !evalF(f.l, v) || evalF(f.r, v);
}
function classicallyValid(sq) {
  const ats = [...sq.hyps.reduce((s, h) => atomsOf(h, s), atomsOf(sq.goal))];
  for (let m = 0; m < (1 << ats.length); m++) {

    ats.forEach((a, i) => v[a] = !!(m & (1 << i)));

const G4 = { atom, and, imp, parse, fkey, feq, seqKey, withHyps, moves, solve, decide, validate, multisetEq, classicallyValid };

<script>// Turnstile interactive checker: one rule per tap, goal queue, derivation tree for validation
'use strict';
const G4c = typeof module !== 'undefined' ? require('./core.js') : window.G4;

function newGame(sq) {
  const root = { seq: { hyps: sq.hyps.slice(), goal: sq.goal }, rule: null, principalKey: null, children: [] };
  return { root, queue: [root], steps: 0 };
}

// tap: {kind:'goal'} | {kind:'hyp', i}
// returns {ok, rule, effect} — effect describes what happened for the UI; invalid tap => ok:false, state untouched
function tap(state, action) {
  if (state.queue.length === 0) return { ok: false, reason: 'done' };
  const node = state.queue[0];
  const legal = G4c.moves(node.seq);
  let mv = null;
  if (action.kind === 'goal') {
    mv = legal.find(m => m.tap.kind === 'goal') || null;
  } else {
    if (!Number.isInteger(action.i) || action.i < 0 || action.i >= node.seq.hyps.length) return { ok: false, reason: 'bad index' };
    mv = legal.find(m => m.tap.kind === 'hyp' && m.tap.i === action.i) || null;
  }
  if (!mv) return { ok: false, reason: 'no rule applies' };
  node.rule = mv.rule;
  node.principalKey = mv.principal;
  node.principalF = action.kind === 'hyp' ? node.seq.hyps[action.i] : node.seq.goal;
  node.children = mv.prems.map(p => ({ seq: p, rule: null, principalKey: null, children: [] }));
  state.queue.splice(0, 1, ...node.children);
  state.steps++;
  return { ok: true, rule: mv.rule, children: node.children.length };
}

const won = state => state.queue.length === 0;

// make any open leaf the active goal (pure queue permutation; derivation unaffected)
function select(state, node) {
  const i = state.queue.indexOf(node);
  if (i < 0) return false;
  if (i > 0) { state.queue.splice(i, 1); state.queue.unshift(node); }
  return true;
}

// replay a decider proof tree through the interactive checker; returns {ok, steps}
function proofToTaps(proof) {
  // preorder: at each node emit its tap descriptor {rule, principal}
  const taps = [];
  (function walk(n) { taps.push({ rule: n.rule, principal: n.principal }); n.prems.forEach(walk); })(proof);
  return taps;
}
function replay(sq, proof) {
  const state = newGame(sq);
  for (const t of proofToTaps(proof)) {
    let action;
    if (t.rule === 'andR' || t.rule === 'impR') action = { kind: 'goal' };
    else {
      const i = state.queue[0].seq.hyps.findIndex(h => G4c.fkey(h) === t.principal);
      if (i < 0) return { ok: false, steps: state.steps, reason: 'principal not found: ' + t.principal };
      action = { kind: 'hyp', i };
    }
    const r = tap(state, action);
    if (!r.ok || r.rule !== t.rule) return { ok: false, steps: state.steps, reason: `tap failed (${r.reason || 'rule mismatch ' + r.rule + '≠' + t.rule})` };
  }
  return { ok: won(state), steps: state.steps, state };
}

const CK = { newGame, tap, won, select, replay, proofToTaps };
if (typeof module !== 'undefined') module.exports = CK;
if (typeof window !== 'undefined') window.CK = CK;
</script>

<script>
'use strict';
(function(){
const $ = id => document.getElementById(id);
const EMOJI = { A:'🔑', B:'🚪', C:'🧀' };
// one-time service advisories on levels that introduce a mechanic (controls, not hints)
const TIPS = {
  1: 'Tap the fare card that matches the gate display to preview the move. Tap again to pass.',
  3: 'Tap the gate display: \u2227 forks the line on the board above. Every branch must reach a terminal.',
  5: 'Tap a \u2227 fare card to break it into its two halves.',
  11: 'Hold A? Tap the A\u2192B card to trade it for B. The board logs every trade.',
  13: 'Tap the gate display: the left of the \u2192 boards as a fare card.',
  20: 'A (A\u2227B)\u2192C card curries to A\u2192(B\u2192C) in one move.',
}
const WORLDS = {
  1: { name:'JUNCTION LINE', sym:'∧', cls:'w1', color:'#00933c' },
  2: { name:'EXPRESS LINE', sym:'→', cls:'w2', color:'#ee352e' },
};

// ---- level table with decider pars (pars come from the decider, not the file) ----
const LV = LEVELS.map(l => {
  const sq = G4.withHyps(l.hyps.map(G4.parse), G4.parse(l.goal));
  const d = G4.decide(sq);
  return Object.assign({}, l, { sq, par: d.par, minimalProof: d.minimalProof });
});
const byId = id => LV.find(l => l.id === id);

// ---- progress ----
function loadP(){ try{ const p = JSON.parse(localStorage.getItem('turnstile')||'{}'); return { v:1, levels:(p&&p.levels)||{}, tips:(p&&p.tips)||{} }; }catch(e){ return { v:1, levels:{}, tips:{} }; } }
function saveP(p){ try{ localStorage.setItem('turnstile', JSON.stringify(p)); }catch(e){} }
let P = loadP();

// ---- formula rendering (minimal parens; ∧ tighter than →, ∧ left-assoc, → right-assoc) ----
function fmt(f, emoji, sub){
  if (f.t==='a') return (emoji&&EMOJI[f.n])||f.n;
  const s = fmt(f.l, emoji, true) + (f.t==='&'?'\u2227':'\u2192') + fmt(f.r, emoji, true);
  return sub? '('+s+')' : s;  // LEVELS.md convention: every compound subformula parenthesized
}
function fmtHTML(f, emoji){
  return fmt(f, emoji).replace(/(\u2227|\u2192)/g, '<span class="conn">$1</span>');
}
function fmtText(f, emoji){ return fmt(f, emoji); }
function seqText(sq, emoji){
  return (sq.hyps.length? sq.hyps.map(h=>fmtText(h,emoji)).join(', ')+' ' : '') + '⊢ ' + fmtText(sq.goal, emoji);
}

// ---- theme ----
$('themeBtn').onclick = () => {
  const light = document.documentElement.classList.toggle('light');
  try{ localStorage.setItem('turnstile-theme', light?'light':'dark'); }catch(e){}
  document.querySelector('meta[name=theme-color]').setAttribute('content', light?'#f5f2ea':'#0d0d0f');
};

// ---- screens ----
function show(id){ ['screen-map','screen-play','screen-win'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }

// ---- map ----
function renderMap(){
  const cur = LV.find(l => !(P.levels[l.id]&&P.levels[l.id].stars));
  const wrap = $('worlds'); wrap.innerHTML='';
  for (const w of [1,2]){
    const W = WORLDS[w];
    const sec = document.createElement('section');
    sec.className = 'world '+W.cls;
    sec.innerHTML = '<div class="lineHead"><div class="lineBadge">'+W.sym+'</div><div class="lineName caps">'+W.name+'</div><div class="lineSub">World '+w+'</div></div>';
    const ol = document.createElement('ol'); ol.className='stations';
    for (const l of LV.filter(x=>x.world===w)){
      const pr = P.levels[l.id];
      const li = document.createElement('li');
      li.className = 'station'+(pr&&pr.stars?' solved':'')+(cur&&cur.id===l.id?' current':'');
      const stars = pr?pr.stars:0;
      li.innerHTML = '<button data-id="'+l.id+'"><span class="dot"></span>'+
        '<span class="stMain"><span class="stName caps">'+String(l.id).padStart(2,'0')+' · '+l.name+'</span>'+
        '<span class="stSeq">'+seqText(l.sq, l.emoji)+'</span></span>'+
        '<span class="tokens">'+[1,2,3].map(i=>'<span class="token'+(i<=stars?' got':'')+'"></span>').join('')+'</span></button>';
      li.querySelector('button').onclick = () => openLevel(l.id);
      ol.appendChild(li);
    }
    sec.appendChild(ol);
    wrap.appendChild(sec);
  }
}

// ---- play ----
let cur = null, armed = null, lastKids = [];
const RULES = {
  ax:    { name: 'GATE MATCH' },
  andR:  { name: 'JUNCTION' },
  impR:  { name: 'BOARDING' },
  andL:  { name: 'SPLIT FARE' },
  impL1: { name: 'MODUS PONENS' },
  impL2: { name: 'CURRY' },
  impL4: { name: 'DOUBLE TRANSFER' },
};
function describe(mv, seq, em){
  const F = f => fmt(f, em);
  const g = seq.goal;
  const chip = mv.tap.kind === 'hyp' ? seq.hyps[mv.tap.i] : null;
  switch (mv.rule) {
    case 'ax':    return { name: RULES.ax.name, text: F(g) + ' matches the display. Gate opens.' };
    case 'andR':  return { name: RULES.andR.name, text: 'line forks: prove ' + F(g.l) + ', then prove ' + F(g.r) + '.' };
    case 'impR':  return { name: RULES.impR.name, text: F(g.l) + ' boards your fare cards; display becomes ' + F(g.r) + '.' };
    case 'andL':  return { name: RULES.andL.name, text: F(chip) + ' breaks into ' + F(chip.l) + ' and ' + F(chip.r) + '.' };
    case 'impL1': return { name: RULES.impL1.name, text: 'you hold ' + F(chip.l) + ', so ' + F(chip) + ' trades for ' + F(chip.r) + '.' };
    case 'impL2': return { name: RULES.impL2.name, text: F(chip) + ' rewrites to ' + F(G4.imp(chip.l.l, G4.imp(chip.l.r, chip.r))) + '.' };
    case 'impL4': return { name: RULES.impL4.name, text: 'forks: prove ' + F(chip.l) + ' holding ' + F(G4.imp(chip.l.r, chip.r)) + '; then carry on with ' + F(chip.r) + '.' };
  }
}
function explainInvalid(kind, i, seq, em){
  const F = f => fmt(f, em);
  if (kind === 'goal') return { name: 'ATOMIC DISPLAY', text: 'nothing to apply here. Find the matching fare card.' };
  const h = seq.hyps[i];
  if (h.t === 'a') return { name: 'NO MATCH', text: F(h) + ' does not match the display.' };
  if (h.t === '>' && h.l.t === 'a') return { name: 'NO ENTRY', text: 'you do not hold ' + F(h.l) + ' yet.' };
  return { name: 'NO MOVE', text: 'no rule applies to this card right now.' };
}
function edgeLabel(parent, idx, em){
  const F = f => fmt(f, em);
  const P = parent.principalF;
  switch (parent.rule) {
    case 'impR':  return '+' + F(parent.seq.goal.l);
    case 'andL':  return F(P) + ' \u25b8 ' + F(P.l) + ', ' + F(P.r);
    case 'impL1': return F(P) + ' \u25b8 ' + F(P.r);
    case 'impL2': return '\u25b8 ' + F(G4.imp(P.l.l, G4.imp(P.l.r, P.r)));
    case 'impL4': return idx === 0 ? 'holding ' + F(G4.imp(P.l.r, P.r)) : '\u25b8 ' + F(P.r);
    default: return '';
  }
}
function openLevel(id){
  const l = byId(id);
  cur = { level: l, state: CK.newGame(l.sq) };
  armed = null; lastKids = [];
  $('screen-play').className = WORLDS[l.world].cls;
  $('screen-win').className = 'hidden ' + WORLDS[l.world].cls;
  $('playName').textContent = l.name;
  const tip = TIPS[l.id];
  $('advisory').classList.toggle('hidden', !(tip && !P.tips[l.id]));
  if (tip) $('advText').textContent = tip;
  show('screen-play');
  hidePreview();
  renderPlay(false);
}
$('advOk').onclick = () => { P.tips[cur.level.id] = true; saveP(P); $('advisory').classList.add('hidden'); };
$('backBtn').onclick = () => { armed = null; renderMap(); show('screen-map'); };
$('resetBtn').onclick = () => { cur.state = CK.newGame(cur.level.sq); armed = null; lastKids = []; hidePreview(); renderPlay(true); };

function showPreview(d, bad){
  $('pvName').textContent = d.name;
  $('pvText').textContent = d.text;
  $('pvHint').textContent = bad ? 'no move' : 'tap again';
  const pv = $('preview');
  pv.classList.toggle('bad', !!bad);
  pv.classList.remove('hidden');
}
function hidePreview(){ $('preview').classList.add('hidden'); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function renderBoard(){
  const st = cur.state, em = cur.level.emoji;
  const ROW = 62, GAPX = 26, PAD = 16;
  function build(n){
    const label = fmt(n.seq.goal, em);
    const lw = measurer(label) + 10;
    const kids = n.children.map(build);
    const span = kids.length ? kids.reduce((s, k) => s + k.w, 0) + GAPX * (kids.length - 1) : 0;
    return { n, label, lw, kids, w: Math.max(lw, span, 44), d: kids.length ? 1 + Math.max(...kids.map(k => k.d)) : 0 };
  }
  const t = build(st.root);
  const W = t.w + PAD * 2, H = t.d * ROW + 58 + PAD;
  const E = [], N = [];
  function place(b, x, depth){
    const y = PAD + 10 + depth * ROW;
    let cx;
    if (b.kids.length){
      const span = b.kids.reduce((s, k) => s + k.w, 0) + GAPX * (b.kids.length - 1);
      let kx = x + (b.w - span) / 2;
      const cs = [];
      for (const k of b.kids){ cs.push(place(k, kx, depth + 1)); kx += k.w + GAPX; }
      cx = (cs[0] + cs[cs.length - 1]) / 2;
      b.kids.forEach((k, idx) => E.push({ x1: cx, y1: y, x2: k.cx, y2: k.cy, lbl: edgeLabel(b.n, idx, em), nw: lastKids.includes(k.n) }));
    } else cx = x + b.w / 2;
    b.cx = cx; b.cy = y;
    N.push(b);
    return cx;
  }
  place(t, PAD, 0);
  const parts = [];
  for (const e of E){
    parts.push('<line class="bEdge' + (e.nw ? ' bNew' : '') + '" x1="' + e.x1.toFixed(1) + '" y1="' + (e.y1 + 4) + '" x2="' + e.x2.toFixed(1) + '" y2="' + (e.y2 - 4) + '"/>');
    if (e.lbl){
      const mx = (e.x1 + e.x2) / 2, my = e.y1 + (e.y2 - e.y1) * 0.66;
      parts.push('<text class="bEdgeLbl" x="' + mx.toFixed(1) + '" y="' + (my + 3).toFixed(1) + '" text-anchor="middle">' + esc(e.lbl) + '</text>');
    }
  }
  N.forEach((b, bi) => {
    const n = b.n;
    const status = n.rule === null ? (st.queue[0] === n ? 'open active' : 'open') : (n.rule === 'ax' ? 'closed' : 'passed');
    const nw = lastKids.includes(n) ? ' bNew' : '';
    parts.push('<g class="bNode ' + status + nw + '" data-bi="' + bi + '">' +
      '<circle class="bRing" cx="' + b.cx.toFixed(1) + '" cy="' + b.cy + '" r="9"/>' +
      '<circle class="bDot" cx="' + b.cx.toFixed(1) + '" cy="' + b.cy + '" r="' + (status === 'passed' ? 5.5 : 8) + '"/>' +
      '<text class="bLbl" x="' + b.cx.toFixed(1) + '" y="' + (b.cy + 24) + '" text-anchor="middle">' + esc(b.label) + '</text>' +
      (n.rule === null ? '<circle class="bTap" cx="' + b.cx.toFixed(1) + '" cy="' + b.cy + '" r="24"/>' : '') +
      '</g>');
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', Math.min(W, 366));
  svg.setAttribute('font-family', getComputedStyle(document.body).fontFamily);
  svg.innerHTML = parts.join('');
  svg.querySelectorAll('.bNode.open').forEach(g => {
    g.addEventListener('click', () => {
      const b = N[+g.dataset.bi];
      if (CK.select(cur.state, b.n)){ armed = null; hidePreview(); renderPlay(true); }
    });
  });
  const wrap = $('boardWrap');
  wrap.innerHTML = '';
  wrap.appendChild(svg);
}
function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function renderPlay(cardIn){
  const st = cur.state, l = cur.level;
  $('stepsRow').textContent = 'MOVES ' + st.steps + ' \u00b7 PAR ' + l.par;
  renderBoard();
  const card = $('goalCard');
  if (cardIn){ card.classList.remove('slideIn'); void card.offsetWidth; card.classList.add('slideIn'); }
  const node = st.queue[0];
  const chips = $('chips'); chips.innerHTML = '';
  if (!node) return;
  if (node.seq.hyps.length === 0){
    chips.innerHTML = '<span class="noFares">no fare cards</span>';
  } else node.seq.hyps.forEach((h, i) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = fmtHTML(h, l.emoji);
    b.onclick = () => tapTarget('hyp', i, b);
    chips.appendChild(b);
  });
  const gf = $('goalFormula');
  gf.innerHTML = fmtHTML(node.seq.goal, l.emoji);
  gf.classList.toggle('tappable', true);
  gf.classList.remove('armed');
}
function tapTarget(kind, i, el){
  const node = cur.state.queue[0];
  if (!node) return;
  const key = kind + ':' + i;
  if (armed === key){
    armed = null;
    hidePreview();
    const r = CK.tap(cur.state, kind === 'goal' ? { kind: 'goal' } : { kind: 'hyp', i });
    if (!r.ok){ shake(el); return; }
    lastKids = node.children.slice();
    if (CK.won(cur.state)){
      $('stepsRow').textContent = 'MOVES ' + cur.state.steps + ' \u00b7 PAR ' + cur.level.par;
      renderBoard();
      record(cur);
      const f = cur;
      const instant = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(() => { if (cur === f) showWin(f); }, instant ? 0 : 450);
      return;
    }
    renderPlay(r.children === 0);
    if (r.children > 0) $('chips').querySelectorAll('.chip').forEach(c => c.classList.add('in'));
    return;
  }
  document.querySelectorAll('.armed').forEach(e => e.classList.remove('armed'));
  const legal = G4.moves(node.seq);
  const mv = kind === 'goal' ? legal.find(m => m.tap.kind === 'goal') : legal.find(m => m.tap.kind === 'hyp' && m.tap.i === i);
  if (mv){
    armed = key;
    el.classList.add('armed');
    showPreview(describe(mv, node.seq, cur.level.emoji), false);
  } else {
    armed = null;
    shake(el);
    showPreview(explainInvalid(kind, i, node.seq, cur.level.emoji), true);
  }
}
$('goalFormula').onclick = function(){ tapTarget('goal', -1, this); };

// ---- win ----
function stars(steps, par){ return steps<=par?3 : steps<=par+2?2 : 1; }
function record(f){
  const l = f.level, steps = f.state.steps, s = stars(steps, l.par);
  const pr = P.levels[l.id]||{stars:0,best:Infinity};
  P.levels[l.id] = { stars: Math.max(pr.stars, s), best: Math.min(pr.best===undefined?Infinity:pr.best, steps) };
  if (TIPS[l.id]) P.tips[l.id] = true;
  saveP(P);
}
function showWin(f){
  cur = f;
  const l = f.level, steps = f.state.steps, s = stars(steps, l.par);
  $('winStation').textContent = String(l.id).padStart(2,'0')+' · '+l.name;
  $('winStats').textContent = 'STEPS '+steps+' · PAR '+l.par;
  $('bigTokens').innerHTML = [1,2,3].map(i=>'<span class="bigToken'+(i<=s?' got':'')+'">⊢</span>').join('');
  $('treeWrap').innerHTML = '';
  $('treeWrap').appendChild(gentzenSVG(cur.state.root, WORLDS[l.world].color, l.emoji));
  $('nextBtn').classList.toggle('hidden', l.id===LV.length);
  $('screen-win').className = WORLDS[l.world].cls;
  show('screen-win');
  const pl = $('placard'); pl.classList.remove('stamp'); void pl.offsetWidth; pl.classList.add('stamp');
}
$('nextBtn').onclick = () => openLevel(cur.level.id+1);
$('winMapBtn').onclick = () => { renderMap(); show('screen-map'); };
$('saveSvgBtn').onclick = () => {
  const svg = $('treeWrap').querySelector('svg').cloneNode(true);
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const blob = new Blob([svg.outerHTML], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'turnstile-'+cur.level.id+'-'+cur.level.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
};

// ---- Gentzen tree SVG ----
const measurer = (()=>{ const c=document.createElement('canvas').getContext('2d'); return t=>{ c.font='13px '+getComputedStyle(document.body).fontFamily; return c.measureText(t).width; }; })();
function gentzenSVG(root, lineColor, emoji){
  const light = document.documentElement.classList.contains('light');
  const ink = light? '#111111' : '#ffffff';
  const paper = light? '#ffffff' : '#17171a';
  const ROW = 42, GAP = 26, PADX = 18, PADY = 16;
  function build(n){
    const text = seqText(n.seq, emoji);
    const tw = measurer(text)+8;
    const kids = n.children.map(build);
    const span = kids.length? kids.reduce((s,k)=>s+k.w,0) + GAP*(kids.length-1) : 0;
    return { n, text, tw, kids, w: Math.max(tw, span), depth: kids.length? 1+Math.max(...kids.map(k=>k.depth)) : 0 };
  }
  const t = build(root);
  const H = (t.depth+1)*ROW + PADY*2;
  const W = t.w + PADX*2;
  const parts = [];
  function draw(b, x, level){
    const y = H - PADY - level*ROW - 8;
    let cx;
    if (b.kids.length){
      const span = b.kids.reduce((s,k)=>s+k.w,0) + GAP*(b.kids.length-1);
      let kx = x + (b.w-span)/2;
      const centers = [];
      for (const k of b.kids){ centers.push(draw(k, kx, level+1)); kx += k.w + GAP; }
      cx = (centers[0]+centers[centers.length-1])/2;
    } else cx = x + b.w/2;
    // inference bar above the text (axiom leaves get a bar too)
    const barW = b.kids.length ? Math.max(b.tw, b.kids.reduce((s,k)=>s+k.tw,0) + GAP*(b.kids.length-1)) : b.tw;
    parts.push('<line x1="'+(cx-barW/2).toFixed(1)+'" y1="'+(y-16)+'" x2="'+(cx+barW/2).toFixed(1)+'" y2="'+(y-16)+'" stroke="'+ink+'" stroke-opacity="0.55" stroke-width="1"/>');
    const fill = level===0? lineColor : ink;
    const weight = level===0? '600':'400';
    parts.push('<text x="'+cx.toFixed(1)+'" y="'+y+'" text-anchor="middle" font-size="13" font-weight="'+weight+'" fill="'+fill+'">'+b.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text>');
    return cx;
  }
  draw(t, PADX, 0);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width', Math.min(W, 398));
  svg.setAttribute('font-family', getComputedStyle(document.body).fontFamily);
  svg.innerHTML = '<rect width="'+W+'" height="'+H+'" fill="'+paper+'"/>' + parts.join('');
  return svg;
}

// ---- export / import ----
function dialog(title, mode){
  $('dlgTitle').textContent = title;
  $('dlgMsg').textContent = '';
  const ta = $('dlgText'), act = $('dlgAction');
  if (mode==='export'){
    ta.value = btoa(JSON.stringify(P));
    ta.readOnly = true;
    act.textContent = 'Copy';
    act.onclick = () => { ta.select(); ta.setSelectionRange(0, 99999);
      (navigator.clipboard? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(
        ()=> $('dlgMsg').textContent='Copied.',
        ()=> { document.execCommand('copy'); $('dlgMsg').textContent='Copied (fallback).'; });
    };
  } else {
    ta.value=''; ta.readOnly=false;
    act.textContent = 'Load';
    act.onclick = () => {
      try {
        const p = JSON.parse(atob(ta.value.trim()));
        if (!p || typeof p.levels!=='object') throw 0;
        P = { v:1, levels:p.levels, tips:p.tips||{} }; saveP(P); renderMap();
        $('dlgMsg').textContent = 'Progress loaded.';
      } catch(e){ $('dlgMsg').textContent = 'Bad blob. Paste the exact export string.'; }
    };
  }
  $('dlg').classList.remove('hidden');
}
$('exportBtn').onclick = () => dialog('Export progress','export');
$('importBtn').onclick = () => dialog('Import progress','import');
$('dlgClose').onclick = () => $('dlg').classList.add('hidden');

// ---- test hook: replay decider's minimal proof through the live UI ----
window.__replay = function(levelId){
  const l = byId(levelId);
  if (!l) return { ok:false, reason:'no level' };
  openLevel(levelId);
  const taps = CK.proofToTaps(l.minimalProof);
  for (const t of taps){
    let el;
    if (t.rule === 'andR' || t.rule === 'impR'){ el = $('goalFormula'); }
    else {
      const node = cur.state.queue[0];
      const i = node.seq.hyps.findIndex(h => G4.fkey(h) === t.principal);
      if (i < 0) return { ok:false, steps:cur.state.steps, reason:'principal missing' };
      el = $('chips').children[i];
    }
    if (!el || el.tagName !== 'BUTTON') return { ok:false, steps:cur.state.steps, reason:'no tap target' };
    el.click();  // arm (preview)
    el.click();  // commit
  }
  const done = cur.state.queue.length === 0;
  return { ok:done, steps:cur.state.steps, par:l.par, stars: done ? stars(cur.state.steps, l.par) : 0 };
};
window.__progressKey = 'turnstile';

// ---- boot ----
renderMap();
show('screen-map');
if ('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
