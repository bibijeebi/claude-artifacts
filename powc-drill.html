<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="POWC Drill">

<title>POWC Drill</title>
<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#2b3238;--dim:#7a8590;--teal:#159fc9;--green:#43a047;--red:#e23b3b;--line:#dde3e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:640px;margin:0 auto}
.head{background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.head h1{font-size:17px;line-height:1.2}
.head .sub{font-size:12px;color:var(--dim)}
.rings{margin-left:auto;display:flex;gap:10px}
.ring{width:52px;text-align:center;font-size:10px;color:var(--dim)}
.ring svg{display:block;margin:0 auto 2px}
.ring .val{font-weight:700;font-size:11px;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.reset{font-size:12px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none}
.card{background:var(--panel);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtopic{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px}
.qtext{font-size:16.5px;line-height:1.45;margin-bottom:14px}
.ans{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;line-height:1.4;margin-bottom:8px;cursor:pointer;color:var(--ink)}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{font-weight:700;color:var(--dim);flex:none}
.ans.correct{border-color:var(--green);background:#eef7ee}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.reveal{border-color:var(--green)}
.ans:disabled{cursor:default}
.explain{display:none;margin-top:10px;border-left:3px solid var(--red);background:#fdf3f3;padding:10px 12px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
.explain b{color:var(--green)}
.explain .cont{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.meta{margin-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.done{background:var(--panel);border-radius:10px;padding:30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.done h2{color:var(--green);margin-bottom:8px}
.done p{color:var(--dim);font-size:14px;margin-bottom:16px}
.done button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>POWC Drill</h1>
      <div class="sub">Inclusive Classrooms · 186 questions, mastered twice each</div>
    </div>
    <div class="rings">
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="seenArc" cx="22" cy="22" r="19" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="seenVal">0%</span>Seen</div>
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="aptArc" cx="22" cy="22" r="19" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="aptVal">0%</span>Apt</div>
    </div>
  </div>
  <div class="bar">
    <select id="topicSel"><option value="">All topics</option></select>
    <button class="reset" id="resetBtn">reset</button>

  <div id="stage"></div>
</div>
<script>
const MCQS=[
["What does an individualized education program (IEP) mean according to the Individuals with Disabilities Education Act (IDEA)?", ["An outline of educational goals and support services must be provided for each student with a disability.", "Funding should be provided to states and school districts to support English learners in achieving English proficiency and academic success.", "Students with disabilities must be able to access educational services tailored to their individual needs without incurring personal costs.", "Individuals with disabilities are protected against discrimination in any program or activity that receives federal financial assistance."], 0, "IEP = the written outline of goals + services for each student with a disability. FAPE is the no-cost one; 504 is the anti-discrimination one; the EL-funding one is Title III.", "IDEA"],
["What must be included as a key component of a student's individualized education program (IEP)?", ["Duration of services", "Past report cards", "Team participant signatures", "Demographic data"], 0, "Duration of services is one of the 9 IEP parts (with start dates, frequency, location). Signatures, report cards, demographics aren't listed parts.", "IDEA"],
["A student, for a short time, is in a hospital program that has unique capabilities required by the IEP. What is the name of the least restrictive environment (LRE) in this scenario?", ["Specialized outside program", "General education with support", "Partial mainstream/inclusion", "Special education class"], 0, "Hospital, residential, private school = specialized program OUTSIDE the district. It's the most restrictive rung of the LRE ladder.", "IDEA"],
["What is a general education teacher responsible for under the Individuals with Disabilities Education Act (IDEA) when teaching a student with a disability?", ["Communicate regularly and effectively with the student and their family", "Attend district-wide trainings about special education", "Decide which paraprofessionals need to be in the classroom", "Determine when to pull the student out of the classroom for extra assistance"], 0, "Gen ed AND sped teachers must communicate regularly and effectively with the student and family. Deciding paras/pull-outs isn't the gen ed teacher's call.", "IDEA"],
["What is a general education teacher responsible for under the Individuals with Disabilities Education Act (IDEA) when teaching a student with a disability?", ["Work with the special education teacher to supervise the paraprofessional's classroom activities", "Organize the annual IEP meeting with the parents and the special education teacher", "Approve the lesson plans that are developed by the special education teacher", "Send reports about the student's academic progress at least twice per week"], 0, "Gen ed role list includes working with the sped teacher to supervise the paraprofessional's classroom activities. The sped teacher organizes IEP meetings, not gen ed.", "IDEA"],
["What is one of the responsibilities of the special education teacher that is described by the Individuals with Disabilities Education Act (IDEA)?", ["Cultivate partnerships with families and be involved in educational decision-making processes", "Create daily lesson plans that are adjusted versions of the general education classroom plans", "Continue communicating with families on job placements once the student has graduated", "Work with coaches and administrators to ensure equal access to the school's athletic program"], 0, "CEC standard: cultivate partnerships with families and be involved in educational decision making.", "IDEA"],
["What does the Individuals with Disabilities Education Act (IDEA) require of special education teachers?", ["Avoid any actions that may harm individuals with exceptionalities and adhere to professional ethics and standards", "Adjust the least restrictive environment (LRE) for students based on real-time academic data", "Train general education teachers on the legal requirements of working with students with disabilities", "Create daily lesson plans that are adjusted versions of the general education classroom plans"], 0, "CEC standard: do no harm, follow professional ethics and standards. Training gen ed teachers on law and adjusting LRE aren't sped-teacher duties.", "IDEA"],
["What is a special education teacher responsible for under the Individuals with Disabilities Education Act (IDEA)?", ["Demonstrate professionalism by maintaining high competence and integrity while supporting students and their families", "Develop district policies and processes to locate, identify, and evaluate all children with disabilities", "Ensure that students with disabilities have access to wraparound services such as transportation and food", "Supervise and evaluate the work of all paraprofessionals who are working with students in their caseload"], 0, "CEC: demonstrate professionalism (competence + integrity). Child Find policy is district-level; para supervision of the whole caseload isn't on the list.", "IDEA"],
["What is a special education teacher responsible for under the Individuals with Disabilities Education Act (IDEA)?", ["Advocate for adequate resources and favorable conditions to improve educational outcomes for students with exceptionalities", "Supervise and evaluate the work of all paraprofessionals who are working with students in their caseload", "Develop district policies and processes to locate, identify, and evaluate all children with disabilities", "Advocate for better working conditions and salaries for special education teachers within the district"], 0, "CEC: advocate for professional conditions and resources that improve outcomes for students with exceptionalities. Salary advocacy is the trap.", "IDEA"],
["What does Section 504 of the Rehabilitation Act ensure for students?", ["Equal access to public education", "Federal funding for modifications", "Adjustments to individual curriculum", "Medical care for physical impairments"], 0, "504 = civil rights law = equal ACCESS. It doesn't adjust curriculum (that's a modification) or pay for medical care.", "Section 504"],
["What is an example of an accommodation provided in educational settings?", ["Graphic organizers", "Alternative projects", "Curriculum simplification", "Tailored content"], 0, "Graphic organizers change HOW material is presented = accommodation. Alternative projects, simplified curriculum, tailored content change WHAT = modifications.", "Section 504"],
["How does Section 504 differ from IDEA?", ["It is funded by state and local governments.", "It guarantees special education and related services.", "It offers protection for 13 specific disabilities.", "It requires an individual education plan."], 0, "504 is funded by state and local sources; IDEA is federally funded. The 13 categories, guaranteed sped services, and the IEP are all IDEA.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Becoming familiar with each student's needs", "Identifying needed modifications to curriculum", "Creating an alternate plan as a backup", "Ordering materials with a simplified format"], 0, "504 strategy #1: know the plan. Familiarize yourself with each student's 504 plan and needs.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Coordinating with others to provide consistent support", "Splitting responsibilities with other educators", "Preparing an isolated learning environment", "Creating assignments for extra practice"], 0, "504 strategy #2: collaborate with colleagues, support staff, admins to provide consistent support.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Implementing specified accommodations proactively", "Accommodating students by creating simplified exams", "Gathering student preferences for accommodations", "Scheduling medication to align with assessments"], 0, "504 strategy #3: implement accommodations proactively and apply them consistently. Gen ed doesn't write simplified exams (modification).", "Section 504"],
["What is one critical strategy for effectively implementing 504 plans?", ["Addressing challenges and changes with flexibility", "Inviting parents to regularly contribute to instruction", "Conducting daily assessments to monitor progress", "Obtaining technology to automate instruction"], 0, "504 strategy #4: monitor and adjust. Be flexible as challenges and needs change.", "Section 504"],
["What is required of general education teachers in the classroom, according to Section 504?", ["Celebrating an environment of inclusivity and diversity", "Assigning peer partners to affected students", "Prioritizing visual instruction methods when possible", "Splitting students into heterogeneous groups"], 0, "504 strategy #5: foster an inclusive environment that celebrates diversity and belonging.", "Section 504"],
["Which strategy is critical for effectively implementing 504 plans?", ["Ensuring that students' rights are protected", "Providing separate and individual instruction", "Designing an alternative grading rubric for projects", "Adjusting the academic calendar to slow instruction"], 0, "504 strategy #6: advocate. Make sure students' needs are met and rights are protected.", "Section 504"],
["What is the name of the federal law that assists English learners in meeting challenging academic standards?", ["Title III of the Elementary and Secondary Education Act", "Title IX of the Education Amendments of 1972", "Title I of the Elementary and Secondary Education Act", "Individuals with Disabilities Education Act (IDEA)"], 0, "Title III (of ESEA) = English learners. Title I = low-income funding; Title IX = sex discrimination; IDEA = disabilities.", "Title III"],
["What is considered a valid expense when using Title III funds to support English learners (ELs)?", ["Professional development for teachers", "Food service for lunch and breakfast", "Childcare for parents during LIEP meetings", "Improved lab equipment for science classes"], 0, "Title III funds PD for teachers of ELs, language instruction programs, upgraded curricula, parent outreach. Not meals, childcare, lab equipment.", "Title III"],
["What is the Home Language Survey (HLS) used for?", ["Helping to determine eligibility for assistance under Title III", "Assessing a student's cultural backgrounds and traditions", "Evaluating a student's proficiency in multiple languages", "Constructing a language instruction educational program (LIEP)"], 0, "Home Language Survey is given at enrollment to flag students who may need language support, i.e. Title III eligibility. It's a screen, not a proficiency test.", "Title III"],
["What are educators expected to do under Title III?", ["Engage with parents of English learners", "Provide English learners with a path to citizenship", "Report suspected child abuse regarding English learners", "Place English learners into an immersive setting"], 0, "Title III purpose #5: promote parent, family, and community engagement.", "Title III"],
["What is one responsibility of educators under Title III?", ["Provide professional development for teachers of English learners", "Assist English learners in college or career placement after graduation", "Provide non-citizens with the resources to obtain citizenship", "Provide English learners with adequate transportation to school"], 0, "Title III purpose #3: enhance educators' capacity through professional development.", "Title III"],
["What is a key strategy used by teachers for meeting the requirements of Title III for English learners (ELs)?", ["Encouraging at-home learning in the student's native language", "Ensuring that the student has basic needs, such as food, met", "Conducting oral assessments in order to simplify the testing process", "Avoiding the use of technology in English language classrooms"], 0, "Family engagement strategy: involve families with translated materials and at-home learning support, including in the home language.", "Title III"],
["What is a key strategy used by teachers for meeting the requirements of Title III for English learners (ELs)?", ["Tailoring lessons and assessments to ELs' varied language proficiency levels", "Simplifying the testing process by using all-oral assessments", "Focusing on grammar drills in isolation from other academic content", "Avoiding the use of technology in English language classrooms"], 0, "Differentiated instruction for ELs: tailor lessons and assessments to each EL's proficiency level.", "Title III"],
["What is a critical strategy used by teachers to meet Title III requirements for instructing English learners (ELs)?", ["Modeling correct language use and providing sentence frames to guide students' responses", "Refraining from using the student's native language to accelerate English acquisition", "Conducting oral assessments in order to simplify the testing process", "Focusing on grammar drills in isolation from other academic content"], 0, "Language modeling: model correct use and give sentence frames. Krashen and the course both say use the home language, don't ban it.", "Title III"],
["What is a critical strategy used by teachers to meet Title III requirements for instructing English learners (ELs)?", ["Simplified language", "Limited grammar", "Extracurricular support", "Oral-only assessments"], 0, "Simplified language = clear, concise, no idioms. One of the 10 EL classroom strategies.", "Title III"],
["What is one of the exceptionalities covered in the Individuals with Disabilities Education Act (IDEA)?", ["Orthopedic impairment", "Intellectual talent", "Behavior challenges", "Artistic giftedness"], 0, "Orthopedic impairment is one of IDEA's 13. Giftedness, talent, and 'behavior challenges' are not categories.", "Exceptionalities"],
["Which accommodation is specifically found in the category of other health impairment?", ["Medication management", "Extra time on assessments", "Mathematical pictures", "Explicit phonics instruction"], 0, "OHI accommodations: individualized healthcare plan, medication management, flexible scheduling, environmental accommodations.", "Exceptionalities"],
["Which condition is classified as a psychiatric disorder?", ["Obsessive-compulsive disorder", "Dyslexia", "Fragile X syndrome", "Attention-deficit/hyperactivity disorder"], 0, "OCD is a psychiatric/mental disorder (with anxiety, depression, ODD, CD, PTSD). ADHD is filed under developmental/OHI; dyslexia is SLD; Fragile X is genetic/developmental.", "Exceptionalities"],
["Which strategy can assist a student with dysgraphia?", ["Developing a range of accommodations for writing tasks", "Allowing for the use of an assistive listening device", "Providing varied opportunities for interactions with peers", "Providing visual representations of mathematical concepts"], 0, "Dysgraphia = writing. Provide accommodations for writing tasks, explicit handwriting/spelling instruction, word processors. Visual math = dyscalculia.", "Exceptionalities"],
["What is Tourette syndrome?", ["A disorder causing uncontrollable twitches and sounds", "A developmental disorder affecting movement and balance", "A developmental disorder that affects a person's social interactions", "A genetic disorder caused by changes in the FMR1 gene"], 0, "Tourette = nervous-system condition with uncontrollable tics (motor + vocal). FMR1 = Fragile X; movement/balance = cerebral palsy; social interaction = ASD.", "Exceptionalities"],
["What is one indication that a student might have a specific learning disability?", ["Having difficulty distinguishing between the directions of right and left", "Struggling to read the board in the front of the classroom", "Demonstrating extreme difficulty standing up from a seated position", "Having difficulty hearing individual voices in a conversation"], 0, "SLD warning signs: right/left confusion, mixing letters/numbers, pattern trouble, organization, remembering what was heard. Board/hearing problems are sensory.", "Exceptionalities"],
["How does the dual language program model help English learners (ELs)?", ["It allows ELs to learn in both English and another language to become bilingual and proficient in both languages across various subjects.", "It uses both the ELs' primary language and English, helping them maintain skills in both while preparing for English-only classes.", "It allows ELs to learn English in English-only classes with help from teachers trained to support EL students.", "It improves ELs' understanding of math and science lessons in English using activities, visuals, and simplified language."], 0, "Dual language = learn in English AND another language to become bilingual/biliterate across subjects. 'Maintain both while moving to English-only' = transitional bilingual.", "ELs & Language"],
["What is the name of the hypothesis from Krashen's theory of second-language acquisition stating that language learners acquire grammatical structures in a predictable sequence?", ["Natural order", "Affective filter", "Input", "Monitor"], 0, "Natural order = grammar acquired in a predictable sequence.", "ELs & Language"],
["Which stage of second-language acquisition will a student enter after moving through the beginning fluency stage?", ["Intermediate fluency", "Pre-production", "Speech emergent", "Advanced fluency"], 0, "Order: pre-production, early production, speech emergent, beginning fluency, INTERMEDIATE fluency, advanced fluency.", "ELs & Language"],
["What is one of the four main principles of culturally responsive teaching, according to Gloria Ladson-Billings?", ["Promoting the importance of cultural competence", "Giving students books representing their culture", "Allowing students to learn in two languages", "Honoring the affective factors in learning"], 0, "Ladson-Billings' 4: shift away from deficit mindset, address implicit bias, promote cultural competence, students valued and empowered.", "CRT & UDL"],
["Which framework focuses on adapting instruction to reflect students' diverse backgrounds and experiences?", ["Culturally responsive teaching", "Krashen's second-language acquisition theory", "Stages of second-language acquisition", "Universal design for learning"], 0, "Reflecting students' backgrounds and experiences = culturally responsive teaching. UDL is about flexible design for learner variability.", "CRT & UDL"],
["Which framework seeks to create an inclusive and affirming learning environment?", ["Culturally responsive teaching", "Krashen's second-language acquisition theory", "Stages of second-language acquisition", "Universal design for learning"], 0, "Inclusive and AFFIRMING environment for cultural identity = culturally responsive teaching.", "CRT & UDL"],
["What characterizes the pre-production stage when a person is learning a second language?", ["The learner absorbs the new language but does not yet speak it.", "The learner first uses speech in social situations with minimal errors.", "The individual begins to speak using short words and sentences.", "Communication becomes common and mostly accurate, especially in social settings."], 0, "Pre-production = silent period. Absorbs, doesn't speak yet. Short words/sentences = early production.", "ELs & Language"],
["What is a common trait of a gifted student?", ["A profound curiosity about diverse subjects", "A struggle to use imaginative thinking", "The holding of others to lower standards", "A preference for work that involves details"], 0, "Gifted traits: profound curiosity across subjects.", "Gifted"],
["What is a common trait of a gifted student?", ["An ability to grasp concepts several grade levels ahead", "A preference for work that involves details and minutiae", "Setting low standards for others' performance", "Struggling with imaginative problem-solving"], 0, "Gifted traits: grasp concepts several grade levels ahead.", "Gifted"],
["What is a common trait of a gifted student?", ["An unconventional sense of humor", "Little emotional depth and sensitivity", "A lack of social consciousness", "An attraction to routine tasks"], 0, "Gifted traits: unconventional sense of humor.", "Gifted"],
["Which trait is commonly exhibited by students with gifts and talents?", ["The ability to absorb information rapidly", "Little to no interest in international issues", "A lack of emotional depth and sensitivity", "A singular approach to learning and problem-solving"], 0, "Gifted traits: absorb information rapidly, fewer repetitions.", "Gifted"],
["Which characteristic is associated with student giftedness?", ["Giftedness is primarily about a brain-based difference.", "Giftedness is solely a matter of genetic inheritance.", "Gifted traits can be seen mostly by academic achievements.", "Giftedness is always apparent through outward success in school."], 0, "Course line: giftedness is a brain-based difference, not grades or outward success, and not purely inherited.", "Gifted"],
["Which of the following represents one of the six guiding principles of the Individuals with Disabilities Education Act (IDEA)?", ["Least restrictive environment", "School choice option", "Universal Design for Learning", "Differentiated instruction"], 0, "IDEA's 6: FAPE, appropriate evaluation, IEP, LRE, parent/student participation, procedural safeguards. UDL and DI are teaching frameworks, not IDEA principles.", "IDEA"],
["The eligibility categories outlined in the Individuals with Disabilities Education Act (IDEA) are exhaustive and cover all possible disabilities.", ["False", "True"], 0, "False. The 13 categories are specific; conditions outside them may still get a 504 plan, which uses a broader disability definition.", "IDEA"],
["What is one key component of an Individualized Education Program (IEP)?", ["Annual goals", "Group activities", "Generalized instruction", "Standardized testing"], 0, "Annual goals are one of the 9 IEP parts.", "IDEA"],
["Which principle of IDEA emphasizes that students with disabilities should be educated alongside their non-disabled peers to the greatest extent possible?", ["Least restrictive environment", "Special education placement", "Separate education model", "Specialized education approach"], 0, "LRE = educated with nondisabled peers to the maximum extent appropriate.", "IDEA"],
["What is the primary goal of an Individualized Education Program (IEP) for a student with a disability?", ["To outline specific goals and services tailored to the individual needs of the student", "To assess a student's general academic achievement", "To designate a student's eligibility for special education services", "To standardize educational practices for all students"], 0, "IEP = specific goals and services tailored to the student. Eligibility is decided by evaluation, not the IEP.", "IDEA"],
["How many categories of disability are recognized under the Individuals with Disabilities Education Act (IDEA)?", ["13", "7", "10", "15"], 0, "13 IDEA eligibility categories.", "IDEA"],
["What does the Least Restrictive Environment (LRE) concept emphasize for students with disabilities?", ["Students with disabilities should be educated with their peers to the greatest extent appropriate.", "Students with disabilities benefit from being in smaller classes with lower student-to-teacher ratios throughout the school day.", "Students with disabilities should be educated in separate, specialized classrooms.", "Students with disabilities should be grouped together in the same classroom to facilitate targeted instruction."], 0, "LRE = with peers to the greatest extent appropriate.", "IDEA"],
["Ms. Johnson, a general education teacher, designs a science experiment that can be conducted by all students. She provides written instructions, a demonstration, and allows students to work in pairs. Which of the six roles and responsibilities of general education teachers required by IDEA is demonstrated in this scenario?", ["Develop lesson plans that facilitate learning and engagement for all students.", "Communicate with students and their families.", "Regularly update the special education teacher on student performance.", "Collaborate with the special education teacher to develop and implement accommodations."], 0, "Designing one activity everyone can do = developing lesson plans that facilitate learning and engagement for ALL students.", "IDEA"],
["Why do special education teachers use evidence, instructional data, research, and professional knowledge to enhance learning outcomes for students with disabilities?", ["To personalize instruction and interventions", "To ensure compliance with federal regulations", "To increase administrative oversight", "To limit the scope of teaching strategies"], 0, "CEC: use evidence, data, research to personalize instruction and interventions.", "IDEA"],
["Ms. Patel, a special education teacher, regularly assesses her students' progress in math and notices that one student has been struggling with the new concepts. She adjusts her teaching approach, provides positive reinforcement, and communicates her observations with the general education teacher to better support the student's learning. Which of the eleven roles and responsibilities of special education teachers required by IDEA is demonstrated in this scenario?", ["Collaborate with colleagues to ensure comprehensive support.", "Contribute actively to professional development.", "Demonstrate professionalism.", "Encourage active involvement and participation."], 0, "Adjusts AND shares observations with the gen ed teacher = collaborate with colleagues to ensure comprehensive support.", "IDEA"],
["What is one of the primary roles of special education teachers in inclusive classrooms according to the Council for Exceptional Children's (CEC) Standards for Professional Practice?", ["To provide effective support for students with disabilities by following research-based practices", "To provide one-on-one instruction to students with disabilities", "To focus primarily on the emotional well-being of students with disabilities while leaving academic instruction to general education teachers", "To prioritize the completion of Individualized Education Program (IEP) paperwork and compliance with administrative tasks"], 0, "CEC Standards: provide effective support by following research-based practices.", "IDEA"],
["The Council for Exceptional Children's Standards for Professional Practice guide the roles and responsibilities of special education teachers.", ["True", "False"], 0, "True. Special educators follow the CEC Standards for Professional Practice.", "IDEA"],
["What is one of the shared responsibilities of both general education teachers and special education teachers under IDEA?", ["Providing accommodations and/or modifications to meet the various needs of students", "Independently developing individualized education plans (IEPs)", "Managing administrative tasks, such as student enrollment", "Leading parent-teacher association (PTA) meetings"], 0, "Shared duty: provide accommodations/modifications to meet student needs.", "IDEA"],
["What is the purpose of implementing a 504 plan?", ["To ensure equal access to education", "To provide specialized instruction", "To limit students' educational opportunities", "To increase classroom competition"], 0, "504 = equal access. Specialized instruction is IEP territory.", "Section 504"],
["What is the primary difference between accommodations and modifications?", ["Accommodations involve changes to how teachers present or assess the material, while modifications include changes to the content or expectations of assignments.", "Accommodations and modifications are synonymous terms and can be used interchangeably.", "Accommodations and modifications both refer to changes made to the curriculum to meet individual student needs, but accommodations are temporary, while modifications are permanent.", "Accommodations refer to changes for students with disabilities, while modifications refer to changes for students without disabilities."], 0, "Accommodations = HOW (presentation, assessment, setting). Modifications = WHAT (content, expectations).", "Section 504"],
["Providing specialized instruction is the primary goal of a 504 plan.", ["False", "True"], 0, "False. 504 goal is equal access via accommodations; specialized instruction is the IEP.", "Section 504"],
["What is the primary purpose of accommodations in a Section 504 plan?", ["To provide accommodations and supports that ensure equal access to education for students with disabilities in the general education setting", "To provide specialized instruction tailored to individual students' needs", "To limit students' educational opportunities", "To increase classroom competition"], 0, "504 accommodations ensure equal access in the general education setting.", "Section 504"],
["Why must educators understand Section 504 plans?", ["To ensure compliance with legal requirements", "To increase classroom competition", "To limit students' educational opportunities", "To avoid collaboration with colleagues and stakeholders"], 0, "Legal compliance. Noncompliance risks legal action and loss of federal funding.", "Section 504"],
["What is one of the responsibilities of educators in implementing Section 504 plans?", ["Fostering an inclusive environment", "Avoiding collaboration with colleagues", "Providing accommodations inconsistently", "Ignoring student progress"], 0, "Foster an inclusive environment is one of the six 504 strategies.", "Section 504"],
["One of the accommodations in a student's 504 plan is extended time on assessments. Ms. Smith provides extended time for quizzes but not for tests. Ms. Smith is providing accommodations consistently.", ["False", "True"], 0, "False. Accommodations must be applied consistently across instruction, assessments, and activities.", "Section 504"],
["What is one way educators can ensure effective implementation of Section 504 plans?", ["By familiarizing themselves with the student's 504 plan", "By avoiding discussions with parents about accommodations", "By providing accommodations when educators see fit", "By excluding students from classroom activities"], 0, "Know the plan: familiarize yourself with each student's 504 plan.", "Section 504"],

const LS_KEY='powcdrill_v1';
let state={};
try{state=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){state={}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function st(i){if(!state[i])state[i]={c:0,hist:[]};return state[i]}

let topic='';
let queue=[],cur=-1,curOpts=[],waiting=false;

function pool(){return MCQS.map((m,i)=>i).filter(i=>!topic||MCQS[i][4]===topic)}
function buildQueue(){
  queue=pool().filter(i=>st(i).c<2);
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}
}
function shuffleOpts(m){
  const o=m[1].map((t,oi)=>({t,oi}));
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  return o;
}
function uniqueWords(correct,others){
  const otherSet=new Set(others.join(' ').toLowerCase().match(/[a-z0-9$%.,']+/g)||[]);
  return correct.split(' ').map(w=>{
    const k=w.toLowerCase();
    return (k.length>2&&!otherSet.has(k))?'<b>'+w+'</b>':w;
  }).join(' ');
}
function rings(){
  const p=pool();
  const seen=p.filter(i=>st(i).hist.length>0).length/(p.length||1);
  const apt=p.reduce((a,i)=>a+Math.min(st(i).c,2)/2,0)/(p.length||1);
  document.getElementById('seenArc').style.strokeDashoffset=119.4*(1-seen);
  document.getElementById('aptArc').style.strokeDashoffset=119.4*(1-apt);
  document.getElementById('seenVal').textContent=Math.round(seen*100)+'%';
  document.getElementById('aptVal').textContent=Math.round(apt*100)+'%';
}
function render(){
  rings();
  const stage=document.getElementById('stage');
  if(!queue.length){
    stage.innerHTML='<div class="done"><h2>Set mastered.</h2><p>Every question in this filter answered correctly twice in a row. Book the OA.</p><button id="againBtn">Study again</button></div>';
    document.getElementById('againBtn').onclick=()=>{pool().forEach(i=>{delete state[i]});save();buildQueue();render()};
    return;
  }
  cur=queue[0];
  const m=MCQS[cur];
  curOpts=shuffleOpts(m);
  const mastered=pool().filter(i=>st(i).c>=2).length;
  stage.innerHTML='<div class="card"><div class="qtopic">'+m[4]+'</div><div class="qtext">'+m[0]+'</div>'+
    curOpts.map((o,d)=>'<button class="ans" data-disp="'+d+'"><span class="ltr">'+'ABCD'[d]+'</span><span class="txt">'+o.t+'</span></button>').join('')+
    '<div class="explain" id="explain"></div>'+
    '<div class="meta"><span>'+mastered+' / '+pool().length+' mastered</span><span>streak: '+st(cur).c+'/2</span></div></div>';
  document.querySelectorAll('#opts .ans, .ans').forEach(b=>b.onclick=()=>answer(+b.dataset.disp));
}
function answer(disp){
  if(waiting)return;
  const m=MCQS[cur],p=st(cur);
  const picked=curOpts[disp],correctDisp=curOpts.findIndex(x=>x.oi===m[2]);
  const ok=picked.oi===m[2];
  p.hist.push(ok?1:0);
  document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.ans');
  if(ok){
    p.c+=1;
    btns[disp].classList.add('correct');
    btns[disp].querySelector('.txt').innerHTML=uniqueWords(picked.t,m[1].filter((_,i)=>i!==m[2]));
    queue.shift();
    if(p.c<2)queue.splice(Math.min(10,queue.length),0,cur);
    save();
    waiting=true;
    setTimeout(()=>{waiting=false;render()},420);
  }else{
    p.c=0;
    btns[disp].classList.add('wrong');
    btns[correctDisp].classList.add('reveal');
    btns[correctDisp].querySelector('.txt').innerHTML=uniqueWords(m[1][m[2]],m[1].filter((_,i)=>i!==m[2]));
    const ex=document.getElementById('explain');
    ex.style.display='block';
    ex.innerHTML=m[3]+'<span class="cont">tap anywhere or press space to continue</span>';
    queue.shift();
    queue.splice(Math.min(3,queue.length),0,cur);
    save();
    waiting=true;
  }
  rings();
}
function next(){if(!waiting)return;waiting=false;render()}
document.addEventListener('keydown',e=>{
  if(waiting&&(e.key===' '||e.key==='Enter')){e.preventDefault();next();return}
  if(waiting)return;
  const k=e.key.toUpperCase();
  const i='1234'.indexOf(e.key)>-1?'1234'.indexOf(e.key):'ABCD'.indexOf(k);
  if(i>-1&&i<curOpts.length)answer(i);
});
document.addEventListener('click',e=>{if(waiting&&!e.target.closest('.ans'))next()});
const sel=document.getElementById('topicSel');
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)});
sel.onchange=()=>{topic=sel.value;buildQueue();render()};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Wipe all drill progress?')){state={};save();buildQueue();render()}};
buildQueue();render();
</script>
