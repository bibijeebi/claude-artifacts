// ── Bradley-Terry MLE ──
function solveBT(comparisons, ids) {
  const pi = {};
  ids.forEach(id => pi[id] = 1.0);
  if (!comparisons.length) return pi;
  const wins = {}, matchups = {};
  ids.forEach(id => { wins[id] = 0; matchups[id] = {}; });
  for (const c of comparisons) {
    if (!matchups[c.a] || !matchups[c.b]) continue;
    matchups[c.a][c.b] = (matchups[c.a][c.b] || 0) + 1;
    matchups[c.b][c.a] = (matchups[c.b][c.a] || 0) + 1;
    if (c.w === "a") wins[c.a] += 1;
    else if (c.w === "b") wins[c.b] += 1;
    else { wins[c.a] += 0.5; wins[c.b] += 0.5; }
  }
  for (let iter = 0; iter < 80; iter++) {
    let maxD = 0;
    const next = {};
    for (const id of ids) {
      let denom = 0;
      for (const j in matchups[id]) denom += matchups[id][j] / (pi[id] + pi[j]);
      next[id] = denom > 0 ? wins[id] / denom : pi[id];
      maxD = Math.max(maxD, Math.abs(next[id] - pi[id]));
    }
    const vals = Object.values(next);
    const avg = vals.reduce((s, v) => s + v, 0) / vals.length;
    for (const k of ids) pi[k] = next[k] / avg;
    if (maxD < 1e-7) break;
  }
  return pi;
}

function btToRating(pi) { return Math.round(1000 + 400 * Math.log10(Math.max(pi, 0.001))); }

// ── Active learning pair picker (top-heavy) ──
function pickPair(gender, voter, comparisons, pi, elimIds) {
  const allPool = NAMES.filter(n => n.g === gender);
  const elim = new Set(elimIds || []);
  const pool = allPool.filter(n => !elim.has(n.id));
  if (pool.length < 2) return pool.length === 2 ? [pool[0], pool[1]] : allPool.length >= 2 ? [allPool[0], allPool[1]] : null;
  const voterCmps = comparisons.filter(c => c.voter === voter);
  const cmpCt = {};
  pool.forEach(n => cmpCt[n.id] = 0);
  const pairCt = {};
  for (const c of voterCmps) {
    cmpCt[c.a] = (cmpCt[c.a] || 0) + 1;
    cmpCt[c.b] = (cmpCt[c.b] || 0) + 1;
    const k = c.a < c.b ? c.a + "|" + c.b : c.b + "|" + c.a;
    pairCt[k] = (pairCt[k] || 0) + 1;
  }
  const totalCmps = voterCmps.filter(c => pool.some(n => n.id === c.a || n.id === c.b)).length;
  const avgCmp = totalCmps > 0 ? (totalCmps * 2) / pool.length : 0;
  // Rank names by pi to compute rank boost
  const ranked = [...pool].sort((a, b) => (pi[b.id] || 1) - (pi[a.id] || 1));
  const rankOf = {};
  ranked.forEach((n, i) => rankOf[n.id] = i);
  const q1 = Math.floor(pool.length * 0.25); // top 25%
  const q2 = Math.floor(pool.length * 0.50); // top 50%
  // Rank boost: top 25% = 1.0, next 25% = 0.5, bottom 50% = 0.1
  const rankBoost = (id) => rankOf[id] < q1 ? 1.0 : rankOf[id] < q2 ? 0.5 : 0.1;
  // In early phase (< 3 avg), use full pool evenly for coverage
  // After that, 80% of picks come from top 50% pool
  let src = pool;
  if (avgCmp >= 3) {
    src = Math.random() < 0.8 ? ranked.slice(0, q2) : pool;
  }
  let best = null, bestScore = -1;
  const tries = Math.min(800, src.length * (src.length - 1) / 2);
  for (let t = 0; t < tries; t++) {
    const i = Math.floor(Math.random() * src.length);
    let j = Math.floor(Math.random() * (src.length - 1));
    if (j >= i) j++;
    const a = src[i], b = src[j];
    const k = a.id < b.id ? a.id + "|" + b.id : b.id + "|" + a.id;
    const played = pairCt[k] || 0;
    const logA = Math.log(Math.max(pi[a.id] || 1, 0.01));
    const logB = Math.log(Math.max(pi[b.id] || 1, 0.01));
    const close = Math.exp(-Math.abs(logA - logB) * 2);
    const need = Math.exp(-Math.min(cmpCt[a.id] || 0, cmpCt[b.id] || 0) * 0.25);
    const novel = played === 0 ? 1.0 : 0.2 / played;
    const rb = (rankBoost(a.id) + rankBoost(b.id)) / 2;
    // Early: coverage-first. Mid: balanced. Late: rank + closeness heavy
    const w = avgCmp < 2 ? [0.2, 0.5, 0.2, 0.1] :
              avgCmp < 5 ? [0.3, 0.2, 0.15, 0.35] :
                           [0.35, 0.1, 0.1, 0.45];
    const score = close * w[0] + need * w[1] + novel * w[2] + rb * w[3] + Math.random() * 0.03;
    if (score > bestScore) { bestScore = score; best = [a, b]; }
  }
  return best || [src[0], src[1]];
}

function recomputeAll(cmps, v) {
  const bPool = NAMES.filter(n => n.g === "b").map(n => n.id);
  const gPool = NAMES.filter(n => n.g === "g").map(n => n.id);
  const bCmps = cmps.filter(c => c.voter === v && bPool.includes(c.a));
  const gCmps = cmps.filter(c => c.voter === v && gPool.includes(c.a));
  const bPi = solveBT(bCmps, bPool);
  const gPi = solveBT(gCmps, gPool);
  const r = {}, allPi = {};
  for (const id of bPool) { r[id] = btToRating(bPi[id]); allPi[id] = bPi[id]; }
  for (const id of gPool) { r[id] = btToRating(gPi[id]); allPi[id] = gPi[id]; }
  return { pi: allPi, ratings: r };
}

            React.createElement("button", { onClick: () => { const ts = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19); const blob = new Blob([expTxt], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "names-export-" + ts + ".json"; a.click(); URL.revokeObjectURL(a.href); }, style: btn(t.accentB, "#fff") }, "Download"),
            React.createElement("button", { onClick: () => setView("import"), style: btn(t.gold, "#000") }, "Import"),
            React.createElement("button", { onClick: reset, style: btn(t.dangerBg, t.dangerFg) }, "Reset All")
          ),
          React.createElement("div", { style: { fontSize: 13, color: t.sub, marginBottom: 8 } }, data.comparisons.length + " total comparisons across all voters"),
          React.createElement("textarea", { value: expTxt, readOnly: true, rows: 16, style: { width: "100%", background: t.inputBg, color: t.fg, border: "1px solid " + t.inputBorder, borderRadius: 10, padding: 14, fontSize: 13, fontFamily: "monospace", resize: "vertical", boxSizing: "border-box", lineHeight: 1.5 } })
        ),

        // ═══ IMPORT ═══
        view === "import" && React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 14, color: t.sub, marginBottom: 12 } }, "Upload an export JSON file (supports both BT and old ELO format):"),
          React.createElement("input", { type: "file", accept: ".json", onChange: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { setImpTxt(r.result); }; r.readAsText(f); }, style: { display: "none" }, id: "imp-file" }),
          React.createElement("div", { style: { display: "flex", gap: 8, alignItems: "center" } },
            React.createElement("button", { onClick: () => document.getElementById("imp-file").click(), style: btn(t.btnBg, t.btnFg, { fontSize: 15, padding: "12px 20px" }) }, "Choose File"),
            impTxt && React.createElement("button", { onClick: doImport, style: btn(t.green, "#fff", { fontSize: 15, padding: "12px 20px" }) }, "Restore"),
            React.createElement("button", { onClick: () => { setImpTxt(""); setView("battle"); }, style: btn(t.btnBg, t.btnFg) }, "Cancel"),
            impTxt && React.createElement("span", { style: { fontSize: 13, color: t.up, fontWeight: 600 } }, "File loaded")
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
