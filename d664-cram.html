<script>
const MCQS=[
["A student feels the emotional and anxious before a test, which affects memory. Which brain structure is involved?", ["Limbic system", "Brain stem", "Cerebellum", "Cerebrum"], 0, "Limbic system = emotions + emotional memory. Test anxiety hitting memory is limbic. Cerebellum = balance/coordination; brain stem = breathing/heart.", "Brain"],
["What is the function of the cerebrum?", ["It processes emotions and forms emotional memories.", "It regulates breathing, heart rate, and digestion.", "It controls balance, posture, and motor coordination.", "It supports thinking, reasoning, and problem-solving."], 3, "Cerebrum = thinking, reasoning, problem-solving (largest part). Breathing/heart = brain stem; balance = cerebellum; emotions = limbic.", "Brain"],
["What are the mental processes used to acquire, process, store, and use information?", ["Autonomic regulation", "Motor function", "Neuroplasticity", "Cognition"], 3, "Cognition = mental processes to acquire, process, store, use information. Neuroplasticity = rewiring.", "Brain"],
["What is neurodevelopment?", ["The system of body movements that supports posture and coordination", "The group of emotions that shapes behavior during social experiences", "The way the brain grows and changes across the human lifespan", "The process that reduces attention by limiting sensory input over time"], 2, "Neurodevelopment = how the brain grows and changes (myelination strengthens, pruning trims).", "Brain"],
["A learner remembers a historical term during class discussion without looking at notes. Which term describes this process?", ["Storage", "Retrieval", "Feedback", "Encoding"], 1, "Pulling a stored term back out = retrieval. Encoding = first processing; storage = keeping it.", "Learning Processes"],
["What is feedback-driven metacognition?", ["Mixing different types of problems in a single study session", "Distributing study sessions over time to improve long-term retention", "Using assessment results to reflect on and regulate one's own learning", "Recalling information from memory without the use of study materials"], 2, "Feedback-driven metacognition = use assessment feedback to reflect on and regulate your learning.", "Learning Processes"],
["In learning science, what does storage mean in the memory process?", ["Processing information into memory initially", "Accessing information from memory later", "Maintaining information in memory over time", "Directing attention during learning tasks"], 2, "Storage = maintaining encoded info over time. Encoding = initial processing; retrieval = accessing later.", "Learning Processes"],
["What is neuroplasticity?", ["The brain’s tendency to preserve fixed pathways across development", "The brain’s ability to reorganize and adapt through experience", "The brain’s preference for one sensory input during instruction", "The brain’s reliance on inherited traits over classroom conditions"], 1, "Neuroplasticity = brain reorganizes and adapts through experience. Kills the cognitive-rigidity myth.", "Brain"],
["How should a teacher support students who are in Erikson's industry versus inferiority stage?", ["Allow students to lead group activities and choose their own projects freely", "Provide structured opportunities for success and use constructive feedback", "Limit comparisons between students by avoiding any academic evaluation", "Encourage students to dress and feed themselves during class routines"], 1, "Industry vs inferiority (5-12): opportunities for success, praise, constructive feedback. Dressing/feeding self = autonomy (toddlers).", "Erikson"],
["A teacher shows a preschool class two identical glasses of juice. She then pours one glass into a taller, thinner cup. When asked which container has more juice, most students point to the taller cup. Which concept from Piaget's theory explains the students' response?", ["Seriation", "Egocentrism", "Reversibility", "Centration"], 3, "Tall glass looks like more = centration (focus on one dimension, height). Preoperational. Conservation is what they lack.", "Piaget"],
["At the end of a lesson on the water cycle, a teacher gives students a blank diagram and asks them to label each stage from memory before leaving class. Students may not refer to their notes. Which learning strategy does this single in-class activity most directly apply?", ["Interleaving", "Retrieval practice", "Spacing", "Feedback-driven metacognition"], 1, "Label from memory, no notes = retrieval practice. One session, so not spacing.", "Learning Strategies"],
["During a math study session, a student works through a set of problems that includes addition, multiplication, and algebra questions together. Which learning strategy does this student's approach reflect?", ["Encoding", "Retrieval practice", "Spacing", "Interleaving"], 3, "Mixed problem types in one session = interleaving.", "Learning Strategies"],
["Which method should a teacher use to structure the classroom environment to promote cognitive development according to Vygotsky?", ["Design learning activities that encourage collaboration, discussion, and shared problem-solving.", "Focus instruction on individual seatwork so teachers can assess each student's independent ability.", "Minimize verbal interaction during instruction so students can focus on independent practice.", "Limit peer interaction to prevent students from developing misconceptions through incorrect explanations."], 0, "Vygotsky = social: collaboration, discussion, shared problem-solving.", "Vygotsky"],
["A student studies the same material several times over many days instead of during one long session. Which term describes this approach?", ["Interleaving", "Spacing", "Retrieval", "Encoding"], 1, "Same material over many days = spacing (distributed practice).", "Learning Strategies"],
["A teacher adds manageable challenges to practice so students must work harder to remember and apply learning. Which term describes this approach?", ["Storage", "Encoding", "Desirable difficulty", "Feedback"], 2, "Manageable challenges that make you work harder = desirable difficulty.", "Learning Strategies"],
["What is the impact of retrieval practice on learners?", ["It improves learning by avoiding self-testing.", "It strengthens recall pathways for later remembering.", "It moves all learning into short-term memory.", "It replaces the need for storing information."], 1, "Retrieval practice strengthens recall pathways (long-term retention).", "Learning Strategies"],
["Which student statement shows a fixed mindset about academic ability?", ["“I learn science through movement during instruction.”", "“I can improve in science when I practice and revise.”", "“I have learned other subjects, so I can learn science.”", "“I am not good at science, so I cannot learn it.”"], 3, "Fixed mindset = ability can't change. 'I'm not good at X so I can't learn it.'", "Neuromyths & Mindset"],
["What is differentiated instruction?", ["Teaching tailored to student needs, interests, and readiness", "Teaching designed to keep all students on identical tasks", "Teaching centered on whole-group lecture across all lessons", "Teaching limited to one method, sequence, and pacing pattern"], 0, "Differentiated instruction = tailored to needs, interests, readiness.", "Neuromyths & Mindset"],
["Which term refers to introducing challenges or obstacles during learning that are neither too easy, nor too difficult, but just right for learning?", ["Retrieval practice", "Interleaving", "Desirable difficulty", "Spacing"], 2, "Just right challenge, not too easy or too hard = desirable difficulty.", "Learning Strategies"],
["Which effect does interleaving have on learning?", ["It reduces speed by reducing variation during practice.", "It improves recall by using one topic per practice set.", "It reduces fluency by grouping similar problems together.", "It improves transfer by mixing topics during practice."], 3, "Interleaving improves transfer by mixing topics.", "Learning Strategies"],
["Which statement refutes the myth that neurological differences such as ADHD, dyslexia, and autism are deficits that must be corrected?", ["Neurological differences are most effectively addressed by modifying a student's environment rather than instruction.", "Neurological differences are temporary conditions that respond well to early behavioral intervention.", "Neurological differences are caused by environmental factors and can be reversed through targeted instruction.", "Neurological differences are natural and valuable aspects of human variation that enrich learning environments."], 3, "Neurodiversity: differences are natural and valuable variation, not deficits.", "Neuromyths & Mindset"],
["Which practice counteracts the myth of cognitive rigidity in the classroom?", ["Dissuading students from attempting tasks they have previously found difficult, so they remain confident.", "Placing students in ability groups based on early test scores to target instruction efficiently.", "Lowering academic expectations for older students whose cognitive processing speed has naturally slowed.", "Fostering a growth mindset culture that frames effort and challenges as pathways to brain development."], 3, "Counteract cognitive rigidity = growth mindset culture; effort and challenges grow the brain.", "Neuromyths & Mindset"],
["A learner studies while texting, watching videos, and completing practice questions. Which effect can result from this learning approach?", ["The learner may improve learning retention by combining several tasks.", "The learner will easily be able to give equal attention to each task.", "The learner may reduce focus by switching attention repeatedly.", "The learner will be able to reduce the time necessary to learn and study."], 2, "Multitasking = task switching, reduced focus, more errors, worse retention.", "Neuromyths & Mindset"],
["Which statement reflects the myth of cramming?", ["Cramming supports durable memory and reduces cognitive fatigue.", "Cramming may result in short-term memorization.", "Cramming supports long-term recall and retrieval.", "Cramming supports deep learning and concept transfer."], 1, "WGU's key: the 'may result in short-term memorization' line. Course: cramming gives short-term memorization but shallow understanding and poor long-term retention. Every 'cramming supports long-term...' option is false.", "Neuromyths & Mindset"],
["Human brains are incredibly varied, and individuals vary widely in their strengths and weaknesses. Which common myth does this statement refute?", ["Preferred learning styles", "Tabula Rasa", "Cognitive Rigidity", "Normality"], 3, "'Brains are incredibly varied' is the course's exact refutation of the myth of NORMAL.", "Neuromyths & Mindset"],
["Which statement is consistent with a growth mindset after a setback?", ["“This shows what I need to improve next.”", "“This shows I learn with easy assignments.”", "“I should choose tasks that fit my strengths.”", "“This shows I do not have enough ability.”"], 0, "Growth mindset after setback: 'this shows what I need to improve next.'", "Neuromyths & Mindset"],
["How does a fixed mindset interpret feedback?", ["It takes feedback personally, resists criticism, and sees it as judgment.", "It takes feedback as guidance for better skills, useful advice, and learning.", "It takes feedback as support for future growth, effort, and improvement.", "It takes feedback as practice for steady progress, reflection, and change."], 0, "Fixed mindset takes feedback personally, resists criticism, sees it as judgment.", "Neuromyths & Mindset"],
["How is constructive feedback viewed in a growth mindset?", ["As unnecessary pressure during performance", "As useful input for skill enhancement", "As a signal to choose goals that fit existing ability", "As proof ability comes from natural talent"], 1, "Growth mindset sees constructive feedback as useful input for skill growth.", "Neuromyths & Mindset"],
["Which practice counteracts the myth that students learn best when instruction is standardized, by applying evidence-based cognitive style principles?", ["Pacing all students through identical lessons to ensure consistent exposure to grade-level content.", "Focusing instruction on the most common cognitive profile in the classroom to benefit the majority of students.", "Tailoring instruction to individual student needs, interests, and readiness levels through differentiated approaches.", "Providing remediation after assessments as the primary method for addressing differences in student performance."], 2, "Counter 'standardized instruction' = differentiate to needs, interests, readiness.", "Neuromyths & Mindset"],
["Which teaching strategy is aligned with behaviorist principles?", ["Using direct instruction to model a skill, followed by guided practice and corrective feedback.", "Designing hands-on group activities that promote collaborative knowledge construction.", "Using concept maps to help students organize new information with prior knowledge.", "Encouraging students to pursue topics of personal interest through self-directed projects."], 0, "Behaviorism (Skinner): direct instruction, model, guided practice, corrective feedback, reinforcement. Concept maps = cognitivism; group construction = constructivism.", "Learning Theories"],
["Using cognitivist principles, what should a teacher do to help students transfer new information into long-term memory?", ["Assign group tasks in which students collaborate to apply new content to real-world scenarios.", "Allow students to explore the topic freely and construct their own understanding through discovery.", "Encourage students to elaborate on new information by connecting it to what they already know.", "Reward students each time they demonstrate recall of the information during class practice."], 2, "Cognitivism: elaboration, connect new info to prior knowledge to move it into long-term memory.", "Learning Theories"],
["What role should a teacher take in a constructivist classroom?", ["Providing consistent rewards and consequences to reinforce desired student behaviors.", "Delivering structured lessons that break content into small steps for student mastery.", "Modeling problem-solving strategies and guiding students through prescribed practice steps.", "Facilitating student-led exploration and providing scaffolding as students construct understanding."], 3, "Constructivist teacher = facilitator: student-led exploration plus scaffolding.", "Learning Theories"],
["Learning is shaped by social interaction and cultural experience. Which view of development does this statement reflect?", ["Piaget’s cognitive development theory", "Skinner’s behavioral theory", "Erikson’s psychosocial theory", "Vygotsky’s cognitive development theory"], 3, "Social interaction + culture = Vygotsky.", "Vygotsky"],
["Which theory is associated with the idea that healthy development depends on resolving stage-related crises?", ["Skinner’s behavioral theory", "Piaget’s cognitive development theory", "Erikson’s psychosocial theory", "Vygotsky’s cognitive development theory"], 2, "Stage crises you must resolve = Erikson's psychosocial theory.", "Erikson"],
["Which stage in Erikson’s theory is associated with birth-12 months?", ["Identity versus role confusion", "Initiative versus guilt", "Trust versus mistrust", "Industry versus inferiority"], 2, "Trust vs mistrust = birth to 12 months.", "Erikson"],
["Which stage in Erikson’s theory is associated with adolescence?", ["Initiative versus guilt", "Industry versus inferiority", "Identity versus role confusion", "Autonomy versus shame and doubt"], 2, "Identity vs role confusion = adolescence (12-17).", "Erikson"],
["Which behavior most clearly reflects Erikson’s initiative versus guilt stage?", ["An adolescent examines personal beliefs and future goals.", "A school-age child compares grades with classmates and seeks recognition.", "A preschool child invents games, asks questions, and starts new activities.", "An infant becomes upset when a caregiver leaves the room."], 2, "Initiative vs guilt (3-6): invents games, asks questions, starts activities. Comparing grades = industry; caregiver leaving = trust.", "Erikson"],
["Which cognitive skill is most closely associated with the sensorimotor stage?", ["Solving conservation problems", "Understanding object permanence", "Applying systematic logic", "Using abstract reasoning"], 1, "Sensorimotor (0-2) = object permanence. Conservation = concrete; abstract = formal.", "Piaget"],
["Which task is the clearest example of fine motor skill development in a preschool child?", ["Climbing up a ladder", "Running across a playground", "Threading beads onto a string", "Jumping over a line"], 2, "Fine motor = small hand muscles: threading beads. Running/climbing/jumping = gross motor.", "Development"],
["A teacher introduces a new sorting task by modeling one step at a time, then gradually lets children complete more of the task independently. Which strategy is the teacher using?", ["Egocentrism", "Scaffolding", "Object permanence", "Interleaving"], 1, "Model one step at a time, then fade support = scaffolding.", "Vygotsky"],
["Which cognitive ability is associated with Piaget’s concrete operational stage?", ["Developing trust through consistent care from caregivers", "Exploring personal identity through beliefs and values", "Thinking logically about concrete objects and events", "Forming abstract hypotheses without concrete referents"], 2, "Concrete operational (7-11) = logic about concrete objects and events.", "Piaget"],
["What does reversibility mean?", ["Understanding that an action can be mentally undone to return to its starting point", "Understanding that a symbol can still stand for an object in pretend-based play", "Understanding that an object can still exist when it is hidden from plain sight", "Understanding that another person can still view a situation from a different perspective"], 0, "Reversibility = mentally undo an action back to its start. Hidden object = object permanence; another's view = egocentrism opposite.", "Piaget"],
["Learning experiences that support critical thinking, self-reflection, and independent inquiry are appropriate for which age group?", ["Preschoolers", "Toddlers", "Adolescents", "Infants"], 2, "Critical thinking, self-reflection, independent inquiry = adolescents (formal operational).", "Development"],
["Which level of Bloom’s revised taxonomy involves using learning in real-world contexts?", ["Remembering", "Understanding", "Evaluating", "Applying"], 3, "Applying = using learning in real-world contexts/new situations.", "Bloom's"],
["Which classroom practice aligns with direct instruction?", ["Letting students discuss any topic instead of practicing the skill", "Giving students a difficult task before explaining the skill", "Teaching a skill in small steps and giving feedback after each step", "Asking students to create their own method before seeing an example"], 2, "Direct instruction = small steps with feedback after each.", "Learning Theories"],
["Which of the following best describes cognition?", ["The mental processes involved in acquiring, processing, storing, and using information", "The process of moving and coordinating muscles", "The physical structure of the brain", "The ability to see and hear"], 0, "Cognition = acquire, process, store, use information.", "Brain"],
["Cognition encompasses processes such as memory, perception, reasoning, problem-solving, and decision-making.", ["True", "False"], 0, "True. Cognition covers memory, perception, reasoning, problem-solving, decisions.", "Brain"],
["The prefrontal cortex is responsible for balance, coordination, and motor control.", ["True", "False"], 1, "False. Balance/coordination = cerebellum. Prefrontal cortex = decisions, impulse control, emotional regulation.", "Brain"],
["What is functional magnetic resonance imaging (fMRI) primarily used for?", ["Mapping brain activity", "Detecting fractures in bones", "Visualizing soft tissue organs", "Evaluating blood flow in arteries"], 0, "fMRI maps brain activity during learning.", "Brain"],
["Storage involves actively recalling information from memory.", ["True", "False"], 1, "False. Storage = retaining. Actively recalling = retrieval.", "Learning Processes"],
["How does cramming affect the cerebrum?", ["It minimizes the role of the cerebrum in learning and memory.", "It overwhelms the cerebrum, impairing cognitive functions.", "It activates the cerebrum, leading to improved memory formation.", "It strengthens the cerebrum and enhances cognitive abilities."], 1, "Cramming overwhelms the cerebrum, impairing cognitive function (fatigue, stress, focus).", "Neuromyths & Mindset"],
["A student reads a textbook chapter while replying to messages on a phone. Because of the distractions, the student needs to reread several paragraphs to understand them.", ["The brain switches attention between tasks, increasing mental effort and lowering memory retention.", "The brain sends each task to a different hemisphere, preventing information from being stored in long-term memory.", "The brain processes both tasks at the same time, dividing memory storage equally between them.", "The brain shifts attention control to the brainstem, which slows the processing of new information."], 0, "Multitasking = switching attention, more effort, lower retention.", "Neuromyths & Mindset"],
["What effect can multitasking have on the cerebrum?", ["Strengthening its cognitive abilities and executive functions", "Enhancing its efficiency in processing emotional stimuli", "Reducing stress levels and inducing relaxation", "Overwhelming its limited capacity and impairing cognitive functions"], 3, "Multitasking overwhelms limited capacity, impairing cognition.", "Neuromyths & Mindset"],
["Which effect does cramming have on learning?", ["It reduces cognitive load by focusing the brain on one extended session.", "It leads to shallow memorization and poor long-term retention of material.", "It weakens motivation by making learning feel repetitive and unengaging.", "It deepens encoding by concentrating study into a single focused session."], 1, "Cramming = shallow memorization, poor long-term retention.", "Neuromyths & Mindset"],
["What does the \"myth of normal\" refer to from a neuroscience perspective?", ["Individual differences in learning preferences and abilities are insignificant.", "There is a single, universally optimal learning style or cognitive functioning.", "Academic success can only be achieved through standardized testing and assessment.", "Learning outcomes are solely determined by innate intelligence or ability."], 1, "Myth of normal = one standard way to learn/think.", "Neuromyths & Mindset"],
["Which term describes the concept that neurological variations are natural and valuable aspects of human variety that should be recognized and respected?", ["Neurodiversity", "Cognitive style", "Differentiated instruction", "Neuroplasticity"], 0, "Neurodiversity = neurological variation is natural and valuable.", "Neuromyths & Mindset"],
["What characterizes multisensory learning?", ["Employing traditional lecture-based teaching methods", "Focusing on auditory learning strategies", "Limiting instruction to visual stimuli only", "Engaging various senses during learning"], 3, "Multisensory = engage various senses.", "Neuromyths & Mindset"],
["What is the primary characteristic of neuroplasticity?", ["The fixed and unchanging nature of the brain's structure and function throughout life", "The decline in cognitive function and memory retention with age", "The predetermined and unalterable genetic factors that influence brain development", "The ability of the brain to adapt and reorganize in response to experience and learning"], 3, "Neuroplasticity = adapt and reorganize through experience.", "Neuromyths & Mindset"],
["Neurodiversity refers to promoting uniformity in cognitive functioning and neurological development among individuals.", ["True", "False"], 1, "False. Neurodiversity celebrates variation, not uniformity.", "Neuromyths & Mindset"],
["What does the term \"cognitive style\" refer to?", ["The ability to regulate emotions and manage stress in challenging situations", "The specific content knowledge acquired through education and experience", "The way individuals approach and process information", "The level of intelligence as measured by standardized tests"], 2, "Cognitive style = consistent way of approaching and processing information. Not the same as the unsupported 'learning styles'.", "Neuromyths & Mindset"],
["What does neuroplasticity allow the brain to do?", ["Remain fixed and unchangeable across a person's life.", "Grow new abilities without any repeated effort.", "Reorganize, adapt, and grow in response to experiences.", "Store memories without forming any new connections."], 2, "Neuroplasticity lets the brain reorganize, adapt, grow.", "Neuromyths & Mindset"],

["An eighth grader predicts outcomes and plans tests for several egg-drop designs. Which Piaget stage is this?", ["Preoperational", "Concrete operational", "Sensorimotor", "Formal operational"], 3, "Hypotheses + abstract planning = formal operational.", "Piaget"],
["Which theorist argued that development does NOT happen in fixed stages?", ["Lev Vygotsky", "Erik Erikson", "Abraham Maslow", "Jean Piaget"], 0, "Vygotsky: no stages, social/cultural interaction at all ages.", "Vygotsky"],

const FLASHCARDS=[
["Cerebrum", "Largest part. Thinking, reasoning, problem-solving, language, learning new skills; also seeing, hearing, touch.", "Brain"],
["Prefrontal cortex", "Inside the cerebrum. Rational decisions, impulse control, emotional regulation. Matures through high school.", "Brain"],
["Limbic system", "Emotional control center. Feelings, emotional memory, reactive decisions. Test anxiety hitting memory = limbic.", "Brain"],
["Cerebellum", "'Little brain' at the back. Voluntary movement, posture, balance, coordination.", "Brain"],
["Brain stem", "Connects to spinal cord. Heartbeat, breathing, blood flow, temperature, sneezing, swallowing, digestion. Develops before birth.", "Brain"],
["Development order", "Brain stem (prenatal) → limbic + cerebellum (early) → cerebrum (childhood + puberty) → prefrontal cortex (through teens). Brain grows until ~25.", "Brain"],
["Myelination vs pruning", "Myelination strengthens pathways. Pruning removes ones not needed.", "Brain"],
["Cognition", "Mental processes to acquire, process, store, and use information.", "Brain"],
["Neurodevelopment", "How the brain grows and changes across the lifespan.", "Brain"],
["fMRI", "Maps brain activity; shows which areas are active during learning.", "Brain"],
["Encoding / storage / retrieval", "Encode = initial processing of sensory input. Store = maintain over time. Retrieve = access when needed.", "Learning Processes"],
["Executive function", "Planning, working memory, self-regulation (emotions, impulses), organization, flexibility.", "Learning Processes"],
["Retrieval practice", "Actively recall from memory (quizzes, label from memory, flashcards). Strengthens recall pathways.", "Learning Strategies"],
["Spacing", "Same material over several days instead of one long session. Distributed practice. Kills cramming.", "Learning Strategies"],
["Interleaving", "Mix different problem types/topics in one session. Improves transfer and telling concepts apart.", "Learning Strategies"],
["Feedback-driven metacognition", "Use assessment feedback to reflect on and regulate your own learning.", "Learning Strategies"],
["Desirable difficulty", "Challenge that's not too easy, not too hard, just right. Makes learning stick.", "Learning Strategies"],
["Myth of multitasking", "Refute: brain switches, doesn't parallel-process; overwhelms cerebrum, more errors, worse retention. Counter: one task at a time, dedicated time per activity.", "Neuromyths & Mindset"],
["Myth of cramming", "Refute: short-term memorization only, shallow, cortisol stress, strains cerebrum. Counter: distributed practice / spacing.", "Neuromyths & Mindset"],
["Myth of normal", "Refute: brains are incredibly varied (genetics, environment, experience). Counter: embrace variety, differentiated instruction.", "Neuromyths & Mindset"],
["Myth of cognitive rigidity", "Refute: neuroplasticity, brains stay flexible for life. Counter: growth mindset culture, praise effort and persistence.", "Neuromyths & Mindset"],
["Myth: brain is a computer", "Refute: oversimplifies, misses holistic brain-body nature (info processing terms feed it). Counter: embodied mind perspective, physical/sensory learning.", "Neuromyths & Mindset"],
["Neurodiversity", "Neurological differences (autism, ADHD, dyslexia) are natural, valuable human variation, not deficits.", "Neuromyths & Mindset"],
["Cognitive style vs learning style", "Cognitive style = stable way of thinking/processing, research-supported. Learning styles (visual/auditory/kinesthetic) matching = no evidence.", "Neuromyths & Mindset"],
["Strategies for all cognitive styles", "Differentiated instruction, multisensory learning, social and emotional learning (SEL).", "Neuromyths & Mindset"],
["Growth vs fixed mindset (Dweck)", "Growth: effort grows ability, setbacks = what to improve, feedback = useful input. Fixed: ability is set, takes feedback personally, avoids challenge.", "Neuromyths & Mindset"],
["Embodied mind", "Cognition is tied to body, senses, environment. Movement breaks, hands-on, sleep, exercise matter.", "Neuromyths & Mindset"],
["Maslow (1943)", "Physiological → safety → love/belonging → esteem → self-actualization (top).", "Neuromyths & Mindset"],
["Whole body listening", "Eyes on speaker, body still, brain thinking, caring about what's said. Not just eyes.", "Neuromyths & Mindset"],
["Erikson's 5 (course)", "Trust vs mistrust (0-1), autonomy vs shame/doubt (1-3), initiative vs guilt (3-6), industry vs inferiority (5-12), identity vs role confusion (12-17). Each stage = a crisis to resolve.", "Erikson"],
["Trust vs mistrust", "Infants. Consistent, responsive, nurturing care.", "Erikson"],
["Autonomy vs shame and doubt", "Toddlers. Let them do it themselves, make choices, learn from mistakes.", "Erikson"],
["Initiative vs guilt", "Preschool. Invents games, asks questions, leads. Encourage curiosity; harsh shutdowns = guilt.", "Erikson"],
["Industry vs inferiority", "School age. Mastery and competence. Structured chances to succeed, praise, constructive feedback; avoid unfavorable comparisons.", "Erikson"],
["Identity vs role confusion", "Adolescents. Explore beliefs, values, goals. Self-reflection, discussion, real-world learning.", "Erikson"],
["Piaget's 4", "Sensorimotor (0-2), preoperational (2-7), concrete operational (7-11), formal operational (12+). Learning through interaction with the environment.", "Piaget"],
["Sensorimotor", "Senses + actions. Object permanence. Support with sensory exploration, music, movement.", "Piaget"],
["Preoperational", "Symbolic, pretend play. Limits: egocentrism (own view only) and centration (one feature, e.g. tall glass = more).", "Piaget"],
["Concrete operational", "Logic about concrete things. Conservation, reversibility, classification, seriation. Hands-on with real objects.", "Piaget"],
["Formal operational", "Abstract, hypothetical, deductive reasoning, metacognition. Critical thinking, independent inquiry, problem-based learning.", "Piaget"],
["Conservation / reversibility / seriation", "Conservation = amount stays same despite appearance. Reversibility = mentally undo an action. Seriation = order by size/length.", "Piaget"],
["Vygotsky", "No stages. Thinking develops through social and cultural interaction at all ages. Teacher = guide; collaboration and dialogue.", "Vygotsky"],
["ZPD / MKO / scaffolding", "ZPD = gap between alone and with guidance. MKO = more knowledgeable adult or peer. Scaffolding = temporary support, faded as competence grows.", "Vygotsky"],
["Behaviorism (Skinner)", "Observable behavior, mind as black box. Operant conditioning: reinforcement up, punishment down. Direct instruction, small steps, rewards, tokens.", "Learning Theories"],
["Cognitivism", "Inside the mind: memory, thinking, problem-solving. Information processing, schemas, elaboration, mnemonics, concept maps, graphic organizers, chunking.", "Learning Theories"],
["Constructivism", "Learners build knowledge through experience. Inquiry, discovery, self-directed, hands-on, group problem-solving; teacher facilitates and scaffolds.", "Learning Theories"],
["Bloom's revised (6)", "Remember, Understand, Apply, Analyze, Evaluate, Create. Builds on cognitivism; scaffold up the levels (progressive complexity).", "Bloom's"],
["10 principles of learning science", "Autonomy/choice, collaboration, deep thinking, effort and strategy, feedback, metacognition, physical environment, physiological needs, productive struggle, supportive environment.", "Principles"],
["Principle alignments (course table)", "Metacognition = checklists, journals, think-alouds. Productive struggle = PBL, inquiry, scaffolding. Effort/strategy = growth mindset, retrieval, praise. Autonomy = choice boards, partners, centers. Deep thinking = dual coding, open questions, discussion.", "Principles"],
["Instructional techniques", "Spacing, interleaving, retrieval, differentiation, elaboration, dual coding, mnemonics, visualization, scaffolding, project-based, hands-on, group learning.", "Instructional Techniques"],
["Dual coding vs visualization", "Dual coding = words + visuals together (timeline while narrating). Visualization = students create images/diagrams (draw the water cycle).", "Instructional Techniques"],
["Cognitive / motivational / social contexts", "How we think (mnemonics, chunking, spacing) / why we try (rewards, goals, choice) / who we learn with (peer teaching, think-pair-share, role-play).", "Instructional Techniques"]
];
const MATCHES=[
["Brain part -> job", [["Cerebrum", "Thinking, reasoning, problem-solving"], ["Prefrontal cortex", "Decisions, impulse control, emotional regulation"], ["Limbic system", "Emotions and emotional memory"], ["Cerebellum", "Balance, posture, coordination"], ["Brain stem", "Breathing, heart rate, digestion"]]],
["Strategy -> scenario", [["Retrieval practice", "Label the diagram from memory, no notes"], ["Spacing", "Same material over many days"], ["Interleaving", "Addition, multiplication, algebra in one set"], ["Feedback-driven metacognition", "Reflect on essay feedback, adjust approach"], ["Desirable difficulty", "Manageable challenge, just right"]]],
["Myth -> counter", [["Multitasking", "One task at a time, dedicated time"], ["Cramming", "Distributed practice"], ["Normal", "Embrace variety, differentiate"], ["Cognitive rigidity", "Growth mindset culture"], ["Brain is a computer", "Embodied mind, physical and sensory learning"]]],
["Erikson stage -> teacher move", [["Trust vs mistrust", "Consistent, nurturing care"], ["Autonomy vs shame and doubt", "Let them do tasks independently"], ["Initiative vs guilt", "Let them lead and invent activities"], ["Industry vs inferiority", "Structured success plus constructive feedback"], ["Identity vs role confusion", "Self-reflection on interests and values"]]],
["Piaget concept -> stage", [["Object permanence", "Sensorimotor"], ["Centration and egocentrism", "Preoperational"], ["Conservation and seriation", "Concrete operational"], ["Hypotheses and abstract reasoning", "Formal operational"]]],
["Classroom move -> theory", [["Stickers or points for behavior", "Behaviorism"], ["Mnemonic song for state capitals", "Cognitivism"], ["Inquiry-based group problem-solving", "Constructivism"], ["Peer discussion, MKO support", "Vygotsky"], ["Direct instruction with corrective feedback", "Behaviorism"]]],
["Bloom's level -> verb", [["Remember", "Recall facts"], ["Understand", "Explain in own words"], ["Apply", "Use in a real situation"], ["Analyze", "Break into parts, find relationships"], ["Evaluate", "Judge against criteria"], ["Create", "Produce something original"]]],
["Technique -> example", [["Dual coding", "Timeline shown while narrating"], ["Visualization", "Students draw the water cycle"], ["Mnemonic device", "King Philip Came Over For Good Soup"], ["Project-based learning", "Design the school garden over weeks"], ["Elaboration", "Jupiter is like a giant balloon"], ["Scaffolding", "Model, write together, checklist, solo"]]]
];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";$("#fcdef").classList.add("hide");$("#fcpos").textContent="0 / 0";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

const NOTES=`
<div class="warn"><b>Built from the slurped course + your PAJJ PAM1.</b> 45 real pre-assessment items, 100 course quiz/test/practice items, 38 taxonomy drills. PAM1 was 1/45. The OA is three competencies: neuroscience (Section 1), development + learning theories (Section 2), instructional techniques (Section 3).</div>
<h3>The brain (Section 1)</h3>
<table><tr><th>Part</th><th>Job</th><th>Cut rule</th></tr>
<tr><td>Cerebrum</td><td>Thinking, reasoning, problem-solving</td><td>"higher thinking" &rarr; cerebrum</td></tr>
<tr><td>Prefrontal cortex</td><td>Decisions, impulse control, emotional regulation</td><td>"impulse" or "plan" &rarr; PFC</td></tr>
<tr><td>Limbic system</td><td>Emotions + emotional memory</td><td>"anxious, emotional" &rarr; limbic</td></tr>
<tr><td>Cerebellum</td><td>Balance, posture, coordination</td><td>"balance, motor" &rarr; cerebellum</td></tr>
<tr><td>Brain stem</td><td>Breathing, heart, digestion</td><td>"automatic" &rarr; brain stem</td></tr></table>
<div class="mn"><b>Picture a house:</b> the <span class="k">brain stem</span> is the furnace in the basement (runs on its own), the <span class="k">limbic system</span> is the dog in the living room (pure emotion), the <span class="k">cerebellum</span> is the gym out back (balance), the <span class="k">cerebrum</span> is the office upstairs, and the <span class="k">prefrontal cortex</span> is the parent at the front desk saying "not right now."</div>
<div class="mn"><b>Learning processes:</b> encode (put it in) &rarr; store (keep it) &rarr; retrieve (pull it out). PAM trap: remembering a term in discussion = <span class="k">retrieval</span>, not encoding.</div>
<div class="mn"><b>Five strategies:</b> "<span class="k">Really Smart Is Fun Daily</span>": Retrieval practice (from memory, no notes), Spacing (many days), Interleaving (mixed set), Feedback-driven metacognition (use results to adjust), Desirable difficulty (just-right challenge). One session = never spacing.</div>
<div class="mn"><b>Five neuromyths:</b> "<span class="k">My Cat Never Climbs Computers</span>" (cat staring at a laptop it refuses to climb): Multitasking, Cramming, Normal, Cognitive rigidity, Computer. Refute = why it's false; counteract = what you do instead. "Brains are incredibly varied" refutes NORMAL. Growth mindset counters RIGIDITY. Embodied mind counters COMPUTER. Neurodiversity = differences are natural and valuable. Learning styles have no evidence; cognitive styles do.</div>
<div class="mn"><b>Mindset:</b> fixed = "I'm not good at it so I can't," takes feedback personally. Growth = "this shows what I need next," feedback is useful input.</div>
<h3>Development (Section 2)</h3>
<div class="mn"><b>Erikson's 5:</b> "<span class="k">Tiny Animals In Igloos Ice-fish</span>" (penguin family aging up in an igloo): Trust (0-1), Autonomy (1-3), Initiative (3-6), Industry (5-12), Identity (12-17). Stage = crisis to resolve. Dress/feed self = autonomy. Invents games, asks questions = initiative. Compares grades, needs success + feedback = industry. Beliefs and future = identity.</div>
<div class="mn"><b>Piaget's 4:</b> "<span class="k">Silly Penguins Can't Fly</span>": Sensorimotor (object permanence), Preoperational (pretend play, egocentrism, <span class="k">centration = tall glass looks like more</span>), Concrete (conservation, reversibility, classification, seriation, hands-on real objects), Formal (abstract, hypotheses, critical thinking, independent inquiry).</div>
<div class="mn"><b>Vygotsky:</b> social + cultural, <span class="k">no stages</span>. ZPD (gap alone vs guided), MKO (adult or peer), scaffolding (model one step at a time, then fade). Classroom = collaboration, discussion, shared problem-solving. Fine motor = small hand tasks (threading beads); gross = run, climb, jump.</div>
<h3>Learning theories + Bloom's</h3>
<table><tr><th>Theory</th><th>Focus</th><th>Classroom tell</th></tr>
<tr><td>Behaviorism (Skinner)</td><td>Observable behavior, black box</td><td>Rewards, points, tokens, direct instruction + corrective feedback, small steps</td></tr>
<tr><td>Cognitivism</td><td>Memory, thinking, schemas</td><td>Elaboration, mnemonics, rhymes/songs, concept maps, chunking, activating prior knowledge</td></tr>
<tr><td>Constructivism</td><td>Build knowledge through experience</td><td>Inquiry, discovery, group exploration, teacher facilitates + scaffolds</td></tr></table>
<div class="mn"><b>Trap:</b> mnemonics and songs are <span class="k">cognitivism</span>, not behaviorism. Rewards = behaviorism. Reflecting on how you solved it = cognitivism.</div>
<div class="mn"><b>Bloom's:</b> "<span class="k">Remember Ugly Apes Always Eat Cake</span>" (apes at a birthday party): Remember, Understand, Apply (real-world use), Analyze, Evaluate (judge vs criteria), Create (original). Identify then analyze = progressive complexity.</div>
<h3>Instructional techniques + principles (Section 3)</h3>
<div class="mn"><b>10 principles:</b> autonomy/choice, collaboration, deep thinking, effort and strategy, feedback, metacognition, physical environment, physiological needs, productive struggle, supportive environment. Hints instead of answers at the edge of ability = <span class="k">productive struggle</span>. Slow reading, questioning, linking to prior knowledge = <span class="k">deep thinking</span>.</div>
<div class="mn"><b>Techniques:</b> spacing, interleaving, retrieval, differentiation (content/process/product/environment), elaboration (connect to known), dual coding (words + visuals together), mnemonics (associations), visualization (create images, timelines), scaffolding (fade support), project-based (weeks on a real problem), hands-on (materials), group learning. Contexts: cognitive = how we think, motivational = why we try, social = who we learn with.</div>
`;
$("#notes").innerHTML=NOTES;

renderChips();buildFC();buildMC();buildMA();
</script></body></html>
