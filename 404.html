<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 · oh no</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0e0e1a;--ink:#fff;--dim:#8a8aa3;--faint:#3a3a52;
  --pink:#ff6b9d;--orange:#ffa751;--yellow:#ffe259;--green:#7bed9f;--blue:#70a1ff;--violet:#a29bfe;
  --hue:0deg;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:'Gaegu',cursive;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  cursor:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='24' font-size='24'>👻</text></svg>") 16 16,auto;
  -webkit-tap-highlight-color:transparent;
}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:hue-rotate(var(--hue))}
.beams{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;
  background:conic-gradient(from 0deg at 50% 50%,transparent 0 8%,rgba(255,107,157,.10) 9% 11%,transparent 12% 30%,rgba(112,161,255,.10) 31% 33%,transparent 34% 55%,rgba(123,237,159,.10) 56% 58%,transparent 59% 80%,rgba(255,226,89,.10) 81% 83%,transparent 84%);
  animation:spin 6s linear infinite}
.disco .beams{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

.content{position:relative;z-index:2;text-align:center;padding:2rem 1rem;max-width:640px;width:100%;will-change:transform}
.ghost{font-size:4rem;display:block;width:max-content;margin:0 auto .6rem;filter:drop-shadow(0 0 25px rgba(162,155,254,.6)) hue-rotate(var(--ghue,0deg));will-change:transform;user-select:none}

h1.code{position:relative;display:inline-flex;align-items:flex-end;gap:.02em;font-weight:700;line-height:.9;
  font-size:clamp(7rem,24vw,12.5rem);user-select:none;cursor:pointer;margin-bottom:.6rem}
.d{display:inline-block;will-change:transform;transform-origin:50% 90%;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--green),var(--blue),var(--violet),var(--pink));
  background-size:700% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(255,107,157,.35))}
.zwrap{position:relative;display:inline-block}
.face{position:absolute;left:50%;top:52%;font-size:clamp(3rem,8.4vw,5.2rem);line-height:1;
  transform:translate(-50%,-50%);pointer-events:none;will-change:transform;
  -webkit-text-fill-color:initial;filter:drop-shadow(0 0 18px rgba(255,255,255,.28))}

.subtitle{font-size:clamp(1.6rem,4.5vw,2.1rem);font-weight:700;min-height:1.3em;margin-bottom:.9rem;color:var(--pink)}
.subtitle .w{display:inline-block;white-space:nowrap}
.subtitle span.c{display:inline-block;white-space:pre;animation:drop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-.7em) rotate(-12deg) scale(.6)}to{opacity:1;transform:none}}

.urlbar{display:inline-flex;align-items:center;gap:.6rem;max-width:100%;margin-bottom:1rem;padding:.35rem .4rem .35rem .9rem;border:1px solid var(--faint);border-radius:999px;background:rgba(20,20,36,.75);font:600 .8rem/1 'IBM Plex Mono',monospace;color:var(--dim)}
.screen{position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:min(60vw,360px);padding:.2rem 0;transform-origin:50% 50%}
.screen b{color:#d9d9ea;font-weight:600}
.screen.off{animation:crtOff .55s cubic-bezier(.7,0,.8,.4) forwards}
.screen.on{animation:crtOn .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes crtOff{0%{transform:scale(1,1);filter:brightness(1)}40%{transform:scale(1.04,.04);filter:brightness(3)}75%{transform:scale(.02,.04);filter:brightness(4)}100%{transform:scale(0,0);filter:brightness(0)}}
@keyframes crtOn{0%{transform:scale(.02,.04);filter:brightness(5)}30%{transform:scale(1.05,.05);filter:brightness(3)}55%{transform:scale(1,1.1);opacity:.4}62%{opacity:1}70%{opacity:.5}78%{opacity:1}100%{transform:none;filter:none}}
.pwr{border:0;cursor:pointer;width:2rem;height:2rem;border-radius:50%;flex:none;font:700 1rem/1 'IBM Plex Mono',monospace;color:#0e0e1a;background:linear-gradient(135deg,var(--pink),var(--orange));box-shadow:0 0 0 0 rgba(255,107,157,.5);transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.pwr:hover{transform:scale(1.12) rotate(-12deg)}
.pwr:active{transform:scale(.9)}
.pwr.nag{animation:nag 1.6s ease-out infinite}
@keyframes nag{0%{box-shadow:0 0 0 0 rgba(255,107,157,.55)}100%{box-shadow:0 0 0 14px rgba(255,107,157,0)}}

.msg{font:.88rem/1.8 'IBM Plex Mono',monospace;color:#9a9ab0;min-height:3.6em;margin:0 auto 1.6rem;max-width:34em}
.typed{color:#c4c4d6}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--pink);vertical-align:-.15em;margin-left:2px;animation:blink .7s step-end infinite}
@keyframes blink{50%{opacity:0}}

.links{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.links a{font:700 1.2rem/1 'Gaegu',cursive;color:#fff;text-decoration:none;padding:.75rem 1.6rem;border-radius:999px;
  background:linear-gradient(135deg,var(--pink),var(--violet));position:relative;overflow:hidden;display:inline-block;will-change:transform;
  box-shadow:0 8px 24px -10px rgba(255,107,157,.6)}
.links a:nth-child(2){background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 8px 24px -10px rgba(112,161,255,.6)}
.links a::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.links a:hover::after{transform:translateX(120%)}
.links a.pulse{animation:homePulse 1.1s ease-in-out infinite}
@keyframes homePulse{50%{box-shadow:0 0 0 10px rgba(255,107,157,.18),0 8px 30px -6px rgba(255,107,157,.9)}}
a:focus-visible,button:focus-visible,h1:focus-visible{outline:2px dashed var(--yellow);outline-offset:4px}

.dancers{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:.3rem;z-index:2;opacity:.45;font-size:1.2rem;pointer-events:none}
.dancer{display:inline-block;animation:dance .6s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.disco .dancers{opacity:1;font-size:1.6rem}
.disco .dancer{animation-duration:.25s}
@keyframes dance{to{transform:translateY(-8px) scaleX(-1)}}
.hint{position:fixed;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 2.1rem);left:50%;transform:translateX(-50%);white-space:nowrap;font:.62rem 'IBM Plex Mono',monospace;color:#34344a;z-index:2;transition:color .3s}
.hint:hover{color:#77778f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-width:600px){
  .links{flex-direction:column;align-items:center}.links a{width:78%}
  .hint{font-size:.55rem;white-space:normal;width:90%;text-align:center}
  .content{padding-bottom:5rem}
}
@media (prefers-reduced-motion:reduce){
  .beams,.dancer,.caret,.subtitle span,.pwr.nag,.links a.pulse{animation:none!important}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="beams" aria-hidden="true"></div>

<main class="content" id="content">
  <div class="ghost" id="ghost" aria-hidden="true">👻</div>
  <h1 class="code" id="the404" tabindex="0" aria-label="404, page not found"><span class="d" aria-hidden="true">4</span><span class="zwrap" aria-hidden="true"><span class="d" id="zero">0</span><span class="face" id="face">🥺</span></span><span class="d" aria-hidden="true">4</span></h1>
  <div class="subtitle" id="subtitle" aria-live="polite"></div>
  <div class="urlbar"><span class="screen" id="screen"></span><button class="pwr" id="pwr" type="button" aria-label="Turn the URL off and on again" title="turn it off and on again">⏻</button></div>
  <p class="msg"><span class="typed" id="typed"></span><span class="caret" aria-hidden="true"></span></p>
  <nav class="links">
    <a href="/" id="home">Take me home 🏠</a>
    <a href="/infra.html">Infra Map 🗺️</a>
  </nav>
</main>

<div class="dancers" aria-hidden="true">
  <span class="dancer" style="--d:0s">🕺</span><span class="dancer" style="--d:.1s">💃</span><span class="dancer" style="--d:.2s">🕺</span><span class="dancer" style="--d:.3s">💃</span><span class="dancer" style="--d:.4s">🕺</span><span class="dancer" style="--d:.05s">💃</span><span class="dancer" style="--d:.15s">🕺</span><span class="dancer" style="--d:.25s">💃</span><span class="dancer" style="--d:.35s">🕺</span><span class="dancer" style="--d:.45s">🕺</span><span class="dancer" style="--d:.12s">💃</span>
</div>
<div class="hint">press 'd' for disco · click 404 to shake · ⏻ fixes nothing · try the konami code</div>

<script>
(()=>{
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const root = document.documentElement;

/* ---------- canvas world ---------- */
const cv = $('sky'), cx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const pointer={x:W/2,y:H/2,tx:W/2,ty:H/2,vx:0,vy:0,down:false,seen:false};
addEventListener('pointermove',e=>{pointer.vx=e.clientX-pointer.tx;pointer.vy=e.clientY-pointer.ty;pointer.tx=e.clientX;pointer.ty=e.clientY;pointer.seen=true});

// emoji sprite cache
const sprites=new Map();
function sprite(ch,px){const k=ch+px;let s=sprites.get(k);if(s)return s;const c=document.createElement('canvas');const p=Math.ceil(px*1.4);c.width=c.height=p*DPR;const g=c.getContext('2d');g.scale(DPR,DPR);g.font=`${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(ch,p/2,p/2+px*.06);s={c,p};sprites.set(k,s);return s}

// stars, 3 depth layers
const stars=[];for(let i=0;i<240;i++){const z=Math.random();stars.push({x:Math.random(),y:Math.random(),z,r:.4+z*1.7,tw:rnd(0,6.28),sp:rnd(.6,2.2),h:rnd(220,290)})}
const shooters=[];
// debris
const EMO=['✨','💫','🌟','⭐','🦋','🌸','💀','👽','🍕','🔥','💖','🌈','🎀','🍄','👾','🫠','🤡','🐛','🎃','🦄','🍩','🧸','💎','🪐','🌙','🐸','🎪','🧁'];
const debris=[];
function spawnDebris(edge=true,x,y,burst){const size=rnd(18,34);let px,py;
  if(edge){const s=Math.floor(Math.random()*4);px=s===0?-40:s===1?W+40:rnd(0,W);py=s===2?-40:s===3?H+40:rnd(0,H);if(s<2)py=rnd(0,H);}else{px=x;py=y}
  const a=Math.atan2(H/2-py,W/2-px)+rnd(-1.1,1.1),sp=burst?rnd(4,11):rnd(.3,.9);
  debris.push({ch:pick(EMO),x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:rnd(0,6.28),vr:rnd(-.03,.03),size,life:1,eaten:0,alpha:0})}
const DEBRIS_N = RM?0:Math.round(Math.min(34,Math.max(16,W*H/48000)));
for(let i=0;i<DEBRIS_N;i++){spawnDebris(false,rnd(0,W),rnd(0,H));debris[i].alpha=.55}

// particles (sparkles, shockwaves, trail)
const parts=[],rings=[];
function spark(x,y,n=10,spd=4,hue){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(.3,1)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rnd(.012,.03),r:rnd(1,2.6),h:hue??rnd(300,420)%360})}}

// portal = the 0
const zero=$('zero');let P={x:W/2,y:H/2,r:60};
function portalRect(){const b=zero.getBoundingClientRect();P.x=b.left+b.width/2;P.y=b.top+b.height*.55;P.r=b.width*.36}

let disco=false,nyan=0,flip=false,trauma=0,t0=performance.now(),last=t0;
const nyanTrail=[];

function frame(now){
  const dt=Math.min(40,now-last)/16.67;last=now;const t=(now-t0)/1000;
  pointer.x+=(pointer.tx-pointer.x)*.18*dt;pointer.y+=(pointer.ty-pointer.y)*.18*dt;
  portalRect();
  cx.clearRect(0,0,W,H);
  // nyan background
  if(nyan>0){nyan-=dt/60;const g=cx.createLinearGradient(0,((t*300)%(H*2))-H*2,0,((t*300)%(H*2))+H*2);['#ff6b6b','#ffa751','#ffe259','#7bed9f','#70a1ff','#a29bfe','#ff6b6b','#ffa751','#ffe259','#7bed9f','#70a1ff','#a29bfe'].forEach((c,i,a)=>g.addColorStop(i/(a.length-1),c));cx.globalAlpha=Math.min(1,nyan)*.55;cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.globalAlpha=1}
  // stars with parallax
  const px=(pointer.x/W-.5),py=(pointer.y/H-.5);
  for(const s of stars){const tw=RM?.7:.45+.55*Math.sin(t*s.sp*(disco?4:1)+s.tw);let x=(s.x*W - px*s.z*40 + W)%W, y=(s.y*H - py*s.z*30 + H)%H;
    cx.globalAlpha=tw*(.35+s.z*.65);cx.fillStyle=`hsl(${s.h},80%,${70+s.z*20}%)`;cx.beginPath();cx.arc(x,y,s.r,0,6.283);cx.fill()}
  cx.globalAlpha=1;
  // shooting stars
  if(!RM&&Math.random()<.004*dt)shooters.push({x:rnd(W*.2,W),y:rnd(0,H*.4),vx:-rnd(9,15),vy:rnd(3,6),life:1});
  for(let i=shooters.length-1;i>=0;i--){const s=shooters[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=.02*dt;const g=cx.createLinearGradient(s.x,s.y,s.x-s.vx*6,s.y-s.vy*6);g.addColorStop(0,`rgba(255,255,255,${s.life})`);g.addColorStop(1,'rgba(255,255,255,0)');cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*6,s.y-s.vy*6);cx.stroke();if(s.life<=0)shooters.splice(i,1)}
  // portal accretion glow
  if(!RM){const spin=t*(disco?5:1.4);const R=P.r;
    const glow=cx.createRadialGradient(P.x,P.y,R*.2,P.x,P.y,R*2.4);glow.addColorStop(0,'rgba(162,155,254,.28)');glow.addColorStop(.5,'rgba(255,107,157,.08)');glow.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=glow;cx.beginPath();cx.arc(P.x,P.y,R*2.4,0,6.283);cx.fill();
    for(let k=0;k<3;k++){const rr=R*(1.25+k*.32);cx.lineWidth=1.4;for(let j=0;j<24;j++){const a=spin*(1-k*.25)+j*.2618+k;const hue=(300+j*6+k*40+t*40)%360;cx.strokeStyle=`hsla(${hue},90%,70%,${.18-k*.04})`;cx.beginPath();cx.arc(P.x,P.y,rr,a,a+.14);cx.stroke()}}}
  // debris physics
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];
    const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy)||1;
    // gravity well + tangential swirl
    const g=Math.min(.12,26/dist)*(disco?2.2:1);d.vx+=(dx/dist*g + -dy/dist*g*.9)*dt*.35;d.vy+=(dy/dist*g + dx/dist*g*.9)*dt*.35;
    // pointer repulsion
    const qx=d.x-pointer.x,qy=d.y-pointer.y,qd=Math.hypot(qx,qy);if(qd<130&&pointer.seen){const f=(130-qd)/130*.9;d.vx+=qx/qd*f*dt;d.vy+=qy/qd*f*dt}
    const damp=Math.pow(.992,dt);d.vx*=damp;d.vy*=damp;
    const spd=Math.hypot(d.vx,d.vy),max=disco?9:5.5;if(spd>max){d.vx*=max/spd;d.vy*=max/spd}
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt+(dist<P.r*3?.02*dt:0);
    d.alpha=Math.min(.6,d.alpha+.01*dt);
    let sc=1;if(dist<P.r*1.1){d.eaten+=.06*dt;sc=Math.max(0,1-d.eaten)}
    if(d.eaten>=1){spark(P.x,P.y,6,3);debris.splice(i,1);spawnDebris(true);pulseFace();continue}
    if(d.x<-120||d.x>W+120||d.y<-120||d.y>H+120){debris.splice(i,1);spawnDebris(true);continue}
    const s=sprite(d.ch,Math.round(d.size));cx.save();cx.globalAlpha=d.alpha*(dist<P.r*2?.9:1);cx.translate(d.x,d.y);cx.rotate(d.rot);cx.scale(sc,sc);cx.drawImage(s.c,-s.p/2,-s.p/2,s.p,s.p);cx.restore()}
  // shockwave rings
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=r.v*dt;r.v*=.95;r.life-=.03*dt;cx.strokeStyle=`hsla(${r.h},90%,75%,${r.life*.8})`;cx.lineWidth=3*r.life+.5;cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.283);cx.stroke();if(r.life<=0)rings.splice(i,1)}
  // sparkle trail
  if(!RM&&pointer.seen&&Math.hypot(pointer.vx,pointer.vy)>2&&Math.random()<.7){parts.push({x:pointer.tx,y:pointer.ty,vx:rnd(-.4,.4),vy:rnd(-.2,.6),life:1,decay:.03,r:rnd(1,2.2),h:rnd(280,380)%360,star:true})}
  pointer.vx*=.5;pointer.vy*=.5;
  // nyan rainbow trail
  if(nyan>0){nyanTrail.push({x:pointer.x,y:pointer.y});if(nyanTrail.length>40)nyanTrail.shift();const cols=['#ff6b6b','#ffa751','#ffe259','#7bed9f','#70a1ff','#a29bfe'];cols.forEach((c,ci)=>{cx.strokeStyle=c;cx.lineWidth=5;cx.beginPath();nyanTrail.forEach((p,pi)=>{const y=p.y+(ci-2.5)*5+Math.sin(pi*.6+t*12)*2;pi?cx.lineTo(p.x,y):cx.moveTo(p.x,y)});cx.stroke()})}else nyanTrail.length=0;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.04*dt;p.vx*=.98;p.life-=p.decay*dt;if(p.life<=0){parts.splice(i,1);continue}
    cx.fillStyle=`hsla(${p.h},95%,75%,${p.life})`;if(p.star){const r=p.r*2.2*p.life;cx.beginPath();cx.moveTo(p.x,p.y-r);cx.lineTo(p.x+r*.3,p.y-r*.3);cx.lineTo(p.x+r,p.y);cx.lineTo(p.x+r*.3,p.y+r*.3);cx.lineTo(p.x,p.y+r);cx.lineTo(p.x-r*.3,p.y+r*.3);cx.lineTo(p.x-r,p.y);cx.lineTo(p.x-r*.3,p.y-r*.3);cx.fill()}else{cx.beginPath();cx.arc(p.x,p.y,p.r*p.life+.3,0,6.283);cx.fill()}}
  animateDOM(t,dt);
  requestAnimationFrame(frame);
}

/* ---------- DOM springs ---------- */
const content=$('content'),ghost=$('ghost'),digits=[...document.querySelectorAll('.d')],face=$('face');
const dig=digits.map((el,i)=>({el,y:0,v:0,s:0,sv:0,ph:i*1.9,hov:0}));
const G={x:0,y:0,vx:0,vy:0};const F={s:1,v:0,x:0,y:0};
digits.forEach((el,i)=>{el.addEventListener('pointerenter',()=>{dig[i].sv-=.18;dig[i].v-=4})});
function animateDOM(t,dt){
  // digits: spring toward bob target, squash from velocity
  const bgpos=(t*(disco?160:22))%700;
  dig.forEach(d=>{const target=RM?0:Math.sin(t*1.7+d.ph)*6;d.v+=((target-d.y)*.12-d.v*.18)*dt;d.y+=d.v*dt;d.sv+=((0-d.s)*.2-d.sv*.22)*dt;d.s+=d.sv*dt;
    const sq=Math.max(-.25,Math.min(.25,d.v*.018+d.s));const rot=RM?0:Math.sin(t*1.3+d.ph)*(disco?6:2.2);
    d.el.style.transform=`translateY(${d.y.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${(1+sq).toFixed(3)},${(1-sq).toFixed(3)})`;d.el.style.backgroundPosition=`${bgpos}% 50%`});
  // face: pop spring + look toward pointer
  F.v+=((1-F.s)*.2-F.v*.25)*dt;F.s+=F.v*dt;
  const lx=pointer.seen?Math.max(-1,Math.min(1,(pointer.x-P.x)/300)):0,ly=pointer.seen?Math.max(-1,Math.min(1,(pointer.y-P.y)/300)):0;
  F.x+=(lx*9-F.x)*.12*dt;F.y+=(ly*7-F.y)*.12*dt;
  face.style.transform=`translate(calc(-50% + ${F.x.toFixed(1)}px),calc(-50% + ${(F.y+dig[1].y).toFixed(1)}px)) scale(${F.s.toFixed(3)}) rotate(${(F.x*1.4).toFixed(1)}deg)`;
  // ghost: lagging follow with lean
  const gx=pointer.seen?(pointer.x/W-.5)*60:0,gy=pointer.seen?(pointer.y/H-.5)*30:0;
  G.vx+=((gx-G.x)*.03-G.vx*.12)*dt;G.vy+=((gy-G.y)*.03-G.vy*.12)*dt;G.x+=G.vx*dt;G.y+=G.vy*dt;
  const bob=RM?0:Math.sin(t*2.1)*10;ghost.style.transform=`translate(${G.x.toFixed(1)}px,${(G.y+bob).toFixed(1)}px) rotate(${(G.vx*4).toFixed(1)}deg)`;
  ghost.style.setProperty('--ghue',((t*45)%360).toFixed(0)+'deg');
  // screen shake (trauma model)
  trauma=Math.max(0,trauma-.022*dt);const sh=RM?0:trauma*trauma;
  const ox=sh*18*(Math.sin(t*61)+Math.sin(t*37))/2,oy=sh*14*(Math.sin(t*53)+Math.sin(t*29))/2,orr=sh*3*Math.sin(t*47);
  content.style.transform=`translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px) rotate(${(orr+(flip?180:0)).toFixed(2)}deg)`;
  if(disco)root.style.setProperty('--hue',((t*180)%360).toFixed(0)+'deg');
}
function pulseFace(){F.v+=.06}

/* ---------- faces + subtitles (paired) ---------- */
const PAIRS=[['🥺','oopsie woopsie!!'],['🍝','uh oh spaghetti-o'],['😵‍💫','bruh moment'],['💀','not found bestie'],['👀',"where'd it go??"],['😳','pain.'],['🙃',"this ain't it chief"],['😭','yikes forever'],['🫣','well this is awkward'],['🫠','melting rn'],['🤯','the page? gone. reduced to atoms.']];
const COLORS=['var(--pink)','var(--orange)','var(--green)','var(--blue)','var(--violet)','var(--yellow)'];
const sub=$('subtitle');let pi=Math.floor(Math.random()*PAIRS.length),ci=0,holdUntil=0;
function setSub(text,color){sub.style.color=color;sub.innerHTML='';let i=0;text.split(' ').forEach((word,wi)=>{if(wi)sub.appendChild(document.createTextNode(' '));const w=document.createElement('span');w.className='w';[...word].forEach(ch=>{const s=document.createElement('span');s.className='c';s.textContent=ch;s.style.animationDelay=(i++*28)+'ms';w.appendChild(s)});i++;sub.appendChild(w)})}
function setFace(ch){face.textContent=ch;F.s=.25;F.v=.18}
function nextPair(force){if(!force&&performance.now()<holdUntil)return;pi=(pi+1)%PAIRS.length;ci=(ci+1)%COLORS.length;setFace(PAIRS[pi][0]);setSub(PAIRS[pi][1],COLORS[ci])}
setFace(PAIRS[pi][0]);setSub(PAIRS[pi][1],COLORS[0]);
setInterval(nextPair,3000);

/* ---------- typed messages ---------- */
const MSGS=["this page went to get milk and never came back...","you've wandered into the shadow realm. it's cozy here tho.","the bits you're looking for have been vibing elsewhere.","404'd. certified bruh moment.","this URL is giving nothing","sir this is a wendy's","the page is in another castle","you've reached the edge of the internet. there be dragons.","this page left the chat.","error: page machine broke","have you tried turning the URL off and on again?","the page you seek exists only in your imagination.","plot twist: the 404 was inside you all along.","this page is on its villain arc. not coming back.","the server said nah fam.","the black hole in the 0 ate it. it's been eating all day."];
const typed=$('typed');let queue=[...MSGS].sort(()=>Math.random()-.5),typing=null;
function typeLoop(){const m=queue.shift();queue.push(m);let i=0;const tick=()=>{typed.textContent=m.slice(0,++i);if(i<m.length)typing=setTimeout(tick,RM?0:32+Math.random()*45);else typing=setTimeout(erase,6500)};const erase=()=>{const s=typed.textContent;if(!s.length){typing=setTimeout(typeLoop,350);return}typed.textContent=s.slice(0,-2);typing=setTimeout(erase,14)};tick()}
function sayNow(m,hold=5000){clearTimeout(typing);typed.textContent='';let i=0;const tick=()=>{typed.textContent=m.slice(0,++i);if(i<m.length)typing=setTimeout(tick,28);else typing=setTimeout(()=>{typeLoop()},hold)};tick()}
setTimeout(typeLoop,700);

/* ---------- the URL, off and on again ---------- */
const screen=$('screen'),pwr=$('pwr'),home=$('home');
const path=(location.pathname+location.search)||'/';
screen.innerHTML=`${location.host?location.host.replace(/^www\./,''):'this-site'}<b>${path.length>1?path.replace(/[<>&]/g,''):'/???'}</b>`;
let cycles=0,busy=false;
setTimeout(()=>pwr.classList.add('nag'),4000);
pwr.addEventListener('click',e=>{e.stopPropagation();if(busy)return;busy=true;pwr.classList.remove('nag');cycles++;
  screen.classList.remove('on');void screen.offsetWidth;screen.classList.add('off');
  const r=screen.getBoundingClientRect();
  setTimeout(()=>{spark(r.left+r.width/2,r.top+r.height/2,14,3,0);trauma=Math.min(1,trauma+.25)},420);
  setTimeout(()=>{screen.classList.remove('off');void screen.offsetWidth;screen.classList.add('on')},1100);
  setTimeout(()=>{busy=false;holdUntil=performance.now()+5000;
    if(cycles===1){setFace('🔌');setSub('nope. still 404.','var(--orange)');sayNow('turned it off. turned it on. the page is still not there.')}
    else if(cycles===2){setFace('😐');setSub('still nothing.','var(--yellow)');sayNow('doing the same thing twice and expecting a different result, bold.')}
    else{setFace('🫡');setSub("ok it's really gone.",'var(--pink)');sayNow('best move from here: the pink button.',9000);home.classList.add('pulse')}
    },1850);
});

/* ---------- click: shockwave; 404 click: shake ---------- */
function shock(x,y,power=1){rings.push({x,y,r:6,v:9*power,life:1,h:rnd(300,400)%360});spark(x,y,Math.round(12*power),4*power);
  for(const d of debris){const dx=d.x-x,dy=d.y-y,dist=Math.hypot(dx,dy)||1;if(dist<320*power){const f=(320*power-dist)/(320*power)*9*power;d.vx+=dx/dist*f;d.vy+=dy/dist*f;d.vr+=rnd(-.15,.15)}}}
addEventListener('pointerdown',e=>{if(e.target.closest('a,button,h1'))return;shock(e.clientX,e.clientY,.8)});
let shakes=0;const code=$('the404');
function shakeIt(){trauma=Math.min(1,trauma+.55);shakes++;
  dig.forEach((d,i)=>{d.v-=rnd(9,15);d.sv+=.22;setTimeout(()=>{},i*60)});
  shock(P.x,P.y,1.3);for(let i=0;i<8;i++)spawnDebris(false,P.x+rnd(-20,20),P.y+rnd(-20,20),true);
  while(debris.length>DEBRIS_N+24)debris.shift();
  nextPair(true);
  if(shakes>=10){shakes=0;flip=true;content.style.transition='transform 1.6s cubic-bezier(.68,-.55,.27,1.55)';setSub('gravity has left the chat','var(--green)');setTimeout(()=>{flip=false},4000);setTimeout(()=>content.style.transition='',5800)}}
code.addEventListener('click',shakeIt);
code.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();shakeIt()}});

/* ---------- magnetic buttons ---------- */
document.querySelectorAll('.links a').forEach(a=>{
  a.addEventListener('pointermove',e=>{const b=a.getBoundingClientRect();const x=(e.clientX-b.left-b.width/2)*.25,y=(e.clientY-b.top-b.height/2)*.35;a.style.transform=`translate(${x}px,${y}px) scale(1.05)`});
  a.addEventListener('pointerleave',()=>{a.style.transition='transform .5s cubic-bezier(.2,1.6,.4,1)';a.style.transform='';setTimeout(()=>a.style.transition='',500)});
});

/* ---------- disco + konami ---------- */
addEventListener('keydown',e=>{
  if((e.key==='d'||e.key==='D')&&!e.metaKey&&!e.ctrlKey){disco=!disco;root.classList.toggle('disco',disco);if(!disco)root.style.setProperty('--hue','0deg');else{setSub('DISCO MODE','var(--yellow)');holdUntil=performance.now()+2500}}
});
const K=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let ki=0;
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k===K[ki]){ki++;if(ki===K.length){ki=0;nyan=8;setFace('🐱');setSub('nyan mode unlocked','var(--pink)');holdUntil=performance.now()+6000;for(let i=0;i<40;i++)setTimeout(()=>spawnDebris(false,rnd(0,W),-30,true),i*60)}}else ki=k===K[0]?1:0});

requestAnimationFrame(frame);
})();
</script>
