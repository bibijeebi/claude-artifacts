<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in the Void</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;height:100%;width:100%}
body{
  font-family:'IBM Plex Mono',monospace;
  background:#0a0c10;
  color:#c8cdd5;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  position:relative;
}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.content{
  position:relative;z-index:1;
  text-align:center;
  padding:2rem;
  max-width:600px;
}
.code{
  font-size:clamp(6rem,20vw,10rem);
  font-weight:700;
  line-height:1;
  color:transparent;
  background:linear-gradient(135deg,#3b82f6 0%,#22d3ee 50%,#a78bfa 100%);
  -webkit-background-clip:text;
  background-clip:text;
  margin-bottom:0.5rem;
  animation:glitch 3s infinite;
  position:relative;
}
.code::before,.code::after{
  content:'404';
  position:absolute;left:0;top:0;width:100%;height:100%;
  background:inherit;-webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.code::before{
  animation:glitch-1 2s infinite linear alternate-reverse;
  clip-path:polygon(0 0,100% 0,100% 35%,0 35%);
}
.code::after{
  animation:glitch-2 2s infinite linear alternate-reverse;
  clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);
}
@keyframes glitch-1{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-3px,2px)}
  40%{transform:translate(3px,-1px)}
  60%{transform:translate(-1px,1px)}
  80%{transform:translate(2px,-2px)}
}
@keyframes glitch-2{
  0%,100%{transform:translate(0)}
  20%{transform:translate(3px,1px)}
  40%{transform:translate(-2px,-1px)}
  60%{transform:translate(1px,2px)}
  80%{transform:translate(-3px,-1px)}
}
.msg{
  font-size:1.1rem;
  color:#6b7280;
  margin-bottom:2rem;
  line-height:1.6;
}
.msg span{color:#e8ecf2}
.prompt{
  display:inline-flex;align-items:center;gap:0.5rem;
  font-size:0.85rem;color:#3b82f6;
  margin-bottom:1.5rem;
}
.prompt .cursor{
  display:inline-block;width:8px;height:1.1em;
  background:#3b82f6;
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.links{
  display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
}
.links a{
  font-size:0.8rem;
  color:#9ca3af;
  text-decoration:none;
  padding:0.5rem 1.2rem;
  border:1px solid #2a2e36;
  border-radius:4px;
  transition:all 0.2s;
}
.links a:hover{
  color:#e8ecf2;
  border-color:#3b82f6;
  background:rgba(59,130,246,0.08);
}
.links a .arrow{
  display:inline-block;
  transition:transform 0.2s;
}
.links a:hover .arrow{transform:translateX(3px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <div class="code">404</div>
  <div class="prompt">$ curl this-page <span class="cursor"></span></div>
  <div class="msg">
    <span>Nothing here.</span><br>
    The page you're looking for doesn't exist,<br>
    got moved, or never existed in the first place.
  </div>
  <div class="links">
    <a href="/">Home <span class="arrow">&rarr;</span></a>
    <a href="/infra.html">Infra Map <span class="arrow">&rarr;</span></a>
  </div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let w,h,particles=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight;init()}
function init(){
  particles=[];
  const count=Math.floor((w*h)/8000);
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*w,
      y:Math.random()*h,
      vx:(Math.random()-0.5)*0.3,
      vy:(Math.random()-0.5)*0.3,
      r:Math.random()*1.5+0.5,
      o:Math.random()*0.4+0.1
    });
  }
}
function draw(){
  x.clearRect(0,0,w,h);
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=w;if(p.x>w)p.x=0;
    if(p.y<0)p.y=h;if(p.y>h)p.y=0;
    x.beginPath();
    x.arc(p.x,p.y,p.r,0,Math.PI*2);
    x.fillStyle=`rgba(59,130,246,${p.o})`;
    x.fill();
    for(let j=i+1;j<particles.length;j++){
      const q=particles[j];
      const dx=p.x-q.x,dy=p.y-q.y;
      const dist=dx*dx+dy*dy;
      if(dist<12000){
        x.beginPath();
        x.moveTo(p.x,p.y);
        x.lineTo(q.x,q.y);
        x.strokeStyle=`rgba(59,130,246,${0.06*(1-dist/12000)})`;
        x.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
addEventListener('resize',resize);
resize();draw();
</script>
</body>
</html>
