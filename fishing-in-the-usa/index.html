<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fishing in the USA — 90,000+ Spots Across 43 States</title>
<meta property="og:title" content="Fishing in the USA">
<meta property="og:description" content="The most comprehensive fishing database in America. 90,000+ spots across 43 states.">
<meta property="og:url" content="https://niggerfaggot.club/fishing-in-the-usa/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1a12;--card:#142b1e;--card2:#1a3626;--card3:#1f4030;--text:#e8efe9;--text2:#9ab5a2;--text3:#6a8a72;--accent:#4ade80;--border:rgba(255,255,255,.08);--glass:rgba(10,26,18,.92);--gold:#d4a843}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
h1,h2{font-family:'DM Serif Display',serif;font-weight:400}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
#app{display:flex;height:100vh;width:100vw}
#map{flex:1;height:100%;background:#0a1a12}
.leaflet-container{background:#0a1a12!important}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#666!important;font-size:10px!important}
.leaflet-control-attribution a{color:#888!important}

/* Custom cluster styles */
.marker-cluster{background:none!important}
.marker-cluster div{width:36px;height:36px;margin-left:-2px;margin-top:-2px;text-align:center;border-radius:50%;font:700 12px 'DM Sans',sans-serif;color:#fff;line-height:36px;background:rgba(15,15,15,.8);border:2px solid rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.marker-cluster-small div{width:32px;height:32px;line-height:32px;font-size:11px}
.marker-cluster-medium div{width:40px;height:40px;line-height:40px;font-size:13px}
.marker-cluster-large div{width:48px;height:48px;line-height:48px;font-size:14px}
/* Spiderfy lines */
.leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{transition:transform .3s ease-out,opacity .3s ease-in}

/* Custom point markers */
.fish-marker{border-radius:50%;border:2px solid rgba(0,0,0,.5);box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;transition:transform .1s}
.fish-marker:hover{transform:scale(1.3);z-index:9999!important}

/* Sidebar */
#sidebar{width:400px;height:100vh;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:1000;overflow:hidden;transition:transform .3s}
.brand{padding:1rem 1.2rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.brand-left h1{font-size:1.2rem;line-height:1.1}.brand-left h1 span{color:var(--gold)}
.brand-left .tagline{font-size:.65rem;color:var(--text3);letter-spacing:.04em;margin-top:1px}
.brand-right b{color:var(--gold);font-size:.9rem;font-family:'DM Serif Display',serif}
.panel{display:none;flex-direction:column;flex:1;overflow:hidden}.panel.active{display:flex}
.search-wrap{padding:.6rem 1rem;flex-shrink:0}
.search-wrap input{width:100%;padding:.5rem .75rem;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none}
.search-wrap input:focus{border-color:var(--accent)}.search-wrap input::placeholder{color:var(--text3)}
.state-list{flex:1;overflow-y:auto;padding:0 1rem .8rem}.sli{display:flex;flex-direction:column;gap:3px}
.si{display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;background:var(--card);border:1px solid transparent;border-radius:8px;cursor:pointer;transition:all .12s}
.si:hover{border-color:var(--accent);background:var(--card2)}.si .nm{font-weight:500;font-size:.85rem}.si .ct{font-size:.72rem;color:var(--text3);background:rgba(255,255,255,.05);padding:1px 7px;border-radius:5px}
.state-bar{padding:.7rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.state-bar-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.back{background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.1rem;padding:2px;font-family:'DM Sans',sans-serif}.back:hover{color:var(--accent)}
.state-bar h2{font-size:1.3rem;flex:1}.state-bar .ss{display:flex;flex-wrap:wrap;gap:.3rem .7rem;font-size:.75rem;color:var(--text3)}.state-bar .ss b{color:var(--text)}
.filter-bar{padding:.5rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.type-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.tbtn{padding:3px 8px;border-radius:5px;font-size:.7rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text3);font-family:'DM Sans',sans-serif;transition:all .1s;display:flex;align-items:center;gap:4px}
.tbtn:hover{border-color:var(--accent)}.tbtn.on{border-color:var(--accent);color:var(--text);background:rgba(74,222,128,.1)}
.tbtn .d{width:7px;height:7px;border-radius:50%}
.amenity-row{display:flex;gap:3px;flex-wrap:wrap}
.abtn{padding:2px 7px;border-radius:4px;font-size:.65rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text3);font-family:'DM Sans',sans-serif;transition:all .1s}
.abtn:hover{border-color:var(--accent)}.abtn.on{border-color:var(--accent);color:var(--accent);background:rgba(74,222,128,.1)}
.vp-info{padding:.4rem 1rem;font-size:.72rem;color:var(--text3);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between}
.point-scroll{flex:1;overflow-y:auto;padding:.3rem .6rem .6rem}
.pi{padding:.55rem .7rem;background:var(--card);border-radius:7px;cursor:pointer;border:1px solid transparent;transition:all .1s;margin-bottom:3px}
.pi:hover{border-color:rgba(74,222,128,.3);background:var(--card2)}.pi.selected{border-color:var(--accent);background:var(--card3)}
.pi .pn{font-weight:500;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pi .pn .td{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pi .pm{font-size:.7rem;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px}
.pi .pb{display:flex;gap:3px;margin-top:3px;padding-left:14px;flex-wrap:wrap}
.pi .b{font-size:.58rem;padding:1px 5px;border-radius:3px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text3)}.pi .b.y{background:rgba(0,229,255,.12);color:#00e5ff}
.pi .detail{display:none;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border);padding-left:14px;font-size:.78rem;color:var(--text2);line-height:1.6}
.pi.selected .detail{display:block}
.pi .detail .row{display:flex;gap:.4rem}.pi .detail .lbl{color:var(--text3);min-width:65px;flex-shrink:0}
.pi .detail .gm{display:inline-block;margin-top:.4rem;padding:.3rem .7rem;background:var(--accent);color:var(--bg);border-radius:5px;font-size:.72rem;font-weight:600}.pi .detail .gm:hover{opacity:.85;text-decoration:none}
.load-more{display:block;width:100%;padding:.45rem;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.75rem;text-align:center;margin-top:2px}.load-more:hover{border-color:var(--accent);color:var(--accent)}
#mtoggle{display:none;position:fixed;top:10px;left:10px;z-index:2000;width:40px;height:40px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:18px;cursor:pointer;text-align:center;line-height:40px}
@media(max-width:768px){#sidebar{position:fixed;left:0;top:0;width:88vw;max-width:380px;z-index:1500;transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#mtoggle{display:block}}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button id="mtoggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
<div id="app">
<div id="sidebar">
  <div class="brand"><div class="brand-left"><h1>Fishing in <span>the USA</span></h1><div class="tagline">90,000+ spots &middot; 43 states</div></div><div class="brand-right" id="brand-stats"></div></div>
  <div class="panel active" id="panel-states">
    <div class="search-wrap"><input type="text" placeholder="Search states..." oninput="filterStates(this.value)"></div>
    <div class="state-list"><div class="sli" id="state-list"></div></div>
  </div>
  <div class="panel" id="panel-state">
    <div class="state-bar"><div class="state-bar-top"><button class="back" onclick="backToList()">&larr;</button><h2 id="st-name"></h2></div><div class="ss" id="st-stats"></div></div>
    <div class="filter-bar"><div class="type-row" id="type-row"></div><div class="amenity-row" id="amenity-row"></div></div>
    <div class="vp-info"><span id="vp-count"></span><span>pan/zoom to filter</span></div>
    <div class="point-scroll" id="point-scroll"></div>
  </div>
</div>
<div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const DB='data/',COL={access:'#00e5ff',attractors:'#ffab00',trout:'#ff4081',reefs:'#ff6e40',waterbodies:'#69f0ae',stocking:'#b388ff'};
const TL={access:'Access Sites',attractors:'Fish Attractors',trout:'Trout Waters',reefs:'Reefs',waterbodies:'Waterbodies',stocking:'Stocking'};
const SN={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming'};
const CTR={AL:[32.8,-86.8],AK:[64,-153],AR:[34.8,-92.4],CA:[37.2,-119.4],CO:[39,-105.5],CT:[41.6,-72.7],DE:[39,-75.5],FL:[28.7,-81.7],GA:[32.6,-83.4],HI:[20,-155.5],ID:[44.4,-114.7],IN:[40,-86.3],IA:[42,-93.5],KY:[37.8,-85.3],LA:[31,-91.8],ME:[45.4,-69.2],MD:[39.05,-76.6],MA:[42.3,-71.8],MI:[44.3,-84.5],MN:[46.3,-94.3],MS:[32.7,-89.7],MO:[38.4,-92.5],MT:[47,-109.6],NE:[41.5,-99.8],NH:[43.7,-71.6],NJ:[40.1,-74.7],NM:[34.5,-106],NY:[43,-75.5],NC:[35.5,-79.4],ND:[47.5,-100.5],OH:[40.4,-82.7],OR:[44,-120.5],PA:[41,-77.6],RI:[41.7,-71.5],SC:[34,-80.9],TN:[35.8,-86.3],TX:[31.5,-99.3],UT:[39.3,-111.7],VT:[44,-72.6],VA:[37.5,-79.4],WA:[47.5,-120.7],WV:[38.6,-80.6],WI:[44.6,-89.8]};
const SZM={AK:4,HI:7,TX:6,CA:6,MT:6,FL:6,RI:9,DE:9,CT:9,NJ:8,MA:8,NH:8,VT:8,MD:8,WV:7};

let idx=[],map,darkTiles,satTiles,labelTiles,statesLayer,clusterGroup;
let curSt=null,curD=null,aTypes=new Set(),aFilt={ramp:0,dock:0,pier:0,ada:0,camping:0};
let selId=null,listLim=80,vpFeats=[];

async function init(){
  idx=await(await fetch(DB+'index.json')).json();
  document.getElementById('brand-stats').innerHTML=`<b>${idx.reduce((s,x)=>s+x.total,0).toLocaleString()}</b> records`;
  renderStates();initMap();
}

function renderStates(f=''){
  const s=[...idx].sort((a,b)=>b.total-a.total);
  const fl=f?s.filter(x=>x.name.toLowerCase().includes(f)||x.id.toLowerCase().includes(f)):s;
  document.getElementById('state-list').innerHTML=fl.map(x=>`<div class="si" onclick="selState('${x.id}')"><span class="nm">${x.name}</span><span class="ct">${x.total.toLocaleString()}</span></div>`).join('');
}
function filterStates(v){renderStates(v.toLowerCase())}

function initMap(){
  map=L.map('map',{center:[39,-98],zoom:4,zoomControl:false,attributionControl:false});
  L.control.attribution({position:'bottomright',prefix:false}).addTo(map);
  L.control.zoom({position:'topright'}).addTo(map);

  darkTiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; CARTO, &copy; OSM',maxZoom:19,subdomains:'abcd'}).addTo(map);

  satTiles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Esri, Maxar, Earthstar',maxZoom:19});

  labelTiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{
    maxZoom:19,subdomains:'abcd',pane:'shadowPane'});

  // Load states GeoJSON
  loadStates();

  // Viewport change -> update sidebar
  map.on('moveend',onVP);

  if(location.hash){const st=location.hash.slice(1).toUpperCase();if(idx.find(x=>x.id===st))setTimeout(()=>selState(st),500)}
}

async function loadStates(){
  try{
    const us=await(await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')).json();
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/topojson-client@3';
    s.onload=()=>{
      const geo=topojson.feature(us,us.objects.states);
      const FP={1:'AL',2:'AK',4:'AZ',5:'AR',6:'CA',8:'CO',9:'CT',10:'DE',12:'FL',13:'GA',15:'HI',16:'ID',17:'IL',18:'IN',19:'IA',20:'KS',21:'KY',22:'LA',23:'ME',24:'MD',25:'MA',26:'MI',27:'MN',28:'MS',29:'MO',30:'MT',31:'NE',32:'NV',33:'NH',34:'NJ',35:'NM',36:'NY',37:'NC',38:'ND',39:'OH',40:'OK',41:'OR',42:'PA',44:'RI',45:'SC',46:'SD',47:'TN',48:'TX',49:'UT',50:'VT',51:'VA',53:'WA',54:'WV',55:'WI',56:'WY'};
      for(const f of geo.features){f.properties.abbr=FP[f.id]||'';const i=idx.find(x=>x.id===f.properties.abbr);f.properties.total=i?i.total:0}
      statesLayer=L.geoJSON(geo,{
        style:f=>{const t=f.properties.total;const c=t>10000?'#4ade80':t>5000?'#2d9a50':t>2000?'#22713f':t>500?'#1e4d32':t>0?'#1a3626':'rgba(255,255,255,0.03)';
          return{fillColor:c,fillOpacity:.6,color:'rgba(255,255,255,0.12)',weight:1}},
        onEachFeature:(f,layer)=>{
          const abbr=f.properties.abbr,name=SN[abbr]||'',i=idx.find(x=>x.id===abbr);
          if(name)layer.bindTooltip(`<b>${name}</b><br>${i?i.total.toLocaleString()+' records':'No data'}`,{sticky:true,className:'state-tip'});
          layer.on('click',()=>{if(i)selState(abbr)});
          layer.on('mouseover',()=>layer.setStyle({fillOpacity:.8,weight:2,color:'#4ade80'}));
          layer.on('mouseout',()=>statesLayer.resetStyle(layer));
        }
      }).addTo(map);
    };
    document.head.appendChild(s);
  }catch(e){console.error(e)}
}

async function selState(id){
  curSt=idx.find(x=>x.id===id);if(!curSt)return;
  location.hash=id;listLim=80;selId=null;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('panel-states').classList.remove('active');
  document.getElementById('panel-state').classList.add('active');
  document.getElementById('st-name').textContent=curSt.name;
  document.getElementById('st-stats').innerHTML='';
  document.getElementById('type-row').innerHTML='';
  document.getElementById('amenity-row').innerHTML='';
  document.getElementById('point-scroll').innerHTML='<div class="spinner"></div>';
  document.getElementById('vp-count').textContent='Loading...';

  // Switch to satellite
  if(map.hasLayer(darkTiles))map.removeLayer(darkTiles);
  if(map.hasLayer(statesLayer))map.removeLayer(statesLayer);
  if(!map.hasLayer(satTiles))satTiles.addTo(map);
  if(!map.hasLayer(labelTiles))labelTiles.addTo(map);

  // Fly to state
  const c=CTR[id]||[39,-98],z=SZM[id]||6;
  map.flyTo(c,z,{duration:1.2});

  // Fetch
  try{curD=await(await fetch(DB+id.toLowerCase()+'.json')).json()}catch(e){curD={}}
  aTypes=new Set(Object.keys(TL).filter(k=>curD[k]&&curD[k].length));
  aFilt={ramp:0,dock:0,pier:0,ada:0,camping:0};

  let sh='';for(const[k,l]of Object.entries(TL)){if(curD[k]&&curD[k].length)sh+=`<span><b>${curD[k].length.toLocaleString()}</b> ${l}</span>`}
  document.getElementById('st-stats').innerHTML=sh;
  renderFilterBar();
  plotPoints();
  renderAllPoints();
  setTimeout(onVP,1500);
}

function renderFilterBar(){
  let tr='';for(const[k,l]of Object.entries(TL)){if(!curD||!curD[k]||!curD[k].length)continue;tr+=`<button class="tbtn ${aTypes.has(k)?'on':''}" onclick="togType('${k}',this)"><span class="d" style="background:${COL[k]}"></span>${l}</button>`}
  document.getElementById('type-row').innerHTML=tr;
  let ar='';if(curD&&curD.access&&curD.access.length){for(const[k,l]of[['ramp','Ramp'],['dock','Dock'],['pier','Pier'],['ada','ADA'],['camping','Camp']])ar+=`<button class="abtn" onclick="togAmen('${k}',this)">${l}</button>`}
  document.getElementById('amenity-row').innerHTML=ar;
}
function togType(k,btn){if(aTypes.has(k))aTypes.delete(k);else aTypes.add(k);btn.classList.toggle('on');plotPoints();onVP()}
function togAmen(k,btn){aFilt[k]=aFilt[k]?0:1;btn.classList.toggle('on');plotPoints();onVP()}

function passFilter(type,r){
  if(!aTypes.has(type))return false;
  if(type==='access'&&(aFilt.ramp&&!r.ramp||aFilt.dock&&!r.dock||aFilt.pier&&!r.pier||aFilt.ada&&!r.ada||aFilt.camping&&!r.camping))return false;
  return true;
}

function plotPoints(){
  if(clusterGroup){map.removeLayer(clusterGroup);clusterGroup=null}
  if(!curD)return;

  clusterGroup=L.markerClusterGroup({
    maxClusterRadius:50,
    spiderfyOnMaxZoom:true,
    showCoverageOnHover:false,
    zoomToBoundsOnClick:true,
    spiderfyDistanceMultiplier:1.5,
    iconCreateFunction:function(cluster){
      const n=cluster.getChildCount();
      const sz=n>500?'large':n>50?'medium':'small';
      return L.divIcon({html:'<div>'+n+'</div>',className:'marker-cluster marker-cluster-'+sz,iconSize:[40,40]});
    }
  });

  for(const[type,recs]of Object.entries(curD)){
    if(!aTypes.has(type))continue;
    for(const r of recs){
      if(!r.lat||!r.lng)continue;
      if(!passFilter(type,r))continue;
      const color=COL[type];
      const icon=L.divIcon({className:'',html:`<div class="fish-marker" style="width:14px;height:14px;background:${color}"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
      const m=L.marker([r.lat,r.lng],{icon});
      m._fdata={...r,_t:type};
      m.on('click',function(){
        const d=this._fdata;
        // Find in vpFeats and select
        for(let i=0;i<vpFeats.length&&i<listLim;i++){
          if(vpFeats[i].lat===d.lat&&vpFeats[i].lng===d.lng){
            selId=`vp-${i}`;renderVPList();
            const el=document.getElementById(selId);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
            return;
          }
        }
        // Not in current viewport list, add it
        vpFeats.unshift(d);selId='vp-0';renderVPList();
        const el=document.getElementById('vp-0');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
      });
      clusterGroup.addLayer(m);
    }
  }
  map.addLayer(clusterGroup);
}

function renderAllPoints(){
  if(!curD)return;
  vpFeats=[];
  for(const[type,recs]of Object.entries(curD)){
    for(const r of recs){if(passFilter(type,r))vpFeats.push({...r,_t:type})}
  }
  document.getElementById('vp-count').textContent=`${vpFeats.length.toLocaleString()} total`;
  renderVPList();
}

function onVP(){
  if(!curD)return;
  const b=map.getBounds();
  vpFeats=[];
  for(const[type,recs]of Object.entries(curD)){
    if(!aTypes.has(type))continue;
    for(const r of recs){
      if(!r.lat||!r.lng)continue;
      if(!passFilter(type,r))continue;
      if(r.lat<b.getSouth()||r.lat>b.getNorth()||r.lng<b.getWest()||r.lng>b.getEast())continue;
      vpFeats.push({...r,_t:type});
    }
  }
  listLim=80;
  document.getElementById('vp-count').textContent=`${vpFeats.length.toLocaleString()} in view`;
  renderVPList();
}

function renderVPList(){
  const shown=vpFeats.slice(0,listLim),scroll=document.getElementById('point-scroll');
  scroll.innerHTML=shown.map((r,i)=>{
    const nm=r.name||r.waterbody||'Unknown',sub=[];
    if(r.county)sub.push(r.county);if(r.city)sub.push(r.city);
    if(r.waterbody&&r.waterbody!==nm)sub.push(r.waterbody);
    if(r.material)sub.push(r.material);if(r.type)sub.push(r.type);
    let badges='';
    if(r._t==='access'){
      if(r.ramp==1)badges+='<span class="b y">Ramp</span>';if(r.dock==1)badges+='<span class="b y">Dock</span>';
      if(r.pier==1)badges+='<span class="b y">Pier</span>';if(r.ada==1)badges+='<span class="b y">ADA</span>';
      if(r.camping==1)badges+='<span class="b y">Camp</span>';if(r.restroom==1)badges+='<span class="b y">WC</span>';
    }
    const sid=`vp-${i}`,isSel=selId===sid;
    let det='';
    if(r.lat&&r.lng)det+=`<div class="row"><span class="lbl">Coords</span>${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</div>`;
    if(r.owner)det+=`<div class="row"><span class="lbl">Owner</span>${esc(r.owner)}</div>`;
    if(r.manager)det+=`<div class="row"><span class="lbl">Manager</span>${esc(r.manager)}</div>`;
    if(r.ramp_type)det+=`<div class="row"><span class="lbl">Ramp</span>${esc(r.ramp_type)}</div>`;
    if(r.species)det+=`<div class="row"><span class="lbl">Species</span>${esc(r.species)}</div>`;
    if(r.fee)det+=`<div class="row"><span class="lbl">Fee</span>${esc(r.fee)}</div>`;
    if(r.regs)det+=`<div class="row"><span class="lbl">Regs</span>${esc(r.regs)}</div>`;
    if(r.designation)det+=`<div class="row"><span class="lbl">Desig.</span>${esc(r.designation)}</div>`;
    if(r.material&&r._t!=='access')det+=`<div class="row"><span class="lbl">Material</span>${esc(r.material)}</div>`;
    if(r.year)det+=`<div class="row"><span class="lbl">Year</span>${esc(r.year)}</div>`;
    if(r.acres)det+=`<div class="row"><span class="lbl">Acres</span>${r.acres}</div>`;
    if(r.depth)det+=`<div class="row"><span class="lbl">Depth</span>${r.depth}</div>`;
    if(r.lat&&r.lng)det+=`<a class="gm" href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">Google Maps &rarr;</a>`;
    return`<div class="pi${isSel?' selected':''}" id="${sid}" onclick="clickItem('${sid}',${r.lng||0},${r.lat||0})"><div class="pn"><span class="td" style="background:${COL[r._t]}"></span>${esc(nm)}</div>${sub.length?`<div class="pm">${esc(sub.join(' · '))}</div>`:''}${badges?`<div class="pb">${badges}</div>`:''}<div class="detail">${det}</div></div>`;
  }).join('');
  if(vpFeats.length>listLim)scroll.innerHTML+=`<button class="load-more" onclick="listLim+=80;renderVPList()">Show more (${(vpFeats.length-listLim).toLocaleString()} remaining)</button>`;
}

function clickItem(sid,lng,lat){
  selId=selId===sid?null:sid;
  renderVPList();
  if(selId&&lat&&lng)map.panTo([lat,lng],{duration:.5});
  if(selId){const el=document.getElementById(sid);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
}

function backToList(){
  curSt=null;curD=null;selId=null;location.hash='';
  if(clusterGroup){map.removeLayer(clusterGroup);clusterGroup=null}
  if(map.hasLayer(satTiles))map.removeLayer(satTiles);
  if(map.hasLayer(labelTiles))map.removeLayer(labelTiles);
  if(!map.hasLayer(darkTiles))darkTiles.addTo(map);
  if(statesLayer&&!map.hasLayer(statesLayer))statesLayer.addTo(map);
  document.getElementById('panel-state').classList.remove('active');
  document.getElementById('panel-states').classList.add('active');
  map.flyTo([39,-98],4,{duration:1});
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
window.addEventListener('hashchange',()=>{if(!location.hash&&curSt)backToList();else if(location.hash){const s=location.hash.slice(1).toUpperCase();if(s!==(curSt&&curSt.id)&&idx.find(x=>x.id===s))selState(s)}});
init();
</script>
</body>
</html>
