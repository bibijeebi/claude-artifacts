<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const DB='data/',C={access:'#00e5ff',attractors:'#ffab00',trout:'#ff4081',reefs:'#ff6e40',waterbodies:'#69f0ae',stocking:'#b388ff'};
const TL={access:'Access Sites',attractors:'Fish Attractors',trout:'Trout Waters',reefs:'Reefs',waterbodies:'Waterbodies',stocking:'Stocking'};
const SN={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming'};
const FP={1:'AL',2:'AK',4:'AZ',5:'AR',6:'CA',8:'CO',9:'CT',10:'DE',12:'FL',13:'GA',15:'HI',16:'ID',17:'IL',18:'IN',19:'IA',20:'KS',21:'KY',22:'LA',23:'ME',24:'MD',25:'MA',26:'MI',27:'MN',28:'MS',29:'MO',30:'MT',31:'NE',32:'NV',33:'NH',34:'NJ',35:'NM',36:'NY',37:'NC',38:'ND',39:'OH',40:'OK',41:'OR',42:'PA',44:'RI',45:'SC',46:'SD',47:'TN',48:'TX',49:'UT',50:'VT',51:'VA',53:'WA',54:'WV',55:'WI',56:'WY'};
const CTR={AL:[-86.8,32.8],AK:[-153,64],AR:[-92.4,34.8],CA:[-119.4,37.2],CO:[-105.5,39],CT:[-72.7,41.6],DE:[-75.5,39],FL:[-81.7,28.7],GA:[-83.4,32.6],HI:[-155.5,20],ID:[-114.7,44.4],IN:[-86.3,40],IA:[-93.5,42],KY:[-85.3,37.8],LA:[-91.8,31],ME:[-69.2,45.4],MD:[-76.6,39.05],MA:[-71.8,42.3],MI:[-84.5,44.3],MN:[-94.3,46.3],MS:[-89.7,32.7],MO:[-92.5,38.4],MT:[-109.6,47],NE:[-99.8,41.5],NH:[-71.6,43.7],NJ:[-74.7,40.1],NM:[-106,34.5],NY:[-75.5,43],NC:[-79.4,35.5],ND:[-100.5,47.5],OH:[-82.7,40.4],OR:[-120.5,44],PA:[-77.6,41],RI:[-71.5,41.7],SC:[-80.9,34],TN:[-86.3,35.8],TX:[-99.3,31.5],UT:[-111.7,39.3],VT:[-72.6,44],VA:[-79.4,37.5],WA:[-120.7,47.5],WV:[-80.6,38.6],WI:[-89.8,44.6]};
const SZM={AK:3.5,HI:6,TX:5.2,CA:5.2,MT:5.5,FL:5.8,RI:9,DE:8,CT:8,NJ:7,MA:7.5,NH:7.5,VT:7.5,MD:7,WV:7};

let idx=[],map,curSt=null,curD=null,aTypes=new Set(),aFilt={ramp:0,dock:0,pier:0,ada:0,camping:0};
let selId=null,listLim=80,vpFeats=[],statesReady=false,satVisible=false;

// Safe layer helpers
function hasLayer(id){try{return!!map.getLayer(id)}catch(e){return false}}
function safeSetLayout(id,prop,val){if(hasLayer(id))map.setLayoutProperty(id,prop,val)}
function safeSetFilter(id,filter){if(hasLayer(id))map.setFilter(id,filter)}
function safeRemoveLayer(id){if(hasLayer(id))map.removeLayer(id)}
function safeRemoveSource(id){try{if(map.getSource(id))map.removeSource(id)}catch(e){}}

async function init(){
  idx=await(await fetch(DB+'index.json')).json();
  document.getElementById('brand-stats').innerHTML=`<b>${idx.reduce((s,x)=>s+x.total,0).toLocaleString()}</b> records`;
  renderStates();initMap();
}

function renderStates(f=''){
  const s=[...idx].sort((a,b)=>b.total-a.total);
  const fl=f?s.filter(x=>x.name.toLowerCase().includes(f)||x.id.toLowerCase().includes(f)):s;
  document.getElementById('state-list').innerHTML=fl.map(x=>
    `<div class="si" onclick="selState('${x.id}')"><span class="nm">${x.name}</span><span class="ct">${x.total.toLocaleString()}</span></div>`
  ).join('');
}
function filterStates(v){renderStates(v.toLowerCase())}

function initMap(){
  map=new maplibregl.Map({container:'map',style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',center:[-98,39],zoom:3.8,maxZoom:17,attributionControl:false});
  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:false}),'top-right');

  map.on('load',async()=>{
    // Satellite raster source (hidden, under everything)
    map.addSource('satellite',{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Esri, Maxar, Earthstar'});
    map.addLayer({id:'sat-layer',type:'raster',source:'satellite',layout:{visibility:'none'},paint:{'raster-opacity':0}});

    // Load US states topojson
    try{
      const us=await(await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')).json();
      await new Promise((resolve)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/topojson-client@3';
        s.onload=resolve;
        document.head.appendChild(s);
      });
      const geo=topojson.feature(us,us.objects.states);
      for(const f of geo.features){
        f.properties.abbr=FP[f.id]||'';
        f.properties.name=SN[f.properties.abbr]||'';
        const i=idx.find(x=>x.id===f.properties.abbr);
        f.properties.total=i?i.total:0;
        f.properties.hasData=i?1:0;
      }
      addStateLayers(geo);
    }catch(e){console.error('States load error:',e)}

    // Hash routing
    if(location.hash){
      const st=location.hash.slice(1).toUpperCase();
      if(idx.find(x=>x.id===st))selState(st);
    }
  });
}

function addStateLayers(geo){
  map.addSource('states',{type:'geojson',data:geo});
  // Move satellite below states
  map.addLayer({id:'sf',type:'fill',source:'states',paint:{'fill-color':['case',['==',['get','hasData'],1],['interpolate',['linear'],['get','total'],0,'#1a3626',500,'#1e4d32',2000,'#22713f',5000,'#2d9a50',10000,'#4ade80',20000,'#86efac'],'rgba(255,255,255,0.03)'],'fill-opacity':0.6}});
  map.addLayer({id:'sb',type:'line',source:'states',paint:{'line-color':'rgba(255,255,255,0.12)','line-width':1}});
  map.addLayer({id:'sh',type:'fill',source:'states',paint:{'fill-color':'#4ade80','fill-opacity':0.25},filter:['==','abbr','']});
  try{map.moveLayer('sat-layer','sf')}catch(e){}
  statesReady=true;

  map.on('mousemove','sf',e=>{
    map.getCanvas().style.cursor='pointer';
    if(e.features.length)safeSetFilter('sh',['==','abbr',e.features[0].properties.abbr]);
  });
  map.on('mouseleave','sf',()=>{
    map.getCanvas().style.cursor='';
    safeSetFilter('sh',['==','abbr','']);
  });
  map.on('click','sf',e=>{
    if(e.features.length){
      const a=e.features[0].properties.abbr;
      if(a&&idx.find(x=>x.id===a))selState(a);
    }
  });
}

function showSatellite(on){
  if(on===satVisible)return;
  satVisible=on;
  if(on){
    safeSetLayout('sat-layer','visibility','visible');
    safeSetLayout('sf','visibility','none');
    safeSetLayout('sb','visibility','none');
    safeSetLayout('sh','visibility','none');
    map.setPaintProperty('sat-layer','raster-opacity',1);
  }else{
    map.setPaintProperty('sat-layer','raster-opacity',0);
    safeSetLayout('sat-layer','visibility','none');
    safeSetLayout('sf','visibility','visible');
    safeSetLayout('sb','visibility','visible');
    safeSetLayout('sh','visibility','visible');
  }
}

async function selState(id){
  curSt=idx.find(x=>x.id===id);
  if(!curSt)return;
  location.hash=id;listLim=80;selId=null;

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('panel-states').classList.remove('active');
  document.getElementById('panel-state').classList.add('active');
  document.getElementById('st-name').textContent=curSt.name;
  document.getElementById('st-stats').innerHTML='';
  document.getElementById('type-row').innerHTML='';
  document.getElementById('amenity-row').innerHTML='';
  document.getElementById('point-scroll').innerHTML='<div class="spinner"></div>';
  document.getElementById('vp-count').textContent='Loading...';

  showSatellite(true);
  map.flyTo({center:CTR[id]||[-98,39],zoom:SZM[id]||6.2,duration:1600,essential:true});

  // Fetch data
  try{
    const resp=await fetch(DB+id.toLowerCase()+'.json');
    curD=await resp.json();
  }catch(e){
    console.error('Data fetch error:',e);
    curD={};
  }

  aTypes=new Set(Object.keys(TL).filter(k=>curD[k]&&curD[k].length));
  aFilt={ramp:0,dock:0,pier:0,ada:0,camping:0};

  // Stats
  let sh='';
  for(const[k,l]of Object.entries(TL)){
    if(curD[k]&&curD[k].length)sh+=`<span><b>${curD[k].length.toLocaleString()}</b> ${l}</span>`;
  }
  document.getElementById('st-stats').innerHTML=sh;

  renderFilterBar();
  plotPoints();

  // Viewport-driven list
  map.off('moveend',onVP);
  map.on('moveend',onVP);
  // Render list immediately with all data (don't wait for flyTo to finish)
  renderAllPoints();
  // Then update to viewport-filtered after fly completes
  setTimeout(onVP,2000);
}

function renderFilterBar(){
  let tr='';
  for(const[k,l]of Object.entries(TL)){
    if(!curD||!curD[k]||!curD[k].length)continue;
    tr+=`<button class="tbtn ${aTypes.has(k)?'on':''}" onclick="togType('${k}',this)"><span class="d" style="background:${C[k]}"></span>${l}</button>`;
  }
  document.getElementById('type-row').innerHTML=tr;
  let ar='';
  if(curD&&curD.access&&curD.access.length){
    for(const[k,l]of[['ramp','Ramp'],['dock','Dock'],['pier','Pier'],['ada','ADA'],['camping','Camp']])
      ar+=`<button class="abtn" onclick="togAmen('${k}',this)">${l}</button>`;
  }
  document.getElementById('amenity-row').innerHTML=ar;
  renderLegend();
}

function renderLegend(){
  const lg=document.getElementById('legend');
  let h='';
  for(const[k,l]of Object.entries(TL)){
    if(aTypes.has(k)&&curD&&curD[k]&&curD[k].length)
      h+=`<div class="legend-item"><span class="ld" style="background:${C[k]}"></span>${l}</div>`;
  }
  lg.innerHTML=h;
  lg.classList.toggle('show',!!h);
}

function togType(k,btn){
  if(aTypes.has(k))aTypes.delete(k);else aTypes.add(k);
  btn.classList.toggle('on');plotPoints();renderLegend();onVP();
}
function togAmen(k,btn){
  aFilt[k]=aFilt[k]?0:1;btn.classList.toggle('on');plotPoints();onVP();
}

function getFilteredFeatures(){
  if(!curD)return[];
  const feats=[];let fid=0;
  for(const[type,recs]of Object.entries(curD)){
    if(!aTypes.has(type))continue;
    for(const r of recs){
      if(!r.lat||!r.lng)continue;
      if(type==='access'&&(aFilt.ramp&&!r.ramp||aFilt.dock&&!r.dock||aFilt.pier&&!r.pier||aFilt.ada&&!r.ada||aFilt.camping&&!r.camping))continue;
      feats.push({type:'Feature',id:fid++,geometry:{type:'Point',coordinates:[r.lng,r.lat]},
        properties:{...r,_t:type,_c:C[type],_n:r.name||r.waterbody||'Unknown',_id:fid}});
    }
  }
  return feats;
}

function plotPoints(){
  safeRemoveLayer('cl');safeRemoveLayer('cc');safeRemoveLayer('up');
  safeRemoveSource('pts');
  if(!curD)return;

  const features=getFilteredFeatures();

  try{
    map.addSource('pts',{type:'geojson',data:{type:'FeatureCollection',features},cluster:true,clusterMaxZoom:13,clusterRadius:45});
    map.addLayer({id:'cl',type:'circle',source:'pts',filter:['has','point_count'],
      paint:{'circle-color':'rgba(15,15,15,0.8)','circle-radius':['step',['get','point_count'],16,30,21,100,27,300,33],'circle-stroke-width':2,'circle-stroke-color':'rgba(255,255,255,0.3)'}});
    map.addLayer({id:'cc',type:'symbol',source:'pts',filter:['has','point_count'],
      layout:{'text-field':'{point_count_abbreviated}','text-size':11,'text-font':['Open Sans Bold']},
      paint:{'text-color':'#fff'}});
    map.addLayer({id:'up',type:'circle',source:'pts',filter:['!',['has','point_count']],
      paint:{'circle-color':['get','_c'],'circle-radius':['interpolate',['linear'],['zoom'],5,4,9,6,13,9],
        'circle-stroke-width':2,'circle-stroke-color':'rgba(0,0,0,0.6)'}});
  }catch(e){console.error('plotPoints layer error:',e)}

  // Click handlers (using once-bound approach to prevent duplicates)
  map.off('click',onClusterClick);map.off('click',onPointClick);
  map.on('click','cl',onClusterClick);
  map.on('click','up',onPointClick);
  map.on('mouseenter','cl',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','cl',()=>map.getCanvas().style.cursor='');
  map.on('mouseenter','up',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','up',()=>map.getCanvas().style.cursor='');
}

async function onClusterClick(e){
  const f=map.queryRenderedFeatures(e.point,{layers:['cl']});
  if(!f.length)return;
  const z=await map.getSource('pts').getClusterExpansionZoom(f[0].properties.cluster_id);
  map.flyTo({center:f[0].geometry.coordinates,zoom:z,duration:700});
}
function onPointClick(e){
  if(!e.features.length)return;
  const coords=e.features[0].geometry.coordinates;
  selectPointByCoords(coords[0],coords[1]);
}

function renderAllPoints(){
  // Show all points from curD (not viewport filtered) - used on initial load
  if(!curD)return;
  vpFeats=[];
  for(const[type,recs]of Object.entries(curD)){
    if(!aTypes.has(type))continue;
    for(const r of recs){
      if(type==='access'&&(aFilt.ramp&&!r.ramp||aFilt.dock&&!r.dock||aFilt.pier&&!r.pier||aFilt.ada&&!r.ada||aFilt.camping&&!r.camping))continue;
      vpFeats.push({...r,_t:type});
    }
  }
  document.getElementById('vp-count').textContent=`${vpFeats.length.toLocaleString()} total`;
  renderVPList();
}

function onVP(){
  if(!curD)return;
  try{
    const b=map.getBounds(),sw=b.getSouthWest(),ne=b.getNorthEast();
    vpFeats=[];
    for(const[type,recs]of Object.entries(curD)){
      if(!aTypes.has(type))continue;
      for(const r of recs){
        if(!r.lat||!r.lng||r.lng<sw.lng||r.lng>ne.lng||r.lat<sw.lat||r.lat>ne.lat)continue;
        if(type==='access'&&(aFilt.ramp&&!r.ramp||aFilt.dock&&!r.dock||aFilt.pier&&!r.pier||aFilt.ada&&!r.ada||aFilt.camping&&!r.camping))continue;
        vpFeats.push({...r,_t:type});
      }
    }
  }catch(e){return}
  listLim=80;selId=null;
  document.getElementById('vp-count').textContent=`${vpFeats.length.toLocaleString()} in view`;
  renderVPList();
}

function renderVPList(){
  const shown=vpFeats.slice(0,listLim),scroll=document.getElementById('point-scroll');
  scroll.innerHTML=shown.map((r,i)=>{
    const nm=r.name||r.waterbody||'Unknown',sub=[];
    if(r.county)sub.push(r.county);if(r.city)sub.push(r.city);
    if(r.waterbody&&r.waterbody!==nm)sub.push(r.waterbody);
    if(r.material)sub.push(r.material);if(r.type)sub.push(r.type);
    let badges='';
    if(r._t==='access'){
      if(r.ramp==1)badges+='<span class="b y">Ramp</span>';
      if(r.dock==1)badges+='<span class="b y">Dock</span>';
      if(r.pier==1)badges+='<span class="b y">Pier</span>';
      if(r.ada==1)badges+='<span class="b y">ADA</span>';
      if(r.camping==1)badges+='<span class="b y">Camp</span>';
      if(r.restroom==1)badges+='<span class="b y">WC</span>';
    }
    const sid=`vp-${i}`,isSel=selId===sid;
    let det='';
    if(r.lat&&r.lng)det+=`<div class="row"><span class="lbl">Coords</span>${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</div>`;
    if(r.owner)det+=`<div class="row"><span class="lbl">Owner</span>${esc(r.owner)}</div>`;
    if(r.manager)det+=`<div class="row"><span class="lbl">Manager</span>${esc(r.manager)}</div>`;
    if(r.ramp_type)det+=`<div class="row"><span class="lbl">Ramp</span>${esc(r.ramp_type)}</div>`;
    if(r.species)det+=`<div class="row"><span class="lbl">Species</span>${esc(r.species)}</div>`;
    if(r.fee)det+=`<div class="row"><span class="lbl">Fee</span>${esc(r.fee)}</div>`;
    if(r.regs)det+=`<div class="row"><span class="lbl">Regs</span>${esc(r.regs)}</div>`;
    if(r.designation)det+=`<div class="row"><span class="lbl">Desig.</span>${esc(r.designation)}</div>`;
    if(r.material&&r._t!=='access')det+=`<div class="row"><span class="lbl">Material</span>${esc(r.material)}</div>`;
    if(r.year)det+=`<div class="row"><span class="lbl">Year</span>${esc(r.year)}</div>`;
    if(r.acres)det+=`<div class="row"><span class="lbl">Acres</span>${r.acres}</div>`;
    if(r.depth)det+=`<div class="row"><span class="lbl">Depth</span>${r.depth}</div>`;
    if(r.lat&&r.lng)det+=`<a class="gm" href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">Google Maps &rarr;</a>`;
    return`<div class="pi${isSel?' selected':''}" id="${sid}" onclick="clickItem('${sid}',${r.lng||0},${r.lat||0})"><div class="pn"><span class="td" style="background:${C[r._t]}"></span>${esc(nm)}</div>${sub.length?`<div class="pm">${esc(sub.join(' · '))}</div>`:''}${badges?`<div class="pb">${badges}</div>`:''}<div class="detail">${det}</div></div>`;
  }).join('');
  if(vpFeats.length>listLim)
    scroll.innerHTML+=`<button class="load-more" onclick="listLim+=80;renderVPList()">Show more (${(vpFeats.length-listLim).toLocaleString()} remaining)</button>`;
}

function clickItem(sid,lng,lat){
  selId=selId===sid?null:sid;
  renderVPList();
  if(selId&&lat&&lng)map.easeTo({center:[lng,lat],duration:500});
  if(selId){const el=document.getElementById(sid);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
}

function selectPointByCoords(lng,lat){
  let best=-1,bestD=999;
  for(let i=0;i<vpFeats.length&&i<listLim;i++){
    const r=vpFeats[i];if(!r.lat||!r.lng)continue;
    const d=Math.abs(r.lat-lat)+Math.abs(r.lng-lng);
    if(d<bestD){bestD=d;best=i}
  }
  if(best>=0){
    selId=`vp-${best}`;renderVPList();
    const el=document.getElementById(selId);
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function backToList(){
  curSt=null;curD=null;selId=null;location.hash='';
  map.off('moveend',onVP);
  safeRemoveLayer('cl');safeRemoveLayer('cc');safeRemoveLayer('up');
  safeRemoveSource('pts');
  document.getElementById('legend').classList.remove('show');
  document.getElementById('panel-state').classList.remove('active');
  document.getElementById('panel-states').classList.add('active');
  showSatellite(false);
  map.flyTo({center:[-98,39],zoom:3.8,duration:1400});
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
window.addEventListener('hashchange',()=>{
  if(!location.hash&&curSt)backToList();
  else if(location.hash){
    const s=location.hash.slice(1).toUpperCase();
    if(s!==(curSt&&curSt.id)&&idx.find(x=>x.id===s))selState(s);
  }
});
init();
</script>
</body>
