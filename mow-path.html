  animMarker = L.circleMarker(path[0], { radius:6, color:'#fff', fillColor:'#34d399', fillOpacity:1, weight:2 }).addTo(map);
  var trail = L.polyline([], { color:'#34d399', weight:3, opacity:0.9 }).addTo(map);
  var idx = 0;
  function step() {
    if (idx >= path.length) { animRunning = false; return; }
    animMarker.setLatLng(path[idx]);
    trail.addLatLng(path[idx]);
    idx++;
    requestAnimationFrame(step);
  }
  step();
}
</script>
</body>
</html>
