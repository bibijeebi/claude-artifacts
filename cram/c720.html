const { useState, useEffect, useCallback, useRef } = React;

const QUESTIONS = [{"i": 0, "s": "A customer contacted a vacation rental host about trouble entering. The host came to help within 10 minutes. What service quality dimension is demonstrated?", "c": ["Assurance", "Reliability", "Responsiveness", "Tangibles"], "a": 2, "d": "quality", "e": "Quick response = Responsiveness. Assurance = knowledge/courtesy. Reliability = consistent delivery. Tangibles = physical appearance.", "b": "recall", "src": "bank"}, {"i": 1, "s": "A service center employee was polite, professional, explained tire options clearly, and answered all questions. What service quality dimension?", "c": ["Reliability", "Assurance", "Tangibles", "Responsiveness"], "a": 1, "d": "quality", "e": "Knowledgeable + polite + professional = Assurance (inspiring trust/confidence). Not Responsiveness (speed).", "b": "recall", "src": "bank"}, {"i": 2, "s": "A hotel manager periodically inspects rooms to assess condition. Which cost of quality?", "c": ["Appraisal costs", "Prevention costs", "Internal failure costs", "External failure costs"], "a": 0, "d": "quality", "e": "Inspecting/checking quality = Appraisal. Prevention = stopping defects before they happen. Appraisal = catching them after production.", "b": "recall", "src": "bank"}, {"i": 3, "s": "A utility website makes customers enter bank info twice and compares data before proceeding. Which cost of quality?", "c": ["External failure", "Internal failure", "Appraisal", "Prevention"], "a": 3, "d": "quality", "e": "System designed to PREVENT errors before they occur = Prevention costs. Not appraisal (that's checking after the fact).", "b": "recall", "src": "bank"}, {"i": 4, "s": "A business sends surveys asking which features customers like and want added. Which TQM principle?", "c": ["Performance measures", "Customer-centered focus", "Continuous improvement", "Supplier relationships"], "a": 1, "d": "quality", "e": "Surveying customers about preferences = Customer-centered focus. Continuous improvement = ongoing process changes.", "b": "recall", "src": "bank"}, {"i": 5, "s": "A manufacturer collaborates with a component supplier to customize parts for optimal quality. Which TQM concept?", "c": ["Continuous improvement", "Employee involvement", "Performance measures", "Supplier relationships"], "a": 3, "d": "quality", "e": "Working closely with suppliers to customize components = Supplier relationships.", "b": "recall", "src": "bank"}, {"i": 6, "s": "Which activity is in the Define phase of Six Sigma?", "c": ["Training to follow new practices", "Identifying possible causes of defects", "Detailing an improvement opportunity", "Assessing current process performance"], "a": 2, "d": "quality", "e": "DMAIC: Define = detail the problem/opportunity. Measure = assess current. Analyze = identify causes. Improve = train/implement. Control = sustain.", "b": "recall", "src": "bank"}, {"i": 7, "s": "Which Six Sigma phase implements measures to make errors more quickly detectable?", "c": ["Control", "Analyze", "Define", "Measure"], "a": 0, "d": "quality", "e": "Control phase = monitoring systems to sustain improvements and detect errors quickly. Last step of DMAIC.", "b": "recall", "src": "bank"}, {"i": 8, "s": "A manager wants to see how many tools had RPM in specific ranges (10000-10049, 10050-10099, etc). Which quality tool?", "c": ["Flow chart", "Scatterplot", "Histogram", "Check sheet"], "a": 2, "d": "quality", "e": "Frequency distribution across ranges = Histogram. Scatterplot = relationship between two variables. Check sheet = data collection form.", "b": "recall", "src": "bank"}, {"i": 9, "s": "A manager wants to see if number of defects is related to total units produced per day. Which tool?", "c": ["Scatterplot", "Control chart", "Check sheet", "Pareto chart"], "a": 0, "d": "quality", "e": "Relationship between two variables = Scatterplot. Control chart = process stability over time. Pareto = 80/20 ranking.", "b": "recall", "src": "bank"}, {"i": 10, "s": "What is a factor accounted for in effective capacity?", "c": ["Planned employee breaks", "Periods of reduced market demand", "Fixed and variable costs", "Unplanned power outages"], "a": 0, "d": "capacity", "e": "Effective capacity = design capacity minus PLANNED reductions (breaks, maintenance). Unplanned outages reduce ACTUAL output, not effective capacity.", "b": "recall", "src": "bank"}, {"i": 11, "s": "Design capacity 40,000 shirts/mo. Effective capacity 31,000. Actual output 24,180. What is efficiency?", "c": ["19%", "65%", "78%", "84%"], "a": 2, "d": "capacity", "e": "Efficiency = Actual/Effective = 24,180/31,000 = 0.78 = 78%. Utilization would be Actual/Design = 24,180/40,000 = 60.45%.", "b": "recall", "src": "bank"}, {"i": 12, "s": "Which scenario demonstrates a resource constraint?", "c": ["One machine identified as bottleneck", "Shortage of raw materials hindering production", "Overabundance of inventory from slow sales", "Running out of storage for finished products"], "a": 1, "d": "capacity", "e": "Resource constraint = not enough of a needed resource. Raw material shortage = resource constraint. Machine bottleneck = process constraint.", "b": "recall", "src": "bank"}, {"i": 13, "s": "After dedicating resources to eliminate a constraint in TOC, what is the next step?", "c": ["Improve with existing resources", "Evaluate whether system has another constraint", "Make constraint known to all departments", "Find a more permanent solution"], "a": 1, "d": "capacity", "e": "TOC: Identify > Exploit > Subordinate > Elevate (dedicate resources) > REPEAT (go back, check for new constraint). It's a cycle.", "b": "recall", "src": "bank"}, {"i": 14, "s": "Company wants to hold very little inventory by aligning capacity with demand closely. Which strategy?", "c": ["Match", "Lead", "Constant", "Lag"], "a": 0, "d": "capacity", "e": "Match = adjust capacity to match demand. Lead = build capacity before demand. Lag = add capacity after demand exceeds current.", "b": "recall", "src": "bank"}, {"i": 15, "s": "Which is an example of lead capacity strategy?", "c": ["Increased production based on detailed forecasts", "Increased output after jackets sold out for months", "Reduced production after inventory maxed out", "Significantly increases production in anticipation of high demand"], "a": 3, "d": "capacity", "e": "Lead = increase capacity BEFORE demand arrives, based on anticipation. Option A is forecast-based (could be match). D is clearly anticipatory = Lead.", "b": "recall", "src": "bank"}, {"i": 16, "s": "Products with very little variation and interchangeable parts. Which production process?", "c": ["Job shop", "Assembly line", "Project", "Continuous flow"], "a": 1, "d": "process", "e": "Low variation + interchangeable parts = Assembly line. Job shop = high variety/low volume. Continuous flow = single product, never stops (chemicals, oil).", "b": "recall", "src": "bank"}, {"i": 17, "s": "Manufacturer produces four boat models, one model per week. Which facility layout?", "c": ["Random", "Process", "Fixed", "Product"], "a": 3, "d": "process", "e": "Producing one product type at a time in sequence = Product layout. Process layout = grouped by function (all drills together, all saws together).", "b": "recall", "src": "bank"}, {"i": 18, "s": "Fast food restaurant opening second location. Major factor in location decision?", "c": ["Utility costs", "Worker convenience", "Transportation costs", "Proximity to customers"], "a": 3, "d": "process", "e": "Fast food = service business = customers come to you. Proximity to customers is #1. Manufacturing would prioritize transportation/materials.", "b": "recall", "src": "bank"}, {"i": 19, "s": "Software company needs new office location. Major consideration?", "c": ["Proximity to suppliers", "Customer convenience", "Quality community", "Customer parking"], "a": 2, "d": "process", "e": "Software company needs talent. Quality community = good labor pool, amenities, lifestyle that attracts skilled workers.", "b": "recall", "src": "bank"}, {"i": 20, "s": "Facility needs to minimize costs, improve margins, achieve economies of scale. What to do?", "c": ["Higher variety, lower volume", "Project-oriented operation", "General machinery for flexibility", "Reduce product variation"], "a": 3, "d": "process", "e": "Economies of scale = high volume of SAME thing. Reduce variation = more standardization = more scale efficiency.", "b": "recall", "src": "bank"}, {"i": 21, "s": "Business produces single product, wants economies of scale in new facility. Which processes?", "c": ["Departmental", "Job shop", "Project", "Assembly line"], "a": 3, "d": "process", "e": "Single product + economies of scale = Assembly line. Job shop = custom/varied work. Project = one-offs.", "b": "recall", "src": "bank"}, {"i": 22, "s": "Which forecasting step assesses accuracy of the initial method?", "c": ["Considering constraints", "Applying the model", "Determining objectives", "Developing and testing"], "a": 3, "d": "forecasting", "e": "Developing and testing = build the model then TEST its accuracy. Applying = using it for real. Constraints = real-world limits.", "b": "recall", "src": "bank"}, {"i": 23, "s": "Which forecasting step accounts for real-world limitations?", "c": ["Considering constraints", "Determining objectives", "Applying the model", "Revising and evaluating"], "a": 0, "d": "forecasting", "e": "Considering constraints = accounting for real-world limitations (budget, data availability, time). Straight definition match.", "b": "recall", "src": "bank"}, {"i": 24, "s": "Which planning component is part of short-range planning?", "c": ["Master production schedule", "Aggregate plan", "Sales plan", "Strategic plan"], "a": 0, "d": "forecasting", "e": "Short-range = Master Production Schedule (weeks/days). Medium = Aggregate plan. Long-range = Strategic plan.", "b": "recall", "src": "bank"}, {"i": 25, "s": "Company sells phones plus replacement screens, batteries, cables. Which is dependent demand?", "c": ["Complete phone", "Speaker", "Screen", "Battery"], "a": 1, "d": "forecasting", "e": "Dependent demand = items needed BECAUSE of another item (parts inside the phone). Speaker is built into the phone, not sold separately. Screens/batteries/cables are sold independently.", "b": "recall", "src": "bank"}, {"i": 26, "s": "Executive wants objective, mathematical forecasting model. Which model?", "c": ["Survey method", "Delphi technique", "Pyramid method", "Weighted moving average"], "a": 3, "d": "forecasting", "e": "Quantitative/mathematical = Weighted moving average. Survey, Delphi, Pyramid are all qualitative (human judgment).", "b": "recall", "src": "bank"}, {"i": 27, "s": "Manager creates forecast by starting at the bottom and adding component parts. Which method?", "c": ["Exponential smoothing", "Survey method", "Pyramid method", "Simple moving average"], "a": 2, "d": "forecasting", "e": "Bottom-up aggregation = Pyramid method. Exponential smoothing and moving average are quantitative, not bottom-up qualitative.", "b": "recall", "src": "bank"}, {"i": 28, "s": "Scheduling that determines demand in advance while limiting access to the service?", "c": ["Reservation scheduling", "Peak demand scheduling", "Chase demand scheduling", "Consumer self-service"], "a": 0, "d": "forecasting", "e": "Reservations = know demand ahead of time + limit capacity access. Hotels, restaurants, airlines all use this.", "b": "recall", "src": "bank"}, {"i": 29, "s": "Fast-food kiosks where patrons place their own orders. Which scheduling technique?", "c": ["Consumer self-service", "Chase demand scheduling", "Reservation scheduling", "Peak demand scheduling"], "a": 0, "d": "forecasting", "e": "Customers doing the work themselves = Consumer self-service. Reduces labor needs.", "b": "recall", "src": "bank"}, {"i": 30, "s": "Organization implementing software to manage and integrate core processes. Which role?", "c": ["Generate call center scripts", "Manage supplier contracts", "Manage sales prospects", "Improve collaboration"], "a": 3, "d": "lean", "e": "ERP integrates core processes = improves collaboration across departments. Call scripts = CRM. Supplier contracts = SCM.", "b": "recall", "src": "bank"}, {"i": 31, "s": "ERP generates invoice and updates inventory when client orders. Which functionality?", "c": ["Processing and automation", "Data collection", "Security and access control", "Integration"], "a": 0, "d": "lean", "e": "Automatic invoice + inventory update triggered by order = Processing and automation. Integration = connecting systems.", "b": "recall", "src": "bank"}, {"i": 32, "s": "Rearranging machinery to reduce unnecessary worker movements. Benefit?", "c": ["Improved product quality", "Reduced changeover time", "Improved efficiency", "Faster time to market"], "a": 2, "d": "lean", "e": "Reducing unnecessary movements = eliminating waste = improved efficiency. One of the 8 wastes in lean (Motion).", "b": "recall", "src": "bank"}, {"i": 33, "s": "Production manager asks for improvement ideas monthly. Which lean benefit?", "c": ["Greater labor flexibility", "Greater material price stability", "Reduced stockout risk", "Enhanced employee engagement"], "a": 3, "d": "lean", "e": "Soliciting ideas from employees = involving them in improvement = Enhanced employee engagement. Core lean principle.", "b": "recall", "src": "bank"}, {"i": 34, "s": "Which scenario is a non-value-added activity?", "c": ["Assembling a ceiling fan", "Preparing a three-course meal", "Doctor examining a patient", "Grocery associate counting inventory all day"], "a": 3, "d": "lean", "e": "Counting inventory adds zero value to the product. Assembly, cooking, examining = directly creating or delivering value.", "b": "recall", "src": "bank"}, {"i": 35, "s": "Which competitive advantage is associated with lean systems?", "c": ["Product differentiation", "Inventory reduction", "Economies of scope", "Specialized workforce"], "a": 1, "d": "lean", "e": "Lean = eliminate waste. Inventory is a form of waste. Inventory reduction is THE hallmark lean advantage.", "b": "recall", "src": "bank"}, {"i": 36, "s": "Benefit of reducing inventory through lean principles?", "c": ["Minimized product scrap", "Elimination of raw inventory", "Reduced duration of inventory idleness", "Reduced risk of stockouts"], "a": 2, "d": "lean", "e": "Less inventory = less time sitting idle (not being used/sold). B is wrong (lean reduces, doesn't eliminate). D is wrong (less inventory INCREASES stockout risk).", "b": "recall", "src": "bank"}, {"i": 37, "s": "What is a benefit of TQM?", "c": ["Greater volume flexibility", "Greater controlled variation", "Fewer warranty repairs", "Reduced finished inventory"], "a": 2, "d": "quality", "e": "TQM reduces defects = fewer products need warranty repairs. Quality up = rework down.", "b": "recall", "src": "bank"}, {"i": 38, "s": "How is flexibility enhanced through lean strategies?", "c": ["More specialized workforce", "Greater raw material inventory", "Shorter aggregate planning horizon", "Elimination of unnecessary movements"], "a": 3, "d": "lean", "e": "Eliminating waste movements frees capacity and allows workers to adapt. Specialization REDUCES flexibility. More inventory isn't lean.", "b": "recall", "src": "bank"}, {"i": 39, "s": "Production facility uses small lots and low inventory. What signals need for more materials?", "c": ["Kanban", "Process map", "Master schedule", "Heijunka"], "a": 0, "d": "lean", "e": "Kanban = visual signal card that triggers replenishment in a pull system. Heijunka = production leveling. Kanban is THE lean signal system.", "b": "recall", "src": "bank"}, {"i": 40, "s": "Food facility has long setup times on primary machine. How to improve?", "c": ["Maintain during unscheduled downtime", "Same employee for consistency", "Make tools readily available", "Operate below maximum output"], "a": 2, "d": "lean", "e": "SMED (Single Minute Exchange): make tools/dies readily available to reduce setup time. Having to search for tools wastes time.", "b": "recall", "src": "bank"}, {"i": 41, "s": "Facility produces several products. Manager wants lean production efficiency. Which strategy?", "c": ["Match component production to final assembly schedule", "Push system to move materials", "Large batches of one product before switching", "Higher inventory to satisfy demand"], "a": 0, "d": "lean", "e": "Lean = pull system, match production to demand/assembly. Push systems, large batches, and high inventory are all anti-lean.", "b": "recall", "src": "bank"}, {"i": 42, "s": "Silicon imports blocked by sanctions. Which bottleneck type?", "c": ["Process", "Regulatory", "Technology", "Decision-making"], "a": 1, "d": "bottlenecks", "e": "Sanctions = government regulation blocking supply = Regulatory bottleneck.", "b": "recall", "src": "bank"}, {"i": 43, "s": "Software company slowed by lack of skilled workers for customization. Bottleneck type?", "c": ["Labor", "Regulatory", "Physical", "Financial"], "a": 0, "d": "bottlenecks", "e": "Not enough skilled workers = Labor bottleneck. Physical = space/infrastructure. Financial = money.", "b": "recall", "src": "bank"}, {"i": 44, "s": "Cheese factory system processes only 6 boxes/min causing truck delays. Bottleneck category?", "c": ["Physical", "Regulatory", "Decision-making", "Technology"], "a": 3, "d": "bottlenecks", "e": "Slow scanning system = Technology bottleneck. The system's processing speed is the limit, not physical space.", "b": "recall", "src": "bank"}, {"i": 45, "s": "Facility manager must sign off on inspections but is busy with admin. Shipments delayed. Bottleneck?", "c": ["Regulatory", "Decision-making", "Labor", "Technology"], "a": 1, "d": "bottlenecks", "e": "One person's approval required but unavailable = Decision-making bottleneck. Not regulatory (it's internal policy, not law).", "b": "recall", "src": "bank"}, {"i": 46, "s": "Logging company limited by single-lane forest road despite high demand. Bottleneck?", "c": ["Physical", "Technology", "Financial", "Labor"], "a": 0, "d": "bottlenecks", "e": "Single-lane road = physical infrastructure constraint = Physical bottleneck.", "b": "recall", "src": "bank"}, {"i": 47, "s": "Guitar manufacturer can't pay suppliers due to cashflow issues. Bottleneck?", "c": ["Regulatory", "Process", "Financial", "Labor"], "a": 2, "d": "bottlenecks", "e": "Can't pay suppliers = not enough cash = Financial bottleneck.", "b": "recall", "src": "bank"}, {"i": 48, "s": "Retail company buys a distribution center to lower costs. Which strategy?", "c": ["Vendor managed inventory", "Backward vertical integration", "Lean supply chain", "Agile supply chain"], "a": 1, "d": "supply_chain", "e": "Retailer buying distribution (upstream toward supplier) = Backward vertical integration. Moving backward in the supply chain.", "b": "recall", "src": "bank"}, {"i": 49, "s": "Fabric producer buys the distribution center that buys most of its fabric. Which strategy?", "c": ["Lean supply chain", "Agile supply chain", "Backward vertical integration", "Forward vertical integration"], "a": 3, "d": "supply_chain", "e": "Producer buying distributor (downstream toward customer) = Forward vertical integration. Moving forward in the supply chain.", "b": "recall", "src": "bank"}, {"i": 50, "s": "Fashion company needs innovation, works only with suppliers who adjust quickly. Which strategy?", "c": ["Backward vertical integration", "Forward vertical integration", "Agile supply chain", "Lean supply chain"], "a": 2, "d": "supply_chain", "e": "Frequent change + quick adjustment = Agile supply chain. Lean = stable demand, waste elimination. Agile = volatile demand, flexibility.", "b": "recall", "src": "bank"}, {"i": 51, "s": "Furniture company, high volume/low variety, suppliers committed to eliminating waste. Strategy?", "c": ["Backward vertical integration", "Agile supply chain", "Forward vertical integration", "Lean supply chain"], "a": 3, "d": "supply_chain", "e": "High volume + low variety + eliminate waste + minimize costs = Lean supply chain. Classic lean profile.", "b": "recall", "src": "bank"}, {"i": 52, "s": "Fencing company, low margins, works with suppliers to minimize costs. Which concept?", "c": ["Lean supply chain", "Agile supply chain", "Backward vertical integration", "Vendor managed inventory"], "a": 0, "d": "supply_chain", "e": "Low margins + minimize costs + close supplier collaboration = Lean supply chain.", "b": "recall", "src": "bank"}, {"i": 53, "s": "Lumber supplier monitors furniture manufacturer's stock and delivers when needed. Strategy?", "c": ["Forward vertical integration", "Agile supply chain", "Vendor managed inventory", "Backward vertical integration"], "a": 2, "d": "supply_chain", "e": "Supplier monitors and replenishes customer's inventory = VMI (Vendor Managed Inventory). Supplier takes ownership of inventory management.", "b": "recall", "src": "bank"}, {"i": 54, "s": "New ops manager wants ethical operations. What is directly their responsibility?", "c": ["Fair product pricing", "Optimal inventory method", "Potential environmental pollution", "Accounting standards compliance"], "a": 2, "d": "ethics", "e": "Operations manager = production/manufacturing. Environmental pollution from operations is directly their responsibility. Pricing = marketing. Accounting = finance.", "b": "recall", "src": "bank"}, {"i": 55, "s": "Operations manager wants higher emphasis on ethics. Important consideration?", "c": ["Optimal inventory method", "Shift schedules for laborers", "Optimal product design", "Product safety after production"], "a": 3, "d": "ethics", "e": "Product safety = ethical obligation of operations. Defective products harm customers. Inventory method and design are operational, not primarily ethical.", "b": "recall", "src": "bank"}, {"i": 56, "s": "Company leaders want to emphasize social sustainability. What should they do?", "c": ["Enhance department collaboration", "Prioritize long-term savings", "Use standard accounting", "Improve employee job security"], "a": 3, "d": "ethics", "e": "Social sustainability = people. Job security = taking care of employees = social. Long-term savings = economic. Collaboration = operational.", "b": "recall", "src": "bank"}, {"i": 57, "s": "Organization redesigning operations for environmental sustainability. Which action?", "c": ["Materials from variety of sources", "Workplace with respect and dignity", "Reduce net-sum of depleted resources", "Emphasize human labor over machines"], "a": 2, "d": "ethics", "e": "Environmental sustainability = reducing resource depletion. Respect/dignity = social sustainability.", "b": "recall", "src": "bank"}, {"i": 58, "s": "Organization gives all employees four mental health personal days. Which triple bottom line component?", "c": ["Environmental viability", "Economic profitability", "Product optimization", "Social responsibility"], "a": 3, "d": "ethics", "e": "Mental health days for employees = caring for people = Social responsibility. Triple bottom line: People, Planet, Profit.", "b": "recall", "src": "bank"}, {"i": 59, "s": "What is a benefit of SWOT analysis?", "c": ["Integrates technology among supply elements", "Coordinates info among departments", "Defines how to compete in market", "Takes greatest advantage of opportunities"], "a": 3, "d": "strategy", "e": "SWOT helps identify and capitalize on opportunities while mitigating threats. That's its core purpose.", "b": "recall", "src": "bank"}, {"i": 60, "s": "What is a primary consideration of SWOT analysis?", "c": ["Internal processes for productivity", "External elements creating difficulties", "Ethical considerations for perception", "External processes for pricing"], "a": 1, "d": "strategy", "e": "External threats (elements that could create difficulties) are one of the four primary SWOT considerations.", "b": "recall", "src": "bank"}, {"i": 61, "s": "Which question should a company ask when determining SWOT opportunities?", "c": ["Which competitors have greatest customer base?", "Which employees show greatest potential?", "Which layout gives greatest efficiency?", "What do advantageous external changes look like?"], "a": 3, "d": "strategy", "e": "Opportunities = advantageous EXTERNAL changes. Internal = strengths/weaknesses. External = opportunities/threats.", "b": "recall", "src": "bank"}, {"i": 62, "s": "Which factor represents a source of opportunities in SWOT?", "c": ["Change in management", "Change in government policy", "Change in core competencies", "Change in quality control"], "a": 1, "d": "strategy", "e": "Government policy change = EXTERNAL factor = opportunity (or threat). Management, competencies, QC are all internal.", "b": "recall", "src": "bank"}, {"i": 63, "s": "What is one of the two internal elements of SWOT?", "c": ["Systems", "Weaknesses", "Opportunities", "Threats"], "a": 1, "d": "strategy", "e": "Internal = Strengths + Weaknesses. External = Opportunities + Threats. SW are internal, OT are external.", "b": "recall", "src": "bank"}, {"i": 64, "s": "Clothing retailer uses perpetual inventory. What is an advantage?", "c": ["Optimized inventory cost ordering", "Constant awareness of inventory levels", "Consistent delivery schedules", "Flexibility with supplier replenishment"], "a": 1, "d": "inventory", "e": "Perpetual = always know what you have (real-time tracking). That's its #1 advantage.", "b": "recall", "src": "bank"}, {"i": 65, "s": "Manufacturing facility uses perpetual system. What is a disadvantage?", "c": ["Requires consistent market demand", "Replenishment only at set times", "Demand must be highly accurate", "Maintenance is expensive"], "a": 3, "d": "inventory", "e": "Perpetual systems need technology, software, scanners = expensive to maintain. That's the tradeoff for real-time data.", "b": "recall", "src": "bank"}, {"i": 66, "s": "Small grocery uses periodic inventory. Which advantage?", "c": ["Low risk of running out", "No need for computerized system", "Responsive to demand changes", "Automatic replenishment"], "a": 1, "d": "inventory", "e": "Periodic = manual counts at intervals. Advantage: simple, no computer needed. Disadvantage: don't know exact levels between counts.", "b": "recall", "src": "bank"}, {"i": 67, "s": "Auto parts retailer uses periodic system. Which drawback?", "c": ["Significant initial investment", "Need for barcode technology", "High supply chain coordination", "Can't easily determine exact inventory"], "a": 3, "d": "inventory", "e": "Periodic = only know inventory at count time. Between counts, exact balances are unknown. That's the core drawback.", "b": "recall", "src": "bank"}, {"i": 68, "s": "Which model assumes manufacturing capacity exceeds demand?", "c": ["Quantity discounts", "Economic order quantity", "Fixed interval", "Economic production quantity"], "a": 3, "d": "inventory", "e": "EPQ (Economic Production Quantity) = you make it yourself, production rate > demand rate. EOQ = you buy it from someone else.", "b": "recall", "src": "bank"}, {"i": 69, "s": "Which costs are primarily considered in inventory management models?", "c": ["Stockout costs", "Sunk costs", "Selling costs", "Insurance costs"], "a": 0, "d": "inventory", "e": "Three primary inventory costs: ordering, carrying/holding, and STOCKOUT. Insurance is a subset of carrying. Sunk/selling aren't inventory model costs.", "b": "recall", "src": "bank"}, {"i": 70, "s": "Which inventory cost includes costs of lost customers?", "c": ["Ordering", "Carrying", "Stockout", "Purchase"], "a": 2, "d": "inventory", "e": "Stockout = running out of stock = lost sales + lost customers + backorder costs. Carrying = storage, insurance, obsolescence.", "b": "recall", "src": "bank"}, {"i": 71, "s": "What is an inventory level that triggers the replenishment process?", "c": ["Target level", "Safety stock", "Lead time", "Order point"], "a": 3, "d": "inventory", "e": "Order point (reorder point) = when inventory hits this level, place a new order. Safety stock = buffer. Lead time = delivery wait time.", "b": "recall", "src": "bank"}];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function App() {
  const [mode, setMode] = useState("menu");
  const [filter, setFilter] = useState("all");
  const [queue, setQueue] = useState([]);
  const [current, setCurrent] = useState(null);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, wrong: 0, seen: new Set() });
  const [examMode, setExamMode] = useState(false);
  const [examAnswers, setExamAnswers] = useState({});
  const [examIdx, setExamIdx] = useState(0);
  const [examQuestions, setExamQuestions] = useState([]);
  const [examDone, setExamDone] = useState(false);
  const [examStart, setExamStart] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const timerRef = useRef(null);

  const startDrill = (domain) => {
    const pool = domain === "all" ? QUESTIONS : QUESTIONS.filter(q => q.d === domain);
    const shuffled = shuffle(pool);
    setQueue(shuffled.slice(1));
    setCurrent(shuffled[0]);
    setSelected(null);
    setStats({ correct: 0, wrong: 0, seen: new Set() });
    setFilter(domain);
    setMode("drill");
    setExamMode(false);
  };

  const startExam = () => {
    const qs = shuffle(QUESTIONS).slice(0, 36);
    setExamQuestions(qs);
    setExamAnswers({});
    setExamIdx(0);
    setExamDone(false);
    setExamStart(Date.now());
    setMode("exam");
    setExamMode(true);
    if (timerRef.current) clearInterval(timerRef.current);
    timerRef.current = setInterval(() => setElapsed(Date.now()), 1000);
  };

  useEffect(() => () => { if (timerRef.current) clearInterval(timerRef.current); }, []);

  const handleAnswer = (idx) => {
    if (selected !== null) return;
    setSelected(idx);
    const isCorrect = idx === current.a;
    setStats(prev => ({
      correct: prev.correct + (isCorrect ? 1 : 0),
      wrong: prev.wrong + (isCorrect ? 0 : 1),
      seen: new Set([...prev.seen, current.i])
    }));
  };

  const nextQuestion = () => {
    if (queue.length === 0) {
      setMode("done");
      return;
    }
    const isCorrect = selected === current.a;
    let newQueue = [...queue];
    if (!isCorrect) {
      const insertAt = Math.min(3 + Math.floor(Math.random() * 3), newQueue.length);
      newQueue.splice(insertAt, 0, current);
    }
    setCurrent(newQueue[0]);
    setQueue(newQueue.slice(1));
    setSelected(null);
  };

  const handleExamAnswer = (qIdx, aIdx) => {
    setExamAnswers(prev => ({ ...prev, [qIdx]: aIdx }));
  };

  const finishExam = () => {
    if (timerRef.current) clearInterval(timerRef.current);
    setExamDone(true);
  };

  const examScore = () => {
    let correct = 0;
    examQuestions.forEach((q, i) => { if (examAnswers[i] === q.a) correct++; });
    return correct;
  };

  const domainCounts = {};
  QUESTIONS.forEach(q => { domainCounts[q.d] = (domainCounts[q.d] || 0) + 1; });

  if (mode === "menu") {
    return (
      <div style={{ fontFamily: "'JetBrains Mono', 'SF Mono', 'Fira Code', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 32 }}>
            <div style={{ fontSize: 13, letterSpacing: 4, color: "#6c7086", marginBottom: 4 }}>WGU C720</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: "#cdd6f4" }}>OPS CRAM</div>
            <div style={{ fontSize: 13, color: "#6c7086", marginTop: 4 }}>{QUESTIONS.length} questions / 6 domains</div>
          </div>

          <button onClick={startExam} style={{ width: "100%", padding: "16px", background: "#f38ba8", color: "#1e1e2e", border: "none", borderRadius: 8, fontSize: 16, fontWeight: 700, cursor: "pointer", marginBottom: 24, fontFamily: "inherit", letterSpacing: 1 }}>
            PRACTICE OA (36 Qs / 90 min)
          </button>

          <div style={{ fontSize: 12, color: "#6c7086", marginBottom: 8, letterSpacing: 2 }}>DRILL BY DOMAIN</div>

          <button onClick={() => startDrill("all")} style={{ width: "100%", padding: "14px", background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, fontSize: 14, cursor: "pointer", marginBottom: 8, fontFamily: "inherit", textAlign: "left" }}>
            <span style={{ fontWeight: 600 }}>ALL DOMAINS</span>
            <span style={{ float: "right", color: "#6c7086" }}>{QUESTIONS.length}</span>
          </button>

          {Object.entries(DOMAIN_LABELS).map(([key, label]) => (
            <button key={key} onClick={() => startDrill(key)} style={{ width: "100%", padding: "14px", background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, fontSize: 14, cursor: "pointer", marginBottom: 8, fontFamily: "inherit", textAlign: "left" }}>
              <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: DOMAIN_COLORS[key], marginRight: 10 }}/>
              <span style={{ fontWeight: 600 }}>{label}</span>
              <span style={{ float: "right", color: "#6c7086" }}>{domainCounts[key] || 0}</span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  if (mode === "exam") {
    const q = examQuestions[examIdx];
    const mins = Math.floor((Date.now() - examStart) / 60000);
    const secs = Math.floor(((Date.now() - examStart) % 60000) / 1000);
    const answered = Object.keys(examAnswers).length;

    if (examDone) {
      const score = examScore();
      const pct = Math.round((score / 37) * 100);
      const pass = pct >= 63;
      const byDomain = {};
      examQuestions.forEach((q, i) => {
        if (!byDomain[q.d]) byDomain[q.d] = { correct: 0, total: 0 };
        byDomain[q.d].total++;
        if (examAnswers[i] === q.a) byDomain[q.d].correct++;
      });

      return (
        <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
          <div style={{ maxWidth: 600, margin: "0 auto" }}>
            <div style={{ textAlign: "center", marginBottom: 24 }}>
              <div style={{ fontSize: 48, fontWeight: 700, color: pass ? "#a6e3a1" : "#f38ba8" }}>{pct}%</div>
              <div style={{ fontSize: 18, color: pass ? "#a6e3a1" : "#f38ba8", fontWeight: 600 }}>{pass ? "PASS" : "NOT YET"}</div>
              <div style={{ fontSize: 13, color: "#6c7086", marginTop: 4 }}>{score}/37 correct / {mins}m {secs}s</div>
            </div>

            {Object.entries(byDomain).map(([d, data]) => (
              <div key={d} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", background: "#313244", borderRadius: 6, marginBottom: 4, fontSize: 13 }}>
                <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: DOMAIN_COLORS[d], marginRight: 8 }}/>{DOMAIN_LABELS[d]}</span>
                <span style={{ color: data.correct / data.total >= 0.6 ? "#a6e3a1" : "#f38ba8" }}>{data.correct}/{data.total}</span>
              </div>
            ))}

            <div style={{ marginTop: 24, fontSize: 12, color: "#6c7086", marginBottom: 8 }}>MISSED QUESTIONS</div>
            {examQuestions.map((q, i) => {
              if (examAnswers[i] === q.a) return null;
              return (
                <div key={i} style={{ background: "#313244", borderRadius: 8, padding: 12, marginBottom: 8, fontSize: 13, borderLeft: `3px solid ${DOMAIN_COLORS[q.d]}` }}>
                  <div style={{ marginBottom: 8 }}>{q.s}</div>
                  <div style={{ color: "#f38ba8" }}>Your answer: {q.c[examAnswers[i]] || "Skipped"}</div>
                  <div style={{ color: "#a6e3a1" }}>Correct: {q.c[q.a]}</div>
                  {q.e && <div style={{ color: "#6c7086", marginTop: 4, fontSize: 12 }}>{q.e}</div>}
                </div>
              );
            })}

            <button onClick={() => setMode("menu")} style={{ width: "100%", padding: 14, background: "#45475a", color: "#cdd6f4", border: "none", borderRadius: 8, fontSize: 14, cursor: "pointer", marginTop: 16, fontFamily: "inherit" }}>BACK TO MENU</button>
          </div>
        </div>
      );
    }

    return (
      <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <span style={{ fontSize: 12, color: "#6c7086" }}>Q{examIdx + 1}/37</span>
            <span style={{ fontSize: 12, color: mins >= 80 ? "#f38ba8" : "#6c7086" }}>{mins}:{String(secs).padStart(2,'0')} / 90:00</span>
            <span style={{ fontSize: 12, color: "#6c7086" }}>{answered} answered</span>
          </div>

          <div style={{ width: "100%", height: 3, background: "#313244", borderRadius: 2, marginBottom: 20 }}>
            <div style={{ width: `${((examIdx + 1) / 37) * 100}%`, height: "100%", background: "#89b4fa", borderRadius: 2, transition: "width 0.3s" }}/>
          </div>

          <div style={{ fontSize: 12, color: DOMAIN_COLORS[q.d], marginBottom: 8 }}>{DOMAIN_LABELS[q.d]}</div>
          <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 20 }}>{q.s}</div>

          {q.c.map((choice, ci) => (
            <button key={ci} onClick={() => handleExamAnswer(examIdx, ci)} style={{
              width: "100%", padding: "12px 14px", marginBottom: 6, background: examAnswers[examIdx] === ci ? "#45475a" : "#313244",
              color: "#cdd6f4", border: examAnswers[examIdx] === ci ? "1px solid #89b4fa" : "1px solid #45475a",
              borderRadius: 8, fontSize: 13, cursor: "pointer", fontFamily: "inherit", textAlign: "left", lineHeight: 1.5
            }}>
              <span style={{ fontWeight: 600, marginRight: 8, color: "#6c7086" }}>{String.fromCharCode(65 + ci)}</span>{choice}
            </button>
          ))}

          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button disabled={examIdx === 0} onClick={() => setExamIdx(examIdx - 1)} style={{ flex: 1, padding: 12, background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, cursor: examIdx === 0 ? "default" : "pointer", opacity: examIdx === 0 ? 0.3 : 1, fontFamily: "inherit", fontSize: 13 }}>PREV</button>
            {examIdx < 36 ? (
              <button onClick={() => setExamIdx(examIdx + 1)} style={{ flex: 1, padding: 12, background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, cursor: "pointer", fontFamily: "inherit", fontSize: 13 }}>NEXT</button>
            ) : (
              <button onClick={finishExam} style={{ flex: 1, padding: 12, background: "#a6e3a1", color: "#1e1e2e", border: "none", borderRadius: 8, cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 700 }}>FINISH</button>
            )}
          </div>

          <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 16 }}>
            {examQuestions.map((_, i) => (
              <button key={i} onClick={() => setExamIdx(i)} style={{
                width: 28, height: 28, borderRadius: 4, border: i === examIdx ? "2px solid #89b4fa" : "1px solid #45475a",
                background: examAnswers[i] !== undefined ? "#45475a" : "#1e1e2e", color: "#6c7086",
                fontSize: 10, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (mode === "drill" && current) {
    const total = filter === "all" ? QUESTIONS.length : QUESTIONS.filter(q => q.d === filter).length;
    const remaining = queue.length + 1;
    const pct = Math.round(((total - remaining) / total) * 100);

    return (
      <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
            <button onClick={() => setMode("menu")} style={{ background: "none", border: "none", color: "#6c7086", cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>EXIT</button>
            <div style={{ fontSize: 12, color: "#6c7086" }}>
              <span style={{ color: "#a6e3a1" }}>{stats.correct}</span> / <span style={{ color: "#f38ba8" }}>{stats.wrong}</span> / {remaining} left
            </div>
          </div>

          <div style={{ width: "100%", height: 3, background: "#313244", borderRadius: 2, marginBottom: 20 }}>
            <div style={{ width: `${pct}%`, height: "100%", background: "#a6e3a1", borderRadius: 2, transition: "width 0.3s" }}/>
          </div>

          <div style={{ fontSize: 12, color: DOMAIN_COLORS[current.d], marginBottom: 4 }}>{DOMAIN_LABELS[current.d]}</div>
          <div style={{ fontSize: 10, color: "#6c7086", marginBottom: 12 }}>{current.src === "pa_exemplar" ? "PA QUESTION" : "SYNTHETIC"} / {current.b}</div>
          <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 20 }}>{current.s}</div>

          {current.c.map((choice, ci) => {
            let bg = "#313244";
            let border = "1px solid #45475a";
            if (selected !== null) {
              if (ci === current.a) { bg = "#1a3a2a"; border = "1px solid #a6e3a1"; }
              else if (ci === selected && ci !== current.a) { bg = "#3a1a1a"; border = "1px solid #f38ba8"; }
            }
            return (
              <button key={ci} onClick={() => handleAnswer(ci)} style={{
                width: "100%", padding: "12px 14px", marginBottom: 6, background: bg,
                color: "#cdd6f4", border, borderRadius: 8, fontSize: 13, cursor: selected !== null ? "default" : "pointer",
                fontFamily: "inherit", textAlign: "left", lineHeight: 1.5, transition: "all 0.15s"
              }}>
                <span style={{ fontWeight: 600, marginRight: 8, color: "#6c7086" }}>{String.fromCharCode(65 + ci)}</span>{choice}
              </button>
            );
          })}

          {selected !== null && (
            <div>
              {current.e && <div style={{ fontSize: 12, color: "#a6adc8", background: "#313244", padding: 12, borderRadius: 8, marginTop: 8, lineHeight: 1.5 }}>{current.e}</div>}
              <button onClick={nextQuestion} style={{ width: "100%", padding: 14, background: "#89b4fa", color: "#1e1e2e", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer", marginTop: 12, fontFamily: "inherit", letterSpacing: 1 }}>
                {queue.length === 0 && selected === current.a ? "FINISH" : "NEXT"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (mode === "done") {
    const total = stats.correct + stats.wrong;
    const pct = total > 0 ? Math.round((stats.correct / total) * 100) : 0;
    return (
      <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto", textAlign: "center", paddingTop: 60 }}>
          <div style={{ fontSize: 48, fontWeight: 700, color: "#a6e3a1" }}>{pct}%</div>
          <div style={{ fontSize: 14, color: "#6c7086", marginTop: 8 }}>{stats.correct} correct / {stats.wrong} wrong / {stats.seen.size} unique questions</div>
          <div style={{ fontSize: 14, color: "#a6e3a1", marginTop: 16, fontWeight: 600 }}>DECK CLEARED</div>
          <button onClick={() => setMode("menu")} style={{ padding: "14px 40px", background: "#45475a", color: "#cdd6f4", border: "none", borderRadius: 8, fontSize: 14, cursor: "pointer", marginTop: 24, fontFamily: "inherit" }}>BACK TO MENU</button>
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

</script>
</body>
</html>
