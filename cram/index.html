<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cram</title>
<meta property="og:title" content="Cram — Adaptive Drill Engine">
<meta property="og:description" content="HamStudy-style cram engine. Wrong answers re-queue immediately. Adaptive SRS with category filtering.">
<meta property="og:url" content="https://niggerfaggot.club/cram/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; background: #0a0a0f; color: #e2e2e8; font-family: 'JetBrains Mono', monospace; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
  .grad-text { background: linear-gradient(135deg, #a78bfa, #67e8f9, #6ee7b7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .btn { border: none; border-radius: 12px; padding: 14px 24px; font-family: inherit; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s ease; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #a78bfa, #6ee7b7); color: #0a0a0f; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
  .btn-ghost { background: #111118; border: 1px solid #333; color: #999; }
  .btn-correct { background: linear-gradient(135deg, #22c55e, #6ee7b7); color: #0a0a0f; font-weight: 800; }
  .btn-wrong { background: linear-gradient(135deg, #ef4444, #fca5a5); color: #0a0a0f; font-weight: 800; }
  .btn-skip { background: linear-gradient(135deg, #f59e0b, #fcd34d); color: #0a0a0f; font-weight: 800; }
  .progress-track { height: 4px; background: #1a1a2e; border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .choice { width: 100%; background: #0d0d14; border: 1px solid #222233; border-radius: 10px; padding: 12px 14px; color: #b0b0bc; font-size: 13px; line-height: 1.45; text-align: left; cursor: pointer; font-family: inherit; transition: all 0.15s ease; display: flex; align-items: flex-start; gap: 10px; }
  .choice:active { transform: scale(0.98); }
  .choice[disabled] { cursor: default; }
  .choice.correct { background: #0a2e1a; border-color: #22c55e; color: #6ee7b7; }
  .choice.wrong { background: #2e0a0a; border-color: #ef4444; color: #fca5a5; }
  .choice.dimmed { opacity: 0.4; }
  .choice-letter { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px; border-radius: 6px; border: 1.5px solid #333; font-size: 11px; font-weight: 700; color: #555; flex-shrink: 0; }
  .choice.correct .choice-letter { border-color: #22c55e; background: #22c55e22; color: #6ee7b7; }
  .mnemonic { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 12px; line-height: 1.5; color: #aaa; }
  .mnemonic.correct { background: #0a2e1a44; border: 1px solid #22c55e33; }
  .mnemonic.wrong { background: #2e0a0a44; border: 1px solid #ef444433; }
  .mnemonic.skip { background: #2e2a0a44; border: 1px solid #f59e0b33; }
  .course-card { background: #111118; border: 1px solid #222; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.15s ease; }
  .course-card:hover { border-color: #a78bfa44; }
  .q-grid { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 20px; }
  .q-dot { width: 28px; height: 28px; border-radius: 6px; font-size: 10px; border: 1px solid #222; background: #0d0d14; color: #444; cursor: pointer; font-family: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .q-dot.answered { background: #1a2e1a; color: #6ee7b7; }
  .q-dot.current { border: 2px solid #a78bfa; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.2s ease; }
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; justify-content: center; align-items: flex-start; padding-top: 40px; overflow-y: auto; }
  .overlay-panel { background: #111118; border: 1px solid #333; border-radius: 16px; padding: 24px 20px; width: 92%; max-width: 500px; margin-bottom: 40px; }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1a1a2e; }
  .toggle-label { font-size: 13px; color: #aaa; }
  .toggle { width: 44px; height: 24px; border-radius: 12px; background: #333; cursor: pointer; position: relative; transition: background 0.2s; border: none; }
  .toggle.on { background: #a78bfa; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 10px; background: white; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(20px); }
  .cat-filter { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #1a1a2e; cursor: pointer; }
  .cat-check { width: 20px; height: 20px; border-radius: 4px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; color: white; }
  .cat-check.checked { background: #a78bfa; border-color: #a78bfa; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

function getCompColor(comp) {
  const hue = [...comp].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return { bg: `hsl(${hue},30%,15%)`, accent: `hsl(${hue},60%,70%)`, glow: `hsla(${hue},60%,70%,0.2)` };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const DEFAULTS = { autoAdvance: false, randomizeQuestions: true, randomizeAnswers: true, showHistory: true };
function loadSettings() { try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("cram-s") || "{}") }; } catch { return DEFAULTS; } }
function saveSettings(s) { try { localStorage.setItem("cram-s", JSON.stringify(s)); } catch {} }

function initCram(bank) {
  const queue = shuffle(bank.map(q => q.id));
  const cards = {};
  bank.forEach(q => { cards[q.id] = { streak: 0, seen: 0, correct: 0, status: "unseen", history: [] }; });
  return { queue, cards, known: 0, total: bank.length, history: [] };
}
function cramAnswer(state, qId, result) {
  const card = { ...state.cards[qId] };
  card.seen++;
  card.status = "learning";
  card.history = [...card.history, result];
  const newQueue = [...state.queue];
  if (result === "correct") {
    card.correct++; card.streak++;
    if (card.streak >= 3) {
      card.status = "known";
      return { ...state, cards: { ...state.cards, [qId]: card }, queue: newQueue, known: state.known + 1, history: [...state.history, { id: qId, result }] };
    }
  } else if (result === "skip") {
    const pos = Math.min(6 + Math.floor(Math.random() * 5), newQueue.length);
    newQueue.splice(pos, 0, qId);
  } else {
    card.streak = 0;
    const pos = Math.min(3 + Math.floor(Math.random() * 4), newQueue.length);
    newQueue.splice(pos, 0, qId);
  }
  return { ...state, cards: { ...state.cards, [qId]: card }, queue: newQueue, history: [...state.history, { id: qId, result }] };
}

function AttemptDots({ history }) {
  if (!history || history.length === 0) return null;
  return (
    <div style={{ display: "flex", gap: 3, alignItems: "center" }}>
      {history.slice(-8).map((h, i) => (
        <div key={i} style={{ width: 8, height: 8, borderRadius: 4, background: h === "correct" ? "#22c55e" : h === "skip" ? "#f59e0b" : "#ef4444" }} />
      ))}
    </div>
  );
}

function QuestionCard({ question, onAnswer, onSkip, showMnemonic, selectedIdx, result, settings }) {
  const col = getCompColor(question.comp);
  const answered = selectedIdx !== null || result === "skip";
  const shuffledOrder = useMemo(() => {
    if (!settings?.randomizeAnswers) return question.choices.map((_, i) => i);
    const indices = question.choices.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
    return indices;
  }, [question.id, settings?.randomizeAnswers]);
  return (
    <div style={{ background: "#111118", border: `1px solid ${col.accent}22`, borderRadius: 16, padding: "20px 16px", marginBottom: 16, boxShadow: answered ? "none" : `0 0 40px ${col.glow}` }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 10, letterSpacing: 2, textTransform: "uppercase", color: col.accent, fontWeight: 600 }}>{question.comp}</span>
          {question.id && <span style={{ fontSize: 9, color: "#333" }}>{question.id}</span>}
        </div>
        {!answered && onSkip && <button onClick={onSkip} style={{ background: "none", border: "none", color: "#f59e0b", cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 600 }}>I don't know</button>}
      </div>
      <div style={{ fontSize: 15, lineHeight: 1.55, color: "#d4d4dc", marginBottom: 16 }}>{question.q}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {shuffledOrder.map((origIdx, di) => {
          let cls = "choice";
          if (answered) { if (origIdx === question.answer) cls += " correct"; else if (origIdx === selectedIdx) cls += " wrong"; else cls += " dimmed"; }
          return (<button key={di} className={cls} onClick={() => !answered && onAnswer(origIdx)} disabled={answered}><span className="choice-letter">{String.fromCharCode(65 + di)}</span><span>{question.choices[origIdx]}</span></button>);
        })}
      </div>
      {showMnemonic && answered && question.mnemonic && (
        <div className={`mnemonic ${result === "correct" ? "correct" : result === "skip" ? "skip" : "wrong"}`}>
          <span style={{ fontWeight: 700, color: result === "correct" ? "#6ee7b7" : result === "skip" ? "#fcd34d" : "#fca5a5" }}>{result === "correct" ? "✓ " : result === "skip" ? "? " : "✗ "}</span>
          {question.mnemonic}
        </div>
      )}
    </div>
  );
}

function SettingsOverlay({ settings, setSettings, bank, enabledCats, setEnabledCats, onClose, stats }) {
  const comps = [...new Set(bank.map(q => q.comp))];
  const toggle = (key) => { const next = { ...settings, [key]: !settings[key] }; setSettings(next); saveSettings(next); };
  const toggleCat = (cat) => { const next = new Set(enabledCats); if (next.has(cat)) { if (next.size > 1) next.delete(cat); } else next.add(cat); setEnabledCats(next); };
  const allOn = enabledCats.size === comps.length;
  const totalEnabled = bank.filter(q => enabledCats.has(q.comp)).length;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="overlay-panel fade-in" onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 16, fontWeight: 800 }}>Study Progress</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontSize: 20 }}>×</button>
        </div>
        {stats && (
          <div style={{ display: "flex", gap: 16, marginBottom: 20 }}>
            <div style={{ flex: 1, background: "#fcd34d22", borderRadius: 10, padding: "10px 14px", textAlign: "center" }}>
              <div style={{ fontSize: 9, color: "#888", letterSpacing: 1 }}>SEEN</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: "#fcd34d" }}>{stats.seenPct}%</div>
            </div>
            <div style={{ flex: 1, background: "#67e8f922", borderRadius: 10, padding: "10px 14px", textAlign: "center" }}>
              <div style={{ fontSize: 9, color: "#888", letterSpacing: 1 }}>APTITUDE</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: "#67e8f9" }}>{stats.aptPct}%</div>
            </div>
          </div>
        )}
        <div style={{ fontSize: 13, fontWeight: 700, color: "#888", letterSpacing: 1, marginBottom: 8 }}>OPTIONS</div>
        <div className="toggle-row"><span className="toggle-label">Auto advance if correct</span><button className={`toggle ${settings.autoAdvance ? "on" : ""}`} onClick={() => toggle("autoAdvance")} /></div>
        <div className="toggle-row"><span className="toggle-label">Randomize questions</span><button className={`toggle ${settings.randomizeQuestions ? "on" : ""}`} onClick={() => toggle("randomizeQuestions")} /></div>
        <div className="toggle-row"><span className="toggle-label">Randomize answers</span><button className={`toggle ${settings.randomizeAnswers ? "on" : ""}`} onClick={() => toggle("randomizeAnswers")} /></div>
        <div className="toggle-row" style={{ borderBottom: "none" }}><span className="toggle-label">Show answer history</span><button className={`toggle ${settings.showHistory ? "on" : ""}`} onClick={() => toggle("showHistory")} /></div>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#888", letterSpacing: 1, margin: "20px 0 8px" }}>QUESTION FILTER</div>
        <div style={{ fontSize: 11, color: "#555", marginBottom: 12 }}>{totalEnabled} questions from {enabledCats.size} categories</div>
        <div onClick={() => setEnabledCats(new Set(allOn ? [comps[0]] : comps))} style={{ cursor: "pointer", fontSize: 11, color: "#a78bfa", marginBottom: 8, fontWeight: 600 }}>{allOn ? "Deselect all" : "Select all"}</div>
        {comps.map(c => {
          const col = getCompColor(c); const on = enabledCats.has(c); const cnt = bank.filter(q => q.comp === c).length;
          return (<div key={c} className="cat-filter" onClick={() => toggleCat(c)}><div className={`cat-check ${on ? "checked" : ""}`}>{on ? "✓" : ""}</div><div style={{ flex: 1 }}><div style={{ fontSize: 12, color: on ? col.accent : "#555", fontWeight: 600 }}>{c}</div><div style={{ fontSize: 10, color: "#444" }}>{cnt} questions</div></div></div>);
        })}
        <button className="btn btn-ghost" style={{ width: "100%", marginTop: 16 }} onClick={onClose}>APPLY</button>
      </div>
    </div>
  );
}

function CourseSelectScreen({ courses, onSelect }) {
  return (
    <div className="container">
      <div style={{ textAlign: "center", marginBottom: 32, paddingTop: 20 }}>
        <div className="grad-text" style={{ fontSize: 32, fontWeight: 800 }}>CRAM</div>
        <div style={{ fontSize: 12, color: "#444", letterSpacing: 2, marginTop: 4 }}>Adaptive Drill Engine</div>
      </div>
      {courses.length === 0 && <div style={{ textAlign: "center", color: "#555", padding: 40 }}><div style={{ fontSize: 32, marginBottom: 12 }}>📭</div><div>No question banks found.</div><div style={{ fontSize: 12, marginTop: 8, color: "#444" }}>Banks load from /cram/banks/*.json</div></div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {courses.map(c => (
          <div key={c.id} className="course-card" onClick={() => onSelect(c)}>
            <div className="grad-text" style={{ fontSize: 20, fontWeight: 800, marginBottom: 4 }}>{c.id}</div>
            <div style={{ fontSize: 13, color: "#888", marginBottom: 8 }}>{c.name}</div>
            <div style={{ fontSize: 11, color: "#555" }}>{c.questions.length} questions · {[...new Set(c.questions.map(q => q.comp))].length} categories</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ModeSelectScreen({ course, onStart, onBack }) {
  return (
    <div className="container">
      <div style={{ textAlign: "center", marginBottom: 24, paddingTop: 12 }}>
        <div style={{ fontSize: 12, letterSpacing: 4, textTransform: "uppercase", color: "#555" }}>CRAM</div>
        <div className="grad-text" style={{ fontSize: 28, fontWeight: 800 }}>{course.id}</div>
        <div style={{ fontSize: 13, color: "#666" }}>{course.name}</div>
      </div>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div style={{ fontSize: 48, fontWeight: 800 }}>{course.questions.length}</div>
        <div style={{ fontSize: 12, color: "#666", letterSpacing: 1 }}>QUESTIONS</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 24 }}>
        <button className="btn btn-primary" style={{ width: "100%", padding: "16px" }} onClick={() => onStart("cram")}>⚡ STUDY</button>
        <div style={{ fontSize: 11, color: "#555", textAlign: "center", lineHeight: 1.5 }}>Adaptive drill. Wrong answers re-queue. 3× streak to master.</div>
        <button className="btn btn-ghost" style={{ width: "100%" }} onClick={() => onStart("exam")}>📝 PRACTICE EXAM</button>
        <div style={{ fontSize: 11, color: "#444", textAlign: "center" }}>Timed simulation</div>
        <button className="btn btn-ghost" style={{ width: "100%", marginTop: 8, color: "#555" }} onClick={onBack}>← courses</button>
      </div>
    </div>
  );
}

function CramScreen({ bank: fullBank, onHome }) {
  const [settings, setSettings] = useState(loadSettings);
  const allComps = useMemo(() => [...new Set(fullBank.map(q => q.comp))], [fullBank]);
  const [enabledCats, setEnabledCats] = useState(() => new Set(allComps));
  const [showSettings, setShowSettings] = useState(false);
  const bank = useMemo(() => fullBank.filter(q => enabledCats.has(q.comp)), [fullBank, enabledCats]);
  const [state, setState] = useState(() => initCram(bank));
  const [currentQ, setCurrentQ] = useState(null);
  const [selected, setSelected] = useState(null);
  const [lastResult, setLastResult] = useState(null);
  const [showNext, setShowNext] = useState(false);
  const [start] = useState(Date.now());
  const [done, setDone] = useState(false);
  const stateRef = useRef(state);
  stateRef.current = state;
  const autoRef = useRef(null);

  useEffect(() => {
    const ns = initCram(bank); setState(ns); stateRef.current = ns;
    setDone(false); setCurrentQ(null); setSelected(null); setLastResult(null); setShowNext(false);
  }, [bank]);

  const drawNext = useCallback(() => {
    if (autoRef.current) { clearTimeout(autoRef.current); autoRef.current = null; }
    const st = stateRef.current;
    if (st.queue.length === 0) { setDone(true); return; }
    const nextId = st.queue[0];
    setState(prev => ({ ...prev, queue: prev.queue.slice(1) }));
    setCurrentQ(bank.find(q => q.id === nextId));
    setSelected(null); setLastResult(null); setShowNext(false);
  }, [bank]);

  useEffect(() => { if (bank.length > 0 && !currentQ && !done) drawNext(); }, [bank, currentQ, done, drawNext]);

  const handleAnswer = (idx) => {
    if (selected !== null || lastResult === "skip") return;
    setSelected(idx);
    const isCorrect = idx === currentQ.answer;
    const result = isCorrect ? "correct" : "wrong";
    setLastResult(result);
    setState(prev => { const next = cramAnswer(prev, currentQ.id, result); stateRef.current = next; return next; });
    if (isCorrect && settings.autoAdvance) { autoRef.current = setTimeout(drawNext, 600); }
    else setShowNext(true);
  };
  const handleSkip = () => {
    if (selected !== null || lastResult === "skip") return;
    setLastResult("skip");
    setState(prev => { const next = cramAnswer(prev, currentQ.id, "skip"); stateRef.current = next; return next; });
    setShowNext(true);
  };

  const stats = useMemo(() => {
    const seen = Object.values(state.cards).filter(c => c.seen > 0).length;
    const totalC = Object.values(state.cards).reduce((a, c) => a + c.correct, 0);
    const totalS = Object.values(state.cards).reduce((a, c) => a + c.seen, 0);
    return { seenPct: state.total > 0 ? Math.round((seen / state.total) * 100) : 0, aptPct: totalS > 0 ? Math.round((totalC / totalS) * 100) : 0 };
  }, [state]);

  if (done) {
    const elapsed = Math.round((Date.now() - start) / 1000);
    const total = state.history.length;
    const correct = state.history.filter(h => h.result === "correct").length;
    return (
      <div className="container" style={{ textAlign: "center", paddingTop: 40 }}>
        <div style={{ fontSize: 48, marginBottom: 8 }}>🔥</div>
        <div className="grad-text" style={{ fontSize: 24, fontWeight: 800 }}>BANK CLEARED</div>
        <div style={{ color: "#666", fontSize: 13, marginBottom: 32 }}>Every question 3× correct in a row</div>
        <div style={{ display: "flex", justifyContent: "center", gap: 24, marginBottom: 32 }}>
          <div><div style={{ fontSize: 32, fontWeight: 800, color: "#6ee7b7" }}>{Math.floor(elapsed/60)}:{String(elapsed%60).padStart(2,"0")}</div><div style={{ fontSize: 10, color: "#555" }}>TIME</div></div>
          <div><div style={{ fontSize: 32, fontWeight: 800, color: "#a78bfa" }}>{total}</div><div style={{ fontSize: 10, color: "#555" }}>ANSWERS</div></div>
          <div><div style={{ fontSize: 32, fontWeight: 800, color: "#67e8f9" }}>{total > 0 ? Math.round((correct/total)*100) : 0}%</div><div style={{ fontSize: 10, color: "#555" }}>ACCURACY</div></div>
        </div>
        <button className="btn btn-ghost" style={{ marginTop: 24 }} onClick={onHome}>← Back</button>
      </div>
    );
  }
  if (!currentQ) return null;
  const card = state.cards[currentQ.id];
  const remaining = state.queue.length + 1;
  const answered = selected !== null || lastResult === "skip";

  return (
    <div className="container">
      {showSettings && <SettingsOverlay settings={settings} setSettings={setSettings} bank={fullBank} enabledCats={enabledCats} setEnabledCats={setEnabledCats} onClose={() => setShowSettings(false)} stats={stats} />}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <button onClick={onHome} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontSize: 13, fontFamily: "inherit" }}>← quit</button>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ fontSize: 11, color: "#555" }}>{remaining} left · {state.known}/{state.total}</div>
          <button onClick={() => setShowSettings(true)} style={{ background: "none", border: "none", color: "#666", cursor: "pointer", fontSize: 16 }}>📊</button>
        </div>
      </div>
      <div className="progress-track"><div className="progress-fill" style={{ background: "linear-gradient(90deg, #a78bfa, #6ee7b7)", width: `${(state.known / state.total) * 100}%` }} /></div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        {card.seen > 0 ? (
          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
            {[0,1,2].map(i => <div key={i} style={{ width: 8, height: 8, borderRadius: 4, background: i < card.streak ? "#22c55e" : "#222" }} />)}
            <span style={{ fontSize: 10, color: "#444", marginLeft: 4 }}>{card.streak}/3</span>
          </div>
        ) : <div />}
        {settings.showHistory && card.history.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ fontSize: 9, color: "#444" }}>{card.history.length} attempt{card.history.length !== 1 ? "s" : ""}</span>
            <AttemptDots history={card.history} />
          </div>
        )}
      </div>
      <QuestionCard question={currentQ} onAnswer={handleAnswer} onSkip={handleSkip} showMnemonic={true} selectedIdx={selected} result={lastResult} settings={settings} />
      {showNext && (
        <button className={`btn ${lastResult === "correct" ? "btn-correct" : lastResult === "skip" ? "btn-skip" : "btn-wrong"} fade-in`} style={{ width: "100%", fontSize: 15 }} onClick={drawNext}>
          {state.queue.length === 0 ? "🔥 FINISH" : "NEXT →"}
        </button>
      )}
    </div>
  );
}

function ExamScreen({ bank, onHome }) {
  const [questions] = useState(() => shuffle(bank).slice(0, Math.min(bank.length, 42)));
  const [answers, setAnswers] = useState({});
  const [idx, setIdx] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [start] = useState(Date.now());
  const settings = loadSettings();
  const q = questions[idx]; const cnt = Object.keys(answers).length;
  if (submitted) {
    let correct = 0;
    questions.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const pct = Math.round((correct / questions.length) * 100); const passed = pct >= 67;
    const elapsed = Math.round((Date.now() - start) / 1000);
    const byComp = {}; questions.forEach(q => { if (!byComp[q.comp]) byComp[q.comp] = { total: 0, correct: 0 }; byComp[q.comp].total++; if (answers[q.id] === q.answer) byComp[q.comp].correct++; });
    const missed = questions.filter(q => answers[q.id] !== q.answer);
    return (
      <div className="container">
        <div style={{ textAlign: "center", padding: "40px 0 24px" }}>
          <div style={{ fontSize: 48, marginBottom: 8 }}>{passed ? "✅" : "❌"}</div>
          <div className="grad-text" style={{ fontSize: 24, fontWeight: 800 }}>{correct}/{questions.length} — {pct}%</div>
          <div style={{ color: "#666", fontSize: 13 }}>{passed ? "PASS" : "FAIL"} · {Math.floor(elapsed/60)} min</div>
        </div>
        <div style={{ marginBottom: 24 }}>
          {Object.entries(byComp).map(([comp, data]) => {
            const col = getCompColor(comp);
            return (<div key={comp} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #151520" }}><div style={{ flex: 1, fontSize: 12, color: col.accent }}>{comp}</div><div style={{ width: 100, height: 6, background: "#1a1a2e", borderRadius: 3, overflow: "hidden" }}><div style={{ height: "100%", width: `${Math.round((data.correct/data.total)*100)}%`, background: col.accent, borderRadius: 3 }} /></div><div style={{ fontSize: 12, color: "#888", width: 50, textAlign: "right" }}>{data.correct}/{data.total}</div></div>);
          })}
        </div>
        {missed.length > 0 && <div style={{ fontSize: 13, color: "#555", fontWeight: 700, marginBottom: 12, letterSpacing: 1 }}>REVIEW MISSED</div>}
        {missed.map(q => <QuestionCard key={q.id} question={q} onAnswer={() => {}} showMnemonic={true} selectedIdx={answers[q.id] ?? null} result={answers[q.id] === q.answer ? "correct" : "wrong"} settings={settings} />)}
        {missed.length === 0 && <div style={{ color: "#22c55e", fontSize: 14, textAlign: "center", padding: 20 }}>Perfect score.</div>}
        <button className="btn btn-ghost" style={{ width: "100%", marginTop: 16, marginBottom: 32 }} onClick={onHome}>← Back</button>
      </div>
    );
  }
  return (
    <div className="container">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <button onClick={onHome} style={{ background: "none", border: "none", color: "#555", cursor: "pointer", fontSize: 13, fontFamily: "inherit" }}>← quit</button>
        <div style={{ fontSize: 11, color: "#555" }}>Q{idx+1}/{questions.length} · {cnt} answered</div>
      </div>
      <div className="progress-track"><div className="progress-fill" style={{ background: "linear-gradient(90deg, #fcd34d, #f97316)", width: `${((idx+1)/questions.length)*100}%` }} /></div>
      <QuestionCard question={q} onAnswer={(i) => setAnswers(prev => ({ ...prev, [q.id]: i }))} showMnemonic={false} selectedIdx={answers[q.id] ?? null} result={answers[q.id] !== undefined ? (answers[q.id] === q.answer ? "correct" : "wrong") : null} settings={settings} />
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <button className="btn btn-ghost" style={{ flex: 1, opacity: idx === 0 ? 0.3 : 1 }} disabled={idx === 0} onClick={() => setIdx(i => i-1)}>← Prev</button>
        {idx < questions.length - 1
          ? <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setIdx(i => i+1)}>Next →</button>
          : <button className="btn" style={{ flex: 1, background: cnt === questions.length ? "linear-gradient(135deg, #fcd34d, #f97316)" : "#222", color: cnt === questions.length ? "#0a0a0f" : "#555", fontWeight: 800 }} onClick={() => setSubmitted(true)}>SUBMIT ({cnt}/{questions.length})</button>
        }
      </div>
      <div className="q-grid">{questions.map((q, i) => (<button key={i} className={`q-dot ${answers[q.id] !== undefined ? "answered" : ""} ${i === idx ? "current" : ""}`} onClick={() => setIdx(i)}>{i+1}</button>))}</div>
    </div>
  );
}

function App() {
  const [courses, setCourses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [mode, setMode] = useState(null);
  useEffect(() => {
    async function load() {
      try {
        const manifest = await fetch("banks/manifest.json").then(r => r.json());
        const loaded = [];
        for (const entry of manifest) { try { const data = await fetch(`banks/${entry.file}`).then(r => r.json()); loaded.push({ id: entry.id, name: entry.name, questions: data }); } catch {} }
        setCourses(loaded);
      } catch { console.warn("No manifest"); }
      setLoading(false);
    }
    load();
  }, []);
  if (loading) return <div className="container" style={{ textAlign: "center", paddingTop: 100, color: "#555" }}>Loading...</div>;
  if (mode === "cram" && selected) return <CramScreen bank={selected.questions} onHome={() => setMode(null)} />;
  if (mode === "exam" && selected) return <ExamScreen bank={selected.questions} onHome={() => setMode(null)} />;
  if (selected) return <ModeSelectScreen course={selected} onStart={setMode} onBack={() => setSelected(null)} />;
  return <CourseSelectScreen courses={courses} onSelect={setSelected} />;
}
ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
