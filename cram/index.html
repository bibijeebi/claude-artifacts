const QUESTIONS = [{"i":0,"s":"Employee A: routine jobs, self-doubt, powerless. Employee B: initiative, ambitious goals, team efficacy. Which describes these employees?","c":["Employee A exhibits positive CSE, Employee B exhibits negative CSE","Employee A exhibits an internal locus of control, Employee B exhibits an external locus of control","Employee A exhibits negative CSE, Employee B exhibits positive CSE","Employee A exhibits an external locus of control, Employee B exhibits an internal locus of control"],"a":2,"d":"behavioral_influences","e":"","b":"application","src":"pa_exemplar"},{"i":1,"s":"Employee B was upset by Employee A's behavior at the department's planning meeting. Which factors will influence Employee B's perception in this situation?","c":["Situation, target, and perceiver","Stimulation, task, and skills","Problem, criteria, and alternatives","Heredity, environment, and perceiver"],"a":0,"d":"behavioral_influences","e":"","b":"recall","src":"pa_exemplar"},{"i":2,"s":"A person is broadminded, courageous, and forgiving. Which type of values are these?","c":["Transitory values","Determinate values","Terminal values","Instrumental values"],"a":3,"d":"behavioral_influences","e":"","b":"recall","src":"pa_exemplar"},{"i":3,"s":"An employee does the minimum amount of work required and avoids volunteering for additional tasks. Which concept best describes this behavior?","c":["Organizational citizenship behavior","Withdrawal behavior","Deviant workplace behavior","Low organizational commitment"],"a":1,"d":"behavioral_influences","e":"","b":"application","src":"pa_exemplar"},{"i":4,"s":"A manager wants to understand why an employee is consistently late. According to attribution theory, which factor would suggest an internal attribution?","c":["Other employees are also late","The employee is late only on Mondays","The employee is late regardless of circumstances","The employee was recently assigned a new shift"],"a":2,"d":"behavioral_influences","e":"","b":"application","src":"pa_exemplar"},{"i":5,"s":"Manager A supervises 10 district units with 100 employees and receives $100,000 in compensation. Manager B supervises 5 district units with 50 employees and also receives $100,000. Manager A is upset and looking for a new job. Which theory explains this?","c":["Perception theory","Perceptual fairness theory","Inequity theory","Equity theory"],"a":3,"d":"behavioral_influences","e":"","b":"application","src":"pa_exemplar"},{"i":6,"s":"Which motivational theory suggests that the strength of a tendency to act depends on the expectation that the act will be followed by a given outcome?","c":["Maslow's hierarchy of needs","Herzberg's two-factor theory","Expectancy theory","Goal-setting theory"],"a":2,"d":"behavioral_influences","e":"","b":"recall","src":"pa_exemplar"},{"i":7,"s":"What defines a set of expected behavior patterns attributed to a person occupying a given position in a social unit?","c":["Group conformity","Group role","Group status","Group norm"],"a":1,"d":"group_development","e":"","b":"recall","src":"pa_exemplar"},{"i":8,"s":"Which type of group is defined by the organization's structure?","c":["Designated group","Formal group","Unified group","Informal group"],"a":1,"d":"group_development","e":"","b":"recall","src":"pa_exemplar"},{"i":9,"s":"During which stage of group development do members accept the group but resist constraints on individuality?","c":["Forming","Storming","Norming","Performing"],"a":1,"d":"group_development","e":"","b":"recall","src":"pa_exemplar"},{"i":10,"s":"To resolve a conflict between the department staff and the janitorial staff, the department head informs the department staff of a new policy prohibiting eating at the desk. Which conflict resolution technique is this?","c":["Authoritative command","Altering the structural variables","Altering the human variable","Problem solving"],"a":1,"d":"group_development","e":"","b":"application","src":"pa_exemplar"},{"i":11,"s":"What is an advantage of a cohesive group?","c":["When organized by department, task subgroups do not form and command groups emerge","When performance-related goals are high, a cohesive group is more productive","When organized by department, task subgroups compete within the group","When performance-related goals are low, a cohesive group is more productive"],"a":1,"d":"group_development","e":"","b":"recall","src":"pa_exemplar"},{"i":12,"s":"What is an advantage of a group that is not very cohesive?","c":["When performance norms are high, productivity will be higher than in a cohesive group","When performance norms are low, productivity may be higher than in a cohesive group","There is less need for giving rewards as group rewards","When making a group decision, groupthink is more likely to occur"],"a":1,"d":"group_development","e":"","b":"application","src":"pa_exemplar"},{"i":13,"s":"What is the primary risk when a highly cohesive group has low performance norms?","c":["The group will dissolve","Productivity will be low","Members will leave for other groups","Conflict will increase dramatically"],"a":1,"d":"group_development","e":"","b":"application","src":"pa_exemplar"},{"i":14,"s":"Which phenomenon describes when group pressures for conformity deter the group from critically appraising unusual or unpopular views?","c":["Social loafing","Group polarization","Groupthink","Conformity bias"],"a":2,"d":"group_development","e":"","b":"recall","src":"pa_exemplar"},{"i":15,"s":"What is the primary characteristic that distinguishes a team from a group?","c":["Teams are always larger than groups","Teams generate positive synergy through coordinated effort","Teams require less communication","Teams have informal leadership structures"],"a":1,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":16,"s":"Which type of team brings together employees from the same hierarchical level but different work areas to accomplish a task?","c":["Self-managed team","Cross-functional team","Virtual team","Problem-solving team"],"a":1,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":17,"s":"Which type of team uses technology to tie together physically dispersed members?","c":["Problem-solving team","Cross-functional team","Virtual team","Self-managed team"],"a":2,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":18,"s":"Which type of team consists of 5-12 employees from the same department who meet to discuss ways of improving quality and efficiency?","c":["Cross-functional team","Self-managed team","Virtual team","Problem-solving team"],"a":3,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":19,"s":"A team has been given autonomy to make decisions and implement solutions without management approval. What type of team is this?","c":["Problem-solving team","Cross-functional team","Self-managed team","Virtual team"],"a":2,"d":"teams_and_team_building","e":"","b":"application","src":"pa_exemplar"},{"i":20,"s":"What factor most contributes to team effectiveness?","c":["Individual star performers","Adequate resources and leadership","Large team size","Homogeneous membership"],"a":1,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":21,"s":"Which is a key process variable that distinguishes effective teams?","c":["Team size","Member demographics","Common purpose and specific goals","Physical workspace design"],"a":2,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":22,"s":"What is social loafing?","c":["Members working harder in groups than alone","The tendency for individuals to expend less effort in a group","A positive effect of group synergy","The process of building team cohesion"],"a":1,"d":"teams_and_team_building","e":"","b":"recall","src":"pa_exemplar"},{"i":23,"s":"What is organizational culture?","c":["The formal rules and regulations of an organization","A system of shared meaning held by members that distinguishes the organization","The organizational chart and reporting structure","The physical layout of the workplace"],"a":1,"d":"organizational_culture","e":"","b":"recall","src":"pa_exemplar"},{"i":24,"s":"How is organizational culture most commonly transmitted to employees?","c":["Through formal training programs only","Through symbols, rituals, and stories","Through compensation and benefits","Through technology systems"],"a":1,"d":"organizational_culture","e":"","b":"recall","src":"pa_exemplar"},{"i":25,"s":"How do rituals function in organizational culture?","c":["They replace formal policies","They reinforce key values and help define the culture","They eliminate the need for leadership","They reduce organizational costs"],"a":1,"d":"organizational_culture","e":"","b":"recall","src":"pa_exemplar"},{"i":26,"s":"What is the founder's role in creating organizational culture?","c":["Founders have minimal impact on culture","Founders establish the initial culture through their vision and values","Founders only affect culture through formal policies","Founders delegate culture creation to HR"],"a":1,"d":"organizational_culture","e":"","b":"recall","src":"pa_exemplar"},{"i":27,"s":"How is organizational culture maintained over time?","c":["Exclusively through written policies","Through selection, socialization, and top management behavior","Only through training programs","Through annual culture audits"],"a":1,"d":"organizational_culture","e":"","b":"recall","src":"pa_exemplar"},{"i":28,"s":"How do employees respond when they perceive organizational politics as threatening?","c":["With proactive behaviors","With increased organizational commitment","With defensive behaviors","With increased productivity"],"a":2,"d":"organizational_culture","e":"","b":"recall","src":"pa_exemplar"},{"i":29,"s":"A manager communicates a clear sense of vision to gain buy-in from employees. Which leadership approach is this?","c":["Transactional leadership","Laissez-faire leadership","Transformational leadership","Autocratic leadership"],"a":2,"d":"leadership","e":"","b":"application","src":"pa_exemplar"},{"i":30,"s":"Which component of transformational leadership involves providing constant, active feedback?","c":["Idealized influence","Inspirational motivation","Intellectual stimulation","Individualized consideration"],"a":3,"d":"leadership","e":"","b":"recall","src":"pa_exemplar"},{"i":31,"s":"What conflict resolution approach involves a neutral third party who facilitates a negotiated solution?","c":["Arbitration","Mediation","Negotiation","Avoidance"],"a":1,"d":"leadership","e":"","b":"recall","src":"pa_exemplar"},{"i":32,"s":"According to the Fiedler model, what determines the effectiveness of a leader?","c":["The leader's personality traits alone","The match between leadership style and degree of situational control","The number of followers","The leader's education level"],"a":1,"d":"leadership","e":"","b":"recall","src":"pa_exemplar"},{"i":33,"s":"Which leadership theory suggests leaders should adjust their style based on the readiness of followers?","c":["Trait theory","Path-goal theory","Situational leadership theory","Servant leadership theory"],"a":2,"d":"leadership","e":"","b":"recall","src":"pa_exemplar"},{"i":34,"s":"What are the four components of transformational leadership (the 4 I's)?","c":["Innovation, Implementation, Integration, Improvement","Idealized influence, Inspirational motivation, Intellectual stimulation, Individualized consideration","Integrity, Intelligence, Intuition, Influence","Independence, Inspiration, Innovation, Inclusion"],"a":1,"d":"leadership","e":"","b":"recall","src":"pa_exemplar"},{"i":35,"s":"What is the primary purpose of employee performance evaluations?","c":["To establish organizational culture","To provide feedback and determine reward allocations","To create team-building opportunities","To satisfy legal requirements only"],"a":1,"d":"performance_evaluation","e":"","b":"recall","src":"pa_exemplar"},{"i":36,"s":"Which statement about performance evaluation and motivation is true?","c":["Employees are motivated regardless of evaluation methods","Employees must have confidence that effort will lead to a favorable performance evaluation","Performance evaluations have no impact on employee motivation","Only extrinsic rewards from evaluations drive motivation"],"a":1,"d":"performance_evaluation","e":"","b":"application","src":"pa_exemplar"},{"i":37,"s":"When is a 360-degree evaluation most appropriate?","c":["When only supervisor feedback is needed","When evaluating entry-level employees exclusively","When both internal and external customer feedback is helpful","When the organization wants to simplify the evaluation process"],"a":2,"d":"performance_evaluation","e":"","b":"application","src":"pa_exemplar"},{"i":38,"s":"What is the main evaluation criterion that supports team performance?","c":["Individual contribution scores","Peer popularity rankings","Team results being tied to important goals","Manager's subjective assessment"],"a":2,"d":"performance_evaluation","e":"","b":"recall","src":"pa_exemplar"},{"i":39,"s":"A manager notices that an employee consistently excels in creative tasks but struggles with routine work. Which personality trait is most likely influencing this behavior?","c":["Conscientiousness","Openness to Experience","Neuroticism","Agreeableness"],"a":1,"d":"behavioral_influences","e":"Openness to experience is often associated with creativity and a preference for variety over routine.","b":"application","src":"synthetic"},{"i":40,"s":"During a performance review, an employee is praised for their teamwork and collaborative approach but criticized for lack of assertiveness. Which Big Five personality trait might this critique highlight?","c":["High Agreeableness","High Neuroticism","Low Conscientiousness","High Extraversion"],"a":0,"d":"behavioral_influences","e":"High agreeableness can lead to positive teamwork but may also result in a lack of assertiveness.","b":"application","src":"synthetic"},{"i":41,"s":"In a team meeting, an employee suggests an innovative solution but is met with skepticism. What perceptual error could the team be making?","c":["Self-serving bias","Projection bias","Fundamental attribution error","Confirmation bias"],"a":3,"d":"behavioral_influences","e":"Confirmation bias occurs when people favor information that confirms their preexisting beliefs, leading to skepticism of new ideas.","b":"analysis","src":"synthetic"},{"i":42,"s":"An employee consistently misses deadlines and provides excuses related to external factors. According to attribution theory, how might the manager perceive these excuses?","c":["As evidence of low conscientiousness","As internal attributions","As external attributions","As self-serving bias"],"a":2,"d":"behavioral_influences","e":"The manager might perceive these excuses as external attributions because the employee attributes their performance issues to factors outside their control.","b":"application","src":"synthetic"},{"i":43,"s":"A company notices low employee engagement and motivation. They decide to implement a rewards program. Which motivational theory does this action align with?","c":["Maslow's Hierarchy of Needs","Herzberg's Two-Factor Theory","Expectancy Theory","McClelland's Theory of Needs"],"a":2,"d":"behavioral_influences","e":"Expectancy theory suggests that employees are motivated when they believe their efforts will lead to desired rewards.","b":"application","src":"synthetic"},{"i":44,"s":"During a conflict resolution training, participants learn to recognize their own biases in decision-making. Which aspect of perception is primarily being addressed?","c":["Selective perception","Stereotyping","Attribution theory","Projection"],"a":0,"d":"behavioral_influences","e":"Selective perception involves focusing on certain information while ignoring others, which can lead to biased decision-making.","b":"recall","src":"synthetic"},{"i":45,"s":"A manager encourages employees to participate in decision-making processes to enhance their motivation and commitment. Which motivational theory supports this approach?","c":["Maslow's Hierarchy of Needs","Equity Theory","Self-Determination Theory","Herzberg's Two-Factor Theory"],"a":2,"d":"behavioral_influences","e":"Self-Determination Theory emphasizes the importance of autonomy in enhancing motivation and commitment.","b":"application","src":"synthetic"},{"i":46,"s":"An organization notices that employees are more motivated when they feel their work is appreciated. This aligns with which motivation theory?","c":["Expectancy Theory","Maslow's Hierarchy of Needs","Herzberg's Two-Factor Theory","Equity Theory"],"a":3,"d":"behavioral_influences","e":"Equity theory focuses on fairness and how perceived equity affects motivation. Feeling appreciated can enhance perceptions of fairness.","b":"application","src":"synthetic"},{"i":47,"s":"An employee who is driven by a desire for achievement, power, and affiliation is likely influenced by which motivational model?","c":["McClelland's Theory of Needs","Maslow's Hierarchy of Needs","Vroom's Expectancy Theory","Goal-Setting Theory"],"a":0,"d":"behavioral_influences","e":"McClelland's Theory of Needs identifies achievement, power, and affiliation as primary motivators.","b":"recall","src":"synthetic"},{"i":48,"s":"A team member consistently comes up with new ideas but struggles with time management and meeting deadlines. Which personality trait is most likely being displayed?","c":["High Openness","Low Conscientiousness","High Extraversion","Low Agreeableness"],"a":1,"d":"behavioral_influences","e":"Low conscientiousness is often associated with poor time management and difficulty meeting deadlines.","b":"application","src":"synthetic"},{"i":49,"s":"A manager tries to understand why two employees have different reactions to the same situation. One finds it challenging, the other effortless. Which factor is most likely causing this difference?","c":["Different personality traits","Different skill levels","Different past experiences","Different motivational levels"],"a":0,"d":"behavioral_influences","e":"Different personality traits can lead individuals to perceive and react to situations differently.","b":"analysis","src":"synthetic"},{"i":50,"s":"An employee believes they are underpaid compared to their coworkers doing similar work, which decreases their motivation. Which theory explains this sentiment?","c":["Reinforcement Theory","Equity Theory","Self-Determination Theory","Herzberg's Two-Factor Theory"],"a":1,"d":"behavioral_influences","e":"Equity Theory suggests that perceived inequity in rewards leads to reduced motivation.","b":"application","src":"synthetic"},{"i":51,"s":"In a diverse workplace, a manager notices that employees from similar backgrounds cluster together. This behavior is an example of which perceptual process?","c":["Selective perception","Social identity theory","Stereotyping","Halo effect"],"a":1,"d":"behavioral_influences","e":"Social identity theory explains how individuals identify and associate with groups that share similar characteristics.","b":"application","src":"synthetic"},{"i":52,"s":"A project team fails to consider an alternative solution that contradicts their initial plan. What group dynamic is likely at play?","c":["Groupthink","Social loafing","Group polarization","Deindividuation"],"a":0,"d":"behavioral_influences","e":"Groupthink occurs when a desire for consensus leads to the suppression of dissenting viewpoints.","b":"analysis","src":"synthetic"},{"i":53,"s":"An employee is motivated by internal satisfaction from their work, rather than external rewards. Which type of motivation is this?","c":["Extrinsic motivation","Intrinsic motivation","Altruistic motivation","Achievement motivation"],"a":1,"d":"behavioral_influences","e":"Intrinsic motivation refers to engaging in activities for their inherent satisfaction rather than for some separable consequence.","b":"recall","src":"synthetic"},{"i":54,"s":"A manager uses performance appraisals to provide feedback linked directly to organizational goals. Which appraisal method is being utilized?","c":["360-degree feedback","Critical incident method","Management by objectives (MBO)","Behaviorally anchored rating scales (BARS)"],"a":2,"d":"behavioral_influences","e":"Management by Objectives (MBO) involves setting clear, achievable goals linked to organizational objectives.","b":"application","src":"synthetic"},{"i":55,"s":"An employee who thrives on completing detailed and structured tasks is likely high in which Big Five personality trait?","c":["Openness to Experience","Agreeableness","Conscientiousness","Extraversion"],"a":2,"d":"behavioral_influences","e":"Conscientiousness is characterized by a high degree of organization, responsibility, and dependability.","b":"recall","src":"synthetic"},{"i":56,"s":"An employee who performs well under pressure and handles stress effectively likely scores low in which Big Five trait?","c":["Neuroticism","Openness","Extraversion","Agreeableness"],"a":0,"d":"behavioral_influences","e":"Low neuroticism is associated with emotional stability and the ability to handle stress effectively.","b":"recall","src":"synthetic"},{"i":57,"s":"A manager implements a mentorship program to help new employees integrate into the company culture. Which organizational practice is this an example of?","c":["Onboarding","Socialization","Job rotation","Team-building"],"a":1,"d":"behavioral_influences","e":"Socialization involves processes that help new employees adapt to the organizational culture.","b":"application","src":"synthetic"},{"i":58,"s":"An employee's motivation decreases when they feel tasks are irrelevant to their skills and interests. Which motivational concept does this illustrate?","c":["Expectancy theory","Job characteristics model","Self-determination theory","Reinforcement theory"],"a":1,"d":"behavioral_influences","e":"The Job Characteristics Model suggests that motivation is influenced by how well job tasks fit an employee's skills and interests.","b":"application","src":"synthetic"},{"i":59,"s":"A manager is evaluating the potential bias in their team's decision-making. Which heuristic is likely if team members make decisions based on the first piece of information they learn?","c":["Availability heuristic","Anchoring bias","Representative heuristic","Confirmation bias"],"a":1,"d":"behavioral_influences","e":"Anchoring bias occurs when individuals rely too heavily on the first piece of information received when making decisions.","b":"analysis","src":"synthetic"},{"i":60,"s":"An employee values independence and prefers to work alone. Which work environment would be the best fit according to their personality trait?","c":["Team-based environments","High-structure roles","Autonomy-focused positions","Collaborative workspaces"],"a":2,"d":"behavioral_influences","e":"An autonomy-focused position would align with the employee's value for independence and preference to work alone.","b":"application","src":"synthetic"},{"i":61,"s":"A company encourages employees to set their own goals and provides feedback based on their performance. Which motivational theory does this approach exemplify?","c":["Goal-setting theory","Expectancy theory","Equity theory","Herzberg's Two-Factor Theory"],"a":0,"d":"behavioral_influences","e":"Goal-setting theory emphasizes the importance of setting specific, challenging goals and providing feedback on performance.","b":"application","src":"synthetic"},{"i":62,"s":"A project team is struggling to meet deadlines due to interpersonal conflicts and lack of clear communication. Which stage of group development are they most likely experiencing?","c":["Forming","Storming","Norming","Performing"],"a":1,"d":"group_development","e":"The storming stage is characterized by conflict and power struggles.","b":"application","src":"synthetic"},{"i":63,"s":"During a team meeting, a new employee often looks to their peer, Sam, for guidance on how to behave and what tasks to prioritize. What group concept does this scenario illustrate?","c":["Group norms","Group roles","Group cohesiveness","Group status"],"a":1,"d":"group_development","e":"Group roles refer to the expected behavior patterns attributed to someone in a given position.","b":"application","src":"synthetic"},{"i":64,"s":"A team leader notices that their team is highly cohesive but sometimes fails to challenge each other's ideas. What potential downside of group cohesiveness should the leader be aware of?","c":["Increased innovation","Reduced conformity","Groupthink","Enhanced creativity"],"a":2,"d":"group_development","e":"Groupthink occurs when the desire for harmony results in irrational decision-making.","b":"analysis","src":"synthetic"},{"i":65,"s":"What is a key characteristic of the performing stage in the five-stage group development model?","c":["Team members are unsure of their roles","Conflicts over roles and leadership occur","High levels of trust and autonomy","Group goals are still unclear"],"a":2,"d":"group_development","e":"The performing stage is characterized by high levels of trust, autonomy, and effective collaboration.","b":"recall","src":"synthetic"},{"i":66,"s":"A manager wants to increase the diversity of a team to enhance problem-solving capabilities. What benefit does diversity bring to group performance?","c":["Increased groupthink","Faster decision-making","Broader range of perspectives","Reduced conflict"],"a":2,"d":"group_development","e":"Diversity brings a broader range of perspectives, enhancing creativity and problem-solving.","b":"recall","src":"synthetic"},{"i":67,"s":"In which stage of the conflict process do parties begin to understand each other's positions and move toward resolving the disagreement?","c":["Potential opposition","Cognition and personalization","Intentions","Behavior"],"a":3,"d":"group_development","e":"","b":"recall","src":"synthetic"},{"i":68,"s":"A team is experiencing conflict due to differing expectations about project deadlines. Which conflict resolution technique involves both sides making concessions?","c":["Competing","Avoiding","Compromising","Collaborating"],"a":2,"d":"group_development","e":"Compromising involves each party giving up something to reach a mutually acceptable solution.","b":"application","src":"synthetic"},{"i":69,"s":"During a conflict resolution meeting, a manager uses the 'collaborating' approach. How does this strategy typically affect group dynamics?","c":["Increases group cohesion","Decreases communication","Avoids addressing the underlying issue","Leads to a temporary solution"],"a":0,"d":"group_development","e":"The collaborating approach encourages open communication and joint problem-solving.","b":"application","src":"synthetic"},{"i":70,"s":"Which factor is most likely to decrease group cohesiveness?","c":["Shared group goals","Frequent communication","Large group size","Homogeneous group composition"],"a":2,"d":"group_development","e":"Larger groups tend to be less cohesive due to increased potential for subgroups.","b":"recall","src":"synthetic"},{"i":71,"s":"A team member often dominates discussions and dismisses ideas from others. This behavior is most likely to hinder which aspect of group performance?","c":["Group cohesiveness","Group diversity","Group norms","Group roles"],"a":0,"d":"group_development","e":"Dominant behavior can hinder group cohesiveness by discouraging participation.","b":"analysis","src":"synthetic"},{"i":72,"s":"During the norming stage of group development, what is a typical change in the group's behavior?","c":["Increased power struggles","Decreased commitment to group goals","Development of stronger group identity","Fragmentation into smaller subgroups"],"a":2,"d":"group_development","e":"In the norming stage, group members establish stronger group identity and cohesion.","b":"recall","src":"synthetic"},{"i":73,"s":"A h is likely to enhance employee motivation?","c":["Conducting evaluations only once a year","Offering feedback that is specific and actionable","Focusing solely on weaknesses to drive improvement","Using generic performance metrics across all departments"],"a":1,"d":"performance_evaluation","e":"Specific and actionable feedback helps employees understand how to improve.","b":"application","src":"synthetic"},{"i":162,"s":"How does a performance evaluation process support organizational decision-making?","c":["By providing a basis for team-building activities","By identifying employees for skill development and promotions","By creating legal documentation for employee mistreatment","By offering a platform for employee grievances"],"a":1,"d":"performance_evaluation","e":"Evaluations identify strengths and development areas for promotion decisions.","b":"recall","src":"synthetic"},{"i":163,"s":"An employee feels dissatisfied with their performance evaluation results. What might be a contributing factor?","c":["Lack of clear performance criteria","Regular feedback sessions with their manager","Participation in setting personal goals","Peer support during the evaluation process"],"a":0,"d":"performance_evaluation","e":"Unclear criteria leads to perceived unfairness.","b":"analysis","src":"synthetic"},{"i":164,"s":"Which of the following is a disadvantage of peer evaluations?","c":["They provide diverse perspectives","They can lead to biased feedback due to personal relationships","They increase employee engagement","They offer insight into team dynamics"],"a":1,"d":"performance_evaluation","e":"Personal relationships can bias peer feedback.","b":"recall","src":"synthetic"},{"i":165,"s":"Which scenario is most likely to benefit from a management by objectives (MBO) approach?","c":["A creative industry requiring flexible goals","An organization with clear, measurable targets","A company focusing on employee retention over performance","A workplace with frequent changes in leadership"],"a":1,"d":"performance_evaluation","e":"MBO works best with clear, measurable targets.","b":"application","src":"synthetic"},{"i":166,"s":"An organization is experiencing low employee motivation. Which performance evaluation practice could help?","c":["Conducting evaluations without employee input","Implementing a forced ranking system","Providing regular and constructive feedback","Focusing solely on quantitative metrics"],"a":2,"d":"performance_evaluation","e":"Regular constructive feedback enhances motivation.","b":"application","src":"synthetic"},{"i":167,"s":"Which element is crucial for ensuring the fairness of performance evaluations?","c":["Manager's discretion in setting goals","Standardized evaluation criteria","Employee self-reports of performance","Unstructured feedback sessions"],"a":1,"d":"performance_evaluation","e":"Standardized criteria ensures consistent and fair assessment.","b":"recall","src":"synthetic"},{"i":168,"s":"In what situation is 360-degree feedback most beneficial?","c":["When evaluating the effectiveness of a new product","When assessing technical skills in isolation","When analyzing how leadership style affects team dynamics","When the organization wants to reduce evaluation costs"],"a":2,"d":"performance_evaluation","e":"360-degree feedback shows impact of leadership on team dynamics.","b":"analysis","src":"synthetic"},{"i":169,"s":"Why might a company integrate 360-degree feedback into its performance evaluation process?","c":["To simplify the evaluation process","To gather comprehensive feedback from multiple sources","To limit feedback to internal team members","To reduce the time spent on evaluations"],"a":1,"d":"performance_evaluation","e":"360-degree feedback provides comprehensive multi-source input.","b":"recall","src":"synthetic"},{"i":170,"s":"An organization wants to maintain objectivity in performance evaluations. Which practice should it avoid?","c":["Using peer evaluations","Allowing subjective criteria in assessments","Implementing clear performance standards","Involving multiple evaluators"],"a":1,"d":"performance_evaluation","e":"Subjective criteria introduces bias and reduces objectivity.","b":"application","src":"synthetic"},{"i":171,"s":"What is a potential drawback of using a forced distribution method in performance evaluations?","c":["It encourages teamwork","It can demotivate employees who are unfairly ranked","It simplifies the evaluation process","It provides clear differentiation among employees"],"a":1,"d":"performance_evaluation","e":"Forced distribution can demotivate employees ranked unfairly relative to peers.","b":"analysis","src":"synthetic"},{"i":172,"s":"How can performance evaluations play a role in employee development?","c":["By identifying areas for personal and professional growth","By focusing only on past performance","By highlighting non-work-related skills","By reducing feedback frequency"],"a":0,"d":"performance_evaluation","e":"Evaluations identify growth areas for development and training.","b":"recall","src":"synthetic"}];

const DOMAIN_LABELS = {
  behavioral_influences: "Behavioral Influences",
  group_development: "Group Development",
  teams_and_team_building: "Teams & Team Building",
  organizational_culture: "Organizational Culture",
  leadership: "Leadership",
  performance_evaluation: "Performance Evaluation"
};

const DOMAIN_COLORS = {
  behavioral_influences: "#e06c75",
  group_development: "#e5c07b",
  teams_and_team_building: "#61afef",
  organizational_culture: "#c678dd",
  leadership: "#98c379",
  performance_evaluation: "#56b6c2"
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function App() {
  const [mode, setMode] = useState("menu");
  const [filter, setFilter] = useState("all");
  const [queue, setQueue] = useState([]);
  const [current, setCurrent] = useState(null);
  const [selected, setSelected] = useState(null);
  const [stats, setStats] = useState({ correct: 0, wrong: 0, seen: new Set() });
  const [examMode, setExamMode] = useState(false);
  const [examAnswers, setExamAnswers] = useState({});
  const [examIdx, setExamIdx] = useState(0);
  const [examQuestions, setExamQuestions] = useState([]);
  const [examDone, setExamDone] = useState(false);
  const [examStart, setExamStart] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const timerRef = useRef(null);

  const startDrill = (domain) => {
    const pool = domain === "all" ? QUESTIONS : QUESTIONS.filter(q => q.d === domain);
    const shuffled = shuffle(pool);
    setQueue(shuffled.slice(1));
    setCurrent(shuffled[0]);
    setSelected(null);
    setStats({ correct: 0, wrong: 0, seen: new Set() });
    setFilter(domain);
    setMode("drill");
    setExamMode(false);
  };

  const startExam = () => {
    const qs = shuffle(QUESTIONS).slice(0, 37);
    setExamQuestions(qs);
    setExamAnswers({});
    setExamIdx(0);
    setExamDone(false);
    setExamStart(Date.now());
    setMode("exam");
    setExamMode(true);
    if (timerRef.current) clearInterval(timerRef.current);
    timerRef.current = setInterval(() => setElapsed(Date.now()), 1000);
  };

  useEffect(() => () => { if (timerRef.current) clearInterval(timerRef.current); }, []);

  const handleAnswer = (idx) => {
    if (selected !== null) return;
    setSelected(idx);
    const isCorrect = idx === current.a;
    setStats(prev => ({
      correct: prev.correct + (isCorrect ? 1 : 0),
      wrong: prev.wrong + (isCorrect ? 0 : 1),
      seen: new Set([...prev.seen, current.i])
    }));
  };

  const nextQuestion = () => {
    if (queue.length === 0) {
      setMode("done");
      return;
    }
    const isCorrect = selected === current.a;
    let newQueue = [...queue];
    if (!isCorrect) {
      const insertAt = Math.min(3 + Math.floor(Math.random() * 3), newQueue.length);
      newQueue.splice(insertAt, 0, current);
    }
    setCurrent(newQueue[0]);
    setQueue(newQueue.slice(1));
    setSelected(null);
  };

  const handleExamAnswer = (qIdx, aIdx) => {
    setExamAnswers(prev => ({ ...prev, [qIdx]: aIdx }));
  };

  const finishExam = () => {
    if (timerRef.current) clearInterval(timerRef.current);
    setExamDone(true);
  };

  const examScore = () => {
    let correct = 0;
    examQuestions.forEach((q, i) => { if (examAnswers[i] === q.a) correct++; });
    return correct;
  };

  const domainCounts = {};
  QUESTIONS.forEach(q => { domainCounts[q.d] = (domainCounts[q.d] || 0) + 1; });

  if (mode === "menu") {
    return (
      <div style={{ fontFamily: "'JetBrains Mono', 'SF Mono', 'Fira Code', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 32 }}>
            <div style={{ fontSize: 13, letterSpacing: 4, color: "#6c7086", marginBottom: 4 }}>WGU C715</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: "#cdd6f4" }}>OB CRAM</div>
            <div style={{ fontSize: 13, color: "#6c7086", marginTop: 4 }}>{QUESTIONS.length} questions / 6 domains</div>
          </div>

          <button onClick={startExam} style={{ width: "100%", padding: "16px", background: "#f38ba8", color: "#1e1e2e", border: "none", borderRadius: 8, fontSize: 16, fontWeight: 700, cursor: "pointer", marginBottom: 24, fontFamily: "inherit", letterSpacing: 1 }}>
            PRACTICE OA (37 Qs / 90 min)
          </button>

          <div style={{ fontSize: 12, color: "#6c7086", marginBottom: 8, letterSpacing: 2 }}>DRILL BY DOMAIN</div>

          <button onClick={() => startDrill("all")} style={{ width: "100%", padding: "14px", background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, fontSize: 14, cursor: "pointer", marginBottom: 8, fontFamily: "inherit", textAlign: "left" }}>
            <span style={{ fontWeight: 600 }}>ALL DOMAINS</span>
            <span style={{ float: "right", color: "#6c7086" }}>{QUESTIONS.length}</span>
          </button>

          {Object.entries(DOMAIN_LABELS).map(([key, label]) => (
            <button key={key} onClick={() => startDrill(key)} style={{ width: "100%", padding: "14px", background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, fontSize: 14, cursor: "pointer", marginBottom: 8, fontFamily: "inherit", textAlign: "left" }}>
              <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: DOMAIN_COLORS[key], marginRight: 10 }}/>
              <span style={{ fontWeight: 600 }}>{label}</span>
              <span style={{ float: "right", color: "#6c7086" }}>{domainCounts[key] || 0}</span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  if (mode === "exam") {
    const q = examQuestions[examIdx];
    const mins = Math.floor((Date.now() - examStart) / 60000);
    const secs = Math.floor(((Date.now() - examStart) % 60000) / 1000);
    const answered = Object.keys(examAnswers).length;

    if (examDone) {
      const score = examScore();
      const pct = Math.round((score / 37) * 100);
      const pass = pct >= 63;
      const byDomain = {};
      examQuestions.forEach((q, i) => {
        if (!byDomain[q.d]) byDomain[q.d] = { correct: 0, total: 0 };
        byDomain[q.d].total++;
        if (examAnswers[i] === q.a) byDomain[q.d].correct++;
      });

      return (
        <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
          <div style={{ maxWidth: 600, margin: "0 auto" }}>
            <div style={{ textAlign: "center", marginBottom: 24 }}>
              <div style={{ fontSize: 48, fontWeight: 700, color: pass ? "#a6e3a1" : "#f38ba8" }}>{pct}%</div>
              <div style={{ fontSize: 18, color: pass ? "#a6e3a1" : "#f38ba8", fontWeight: 600 }}>{pass ? "PASS" : "NOT YET"}</div>
              <div style={{ fontSize: 13, color: "#6c7086", marginTop: 4 }}>{score}/37 correct / {mins}m {secs}s</div>
            </div>

            {Object.entries(byDomain).map(([d, data]) => (
              <div key={d} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", background: "#313244", borderRadius: 6, marginBottom: 4, fontSize: 13 }}>
                <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: DOMAIN_COLORS[d], marginRight: 8 }}/>{DOMAIN_LABELS[d]}</span>
                <span style={{ color: data.correct / data.total >= 0.6 ? "#a6e3a1" : "#f38ba8" }}>{data.correct}/{data.total}</span>
              </div>
            ))}

            <div style={{ marginTop: 24, fontSize: 12, color: "#6c7086", marginBottom: 8 }}>MISSED QUESTIONS</div>
            {examQuestions.map((q, i) => {
              if (examAnswers[i] === q.a) return null;
              return (
                <div key={i} style={{ background: "#313244", borderRadius: 8, padding: 12, marginBottom: 8, fontSize: 13, borderLeft: `3px solid ${DOMAIN_COLORS[q.d]}` }}>
                  <div style={{ marginBottom: 8 }}>{q.s}</div>
                  <div style={{ color: "#f38ba8" }}>Your answer: {q.c[examAnswers[i]] || "Skipped"}</div>
                  <div style={{ color: "#a6e3a1" }}>Correct: {q.c[q.a]}</div>
                  {q.e && <div style={{ color: "#6c7086", marginTop: 4, fontSize: 12 }}>{q.e}</div>}
                </div>
              );
            })}

            <button onClick={() => setMode("menu")} style={{ width: "100%", padding: 14, background: "#45475a", color: "#cdd6f4", border: "none", borderRadius: 8, fontSize: 14, cursor: "pointer", marginTop: 16, fontFamily: "inherit" }}>BACK TO MENU</button>
          </div>
        </div>
      );
    }

    return (
      <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <span style={{ fontSize: 12, color: "#6c7086" }}>Q{examIdx + 1}/37</span>
            <span style={{ fontSize: 12, color: mins >= 80 ? "#f38ba8" : "#6c7086" }}>{mins}:{String(secs).padStart(2,'0')} / 90:00</span>
            <span style={{ fontSize: 12, color: "#6c7086" }}>{answered} answered</span>
          </div>

          <div style={{ width: "100%", height: 3, background: "#313244", borderRadius: 2, marginBottom: 20 }}>
            <div style={{ width: `${((examIdx + 1) / 37) * 100}%`, height: "100%", background: "#89b4fa", borderRadius: 2, transition: "width 0.3s" }}/>
          </div>

          <div style={{ fontSize: 12, color: DOMAIN_COLORS[q.d], marginBottom: 8 }}>{DOMAIN_LABELS[q.d]}</div>
          <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 20 }}>{q.s}</div>

          {q.c.map((choice, ci) => (
            <button key={ci} onClick={() => handleExamAnswer(examIdx, ci)} style={{
              width: "100%", padding: "12px 14px", marginBottom: 6, background: examAnswers[examIdx] === ci ? "#45475a" : "#313244",
              color: "#cdd6f4", border: examAnswers[examIdx] === ci ? "1px solid #89b4fa" : "1px solid #45475a",
              borderRadius: 8, fontSize: 13, cursor: "pointer", fontFamily: "inherit", textAlign: "left", lineHeight: 1.5
            }}>
              <span style={{ fontWeight: 600, marginRight: 8, color: "#6c7086" }}>{String.fromCharCode(65 + ci)}</span>{choice}
            </button>
          ))}

          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button disabled={examIdx === 0} onClick={() => setExamIdx(examIdx - 1)} style={{ flex: 1, padding: 12, background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, cursor: examIdx === 0 ? "default" : "pointer", opacity: examIdx === 0 ? 0.3 : 1, fontFamily: "inherit", fontSize: 13 }}>PREV</button>
            {examIdx < 36 ? (
              <button onClick={() => setExamIdx(examIdx + 1)} style={{ flex: 1, padding: 12, background: "#313244", color: "#cdd6f4", border: "1px solid #45475a", borderRadius: 8, cursor: "pointer", fontFamily: "inherit", fontSize: 13 }}>NEXT</button>
            ) : (
              <button onClick={finishExam} style={{ flex: 1, padding: 12, background: "#a6e3a1", color: "#1e1e2e", border: "none", borderRadius: 8, cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 700 }}>FINISH</button>
            )}
          </div>

          <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 16 }}>
            {examQuestions.map((_, i) => (
              <button key={i} onClick={() => setExamIdx(i)} style={{
                width: 28, height: 28, borderRadius: 4, border: i === examIdx ? "2px solid #89b4fa" : "1px solid #45475a",
                background: examAnswers[i] !== undefined ? "#45475a" : "#1e1e2e", color: "#6c7086",
                fontSize: 10, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center"
              }}>{i + 1}</button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (mode === "drill" && current) {
    const total = filter === "all" ? QUESTIONS.length : QUESTIONS.filter(q => q.d === filter).length;
    const remaining = queue.length + 1;
    const pct = Math.round(((total - remaining) / total) * 100);

    return (
      <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
            <button onClick={() => setMode("menu")} style={{ background: "none", border: "none", color: "#6c7086", cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>EXIT</button>
            <div style={{ fontSize: 12, color: "#6c7086" }}>
              <span style={{ color: "#a6e3a1" }}>{stats.correct}</span> / <span style={{ color: "#f38ba8" }}>{stats.wrong}</span> / {remaining} left
            </div>
          </div>

          <div style={{ width: "100%", height: 3, background: "#313244", borderRadius: 2, marginBottom: 20 }}>
            <div style={{ width: `${pct}%`, height: "100%", background: "#a6e3a1", borderRadius: 2, transition: "width 0.3s" }}/>
          </div>

          <div style={{ fontSize: 12, color: DOMAIN_COLORS[current.d], marginBottom: 4 }}>{DOMAIN_LABELS[current.d]}</div>
          <div style={{ fontSize: 10, color: "#6c7086", marginBottom: 12 }}>{current.src === "pa_exemplar" ? "PA QUESTION" : "SYNTHETIC"} / {current.b}</div>
          <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 20 }}>{current.s}</div>

          {current.c.map((choice, ci) => {
            let bg = "#313244";
            let border = "1px solid #45475a";
            if (selected !== null) {
              if (ci === current.a) { bg = "#1a3a2a"; border = "1px solid #a6e3a1"; }
              else if (ci === selected && ci !== current.a) { bg = "#3a1a1a"; border = "1px solid #f38ba8"; }
            }
            return (
              <button key={ci} onClick={() => handleAnswer(ci)} style={{
                width: "100%", padding: "12px 14px", marginBottom: 6, background: bg,
                color: "#cdd6f4", border, borderRadius: 8, fontSize: 13, cursor: selected !== null ? "default" : "pointer",
                fontFamily: "inherit", textAlign: "left", lineHeight: 1.5, transition: "all 0.15s"
              }}>
                <span style={{ fontWeight: 600, marginRight: 8, color: "#6c7086" }}>{String.fromCharCode(65 + ci)}</span>{choice}
              </button>
            );
          })}

          {selected !== null && (
            <div>
              {current.e && <div style={{ fontSize: 12, color: "#a6adc8", background: "#313244", padding: 12, borderRadius: 8, marginTop: 8, lineHeight: 1.5 }}>{current.e}</div>}
              <button onClick={nextQuestion} style={{ width: "100%", padding: 14, background: "#89b4fa", color: "#1e1e2e", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer", marginTop: 12, fontFamily: "inherit", letterSpacing: 1 }}>
                {queue.length === 0 && selected === current.a ? "FINISH" : "NEXT"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (mode === "done") {
    const total = stats.correct + stats.wrong;
    const pct = total > 0 ? Math.round((stats.correct / total) * 100) : 0;
    return (
      <div style={{ fontFamily: "'JetBrains Mono', monospace", background: "#1e1e2e", color: "#cdd6f4", minHeight: "100vh", padding: "20px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto", textAlign: "center", paddingTop: 60 }}>
          <div style={{ fontSize: 48, fontWeight: 700, color: "#a6e3a1" }}>{pct}%</div>
          <div style={{ fontSize: 14, color: "#6c7086", marginTop: 8 }}>{stats.correct} correct / {stats.wrong} wrong / {stats.seen.size} unique questions</div>
          <div style={{ fontSize: 14, color: "#a6e3a1", marginTop: 16, fontWeight: 600 }}>DECK CLEARED</div>
          <button onClick={() => setMode("menu")} style={{ padding: "14px 40px", background: "#45475a", color: "#cdd6f4", border: "none", borderRadius: 8, fontSize: 14, cursor: "pointer", marginTop: 24, fontFamily: "inherit" }}>BACK TO MENU</button>
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
