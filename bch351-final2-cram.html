<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg: #0a0e0d;
  --surface: #131918;
  --surface-2: #1a2221;
  --border: #2a3534;
  --text: #e8efe7;
  --text-dim: #8c9b95;
  --accent: #d4ff3a;       /* electric lime — biology vibes */
  --accent-2: #ff6b3d;     /* warm orange */
  --accent-3: #5fc7d1;     /* cyan teal */
  --pink: #ff70a8;
  --green: #6ee094;
  --red: #ff5577;
  --yellow: #ffd166;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { overflow-x: hidden; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(212, 255, 58, 0.04), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(95, 199, 209, 0.04), transparent 50%);
}

.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Fraunces', serif; }

/* ============ HEADER ============ */
header {
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 1.5rem 1rem;
  position: sticky;
  top: 0;
  background: rgba(10, 14, 13, 0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 1rem;
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  letter-spacing: -0.02em;
  line-height: 1;
}

h1 .accent { color: var(--accent); font-style: italic; }

.subtitle {
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ============ TABS ============ */
.tabs {
  display: flex;
  gap: 0.25rem;
  padding: 1rem 1.5rem 0;
  max-width: 1400px;
  margin: 0 auto;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.tab:hover {
  border-color: var(--accent);
  color: var(--text);
}

.tab.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}

/* ============ MAIN ============ */
main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

.section { display: none; }
.section.active { display: block; animation: fadeIn 0.3s; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ FILTER ============ */
.filter-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-right: 0.5rem;
}

.filter-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.4rem 0.9rem;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover { color: var(--text); }
.filter-btn.active {
  background: var(--accent-3);
  color: var(--bg);
  border-color: var(--accent-3);
  font-weight: 700;
}

.stats-pill {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--surface);
  padding: 0.4rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.stats-pill strong { color: var(--accent); }

/* ============ FLASHCARDS ============ */
.flashcard-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.flashcard {
  width: 100%;
  max-width: 700px;
  min-height: 340px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: transform 0.15s, border-color 0.2s;
  overflow: hidden;
}

.flashcard:hover { border-color: var(--accent-3); }
.flashcard:active { transform: scale(0.99); }

.flashcard::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-3));
  opacity: 0.7;
}

.fc-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: space-between;
}

.fc-tag {
  background: var(--surface-2);
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  border: 1px solid var(--border);
}

.fc-content {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  line-height: 1.4;
  flex: 1;
  display: flex;
  align-items: center;
}

.fc-state {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 1rem;
}

.fc-controls {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.7rem 1.4rem;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}

.btn.primary:hover { background: var(--bg); color: var(--accent); }

.btn.bad { color: var(--red); border-color: var(--red); }
.btn.bad:hover { background: var(--red); color: var(--bg); }
.btn.good { color: var(--green); border-color: var(--green); }
.btn.good:hover { background: var(--green); color: var(--bg); }

/* ============ MCQ ============ */
.mcq-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 800px;
  margin: 0 auto;
}

.mcq-question {
  font-family: 'Fraunces', serif;
  font-size: 1.3rem;
  margin-bottom: 1.5rem;
  line-height: 1.4;
}

.mcq-options { display: flex; flex-direction: column; gap: 0.65rem; }

.mcq-option {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.2rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-size: 0.95rem;
  color: var(--text);
  font-family: inherit;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
}

.mcq-option:hover {
  border-color: var(--accent-3);
  background: var(--surface);
}

.mcq-option .letter {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--text-dim);
  flex-shrink: 0;
}

.mcq-option.correct {
  background: rgba(110, 224, 148, 0.12);
  border-color: var(--green);
  color: var(--text);
}

.mcq-option.correct .letter { color: var(--green); }

.mcq-option.wrong {
  background: rgba(255, 85, 119, 0.12);
  border-color: var(--red);
}

.mcq-option.wrong .letter { color: var(--red); }

.mcq-option:disabled { cursor: default; }

.mcq-explain {
  margin-top: 1.25rem;
  padding: 1rem 1.2rem;
  background: var(--surface-2);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--text-dim);
  display: none;
}

.mcq-explain.show { display: block; }
.mcq-explain strong { color: var(--accent); }

.mcq-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}

.mcq-progress {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ============ SEQUENCING ============ */
.seq-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 800px;
  margin: 0 auto 1.5rem;
}

.seq-title {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}

.seq-tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  background: var(--surface-2);
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  margin-bottom: 1rem;
  border: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.seq-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 1rem 0;
}

.seq-item {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  cursor: grab;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  transition: all 0.15s;
  font-size: 0.95rem;
}

.seq-item:active { cursor: grabbing; }
.seq-item.dragging { opacity: 0.4; transform: scale(0.98); }
.seq-item.drag-over { border-color: var(--accent); }

.seq-item.correct {
  border-color: var(--green);
  background: rgba(110, 224, 148, 0.08);
}

.seq-item.wrong {
  border-color: var(--red);
  background: rgba(255, 85, 119, 0.08);
}

.seq-handle {
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  width: 1.5rem;
  flex-shrink: 0;
}

.seq-content { flex: 1; }

.seq-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.seq-explanation {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--surface-2);
  border-left: 3px solid var(--accent-3);
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
  color: var(--text-dim);
  line-height: 1.5;
  display: none;
}

.seq-explanation.show { display: block; }

/* ============ MATCHING (LABELING) ============ */
.match-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 1000px;
  margin: 0 auto 1.5rem;
}

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.5rem;
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

@media (max-width: 600px) {
  .match-grid { grid-template-columns: 1fr; }
}

.match-col-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.5rem;
}

.match-item {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
  color: var(--text);
}

.match-item:hover { border-color: var(--accent-3); }
.match-item.selected { border-color: var(--accent); background: var(--surface); }
.match-item.matched-correct { border-color: var(--green); background: rgba(110, 224, 148, 0.1); cursor: default; }
.match-item.matched-wrong { border-color: var(--red); background: rgba(255, 85, 119, 0.1); }
.match-item.faded { opacity: 0.5; }

/* ============ NOTES ============ */
.notes-section {
  max-width: 900px;
  margin: 0 auto;
}

.note-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 1.5rem;
}

.note-block h2 {
  font-family: 'Fraunces', serif;
  font-size: 1.8rem;
  margin-bottom: 1.5rem;
  font-weight: 700;
  color: var(--accent);
}

.note-block h3 {
  font-family: 'Fraunces', serif;
  font-size: 1.25rem;
  margin: 1.5rem 0 0.75rem;
  font-weight: 600;
  color: var(--accent-3);
}

.note-block h3:first-of-type { margin-top: 0; }

.note-block p {
  margin-bottom: 0.75rem;
  white-space: pre-wrap;
  color: var(--text);
  line-height: 1.7;
}

.note-block strong { color: var(--accent); }

/* ============ EMPTY STATES ============ */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.2rem;
}

/* ============ MOBILE ============ */
@media (max-width: 600px) {
  header { padding: 1rem; }
  main { padding: 1.5rem 1rem 4rem; }
  .flashcard { padding: 1.5rem 1.2rem; }
  .fc-content { font-size: 1.1rem; }
  .mcq-card, .seq-card, .match-card, .note-block { padding: 1.5rem 1.2rem; }
  .mcq-question { font-size: 1.1rem; }
  .seq-title, .match-card h2 { font-size: 1.2rem; }
}
</style>
</head>

<header>
  <div class="title-row">
    <div>
      <h1>BCH351 <span class="accent">Cram L23+L24</span></h1>

<script>
// ============================================================
// BCH351 Lectures 21-22 Study Data
// ETC/OxPhos + Lipid Metabolism
// ============================================================
// BCH351 Lectures 23-24 Study Data
// Photosynthesis + Amino Acid Metabolism
// ============================================================

const FLASHCARDS = [
  // ============ LECTURE 23: PHOTOSYNTHESIS ============
  { topic: "L23", q: "Overall photosynthesis equation?", a: "CO2 + 2 H2O —[light]→ [CH2O] + H2O + O2. The O2 comes from H2O." },
  { topic: "L23", q: "What is the ultimate reducing agent in plant photosynthesis?", a: "Water (H2O). Some bacteria use H2S, HSO3-, or H2 instead." },
  { topic: "L23", q: "What does the LIGHT reaction do?", a: "Uses sunlight to oxidize H2O, release O2, reduce NADP+ to NADPH, and make ATP (photophosphorylation)." },
  { topic: "L23", q: "What does the DARK reaction do?", a: "Uses NADPH and ATP to reduce CO2 and synthesize carbohydrates. Doesn't actually have to occur in the dark." },
  { topic: "L23", q: "Three layers/membranes of a chloroplast?", a: "Outer membrane, inner membrane, thylakoid membrane (forms grana stacks inside)." },
  { topic: "L23", q: "How many grana per chloroplast?", a: "10-100 grana." },
  { topic: "L23", q: "Where is the stroma vs thylakoid lumen?", a: "Stroma surrounds grana (chloroplast 'matrix'). Thylakoid lumen is INSIDE the thylakoid disks/grana." },
  { topic: "L23", q: "Energy of a photon equation?", a: "E = hν = hc/λ. Energy is INVERSELY proportional to wavelength." },
  { topic: "L23", q: "What captures photon energy in chromophores?", a: "π electrons of conjugated double bonds — they undergo a quantum jump to an excited state." },
  { topic: "L23", q: "Four ways excited electrons return to ground state?", a: "1) Heat (collision), 2) Re-emit at lower energy = fluorescence, 3) Resonance transfer (no electron moved), 4) Electron transfer (photo-oxidation)." },
  { topic: "L23", q: "What metal does chlorophyll bind?", a: "Mg2+ (heme-like structure but Mg2+ instead of Fe)." },
  { topic: "L23", q: "What anchors chlorophyll in the membrane?", a: "Hydrophobic phytol tail." },
  { topic: "L23", q: "What wavelengths does chlorophyll absorb?", a: "Blue and red light. Plants look GREEN because they DON'T absorb green light — they reflect it." },
  { topic: "L23", q: "Two main accessory pigments?", a: "Carotenoids (absorb blues, including β-carotene). Phycoerythrin/phycocyanin (absorb green and yellow)." },
  { topic: "L23", q: "What is the 'special pair'?", a: "Two chlorophyll molecules close together in the reaction center. Donates the electron. Identified as P(λmax), e.g., P870, P700, P680." },
  { topic: "L23", q: "What does P870 mean?", a: "Special pair with maximum absorption at 870 nm (used in purple bacteria PSII)." },
  { topic: "L23", q: "Resonance transfer vs electron transfer in light harvesting?", a: "Resonance: exciton energy passes between adjacent pigments (no electron moves, no energy loss). Electron transfer: actual electron handed off — only at the special pair to acceptor." },
  { topic: "L23", q: "After electron transfer, what is the special pair (e.g., P870+)?", a: "A strong electron ACCEPTOR (oxidizing agent) — needs to be re-reduced by an electron source." },
  { topic: "L23", q: "Where does PSII (P870) operate alone?", a: "Purple bacteria and green filamentous bacteria. Cyclic electron flow with cyt bc1 — pumps H+ but makes NO net NADPH." },
  { topic: "L23", q: "Where does PSI (P700) operate alone?", a: "Green sulfur bacteria. Can run cyclic (with cyt bc1) OR non-cyclic (using H2S, S2O3^2- as electron donor → makes NADPH)." },
  { topic: "L23", q: "Where do PSII + PSI work in series?", a: "Cyanobacteria, algae, diatoms, plants. Use H2O as electron source. Make both NADPH and ATP." },
  { topic: "L23", q: "PSII (purple bacteria) electron flow?", a: "P870 → bacteriopheophytin → bound quinone → mobile menaquinone → QH2. QH2 then goes to cyt bc1." },
  { topic: "L23", q: "What is the Q-cycle in cyt bc1 (photosynthesis)?", a: "Same as Complex III in oxidative phos: 2 QH2 → 2 Q + 4 H+ pumped + 4 e-. 2 e- reduce Q back to QH2; 2 e- reduce 2 cyt c (Fe3+→Fe2+)." },
  { topic: "L23", q: "Net H+ pumped per 2 photons in cyclic PSII?", a: "4 H+ to intermembrane space (per 2 photons absorbed by P870)." },
  { topic: "L23", q: "Efficiency of light energy capture in PSII?", a: "~28% (274 kJ from 2 photons → ~77.6 kJ stored in proton gradient)." },
  { topic: "L23", q: "Energy required to make ATP in cells?", a: "ΔG = 48 kJ/mol (cellular conditions) ≈ 3 protons worth. ΔG°' is only 32 kJ/mol." },
  { topic: "L23", q: "PSI special pair λmax?", a: "P700 (700 nm). Some texts use P840 for green sulfur bacteria." },
  { topic: "L23", q: "PSI vs PSII size?", a: "PSI is LARGER. Dimer with 11 transmembrane helices each, 96 chlorophyll a, 2 phylloquinones, 3 Fe4S4 clusters, 22 carotenoids." },
  { topic: "L23", q: "Terminal electron acceptor of PSI?", a: "Ferredoxin (or flavodoxin). PSI can make NADPH; PSII cannot." },
  { topic: "L23", q: "PSI cyclic mode?", a: "Same as PSII cycle: P700 → Fd → QH2 → cyt bc1 (pumps 4H+) → cyt c → P700+. Generates ONLY proton gradient, NO NADPH." },
  { topic: "L23", q: "PSI non-cyclic mode?", a: "P700 → Fd → FNR → NADPH. Cyt bc1 not used → NO H+ pumped. P700+ regenerated by H2S/S2O3^2-." },
  { topic: "L23", q: "What is FNR?", a: "Ferredoxin:NADP+ reductase — uses Fd(red) to reduce NADP+ to NADPH (via FAD intermediate)." },
  { topic: "L23", q: "PSII (in plants) special pair?", a: "P680 (maximum absorption 680 nm). Stronger oxidant than P870 — strong enough to oxidize H2O." },
  { topic: "L23", q: "PSI in plants special pair?", a: "P700." },
  { topic: "L23", q: "What is the OEC?", a: "Oxygen Evolving Complex — Mn-containing complex of PSII that splits H2O: 2H2O → O2 + 4H+ + 4e-. Releases H+ INTO thylakoid lumen." },
  { topic: "L23", q: "What replaces menaquinone in plants?", a: "Plastoquinone (PQ) — same role, lipid-soluble shuttle between PSII and cyt bf." },
  { topic: "L23", q: "What replaces cytochrome c in plants?", a: "Plastocyanin (PC) — water-soluble, copper-containing carrier (Cu2+ ↔ Cu+, 1 e-)." },
  { topic: "L23", q: "What replaces cyt bc1 in plants?", a: "Cytochrome bf complex (b6f) — homologous to bc1, runs the same Q-cycle." },
  { topic: "L23", q: "Z scheme electron path (non-cyclic)?", a: "H2O → PSII (P680*) → PQ → cyt bf → PC → PSI (P700*) → Fd → FNR → NADPH. Two photon absorptions ('two bumps') give the Z shape." },
  { topic: "L23", q: "Energetic cost to reduce NADP+ with H2O?", a: "ΔE°' = -1.12 V; ΔG°' = +219 kJ/mol — highly unfavorable, requires light energy input." },
  { topic: "L23", q: "Direction of H+ pumping in chloroplasts vs mitochondria?", a: "Chloroplasts pump H+ INTO the thylakoid lumen (proton gradient inside). Mitochondria pump OUT of the matrix (gradient outside)." },
  { topic: "L23", q: "Which side of thylakoid membrane has F1 of ATP synthase?", a: "Stroma (N side). So ATP is made in the stroma — same compartment as Calvin cycle." },
  { topic: "L23", q: "Sources of H+ in thylakoid lumen?", a: "2 H+ from H2O splitting at OEC (in lumen) + 4 H+ from cytochrome bf complex pumping = 6 H+ per pair of electrons (or 12 H+ per O2)." },
  { topic: "L23", q: "Why is chloroplast ΔΨ ≈ 0?", a: "Thylakoid membrane is permeable to ions like Mg2+ and Cl- — these dissipate the membrane potential. PMF is mostly ΔpH (~3.5 pH units!)." },
  { topic: "L23", q: "ΔG per H+ in chloroplast?", a: "ΔG = -2.3 RT ΔpH ≈ -20 kJ/mol per H+ (at 25°C with ΔpH = 3.5)." },
  { topic: "L23", q: "ATP yield per O2 evolved?", a: "12 H+ per O2 / 3 H+ per ATP = 4 ATP per O2 (some say ~3)." },
  { topic: "L23", q: "ATP per photon absorbed?", a: "~1.25 ATP per photon (10 ATP / 8 photons in non-cyclic photophosphorylation)." },
  { topic: "L23", q: "Cyclic vs non-cyclic photophosphorylation rate?", a: "Cyclic is < 5% of non-cyclic rate. Non-cyclic dominates because it makes NADPH." },
  { topic: "L23", q: "Overall light reaction equation?", a: "12 H2O + 12 NADP+ → 12 H+ + 12 NADPH + 6 O2 (couples with cyclic flow to make 18 ATP)." },
  { topic: "L23", q: "Overall dark reaction (Calvin cycle)?", a: "6 CO2 + 18 ATP + 12 NADPH + 12 H2O → C6H12O6 + 18 ADP + 18 Pi + 12 NADP+ + 6 H+." },
  { topic: "L23", q: "Three stages of CO2 assimilation (Calvin cycle)?", a: "1) FIXATION: CO2 + ribulose 1,5-BP → 2× 3-phosphoglycerate (Rubisco). 2) REDUCTION: 3-PG → glyceraldehyde 3-P. 3) REGENERATION: G3P rearranged back to ribulose 1,5-BP." },
  { topic: "L23", q: "What does Rubisco stand for?", a: "Ribulose 1,5-Bisphosphate Carboxylase/Oxygenase." },
  { topic: "L23", q: "Why is Rubisco so abundant?", a: "Most abundant protein on Earth. ~50% of soluble protein in leaves. It's slow (kcat ~3 s⁻¹) — abundance compensates for poor activity." },
  { topic: "L23", q: "Rubisco's flaw?", a: "Poor substrate specificity — also fixes O2 (oxygenase activity) instead of CO2, producing 2-phosphoglycolate (which plants must clean up via photorespiration)." },
  { topic: "L23", q: "Active site cofactor of Rubisco?", a: "Mg2+ — drives nucleophilic attack of enediolate intermediate on the carbonyl C of CO2." },
  { topic: "L23", q: "Calvin cycle stoichiometry per turn (3 CO2)?", a: "3 CO2 + 3 ribulose 1,5-BP → 6 G3P. ONE G3P leaves; 5 G3P regenerate 3 ribulose 1,5-BP. Costs 9 ATP + 6 NADPH per 3 CO2." },
  { topic: "L23", q: "Per G3P made, energy cost?", a: "9 ATP + 6 NADPH (sum of one full turn fixing 3 CO2 = output of 1 G3P)." },
  { topic: "L23", q: "Why C4 photosynthesis exists?", a: "PEP carboxylase doesn't bind O2 and has lower Km for HCO3-. C4 plants concentrate CO2 around Rubisco to outcompete O2." },
  { topic: "L23", q: "C4 mesophyll cell reactions?", a: "CO2 + H2O → HCO3- (catalase). PEP + HCO3- → oxaloacetate (PEP carboxylase). OAA + NADPH → malate. Malate transported to bundle sheath." },
  { topic: "L23", q: "C4 bundle sheath cell reactions?", a: "Malate → pyruvate + CO2 + NADPH. CO2 released to Rubisco for Calvin cycle. Pyruvate sent back to mesophyll, phosphorylated to PEP." },
  { topic: "L23", q: "How does ATP/NADPH leave the chloroplast?", a: "No transporters for ATP or NADPH directly. Pi-triose phosphate antiporter ferries dihydroxyacetone phosphate out — equivalent of 1 ATP + 1 NADH per cycle (piggyback transport)." },
  { topic: "L23", q: "Where does Calvin cycle occur?", a: "Stroma of chloroplast (NOT in thylakoid lumen)." },

  { topic: "L24", q: "Overall nitrogenase reaction?", a: "N2 + 8 H+ + 8 e- + 16 ATP → 2 NH3 + H2 + 16 ADP + 16 Pi. Note: H2 is made for unknown reasons." },
  { topic: "L24", q: "Nitrogenase active site cofactor?", a: "MoFe7S9N cluster (iron-molybdenum-sulfur-homocitrate cofactor) in the dinitrogenase subunit." },
  { topic: "L24", q: "Two protein components of nitrogenase?", a: "Dinitrogenase reductase (Fe protein) — donates electrons. Dinitrogenase (MoFe protein) — does the actual N2 reduction." },
  { topic: "L24", q: "Source of electrons for nitrogenase?", a: "Pyruvate oxidation → ferredoxin or flavodoxin (reduced) → dinitrogenase reductase → dinitrogenase." },
  { topic: "L24", q: "How does NH4+ enter biomolecules in bacteria?", a: "Glutamine synthetase: Glu + NH4+ + ATP → Gln + ADP + Pi. Then glutamate synthetase: α-KG + Gln + NADPH → 2 Glu + NADP+." },
  { topic: "L24", q: "Sum of bacterial NH3 incorporation?", a: "α-Ketoglutarate + NH4+ + NADPH + ATP → L-glutamate + NADP+ + ADP + Pi." },
  { topic: "L24", q: "Why can't mammals make Glu directly from NH4+?", a: "Glutamate dehydrogenase has HIGH Km for NH4+ — won't run forward at physiological [NH4+]. Mammals also LACK glutamate synthetase." },
  { topic: "L24", q: "How do mammals get high [Glu]?", a: "Dietary protein → amino acids → transaminations transfer NH3 from amino acids to α-ketoglutarate to make L-glutamate. Then Glu → Gln via glutamine synthetase." },
  { topic: "L24", q: "Cofactor for transamination?", a: "PLP (pyridoxal 5'-phosphate) — derived from vitamin B6." },
  { topic: "L24", q: "Generic transamination equation?", a: "Amino acid₁ + α-keto acid₂ ⇌ α-keto acid₁ + amino acid₂. Glutamate is usually amino acid₁; α-KG / oxaloacetate are usual acceptors." },
  { topic: "L24", q: "Two intermediates in PLP-catalyzed transamination?", a: "Aldimine (Schiff base with amino acid) and ketimine (after H+ removal). Pyridoxamine forms when one AA leaves and before next α-keto acid binds." },
  { topic: "L24", q: "Glutamine synthetase regulation?", a: "8 allosteric inhibitors (end products of Gln metabolism: AMP, CTP, His, Trp, carbamoyl-P, glucosamine-6-P, Ala, Gly). Covalent: adenylylation on Tyr makes enzyme more inhibited. Adenylylation inhibited by high [Gln] and [Pi]." },
  { topic: "L24", q: "How many AAs can mammals synthesize?", a: "About 10 of 20 (nonessential). The other 10 are essential — must come from diet." },
  { topic: "L24", q: "9 essential amino acids?", a: "Phe, Val, Trp, Thr, Ile, Met, His, Leu, Lys (PVT TIM HaLL — the dorm). + arginine in some texts (conditional)." },
  { topic: "L24", q: "5 'conditional' amino acids?", a: "Tyr, Cys, Arg (and Pro, Gln in young/sick). Required during illness or growth." },
  { topic: "L24", q: "Which amino acid is derived from Phe in mammals?", a: "Tyrosine (via phenylalanine hydroxylase / phenylalanine-4-monooxygenase)." },
  { topic: "L24", q: "6 metabolic precursor families for AAs?", a: "α-Ketoglutarate (Glu, Gln, Pro, Arg). 3-Phosphoglycerate (Ser, Gly, Cys). Oxaloacetate (Asp, Asn, Met*, Thr*, Lys*). Pyruvate (Ala, Val*, Leu*, Ile*). PEP+erythrose-4-P (Trp*, Phe*, Tyr). Ribose-5-P (His*). *=essential." },

  { topic: "L24", q: "What does PKU result from?", a: "Deficiency in phenylalanine hydroxylase. Phe accumulates, blocks transport of large neutral amino acids into brain. Tyr becomes essential. Causes mental retardation if untreated. Treated with low-Phe diet." },
  { topic: "L24", q: "What neurotransmitters come from Tyr?", a: "Dopamine → norepinephrine (NE) → epinephrine (Epi). Tyr→Dopa→Dopamine→NE→Epi. Loss of these in PKU contributes to symptoms." },
  { topic: "L24", q: "What comes from Trp via decarboxylation?", a: "Serotonin (via 5-hydroxytryptophan). Also indole-3-acetate (auxin, plant hormone)." },
  { topic: "L24", q: "What comes from Glu via decarboxylation?", a: "GABA (γ-aminobutyrate) — major inhibitory neurotransmitter. Catalyzed by glutamate decarboxylase (PLP)." },
  { topic: "L24", q: "What comes from His via decarboxylation?", a: "Histamine — the target of cimetidine/Tagamet (H2 blocker)." },
  { topic: "L24", q: "Glutathione structure?", a: "γ-Glu-Cys-Gly tripeptide. Note the unusual γ-peptide bond at glutamate (off the side chain carboxyl). Synthesized in 2 ATP-dependent steps, NON-ribosomally." },
  { topic: "L24", q: "Roles of glutathione?", a: "Reducing intracellular environment (~5 mM GSH). Drug metabolism (conjugation for excretion). Reason intracellular proteins have FEW disulfides vs many in extracellular." },
  { topic: "L24", q: "Definition of glucogenic AA?", a: "Carbon backbone converts to glucose precursors: pyruvate, α-KG, succinyl-CoA, fumarate, or oxaloacetate." },

  { topic: "L24", q: "Which amino acids are BOTH glucogenic and ketogenic?", a: "Phe, Tyr, Trp, Ile, Thr (5 AAs). Note: contain aromatic rings or branched chains." },

  { topic: "L24", q: "AAs going to α-ketoglutarate?", a: "Glu, Gln, Arg, Pro, His." },
  { topic: "L24", q: "AAs going to succinyl-CoA?", a: "Ile, Met, Val, Thr." },
  { topic: "L24", q: "AAs going to oxaloacetate?", a: "Asp, Asn." },
  { topic: "L24", q: "AAs going to fumarate?", a: "Asp, Phe, Tyr." },
  { topic: "L24", q: "AAs going to acetyl-CoA / acetoacetate?", a: "Phe, Tyr, Leu, Lys, Trp, Ile, Thr." },
  { topic: "L24", q: "Three modes of nitrogen excretion?", a: "Ammonotelic (NH3, aquatic animals). Ureotelic (urea, terrestrial vertebrates). Uricotelic (uric acid, birds and reptiles)." },
  { topic: "L24", q: "Why don't fish make urea?", a: "Aquatic environment dilutes NH3 directly — no need to spend ATP on urea synthesis." },
  { topic: "L24", q: "Why birds make uric acid?", a: "Insoluble paste — saves water. Embryo in egg can't excrete water-based urea. Uric acid precipitates harmlessly." },
  { topic: "L24", q: "How is NH4+ transported in blood?", a: "As GLUTAMINE (most tissues) or ALANINE (from muscle via glucose-alanine cycle). Free NH4+ is too toxic to transport." },
  { topic: "L24", q: "Glutamine pathway to liver?", a: "Tissues: Glu + NH4+ + ATP → Gln (glutamine synthetase, cytosol). Blood transport. Liver mitochondria: Gln → Glu + NH4+ (glutaminase). Glu → α-KG + NH4+ (Glu DH). Both NH4+ enter urea cycle." },
  { topic: "L24", q: "Glucose-alanine cycle?", a: "Muscle: pyruvate + AA → alanine + α-keto acid (transamination). Alanine → blood → liver. Liver: alanine + α-KG → pyruvate + Glu. Pyruvate → glucose (gluconeogenesis) → blood → muscle." },
  { topic: "L24", q: "Why use the glucose-alanine cycle?", a: "Muscle can't do gluconeogenesis. Cycle exports NH3 safely AND lets liver replenish muscle glucose. Especially important in low-O2 conditions (anaerobic glycolysis)." },
  { topic: "L24", q: "What enzyme catalyzes the COMMITTED step of urea cycle?", a: "Carbamoyl phosphate synthetase I (CPS-I) — mitochondrial, NH3-dependent isozyme." },
  { topic: "L24", q: "What activates CPS-I?", a: "N-acetylglutamate. High amino acid catabolism → high Glu → more N-acetylglutamate → CPS-I active → urea cycle ON." },
  { topic: "L24", q: "CPS-I mechanism (3 steps)?", a: "1) HCO3- + ATP → carboxyphosphate (t½=28 ms). 2) NH3 attacks → carbamate (t½=70 ms). 3) Second ATP phosphorylates → carbamoyl-P. Uses 2 ATP total." },
  { topic: "L24", q: "Where does the urea cycle occur?", a: "Hybrid: starts in liver MITOCHONDRIA (carbamoyl-P + ornithine → citrulline). Then continues in CYTOSOL (citrulline + Asp → argininosuccinate → fumarate + arginine → ornithine + UREA)." },
  { topic: "L24", q: "Five urea cycle intermediates (in order)?", a: "Carbamoyl-P → CITRULLINE → ARGININOSUCCINATE → ARGININE → ORNITHINE (regenerated). Urea released from arginine." },
  { topic: "L24", q: "Where do the two N atoms of urea come from?", a: "ONE from carbamoyl phosphate (originally from NH4+/Glu). ONE from aspartate (which gets it from Glu via transamination)." },
  { topic: "L24", q: "What is the 'Krebs bicycle'?", a: "Tight coupling between urea cycle and citric acid cycle. Aspartate→argininosuccinate→fumarate is the 'aspartate-argininosuccinate shunt' that links the two." },
  { topic: "L24", q: "ATP cost of urea cycle?", a: "4 ATP equivalents per urea (2 ATP for CPS-I + 1 ATP→AMP+PPi for argininosuccinate synthetase = effectively 2 ATP)." },
  { topic: "L24", q: "Three 'ketone bodies'?", a: "Acetoacetate, acetone, β-hydroxybutyrate. Made from acetyl-CoA when carbohydrates are scarce." },
  { topic: "L24", q: "Why are ketone bodies dangerous in excess?", a: "Acetoacetate and β-hydroxybutyrate are acids — accumulation causes blood acidosis. Extreme cases cause coma/death (diabetic ketoacidosis, prolonged starvation)." },
  { topic: "L24", q: "Why is excess protein → ketones in starvation/diabetes?", a: "Glucose-starved cells degrade protein → AAs → carbon backbones. Ketogenic AAs flood acetyl-CoA pool, which can't enter TCA (no OAA) → diverted to ketone synthesis." },

function fcRebuild() {
  const f = STATE.fc.filter;
  if (f === 'STARRED') {
    STATE.fc.list = FLASHCARDS.filter((_, i) => STATE.fc.starred.has(i));
  } else if (f === 'ALL') {
    STATE.fc.list = [...FLASHCARDS];
  } else {
    STATE.fc.list = FLASHCARDS.filter(c => c.topic === f);
  }
  STATE.fc.idx = 0;
  STATE.fc.flipped = false;
  fcRender();
}

function fcRender() {
  const list = STATE.fc.list;
  const stats = document.getElementById('fc-stats');
  if (list.length === 0) {
    document.getElementById('fc-text').textContent = 'No cards in this filter.';
    document.getElementById('fc-tag').textContent = '—';
    document.getElementById('fc-pos').textContent = '0 / 0';
    document.getElementById('fc-state').textContent = '';
    stats.innerHTML = `<strong>0</strong> known / <strong>0</strong>`;
    return;
  }
  const card = list[STATE.fc.idx];
  document.getElementById('fc-text').textContent = STATE.fc.flipped ? card.a : card.q;
  document.getElementById('fc-state').textContent = STATE.fc.flipped ? '— answer —' : '— click to flip —';
  document.getElementById('fc-tag').textContent = card.topic;
  document.getElementById('fc-pos').textContent = `${STATE.fc.idx + 1} / ${list.length}`;

  // Find original index for star check
  const origIdx = FLASHCARDS.indexOf(card);
  document.getElementById('fc-star').textContent = STATE.fc.starred.has(origIdx) ? '★ Starred' : '⭐ Star';

  const known = STATE.fc.list.filter(c => STATE.fc.known.has(FLASHCARDS.indexOf(c))).length;
  stats.innerHTML = `<strong>${known}</strong> known / <strong>${list.length}</strong>`;
}

document.getElementById('flashcard').addEventListener('click', () => {

});

document.getElementById('fc-next').addEventListener('click', e => {
  e.stopPropagation();
  if (STATE.fc.list.length === 0) return;

});

function mcqRebuild() {
  const f = STATE.mcq.filter;
  if (f === 'MISSED') {
    STATE.mcq.list = MCQS.filter((_, i) => STATE.mcq.missed.has(i));
  } else if (f === 'ALL') {
    STATE.mcq.list = [...MCQS];
  } else {
    STATE.mcq.list = MCQS.filter(c => c.topic === f);
  }
  STATE.mcq.idx = 0;
  mcqRender();
}

function mcqRender() {
  const list = STATE.mcq.list;
  if (list.length === 0) {
    document.getElementById('mcq-q').textContent = 'No questions in this filter.';
    document.getElementById('mcq-opts').innerHTML = '';
    document.getElementById('mcq-exp').classList.remove('show');
    document.getElementById('mcq-prog').textContent = '0 / 0';
    return;
  }
  const q = list[STATE.mcq.idx];
  const origIdx = MCQS.indexOf(q);
  document.getElementById('mcq-q').textContent = q.q;
  document.getElementById('mcq-prog').textContent = `${STATE.mcq.idx + 1} / ${list.length}`;

  const opts = document.getElementById('mcq-opts');
  opts.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const previous = STATE.mcq.answered[origIdx];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'mcq-option';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    if (previous !== undefined) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === previous) btn.classList.add('wrong');
    }
    btn.addEventListener('click', () => {
      STATE.mcq.answered[origIdx] = i;
      if (i !== q.answer) STATE.mcq.missed.add(origIdx);
      else STATE.mcq.missed.delete(origIdx);
      mcqRender();
    });
    opts.appendChild(btn);
  });

  const exp = document.getElementById('mcq-exp');
  if (previous !== undefined) {
    const isCorrect = previous === q.answer;
    exp.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'} —</strong> ${q.explanation}`;
    exp.classList.add('show');
  } else {
    exp.classList.remove('show');
  }

  const correct = Object.entries(STATE.mcq.answered).filter(([i, a]) => MCQS[i].answer === a).length;
  const total = Object.keys(STATE.mcq.answered).length;
  document.getElementById('mcq-stats').innerHTML = `Score: <strong>${correct}</strong>/${total} (missed: ${STATE.mcq.missed.size})`;
}

document.getElementById('mcq-next').addEventListener('click', () => {
  if (STATE.mcq.list.length === 0) return;
  STATE.mcq.idx = (STATE.mcq.idx + 1) % STATE.mcq.list.length;
  mcqRender();
});

document.getElementById('mcq-prev').addEventListener('click', () => {
  if (STATE.mcq.list.length === 0) return;
  STATE.mcq.idx = (STATE.mcq.idx - 1 + STATE.mcq.list.length) % STATE.mcq.list.length;
  mcqRender();
});

function seqRender() {
  const f = STATE.seq.filter;
  const list = f === 'ALL' ? SEQUENCES : SEQUENCES.filter(s => s.topic === f);
  const root = document.getElementById('seq-list');
  root.innerHTML = '';
  if (list.length === 0) {
    root.innerHTML = '<div class="empty">No sequences in this filter.</div>';
    return;
  }
  list.forEach((seq, sIdx) => {
    const origIdx = SEQUENCES.indexOf(seq);
    const card = document.createElement('div');
    card.className = 'seq-card';
    const shuffled = [...seq.items];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    card.innerHTML = `
      <span class="seq-tag">${seq.topic}</span>
      <h3 class="seq-title">${seq.title}</h3>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Drag the items into the correct order, then check.</p>
      <ul class="seq-list" data-seq-idx="${origIdx}"></ul>
      <div class="seq-actions">
        <button class="btn primary" data-action="check" data-seq-idx="${origIdx}">Check Order</button>
        <button class="btn" data-action="shuffle" data-seq-idx="${origIdx}">Shuffle</button>
        <button class="btn" data-action="reveal" data-seq-idx="${origIdx}">Show Answer</button>
      </div>
      <div class="seq-explanation" id="seq-exp-${origIdx}"></div>
    `;
    root.appendChild(card);
    const ul = card.querySelector('.seq-list');
    shuffled.forEach((item, i) => {
      const li = document.createElement('li');
      li.className = 'seq-item';
      li.draggable = true;
      li.innerHTML = `<span class="seq-handle">⋮⋮</span><span class="seq-content">${item}</span>`;
      li.dataset.text = item;
      addDragHandlers(li, ul);
      ul.appendChild(li);
    });
  });

  // Wire actions
  root.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.seqIdx;
      const seq = SEQUENCES[idx];
      const ul = document.querySelector(`.seq-list[data-seq-idx="${idx}"]`);
      const exp = document.getElementById(`seq-exp-${idx}`);
      if (btn.dataset.action === 'check') {
        const items = [...ul.querySelectorAll('.seq-item')];
        items.forEach((li, i) => {
          li.classList.remove('correct', 'wrong');
          if (li.dataset.text === seq.items[i]) li.classList.add('correct');
          else li.classList.add('wrong');
        });
        const allRight = items.every((li, i) => li.dataset.text === seq.items[i]);
        exp.innerHTML = allRight ? `<strong style="color: var(--green)">✓ Perfect!</strong> ${seq.explanation}` : `<strong style="color: var(--red)">Not quite —</strong> ${seq.explanation}`;
        exp.classList.add('show');
      } else if (btn.dataset.action === 'reveal') {
        ul.innerHTML = '';
        seq.items.forEach(item => {
          const li = document.createElement('li');
          li.className = 'seq-item correct';
          li.draggable = true;
          li.innerHTML = `<span class="seq-handle">⋮⋮</span><span class="seq-content">${item}</span>`;
          li.dataset.text = item;
          addDragHandlers(li, ul);
          ul.appendChild(li);
        });
        exp.innerHTML = `<strong>Answer revealed.</strong> ${seq.explanation}`;
        exp.classList.add('show');
      } else if (btn.dataset.action === 'shuffle') {
        const items = [...ul.children];
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        ul.innerHTML = '';
        items.forEach(li => {
          li.classList.remove('correct', 'wrong');
          ul.appendChild(li);
        });
        exp.classList.remove('show');
      }
    });
  });
}

let dragSrc = null;
function addDragHandlers(li, ul) {
  li.addEventListener('dragstart', e => {
    dragSrc = li;
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  li.addEventListener('dragend', () => {
    li.classList.remove('dragging');
    ul.querySelectorAll('.seq-item').forEach(x => x.classList.remove('drag-over'));
  });
  li.addEventListener('dragover', e => {
    e.preventDefault();
    if (dragSrc === li) return;
    li.classList.add('drag-over');
  });
  li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
  li.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragSrc || dragSrc === li) return;
    const all = [...ul.children];
    const srcIdx = all.indexOf(dragSrc);
    const tgtIdx = all.indexOf(li);
    if (srcIdx < tgtIdx) ul.insertBefore(dragSrc, li.nextSibling);
    else ul.insertBefore(dragSrc, li);
    li.classList.remove('drag-over');
    ul.querySelectorAll('.seq-item').forEach(x => x.classList.remove('correct', 'wrong'));
  });

  // Touch support — basic tap-to-swap
  let touchTimer;
  li.addEventListener('touchstart', e => {
    touchTimer = setTimeout(() => {
      if (!dragSrc) {
        dragSrc = li;
        li.style.background = 'var(--accent)';
        li.style.color = 'var(--bg)';
      } else if (dragSrc !== li) {
        // swap
        const tmp = dragSrc.innerHTML;
        const tmpData = dragSrc.dataset.text;
        dragSrc.innerHTML = li.innerHTML;
        dragSrc.dataset.text = li.dataset.text;
        li.innerHTML = tmp;
        li.dataset.text = tmpData;
        dragSrc.style.background = '';
        dragSrc.style.color = '';
        dragSrc = null;
      }
    }, 300);
  });
  li.addEventListener('touchend', () => clearTimeout(touchTimer));
  li.addEventListener('touchmove', () => clearTimeout(touchTimer));
}

function matchRender() {
  const f = STATE.match.filter;
  const list = f === 'ALL' ? LABELING : LABELING.filter(m => m.topic === f);
  const root = document.getElementById('match-list');
  root.innerHTML = '';
  if (list.length === 0) {
    root.innerHTML = '<div class="empty">No matching exercises in this filter.</div>';
    return;
  }
  list.forEach((m, mIdx) => {
    const origIdx = LABELING.indexOf(m);
    const card = document.createElement('div');
    card.className = 'match-card';

    // Shuffle right column
    const lefts = m.pairs.map(p => p.left);
    const rights = m.pairs.map(p => p.right);
    const shuffledRights = [...rights];
    for (let i = shuffledRights.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledRights[i], shuffledRights[j]] = [shuffledRights[j], shuffledRights[i]];
    }

    card.innerHTML = `
      <span class="seq-tag">${m.topic}</span>
      <h3 class="seq-title">${m.title}</h3>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Click an item on the left, then its match on the right.</p>
      <div class="match-grid" data-match-idx="${origIdx}">
        <div class="match-col">
          <div class="match-col-header">Term</div>
          ${lefts.map((l, i) => `<button class="match-item" data-side="left" data-match-idx="${origIdx}" data-text="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join('')}
        </div>
        <div class="match-col">
          <div class="match-col-header">Definition</div>
          ${shuffledRights.map((r, i) => `<button class="match-item" data-side="right" data-match-idx="${origIdx}" data-text="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('')}
        </div>
      </div>
      <div class="seq-actions" style="margin-top: 1.25rem;">
        <button class="btn" data-match-action="reset" data-match-idx="${origIdx}">Reset</button>
        <button class="btn" data-match-action="reveal" data-match-idx="${origIdx}">Show Answers</button>
        <span class="match-progress" style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-dim); align-self: center;" id="match-prog-${origIdx}">0 / ${m.pairs.length} matched</span>
      </div>
    `;
    root.appendChild(card);

    // Wire match items
    card.querySelectorAll('.match-item').forEach(btn => {
      btn.addEventListener('click', () => handleMatchClick(btn, origIdx, m));
    });
    card.querySelectorAll('button[data-match-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.matchAction === 'reset') {
          STATE.match.selected[origIdx] = null;
          card.querySelectorAll('.match-item').forEach(it => {
            it.className = 'match-item';
            it.disabled = false;
          });
          updateMatchProg(origIdx, m);
        } else if (btn.dataset.matchAction === 'reveal') {
          // Build a map of left → right
          const lookup = {};
          m.pairs.forEach(p => { lookup[p.left] = p.right; });
          card.querySelectorAll('.match-item[data-side="left"]').forEach(leftBtn => {
            const rightText = lookup[leftBtn.dataset.text];
            const rightBtn = card.querySelector(`.match-item[data-side="right"][data-text="${CSS.escape(rightText)}"]`);
            leftBtn.className = 'match-item matched-correct';
            leftBtn.disabled = true;
            if (rightBtn) {
              rightBtn.className = 'match-item matched-correct';
              rightBtn.disabled = true;
            }
          });
          document.getElementById(`match-prog-${origIdx}`).textContent = `${m.pairs.length} / ${m.pairs.length} revealed`;
        }
      });
    });
  });
}

function handleMatchClick(btn, mIdx, m) {
  if (btn.disabled) return;
  if (!STATE.match.selected[mIdx]) STATE.match.selected[mIdx] = null;
  const sel = STATE.match.selected[mIdx];
  const card = btn.closest('.match-card');

  if (!sel) {
    // first click — select
    STATE.match.selected[mIdx] = btn;
    btn.classList.add('selected');
    return;
  }

  if (sel === btn) {
    // deselect
    btn.classList.remove('selected');
    STATE.match.selected[mIdx] = null;
    return;
  }

  if (sel.dataset.side === btn.dataset.side) {
    // same side — switch selection
    sel.classList.remove('selected');
    STATE.match.selected[mIdx] = btn;
    btn.classList.add('selected');
    return;
  }

  // Different side — try to match
  const leftBtn = sel.dataset.side === 'left' ? sel : btn;
  const rightBtn = sel.dataset.side === 'right' ? sel : btn;
  const leftText = leftBtn.dataset.text;
  const rightText = rightBtn.dataset.text;
  const correctRight = m.pairs.find(p => p.left === leftText)?.right;

  if (correctRight === rightText) {
    leftBtn.className = 'match-item matched-correct';
    rightBtn.className = 'match-item matched-correct';
    leftBtn.disabled = true;
    rightBtn.disabled = true;
  } else {
    leftBtn.classList.remove('selected');
    rightBtn.classList.remove('selected');
    leftBtn.classList.add('matched-wrong');
    rightBtn.classList.add('matched-wrong');
    setTimeout(() => {
      leftBtn.classList.remove('matched-wrong');
      rightBtn.classList.remove('matched-wrong');
    }, 700);
  }
  STATE.match.selected[mIdx] = null;
  updateMatchProg(mIdx, m);
}

function updateMatchProg(mIdx, m) {
  const card = document.querySelector(`.match-grid[data-match-idx="${mIdx}"]`).closest('.match-card');
  const matched = card.querySelectorAll('.match-item.matched-correct[data-side="left"]').length;
  document.getElementById(`match-prog-${mIdx}`).textContent = `${matched} / ${m.pairs.length} matched`;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============================================================
// NOTES
// ============================================================
function notesRender() {
  const root = document.getElementById('notes-content');
  root.innerHTML = '';
  Object.values(TOPIC_NOTES).forEach(note => {
    const block = document.createElement('div');
    block.className = 'note-block';
    block.innerHTML = `<h2>${note.title}</h2>` +
      note.sections.map(s => `<h3>${s.h}</h3><p>${escapeHtml(s.body).replace(/\n/g, '<br>')}</p>`).join('');
    root.appendChild(block);
  });
}

// ============================================================
// FILTER WIRING
// ============================================================
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.target;
    document.querySelectorAll(`.filter-btn[data-target="${target}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (target === 'fc') { STATE.fc.filter = btn.dataset.filter; fcRebuild(); }
    if (target === 'mcq') { STATE.mcq.filter = btn.dataset.filter; mcqRebuild(); }
    if (target === 'seq') { STATE.seq.filter = btn.dataset.filter; seqRender(); }
    if (target === 'match') { STATE.match.filter = btn.dataset.filter; matchRender(); }
  });
});

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', e => {
  if (document.querySelector('.section.active').id === 'flashcards') {
    if (e.key === 'ArrowRight') document.getElementById('fc-next').click();
    if (e.key === 'ArrowLeft') document.getElementById('fc-prev').click();
    if (e.key === ' ') { e.preventDefault(); document.getElementById('flashcard').click(); }
    if (e.key === 'g' || e.key === 'G') document.getElementById('fc-good').click();
    if (e.key === 'b' || e.key === 'B') document.getElementById('fc-bad').click();
    if (e.key === 's' || e.key === 'S') document.getElementById('fc-star').click();
  }
  if (document.querySelector('.section.active').id === 'mcq') {
    if (e.key === 'ArrowRight') document.getElementById('mcq-next').click();
    if (e.key === 'ArrowLeft') document.getElementById('mcq-prev').click();
  }
});

// ============================================================
// INIT
// ============================================================
fcRebuild();
mcqRebuild();
seqRender();
matchRender();
notesRender();
</script>

</body>
</html>
