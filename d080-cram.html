["Subsidiary / acquisition","Buy and run a foreign company; highest risk and slowest entry, full control.","Market Entry"],
["Greenfield venture","Build a brand-new operation from scratch; full assets, responsibility, and risk.","Market Entry"],
["Joint venture","Two firms share ownership, risk, and control of a new venture.","Market Entry"],
["Standardization vs adaptation","Standardization = same branding everywhere. Adaptation/glocalization = customize per market.","Market Entry"],
["Decentralized manufacturing","Producing locally in the target market (e.g., to beat shipping delays).","Market Entry"],
["Power distance","How readily a society accepts hierarchy and unequal power.","Culture & HR"],
["Uncertainty avoidance","A society's tolerance for ambiguity and the unknown.","Culture & HR"],
["Individualism vs collectivism","Caring for self/close circle vs the broader group.","Culture & HR"],
["Repatriation shock","Disorientation returning home from an overseas posting, from changed work culture/customs.","Culture & HR"],
["Polycentric HR","Host-country nationals run subsidiaries locally; downside is HQ-subsidiary coordination and dual demands. (Ethnocentric = HQ top-down.)","Culture & HR"],
["Lean manufacturing","Reduce waste in production. (JIT = inventory arrives exactly as needed.)","Supply & Distribution"],
["Value-to-weight ratio","Key factor in facility location and shipping-cost decisions.","Supply & Distribution"],
["Country-of-origin effect","Consumer perception of a product based on where it is made.","Supply & Distribution"],
["Direct vs indirect channel","Direct = 0 intermediaries. Indirect = producer to distributor to retailer to consumer. Intermediaries cut up-front cost.","Supply & Distribution"],
["Loans vs bonds vs equity","Loans: low cost of capital, no maturity wait. Bonds: mature over time. Equity: sell ownership.","Finance & Risk"],
["GAAP vs IFRS","GAAP = US domestic accounting standard. IFRS = international standard.","Finance & Risk"],
["Forward contract","Locks an exchange rate to hedge currency-fluctuation risk.","Finance & Risk"],
["Transfer pricing","Pricing between subsidiaries to shift profit and reduce tax; lowers a subsidiary's reported profit.","Finance & Risk"],
["Micro vs macro risk","Micro = firm/industry-specific (IP loss). Macro = country-wide (nationalization, regime change).","Finance & Risk"],
["Digital divide stages","Accessibility (can reach it), Usability (can use it), Empowerment (values and adopts it).","Technology"],
["Blockchain","Secure, decentralized, tamper-resistant storage of sensitive data.","Technology"],
["Fourth Industrial Revolution","Cyber-physical tech: AI, 3D printing, biometrics, nanotech, quantum computing, autonomous cars.","Technology"],
["ERP","Enterprise resource planning; integrates data/processes across all departments.","Technology"]
];
const MATCHES=[
["Cultural dimension -> meaning",[["Power distance","Acceptance of hierarchy and unequal power"],["Uncertainty avoidance","Tolerance for ambiguity and the unknown"],["Individualism","Caring for self and close circle over the group"],["Long-term orientation","Valuing future rewards and perseverance"]]],
["Market entry -> definition",[["Exporting","Ship goods, often via a foreign distributor"],["Joint venture","Two firms share ownership and risk"],["Greenfield","Build a brand-new operation from scratch"],["Subsidiary/acquisition","Buy and run a foreign company"]]],
["Org structure -> trait",[["Functional","Grouped by specialty department"],["Divisional","Grouped by product, market, or geography"],["Matrix","Dual-reporting cross-functional project teams"],["Teams","Creativity and mutual accountability"]]],
["Institution -> role",[["World Bank","Reduces poverty, improves quality of life"],["IMF","Stabilizes money system, fixes trade deficits"],["WTO","Promotes free trade among nations"]]],
["Finance/risk -> meaning",[["Forward contract","Hedges currency-fluctuation risk"],["Transfer pricing","Shifts profit between subsidiaries to cut tax"],["Micro risk","Firm-specific, e.g., loss of IP"],["Macro risk","Country-wide, e.g., asset nationalization"]]]
];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";$("#fcdef").classList.add("hide");$("#fcpos").textContent="0 / 0";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

const NOTES=`
<div class="warn"><b>These are the real questions.</b> Built from the 70-item pre-assessment; the OA mirrors it. Run the MCQ tab on shuffle until you clear it twice, then sit it. This course is pure memorization, lots of terms and frameworks, so the flashcards and matching matter here.</div>
<h3>Globalization and economies</h3>
<div class="mn"><b>CAGE = Cultural, Administrative, Geographic, Economic</b> (Ghemawat, country-difference analysis). Globalization rises with <span class="k">lower trade barriers</span>; downside to the home country is <span class="k">lost manufacturing jobs</span>; political backlash = <span class="k">isolationist policies</span>. Economy types: <b>market</b> (firms maximize profit, private), <b>traditional</b> (custom/barter, disadvantaged), <b>command</b> (gov-owned).</div>
<h3>Institutions and trade</h3>
<div class="mn"><b>World Bank</b> = reduce poverty / improve quality of life. <b>IMF</b> = stabilize money system, fix trade deficits; <b>SDR valued on 5 major currencies</b>. <b>WTO</b> = free trade; criticized for high <span class="k">agricultural</span> tariffs. Comparative advantage: opening trade grows jobs in <span class="k">comparative-advantage</span> industries. <b>Tariff</b> = import tax, <b>quota</b> = quantity limit; both <span class="k">raise domestic prices</span>. Protectionism shields <span class="k">infant industries</span>.</div>
<h3>Regional integration</h3>
<div class="mn"><b>Customs union = free trade inside + common external tariff</b> (unified policy with non-members). Drawback of blocs = <span class="k">trade diversion</span> (skip cheaper outsiders). <b>NAFTA</b> shifted jobs from low comparative-advantage industries; <b>USMCA</b> auto rule ~<span class="k">$16/hr labor by 2023</span>; <b>CAFTA</b> = Central America (Costa Rica). Levels: FTA, Customs Union, Common Market, Economic Union.</div>
<h3>Legal and ethics</h3>
<div class="mn">Islamic law <span class="k">forbids interest</span>. Monopoly cause = <span class="k">control of natural resources</span>. <b>CISG</b> = gap-filler default terms for international contracts. <b>Anti-trust</b> = price-fixing/restraints/monopolization. CSR goal = <span class="k">shareholder trust via high ethics</span>; engage stakeholders. Cross-cultural ethics is hard because <span class="k">ethics are not standardized</span> across countries. <b>Code of ethics</b> = the values/mission statement.</div>
<h3>Org structure and market entry</h3>
<table><tr><th>Structure</th><th>What it is</th></tr><tr><td>Functional</td><td>By specialty dept (marketing, HR, IT)</td></tr><tr><td>Divisional</td><td>By product / market / geography</td></tr><tr><td>Matrix</td><td>Dual-reporting project teams (high-tech)</td></tr><tr><td>Teams</td><td>Creativity, accountability</td></tr></table>
<table><tr><th>Entry</th><th>Key trait</th></tr><tr><td>Exporting</td><td>Cheapest; use distributor; high transport cost</td></tr><tr><td>Subsidiary/acquisition</td><td>Buy and run; highest risk, slowest</td></tr><tr><td>Greenfield</td><td>Build new; all assets and risk</td></tr><tr><td>Joint venture</td><td>Shared ownership and risk</td></tr></table>
<p>Same branding everywhere = <span class="k">standardization</span>. Build locally to beat shipping = <span class="k">decentralized manufacturing</span>.</p>
<h3>Culture and HR (Hofstede)</h3>
<div class="mn"><b>Power distance</b> = accept hierarchy. <b>Uncertainty avoidance</b> = tolerate ambiguity. <b>Individualism</b> = self/close circle over group. Adapting locally = <span class="k">favorable evaluation</span>. Returning home = <span class="k">repatriation shock</span> (changed work culture). <b>Polycentric</b> = locals run subsidiaries (downside: dual demands); <b>ethnocentric</b> = HQ top-down.</div>
<h3>Supply chain and distribution</h3>
<div class="mn"><b>Lean manufacturing</b> = cut waste; <b>JIT</b> = inventory as needed. Location factor = <span class="k">value-to-weight ratio</span>. Consumers judging by where made = <span class="k">country-of-origin effect</span>. <b>Direct = 0 intermediaries</b>; indirect = producer to distributor to retailer to consumer (intermediaries cut up-front cost).</div>
<h3>Finance and risk</h3>
<div class="mn"><b>Loans</b> = low cost of capital, no maturity wait. <b>GAAP</b> = US domestic; IFRS = international. <b>Forward contract</b> = hedge currency risk. <b>Transfer pricing</b> = shift profit between subsidiaries to cut tax (lowers subsidiary profit). <b>Micro risk</b> = firm-specific (IP loss); <b>macro risk</b> = country-wide (nationalization). Strong home currency = max profit paying foreign wages.</div>
<h3>Technology</h3>
<div class="mn">Digital divide stages: <b>Accessibility, Usability, Empowerment</b> (empowerment = values/adopts it). <b>Blockchain</b> = secure decentralized data storage. <b>Fourth Industrial Revolution</b> = AI, 3D printing, biometrics, nanotech, quantum, autonomous cars. <b>ERP</b> = integrates systems across departments. AI deep learning = machines learning defects over time. Slowest AI sector = <span class="k">education</span>.</div>
`;
$("#notes").innerHTML=NOTES;

renderChips();buildFC();buildMC();buildMA();
</script></body></html>
