<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Baby Name Roulette</title>
<meta property="og:title" content="Baby Name Roulette">
<meta property="og:description" content="Spin the wheel for baby names pre-filtered for zero cultural baggage. No Karens, Chads, or Berthas allowed.">
<meta property="og:url" content="https://niggerfaggot.club/baby-names.html">
<meta name="twitter:card" content="summary">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;font-family:'Inter',-apple-system,system-ui,sans-serif}
body{min-height:100vh;transition:background .3s,color .3s;padding:16px 12px 40px}
body.dark{background:#0a0a1a;color:#e8e8f0}
body.light{background:#f0f2f5;color:#1a1a2a}
.container{max-width:500px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{font-size:clamp(20px,5vw,28px);font-weight:900;background:linear-gradient(135deg,#e74c3c,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.subtitle{font-size:12px;margin-top:2px}
.dark .subtitle,.dark .muted{color:#888899}
.light .subtitle,.light .muted{color:#666677}
.theme-btn{border:none;border-radius:20px;padding:8px 14px;font-size:18px;cursor:pointer;transition:background .2s}
.dark .theme-btn{background:rgba(255,255,255,.1);color:#e8e8f0}
.light .theme-btn{background:rgba(0,0,0,.08);color:#1a1a2a}
.gender-toggle{display:flex;border-radius:12px;overflow:hidden;margin-bottom:12px}
.dark .gender-toggle{border:2px solid rgba(255,255,255,.08)}
.light .gender-toggle{border:2px solid rgba(0,0,0,.08)}
.gender-btn{flex:1;padding:10px 8px;border:none;cursor:pointer;font-size:clamp(13px,3.5vw,15px);font-weight:700;background:transparent;border-bottom:3px solid transparent;transition:all .2s;font-family:inherit}
.gender-btn.active-boy{background:rgba(52,152,219,.2);color:#3498db;border-bottom-color:#3498db}
.gender-btn.active-girl{background:rgba(233,30,138,.15);color:#e91e8a;border-bottom-color:#e91e8a}
.dark .gender-btn:not([class*=active]){color:#888899}
.light .gender-btn:not([class*=active]){color:#666677}
.cat-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-pills::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.dark .pill{background:rgba(255,255,255,.08);color:#888899}
.light .pill{background:rgba(0,0,0,.06);color:#666677}
.pill.active{color:#fff}
.pill.active.boy-active{background:#3498db}
.pill.active.girl-active{background:#e91e8a}
.wheel-wrap{display:flex;justify-content:center}
.wheel-container{position:relative;width:min(380px,85vw);aspect-ratio:1}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:10;border-left:14px solid transparent;border-right:14px solid transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.dark .pointer{border-top:24px solid #f1c40f}
.light .pointer{border-top:24px solid #e74c3c}
.wheel-svg{width:100%;height:100%;filter:drop-shadow(0 4px 20px rgba(0,0,0,.3))}
.result-area{min-height:70px;display:flex;align-items:center;justify-content:center;position:relative;margin-top:12px}
.result-name{font-size:clamp(28px,7vw,44px);font-weight:900;background:linear-gradient(135deg,#e74c3c,#f39c12,#2ecc71,#3498db);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti-particle{position:absolute;animation:confettiFall 1.2s ease-out forwards;opacity:0}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(120px) rotate(720deg)}}
.card{padding:16px;border-radius:14px;margin-top:20px}
.dark .card{background:#141428;border:1px solid rgba(255,255,255,.08)}
.light .card{background:#fff;border:1px solid rgba(0,0,0,.08)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-label{font-size:13px;font-weight:700;letter-spacing:.5px}
.clear-btn{background:none;border:none;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit}
.dark .clear-btn{color:#888899}
.light .clear-btn{color:#666677}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{padding:4px 10px;border-radius:16px;font-size:13px;font-weight:600}
.dark .pick{background:rgba(255,255,255,.06)}
.light .pick{background:rgba(0,0,0,.04)}
.filtered-btn{background:none;border:none;font-size:13px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:24px;font-family:inherit}
.dark .filtered-btn{color:#888899}
.light .filtered-btn{color:#666677}
.filtered-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:10px}
.filtered-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.dark .filtered-row{border-bottom:1px solid rgba(255,255,255,.08)}
.light .filtered-row{border-bottom:1px solid rgba(0,0,0,.08)}
.filtered-name{font-weight:700;font-size:14px;text-decoration:line-through;color:#e74c3c}
.filtered-reason{font-size:12px;text-align:right;margin-left:8px}
.footer{text-align:center;font-size:11px;margin-top:24px;line-height:1.6}
</style>
</head>
<body class="dark">
<div class="container">
  <div class="header">
    <div>
      <div class="title">Baby Name Roulette</div>
      <p class="subtitle">Pre-filtered for zero cultural baggage</p>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
  <div class="gender-toggle">
    <button class="gender-btn active-boy" id="boyBtn" onclick="setGender('boys')">👦 Boy Names</button>
    <button class="gender-btn" id="girlBtn" onclick="setGender('girls')">👧 Girl Names</button>
  </div>
  <div class="cat-pills" id="catPills"></div>
  <div class="wheel-wrap">
    <div class="wheel-container">
      <div class="pointer"></div>
      <svg class="wheel-svg" id="wheelSvg"></svg>
    </div>
  </div>
  <div class="result-area" id="resultArea"></div>
  <div class="card" id="historyCard" style="display:none">
    <div class="card-header">
      <span class="card-label muted">RECENT PICKS</span>
      <button class="clear-btn" onclick="clearHistory()">Clear</button>
    </div>
    <div class="picks" id="picksList"></div>
  </div>
  <button class="filtered-btn" onclick="toggleFiltered()" id="filteredBtn">▸ Names That Didn't Make the Cut (32)</button>
  <div id="filteredPanel" style="display:none"></div>
  <p class="footer muted">Names sourced from SSA top baby names 2014-2024, filtered for zero connotations.<br>No Karens, Chads, or Berthas were harmed in the making of this spinner.</p>
</div>
<script>
const NAMES = {
  boys: {
    "Classic": ["James","Henry","William","Thomas","Charles","Edward","George","Arthur","Robert","Patrick","Walter","Vincent","Edmund","Philip"],
    "Strong": ["Liam","Jack","Oliver","Owen","Leo","Ethan","Lucas","Gabriel","Bennett","Benjamin"],
    "All Boys": ["James","Henry","William","Thomas","Charles","Edward","George","Arthur","Robert","Patrick","Walter","Vincent","Liam","Jack","Oliver","Owen","Leo","Ethan","Lucas","Gabriel","Bennett","Benjamin","Edmund","Philip"]
  },
  girls: {
    "Classic": ["Charlotte","Catherine","Margaret","Caroline","Victoria","Elizabeth","Beatrice","Helena","Margot","Rosalind","Cecilia","Eleanor","Scarlett"],
    "Sweet & Short": ["Emma","Olivia","Sophia","Ava","Mia","Nora","Grace","Chloe","Amelia"],
    "Nature": ["Lily","Violet","Hazel","Ivy","Ruby","Iris","Willow","Daisy","Fern","Wren"],
    "Modern Edge": ["Maeve","Sadie","Quinn","Sloane","Harper","Luna","Piper"],
    "All Girls": ["Charlotte","Catherine","Margaret","Caroline","Victoria","Elizabeth","Beatrice","Helena","Margot","Rosalind","Cecilia","Eleanor","Scarlett","Emma","Olivia","Sophia","Ava","Mia","Nora","Grace","Chloe","Amelia","Lily","Violet","Hazel","Ivy","Ruby","Iris","Willow","Daisy","Fern","Wren","Maeve","Sadie","Quinn","Sloane","Harper","Luna","Piper"]
  }
};
const FILTERED=[{n:"Karen",r:"Manager's worst nightmare"},{n:"Bertha",r:"\"Big Bertha\" — eternal fat joke"},{n:"Helga",r:"Mean lunch lady energy"},{n:"Stacy",r:"Her mom's got it goin' on"},{n:"Becky",r:"\"Oh my God, Becky\""},{n:"Felicia",r:"Bye."},{n:"Alexa",r:"Will never stop turning on the lights"},{n:"Siri",r:"See above, but Apple"},{n:"Chad",r:"The alpha-bro meme"},{n:"Kyle",r:"Monster Energy, drywall damage"},{n:"Kevin",r:"International symbol for stupid"},{n:"Dick",r:"...yeah"},{n:"Donald",r:"Too politically loaded either way"},{n:"Damien",r:"Literal demon child (The Omen)"},{n:"Candy",r:"Stripper name hall of fame"},{n:"Crystal",r:"Either meth or stripper, pick one"},{n:"Destiny",r:"See: Crystal"},{n:"Barbie",r:"Plastic fantastic"},{n:"Gertrude",r:"Born elderly"},{n:"Mildred",r:"Also born elderly"},{n:"Brock",r:"Turner ruined it for everyone"},{n:"Regina",r:"On Wednesdays we wear pink"},{n:"Isis",r:"Mythology ruined by terrorism"},{n:"Nevaeh",r:"Heaven backwards. We know. Still no."},{n:"Tucker",r:"Too Carlson-coded"},{n:"Dexter",r:"Serial killer show"},{n:"Norman",r:"Bates Motel permanent resident"},{n:"Gaylord",r:"Self-explanatory in 2026"},{n:"Katrina",r:"Hurricane PTSD"},{n:"Fanny",r:"Means butt in British English"},{n:"Jezebel",r:"Biblical harlot, gossip blog"},{n:"Harvey",r:"Weinstein'd"}];
const COLORS=["#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6","#1abc9c","#e67e22","#2980b9","#27ae60","#8e44ad","#16a085","#d35400","#c0392b","#2c3e50","#f1c40f","#7f8c8d"];

let gender="boys", category="Classic", currentAngle=0, spinning=false, history=[], currentNames=[], animId=null;

function toggleTheme(){
  const d=document.body;
  if(d.classList.contains("dark")){d.classList.replace("dark","light");document.getElementById("themeBtn").textContent="🌙"}
  else{d.classList.replace("light","dark");document.getElementById("themeBtn").textContent="☀️"}
  renderWheel();
}

function setGender(g){
  gender=g;
  document.getElementById("boyBtn").className="gender-btn"+(g==="boys"?" active-boy":"");
  document.getElementById("girlBtn").className="gender-btn"+(g==="girls"?" active-girl":"");
  const cats=Object.keys(NAMES[g]);
  if(!cats.includes(category))category=cats[0];
  renderPills();renderWheel();
}

function setCategory(c){category=c;renderPills();renderWheel();}

function renderPills(){
  const cats=Object.keys(NAMES[gender]);
  document.getElementById("catPills").innerHTML=cats.map(c=>{
    const active=(c===category);
    const cls="pill"+(active?" active "+(gender==="boys"?"boy-active":"girl-active"):"");
    const escaped=c.replace(/'/g,"\\'");
    return`<button class="${cls}" onclick="setCategory('${escaped}')">${c}</button>`;
  }).join("");
}

function polar(cx,cy,r,deg){
  const rad=(deg-90)*Math.PI/180;
  return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
}

function arcPath(cx,cy,r,s,e){
  const p1=polar(cx,cy,r,e),p2=polar(cx,cy,r,s),large=(e-s)>180?1:0;
  return`M${cx},${cy}L${p1.x},${p1.y}A${r},${r} 0 ${large} 0 ${p2.x},${p2.y}Z`;
}

function renderWheel(){
  let source=NAMES[gender][category]||NAMES[gender][Object.keys(NAMES[gender])[0]];
  if(source.length>16){
    const s=[...source].sort(()=>Math.random()-.5);
    source=s.slice(0,14);
  }
  currentNames=source;
  const isDark=document.body.classList.contains("dark");

  const n=currentNames.length, seg=360/n;
  const S=400, cx=S/2, cy=S/2, r=S/2-12;
  const fontSize=n<=7?17:n<=10?15:n<=14?13:11;
  const textR=r*0.65;

  const svg=document.getElementById("wheelSvg");
  svg.setAttribute("viewBox",`0 0 ${S} ${S}`);

  // Build static segments (no rotation group - we rotate the whole SVG group via attribute)
  let segs="";
  for(let i=0;i<n;i++){
    const startA=i*seg, endA=(i+1)*seg, midA=startA+seg/2;
    segs+=`<path d="${arcPath(cx,cy,r,startA,endA)}" fill="${COLORS[i%COLORS.length]}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>`;

    // Text: position along radius, flip if in bottom half so always readable
    const tp=polar(cx,cy,textR,midA);
    const normalizedMid=midA%360;
    // If text would be upside down (between 90 and 270), flip it
    const flip=normalizedMid>90&&normalizedMid<270;
    const textAngle=flip?midA+180:midA;
    segs+=`<text x="${tp.x}" y="${tp.y}" fill="white" font-size="${fontSize}" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${textAngle},${tp.x},${tp.y})" style="font-family:Inter,-apple-system,system-ui,sans-serif">${currentNames[i]}</text>`;
  }

  // Center circles
  const outerFill=isDark?"#1a1a2e":"#fff";
  const outerStroke=isDark?"rgba(255,255,255,.2)":"rgba(0,0,0,.1)";
  const innerFill=isDark?"#16213e":"#f8f9fa";
  const spinColor=isDark?"#f1c40f":"#e74c3c";

  svg.innerHTML=
    `<g id="wheelG" transform="rotate(${currentAngle},${cx},${cy})">${segs}`+
    `<circle cx="${cx}" cy="${cy}" r="42" fill="${outerFill}" stroke="${outerStroke}" stroke-width="2"/>`+
    `<circle cx="${cx}" cy="${cy}" r="39" fill="${innerFill}"/>`+
    `</g>`+
    `<circle cx="${cx}" cy="${cy}" r="39" fill="transparent" style="cursor:pointer" onclick="spin()"/>`+
    `<text x="${cx}" y="${cy}" fill="${spinColor}" font-size="15" font-weight="900" text-anchor="middle" dominant-baseline="middle" style="cursor:pointer;letter-spacing:1.5px;font-family:Inter,-apple-system,system-ui,sans-serif" id="spinLabel" onclick="spin()">SPIN</text>`;
}

// RAF-based spin animation (Safari compatible - no CSS transitions on SVG)
function spin(){
  if(spinning)return;
  spinning=true;
  document.getElementById("spinLabel").textContent="...";
  document.getElementById("resultArea").innerHTML="";

  const targetExtra=(5+Math.random()*5)*360+Math.random()*360;
  const targetAngle=currentAngle+targetExtra;
  const startAngle=currentAngle;
  const duration=4000;
  const startTime=performance.now();

  function easeOut(t){
    // cubic bezier approximation of (0.17, 0.67, 0.12, 0.99)
    return 1-Math.pow(1-t,4);
  }

  function animate(now){
    const elapsed=now-startTime;
    const t=Math.min(elapsed/duration,1);
    const eased=easeOut(t);
    currentAngle=startAngle+(targetAngle-startAngle)*eased;

    const g=document.getElementById("wheelG");
    if(g)g.setAttribute("transform",`rotate(${currentAngle},200,200)`);

    if(t<1){
      animId=requestAnimationFrame(animate);
    }else{
      currentAngle=targetAngle;
      // Determine result
      const n=currentNames.length, seg=360/n;
      const norm=((currentAngle%360)+360)%360;
      const idx=Math.floor((360-norm+seg/2)/seg)%n;
      const picked=currentNames[((idx%n)+n)%n];
      const icon=gender==="boys"?"👦":"👧";
      history.unshift({name:picked,icon});
      if(history.length>12)history.length=12;
      renderHistory();

      document.getElementById("resultArea").innerHTML=`<div style="text-align:center"><div class="result-name">${picked}</div>${confettiHTML()}</div>`;
      document.getElementById("spinLabel").textContent="SPIN";
      spinning=false;

      setTimeout(()=>{
        const c=document.getElementById("resultArea").querySelector(".cfw");
        if(c)c.remove();
      },2000);
    }
  }
  animId=requestAnimationFrame(animate);
}

function confettiHTML(){
  let h='<div class="cfw" style="position:absolute;top:50%;left:50%;pointer-events:none">';
  for(let i=0;i<24;i++){
    const x=(Math.random()-.5)*260,y=-(Math.random()*120+40);
    const c=COLORS[Math.floor(Math.random()*COLORS.length)];
    const sz=Math.random()*8+4,d=Math.random()*.3;
    const br=Math.random()>.5?"50%":"2px";
    h+=`<div class="confetti-particle" style="width:${sz}px;height:${sz}px;background:${c};border-radius:${br};left:${x}px;top:${y}px;animation-delay:${d}s"></div>`;
  }
  return h+"</div>";
}

function renderHistory(){
  const card=document.getElementById("historyCard"),list=document.getElementById("picksList");
  if(!history.length){card.style.display="none";return;}
  card.style.display="block";
  list.innerHTML=history.map(h=>`<span class="pick">${h.icon} ${h.name}</span>`).join("");
}
function clearHistory(){history=[];renderHistory();}

let filteredOpen=false;
function toggleFiltered(){
  filteredOpen=!filteredOpen;
  const btn=document.getElementById("filteredBtn"),panel=document.getElementById("filteredPanel");
  btn.innerHTML=(filteredOpen?"▾":"▸")+" Names That Didn't Make the Cut (32)";
  if(!filteredOpen){panel.style.display="none";return;}
  panel.style.display="block";
  panel.innerHTML=`<div class="card"><div class="filtered-grid">${FILTERED.map(f=>
    `<div class="filtered-row"><span class="filtered-name">${f.n}</span><span class="filtered-reason muted">${f.r}</span></div>`
  ).join("")}</div></div>`;
}

renderPills();
renderWheel();
</script>
</body>
</html>
