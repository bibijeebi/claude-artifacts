<!--
DRILL TEMPLATE (canonical, fixed 2026-07-02)
Fixes baked in:
  - Mobile answer-leak: all :hover rules wrapped in @media(hover:hover) so iOS sticky
    hover can never pre-highlight an option. -webkit-tap-highlight-color killed,
    :active provides touch feedback instead.
  - Day/night toggle: floating button bottom-right. Persists to localStorage key
    "drill_theme" (SHARED across all drills on the domain). URL param ?theme=dark|light
    overrides for screenshots/sharing without persisting.
  - Core/Full mode toggle, index-keyed progress (append-only banks preserve progress).

Placeholders to replace at build time:
  {{TITLE}}      e.g. "D196 Drill"
  {{SUBTITLE}}   e.g. "Financial & Managerial Accounting · core 113 Q · full 123 Q"
  {{OG_DESC}}    one-sentence description
  {{SLUG}}       e.g. "d196-drill" (used for og:url and og:image)
  {{LS_PREFIX}}  e.g. "d196drill" (yields d196drill_v1 + d196drill_mode)
  MCQS array     rows: [question, [opts], correctIndex, explanation, "Topic", coreFlag]
                 coreFlag 1 = core; omit it for full-only questions.
Mobile tap-to-advance: document-level click handler with 250ms debounce (waitAt) so the
answering tap cannot skip the reveal; taps on select/a/#themeBtn/.seg/.reset excluded.
Verification (mandatory before deploy): jsdom mastery loop, N core questions must
master in exactly 2N answers; mode switch must expand the pool; saved state must persist.
-->

<style>

.glassy{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--hair);box-shadow:var(--shadow),inset 0 1px 0 var(--spec)}

@keyframes gShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html,body{overflow-x:hidden}
body{font-size:15px}
.wrap{max-width:760px;margin-left:auto;margin-right:auto;padding-top:16px;padding-bottom:74px;padding-left:14px;padding-right:14px}

@media(hover:hover){.ans:hover{border-color:var(--sky);transform:translateY(-1px);box-shadow:0 4px 14px rgba(22,58,95,.12)}}

.ans .ltr{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:rgba(31,147,204,.14);color:var(--ink);font-family:var(--fm);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}

.ans b{color:var(--ink)}
[data-theme="dark"] .ans .ltr{background:rgba(70,180,230,.18)}

[data-theme="dark"] .explain.no{background:rgba(246,168,160,.12)}

.done p{color:var(--mut);margin:0 0 18px}
.btn{font-family:var(--fb);font-size:14px;font-weight:700;background:var(--good);color:#fff;border:0;border-radius:11px;padding:11px 20px;cursor:pointer;box-shadow:0 2px 8px rgba(46,139,87,.3)}

</style></head>
<body><div class="wrap">
<header>
  <div class="htxt"><h1>{{TITLE}}</h1><p>{{SUBTITLE}}</p></div>
  <div class="rings">
    <div class="ring"><svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="#e3e9ef" stroke-width="6"/><circle id="seenR" cx="27" cy="27" r="22" fill="none" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="138"/></svg><b id="seenN">0%</b><span>Seen</span></div>
    <div class="ring"><svg width="54" height="54"><circle cx="27" cy="27" r="22" fill="none" stroke="#e3e9ef" stroke-width="6"/><circle id="aptR" cx="27" cy="27" r="22" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="138"/></svg><b id="aptN">0%</b><span>Apt</span></div>
  </div>
</header>
<div class="hud"><span class="chip flame" id="hudStreak"></span><span class="chip" id="hudXP"></span><span class="chip" id="hudBest"></span></div>
<div class="bar">
  <div class="seg"><button id="mCore">Core</button><button id="mFull">Full</button></div>
  <select id="topic"><option value="">All topics</option></select>
  <div class="count" id="count"></div>
</div>
<div id="stage" class="card"></div>
<footer>Tap or press 1–4 / A–D · space to continue · <a id="histBtn">‹ back</a> · <a id="reset">reset progress</a> · <a id="sndBtn"></a></footer>
</div>
<script>
const MCQS=[
["Example question: which option is correct?", ["Wrong one","The correct one","Also wrong","Still wrong"], 1, "Explanation with the cut rule in plain text.", "Topic A", 1],
["Full-only example (omit trailing 1 to keep it out of core mode).", ["A","B","C","D"], 0, "Why A is right.", "Topic B"]
];
const LS = "{{LS_PREFIX}}_v1";
const C=22*2*Math.PI;
let queue=[], cur=0, curOpts=[], waiting=false, picked=new Set(), filter="", waitAt=0;
let hist=[],histPos=-1;
let mode=localStorage.getItem("{{LS_PREFIX}}_mode")||"core";
const $=s=>document.getElementById(s);
let state=load();

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(Array.isArray(s)){while(s.length<MCQS.length)s.push({c:0,seen:false,lta:[]});const t=s.slice(0,MCQS.length);t.forEach(p=>{if(!Array.isArray(p.lta))p.lta=[]});return t;}}catch(e){}return MCQS.map(()=>({c:0,seen:false,lta:[]}));}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function isMulti(i){return Array.isArray(MCQS[i][2])}
function corrSet(i){return new Set(isMulti(i)?MCQS[i][2]:[MCQS[i][2]])}

const APTW=[.5,.25,.15,.1];
function qApt(i){const l=state[i].lta||[];let a=0;for(let k=0;k<4;k++)a+=APTW[k]*(l[k]===undefined?.25:l[k]);return a}
function idxs(){return MCQS.map((_,i)=>i).filter(i=>(mode==="full"||MCQS[i][5]===1)&&(!filter||MCQS[i][4]===filter))}
function rebuild(){queue=idxs().filter(i=>state[i].c<2);if(queue.length){shuffle(queue);queue.sort((a,b)=>(state[a].seen?1:0)-(state[b].seen?1:0));}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function rings(){
  const pool=idxs();const seen=pool.filter(i=>state[i].seen).length;
  const apt=pool.reduce((s,i)=>s+(state[i].seen?qApt(i):0),0)/(pool.length||1);
  const sp=pool.length?seen/pool.length:0;
  $("seenR").style.strokeDashoffset=C*(1-sp);$("seenN").textContent=Math.round(sp*100)+"%";
  $("aptR").style.strokeDashoffset=C*(1-apt);$("aptN").textContent=Math.round(apt*100)+"%";
  const mastered=pool.filter(i=>state[i].c>=2).length;
  $("count").textContent=mastered+" / "+pool.length+" mastered";
}

function render(){
  histPos=-1;
  rings();
  if(!queue.length){
    const pool=idxs();
    $("stage").innerHTML='<div class="done"><h2>'+(pool.every(i=>state[i].c>=2)?"Pool mastered ✓":"Nothing left in queue")+'</h2><p>Every question answered correctly twice.</p><button class="btn" id="again">Study again</button></div>';
    SND.win();GAME.win();
    $("again").onclick=()=>{idxs().forEach(i=>state[i].c=0);save();rebuild();render()};return;
  }
  cur=queue[0];waiting=false;picked=new Set();
  const m=MCQS[cur],multi=isMulti(cur);
  curOpts=m[1].map((t,oi)=>({oi,text:t}));shuffle(curOpts);
  let h='<div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="opts">';
  curOpts.forEach((o,d)=>{h+='<button class="ans" data-disp="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  h+='</div>';
  if(multi)h+='<button class="chk" id="chk" disabled>Check</button>';
  h+='<div class="explain" id="exp"></div><div class="cont" id="cont">tap or press space to continue</div>';
  $("stage").innerHTML=h;
  [...document.querySelectorAll("#opts .ans")].forEach(b=>b.onclick=()=>pick(+b.dataset.disp));
  if(multi)$("chk").onclick=submit;
}

// --- gamification layer ---
var GAME=(function(){
var xp=0,streak=0,best=+(localStorage.getItem(LS+"_bestStreak")||0),rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var st=document.createElement("style");st.textContent="@keyframes gPop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}.gPop{position:fixed;left:50%;top:38%;z-index:99;font-family:'Nunito',-apple-system,sans-serif;font-size:21px;font-weight:800;color:#37b06f;animation:gPop .9s ease-out forwards;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.18)}@keyframes gFall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}.gCf{position:fixed;z-index:98;width:8px;height:12px;border-radius:2px;animation:gFall var(--t) ease-out forwards;pointer-events:none}@keyframes gTick{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}.chip.tick{animation:gTick .3s ease-out}";
document.head.appendChild(st);
var elS=document.getElementById("hudStreak"),elX=document.getElementById("hudXP"),elB=document.getElementById("hudBest");
function hud(t){
if(elS){elS.textContent="\uD83D\uDD25 "+streak;elS.classList.toggle("warm",streak>=3&&streak<6);elS.classList.toggle("hot",streak>=6);
if(t&&!rm){elS.classList.remove("tick");void elS.offsetWidth;elS.classList.add("tick")}}
if(elX){elX.textContent=xp+" XP";if(t&&!rm){elX.classList.remove("tick");void elX.offsetWidth;elX.classList.add("tick")}}
if(elB){elB.textContent="best "+best;elB.style.display=best>1?"":"none"}}
function pop(txt,color){var d=document.createElement("div");d.className="gPop";if(color)d.style.color=color;d.textContent=txt;document.body.appendChild(d);setTimeout(function(){d.remove()},950)}
function burst(n,fromTop){if(rm)return;var cols=["#1f93cc","#a3ddc6","#f4d79a","#f6a8a0","#c4b4e6"];for(var i=0;i<n;i++){var c=document.createElement("div");c.className="gCf";c.style.background=cols[i%5];c.style.left=(fromTop?Math.random()*100:45+Math.random()*10)+"%";c.style.top=fromTop?"-16px":"36%";c.style.setProperty("--dx",(Math.random()*260-130)+"px");c.style.setProperty("--dy",(fromTop?300+Math.random()*500:120+Math.random()*260)+"px");c.style.setProperty("--rot",(Math.random()*720-360)+"deg");c.style.setProperty("--t",(0.7+Math.random()*0.8)+"s");document.body.appendChild(c);setTimeout(function(e){return function(){e.remove()}}(c),1600)}}
function ok(mastered){streak++;if(streak>best){best=streak;try{localStorage.setItem(LS+"_bestStreak",best)}catch(e){}}
var pts=10*Math.min(streak,5)+(mastered?25:0);xp+=pts;pop("+"+pts+" XP"+(mastered?" \u2605":""),mastered?"#e8b23a":"#37b06f");if(mastered)burst(14);else if(streak%5===0)burst(10);hud(true)}
function no(){streak=0;hud(false)}
function win(){burst(90,true);pop("POOL MASTERED","#e8b23a")}
hud(false);
return{ok:ok,no:no,win:win}
})();
// --- audio feedback (Web Audio synth, no assets) ---
var SND=(function(){
var ctx=null,muted=(localStorage.getItem("drillSnd")==="0"),streak=0;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,t0,dur,type,vol){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02)}
function ok(mastered){streak++;if(muted)return;var s=Math.min(streak,12),b=660*Math.pow(2,(s-1)/24);tone(b,0,.09);tone(b*1.5,.07,.12);if(mastered){tone(1318.5,.16,.1,"triangle",.09);tone(1760,.24,.14,"triangle",.09)}if(streak%5===0){tone(b*2,.2,.18,"sine",.08)}}
function no(){streak=0;if(muted)return;tone(196,0,.16,"triangle",.08);tone(147,.09,.2,"triangle",.08)}
function win(){if(muted||!ctx)return;[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*.11,.22,"sine",.1)});tone(1318.5,.5,.4,"triangle",.08)}
function toggle(){muted=!muted;localStorage.setItem("drillSnd",muted?"0":"1");return muted}
return{ok:ok,no:no,win:win,toggle:toggle,muted:function(){return muted}}
})();
(function(){var a=document.getElementById("sndBtn");if(!a)return;function r(){a.textContent=SND.muted()?"\uD83D\uDD07 sound":"\uD83D\uDD0A sound"}a.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();SND.toggle();r()});r()})();

function showHist(p){
  histPos=p;waiting=false;
  const h=hist[p],m=MCQS[h.i];
  const cs=corrSet(h.i),ch=new Set(h.ch.map(d=>h.opts[d].oi));
  let out='<div class="topic">'+m[4]+' \u00b7 review '+(p+1)+' of '+hist.length+'</div><p class="q">'+esc(m[0])+'</p><div id="opts">';
  h.opts.forEach((o,d)=>{let cls="ans dim";if(cs.has(o.oi))cls="ans correct";else if(ch.has(o.oi))cls="ans wrong";out+='<button class="'+cls+'" style="pointer-events:none"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></button>'});
  out+='</div><div class="explain show '+(h.ok?"ok":"no")+'"><b>'+(h.ok?"Correct.":"Missed.")+'</b> '+esc(m[3])+'</div><div class="cont show">'+(p>0?"\u2039 older \u00b7 ":"")+'tap / \u2192 to return</div>';
  $("stage").innerHTML=out;
}
function histNav(d){
  if(d<0){const t=(histPos<0?hist.length:histPos)-1;if(t>=0)showHist(t);return}
  if(histPos<0)return;
  if(histPos+1<hist.length)showHist(histPos+1);else{histPos=-1;render()}
}
function pick(d){
  if(histPos>=0)return;
  if(waiting)return;
  if(isMulti(cur)){
    const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');
    if(picked.has(d)){picked.delete(d);b.classList.remove("sel")}else{picked.add(d);b.classList.add("sel")}
    $("chk").disabled=picked.size===0;return;
  }
  picked=new Set([d]);submit();
}

function submit(){
  if(waiting)return;waiting=true;waitAt=Date.now();
  const m=MCQS[cur],cs=corrSet(cur);
  const chosen=new Set([...picked].map(d=>curOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#opts .ans").forEach(b=>{
    const oi=curOpts[+b.dataset.disp].oi;b.style.pointerEvents="none";
    if(cs.has(oi))b.classList.add("correct");
    else if(chosen.has(oi))b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(isMulti(cur))$("chk").style.display="none";
  state[cur].seen=true;
  if(ok)state[cur].c++;else state[cur].c=0;
  state[cur].lta=[ok?1:0].concat(state[cur].lta||[]).slice(0,4);
  if(ok)SND.ok(state[cur].c>=2);else SND.no();
  if(ok)GAME.ok(state[cur].c>=2);else GAME.no();
  save();
  hist.push({i:cur,opts:curOpts.slice(),ch:[...picked],ok:ok});if(hist.length>10)hist.shift();
  const e=$("exp");e.className="explain show "+(ok?"ok":"no");
  e.innerHTML="<b>"+(ok?"Correct.":"Not quite.")+"</b> "+esc(m[3]);
  // requeue
  queue.shift();
  if(ok&&state[cur].c>=2){/* retire */}
  else{const uns=queue.reduce((n,i)=>n+(state[i].seen?0:1),0);const off=ok?Math.min(uns+8,queue.length):Math.min(3,queue.length);queue.splice(off,0,cur)}
  rings();
  if(ok){$("cont").classList.remove("show");setTimeout(()=>{if(waiting)next()},460)}
  else $("cont").classList.add("show");
}

function next(){if(waiting){waiting=false;render()}}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){e.preventDefault();histNav(-1);return}
  if(e.key==="ArrowRight"){if(histPos>=0){e.preventDefault();histNav(1)}return}
  if(e.key===" "||e.key==="Enter"){if(histPos>=0){e.preventDefault();histNav(1);return}if(waiting){e.preventDefault();next()}return}
  const n="1234".indexOf(e.key),a="abcd".indexOf(e.key.toLowerCase());
  const d=n>=0?n:a;if(d>=0){const b=document.querySelector('#opts .ans[data-disp="'+d+'"]');if(b)pick(d)}
});
$("stage").addEventListener("click",()=>{if(histPos>=0)return;if(waiting&&Date.now()-waitAt>250)next()});

// topic dropdown
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("topic").appendChild(o)});
$("topic").onchange=()=>{filter=$("topic").value;rebuild();render()};
$("histBtn").onclick=e=>{e.preventDefault();e.stopPropagation();histNav(-1)};
$("reset").onclick=()=>{if(confirm("Wipe all drill progress?")){state=MCQS.map(()=>({c:0,seen:false,lta:[]}));save();rebuild();render()}};

function setMode(m){mode=m;localStorage.setItem("{{LS_PREFIX}}_mode",m);$("mCore").classList.toggle("on",m==="core");$("mFull").classList.toggle("on",m==="full");rebuild();render()}
$("mCore").onclick=()=>setMode("core");$("mFull").onclick=()=>setMode("full");
setMode(mode);

document.addEventListener("click", function(e){
  var t=e.target;
  if(t.closest && t.closest("select,a,#themeBtn,.seg,.reset")) return;
  if(histPos>=0){ histNav(1); return; }
  if(!waiting) return;
  if(Date.now()-waitAt<250) return;
  next();
});
</script>
<button id="themeBtn" class="themeb" aria-label="toggle theme">☾</button>
<script>
(function(){
  var K="drill_theme", btn=document.getElementById("themeBtn");
  var qp=null; try{qp=new URLSearchParams(location.search).get("theme");}catch(e){}
  var saved=null; try{saved=localStorage.getItem(K);}catch(e){}
  var t=qp||saved||"light";
  function apply(x){document.documentElement.setAttribute("data-theme",x);btn.textContent=x==="dark"?"\u2600":"\u263e";}
  apply(t);
  btn.addEventListener("click",function(){t=(t==="dark")?"light":"dark";try{localStorage.setItem(K,t)}catch(e){}apply(t);});
})();
</script>
