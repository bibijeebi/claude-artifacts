<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#2b3238;--dim:#7a8590;--teal:#159fc9;--green:#43a047;--red:#e23b3b;--line:#dde3e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:640px;margin:0 auto}
.head{background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.head h1{font-size:17px;line-height:1.2}
.head .sub{font-size:12px;color:var(--dim)}
.rings{margin-left:auto;display:flex;gap:10px}
.ring{width:52px;text-align:center;font-size:10px;color:var(--dim)}
.ring svg{display:block;margin:0 auto 2px}
.ring .val{font-weight:700;font-size:11px;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.reset{font-size:12px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none}
.card{background:var(--panel);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtopic{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px}
.qtext{font-size:16.5px;line-height:1.45;margin-bottom:14px}
.ans{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;line-height:1.4;margin-bottom:8px;cursor:pointer;color:var(--ink)}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{font-weight:700;color:var(--dim);flex:none}
.ans.correct{border-color:var(--green);background:#eef7ee}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.reveal{border-color:var(--green)}
.ans:disabled{cursor:default}
.explain{display:none;margin-top:10px;border-left:3px solid var(--red);background:#fdf3f3;padding:10px 12px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
.explain b{color:var(--green)}
.explain .cont{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.meta{margin-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.done{background:var(--panel);border-radius:10px;padding:30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.done h2{color:var(--green);margin-bottom:8px}
.done p{color:var(--dim);font-size:14px;margin-bottom:16px}
.done button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
</style>

      <h1>C233 Employment Law OA Drill</h1>
      <div class="sub">125 fresh questions, 9 topics, mastered twice each</div>

      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="seenArc" cx="22" cy="22" r="19" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="seenVal">0%</span>Seen</div>

<script>
const MCQS=[
["Which 1935 statute created the NLRB and first guaranteed private-sector employees the right to organize?", ["National Labor Relations Act", "Labor Management Relations Act", "Norris-LaGuardia Anti-Injunction Act", "Railway Labor Act of 1926"], 0, "Wagner Act 1935 = NLRA. Created the NLRB, Section 7 rights. Taft-Hartley (LMRA) 1947, Landrum-Griffin (LMRDA) 1959.", "Labor Relations"],
["The Taft-Hartley Act of 1947 is formally known by which name?", ["Labor Management Relations Act", "Labor Management Reporting and Disclosure Act", "National Labor Relations Act of 1935", "Federal Labor Standards Act"], 0, "Taft-Hartley = LMRA 1947: union ULPs, banned closed shop, allowed right-to-work laws. Landrum-Griffin = LMRDA 1959.", "Labor Relations"],
["Which act requires secret-ballot union officer elections and gives members a bill of rights inside their union?", ["Landrum-Griffin Act of 1959", "Taft-Hartley Act of 1947", "Wagner Act of 1935", "Norris-LaGuardia Act of 1932"], 0, "Landrum-Griffin (LMRDA 1959) = union democracy: officer elections, member bill of rights, financial reporting to DOL.", "Labor Relations"],
["Under the LMRDA, how often must a local union hold elections for its officers?", ["Every 3 years", "Every 5 years", "Every 2 years", "Every 4 years"], 0, "LMRDA: locals every 3 years, intermediate bodies every 4, national/international every 5.", "Labor Relations"],
["A union and employer bargained in good faith to a genuine deadlock on wages. Which response is lawful?", ["The employer locks out the whole bargaining unit", "The employer imposes terms it never offered at the table", "The union pickets the employer's largest customer", "The NLRB writes and imposes the final contract terms"], 0, "At impasse the employer may lock out or implement its last offer, the union may strike. Secondary picketing is a union ULP. NLRB never imposes terms.", "Labor Relations"],
["Which federal body helps parties break a bargaining deadlock rather than ruling on it?", ["Federal Mediation and Conciliation Service", "National Labor Relations Board regional office", "Office of Labor-Management Standards at DOL", "Federal Labor Relations Authority panel"], 0, "FMCS mediates. NLRB handles elections and ULP charges. OLMS enforces LMRDA reporting. FLRA covers federal employees.", "Labor Relations"],
["What showing of interest is needed before the NLRB will order a representation election?", ["30 percent of the unit", "50 percent plus one", "10 percent of the unit", "Majority of eligible voters"], 0, "30% signed authorization cards triggers an election. Winning requires a majority of votes cast.", "Labor Relations"],
["Which arrangement was outlawed by the Taft-Hartley Act?", ["Closed shop", "Union shop", "Agency shop", "Open shop"], 0, "Closed shop (member before hire) is illegal. Union shop (join after hire) and agency shop (pay fees) are legal outside right-to-work states.", "Labor Relations"],
["A state right-to-work law prohibits which of the following?", ["Requiring union fees as a condition of employment", "Employees forming a union without employer consent", "Employers refusing to recognize a certified union", "Unions striking during the term of a valid contract"], 0, "Right-to-work (Taft-Hartley 14(b)) bans union security clauses, so nobody can be forced to join or pay.", "Labor Relations"],
["Which topic is a mandatory subject of collective bargaining?", ["Overtime pay rates for the unit", "Benefits for already-retired workers", "Internal union election procedures", "The company's product pricing strategy"], 0, "Mandatory = wages, hours, terms and conditions. Retiree benefits and union internal affairs are permissive. Product decisions are management rights.", "Labor Relations"],
["Which employer behavior during bargaining most clearly violates the duty to bargain in good faith?", ["Refusing to meet the union at reasonable times", "Declining to accept any union wage proposal", "Insisting on a two-year rather than three-year term", "Presenting a final offer before the contract expires"], 0, "Good faith is about conduct (meet, exchange proposals, consider them), not outcomes. No duty to agree or concede.", "Labor Relations"],
["Employees strike over wages after the contract expires. What may the employer do about their jobs?", ["Hire permanent replacements", "Discharge them for misconduct", "Refuse ever to rehire them", "Revoke their NLRA rights"], 0, "Economic strikers can be permanently replaced but keep preferential recall rights. ULP strikers must be reinstated.", "Labor Relations"],
["Employees walk out because the employer fired the union organizer. What is their status?", ["ULP strikers entitled to reinstatement", "Economic strikers subject to permanent replacement", "Wildcat strikers with no NLRA protection at all", "Sympathy strikers in an unlawful secondary action"], 0, "A strike caused by an employer ULP makes them ULP strikers, who must be reinstated even if replacements were hired.", "Labor Relations"],
["A nonunion employee is disciplined for discussing her pay with coworkers. Which law did the employer most likely violate?", ["National Labor Relations Act", "Equal Pay Act of 1963", "Fair Labor Standards Act", "Sarbanes-Oxley Act of 2002"], 0, "Section 7 protected concerted activity covers nonunion workplaces too. Pay discussion among coworkers is the classic example.", "Labor Relations"],
["Which employer conduct during a union campaign is lawful under NLRA Section 8(c)?", ["Stating that unions have caused strikes elsewhere", "Asking each employee how they intend to vote", "Promising a raise if the union loses the election", "Photographing employees at union meetings"], 0, "TIPS are illegal: Threaten, Interrogate, Promise, Spy. Employers may share facts and opinions without threats or promises.", "Labor Relations"],
["A union employee is called into an interview she reasonably believes could lead to discipline. What may she request?", ["A union representative present", "A 30-day postponement", "An NLRB agent in the room", "Written charges beforehand"], 0, "Weingarten rights: union employee may have a rep at an investigatory interview that could lead to discipline.", "Labor Relations"],
["Which act barred federal courts from enjoining most peaceful strikes and outlawed yellow-dog contracts?", ["Norris-LaGuardia Act", "Wagner Act of 1935", "Taft-Hartley Act of 1947", "Landrum-Griffin Act"], 0, "Norris-LaGuardia 1932 came before the Wagner Act and limited judicial interference with labor disputes.", "Labor Relations"],
["A union pressures a neutral supplier to stop doing business with the struck employer. What is this?", ["Illegal secondary boycott", "Protected sympathy strike", "Lawful area standards picket", "Permissive recognitional picket"], 0, "Secondary boycotts targeting neutral third parties are union unfair labor practices under Taft-Hartley.", "Labor Relations"],
["The NLRB certified a union 8 months ago. Employees now want it out. What blocks a decertification petition?", ["The one-year certification bar", "The three-year contract bar rule", "The union's duty of fair representation", "The employer's neutrality agreement"], 0, "Certification bar: no election for 12 months after certification. Contract bar: a valid CBA blocks elections up to 3 years.", "Labor Relations"],
["A union refuses to file a grievance for an employee who never joined. What has the union likely breached?", ["Duty of fair representation", "Duty to bargain in good faith", "The contract bar doctrine", "LMRDA financial reporting duty"], 0, "The exclusive representative must fairly represent everyone in the unit, members or not.", "Labor Relations"],
["Which industries fall under the Railway Labor Act rather than the NLRA?", ["Railroads and airlines", "Trucking and shipping", "Utilities and hospitals", "Federal agencies and USPS"], 0, "RLA 1926 covers rail and air carriers with its own mediation board. Federal employees fall under the FSLMRS.", "Labor Relations"],
["Which of the following is a union unfair labor practice added by Taft-Hartley?", ["Refusing to bargain with the employer", "Refusing to admit certain workers as members", "Charging dues above 2 percent of wages", "Endorsing a candidate for public office"], 0, "Union ULPs: refusing to bargain, coercing employees, secondary boycotts, featherbedding, excessive initiation fees.", "Labor Relations"],
["A president may seek an 80-day injunction against a strike that imperils national health or safety under which law?", ["Taft-Hartley Act of 1947", "Wagner Act of 1935", "Landrum-Griffin Act of 1959", "Norris-LaGuardia Act of 1932"], 0, "Taft-Hartley national emergency provision: 80-day cooling-off injunction.", "Labor Relations"],
["A federal contractor with a $60,000 contract and 55 employees historically had to maintain what under EO 11246?", ["A written affirmative action plan", "A minority hiring quota per department", "A union-neutrality agreement on file", "A signed collective bargaining agreement"], 0, "EO 11246: contractors with $50,000+ contracts and 50+ employees needed a written AAP with utilization analysis and goals, enforced by OFCCP.", "Affirmative Action"],
["Which agency enforced affirmative action obligations for federal contractors?", ["Office of Federal Contract Compliance Programs", "Equal Employment Opportunity Commission", "National Labor Relations Board general counsel", "Office of Labor-Management Standards at DOL"], 0, "OFCCP (inside DOL) audits contractor AAPs. EEOC handles Title VII charges against all employers.", "Affirmative Action"],
["Which feature makes a voluntary affirmative action plan lawful under Title VII?", ["It is temporary and remedies a manifest imbalance", "It sets a fixed number of minority hires each year", "It excludes majority applicants from consideration", "It stays in force permanently until parity is reached"], 0, "Weber/Johnson: remedy a manifest imbalance, do not unnecessarily trammel majority rights, temporary. Quotas and exclusions fail.", "Affirmative Action"],
["What distinguishes a placement goal in an AAP from an unlawful quota?", ["A goal is a flexible target, a quota reserves slots", "A goal is enforced by OFCCP, a quota by the EEOC", "A goal covers hiring, a quota covers promotions", "A goal applies to race, a quota applies to sex"], 0, "Goals are good-faith targets based on availability. Quotas set aside slots by group and are illegal (Bakke).", "Affirmative Action"],
["Which AAP component compares the workforce to the availability of qualified women and minorities?", ["Utilization analysis", "Adverse impact ratio", "Job group audit", "Placement goal review"], 0, "Utilization analysis = incumbency vs availability per job group. Underutilization triggers placement goals.", "Affirmative Action"],
["A white applicant claims a hiring program favored minorities. Which law gives him a cause of action?", ["Title VII of the Civil Rights Act", "Executive Order 11246 of 1965", "Section 503 of the Rehabilitation Act", "Equal Pay Act of 1963"], 0, "Title VII protects every race, so reverse discrimination claims are viable. EO 11246 gave no private right of action.", "Affirmative Action"],
["Section 503 of the Rehabilitation Act imposes affirmative action duties on federal contractors for which group?", ["Individuals with disabilities", "Protected veterans of any era", "Women and racial minorities", "Workers age 40 and older"], 0, "Section 503 = disability. VEVRAA = veterans. EO 11246 = race, sex, etc.", "Affirmative Action"],
["An employer adopts a strict English-only rule for all hours including breaks. What is the likely EEOC view?", ["Presumed national origin discrimination", "Lawful as a uniform workplace conduct rule", "Lawful if posted 30 days in advance", "Lawful because language is not protected"], 0, "Blanket English-only rules at all times are presumptively unlawful. Rules limited to specific times with a business necessity can be justified.", "Race & National Origin"],
["When may an employer lawfully reject an applicant because of a foreign accent?", ["When it materially interferes with the job", "When customers say they prefer native speakers", "When the position involves any phone contact", "When the applicant was born outside the U.S."], 0, "Accent is tied to national origin. Only a real, material interference with essential communication justifies the decision.", "Race & National Origin"],
["A dark-skinned employee claims a lighter-skinned supervisor of the same race denied her a promotion. Which claim fits?", ["Color discrimination", "National origin discrimination", "Reverse race discrimination", "Associational discrimination"], 0, "Color is a separate protected class. Intra-race discrimination based on skin tone is actionable.", "Race & National Origin"],
["Within how many business days of hire must an employer complete Section 2 of Form I-9?", ["3 business days", "10 business days", "1 business day", "30 business days"], 0, "IRCA: employee completes Section 1 by day one, employer completes Section 2 within 3 business days.", "Race & National Origin"],
["IRCA's ban on citizenship-status discrimination applies to employers with how many employees?", ["4 or more", "15 or more", "20 or more", "50 or more"], 0, "IRCA citizenship discrimination: 4+ employees. Title VII national origin: 15+. This gap is what IRCA fills.", "Race & National Origin"],
["Which statute allows a race discrimination claim with no employer size minimum and no damage cap?", ["Section 1981 of the Civil Rights Act of 1866", "Title VII of the Civil Rights Act of 1964", "Section 503 of the Rehabilitation Act of 1973", "Section 102 of the Civil Rights Act of 1991"], 0, "Section 1981 covers race in contracts, any employer size, uncapped damages, 4-year limitations period.", "Race & National Origin"],
["A no-beard policy screens out many Black men with a skin condition aggravated by shaving. Which theory applies?", ["Disparate impact", "Disparate treatment", "Pattern or practice", "Mixed motive"], 0, "A neutral policy with disproportionate effect on a protected class = disparate impact. Employer must show business necessity.", "Race & National Origin"],
["Harassment of an employee perceived as Middle Eastern, who is actually South Asian, is actionable because:", ["Perceived national origin is protected", "Only actual national origin counts", "Religion is inferred from appearance", "Color was the real motive"], 0, "EEOC treats discrimination based on perceived national origin the same as actual.", "Race & National Origin"],
["Under McDonnell Douglas, what must the employer do after the plaintiff establishes a prima facie case?", ["Articulate a legitimate nondiscriminatory reason", "Prove by a preponderance that it acted in good faith", "Show the plaintiff was unqualified for the position", "Demonstrate a bona fide occupational qualification"], 0, "Prima facie → employer articulates legitimate reason (burden of production) → plaintiff proves pretext.", "Discrimination Theory"],
["Under the four-fifths rule, a protected group's selection rate shows adverse impact when it is:", ["Below 80 percent of the top group's rate", "Below 50 percent of the top group's rate", "More than 20 percent below the applicant pool", "Statistically significant at the 0.05 level"], 0, "Four-fifths rule: minority rate / majority rate below 0.80 flags adverse impact.", "Discrimination Theory"],
["Which protected class can never serve as a bona fide occupational qualification?", ["Race", "Sex", "Religion", "Age"], 0, "BFOQ is available for sex, religion, national origin, and age. Never race or color.", "Discrimination Theory"],
["In a mixed-motive case where the employer proves it would have made the same decision anyway, what happens?", ["Liability stands but damages and reinstatement are barred", "The claim is dismissed with prejudice and fees awarded", "Full compensatory and back pay damages are awarded", "Punitive damages are doubled under the 1991 Act"], 0, "1991 CRA: motivating factor = liability. Same-decision defense limits remedy to declaratory relief and attorney fees.", "Discrimination Theory"],
["Title VII, the ADA, and GINA all cover employers with at least how many employees?", ["15", "20", "50", "100"], 0, "15 = Title VII, ADA, GINA. 20 = ADEA, COBRA. 50 = FMLA. 100 = WARN.", "Discrimination Theory"],
["The ADEA applies to employers with at least how many employees?", ["20", "15", "50", "25"], 0, "ADEA = 20 employees, same as COBRA. Title VII and ADA = 15.", "Discrimination Theory"],
["A charge must be filed with the EEOC within how many days of the act in a non-deferral state?", ["180 days", "300 days", "90 days", "365 days"], 0, "180 days, extended to 300 in states with their own FEP agency. After a right-to-sue letter, 90 days to file in court.", "Discrimination Theory"],
["After receiving a right-to-sue letter from the EEOC, how long does the plaintiff have to file in court?", ["90 days", "180 days", "300 days", "30 days"], 0, "90 days from receipt of the right-to-sue notice.", "Discrimination Theory"],
["Under the Civil Rights Act of 1991, what is the compensatory and punitive damages cap for an employer with 600 employees?", ["$300,000", "$200,000", "$100,000", "$500,000"], 0, "Caps: 15-100 = $50k, 101-200 = $100k, 201-500 = $200k, 501+ = $300k. Back pay is not capped.", "Discrimination Theory"],
["Who is protected by the Age Discrimination in Employment Act?", ["Workers age 40 and older", "Workers age 50 and older", "Workers of any age at all", "Workers age 65 and older"], 0, "ADEA: 40+. Favoring older workers over younger ones within the protected class is not a violation (General Dynamics v. Cline).", "Discrimination Theory"],
["Under the OWBPA, an individual employee must be given how long to consider an ADEA waiver?", ["21 days to consider, 7 to revoke", "45 days to consider, 7 to revoke", "14 days to consider, 3 to revoke", "30 days to consider, 10 to revoke"], 0, "Individual: 21 days. Group termination: 45 days. Both get 7 days to revoke and must be advised to consult an attorney.", "Discrimination Theory"],
["Which Equal Pay Act defense allows different pay for equal work?", ["A bona fide merit system", "Market rate differences by gender", "The employee's prior salary alone", "Documented customer preference"], 0, "EPA defenses: seniority, merit, quantity or quality of production, any factor other than sex.", "Discrimination Theory"],
["The Pregnancy Discrimination Act requires employers to treat pregnancy the same as:", ["Other temporary disabilities", "Permanent ADA disabilities", "Accrued paid vacation leave", "Workers' compensation injuries"], 0, "PDA amended Title VII: pregnant workers get whatever other temporarily disabled workers get.", "Discrimination Theory"],
["Under Bostock v. Clayton County, discrimination based on sexual orientation or gender identity is:", ["Sex discrimination under Title VII", "Covered only by state and local law", "A form of disability discrimination", "Actionable only under Section 1981"], 0, "Bostock 2020: firing someone for being gay or transgender is discrimination because of sex.", "Discrimination Theory"],
["The Lilly Ledbetter Fair Pay Act changed the filing deadline for pay discrimination so the clock resets:", ["With each discriminatory paycheck", "Only when the pay decision is made", "When the employee first suspects bias", "At the close of each fiscal year"], 0, "Each paycheck is a new act. Overruled the Ledbetter v. Goodyear timing rule.", "Discrimination Theory"],
["Which practice most reduces the risk of a disparate impact claim from a pre-employment test?", ["Validating the test against job performance", "Administering it only to the final candidates", "Scoring it on a curve within each racial group", "Waiving it for any applicant who objects"], 0, "Validation shows business necessity. Race-norming scores is illegal under the 1991 CRA.", "Discrimination Theory"],
["A manager conditions a promotion on a subordinate going on a date with him. What type of harassment is this?", ["Quid pro quo", "Hostile work environment", "Third-party harassment", "Constructive discharge"], 0, "Quid pro quo = job benefit tied to sexual demand. Hostile environment = severe or pervasive conduct altering conditions.", "Harassment & Retaliation"],
["To be actionable, hostile environment harassment must be unwelcome and:", ["Severe or pervasive", "Both severe and pervasive", "Sexual in nature", "Reported in writing"], 0, "Severe OR pervasive, judged from a reasonable person's view. Need not be sexual, any protected class works.", "Harassment & Retaliation"],
["A supervisor fires an employee who refused his advances. What is the employer's liability?", ["Strict liability, no affirmative defense", "Liable only if it knew or should have known", "Liable only after a second complaint", "Not liable if it has a written policy"], 0, "Supervisor harassment with a tangible employment action = strict liability. Faragher/Ellerth defense is unavailable.", "Harassment & Retaliation"],
["Supervisor harassment produced no tangible action. The employer avoids liability by showing reasonable care and:", ["The employee unreasonably skipped complaint procedures", "The supervisor was terminated within 30 days of notice", "The employee suffered no lost wages or benefits", "The conduct happened entirely off company premises"], 0, "Faragher/Ellerth two-part defense: reasonable care to prevent and correct, plus employee unreasonably failed to complain.", "Harassment & Retaliation"],
["When is an employer liable for harassment by a coworker or customer?", ["When it knew or should have known and did nothing", "Whenever a coworker acts, under respondeat superior", "Only when the harasser is on the company payroll", "Only when the victim resigns in protest"], 0, "Coworker and third-party harassment use a negligence standard. Notice plus failure to remedy = liability.", "Harassment & Retaliation"],
["Under Vance v. Ball State, who counts as a supervisor for harassment liability?", ["One empowered to take tangible employment actions", "Anyone who directs the employee's daily assignments", "Anyone with a higher pay grade or job title", "Anyone the employee reports to informally"], 0, "Supervisor = authority to hire, fire, promote, demote, reassign. Lead workers without that power are coworkers.", "Harassment & Retaliation"],
["Which action counts as protected participation activity under Title VII's anti-retaliation clause?", ["Testifying in a coworker's EEOC investigation", "Refusing a lawful mandatory overtime assignment", "Complaining about a rude but unbiased manager", "Discussing pay rates with a coworker at lunch"], 0, "Participation = involvement in an EEOC or court proceeding. Opposition = objecting to believed discrimination.", "Harassment & Retaliation"],
["Under Burlington Northern v. White, a retaliatory action is unlawful if it would:", ["Dissuade a reasonable worker from complaining", "Reduce the employee's base pay or hours", "Result in termination, demotion, or transfer", "Violate a provision of the employee handbook"], 0, "Materially adverse = might deter a reasonable person from making a charge. Broader than ultimate employment actions.", "Harassment & Retaliation"],
["An employee resigns because harassment became intolerable. Which theory treats the resignation as a firing?", ["Constructive discharge", "Wrongful termination", "Promissory estoppel", "Tortious interference"], 0, "Constructive discharge: conditions so intolerable a reasonable person would quit. Treated as an adverse action.", "Harassment & Retaliation"],
["Which element is required for a retaliation claim?", ["A causal link between protected activity and adverse action", "Proof that the underlying discrimination actually occurred", "A prior written complaint to HR or the EEOC on file", "Membership in a class protected by Title VII"], 0, "Retaliation stands alone: protected activity, materially adverse action, causal connection. The original complaint need only be in good faith.", "Harassment & Retaliation"],
["Under the ADA as amended, a disability is an impairment that:", ["Substantially limits a major life activity", "Prevents performing any job in the economy", "Is permanent and medically documented", "Qualifies for Social Security benefits"], 0, "Three prongs: actual impairment substantially limiting a major life activity, record of such, or regarded as. ADAAA broadened it.", "ADA / FMLA / Leave"],
["When assessing whether an impairment is substantially limiting, the ADAAA requires ignoring:", ["Mitigating measures except ordinary eyeglasses", "The employee's age, education, and training", "Whether the condition is episodic or in remission", "The essential functions of the position"], 0, "ADAAA: assess without regard to medication, prosthetics, etc. Only ordinary glasses and contacts are considered.", "ADA / FMLA / Leave"],
["An applicant discloses a disability and asks for help. What must the employer do next?", ["Engage in an interactive process", "Refer the applicant to the EEOC", "Require a fitness-for-duty exam", "Document it and wait 30 days"], 0, "Interactive process: good-faith dialogue to identify a reasonable accommodation. Refusing to engage is itself evidence of violation.", "ADA / FMLA / Leave"],
["Under the ADA, undue hardship means an accommodation would impose:", ["Significant difficulty or expense", "Any cost above the employee's salary", "More than a de minimis cost burden", "Any change to a written job description"], 0, "ADA undue hardship = significant difficulty or expense, judged against the employer's size and resources.", "ADA / FMLA / Leave"],
["At which stage may an employer require a medical exam of all entering employees in a job category?", ["After a conditional offer of employment", "Before the first screening interview", "During initial application review", "Only after 90 days on the job"], 0, "Pre-offer: no medical inquiries. Post-offer: exams allowed if required of all entrants. On the job: job-related and consistent with business necessity.", "ADA / FMLA / Leave"],
["An employer refuses to hire an epileptic applicant for a crane job citing safety. Which ADA defense is this?", ["Direct threat", "Undue hardship", "Business necessity", "Bona fide occupational qualification"], 0, "Direct threat: significant risk of substantial harm that can't be reduced by accommodation, based on individualized medical judgment.", "ADA / FMLA / Leave"],
["Which individual is protected under the ADA?", ["A recovering alcoholic in treatment", "A current user of illegal drugs", "An employee with a minor cut", "A person with a temporary cold"], 0, "Alcoholism is a covered impairment (though employers can enforce conduct rules). Current illegal drug use is excluded.", "ADA / FMLA / Leave"],

const LS_KEY='c233oadrill_v1';
let state={};
try{state=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){state={}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function st(i){if(!state[i])state[i]={c:0,hist:[]};return state[i]}

let topic='';
let queue=[],cur=-1,curOpts=[],waiting=false;

function pool(){return MCQS.map((m,i)=>i).filter(i=>!topic||MCQS[i][4]===topic)}
function buildQueue(){
  queue=pool().filter(i=>st(i).c<2);
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}
}
function shuffleOpts(m){
  const o=m[1].map((t,oi)=>({t,oi}));
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  return o;
}
function uniqueWords(correct,others){
  const otherSet=new Set(others.join(' ').toLowerCase().match(/[a-z0-9$%.,']+/g)||[]);
  return correct.split(' ').map(w=>{
    const k=w.toLowerCase();
    return (k.length>2&&!otherSet.has(k))?'<b>'+w+'</b>':w;
  }).join(' ');
}
function rings(){
  const p=pool();
  const seen=p.filter(i=>st(i).hist.length>0).length/(p.length||1);
  const apt=p.reduce((a,i)=>a+Math.min(st(i).c,2)/2,0)/(p.length||1);
  document.getElementById('seenArc').style.strokeDashoffset=119.4*(1-seen);
  document.getElementById('aptArc').style.strokeDashoffset=119.4*(1-apt);
  document.getElementById('seenVal').textContent=Math.round(seen*100)+'%';
  document.getElementById('aptVal').textContent=Math.round(apt*100)+'%';
}
function render(){
  rings();
  const stage=document.getElementById('stage');
  if(!queue.length){
    stage.innerHTML='<div class="done"><h2>Set mastered.</h2><p>Every question in this filter answered correctly twice in a row. Book the OA.</p><button id="againBtn">Study again</button></div>';
    document.getElementById('againBtn').onclick=()=>{pool().forEach(i=>{delete state[i]});save();buildQueue();render()};
    return;
  }
  cur=queue[0];
  const m=MCQS[cur];
  curOpts=shuffleOpts(m);
  const mastered=pool().filter(i=>st(i).c>=2).length;
  stage.innerHTML='<div class="card"><div class="qtopic">'+m[4]+'</div><div class="qtext">'+m[0]+'</div>'+
    curOpts.map((o,d)=>'<button class="ans" data-disp="'+d+'"><span class="ltr">'+'ABCD'[d]+'</span><span class="txt">'+o.t+'</span></button>').join('')+
    '<div class="explain" id="explain"></div>'+
    '<div class="meta"><span>'+mastered+' / '+pool().length+' mastered</span><span>streak: '+st(cur).c+'/2</span></div></div>';
  document.querySelectorAll('#opts .ans, .ans').forEach(b=>b.onclick=()=>answer(+b.dataset.disp));
}
function answer(disp){
  if(waiting)return;
  const m=MCQS[cur],p=st(cur);
  const picked=curOpts[disp],correctDisp=curOpts.findIndex(x=>x.oi===m[2]);
  const ok=picked.oi===m[2];
  p.hist.push(ok?1:0);
  document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.ans');
  if(ok){
    p.c+=1;
    btns[disp].classList.add('correct');
    btns[disp].querySelector('.txt').innerHTML=uniqueWords(picked.t,m[1].filter((_,i)=>i!==m[2]));
    queue.shift();
    if(p.c<2)queue.splice(Math.min(10,queue.length),0,cur);
    save();
    waiting=true;
    setTimeout(()=>{waiting=false;render()},420);
  }else{
    p.c=0;
    btns[disp].classList.add('wrong');
    btns[correctDisp].classList.add('reveal');
    btns[correctDisp].querySelector('.txt').innerHTML=uniqueWords(m[1][m[2]],m[1].filter((_,i)=>i!==m[2]));
    const ex=document.getElementById('explain');
    ex.style.display='block';
    ex.innerHTML=m[3]+'<span class="cont">tap anywhere or press space to continue</span>';
    queue.shift();
    queue.splice(Math.min(3,queue.length),0,cur);
    save();
    waiting=true;
  }
  rings();
}
function next(){if(!waiting)return;waiting=false;render()}
document.addEventListener('keydown',e=>{
  if(waiting&&(e.key===' '||e.key==='Enter')){e.preventDefault();next();return}
  if(waiting)return;
  const k=e.key.toUpperCase();
  const i='1234'.indexOf(e.key)>-1?'1234'.indexOf(e.key):'ABCD'.indexOf(k);
  if(i>-1&&i<curOpts.length)answer(i);
});
document.addEventListener('click',e=>{if(waiting&&!e.target.closest('.ans'))next()});
const sel=document.getElementById('topicSel');
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)});
sel.onchange=()=>{topic=sel.value;buildQueue();render()};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Wipe all drill progress?')){state={};save();buildQueue();render()}};
buildQueue();render();
</script>
