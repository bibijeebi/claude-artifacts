<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisconsin Stay — Itinerary</title>
<meta name="theme-color" content="#f3efe6">
<meta property="og:title" content="Wisconsin Stay — Living Itinerary">
<meta property="og:description" content="Everything going on from Jun 12 through the stay: Scouts, fishing, WGU exams, Toy Story 5, the Jul 2 surgery and recovery, plus the loose stuff.">
<meta property="og:url" content="https://niggerfaggot.club/wisconsin-itinerary">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe6; --card:#fffdf8; --line:#e7e0d1; --line2:#d9d0bd;
    --ink:#23271f; --mut:#6f695c; --faint:#9b9384;
    --ever:#2f6b4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding:24px 16px 60px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:29px;letter-spacing:-.012em;line-height:1.05;color:var(--ink)}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:15px;color:var(--mut);margin-top:5px}
  .updated{font-size:11.5px;color:var(--faint);margin-top:7px;letter-spacing:.01em}
  .rule{height:3px;background:var(--ever);width:48px;margin:15px 0 20px;border-radius:3px}
  .legend{display:flex;flex-wrap:wrap;gap:9px 16px;font-size:11.5px;color:var(--mut);margin-bottom:20px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .ld{width:9px;height:9px;border-radius:50%;display:inline-block}
  .anchors{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 2px rgba(40,34,20,.03)}
  .anchors .hd{font-size:11px;letter-spacing:.07em;color:var(--ever);text-transform:uppercase;font-weight:600;margin-bottom:10px}
  .arow{display:flex;gap:9px;align-items:flex-start;margin:8px 0}
  .arow .tx{font-size:13.5px;line-height:1.5}
  .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:6px}
  .plabel{font-family:'Fraunces',serif;font-weight:500;font-size:15px;color:var(--ever);margin:24px 0 3px}
  .day{display:flex;gap:14px;padding:11px 8px;border-top:1px solid var(--line)}
  .day .date{flex:0 0 52px;font-size:11.5px;color:var(--mut);line-height:1.35;font-variant-numeric:tabular-nums}
  .day .date b{display:block;color:var(--ink);font-weight:600;font-size:13px}
  .day .body{flex:1;min-width:0}
  .it{display:flex;gap:9px;align-items:flex-start;margin:3px 0}
  .it .tx{font-size:14px;line-height:1.45}
  .open{font-size:13px;color:var(--faint);font-style:italic;margin:3px 0}
  .day.past{opacity:.46}
  .day.today{background:rgba(47,107,79,.07);border-radius:10px;border-top:1px solid transparent;box-shadow:inset 3px 0 0 var(--ever)}
  .tag{display:inline-block;font-size:9.5px;color:#fffdf8;background:var(--ever);padding:1px 6px;border-radius:4px;margin-top:5px;letter-spacing:.04em;font-weight:500}
  .loose{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
  .loose .hd{font-size:11px;letter-spacing:.07em;color:var(--mut);text-transform:uppercase;font-weight:600;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12px;padding:5px 11px;border-radius:8px;line-height:1.3;font-weight:500}
  .foot{margin-top:32px;font-size:11px;color:var(--faint);text-align:center;font-style:italic;font-family:'Fraunces',serif}
  b.em{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Wisconsin Stay</h1>
  <div class="sub">Milwaukee area &middot; surgery July 2</div>
  <div class="updated" id="updated"></div>
  <div class="rule"></div>

  <div class="legend">
    <span><i class="ld" style="background:#c2583a"></i>Surgery / pre-op</span>
    <span><i class="ld" style="background:#3f7d54"></i>Scouts / outdoor / fishing</span>
    <span><i class="ld" style="background:#6d5a9c"></i>Leisure / travel / projects</span>
    <span><i class="ld" style="background:#b07d1e"></i>WGU</span>
    <span><i class="ld" style="background:#3f6c9c"></i>Bekah school</span>
    <span><i class="ld" style="background:#b23b32"></i>Conflict</span>
  </div>

  <div class="anchors" id="anchors"></div>
  <div id="agenda"></div>

  <div class="loose">
    <div class="hd">Loose, anytime this stay</div>
    <div class="chips" id="loose"></div>
  </div>

  <div class="foot">Living doc &middot; tell Claude what changed and it re-pushes here</div>
</div>

<script>
const UPDATED = "Jun 16, 2026";

const PAL = {
  coral: {dot:'#c2583a', fg:'#9c4329', bg:'#f4e3da'},
  teal:  {dot:'#3f7d54', fg:'#2f6b4f', bg:'#e1ecdf'},
  purple:{dot:'#6d5a9c', fg:'#564485', bg:'#e8e2f0'},
  blue:  {dot:'#3f6c9c', fg:'#345a85', bg:'#dde7f1'},
  amber: {dot:'#b07d1e', fg:'#8a6114', bg:'#f1e7cf'},
  red:   {dot:'#b23b32', fg:'#8f2d26', bg:'#f4ddd9'},
};

const ANCHORS = [
  ["Surgery Jul 2, vas reversal at Froedtert. Bekah drives + 24h care. Chain: reta done \u2713 \u00b7 NSAIDs/vit E/supps stop Jun 25 \u00b7 nurse calls ~Jun 30 \u00b7 clear liquids Jul 1 9pm.","coral"],
  ["Book Bekah's flight, arriving late Jun 29 or Jun 30.","purple"],
  ["Open: UP Scout canoe trip dates (~Jun 26\u201328?), the only thing that collides with surgery week. Confirm before committing.","red"],
];

const PHASES = [
  {label:"So far \u00b7 Jun 12\u201315", days:[
    {dow:"Thu",date:"Jun 12",iso:"2026-06-12",items:[["Last reta dose (3mg) \u2713","coral"]]},
    {dow:"Sat",date:"Jun 13",iso:"2026-06-13",items:[["Flew into Milwaukee","purple"]]},
    {dow:"Sun",date:"Jun 14",iso:"2026-06-14",items:[["Fished Green Lake, small bluegill, windy/weedy","teal"],["Scouts sailing practice","teal"],["Obsession rewatch w/ Laurel, Bro Ben, Sue","purple"]]},
    {dow:"Mon",date:"Jun 15",iso:"2026-06-15",items:[["VA consult, attended \u2713","coral"],["Port Washington, Cleo spoons, skunked","teal"],["4-mile walkabout","purple"]]},
  ]},
  {label:"This week \u00b7 Jun 16\u201321", days:[
    {dow:"Tue",date:"Jun 16",iso:"2026-06-16",items:[["Grab USB webcam, for WGU proctored exams","amber"]]},
    {dow:"Wed",date:"Jun 17",iso:"2026-06-17",items:[["WGU proctored exam","amber"]]},
    {dow:"Thu",date:"Jun 18",iso:"2026-06-18",items:[["WGU proctored exam","amber"],["Pickleball w/ Brother Ben","purple"]]},
    {dow:"Fri",date:"Jun 19",iso:"2026-06-19",items:[["Scouts camping starts, you join Saturday","teal"]]},
    {dow:"Sat",date:"Jun 20",iso:"2026-06-20",items:[["Morning: working the YMCA run, Racine","teal"],["Scope Gordon's restaurant supply, next door","purple"],["Campground, your reservation (Sat night)","teal"]]},
    {dow:"Sun",date:"Jun 21",iso:"2026-06-21",items:[["Toy Story 5, UltraScreen at Marcus Mequon","purple"],["Watch Toy Story 1\u20134 first (Laurel needs #4)","purple"],["Campground (Sun)","teal"]]},
  ]},
  {label:"Next week \u00b7 Jun 22\u201328", days:[
    {dow:"Mon",date:"Jun 22",iso:"2026-06-22",items:[["Bekah: CJC-111 w/ Binns, AM (NC)","blue"]]},
    {dow:"Tue",date:"Jun 23",iso:"2026-06-23",open:true,items:[]},
    {dow:"Wed",date:"Jun 24",iso:"2026-06-24",open:true,items:[]},
    {dow:"Thu",date:"Jun 25",iso:"2026-06-25",items:[["Pre-op: stop NSAIDs / vitamin E / supplements (reta already done 6/12)","coral"]]},
    {dow:"Fri",date:"Jun 26",iso:"2026-06-26",items:[["UP Scout trip? canoe + camp, Upper Peninsula, confirm dates","red"]]},
    {dow:"Sat",date:"Jun 27",iso:"2026-06-27",items:[["UP Scout trip?","red"]]},
    {dow:"Sun",date:"Jun 28",iso:"2026-06-28",items:[["UP Scout trip?","red"]]},
  ]},
  {label:"Surgery week \u00b7 Jun 29 \u2013 Jul 4", days:[
    {dow:"Mon",date:"Jun 29",iso:"2026-06-29",items:[["Bekah flies up (late), book the ticket","purple"],["Bekah: CJC-111 AM in NC before her flight","blue"]]},
    {dow:"Tue",date:"Jun 30",iso:"2026-06-30",items:[["Bekah arrives (if not the 29th)","purple"],["Surgery nurse calls with arrival time","coral"]]},
    {dow:"Wed",date:"Jul 1",iso:"2026-07-01",items:[["Nurse call window","coral"],["Clear liquids only after 9pm","coral"]]},
    {dow:"Thu",date:"Jul 2",iso:"2026-07-02",items:[["<b class='em'>Surgery, vas reversal at Froedtert.</b> Bekah drives + 24h caregiver","coral"]]},
    {dow:"Fri",date:"Jul 3",iso:"2026-07-03",items:[["Post-op day 1","coral"]]},
    {dow:"Sat",date:"Jul 4",iso:"2026-07-04",items:[["Fourth of July thing, D+2 post-op, sit and ice","purple"]]},
  ]},
  {label:"Recovery \u00b7 Jul 5\u201311", days:[
    {dow:"",date:"Jul 5\u201311",iso:["2026-07-05","2026-07-11"],items:[["Recovery week","coral"],["Once healed (~Jul 7+): Packers/Lambeau tour + House on the Rock loop w/ Bekah","purple"]]},
  ]},
];

const LOOSE = [
  ["Fishing","teal"],
  ["Filet lesson w/ Clifford Sr, if you land a keeper","teal"],
  ["Funeral pyre + church fence/brush work","teal"],
  ["A&W meal","purple"],
  ["Packers / Lambeau tour, Bekah","purple"],
  ["House on the Rock loop: Cave of the Mounds + Taliesin + Gov Dodge fishing","purple"],
  ["Shark lighthouse, did it print for Clifford?","purple"],
  ["Laurel security install, Amazon, you install","purple"],
];

function centralToday(){
  const n = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'}));
  return new Date(n.getFullYear(),n.getMonth(),n.getDate());
}
function stateFor(iso){
  const t = centralToday();
  let s,e;
  if(Array.isArray(iso)){s=new Date(iso[0]+'T00:00');e=new Date(iso[1]+'T00:00');}
  else {s=new Date(iso+'T00:00');e=s;}
  if(e<t) return 'past';
  if(s<=t && t<=e) return 'today';
  return '';
}
const dotEl = c => `<span class="dot" style="background:${PAL[c].dot}"></span>`;

document.getElementById('updated').textContent = 'Last updated ' + UPDATED;

document.getElementById('anchors').innerHTML =
  `<div class="hd">Anchors &amp; open decisions</div>` +
  ANCHORS.map(([t,c])=>`<div class="arow">${dotEl(c)}<div class="tx">${t}</div></div>`).join('');

document.getElementById('agenda').innerHTML = PHASES.map(p=>{
  const rows = p.days.map(d=>{
    const st = stateFor(d.iso);
    const cls = 'day' + (st==='past'?' past':st==='today'?' today':'');
    const body = d.open
      ? `<div class="open">open</div>`
      : d.items.map(([t,c])=>`<div class="it">${dotEl(c)}<div class="tx">${t}</div></div>`).join('');
    const tag = st==='today' ? `<span class="tag">today</span>` : '';
    return `<div class="${cls}"><div class="date">${d.dow}<b>${d.date}</b>${tag}</div><div class="body">${body}</div></div>`;
  }).join('');
  return `<div class="plabel">${p.label}</div>${rows}`;
}).join('');

document.getElementById('loose').innerHTML = LOOSE.map(([t,c])=>
  `<span class="chip" style="background:${PAL[c].bg};color:${PAL[c].fg}">${t}</span>`
).join('');
</script>
</body>
</html>
