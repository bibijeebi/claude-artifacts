<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#1a2733;--mut:#6b7a88;--line:#d5dde3;
--teal:#159fc9;--green:#43a047;--red:#e23b3b;--accent:#159fc9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.rings{display:flex;gap:14px}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}
.ring .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.ring .lab small{font-weight:600;font-size:9px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.htext h1{margin:0;font-size:19px}.htext p{margin:2px 0 0;color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0 16px;flex-wrap:wrap}
select,.btn{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.count{color:var(--mut);font-size:13px;margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.topic{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.stem{font-size:18px;font-weight:600;margin-bottom:16px;line-height:1.4}
.multi-hint{font-size:12px;color:var(--mut);font-weight:500;margin-left:6px}
.ans{display:block;width:100%;text-align:left;padding:13px 15px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;line-height:1.4;transition:.12s}
.ans:hover{border-color:var(--accent);background:#f5fafc}
.ans .ltr{display:inline-block;width:22px;font-weight:700;color:var(--mut)}
.ans.sel{border-color:var(--teal);background:#eaf7fc}
.ans.right{border-color:var(--green);background:#eef8ef}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.right .ltr{color:var(--green)}.ans.wrong .ltr{color:var(--red)}
.ans b{color:var(--green)}
.submit{margin-top:6px;padding:11px 18px;background:var(--teal);color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;display:none}
.submit.show{display:inline-block}
.expl{margin-top:14px;padding:13px 15px;background:#f0f4f7;border-left:3px solid var(--teal);border-radius:6px;font-size:14px;color:#2a3947;display:none}
.expl.show{display:block}
.cont{margin-top:12px;color:var(--mut);font-size:13px;display:none}.cont.show{display:block}
.done{text-align:center;padding:40px 20px}.done h2{color:var(--green);font-size:26px}
.foot{margin-top:18px;font-size:12px;color:var(--mut);text-align:center}
.foot a{color:var(--teal);cursor:pointer;text-decoration:none}
</style></head><body><div class="wrap">

<script>
const MCQS=[{"stem": "What does the \"V\" in HVAC stand for?", "opts": ["Ventilation", "Velocity", "Vapor", "Volume"], "correct": [0], "multi": false, "expl": "This is correct! \"V\" in HVAC stands for Ventilation, which involves moving and refreshing indoor air.", "topic": "Why HVAC Systems Matter"}, {"stem": "Why is ductwork important in HVAC systems?", "opts": ["It powers the fan motor", "It cools the coils faster", "It distributes air throughout the building", "It stores warm air for later use"], "correct": [2], "multi": false, "expl": "This is incorrect! Ductwork is used to distribute air, not to power fans or store warm air.", "topic": "Why HVAC Systems Matter"}, {"stem": "Which part of the HVAC system is responsible for heating air using a flame?", "opts": ["Compressor", "Evaporator coil", "Furnace", "Thermostat"], "correct": [2], "multi": false, "expl": "This is incorrect! Furnaces heat air using heat exchangers which are warmed by a flame .", "topic": "Why HVAC Systems Matter"}, {"stem": "In cooling mode, what happens to the heat from indoor air?", "opts": ["It is trapped in the ducts", "It is absorbed by the blower fan", "It is absorbed by the evaporator coil", "It is carried outside through the windows"], "correct": [2], "multi": false, "expl": "This is incorrect! The heat from indoor air is absorbed by the evaporator coil.", "topic": "Why HVAC Systems Matter"}, {"stem": "What is the function of the reversing valve in a heat pump?", "opts": ["Increases the blower fan speed", "Heats the return air duct", "Reverses the direction of refrigerant flow to switch between heating and cooling", "Controls the compressor"], "correct": [2], "multi": false, "expl": "This is incorrect! The reversing valve does not control the compressor or fan speed. Its job is to reroute (reverse) refrigerant flow so the system can switch between heating and cooling.", "topic": "Why HVAC Systems Matter"}, {"stem": "What part of an HVAC system cools the air by absorbing heat from it?", "opts": ["Blower fan", "Evaporator coil", "Condenser coil", "Heat exchanger"], "correct": [1], "multi": false, "expl": "This is incorrect! The evaporator coil, not the other components, is responsible for cooling the air.", "topic": "Why HVAC Systems Matter"}, {"stem": "What happens when the desired room temperature is reached?", "opts": ["The system reverses cycle automatically", "The thermostat turns the system off", "The fan keeps running while heating continues", "The return duct stops functioning"], "correct": [1], "multi": false, "expl": "This is incorrect! The thermostat stops the system once the desired temperature is achieved.", "topic": "Why HVAC Systems Matter"}, {"stem": "Which of the following are ways HVAC systems heat a space? (Select all that apply)", "opts": ["Using a furnace with a heat exchanger", "Using a heat pump that draws heat from outside", "Cooling air through the evaporator coil", "Blower fan generating heat"], "correct": [0, 1], "multi": true, "expl": "This is incorrect! Only furnaces and heat pumps provide heat; cooling coils and fans don’t heat air.", "topic": "Why HVAC Systems Matter"}, {"stem": "What kind of system can both heat and cool a building by reversing the flow of refrigerant?", "opts": ["Heat pump", "Condenser", "Blower motor", "Furnace"], "correct": [0], "multi": false, "expl": "This is correct! A heat pump can both heat and cool a space by reversing the refrigerant flow.", "topic": "Why HVAC Systems Matter"}, {"stem": "Why might the letter \"R\" sometimes be added to HVAC?", "opts": ["To indicate remote operation", "To include Refrigeration", "To represent Radiator coils", "To refer to Radiant heating"], "correct": [1], "multi": false, "expl": "This is incorrect! The \"R\" represents Refrigeration, not the other options.", "topic": "Why HVAC Systems Matter"}, {"stem": "What is the primary function of refrigerant in an HVAC system?", "opts": ["To lubricate the compressor", "To move heat from one place to another", "To clean air filters", "To reduce humidity"], "correct": [1], "multi": false, "expl": "This is incorrect! The main job of refrigerant is to transfer heat, not perform mechanical or air quality functions.", "topic": "Introduction to Refrigerant"}, {"stem": "Which best describes the refrigerant’s state as it exits the condenser?", "opts": ["Low-pressure vapor", "High-pressure vapor", "High-pressure liquid", "Low-pressure liquid"], "correct": [2], "multi": false, "expl": "This is incorrect! The refrigerant leaves the condenser as a high-pressure liquid, not a vapor.", "topic": "Introduction to Refrigerant"}, {"stem": "What is the result when refrigerant passes through the evaporator?", "opts": ["It turns into a liquid", "It releases heat to the room", "It absorbs heat and evaporates", "It increases in pressure"], "correct": [2], "multi": false, "expl": "This is incorrect! The evaporator’s job is to absorb heat, causing the refrigerant to evaporate.", "topic": "Introduction to Refrigerant"}, {"stem": "What is saturation temperature?", "opts": ["The temperature at which refrigerant becomes solid", "The maximum safe temperature for the compressor", "The temperature at which refrigerant begins to evaporate", "The same as room temperature"], "correct": [2], "multi": false, "expl": "This is incorrect! Saturation temperature is when refrigerant begins to evaporate, not become solid or match room temperature.", "topic": "Introduction to Refrigerant"}, {"stem": "Which of the following best describes what refrigerant does during the cooling process?", "opts": ["It freezes the air inside", "It moves heat from inside to outside", "It releases cold air from the condenser", "It evaporates in the condenser"], "correct": [1], "multi": false, "expl": "This is incorrect! Refrigerant does not freeze air or release cold air, and it evaporates in the evaporator—not the condenser.", "topic": "Introduction to Refrigerant"}, {"stem": "What are the effects of compressing refrigerant in the HVAC system?(Select all that apply)", "opts": ["Its pressure increases", "It turns into a low-temperature liquid", "Its temperature increases", "It cools the refrigerant"], "correct": [0, 2], "multi": true, "expl": "This is incorrect! Compression increases the pressure and temperature of refrigerant, setting it up for heat release.", "topic": "Introduction to Refrigerant"}, {"stem": "Which component causes a pressure drop in the refrigerant cycle?", "opts": ["Compressor", "Condenser", "Metering device", "Evaporator"], "correct": [2], "multi": false, "expl": "This is incorrect! The metering device, not the others, causes the pressure drop by restricting flow.", "topic": "Introduction to Refrigerant"}, {"stem": "How does the metering device affect the refrigerant before it enters the evaporator?", "opts": ["It raises the refrigerant's temperature", "It increases its pressure", "It lowers the refrigerant's pressure and temperature", "It adds moisture to the refrigerant"], "correct": [2], "multi": false, "expl": "This is incorrect! The metering device lowers pressure and temperature—it does not increase them.", "topic": "Introduction to Refrigerant"}, {"stem": "Which of the following are properties that make refrigerant ideal for HVAC systems?(Select all that apply)", "opts": ["Low boiling point", "Easily changes temperature with pressure changes", "Non-toxic and edible", "Corrosive behavior at low temperatures"], "correct": [0, 1], "multi": true, "expl": "This is incorrect! Only options A and B describe essential refrigerant properties for HVAC systems.", "topic": "Introduction to Refrigerant"}, {"stem": "What happens to refrigerant when it is compressed in the HVAC cycle?", "opts": ["It becomes a high-pressure, high-temperature vapor", "It turns into a solid", "It cools rapidly", "It turns into water"], "correct": [0], "multi": false, "expl": "This is correct! Compression increases the pressure and temperature of refrigerant, turning it into a high-temperature vapor.", "topic": "Introduction to Refrigerant"}, {"stem": "Why does warm air blow during cooling mode if refrigerant isn’t cold enough?", "opts": ["Heat flows from cold to hot", "Pressure is too high in the evaporator", "Heat cannot flow into refrigerant that’s too warm", "The compressor is too strong"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C: Heat won’t move into refrigerant if it’s not colder than the indoor air.", "topic": "The Science of HVAC"}, {"stem": "When refrigerant exits the evaporator during the cooling (refrigeration) cycle, what condition is it typically in?", "opts": ["High pressure, high temperature", "Low pressure, cold", "Medium pressure, hot", "High pressure, cold"], "correct": [1], "multi": false, "expl": "Incorrect. Refrigerant leaving the evaporator in the cooling cycle is cold and under low pressure.", "topic": "The Science of HVAC"}, {"stem": "What law explains why heat moves from warm areas to cool areas?", "opts": ["First Law of Thermodynamics", "Law of Conservation of Energy", "Second Law of Thermodynamics", "Gay-Lussac Law"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C: the Second Law of Thermodynamics describe heat flow from hot to cold.", "topic": "The Science of HVAC"}, {"stem": "What is the function of the compressor in the refrigeration cycle?", "opts": ["Absorbs heat from the room", "Increases refrigerant pressure and temperature", "Releases refrigerant pressure", "Cools the refrigerant rapidly"], "correct": [1], "multi": false, "expl": "This is incorrect! The correct answer is B: the compressor increases pressure and temperature of the refrigerant.", "topic": "The Science of HVAC"}, {"stem": "In cooling mode, why does heat move into the refrigerant inside the evaporator coil?", "opts": ["The refrigerant is warmer than indoor air", "The refrigerant is colder than indoor air", "The refrigerant is under high pressure", "Heat doesn’t move during cooling"], "correct": [1], "multi": false, "expl": "This is incorrect! The correct answer is B. The colder refrigerant absorbs heat from warmer indoor air.", "topic": "The Science of HVAC"}, {"stem": "Which of the following devices are involved in changing the refrigerant's pressure in an HVAC system?", "opts": ["Compressor", "Condenser", "Metering Device", "Evaporator"], "correct": [0, 2], "multi": true, "expl": "This is incorrect! Only A and C affect pressure. The condenser and evaporator handle heat exchange, not pressure control.", "topic": "The Science of HVAC"}, {"stem": "Which statement best summarizes how HVAC systems work?", "opts": ["They cool air by creating cold", "They transfer heat using pressure and temperature changes", "They remove all moisture from the air", "They blow air over ice to create cooling"], "correct": [1], "multi": false, "expl": "This is incorrect! The correct answer is B: HVAC systems use pressure and temperature changes to transfer heat.", "topic": "The Science of HVAC"}, {"stem": "Which component reduces the pressure of refrigerant in an HVAC system?", "opts": ["Condenser", "Compressor", "Metering Device", "Blower Motor"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C. The metering device reduces refrigerant pressure.", "topic": "The Science of HVAC"}, {"stem": "What is the primary reason an ice cube feels cold when you hold it?", "opts": ["The cold transfers into your hand", "Heat transfers into the ice", "Your hand creates cold", "Cold radiates from the cube"], "correct": [1], "multi": false, "expl": "This is incorrect! The correct answer is B: heat moves from your warm hand into the colder ice cube.", "topic": "The Science of HVAC"}, {"stem": "If a system shows frost on the evaporator, what principle helps explain why?", "opts": ["The evaporator is too hot", "Refrigerant is under too much pressure", "Too much heat is entering the refrigerant", "Temperature has dropped too low due to pressure drop"], "correct": [3], "multi": false, "expl": "This is incorrect! The correct answer is D. Pressure drop lowers temperature, potentially causing freezing.", "topic": "The Science of HVAC"}, {"stem": "What phase is the refrigerant in after leaving the evaporator?", "opts": ["High-pressure liquid", "High-pressure vapor", "Low-pressure vapor", "Low-pressure liquid"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C. It becomes a low-pressure vapor after absorbing heat.", "topic": "The Refrigeration Cycle"}, {"stem": "Which changes occur to the refrigerant in the evaporator?(Select all that apply)", "opts": ["Pressure increases", "Temperature decreases", "Heat is absorbed", "Refrigerant changes to vapor"], "correct": [2, 3], "multi": true, "expl": "This is incorrect! The correct answers are C and D. The refrigerant absorbs heat and changes into vapor.", "topic": "The Refrigeration Cycle"}, {"stem": "What happens to refrigerant as it passes through the evaporator?", "opts": ["It condenses into a liquid", "It absorbs heat and evaporates", "It becomes a solid", "It turns into high-pressure gas"], "correct": [1], "multi": false, "expl": "This is incorrect! The correct answer is B. Refrigerant absorbs heat and evaporates into a vapor.", "topic": "The Refrigeration Cycle"}, {"stem": "What is the primary job of an air conditioner or refrigerator?", "opts": ["Blow cold air into a space", "Move cold from outside to inside", "Remove heat from a space", "Produce ice to cool the room"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C. HVAC systems work by removing heat, not by producing cold air directly.", "topic": "The Refrigeration Cycle"}, {"stem": "What causes the refrigerant to become very cold after the metering device?", "opts": ["It mixes with outdoor air", "It is sprayed with water", "Its pressure drops", "It passes through the compressor"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C. The pressure drop causes the refrigerant to cool.", "topic": "The Refrigeration Cycle"}, {"stem": "What physical change happens to refrigerant in the condenser?", "opts": ["It turns from vapor to liquid", "It turns from liquid to vapor", "It becomes a solid", "It separates into gas and oil"], "correct": [0], "multi": false, "expl": "This is correct! As the refrigerant loses heat in the condenser, it condenses into a liquid.", "topic": "The Refrigeration Cycle"}, {"stem": "Which part of the refrigeration cycle increases refrigerant pressure and temperature?", "opts": ["Evaporator", "Metering Device", "Compressor", "Condenser"], "correct": [2], "multi": false, "expl": "This is incorrect! The correct answer is C. The compressor increases both pressure and temperature.", "topic": "The Refrigeration Cycle"}, {"stem": "The metering device raises the pressure of the refrigerant before it enters the evaporator.", "opts": ["True", "False"], "correct": [1], "multi": false, "expl": "Correct! This is False. The metering device actually reduces the pressure, making the refrigerant colder.", "topic": "The Refrigeration Cycle"}, {"stem": "What causes the refrigerant to release heat in the condenser?", "opts": ["The refrigerant is colder than the outside air", "It is under low pressure", "A fan inside the evaporator cools it", "The outdoor air is cooler, so heat flows out of the refrigerant"], "correct": [3], "multi": false, "expl": "This is incorrect! The correct answer is D. Heat flows from the hotter refrigerant to cooler outdoor air.", "topic": "The Refrigeration Cycle"}, {"stem": "What best explains why the evaporator cools indoor air?", "opts": ["It mixes cold refrigerant with indoor air", "The cold refrigerant absorbs heat from the air", "It sprays mist to lower air temperature", "It adds humidity to reduce warmth"], "correct": [1], "multi": false, "expl": "This is incorrect! The correct answer is B. Cold refrigerant in the evaporator pulls heat from the indoor air.", "topic": "The Refrigeration Cycle"}, {"stem": "What is required to calculate BTUs in HVAC systems?", "opts": ["Voltage and resistance", "Pressure and volume", "Weight and temperature change", "Length and mass"], "correct": [2], "multi": false, "expl": "This is incorrect! BTU calculation relies on weight and temperature change, not other variables.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "What is heat best defined as in the context of HVAC?", "opts": ["A type of light energy", "A form of electricity", "A form of energy", "A byproduct of motion"], "correct": [2], "multi": false, "expl": "This is incorrect! Heat is specifically a form of energy, not light, electricity, or just a byproduct.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "When refrigerant changes from vapor to liquid, what occurs?", "opts": ["Latent heat is absorbed.", "Sensible heat is lost.", "Latent heat is released.", "Sensible heat is absorbed."], "correct": [2], "multi": false, "expl": "This is incorrect! Condensation releases latent heat, not absorbs it.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "What does a higher pressure in an HVAC system cause regarding phase change temperature?", "opts": ["It decreases the phase change temperature.", "It keeps the phase change temperature the same.", "It increases the phase change temperature.", "It eliminates the phase change process."], "correct": [2], "multi": false, "expl": "This is incorrect! Higher pressure raises the phase change temperature, not lowers it.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "If a furnace heats air from 60°F to 85°F without changing moisture content, what kind of heat is involved?", "opts": ["Latent heat only", "Sensible heat only", "Both sensible and latent heat", "Neither sensible nor latent heat"], "correct": [1], "multi": false, "expl": "This is incorrect! The absence of phase change means latent heat is not involved.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "Which of the following is true about sensible heat?", "opts": ["It can be measured with a thermometer.", "It has no effect on temperature.", "It causes a change in state.", "It’s used when refrigerant vaporizes."], "correct": [0], "multi": false, "expl": "This is correct! Sensible heat is measurable with a thermometer.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "Which of the following is a unit used to measure heat in HVAC?", "opts": ["Kilowatt-hour (kWh)", "Newton (N)", "Joule (J)", "British Thermal Unit (BTU)"], "correct": [3], "multi": false, "expl": "This is incorrect! While Joules are also units of energy, BTUs are the standard in HVAC.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "Latent heat is the energy responsible for:", "opts": ["Heating air in a furnace", "Raising the temperature of a room", "Changing water vapor to liquid", "Measuring heat using a thermometer"], "correct": [2], "multi": false, "expl": "This is incorrect! Latent heat is responsible for phase changes, not temperature increases.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "If 4 pounds of water is heated from 30°F to 50°F, how many BTUs are used?", "opts": ["20 BTUs", "80 BTUs", "120 BTUs", "40 BTUs"], "correct": [1], "multi": false, "expl": "This is incorrect! Recalculate using the formula BTU = weight × change in temperature.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "Which example best demonstrates sensible heat?", "opts": ["Ice melting into water", "Water boiling into steam", "Air warming from 15°C to 25°C", "Steam condensing into water"], "correct": [2], "multi": false, "expl": "This is incorrect! Sensible heat involves temperature change without a phase change.", "topic": "Sensible and Latent Heat Explained"}, {"stem": "What is the general direction of heat flow in all environments?", "opts": ["From cold to hot", "From dark to light", "From hot to cold", "From low pressure to high pressure"], "correct": [2], "multi": false, "expl": "This is incorrect! Heat naturally flows from hot to cold, not in reverse.", "topic": "Basics of Heat Transfer"}, {"stem": "Which situation best illustrates convection at work?", "opts": ["Touching a hot railing", "Warm air rising and leaving through vents", "Heat from a radiator warming your skin", "Heat moving through window glass"], "correct": [1], "multi": false, "expl": "This is incorrect! Convection requires fluid movement, like air or water—not solid contact or radiation.", "topic": "Basics of Heat Transfer"}, {"stem": "What type of heat transfer occurs when you feel warmth from the sun on your skin without touching anything?", "opts": ["Conduction", "Convection", "Radiation", "Diffusion"], "correct": [2], "multi": false, "expl": "This is incorrect! Radiation is the only method that doesn't require matter—unlike conduction or convection.", "topic": "Basics of Heat Transfer"}, {"stem": "Which of the following best describes conduction as a mode of heat transfer?", "opts": ["Heat transfer through electromagnetic waves", "Heat transfer through the movement of fluids", "Heat transfer through direct contact between molecules", "Heat transfer through air currents"], "correct": [2], "multi": false, "expl": "This is incorrect! Conduction is not about fluids or waves—it requires direct molecular contact.", "topic": "Basics of Heat Transfer"}, {"stem": "In what way does insulation help reduce heat transfer inside buildings?", "opts": ["It reflects UV radiation", "It slows down conduction through materials", "It filters warm air out", "It absorbs all incoming heat"], "correct": [1], "multi": false, "expl": "This is incorrect! Insulation primarily reduces conduction, not radiation or air filtering.", "topic": "Basics of Heat Transfer"}, {"stem": "Radiation requires a medium (like air or water) to transfer heat.", "opts": ["True", "False"], "correct": [1], "multi": false, "expl": "This is correct! Radiation can travel through empty space, such as sunlight reaching Earth through a vacuum.", "topic": "Basics of Heat Transfer"}, {"stem": "Why does convection occur when you open a door on a cold day?", "opts": ["Heat is pulled into the room by magnets", "Cold air is lighter than warm air", "Warm air escapes and cooler air moves in", "Radiation causes air to flow"], "correct": [2], "multi": false, "expl": "This is incorrect! Convection explains this process—not magnetism or radiation.", "topic": "Basics of Heat Transfer"}, {"stem": "Why can you feel heat from a fireplace even if you're sitting far away from it?", "opts": ["Because of air movement", "Due to convection currents", "Heat is conducted through the air", "Heat radiates through invisible waves"], "correct": [3], "multi": false, "expl": "This is incorrect! Radiation is responsible for heat transfer without direct contact or airflow.", "topic": "Basics of Heat Transfer"}, {"stem": "How does conduction affect temperature inside a building during summer?", "opts": ["It blocks outdoor air entirely", "It reflects sunlight", "Heat from the roof travels into rooms", "The building generates internal cold air"], "correct": [2], "multi": false, "expl": "This is incorrect! Conduction transfers external heat into the structure—it doesn’t block or reflect it.", "topic": "Basics of Heat Transfer"}, {"stem": "Radiation requires air or direct contact in order to transfer heat.", "opts": ["True", "False"], "correct": [1], "multi": false, "expl": "This is correct! Radiation does not require air or contact; it transfers heat through electromagnetic waves.", "topic": "Basics of Heat Transfer"}, {"stem": "When measuring with a ruler marked in 1/8-inch increments, how many lines are there in one inch?", "opts": ["4", "8", "12", "16"], "correct": [1], "multi": false, "expl": "This is incorrect! A ruler divided into 1/8-inch increments has 8 parts per inch.", "topic": "Measurements and Units"}, {"stem": "What tool would you MOST likely use to measure the length of a duct that stretches across a room?", "opts": ["Ruler", "Tape Measure", "Yardstick", "Caliper"], "correct": [1], "multi": false, "expl": "This is incorrect! A tape measure is better suited for long, flexible measurements than the other tools listed.", "topic": "Measurements and Units"}, {"stem": "What happens if HVAC equipment is installed without accurate measurements?", "opts": ["The system may operate silently", "The equipment may become too efficient", "Wasted materials or incorrect fit", "It will still work perfectly"], "correct": [2], "multi": false, "expl": "This is incorrect! Poor measurements can cause fit issues, wasted material, and unhappy clients—not better performance.", "topic": "Measurements and Units"}, {"stem": "Which of the following best explains why accurate area calculations are critical in HVAC?", "opts": ["They help lower building cost", "They help determine where equipment fits", "They reduce labor time", "They improve ventilation system aesthetics"], "correct": [1], "multi": false, "expl": "This is incorrect! Accurate area measurements are used to match systems with space needs, not just to reduce labor.", "topic": "Measurements and Units"}, {"stem": "How many square feet is a floor that is 6 feet long and 4 feet wide?", "opts": ["10 square feet", "20 square feet", "24 square feet", "12 square feet"], "correct": [2], "multi": false, "expl": "This is incorrect! Area is calculated by multiplying length and width, so 6 × 4 = 24 square feet.", "topic": "Measurements and Units"}, {"stem": "What is the main purpose of using a ruler in HVAC measurements?", "opts": ["To draw straight lines", "To estimate sizes", "To read temperature", "To measure short lengths accurately"], "correct": [3], "multi": false, "expl": "This is incorrect! The primary purpose of rulers in HVAC is to measure short lengths precisely, not for drawing.", "topic": "Measurements and Units"}, {"stem": "Measuring length accurately is only important for large components in HVAC.", "opts": ["True", "False"], "correct": [1], "multi": false, "expl": "This is correct! Even small components require precise measurements in HVAC.", "topic": "Measurements and Units"}, {"stem": "Why is it important to measure room volume when sizing an HVAC system?", "opts": ["To reduce noise", "To calculate airflow requirements", "To lower equipment cost", "To improve duct appearance"], "correct": [1], "multi": false, "expl": "This is incorrect! Measuring volume helps ensure the system moves the right amount of air, not for aesthetic purposes.", "topic": "Measurements and Units"}, {"stem": "If a room is 12 feet long and 10 feet wide, what is the area?", "opts": ["120 square feet", "22 square feet", "100 square feet", "110 square feet"], "correct": [0], "multi": false, "expl": "This is correct! Area = Length × Width = 12 × 10 = 120 square feet.", "topic": "Measurements and Units"}, {"stem": "Which of the following tools can be used to measure length? (Select all that apply)", "opts": ["A. Ruler", "B. Caliper", "C. Tape Measure", "D. Thermometer"], "correct": [0, 1, 2], "multi": true, "expl": "This is incorrect! Thermometers measure temperature, not length; the other tools are used for measuring length.", "topic": "Measurements and Units"}, {"stem": "Why must an adjustable wrench be tightly adjusted to the fastener before use?", "opts": ["To save battery power", "To prevent slipping and rounding off the fastener", "To make it lighter", "To increase turning speed"], "correct": [1], "multi": false, "expl": "This is incorrect! An improperly adjusted wrench can slip and damage the fastener.", "topic": "General Tools"}, {"stem": "What feature makes the adjustable wrench versatile?", "opts": ["It is battery-operated", "It can hammer and twist", "It has adjustable jaws to fit various sizes", "It fits into hex sockets"], "correct": [2], "multi": false, "expl": "This is incorrect! The key feature of an adjustable wrench is its movable jaw that fits different fasteners.", "topic": "General Tools"}, {"stem": "When should you use a nut driver instead of a screwdriver?", "opts": ["When removing stripped screws", "When working on nails", "When tightening hex-head fasteners", "When loosening Phillips screws"], "correct": [2], "multi": false, "expl": "This is incorrect! Nut drivers are used for hex-head fasteners, not regular screws or nails.", "topic": "General Tools"}, {"stem": "What should you always do before using a cordless drill on a screw?", "opts": ["Tap it with a hammer first", "Use an open-ended wrench", "Match the driver head to the fastener", "Change the battery after each use"], "correct": [2], "multi": false, "expl": "This is incorrect! Using the wrong driver head can damage the screw. Always match the driver head to the fastener.", "topic": "General Tools"}, {"stem": "Which type of wrench allows you to turn a fastener without removing the tool from the nut?", "opts": ["Open-ended wrench", "Box-end wrench", "Ratchet-type box wrench", "Adjustable wrench"], "correct": [2], "multi": false, "expl": "This is incorrect! Only ratchet-type box wrenches have the mechanism to allow continuous turning without removal.", "topic": "General Tools"}, {"stem": "Which of the following are safety practices when using a cordless drill? (Select all that apply)", "opts": ["Keep hands away from the rotating bit", "Push the drill hard into the material", "Wear safety glasses", "Use the correct direction (forward or reverse)"], "correct": [0, 2, 3], "multi": true, "expl": "This is incorrect! While some options are valid, pushing the drill hard is unsafe.", "topic": "General Tools"}, {"stem": "Box-end wrenches are more likely to slip off a fastener than open-ended wrenches.", "opts": ["True", "False"], "correct": [1], "multi": false, "expl": "This is correct! Box-end wrenches surround the fastener completely, making them less likely to slip.", "topic": "General Tools"}, {"stem": "Which of these tools is designed for installing or removing screws quickly?", "opts": ["Nut driver", "Cordless drill", "Box-end wrench", "Hex key"], "correct": [1], "multi": false, "expl": "This is incorrect! While other tools may work, only the cordless drill is designed for quick screw removal and installation.", "topic": "General Tools"}, {"stem": "What is one benefit of carrying a cordless drill on the job?", "opts": ["It works as a torque wrench", "It keeps fasteners cool", "It reduces manual effort in installing/removing screws", "It replaces the need for safety glasses"], "correct": [2], "multi": false, "expl": "This is incorrect! The main advantage of a cordless drill is that it helps speed up screw-related tasks with less manual effort.", "topic": "General Tools"}, {"stem": "Which tool is best for quick carpentry tasks and nail removal in HVAC jobs?", "opts": ["Nut driver", "Cordless drill", "Hex key", "Claw hammer"], "correct": [3], "multi": false, "expl": "This is incorrect! The correct tool for carpentry and nail removal is a claw hammer.", "topic": "General Tools"}, {"stem": "What is the main difference between spring benders and lever benders?", "opts": ["One is used for cutting, the other for bending", "Spring benders are more accurate", "Lever benders provide greater control and precision", "Spring benders are motorized"], "correct": [2], "multi": false, "expl": "This is incorrect! Lever benders are known for their control and accuracy; spring benders are simpler and less precise.", "topic": "Installation Tools"}, {"stem": "What happens if you don't use a deburring tool after cutting tubing?", "opts": ["The cut tubing may bend", "Electrical wires may not connect", "Fittings may leak or get damaged", "Sheet metal may tear"], "correct": [2], "multi": false, "expl": "This is incorrect! Without deburring, sharp edges inside the tube can damage fittings or lead to leaks in the system.", "topic": "Installation Tools"}, {"stem": "When should a swaging tool be used instead of a flaring tool?", "opts": ["When joining tubing with flare fittings", "When creating a mechanical grip", "When creating a pressure-tight seal without fittings", "When cutting soft copper tubing"], "correct": [2], "multi": false, "expl": "This is incorrect! Swaging is used to stretch tubing for a direct, pressure-tight connection—unlike flaring, which needs a fitting.", "topic": "Installation Tools"}, {"stem": "Which tubing type is the thickest and most durable?", "opts": ["Type M", "Type L", "Type K", "Type S"], "correct": [2], "multi": false, "expl": "This is incorrect! Type K tubing is thicker and more durable than Types L and M, and best for high-pressure systems.", "topic": "Installation Tools"}, {"stem": "What are pump pliers primarily used for in HVAC installations?", "opts": ["Cutting wire", "Turning and gripping pipes", "Stripping insulation", "Cutting sheet metal"], "correct": [1], "multi": false, "expl": "This is incorrect! Pump pliers are not used for cutting wire or sheet metal; their main use is gripping and turning pipes or fittings in HVAC installations.", "topic": "Installation Tools"}, {"stem": "Which color of aviation snips is primarily used for straight cuts in sheet metal?", "opts": ["Green", "Yellow", "Blue", "Black"], "correct": [1], "multi": false, "expl": "This is incorrect! Yellow aviation snips are primarily used for straight cuts in sheet metal.", "topic": "Installation Tools"}, {"stem": "Which tool is used to form a 45° conical flare on soft copper tubing so it can seal with a flare nut and flare fitting?", "opts": ["Swaging (bell/socket) tool", "Deburring tool", "Flaring tool", "Tubing cutter"], "correct": [2], "multi": false, "expl": "This is incorrect! A swaging (bell) tool makes a socket/bell end to join tubing (usually for brazing), not a conical flare for a flare nut/fitting. The correct answer is Flaring tool.", "topic": "Installation Tools"}, {"stem": "Wire strippers are designed to cut through copper tubing.", "opts": ["True", "False"], "correct": [1], "multi": false, "expl": "This is correct! Wire strippers are used to remove insulation from wires, not to cut copper tubing.", "topic": "Installation Tools"}, {"stem": "Which of the following are used to cut materials in HVAC installation?(Select all that apply)", "opts": ["Torque wrench", "Aviation snips", "Tubing cutters", "Swaging tool"], "correct": [1, 2], "multi": true, "expl": "This is incorrect! Only aviation snips and tubing cutters are used for cutting materials; wire strippers and swaging tools serve different purposes.", "topic": "Installation Tools"}, {"stem": "Which of the following tools are commonly used to shape or join copper tubing in HVAC systems?(Select all that apply)", "opts": ["Tubing cutter", "Flaring tool", "Swaging tool", "Linesman pliers"], "correct": [1, 2], "multi": true, "expl": "This is incorrect! Linesman pliers are not used for shaping or joining tubing—only the cutter, flaring, and swaging tools are.", "topic": "Installation Tools"}, {"stem": "What is the main reason safety is critical in HVAC work?", "opts": ["It keeps equipment from breaking", "It helps avoid paperwork", "It ensures technicians and others are protected from harm", "It speeds up installation time"], "correct": [2], "multi": false, "expl": "This is incorrect! While other options may be important, the core reason is to protect yourself and others.", "topic": "General Safety"}, {"stem": "What is one way HVAC technicians help prevent fire hazards?", "opts": ["Store flammable materials in open areas", "Work quickly to reduce spark time", "Keep work areas clean and follow fire safety rules", "Use water on any small fire"], "correct": [2], "multi": false, "expl": "This is incorrect! Fire prevention relies on clean work areas and following safety protocols, not speed or improper extinguishing.", "topic": "General Safety"}, {"stem": "Which extinguisher should be used on a fire caused by paper or wood?", "opts": ["CO₂", "Foam", "Water", "Dry powder"], "correct": [2], "multi": false, "expl": "This is incorrect! Water is the safest and most effective method for extinguishing Class A fires.", "topic": "General Safety"}, {"stem": "What is the proper extinguisher for a Class C fire?", "opts": ["Water", "Foam", "CO₂ (Carbon Dioxide)", "Baking soda"], "correct": [2], "multi": false, "expl": "This is incorrect! The safe choice for electrical fires is a carbon dioxide extinguisher.", "topic": "General Safety"}, {"stem": "Which of the following are correct ladder safety practices?", "opts": ["Use fiberglass ladders for electrical work", "Place the ladder on soft or uneven ground", "Avoid leaning too far to the side", "Stand only on the top step"], "correct": [0, 2], "multi": true, "expl": "This is incorrect! Only options A and C reflect correct ladder safety; the others are unsafe.", "topic": "General Safety"}, {"stem": "Which class of fire involves flammable liquids like oil or paint?", "opts": ["Class A", "Class B", "Class C", "Class D"], "correct": [1], "multi": false, "expl": "This is incorrect! Class B, not the other classes, involves flammable liquids such as oil and fuel.", "topic": "General Safety"}, {"stem": "What should a technician do when working with a chemical for the first time?", "opts": ["Smell it to see if it’s strong", "Ignore safety instructions unless something spills", "Read the Material Safety Data Sheet (MSDS)", "Test a small amount on your skin"], "correct": [2], "multi": false, "expl": "This is incorrect! Always consult the MSDS for proper handling and emergency procedures.", "topic": "General Safety"}, {"stem": "Why is Personal Protective Equipment (PPE) important on the job?", "opts": ["It makes you look more professional", "It protects you from jobsite hazards", "It helps you work faster", "It prevents tool theft"], "correct": [1], "multi": false, "expl": "This is incorrect! PPE is essential for protecting your health and safety while working.", "topic": "General Safety"}, {"stem": "Why is using a metal ladder for electrical work dangerous?", "opts": ["It’s heavier to carry", "It blocks visibility", "It can conduct electricity and cause shocks", "It can’t reach high places"], "correct": [2], "multi": false, "expl": "This is incorrect! Metal ladders conduct electricity, posing a serious risk of electric shock.", "topic": "General Safety"}, {"stem": "What is one way to prevent slip and fall injuries on the job site?", "opts": ["Wear sandals to keep feet cool", "Work only on flat surfaces", "Keep walkways clean and dry", "Always walk quickly"], "correct": [2], "multi": false, "expl": "This is incorrect! Keeping walkways clean and dry is key to fall prevention.", "topic": "General Safety"}, {"stem": "What causes an arc flash to occur?", "opts": ["Using a tool with a plastic handle", "Opening a disconnect properly", "Electricity jumping through air due to a short", "Turning off a breaker too quickly"], "correct": [2], "multi": false, "expl": "This is incorrect! Arc flashes are dangerous electrical explosions caused by short circuits or accidental contact.", "topic": "Electrical Safety"}, {"stem": "A hot wire carries electrical current and can cause a shock if touched.", "opts": ["True", "False"], "correct": [0], "multi": false, "expl": "This is incorrect! Hot wires are live and can deliver a serious shock.", "topic": "Electrical Safety"}, {"stem": "What is the first step before performing work on an HVAC electrical system.", "opts": ["Verify the power is off with a meter", "Turn off the power to the equipment", "Check for frayed wires", "Replace damaged wiring"], "correct": [1], "multi": false, "expl": "Incorrect. The first step before working on an HVAC electrical system is to turn off power to the equipment. Other safety steps, such as verifying power is off, inspecting wiring, or using appropriate PPE, should be perf", "topic": "Electrical Safety"}, {"stem": "Which of the following voltages can still be dangerous to the human body?", "opts": ["5 volts", "12 volts", "50 volts", "1 volt"], "correct": [2], "multi": false, "expl": "This is incorrect! Even relatively low voltage like 50V can harm or kill, especially under the right conditions.", "topic": "Electrical Safety"}, {"stem": "Which of the following are part of the Lockout/Tagout procedure?", "opts": ["Notify others", "Replace all fuses", "Apply your own padlock", "Tag the equipment"], "correct": [0, 2, 3], "multi": true, "expl": "This is incorrect! Replacing fuses is not part of Lockout/Tagout; the correct steps involve notification, locking, and tagging.", "topic": "Electrical Safety"}, {"stem": "What is the main function of a fuse in an electrical system?", "opts": ["Reduce power draw", "Maintain a live circuit", "Protect the system by breaking the circuit during overcurrent", "Bypass electrical flow"], "correct": [2], "multi": false, "expl": "This is incorrect! A fuse protects the system, not bypasses or maintains current flow.", "topic": "Electrical Safety"}, {"stem": "Which term describes a wire that is connected safely to the earth?", "opts": ["Hot", "Grounded", "Neutral", "Live"], "correct": [1], "multi": false, "expl": "This is incorrect! \"Grounded\" refers to a safe connection to earth, not a live or energized wire.", "topic": "Electrical Safety"}, {"stem": "Why is electricity especially dangerous when standing on wet surfaces?", "opts": ["Wet surfaces insulate your body", "Wet surfaces ground your body, increasing current flow", "It makes tools heavier", "It helps you see arcs more clearly"], "correct": [1], "multi": false, "expl": "This is incorrect! Wet conditions make your body a better conductor, increasing danger.", "topic": "Electrical Safety"}, {"stem": "Why should tools with frayed cords be removed from service?", "opts": ["They can shock you even if turned off", "They reduce the power of the tool", "They increase system resistance", "They overload the fuse"], "correct": [0], "multi": false, "expl": "This is correct! Frayed cords can cause electric shocks and must be tagged and removed immediately.", "topic": "Electrical Safety"}, {"stem": "What does a disconnect do in an HVAC system?", "opts": ["Monitors circuit voltage", "Powers the entire building", "Acts as the last line of defense by cutting power to the unit", "Replaces the fuse in an emergency"], "correct": [2], "multi": false, "expl": "This is incorrect! The disconnect cuts power locally and is critical for safety during repairs.", "topic": "Electrical Safety"}];
const LS="natedrill_v1";
const C=2*Math.PI*27;
let state=JSON.parse(localStorage.getItem(LS)||"{}");
let topic="",queue=[],cur=null,curOpts=[],answered=false,picked=new Set();
document.getElementById("seenArc").style.strokeDasharray=C;
document.getElementById("aptArc").style.strokeDasharray=C;
const topics=[...new Set(MCQS.map(q=>q.topic))];
const sel=document.getElementById("topicSel");
topics.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;sel.appendChild(o)});
sel.onchange=()=>{topic=sel.value;build()};
document.getElementById("resetLink").onclick=()=>{if(confirm("Wipe all progress?")){state={};save();build()}};
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function pool(){return MCQS.map((q,i)=>({q,i})).filter(x=>!topic||x.q.topic===topic)}
function st(i){return state[i]||(state[i]={c:0})}
function build(){
  const p=pool();
  queue=p.filter(x=>st(x.i).c<2).map(x=>x.i);
  for(let k=queue.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[queue[k],queue[j]]=[queue[j],queue[k]]}
  updateRings();next()
}
function updateRings(){
  const p=pool();const tot=p.length;
  const seen=p.filter(x=>st(x.i).c>0||(state[x.i]&&state[x.i].seen)).length;
  const apt=p.reduce((a,x)=>a+Math.min(st(x.i).c,2)/2,0);
  const sp=tot?seen/tot:0, ap=tot?apt/tot:0;
  document.getElementById("seenArc").style.strokeDashoffset=C*(1-sp);
  document.getElementById("aptArc").style.strokeDashoffset=C*(1-ap);
  document.getElementById("seenPct").textContent=Math.round(sp*100)+"%";
  document.getElementById("aptPct").textContent=Math.round(ap*100)+"%";
  document.getElementById("count").textContent=queue.length+" left / "+tot;
}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
function next(){
  const stage=document.getElementById("stage");
  if(!queue.length){
    stage.innerHTML='<div class="card done"><h2>Pool cleared</h2><p>Every question answered correctly twice.</p><button class="btn" onclick="location.reload()">Study again</button></div>';
    updateRings();return;
  }
  cur=queue[0];answered=false;picked=new Set();
  const q=MCQS[cur];
  curOpts=shuffle(q.opts.map((t,oi)=>({t,oi})));
  const multi=q.multi;
  let h='<div class="card"><div class="topic">'+esc(q.topic)+'</div><div class="stem">'+esc(q.stem)+(multi?'<span class="multi-hint">(select all that apply)</span>':'')+'</div><div id="opts">';
  curOpts.forEach((o,di)=>{h+='<button class="ans" data-disp="'+di+'"><span class="ltr">'+String.fromCharCode(65+di)+'.</span>'+esc(o.t)+'</button>'});
  h+='</div><button class="submit" id="submitBtn">Submit</button><div class="expl" id="expl"></div><div class="cont" id="cont">Tap or press space to continue</div></div>';
  stage.innerHTML=h;
  document.querySelectorAll("#opts .ans").forEach(b=>b.onclick=()=>clickOpt(+b.dataset.disp));
  if(multi)document.getElementById("submitBtn").classList.add("show");
  document.getElementById("submitBtn").onclick=grade;
  if(!state[cur])state[cur]={c:0};state[cur].seen=1;save();
}
function clickOpt(di){
  if(answered)return;
  const q=MCQS[cur];
  if(q.multi){
    if(picked.has(di)){picked.delete(di)}else{picked.add(di)}
    document.querySelectorAll("#opts .ans").forEach(b=>b.classList.toggle("sel",picked.has(+b.dataset.disp)));
  }else{picked=new Set([di]);grade()}
}
function grade(){
  if(answered)return;answered=true;
  const q=MCQS[cur];
  const correctDisp=curOpts.map((o,di)=>({di,ok:q.correct.includes(o.oi)})).filter(x=>x.ok).map(x=>x.di);
  const chosen=[...picked];
  const right=chosen.length===correctDisp.length&&chosen.every(d=>correctDisp.includes(d));
  document.querySelectorAll("#opts .ans").forEach(b=>{
    const di=+b.dataset.disp;b.disabled=true;
    if(correctDisp.includes(di)){b.classList.add("right");boldUnique(b,q)}
    else if(chosen.includes(di)){b.classList.add("wrong")}
  });
  const p=state[cur];
  if(right){p.c=(p.c||0)+1}else{p.c=0}
  save();
  const ex=document.getElementById("expl");
  if(!right){ex.innerHTML="<b>Answer:</b> "+correctDisp.map(d=>String.fromCharCode(65+d)).join(", ")+(q.expl?"<br>"+esc(q.expl):"");ex.classList.add("show")}
  document.getElementById("cont").classList.add("show");
  document.getElementById("submitBtn").classList.remove("show");
  queue.shift();
  if(right&&p.c<2){queue.splice(Math.min(10,queue.length),0,cur)}
  else if(!right){queue.splice(Math.min(3,queue.length),0,cur)}
  updateRings();
  if(right){setTimeout(()=>{if(answered)next()},450)}
}
function boldUnique(el,q){
  const cur=el.textContent.replace(/^[A-Z]\.\s*/,'');
  const others=q.opts.filter(o=>!q.correct.includes(q.opts.indexOf(o)));
}
function esc(s){return (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener("keydown",e=>{
  const q=MCQS[cur];if(!q)return;
  if(answered&&(e.key===" "||e.key==="Enter")){e.preventDefault();next();return}
  if(!answered){
    if(/^[1-9]$/.test(e.key)){const di=+e.key-1;if(di<curOpts.length)clickOpt(di)}
    else if(/^[a-zA-Z]$/.test(e.key)){const di=e.key.toUpperCase().charCodeAt(0)-65;if(di>=0&&di<curOpts.length)clickOpt(di)}
    else if((e.key===" "||e.key==="Enter")&&q.multi&&picked.size){e.preventDefault();grade()}
  }
});
build();
</script></body></html>
