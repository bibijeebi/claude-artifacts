<script>
const FLASH=[["Accounting equation", "Assets = Liabilities + Equity. Every transaction keeps it balanced."], ["Asset", "A resource the company owns that provides future benefit (cash, AR, inventory, equipment)."], ["Liability", "An obligation owed to outsiders (AP, notes payable, wages payable)."], ["Equity", "The owners' claim on assets: contributed capital + retained earnings."], ["Retained earnings", "Cumulative net income kept in the business. Beg RE + NI - dividends = End RE."], ["Revenue", "Inflow earned from delivering goods or services. Increases equity."], ["Expense", "Cost incurred to generate revenue. Decreases equity."], ["Dividend", "Distribution of earnings to owners. NOT an expense; reduces retained earnings directly."], ["Account receivable", "Amount a customer owes us for goods/services sold on credit. An asset."], ["Account payable", "Amount we owe a supplier for purchases on credit. A liability."], ["Note payable", "A formal written loan obligation. A liability."], ["Transaction", "Two parties exchanging something of value."], ["Journal entry", "The debit/credit record of one transaction. Debits always equal credits."], ["Debit", "The LEFT side of an entry. Increases assets, expenses, dividends (DEAD)."], ["Credit", "The RIGHT side of an entry. Increases liabilities, income, capital (CLIC)."], ["DEAD CLIC", "Debits up: Expenses, Assets, Dividends. Credits up: Liabilities, Income, Capital."], ["Double-entry accounting", "Every transaction hits at least two accounts; total debits = total credits."], ["Normal balance", "The side that increases an account: debit for assets/expenses/dividends, credit for the rest."], ["Accounting cycle", "The pipeline that turns transactions into financial statements."], ["Bookkeeping", "Day-to-day recording of transactions. A subset of accounting (which adds analysis and reporting)."], ["GAAP", "Generally Accepted Accounting Principles: the U.S. rulebook for financial accounting."], ["FASB", "Financial Accounting Standards Board: WRITES U.S. GAAP."], ["SEC", "Securities and Exchange Commission: ENFORCES reporting rules for public companies."], ["IASB / IFRS", "International Accounting Standards Board sets IFRS, the international standards."], ["Financial accounting", "External users (investors, creditors), GAAP-bound, historical, whole company, periodic."], ["Managerial accounting", "Internal users (managers), no GAAP, future-focused, by segment/product, on demand."], ["Planning, controlling, evaluating", "The three managerial functions that managerial accounting information serves."], ["Income statement", "Performance over a PERIOD: revenues - expenses = net income."], ["Gross profit", "Sales - cost of goods sold."], ["Net income", "Bottom line: all revenues minus all expenses for the period."], ["Statement of retained earnings", "Bridges IS to BS: Beg RE + NI - dividends = End RE."], ["Balance sheet", "Financial position AS OF a point in time: A = L + E."], ["Classified balance sheet", "Separates current from long-term assets and liabilities."], ["Current asset", "Converted to cash or used within one year (cash, AR, inventory)."], ["Current liability", "Due within one year (AP, wages payable)."], ["Statement of cash flows", "Where cash came from and went during a period: operating + investing + financing."], ["Operating activities", "Day-to-day cash: from customers, to suppliers and employees. Includes interest paid."], ["Investing activities", "Buying and selling long-term assets (equipment, buildings, securities)."], ["Financing activities", "Cash from/to lenders and owners: loans, stock issues, dividends PAID."], ["Direct method", "Operating section lists actual cash receipts and payments."], ["Indirect method", "Operating section starts at net income, adjusts non-cash items and working capital. Most common."], ["Articulation", "The statements link: NI flows to RE, RE sits on the BS, BS cash ties to the CFS."], ["Product cost", "DM + DL + MOH. Sits in inventory (asset) until sold, then becomes COGS."], ["Period cost", "Everything outside the factory: selling + admin. Expensed immediately."], ["Direct materials", "Materials physically in the product and traceable to it (wood in furniture, aluminum in planes)."], ["Direct labor", "Wages of workers whose hands are on the product (assemblers)."], ["Manufacturing overhead", "All factory costs that aren't DM or DL: factory rent, utilities, supervisors, indirect materials, depreciation on factory equipment."], ["Indirect materials", "Materials too minor to trace (glue, screws, sandpaper). Part of MOH."], ["Indirect labor", "Factory workers not touching the product (quality inspectors, maintenance, janitors). Part of MOH."], ["Variable cost", "Total changes with volume; per-unit constant (materials, commissions)."], ["Fixed cost", "Total constant; per-unit falls as volume rises (rent, salaries, depreciation)."], ["Mixed cost", "Fixed base + variable component (utilities)."], ["Relevant range", "The activity band where cost behavior assumptions hold. Outside it, per-unit variable and total fixed can change."], ["Opportunity cost", "Benefit forgone from the next best alternative. Never recorded in the accounting system."], ["Sunk cost", "Already spent, unrecoverable, irrelevant to future decisions."], ["Differential (relevant) cost", "A future cost that differs between alternatives. The only costs that matter in decisions."], ["Raw materials inventory", "Materials on hand, not yet in production."], ["Work-in-process inventory", "Partially completed units: DM + DL + applied OH so far."], ["Finished goods inventory", "Completed units awaiting sale."], ["Cost of goods sold", "The product cost of units SOLD this period. An expense."], ["Job order costing", "Costs accumulated per JOB. For custom/unique output: custom homes, law cases, repairs."], ["Process costing", "Costs accumulated per PROCESS and averaged over identical units: gasoline, cereal, soda."], ["Activity-based costing", "OH assigned via multiple activity pools and drivers. Best for diverse products with complex overhead."], ["Cost driver", "The activity measure that causes overhead (machine hours, setups, inspections)."], ["Cost pool", "The accumulated overhead cost associated with one activity. (PA trap: the 'numerical measure of cost for an activity' = the POOL.)"], ["Activity rate", "Pool cost divided by driver volume. ABC applies: rate x driver events."], ["Predetermined overhead rate", "Estimated MOH / estimated activity, set BEFORE the period."], ["Applied overhead", "OH assigned to production via the predetermined rate."], ["Overapplied overhead", "Applied > actual. (Underapplied = applied < actual.) Usually closed to COGS."], ["Job cost sheet", "The running tab of DM, DL, and applied OH for one job."], ["Equivalent units", "Partially complete units expressed as whole units for per-unit costing in process systems."], ["CVP analysis", "Sales - variable costs - fixed costs = profit."], ["Contribution margin", "Sales - variable costs. What's left to cover fixed costs, then profit."], ["Contribution margin ratio", "CM / sales. (Variable cost ratio = VC / sales; the two sum to 100%.)"], ["Break-even in units", "Fixed costs / CM per unit."], ["Break-even in dollars", "Fixed costs / CM ratio."], ["Target profit units", "(Fixed costs + target profit) / CM per unit."], ["Margin of safety", "Actual or budgeted sales - break-even sales. The cushion."], ["Master budget", "The full linked set of budgets, starting with sales."], ["Sales budget", "Prepared FIRST. Drives every other budget."], ["Production budget", "Units to make = expected sales + desired ending inventory - beginning inventory."], ["Direct materials budget", "Materials to buy = production needs + desired ending DM - beginning DM."], ["Cash budget", "Forecast of receipts and disbursements; plans borrowing and repayment."], ["Static budget", "Fixed at one planned volume."], ["Flexible budget", "Recalculated at the ACTUAL volume, so comparisons are fair."], ["Cost center", "Manager controls COSTS only (maintenance dept)."], ["Profit center", "Manager controls costs AND revenues (a store)."], ["Investment center", "Manager controls costs, revenues, AND assets (a division)."], ["Controllable cost", "A cost the manager can influence. Evaluate managers ONLY on these."], ["Horizontal analysis", "Percentage CHANGE in each line item across years: (new - old) / old."], ["Vertical analysis", "Each line as % of a base within ONE statement: IS base = net sales, BS base = total assets."], ["Common-size statements", "Statements expressed entirely in vertical-analysis percentages, comparable across companies."], ["Current ratio", "Current assets / current liabilities. Measures LIQUIDITY (short-term)."], ["Debt-to-assets ratio", "Total liabilities / total assets. Measures SOLVENCY (long-term leverage)."], ["Profit margin", "Net income / net sales. Cents of profit per sales dollar."], ["Liquidity vs solvency", "Liquidity = pay this year's bills. Solvency = survive the long haul."]], MCQS=[["What is the effect of a company's accounting department maintaining high ethical standards?", ["The company's accounting information will increase in value.", "The company can hire fewer accountants to do the same amount of work.", "The company's accounting information will decrease in value.", "The company can report more favorable results in its financial statements."], 0, "Ethical accounting = trustworthy data = investors/lenders/regulators rely on it = info is MORE valuable. Ethics doesn't reduce workload or manipulate results — those are red flags.", "Intro & Ethics"], ["Why might employees be interested in their company's financial accounting information?", ["Financial statement data provide item-by-item product cost information.", "Financial statement data provide detailed internal budget information.", "Financial statement data are often used in determining employee bonuses.", "Financial statement data are used to record long term liabilities."], 2, "Employees care because bonuses and profit-sharing tie directly to financial performance. Product costs and internal budgets are managerial accounting (private), not financial statements.", "Intro & Ethics"], ["Which group establishes financial accounting rules in the United States?", ["Financial Accounting Standards Board (FASB)", "International Accounting Standards Board (IASB)", "American Institute of Certified Public Accountants (AICPA)", "Internal Revenue Service (IRS)"], 0, "FASB = US GAAP rules. IASB = international (IFRS). AICPA = profession organization, doesn't set rules. IRS = tax rules only.", "Intro & Ethics"], ["Which report is one of the three primary financial statements?", ["Statement of the accounting cycle", "Statement of stakeholder funds", "Statement of cash flows", "Statement of management accounting"], 2, "The Big 3: Income Statement, Balance Sheet, Statement of Cash Flows. (Statement of Retained Earnings is sometimes counted as a 4th.)", "Financial Statements"], ["A company paid $5,000 cash in advertising costs. How does this transaction affect the paying company's accounting equation?", ["Assets increase by $5,000; expenses increase by $5,000.", "Assets decrease by $5,000; liabilities increase by $5,000.", "Assets decrease by $5,000; owner equity decreases by $5,000.", "Assets decrease by $5,000; revenues increase by $5,000."], 2, "Cash out = assets down. Advertising is an expense → expenses reduce profit → profit reduces equity. So assets DOWN $5k, equity DOWN $5k. Equation stays balanced.", "Equation & Entries"], ["What is a transaction?", ["Two parties exchanging something of value", "A type of commonly used accounting software", "A category of merchandiser or retailer", "An example of an online business document"], 0, "A transaction = any exchange of value between two parties. Buying, selling, borrowing, paying — all transactions.", "Equation & Entries"], ["A company borrowed $80,000 cash from a bank. How does this transaction affect the accounting equation of the borrowing company?", ["Assets increase by $80,000; liabilities increase by $80,000.", "Assets increase by $80,000; owners' equity increases by $80,000.", "Assets increase by $80,000; liabilities decrease by $80,000.", "Assets increase by $80,000; revenues increase by $80,000."], 0, "Cash comes in (asset UP) and you owe the bank (liability UP). Borrowing doesn't earn revenue — it creates debt. Equation: +$80k Assets = +$80k Liabilities + $0 Equity.", "Equation & Entries"], ["What is the impact of expenses on the accounting equation?", ["Expenses increase liabilities.", "Expenses decrease owners' equity.", "Expenses decrease liabilities.", "Expenses increase owners' equity."], 1, "Expenses reduce profit → profit flows to retained earnings → retained earnings is part of equity. So expenses DECREASE equity.", "Equation & Entries"], ["Which type of account are accounts payable and notes payable both examples of?", ["Liability", "Asset", "Expense", "Equity"], 0, "'Payable' = you OWE someone. All payables are liabilities. Accounts payable = owe suppliers. Notes payable = owe lenders.", "Equation & Entries"], ["What is the purpose of the financial accounting cycle?", ["To collect confidential information for management to use as a competitive tool", "To gather information related to the expenses and income generated by a company", "To turn information about transactions into financial statements", "To produce and analyze a company's monthly bank statement"], 2, "The accounting cycle = the workflow that converts raw transactions into the big three financial statements. That's its whole job.", "Financial Statements"], ["According to the accounting equation, the amount of liabilities and equity must always be equal to another amount. What is that other amount?", ["The sum of revenues and expenses", "Assets", "Cash", "The sum of expenses and dividends"], 1, "The accounting equation: Assets = Liabilities + Equity. So L + E = Assets. Always. Every balance sheet.", "Equation & Entries"], ["Which item is an expense item?", ["Loans payable", "Cost of goods sold", "Accounts receivable", "Accounts payable"], 1, "COGS = expense (income statement). Payables = liabilities (balance sheet). Receivables = assets (balance sheet).", "Financial Statements"], ["How is gross profit computed?", ["Sales minus cost of goods sold", "Total assets minus total liabilities", "Accounts receivable minus accounts payable", "Total revenues minus total expenses"], 0, "Gross Profit = Sales − COGS. It's the first profit line on the income statement. Net income is Revenues − ALL expenses (the bottom line, different concept).", "Financial Statements"], ["Which type of account is retained earnings?", ["Revenue", "Liability", "Equity", "Asset"], 2, "Retained earnings = profits the company kept (didn't pay out as dividends). It's a component of EQUITY on the balance sheet.", "Equation & Entries"], ["For purposes of cash flow classification in the statement of cash flows, which item is an operating activity?", ["Buying equipment", "Paying employees", "Distributing dividends", "Selling bonds"], 1, "CFS has 3 sections: Operating (day-to-day: paying employees, paying suppliers, receiving from customers), Investing (buying/selling long-term assets like equipment), Financing (stocks, bonds, dividends, loans).", "Financial Statements"], ["How does a classified balance sheet provide useful information to a decision maker?", ["It distinguishes between current and long-term assets.", "It distinguishes liabilities from expenses.", "It provides data that are not publicly disclosed.", "It provides data for a period of time instead of as a point in time."], 0, "'Classified' balance sheet means assets/liabilities are grouped into CURRENT (≤1 year) and LONG-TERM (>1 year). Helps users see liquidity at a glance.", "Financial Statements"], ["What information does a balance sheet provide to a decision maker?", ["Summary of the operating performance of a company during a period", "Summary of the cash flows of a company during a period", "Summary of the operating performance of a company at a particular date", "Summary of the financial position of a company at a particular date"], 3, "Balance sheet = SNAPSHOT at a single date (Dec 31, etc.). Shows financial position: what you own, owe, and equity. Income statement and cash flows cover a PERIOD.", "Financial Statements"], ["What is an account payable?", ["The amount owed to a company that sold goods or services to a customer on credit", "The amount to be paid by a company in repayment of both loans and dividends", "The amount to be paid by a company for dividends to shareholders", "The amount owed by a company that purchased goods or services from a supplier on credit"], 3, "Accounts PAYABLE = what YOU owe suppliers (credit purchases). Accounts RECEIVABLE = what customers owe YOU. Trap answer A is receivable.", "Equation & Entries"], ["What is an example of a financial cost that would result from poor direct labor budgeting and planning?", ["Delayed cash collections from credit customers", "Increased depreciation costs for facilities", "Increased hiring, training, and overtime costs", "Excessive inventory storage costs"], 2, "Poor labor planning → emergency hiring, rushed training, paying overtime. Those are direct consequences of not forecasting workforce needs right.", "Budgeting & Cash Flow"], ["What does a manager have control over in a cost center?", ["Revenues", "Assets", "Costs", "Dividends"], 2, "4 responsibility centers: Cost (costs only), Revenue (revenues only), Profit (both), Investment (profit + assets). The name tells you what's controlled.", "Managerial Accounting"], ["What should be considered when developing a measure to evaluate the performance of a manager?", ["Only indirect costs", "Only controllable costs", "Only noncontrollable costs", "Only centralized costs"], 1, "Cardinal rule of performance evaluation: only hold managers accountable for what they can CONTROL. Judging them on uncontrollable costs is unfair and demotivating.", "Managerial Accounting"], ["In some companies, the performance measures for profit center managers are heavily influenced by cost allocations downward from organizational units (such as company headquarters). Why is this a mistake?", ["Revenues should not be included in the performance evaluation measure of a profit center manager.", "Direct costs should not be included in the performance evaluation measure of a profit center manager.", "Controllable costs should not be included in the performance evaluation measure of a profit center manager.", "Uncontrollable costs should not be included in the performance evaluation measure of a profit center manager."], 3, "HQ allocations (rent, exec salaries) are UNCONTROLLABLE by division managers. Including them in performance measures punishes managers for things they can't change.", "Managerial Accounting"], ["Which budget should include the expected cost of supplies used by the office staff of the corporate headquarters?", ["Production budget", "Sales budget", "Administrative expense budget", "Direct materials budget"], 2, "HQ office supplies = admin expense (period cost). Production/materials budgets are for manufacturing. Sales budget = revenue forecast.", "Budgeting & Cash Flow"], ["Which items are uncontrollable, external variables that make it difficult to forecast the level of sales?", ["Direct labor and advertising expenditures", "Selling price and sales effort", "Customer tastes and economic conditions", "Inventory level and product management"], 2, "Customer tastes and the economy are OUTSIDE the company's control. Pricing, advertising, labor, inventory are INTERNAL variables the company controls.", "Budgeting & Cash Flow"], ["What is the correct sequence of budgets in a manufacturing business?", ["Direct materials, sales, production", "Sales, production, direct materials", "Sales, direct materials, production", "Production, direct materials, sales"], 1, "Master budget flow: SALES first (how much will we sell?) → PRODUCTION (how much do we make?) → DIRECT MATERIALS (what do we buy to make it?). Sales drives everything.", "Budgeting & Cash Flow"], ["Which type of business organization has a major focus on direct materials, direct labor, and overhead?", ["Retail", "Manufacturing", "Service", "Merchandising"], 1, "DM + DL + MOH = the 3 MANUFACTURING product costs. Retail/merchandising buy finished goods. Service has no physical product.", "Managerial Accounting"], ["What are the three primary functions that company managers use managerial accounting information for?", ["Borrowing, repaying, and lending", "Reporting, allowing, and negotiating", "Operating, investing, and financing", "Planning, controlling, and evaluating"], 3, "PCE: Planning (budgets), Controlling (vs actual), Evaluating (performance). Operating/investing/financing are CFS categories, different concept.", "Managerial Accounting"], ["What is the proper accounting for a product cost?", ["Record as a financing cash flow", "Record immediately as an expense", "Record as an inventory cost until the item is sold", "Record as a liability on the balance sheet"], 2, "Product costs (DM + DL + MOH) = capitalized as INVENTORY (asset) until the product is sold, then flow to COGS. Period costs expense immediately.", "Cost Classification"], ["How could a period cost be reported in an income statement?", ["As cost of goods manufactured", "As cost of goods sold", "As an administrative expense", "As manufacturing overhead"], 2, "Period costs = Selling + Administrative. They show up as S&A expenses on the income statement, never touched inventory. COGS and COGM are product cost concepts.", "Cost Classification"], ["A retail company purchased inventory costing $100,000. By the end of the year, inventory costing $75,000 had been sold. How is the remaining $25,000 in inventory reported in the financial statements?", ["As an asset in the balance sheet", "As manufacturing overhead in the income statement", "As an administrative expense in the income statement", "As a liability in the balance sheet"], 0, "Unsold inventory = ASSET on balance sheet (current asset). Only the $75k sold becomes COGS. This is why product costs are inventoriable — they sit as an asset until sold.", "Financial Statements"], ["How are the wages of cashiers classified in a merchandising company?", ["Cost of goods sold", "Manufacturing overhead", "Work-in-process inventory", "Selling expense"], 3, "Cashiers = point-of-sale staff = SELLING expense (period cost). Merchandising has no manufacturing, no WIP. COGS is the cost of goods, not the people who sell them.", "Cost Classification"], ["How are wages of office staff in a company headquarters building classified?", ["Direct labor", "Indirect labor", "Manufacturing overhead", "Administrative expense"], 3, "HQ office staff = ADMIN expense (period cost, not tied to production). Direct/indirect labor and MOH are all manufacturing concepts — HQ is not in the factory.", "Cost Classification"], ["Which label is given to the cost of the wood used in the construction of a piece of wooden furniture?", ["Direct labor", "Manufacturing overhead", "Selling and administrative", "Direct materials"], 3, "Wood = primary input physically in the furniture = DIRECT MATERIALS. If it can be traced directly to the product in measurable amounts, it's DM.", "Cost Classification"], ["Which label is given to the cost of electricity in a furniture factory?", ["Direct labor", "Manufacturing overhead", "Administrative expenses", "Direct materials"], 1, "Factory electricity = supports production but not traceable to a specific product = MANUFACTURING OVERHEAD (indirect). If it were HQ electricity, it'd be admin expense.", "Cost Classification"], ["What is the sequence of the flow of costs through a manufacturing operation?", ["Raw materials, work-in-process, finished goods, cost of goods sold", "Finished goods, cost of goods sold, raw materials, work-in-process", "Cost of goods sold, raw materials, work-in-process, finished goods", "Work-in-process, raw materials, finished goods, cost of goods sold"], 0, "Flow: RM → WIP → FG → COGS. Buy materials, start making them (WIP), finish them (FG), sell them (COGS). MEMORIZE THIS ORDER.", "Costing Methods"], ["What is the CVP equation?", ["Sales - fixed costs - administrative costs = profit", "Sales - cost of goods sold - fixed costs = profit", "Sales - variable costs - overhead costs = profit", "Sales - variable costs - fixed costs = profit"], 3, "CVP (Cost-Volume-Profit): Sales − Variable Costs − Fixed Costs = Profit. The core managerial accounting equation. Everything else derives from this.", "CVP & Break-Even"], ["Which cost category is not formally tracked in a company's accounting system?", ["Direct costs", "Indirect costs", "Out-of-pocket costs", "Opportunity costs"], 3, "Opportunity costs = value of the road NOT taken. Real but never recorded. Direct, indirect, and out-of-pocket are all actually spent dollars that hit the books.", "Cost Classification"], ["A company reports: Total sales revenue = $250,000. Number of units sold = 50,000 units. Variable costs = $100,000. If the company is operating at its break-even point, what is the company's total contribution margin?", ["$200,000", "$50,000", "$100,000", "$150,000"], 3, "CM = Sales − Variable Costs = $250,000 − $100,000 = $150,000. At break-even, CM EQUALS Fixed Costs (so Fixed Costs also = $150k). CM itself is just Sales − VC.", "CVP & Break-Even"], ["A company reports: Price per unit = $25. Variable costs per unit = $15. Fixed costs = $15,000. Given these data, what is the variable cost ratio?", ["60%", "50%", "40%", "20%"], 0, "VC Ratio = Variable Cost per unit ÷ Price per unit = $15 ÷ $25 = 60%. CM Ratio would be the other 40%. Fixed costs are irrelevant to this ratio.", "CVP & Break-Even"], ["Why is the concept of relevant range important to a manager?", ["Inside the relevant range, the total fixed cost can change.", "Inside the relevant range, the variable cost per unit can increase.", "Outside the relevant range, the variable cost per unit can change.", "Outside the relevant range, the variable cost per unit stays constant."], 2, "Relevant range = the activity level where cost behavior assumptions HOLD. INSIDE: fixed costs stay fixed, variable costs per unit stay constant. OUTSIDE: all bets off (bulk discounts, new machinery needed, etc.).", "CVP & Break-Even"], ["Which statement correctly describes applied manufacturing overhead?", ["The total manufacturing costs other than direct materials", "The amount of manufacturing overhead that is assigned to each employee", "The total manufacturing costs other than direct labor", "The amount of manufacturing overhead that is assigned to the goods produced"], 3, "APPLIED overhead = the MOH charged to products using the predetermined rate. It's what lands on the goods produced, not on employees or totals.", "Costing Methods"], ["What is the label given to the quantity computed as estimated overhead costs divided by estimated level of activity?", ["Underapplied overhead rate", "Predetermined overhead rate", "Forecasted overhead rate", "Indirect overhead rate"], 1, "Predetermined Overhead Rate = Estimated MOH ÷ Estimated Activity (like machine hours or labor hours). Set at start of year, used to apply MOH. Under/over-applied happens when actual differs from applied.", "Costing Methods"], ["In a job order costing system, what is the proper accounting for a product cost?", ["It is reported as a part of general expenses.", "It is reported as a part of administrative expenses.", "It is reported as a part of cost of goods sold.", "It is reported as an expense when it occurs."], 2, "Product costs in any system (job order, process, ABC) flow through inventory → COGS when sold. They are NEVER expensed immediately and NEVER part of general/admin expenses.", "Costing Methods"], ["Which item is a period cost?", ["Wages for factory quality control inspectors", "Rent on factory robotic equipment in an airplane manufacturer", "Wages of maintenance workers in the factory building", "Utility bills to heat the headquarters building"], 3, "HQ utilities = period cost (admin). Anything with 'factory' in the description = product cost (MOH). QC inspectors, factory equipment rent, factory maintenance are all MOH.", "Cost Classification"], ["Which statement is true with respect to activity-based costing (ABC) systems?", ["Implementing an ABC system requires only a careful calculation of total direct labor hours.", "Implementing an ABC system requires very little analysis of the factors that create overhead costs.", "An ABC system allocates overhead based on multiple activities.", "An ABC system completely eliminates all overhead costs."], 2, "ABC uses MULTIPLE cost drivers (setups, inspections, machine hours, etc.) instead of one blunt rate. It requires DETAILED analysis. It doesn't eliminate overhead — it allocates it more accurately.", "Costing Methods"], ["How is overhead allocated in an ABC system?", ["Cost pool multiplied by number of cost driver events", "Activity rate multiplied by number of cost driver events", "Budgeted overhead multiplied by expected number of direct labor hours", "Sum of materials and labor cost multiplied by number of units"], 1, "ABC formula: Activity Rate × # of Cost Driver Events. Activity Rate = cost pool ÷ total driver events. Then applied per product/job by multiplying times the events consumed.", "Costing Methods"], ["In an ABC system, which name is given to a numerical measure reflecting the amount of a cost associated with a particular overhead cost activity?", ["Cost system", "Cost driver", "Cost metric", "Cost pool"], 3, "Cost POOL = the dollar amount grouped by activity (e.g., 'setup costs = $50,000'). Cost DRIVER = what causes it (e.g., 'number of setups'). Don't swap them.", "Costing Methods"], ["How are production costs treated in a process costing system?", ["Costs are accumulated by process and averaged over all products made during the period.", "Costs are assigned to a selling, general, and administrative expense account during the period.", "Costs are assigned to the actual manufacturing overhead account during the period.", "Costs are assigned to specific jobs or products made during the period."], 0, "Process costing = mass production (cereal, gasoline). Accumulate costs by PROCESS (mixing, bottling), average over all units. Job order assigns to specific jobs.", "Costing Methods"], ["How is the production cost per unit computed in a process costing system?", ["Amount of direct labor cost divided by the number of direct labor hours used during a particular period of time", "Amount of overhead cost divided by the number of units completed during a particular period of time", "Amount of direct materials cost divided by the quantity of direct materials used during a particular period of time", "Amount of total production cost divided by the number of units completed during a particular period of time"], 3, "Process cost per unit = TOTAL PRODUCTION COSTS ÷ UNITS COMPLETED. Simple average across all identical units. The other options use partial numerators — wrong.", "Costing Methods"], ["For which production process is process costing the appropriate costing method to use?", ["Constructing a high-rise office building", "Building custom-made furniture", "Producing made-to-order industrial equipment", "Refining gasoline in a petroleum facility"], 3, "Gasoline refining = continuous, identical output = PROCESS costing. Construction/custom/made-to-order = unique each time = JOB ORDER costing.", "Costing Methods"], ["Which overhead allocation method should be used for a business that mass-produces breakfast cereal?", ["ABC costing", "Job order costing", "Product-line costing", "Process costing"], 3, "Mass production of identical units = PROCESS costing. Cereal, chemicals, gasoline, paint — all process. ABC is for complex multi-product overhead allocation.", "Costing Methods"], ["What is the correct sequence for the flow of costs through a job order costing system?", ["Raw materials inventory, work-in-process inventory, cost of goods sold, finished goods inventory", "Raw materials inventory, finished goods inventory, cost of goods sold, work-in-process inventory", "Raw materials inventory, work-in-process inventory, finished goods inventory, cost of goods sold", "Raw materials inventory, cost of goods sold, work-in-process inventory, finished goods inventory"], 2, "RM → WIP → FG → COGS. Same in both job order and process. Buy materials → make them (WIP) → finish (FG) → sell (COGS). Memorize this path.", "Costing Methods"], ["Which type of company cannot use job order costing?", ["Road construction", "Tax accountant for wealthy people", "Petroleum refining plant", "Building construction"], 2, "Petroleum refining = continuous identical output = MUST use process costing. Construction and custom tax work = unique jobs = job order fits perfectly.", "Costing Methods"], ["What is an example of direct materials?", ["Cost of sandpaper in making wood furniture", "Cost of robotic equipment in making automobiles", "Cost of aluminum in making an airplane", "Cost of saws and hammers in constructing a house"], 2, "Direct materials = physically IN the product, traceable in measurable amounts. Aluminum in a plane = DM. Sandpaper, robots, tools = MOH (indirect — they help produce but aren't IN the product).", "Cost Classification"], ["What is an example of direct labor?", ["Wages for furniture assemblers in a wood furniture manufacturer", "Wages for factory quality control inspectors", "Wages for marketing staff in company headquarters", "Wages for accounting staff in company headquarters"], 0, "Direct labor = workers who TOUCH the product. Assemblers build the furniture = DL. QC inspectors = indirect (MOH). Marketing and accounting = period costs (S&A).", "Cost Classification"], ["What is an example of manufacturing overhead?", ["Cost of aluminum in making an airplane", "Cost of sandpaper in making wood furniture", "Cost of concrete in making a road", "Cost of bricks in making a building"], 1, "Sandpaper = INDIRECT material (not physically IN final furniture in meaningful amount) = MOH. Aluminum, concrete, bricks are all primary physical inputs = DIRECT MATERIALS.", "Cost Classification"], ["What is horizontal analysis in the context of financial statement analysis?", ["Calculating each line item as a percentage of total sales for the same year", "Calculating the percentage change in each line item from one year to the next", "Comparing one company's financial statements to a competitor's financial statements", "Analyzing the relationship between current and long-term liabilities"], 1, "HORIZONTAL analysis = trends OVER TIME (year-to-year % change). VERTICAL analysis = each item as % of base (usually total sales) in the SAME year. Horizontal scans left-to-right across years.", "Analysis & Ratios"], ["Based on an analysis showing operating expenses rising sharply over two years while sales grew more slowly, what should management be concerned about?", ["The increase in interest expenses over the past two years", "The increase in income taxes over the past two years", "The increase in operating expenses over the past two years", "The increase in production cost over the past two years"], 2, "If operating expenses are outpacing sales growth, operating margin is squeezed. This is the profitability threat management must address. Interest/taxes are not operating, and production is a subset, not the whole story.", "Analysis & Ratios"], ["Which action would make the profitability of the company in 20X9 the same as in 20X7?", ["Decreasing the proportion of operating income to sales by about 2%", "Increasing the proportion of gross profit to sales by about 2%", "Increasing the operating expenses by about $20,000", "Paying back interest expenses earlier in the year"], 1, "To restore earlier profitability: improve gross profit margin. Gross profit % has to RISE, not fall, and operating expenses must fall, not rise. B is the only action that directly increases profitability.", "Analysis & Ratios"], ["In the Whole Pine cash flow analysis, how should a column chart showing cash availability for each month be titled?", ["Cash Analysis", "Monthly Receipts", "Total Cash Available", "Whole Pine Cash"], 2, "Task 60.1 in the workbook specifies the exact title: 'Total Cash Available'. MyEducator grades titles EXACTLY. Don't improvise on chart titles.", "Budgeting & Cash Flow"], ["Why is the net cash for December negative while total sales for December are the highest out of the months from October through December?", ["December general and administrative expenses are expected to be much higher.", "Credit sales are disproportionately low with respect to total sales compared to other months.", "Total cash available does not reflect December sales because there was a high volume of credit sales.", "December cash use is disproportionally high with respect to total sales compared to other months."], 3, "December has $50k equipment purchase + $55k cash dividend on top of normal outflows, pushing Total Cash Outflows to $454k. Sales are high but cash USE is disproportionately higher. The giant outflows, not receipt timing, drive the negative.", "Budgeting & Cash Flow"], ["How can Whole Pine avoid having negative net cash flows in December?", ["Promote cash sales with the goal of having $230,000 in cash sales and only $210,000 in credit sales.", "Postpone purchasing the new equipment and do not pay cash dividends to shareholders.", "Collect 50% of the credit sales in the month of credit sales and 30% in the month following the credit sales.", "Instead of paying for credit purchases of inventory a month after the purchase, pay two months after the purchase."], 1, "The $50k equipment + $55k dividend = $105k of DISCRETIONARY December outflows. Postponing both eliminates the cash shortfall directly. The other options tinker with collection timing or payment timing, which help less and risk supplier/customer relationships.", "Budgeting & Cash Flow"]], SEQ=[["Financial statement preparation order", ["Income statement", "Statement of retained earnings", "Balance sheet", "Statement of cash flows"]], ["Accounting cycle", ["Analyze transactions", "Record journal entries", "Post to the ledger", "Prepare trial balance", "Make adjusting entries", "Prepare financial statements"]], ["Manufacturing cost flow", ["Raw materials inventory", "Work-in-process inventory", "Finished goods inventory", "Cost of goods sold"]], ["Master budget sequence", ["Sales budget", "Production budget", "Direct materials / labor / overhead budgets", "Selling & administrative budget", "Cash budget", "Budgeted financial statements"]], ["Activity-based costing steps", ["Identify activities", "Assign overhead costs to activity pools", "Determine the cost driver for each pool", "Compute each activity rate", "Apply overhead to products by driver usage"]], ["Income statement build", ["Sales revenue", "Subtract cost of goods sold = gross profit", "Subtract operating expenses = operating income", "Subtract interest and taxes", "Net income"]]], MATCH=[["Product vs period cost", [["Factory rent", "Product (MOH)"], ["CEO salary at headquarters", "Period"], ["Direct materials", "Product"], ["Sales commissions", "Period"], ["Factory supervisor wages", "Product (MOH)"], ["Marketing campaign", "Period"]]], ["DM / DL / MOH", [["Wood in a wooden table", "Direct materials"], ["Assembly line wages", "Direct labor"], ["Factory electricity", "Manufacturing overhead"], ["Glue and screws", "MOH (indirect materials)"], ["Factory quality inspectors", "MOH (indirect labor)"]]], ["Scenario to costing method", [["Custom-built homes", "Job order"], ["Refining gasoline", "Process"], ["Breakfast cereal mass production", "Process"], ["Diverse products, complex overhead", "ABC"], ["Law firm client cases", "Job order"]]], ["Statement to what it shows", [["Income statement", "Performance over a period"], ["Balance sheet", "Position at a point in time"], ["Statement of cash flows", "Cash in and out over a period"], ["Statement of retained earnings", "Change in RE: Beg + NI - dividends"]]], ["Increase with debit or credit?", [["Cash", "Debit"], ["Accounts payable", "Credit"], ["Service revenue", "Credit"], ["Rent expense", "Debit"], ["Dividends", "Debit"], ["Common stock", "Credit"]]], ["Cash flow section", [["Paying employees", "Operating"], ["Buying equipment", "Investing"], ["Issuing stock", "Financing"], ["Paying dividends", "Financing"], ["Collecting from customers", "Operating"], ["Selling an old building", "Investing"]]], ["Formula match", [["Break-even units", "Fixed / CM per unit"], ["Break-even dollars", "Fixed / CM ratio"], ["Current ratio", "Current assets / current liabilities"], ["Profit margin", "Net income / sales"], ["Ending RE", "Beg RE + NI - dividends"]]], ["Budget to content", [["Sales budget", "Prepared first; units x price"], ["Production budget", "Sales + ending inv - beginning inv"], ["Cash budget", "Receipts, disbursements, borrowing"], ["Flexible budget", "Adjusts to actual volume"], ["Administrative expense budget", "Headquarters office costs"]]], ["Analysis type", [["Horizontal analysis", "% change across years"], ["Vertical analysis", "% of a base within one statement"], ["Ratio analysis", "Relationships between statement items"]]], ["Responsibility centers", [["Cost center", "Controls costs only"], ["Profit center", "Controls costs + revenues"], ["Investment center", "Controls costs + revenues + assets"], ["Controllable cost", "The only fair basis for evaluating a manager"]]]], NOTES=[["Read first: how to beat this OA", ["The OA mirrors the PA style: definition-matching plus light computation. Every trap is LINGUISTIC. Read the stem twice and hunt the location word before you touch the options.", "CUT RULE: 'factory / plant / production' in a cost's name -> PRODUCT cost (DM, DL, or MOH). 'Office / headquarters / sales / admin / marketing' -> PERIOD cost. This one rule answers a fifth of the exam.", "CUT RULE: 'as of a date / at a point in time' -> balance sheet. 'For the period / during the year' -> income statement or cash flows.", "CUT RULE: 'internal / decisions / future / no rules' -> managerial accounting. 'External / investors / creditors / GAAP / historical' -> financial accounting.", "RULE: trust your stated reasoning. If you articulate the answer while reading the stem, pick it and move.", "RULE: dividends are NEVER an expense, buying equipment is NEVER an expense (it's an asset / investing outflow), and depreciation NEVER uses cash."]], ["The equation & DEAD CLIC", ["A = L + E. Every transaction keeps it balanced and touches at least two accounts.", "MNEMONIC: picture a nightclub. The DEAD shuffle in on the LEFT: Debits raise Dividends, Expenses, Assets. The bouncer CLICks the velvet rope on the RIGHT: Credits raise Liabilities, Income, Capital. Left side dead, right side click.", "Normal balance = whichever side increases the account. Revenue lives on the credit side; expenses and assets on the debit side.", "Common entries: buy supplies ON ACCOUNT -> Dr Supplies, Cr AP. Pay off AP -> Dr AP, Cr Cash (both sides shrink). Services ON ACCOUNT -> Dr AR, Cr Revenue. Borrow cash -> Dr Cash, Cr Note Payable. Pay advertising cash -> assets down, equity down (expense).", "Expenses decrease equity. Revenues increase equity. Dividends decrease equity directly, not through the income statement."]], ["Financial statements & articulation", ["Preparation order MNEMONIC: I Run Big Cash -> Income statement, Retained earnings, Balance sheet, Cash flows.", "ARTICULATION HOOK: a four-pool waterfall. Net income pours from the IS into the RE pool (Beg RE + NI - dividends = End RE). End RE flows onto the BS as part of equity. The BS cash balance must match where the CFS lands.", "Income statement: Sales - COGS = GROSS PROFIT - operating expenses = operating income - interest/taxes = net income.", "Balance sheet = SNAPSHOT (a point in time). Classified BS splits current (within one year) from long-term. Unsold inventory sits here as an ASSET.", "COGS is an EXPENSE item. AP, loans payable = liabilities. AR = asset. The PA tests exactly these sorting calls."]], ["Statement of cash flows", ["Three buckets HOOK: Operating = the daily grind (paychecks, customers, suppliers). Investing = buying the tractor (long-term assets in or out). Financing = the bank and the owners (loans, stock, dividends paid).", "PA answer: 'paying employees' = OPERATING. Buying equipment = investing. Selling bonds and distributing dividends = financing.", "Indirect method (the common one): start at NET INCOME, add back depreciation (non-cash), adjust for working-capital changes. Direct method lists actual receipts and payments instead.", "December trap (Whole Pine): highest SALES month can still go cash-negative when sales are on credit (cash lags) and big cash outflows stack up (equipment purchases, dividends). Fix: postpone the equipment buy and skip the dividend, i.e. cut cash OUT, since credit collections can't be forced faster."]], ["Cost classification: the factory-walls test", ["Stand at the factory gate. Everything INSIDE the fence = product cost (DM + DL + MOH), stored in inventory until the unit sells, then COGS. Everything OUTSIDE = period cost, expensed now (selling + admin).", "DM = physically in the product and traceable (wood, aluminum). DL = hands on the product (assemblers). MOH = every other factory cost: factory rent, factory utilities, factory supervisor, quality inspectors, maintenance workers, depreciation on factory robots, and INDIRECT materials (glue, screws, SANDPAPER).", "PA traps: sandpaper = MOH not DM. Quality inspectors and maintenance workers = MOH not DL. Cashiers in a merchandiser = SELLING expense. HQ office staff = ADMIN expense. HQ heating bill = period.", "Behavior HOOK: variable costs are ants: more units, more ants, but each ant weighs the same (total moves, per-unit frozen). Fixed cost is the rent troll: charges the same whether you make 1 or 1,000, so per-unit shrinks as volume climbs. Mixed = utility bill: flat base + usage.", "Relevant range: the band where those assumptions hold. OUTSIDE it, per-unit variable cost and total fixed cost can change.", "Opportunity cost = the road not taken; never recorded in the books (PA: 'not formally tracked'). Sunk cost = already spent; ignore it in every decision."]], ["Costing methods: three shops on one street", ["HOOK: the TAILOR (job order: every suit custom, one cost sheet per suit), the SODA PLANT (process: rivers of identical cans, cost per department averaged over units), the FORENSIC LAB (ABC: traces each overhead activity to its driver).", "The PRODUCT decides the method, not the company. Custom homes, road construction, tax clients, law cases = job order. Gasoline, cereal, soda = process. A petroleum refinery CANNOT use job order.", "Cost flow both systems: Raw materials -> WIP -> Finished goods -> COGS. In job order, product costs are expensed as COGS when goods SELL, never when incurred.", "Predetermined OH rate = ESTIMATED overhead / ESTIMATED activity, set BEFORE the year. Applied OH = the amount assigned to goods produced. Applied > actual = OVERapplied; the difference typically closes to COGS.", "ABC: overhead applied = ACTIVITY RATE x number of cost driver events. Cost DRIVER = the activity measure (setups, inspections). Cost POOL = the accumulated cost for one activity. PA TRAP: 'numerical measure reflecting the amount of a COST associated with an activity' = cost POOL, not driver. Driver counts events; pool holds dollars.", "Process costing: cost per unit = TOTAL production cost / units completed. Equivalent units turn half-done units into whole-unit math."]], ["CVP: the lemonade stand", ["HOOK: cups sell for $2, lemons cost 50 cents a cup. Every cup throws $1.50 of contribution margin at the $150 stand permit (fixed). 100 cups and you break even; cup 101 is pure profit.", "The CVP equation (PA verbatim): Sales - variable costs - fixed costs = profit.", "CM = sales - variable. CM ratio = CM / sales. Variable cost ratio = VC / sales (PA: 15/25 = 60%). The two ratios sum to 100%.", "BE units = fixed / CM per unit. BE dollars = fixed / CM RATIO. Target profit: (fixed + target) / CM per unit. Match the denominator to the output you want.", "At break-even, total CM = total fixed costs exactly (PA: sales 250k, VC 100k, at BE -> CM = 150k).", "Fixed costs up -> break-even up. CM per unit up -> break-even down. Margin of safety = actual sales - break-even sales."]], ["Budgeting: the locomotive", ["HOOK: the SALES budget is the locomotive; every car couples behind it: production -> DM/DL/MOH -> selling & admin -> cash -> budgeted statements. PA sequence: sales, production, direct materials.", "Production units = expected sales + desired ENDING inventory - BEGINNING inventory. Make what you'll sell, plus the shelf you want, minus the shelf you have. DM purchases uses the same skeleton one level down.", "Cash budget: beginning cash + receipts - disbursements; below the minimum -> borrow. Its whole purpose is timing: WHEN cash arrives and leaves.", "Sorting traps: HQ office supplies -> ADMINISTRATIVE expense budget. Uncontrollable sales-forecast variables = customer tastes and economic conditions (external). Poor DIRECT LABOR planning -> hiring, training, and overtime costs.", "Static budget = frozen at planned volume. Flexible budget = recalculated at actual volume so variances are fair."]], ["Managerial accounting & responsibility centers", ["Managerial info serves PLANNING, CONTROLLING, EVALUATING (PA verbatim). Manufacturing businesses are the ones focused on DM, DL, and overhead.", "Center ladder HOOK: the janitor, the shopkeeper, the landlord-shopkeeper. Cost center manager controls COSTS only. Profit center adds REVENUES. Investment center adds ASSETS.", "Golden evaluation rule: judge managers ONLY on CONTROLLABLE costs. Allocating headquarters costs down onto a profit center manager's scorecard is a mistake because those are UNCONTROLLABLE to him.", "Decision extras: relevant costs = only the ones that DIFFER between alternatives. Accept a special order below normal price when idle capacity exists and price > variable cost."]], ["Analysis & ratios", ["HOOK: horizontal = a TIMELINE laid flat (compare the same line across years). Vertical = an X-RAY of one statement (every line as % of the base).", "Horizontal % change = (new - old) / OLD. Prior year is always the denominator.", "Vertical bases: income statement -> NET SALES = 100%. Balance sheet -> TOTAL ASSETS = 100%.", "Scenario logic (PA): expenses growing faster than sales = the red flag. To restore an old year's profitability, raise the GROSS PROFIT proportion of sales.", "Ratios: current ratio = CA/CL (liquidity, short-term bills). Debt-to-assets = TL/TA (solvency, leverage). Profit margin = NI/sales."]]];
const $=s=>document.getElementById(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TABS=[["fc","Flashcards"],["mc","MCQs"],["sq","Sequencing"],["mt","Matching"],["nt","Notes"]];

TABS.forEach(([k,lbl],i)=>{const b=document.createElement("button");b.className="tab"+(i?"":" on");b.textContent=lbl;b.onclick=()=>showTab(k);b.id="t-"+k;$("tabs").appendChild(b)});

/* FLASHCARDS */
let fcOrder=sh(FLASH.map((_,i)=>i)),fcI=0,fcFlip=false;
function fcRender(){
  const [term,def]=FLASH[fcOrder[fcI]];
  $("fc-panel").innerHTML=
   '<div class="bar"><button class="nav" id="fcShuf">shuffle</button><span class="pos">'+(fcI+1)+' / '+FLASH.length+'</span></div>'+
   '<div class="fc" id="fcCard"><div class="tag">'+(fcFlip?"definition":"term")+'</div>'+
   '<div class="face '+(fcFlip?"fcdef":"term")+'">'+esc(fcFlip?def:term)+'</div>'+
   '<div class="flip">tap to flip</div></div>'+
   '<div class="act"><button class="nav" id="fcPrev">‹ prev</button><button class="nav" id="fcNext">next ›</button></div>';
  $("fcCard").onclick=()=>{fcFlip=!fcFlip;fcRender()};
  $("fcShuf").onclick=()=>{fcOrder=sh(fcOrder);fcI=0;fcFlip=false;fcRender()};
  $("fcPrev").onclick=()=>{fcI=(fcI-1+FLASH.length)%FLASH.length;fcFlip=false;fcRender()};
  $("fcNext").onclick=()=>{fcI=(fcI+1)%FLASH.length;fcFlip=false;fcRender()};
}

let mcFilter="",mcList=[],mcI=0,mcOpts=[],mcDone=false,mcSel=new Set();
function mcBuild(){mcList=MCQS.map((_,i)=>i).filter(i=>!mcFilter||MCQS[i][4]===mcFilter);mcI=0;mcRender()}
function mcRender(){
  if(!mcList.length){$("mc-panel").innerHTML="<p>None.</p>";return}
  const i=mcList[mcI],m=MCQS[i],multi=isMulti(i);
  mcOpts=sh(m[1].map((t,oi)=>({oi,text:t})));mcDone=false;mcSel=new Set();
  const tops=[...new Set(MCQS.map(x=>x[4]))];
  let h='<div class="bar"><select id="mcTopic"><option value="">All topics</option>'+tops.map(t=>'<option'+(t===mcFilter?' selected':'')+'>'+t+'</option>').join('')+'</select><span class="pos">'+(mcI+1)+' / '+mcList.length+'</span></div>';
  h+='<div class="mcq"><div class="topic">'+m[4]+'</div><p class="q">'+esc(m[0])+'</p>';
  if(multi)h+='<p class="hint">Select all that apply ('+m[2].length+'), then Check.</p>';
  h+='<div id="mcOpts">';
  mcOpts.forEach((o,d)=>{h+='<div class="opt" data-d="'+d+'"><span class="ltr">'+"ABCDEF"[d]+'</span><span>'+esc(o.text)+'</span></div>'});
  h+='</div>';
  if(multi)h+='<div class="act"><button class="check" id="mcChk">Check</button></div>';
  h+='<div class="exp" id="mcExp"></div></div>';
  h+='<div class="act"><button class="nav" id="mcPrev">‹ prev</button><button class="nav" id="mcNext">next ›</button></div>';
  $("mc-panel").innerHTML=h;
  $("mcTopic").onchange=()=>{mcFilter=$("mcTopic").value;mcBuild()};
  document.querySelectorAll("#mcOpts .opt").forEach(o=>o.onclick=()=>mcPick(+o.dataset.d));
  if(multi)$("mcChk").onclick=mcReveal;
  $("mcPrev").onclick=()=>{mcI=(mcI-1+mcList.length)%mcList.length;mcRender()};
  $("mcNext").onclick=()=>{mcI=(mcI+1)%mcList.length;mcRender()};
}
function mcPick(d){
  if(mcDone)return;const i=mcList[mcI];
  if(isMulti(i)){const el=document.querySelector('#mcOpts .opt[data-d="'+d+'"]');if(mcSel.has(d)){mcSel.delete(d);el.classList.remove("sel")}else{mcSel.add(d);el.classList.add("sel")}return}
  mcSel=new Set([d]);mcReveal();
}
function mcReveal(){
  mcDone=true;const i=mcList[mcI],cs=corrSet(i);
  const chosen=new Set([...mcSel].map(d=>mcOpts[d].oi));
  const ok=chosen.size===cs.size&&[...chosen].every(x=>cs.has(x));
  document.querySelectorAll("#mcOpts .opt").forEach(el=>{const oi=mcOpts[+el.dataset.d].oi;el.style.pointerEvents="none";el.classList.remove("sel");
    if(cs.has(oi))el.classList.add("correct");else if(chosen.has(oi))el.classList.add("wrong");else el.classList.add("dim")});
  const e=$("mcExp");e.className="exp show";e.innerHTML="<b>"+(ok?"Correct.":"Answer above.")+"</b> "+esc(MCQS[i][3]);
}

/* SEQUENCING */
let sqI=0,sqOrder=[],sqPick=[];
function sqRender(){
  const [title,steps]=SEQ[sqI];sqPick=[];
  if(!sqOrder.length||sqOrder._for!==sqI){sqOrder=sh(steps.map((_,i)=>i));sqOrder._for=sqI}
  let h='<div class="bar"><select id="sqSel">'+SEQ.map((s,i)=>'<option'+(i===sqI?' selected':'')+'>'+esc(s[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap the steps in the correct order.</div><div id="sqList">';
  sqOrder.forEach(oi=>{h+='<button class="seqitem" data-oi="'+oi+'"><span class="num"></span><span>'+esc(steps[oi])+'</span></button>'});
  h+='</div><div class="act"><button class="check" id="sqChk">Check order</button><button class="nav" id="sqRst">reset</button></div><div class="res" id="sqRes"></div>';
  $("sq-panel").innerHTML=h;
  $("sqSel").onchange=()=>{sqI=$("sqSel").selectedIndex;sqOrder=[];sqRender()};
  document.querySelectorAll("#sqList .seqitem").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi;if(sqPick.includes(oi))return;sqPick.push(oi);
    b.classList.add("picked");b.querySelector(".num").textContent=sqPick.length;
  });
  $("sqChk").onclick=()=>{
    if(sqPick.length<steps.length){$("sqRes").textContent="Place all "+steps.length+" steps first.";return}
    let right=0;document.querySelectorAll("#sqList .seqitem").forEach(b=>{const oi=+b.dataset.oi;const pos=sqPick.indexOf(oi);
      b.classList.remove("ok","no");if(pos===oi){b.classList.add("ok");right++}else b.classList.add("no")});
    $("sqRes").innerHTML=right===steps.length?'<span style="color:var(--good)">Correct order ✓</span>':right+' / '+steps.length+' in the right spot. Red = wrong position.';
  };
  $("sqRst").onclick=()=>{sqRender()};
}

/* MATCHING */
let mtI=0,mtRight=[],mtLeftSel=null,mtPairs={};
function mtRender(){
  const [title,pairs]=MATCH[mtI];mtLeftSel=null;mtPairs={};
  mtRight=sh(pairs.map((p,i)=>({i,text:p[1]})));
  let h='<div class="bar"><select id="mtSel">'+MATCH.map((m,i)=>'<option'+(i===mtI?' selected':'')+'>'+esc(m[0])+'</option>').join('')+'</select></div>';
  h+='<div class="hint">Tap a term, then its match.</div><div class="cols"><div id="mtL"></div><div id="mtR"></div></div>';
  h+='<div class="act"><button class="check" id="mtChk">Check</button><button class="nav" id="mtRst">reset</button></div><div class="res" id="mtRes"></div>';
  $("mt-panel").innerHTML=h;
  let L='';pairs.forEach((p,i)=>{L+='<button class="mitem" data-li="'+i+'"><span>'+esc(p[0])+'</span></button>'});$("mtL").innerHTML=L;
  let R='';mtRight.forEach(r=>{R+='<button class="mitem" data-ri="'+r.i+'"><span>'+esc(r.text)+'</span></button>'});$("mtR").innerHTML=R;
  $("mtSel").onchange=()=>{mtI=$("mtSel").selectedIndex;mtRender()};
  document.querySelectorAll("#mtL .mitem").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#mtL .mitem").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");mtLeftSel=+b.dataset.li});
  document.querySelectorAll("#mtR .mitem").forEach(b=>b.onclick=()=>{
    if(mtLeftSel===null)return;const ri=+b.dataset.ri;
    Object.keys(mtPairs).forEach(k=>{if(mtPairs[k]===ri)delete mtPairs[k]});
    mtPairs[mtLeftSel]=ri;
    document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.toggle("matched",li in mtPairs);if(li===mtLeftSel)x.classList.remove("sel")});
    document.querySelectorAll("#mtR .mitem").forEach(x=>{const r=+x.dataset.ri;x.classList.toggle("matched",Object.values(mtPairs).includes(r))});
    mtLeftSel=null;
  });
  $("mtChk").onclick=()=>{
    let right=0;document.querySelectorAll("#mtL .mitem").forEach(x=>{const li=+x.dataset.li;x.classList.remove("miss");
      if(mtPairs[li]===li)right++;else if(li in mtPairs)x.classList.add("miss")});
    $("mtRes").innerHTML=right===pairs.length?'<span style="color:var(--good)">All matched ✓</span>':right+' / '+pairs.length+' correct. Red = wrong match.';
  };
  $("mtRst").onclick=()=>mtRender();
}

/* NOTES */
function ntRender(){
  let h='';NOTES.forEach((n,i)=>{h+='<div class="note'+(i?'':' open')+'"><h3>'+esc(n[0])+'<span class="ch">'+(i?'+':'–')+'</span></h3><ul>'+n[1].map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>'});
  $("nt-panel").innerHTML=h;
  document.querySelectorAll(".note h3").forEach(hd=>hd.onclick=()=>{const n=hd.parentElement;n.classList.toggle("open");hd.querySelector(".ch").textContent=n.classList.contains("open")?'–':'+'});
}

fcRender();mcBuild();sqRender();mtRender();ntRender();showTab("fc");
</script></body></html>
