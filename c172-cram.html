["Match the command to its job",[["netstat","Active TCP connections + ports"],["ifconfig","Linux IP/subnet config"],["ipconfig","Windows adapter config"],["dig","Detailed Linux DNS lookup"],["nslookup","Query a domain's IP"],["tracert","Trace hop path (Windows)"]]],

["Match the attack to its description",[["War driving","Scanning Wi-Fi from a moving car"],["War chalking","Chalk symbols marking open Wi-Fi"],["Ping flood","ICMP echo-request DoS"],["Deauthentication","Forged frames kick clients off Wi-Fi"],["Man-in-the-middle","Intercept + alter traffic"]]],
["Match the regulation to its domain",[["GLBA","Financial institutions"],["HIPAA","Healthcare data"],["FERPA","Student records"],["GDPR","EU personal data"],["SOX","Corporate financial reporting"]]],
["Match the security team to its role",[["Red team","Attack"],["Blue team","Defend"],["White team","Oversight / referee"],["Purple team","Integrate red + blue"]]],
];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

// FLASHCARDS
let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

// MCQ
function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));/*reorder by writing shuffled*/const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

// SEQUENCING
function buildSQ(){$("#sqlist").innerHTML=SEQUENCES.map((s,si)=>{
  const items=shuf(s[1].map((t,i)=>[t,i]));
  const rows=items.map(([t,i])=>`<div class="slot" draggable="true" data-correct="${i}"><span class="num"></span><span>${t}</span></div>`).join("");
  return `<div class="q"><div class="qn">${s[0]}</div><div class="seq" id="seq${si}">${rows}</div><div class="bar" style="margin-top:8px"><button class="btn" data-check="${si}">check order</button><span class="exp" style="display:block;border:0;background:0;padding:0">${s[2]}</span></div></div>`}).join("");
  $$(".seq").forEach(seq=>enableDrag(seq))}
function enableDrag(seq){let dragEl=null;
  seq.addEventListener("dragstart",e=>{dragEl=e.target.closest(".slot");dragEl.classList.add("dragging")});
  seq.addEventListener("dragend",e=>{if(dragEl)dragEl.classList.remove("dragging");dragEl=null});
  seq.addEventListener("dragover",e=>{e.preventDefault();const after=getAfter(seq,e.clientY);if(!dragEl)return;if(after==null)seq.appendChild(dragEl);else seq.insertBefore(dragEl,after)})}
function getAfter(seq,y){const els=[...seq.querySelectorAll(".slot:not(.dragging)")];return els.reduce((c,ch)=>{const box=ch.getBoundingClientRect();const off=y-box.top-box.height/2;if(off<0&&off>c.offset)return{offset:off,element:ch};return c},{offset:-Infinity}).element}
$("#sqlist").addEventListener("click",e=>{const b=e.target.closest("[data-check]");if(!b)return;const seq=$("#seq"+b.dataset.check);[...seq.children].forEach((row,idx)=>{const ok=+row.dataset.correct==idx;row.classList.toggle("ok",ok);row.classList.toggle("no",!ok);row.querySelector(".num").textContent=idx+1})});

// MATCHING
function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

// NOTES
const NOTES=`
<div class="warn"><b>OA reality check:</b> C172 is taxonomy matching, not deep theory. Lock the categories and the cut rules below, drill the 60 MCQs twice, and you sit it today. One bug to know: WGU's Q8 marks <span class="k">ipconfig</span> correct for a Linux user. That's wrong, the answer is <span class="k">ifconfig</span>. If it reappears verbatim with the same key, their key wants ipconfig.</div>
<h3>Networking Basics: devices, topology, cable</h3>
<p><b>Devices:</b> access point = extend Wi-Fi, switch = same LAN (Layer 2/MAC), router = between networks (Layer 3), modem = ISP link.</p>
<p><b>Topologies:</b> bus = one shared trunk (everyone hears everything), ring = two neighbors in a loop, star = central hub, mesh = everything to everything (redundancy), hybrid = mix.</p>
<div class="cut"><b>Cut rules:</b> "trunk cable / shared backbone" -> <span class="k">Bus</span>. "two adjacent / loop" -> <span class="k">Ring</span>. "every device to every device / redundancy" -> <span class="k">Mesh</span>. "combine topologies" -> <span class="k">Hybrid</span>. "10 Gbps copper short distance" -> <span class="k">CAT 6a</span>.</div>
<h3>Commands</h3>
<p><span class="k">netstat</span> = active TCP connections + ports. <span class="k">ifconfig</span> = Linux IP/subnet. <span class="k">ipconfig</span> = Windows adapter. <span class="k">dig</span> = detailed Linux DNS lookup. <span class="k">nslookup</span> = query a domain's IP. <span class="k">tracert/traceroute</span> = hop path.</p>
<div class="cut"><b>Cut rules:</b> "connections + ports" -> <span class="k">netstat</span>. "Linux IP/subnet" -> <span class="k">ifconfig</span>. "detailed DNS lookup" -> <span class="k">dig</span>. "query domain's IP" -> <span class="k">nslookup</span>.</div>
<h3>OSI model</h3>
<div class="mn"><b>Mnemonic (L1 to L7):</b> <span class="k">Please Do Not Throw Sausage Pizza Away</span> = Physical, Data Link, Network, Transport, Session, Presentation, Application. Picture someone begging you not to throw out their sausage pizza.</div>
<div class="cut"><b>Cut rules:</b> "routing / packet headers" -> <span class="k">Network (3)</span>. "TCP / reliable / connections / ports" -> <span class="k">Transport (4)</span>. "session / persistent connection" -> <span class="k">Session (5)</span>. "HTTP / FTP / DNS" -> <span class="k">Application (7)</span>.</div>
<h3>Cloud &amp; virtualization</h3>
<p><b>Hypervisors:</b> Type 1 = bare metal, directly on hardware. Type 2 = hosted, on top of a host OS.</p>
<div class="mn"><b>Mnemonic:</b> Type <span class="k">1</span> sits on <span class="k">terra firma</span> (the bare metal ground). Type <span class="k">2</span> is on the <span class="k">2nd floor</span> (on top of the OS).</div>
<p><b>Cloud models:</b> private = one org, public = anyone, community = a group of orgs with a shared concern (agencies, hospitals), hybrid = mix.</p>
<div class="cut"><b>Cut rules:</b> "directly on hardware/server" -> <span class="k">Type 1</span>. "inside existing OS" -> <span class="k">Type 2</span>. "multiple orgs/agencies share" -> <span class="k">Community</span>. "one org, self-hosted" -> <span class="k">Private</span>. "anyone online" -> <span class="k">Public</span>.</div>
<h3>Attacks, threats, risk</h3>
<p><b>Risk vocab:</b> vulnerability = the flaw, threat = who/what exploits it, risk = likelihood x impact, asset = what you protect.</p>
<div class="mn"><b>War driving vs chalking:</b> DRIVING = in a car driving around scanning. CHALKING = CHALK on the sidewalk. Picture a car cruising the block vs a kid drawing on the pavement.</div>
<p><b>Attack keywords:</b> phishing = deceptive email/attachment, brute-force = automated cracking, MITM = intercept + alter, ping flood = ICMP echo DoS, deauth = forged disassociation frames, script kiddie = prebuilt tools, insider threat = harm from inside (even accidental).</p>
<div class="mn"><b>Teams:</b> Red attacks, Blue defends, White referees, Purple blends. Picture a paintball match: red shirts attacking, blue shirts defending, a white-striped ref watching, purple = the coach who debriefs both.</div>
<h3>CIA triad</h3>
<p><b>Confidentiality</b> = keep it secret (encryption, access control, biometrics, 2FA, stop interception). <b>Integrity</b> = keep it unchanged (hashing, detect tampering, anti-malware). <b>Availability</b> = keep it reachable (backups, redundancy, uptime).</p>
<div class="cut"><b>Cut rules:</b> "hashing / altered / modified / tampering" -> <span class="k">Integrity</span>. "backup / accessible / uptime / outage" -> <span class="k">Availability</span>. "secret / access restriction / intercept / 2FA / biometric" -> <span class="k">Confidentiality</span>.</div>
<h3>Security design principles (Saltzer-Schroeder)</h3>
<div class="cut"><b>Cut rules:</b> "simplify / reduce complexity / less code" -> <span class="k">Economy of mechanism</span>. "check EVERY access / session timeout recheck" -> <span class="k">Complete mediation</span>. "two people approve" -> <span class="k">Separation of privilege</span>. "block all except explicitly allowed / deny by default" -> <span class="k">Default deny (fail-safe defaults)</span>. "minimum access needed" -> <span class="k">Least privilege</span>.</div>
<h3>Security devices &amp; data protection</h3>
<div class="mn"><b>IPS vs IDS:</b> IPS <span class="k">P</span>revents (active, blocks). IDS <span class="k">D</span>etects (passive, alerts only). Bouncer who throws you out vs a camera that just records.</div>
<div class="cut"><b>Cut rules:</b> "block/shut down attack in real time" -> <span class="k">IPS</span>. "lost laptop, protect data" -> <span class="k">Full-disk encryption</span>. "stored passwords" -> <span class="k">Hashing + salting</span>. "Wi-Fi data in transit" -> <span class="k">WPA3</span>. "bolster data protection after attacks" -> <span class="k">Restoration/backup policies</span>. "slow encryption" -> <span class="k">Strong algorithms (CPU cost)</span>.</div>
<h3>Auth &amp; access (AAA)</h3>
<div class="mn"><b>AAA nightclub:</b> <span class="k">Authentication</span> = bouncer checks your ID (who you are). <span class="k">Authorization</span> = the VIP wristband sets which rooms you enter (what you can do). <span class="k">Accounting</span> = the camera logs everywhere you went (what you did).</div>
<div class="cut"><b>Cut rules:</b> "tracks/logs connection attempts" -> <span class="k">Accounting</span>. "stolen credentials / verify identity" -> <span class="k">Authentication</span>. "smart card + fingerprint / two factors" -> <span class="k">MFA</span>.</div>
<h3>Governance &amp; regulations</h3>
<div class="cut"><b>Cut rules:</b> "financial institution, info-sharing disclosure" -> <span class="k">GLBA</span>. "health" -> <span class="k">HIPAA</span>. "EU consent" -> <span class="k">GDPR</span>. "California" -> <span class="k">CCPA</span>. "student records" -> <span class="k">FERPA</span>. "corporate financial reporting" -> <span class="k">SOX</span>. "record of IT resources" -> <span class="k">Asset inventory</span>.</div>
`;
$("#notes").innerHTML=NOTES;

renderChips();buildFC();buildMC();buildSQ();buildMA();
</script></body></html>
