<script>

["Confidentiality","Keep data secret. Control who can read or access it. Triggers: encrypt, secret, access control, 2FA, biometric, smart card, prevent interception/eavesdropping.","CIA Triad"],

["A bank texts a one-time code to your phone that you enter after your password. Which CIA principle does this protect?",["Authentication","Confidentiality","Integrity","Availability"],1,"2FA controls WHO gets in, which keeps data secret -> Confidentiality. Authentication is the planted decoy; it is an AAA member, not a CIA principle.","CIA Triad"],

["A hospital keeps three synchronized copies of records across data centers so care continues if one site fails. Which CIA principle?",["Confidentiality","Integrity","Availability","Authentication"],2,"Redundancy and backup keep data reachable -> Availability.","CIA Triad"],
["A laptop requires a fingerprint scan before the OS unlocks. Which CIA principle does this support?",["Authentication","Confidentiality","Integrity","Availability"],1,"Biometric restricts access, which keeps data secret -> Confidentiality. Authentication is the decoy: it is an AAA member, not CIA.","CIA Triad"],

["A user presents a smart card plus a PIN to verify identity before entry. Which AAA function (the method is MFA)?",["Authentication","Confidentiality","Accounting","Authorization"],0,"Verifying identity with two factors -> Authentication. MFA is the method, the function is still Authentication.","AAA"],
["A system uses a smart card plus a PIN to prove a user is who they claim. Which AAA function, and would this ever be a CIA answer?",["Authentication; never a CIA answer","Confidentiality","Accounting","Authorization"],0,"Proving identity -> Authentication, an AAA function. Authentication is never a CIA principle (CIA = C/I/A only).","Traps"],
["A question names 'CIA' and lists Authentication as an option. What do you do with Authentication?",["Pick it if 2FA is mentioned","Cross it out; it is not a CIA member","Pick it for any login scenario","It depends on the OS"],1,"Authentication is never a CIA principle. Cross it out before reading the scenario.","Traps"],

const SEQUENCES=[
["AAA: the order a request passes through",["Authentication (prove who you are)","Authorization (decide what you can do)","Accounting (log what you did)"],"Who -> Where -> What. Bouncer checks your ID, wristband sets your rooms, the tab logs every drink. Auditing is not in this chain."],

["CIA: scenario -> principle",[["Encrypt a database at rest","Confidentiality"],["Hash a file to detect tampering","Integrity"],["Failover cluster keeps the site reachable","Availability"]]],

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildSQ(){$("#sqlist").innerHTML=SEQUENCES.map((s,si)=>{
  const items=shuf(s[1].map((t,i)=>[t,i]));
  const rows=items.map(([t,i])=>`<div class="slot" draggable="true" data-correct="${i}"><span class="num"></span><span>${t}</span></div>`).join("");
  return `<div class="q"><div class="qn">${s[0]}</div><div class="seq" id="seq${si}">${rows}</div><div class="bar" style="margin-top:8px"><button class="btn" data-check="${si}">check order</button><span class="exp" style="display:block;border:0;background:0;padding:0">${s[2]}</span></div></div>`}).join("");
  $$(".seq").forEach(seq=>enableDrag(seq))}
function enableDrag(seq){let dragEl=null;
  seq.addEventListener("dragstart",e=>{dragEl=e.target.closest(".slot");dragEl.classList.add("dragging")});
  seq.addEventListener("dragend",e=>{if(dragEl)dragEl.classList.remove("dragging");dragEl=null});
  seq.addEventListener("dragover",e=>{e.preventDefault();const after=getAfter(seq,e.clientY);if(!dragEl)return;if(after==null)seq.appendChild(dragEl);else seq.insertBefore(dragEl,after)})}
function getAfter(seq,y){const els=[...seq.querySelectorAll(".slot:not(.dragging)")];return els.reduce((c,ch)=>{const box=ch.getBoundingClientRect();const off=y-box.top-box.height/2;if(off<0&&off>c.offset)return{offset:off,element:ch};return c},{offset:-Infinity}).element}
$("#sqlist").addEventListener("click",e=>{const b=e.target.closest("[data-check]");if(!b)return;const seq=$("#seq"+b.dataset.check);[...seq.children].forEach((row,idx)=>{const ok=+row.dataset.correct==idx;row.classList.toggle("ok",ok);row.classList.toggle("no",!ok);row.querySelector(".num").textContent=idx+1})});

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

const NOTES=`
<div class="warn"><b>Why this set exists:</b> two decoys have beaten you in graded drills. <span class="k">Authentication</span> baits CIA questions, <span class="k">Auditing</span> baits AAA questions. Both are planted to look right. Lock the two carry cards below and you stop losing points to them.</div>
<h3>The two carry cards (memorize these cold)</h3>
<div class="mn"><b>CIA</b> = <span class="k">Confidential, Intact, Available</span>. Same first letters as the acronym. The A is <span class="k">Available</span>, NOT Authentication.</div>
<div class="mn"><b>AAA</b> = <span class="k">AuthN, AuthZ, Acct</span>. AuthN = <span class="k">Name</span> (who you are). AuthZ = <span class="k">Zones</span> (what you can access). Acct = <span class="k">Account</span> (the tab: what you did). The third A is <span class="k">Accounting</span>, NOT Auditing.</div>
<h3>CIA triad</h3>
<p><b>Confidentiality</b> = keep it secret. Control who can read it. <b>Integrity</b> = keep it unaltered. Detect tampering. <b>Availability</b> = keep it reachable. Stay up.</p>
<div class="cut"><b>Cut rules:</b> "encrypt / secret / access control / 2FA / biometric / intercept" -> <span class="k">Confidentiality</span>. "hashing / digital signature / altered / modified / tampered" -> <span class="k">Integrity</span>. "backup / redundancy / failover / uptime / outage" -> <span class="k">Availability</span>.</div>
<div class="warn"><b>The CIA plant:</b> in a "which CIA principle" question, <span class="k">Authentication</span> is never correct. 2FA, biometrics, and smart cards all map to <span class="k">Confidentiality</span> here because they control WHO gets in. Cross out Authentication before you read the scenario.</div>
<h3>AAA framework</h3>
<p><b>Authentication</b> = prove who you are (password, biometric, smart card, username+password). <b>Authorization</b> = decide what you can do (permissions, RBAC, folder access). <b>Accounting</b> = record what you did (logging, session time, data used, billing).</p>
<div class="mn"><b>Order:</b> <span class="k">Who -> Where -> What.</span> Bouncer checks your ID (AuthN), wristband sets your rooms (AuthZ), the bar tab logs every drink (Acct).</div>
<div class="cut"><b>Cut rules:</b> "validate password / verify identity / stolen credentials / smart card" -> <span class="k">Authentication</span>. "role decides access / permissions / RBAC / which folders" -> <span class="k">Authorization</span>. "logs / records / tracks / session time / data used / billing" -> <span class="k">Accounting</span>.</div>
<div class="warn"><b>The AAA plant:</b> <span class="k">Auditing</span> is NOT one of the three A's. Anything about logging, records, or billing is <span class="k">Accounting</span>, because the accountant keeps the books. If "Auditing" is an option in an AAA question, cross it out on sight. It is always wrong.</div>
<h3>AuthN vs AuthZ (the split that flips people)</h3>
<p>Authentication proves identity. Authorization grants access. They are sequential: you authenticate first, then the system authorizes what you can reach.</p>
<div class="mn"><b>Lock it:</b> AuthN -> <span class="k">N for Name</span> (who you are). AuthZ -> <span class="k">Z for Zones</span> (what you can enter). "Checks your password" = N. "Decides your permissions" = Z.</div>
<h3>The shared bait</h3>
<p><span class="k">Authentication</span> is a real, valid member of AAA. It is a fake, planted decoy in CIA. Same word, two different verdicts. The framework named in the question is what tells you whether it is a live answer or a trap.</p>
