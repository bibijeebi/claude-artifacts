<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg: #0a0e0d;
  --surface: #131918;
  --surface-2: #1a2221;
  --border: #2a3534;
  --text: #e8efe7;
  --text-dim: #8c9b95;
  --accent: #d4ff3a;       /* electric lime — biology vibes */
  --accent-2: #ff6b3d;     /* warm orange */
  --accent-3: #5fc7d1;     /* cyan teal */
  --pink: #ff70a8;
  --green: #6ee094;
  --red: #ff5577;
  --yellow: #ffd166;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { overflow-x: hidden; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(212, 255, 58, 0.04), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(95, 199, 209, 0.04), transparent 50%);
}

.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Fraunces', serif; }

/* ============ HEADER ============ */
header {
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 1.5rem 1rem;
  position: sticky;
  top: 0;
  background: rgba(10, 14, 13, 0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 1rem;
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  letter-spacing: -0.02em;
  line-height: 1;
}

h1 .accent { color: var(--accent); font-style: italic; }

.subtitle {
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ============ TABS ============ */
.tabs {
  display: flex;
  gap: 0.25rem;
  padding: 1rem 1.5rem 0;
  max-width: 1400px;
  margin: 0 auto;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.tab:hover {
  border-color: var(--accent);
  color: var(--text);
}

.tab.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}

/* ============ MAIN ============ */
main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

.section { display: none; }
.section.active { display: block; animation: fadeIn 0.3s; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ FILTER ============ */
.filter-bar {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-right: 0.5rem;
}

.filter-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.4rem 0.9rem;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover { color: var(--text); }
.filter-btn.active {
  background: var(--accent-3);
  color: var(--bg);
  border-color: var(--accent-3);
  font-weight: 700;
}

.stats-pill {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--surface);
  padding: 0.4rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.stats-pill strong { color: var(--accent); }

/* ============ FLASHCARDS ============ */
.flashcard-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.flashcard {
  width: 100%;
  max-width: 700px;
  min-height: 340px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: transform 0.15s, border-color 0.2s;
  overflow: hidden;
}

.flashcard:hover { border-color: var(--accent-3); }
.flashcard:active { transform: scale(0.99); }

.flashcard::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-3));
  opacity: 0.7;
}

.fc-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: space-between;
}

.fc-tag {
  background: var(--surface-2);
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  border: 1px solid var(--border);
}

.fc-content {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  line-height: 1.4;
  flex: 1;
  display: flex;
  align-items: center;
}

.fc-state {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 1rem;
}

.fc-controls {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.7rem 1.4rem;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 700;
}

.btn.primary:hover { background: var(--bg); color: var(--accent); }

.btn.bad { color: var(--red); border-color: var(--red); }
.btn.bad:hover { background: var(--red); color: var(--bg); }
.btn.good { color: var(--green); border-color: var(--green); }
.btn.good:hover { background: var(--green); color: var(--bg); }

/* ============ MCQ ============ */
.mcq-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 800px;
  margin: 0 auto;
}

.mcq-question {
  font-family: 'Fraunces', serif;
  font-size: 1.3rem;
  margin-bottom: 1.5rem;
  line-height: 1.4;
}

.mcq-options { display: flex; flex-direction: column; gap: 0.65rem; }

.mcq-option {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.2rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-size: 0.95rem;
  color: var(--text);
  font-family: inherit;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
}

.mcq-option:hover {
  border-color: var(--accent-3);
  background: var(--surface);
}

.mcq-option .letter {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--text-dim);
  flex-shrink: 0;
}

.mcq-option.correct {
  background: rgba(110, 224, 148, 0.12);
  border-color: var(--green);
  color: var(--text);
}

.mcq-option.correct .letter { color: var(--green); }

.mcq-option.wrong {
  background: rgba(255, 85, 119, 0.12);
  border-color: var(--red);
}

.mcq-option.wrong .letter { color: var(--red); }

.mcq-option:disabled { cursor: default; }

.mcq-explain {
  margin-top: 1.25rem;
  padding: 1rem 1.2rem;
  background: var(--surface-2);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--text-dim);
  display: none;
}

.mcq-explain.show { display: block; }
.mcq-explain strong { color: var(--accent); }

.mcq-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}

.mcq-progress {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ============ SEQUENCING ============ */
.seq-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 800px;
  margin: 0 auto 1.5rem;
}

.seq-title {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}

.seq-tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  background: var(--surface-2);
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  margin-bottom: 1rem;
  border: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.seq-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 1rem 0;
}

.seq-item {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  cursor: grab;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  transition: all 0.15s;
  font-size: 0.95rem;
}

.seq-item:active { cursor: grabbing; }
.seq-item.dragging { opacity: 0.4; transform: scale(0.98); }
.seq-item.drag-over { border-color: var(--accent); }

.seq-item.correct {
  border-color: var(--green);
  background: rgba(110, 224, 148, 0.08);
}

.seq-item.wrong {
  border-color: var(--red);
  background: rgba(255, 85, 119, 0.08);
}

.seq-handle {
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  width: 1.5rem;
  flex-shrink: 0;
}

.seq-content { flex: 1; }

.seq-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.seq-explanation {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--surface-2);
  border-left: 3px solid var(--accent-3);
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
  color: var(--text-dim);
  line-height: 1.5;
  display: none;
}

.seq-explanation.show { display: block; }

/* ============ MATCHING (LABELING) ============ */
.match-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  max-width: 1000px;
  margin: 0 auto 1.5rem;
}

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.5rem;
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

@media (max-width: 600px) {
  .match-grid { grid-template-columns: 1fr; }
}

.match-col-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.5rem;
}

.match-item {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
  color: var(--text);
}

.match-item:hover { border-color: var(--accent-3); }
.match-item.selected { border-color: var(--accent); background: var(--surface); }
.match-item.matched-correct { border-color: var(--green); background: rgba(110, 224, 148, 0.1); cursor: default; }
.match-item.matched-wrong { border-color: var(--red); background: rgba(255, 85, 119, 0.1); }
.match-item.faded { opacity: 0.5; }

/* ============ NOTES ============ */
.notes-section {
  max-width: 900px;
  margin: 0 auto;
}

.note-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 1.5rem;
}

.note-block h2 {
  font-family: 'Fraunces', serif;
  font-size: 1.8rem;
  margin-bottom: 1.5rem;
  font-weight: 700;
  color: var(--accent);
}

.note-block h3 {
  font-family: 'Fraunces', serif;
  font-size: 1.25rem;
  margin: 1.5rem 0 0.75rem;
  font-weight: 600;
  color: var(--accent-3);
}

.note-block h3:first-of-type { margin-top: 0; }

.note-block p {
  margin-bottom: 0.75rem;
  white-space: pre-wrap;
  color: var(--text);
  line-height: 1.7;
}

.note-block strong { color: var(--accent); }

/* ============ EMPTY STATES ============ */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.2rem;
}

/* ============ MOBILE ============ */
@media (max-width: 600px) {
  header { padding: 1rem; }
  main { padding: 1.5rem 1rem 4rem; }
  .flashcard { padding: 1.5rem 1.2rem; }
  .fc-content { font-size: 1.1rem; }
  .mcq-card, .seq-card, .match-card, .note-block { padding: 1.5rem 1.2rem; }
  .mcq-question { font-size: 1.1rem; }
  .seq-title, .match-card h2 { font-size: 1.2rem; }
}
</style>
</head>

<body>

<header>
  <div class="title-row">
    <div>
      <h1>BCH351 <span class="accent">Final Cram</span></h1>

<script>
// ============================================================
// BCH351 Lectures 19-20 Study Data
// TCA Cycle + Regulation
// ============================================================

const FLASHCARDS = [
  // ============ LECTURE 19: TCA CYCLE ============
  // Big picture / stages
  { topic: "L19", q: "Three stages of aerobic respiration?", a: "Stage 1: fuels (carbs, fats, AAs) → acetyl-CoA. Stage 2: TCA cycle oxidizes acetyl-CoA → CO2 + reduced carriers + small ATP. Stage 3: oxidative phosphorylation reoxidizes carriers → ATP, with O2 as terminal e- acceptor." },
  { topic: "L19", q: "Where does the TCA cycle take place?", a: "Mitochondrial matrix (inside inner membrane)." },
  { topic: "L19", q: "Which TCA enzyme is NOT in the matrix?", a: "Succinate dehydrogenase — embedded in the inner mitochondrial membrane (also Complex II of ETC)." },
  { topic: "L19", q: "Three other names for the TCA cycle?", a: "Citric acid cycle, Krebs cycle, tricarboxylic acid cycle." },
  { topic: "L19", q: "Two main functions of the TCA cycle?", a: "1) Produce energy (NADH, FADH2, GTP). 2) Produce key anabolic intermediates (amino acid precursors, heme, etc.)." },
  { topic: "L19", q: "How does pyruvate enter the mitochondrion?", a: "Through the Mitochondrial Pyruvate Carrier (MPC) in the inner mitochondrial membrane." },
  { topic: "L19", q: "Is pyruvate dehydrogenase part of the TCA cycle?", a: "No — it's the entry step (step 0). It produces acetyl-CoA, which then enters the cycle." },

  // Overall reaction
  { topic: "L19", q: "Overall reaction of the TCA cycle?", a: "Acetyl-CoA + 3 NAD+ + FAD + GDP + Pi + 2 H2O → CoA-SH + 3 NADH + FADH2 + GTP + 2 CO2 + 2 H+" },
  { topic: "L19", q: "Per turn of the TCA cycle, how many CO2, NADH, FADH2, GTP?", a: "2 CO2, 3 NADH, 1 FADH2, 1 GTP (per acetyl-CoA in)." },
  { topic: "L19", q: "Per glucose, how many ATP from TCA + PDH (ultimate)?", a: "Roughly 30-32 ATP total (glycolysis + PDH + TCA + OxPhos). PDH+TCA portion alone ≈ 25 ATP per glucose." },

  { topic: "L19", q: "Step 5 of PDH (E3)?", a: "FADH2 transfers e- to NAD+ → NADH + H+ (and FAD is regenerated)." },

  { topic: "L19", q: "Step 1 of TCA: enzyme and reaction?", a: "Citrate synthase: Acetyl-CoA + OAA + H2O → Citrate + CoA-SH. Condensation. ΔG°' = -32.2 kJ/mol (irreversible)." },
  { topic: "L19", q: "Step 2 of TCA: enzyme and reaction?", a: "Aconitase: Citrate ⇌ cis-Aconitate ⇌ Isocitrate (via dehydration then hydration). ΔG°' = +13.3 kJ/mol (reversible — proceeds forward because isocitrate is consumed)." },
  { topic: "L19", q: "Step 3 of TCA: enzyme and reaction?", a: "Isocitrate dehydrogenase: Isocitrate + NAD+ → α-ketoglutarate + CO2 + NADH. Oxidative decarboxylation. ΔG°' ~ -30 kJ/mol (irreversible)." },
  { topic: "L19", q: "Step 4 of TCA: enzyme and reaction?", a: "α-ketoglutarate dehydrogenase complex: α-KG + CoA-SH + NAD+ → Succinyl-CoA + CO2 + NADH. ΔG°' = -33.5 kJ/mol (irreversible)." },
  { topic: "L19", q: "Step 5 of TCA: enzyme and reaction?", a: "Succinyl-CoA synthetase (succinic thiokinase): Succinyl-CoA + GDP + Pi ⇌ Succinate + GTP + CoA-SH. ΔG°' = -2.9 kJ/mol (reversible). Substrate-level phosphorylation." },
  { topic: "L19", q: "Step 6 of TCA: enzyme and reaction?", a: "Succinate dehydrogenase: Succinate + Q ⇌ Fumarate + QH2. (FAD → FADH2 internally.) ΔG°' ≈ 0. The only TCA enzyme in the inner membrane = Complex II of ETC." },
  { topic: "L19", q: "Step 7 of TCA: enzyme and reaction?", a: "Fumarase (fumarate hydratase): Fumarate + H2O ⇌ L-Malate. ΔG°' = -3.8 kJ/mol (reversible)." },
  { topic: "L19", q: "Step 8 of TCA: enzyme and reaction?", a: "L-malate dehydrogenase: L-Malate + NAD+ ⇌ OAA + NADH + H+. ΔG°' = +29.7 kJ/mol (proceeds forward because OAA is consumed by citrate synthase)." },

  { topic: "L19", q: "Stereospecificity of fumarase?", a: "Only acts on trans-fumarate (not cis-maleate) and produces L-malate (not D-malate). Strictly stereospecific." },
  { topic: "L19", q: "Why does malate DH proceed despite +ΔG°' = +29.7?", a: "OAA is immediately consumed by citrate synthase (highly exergonic, ΔG°' = -32.2). Le Chatelier pulls the reaction forward — [OAA] is kept extremely low." },
  { topic: "L19", q: "Mechanism of citrate synthase?", a: "Sequential binding: OAA binds first, induces a conformational change that creates the acetyl-CoA binding site. After condensation to citroyl-CoA, another conformational change hydrolyzes off the CoA → citrate." },

  { topic: "L19", q: "Difference between photoautotroph and chemoautotroph?", a: "Photoautotroph (plants): energy from sunlight. Chemoautotroph (deep-vent bacteria): energy from oxidizing inorganic compounds (H2S, S, NH3, H2, Fe2+)." },
  { topic: "L19", q: "Which enzymes replace key TCA enzymes in rTCA?", a: "ATP-citrate lyase replaces citrate synthase, fumarate reductase replaces succinate DH, 2-oxoglutarate carboxylase replaces α-KG DH." },

  { topic: "L20", q: "Why is enzyme regulation only effective on far-from-equilibrium reactions?", a: "Reactions at equilibrium (ΔG ≈ 0) flow either way based on substrate/product. Only highly exergonic, irreversible steps can be controlled to throttle flux. Reversible steps adjust passively to concentrations." },
  { topic: "L20", q: "Four primary regulated steps of pyruvate→TCA flow?", a: "1) PDH complex (entry). 2) Citrate synthase (committed step). 3) Isocitrate DH. 4) α-KG DH. All have large negative ΔG°'." },

  // PDH regulation
  { topic: "L20", q: "Two mechanisms regulating the PDH complex?", a: "1) Feedback inhibition (product inhibition by acetyl-CoA on E2, NADH on E3). 2) Covalent modification by phosphorylation (mammals only — primary regulation)." },
  { topic: "L20", q: "What activates the PDH complex (allosteric)?", a: "Substrates: pyruvate, NAD+, CoA-SH. Energy poor signals: ADP, AMP. Also Mg2+, Ca2+ (during muscle contraction), insulin." },
  { topic: "L20", q: "What inhibits the PDH complex (allosteric)?", a: "Products: acetyl-CoA, NADH (energy-rich state). Also ATP." },
  { topic: "L20", q: "What does pyruvate dehydrogenase kinase do?", a: "Phosphorylates E1 of the PDH complex → INACTIVE PDH. Activated by NADH, acetyl-CoA, ATP (energy-rich signals)." },
  { topic: "L20", q: "What does pyruvate dehydrogenase phosphatase do?", a: "Removes phosphate from E1 → ACTIVE PDH. Activated by Mg2+, Ca2+ (muscle contraction signal)." },
  { topic: "L20", q: "Energy-rich state: PDH active or inactive?", a: "INACTIVE. High NADH/ATP/acetyl-CoA → activates kinase → phosphorylates E1 → PDH off (no need to make more acetyl-CoA)." },
  { topic: "L20", q: "Energy-poor state: PDH active or inactive?", a: "ACTIVE. High ADP/pyruvate → activates phosphatase → dephosphorylates E1 → PDH on (make acetyl-CoA to fuel TCA)." },
  { topic: "L20", q: "Why does Mg2+ activate PDH phosphatase?", a: "Free Mg2+ is high when ATP is LOW (most Mg2+ is bound to ATP). So free Mg2+ signals 'energy poor' → activate phosphatase → activate PDH." },
  { topic: "L20", q: "Why does Ca2+ activate PDH phosphatase?", a: "Ca2+ rises during muscle contraction — signals 'energy needed NOW.' Activates phosphatase → PDH on → more acetyl-CoA → more ATP." },
  { topic: "L20", q: "How many PDH kinase isozymes? PDH phosphatase isozymes?", a: "4 kinase isozymes; 2 phosphatase isozymes. Tissue-specific ratios determine baseline PDH activity in different tissues." },
  { topic: "L20", q: "Are kinase/phosphatase part of PDH complex?", a: "Yes — they're integrated within the PDH complex itself (regulatory enzymes embedded in the multi-enzyme complex)." },
  { topic: "L20", q: "Is PDH phosphorylation regulation universal?", a: "No — only in mammals. Smaller eukaryotes and prokaryotes lack the PDH kinase/phosphatase system; they regulate by feedback inhibition only." },

  { topic: "L20", q: "How does citrate regulate glycolysis?", a: "Citrate INHIBITS PFK-1 (key glycolysis enzyme). Signals 'TCA is full' — no need to push more pyruvate down glycolysis." },
  { topic: "L20", q: "How does acetyl-CoA regulate pyruvate kinase?", a: "Acetyl-CoA INHIBITS pyruvate kinase. Signals 'don't make more pyruvate, we have plenty of fuel.'" },

  { topic: "L20", q: "What is the glyoxylate cycle?", a: "A SHUNT of the TCA cycle in plants/microorganisms. Bypasses the two CO2-releasing steps. Net: 2 acetyl-CoA → succinate (no CO2 lost). Allows fatty acid → glucose conversion." },

  } else if (f === 'ALL') {
    STATE.fc.list = [...FLASHCARDS];
  } else {
    STATE.fc.list = FLASHCARDS.filter(c => c.topic === f);
  }
  STATE.fc.idx = 0;
  STATE.fc.flipped = false;
  fcRender();
}

function fcRender() {
  const list = STATE.fc.list;
  const stats = document.getElementById('fc-stats');
  if (list.length === 0) {
    document.getElementById('fc-text').textContent = 'No cards in this filter.';
    document.getElementById('fc-tag').textContent = '—';
    document.getElementById('fc-pos').textContent = '0 / 0';
    document.getElementById('fc-state').textContent = '';
    stats.innerHTML = `<strong>0</strong> known / <strong>0</strong>`;
    return;
  }
  const card = list[STATE.fc.idx];
  document.getElementById('fc-text').textContent = STATE.fc.flipped ? card.a : card.q;
  document.getElementById('fc-state').textContent = STATE.fc.flipped ? '— answer —' : '— click to flip —';
  document.getElementById('fc-tag').textContent = card.topic;
  document.getElementById('fc-pos').textContent = `${STATE.fc.idx + 1} / ${list.length}`;

  const origIdx = FLASHCARDS.indexOf(card);
  document.getElementById('fc-star').textContent = STATE.fc.starred.has(origIdx) ? '★ Starred' : '⭐ Star';

  const known = STATE.fc.list.filter(c => STATE.fc.known.has(FLASHCARDS.indexOf(c))).length;
  stats.innerHTML = `<strong>${known}</strong> known / <strong>${list.length}</strong>`;
}

document.getElementById('flashcard').addEventListener('click', () => {
  STATE.fc.flipped = !STATE.fc.flipped;
  fcRender();
});

document.getElementById('fc-next').addEventListener('click', e => {
  e.stopPropagation();
  if (STATE.fc.list.length === 0) return;
  STATE.fc.idx = (STATE.fc.idx + 1) % STATE.fc.list.length;
  STATE.fc.flipped = false;
  fcRender();
});

document.getElementById('fc-prev').addEventListener('click', e => {
  e.stopPropagation();
  if (STATE.fc.list.length === 0) return;
  STATE.fc.idx = (STATE.fc.idx - 1 + STATE.fc.list.length) % STATE.fc.list.length;
  STATE.fc.flipped = false;
  fcRender();
});

document.getElementById('fc-good').addEventListener('click', e => {
  e.stopPropagation();
  if (STATE.fc.list.length === 0) return;
  const origIdx = FLASHCARDS.indexOf(STATE.fc.list[STATE.fc.idx]);
  STATE.fc.known.add(origIdx);
  localStorage.setItem('bch351-final3-known', JSON.stringify([...STATE.fc.known]));
  STATE.fc.idx = (STATE.fc.idx + 1) % STATE.fc.list.length;
  STATE.fc.flipped = false;
  fcRender();
});

document.getElementById('fc-bad').addEventListener('click', e => {
  e.stopPropagation();
  if (STATE.fc.list.length === 0) return;
  const origIdx = FLASHCARDS.indexOf(STATE.fc.list[STATE.fc.idx]);
  STATE.fc.known.delete(origIdx);
  STATE.fc.starred.add(origIdx);
  localStorage.setItem('bch351-final3-known', JSON.stringify([...STATE.fc.known]));
  localStorage.setItem('bch351-final3-starred', JSON.stringify([...STATE.fc.starred]));
  STATE.fc.idx = (STATE.fc.idx + 1) % STATE.fc.list.length;
  STATE.fc.flipped = false;
  fcRender();
});

document.getElementById('fc-star').addEventListener('click', e => {
  e.stopPropagation();
  if (STATE.fc.list.length === 0) return;
  const origIdx = FLASHCARDS.indexOf(STATE.fc.list[STATE.fc.idx]);
  if (STATE.fc.starred.has(origIdx)) {
    STATE.fc.starred.delete(origIdx);
  } else {
    STATE.fc.starred.add(origIdx);
  }
  localStorage.setItem('bch351-final3-starred', JSON.stringify([...STATE.fc.starred]));
  fcRender();
});

document.getElementById('fc-shuffle').addEventListener('click', e => {
  e.stopPropagation();
  for (let i = STATE.fc.list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [STATE.fc.list[i], STATE.fc.list[j]] = [STATE.fc.list[j], STATE.fc.list[i]];
  }
  STATE.fc.idx = 0;
  STATE.fc.flipped = false;
  fcRender();
});

// ============================================================
// MCQ
// ============================================================
function mcqRebuild() {
  const f = STATE.mcq.filter;
  if (f === 'MISSED') {
    STATE.mcq.list = MCQS.filter((_, i) => STATE.mcq.missed.has(i));
  } else if (f === 'ALL') {
    STATE.mcq.list = [...MCQS];
  } else {
    STATE.mcq.list = MCQS.filter(c => c.topic === f);
  }
  STATE.mcq.idx = 0;
  mcqRender();
}

function mcqRender() {
  const list = STATE.mcq.list;
  if (list.length === 0) {
    document.getElementById('mcq-q').textContent = 'No questions in this filter.';
    document.getElementById('mcq-opts').innerHTML = '';
    document.getElementById('mcq-exp').classList.remove('show');
    document.getElementById('mcq-prog').textContent = '0 / 0';
    return;
  }
  const q = list[STATE.mcq.idx];
  const origIdx = MCQS.indexOf(q);
  document.getElementById('mcq-q').textContent = q.q;
  document.getElementById('mcq-prog').textContent = `${STATE.mcq.idx + 1} / ${list.length}`;

  const opts = document.getElementById('mcq-opts');
  opts.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const previous = STATE.mcq.answered[origIdx];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'mcq-option';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    if (previous !== undefined) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === previous) btn.classList.add('wrong');
    }
    btn.addEventListener('click', () => {
      STATE.mcq.answered[origIdx] = i;
      if (i !== q.answer) STATE.mcq.missed.add(origIdx);
      else STATE.mcq.missed.delete(origIdx);
      mcqRender();
    });
    opts.appendChild(btn);
  });

  const exp = document.getElementById('mcq-exp');
  if (previous !== undefined) {
    const isCorrect = previous === q.answer;
    exp.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'} —</strong> ${q.explanation}`;
    exp.classList.add('show');
  } else {
    exp.classList.remove('show');
  }

  const correct = Object.entries(STATE.mcq.answered).filter(([i, a]) => MCQS[i].answer === a).length;
  const total = Object.keys(STATE.mcq.answered).length;
  document.getElementById('mcq-stats').innerHTML = `Score: <strong>${correct}</strong>/${total} (missed: ${STATE.mcq.missed.size})`;
}

document.getElementById('mcq-next').addEventListener('click', () => {
  if (STATE.mcq.list.length === 0) return;
  STATE.mcq.idx = (STATE.mcq.idx + 1) % STATE.mcq.list.length;
  mcqRender();
});

document.getElementById('mcq-prev').addEventListener('click', () => {
  if (STATE.mcq.list.length === 0) return;
  STATE.mcq.idx = (STATE.mcq.idx - 1 + STATE.mcq.list.length) % STATE.mcq.list.length;
  mcqRender();
});

// ============================================================
// SEQUENCE
// ============================================================
function seqRender() {
  const f = STATE.seq.filter;
  const list = f === 'ALL' ? SEQUENCES : SEQUENCES.filter(s => s.topic === f);
  const root = document.getElementById('seq-list');
  root.innerHTML = '';
  if (list.length === 0) {
    root.innerHTML = '<div class="empty">No sequences in this filter.</div>';
    return;
  }
  list.forEach((seq, sIdx) => {
    const origIdx = SEQUENCES.indexOf(seq);
    const card = document.createElement('div');
    card.className = 'seq-card';
    const shuffled = [...seq.items];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    card.innerHTML = `
      <span class="seq-tag">${seq.topic}</span>
      <h3 class="seq-title">${seq.title}</h3>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Drag the items into the correct order, then check.</p>
      <ul class="seq-list" data-seq-idx="${origIdx}"></ul>
      <div class="seq-actions">
        <button class="btn primary" data-action="check" data-seq-idx="${origIdx}">Check Order</button>
        <button class="btn" data-action="shuffle" data-seq-idx="${origIdx}">Shuffle</button>
        <button class="btn" data-action="reveal" data-seq-idx="${origIdx}">Show Answer</button>
      </div>
      <div class="seq-explanation" id="seq-exp-${origIdx}"></div>
    `;
    root.appendChild(card);
    const ul = card.querySelector('.seq-list');
    shuffled.forEach((item, i) => {
      const li = document.createElement('li');
      li.className = 'seq-item';
      li.draggable = true;
      li.innerHTML = `<span class="seq-handle">⋮⋮</span><span class="seq-content">${item}</span>`;
      li.dataset.text = item;
      addDragHandlers(li, ul);
      ul.appendChild(li);
    });
  });

  root.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.seqIdx;
      const seq = SEQUENCES[idx];
      const ul = document.querySelector(`.seq-list[data-seq-idx="${idx}"]`);
      const exp = document.getElementById(`seq-exp-${idx}`);
      if (btn.dataset.action === 'check') {
        const items = [...ul.querySelectorAll('.seq-item')];
        items.forEach((li, i) => {
          li.classList.remove('correct', 'wrong');
          if (li.dataset.text === seq.items[i]) li.classList.add('correct');
          else li.classList.add('wrong');
        });
        const allRight = items.every((li, i) => li.dataset.text === seq.items[i]);
        exp.innerHTML = allRight ? `<strong style="color: var(--green)">✓ Perfect!</strong> ${seq.explanation}` : `<strong style="color: var(--red)">Not quite —</strong> ${seq.explanation}`;
        exp.classList.add('show');
      } else if (btn.dataset.action === 'reveal') {
        ul.innerHTML = '';
        seq.items.forEach(item => {
          const li = document.createElement('li');
          li.className = 'seq-item correct';
          li.draggable = true;
          li.innerHTML = `<span class="seq-handle">⋮⋮</span><span class="seq-content">${item}</span>`;
          li.dataset.text = item;
          addDragHandlers(li, ul);
          ul.appendChild(li);
        });
        exp.innerHTML = `<strong>Answer revealed.</strong> ${seq.explanation}`;
        exp.classList.add('show');
      } else if (btn.dataset.action === 'shuffle') {
        const items = [...ul.children];
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        ul.innerHTML = '';
        items.forEach(li => {
          li.classList.remove('correct', 'wrong');
          ul.appendChild(li);
        });
        exp.classList.remove('show');
      }
    });
  });
}

let dragSrc = null;
function addDragHandlers(li, ul) {
  li.addEventListener('dragstart', e => {
    dragSrc = li;
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  li.addEventListener('dragend', () => {
    li.classList.remove('dragging');
    ul.querySelectorAll('.seq-item').forEach(x => x.classList.remove('drag-over'));
  });
  li.addEventListener('dragover', e => {
    e.preventDefault();
    if (dragSrc === li) return;
    li.classList.add('drag-over');
  });
  li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
  li.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragSrc || dragSrc === li) return;
    const all = [...ul.children];
    const srcIdx = all.indexOf(dragSrc);
    const tgtIdx = all.indexOf(li);
    if (srcIdx < tgtIdx) ul.insertBefore(dragSrc, li.nextSibling);
    else ul.insertBefore(dragSrc, li);
    li.classList.remove('drag-over');
    ul.querySelectorAll('.seq-item').forEach(x => x.classList.remove('correct', 'wrong'));
  });

  let touchTimer;
  li.addEventListener('touchstart', e => {
    touchTimer = setTimeout(() => {
      if (!dragSrc) {
        dragSrc = li;
        li.style.background = 'var(--accent)';
        li.style.color = 'var(--bg)';
      } else if (dragSrc !== li) {
        const tmp = dragSrc.innerHTML;
        const tmpData = dragSrc.dataset.text;
        dragSrc.innerHTML = li.innerHTML;
        dragSrc.dataset.text = li.dataset.text;
        li.innerHTML = tmp;
        li.dataset.text = tmpData;
        dragSrc.style.background = '';
        dragSrc.style.color = '';
        dragSrc = null;
      }
    }, 300);
  });
  li.addEventListener('touchend', () => clearTimeout(touchTimer));
  li.addEventListener('touchmove', () => clearTimeout(touchTimer));
}

// ============================================================
// MATCH
// ============================================================
function matchRender() {
  const f = STATE.match.filter;
  const list = f === 'ALL' ? LABELING : LABELING.filter(m => m.topic === f);
  const root = document.getElementById('match-list');
  root.innerHTML = '';
  if (list.length === 0) {
    root.innerHTML = '<div class="empty">No matching exercises in this filter.</div>';
    return;
  }
  list.forEach((m, mIdx) => {
    const origIdx = LABELING.indexOf(m);
    const card = document.createElement('div');
    card.className = 'match-card';

    const lefts = m.pairs.map(p => p.left);
    const rights = m.pairs.map(p => p.right);
    const shuffledRights = [...rights];
    for (let i = shuffledRights.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledRights[i], shuffledRights[j]] = [shuffledRights[j], shuffledRights[i]];
    }

    card.innerHTML = `
      <span class="seq-tag">${m.topic}</span>
      <h3 class="seq-title">${m.title}</h3>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Click an item on the left, then its match on the right.</p>
      <div class="match-grid" data-match-idx="${origIdx}">
        <div class="match-col">
          <div class="match-col-header">Term</div>
          ${lefts.map((l, i) => `<button class="match-item" data-side="left" data-match-idx="${origIdx}" data-text="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join('')}
        </div>
        <div class="match-col">
          <div class="match-col-header">Definition</div>
          ${shuffledRights.map((r, i) => `<button class="match-item" data-side="right" data-match-idx="${origIdx}" data-text="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('')}
        </div>
      </div>
      <div class="seq-actions" style="margin-top: 1.25rem;">
        <button class="btn" data-match-action="reset" data-match-idx="${origIdx}">Reset</button>
        <button class="btn" data-match-action="reveal" data-match-idx="${origIdx}">Show Answers</button>
        <span class="match-progress" style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-dim); align-self: center;" id="match-prog-${origIdx}">0 / ${m.pairs.length} matched</span>
      </div>
    `;
    root.appendChild(card);

    card.querySelectorAll('.match-item').forEach(btn => {
      btn.addEventListener('click', () => handleMatchClick(btn, origIdx, m));
    });
    card.querySelectorAll('button[data-match-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.matchAction === 'reset') {
          STATE.match.selected[origIdx] = null;
          card.querySelectorAll('.match-item').forEach(it => {
            it.className = 'match-item';
            it.disabled = false;
          });
          updateMatchProg(origIdx, m);
        } else if (btn.dataset.matchAction === 'reveal') {
          const lookup = {};
          m.pairs.forEach(p => { lookup[p.left] = p.right; });
          card.querySelectorAll('.match-item[data-side="left"]').forEach(leftBtn => {
            const rightText = lookup[leftBtn.dataset.text];
            const rightBtn = card.querySelector(`.match-item[data-side="right"][data-text="${CSS.escape(rightText)}"]`);
            leftBtn.className = 'match-item matched-correct';
            leftBtn.disabled = true;
            if (rightBtn) {
              rightBtn.className = 'match-item matched-correct';
              rightBtn.disabled = true;
            }
          });
          document.getElementById(`match-prog-${origIdx}`).textContent = `${m.pairs.length} / ${m.pairs.length} revealed`;
        }
      });
    });
  });
}

function handleMatchClick(btn, mIdx, m) {
  if (btn.disabled) return;
  if (!STATE.match.selected[mIdx]) STATE.match.selected[mIdx] = null;
  const sel = STATE.match.selected[mIdx];
  const card = btn.closest('.match-card');

  if (!sel) {
    STATE.match.selected[mIdx] = btn;
    btn.classList.add('selected');
    return;
  }

  if (sel === btn) {
    btn.classList.remove('selected');
    STATE.match.selected[mIdx] = null;
    return;
  }

  if (sel.dataset.side === btn.dataset.side) {
    sel.classList.remove('selected');
    STATE.match.selected[mIdx] = btn;
    btn.classList.add('selected');
    return;
  }

  const leftBtn = sel.dataset.side === 'left' ? sel : btn;
  const rightBtn = sel.dataset.side === 'right' ? sel : btn;
  const leftText = leftBtn.dataset.text;
  const rightText = rightBtn.dataset.text;
  const correctRight = m.pairs.find(p => p.left === leftText)?.right;

  if (correctRight === rightText) {
    leftBtn.className = 'match-item matched-correct';
    rightBtn.className = 'match-item matched-correct';
    leftBtn.disabled = true;
    rightBtn.disabled = true;
  } else {
    leftBtn.classList.remove('selected');
    rightBtn.classList.remove('selected');
    leftBtn.classList.add('matched-wrong');
    rightBtn.classList.add('matched-wrong');
    setTimeout(() => {
      leftBtn.classList.remove('matched-wrong');
      rightBtn.classList.remove('matched-wrong');
    }, 700);
  }
  STATE.match.selected[mIdx] = null;
  updateMatchProg(mIdx, m);
}

function updateMatchProg(mIdx, m) {
  const card = document.querySelector(`.match-grid[data-match-idx="${mIdx}"]`).closest('.match-card');
  const matched = card.querySelectorAll('.match-item.matched-correct[data-side="left"]').length;
  document.getElementById(`match-prog-${mIdx}`).textContent = `${matched} / ${m.pairs.length} matched`;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============================================================
// NOTES
// ============================================================
function notesRender() {
  const root = document.getElementById('notes-content');
  root.innerHTML = '';
  Object.values(TOPIC_NOTES).forEach(note => {
    const block = document.createElement('div');
    block.className = 'note-block';
    block.innerHTML = `<h2>${note.title}</h2>` +
      note.sections.map(s => `<h3>${s.h}</h3><p>${escapeHtml(s.body).replace(/\n/g, '<br>')}</p>`).join('');
    root.appendChild(block);
  });
}

// ============================================================
// FILTER WIRING
// ============================================================
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.target;
    document.querySelectorAll(`.filter-btn[data-target="${target}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (target === 'fc') { STATE.fc.filter = btn.dataset.filter; fcRebuild(); }
    if (target === 'mcq') { STATE.mcq.filter = btn.dataset.filter; mcqRebuild(); }
    if (target === 'seq') { STATE.seq.filter = btn.dataset.filter; seqRender(); }
    if (target === 'match') { STATE.match.filter = btn.dataset.filter; matchRender(); }
  });
});

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', e => {
  if (document.querySelector('.section.active').id === 'flashcards') {
    if (e.key === 'ArrowRight') document.getElementById('fc-next').click();
    if (e.key === 'ArrowLeft') document.getElementById('fc-prev').click();
    if (e.key === ' ') { e.preventDefault(); document.getElementById('flashcard').click(); }
    if (e.key === 'g' || e.key === 'G') document.getElementById('fc-good').click();
    if (e.key === 'b' || e.key === 'B') document.getElementById('fc-bad').click();
    if (e.key === 's' || e.key === 'S') document.getElementById('fc-star').click();
  }
  if (document.querySelector('.section.active').id === 'mcq') {
    if (e.key === 'ArrowRight') document.getElementById('mcq-next').click();
    if (e.key === 'ArrowLeft') document.getElementById('mcq-prev').click();
  }
});

// ============================================================
// INIT
// ============================================================
fcRebuild();
mcqRebuild();
seqRender();
matchRender();
notesRender();
</script>
