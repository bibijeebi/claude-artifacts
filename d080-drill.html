<title>D080 Drill</title>
<meta property="og:title" content="D080 Rapid Drill">

<meta property="og:url" content="https://niggerfaggot.club/d080-drill">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e0d;--bg2:#101614;--bg3:#161e1b;--line:#1d2926;--ink:#e8efe9;--dim:#7e918a;--lime:#d4ff3a;--green:#3ad47e;--amber:#ffc24b;--red:#ff5c5c;--blue:#5cc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;height:100%}
h1,.fr{font-family:'Fraunces',serif}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 30px;min-height:100%;display:flex;flex-direction:column}
.title{font-size:24px;font-weight:900;letter-spacing:-.5px}.title b{color:var(--lime)}
.sub{color:var(--dim);font-size:11px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:10.5px;border-radius:20px;padding:5px 10px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--lime)}.chip.on{background:var(--lime);color:#0a0e0d;border-color:var(--lime);font-weight:700}
.track{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.fill{height:100%;background:var(--lime);width:0%;transition:width .3s}
.stat{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:14px}
.stat b{color:var(--lime)}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.qtag{color:var(--lime);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.qt{font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.3;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;transition:.1s}
.opt:hover{border-color:var(--lime)}
.opt .num{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.correct{border-color:var(--green);background:rgba(58,212,126,.16)}
.opt.correct .num{border-color:var(--green);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(255,92,92,.16)}
.opt.wrong .num{border-color:var(--red);color:var(--red)}
.opt.dim{opacity:.4}
.cont{text-align:center;margin-top:6px;font-size:12px;color:var(--amber);min-height:34px;display:flex;align-items:center;justify-content:center;gap:6px}
.exp{font-size:12.5px;color:var(--dim);line-height:1.5;margin:4px 0 8px;padding:10px 12px;background:var(--bg3);border-radius:9px;border-left:2px solid var(--amber)}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12px;border-radius:8px;padding:8px 16px;cursor:pointer}
.btn:hover{border-color:var(--lime)}
.done{text-align:center;padding:40px 10px}
.done .big{font-family:'Fraunces',serif;font-size:42px;font-weight:900;color:var(--green)}
.hide{display:none}
</style></head><body><div class="wrap">
<div class="title">D080 <b>Drill</b></div>
<div class="sub">auto-advances when right · misses come back until you nail each one twice · keys 1-4, space to continue</div>
<div class="chips" id="chips"></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="stat"><span>mastered <b id="mast">0</b> / <span id="tot">0</span></span><span>remaining <b id="rem">0</b></span></div>
<div class="qwrap" id="qwrap"></div>
</div>
<script>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();init()});

let queue=[],total=0,mastered=0,cur=null,locked=false,waiting=false;
function init(){
  const items=MCQS.map((m,i)=>i).filter(i=>topic==="All"||MCQS[i][4]===topic);
  total=items.length;mastered=0;
  queue=sh(items.map(i=>({i,c:0})));
  $("#tot").textContent=total;
  next();
}
function updateBar(){
  $("#mast").textContent=mastered;
  $("#rem").textContent=total-mastered;
  $("#fill").style.width=(total?Math.round(mastered/total*100):0)+"%";
}
function next(){
  locked=false;waiting=false;
  if(!queue.length){done();return;}
  cur=queue.shift();
  const m=MCQS[cur.i];
  const opts=sh(m[1].map((o,oi)=>({o,oi})));
  cur._opts=opts;
  let html=`<div class="qtag">${m[4]} · need ${2-cur.c} more</div><div class="qt">${m[0]}</div><div id="opts">`;
  html+=opts.map((x,disp)=>`<button class="opt" data-disp="${disp}" data-oi="${x.oi}"><span class="num">${disp+1}</span><span>${x.o}</span></button>`).join("");
  html+=`</div><div class="cont" id="cont"></div>`;
  $("#qwrap").innerHTML=html;
  updateBar();
}
function pick(disp){
  if(locked||waiting)return;
  const m=MCQS[cur.i];
  const x=cur._opts[disp];if(!x)return;
  const right=x.oi===m[2];
  const btns=$$("#opts .opt");
  if(right){
    locked=true;
    btns.forEach(b=>{if(+b.dataset.disp===disp)b.classList.add("correct");else b.classList.add("dim");b.style.pointerEvents="none"});
    cur.c++;
    if(cur.c>=2){mastered++;}else{queue.push(cur);}
    updateBar();
    setTimeout(next,430);
  } else {
    locked=true;waiting=true;
    cur.c=0;
    btns.forEach(b=>{const bi=+b.dataset.oi;if(+b.dataset.disp===disp)b.classList.add("wrong");if(bi===m[2])b.classList.add("correct");b.style.pointerEvents="none"});
    $("#cont").innerHTML=`<div class="exp">${m[3]}</div>`;
    const c=document.createElement("div");c.className="cont";c.innerHTML=`tap or press space to continue ▸`;$("#qwrap").appendChild(c);
    const posn=Math.min(4,queue.length);
    queue.splice(posn,0,cur);
  }
}
$("#qwrap").addEventListener("click",e=>{
  if(waiting){next();return;}
  const b=e.target.closest(".opt");if(!b)return;pick(+b.dataset.disp);
});
document.addEventListener("keydown",e=>{
  if(waiting&&(e.key===" "||e.key==="Enter")){e.preventDefault();next();return;}
  if(!locked&&!waiting&&["1","2","3","4"].includes(e.key)){pick(+e.key-1);}
});
function done(){
  $("#qwrap").innerHTML=`<div class="done"><div class="big">All ${total} mastered</div><div style="color:var(--dim);font-size:13px;margin:10px 0 20px">Every question answered correctly twice. Sit the OA or run it again.</div><button class="btn" onclick="init()">restart this set</button></div>`;
  $("#fill").style.width="100%";
}
renderChips();init();
</script></body></html>
