<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Proposals | Foreman Homestead</title>
<meta property="og:title" content="Project Proposals | Foreman Homestead">
<meta property="og:description" content="Active project proposals for the Foreman household. Browse by category, cost, and difficulty. Bekah picks, Benny builds.">
<meta property="og:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/og-proposals-hub-wide.jpg">
<meta property="og:url" content="https://niggerfaggot.club/proposals.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/og-proposals-hub-wide.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html, body { overflow-x: hidden; }
:root {
  --bark: #2C1810;
  --loam: #3D2914;
  --timber: #4A3320;
  --fence: #5C4033;
  --wire: #8B7355;
  --hay: #D4A843;
  --straw: #E8C878;
  --cream: #F5F0E1;
  --milk: #FDF8EF;
  --grass: #4A7C3F;
  --grass-light: #6BAF5B;
  --rust: #A0522D;
  --sky: #6AAFE6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Source Sans 3', system-ui, sans-serif;
  background: var(--cream);
  color: var(--bark);
  line-height: 1.7;
  font-size: 17px;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, var(--loam) 0%, var(--timber) 50%, var(--fence) 100%);
  color: var(--cream);
  padding: 3rem 1.5rem 2.5rem;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent 0px,
    transparent 20px,
    rgba(255,255,255,0.015) 20px,
    rgba(255,255,255,0.015) 22px
  );
}
.header-inner {
  position: relative;
  max-width: 960px;
  margin: 0 auto;
}
.header h1 {
  font-family: 'Fraunces', serif;
  font-size: clamp(2rem, 5vw, 2.8rem);
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 0.5rem;
}
.header .tagline {
  font-weight: 300;
  font-size: 1.05rem;
  color: var(--straw);
}
.header .stats {
  display: flex;
  gap: 2rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat-label {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--wire);
}
.stat-value {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  font-weight: 500;
  color: var(--straw);
}

.controls {
  max-width: 960px;
  margin: 0 auto;
  padding: 1.25rem 1.5rem;
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  background: white;
  border: 1px solid #d8d0c0;
  color: var(--fence);
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--hay); color: var(--loam); }
.filter-btn.active {
  background: var(--loam);
  color: var(--cream);
  border-color: var(--loam);
}
.sort-select {
  margin-left: auto;
  background: white;
  border: 1px solid #d8d0c0;
  color: var(--fence);
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 0.8rem;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

.grid {
  max-width: 960px;
  margin: 0 auto;
  padding: 0.5rem 1.5rem 4rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

.card {
  background: white;
  border: 1px solid #e8e0d0;
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(44, 24, 16, 0.1);
}
.card-accent {
  height: 4px;
  background: var(--hay);
}
.card-accent.homesteading { background: var(--grass); }
.card-accent.tech { background: var(--sky); }
.card-accent.home { background: var(--rust); }
.card-accent.health { background: #9B59B6; }
.card-accent.travel { background: #E67E22; }
.card-accent.food { background: #E74C3C; }
.card-accent.firearms { background: #4A5568; }

.card-body {
  padding: 1.25rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-number {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--wire);
  margin-bottom: 0.35rem;
}
.card-title {
  font-family: 'Fraunces', serif;
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--loam);
  margin-bottom: 0.5rem;
  line-height: 1.3;
}
.card-pitch {
  font-size: 0.9rem;
  color: var(--fence);
  flex: 1;
  margin-bottom: 1rem;
}
.card-meta {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  padding-top: 0.75rem;
  border-top: 1px solid #f0ebe0;
}
.card-meta-item {
  font-size: 0.75rem;
  color: var(--wire);
}
.card-meta-item strong {
  color: var(--timber);
  font-weight: 600;
}
.card-status {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 3px;
  margin-left: auto;
}
.card-status.proposed { background: #FEF3CD; color: #856404; }
.card-status.approved { background: #D4EDDA; color: #155724; }
.card-status.in-progress { background: #CCE5FF; color: #004085; }
.card-status.done { background: #E2E3E5; color: #383D41; }

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 2rem;
  color: var(--wire);
}
.empty-state p {
  font-family: 'Fraunces', serif;
  font-size: 1.2rem;
}

@media (max-width: 600px) {
  .header { padding: 2rem 1.25rem; }
  .controls { padding: 1rem 1.25rem; }
  .grid { padding: 0.5rem 1.25rem 3rem; grid-template-columns: 1fr; }
  .sort-select { margin-left: 0; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>Project Proposals</h1>
    <p class="tagline">Bekah picks, Benny builds. Browse what's on deck.</p>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="controls" id="controls"></div>

<div class="grid" id="grid">
  <div class="empty-state"><p>Loading proposals...</p></div>
</div>

<script>
const PROPOSALS = [
  {
    number: "001",
    title: "Outdoor Rabbitry",
    slug: "proposal-outdoor-rabbitry",
    category: "homesteading",
    cost_low: 275,
    cost_high: 375,
    difficulty: 3,
    time: "2–3 weekends",
    status: "proposed",
    pitch: "Full outdoor breeding infrastructure for Rabbi Yosef & Rabbi Thump. Elevated wire hutch, pin-hitch rabbit tractor, and scalable grow-out system."
  },
  {
    number: "002",
    title: "Scope Mount: Remington 511",
    slug: "proposal-511-scope-mount",
    category: "firearms",
    cost_low: 125,
    cost_high: 130,
    difficulty: 1,
    time: "1 trip",
    status: "proposed",
    pitch: "Drill and tap Granddad's Remington 511 Scoremaster for two Weaver #43 bases at Tar River Arms. One-hour gunsmith job, $100 labor + $25-30 parts. Scope-ready heirloom."
  }
];

function renderStats(proposals) {
  const total = proposals.length;
  const proposed = proposals.filter(p => p.status === 'proposed').length;
  const approved = proposals.filter(p => p.status === 'approved').length;
  const inProgress = proposals.filter(p => p.status === 'in-progress').length;
  const totalCostLow = proposals.reduce((s, p) => s + p.cost_low, 0);
  const totalCostHigh = proposals.reduce((s, p) => s + p.cost_high, 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-label">Total</span><span class="stat-value">${total}</span></div>
    <div class="stat"><span class="stat-label">Proposed</span><span class="stat-value">${proposed}</span></div>
    <div class="stat"><span class="stat-label">Approved</span><span class="stat-value">${approved}</span></div>
    <div class="stat"><span class="stat-label">In Progress</span><span class="stat-value">${inProgress}</span></div>
    <div class="stat"><span class="stat-label">Total Cost Range</span><span class="stat-value">$${totalCostLow}–$${totalCostHigh}</span></div>
  `;
}

function getCategories(proposals) {
  return [...new Set(proposals.map(p => p.category))];
}

let activeFilter = 'all';
let activeSort = 'number';

function renderControls(proposals) {
  const categories = getCategories(proposals);
  const controls = document.getElementById('controls');
  let html = `<button class="filter-btn ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">All</button>`;
  categories.forEach(cat => {
    const label = cat.charAt(0).toUpperCase() + cat.slice(1);
    html += `<button class="filter-btn ${activeFilter === cat ? 'active' : ''}" data-filter="${cat}">${label}</button>`;
  });
  html += `<select class="sort-select" id="sortSelect">
    <option value="number" ${activeSort === 'number' ? 'selected' : ''}>Sort: #</option>
    <option value="cost-low" ${activeSort === 'cost-low' ? 'selected' : ''}>Sort: Cost ↑</option>
    <option value="cost-high" ${activeSort === 'cost-high' ? 'selected' : ''}>Sort: Cost ↓</option>
    <option value="difficulty" ${activeSort === 'difficulty' ? 'selected' : ''}>Sort: Difficulty</option>
  </select>`;
  controls.innerHTML = html;

  controls.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      render(PROPOSALS);
    });
  });
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    activeSort = e.target.value;
    render(PROPOSALS);
  });
}

function sortProposals(proposals) {
  const sorted = [...proposals];
  switch(activeSort) {
    case 'cost-low': sorted.sort((a, b) => a.cost_low - b.cost_low); break;
    case 'cost-high': sorted.sort((a, b) => b.cost_high - a.cost_high); break;
    case 'difficulty': sorted.sort((a, b) => a.difficulty - b.difficulty); break;
    default: sorted.sort((a, b) => a.number.localeCompare(b.number));
  }
  return sorted;
}

function renderGrid(proposals) {
  let filtered = activeFilter === 'all' ? proposals : proposals.filter(p => p.category === activeFilter);
  filtered = sortProposals(filtered);

  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No proposals in this category yet.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <a href="/${p.slug}" class="card">
      <div class="card-accent ${p.category}"></div>
      <div class="card-body">
        <div class="card-number">Proposal #${p.number}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-pitch">${p.pitch}</div>
        <div class="card-meta">
          <span class="card-meta-item"><strong>$${p.cost_low}–$${p.cost_high}</strong></span>
          <span class="card-meta-item">Difficulty <strong>${p.difficulty}/5</strong></span>
          <span class="card-meta-item">${p.time}</span>
          <span class="card-status ${p.status}">${p.status}</span>
        </div>
      </div>
    </a>
  `).join('');
}

function render(proposals) {
  renderStats(proposals);
  renderControls(proposals);
  renderGrid(proposals);
}

render(PROPOSALS);
</script>

</body>
</html>
