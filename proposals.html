function renderStats(proposals) {
  const total = proposals.length;
  const proposed = proposals.filter(p => p.status === 'proposed').length;
  const draft = proposals.filter(p => p.status === 'draft').length;
  const approved = proposals.filter(p => p.status === 'approved').length;
  const inProgress = proposals.filter(p => p.status === 'in-progress').length;
  const done = proposals.filter(p => p.status === 'done').length;
  const totalCostLow = proposals.reduce((s, p) => s + p.cost_low, 0);
  const totalCostHigh = proposals.reduce((s, p) => s + p.cost_high, 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-label">Showing</span><span class="stat-value">${total}</span></div>
    <div class="stat"><span class="stat-label">Proposed</span><span class="stat-value">${proposed}</span></div>
    <div class="stat"><span class="stat-label">Approved</span><span class="stat-value">${approved}</span></div>
    <div class="stat"><span class="stat-label">In Progress</span><span class="stat-value">${inProgress}</span></div>
    <div class="stat"><span class="stat-label">Done</span><span class="stat-value">${done}</span></div>
    <div class="stat"><span class="stat-label">Cost Range</span><span class="stat-value">$${totalCostLow.toLocaleString()}–$${totalCostHigh.toLocaleString()}</span></div>
  `;
}

function getCategories(proposals) {
  return [...new Set(proposals.map(p => p.category))];
}

let activeFilter = 'all';
let activeSort = 'number';

function renderControls(proposals) {
  const categories = getCategories(proposals);
  const controls = document.getElementById('controls');
  let html = `<button class="filter-btn ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">All</button>`;
  categories.forEach(cat => {
    const label = cat.charAt(0).toUpperCase() + cat.slice(1);
    html += `<button class="filter-btn ${activeFilter === cat ? 'active' : ''}" data-filter="${cat}">${label}</button>`;
  });
  html += `<select class="sort-select" id="sortSelect">
    <option value="number" ${activeSort === 'number' ? 'selected' : ''}>Sort: #</option>
    <option value="cost-low" ${activeSort === 'cost-low' ? 'selected' : ''}>Sort: Cost ↑</option>
    <option value="cost-high" ${activeSort === 'cost-high' ? 'selected' : ''}>Sort: Cost ↓</option>
    <option value="difficulty" ${activeSort === 'difficulty' ? 'selected' : ''}>Sort: Difficulty</option>
  </select>`;
  controls.innerHTML = html;

  controls.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      render(PROPOSALS);
    });
  });
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    activeSort = e.target.value;
    render(PROPOSALS);
  });
}

function sortProposals(proposals) {
  const sorted = [...proposals];
  switch(activeSort) {
    case 'cost-low': sorted.sort((a, b) => a.cost_low - b.cost_low); break;
    case 'cost-high': sorted.sort((a, b) => b.cost_high - a.cost_high); break;
    case 'difficulty': sorted.sort((a, b) => a.difficulty - b.difficulty); break;
    default: sorted.sort((a, b) => a.number.localeCompare(b.number));
  }
  return sorted;
}

function cardHTML(p) {
  const isDone = p.status === 'done';
  const resultBlock = (isDone && p.result)
    ? `<div class="card-result"><span class="result-label">After-Action Report</span><span class="result-text">${p.result}</span></div>`
    : '';
  return `
    <a href="/${p.slug}" class="card${isDone ? ' is-done' : ''}">
      <div class="card-accent ${p.category}"></div>
      <div class="card-body">
        <div class="card-number">Proposal #${p.number}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-pitch">${p.pitch}</div>
        ${resultBlock}
        <div class="card-meta">
          <span class="card-meta-item"><strong>$${p.cost_low}–$${p.cost_high}</strong></span>
          <span class="card-meta-item">Difficulty <strong>${p.difficulty}/5</strong></span>
          <span class="card-meta-item">${p.time}</span>
          <span class="card-status ${p.status}">${p.status}</span>
        </div>
      </div>
    </a>`;
}

// --- Masonry layout engine: row-major order, shortest-column placement ---
function layoutMasonry(grid) {
  const cards = [...grid.querySelectorAll('.card')];
  if (cards.length === 0) { grid.style.height = ''; return; }

  const GAP = 16;
  const gridWidth = grid.clientWidth;
  const MIN_COL = 280;
  let cols = Math.max(1, Math.floor((gridWidth + GAP) / (MIN_COL + GAP)));
  const colWidth = (gridWidth - GAP * (cols - 1)) / cols;
  const colHeights = new Array(cols).fill(0);

  cards.forEach(card => {
    card.style.width = colWidth + 'px';
  });

  // measure after width is set
  cards.forEach((card, idx) => {
    let target;
    if (idx < cols) {
      // first row: one card per column, strict left-to-right
      target = idx;
    } else {
      // rest: shortest column, ties to leftmost -> keeps row-major feel
      target = 0;
      for (let i = 1; i < cols; i++) {
        if (colHeights[i] < colHeights[target] - 0.5) target = i;
      }
    }
    card.style.left = (target * (colWidth + GAP)) + 'px';
    card.style.top = colHeights[target] + 'px';
    colHeights[target] += card.offsetHeight + GAP;
  });

  grid.style.height = (Math.max(...colHeights) - GAP) + 'px';
}

function layoutAll() {
  layoutMasonry(document.getElementById('grid'));
  layoutMasonry(document.getElementById('doneGrid'));
}

function renderGrid(proposals) {
  let filtered = activeFilter === 'all' ? proposals : proposals.filter(p => p.category === activeFilter);
  filtered = sortProposals(filtered);

  const active = filtered.filter(p => p.status !== 'done');
  const done = filtered.filter(p => p.status === 'done');

  const grid = document.getElementById('grid');
  grid.style.height = '';
  if (active.length === 0 && done.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No proposals in this category yet.</p></div>';
  } else if (active.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>Nothing on deck in this category. Completed work below.</p></div>';
  } else {
    grid.innerHTML = active.map(cardHTML).join('');
  }

  const doneHead = document.getElementById('doneHead');
  const doneGrid = document.getElementById('doneGrid');
  doneGrid.style.height = '';
  if (done.length > 0) {
    doneHead.style.display = '';
    document.getElementById('doneCount').textContent = done.length;
    doneGrid.innerHTML = done.map(cardHTML).join('');
  } else {
    doneHead.style.display = 'none';
    doneGrid.innerHTML = '';
  }

  // first paint: place cards without the slide animation, then enable it
  const fresh = [...grid.querySelectorAll('.card'), ...doneGrid.querySelectorAll('.card')];
  fresh.forEach(c => c.classList.add('placing'));
  // wait a frame so fonts/images settle, then lay out
  requestAnimationFrame(() => {
    layoutAll();
    requestAnimationFrame(() => fresh.forEach(c => c.classList.remove('placing')));
  });
}

function getFiltered(proposals) {
  return activeFilter === 'all' ? proposals : proposals.filter(p => p.category === activeFilter);
}

function render(proposals) {
  const filtered = getFiltered(proposals);
  renderStats(filtered);
  renderControls(proposals);
  renderGrid(proposals);
}

// re-layout on resize (debounced) and once webfonts have loaded
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layoutAll, 120);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(layoutAll);
}


render(PROPOSALS);
</script>
