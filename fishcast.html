<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FishCast</title>
<meta property="og:title" content="FishCast - Fishing Intelligence">
<meta property="og:description" content="Solunar + weather + location. Three signals, one score. Wake County NC lakes.">
<meta property="og:url" content="https://niggerfaggot.club/fishcast">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
:root{
  --cream:#F7F3ED;--warm:#EDE7DC;--paper:#FFFFFF;
  --ink:#1a2633;--slate:#3d4f5f;--gray:#8b9299;--light:#c4c8cc;
  --gold:#c4841d;--amber:#e09b2d;--honey:#f0c040;
  --sage:#4a7c59;--water:#5a7a8a;--coral:#c45a3c;
  --shadow:0 1px 3px rgba(26,38,51,.06),0 4px 12px rgba(26,38,51,.04);
  --shadow2:0 2px 8px rgba(26,38,51,.08),0 8px 24px rgba(26,38,51,.06);
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:16px 16px 48px}

/* Header */
.masthead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.masthead h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;letter-spacing:-.5px}
.masthead .sub{font-size:11px;color:var(--gray);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.sol-strip{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--paper);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px;font-size:12px;color:var(--slate)}
.sol-strip .moon-i{font-size:18px}
.sol-strip .rating{font-weight:600;padding:2px 8px;border-radius:6px;font-size:11px;letter-spacing:.3px}
.r-Best{background:#f0e6d0;color:#9a6c14}.r-Good{background:#dfe9df;color:#3d6b4a}.r-Fair{background:#f0e4d0;color:#8a6830}.r-Poor{background:#f0d8d4;color:#8a3c30}
.sol-strip .zodiac{color:var(--gray)}
.sol-strip .cal-link{margin-left:auto;color:var(--gold);text-decoration:none;font-weight:600;font-size:11px}

/* Nav */
.nav{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--warm)}
.nav-item{padding:10px 16px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;letter-spacing:.2px}
.nav-item.active{color:var(--ink);border-bottom-color:var(--ink)}
.nav-item:hover:not(.active){color:var(--slate)}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--gray)}
.spin{width:28px;height:28px;border:2.5px solid var(--warm);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Planner */
.hero-card{background:var(--paper);border-radius:14px;box-shadow:var(--shadow2);padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.hero-card::after{content:'';position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle at 80% 20%,rgba(196,132,29,.06) 0%,transparent 70%);pointer-events:none}
.hero-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);font-weight:600;margin-bottom:10px}
.hero-inner{display:flex;align-items:center;gap:16px;cursor:pointer}
.hero-score{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;line-height:1;letter-spacing:-2px}
.hero-meta{flex:1;min-width:0}
.hero-lake{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;margin-bottom:2px}
.hero-when{font-size:13px;color:var(--gold);font-weight:600}
.hero-detail{font-size:11px;color:var(--gray);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.hero-arrow{font-size:22px;color:var(--light);margin-left:auto}

.filter-row{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--warm);color:var(--gray);background:var(--paper);transition:all .15s;white-space:nowrap;flex-shrink:0}
.chip.active{border-color:var(--ink);color:var(--ink);background:var(--paper);font-weight:600}
.chip:hover:not(.active){border-color:var(--light)}

.opp-list{display:flex;flex-direction:column;gap:6px}
.opp{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;transition:all .15s}
.opp:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.opp-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--light);width:18px;text-align:right;flex-shrink:0}
.opp-sc{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1;width:40px;text-align:center;flex-shrink:0}
.opp-body{flex:1;min-width:0}
.opp-top{display:flex;align-items:baseline;gap:6px}
.opp-name{font-weight:600;font-size:13px}
.opp-time{font-size:11px;color:var(--gold);font-weight:600}
.opp-info{font-size:10px;color:var(--gray);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.opp-why{font-size:10px;color:var(--slate);margin-top:1px}
.opp .arrow{color:var(--light);font-size:16px}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.cal-head button{background:var(--paper);border:1.5px solid var(--warm);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--slate);font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.cal-head button:hover{border-color:var(--gold);color:var(--gold)}
.cal-head .mo{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;min-width:180px;text-align:center}
.cal-head .today-btn{background:var(--ink);color:var(--cream);border:none;font-size:10px;padding:5px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.cal-lk{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.cal-dh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-c{background:var(--paper);border-radius:8px;padding:5px;min-height:68px;cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(26,38,51,.04)}
.cal-c:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cal-c.empty{background:transparent;box-shadow:none;cursor:default}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cal-c .cd{font-size:11px;font-weight:600;color:var(--ink)}
.cal-c .csc{font-family:'Playfair Display',serif;font-size:17px;text-align:center;margin:2px 0;line-height:1}
.cal-c .cph{font-size:13px;text-align:center}
.cal-c .czd{font-size:8px;color:var(--gray);text-align:center;letter-spacing:.3px}

/* Detail */
.back-btn{background:none;border:none;color:var(--gray);font-size:12px;cursor:pointer;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Sans',sans-serif;font-weight:500}
.back-btn:hover{color:var(--ink)}
.lake-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.lk-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid var(--warm);color:var(--gray);background:var(--paper);font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.lk-btn.active{border-color:var(--ink);color:var(--ink);font-weight:600}

.detail-hero{background:var(--paper);border-radius:16px;box-shadow:var(--shadow2);padding:24px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden}
.detail-hero::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--water),var(--gold),var(--sage))}
.dh-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;margin-bottom:2px}
.dh-when{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.ring-wrap{width:130px;height:130px;margin:0 auto 12px;position:relative}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .rbg{stroke:var(--warm);stroke-width:6;fill:none}
.ring-wrap .rfg{stroke-width:6;fill:none;stroke-linecap:round;transition:all .6s}
.ring-wrap .rtxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-wrap .rnum{font-family:'Playfair Display',serif;font-size:44px;font-weight:700;line-height:1;color:var(--ink)}
.ring-wrap .rlbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cond-row{display:flex;justify-content:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.cond{display:flex;flex-direction:column;align-items:center;gap:1px}
.cond .cc-i{font-size:18px}
.cond .cc-v{font-size:14px;font-weight:600;color:var(--ink)}
.cond .cc-l{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.3px}
.moon-strip{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--warm);font-size:12px;color:var(--gray)}
.moon-strip .m-n{color:var(--ink);font-weight:600}

.strategy{background:linear-gradient(135deg,rgba(196,132,29,.04),rgba(74,124,89,.03));border:1px solid var(--warm);border-radius:12px;padding:14px;margin-bottom:16px}
.strategy .st{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.strategy .sb{font-size:12px;color:var(--slate);line-height:1.5}

.day-row{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.day-row::-webkit-scrollbar{display:none}
.dy{background:var(--paper);border:1.5px solid var(--warm);padding:6px 10px;border-radius:10px;font-size:11px;cursor:pointer;text-align:center;min-width:54px;flex-shrink:0;transition:all .15s}
.dy.active{border-color:var(--ink)}
.dy .dy-n{font-weight:600;color:var(--slate);font-size:10px}
.dy .dy-s{font-family:'Playfair Display',serif;font-size:20px;line-height:1.2}

.panel{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.panel h3{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.w-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--warm)}
.w-item:last-child{border-bottom:none}
.w-rank{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);width:26px;text-align:center}
.w-info{flex:1}
.w-time{font-size:13px;font-weight:600;color:var(--ink)}
.w-why{font-size:10px;color:var(--gray);margin-top:1px}
.w-sc{font-family:'Playfair Display',serif;font-size:24px}

.hourly{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;scrollbar-width:none}
.hourly::-webkit-scrollbar{display:none}
.h-row{display:flex;gap:3px;width:max-content}
.h-c{width:48px;flex-shrink:0;background:var(--paper);border:1px solid var(--warm);border-radius:8px;padding:5px 3px;text-align:center}
.h-c.prime{border-color:var(--gold);background:rgba(196,132,29,.03)}
.h-c.now{box-shadow:inset 0 0 0 2px var(--gold)}
.h-c .hh{font-size:9px;color:var(--gray);font-weight:600}
.h-c .hicon{font-size:14px;margin:3px 0}
.h-c .hsc{font-family:'Playfair Display',serif;font-size:17px;line-height:1}
.h-c .ht{font-size:9px;color:var(--gray)}
.h-c .hbar{width:100%;height:18px;background:var(--warm);border-radius:2px;overflow:hidden;margin-top:3px;display:flex;align-items:flex-end}
.h-c .hfill{width:100%;border-radius:2px}
.sun-mk{width:48px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;font-size:9px;color:var(--gold);font-weight:700;gap:2px;border-radius:8px;background:rgba(196,132,29,.04);border:1px dashed rgba(196,132,29,.25)}
.sun-mk .si{font-size:16px}

.f-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--warm)}
.f-row:last-child{border-bottom:none}
.f-l{display:flex;align-items:center;gap:8px}
.f-i{font-size:15px;width:22px;text-align:center}
.f-n{font-size:12px;color:var(--slate)}
.f-r{display:flex;align-items:center;gap:6px}
.f-p{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:30px;text-align:right}
.f-p.pos{color:var(--sage)}.f-p.neg{color:var(--coral)}.f-p.neu{color:var(--light)}
.f-b{font-size:9px;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:.3px}
.fb-g{background:rgba(74,124,89,.1);color:var(--sage)}
.fb-k{background:rgba(196,132,29,.1);color:var(--gold)}
.fb-f{background:rgba(139,146,153,.1);color:var(--gray)}
.fb-p{background:rgba(196,90,60,.08);color:var(--coral)}
.fb-b{background:rgba(196,90,60,.15);color:var(--coral)}

.sp-panel{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sp-panel h3{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;margin-bottom:10px}
.sp{display:flex;align-items:center;gap:10px;padding:5px 0}
.sp .si{font-size:18px;width:24px;text-align:center}
.sp .sn{font-size:12px;font-weight:600;color:var(--ink)}
.sp .st{font-size:10px;color:var(--gray);margin-top:1px}

.section-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);font-weight:600;margin-bottom:8px}

@media(max-width:480px){
  .cal-c{min-height:56px;padding:3px}
  .cal-c .cd{font-size:10px}
  .cal-c .csc{font-size:14px}
  .opp-sc{font-size:24px;width:34px}
  .hero-score{font-size:44px}
}
</style>
</head>
<body>
<div class="app">
  <div class="masthead"><h1>FishCast</h1><span class="sub">Wake County NC</span></div>
  <div id="sol-strip" class="sol-strip"></div>
  <div class="nav">
    <div class="nav-item active" id="n0" onclick="go(0)">Planner</div>
    <div class="nav-item" id="n1" onclick="go(1)">Calendar</div>
    <div class="nav-item" id="n2" onclick="go(2)">Lake Detail</div>
  </div>
  <div id="C"><div class="loading"><div class="spin"></div>Scanning 7 lakes...</div></div>
</div>
<script>
const LK=[
  {id:0,name:"Jordan Lake",s:"Jordan",lat:35.725,lon:-79.025,acres:14000,stain:"stained",thermal:false},
  {id:1,name:"Falls Lake",s:"Falls",lat:36.02,lon:-78.68,acres:12400,stain:"moderate",thermal:false},
  {id:2,name:"Harris Lake",s:"Harris",lat:35.605,lon:-78.945,acres:4100,stain:"moderate",thermal:true},
  {id:3,name:"Lake Wheeler",s:"Wheeler",lat:35.705,lon:-78.695,acres:650,stain:"stained",thermal:false},
  {id:4,name:"Lake Benson",s:"Benson",lat:35.67,lon:-78.60,acres:200,stain:"stained",thermal:false},
  {id:5,name:"Panther Lake",s:"Panther",lat:35.55,lon:-78.67,acres:11,stain:"murky",thermal:false},
  {id:6,name:"Bass Lake",s:"Bass",lat:35.64,lon:-78.83,acres:50,stain:"moderate",thermal:false},
];
const DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* === SOLUNAR === */
const ZN=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const ZE=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
const ZS={Aries:-1,Taurus:0,Gemini:0,Cancer:1,Leo:-1,Virgo:0,Libra:0,Scorpio:1,Sagittarius:0,Capricorn:0,Aquarius:-1,Pisces:1};
const PN=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
const PI=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
const RT=['Poor','Fair','Good','Best'];
const _sc={};
function sol(d){
  const k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  if(_sc[k])return _sc[k];
  const t=Astronomy.MakeTime(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12));
  const pa=Astronomy.MoonPhase(t),ec=Astronomy.EclipticGeoMoon(t),ln=(ec.lon+360)%360,zi=Math.floor(ln/30),z=ZN[zi];
  let pi;if(pa<11.25||pa>=348.75)pi=0;else if(pa<78.75)pi=1;else if(pa<101.25)pi=2;else if(pa<168.75)pi=3;else if(pa<191.25)pi=4;else if(pa<258.75)pi=5;else if(pa<281.25)pi=6;else pi=7;
  const dN=Math.min(pa,360-pa)/12.19,dF=Math.abs(pa-180)/12.19,dNF=Math.min(dN,dF),dQ=Math.min(Math.abs(pa-90),Math.abs(pa-270))/12.19;
  let bi;if(dNF<=.8)bi=3;else if(dNF<=3.2)bi=2;else if(dQ<=.8)bi=2;else if(dQ<=2.2)bi=1;else bi=0;
  const sh=ZS[z],fi=Math.max(0,Math.min(3,bi+sh)),il=((1-Math.cos(pa*Math.PI/180))/2)*100;
  const sp=fi===0?-3:fi===1?0:fi===2?4:8;
  const r={name:PN[pi],icon:PI[pi],rating:RT[fi],zodiac:z,zi,ze:ZE[zi],shift:sh,illum:Math.round(il*10)/10,solPts:sp,dNF:Math.round(dNF*10)/10};
  _sc[k]=r;return r;
}

/* === SCORING === */
function sC(s){return s>=75?'var(--sage)':s>=60?'#6a9a5c':s>=45?'var(--gold)':s>=30?'var(--coral)':'#994040'}
function sL(s){return s>=75?'Excellent':s>=60?'Good':s>=45?'Fair':s>=30?'Poor':'Bad'}
function wI(cl,pr,h,sr,ss){const n=h<sr||h>=ss;if(pr>2)return'🌧️';if(pr>.5)return'🌦️';if(cl>80)return'☁️';if(cl>50)return n?'☁️':'⛅';if(cl>20)return n?'🌙':'🌤️';return n?'🌙':'☀️'}
function fh(h){return h===0||h===24?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p'}
function sig(r){return Math.round(5+87/(1+Math.exp(-0.04*r)))}

function score(hr,tmp,prs,pD,cl,wn,prp,sr,ss,lk,mo,sp){
  const F={},P={};const iW=mo<=2||mo===12,iS=mo>=6&&mo<=8;
  let t=0;
  if(iW){if(hr>=11&&hr<=14){t=20;F.time="Prime winter midday"}else if(hr===10||hr===15){t=12;F.time="Near-prime"}else if((hr>=8&&hr<10)||(hr>15&&hr<=17)){t=5;F.time="Decent"}else if(hr>=7&&hr<8){t=-5;F.time="Cold morning"}else if(hr>=17&&hr<19){t=-3;F.time="Cooling"}else{t=-35;F.time="Off hours"}}
  else{const sH=Math.floor(sr),eH=Math.floor(ss);if(hr===sH||hr===sH+1){t=30;F.time="Dawn golden hour"}else if(hr===sH-1||hr===sH+2){t=20;F.time="Near dawn"}else if(hr===eH-1||hr===eH){t=30;F.time="Dusk golden hour"}else if(hr===eH-2||hr===eH+1){t=20;F.time="Near dusk"}else if(hr>sH+2&&hr<10){t=8;F.time="Morning"}else if(hr>15&&hr<eH-2){t=8;F.time="Afternoon"}else if(hr>=10&&hr<=15){const d=Math.abs(hr-12.5);t=Math.round(iS?-25+d*4:-12+d*2);F.time=iS?"Dead zone":"Midday"}else if(hr>=20&&hr<=22){t=-12;F.time="Late evening"}else{t=-35;F.time="Off hours"}}
  P.time=t;
  let p=0;if(pD<-2.5){p=16;F.pressure="Crashing ↓↓↓"}else if(pD<-1.5){p=12;F.pressure="Dropping ↓↓"}else if(pD<-.6){p=7;F.pressure="Falling ↓"}else if(pD>2.5){p=-16;F.pressure="Spiking ↑↑↑"}else if(pD>1.5){p=-12;F.pressure="Rising ↑↑"}else if(pD>.6){p=-5;F.pressure="Rising ↑"}else if(prs>1028){p=-10;F.pressure="Very high"}else if(prs>1022){p=-5;F.pressure="High"}else if(prs<1005){p=5;F.pressure="Low system"}else{p=0;F.pressure="Stable →"}
  P.pressure=p;
  let c=0;if(cl>=85){c=10;F.cloud="Overcast"}else if(cl>=70){c=7;F.cloud="Heavy clouds"}else if(cl>=50){c=4;F.cloud="Mostly cloudy"}else if(cl>=30){c=0;F.cloud="Partly cloudy"}else if(cl>=15){c=-3;F.cloud="Mostly clear"}else{c=-7;F.cloud="Clear"}
  P.cloud=c;

  if(lk.acres<100&&wn>15)w-=4;P.wind=w;
  let pr=0;if(prp>.02&&prp<=.15){pr=10;F.precip="Drizzle"}else if(prp>.15&&prp<=.4){pr=7;F.precip="Light rain"}else if(prp>.4&&prp<=1){pr=3;F.precip="Rain"}else if(prp>1){pr=-7;F.precip="Heavy rain"}else{pr=0;F.precip="Dry"}
  P.precip=pr;
  let tp=0;if(tmp>=60&&tmp<=75){tp=6}else if(tmp>=55&&tmp<60||tmp>75&&tmp<=80){tp=3}else if(tmp>=45&&tmp<55){tp=0}else if(tmp>80&&tmp<=88){tp=-2}else if(tmp>88){tp=-6}else if(tmp>=35&&tmp<45){tp=-3}else{tp=-6}
  F.temp=Math.round(tmp)+"°";P.temp=tp;
  P.solunar=sp;const sl=sol(new Date());F.solunar=sl.rating+' · '+sl.ze+sl.zodiac;

  if(lp)P.lake=lp;
  return{score:sig(Object.values(P).reduce((a,v)=>a+v,0)),factors:F,pts:P}
}

let D={},tab=0,dL=0,dD=0,pF='all',pO=[],cY,cM,cLk=null;

async function fetchW(lk){return(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lk.lat}&longitude=${lk.lon}&hourly=temperature_2m,precipitation,cloudcover,windspeed_10m,pressure_msl&daily=sunrise,sunset&temperature_unit=fahrenheit&windspeed_unit=mph&precipitation_unit=inch&timezone=America/New_York&forecast_days=7`)).json()}

function proc(data,lk){
  const hrs=data.hourly.time,aP=data.hourly.pressure_msl,days=[];let cur=null;
  for(let i=0;i<hrs.length;i++){
    const dt=new Date(hrs[i]),di=Math.floor(i/24),hr=dt.getHours(),mo=dt.getMonth()+1;
    const srH=(() => {const d=new Date(data.daily.sunrise[di]);return d.getHours()+d.getMinutes()/60})();
    const ssH=(() => {const d=new Date(data.daily.sunset[di]);return d.getHours()+d.getMinutes()/60})();
    const pD=aP[i]-aP[Math.max(0,i-6)],sl=sol(dt);
    const{score:sc,factors:F,pts:P}=score(hr,data.hourly.temperature_2m[i],aP[i],pD,data.hourly.cloudcover[i],data.hourly.windspeed_10m[i],data.hourly.precipitation[i],srH,ssH,lk,mo,sl.solPts);
    const hd={hour:hr,score:sc,factors:F,pts:P,dt,temp:Math.round(data.hourly.temperature_2m[i]),pressure:aP[i],pressureDelta:pD,cloud:data.hourly.cloudcover[i],wind:Math.round(data.hourly.windspeed_10m[i]),precip:data.hourly.precipitation[i],icon:wI(data.hourly.cloudcover[i],data.hourly.precipitation[i],hr,srH,ssH),srH,ssH,sol:sl};
    if(i%24===0){cur={date:dt,hours:[],srH,ssH,sol:sl};days.push(cur)}
    cur.hours.push(hd)
  }
  days.forEach(d=>{const f=d.hours.filter(h=>h.hour>=5&&h.hour<=21);d.avg=Math.round(f.reduce((a,h)=>a+h.score,0)/f.length);d.peak=Math.max(...f.map(h=>h.score));d.peakH=f.find(h=>h.score===d.peak)});
  return days
}

function wins(hours){
  const fhr=hours.filter(h=>h.hour>=5&&h.hour<=21);if(!fhr.length)return[];
  const runs=[];let run=null;
  for(const h of fhr){if(h.score>=50){if(!run)run={start:h.hour,end:h.hour,hours:[h]};else{run.end=h.hour;run.hours.push(h)}}else{if(run){runs.push(run);run=null}}}
  if(run)runs.push(run);
  if(!runs.length)return[...fhr].sort((a,b)=>b.score-a.score).slice(0,2).map(h=>({start:h.hour,end:h.hour,score:h.score,reason:h.factors.time}));
  return runs.map(r=>{
    const pk=r.hours.reduce((a,b)=>b.score>a.score?b:a);
    let s=r.start,e=r.end;if(e-s>5){s=Math.max(r.start,pk.hour-3);e=Math.min(r.end,pk.hour+3)}
    const wh=r.hours.filter(h=>h.hour>=s&&h.hour<=e);
    const avg=Math.round(wh.reduce((a,h)=>a+h.score,0)/wh.length);
    const rr=[];const p=pk.pts;
    if(p.time>=15)rr.push(pk.factors.time);else if(p.time>=5)rr.push(pk.factors.time);
    if(p.pressure>=7)rr.push(pk.factors.pressure);if(p.cloud>=7)rr.push("Overcast");if(p.precip>=5)rr.push("Rain");if(p.wind>=8)rr.push("Perfect chop");
    if(!rr.length)rr.push(pk.factors.time||'Best available');
    return{start:s,end:e,score:avg,reason:rr.slice(0,2).join(' + ')}
  }).sort((a,b)=>b.score-a.score).slice(0,3)
}

  if(t>=55&&t<=70&&m>=3&&m<=5)sp.push({i:"🐠",n:"Crappie",t:"Moving shallow. Minnows under cork, 5-8 ft."});
  else sp.push({i:"🐠",n:"Crappie",t:"Vertical jig, timber and bridge pilings."});
  if(pk.hour>=17||pk.hour<=6||pk.cloud>=70)sp.push({i:"🐱",n:"Catfish",t:"Cut bait or stink bait near channel drops."});
  if(sp.length){h+=`<div class="sp-panel"><h3>Species Intel</h3>`;sp.forEach(s=>{h+=`<div class="sp"><div class="si">${s.i}</div><div><div class="sn">${s.n}</div><div class="st">${s.t}</div></div></div>`});h+=`</div>`}

  document.getElementById('C').innerHTML=h;
  requestAnimationFrame(()=>{const s=document.getElementById('hS');if(!s)return;const tgt=s.querySelector(`[data-hr="${isT?ch:Math.max(5,srHr-1)}"]`);if(tgt)s.scrollLeft=tgt.offsetLeft-16})
}

/* INIT */
if(typeof Astronomy!=='undefined'){
  const s=sol(new Date());
  document.getElementById('sol-strip').innerHTML=`<span class="moon-i">${s.icon}</span>${s.name} · <span class="rating r-${s.rating}">${s.rating}</span> · <span class="zodiac">${s.ze}${s.zodiac}</span> · ${s.illum}% · <a class="cal-link" href="/solunar.html">Full Calendar →</a>`;
}
load();
