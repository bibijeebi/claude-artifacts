<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run Log</title>
<meta name="description" content="Every logged run: distance, duration, pace, cadence, elevation gain, and mile splits.">
<meta property="og:title" content="Run Log">
<meta property="og:description" content="Every logged run, one page. Distance, duration, pace, cadence, elevation gain, and mile-by-mile splits, oldest to newest.">
<meta property="og:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/run-log-og.jpg">
<meta property="og:url" content="https://niggerfaggot.club/run-log.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/run-log-og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#e6e9e1; --panel:#f5f7f1; --ink:#161c15; --muted:#6d7669;
  --rule:#c9cfc0; --route:#d92b1f; --cad:#2f6b8a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 88px;background-position:0 -1px;
}
.wrap{max-width:800px;margin:0 auto;padding:28px 20px 96px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{
  font-family:var(--cond);font-weight:700;text-transform:uppercase;
  font-size:clamp(52px,17vw,104px);line-height:.86;letter-spacing:-.02em;
  margin:6px 0 0;
}
h1 span{color:var(--route)}
.totals{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin:22px 0 34px;
}
.tot{background:var(--panel);padding:12px 12px 14px}
.tot b{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(19px,5.2vw,27px);letter-spacing:-.03em;line-height:1.1}
.tot i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sect{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:7px;margin:0 0 16px}
.chart{background:var(--panel);border:1px solid var(--rule);padding:16px 14px 10px;margin-bottom:38px}
.chart svg{display:block;width:100%;height:auto}
.key{display:flex;gap:18px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.key s{text-decoration:none;display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
.trace{position:relative;padding-left:30px}
.trace:before{content:"";position:absolute;left:5px;top:10px;bottom:26px;width:2px;background:var(--route);opacity:.45}
.run{position:relative;background:var(--panel);border:1px solid var(--rule);padding:16px 16px 14px;margin-bottom:16px}
.run:before{
  content:"";position:absolute;left:-30px;top:20px;width:12px;height:12px;border-radius:50%;
  background:var(--ground);border:3px solid var(--route);
}
.run:after{content:"";position:absolute;left:-18px;top:25px;width:18px;height:1px;background:var(--rule)}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:10px}
.dist{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em}
.dist em{font-style:normal;font-size:15px;font-family:var(--mono);font-weight:500;color:var(--muted);margin-left:4px}
.when{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.when b{display:block;color:var(--ink);font-weight:600;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 4px}
.st b{display:block;font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:-.02em}
.st i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.splits{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.sp{display:grid;grid-template-columns:26px 1fr 84px;align-items:center;gap:10px;margin-bottom:5px}
.sp u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--muted)}
.bar{height:16px;background:var(--route);opacity:.85}
.sp span{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;text-align:right;white-space:nowrap}
.sp span var{font-style:normal;color:var(--cad);margin-left:8px}
.note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px;letter-spacing:.03em}
footer{margin-top:44px;border-top:1px solid var(--rule);padding-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:520px){
  .totals{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .sp{grid-template-columns:22px 1fr 76px;gap:8px}
  .trace{padding-left:24px}
  .run:before{left:-24px}
  .run:after{left:-13px;width:13px}
  .trace:before{left:0}
}
@media(prefers-reduced-motion:no-preference){
  .run{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Benny Foreman &middot; Wake County NC</div>
  <h1>Run<br>Log<span>.</span></h1>

  <div class="totals" id="totals"></div>

  <div class="sect">Distance and pace by run</div>
  <div class="chart">
    <svg id="chart" viewBox="0 0 700 220" preserveAspectRatio="none" aria-label="Distance bars and pace line by run"></svg>
    <div class="key">
      <span><s style="background:var(--route);opacity:.28"></s>Distance</span>
      <span><s style="background:var(--ink)"></s>Pace (higher = faster)</span>
    </div>
  </div>

  <div class="sect">Every run, newest first</div>
  <div class="trace" id="runs"></div>

  <footer><span id="stamp"></span><span>Logged from Apple Fitness</span></footer>
</div>

<script>
const runs = [
  {date:"2026-08-01", time:"4:01 pm", dist:5.05, dur:3749, pace:"12:22", cadence:136, elev:169, cal:607,
   place:"Copperleaf, Cary", weather:"Partly cloudy",
   splits:[["1","12:43",132],["2","12:27",138],["3","11:41",140],["4","12:20",136],["5.05","12:43",134]]},
  {date:"2026-08-02", time:"3:17 pm", dist:4.72, dur:3601, pace:"12:41", cadence:136, elev:110, cal:560,
   place:"SE Cary Pkwy greenway", weather:"Mostly cloudy",
   splits:[["1","9:49",154],["2","11:50",144],["3","15:35",120],["4","13:22",132],["4.72","12:58",136]]}
];

const s2 = t => t.split(":").reduce((a,b)=>a*60+ +b,0);
const clock = s => {const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const paceOf = r => r.pace;
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

const mi = runs.reduce((a,r)=>a+r.dist,0), sec = runs.reduce((a,r)=>a+r.dur,0);
const wk = runs.filter(r => (Date.now()-new Date(r.date+"T12:00:00"))/864e5 < 7).reduce((a,r)=>a+r.dist,0);
document.getElementById("totals").innerHTML = [
  [mi.toFixed(2),"Total miles"], [runs.length,"Runs logged"],
  [clock(sec),"Time on feet"], [clock(sec/mi),"Avg pace /mi"]
].map(([v,l])=>`<div class="tot"><b>${v}</b><i>${l}</i></div>`).join("")
 + `<div class="tot" style="grid-column:1/-1"><b>${wk.toFixed(2)} mi</b><i>Last 7 days</i></div>`;

(function(){
  const W=700,H=220,P={l:8,r:8,t:14,b:26}, n=runs.length;
  const paces = runs.map(r=>r.dur/r.dist), dmax=Math.max(...runs.map(r=>r.dist))*1.15;
  const pmin=Math.min(...paces)-30, pmax=Math.max(...paces)+30;
  const slot=(W-P.l-P.r)/n, x=i=>P.l+slot*i+slot/2;
  const yb=v=>H-P.b-(v/dmax)*(H-P.t-P.b), yp=v=>P.t+((v-pmin)/(pmax-pmin))*(H-P.t-P.b);
  const bw=Math.min(slot*0.46,64);
  let g=`<line x1="0" y1="${H-P.b}" x2="${W}" y2="${H-P.b}" stroke="#c9cfc0" stroke-width="1"/>`;
  runs.forEach((r,i)=>{
    g+=`<rect x="${x(i)-bw/2}" y="${yb(r.dist)}" width="${bw}" height="${H-P.b-yb(r.dist)}" fill="#d92b1f" opacity=".28"/>`;
    g+=`<text x="${x(i)}" y="${H-P.b+16}" font-family="IBM Plex Mono" font-size="11" fill="#6d7669" text-anchor="middle">${r.dist.toFixed(2)}</text>`;
  });
  g+=`<polyline fill="none" stroke="#161c15" stroke-width="2" points="${runs.map((r,i)=>x(i)+","+yp(r.dur/r.dist)).join(" ")}"/>`;
  runs.forEach((r,i)=>{
    g+=`<circle cx="${x(i)}" cy="${yp(r.dur/r.dist)}" r="4.5" fill="#f5f7f1" stroke="#161c15" stroke-width="2"/>`;
    g+=`<text x="${x(i)}" y="${yp(r.dur/r.dist)-12}" font-family="IBM Plex Mono" font-size="11.5" fill="#161c15" text-anchor="middle">${paceOf(r)}</text>`;
  });
  document.getElementById("chart").innerHTML=g;
})();

document.getElementById("runs").innerHTML = [...runs].reverse().map(r=>{
  const sp=r.splits.map(s=>s2(s[1])), lo=Math.min(...sp), hi=Math.max(...sp), span=hi-lo||1;
  return `<article class="run">
    <div class="rhead">
      <div class="dist">${r.dist.toFixed(2)}<em>mi</em></div>
      <div class="when"><b>${fmtDate(r.date)}</b>${r.time} &middot; ${r.place}</div>
    </div>
    <div class="stats">
      <div class="st"><b>${clock(r.dur)}</b><i>Duration</i></div>
      <div class="st"><b>${paceOf(r)}</b><i>Avg pace</i></div>
      <div class="st"><b>${r.cadence}</b><i>Cadence spm</i></div>
      <div class="st"><b>${r.elev} ft</b><i>Elev gain</i></div>
    </div>
    <div class="splits">
      ${r.splits.map((s,i)=>`<div class="sp"><u>${s[0]}</u>
        <div class="bar" style="width:${28+(1-(sp[i]-lo)/span)*72}%"></div>
        <span>${s[1]}<var>${s[2]}</var></span></div>`).join("")}
    </div>
    <div class="note">${r.cal} cal &middot; ${r.weather} &middot; longer bar = faster split</div>
  </article>`;
}).join("");

document.getElementById("stamp").textContent = "Updated " + new Date(runs[runs.length-1].date+"T12:00:00")
  .toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
</script>
</body>
</html>
