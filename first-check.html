<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Check: field diagnostics, symptom to cause</title>
<meta name="description" content="Ranked symptom-to-cause trees for ten trades. What to check first, the test that proves it, and the fix.">
<meta name="theme-color" content="#1B1F24">
<meta property="og:title" content="First Check: field diagnostics, symptom to cause">
<meta property="og:description" content="Ranked cause trees across plumbing, electrical, HVAC, appliances, and six more trades. Every cause gets the test that proves it and the fix that ends it.">
<meta property="og:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/og-first-check.jpg">
<meta property="og:url" content="https://niggerfaggot.club/first-check.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://claude-deploy.bennyforeman1.workers.dev/r2/file/og-first-check.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pit:#1B1F24; --panel:#242A31; --panel2:#2C333B; --line:#39424C;
  --chalk:#E9E7E2; --dim:#98A1AB; --amber:#FFB020; --green:#58C98A; --red:#FF5E4D;
  --disp:"Barlow Condensed",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  margin:0;background:var(--pit);color:var(--chalk);font-family:var(--body);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--amber)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:rgba(27,31,36,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.stripe{height:5px;background:repeating-linear-gradient(115deg,var(--amber) 0 14px,var(--pit) 14px 28px);opacity:.85}
.bar{max-width:1000px;margin:0 auto;padding:14px 18px 12px}
.lock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{
  font-family:var(--disp);font-weight:700;font-size:34px;line-height:.9;margin:0;
  letter-spacing:.02em;text-transform:uppercase;
}
h1 span{color:var(--amber)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.search{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 12px}
.search:focus-within{border-color:var(--amber)}
.search svg{flex:none;opacity:.5}
#q{
  flex:1;min-width:0;background:none;border:none;outline:none;color:var(--chalk);
  font-family:var(--body);font-size:16px;padding:13px 0;
}
#q::placeholder{color:var(--dim)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
@media(max-width:640px){.kbd{display:none}}
.modes{display:flex;gap:6px;margin-top:12px}
.mode{
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 14px;border:1px solid var(--line);border-radius:3px;color:var(--dim);
}
.mode[aria-pressed="true"]{background:var(--amber);color:#1B1F24;border-color:var(--amber);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;max-width:1000px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  padding:7px 12px;border:1px solid var(--line);border-radius:3px;color:var(--dim);white-space:nowrap;
}
.chip[aria-pressed="true"]{color:var(--chalk);border-color:var(--chalk);background:var(--panel2)}

/* ---------- shell ---------- */
main{max-width:1000px;margin:0 auto;padding:22px 18px 80px}
.count{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}

/* ---------- symptom cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden}
.card.open{border-color:#4C5763}
.head{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:16px 18px}
.head:hover{background:var(--panel2)}
.headtext{flex:1;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:5px}
.sym{font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.12;letter-spacing:.01em}
.tell{display:block;font-family:var(--body);font-size:13px;color:var(--dim);font-style:italic;margin-top:5px}
.n{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;padding-top:4px}
.chev{flex:none;transition:transform .18s ease;opacity:.55;padding-top:3px}
.card.open .chev{transform:rotate(90deg)}

/* ---------- the ladder ---------- */
.ladder{display:none;padding:0 18px 8px}
.card.open .ladder{display:block}
.rung{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line)}
.rail{flex:none;width:5px;border-radius:3px;background:var(--line)}
.rung[data-k="first"] .rail{background:var(--amber);width:5px}
.rung[data-k="likely"] .rail{background:#7F8B97}
.rung[data-k="possible"] .rail{background:#525C67}
.rung[data-k="rare"] .rail{background:#3C444E}
.rung[data-danger] .rail{background:var(--red)}
.rungbody{flex:1;min-width:0}
.rungtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rank{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}
.cause{font-weight:600;font-size:16.5px;line-height:1.3}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--line);color:var(--dim);flex:none}
.rung[data-k="first"] .pill{background:var(--amber);color:#1B1F24;border-color:var(--amber);font-weight:600}
.hazard{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.line{display:flex;gap:10px;margin-top:7px;font-size:14.5px;line-height:1.5}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding-top:4px;flex:none;width:34px}
.line.test .lab{color:var(--amber)}
.line.fix .lab{color:var(--dim)}
.line.fix p{color:var(--dim)}
.line p{margin:0}

/* ---------- drill ---------- */
#drill{display:none}
.meter{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cell{flex:1;min-width:88px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.cell b{display:block;font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.01em;line-height:1.1;color:var(--amber)}
.cell small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.prompt{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:26px 22px}
.ask{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.qsym{font-family:var(--disp);font-size:33px;font-weight:600;line-height:1.1;margin:0 0 6px}
.qtell{color:var(--dim);font-style:italic;font-size:14px;margin:0}
.acts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:13px 20px;border:1px solid var(--line);border-radius:3px;color:var(--chalk);flex:1;min-width:130px;
}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--amber);color:#1B1F24;border-color:var(--amber);font-weight:600}
.btn.good{border-color:var(--green);color:var(--green)}
.btn.bad{border-color:var(--red);color:var(--red)}
#answer{display:none;margin-top:20px}
#answer.on{display:block}
.reset{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:18px;display:inline-block;text-decoration:underline}
.empty{font-family:var(--mono);font-size:13px;color:var(--dim);padding:40px 0;text-align:center}
footer{max-width:1000px;margin:0 auto;padding:0 18px 46px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;line-height:1.8}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){
  h1{font-size:29px}.sym{font-size:20px}.qsym{font-size:26px}
  .head{padding:14px}.ladder{padding:0 14px 6px}
}
</style>
</head>
<body>

<header>
  <div class="stripe"></div>
  <div class="bar">
    <div class="lock">
      <h1>First<span>/</span>Check</h1>
      <span class="tag">symptom &rarr; cause &rarr; test &rarr; fix</span>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search a symptom, a part, a smell..." autocomplete="off" spellcheck="false">
      <span class="kbd">/</span>
    </div>
    <div class="modes">
      <button class="mode" id="mRef" aria-pressed="true">Reference</button>
      <button class="mode" id="mDrill" aria-pressed="false">Drill</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div id="ref">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <div id="drill">
    <div class="meter">
      <div class="cell"><b id="mStreak">0</b><small>streak</small></div>
      <div class="cell"><b id="mRate">--</b><small>hit rate</small></div>
      <div class="cell"><b id="mSeen">0</b><small>calls</small></div>
      <div class="cell"><b id="mWeak">0</b><small>weak</small></div>
    </div>
    <div class="prompt">
      <div class="ask" id="dEyebrow">Plumbing</div>
      <h2 class="qsym" id="dSym"></h2>
      <p class="qtell" id="dTell"></p>
      <div class="acts" id="dActs">
        <button class="btn pri" id="dShow">Show the ladder &nbsp;<span style="opacity:.6">space</span></button>
        <button class="btn" id="dSkip">Skip</button>
      </div>
      <div id="answer">
        <div class="ladder" style="display:block;padding:0" id="dLadder"></div>
        <div class="acts">
          <button class="btn good" id="dGot">Called it &nbsp;<span style="opacity:.6">1</span></button>
          <button class="btn bad" id="dMiss">Missed it &nbsp;<span style="opacity:.6">2</span></button>
        </div>
      </div>
    </div>
    <button class="reset" id="dReset">Reset drill history</button>
  </div>
</main>

<footer>
  <div id="fcount"></div>
  <div>Ranking is field frequency, not certainty. Work top down and prove each one before you buy a part.</div>
</footer>

<script>
const DATA = [{"d": "Plumbing", "s": "Toilet rocks and weeps at the base", "t": "They say it leaks when you flush", "c": [{"n": "Flange sits below finished floor", "k": "first", "test": "Pull the toilet. Flange top should be flush with the finish floor to 1/4 in above it. Tile jobs bury it almost every time.", "fix": "Flange extender ring plus one new seal. Never stack two wax rings, that is what caused this."}, {"n": "Cracked or corroded flange ears", "k": "likely", "test": "Inspect the closet bolt slots. Cast iron rots at the ears, PVC cracks from over-torqued bolts.", "fix": "Stainless repair ring over the old flange, or cut in a new flange."}, {"n": "Loose closet bolts, toilet shimmed on a hump", "k": "likely", "test": "Straddle it and rock. Movement breaks the wax seal every flush.", "fix": "Reset with new bolts and plastic shims. Caulk the perimeter and leave the back open so a future leak shows."}, {"n": "Tank to bowl gasket weeping down the back", "k": "possible", "test": "Dry everything, dye the tank, watch where color appears first.", "fix": "Replace the gasket and tank bolts as a set."}, {"n": "Condensation, not a leak at all", "k": "possible", "test": "Water only in humid weather, tank cold to the touch, no dye showing. Common in NC summers.", "fix": "Insulated tank liner or a mixing valve to raise supply temp."}]}, {"d": "Plumbing", "s": "Toilet runs on its own every few minutes", "t": "Phantom flush", "c": [{"n": "Flapper not sealing on a scaled seat", "k": "first", "test": "Dye tab in the tank, do not flush, check the bowl in 15 minutes. Color in the bowl means the flapper leaks.", "fix": "New flapper and scour the seat with a scotch pad. Match the flapper to the flush valve size, 2 in vs 3 in."}, {"n": "Fill valve set above the overflow tube", "k": "likely", "test": "Look for a steady trickle down the overflow standpipe.", "fix": "Drop the float so waterline sits about 1 in below the top of the overflow."}, {"n": "Pitted flush valve seat", "k": "possible", "test": "Run a fingertip around the seat. Grit or pits you can feel will not seal against any flapper.", "fix": "Seat repair kit, or replace the flush valve."}, {"n": "Chain too short or flapper snagged on the chain", "k": "possible", "test": "Watch a full cycle. A taut chain holds the flapper a hair off the seat.", "fix": "Leave about 1/2 in of slack and clip the excess."}]}, {"d": "Plumbing", "s": "Low pressure at one fixture only", "t": "Everything else is fine", "c": [{"n": "Clogged aerator or cartridge screen", "k": "first", "test": "Unscrew the aerator and run the faucet. Strong flow means you already found it.", "fix": "Soak in vinegar or replace. If it keeps filling, there is debris upstream from a recent repair."}, {"n": "Angle stop partly closed or failed internally", "k": "likely", "test": "Open the stop fully, then disconnect the supply into a bucket and check volume at the stop itself.", "fix": "Replace with quarter turn ball stops. Multi turn stops fail closed with age."}, {"n": "Failed pressure balance cartridge", "k": "likely", "test": "Shower only, hot and cold both weak, temperature swings when another fixture runs.", "fix": "Rebuild or replace the cartridge. Pull the model number off the trim before ordering."}, {"n": "Scale in galvanized branch line", "k": "possible", "test": "Pre 1960 house, cut a section and look at the ID. Galvanized closes up from the inside.", "fix": "Repipe the branch in PEX. Patching one section moves the problem downstream."}, {"n": "Kinked or crushed flexible supply", "k": "rare", "test": "Follow the line under the cabinet. Braided lines kink behind the trap.", "fix": "New supply line, routed with a sweep instead of a bend."}]}, {"d": "Plumbing", "s": "Low pressure through the whole house", "t": "", "c": [{"n": "Failed pressure reducing valve", "k": "first", "test": "Screw a gauge onto a hose bibb. Want 50 to 70 psi static. Below 40 with the street reading normal points at the PRV.", "fix": "Replace the PRV. They average 10 to 15 years and fail gradually so nobody notices."}, {"n": "Main shutoff or meter valve not fully open", "k": "first", "test": "Trace the main and confirm the handle is fully open. Gate valves back off over time.", "fix": "Open it. If the stem is seized, replace the gate valve with a ball valve."}, {"n": "Whole house filter past due", "k": "likely", "test": "Check the pressure gauge before and after the housing if it has one, or just pull the cartridge and look.", "fix": "New cartridge. Write the date on the housing in Sharpie."}, {"n": "Municipal supply or a main break", "k": "possible", "test": "Ask a neighbor. Costs nothing and saves an hour of chasing it inside the house.", "fix": "Call the utility. Nothing to fix on your side."}]}, {"d": "Plumbing", "s": "Drains gurgle and run slow at several fixtures", "t": "", "c": [{"n": "Partial blockage in the main line", "k": "first", "test": "Start at the lowest fixture in the house. Multiple slow drains on different branches means the problem is downstream of all of them.", "fix": "Cable the main from the cleanout. Camera it after if it comes back inside a year."}, {"n": "Blocked or capped vent", "k": "first", "test": "Gurgling plus traps that siphon dry is a venting signature, not a clog. Check the roof vent for a nest or ice.", "fix": "Clear the vent from the roof with a hose. Never cap a vent."}, {"n": "Root intrusion at a clay or cast joint", "k": "likely", "test": "Older neighborhood with mature trees, recurring seasonal backups, cable comes back with hair roots on it.", "fix": "Cut and pull annually, or line the section. Roots always come back."}, {"n": "Belly or sag in the line", "k": "possible", "test": "Camera it. Standing water in a section that should be running is the tell.", "fix": "Excavate and reset that section to grade. Nothing else fixes a belly."}, {"n": "S trap or over long trap arm siphoning", "k": "possible", "test": "Measure trap arm length against pipe size. A 1 1/2 in arm should not run past about 6 ft to the vent.", "fix": "Re-plumb with a proper vent or an AAV where code permits."}]}, {"d": "Plumbing", "s": "Sewer smell inside the house", "t": "", "c": [{"n": "Dry trap", "k": "first", "test": "Find every unused drain: guest bath, floor drain, basement shower, laundry standpipe. Pour a gallon in each and wait a day.", "fix": "Refill and add a couple ounces of mineral oil to slow evaporation on drains that never get used."}, {"n": "Failed toilet seal", "k": "first", "test": "Smell strongest near one toilet, and it rocks. The seal is broken even if nothing is visibly wet.", "fix": "Pull and reset with a new seal and correct flange height."}, {"n": "Failed or missing air admittance valve", "k": "likely", "test": "Look under island sinks and in the attic. AAVs stick open once the diaphragm hardens.", "fix": "Replace it. They are consumable, not permanent."}, {"n": "Cracked DWV pipe in a wall or crawl", "k": "possible", "test": "Smoke test the system, or run water and watch with a light in the crawl. ABS gets brittle, cast iron rots at the hub.", "fix": "Cut out and replace the section with a shielded coupling."}, {"n": "Vent terminating near a window or soffit intake", "k": "rare", "test": "Smell is worse outside or with windows open, and follows the wind.", "fix": "Extend the vent above and away from openings per code."}]}, {"d": "Plumbing", "s": "Pipes bang when a fixture shuts off", "t": "Water hammer", "c": [{"n": "Fast closing solenoid valve", "k": "first", "test": "Note which appliance triggers it. Washers and dishwashers slam shut in milliseconds and that is what starts the shock wave.", "fix": "Add an arrestor at that appliance, as close to the valve as possible."}, {"n": "Unsecured pipe in a joist bay", "k": "first", "test": "Have someone cycle the fixture while you put a hand on the pipe in the crawl or basement. You will feel it jump.", "fix": "Strap it with cushioned clamps every 6 to 8 ft. Do not clamp it dead tight, it needs to move with temperature."}, {"n": "High static pressure", "k": "likely", "test": "Gauge at the hose bibb. Over 80 psi is a code violation and it makes every other symptom worse.", "fix": "Install or replace the PRV and set it to 60."}, {"n": "Waterlogged arrestor or dead air chambers", "k": "likely", "test": "Old copper stub air chambers fill with water and stop working. Shut the main, open the highest and lowest fixtures, drain the system, restore.", "fix": "Drain to recharge chambers, or install real arrestors."}]}, {"d": "Plumbing", "s": "No hot water or it runs out fast", "t": "", "c": [{"n": "Failed lower element", "k": "first", "test": "Electric tank. Hot for two minutes then cold is the classic lower element signature. Kill power, pull the cover, check continuity across the element.", "fix": "Replace the element and the gasket. Check the other one while you are in there."}, {"n": "Tripped ECO high limit", "k": "first", "test": "Red reset button under the upper thermostat cover. If it tripped, something else caused it, do not just reset and leave.", "fix": "Reset, then find the failed thermostat or shorted element that tripped it."}, {"n": "Broken dip tube", "k": "likely", "test": "Lukewarm at every fixture and short supply. Incoming cold is short circuiting to the outlet at the top.", "fix": "Replace the dip tube, or the tank if it is old enough to be arguing with you."}, {"n": "Sediment packed on the bottom", "k": "likely", "test": "Rumbling or popping while heating. Drain a bucket and look at what comes out.", "fix": "Full flush. On a well or hard water, do it yearly."}, {"n": "Gas unit: pilot, thermocouple, or gas valve", "k": "likely", "test": "No flame at all. Confirm the pilot lights and stays lit when you release the button. Dropping out means thermocouple.", "fix": "Replace the thermocouple first, it is the cheap part and the usual answer."}]}, {"d": "Electrical", "s": "Breaker trips the instant you reset it", "t": "", "c": [{"n": "Dead short, hot to ground or neutral", "k": "first", "test": "Kill the breaker, pull the circuit conductors, ohm hot to ground and hot to neutral. Near zero means the short is in the wiring, not a device.", "fix": "Isolate by halves. Split the circuit at a midpoint junction and re-test each leg until you find the run."}, {"n": "A cable hit by a screw or nail", "k": "first", "test": "Ask what changed. Picture hung, trim installed, TV mounted, cabinet screwed to the wall. The answer is almost always a recent hole.", "fix": "Open the wall at the fastener, cut out the damaged section, splice in an accessible box."}, {"n": "Failed appliance on the circuit", "k": "likely", "test": "Unplug everything on the circuit and reset. Holds means it is a load, not the wiring. Plug back in one at a time.", "fix": "Repair or retire the offending appliance."}, {"n": "Miswired device shorting in the box", "k": "likely", "test": "Look at the most recently worked-on device. Backstab wires pull loose and land on the yoke or box.", "fix": "Re-terminate on screws with a torque driver."}, {"n": "Failed breaker", "k": "rare", "test": "Swap in a known-good breaker of the same type and rating. Last thing to suspect, not the first.", "fix": "Replace the breaker. Match the manufacturer, no cross-brand fitting."}]}, {"d": "Electrical", "s": "Breaker trips after several minutes of use", "t": "", "c": [{"n": "Overload", "k": "first", "test": "Clamp the circuit under real load. Continuous load over 80 percent of the breaker rating will trip on thermal, and it will take its time doing it.", "fix": "Move loads to another circuit or add a circuit. Do not upsize the breaker on 14 or 12 AWG."}, {"n": "Loose connection heating up", "k": "first", "test": "IR scan the panel and the devices under load. A hot spot at a lug or a device is the whole answer.", "fix": "Kill power, re-terminate, torque to the label spec. Loose lugs are the number one cause of panel fires."}, {"n": "Motor load with failing start components", "k": "likely", "test": "Clamp inrush on the compressor, well pump, or disposal. Locked rotor amps on every start will nuisance trip.", "fix": "Replace the start capacitor or the motor."}, {"n": "Aged breaker with a weakened thermal element", "k": "possible", "test": "Circuit measures well within rating and nothing heats up, but it still trips. Swap test.", "fix": "Replace the breaker."}]}, {"d": "Electrical", "s": "GFCI keeps tripping", "t": "", "c": [{"n": "Moisture in an exterior box downstream", "k": "first", "test": "Open every box downstream of the GFCI, especially outdoor receptacles and anything on a porch or deck. Trips after rain is the tell.", "fix": "Dry it, replace corroded devices, install an in-use bubble cover and gaskets."}, {"n": "Shared neutral across circuits", "k": "first", "test": "Downstream neutrals tied to another circuit will trip a GFCI every time. Open the panel and look for two circuits on one neutral.", "fix": "Separate the neutrals, or feed the pair from a 2 pole GFCI breaker on a handle-tied multiwire circuit."}, {"n": "Freezer or fridge on the protected circuit", "k": "likely", "test": "Trips only when the compressor cycles. Motor windings leak a few milliamps to ground.", "fix": "Confirm the appliance is the cause, then give it a dedicated circuit that meets current code for the location."}, {"n": "Failed GFCI device", "k": "likely", "test": "Press test then reset. If test does nothing or reset will not hold with the load side disconnected, the device is done.", "fix": "Replace it. They wear out, ten years is a fair service life."}, {"n": "Long circuit with accumulated leakage", "k": "possible", "test": "Total leakage of many small loads adds up toward the 5 mA trip point. Disconnect load-side runs one at a time and watch.", "fix": "Split the circuit or move the heaviest leaker."}]}, {"d": "Electrical", "s": "AFCI trips with nothing obviously wrong", "t": "", "c": [{"n": "Shared or borrowed neutral", "k": "first", "test": "Most common AFCI complaint in older remodels. Look for a neutral from this circuit landed with another circuit in a box.", "fix": "Trace and separate. Every circuit gets its own neutral back to the bar."}, {"n": "Arcing at a backstabbed device", "k": "first", "test": "Pull the devices on the circuit. Backstab holes lose spring tension and arc under load, which is exactly what the breaker is built to catch.", "fix": "Re-terminate everything on screw terminals."}, {"n": "Brushed motor load", "k": "likely", "test": "Vacuums, treadmills, and older drills produce an arc signature. Note whether tripping correlates with one appliance.", "fix": "Verify the appliance, then use a different circuit or replace the tool."}, {"n": "Cable stapled too tight or pinched", "k": "possible", "test": "Look at staples in the accessible run. Crushed NM insulation arcs to the staple.", "fix": "Cut out and splice in a box, and back the staples off."}, {"n": "Damaged or early-generation AFCI", "k": "rare", "test": "Swap in a current model of the same brand.", "fix": "Replace the breaker."}]}, {"d": "Electrical", "s": "Lights flicker", "t": "", "c": [{"n": "Open or loose neutral", "k": "first", "danger": true, "test": "Flicker across multiple circuits, or lights brightening in one room while dimming in another, is an open service neutral. Meter L1 to N and L2 to N, they will be badly unbalanced.", "fix": "Stop. Kill the main and get the utility out for a service neutral. This puts 200 plus volts on 120 V equipment and burns houses down."}, {"n": "Dimmer not rated for the LED load", "k": "first", "test": "One fixture, started when the lamps or the dimmer changed. Check the dimmer minimum load and whether it needs a neutral.", "fix": "Use an ELV or LED-rated dimmer with a neutral, and match the lamp to the dimmer compatibility list."}, {"n": "Loose termination at a device or splice", "k": "likely", "test": "Flicker on one circuit only. Wiggle test with a load on, then IR the boxes.", "fix": "Re-terminate on screws, pigtail rather than pass-through where possible."}, {"n": "Motor start sag", "k": "likely", "test": "Flicker times with the AC, well pump, or heat pump starting. One quick dip, not continuous.", "fix": "Normal to a point. Check the compressor start capacitor and consider a hard start kit if the sag is deep."}, {"n": "Utility side problem", "k": "possible", "test": "Whole house, neighbors too, worse in bad weather. Look at the service drop and the weatherhead.", "fix": "Utility call. Nothing on your side to repair."}]}, {"d": "Electrical", "s": "Half the house is out and 240 V loads are dead", "t": "", "c": [{"n": "Lost leg on the service", "k": "first", "danger": true, "test": "Meter L1 to N and L2 to N at the main lugs. One near 120 and one near 0 or floating means an open service conductor.", "fix": "Utility. Do not start swapping breakers, and be aware the neutral may be carrying more than you expect."}, {"n": "Failed half of a two pole breaker", "k": "likely", "test": "Meter both load lugs of the main or the 2 pole breaker with it on. Power in, none out on one side.", "fix": "Replace the breaker."}, {"n": "Loose main lug", "k": "likely", "test": "IR scan under load, then check torque with the panel dead.", "fix": "Re-torque to the label spec. Aluminum service conductors need antioxidant and correct torque."}, {"n": "Utility transformer or drop", "k": "possible", "test": "Neighbors on the same transformer report the same thing.", "fix": "Utility call."}]}, {"d": "Electrical", "s": "Outlet is dead but no breaker is tripped", "t": "", "c": [{"n": "Tripped GFCI upstream", "k": "first", "test": "Find every GFCI in the house including the garage, bathrooms, exterior, and the one behind the shelving in the basement. Press reset on each.", "fix": "Reset. If it will not hold, work the GFCI trip cause instead."}, {"n": "Failed backstab connection", "k": "first", "test": "Open the last working outlet on the run and the dead one. Backstabs release and kill everything downstream.", "fix": "Re-terminate on screws with pigtails."}, {"n": "Open neutral in an upstream box", "k": "likely", "test": "Meter hot to ground. Voltage present with no working outlet means you have a hot and no return.", "fix": "Find the loose neutral splice, usually in a box with a wire nut on too many conductors."}, {"n": "Switched receptacle", "k": "likely", "test": "Try every wall switch in the room before you open anything. Free to check, and it is embarrassing to find it after an hour.", "fix": "Nothing to fix."}, {"n": "Failed device", "k": "possible", "test": "Power confirmed at the box, nothing at the face.", "fix": "Replace the receptacle."}]}, {"d": "Electrical", "s": "Receptacle or plug is warm and discolored", "t": "", "c": [{"n": "Loose termination arcing", "k": "first", "danger": true, "test": "Kill power and pull the device. Look for browning, melted nylon, and a backstab hole.", "fix": "Replace the device and re-terminate on screws. Cut back any conductor showing heat damage."}, {"n": "Aluminum branch wiring on a copper-only device", "k": "likely", "danger": true, "test": "House built roughly 1965 to 1973, single strand dull gray conductors marked AL. Standard receptacles are not rated for it.", "fix": "AlumiConn or COPALUM pigtails, or CO/ALR rated devices. Do not just put a new standard receptacle on it."}, {"n": "Overloaded circuit or undersized cord", "k": "likely", "test": "Clamp the load. Space heaters and window units on a shared 15 A circuit do this constantly.", "fix": "Dedicated circuit for the heavy load."}, {"n": "Worn contacts from years of plugging", "k": "possible", "test": "Plug falls out under its own weight, that receptacle has no grip left.", "fix": "Replace with a spec grade device."}]}, {"d": "HVAC", "s": "Condenser will not run, air handler is blowing", "t": "", "c": [{"n": "Failed run capacitor", "k": "first", "test": "Meter microfarads against the label. Domed or leaking top is a free visual. Most common failure in the entire trade.", "fix": "Replace with matched uF and equal or higher voltage rating."}, {"n": "Contactor not pulling in or pitted", "k": "first", "test": "Check 24 V at the contactor coil. Voltage present with no pull-in means the coil is open. No voltage sends you back to the control side.", "fix": "Replace the contactor. Pitted contacts weld and stick closed too, which is its own problem."}, {"n": "Blown low voltage fuse in the air handler", "k": "likely", "test": "3 or 5 amp blade fuse on the board. Blown almost always means a shorted thermostat wire, usually at the whip where a trimmer got it.", "fix": "Find the short first, then fuse it. Repeat blows are a chafed wire, not a bad fuse."}, {"n": "Open pressure switch", "k": "likely", "test": "Jump out the safety momentarily to confirm the circuit, then gauge it. Low pressure open means the charge left, high pressure means airflow or a dirty coil.", "fix": ""}, {"n": "Compressor locked rotor", "k": "possible", "test": "Clamp on start. Pegging at LRA and dropping on overload with the fan running fine points at the compressor.", "fix": "Hard start kit will confirm and may buy time. Otherwise it is a compressor or a system quote."}]}, {"d": "HVAC", "s": "Running but barely cooling, weak delta-T", "t": "", "c": [{"n": "Airflow restriction", "k": "first", "test": "Delta-T under about 15 F sends you to airflow before the gauges. Filter, coil face, closed registers, crushed flex, undersized return.", "fix": "Clean the coil, correct the return path, set blower speed to the tables. Fix airflow before you touch the charge."}, {"n": "Low charge from a leak", "k": "first", "test": "Superheat and subcool, not just gauge pressure. High superheat with low subcool on a TXV system means undercharged.", "fix": "Find the leak, repair, evacuate, weigh in. Topping off without finding the leak is a callback with a date attached."}, {"n": "Dirty condenser coil", "k": "likely", "test": "High head pressure and high subcool. Look at the coil from the inside out, the dirt is on the inside face.", "fix": "Wash it from the inside out with coil cleaner."}, {"n": "Duct leakage in the attic", "k": "likely", "test": "Big split at the coil but weak at the registers. In NC attics you can lose 20 percent of capacity through the seams.", "fix": "Mastic every joint, seal boots to drywall, insulate to R-8."}, {"n": "Oversized equipment short cycling", "k": "possible", "test": "Cools fast, shuts off, house still feels clammy. Run time under about 10 minutes per cycle in peak heat.", "fix": "Cannot fix with service. Note it for a future equipment change."}]}, {"d": "HVAC", "s": "Ice on the suction line or the evaporator", "t": "", "c": [{"n": "Low airflow across the evaporator", "k": "first", "test": "Pull the filter and look. Then check for a collapsed return, closed registers, or a slipped blower wheel. Low airflow drops coil temp below freezing.", "fix": "Clear the restriction. Do not run it iced, melt it off with the fan first or you will slug the compressor."}, {"n": "Undercharge", "k": "first", "test": "Low suction, high superheat, frost starting at the metering device and moving out.", "fix": "Leak search, repair, weigh in the correct charge."}, {"n": "Restricted or stuck metering device", "k": "likely", "test": "Low suction with high subcool. Frost right at the TXV or piston.", "fix": "Replace the TXV or clear the restriction. Check for a plugged filter drier first, it is cheaper."}, {"n": "Failing blower motor or capacitor", "k": "likely", "test": "Clamp the blower and compare to nameplate. Slow motor equals low airflow equals ice.", "fix": "Replace the capacitor or the motor."}, {"n": "Operating below design outdoor temp", "k": "rare", "test": "Homeowner ran AC at 55 F outside overnight.", "fix": "Explain it. No repair needed."}]}, {"d": "HVAC", "s": "Water at the air handler or a stain on the ceiling below it", "t": "", "c": [{"n": "Clogged condensate drain", "k": "first", "test": "Shop vac the exterior termination. If it pulls a slug of black slime, that was it.", "fix": "Clear, flush, and add a cleanout tee. Tabs in the pan for maintenance."}, {"n": "Failed float switch or condensate pump", "k": "first", "test": "Test the float manually, it should kill the unit. Pump should run when you pour water in the reservoir.", "fix": "Replace. A float switch is the cheapest insurance against a ceiling repair."}, {"n": "Missing or wrong-depth trap", "k": "likely", "test": "Negative pressure at the drain pan holds water in the pan instead of letting it flow. Check trap depth against static pressure.", "fix": "Build a proper trap. Draw-through units need one, blow-through units are the opposite."}, {"n": "Ice melting off the coil", "k": "likely", "test": "Sudden large volume of water, not a slow drip. Look at the coil.", "fix": "Chase the icing cause upstream, the water is a symptom."}, {"n": "Sweating plenum or uninsulated line", "k": "possible", "test": "Water on the outside of the plenum or duct, not in the pan. Common in humid crawlspaces.", "fix": "Insulate and vapor seal."}]}, {"d": "HVAC", "s": "Furnace short cycles or locks out", "t": "", "c": [{"n": "Dirty flame sensor", "k": "first", "test": "Lights, burns for a few seconds, then drops out and retries. Microamp reading below spec confirms it.", "fix": "Clean lightly with a scotch pad or steel wool. Never emery cloth, it leaves a residue that insulates."}, {"n": "Limit switch tripping on low airflow", "k": "first", "test": "Filter, blower, and duct static. High temp rise across the heat exchanger means not enough air is moving.", "fix": "Restore airflow. Repeated limit trips crack heat exchangers."}, {"n": "Restricted flue or failed pressure switch", "k": "likely", "test": "Check the switch with a manometer against the spec on the label. Look for a blocked intake or exhaust, birds and wasps love them.", "fix": "Clear the vent, replace the switch only if the inducer draft is correct."}, {"n": "Failed ignitor", "k": "likely", "test": "No glow, or measure resistance. Silicon nitride and silicon carbide have different specs, check the part.", "fix": "Replace, and never touch the element with bare fingers."}, {"n": "Oversized furnace", "k": "possible", "test": "Everything measures fine and it still satisfies in 4 minutes.", "fix": "Nothing to service. Equipment sizing issue."}]}, {"d": "HVAC", "s": "One room is always hotter than the rest", "t": "", "c": [{"n": "Blocked return path", "k": "first", "test": "Close the door and see if the problem gets worse. A room with supply and no return path pressurizes and stops receiving air.", "fix": "Undercut the door, add a transfer grille, or add a jump duct."}, {"n": "Crushed or too-long flex run", "k": "first", "test": "Go in the attic and look at that branch. Kinked flex and 30 ft of unsupported duct are everywhere.", "fix": "Re-support with proper straps, shorten the run, upsize the branch."}, {"n": "Damper closed or register blocked by furniture", "k": "likely", "test": "Free to check first. Look for a balancing damper at the takeoff.", "fix": "Balance the system in cooling and mark the damper positions."}, {"n": "Solar gain and insulation", "k": "likely", "test": "West facing room with two exterior walls. IR gun the walls and ceiling in the afternoon.", "fix": "Air seal and insulate that ceiling plane, add window film."}, {"n": "Room over a garage or bonus room", "k": "likely", "test": "Almost always underserved by the original design.", "fix": "Dedicated zone, a mini split, or increased supply and return."}]}, {"d": "Appliances", "s": "Dryer runs but does not heat", "t": "", "c": [{"n": "Blown thermal fuse from a blocked vent", "k": "first", "test": "Check the vent run before you order any part. If the fuse blew, the vent is why, and a new fuse in a blocked system blows again in a week.", "fix": "Clear the entire run, then replace the thermal fuse."}, {"n": "Lost one leg of the 240 V supply", "k": "first", "test": "Motor runs, no heat is the textbook signature. Meter both legs at the outlet, or check for a half tripped 2 pole breaker.", "fix": "Reset the breaker fully off then on, or repair the connection. Check the outlet terminals for heat damage."}, {"n": "Open heating element", "k": "likely", "test": "Continuity across the element with power off. Look for a visible break in the coil.", "fix": "Replace the element and inspect the housing for coil contact."}, {"n": "Failed high limit or cycling thermostat", "k": "likely", "test": "Continuity across each thermostat cold.", "fix": "Replace as a kit, they are cheap and they fail together."}, {"n": "Gas model: ignitor, coils, or flame sensor", "k": "likely", "test": "Watch a cycle. Ignitor glows and no flame means coils. No glow means ignitor. Flame that drops right out means the sensor.", "fix": "Replace the identified part. Coils come as a set."}]}, {"d": "Appliances", "s": "Dryer takes two or three cycles to dry a load", "t": "", "c": [{"n": "Restricted vent run", "k": "first", "test": "Disconnect at the back and run it. Dries fine venting into the room means the run is the problem, full stop.", "fix": "Clean the full run including the roof or wall cap. Replace any foil accordion transition with rigid or semi-rigid."}, {"n": "Vent run too long or too many elbows", "k": "likely", "test": "Count equivalent length. Every 90 costs you roughly 5 ft of the allowance.", "fix": "Reroute shorter, or add a booster if reroute is impossible."}, {"n": "Crushed transition behind the dryer", "k": "likely", "test": "Pull the dryer out and look. Pushing the unit back against the wall flattens the duct every time.", "fix": "Rigid elbow with a periscope so it cannot crush."}, {"n": "Lint screen loaded with fabric softener film", "k": "possible", "test": "Pour water on the screen. If it beads or pools instead of running through, it is coated.", "fix": "Scrub with hot water and a brush."}]}, {"d": "Appliances", "s": "Washer will not drain", "t": "", "c": [{"n": "Clogged pump filter", "k": "first", "test": "Front loaders have an access panel at the bottom front. Expect coins, hair pins, and a sock. Have a shallow pan ready.", "fix": "Clear it. Tell them to check pockets, this one recurs."}, {"n": "Failed drain pump", "k": "first", "test": "Listen during the drain step. Hum with no flow means the pump is powered and seized or the impeller is broken.", "fix": "Replace the pump."}, {"n": "Kinked hose or blocked standpipe", "k": "likely", "test": "Pull the drain hose and pour water down the standpipe. Backs up means the house drain is the problem, not the machine.", "fix": "Snake the standpipe, straighten and secure the hose."}, {"n": "Lid switch or door lock", "k": "likely", "test": "Machine will not advance to drain and spin at all. Check the switch for continuity when engaged.", "fix": "Replace the switch or lock assembly."}, {"n": "Control board", "k": "rare", "test": "Everything else checks good. Always last.", "fix": "Replace the board only after the mechanical path is proven."}]}, {"d": "Appliances", "s": "Dishwasher leaves food and film on everything", "t": "", "c": [{"n": "Clogged filter and spray arms", "k": "first", "test": "Pull the lower filter and hold the spray arms up to a light. Blocked jets and a packed filter account for most complaints.", "fix": "Clean the filter, clear each jet with a wire, run a cleaner cycle."}, {"n": "Incoming water not hot enough", "k": "first", "test": "Run the kitchen tap into a cup with a thermometer until it peaks. Under 120 F and the detergent will not activate.", "fix": "Raise the water heater setpoint to 120, and tell them to run the tap hot before starting a cycle."}, {"n": "Tall item blocking the detergent door", "k": "likely", "test": "Open the door mid-cycle and check whether the dispenser opened and emptied.", "fix": "Loading change. Free fix."}, {"n": "Failed wash pump or chopper", "k": "likely", "test": "Listen for the wash motor. Weak spray pressure on the upper rack points here.", "fix": "Replace the pump or clear the chopper assembly."}, {"n": "Hard water scale", "k": "possible", "test": "White film on glass that wipes off with vinegar is scale, not detergent residue.", "fix": "Citric acid cleaner, rinse aid, and consider a softener on a well."}]}, {"d": "Appliances", "s": "Fridge warm but freezer is cold", "t": "", "c": [{"n": "Evaporator fan failed", "k": "first", "test": "Open the freezer and hold the door switch in. You should hear the fan. Silence with the compressor running is your answer.", "fix": "Replace the evaporator fan motor."}, {"n": "Frost blocking the air path", "k": "first", "test": "Pull the freezer back panel. A solid ice slab over the coil means the defrost system quit.", "fix": "Diagnose defrost heater, bimetal, and board. Melt the ice out before you reassemble."}, {"n": "Damper stuck closed", "k": "likely", "test": "Feel for airflow at the fresh food vent while the fan runs.", "fix": "Free or replace the damper assembly."}, {"n": "Door gasket leaking", "k": "likely", "test": "Dollar bill test around the whole perimeter. Slides out easily anywhere and the seal is bad there.", "fix": "Replace the gasket, or reheat and reshape a warped one."}, {"n": "Condenser coils packed with dust and pet hair", "k": "possible", "test": "Pull the base grille and look.", "fix": "Vacuum and brush. Twice a year with pets."}]}, {"d": "Appliances", "s": "Fridge not cooling at all, compressor is running", "t": "", "c": [{"n": "Sealed system leak", "k": "first", "test": "Condenser stays cool to the touch and there is no frost anywhere on the evaporator. Your 608 covers this work.", "fix": "Leak search, repair, evacuate deep, weigh in the exact charge. Domestic charges are small enough that a few grams matters."}, {"n": "Failed start relay or capacitor", "k": "first", "test": "Listen for a click, buzz for a few seconds, then click off on the overload, repeating every few minutes.", "fix": "Replace the relay and overload as a kit."}, {"n": "Restriction at the drier or cap tube", "k": "likely", "test": "Frost at exactly one point in the tubing then nothing after it.", "fix": "Replace the drier, flush, evacuate, recharge."}, {"n": "Condenser fan not running", "k": "likely", "test": "Look under the back. No fan means head pressure climbs and cooling collapses.", "fix": "Replace the fan motor."}]}, {"d": "Appliances", "s": "Gas burner clicks but will not light", "t": "", "c": [{"n": "Wet or misaligned igniter", "k": "first", "test": "After a boilover or a cleaning. Dry it thoroughly and reseat the burner cap square on its base.", "fix": "Dry it out, seat the cap. Costs nothing and works most of the time."}, {"n": "Burner ports plugged", "k": "likely", "test": "Look at the ports around the burner head with a light.", "fix": "Clear each port with a straightened paper clip, never a drill bit."}, {"n": "Cracked igniter ceramic", "k": "likely", "test": "Watch it in the dark. Spark jumping to the wrong place or a visible crack in the ceramic.", "fix": "Replace the igniter."}, {"n": "Failed spark module", "k": "possible", "test": "All burners click continuously even when a knob is off.", "fix": "Replace the module."}]}, {"d": "Appliances", "s": "Disposal hums but does not turn", "t": "", "c": [{"n": "Jammed impeller", "k": "first", "test": "Kill the switch. Put the hex wrench in the bottom center socket and work it back and forth. It will free with a snap.", "fix": "Free it, fish out the debris with tongs, never a hand."}, {"n": "Tripped internal overload", "k": "first", "test": "Red reset button on the bottom of the unit. It pops after any jam.", "fix": "Press it after you clear the jam, not before."}, {"n": "Seized motor bearing", "k": "likely", "test": "Will not turn with the wrench even with real force.", "fix": "Replace the unit. Rebuilding a disposal is not a thing."}]}, {"d": "Walls & Paint", "s": "Nail pops and screw pops in drywall", "t": "", "c": [{"n": "Framing shrinkage", "k": "first", "test": "House under two years old, pops on ceilings and upper walls first. Wet framing dries and shrinks away from the fastener.", "fix": "Drive a new screw 1 1/2 in away, remove or set the popped fastener, then three coats and prime the patch."}, {"n": "Fastener missed the framing", "k": "first", "test": "Push on the board next to the pop. Movement means the screw never caught wood.", "fix": "Re-fasten into the member, then patch."}, {"n": "Overdriven screws that broke the paper", "k": "likely", "test": "Look for a dimple with torn paper at the head. That fastener has no holding power left.", "fix": "Back it out, add fasteners nearby, patch."}, {"n": "Truss uplift", "k": "possible", "test": "Ceiling to wall crack that opens in winter and closes in summer, always in the same rooms.", "fix": "Crown molding fastened to the ceiling only, so the joint can move behind it."}]}, {"d": "Walls & Paint", "s": "Diagonal cracks from door and window corners", "t": "", "c": [{"n": "Normal racking at the weak point", "k": "first", "test": "Hairline, stable over months, only at openings. That corner is the thinnest section of wall so it goes first.", "fix": "Tape the crack properly with mesh or paper and mud, do not just caulk it."}, {"n": "Butt seam with no taper", "k": "likely", "test": "Crack follows a straight line that continues past the corner.", "fix": "Cut out, re-tape, feather wide, 18 in minimum."}, {"n": "Structural movement", "k": "possible", "test": "Wider than 1/8 in, or growing. Mark both ends with pencil and date it, then check in 60 days.", "fix": "Find the cause under the house before you touch the drywall. Patching an active crack is a callback."}]}, {"d": "Walls & Paint", "s": "Tape blistering or bubbling", "t": "", "c": [{"n": "Not enough mud under the tape", "k": "first", "test": "Tap it. Hollow means the tape never bonded because it was pressed into a dry joint.", "fix": "Cut out the loose tape, re-bed in a full wet coat, squeeze out the excess but leave mud behind."}, {"n": "Bedded over dust", "k": "likely", "test": "Sanding dust in the joint acts as a bond breaker.", "fix": "Cut out, wipe the joint, re-tape."}, {"n": "Painted before the mud cured", "k": "likely", "test": "Bubbles appeared after painting, not before.", "fix": "Cut, re-mud, let it dry, prime, then paint."}, {"n": "Water getting to it", "k": "possible", "test": "Moisture meter. Blisters in a bathroom ceiling or an exterior wall need a source hunt first.", "fix": "Fix the water, dry it out, then repair the drywall."}]}, {"d": "Walls & Paint", "s": "Paint peeling in sheets", "t": "", "c": [{"n": "No prep on a glossy or chalky surface", "k": "first", "test": "Tape test. Press painters tape on hard, rip it off. Paint comes with it and the bond was never there.", "fix": "Scrape, sand, clean, bonding primer, then topcoat."}, {"n": "Moisture from behind", "k": "first", "test": "Bath ceiling or an exterior wall. Check whether the bath fan actually terminates outside and not into the attic.", "fix": "Fix the moisture source first. Paint over active moisture always fails again."}, {"n": "Latex over old oil", "k": "likely", "test": "Denatured alcohol on a rag. Oil paint will not soften, latex will.", "fix": "Bonding primer between them."}, {"n": "Applied outside temperature range", "k": "possible", "test": "Ask when it was painted. Under 50 F or in direct sun on a hot wall.", "fix": "Redo in spec conditions."}]}, {"d": "Walls & Paint", "s": "The patch shows through the new paint", "t": "", "c": [{"n": "Unprimed mud flashing", "k": "first", "test": "The patch looks duller than the wall from an angle. Fresh mud drinks the binder out of the paint.", "fix": "Prime every patch with a dedicated primer, not with paint, then topcoat the whole wall corner to corner."}, {"n": "Sheen mismatch", "k": "first", "test": "Color matches at 90 degrees but not at a raking angle. That is sheen, not tint.", "fix": "Match the sheen and repaint the full plane. There is no way to spot fix a sheen difference."}, {"n": "Texture not matched", "k": "likely", "test": "Raking work light across the patch. Orange peel and knockdown never match by eye alone.", "fix": "Practice the hopper on cardboard until it matches, then shoot the patch."}, {"n": "Original faded by UV", "k": "possible", "test": "Compare to a spot behind a picture frame.", "fix": "Repaint the full wall or the full room."}]}, {"d": "Walls & Paint", "s": "Trim joints open up seasonally", "t": "", "c": [{"n": "Mitered inside corners", "k": "first", "test": "Look at the joint. Miters open with any humidity change, copes do not.", "fix": "Cope inside corners. This is the whole reason coping exists."}, {"n": "Wood installed wet or unacclimated", "k": "likely", "test": "Ask how long it sat in the house before install. Under a week is not enough.", "fix": "Acclimate a week minimum, and prime all six sides before install."}, {"n": "Nailed to drywall instead of framing", "k": "likely", "test": "Push on it. Movement means the nails never found a stud.", "fix": "Refasten into framing."}, {"n": "No caulk at the joint", "k": "possible", "test": "Bare joint with no flexible sealant.", "fix": "Caulk with a paintable elastomeric, not silicone."}]}, {"d": "Floors & Tile", "s": "Tile cracked in a straight line across the floor", "t": "", "c": [{"n": "Substrate deflection", "k": "first", "test": "Bounce test, then measure the joist span and depth. Tile needs L/360, natural stone needs L/720.", "fix": "Sister the joists or add a beam. Replacing the tile without fixing deflection just buys you another crack."}, {"n": "Slab control joint telegraphing up", "k": "first", "test": "The crack runs dead straight and lines up with a saw cut or a slab joint below.", "fix": "Honor the joint through the tile as a soft joint, or install an uncoupling membrane over it."}, {"n": "No perimeter movement joint", "k": "likely", "test": "Tile grouted tight to the wall with no gap behind the base.", "fix": "Cut a relief at the perimeter and every 20 to 25 ft interior, fill with sealant."}, {"n": "Voids under the tile", "k": "likely", "test": "Tap across the floor with a coin or a golf ball. Hollow spots are unsupported and they crack first.", "fix": "Remove and reset with full coverage."}]}, {"d": "Floors & Tile", "s": "Grout cracking at the wall to floor joint", "t": "", "c": [{"n": "Grout used where caulk belongs", "k": "first", "test": "Any change of plane needs a soft joint, not grout. Inside corners, floor to wall, tub to tile, all of them.", "fix": "Rake it out and fill with matching sanded caulk or 100 percent silicone."}, {"n": "Substrate movement", "k": "likely", "test": "Grout cracking in the field too, not just at corners.", "fix": "Chase the deflection or the framing issue first."}, {"n": "Grout mixed too wet or retempered", "k": "possible", "test": "Crumbly, powdery, or lighter in patches. Adding water after it stiffened kills the cement.", "fix": "Rake out and regrout, mix to spec and slake properly."}]}, {"d": "Floors & Tile", "s": "Tiles sound hollow or are coming loose", "t": "", "c": [{"n": "Not enough thinset coverage", "k": "first", "test": "Pull one and look at the back. You need 80 percent coverage dry areas, 95 percent wet areas and exteriors, with no voids at corners.", "fix": "Reset with the right trowel, back butter large format, and pull a tile early in the job to verify coverage."}, {"n": "Thinset skinned over before setting", "k": "first", "test": "Ridges are stiff and the back of the tile is clean where it should be pasted.", "fix": "Work smaller sections. In summer heat you have minutes, not an hour."}, {"n": "Wrong mortar for the tile", "k": "likely", "test": "Large format over 15 in on a side needs LFT or medium bed. Standard thinset slumps and leaves voids.", "fix": "Reset in the correct mortar."}, {"n": "Bond breaker on the substrate", "k": "likely", "test": "Sealer, curing compound, dust, or paint under the mortar.", "fix": "Grind or scarify to clean substrate, or install an uncoupling membrane."}]}, {"d": "Floors & Tile", "s": "Vinyl plank separating at the seams", "t": "", "c": [{"n": "No expansion gap", "k": "first", "test": "Pull the base off and look. Floating floors must be free to move at every wall and every fixed object.", "fix": "Trim the perimeter to a 1/4 to 3/8 in gap, then reinstall base."}, {"n": "Subfloor out of flatness tolerance", "k": "first", "test": "10 ft straightedge. Most LVP wants 3/16 in over 10 ft. Humps flex the joints until they unlock.", "fix": "Grind the highs, self-level the lows, then reinstall."}, {"n": "Pinched by a transition or a cabinet", "k": "likely", "test": "Look at doorways and toe kicks. A screwed-down transition through a floating floor pins it.", "fix": "Free the pin points and re-seat the field."}, {"n": "Direct sun expansion", "k": "possible", "test": "Gapping only along a big south or west window.", "fix": "Bigger expansion gap, and cheap window film."}]}, {"d": "Floors & Tile", "s": "Floor bounces or squeaks underfoot", "t": "", "c": [{"n": "Notched or drilled joist", "k": "first", "test": "Get under it. Look under the bathroom first, the plumber usually got there before you.", "fix": "Sister the joist full span with construction adhesive and structural screws."}, {"n": "Subfloor not fastened or glued", "k": "first", "test": "Squeak that moves with your weight and comes from the sheathing plane. Nails back out, screws and glue do not.", "fix": "Screw the subfloor to the joists from above, or shim from below with adhesive if the finish floor has to stay."}, {"n": "Overspanned joists", "k": "likely", "test": "Measure span, depth, and spacing. Compare to the span tables before assuming failure.", "fix": "Sister, add a mid-span beam, or add a bearing point."}, {"n": "Failed pier or girder in the crawl", "k": "likely", "test": "String line under the girder. Look for a pier that has settled or a shim stack that has crushed.", "fix": "Reset the pier on a proper footing and shim solid with steel or hardwood."}, {"n": "Missing blocking or bridging", "k": "possible", "test": "Joists rolling under load.", "fix": "Add solid blocking at mid span."}]}, {"d": "Roof & Envelope", "s": "Brown stain on the ceiling", "t": "They say the roof leaks", "c": [{"n": "Failed pipe boot", "k": "first", "test": "Number one residential roof leak. Look for a split in the rubber collar on every plumbing vent uphill of the stain.", "fix": "Replace with a lead boot or a collared metal boot. The rubber ones are a 10 year part on a 30 year roof."}, {"n": "Flashing at a wall or penetration, not the field", "k": "first", "test": "Water enters uphill and travels. Start at every intersection above the stain: chimney, dormer, skylight, wall.", "fix": "Rebuild step flashing woven into the courses. Caulk is not flashing."}, {"n": "Attic condensation, not a leak", "k": "first", "test": "Does it correlate with rain, or with cold snaps? Stain that appears in January with no rain is condensation dripping off the sheathing.", "fix": "Fix bath fans venting into the attic, air seal the ceiling plane, then balance intake and exhaust ventilation."}, {"n": "Missing kickout flashing", "k": "likely", "test": "Look where a roof edge dies into a sidewall. If there is no kickout, water has been running behind the siding for years.", "fix": "Install a kickout, repair the wall behind it, expect rot."}, {"n": "Nail pops through the shingle", "k": "possible", "test": "Walk the roof and look for raised nail heads dimpling the shingles above.", "fix": "Reseat, seal, and replace the affected shingles."}]}, {"d": "Roof & Envelope", "s": "Standing water in the crawlspace", "t": "", "c": [{"n": "Surface water from grading and downspouts", "k": "first", "test": "Walk the perimeter in the rain. Check that every downspout discharges at least 6 ft out and that grade falls away 6 in over the first 10 ft.", "fix": "Extend downspouts, regrade. This is 80 percent of crawlspace water and it is the cheapest fix on the list."}, {"n": "Plumbing leak", "k": "first", "test": "Shut every fixture, watch the meter dial for 20 minutes. Movement means a supply leak.", "fix": "Isolate by section and repair."}, {"n": "Summer condensation on cold surfaces", "k": "likely", "test": "Water on the ducts and the underside of the subfloor, not on the ground, and only in humid months. A vented crawl in NC pulls in 90 percent RH air and condenses it.", "fix": "Seal the vents, lay and seam a class I vapor barrier, add a dehumidifier."}, {"n": "High water table or a spring", "k": "possible", "test": "Water rises from the ground and stays after dry spells.", "fix": "Interior perimeter drain to a sump."}]}, {"d": "Roof & Envelope", "s": "Musty smell and high indoor humidity", "t": "", "c": [{"n": "Bath fan venting into the attic", "k": "first", "test": "Go in the attic and follow the duct. A shocking number of them just dump into insulation.", "fix": "Duct to a roof or gable termination with a damper, insulate the duct."}, {"n": "Vented crawlspace", "k": "first", "test": "Hygrometer under the house. Over 70 percent RH is a mold factory.", "fix": "Encapsulate, seal vents, condition or dehumidify."}, {"n": "Dryer venting into the crawl or attic", "k": "likely", "test": "Look at the termination. A dryer puts gallons of water into the air per load.", "fix": "Duct to the exterior in rigid pipe."}, {"n": "Oversized AC that never dehumidifies", "k": "likely", "test": "House holds temp but feels clammy, cycles are short.", "fix": "Lower the fan speed in cooling, add a dehumidifier, right-size at replacement."}, {"n": "Torn or missing vapor barrier", "k": "possible", "test": "Look at the ground under the house. Bare dirt evaporates constantly.", "fix": "6 mil minimum, seams lapped and taped, run it up the piers."}]}, {"d": "Roof & Envelope", "s": "Rot in siding or trim at one spot", "t": "", "c": [{"n": "Missing kickout flashing above", "k": "first", "test": "Look straight up from the rot. Roof to wall intersection with no kickout is the single most common cause of a wet wall.", "fix": "Install the kickout, repair sheathing, reinstall WRB with correct laps."}, {"n": "Downspout dumping on the wall", "k": "first", "test": "Follow the water path. Splash back soaks the bottom 2 ft of siding all winter.", "fix": "Reroute and extend."}, {"n": "Siding buried at grade", "k": "likely", "test": "Measure. You want 6 in clearance to soil, 2 in to hardscape.", "fix": "Regrade or cut back the siding and add a proper termination."}, {"n": "Failed sealant at a butt joint or trim head", "k": "likely", "test": "Probe with an awl above the rot. Soft means water came in over the top.", "fix": "Cut out, flash the joint properly, then seal. Flashing first, sealant second."}, {"n": "Sprinkler hitting the wall", "k": "possible", "test": "Watch a cycle.", "fix": "Aim the head."}]}, {"d": "Roof & Envelope", "s": "Gutters overflow in a heavy rain", "t": "", "c": [{"n": "Debris load", "k": "first", "test": "Look in them. Free, obvious, and usually it.", "fix": "Clean, then flush the downspouts with a hose."}, {"n": "Downspout clogged at the elbow", "k": "first", "test": "Water backs up at one end only. Tap the elbow and listen for a solid thud.", "fix": "Open the elbow and clear it."}, {"n": "Wrong pitch or pulled hangers", "k": "likely", "test": "String line or just look for standing water after it stops raining.", "fix": "Reset hangers to about 1/4 in fall per 10 ft toward the outlet."}, {"n": "Valley dumping more than the gutter can take", "k": "likely", "test": "Overflow only at one spot under a valley.", "fix": "Add a splash guard, upsize the gutter, or add a downspout there."}, {"n": "Missing drip edge", "k": "possible", "test": "Water wicks behind the gutter and stains the fascia.", "fix": "Install drip edge over the underlayment at the eave."}]}, {"d": "Doors & Openings", "s": "Door will not latch", "t": "", "c": [{"n": "Strike out of alignment", "k": "first", "test": "Lipstick or a marker on the latch, close the door, look at the transfer mark on the strike. It tells you exactly which way to move.", "fix": "File the strike, or move it and fill the old screw holes with glued dowels."}, {"n": "Door sagging from loose hinge screws", "k": "first", "test": "Lift the knob edge. Movement at the top hinge is the whole problem.", "fix": "Replace one screw per hinge leaf with a 3 in screw driven into the framing behind the jamb."}, {"n": "Swollen slab", "k": "likely", "test": "Only sticks in humid weather and the reveal is tight along one edge.", "fix": "Plane the edge lightly, then seal the cut edge so it stops absorbing."}, {"n": "Jamb pushed out of square", "k": "possible", "test": "Level and square the opening. Settlement racks the jamb.", "fix": "Reshim and refasten the jamb plumb."}]}, {"d": "Doors & Openings", "s": "Door swings open or closed by itself", "t": "", "c": [{"n": "Jamb out of plumb", "k": "first", "test": "Level the hinge jamb both ways. Out of plumb makes gravity do the rest.", "fix": "Reshim the jamb plumb. Correct fix."}, {"n": "Floor settled under the jamb", "k": "likely", "test": "Level the floor at the opening.", "fix": "Address the floor if it matters, otherwise use the hinge pin trick."}, {"n": "Nothing structural, just annoying", "k": "possible", "test": "Everything measures plumb and it still drifts.", "fix": "Pull a hinge pin, put a slight bend in it with a hammer, drive it back. Adds friction, takes two minutes."}]}, {"d": "Doors & Openings", "s": "Window will not stay up", "t": "", "c": [{"n": "Broken balance", "k": "first", "test": "Vinyl double hung. Pull the sash and look at the balance shoe in the jamb track. Broken coil or spiral is the usual answer.", "fix": "Replace the balance as a pair, matched to sash weight."}, {"n": "Sash out of the balance shoe", "k": "first", "test": "Tilt the sash and look at whether the pivot bar is engaged in the shoe. Cleaning day pops these out constantly.", "fix": "Reset the shoe square and reseat the pivot bar. Free."}, {"n": "Broken sash cord or chain", "k": "likely", "test": "Old wood double hung. Open the pocket cover in the jamb and look for the weight.", "fix": "Rope the weight back in. Keep the original weights, they are sized to the sash."}]}, {"d": "Doors & Openings", "s": "Garage door reverses before it closes", "t": "", "c": [{"n": "Safety eyes misaligned or blocked", "k": "first", "test": "Look at the LEDs. One steady and one blinking means they are not seeing each other. A leaf, a bike tire, or a bumped bracket does it.", "fix": "Realign until both LEDs are solid, then tighten the wing nuts."}, {"n": "Something on the floor in the path", "k": "first", "test": "Sweep the threshold. Costs ten seconds.", "fix": "Clear it."}, {"n": "Close force set too low", "k": "likely", "test": "Eyes are solid and it still reverses. Check the force adjustment on the opener head.", "fix": "Increase in small increments, then test with a 2x4 flat on the floor. It must reverse on contact."}, {"n": "Binding track or a flat roller", "k": "likely", "test": "Disconnect the trolley and run the door by hand. Any bind or grab is mechanical, not electronic.", "fix": "Straighten the track, replace rollers, lubricate hinges and rollers only."}]}, {"d": "Doors & Openings", "s": "Garage door is heavy and will not stay half open", "t": "", "c": [{"n": "Broken torsion spring", "k": "first", "danger": true, "test": "Look at the spring over the header for a visible gap in the coil. That gap is the whole diagnosis.", "fix": "Replace in pairs with correctly sized springs and proper winding bars. A wound torsion spring holds enough energy to kill you. If you are not set up for it with real bars and clear positioning, this is the one job on this whole site to skip."}, {"n": "Springs lost tension with age", "k": "likely", "test": "Door balances poorly but no visible break. Should hold at halfway when disconnected.", "fix": "Adjust winding by quarter turns with proper bars, or replace at end of cycle life."}, {"n": "Cable off the drum", "k": "likely", "test": "Door hangs crooked, one side low, slack cable on that side.", "fix": "Clamp the door, relieve tension, reseat the cable, re-tension both drums evenly."}]}, {"d": "Doors & Openings", "s": "Opener motor runs but the door does not move", "t": "", "c": [{"n": "Trolley disconnected", "k": "first", "test": "Look for the red release rope hanging down and the carriage riding free on the rail. Easiest check on the list.", "fix": "Pull the rope toward the door, then run the opener until the carriage relatches."}, {"n": "Stripped drive gear", "k": "first", "test": "Chain drive, motor runs with a grinding whir, no movement at the chain. Pull the cover, look for plastic shavings.", "fix": "Gear and sprocket kit. Cheap, and it is the standard failure on chain drives around year 12."}, {"n": "Broken chain or belt", "k": "likely", "test": "Visual.", "fix": "Replace and re-tension to spec."}]}, {"d": "Small Engine", "s": "Will not start", "t": "", "c": [{"n": "Stale fuel and a varnished jet", "k": "first", "test": "Smell the tank. Ethanol fuel over 30 days turns sour and gums the main jet. This is the answer more than half the time.", "fix": "Drain, fresh fuel, pull the bowl and clean the main jet and emulsion tube. Carb cleaner and a strand of wire, never a drill bit."}, {"n": "Safety interlock not made", "k": "first", "test": "Bail lever, seat switch, blade brake, PTO switch. Check every one before you take anything apart.", "fix": "Adjust or replace the switch. Do not bypass a blade brake."}, {"n": "No spark", "k": "first", "test": "Inline spark tester, or pull the plug, ground it against the head, and crank. No spark sends you to the plug, then the coil, then the kill wire.", "fix": "New plug gapped to spec. If still nothing, check the kill wire for a short before you condemn the coil."}, {"n": "Sheared flywheel key", "k": "likely", "test": "After hitting a root or a stump. Pull the flywheel and look at the key.", "fix": "New key. Torque the flywheel nut to spec."}, {"n": "Low compression", "k": "possible", "test": "Gauge it, or feel for resistance pulling the rope. Under about 60 psi will not fire.", "fix": "Valve adjustment first on OHV engines, they tighten up and lose compression. Rings after that."}]}, {"d": "Small Engine", "s": "Starts, runs a minute, then dies", "t": "", "c": [{"n": "Blocked fuel cap vent", "k": "first", "test": "Loosen the cap and restart. If it runs, that was it. The tank vacuum-locks and starves the carb.", "fix": "Clean or replace the cap."}, {"n": "Partially blocked main jet", "k": "first", "test": "Runs on choke or half choke. That means it is starved for fuel and the choke is enriching it.", "fix": "Pull and clean the bowl, main jet, and emulsion tube."}, {"n": "Failed fuel pump or cracked pulse line", "k": "likely", "test": "Watch fuel flow into the bowl. Vacuum pumps fail with a cracked pulse hose.", "fix": "Replace the pump and the pulse line."}, {"n": "Coil breaking down when hot", "k": "possible", "test": "Dies hot, restarts after 20 minutes cold. Classic coil failure signature.", "fix": "Replace the coil, gap it with a business card."}]}, {"d": "Small Engine", "s": "Runs rough or surges at idle", "t": "", "c": [{"n": "Dirty pilot jet", "k": "first", "test": "Surging at low throttle that smooths out under load is a lean idle circuit.", "fix": "Clean the pilot jet and passages. This circuit is tiny and it plugs first."}, {"n": "Intake gasket air leak", "k": "likely", "test": "Spray a little carb cleaner around the intake while running. RPM change means you found the leak.", "fix": "Replace the gasket and torque the carb evenly."}, {"n": "Governor linkage or spring", "k": "likely", "test": "Hunting up and down rhythmically. Check the spring is on the right hole and the linkage is free.", "fix": "Reset the linkage per the manual and adjust static governor."}]}, {"d": "Structure", "s": "Floor slopes noticeably", "t": "", "c": [{"n": "Settled pier or crushed shim stack", "k": "first", "test": "Get under it with a laser or a long level. Find the low point, then look straight up and straight down from it.", "fix": "Temporary crib and bottle jack, lift slowly over days not hours, reset the pier on a proper footing, shim solid."}, {"n": "Rot at the sill or band joist", "k": "first", "test": "Probe with an awl anywhere near a hose bibb, a downspout, or a deck ledger. Soft wood pushes right in.", "fix": "Fix the water source, then cut out and replace the rotted framing with proper temporary support."}, {"n": "Undersized or overspanned joists", "k": "likely", "test": "Measure and check the span tables. Older houses were built to older tables.", "fix": "Sister the joists or add a beam and piers."}, {"n": "Original settlement, long since stable", "k": "likely", "test": "Old house, no active cracking, doors have been shaved. Mark and date crack ends and check in 90 days.", "fix": "If it is not moving, level the floor cosmetically and leave the structure alone."}]}, {"d": "Structure", "s": "Doors sticking all over the house at once", "t": "", "c": [{"n": "Seasonal moisture movement", "k": "first", "test": "Ask when it started and whether it goes away. Humidity swings move framing enough to bind doors, especially upstairs.", "fix": "Wait for the season to turn before planing anything. Control indoor humidity."}, {"n": "Foundation movement", "k": "first", "test": "Plot every sticking door and every crack on a floor plan. If they point the same direction, you have a direction of movement, not random settlement.", "fix": "Find the cause: water at the foundation, a failed pier, or expansive soil. Fix the cause before the cosmetics."}, {"n": "Framing shrinkage in a new house", "k": "likely", "test": "Under two years old, paired with nail pops everywhere.", "fix": "Adjust strikes and hinges after the first full year, once."}, {"n": "Roof load path issue", "k": "possible", "test": "Look for a sagging ridge or a bowed wall. Someone cut a bearing wall for an open floor plan.", "fix": "Engineer the beam. This is the one place on this list where guessing is expensive."}]}];
const TIER = {first:"Check first", likely:"Likely", possible:"Possible", rare:"Rare"};
const DOMAINS = [...new Set(DATA.map(x => x.d))];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const totalCauses = DATA.reduce((a, x) => a + x.c.length, 0);
DATA.forEach((x, i) => x.id = i);

let domain = null, query = "";

/* ---------- ladder markup, shared by both modes ---------- */
function ladder(item){
  return item.c.map((c, i) => `
    <div class="rung" data-k="${c.k}" ${c.danger ? 'data-danger' : ''}>
      <div class="rail"></div>
      <div class="rungbody">
        <div class="rungtop">
          <span class="rank">${String(i + 1).padStart(2, '0')}</span>
          <span class="cause">${esc(c.n)}</span>
          <span class="pill">${TIER[c.k]}</span>
          ${c.danger ? '<span class="pill hazard">Can kill you</span>' : ''}
        </div>
        <div class="line test"><span class="lab">TEST</span><p>${esc(c.test)}</p></div>
        ${c.fix ? `<div class="line fix"><span class="lab">FIX</span><p>${esc(c.fix)}</p></div>` : ''}
      </div>
    </div>`).join('');
}

/* ---------- reference ---------- */
function matches(){
  const q = query.trim().toLowerCase();
  return DATA.filter(x => {
    if (domain && x.d !== domain) return false;
    if (!q) return true;
    const hay = (x.s + ' ' + x.d + ' ' + x.t + ' ' + x.c.map(c => c.n + ' ' + c.test + ' ' + c.fix).join(' ')).toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  });
}

function render(){
  const rows = matches();
  document.getElementById('count').textContent =
    rows.length ? `${rows.length} symptom${rows.length > 1 ? 's' : ''}${domain ? ' in ' + domain : ''}${query ? ' matching "' + query + '"' : ''}` : '';
  document.getElementById('list').innerHTML = rows.length ? rows.map(x => `
    <article class="card" data-id="${x.id}">
      <button class="head" aria-expanded="false">
        <span class="n">${String(x.c.length).padStart(2, '0')}</span>
        <span class="headtext">
          <span class="eyebrow">${esc(x.d)}</span>
          <span class="sym">${esc(x.s)}</span>
          ${x.t ? `<span class="tell">${esc(x.t)}</span>` : ''}
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="ladder">${ladder(x)}</div>
    </article>`).join('')
    : `<div class="empty">Nothing matches that. Try a part name, a noise, or a smell.</div>`;
}

document.getElementById('list').addEventListener('click', e => {
  const head = e.target.closest('.head');
  if (!head) return;
  const card = head.closest('.card');
  const open = card.classList.toggle('open');
  head.setAttribute('aria-expanded', open);
});

document.getElementById('chips').innerHTML =
  `<button class="chip" data-d="" aria-pressed="true">All trades</button>` +
  DOMAINS.map(d => `<button class="chip" data-d="${esc(d)}" aria-pressed="false">${esc(d)}</button>`).join('');

document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  domain = chip.dataset.d || null;
  [...document.querySelectorAll('.chip')].forEach(c => c.setAttribute('aria-pressed', c === chip));
  render();
});

document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });

/* ---------- drill ---------- */
const KEY = 'firstcheck.v1';
let hist = {};
try { hist = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { hist = {}; }
let streak = 0, current = null, revealed = false;

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(hist)); } catch(e) {} };

function stats(){
  const v = Object.values(hist);
  const hit = v.reduce((a, x) => a + x.hit, 0), miss = v.reduce((a, x) => a + x.miss, 0);
  document.getElementById('mStreak').textContent = streak;
  document.getElementById('mRate').textContent = (hit + miss) ? Math.round(hit / (hit + miss) * 100) + '%' : '--';
  document.getElementById('mSeen').textContent = hit + miss;
  document.getElementById('mWeak').textContent = v.filter(x => x.miss > x.hit).length;
}

function pick(){
  const pool = DATA.filter(x => !domain || x.d === domain);
  const bag = [];
  pool.forEach(x => {
    const h = hist[x.id] || {hit:0, miss:0};
    let w = h.hit + h.miss === 0 ? 3 : (h.miss > h.hit ? 5 : 1);
    if (current && x.id === current.id && pool.length > 1) w = 0;
    for (let i = 0; i < w; i++) bag.push(x);
  });
  return bag[Math.floor(Math.random() * bag.length)] || pool[0];
}

function deal(){
  current = pick();
  revealed = false;
  document.getElementById('dEyebrow').textContent = current.d + ' / what do you check first?';
  document.getElementById('dSym').textContent = current.s;
  const tell = document.getElementById('dTell');
  tell.textContent = current.t || '';
  tell.style.display = current.t ? 'block' : 'none';
  document.getElementById('dLadder').innerHTML = ladder(current);
  document.getElementById('answer').classList.remove('on');
  document.getElementById('dActs').style.display = 'flex';
  stats();
}

function reveal(){
  if (revealed) return;
  revealed = true;
  document.getElementById('answer').classList.add('on');
  document.getElementById('dActs').style.display = 'none';
}

function grade(ok){
  if (!revealed) return;
  const h = hist[current.id] || {hit:0, miss:0};
  ok ? h.hit++ : h.miss++;
  hist[current.id] = h;
  streak = ok ? streak + 1 : 0;
  save();
  deal();
}

document.getElementById('dShow').onclick = reveal;
document.getElementById('dSkip').onclick = deal;
document.getElementById('dGot').onclick = () => grade(true);
document.getElementById('dMiss').onclick = () => grade(false);
document.getElementById('dReset').onclick = () => { hist = {}; streak = 0; save(); deal(); };

/* ---------- modes ---------- */
function setMode(drilling){
  document.getElementById('ref').style.display = drilling ? 'none' : 'block';
  document.getElementById('drill').style.display = drilling ? 'block' : 'none';
  document.getElementById('mRef').setAttribute('aria-pressed', !drilling);
  document.getElementById('mDrill').setAttribute('aria-pressed', drilling);
  document.querySelector('.search').style.display = drilling ? 'none' : 'flex';
  if (drilling) deal();
}
document.getElementById('mRef').onclick = () => setMode(false);
document.getElementById('mDrill').onclick = () => setMode(true);

document.addEventListener('keydown', e => {
  const typing = e.target.tagName === 'INPUT';
  if (e.key === '/' && !typing) { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Escape' && typing) { e.target.value = ''; query = ''; render(); e.target.blur(); return; }
  if (document.getElementById('drill').style.display !== 'block' || typing) return;
  if (e.code === 'Space' && !revealed) { e.preventDefault(); reveal(); }
  if (e.key === '1') grade(true);
  if (e.key === '2') grade(false);
  if (e.key === 's') deal();
});

document.getElementById('fcount').textContent =
  `${DATA.length} symptoms · ${totalCauses} ranked causes · ${DOMAINS.length} trades`;
render();
stats();
</script>
</body>
</html>
