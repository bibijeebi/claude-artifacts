<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solunar Fishing Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<style>
:root{
  --best:#1b5e20;--best-bg:#c8e6c9;
  --good:#2e7d32;--good-bg:#e8f5e9;
  --fair:#e65100;--fair-bg:#fff3e0;
  --poor:#b71c1c;--poor-bg:#ffebee;
  --bg:#faf8f5;--card:#fff;--border:#e0ddd8;
  --text:#2c2416;--text2:#6b5f4f;--accent:#1565c0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:28px 16px 4px}
.header h1{font-family:'Bitter',serif;font-size:26px;font-weight:700}
.header p{font-size:13px;color:var(--text2);margin-top:2px}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.nav button{background:none;border:2px solid var(--border);border-radius:8px;padding:7px 14px;font-family:'Bitter',serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s}
.nav button:hover{border-color:var(--accent);color:var(--accent)}
.nav .month-label{font-family:'Bitter',serif;font-size:18px;font-weight:700;min-width:180px;text-align:center}
.nav .today-btn{font-size:11px;padding:5px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer}
.view-toggle{display:flex;justify-content:center;gap:0;padding:8px 16px}
.view-toggle button{background:var(--card);border:1px solid var(--border);padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text2);font-family:'Source Sans 3',sans-serif}
.view-toggle button:first-child{border-radius:6px 0 0 6px}
.view-toggle button:last-child{border-radius:0 6px 6px 0}
.view-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{display:flex;justify-content:center;gap:14px;padding:6px 16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.legend-dot{width:12px;height:12px;border-radius:3px}
.stats{display:flex;justify-content:center;gap:18px;padding:6px 16px 12px;flex-wrap:wrap}
.stat{text-align:center}
.stat .num{font-family:'Bitter',serif;font-size:20px;font-weight:700}
.stat .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

.cal-grid{max-width:780px;margin:0 auto;padding:0 12px 24px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px;min-height:74px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.cal-cell:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.today{border:2px solid var(--accent);box-shadow:0 0 0 1px rgba(21,101,192,.2)}
.cal-cell .day-num{font-family:'Bitter',serif;font-weight:700;font-size:14px}
.cal-cell .mini-badge{display:block;margin-top:3px;padding:2px 0;border-radius:3px;font-size:10px;font-weight:600;text-align:center;color:#fff}
.cal-cell .mini-info{font-size:9px;color:var(--text2);margin-top:2px;text-align:center}
.cal-cell .mini-phase{font-size:14px;text-align:center;margin-top:1px}
.badge-Best{background:var(--best)}.badge-Good{background:var(--good)}.badge-Fair{background:var(--fair)}.badge-Poor{background:var(--poor)}

.list{max-width:680px;margin:0 auto;padding:0 12px 24px}
.day-row{display:grid;grid-template-columns:82px 30px 56px 66px 1fr 74px;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer}
.day-row:nth-child(odd){background:#faf8f5}
.day-row:hover{background:#f0ede8}
.day-row.today-row{border-left:3px solid var(--accent)}
.day-row .date{font-weight:600;font-size:12px}
.day-row .dow{font-size:11px;color:var(--text2)}
.rating-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-weight:600;font-size:11px;text-align:center;color:#fff}
.day-row .time{font-size:12px;color:var(--text2)}
.day-row .phase{font-size:12px}
.day-row .zodiac{font-size:12px;color:var(--text2);text-align:right}

.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center}
.detail-card{background:var(--card);border-radius:12px;padding:22px;max-width:320px;width:90%;box-shadow:0 16px 50px rgba(0,0,0,.2)}
.detail-card h3{font-family:'Bitter',serif;font-size:18px;margin-bottom:10px}
.detail-card .field{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-card .field:last-of-type{border:none}
.detail-card .field .label{color:var(--text2)}
.detail-card .close{margin-top:14px;width:100%;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

.year-jump{display:flex;justify-content:center;gap:6px;padding:4px 16px;flex-wrap:wrap}
.year-jump button{background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;color:var(--text2);font-family:'Source Sans 3',sans-serif}
.year-jump button:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:600px){
  .day-row{grid-template-columns:68px 26px 50px 58px 1fr;gap:3px;padding:7px 6px}
  .day-row .zodiac{display:none}
  .cal-cell{min-height:58px;padding:3px}
  .cal-cell .day-num{font-size:12px}
  .header h1{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🎣 Solunar Fishing Calendar</h1>
    <p>Real-time computation for any date, past or future</p>
    <p style="font-size:11px;color:#999;margin-top:2px">Phase-dominant solunar model with zodiac ±1 tier shift</p>
  </div>
  <div id="content"><p style="text-align:center;padding:40px;color:#999">Loading astronomy engine...</p></div>
</div>
<script>
const ZODIAC=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const ZODIAC_EMOJI=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
const ZODIAC_SHIFT={Aries:-1,Taurus:0,Gemini:0,Cancer:1,Leo:-1,Virgo:0,Libra:0,Scorpio:1,Sagittarius:0,Capricorn:0,Aquarius:-1,Pisces:1};
const PHASES=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
const PHASE_EMOJI=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TIERS=['Poor','Fair','Good','Best'];

const OBS=new Astronomy.Observer(35.5527,-78.6753,90);

// Cache computed months
const cache={};

function computeDay(year,month,day){
  const key=`${year}-${month}-${day}`;
  if(cache[key]) return cache[key];

  const d=new Date(year,month,day,12,0,0);
  const t=Astronomy.MakeTime(d);

  // Moon phase angle (0=new, 180=full)
  const phaseAngle=Astronomy.MoonPhase(t);

  // Moon ecliptic longitude for zodiac
  const ecl=Astronomy.EclipticGeoMoon(t);
  const lonDeg=(ecl.lon+360)%360;
  const zIdx=Math.floor(lonDeg/30);
  const zodiac=ZODIAC[zIdx];

  // Phase name
  let pIdx;
  if(phaseAngle<11.25||phaseAngle>=348.75) pIdx=0;
  else if(phaseAngle<78.75) pIdx=1;
  else if(phaseAngle<101.25) pIdx=2;
  else if(phaseAngle<168.75) pIdx=3;
  else if(phaseAngle<191.25) pIdx=4;
  else if(phaseAngle<258.75) pIdx=5;
  else if(phaseAngle<281.25) pIdx=6;
  else pIdx=7;

  // Phase base rating (v4 model)
  const dNew=Math.min(phaseAngle,360-phaseAngle)/12.19;
  const dFull=Math.abs(phaseAngle-180)/12.19;
  const dNF=Math.min(dNew,dFull);
  const dQ1=Math.abs(phaseAngle-90)/12.19;
  const dQ3=Math.abs(phaseAngle-270)/12.19;
  const dQ=Math.min(dQ1,dQ3);

  let baseIdx;
  if(dNF<=0.8) baseIdx=3;
  else if(dNF<=3.2) baseIdx=2;
  else if(dQ<=0.8) baseIdx=2;
  else if(dQ<=2.2) baseIdx=1;
  else if(dNF<=3.2) baseIdx=2;
  else baseIdx=0;

  const shift=ZODIAC_SHIFT[zodiac];
  const finalIdx=Math.max(0,Math.min(3,baseIdx+shift));
  const rating=TIERS[finalIdx];

  // Illumination
  const illum=((1-Math.cos(phaseAngle*Math.PI/180))/2)*100;

  // Best time: moonrise/moonset based
  let bestTime='Morning';
  try{
    const dayStart=Astronomy.MakeTime(new Date(year,month,day,0,0,0));
    const ms=Astronomy.SearchRiseSet('Moon',OBS,-1,dayStart,1);
    if(ms){
      const msH=ms.date.getHours()+ms.date.getMinutes()/60;
      if(msH>=3&&msH<=11) bestTime='Morning';
      else if(msH>=15) bestTime='Evening';
      else{
        const mr=Astronomy.SearchRiseSet('Moon',OBS,+1,dayStart,1);
        if(mr){
          const mrH=mr.date.getHours()+mr.date.getMinutes()/60;
          bestTime=(mrH>=15&&mrH<=23)?'Evening':'Morning';
        }
      }
    }
  }catch(e){}

  const result={
    date:`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,
    day:DOW[d.getDay()], rating, bestTime,
    phase:PHASES[pIdx], phaseIdx:pIdx, phaseAngle:Math.round(phaseAngle*10)/10,
    zodiac, zodiacIdx:zIdx, zodiacShift:shift,
    baseRating:TIERS[baseIdx], illumination:Math.round(illum*10)/10,
    daysFromNF:Math.round(dNF*10)/10, d
  };
  cache[key]=result;
  return result;
}

function computeMonth(year,month){
  const days=new Date(year,month+1,0).getDate();
  const results=[];
  for(let d=1;d<=days;d++) results.push(computeDay(year,month,d));
  return results;
}

let curYear, curMonth, view='calendar', selected=null;

function init(){
  const now=new Date();
  curYear=now.getFullYear();
  curMonth=now.getMonth();
  render();
}

function render(){
  const md=computeMonth(curYear,curMonth);
  const counts={Best:0,Good:0,Fair:0,Poor:0};
  md.forEach(d=>counts[d.rating]++);
  const now=new Date();
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  let html=`
  <div class="nav">
    <button onclick="prevYear()">◀◀</button>
    <button onclick="prev()">◀</button>
    <div class="month-label">${MONTHS[curMonth]} ${curYear}</div>
    <button onclick="next()">▶</button>
    <button onclick="nextYear()">▶▶</button>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>
  <div class="view-toggle">
    <button class="${view==='calendar'?'active':''}" onclick="setView('calendar')">Calendar</button>
    <button class="${view==='list'?'active':''}" onclick="setView('list')">List</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--best)"></div>Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--good)"></div>Good</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--fair)"></div>Fair</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--poor)"></div>Poor</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" style="color:var(--best)">${counts.Best}</div><div class="lbl">Best</div></div>
    <div class="stat"><div class="num" style="color:var(--good)">${counts.Good}</div><div class="lbl">Good</div></div>
    <div class="stat"><div class="num" style="color:var(--fair)">${counts.Fair}</div><div class="lbl">Fair</div></div>
    <div class="stat"><div class="num" style="color:var(--poor)">${counts.Poor}</div><div class="lbl">Poor</div></div>
  </div>`;

  if(view==='calendar'){
    const firstDow=new Date(curYear,curMonth,1).getDay();
    html+=`<div class="cal-grid"><div class="cal-header">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-body">`;
    for(let i=0;i<firstDow;i++) html+=`<div class="cal-cell empty"></div>`;
    md.forEach(d=>{
      const day=d.d.getDate();
      const isToday=d.date===todayStr;
      html+=`<div class="cal-cell${isToday?' today':''}" onclick="showDetail('${d.date}')">
        <div class="day-num">${day}</div>
        <div class="mini-badge badge-${d.rating}">${d.rating}</div>
        <div class="mini-phase">${PHASE_EMOJI[d.phaseIdx]}</div>
        <div class="mini-info">${d.bestTime}</div>
      </div>`;
    });
    html+=`</div></div>`;
  }else{
    html+=`<div class="list">`;
    md.forEach(d=>{
      const day=d.d.getDate();
      const isToday=d.date===todayStr;
      html+=`<div class="day-row${isToday?' today-row':''}" onclick="showDetail('${d.date}')">
        <div class="date">${MONTHS[curMonth].slice(0,3)} ${day}</div>
        <div class="dow">${d.day}</div>
        <div><span class="rating-badge badge-${d.rating}">${d.rating}</span></div>
        <div class="time">${d.bestTime}</div>
        <div class="phase">${PHASE_EMOJI[d.phaseIdx]} ${d.phase}</div>
        <div class="zodiac">${ZODIAC_EMOJI[d.zodiacIdx]} ${d.zodiac}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  if(selected){
    const parts=selected.split('-');
    const d=computeDay(+parts[0],+parts[1]-1,+parts[2]);
    html+=`<div class="detail-overlay" onclick="closeDetail()">
      <div class="detail-card" onclick="event.stopPropagation()">
        <h3>${PHASE_EMOJI[d.phaseIdx]} ${d.date}</h3>
        <div class="field"><span class="label">Rating</span><span class="rating-badge badge-${d.rating}">${d.rating}</span></div>
        <div class="field"><span class="label">Best Time</span><span>${d.bestTime}</span></div>
        <div class="field"><span class="label">Moon Phase</span><span>${PHASE_EMOJI[d.phaseIdx]} ${d.phase}</span></div>
        <div class="field"><span class="label">Phase Angle</span><span>${d.phaseAngle}°</span></div>
        <div class="field"><span class="label">Illumination</span><span>${d.illumination}%</span></div>
        <div class="field"><span class="label">Zodiac</span><span>${ZODIAC_EMOJI[d.zodiacIdx]} ${d.zodiac}</span></div>
        <div class="field"><span class="label">Base (Phase)</span><span>${d.baseRating}</span></div>
        <div class="field"><span class="label">Zodiac Shift</span><span>${d.zodiacShift>=0?'+'+d.zodiacShift:d.zodiacShift}</span></div>
        <div class="field"><span class="label">Days from N/F</span><span>${d.daysFromNF}</span></div>
        <button class="close" onclick="closeDetail()">Close</button>
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML=html;
}

function prev(){curMonth--;if(curMonth<0){curMonth=11;curYear--;}render()}
function next(){curMonth++;if(curMonth>11){curMonth=0;curYear++;}render()}
function prevYear(){curYear--;render()}
function nextYear(){curYear++;render()}
function goToday(){const n=new Date();curYear=n.getFullYear();curMonth=n.getMonth();render()}
function setView(v){view=v;render()}
function showDetail(date){selected=date;render()}
function closeDetail(){selected=null;render()}

// Wait for Astronomy to load
if(typeof Astronomy!=='undefined'){init()}
else{
  const check=setInterval(()=>{
    if(typeof Astronomy!=='undefined'){clearInterval(check);init()}
  },100);
}
</script>
</body>
</html>
