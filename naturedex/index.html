<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NatureDex</title>
  <meta name="description" content="Your personal nature Pokedex - track and collect every species you encounter">
  <meta property="og:title" content="NatureDex">
  <meta property="og:description" content="Your personal nature Pokedex - track and collect every species you encounter">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1a1814;
      --bg-card: #252220;
      --bg-card-hover: #2d2a27;
      --border: #3d3835;
      --text-primary: #f5f0e8;
      --text-secondary: #a89f94;
      --text-muted: #6b635a;
      --accent-green: #7cb342;
      --accent-green-dim: #4a6b28;
      --accent-amber: #ffb300;
      --accent-red: #e57373;
      --accent-blue: #64b5f6;
      --silhouette: #1a1814;
      --caught-glow: rgba(124, 179, 66, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 0%, rgba(124, 179, 66, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 179, 0, 0.05) 0%, transparent 50%);
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Instrument Serif', serif;
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--accent-green);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.5rem;
    }

    .progress-container {
      max-width: 500px;
      margin: 2rem auto;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-card);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-green-dim), var(--accent-green));
      border-radius: 4px;
      transition: width 0.5s ease-out;
    }

    .progress-text {
      text-align: center;
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.6rem 1.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 2rem;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg-deep);
      font-weight: 600;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
    }

    .search-input {
      padding: 0.6rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      width: 250px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    .location-select {
      padding: 0.6rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .location-select:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }

    .species-card {
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .species-card:hover {
      transform: translateY(-4px);
      border-color: var(--text-muted);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .species-card.caught {
      border-color: var(--accent-green-dim);
      box-shadow: 0 0 20px var(--caught-glow);
    }

    .species-card.caught:hover {
      border-color: var(--accent-green);
    }

    .species-image {
      width: 100%;
      height: 70%;
      object-fit: cover;
      background: var(--bg-deep);
    }

    .species-card:not(.caught) .species-image {
      filter: brightness(0) opacity(0.15);
    }

    .species-silhouette {
      width: 100%;
      height: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      color: var(--text-muted);
      font-size: 3rem;
    }

    .species-info {
      padding: 0.75rem;
      height: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .species-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .species-card:not(.caught) .species-name {
      color: var(--text-muted);
    }

    .species-scientific {
      font-size: 0.7rem;
      font-style: italic;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .caught-badge {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 1.5rem;
      height: 1.5rem;
      background: var(--accent-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s ease;
    }

    .species-card.caught .caught-badge {
      opacity: 1;
      transform: scale(1);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-image {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 1.5rem 1.5rem 0 0;
    }

    .modal-content {
      padding: 1.5rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1.8rem;
      font-weight: 400;
    }

    .modal-scientific {
      font-size: 1rem;
      font-style: italic;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .modal-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--bg-deep);
      border-radius: 0.75rem;
    }

    .modal-stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-stat-value {
      font-size: 1rem;
      color: var(--text-primary);
      margin-top: 0.25rem;
    }

    .catch-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent-green-dim), var(--accent-green));
      border: none;
      border-radius: 0.75rem;
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .catch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px var(--caught-glow);
    }

    .catch-btn.caught {
      background: var(--bg-deep);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
    }

    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
    }

    .category-icon {
      font-size: 1.2rem;
      margin-right: 0.25rem;
    }

    .new-catch-animation {
      animation: catchPulse 0.6s ease-out;
    }

    @keyframes catchPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); box-shadow: 0 0 40px var(--caught-glow); }
      100% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .app { padding: 1rem; }
      .logo { font-size: 2.5rem; }
      .stats-bar { gap: 1.5rem; }
      .stat-value { font-size: 2rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-box { flex-direction: column; }
      .search-input { width: 100%; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 class="logo">NatureDex</h1>
      <p class="tagline">Gotta observe 'em all</p>
      
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-value" id="caught-count">0</div>
          <div class="stat-label">Discovered</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="total-count">0</div>
          <div class="stat-label">Total Species</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="streak-count">0</div>
          <div class="stat-label">Day Streak</div>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progress-text">0% Complete</div>
      </div>
    </header>

    <div class="controls">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all"><span class="category-icon">🌍</span> All</button>
        <button class="filter-btn" data-filter="Aves"><span class="category-icon">🐦</span> Birds</button>
        <button class="filter-btn" data-filter="Plantae"><span class="category-icon">🌿</span> Plants</button>
        <button class="filter-btn" data-filter="Insecta"><span class="category-icon">🦋</span> Insects</button>
        <button class="filter-btn" data-filter="Mammalia"><span class="category-icon">🦊</span> Mammals</button>
        <button class="filter-btn" data-filter="Fungi"><span class="category-icon">🍄</span> Fungi</button>
        <button class="filter-btn" data-filter="Reptilia"><span class="category-icon">🦎</span> Reptiles</button>
        <button class="filter-btn" data-filter="Amphibia"><span class="category-icon">🐸</span> Amphibians</button>
      </div>
      
      <div class="search-box">
        <input type="text" class="search-input" id="search" placeholder="Search species...">
        <select class="location-select" id="location">
          <option value="37">North Carolina</option>
          <option value="55">Wisconsin</option>
          <option value="1">United States</option>
        </select>
      </div>
    </div>

    <div id="grid-container">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading species data...</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <img class="modal-image" id="modal-image" src="" alt="">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2 class="modal-title" id="modal-title"></h2>
            <p class="modal-scientific" id="modal-scientific"></p>
          </div>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        
        <div class="modal-stats">
          <div>
            <div class="modal-stat-label">Category</div>
            <div class="modal-stat-value" id="modal-category"></div>
          </div>
          <div>
            <div class="modal-stat-label">Observations</div>
            <div class="modal-stat-value" id="modal-observations"></div>
          </div>
          <div>
            <div class="modal-stat-label">First Seen</div>
            <div class="modal-stat-value" id="modal-first-seen">Not yet</div>
          </div>
          <div>
            <div class="modal-stat-label">Times Seen</div>
            <div class="modal-stat-value" id="modal-times-seen">0</div>
          </div>
        </div>

        <button class="catch-btn" id="catch-btn">
          <span>✓</span> Mark as Discovered
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'naturedex_caught';
    const STREAK_KEY = 'naturedex_streak';
    const CACHE_KEY = 'naturedex_species_cache';
    const CACHE_DURATION = 24 * 60 * 60 * 1000; // 24 hours

    let allSpecies = [];
    let currentFilter = 'all';
    let currentSpecies = null;

    // Category mappings for iNaturalist iconic taxa
    const categoryMap = {
      'Aves': { icon: '🐦', name: 'Birds' },
      'Plantae': { icon: '🌿', name: 'Plants' },
      'Insecta': { icon: '🦋', name: 'Insects' },
      'Mammalia': { icon: '🦊', name: 'Mammals' },
      'Fungi': { icon: '🍄', name: 'Fungi' },
      'Reptilia': { icon: '🦎', name: 'Reptiles' },
      'Amphibia': { icon: '🐸', name: 'Amphibians' },
      'Actinopterygii': { icon: '🐟', name: 'Fish' },
      'Arachnida': { icon: '🕷️', name: 'Arachnids' },
      'Mollusca': { icon: '🐌', name: 'Mollusks' },
    };

    function getCaught() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function saveCaught(caught) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(caught));
    }

    function getStreak() {
      try {
        const data = JSON.parse(localStorage.getItem(STREAK_KEY) || '{}');
        const today = new Date().toDateString();
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        
        if (data.lastDate === today) return data.streak;
        if (data.lastDate === yesterday) return data.streak;
        return 0;
      } catch {
        return 0;
      }
    }

    function updateStreak() {
      const today = new Date().toDateString();
      const data = JSON.parse(localStorage.getItem(STREAK_KEY) || '{}');
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      
      let newStreak = 1;
      if (data.lastDate === yesterday) {
        newStreak = (data.streak || 0) + 1;
      } else if (data.lastDate === today) {
        newStreak = data.streak || 1;
      }
      
      localStorage.setItem(STREAK_KEY, JSON.stringify({ lastDate: today, streak: newStreak }));
      document.getElementById('streak-count').textContent = newStreak;
    }

    function updateStats() {
      const caught = getCaught();
      const caughtCount = Object.keys(caught).length;
      const totalCount = allSpecies.length;
      const percentage = totalCount > 0 ? ((caughtCount / totalCount) * 100).toFixed(1) : 0;

      document.getElementById('caught-count').textContent = caughtCount;
      document.getElementById('total-count').textContent = totalCount;
      document.getElementById('streak-count').textContent = getStreak();
      document.getElementById('progress-fill').style.width = `${percentage}%`;
      document.getElementById('progress-text').textContent = `${percentage}% Complete`;
    }

    function getCache(placeId) {
      try {
        const cache = JSON.parse(localStorage.getItem(`${CACHE_KEY}_${placeId}`) || 'null');
        if (cache && Date.now() - cache.timestamp < CACHE_DURATION) {
          return cache.data;
        }
      } catch {}
      return null;
    }

    function setCache(placeId, data) {
      localStorage.setItem(`${CACHE_KEY}_${placeId}`, JSON.stringify({
        timestamp: Date.now(),
        data
      }));
    }

    async function fetchSpecies(placeId) {
      const cached = getCache(placeId);
      if (cached) {
        console.log('Using cached species data');
        return cached;
      }

      const iconicTaxa = ['Aves', 'Plantae', 'Insecta', 'Mammalia', 'Fungi', 'Reptilia', 'Amphibia'];
      let species = [];

      for (const taxon of iconicTaxa) {
        try {
          const response = await fetch(
            `https://api.inaturalist.org/v1/observations/species_counts?place_id=${placeId}&iconic_taxa=${taxon}&quality_grade=research&per_page=50`
          );
          const data = await response.json();
          
          if (data.results) {
            const mapped = data.results.map(r => ({
              id: r.taxon.id,
              name: r.taxon.preferred_common_name || r.taxon.name,
              scientific: r.taxon.name,
              image: r.taxon.default_photo?.medium_url || r.taxon.default_photo?.url || null,
              category: taxon,
              observationCount: r.count
            }));
            species = species.concat(mapped);
          }
        } catch (err) {
          console.error(`Error fetching ${taxon}:`, err);
        }
      }

      // Sort by observation count (most common first)
      species.sort((a, b) => b.observationCount - a.observationCount);
      
      setCache(placeId, species);
      return species;
    }

    function renderGrid(species) {
      const container = document.getElementById('grid-container');
      const caught = getCaught();
      const searchTerm = document.getElementById('search').value.toLowerCase();

      let filtered = species;
      
      if (currentFilter !== 'all') {
        filtered = filtered.filter(s => s.category === currentFilter);
      }
      
      if (searchTerm) {
        filtered = filtered.filter(s => 
          s.name.toLowerCase().includes(searchTerm) ||
          s.scientific.toLowerCase().includes(searchTerm)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No species found</div>';
        return;
      }

      container.innerHTML = `<div class="grid">${filtered.map(s => {
        const isCaught = caught[s.id];
        const category = categoryMap[s.category] || { icon: '❓', name: 'Unknown' };
        
        return `
          <div class="species-card ${isCaught ? 'caught' : ''}" data-id="${s.id}">
            <div class="caught-badge">✓</div>
            ${s.image 
              ? `<img class="species-image" src="${s.image}" alt="${s.name}" loading="lazy">`
              : `<div class="species-silhouette">${category.icon}</div>`
            }
            <div class="species-info">
              <div class="species-name">${isCaught ? s.name : '???'}</div>
              <div class="species-scientific">${isCaught ? s.scientific : '???'}</div>
            </div>
          </div>
        `;
      }).join('')}</div>`;

      // Add click handlers
      container.querySelectorAll('.species-card').forEach(card => {
        card.addEventListener('click', () => openModal(parseInt(card.dataset.id)));
      });
    }

    function openModal(speciesId) {
      const species = allSpecies.find(s => s.id === speciesId);
      if (!species) return;

      currentSpecies = species;
      const caught = getCaught();
      const isCaught = caught[species.id];
      const category = categoryMap[species.category] || { icon: '❓', name: 'Unknown' };

      document.getElementById('modal-image').src = species.image || '';
      document.getElementById('modal-title').textContent = isCaught ? species.name : '???';
      document.getElementById('modal-scientific').textContent = isCaught ? species.scientific : '???';
      document.getElementById('modal-category').textContent = `${category.icon} ${category.name}`;
      document.getElementById('modal-observations').textContent = species.observationCount.toLocaleString();
      
      if (isCaught) {
        document.getElementById('modal-first-seen').textContent = new Date(caught[species.id].firstSeen).toLocaleDateString();
        document.getElementById('modal-times-seen').textContent = caught[species.id].timesSeen || 1;
      } else {
        document.getElementById('modal-first-seen').textContent = 'Not yet';
        document.getElementById('modal-times-seen').textContent = '0';
      }

      const btn = document.getElementById('catch-btn');
      btn.className = `catch-btn ${isCaught ? 'caught' : ''}`;
      btn.innerHTML = isCaught ? '<span>✓</span> Discovered!' : '<span>✓</span> Mark as Discovered';

      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      currentSpecies = null;
    }

    function toggleCatch() {
      if (!currentSpecies) return;

      const caught = getCaught();
      const id = currentSpecies.id;

      if (caught[id]) {
        // Already caught, increment times seen
        caught[id].timesSeen = (caught[id].timesSeen || 1) + 1;
        caught[id].lastSeen = Date.now();
      } else {
        // New catch!
        caught[id] = {
          firstSeen: Date.now(),
          lastSeen: Date.now(),
          timesSeen: 1
        };
        updateStreak();
        
        // Animation
        const card = document.querySelector(`.species-card[data-id="${id}"]`);
        if (card) {
          card.classList.add('new-catch-animation');
          setTimeout(() => card.classList.remove('new-catch-animation'), 600);
        }
      }

      saveCaught(caught);
      renderGrid(allSpecies);
      updateStats();
      openModal(id); // Refresh modal
    }

    async function init() {
      const placeId = document.getElementById('location').value;
      
      document.getElementById('grid-container').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading species data...</p>
        </div>
      `;

      allSpecies = await fetchSpecies(placeId);
      renderGrid(allSpecies);
      updateStats();
    }

    // Event listeners
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGrid(allSpecies);
      });
    });

    document.getElementById('search').addEventListener('input', () => renderGrid(allSpecies));
    document.getElementById('location').addEventListener('change', init);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
    document.getElementById('catch-btn').addEventListener('click', toggleCatch);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Initialize
    init();
  </script>
</body>
</html>
