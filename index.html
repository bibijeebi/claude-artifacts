        /* Loading skeleton */
        .skeleton {

    <script>
        const PAGES_BASE = 'https://niggerfaggot.club/';
        const R2_BASE = 'https://claude-deploy.bennyforeman1.workers.dev/r2/file/';
        const CACHE_KEY = 'claude-artifacts-cache';
        const CACHE_TTL = 5 * 60 * 1000; // 5 minutes
        
        const DESCRIPTIONS = {
            // PDFs
            'air-rifle-guide.pdf': 'PCP and CO₂ air rifles for weak shoulders. Umarex Komplete NCR recommendation.',
            'american_colonial_heritage_report-3.pdf': 'Colonial American genealogy and heritage research.',

            'nbct-guide-3.pdf': 'National Board Certification for Teachers guide.',
            'omoore_irish_heritage_report-5.pdf': 'O\'Moore Irish clan heritage research.',
            'operation-210-4.pdf': 'Operation 210 cutting phase protocol.',
            'operation-210-beyond-the-cut.pdf': 'Post-cut bulking protocol. Injury-adjusted power rack program to 210 lbs.',
            'ostrich_cull_presentation.pdf': 'Texas ostrich population management presentation.',
            'packers_acquisition_strategy-2.pdf': 'Green Bay Packers stock and ownership analysis.',
            'payment_systems.pdf': 'Payment processing systems overview.',
            'pico-ble-keyboard-proposal.pdf': 'Raspberry Pi Pico BLE keyboard project proposal.',
            'radio-fundamentals.pdf': 'Amateur radio fundamentals and licensing.',
            'radio_guide.pdf': 'Radio communication guide and equipment.',
            'scottish_heritage_report-7.pdf': 'Scottish clan heritage research (Clan Stewart).',
            'weight_tracker_proposal-2.pdf': 'Weight tracking app technical specification.',
            'wisconsin-guide.pdf': 'Wisconsin relocation guide for vet school.',
            // Sites
            'accelerationism.html': 'Philosophy overview: e/acc, effective accelerationism, and related movements.',
            'archery-calculator.html': 'Arrow spine calculator and bow setup tool.',
            'ballistics.html': 'Ballistics calculator and trajectory analysis.',
            'birdseed.html': 'Bird feed types and regional recommendations.',
            'bow-guide.html': 'Compound bow selection and setup guide.',
            'claude-shit-stack.html': 'Claude deployment infrastructure documentation.',
            'cmp-garand.html': 'Civilian Marksmanship Program M1 Garand guide.',
            'deviled-eggs.html': 'Deviled eggs recipe variations.',
            'dishwasher.html': 'Dishwasher optimization and loading guide.',
            'dna-guide.html': 'DNA testing services comparison and guide.',
            'does-it-matter.html': 'Philosophical exploration.',
            'garden.html': 'Garden planning and planting guide.',
            'germany-energy.html': 'German energy policy analysis.',
            'jar-opener.html': 'Jar opener product comparison.',
            'jewish-hollywood.html': 'Hollywood industry demographics analysis.',
            'liquid-gold.html': 'Raw milk and dairy guide.',
            'lost-in-translation.html': 'Movie analysis: Lost in Translation.',
            'melamine-foam.html': 'Melamine foam (Magic Eraser) uses and science.',
            'nano-banana.html': 'Banana ripening science explainer.',
            'nc-raw-milk-guide.html': 'North Carolina raw milk sourcing guide.',
            'nk-defectors.html': 'North Korean defector stories and analysis.',
            'nord-stream.html': 'Nord Stream pipeline incident analysis.',
            'oiia-shrine.html': 'OIIA cat meme shrine.',
            'raw-milk-ice-cream.html': 'Raw milk ice cream recipes.',
            'root-beer-guide.html': 'Root beer brands and homemade recipes.',
            'soap-dish-guide.html': 'Soap dish selection guide.',
            'south-of-the-border.html': 'South of the Border roadside attraction guide.',
            'switch-explainer.html': 'Nintendo Switch modding explainer.',
            'theta2.html': 'Theta2 engine technical documentation.',
            'tiktok-israel-infographic.html': 'TikTok content moderation analysis.',
            'va-scam.html': 'VA benefits scam awareness guide.',
            'vet-schools.html': 'Veterinary school comparison and admissions.',
            'white-sim-card.html': 'SIM card and mobile carrier guide.',
        };
        
        const APPS = [
            {
                title: 'Benny Things',
                file: 'things.niggerfaggot.club',
                url: 'https://things.niggerfaggot.club',
                description: 'Kanban-style task board - backlog, todo, doing, done. Track what needs doing.',
                type: 'app'
            },
            {
                title: 'Foreman Bar',
                file: 'drinks.niggerfaggot.club',
                url: 'https://drinks.niggerfaggot.club',
                description: 'Home cocktail menu - tracks inventory, shows what you can make, includes ratings.',
                type: 'app'
            },
            {
                title: 'NatureDex',
                file: 'nature.niggerfaggot.club',
                url: 'https://nature.niggerfaggot.club',
                description: 'Pokédex for nature - track birds, plants, insects, and wildlife you encounter.',
                type: 'app'
            },
            {
                title: 'Weight Tracker',
                file: 'health.niggerfaggot.club',
                url: 'https://health.niggerfaggot.club',
                description: 'Operation 210 - Weight tracking with real-time interpolation, body composition, and VO₂ max.',
                type: 'app'
            }
        ];
        
        let artifacts = { apps: [], sites: [], pdfs: [] };
        let loadingState = { apps: 'loading', sites: 'loading', pdfs: 'loading' };
        
        function formatSize(bytes) {
            if (!bytes) return null;
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function titleCase(str) {
            return str.replace(/[-_]/g, ' ').replace(/\.(html|pdf)$/i, '').replace(/\d+$/, '').trim().replace(/\b\w/g, c => c.toUpperCase());
        }
        
        function updateStatus(source, status) {
            loadingState[source] = status;
            const el = document.getElementById(`status-${source}`);
            el.className = `source-status ${status}`;
            el.innerHTML = `<span class="dot ${status}"></span>${source.charAt(0).toUpperCase() + source.slice(1)}`;
            
            // Hide loading status when all done
            if (Object.values(loadingState).every(s => s !== 'loading')) {
                setTimeout(() => {
                    document.getElementById('loading-status').style.display = 'none';
                }, 500);
            }
        }
        
        function updateCounts() {
            const appCount = artifacts.apps.length;
            const siteCount = artifacts.sites.length;
            const pdfCount = artifacts.pdfs.length;
            const total = appCount + siteCount + pdfCount;
            
            document.getElementById('app-count').textContent = appCount;
            document.getElementById('app-count').classList.remove('loading');
            document.getElementById('site-count').textContent = siteCount;
            document.getElementById('site-count').classList.remove('loading');
            document.getElementById('pdf-count').textContent = pdfCount;
            document.getElementById('pdf-count').classList.remove('loading');
            document.getElementById('count-all').textContent = total;
            document.getElementById('count-app').textContent = appCount;
            document.getElementById('count-site').textContent = siteCount;
            document.getElementById('count-pdf').textContent = pdfCount;
            document.getElementById('refresh-time').textContent = new Date().toLocaleTimeString();
        }
        
        function renderCards() {
            const search = document.getElementById('search').value.toLowerCase();
            const activeFilter = document.querySelector('.tab.active').dataset.filter;
            
            let all = [...artifacts.apps, ...artifacts.sites, ...artifacts.pdfs].sort((a, b) => {
                if (a.type === 'app' && b.type !== 'app') return -1;
                if (b.type === 'app' && a.type !== 'app') return 1;
                return a.title.localeCompare(b.title);
            });
            
            if (activeFilter !== 'all') {
                all = all.filter(a => a.type === activeFilter);
            }
            
            if (search) {
                all = all.filter(a => 
                    a.title.toLowerCase().includes(search) || 
                    a.file.toLowerCase().includes(search) ||
                    (a.description && a.description.toLowerCase().includes(search))
                );
            }
            
            const grid = document.getElementById('grid');
            
            if (all.length === 0 && Object.values(loadingState).every(s => s !== 'loading')) {
                grid.innerHTML = '<div class="empty-state">No artifacts found</div>';
                return;
            }
            
            if (all.length === 0) {
                return; // Still loading, keep skeletons
            }
            
            grid.innerHTML = all.map(artifact => `
                <a href="${artifact.url}" target="_blank" class="card ${artifact.type === 'app' ? 'app-card' : ''}">
                    <div class="card-title">${artifact.title}</div>
                    <div class="card-file">${artifact.file}</div>
                    ${artifact.description ? `<div class="card-desc">${artifact.description}</div>` : ''}
                    <div class="card-meta">
                        <span class="badge ${artifact.type}">${artifact.type}</span>
                        ${artifact.size ? `<span class="badge size">${formatSize(artifact.size)}</span>` : ''}
                    </div>
                </a>
            `).join('');
        }
        
        async function loadApps() {
            artifacts.apps = APPS;
            updateStatus('apps', 'loaded');
            updateCounts();
            renderCards();
        }
        
        async function loadSites() {
            try {
                const res = await fetch('https://api.github.com/repos/bibijeebi/claude-artifacts/contents');
                const files = await res.json();
                artifacts.sites = files
                    .filter(f => f.name.endsWith('.html') && f.name !== 'index.html' && f.name !== 'gallery.html')
                    .map(f => ({
                        title: titleCase(f.name),
                        file: f.name,
                        url: PAGES_BASE + f.name,
                        size: f.size,
                        description: DESCRIPTIONS[f.name] || null,
                        type: 'site'
                    }));
                updateStatus('sites', 'loaded');
            } catch (e) {
                console.error('GitHub fetch failed:', e);
                updateStatus('sites', 'error');
            }
            updateCounts();
            renderCards();
        }
        
        async function loadPDFs() {
            try {
                const res = await fetch('https://claude-deploy.bennyforeman1.workers.dev/r2/list');
                const data = await res.json();
                artifacts.pdfs = data.files
                    .filter(f => f.key.endsWith('.pdf') && !f.key.startsWith('_'))
                    .map(f => ({
                        title: titleCase(f.key),
                        file: f.key,
                        url: R2_BASE + f.key,
                        size: f.size,
                        description: DESCRIPTIONS[f.key] || null,
                        type: 'pdf'
                    }));
                updateStatus('pdfs', 'loaded');
            } catch (e) {
                console.error('R2 fetch failed:', e);
                updateStatus('pdfs', 'error');
            }
            updateCounts();
            renderCards();
        }
        
        function loadFromCache() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TTL) {
                        artifacts = data;
                        updateCounts();
                        renderCards();
                        // Still show as loaded
                        updateStatus('apps', 'loaded');
                        updateStatus('sites', 'loaded');
                        updateStatus('pdfs', 'loaded');
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }
        
        function saveToCache() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    data: artifacts,
                    timestamp: Date.now()
                }));
            } catch (e) {}
        }
        
        async function loadAll(forceRefresh = false) {
            // Reset state
            loadingState = { apps: 'loading', sites: 'loading', pdfs: 'loading' };
            document.getElementById('loading-status').style.display = 'block';
            
            // Try cache first (unless force refresh)
            if (!forceRefresh && loadFromCache()) {
                console.log('Loaded from cache');
                return;
            }
            
            // Reset UI for loading
            document.getElementById('app-count').textContent = '-';
            document.getElementById('app-count').classList.add('loading');
            document.getElementById('site-count').textContent = '-';
            document.getElementById('site-count').classList.add('loading');
            document.getElementById('pdf-count').textContent = '-';
            document.getElementById('pdf-count').classList.add('loading');
            
            // Update status indicators
            ['apps', 'sites', 'pdfs'].forEach(s => updateStatus(s, 'loading'));
            
            // Show skeletons
            document.getElementById('grid').innerHTML = `
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            `;
            
            // Load all sources in parallel, render as each completes
            await Promise.all([
                loadApps(),
                loadSites(),
                loadPDFs()
            ]);
            
            // Save to cache
            saveToCache();
        }
        
        document.getElementById('search').addEventListener('input', renderCards);
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderCards();
            });
        });
