            padding: 0;
            box-sizing: border-box;
        }

            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),

            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 4rem 0 3rem;
        }

        .logo {
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Search */
        .search-container {
            max-width: 500px;
            margin: 2rem auto 3rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Stats */        /* Stats bar */
        .stats {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
            cursor: pointer;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .stat:hover {
            background: rgba(129, 140, 248, 0.1);
        }

        .stat.active {
            background: rgba(129, 140, 248, 0.15);
            border-color: rgba(129, 140, 248, 0.3);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Grid */
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Card */
        .site-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .site-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--green));
            opacity: 0;
            transition: opacity 0.3s ease;

            background: var(--surface-hover);
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .site-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

            height: 48px;

            align-items: center;

            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;

            margin: 0 auto 1rem;

            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);

            height: 64px;

            color: var(--text-muted);

            }

                grid-template-columns: 1fr;

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getDisplayName(name) {
            return name
                .replace(/\.html$/, '')
                .replace(/-/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        async function fetchSites() {
            try {
                const response = await fetch(REPO_API);
                const data = await response.json();
                
                // Filter to only HTML files and directories (potential sites)
                // Exclude infrastructure directories like 'functions'
                const sites = data.filter(item => {
                    if (item.name === 'functions') return false;
                    if (item.type === 'dir') return true;
                    if (item.type === 'file' && item.name.endsWith('.html') && item.name !== 'index.html') return true;
                    return false;
                });

                return sites;
            } catch (error) {
                console.error('Failed to fetch sites:', error);
                return [];
            }
        }

                        </svg>
                        <p>No sites found matching your search.</p>
                    </div>
                `;
                return;

                const title = meta.title || getDisplayName(site.name);
                const isDir = site.type === 'dir';
                const isExternal = site.type === 'external';
                const hasCustomUrl = meta.url;
                const cat = site.category;
                const path = hasCustomUrl ? meta.url : (isDir ? `/${site.name}/` : `/${site.name}`);
                const url = hasCustomUrl ? (meta.url.startsWith('/') ? BASE_URL + meta.url : meta.url) : BASE_URL + path;

                    'page': { label: 'Page', class: '' },
                    'slide': { label: 'Slides', class: 'slide' },
                    'gallery': { label: 'Gallery', class: 'album' },
                    'album': { label: 'Album', class: 'album' },
                    'pdf': { label: 'PDF', class: 'pdf' },
                    'app': { label: 'App', class: 'external' }
                };
                const badgeInfo = badgeMap[cat] || badgeMap['page'];
                
                const typeLabels = {
                    'page': 'Single Page',
                    'slide': 'Reveal.js Presentation',
                    'gallery': 'Image Gallery',
                    'album': 'Photo Album',
                    'pdf': 'PDF Document',
                    'app': isDir ? 'Directory' : 'CF Worker'
                };

                return `
                    <a href="${url}" class="site-card" target="_blank">
                        <div class="card-header">
                            <div class="card-icon">${meta.icon}</div>
                            <span class="card-badge ${badgeInfo.class}">${badgeInfo.label}</span>
                        </div>
                        <h3 class="card-title">${title}</h3>
                        <div class="card-path">${pathDisplay}</div>
                        <p class="card-description">${meta.description}</p>
                        <div class="card-meta">
                            ${site.size ? `<span>📦 ${formatSize(site.size)}</span>` : ''}
                            <span>🔗 ${typeLabels[cat] || 'Single Page'}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function updateStats(sites) {
            const total = sites.length;
            const pages = sites.filter(s => s.category === 'page').length;
            const slides = sites.filter(s => s.category === 'slide').length;
            const albums = sites.filter(s => s.category === 'album' || s.category === 'gallery').length;
            const pdfs = sites.filter(s => s.category === 'pdf').length;
            const apps = sites.filter(s => s.category === 'app').length;

            document.getElementById('total-count').textContent = total;
            document.getElementById('page-count').textContent = pages;
            document.getElementById('slide-count').textContent = slides;
            document.getElementById('album-count').textContent = albums;
            document.getElementById('pdf-count').textContent = pdfs;
            document.getElementById('app-count').textContent = apps;
        }

        let allSites = [];

        async function init() {
            let rawSites = await fetchSites();
            
            // Categorize sites based on siteMeta
            allSites = rawSites.map(site => {
                const meta = siteMeta[site.name];
                let category = 'page'; // default for files
                if (site.type === 'dir') category = 'app';
                if (meta && meta.category === 'presentation') category = 'slide';
                if (meta && meta.category === 'gallery') category = 'gallery';
                if (meta && meta.category === 'album') category = 'album';
                return { ...site, category };
            });
            
            // Add external items (PDFs, Workers, and Albums)
            Object.entries(siteMeta).forEach(([key, meta]) => {
                if (meta.url) {
                    let category = 'app';
                    if (meta.category === 'pdf') category = 'pdf';
                    if (meta.category === 'album') category = 'album';
                    allSites.push({ name: key, type: 'external', category, url: meta.url });
                }
            });
            
            renderSites(allSites);
            updateStats(allSites);

            let activeFilters = new Set();
            const searchInput = document.getElementById('search');

            function applyFilters() {
                const query = searchInput.value.toLowerCase();
                let filtered = allSites;

                // Apply category filters (if any active, show only those categories)
                if (activeFilters.size > 0) {
                    filtered = filtered.filter(site => {
                        if (activeFilters.has('page') && site.category === 'page') return true;
                        if (activeFilters.has('slide') && site.category === 'slide') return true;
                        if (activeFilters.has('album') && (site.category === 'album' || site.category === 'gallery')) return true;
                        if (activeFilters.has('pdf') && site.category === 'pdf') return true;
                        if (activeFilters.has('app') && site.category === 'app') return true;
                        return false;
                    });
                }

                // Apply search filter
                if (query) {
                    filtered = filtered.filter(site => {
                        const meta = siteMeta[site.name] || defaultMeta;
                        const title = (meta.title || getDisplayName(site.name)).toLowerCase();
                        const desc = meta.description.toLowerCase();
                        return site.name.toLowerCase().includes(query) || 
                               title.includes(query) || 
                               desc.includes(query);
                    });
                }

                renderSites(filtered);
            }

            // Search functionality
            searchInput.addEventListener('input', applyFilters);

            // Stat filters (toggle mode)
            document.querySelectorAll('.stat[data-filter]').forEach(stat => {
                stat.addEventListener('click', () => {
                    const filter = stat.dataset.filter;
                    
                    if (filter === 'all') {
                        // Clear all filters
                        activeFilters.clear();
                        document.querySelectorAll('.stat').forEach(s => s.classList.remove('active'));
                    } else {
                        // Toggle this filter
                        if (activeFilters.has(filter)) {
                            activeFilters.delete(filter);
                            stat.classList.remove('active');
                        } else {
                            activeFilters.add(filter);
                            stat.classList.add('active');
                        }
                    }
                    applyFilters();
                });
            });

            // Keyboard shortcut: / to focus search
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape') {
                    searchInput.blur();
                    searchInput.value = '';
                    activeFilters.clear();
                    document.querySelectorAll('.stat').forEach(s => s.classList.remove('active'));
                    applyFilters();
                }
            });
        }

        init();
    </script>
</body>
</html>
