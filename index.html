<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Artifacts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .stats {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }
        .stats span { color: #667eea; font-weight: 600; }
        
        .last-refresh { color: #555; font-size: 0.75rem; }
        
        .search-container {
            max-width: 600px;
            margin: 1.5rem auto;
        }
        
        #search {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #333;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        #search:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }
        #search::placeholder { color: #666; }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab {
            padding: 0.5rem 1.2rem;
            border: 1px solid #333;
            border-radius: 20px;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tab:hover { border-color: #667eea; color: #667eea; }
        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        .tab .count {
            background: rgba(255,255,255,0.2);
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            margin-left: 0.4rem;
            font-size: 0.75rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1.25rem;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
        }
        
        .card-file {
            font-size: 0.8rem;
            color: #667eea;
            font-family: monospace;
            margin-bottom: 0.75rem;
            word-break: break-all;
        }
        
        .card-meta {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }
        .badge.pdf { background: rgba(234, 102, 102, 0.15); color: #ea6666; }
        .badge.image { background: rgba(102, 234, 156, 0.15); color: #66ea9c; }
        .badge.audio { background: rgba(234, 180, 102, 0.15); color: #eab466; }
        
        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .hidden { display: none !important; }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Claude Artifacts</h1>
        <div class="stats">Deployed sites: <span id="site-count">0</span> · Assets: <span id="asset-count">0</span></div>
        <div class="last-refresh">Last refreshed: <span id="refresh-time">-</span></div>
    </header>
    
    <div class="search-container">
        <input type="text" id="search" placeholder="Search artifacts...">
    </div>
    
    <div class="tabs">
        <button class="tab active" data-filter="all">All<span class="count" id="count-all">0</span></button>
        <button class="tab" data-filter="site">Sites<span class="count" id="count-site">0</span></button>
        <button class="tab" data-filter="pdf">PDFs<span class="count" id="count-pdf">0</span></button>
        <button class="tab" data-filter="image">Images<span class="count" id="count-image">0</span></button>
        <button class="tab" data-filter="audio">Audio<span class="count" id="count-audio">0</span></button>
    </div>
    
    <div class="grid" id="grid"></div>
    
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
    
    <script>
        const R2_BASE = 'https://claude-deploy.bennyforeman1.workers.dev/r2/file/';
        const PAGES_BASE = 'https://claude-artifacts.pages.dev/';
        
        let allItems = [];
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function titleCase(str) {
            return str
                .replace(/[-_]/g, ' ')
                .replace(/\.[^.]+$/, '')
                .replace(/\d+$/, '')
                .trim()
                .replace(/\b\w/g, c => c.toUpperCase());
        }
        
        function getType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['html', 'htm'].includes(ext)) return 'site';
            if (ext === 'pdf') return 'pdf';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
            if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return 'audio';
            return 'other';
        }
        
        async function loadGitHub() {
            try {
                const res = await fetch('https://api.github.com/repos/bibijeebi/claude-artifacts/contents');
                const files = await res.json();
                return files
                    .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
                    .map(f => ({
                        title: titleCase(f.name),
                        file: f.name,
                        url: PAGES_BASE + f.name,
                        size: f.size,
                        type: 'site',
                        source: 'github'
                    }));
            } catch (e) {
                console.error('GitHub fetch failed:', e);
                return [];
            }
        }
        
        async function loadR2() {
            try {
                const res = await fetch('https://claude-deploy.bennyforeman1.workers.dev/r2/list');
                const data = await res.json();
                return data.files
                    .filter(f => {
                        const type = getType(f.key);
                        if (f.key.startsWith('thumb-')) return false;
                        if (f.key.startsWith('_')) return false;
                        if (f.key.includes('/')) return false;
                        return ['pdf', 'image', 'audio'].includes(type);
                    })
                    .map(f => ({
                        title: titleCase(f.key),
                        file: f.key,
                        url: R2_BASE + f.key,
                        size: f.size,
                        type: getType(f.key),
                        source: 'r2',
                        uploaded: f.uploaded
                    }));
            } catch (e) {
                console.error('R2 fetch failed:', e);
                return [];
            }
        }
        
        function renderItems(items) {
            const grid = document.getElementById('grid');
            
            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state">No items found</div>';
                return;
            }
            
            grid.innerHTML = items.map(item => `
                <a href="${item.url}" target="_blank" class="card" data-type="${item.type}">
                    <div class="card-title">${item.title}</div>
                    <div class="card-file">${item.file}</div>
                    <div class="card-meta">
                        <span class="badge ${item.type}">${item.type}</span>
                        <span class="badge">${formatSize(item.size)}</span>
                    </div>
                </a>
            `).join('');
        }
        
        function updateCounts() {
            const counts = { all: allItems.length, site: 0, pdf: 0, image: 0, audio: 0 };
            allItems.forEach(item => {
                if (counts[item.type] !== undefined) counts[item.type]++;
            });
            
            document.getElementById('count-all').textContent = counts.all;
            document.getElementById('count-site').textContent = counts.site;
            document.getElementById('count-pdf').textContent = counts.pdf;
            document.getElementById('count-image').textContent = counts.image;
            document.getElementById('count-audio').textContent = counts.audio;
            
            document.getElementById('site-count').textContent = counts.site;
            document.getElementById('asset-count').textContent = counts.all - counts.site;
        }
        
        function filterItems() {
            const search = document.getElementById('search').value.toLowerCase();
            const activeTab = document.querySelector('.tab.active').dataset.filter;
            
            let filtered = allItems;
            
            if (activeTab !== 'all') {
                filtered = filtered.filter(item => item.type === activeTab);
            }
            
            if (search) {
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(search) || 
                    item.file.toLowerCase().includes(search)
                );
            }
            
            renderItems(filtered);
        }
        
        async function loadAll() {
            const [github, r2] = await Promise.all([loadGitHub(), loadR2()]);
            allItems = [...github, ...r2].sort((a, b) => a.title.localeCompare(b.title));
            
            updateCounts();
            filterItems();
            
            document.getElementById('refresh-time').textContent = new Date().toLocaleTimeString();
        }
        
        document.getElementById('search').addEventListener('input', filterItems);
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                filterItems();
            });
        });
        
        loadAll();
    </script>
</body>
</html>
