<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Artifacts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem;
        }
        
        header { text-align: center; margin-bottom: 2rem; }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .stats { color: #888; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .stats span { color: #667eea; font-weight: 600; }
        
        .last-refresh { color: #555; font-size: 0.75rem; }
        
        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        
        nav a {
            padding: 0.6rem 1.5rem;
            border: 1px solid #333;
            border-radius: 25px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        nav a:hover { border-color: #667eea; color: #667eea; }
        nav a.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }
        
        .search-container { max-width: 600px; margin: 1.5rem auto; }
        
        #search {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #333;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }
        #search:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }
        #search::placeholder { color: #666; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1.25rem;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
        }
        
        .card-file {
            font-size: 0.8rem;
            color: #667eea;
            font-family: monospace;
            margin-bottom: 0.75rem;
        }
        
        .card-meta { display: flex; gap: 0.75rem; }
        
        .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Claude Artifacts</h1>
        <div class="stats">Deployed sites: <span id="site-count">0</span></div>
        <div class="last-refresh">Last refreshed: <span id="refresh-time">-</span></div>
    </header>
    
    <nav>
        <a href="index.html" class="active">Sites</a>
        <a href="gallery.html">Gallery</a>
    </nav>
    
    <div class="search-container">
        <input type="text" id="search" placeholder="Search sites...">
    </div>
    
    <div class="grid" id="grid"></div>
    
    <button class="refresh-btn" onclick="loadSites()">↻ Refresh</button>
    
    <script>
        const PAGES_BASE = 'https://claude-artifacts.pages.dev/';
        let allSites = [];
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function titleCase(str) {
            return str
                .replace(/[-_]/g, ' ')
                .replace(/\.html$/, '')
                .replace(/\b\w/g, c => c.toUpperCase());
        }
        
        async function loadSites() {
            try {
                const res = await fetch('https://api.github.com/repos/bibijeebi/claude-artifacts/contents');
                const files = await res.json();
                allSites = files
                    .filter(f => f.name.endsWith('.html') && f.name !== 'index.html' && f.name !== 'gallery.html')
                    .map(f => ({
                        title: titleCase(f.name),
                        file: f.name,
                        url: PAGES_BASE + f.name,
                        size: f.size
                    }))
                    .sort((a, b) => a.title.localeCompare(b.title));
                
                document.getElementById('site-count').textContent = allSites.length;
                document.getElementById('refresh-time').textContent = new Date().toLocaleTimeString();
                filterSites();
            } catch (e) {
                console.error('Failed to load sites:', e);
            }
        }
        
        function filterSites() {
            const search = document.getElementById('search').value.toLowerCase();
            const filtered = search 
                ? allSites.filter(s => s.title.toLowerCase().includes(search) || s.file.toLowerCase().includes(search))
                : allSites;
            
            const grid = document.getElementById('grid');
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">No sites found</div>';
                return;
            }
            
            grid.innerHTML = filtered.map(site => `
                <a href="${site.url}" target="_blank" class="card">
                    <div class="card-title">${site.title}</div>
                    <div class="card-file">${site.file}</div>
                    <div class="card-meta">
                        <span class="badge">${formatSize(site.size)}</span>
                    </div>
                </a>
            `).join('');
        }
        
        document.getElementById('search').addEventListener('input', filterSites);
        loadSites();
    </script>
</body>
</html>
