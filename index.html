  --bg-elev:#101013;

  --dim:#6b6b73;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}

body{

.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

main{max-width:1400px;margin:0 auto;padding:1.25rem 1.25rem 6rem}

/* === HEADER === */
header{

  justify-content:space-between;
  gap:1rem;
  margin:.5rem 0 1.5rem;
  padding-bottom:1.25rem;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;gap:.15rem}
.brand h1{
  font-family:'JetBrains Mono',monospace;
  font-size:1.4rem;
  font-weight:600;
  letter-spacing:-.02em;
  color:var(--text);
}
.brand h1 .slash{color:var(--app)}
.brand h1 .sub{color:var(--mute);font-weight:400}
.tagline{color:var(--dim);font-size:.78rem;font-family:'JetBrains Mono',monospace}

.status-bar{

  gap:1rem;
  flex-wrap:wrap;
  align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;
}
.stat{display:flex;align-items:center;gap:.4rem;color:var(--dim)}
.stat b{color:var(--text);font-weight:500}
.stat.app b{color:var(--app)}
.stat.svc b{color:var(--svc)}
.stat.lib b{color:var(--lib)}
.stat.pdf b{color:var(--pdf)}
.stat .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim)}
.stat .pulse.live{background:var(--svc);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* === SEARCH BAR === */
.search-row{

  gap:.6rem;
  align-items:center;
  margin-bottom:1.5rem;
  flex-wrap:wrap;
}
.search-wrap{

  flex:1;
  min-width:240px;
  max-width:480px;
}
.search-wrap svg{
  position:absolute;
  left:.85rem;
  top:50%;
  transform:translateY(-50%);
  color:var(--dim);
  pointer-events:none;
}
#search{
  width:100%;
  padding:.7rem 5rem .7rem 2.4rem;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:.92rem;
  font-family:inherit;

}
#search:focus{outline:none;border-color:var(--border-strong);background:var(--panel-hover)}
#search::placeholder{color:var(--dim)}
.kbd{
  position:absolute;
  right:.6rem;
  top:50%;
  transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;
  color:var(--dim);
  border:1px solid var(--border);
  border-radius:5px;
  padding:.15rem .4rem;
  background:var(--bg-elev);
}

.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{
  padding:.45rem .8rem;
  border:1px solid var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--mute);
  cursor:pointer;
  font-size:.78rem;
  font-family:inherit;
  font-weight:500;

  align-items:center;

.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.active{background:rgba(255,255,255,.06);border-color:var(--border-strong);color:var(--text)}

.section-head{

.section-title{

.section-title .badge-dot{

.svc-tile .arrow{color:var(--dim);font-size:.85rem}

/* === LIBRARY GRID === */
.cat-bar{

  flex-wrap:wrap;

  font-size:.72rem;

.lib-card{

  padding:.75rem .9rem;
  background:var(--panel);
  border:1px solid var(--border);

.lib-card.pdf{border-left:2px solid var(--pdf)}

.lib-card .ttl{

.lib-card .file{

.lib-card .meta{

  font-family:'JetBrains Mono',monospace;
  font-size:.66rem;
  color:var(--dim);

.lib-card .meta .ext{

  font-weight:600;
  letter-spacing:.05em;
}
.lib-card.pdf .meta .ext{color:var(--pdf)}
.lib-card.site .meta .ext{color:var(--lib)}
.lib-card .new-tag{
  position:absolute;
  top:.55rem;
  right:.55rem;
  font-family:'JetBrains Mono',monospace;
  font-size:.6rem;
  color:var(--app);
  background:var(--app-soft);
  padding:.1rem .35rem;
  border-radius:4px;
  font-weight:600;
  letter-spacing:.05em;
}
.lib-card .pin-btn{
  position:absolute;
  top:.4rem;
  right:.4rem;
  background:transparent;
  border:none;
  color:var(--dim);
  font-size:.7rem;
  cursor:pointer;
  padding:.15rem .3rem;
  border-radius:4px;
  opacity:0;
  transition:opacity .15s,color .15s;
}
.lib-card:hover .pin-btn{opacity:1}
.lib-card .pin-btn.pinned{color:var(--pin);opacity:1}
.lib-card .pin-btn:hover{color:var(--pin)}
.lib-card .new-tag + .pin-btn{top:1.85rem}

/* === EMPTY / SKELETON === */
.empty{
  text-align:center;
  padding:2.5rem 1rem;
  color:var(--dim);
  font-size:.85rem;
  font-family:'JetBrains Mono',monospace;

.skeleton{

  background-size:200% 100%;
  animation:shim 1.5s infinite;
  border-radius:9px;
  border:1px solid var(--border);
}
.skeleton.app{height:118px}
.skeleton.svc{height:48px}
.skeleton.lib{height:80px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* === REFRESH / CMD-K HINT === */
.refresh{
  position:fixed;
  bottom:1.25rem;
  right:1.25rem;

  align-items:center;
  gap:.4rem;
  padding:.6rem 1rem;
  background:var(--bg-elev);
  border:1px solid var(--border-strong);
  border-radius:999px;
  color:var(--mute);
  cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;
  transition:all .15s;
  backdrop-filter:blur(8px);
  z-index:50;
}
.refresh:hover{border-color:var(--app);color:var(--app)}
.refresh.spinning svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* === FOOTER === */
footer{
  margin-top:3rem;
  padding-top:1rem;
  border-top:1px solid var(--border);

  font-size:.7rem;

footer a{color:var(--mute);text-decoration:none}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--mute)}
</style>

function loadPins(){try{return JSON.parse(localStorage.getItem(PIN_KEY))||{}}catch{return{}}}
function savePins(){try{localStorage.setItem(PIN_KEY,JSON.stringify(PINS))}catch{}}
function isPinned(id){return !!PINS[id]}
function togglePin(id,e){
  if(e){e.preventDefault();e.stopPropagation()}
  if(PINS[id])delete PINS[id];else PINS[id]=Date.now();
  savePins();render();
}
function clearPins(){PINS={};savePins();render()}

function titleCase(s){
  return s.replace(/[-_]/g,' ')
    .replace(/\.(html|pdf)$/i,'')
    .replace(/(\d)+$/,'')
    .trim()
    .replace(/\b\w/g,c=>c.toUpperCase());
}

function fmtSize(b){
  if(!b)return null;
  if(b<1024)return b+' B';
  if(b<1048576)return(b/1024).toFixed(0)+'K';
  return(b/1048576).toFixed(1)+'M';
}

function fmtAgo(iso){
  if(!iso)return null;
  const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(d<1)return'today';
  if(d<2)return'1d ago';
  if(d<31)return d+'d ago';
  const m=Math.floor(d/30);
  if(m<12)return m+'mo ago';
  return Math.floor(m/12)+'y ago';
}

function categorize(name){
  for(const [cat,re] of CATS){
    if(re.test(name))return cat;
  }
  return 'other';
}

function isRecent(iso){
  if(!iso)return false;
  return (Date.now()-new Date(iso).getTime()) < 7*86400000;
}

function matchSearch(item,q){
  if(!q)return true;
  q=q.toLowerCase();
  return (item.title||'').toLowerCase().includes(q)
    || (item.file||'').toLowerCase().includes(q)
    || (item.host||'').toLowerCase().includes(q)
    || (item.desc||item.description||'').toLowerCase().includes(q)
    || (item.url||'').toLowerCase().includes(q);
}

function buildCatCounts(items){
  const counts = {all:items.length};
  for(const it of items){
    counts[it.cat] = (counts[it.cat]||0)+1;
  }
  return counts;
}

function renderCategories(items){
  const bar = document.getElementById('cat-bar');
  if(activeFilter !== 'all' && activeFilter !== 'site' && activeFilter !== 'pdf'){
    bar.innerHTML='';
    return;
  }
  const counts = buildCatCounts(items);
  // Sort categories by count, but keep 'all' first and 'other' last
  const cats = Object.keys(counts).filter(c => c!=='all' && c!=='other')
    .sort((a,b) => counts[b]-counts[a]);
  if(counts.other) cats.push('other');
  cats.unshift('all');

  bar.innerHTML = cats.map(c => `
    <button class="cat-chip ${activeCat===c?'active':''}" data-cat="${c}">
      ${CAT_LABEL[c]||c}<span class="n">${counts[c]||0}</span>
    </button>
  `).join('');

  bar.querySelectorAll('.cat-chip').forEach(b => {
    b.onclick = () => { activeCat = b.dataset.cat; render(); };
  });
}

function renderLibrary(){
  const grid = document.getElementById('lib-grid');
  if(activeFilter !== 'all' && activeFilter !== 'site' && activeFilter !== 'pdf'){
    document.getElementById('lib-section').classList.add('hidden');
    return;
  }
  document.getElementById('lib-section').classList.remove('hidden');

  // Filter by type
  let items = [...DATA.sites, ...DATA.pdfs];
  if(activeFilter==='site') items = DATA.sites;
  if(activeFilter==='pdf')  items = DATA.pdfs;

  // Build cat chips off the type-filtered set
  renderCategories(items);

  // Apply category + search
  let shown = items;
  if(activeCat !== 'all') shown = shown.filter(it => it.cat === activeCat);
  shown = shown.filter(it => matchSearch(it,searchQ));

  // Sort
  if(sortMode === 'recent'){
    shown.sort((a,b) => (b.mod||'').localeCompare(a.mod||''));
  } else if(sortMode === 'alpha'){
    shown.sort((a,b) => a.title.localeCompare(b.title));
  } else if(sortMode === 'size'){
    shown.sort((a,b) => (b.size||0)-(a.size||0));
  }

  if(shown.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">nothing here</div>`;
    return;
  }

  grid.innerHTML = shown.map(it => {
    const recent = isRecent(it.mod);
    const pid = it.type+':'+it.file;
    return `
      <a href="${it.url}" target="_blank" class="lib-card ${it.type}" data-id="${pid}">
        ${recent?`<span class="new-tag">NEW</span>`:''}
        <button class="pin-btn ${isPinned(pid)?'pinned':''}" onclick="togglePin('${pid}',event)" title="Pin">${isPinned(pid)?'★':'☆'}</button>
        <div class="ttl">${it.title}</div>
        <div class="file">${it.file}</div>
        ${it.desc?`<div class="desc">${it.desc}</div>`:''}
        <div class="meta">
          <span class="ext">${it.type==='pdf'?'PDF':'HTML'}</span>
          ${it.size?`<span>${fmtSize(it.size)}</span>`:''}
          ${it.mod?`<span>${fmtAgo(it.mod)}</span>`:''}
          <span style="color:var(--dim);opacity:.6">·</span>
          <span style="color:var(--dim);opacity:.7">${it.cat}</span>
        </div>
      </a>
    `;
  }).join('');
}

async function loadSites(){
  try{
    const res = await fetch(`${GH_API}/contents`);
    const files = await res.json();
    const appPaths = new Set();
    for(const a of APPS){
      const m = a.url.match(/niggerfaggot\.club\/([^/]+\.html)$/);
      if(m) appPaths.add(m[1]);
    }
    DATA.sites = files
      .filter(f => f.name.endsWith('.html')
        && f.name !== 'index.html'
        && f.name !== '404.html'
        && !appPaths.has(f.name))
      .map(f => ({
        type:'site',
        title: titleCase(f.name),
        file: f.name,
        url: PAGES_BASE + f.name,
        size: f.size,
        mod: FILE_DATES[f.name] || null,
        desc: DESCRIPTIONS[f.name] || null,
        cat: categorize(f.name),
      }));
  }catch(e){console.error('sites fetch failed',e)}
}

async function loadPDFs(){
  try{
    const res = await fetch(R2_LIST);
    const data = await res.json();
    DATA.pdfs = data.files
      .filter(f => f.key.endsWith('.pdf') && !f.key.startsWith('_'))
      .map(f => ({
        type:'pdf',
        title: titleCase(f.key),
        file: f.key,
        url: R2_BASE + f.key,
        size: f.size,
        mod: f.lastModified || f.uploaded || null,
        desc: DESCRIPTIONS[f.key] || null,
        cat: categorize(f.key),
      }));
  }catch(e){console.error('pdf fetch failed',e)}
}

async function loadAll(force=false){
  document.querySelector('.refresh').classList.add('spinning');

  if(!force){
    try{
      const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(c && Date.now()-c.t < CACHE_TTL){
        DATA = c.data;
        document.getElementById('last-sync').textContent = 'cached';
        render();
        document.querySelector('.refresh').classList.remove('spinning');
        // Background refresh
        setTimeout(()=>loadAll(true),100);
        return;
      }
    }catch{}
  }

  DATA.apps = APPS;
  DATA.services = SERVICES;

  // Kick off network loads in parallel
  await Promise.all([loadSites(), loadPDFs()]);

  document.getElementById('last-sync').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(),data:DATA}));
  }catch{}

  render();
  document.querySelector('.refresh').classList.remove('spinning');
}

// Keyboard: '/' focuses search, 'r' refreshes, 'Esc' clears search
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') {
    if(e.key === 'Escape'){ e.target.blur(); e.target.value=''; searchQ=''; render(); }
    return;
  }
  if(e.key === '/'){ e.preventDefault(); document.getElementById('search').focus(); }
  if(e.key === 'r' && !e.metaKey && !e.ctrlKey){ refresh(); }
});

// Initial
loadAll();
</script>
