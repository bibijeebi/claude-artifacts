        let allSites = [];
        let activeTags = new Set();
        let searchQuery = '';

        async function init() {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents`);
            const files = await res.json();
            const githubSites = files
                .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
                .map(f => ({ key: f.name, url: f.name, ...siteMeta[f.name] }));
            const otherSites = Object.entries(siteMeta)
                .filter(([key]) => !key.endsWith('.html'))
                .map(([key, meta]) => ({ key, url: meta.url || key, ...meta }));
            allSites = [...githubSites, ...otherSites].filter(s => s.title).sort((a, b) => a.title.localeCompare(b.title));
            renderStats();
            renderTagFilters();
            renderSites();
        }

        function renderStats() {
            const counts = {
                html: allSites.filter(s => s.tags?.includes('html')).length,
                pdf: allSites.filter(s => s.tags?.includes('pdf')).length,
                app: allSites.filter(s => s.tags?.includes('app')).length,
                gallery: allSites.filter(s => s.tags?.includes('gallery')).length,
                slides: allSites.filter(s => s.tags?.includes('slides')).length
            };
            document.getElementById('stats').innerHTML = `
                <div class="stat" data-tag=""><span class="stat-count">${allSites.length}</span> Total</div>
                <div class="stat" data-tag="html"><span class="stat-count">${counts.html}</span> HTML</div>
                <div class="stat" data-tag="pdf"><span class="stat-count">${counts.pdf}</span> PDF</div>
                <div class="stat" data-tag="slides"><span class="stat-count">${counts.slides}</span> Slides</div>
                <div class="stat" data-tag="gallery"><span class="stat-count">${counts.gallery}</span> Gallery</div>
                <div class="stat" data-tag="app"><span class="stat-count">${counts.app}</span> Apps</div>
            `;
            document.querySelectorAll('.stat').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    if (!tag) { activeTags.clear(); }
                    else if (activeTags.has(tag)) { activeTags.delete(tag); }
                    else { activeTags.add(tag); }
                    updateActiveStates();
                    renderSites();
                });
            });
        }

        function renderTagFilters() {
            const usedTags = new Set();
            allSites.forEach(s => s.tags?.forEach(t => usedTags.add(t)));
            let html = '';
            for (const [category, tags] of Object.entries(tagCategories)) {
                const active = tags.filter(t => usedTags.has(t));
                if (active.length === 0) continue;
                html += `<div class="tag-group"><span class="tag-group-label">${category}:</span>`;
                active.forEach(tag => { html += `<span class="tag-filter" data-tag="${tag}">${tag}</span>`; });
                html += '</div>';
            }
            html += '<span class="clear-filters" id="clear-filters">Clear All</span>';
            document.getElementById('tag-filters').innerHTML = html;
            document.querySelectorAll('.tag-filter').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    if (activeTags.has(tag)) { activeTags.delete(tag); }
                    else { activeTags.add(tag); }
                    updateActiveStates();
                    renderSites();
                });
            });
            document.getElementById('clear-filters').addEventListener('click', () => {
                activeTags.clear();
                searchQuery = '';
                document.getElementById('search').value = '';
                updateActiveStates();
                renderSites();
            });
        }

        function updateActiveStates() {
            document.querySelectorAll('.stat').forEach(el => {
                el.classList.toggle('active', el.dataset.tag && activeTags.has(el.dataset.tag));
            });
            document.querySelectorAll('.tag-filter').forEach(el => {
                el.classList.toggle('active', activeTags.has(el.dataset.tag));
            });
        }

        function renderSites() {
            let filtered = allSites;
            if (activeTags.size > 0) {
                filtered = filtered.filter(site => site.tags && [...activeTags].some(tag => site.tags.includes(tag)));
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(site => 
                    site.title?.toLowerCase().includes(q) ||
                    site.description?.toLowerCase().includes(q) ||
                    site.tags?.some(t => t.includes(q))
                );
            }
            const grid = document.getElementById('grid');
            const noResults = document.getElementById('no-results');
            if (filtered.length === 0) { grid.innerHTML = ''; noResults.style.display = 'block'; return; }
            noResults.style.display = 'none';
            grid.innerHTML = filtered.map(site => {
                const tags = (site.tags || []).map(tag => `<span class="card-tag ${getTagCategory(tag)}" data-tag="${tag}">${tag}</span>`).join('');
                const url = site.url?.startsWith('http') || site.url?.startsWith('/') ? site.url : site.key;
                return `<a href="${url}" class="site-card" target="_blank">
                    <div class="card-header">
                        <div class="card-icon">${site.icon || '📄'}</div>
                        <div class="card-title-area">
                            <div class="card-title">${site.title}</div>
                            <div class="card-path">${site.key}</div>
                        </div>
                    </div>
                    <div class="card-description">${site.description || ''}</div>
                    <div class="card-tags">${tags}</div>
                </a>`;
            }).join('');
            document.querySelectorAll('.card-tag').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const tag = el.dataset.tag;
                    if (activeTags.has(tag)) { activeTags.delete(tag); }
                    else { activeTags.add(tag); }
                    updateActiveStates();
                    renderSites();
                });
            });
        }

        document.getElementById('search').addEventListener('input', (e) => { searchQuery = e.target.value; renderSites(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('search').focus(); }
            if (e.key === 'Escape') { activeTags.clear(); searchQuery = ''; document.getElementById('search').value = ''; document.getElementById('search').blur(); updateActiveStates(); renderSites(); }
        });
        init();
    </script>
</body>
</html>
