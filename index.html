<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Artifacts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 20px 20px; }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 1rem; }
        .subtitle .count { color: #667eea; font-weight: bold; }

        .search-container { max-width: 500px; margin: 20px auto; }
        #search {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        #search::placeholder { color: #888; }
        #search:focus { outline: none; border-color: #667eea; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            display: block;
        }
        .card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.08);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        .card-file {
            font-size: 0.75rem;
            color: #667eea;
            font-family: monospace;
            opacity: 0.8;
        }
        .card-meta {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-size {
            background: rgba(102, 126, 234, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            text-align: center;
            padding: 40px;
            color: #f88;
            background: rgba(255,100,100,0.1);
            border-radius: 12px;
            margin: 20px 0;
        }

        .no-results {
            text-align: center;
            padding: 60px;
            color: #888;
            grid-column: 1 / -1;
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .last-updated {
            text-align: center;
            font-size: 0.75rem;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Claude Artifacts</h1>
            <p class="subtitle">Deployed sites: <span class="count" id="count">...</span></p>
            <p class="last-updated" id="lastUpdated"></p>
        </header>

        <div class="search-container">
            <input type="text" id="search" placeholder="Search artifacts...">
        </div>

        <div class="grid" id="grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading artifacts...</p>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadArtifacts()">↻ Refresh</button>

    <script>
        const REPO = 'bibijeebi/claude-artifacts';
        const PAGES_URL = 'https://claude-artifacts.pages.dev';
        
        let allArtifacts = [];

        function formatTitle(filename) {
            return filename
                .replace('.html', '')
                .replace(/-/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function renderCards(artifacts) {
            const grid = document.getElementById('grid');
            
            if (artifacts.length === 0) {
                grid.innerHTML = '<div class="no-results">No artifacts found</div>';
                return;
            }

            grid.innerHTML = artifacts.map(file => `
                <a href="${PAGES_URL}/${file.name}" class="card" target="_blank">
                    <div class="card-title">${formatTitle(file.name)}</div>
                    <div class="card-file">${file.name}</div>
                    <div class="card-meta">
                        <span class="card-size">${formatSize(file.size)}</span>
                    </div>
                </a>
            `).join('');
        }

        function filterArtifacts(query) {
            const q = query.toLowerCase();
            const filtered = allArtifacts.filter(f => 
                f.name.toLowerCase().includes(q) || 
                formatTitle(f.name).toLowerCase().includes(q)
            );
            renderCards(filtered);
        }

        async function loadArtifacts() {
            const grid = document.getElementById('grid');
            grid.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading artifacts...</p>
                </div>
            `;

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents`);
                if (!res.ok) throw new Error('Failed to fetch');
                
                const files = await res.json();
                
                allArtifacts = files
                    .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
                    .sort((a, b) => a.name.localeCompare(b.name));

                document.getElementById('count').textContent = allArtifacts.length;
                document.getElementById('lastUpdated').textContent = 
                    'Last refreshed: ' + new Date().toLocaleTimeString();
                
                renderCards(allArtifacts);
                
            } catch (err) {
                grid.innerHTML = `
                    <div class="error">
                        <p>Failed to load artifacts</p>
                        <p style="font-size: 0.8rem; margin-top: 10px;">${err.message}</p>
                    </div>
                `;
            }
        }

        document.getElementById('search').addEventListener('input', (e) => {
            filterArtifacts(e.target.value);
        });

        loadArtifacts();
    </script>
</body>
</html>
