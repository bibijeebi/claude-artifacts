        let allSites = [];

        async function init() {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents`);
            const files = await res.json();
            const githubSites = files
                .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
                .map(f => ({ key: f.name, url: f.name, ...siteMeta[f.name] }));
            const otherSites = Object.entries(siteMeta)
                .filter(([key]) => !key.endsWith('.html'))
                .map(([key, meta]) => ({ key, url: meta.url || key, ...meta }));
            allSites = [...githubSites, ...otherSites].filter(s => s.title).sort((a, b) => a.title.localeCompare(b.title));
            renderTagCloud();
            renderSites();
        }

        function renderTagCloud() {
            // Update total count
            document.getElementById('total-count').textContent = allSites.length;
            
            // Count tag frequencies
            const tagCounts = {};
            allSites.forEach(s => s.tags?.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
            
            // Sort by frequency then alphabetically
            const sortedTags = Object.entries(tagCounts)
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
            
            // Calculate sizes (font-size based on frequency)
            const maxCount = Math.max(...Object.values(tagCounts));
            const minSize = 0.75, maxSize = 1.4;
            
            const cloud = sortedTags.map(([tag, count]) => {
                const size = minSize + (count / maxCount) * (maxSize - minSize);
                const cat = getTagCat(tag);
                return `<span class="cloud-tag ${cat}" data-tag="${tag}" style="font-size:${size}rem">${getTagLabel(tag)} <small style="opacity:0.5">${count}</small></span>`;
            }).join('');
            
            document.getElementById('tag-cloud').innerHTML = `
                <div class="tag-cloud-title">
                    <span>Tags</span>
                    <span class="clear-filters" id="clear-filters">Clear All</span>
                </div>
                ${cloud}
            `;
            
            document.querySelectorAll('.cloud-tag').forEach(el => {
                el.addEventListener('click', () => toggleTag(el.dataset.tag));
            });
            document.getElementById('clear-filters').addEventListener('click', clearFilters);
        }

        function toggleTag(tag) {
            if (!tag) { activeTags.clear(); }
            else if (activeTags.has(tag)) { activeTags.delete(tag); }
            else { activeTags.add(tag); }
            updateUI();
        }

        function clearFilters() {
            activeTags.clear();
            searchQuery = '';
            document.getElementById('search').value = '';
            updateUI();
        }

        function updateUI() {
            // Update active states
            document.querySelectorAll('.cloud-tag').forEach(el => {
                el.classList.toggle('active', activeTags.has(el.dataset.tag));
            });
            
            // Show active filters
            const activeHtml = [...activeTags].map(t => 
                `<span class="active-filter" data-tag="${t}">${getTagLabel(t)}</span>`
            ).join('');
            document.getElementById('active-filters').innerHTML = activeHtml;
            document.querySelectorAll('.active-filter').forEach(el => {
                el.addEventListener('click', () => toggleTag(el.dataset.tag));
            });
            
            renderSites();
        }

        function renderSites() {
            let filtered = allSites;
            if (activeTags.size > 0) {
                filtered = filtered.filter(site => site.tags && [...activeTags].every(tag => site.tags.includes(tag)));
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(site => 
                    site.title?.toLowerCase().includes(q) ||
                    site.desc?.toLowerCase().includes(q) ||
                    site.tags?.some(t => t.includes(q))
                );
            }
            
            const grid = document.getElementById('grid');
            const noResults = document.getElementById('no-results');
            const resultsCount = document.getElementById('results-count');
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                resultsCount.textContent = '';
                return;
            }
            
            noResults.style.display = 'none';
            resultsCount.textContent = filtered.length === allSites.length ? '' : `Showing ${filtered.length} of ${allSites.length}`;
            
            grid.innerHTML = filtered.map(site => {
                const format = site.tags?.find(t => ['web', 'doc', 'app'].includes(t)) || '';
                const otherTags = (site.tags || []).filter(t => !['web', 'doc', 'app'].includes(t))
                    .map(tag => `<span class="card-tag ${getTagCat(tag)}" data-tag="${tag}">${getTagLabel(tag)}</span>`).join('');
                const url = site.url?.startsWith('http') || site.url?.startsWith('/') ? site.url : site.key;
                return `<a href="${url}" class="site-card" target="_blank">
                    <div class="card-header">
                        <div class="card-icon">${site.icon || '📄'}</div>
                        <div class="card-title-area">
                            <div class="card-title">${site.title}<span class="card-format">${format}</span></div>
                        </div>
                    </div>
                    <div class="card-description">${site.desc || ''}</div>
                    <div class="card-tags">${otherTags}</div>
                </a>`;
            }).join('');
            
            document.querySelectorAll('.card-tag').forEach(el => {
                el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleTag(el.dataset.tag); });
            });
        }

        document.getElementById('search').addEventListener('input', (e) => { searchQuery = e.target.value; renderSites(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('search').focus(); }
            if (e.key === 'Escape') { clearFilters(); document.getElementById('search').blur(); }
        });
        init();
    </script>
</body>
</html>
