<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="C233 Employment Law Drill">
<meta property="og:description" content="HamStudy-style mastery drill for WGU C233 Employment Law, built from all 48 real pre-assessment questions. Requeues misses until mastered.">
<meta property="og:url" content="https://niggerfaggot.club/c233-drill">

<title>C233 Law Drill</title>
<style>
:root{--bg:#e9edf0;--panel:#fff;--ink:#2b3238;--dim:#7a8590;--teal:#159fc9;--green:#43a047;--red:#e23b3b;--line:#dde3e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:14px}
.wrap{max-width:640px;margin:0 auto}
.head{background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.head h1{font-size:17px;line-height:1.2}
.head .sub{font-size:12px;color:var(--dim)}
.rings{margin-left:auto;display:flex;gap:10px}
.ring{width:52px;text-align:center;font-size:10px;color:var(--dim)}
.ring svg{display:block;margin:0 auto 2px}
.ring .val{font-weight:700;font-size:11px;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.reset{font-size:12px;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none}
.card{background:var(--panel);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qtopic{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px}
.qtext{font-size:16.5px;line-height:1.45;margin-bottom:14px}
.ans{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;line-height:1.4;margin-bottom:8px;cursor:pointer;color:var(--ink)}
@media(hover:hover){.ans:hover{border-color:var(--teal)}}
.ans .ltr{font-weight:700;color:var(--dim);flex:none}
.ans.correct{border-color:var(--green);background:#eef7ee}
.ans.wrong{border-color:var(--red);background:#fdeeee}
.ans.reveal{border-color:var(--green)}
.ans:disabled{cursor:default}
.explain{display:none;margin-top:10px;border-left:3px solid var(--red);background:#fdf3f3;padding:10px 12px;font-size:13.5px;line-height:1.5;border-radius:0 6px 6px 0}
.explain b{color:var(--green)}
.explain .cont{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.meta{margin-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.done{background:var(--panel);border-radius:10px;padding:30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.done h2{color:var(--green);margin-bottom:8px}
.done p{color:var(--dim);font-size:14px;margin-bottom:16px}
.done button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>C233 Employment Law Drill</h1>
      <div class="sub">48 PAM questions, mastered twice each</div>
    </div>
    <div class="rings">
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="seenArc" cx="22" cy="22" r="19" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="seenVal">0%</span>Seen</div>
      <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#e6ebef" stroke-width="5"/><circle id="aptArc" cx="22" cy="22" r="19" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="val" id="aptVal">0%</span>Apt</div>
    </div>
  </div>
  <div class="bar">
    <select id="topicSel"><option value="">All topics</option></select>
    <button class="reset" id="resetBtn">reset</button>
  </div>
  <div id="stage"></div>
</div>
<script>
const MCQS=[
["Which constitutional provision mandates that federal regulations have priority over state law?", ["Third Amendment", "Supremacy Clause", "Prioritization Clause", "Federalist Number 10"], 1, "Supremacy Clause, Article VI: Constitution, federal law, treaties, and federal regulations trump state law.", "Foundations"],
["Which doctrine is used by U.S. courts to align current cases with prior legal decisions?", ["Stare decisis", "Judicial review", "Equitable estoppel", "Respondeat superior"], 0, "Stare decisis = 'let the decision stand,' follow precedent. Judicial review = testing laws against the Constitution.", "Foundations"],
["Two corporations have combined their management and operations into a single place with 30 total employees. Which type of business relationship is formed that now requires both companies to comply with federal employment law?", ["Joint employer", "Sole proprietorship", "Integrated enterprise", "Limited liability partnership"], 2, "Combined management + operations = integrated enterprise, counted as ONE employer. Joint employer = two separate entities controlling the same worker.", "Foundations"],
["Which test is used to distinguish an independent contractor from an employee?", ["Covered employer test", "Economic realities test", "Integrated enterprise test", "Scope of employment test"], 1, "Economic realities test: is the worker economically dependent on the employer? (Common law control test and IRS 20-factor are the others.)", "Foundations"],
["The employee handbook used by a temporary employment agency stated, 'Employees may not be terminated except after first receiving an oral warning, then a formal written warning.' Which principle is demonstrated in the handbook?", ["Express term", "Implied contract", "Contract exemption", "Constructive discharge"], 1, "Handbook promising a termination procedure = implied contract, the at-will exception. Express terms come from formal negotiation.", "Foundations"],
["No employee with a company has ever been terminated without strict adherence to the progressive discipline procedures outlined in the employee handbook. How does the employee handbook apply in this situation?", ["It makes employees at-will.", "It is an implied contract for employees.", "Oral modifications supersede the written handbook.", "The employer may deviate from it for particular employees."], 1, "Consistent practice of following the handbook creates an implied contract binding the employer to it.", "Foundations"],
["What determines employer liability under the respondeat superior doctrine?", ["Employee accountability", "Employee compensation", "The scope of employment", "The dual purpose doctrine"], 2, "Employer is liable only for employee actions within the scope of employment.", "Foundations"],
["Which term indicates that an employer may terminate an employee at any time, for any legal reason, without incurring liability?", ["Employment-at-will", "Respondeat superior", "Scope of employment", "Dual purpose mission"], 0, "At-will: either side can end employment anytime for any legal reason. Every state except Montana.", "Foundations"],
["Which type of employment contract is created by the actions of the employer and employee rather than through a formal contract negotiation?", ["Oral", "Explicit", "Implied", "Written"], 2, "Implied contract = created by conduct. Explicit/express = terms stated in formal agreement (oral or written).", "Foundations"],
["An employee claimed the need for special treatment based on Title VII. What is the first question an HR professional should ask to determine if this law applies to the employee?", ["Is the employee an at-will employee?", "What have similar referents done in this situation?", "Does the employee meet the eligibility requirements?", "What type of special treatment is the employee requesting?"], 2, "Step one is always coverage/eligibility: does the law even apply (employer size, protected class, covered employee)?", "Title VII & Discrimination"],
["To which agency did Title VII give authority to conduct its own enforcement litigation?", ["ADA", "BFOQ", "OSHA", "EEOC"], 3, "EEOC, created by CRA 1964; got its own litigation authority via the 1972 EEO Act amendment.", "Title VII & Discrimination"],
["A women's shelter hires only women as intake specialists and is being sued for disparate treatment. Which role does HR have in relation to the EEOC in this scenario?", ["Establishing indirect evidence", "Providing comparative evidence", "Demonstrating pattern and practice", "Showing bona fide occupational qualification"], 3, "Facially discriminatory policy defended by proving gender is a BFOQ, reasonably necessary to the shelter's operations.", "Title VII & Discrimination"],
["A 65-year-old woman was passed over for a job. The employer told her, 'We're looking to create a younger workforce.' Which type of discrimination is reflected?", ["Systemic bias", "Direct retaliation", "Disparate impact", "Disparate treatment"], 3, "Intentional adverse treatment of an individual with direct evidence ('younger workforce') = disparate treatment.", "Title VII & Discrimination"],
["An organization requires at least a bachelor's degree. Protected-class applicants claim this puts them at a disadvantage. Which rule determines whether there was substantial impact on the protected class?", ["Four-fifths rule", "Equal opportunity rule", "Business necessity rule", "Respondeat superior rule"], 0, "Four-fifths rule: adverse impact flagged when protected class selection rate is under 80% of the majority's rate.", "Title VII & Discrimination"],
["Which practice is descriptive of a church requiring clergy to be of a particular denomination?", ["Adverse impact", "Disparate treatment", "Reverse discrimination", "Bona fide occupational qualification"], 3, "Religion as BFOQ, reasonably necessary to the religious organization's operations (Section 702).", "Title VII & Discrimination"],
["A company reduced a pregnant employee's hours from 40 per week to eight on the basis that she could no longer perform the fundamental requirements of her position. Which statute will help the employee's case?", ["Family Medical Leave Act", "Women in the Workplace Act", "Pregnancy Discrimination Act", "Americans with Disabilities Act"], 2, "PDA (1978, Title VII amendment): treat pregnancy like any other temporary disability, no unilateral hour-cutting.", "Title VII & Discrimination"],
["Which claim alleges that the work atmosphere has become sexually charged with offensive behaviors that interfere with an employee's work performance?", ["Quid pro quo", "Hostile environment", "Gender discrimination", "Reverse discrimination"], 1, "Atmosphere + interference with performance = hostile environment. Quid pro quo requires authority + a tangible job action.", "Title VII & Discrimination"],
["A company sets a goal to hire 30% women in engineering jobs. A class action alleges this preference will deny jobs to otherwise qualified males. Which theory does this illustrate from the male's perspective?", ["National origin", "Affirmative action", "Disparate impact", "Reverse discrimination"], 3, "Preference applied as a fixed number denying qualified majority-group members = reverse discrimination.", "Title VII & Discrimination"],
["Which legislation prohibits discrimination based on physical limitations?", ["Family Medical Leave Act", "Americans with Disabilities Act", "Older Worker's Benefit Protection Act", "Age Discrimination in Employment Act"], 1, "Physical limitations = disability = ADA (1990, private sector 15+).", "Title VII & Discrimination"],
["A city firefighter posting lists essential functions including running. An applicant cannot run due to a former injury and requests a reasonable accommodation. What are the city's duties under the ADA?", ["The city may reject the application because the applicant has a physical disability.", "The city must consider the application and find a position that will not require running.", "The city may reject the application as the applicant cannot perform one of the essential job functions.", "The city must consider the application even though the applicant cannot perform one of the essential job functions."], 2, "Qualified individual = can perform ESSENTIAL functions with or without accommodation. Can't run = not qualified. No duty to create a new job or waive essential functions.", "Title VII & Discrimination"],
["Whose duty is it to suggest a reasonable accommodation that is not readily obvious?", ["Jury", "Judge", "Employer", "Employee"], 3, "Unless the disability is patently obvious, the EMPLOYEE must request/suggest the accommodation to start the interactive process.", "Title VII & Discrimination"],
["Which action demonstrates a goal of affirmative action?", ["Hiring underqualified women candidates", "Meeting ethnic or gender quotas", "Correcting discriminatory practices", "Promoting unqualified minority candidates"], 2, "AA = correcting effects of past/current discrimination. Never quotas, never hiring the unqualified.", "Title VII & Discrimination"],
["Which employer action is a possible employer defense to a claim asserted under the federal ADEA?", ["Employing fewer than 10 employees so the ADEA does not apply", "Stating that job advertisements are not covered under the ADEA", "Requiring all full-time employees over the age of 60 to retire", "Stating that the supervisor who disciplined the employee is over the age of 40"], 0, "ADEA covers employers with more than 20 employees; fewer than 10 = not covered at all. Mandatory retirement is illegal; ads are covered; the supervisor's age is irrelevant.", "Title VII & Discrimination"],
["An employee requests a schedule change for religious practices. According to Title VII, which action is considered an undue hardship for the employer?", ["Mandating that other employees change their schedules against their objections.", "Permitting the employee to go to lunch at 12:00 pm instead of 1:00 pm once a month.", "Incurring minimal costs for temporary staff one week a year.", "Allowing the employee to leave two-hours early on a specific date once a year."], 0, "Religious hardship bar is de minimis, but forcing OTHER employees to change shifts over their objections crosses it. Voluntary swaps ok, forced ones not.", "Title VII & Discrimination"],
["Which race discrimination claim can be based on an employer's policy of racial animosity, steering assignments or yielding to customer discriminatory preference?", ["Disparate treatment", "Racial impact", "Harassment", "Segregation"], 0, "Animus, steering, and customer-preference policies are intentional = disparate treatment.", "Title VII & Discrimination"],
["Which two types of conduct make a company liable for race-based harassment?", ["Unwelcome conduct and pervasive conduct", "Disparate conduct and adverse conduct", "Unwelcome conduct and comparative conduct", "Adverse conduct and pervasive conduct"], 0, "Race harassment liability = conduct that is (1) unwelcome and (2) severe or pervasive enough to alter employment conditions.", "Title VII & Discrimination"],
["Which system for employers determines worker eligibility using Form I-9?", ["E-Verify", "Web Verify", "I-Verification", "Verify Online"], 0, "E-Verify: USCIS internet system confirming work eligibility from I-9 data. Mandatory for covered federal contractors.", "Hiring & Compliance"],
["An employee has demonstrated violent tendencies that developed over several years and were not discernable at hire. The employer is aware but does not terminate. Which legal risk does the employer face?", ["Retaliation", "Defamation", "Negligent hiring", "Negligent retention"], 3, "Danger apparent AFTER hire + kept anyway = negligent retention. Negligent hiring requires the risk to be knowable at hire.", "Hiring & Compliance"],
["Which type of employee would be considered exempt from overtime under the FLSA?", ["An employee who performs janitorial services and earns Federal minimum wage", "A manager with two direct reports who receives high pay", "A computer specialist who earns $20 an hour", "A lead machine operator who oversees minor repairs and earns $10 an hour"], 1, "Exempt = white-collar duties + salary (executive/administrative/professional). High-paid manager with direct reports fits. Duties control, not titles.", "Hiring & Compliance"],
["A Department of Defense supervisor searches an employee's office to investigate misconduct. Which two standards must this search meet to satisfy constitutional requirements?", ["It must be (1) justified at its start, and (2) limited in scope.", "It may not (1) be highly offensive to a reasonable person, or (2) intrude into private matters.", "It may not (1) place the employee in a false light, or (2) appropriate the employee's likeness.", "It must be (1) conducted while the employee is present, and (2) terminate upon the employee's objection."], 0, "O'Connor v. Ortega: public-employer search must be justified at inception and limited in scope. The other options are privacy-tort elements.", "Privacy"],
["An employee sends a personal e-mail using the company's e-mail service. The employer reads it to check whether the employee is wasting time. Which legal principle governs?", ["Because the employer is a large company, the employer may read the e-mail.", "Because the employer read a private e-mail, the employer has violated the law.", "Because the employee sent the e-mail during the workday, the employer may read the e-mail.", "Because the employee used the company's e-mail service, the employer may read the e-mail."], 3, "ECPA service-provider exemption: employer owns the system, so it may monitor business-purpose use. The system, not the time of day, is what matters.", "Privacy"],
["When is a search of personal items by an employer lawful under the Privacy Act and as determined by the Supreme Court without actually deciding the merits of the matter?", ["The search is justified at the start.", "The search is thorough and unlimited.", "The employee is suspected of frolic and detour.", "The employee is engaged in a dual purpose mission."], 0, "O'Connor v. Ortega again (SCOTUS remanded without deciding merits): justified at its start, limited in scope.", "Privacy"],
["A government agency conducts pre-employment drug screening and quarterly random drug testing. Should the firm be concerned about legal challenges to its policy?", ["No. The agency can conduct more thorough drug testing including testing any employee without prior notice.", "Yes. The agency can require random testing of its own employees but not of individuals not already employed.", "No. Public workers must submit to quarterly random tests under the 1991 Omnibus Transportation Testing Act.", "Yes. Because the agency is a government entity, employees are protected from drug searches unless there is reasonable suspicion of drug use."], 3, "Public-employee drug test = 4th Amendment search, requires reasonable suspicion (or a special-need job). Blanket random testing of ordinary government workers fails.", "Privacy"],
["Which type of information is covered by the Fair Credit Reporting Act?", ["Medical records", "Employer injury claims", "Average employee salary", "Workers' compensation costs"], 0, "FCRA consumer reports cover medical records/payments, tenant history, check writing, employment history, insurance claims.", "Privacy"],
["Which penalty is imposed by the Immigration Reform and Control Act?", ["A company that facilitates an illegal border crossing may face criminal liability.", "An undocumented worker who supplies false paperwork may be deported.", "An individual HR employee who fails to check a new worker's eligibility to work in the United States may face civil liability.", "A company that discriminates against undocumented workers by hiring only United States citizens may face civil liability."], 2, "IRCA imposes PERSONAL civil liability on individuals who fail to verify eligibility (I-9), not just the firm. And IRCA actually permits preferring citizens over equally qualified aliens.", "Hiring & Compliance"],
["A firm with 370 employees closes a plant, laying off 56 with only 40 days notice and no severance due to financial troubles. Which circumstance allows this without violating the WARN Act?", ["Layoffs in a NAFTA free-trade zone", "Layoffs due to a certified economic recession", "Layoffs of foreign nationals working in the U.S.", "Layoffs due to a severe unforeseen loss of capital"], 3, "WARN's three notice exceptions: natural disaster, severe unforeseen loss of capital, faltering company. Recession isn't one.", "Hiring & Compliance"],
["An employee uses chemicals to clean metals on an assembly line. Which requirement will the firm face regarding this employee under OSHA regulations?", ["The employee must be trained in life-saving techniques.", "The employee must be trained in safe handling of chemicals.", "The employee must sign a waiver acknowledging the risks.", "The employee must be certified to supervise other employees nearby."], 1, "OSHA compliance requirement: training in the specific hazard (chemical handling). Waivers can't sign away OSHA duties. Training is OSHA's most-violated regulation.", "Regulation & Benefits"],
["Which right does an employee relinquish in exchange for worker's compensation?", ["To take medical leave", "To sue the employer in tort", "To remain employed at-will", "To receive retirement vesting"], 1, "The compensation bargain: assured no-fault benefits in exchange for giving up the right to sue the employer for negligence. Exclusive remedy.", "Regulation & Benefits"],
["An employee's parent was recently diagnosed with a terminal illness. The employee was full-time last year and worked 2000 hours. How much time off is the employee entitled to under the FMLA?", ["12 weeks", "15 weeks", "120 days", "180 days"], 0, "FMLA: 12 weeks unpaid, job-protected. 2000 hours clears the 1,250-hour eligibility bar; parent is a covered family member.", "Regulation & Benefits"],
["Which three types of statutory authority does the National Labor Relations Board (NLRB) have?", ["Judicial, executive, and rule-making authority", "Implied, traditional, and transactional authority", "Judicial, implied, and executive authority", "Executive, rule-making, and traditional authority"], 0, "NLRB holds all three: executive (enforcement), legislative (rule-making), judicial (ALJ adjudication).", "Labor Law"],
["What is the common name of the Labor Management Relations Act of 1947?", ["Clayton Act", "Taft-Hartley Act", "Occupational Health and Safety Act", "Labor Management Reporting and Disclosure Act"], 1, "LMRA 1947 = Taft-Hartley, the union-curbing act. LMRDA 1959 = Landrum-Griffin, the union-corruption act.", "Labor Law"],
["Which restraints does the Labor Management Reporting and Disclosure Act include?", ["Employers are prohibited from disciplining candidates and union election officials.", "Unions are required to hold officer elections every three years, and candidates must have access to voter rolls.", "Employers must permit union members one day off to vote and provide on-site election space.", "Unions are prohibited from charging more than 1% of gross pay in dues."], 1, "Landrum-Griffin polices union internals: elections every 3 years, voter-roll access, financial reports to DOL, no felon officers.", "Labor Law"],
["What are the employer's responsibilities after the NLRB has authorized a union election?", ["Allow time off to workers to attend a union meeting prior to the election", "Allow union organizers into the workplace to speak to employees", "Provide the NLRB with contact information of workers eligible to vote in the election", "Provide the NLRB and union with payroll records of workers eligible to vote"], 2, "Employer must furnish the NLRB names and addresses of eligible workers, and not interfere. No duty to host organizers or hand over payroll.", "Labor Law"],
["Which three outcomes are legally possible if parties reach a deadlock on mandatory issues during collective bargaining?", ["Union may strike, employer may lock out, either party may resume discussions", "Union may lock out management, employer may poll members, issues become prohibited", "Union may strike, employer may poll the union members, issues become prohibited", "Employer may lock out, union may lock out management, either party may resume discussions"], 0, "Impasse is a deadlock, not an ending: strike, lockout, or resumed talks. Unions can't lock out management and impasse doesn't make issues prohibited.", "Labor Law"],
["Employees at a motor company are unionized and negotiating a new collective bargaining agreement. Under which circumstance has the union committed an unfair labor practice?", ["The union fails to attend a scheduled bargaining session with the employer.", "The union requests an excessive number of vacation days.", "The union abruptly leaves a session after three hours of disagreement about benefits.", "The union demands a wage increase exceeding the current cost of living."], 0, "Skipping a scheduled session = failure to bargain in good faith = ULP. Aggressive demands are just bargaining.", "Labor Law"],
["After good faith negotiations, an employer and union cannot resolve an issue and have reached an impasse. What does the NLRA require in this situation?", ["The parties must submit their last best offers to arbitration.", "The Federal Mediation and Conciliation Service must be notified.", "The parties must wait 90 days as a cooling-off period.", "The prior contract terms continue to govern until negotiations resume."], 1, "At impasse the NLRA requires notifying the FMCS. Then strike or lockout become available.", "Labor Law"],
["Which principle may prevent termination of an at-will employment relationship?", ["Dual purpose", "Respondeat superior", "Common law agency", "Good faith and fair dealing"], 3, "The implied covenant of good faith and fair dealing is one of the three at-will exceptions (about 13 states).", "Foundations"],
["When does the employer have the burden of proof in an EEOC discrimination claim?", ["Throughout the entire process", "After the case has been decided by the court", "During the period that the EEOC investigates", "After the plaintiff has established the prima facie case"], 3, "McDonnell Douglas: plaintiff builds the prima facie case first, THEN the burden shifts to the employer to produce a lawful motive.", "Title VII & Discrimination"]
];
const LS_KEY='c233drill_v1';
let state={};
try{state=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){state={}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function st(i){if(!state[i])state[i]={c:0,hist:[]};return state[i]}

let topic='';
let queue=[],cur=-1,curOpts=[],waiting=false;

function pool(){return MCQS.map((m,i)=>i).filter(i=>!topic||MCQS[i][4]===topic)}
function buildQueue(){
  queue=pool().filter(i=>st(i).c<2);
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}
}
function shuffleOpts(m){
  const o=m[1].map((t,oi)=>({t,oi}));
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  return o;
}
function uniqueWords(correct,others){
  const otherSet=new Set(others.join(' ').toLowerCase().match(/[a-z0-9$%.,']+/g)||[]);
  return correct.split(' ').map(w=>{
    const k=w.toLowerCase();
    return (k.length>2&&!otherSet.has(k))?'<b>'+w+'</b>':w;
  }).join(' ');
}
function rings(){
  const p=pool();
  const seen=p.filter(i=>st(i).hist.length>0).length/(p.length||1);
  const apt=p.reduce((a,i)=>a+Math.min(st(i).c,2)/2,0)/(p.length||1);
  document.getElementById('seenArc').style.strokeDashoffset=119.4*(1-seen);
  document.getElementById('aptArc').style.strokeDashoffset=119.4*(1-apt);
  document.getElementById('seenVal').textContent=Math.round(seen*100)+'%';
  document.getElementById('aptVal').textContent=Math.round(apt*100)+'%';
}
function render(){
  rings();
  const stage=document.getElementById('stage');
  if(!queue.length){
    stage.innerHTML='<div class="done"><h2>Set mastered.</h2><p>Every question in this filter answered correctly twice in a row. Book the OA.</p><button id="againBtn">Study again</button></div>';
    document.getElementById('againBtn').onclick=()=>{pool().forEach(i=>{delete state[i]});save();buildQueue();render()};
    return;
  }
  cur=queue[0];
  const m=MCQS[cur];
  curOpts=shuffleOpts(m);
  const mastered=pool().filter(i=>st(i).c>=2).length;
  stage.innerHTML='<div class="card"><div class="qtopic">'+m[4]+'</div><div class="qtext">'+m[0]+'</div>'+
    curOpts.map((o,d)=>'<button class="ans" data-disp="'+d+'"><span class="ltr">'+'ABCD'[d]+'</span><span class="txt">'+o.t+'</span></button>').join('')+
    '<div class="explain" id="explain"></div>'+
    '<div class="meta"><span>'+mastered+' / '+pool().length+' mastered</span><span>streak: '+st(cur).c+'/2</span></div></div>';
  document.querySelectorAll('#opts .ans, .ans').forEach(b=>b.onclick=()=>answer(+b.dataset.disp));
}
function answer(disp){
  if(waiting)return;
  const m=MCQS[cur],p=st(cur);
  const picked=curOpts[disp],correctDisp=curOpts.findIndex(x=>x.oi===m[2]);
  const ok=picked.oi===m[2];
  p.hist.push(ok?1:0);
  document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.ans');
  if(ok){
    p.c+=1;
    btns[disp].classList.add('correct');
    btns[disp].querySelector('.txt').innerHTML=uniqueWords(picked.t,m[1].filter((_,i)=>i!==m[2]));
    queue.shift();
    if(p.c<2)queue.splice(Math.min(10,queue.length),0,cur);
    save();
    waiting=true;
    setTimeout(()=>{waiting=false;render()},420);
  }else{
    p.c=0;
    btns[disp].classList.add('wrong');
    btns[correctDisp].classList.add('reveal');
    btns[correctDisp].querySelector('.txt').innerHTML=uniqueWords(m[1][m[2]],m[1].filter((_,i)=>i!==m[2]));
    const ex=document.getElementById('explain');
    ex.style.display='block';
    ex.innerHTML=m[3]+'<span class="cont">tap anywhere or press space to continue</span>';
    queue.shift();
    queue.splice(Math.min(3,queue.length),0,cur);
    save();
    waiting=true;
  }
  rings();
}
function next(){if(!waiting)return;waiting=false;render()}
document.addEventListener('keydown',e=>{
  if(waiting&&(e.key===' '||e.key==='Enter')){e.preventDefault();next();return}
  if(waiting)return;
  const k=e.key.toUpperCase();
  const i='1234'.indexOf(e.key)>-1?'1234'.indexOf(e.key):'ABCD'.indexOf(k);
  if(i>-1&&i<curOpts.length)answer(i);
});
document.addEventListener('click',e=>{if(waiting&&!e.target.closest('.ans'))next()});
const sel=document.getElementById('topicSel');
[...new Set(MCQS.map(m=>m[4]))].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)});
sel.onchange=()=>{topic=sel.value;buildQueue();render()};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Wipe all drill progress?')){state={};save();buildQueue();render()}};
buildQueue();render();
</script>
</body>
</html>
