const MCQS=[
["Which human resource function helps the organization understand the number and type of employees the organization will need in the future?", ["Recruiting", "Planning", "Appraising", "Compensating"], 1, "Future number and type of employees = HR planning. Recruiting fills needs already identified.", "HR Roles & Ethics"],
["What are two societal trends that are influencing the world of work?", ["Increased competition and changes in communication technology", "Lower college graduation rates and decreasing world trade", "Decreasing world trade and changes in communication technology", "Increased competition and lower college graduation rates"], 0, "Competition and communication tech are the textbook's trend pair. Trade isn't decreasing and grad rates aren't the driver.", "HR Roles & Ethics"],
["Which factor represents an organization's value system?", ["Corporate culture", "Brand awareness", "Core competencies", "Company reputation"], 0, "Corporate culture IS the value system by definition. Reputation and brand are external perceptions.", "HR Roles & Ethics"],
["Which activity does the strategic human resources manager need to be engaged in, given the fact that organizational survival is increasingly dependent on adaptation?", ["Managing succession by creating contingency plans for key employees within the organization", "Taking on fewer roles to maintain a focused approach to organizational productivity improvements", "Focusing on acquiring human resources skills while leaving marketing and production techniques to those managers", "Maintaining priority on the requisition of services from the management and employees without external considerations"], 0, "Adaptation = engagement = succession/contingency planning for key employees. The other options narrow HR's role.", "HR Roles & Ethics"],
["Which human resource professional provides a broad range of support to the overall organization?", ["Specialist", "Generalist", "Supervisor", "Coordinator"], 1, "Broad range = generalist. Specialist goes deep on one function.", "HR Roles & Ethics"],
["A human resources department is working on increasing diversity within the organization. Which strategic role for a human resources department is being demonstrated?", ["Champion for change", "Initiator of outsourcing", "Administrator of policy", "Agent for legal compliance"], 0, "Increasing diversity is driving change, not administering policy or compliance. HR as change agent.", "HR Roles & Ethics"],
["How should a human resources professional encourage a high ethical standard of conduct in the workplace?", ["By influencing others to make moral choices", "By holding monthly training sessions on integrity", "By maintaining equitable pay levels and alignment", "By ensuring compliance with all legal regulations"], 0, "Ethics is about influencing moral choices, broader than training, pay, or legal compliance (legal is the floor, not ethics).", "HR Roles & Ethics"],
["A technology company reviews behavior of four employees: 1 sold trade secrets to a competitor; 2 requested the company pay for continuing education; 3 recommended hiring a sibling based on the sibling's work experience; 4 applied for other jobs while still employed. Which individual committed an ethical violation?", ["Individual 1", "Individual 2", "Individual 3", "Individual 4"], 0, "Selling trade secrets is the violation. Asking for tuition, referring a qualified sibling, and job hunting are all fine.", "HR Roles & Ethics"],
["What is an exception to the doctrine of employment at will?", ["Implied contract", "Probationary period", "Termination for cause", "Mandatory waiting period"], 0, "The three at-will exceptions: public policy, implied contract, implied covenant of good faith.", "Legal & EEO"],
["What is recognized by courts in several states as an implied contract that can be legally binding?", ["Formal pact", "Union agreement", "Employee handbook", "Public policy documents"], 2, "Handbooks (plus oral assurances and employer actions) can create implied contracts. That's why handbooks state employment is at-will.", "Legal & EEO"],
["What was the goal of Title VII of the Civil Rights Act of 1964?", ["To create a legal structure that deals with contractual issues between employers and employees", "To allow employees greater ability to move between employers and job positions", "To give employers more flexibility in dealing with employees and their employment", "To make it illegal to discriminate against individuals based on their protected classes"], 3, "Title VII = no discrimination on race, color, religion, sex, national origin.", "Legal & EEO"],
["What is the function of the Equal Employment Opportunity Commission (EEOC)?", ["Enforcing federal antidiscrimination statutes", "Conducting mediation when union contracts have expired", "Providing guidance to employers on classifying employees", "Creating guidelines for developing affirmative action programs"], 0, "EEOC enforces federal antidiscrimination law. AA programs are executive-order territory, not EEOC guidelines.", "Legal & EEO"],
["What is the outcome of effective diversity management within organizations?", ["Fewer conflicts", "Better sense of inclusion", "Fewer communication challenges", "Better defined organizational goals"], 1, "Diversity management produces inclusion (feeling welcomed, respected, valued), not conflict elimination.", "Legal & EEO"],
["What is a benefit to promoting an organization's efforts to increase diversity on the company website?", ["It draws attention to diversity commitment.", "It meets the legal obligation to advertise diversity.", "It provides equal opportunity to diverse employees.", "It defines corporate culture with diversity strategies."], 0, "The website promotion draws attention to the commitment. There's no legal obligation to advertise diversity.", "Legal & EEO"],
["A woman is turned down for a higher-paying position because the hiring manager believes men perform the duties better than women. Which term is used to indicate this form of discrimination?", ["Gender discrimination", "Gender identity discrimination", "Sexual harassment discrimination", "Women's equal rights discrimination"], 0, "Unfavorable treatment based on sex = gender discrimination. Gender identity = transgender/nonbinary status.", "Legal & EEO"],
["A black firefighter alleges that each time he transfers between fire stations he must take his bed with him, because no white firefighter would sleep in the same bed. Which type of discrimination under Title VII should the plaintiff file?", ["Race", "Unintentional", "Intentional", "National origin"], 0, "Title VII claims are filed by protected class. Race is the class; intentional/unintentional aren't filing categories.", "Legal & EEO"],
["What was the purpose of the Executive Order 10925 that established affirmative action?", ["To require businesses with 50 or more employees to avoid segregation", "To provide employees with protection from age discrimination in the workplace", "To strengthen sanctions related to discrimination under the Americans with Disabilities Act of 1990", "To mandate that managers of federally funded projects work to eliminate bias in employment practices."], 3, "EO 10925 (Kennedy, 1961) coined 'affirmative action': federally funded project managers must act to eliminate bias.", "Legal & EEO"],
["Why is human resource planning important?", ["It ensures compliance with labor laws.", "It makes employee benefits more attractive.", "It makes it easier to recruit employees from out of state.", "It ensures the right people in the right jobs at the right times."], 3, "HRP = right number and type of people, right place, right time. Broadest scope wins (Rule A).", "Planning & Forecasting"],
["Which step in the human resource planning process ensures that the organization will have the needed supply of employees in the future?", ["Controlling", "Programming", "Developing Data", "Establishing objectives"], 1, "Phase 3 programming designs and implements the action programs (recruitment, training, promotion) that deliver the future supply.", "Planning & Forecasting"],
["Which technique addresses labor forecasting to project future human resource needs based on past staffing levels?", ["Time-series", "Focus group", "Nominal group", "Delphi technique"], 0, "Past staffing levels projected forward = time-series analysis. Delphi and nominal group are judgmental, not data-driven.", "Planning & Forecasting"],
["What are two statistical projection methods used to determine human resources demand?", ["Stochastic technique and multiple linear regression", "Delphi technique and nominal group technique", "Succession planning and stochastic technique", "Delphi technique and multiple linear regression"], 0, "Statistical = regressions, ratios, time series, stochastic. Delphi, nominal group, succession are all judgmental.", "Planning & Forecasting"],
["A firm needs to lay off employees and wants to minimize the effect on employees, opting for a combination of buyouts and outplacement counseling. Which type of plan is the firm engaging in?", ["A control plan", "A retention plan", "A redundancy plan", "An organizational plan"], 2, "Layoffs with buyouts/outplacement = redundancy (reduction) plan, used when supply exceeds demand.", "Planning & Forecasting"],
["How does recruitment relate to other organizational functions or goals?", ["It provides a good pool of applicants for selection, and works with HR planning to determine current and future needs", "It leads to a successful job analysis, and informs the organization about future stock prices", "It works with HR planning to determine needs, and leads to a successful job analysis", "It provides a good pool of applicants for selection, and informs the organization about future stock prices"], 0, "Recruitment feeds selection a good pool and pairs with HR planning on needs. Job analysis comes BEFORE recruitment, not from it.", "Recruiting"],
["At which age does the Age Discrimination in Employment Act begin to protect an individual from discrimination in the recruitment process?", ["35", "40", "50", "65"], 1, "ADEA (1967) protects age 40 and up.", "Legal & EEO"],

["A software company wants permanent employees with the most up-to-date knowledge of development tools; previous work experience is not necessary. What should be a primary source of recruitment?", ["Executive search firms", "Temporary staffing agencies", "Colleges offering the relevant degree", "Independent contracting organizations"], 2, "Current knowledge + no experience required = fresh graduates. Colleges are the source for up-to-date technical/professional talent.", "Recruiting"],
["An engineering firm wants to attract applicants for full-time employment and decides to develop potential job candidates before offering them permanent positions. Which activity should the organization implement?", ["Internships", "Diversity planning", "An assessment center", "Flexible work schedules"], 0, "Internships develop candidates for a fixed period before permanent offers. That's their exact function.", "Recruiting"],
["Job duties for a marketing coordinator include planning trade shows, establishing contacts, developing schedules, and coordinating mailing lists. Which item should be included in the required skills section of this job posting?", ["Operates Microsoft database software", "Runs weekly and monthly team meetings", "Builds relationships with clientele at events", "Establishes and maintains accurate budgets"], 0, "Skills = proficiencies (operating database software for mailing lists/schedules). The others are duties or unrelated to the listed tasks.", "Recruiting"],
["How does recruiting that creates an excessively large applicant pool affect employee selection?", ["The large applicant pool will simplify the process of job analysis and employee selection.", "The organization can reduce the applicant pool by dismissing applicants that are close to retirement.", "The cost of selection will likely increase due to the need to review and assess a high volume of applicants.", "The large applicant pool reduces the significance of employee selection as most of the applicants will meet the job qualifications."], 2, "Utility drops when the pool is too large: more reviewing = more cost. Dismissing near-retirement applicants = ADEA violation.", "Recruiting"],
["What is an effective way to gather relevant information about job applicants during the selection process?", ["An informal interview process in which the questions differ for all applicants", "An application blank where the most important information is weighted heavily", "A wide background check to see if any general negative information is revealed", "A reference check asking for previous employers' opinions about job applicants"], 1, "Weighted application blank (WAB) = validated, weighted predictors. Unstructured interviews, fishing background checks, and opinion-based references are all weak or risky.", "Selection"],
["A fast-growing U.S. company seeks an HR generalist to recruit and hire many employees, monitor performance, determine training needs, and ensure compliance with federal laws. Which criterion aligns with the job?", ["Demonstrated customer service experience", "Ability to work with technology in the legal field", "Knowledge of legal regulations in employment", "A high level of familiarity with past lawsuit outcomes"], 2, "Compliance duty maps to knowledge of employment law. Lawsuit trivia and legal-field tech are distractor bait.", "HR Roles & Ethics"],
["What is an outcome of poor reliability in a selection procedure?", ["An insufficient pool of qualified applicants", "The inability to fire an employee who is performing poorly", "Employees who are not a good fit for the organization", "High correlations between test outcomes and future performance metrics"], 2, "Unreliable instruments select inconsistently, so you hire poor fits. High correlations would mean GOOD reliability.", "Selection"],
["Which type of validity identifies the knowledge, skills, and abilities required to complete a job and needs no quantitative analysis?", ["Content", "Empirical", "Construct", "Discriminant"], 0, "Content validity = expert judgment that the instrument covers job KSAs, no statistics. Empirical requires correlation data.", "Selection"],
["Which selection instrument is used to obtain information on the applicant's motivation and details of previous experiences to get a more subjective feel for the candidate?", ["Resume", "Interview", "Personality test", "Background check"], 1, "Subjective feel + motivation + experience details = interview. That's its strength (and weakness).", "Selection"],
["What is the distinction between training and development?", ["Training requires short-term preparation and development requires long-term preparation.", "Training enhances individual knowledge and skills while development is focused on team knowledge and skills.", "Training is job related while development is the process of developing, presenting, evaluating, and facilitating training.", "Training is directed at the employees' current job whereas development helps the employee prepare for future jobs."], 3, "Training = current job, development = future jobs. The time-horizon option is the classic near-miss distractor.", "Training & Development"],

["At which level of analysis are annual performance reviews?", ["Organization", "Task", "Person", "Project"], 2, "Needs assessment levels: organizational = WHERE, task = WHAT, person = WHO. Performance reviews analyze individuals.", "Training & Development"],
["Successful training implementation depends on selecting the appropriate training media for the right workers under the right conditions. Which factor should be considered in selecting the appropriate training media?", ["The location of the training", "Employee attitude for learning", "Employee readiness for training", "The level of performance management"], 2, "Media selection keys on employee readiness for training. 'Attitude' is the near-miss word swap.", "Training & Development"],
["What is a characteristic of a learning organization?", ["It has a full time training department.", "It provides tuition assistance to all employees.", "It is affiliated with one or more local universities.", "It is focused on knowledge development across the firm."], 3, "Learning org = knowledge acquisition, development, and dissemination firm-wide (Senge). Not a department or a perk.", "Training & Development"],
["What is a form of direct compensation?", ["Wages", "Training", "Benefits", "Services"], 0, "Direct = cash in hand: wages, salaries, bonuses, commissions. Benefits/training/services = indirect.", "Compensation & Benefits"],

["A manager urges an existing employee to accept a newly created position responsible for hiring new employees. What should the company use to determine the appropriate compensation level for this new position?", ["Job rotation", "Job transfer", "Job recruiting", "Job evaluation"], 3, "Relative worth of a job for pay purposes = job evaluation (internal equity).", "Compensation & Benefits"],
["Which form of compensation is an example of fixed pay?", ["Merit pay", "Yearly salary", "Profit sharing", "Sales incentive"], 1, "Fixed = base pay independent of performance, known in advance. Merit, profit sharing, incentives are variable.", "Compensation & Benefits"],
["A firm offers $40,000 per year plus health insurance. The employee counter-offers $52,000 per year with no insurance. Which pay structures are being discussed?", ["The firm is offering fixed compensation and the employee is requesting fixed compensation.", "The firm is offering fixed compensation, while the employee is requesting variable compensation.", "The firm is offering variable compensation, while the employee is requesting fixed compensation.", "The firm is offering variable compensation and the employee is requesting variable compensation."], 0, "Salary is fixed either way; insurance is indirect, not variable. Both sides are negotiating fixed compensation.", "Compensation & Benefits"],

["Which form of indirect compensation can be integrated into the organization's strategic planning?", ["Salary", "Benefits", "Bonuses", "Base wage"], 1, "Benefits are the only INDIRECT option listed; salary, bonus, base wage are all direct.", "Compensation & Benefits"],

["Diversity vs inclusion", "Diversity = the range of differences among people. Inclusion = each person feeling welcomed, respected, supported, valued.", "Legal & EEO"],
["Affirmative action vs Title VII enforcement", "AA = administrative sanctions (suspend/cancel federal contracts, no lawsuit needed). Title VII = EEOC litigation.", "Legal & EEO"],
["HR generalist vs specialist", "Generalist = broad support across all HR functions (small firms). Specialist = deep in one function like recruiting or comp (large firms).", "HR Roles"],
["Corporate culture", "The organization's value system: values, ethics, how people are treated. Dictates which HR practices are available.", "HR Roles"],
["5 basic management functions", "Planning, organizing, staffing, leading, controlling.", "HR Roles"],
["4 implicit HR objectives", "Improve productivity, improve quality of work life (QWL), ensure legal compliance, foster ethical behavior.", "HR Roles"],
["Consequentialist vs deontological ethics", "Consequentialist judges by outcomes/results. Deontological judges by conformity to rules and duties regardless of outcome.", "HR Roles"],
["SWOT quadrants", "Internal: strengths (play to), weaknesses (moderate). External: opportunities (exploit), threats (manage). Classify I/E FIRST.", "HR Roles"],
["HRP 4 phases", "1 Developing data, 2 Establishing objectives and policies, 3 HR programming (action plans), 4 Control and evaluation. 'Data Entry Pays Cash.'", "Planning"],
["HR demand vs supply", "Demand = number/types of employees needed for the mission. Supply = employees available now or in future to fill the jobs.", "Planning"],
["Judgmental demand forecasting", "Managerial estimates (MOST COMMON, top-down or bottom-up), Delphi technique, nominal grouping technique.", "Planning"],
["Statistical demand forecasting", "Simple regression (1 variable), multiple regression (2+), productivity ratios, HR ratios, time-series, stochastic analysis.", "Planning"],
["Delphi vs nominal grouping", "Delphi: experts revise forecasts through an intermediary until composite emerges. Nominal: silently write ideas, then present around the table.", "Planning"],
["Time-series analysis", "Projects future HR needs from PAST STAFFING LEVELS, isolating seasonal/cyclical variation and trends.", "Planning"],
["Replacement vs succession planning", "Replacement = charts naming incumbents and likely replacements, near-term. Succession = longer-term, developmental, flexible.", "Planning"],
["Attraction vs redundancy plan", "Attraction plan when demand exceeds supply (build workforce). Redundancy/reduction plan when supply exceeds demand: buyouts, outplacement counseling, retraining.", "Planning"],
["Internal recruiting sources/methods", "Sources: present employees, referrals, former employees/applicants. Methods: job postings, ERPs, HRIS skills inventories, promotion lists.", "Recruiting"],
["External recruiting sources/methods", "Sources: walk-ins, agencies, temp firms, schools, trade associations. Methods: employment sites, ads, career fairs, college recruiting.", "Recruiting"],
["Job posting", "Open invitation to ALL employees to apply for a vacancy, prominently announced with the job description.", "Recruiting"],
["Public vs private employment agency", "Public (state/federal) = free. Private = employer usually pays the fee. Temp agency = employer of record for part-time/temporary staff.", "Recruiting"],
["Job description vs job specification", "Description = task requirements (what gets done). Specification = worker requirements (KSAs, aptitudes, attitudes).", "Recruiting"],
["Promotion vs transfer vs rotation", "Promotion = up in skill/pay. Transfer = lateral, usually permanent. Rotation = lateral, temporary.", "Recruiting"],
["Realistic job preview (RJP)", "Giving applicants both positive AND negative job information. Reduces quitting after acceptance.", "Recruiting"],
["KSAs", "Knowledge (understanding), Skills (proficiencies from training/experience), Abilities (stable enduring qualities).", "Recruiting"],
["Reliability vs validity", "Reliability = consistency of a measure on repeated use. Validity = whether it measures what it claims (accuracy).", "Selection"],
["Test-retest vs internal consistency", "Test-retest: same measure at two points, coefficient of stability (+.70 acceptable). Internal consistency: split-half method, items measure the same thing.", "Selection"],
["Empirical (criterion) validity", "Statistical correlation between predictor and job-success criterion. Predictive. The ONLY validity type legally defensible in court.", "Selection"],
["Content validity", "Expert judgment that the instrument covers job KSAs. NO quantitative analysis. Classic example: typing test for typists.", "Selection"],
["Construct validity", "Instrument measures the psychological trait it claims (intelligence, personality). Example: SAT for academic success.", "Selection"],
["Correlation coefficient", "Ranges -1 to +1. Either extreme = perfect relationship, 0 = none.", "Selection"],
["Weighted application blank (WAB)", "Application where the most predictive information is weighted heavily (built by regression). Effective for screening large pools and predicting turnover.", "Selection"],
["Ultimate vs actual criterion", "Ultimate = theoretical ideal, never measurable. Actual = measurable indicators of success (appraisals, absences).", "Selection"],
["Reference vs background check", "Reference = verify job history/education with previous employers (facts, not opinions). Background = formal records: criminal, credit, driving. FCRA governs.", "Selection"],
["Training vs development", "Training = current job (fix skill deficiencies). Development = future jobs and career changes.", "Training"],
["ADDIE model", "Analyze (needs assessment), Design (blueprint), Develop (materials), Implement (pilot first), Evaluate. Continuous cycle.", "Training"],
["Needs assessment 3 levels", "Organizational = WHERE training is needed. Task = WHAT to teach. Person = WHO needs it (uses annual performance reviews).", "Training"],
["Kirkpatrick 4 levels", "1 Reaction (smiles sheets, most common), 2 Learning (tests), 3 Behavior (on-the-job change), 4 Results (ROI, hardest to measure). Hierarchy, bottom up.", "Training"],
["Transfer of training", "Using classroom learning back on the job: identical conditions, teach principles, contract plan (partner checks progress).", "Training"],
["Apprenticeship vs internship", "Apprenticeship = formal, extensive, paid real work under an experienced technician (skilled trades). Internship = less formal, fixed period.", "Training"],
["Coaching vs mentoring", "Coaching = by the SUPERVISOR. Mentoring = established employee (not the boss) guides a less experienced worker.", "Training"],
["Learning organization", "Dedicated to acquiring and disseminating knowledge ACROSS the firm, continually transforming itself (Senge). Fewer levels, more knowledge transfer.", "Training"],
["Orientation", "Introduces new hires to the work environment; reduces stress by clarifying what is EXPECTED of them.", "Training"],
["Job analysis and appraisal", "Job analysis is the FOUNDATION of performance appraisal. Rating items outside the job = unfair appraisal + legal exposure.", "Performance"],
["Administrative vs developmental PA uses", "Administrative: pay, promotion, layoffs, termination. Developmental: feedback, training needs, career planning. Conflict fix: two separate interviews.", "Performance"],
["Appraisal sources", "Supervisor, self, peer (best in self-managed teams), subordinate (shows managers their impact, needs anonymity), customer, computer monitoring (most objective, must disclose).", "Performance"],
["Straight ranking vs forced distribution", "Straight ranking = order everyone best to worst (small groups, single cuts). Forced distribution = preset proportions per category (bell curve).", "Performance"],
["Graphic rating scales", "Likert-style trait ratings. MOST WIDELY USED method. Prone to leniency, strictness, central tendency, halo.", "Performance"],
["Halo vs horn error", "Halo = one GOOD trait inflates everything (most common error). Horn = one BAD rating drags everything down.", "Performance"],
["Leniency vs strictness vs central tendency", "Leniency = everyone rated high (conflict avoidance, often intentional). Strictness = everyone low. Central tendency = everyone average (play it safe).", "Performance"],
["Primacy vs recency error", "Primacy = FIRST impression anchors the rating. Recency = LAST few weeks outweigh the whole period. Fix: document critical incidents all year.", "Performance"],
["Contrast vs spillover error", "Contrast = ANOTHER employee's evaluation contaminates this one. Spillover = the SAME employee's PAST ratings contaminate the current one.", "Performance"],
["OD 4 steps", "Assess the need for change, design the intervention, help management introduce it, evaluate effectiveness.", "OD & Change"],
["Three C's of vulnerability", "Complacency (status quo is fine), Conservatism (hoard resources, traditional ways), Conceit (hubris, no curiosity).", "OD & Change"],
["Change 2x2", "Dynamic (evolves) vs static (instant); incremental (small steps) vs quantum (severe). Plant downsizing = quantum+static. Merger = dynamic+quantum.", "OD & Change"],
["Org life cycle", "Incline (vision-driven) -> recline (stable, vision fading) -> decline (structure over innovation, needs a NEW vision).", "OD & Change"],
["Culture's 4 functions", "Identity, collective commitment, system stability, shapes behavior by making sense of the environment.", "OD & Change"],
["Direct vs indirect compensation", "Direct = cash in hand: wages, salary, bonuses, commissions. Indirect = NO cash in hand: benefits, training, services.", "Compensation"],
["Fixed vs variable pay", "Fixed = base pay independent of performance, known in advance (salary). Variable = re-earned each period (merit, profit sharing, incentives, commissions).", "Compensation"],
["Wage determination order", "Job evaluation -> job classes -> pay structure (wage surveys) -> individual wage determination.", "Compensation"],
["Internal vs external equity", "Internal equity comes from JOB EVALUATION (relative worth inside the firm). External equity comes from WAGE SURVEYS (market comparison).", "Compensation"],
["Exempt vs nonexempt", "Exempt = salaried, excluded from FLSA overtime (by job content, not title). Nonexempt = covered: minimum wage + 1.5x overtime past 40 hours.", "Compensation"],
["Piecework vs standard hour", "Piecework = pay per UNIT of output. Standard hour = standard expressed in TIME per unit.", "Compensation"],
["Gainsharing", "Productivity gains create the additional profits that everyone shares. Enhanced productivity -> additional earnings.", "Compensation"],
["Cash plan vs wage-dividend plan", "Cash plan = profit shares paid at regular intervals. Wage-dividend = employee percentage tied to stockholder dividends.", "Compensation"],
["Incentive vs merit pay", "Incentive = drives specific actions each period. Merit = annual raise based on last year's performance.", "Compensation"],
["Mandatory benefits", "Social Security (1935, OASDI, payroll tax), workers' compensation, unemployment insurance (joint state-federal), FMLA leave.", "Benefits"],
["Workers' compensation bargain", "Employee gets assured wage/medical coverage for on-the-job injury, waives the right to sue the employer. Premiums set by experience rating.", "Benefits"],
["Defined benefit vs defined contribution", "Defined benefit = employer promises a monthly amount at retirement (employer liability). Defined contribution = employer pays per period, employee owns it (401k).", "Benefits"],
["Traditional vs Roth 401(k)", "Traditional = pretax in, taxed at withdrawal. Roth (2006) = after-tax in, qualified distributions tax-free. 403(b) = public education + nonprofits.", "Benefits"],
["HMO vs PPO vs POS vs HSA", "HMO = in-network PCP directs all care (cheapest). PPO = preferred providers, most choice. POS = hybrid, PCP but out-of-network costs more. HSA = high-deductible plan + tax-favored savings.", "Benefits"],
["Flexible benefit approaches", "Core-plus-options (base + add-ons), modular (choose a prebuilt package), FSA (pretax set-aside, use it in the year or lose it).", "Benefits"]
];
const MATCHES=[
["Law -> what it does", [["Title VII (1964)", "Bans discrimination: race, color, religion, sex, national origin"], ["ADEA (1967)", "Protects workers age 40 and older"], ["FLSA (1938)", "Minimum wage and 1.5x overtime past 40 hours"], ["FMLA (1993)", "12 weeks unpaid job-protected leave"], ["ERISA (1974)", "Minimum standards for private pensions"], ["IRCA (1986)", "Form I-9, no knowingly hiring unauthorized workers"]]],
["Forecasting method -> category", [["Managerial estimates", "Judgmental, most common demand method"], ["Delphi technique", "Judgmental, experts revise via intermediary"], ["Multiple linear regression", "Statistical, two or more variables"], ["Time-series analysis", "Statistical, projects from past staffing levels"], ["Stochastic analysis", "Statistical, contract-likelihood based"], ["Succession planning", "Judgmental supply, long-term developmental"]]],
["Validity type -> meaning", [["Empirical validity", "Statistical predictor-criterion correlation, court-defensible"], ["Content validity", "Expert judgment of job KSAs, no statistics"], ["Construct validity", "Measures a psychological trait it claims"], ["Test-retest reliability", "Same measure twice, coefficient of stability"], ["Split-half method", "Tests internal consistency"]]],
["Kirkpatrick level -> evidence", [["Reaction", "Smiles sheets, anonymous questionnaires"], ["Learning", "Tests, role plays, work samples"], ["Behavior", "On-the-job change, observation checklists"], ["Results", "Productivity, turnover, ROI"]]],
["Rater error -> definition", [["Halo", "One good trait inflates all dimensions"], ["Horn", "One bad rating drags everything down"], ["Central tendency", "Everyone rated average to play it safe"], ["Recency", "Last few weeks outweigh the whole year"], ["Contrast", "Another employee's rating contaminates this one"], ["Spillover", "Same employee's past ratings contaminate today's"]]],
["Pay concept -> mechanism", [["Job evaluation", "Internal equity: relative worth of jobs"], ["Wage survey", "External equity: market comparison"], ["Piecework", "Pay per unit of output"], ["Gainsharing", "Productivity gains create shared earnings"], ["Merit pay", "Annual raise for last year's performance"], ["Stock options", "Buy later at a price set today"]]],
["Benefit plan -> feature", [["Defined benefit", "Employer promises a monthly retirement amount"], ["Defined contribution", "Employer pays per period, employee owns account"], ["Roth 401(k)", "After-tax in, tax-free qualified withdrawals"], ["HMO", "In-network PCP directs all care"], ["PPO", "Widest provider choice"], ["FSA", "Pretax set-aside, use it or lose it"]]],
["Recruiting term -> meaning", [["Job posting", "Open invitation to all employees to apply"], ["Employee referral", "Current employee recommends an applicant"], ["RJP", "Positive AND negative job information"], ["Job description", "Task requirements of the job"], ["Job specification", "KSAs required of the person"], ["Temp agency", "Employer of record for temporary staff"]]]
];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";$("#fcdef").classList.add("hide");$("#fcpos").textContent="0 / 0";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

const NOTES=`
<div class="warn"><b>These are the real questions.</b> Built from the 51-item pre-assessment (attempt 1). The OA mirrors the taxonomy. Run the MCQ tab on shuffle until you clear it twice, then hit the drill at <a href="https://niggerfaggot.club/hr-drill" style="color:inherit">/hr-drill</a>. Watch out: the PAM barely touched benefits, OD, and rater errors, but the OA can. The flashcards cover the full landscape.</div>
<h3>Laws (the #1 target)</h3>
<div class="mn"><b>FLSA 1938</b> = min wage + <span class="k">1.5x overtime past 40hr</span> ("floor under wages, ceiling over hours"). <b>EPA 1963</b> = equal pay, one year before Title VII. <b>Title VII 1964</b> = race/color/religion/sex/national origin, <span class="k">15+ employees</span>, created EEOC. <b>ADEA 1967</b> = <span class="k">40+</span>, 20+ employees. <b>Rehab Act 1973</b> = disability, FEDERAL gov. <b>ERISA 1974</b> = private pension standards (doesn't require a pension). <b>PDA 1978</b> = pregnancy amendment to Title VII. <b>IRCA 1986</b> = <span class="k">Form I-9</span>. <b>ADA 1990</b> = disability, PRIVATE sector, 15+, reasonable accommodation. <b>CRA 1991</b> = adds damages. <b>FMLA 1993</b> = <span class="k">12 weeks unpaid</span>, 50+ employees within 75 miles. <b>GINA 2008</b> = genetic info. <b>Ledbetter 2009</b> = statute of limitations. <b>ACA 2010</b> = employer mandate at 50+.</div>
<h3>Affirmative action + at-will</h3>
<div class="mn">EO 8802 (1941 FDR, defense) &rarr; <b>EO 10925</b> (1961 JFK, <span class="k">coined "affirmative action"</span>, federally funded project managers eliminate bias) &rarr; EO 11246 (1965 LBJ, federal contractors) &rarr; Philadelphia Plan (1969 Nixon, goals + timetables). AA enforcement = <span class="k">administrative</span> (cancel contracts); Title VII = litigation. Quotas never permitted. At-will everywhere except <span class="k">Montana</span>; exceptions = public policy, <span class="k">implied contract (handbooks!)</span>, good faith.</div>
<h3>Planning</h3>
<div class="mn">HRP 4 phases: <b>Developing data &rarr; Establishing objectives &rarr; Programming &rarr; Control/evaluation</b> ("Data Entry Pays Cash"). Programming = the phase that ensures future supply. Judgmental = managerial estimates (most common), Delphi, nominal group, replacement, succession. Statistical = regressions, ratios, <span class="k">time-series (past staffing levels)</span>, stochastic. Demand &gt; supply = attraction plan; supply &gt; demand = <span class="k">redundancy plan</span> (buyouts, outplacement).</div>
<h3>Recruiting + selection</h3>
<div class="mn">Job description = tasks; job specification = KSAs. Posting = open invite to all employees. Colleges = current-knowledge, no-experience hires; internships = develop before permanent offers. Oversized pool = <span class="k">selection cost goes up</span>. Reliability = consistency; validity = accuracy. <b>Content</b> = expert judgment, no stats; <b>empirical</b> = correlation, <span class="k">only court-defensible type</span>; <b>construct</b> = psychological trait. Poor reliability &rarr; bad-fit hires. WAB = weighted application blank, best structured info-gatherer.</div>
<h3>Training + performance</h3>
<div class="mn"><b>ADDIE</b>: Analyze, Design, Develop, Implement (pilot), Evaluate. Needs levels: org = WHERE, task = WHAT, <span class="k">person = WHO (annual reviews)</span>. Kirkpatrick: Reaction &rarr; Learning &rarr; Behavior &rarr; Results. Training = current job; development = future. Orientation reduces stress by clarifying <span class="k">expectations</span>. Job analysis is the FOUNDATION of appraisal (rate only what's in the job). Subordinate appraisal = shows managers their impact. Small firm, one layoff = <span class="k">straight ranking by supervisor</span>. Rater errors: halo/horn, leniency/strictness/central tendency, primacy/recency, <span class="k">contrast (other person) vs spillover (same person's past)</span>.</div>
<h3>Comp + benefits</h3>
<div class="mn">Direct = cash (wages, salary, bonus, commission); indirect = <span class="k">no cash in hand</span> (benefits, training, services). Fixed = salary; variable = merit, profit share, incentives. Job evaluation = internal equity + sets pay for new positions; wage survey = external equity. <span class="k">Gainsharing = productivity creates the extra earnings</span>. Mandatory: Social Security, workers' comp (compensation bargain), unemployment, FMLA. Defined benefit = employer promise/liability; defined contribution = 401k, employee owns. Traditional = pretax; Roth = after-tax, tax-free out. HMO cheapest/locked; PPO choice; POS hybrid; HSA = high deductible + savings.</div>
`;
$("#notes").innerHTML=NOTES;

renderChips();buildFC();buildMC();buildMA();
</script></body></html>
