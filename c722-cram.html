<script>
const MCQS=[
["A firm initiates a business management project to deliver an efficient, tailored service. Which aspect of project management applies?",["Independent operations","Interdependent tasks","Regulatory concept","External environment"],1,"A project is defined by interrelated, interdependent tasks working toward one goal, not independent operations.","Concepts"],
["Which group is one of the five process groups?",["Risk process group","Closing process group","Communication process group","Quality process group"],1,"The five process groups: Initiating, Planning, Executing, Monitoring & Controlling, Closing. Risk/Communication/Quality are knowledge areas, not process groups.","Concepts"],
["What does PRINCE2 stand for?",["PRoject INsights for CompEtitiveness","PRojects IN a Competitive Environment","PRoject INsights and CompEtencies","PRojects IN a Controlled Environment"],3,"PRINCE2 = PRojects IN a Controlled Environment. The decoys swap 'Controlled' for 'Competitive'.","Concepts"],
["Which PMBOK process group is the delivery part where the main activity happens?",["Planning","Executing","Controlling","Closing"],1,"Executing is where the plan is carried out and the bulk of the work happens.","Concepts"],
["During which phase are blueprints approved, costs estimated, prototypes built, activities identified, and quality defined?",["Defining","Planning","Executing","Closing"],1,"All that defining-of-how is Planning. Executing is doing the work; this is still preparing to do it.","Concepts"],
["During which life cycle phase is the vast majority of the actual deliverable work completed?",["Defining","Planning","Executing","Closing"],2,"Executing is where the real work to produce deliverables happens.","Concepts"],
["What is the term for an intermediate outcome such as a signed contract or a construction permit?",["Deadline","Procurement","Statement of work","Deliverable"],3,"A deliverable is any tangible/verifiable outcome, including intermediate ones like a permit or signed contract.","Concepts"],
["Which activity is part of the planning process?",["Finalizing the project budget","Reviewing the lessons learned","Documenting requested scope changes","Reconciling the vendor accounts"],0,"Finalizing the budget is planning. Lessons learned and vendor reconciliation are closing.","Concepts"],
["Which activity is part of the planning process?",["Training and coaching team members","Documenting requested scope changes","Finalizing the project schedule","Returning excess materials and supplies"],2,"Finalizing the schedule is planning. Training is executing; returning materials is closing.","Concepts"],
["Which activity is accomplished during the closing process?",["Reconciling the vendor accounts","Assigning team members to new projects","Verifying deliverables meet scope","Coaching team members"],0,"Reconciling vendor accounts is closing. Verifying scope is monitoring/controlling; coaching is executing.","Concepts"],
["Which activity is performed during the creating part of the initiating process?",["Completing the project documentation","Recognizing and rewarding performance","Assessing project quality","Drafting the project charter"],3,"Initiating produces the project charter.","Concepts"],
["Which activity is part of the executing process?",["Receiving sign-off from the customer","Creating the work breakdown structure","Creating the network diagram","Implementing the project plan"],3,"Executing = implementing the plan. Creating the WBS and network diagram are planning.","Concepts"],
["Which process determines who the project stakeholders are?",["The planning process","The closing process","The initiating process","The monitoring and controlling process"],2,"Identifying stakeholders happens in initiating.","Concepts"],
["Which advantage does a functional (departmentalized) structure provide for a firm with multiple projects?",["Lines of authority are clear","The project customer is the only focus","Efficient collaboration between departments","Each project is managed holistically"],0,"Functional orgs have clear vertical lines of authority. The trade-off is weak cross-department coordination and a weak PM.","Org & PMO"],
["A PMO supports projects in a projectized structure. Which is an implied benefit?",["Team members retain functional responsibilities","Team members become full-time employees","Team members gain access to the newest technologies","Team members gain access to historical data from other projects"],3,"A PMO centralizes lessons and historical data across projects.","Org & PMO"],
["Regardless of structure, an organization uses a PMO. Which benefit results?",["Coordinate resource usage by monitoring shared resources","Define corporate strategy in the project charter","Receive a 10% managerial reserve fund","Eliminate costs of following corporate procedures"],0,"A PMO coordinates and monitors shared resources across projects.","Org & PMO"],
["Which deliverable from a WBS is NOT specific enough to measure at project closure?",["User training","User documentation manuals","Payment processing hardware","Hardware setup"],0,"User training is vague; the others are concrete and verifiable. Deliverables must be measurable at closure.","WBS & Scope"],
["A WBS lists Project started, Feasibility, Design, Development, Manufacturing, Distribution, Project completed. Which approach structured it?",["List of deliverables","Sequence of project phases","Enumeration of functional departments","List of project stakeholders"],1,"Those are phases in order, so the WBS is organized by sequence of project phases.","WBS & Scope"],
["Besides the WBS, which two documents complete the scope baseline?",["Project charter and statement of work","Project contract and business case","WBS dictionary and project scope statement","Activity list and scope management plan"],2,"Scope baseline = WBS + WBS dictionary + project scope statement.","WBS & Scope"],
["A team implemented a change without formal change control, expanding the work. What happened to the scope baseline?",["Scope updates caused an unaffordable variance","Scope creep caused a scope variance","Scope upgrade caused a scope variance","Scope risks caused a smaller variance"],1,"Uncontrolled added scope = scope creep, which produces a scope variance from the baseline.","WBS & Scope"],
["Which two tools document the approvals required for each work package? (one shown)",["Project charter","Project statement of work (SOW)","Request for proposal (RFP)","Organizational breakdown structure (OBS)"],1,"Approval requirements per work package are documented by the project SOW and the requirements traceability matrix (RTM).","WBS & Scope"],
["A high-level WBS has 1.0 Landscaping with 1.1 to 1.5. Which activity logically adds more detail?",["2.0 Building facade and foyer","1.6 Online reservation system","1.5.1 Lay sod","1.1.1 Plant trees and bushes"],2,"More detail = decompose an existing item one level down. 1.5.1 Lay sod sits under 1.5 Planting. (1.1.1 plant trees would not sit under Plans.)","WBS & Scope"],
["Which output is needed before using the bottom-up estimating technique?",["Quality management plan","Teaming agreement","Work breakdown structure","Stakeholder matrix"],2,"Bottom-up sums the work packages, so you need the WBS first.","WBS & Scope"],
["In a software WBS, which component is the starting point for building the schedule?",["Test to specification","Develop training documents","Determine database structure","Determine data format"],3,"The first/lowest-level work package (Determine data format, 1.1) is where scheduling starts.","WBS & Scope"],
["A cost-plus-incentive contract offers an early-completion incentive. Which triple-constraint baseline stays unchanged?",["Scope","Time","Cost","Price"],0,"The incentive pressures time and cost; scope is unchanged. (Price is not a triple-constraint element.)","Triple Constraint"],
["Time is critical and the team must work as fast as possible. Which constraint is adjusted?",["Time","Cost","Price","Incentives"],1,"To accelerate, you add resources, which increases cost. Scope is fixed, time is the goal, so cost flexes.","Triple Constraint"],
["The objective is lowest possible cost with all scope required. Which constraint is adjusted?",["Time","Cost","Incentives","Penalties"],0,"To minimize cost with fixed scope, you extend time.","Triple Constraint"],
["A firm develops a new business model to enhance competitiveness. What is the strategic business initiative?",["Timely payment of liabilities","Liaison with regulatory agencies","Improvement in product design","Environmental scanning"],2,"Improving the product/design is the strategic initiative that enhances competitiveness.","Selection"],
["A firm starts an initiative to deliver tailored service. Which stakeholder triggered it?",["Director of operations","Production supervisor","Project sponsor","Financial controller"],2,"The project sponsor initiates and champions strategic business initiatives.","Selection"],
["A leader adds an ATM to all stores only because competing stores have them. Which non-numeric model?",["Operating necessity","Competitive necessity","Sacred cow","Checklists"],1,"Doing it because competitors do = competitive necessity.","Selection"],
["A project is funded with surplus money, chosen with no feasibility evaluation because leadership wants it. Which non-numeric model?",["Operating necessity","Competitive necessity","Sacred cow","Weighted factor"],2,"Selected by leadership directive without analysis = sacred cow.","Selection"],
["What is a disadvantage of the frequency-ranked checklist selection approach?",["Scoring models have not been integrated","Biases have not been eliminated","Numerical values have not been itemized","Weighted values have not been considered"],1,"A checklist still carries human bias; it has not been eliminated.","Selection"],
["Which tool ensures the team addresses the items important to defining project scope?",["Checklist","Checksheet","Fishbone diagram","Network diagram"],0,"A checklist enumerates the important scope items to address. (A check sheet tallies defects.)","Selection"],
["What is the time value of money?",["The value of what you give up choosing one project","A dollar today is worth a dollar, but a dollar in a year is worth less","The discount when present value of inflows equals the investment","The time at which total cash received meets or exceeds costs"],1,"Time value of money = money now is worth more than the same money later.","Selection"],
["What is internal rate of return (IRR)?",["The value of what you give up choosing one project","A dollar today is worth more than a dollar in a year","The discount rate where present value of inflows equals the original investment","The time at which total cash received meets or exceeds costs"],2,"IRR is the discount rate where NPV = 0 (present value of inflows equals the investment).","Selection"],
["A PMIS resource histogram helps planning by showing what?",["Opportunities to work overtime to recover lead times","Opportunities to compress durations for non-effort-driven tasks","Opportunities to increase slack allowances","Opportunities to level resource usage patterns"],3,"A resource histogram reveals over/under-allocation, so you can level resource usage.","Estimating"],
["A project manager builds a calendarized budget of anticipated tasks. What is its key component called?",["Contingency reserves","Management reserves","Budget estimates","Activity estimates"],3,"The list of tasks with cost/time in a calendarized budget = activity estimates.","Estimating"],
["After identifying activities in a calendarized budget, what is the next planning action?",["Estimating dates of spending","Completing top-down estimates","Completing bottom-up estimates","Creating project schedules"],3,"Once activities, costs, durations, and sequencing exist, you create the project schedule.","Estimating"],
["A team estimates plumbing work using only the in-house plumbing expert. Which technique?",["Parametric","Top-down","One-point","Three-point"],2,"A single expert estimate = one-point estimating.","Estimating"],
["A team estimates a task where opinions vary widely and a finite value is needed. Which technique?",["Parametric","Top-down","One-point","Three-point"],3,"Range of opinions needing a balanced single number = three-point estimating.","Estimating"],
["Three-point estimate: experienced 15 min, two new techs 25 and 20 min. How many minutes?",["15","20","25","40"],1,"Three-point = (optimistic + most likely + pessimistic) / 3 = (15 + 20 + 25) / 3 = 20.","Estimating"],
["Three-point estimate: experienced 10 min, two new techs 28 and 31 min. How many minutes?",["15","23","30","35"],1,"(10 + 28 + 31) / 3 = 69 / 3 = 23. C722 three-point is the simple average, not PERT.","Estimating"],
["A phase-gate review finds the design will be obsolete before launch. What should the PM initiate?",["Crash the schedule for more resources","Fast-track by altering predecessor relationships","Terminate the project and release resources","Look for ways to make the design less costly"],2,"If the product is doomed, the right call is to terminate and free the resources.","Scheduling"],
["The sponsor will not extend the deadline or budget but will drop an interface. Which schedule compression technique?",["Determining the critical path","Resource leveling","Scope reduction","Fast-tracking"],2,"Eliminating deliverable scope to hit the date = scope reduction.","Scheduling"],
["The PM decides to crash the schedule to meet the deadline. What is the risk?",["Reduction in rework","Use of fewer resources","Reduced quality of deliverables","Less overtime"],2,"WGU lists reduced quality of deliverables as the risk of crashing.","Scheduling"],
["A risk of daily-fluctuating bolt prices is locked by a fixed-price supplier contract. Which risk response?",["Risk Mitigation","Risk Acceptance","Risk Transference","Risk Avoidance"],3,"Locking a fixed price removes the price-fluctuation risk entirely = avoidance (per WGU).","Risk & Change"],
["To avoid the risk of delays, what should a team familiar with the old tool do?",["Outsource the development","Conduct weekly status meetings","Continue using the old software tool","Train the staff in new software"],2,"Avoidance = do not take on the risk; keep the familiar tool.","Risk & Change"],
["To mitigate the risk of losing technology ground, what should the firm do?",["Outsource technical development","Discontinue advanced technology products","Hire technical staff from the competition","Pay for engineers to attend courses"],2,"Hiring scarce expertise away from competitors reduces (mitigates) the capability risk.","Risk & Change"],
["What are the three categories of risk in the project risk register?",["External, technical, or organizational","Internal, material, or personnel","Portfolio, program, or project","Certain, uncertain, or probable"],0,"Risk register categories: external, technical, organizational.","Risk & Change"],
["A team adjusts baselines to include five omitted scope modules. Which change management phase?",["Preparing for the change","Managing the change","Reinforcing the change","Upgrading the change"],0,"Setting up and adjusting baselines for the change = preparing for the change.","Risk & Change"],
["A rewards and recognition program is created to encourage a change. Which change management phase?",["Preparing for the change","Managing the change","Reinforcing the change","Upgrading the change"],2,"Rewards and recognition that sustain a change = reinforcing the change.","Risk & Change"],
["A late-penalty fixed-price job gets a change request that delays the critical path. Which process maintains the baseline?",["Using a change management system to influence performance","Absorbing the change into the time and cost baselines","Focusing on the original scope","Using the risk management system to process change requests"],0,"You protect the baseline by routing the request through a formal change management system.","Risk & Change"],
["What is the purpose of the cost performance index (CPI)?",["To measure a project's labor costs","To measure a project's cost effectiveness","To measure a project's cost efficiency","To measure a project's actual costs"],2,"CPI measures cost efficiency (work earned per dollar spent).","Monitor & Close"],
["What is the purpose of the schedule performance index (SPI)?",["To determine a project's budgeted schedule","The ratio between planned value and actual cost","To determine a project's time efficiency","The ratio between cost variance and schedule variance"],2,"SPI measures time (schedule) efficiency.","Monitor & Close"],
["What is the purpose of cost variance (CV) analysis?",["Whether a project meets efficiency expectations","Whether a project meets schedule expectations","Whether a project meets budget expectations","Whether a project meets price and time expectations"],2,"CV tells you if you are meeting budget expectations.","Monitor & Close"],
["What is the closing task where all activities are reviewed for what went right and wrong?",["Closeout review","Lessons learned review","Client deliverables review","Project manager review"],1,"The retrospective at closing is the lessons learned review.","Monitor & Close"],
["What is the military name for the lessons learned review?",["Rules of engagement","Activity report","Protocol assessment","After action report"],3,"The military term is the after action report (AAR).","Monitor & Close"],
["The customer validates scope for the second of three segments. Which closure practice?",["Iteration completion","Phase completion","Deliverable completion","Stage completion"],3,"Validating a segment/stage of the project = stage completion.","Monitor & Close"],
["The customer validates scope complete, invoices paid, and benefits realized. Which closure practice?",["Iteration completion","Phase completion","Deliverable completion","Stage completion"],2,"Full scope plus paid invoices plus realized benefits = deliverable completion (per WGU terminology).","Monitor & Close"]
];
const FLASHCARDS=[
["Project","A set of interrelated, interdependent tasks working toward a single goal. Temporary and unique, unlike ongoing operations.","Concepts"],
["Five process groups","Initiating, Planning, Executing, Monitoring & Controlling, Closing. (Risk, Quality, Communication are knowledge areas, not process groups.)","Concepts"],
["Executing","The delivery part of PM where the main activity happens and the vast majority of deliverable work is completed.","Concepts"],
["Iterative process groups","Planning and Executing are the two iterative process groups (you loop back through them).","Concepts"],
["PRINCE2","PRojects IN a Controlled Environment. A structured project management method.","Concepts"],
["Initiating activities","Identify stakeholders and draft the project charter.","Concepts"],
["Planning activities","Approve blueprints, estimate costs, build prototypes, identify activities, define quality, finalize the budget and the schedule.","Concepts"],
["Executing activity","Implement the project plan.","Concepts"],
["Closing activities","Reconcile vendor accounts, capture lessons learned, release resources.","Concepts"],
["Deliverable","Any verifiable outcome, including an intermediate one like a signed contract or a permit.","Concepts"],
["Functional org","Departmentalized by specialty. Strength: clear lines of authority. Weakness: weak PM, poor cross-department coordination. Examples: U.S. Department of State, U.S. Department of Energy.","Org & PMO"],
["PMO benefit (projectized)","Team members gain access to historical data and lessons from other projects.","Org & PMO"],
["PMO benefit (any structure)","Coordinates resource usage by monitoring the status of shared resources across projects.","Org & PMO"],
["Scope baseline","Three parts: the WBS, the WBS dictionary, and the project scope statement.","WBS & Scope"],
["WBS structure approaches","A WBS can be organized by a sequence of project phases or by a list of deliverables.","WBS & Scope"],
["Bottom-up estimating prerequisite","You need the WBS first, because bottom-up sums the work packages.","WBS & Scope"],
["Adding WBS detail","Decompose an existing item one level down (e.g., 1.5.1 under 1.5), do not add a new top-level item.","WBS & Scope"],
["Measurable deliverables","Deliverables must be specific enough to verify at closure. Vague ones like User training cannot be measured.","WBS & Scope"],
["Work-package approval tools","The project statement of work (SOW) and the requirements traceability matrix (RTM) document required approvals.","WBS & Scope"],
["Scope creep","Added scope without formal change control, producing a scope variance from the baseline.","WBS & Scope"],
["Triple constraint","Scope, Time, Cost. (Price is not one of them.)","Triple Constraint"],
["Go faster -> flex cost","To work as fast as possible with fixed scope, adjust cost (add resources).","Triple Constraint"],
["Lowest cost -> flex time","To work at the lowest cost with fixed scope, adjust time (extend it).","Triple Constraint"],
["Operating necessity","Select a project because the operation cannot continue without it (e.g., safety, survival).","Selection"],
["Competitive necessity","Select a project because competitors are doing it and you must keep up.","Selection"],
["Sacred cow","A project chosen by leadership directive with no feasibility or viability evaluation.","Selection"],
["Checklist (selection)","A list of evaluation questions/criteria. Benefit: operational and strategic impact are built in. Disadvantage: biases are not eliminated.","Selection"],
["Time value of money","A dollar today is worth more than a dollar in a year.","Selection"],
["Net present value (NPV)","Compares whether revenue in the future is greater than costs today, using discounting.","Selection"],
["Internal rate of return (IRR)","The discount rate where the present value of inflows equals the original investment (NPV = 0).","Selection"],
["Opportunity cost","The value of the alternative you give up when choosing one option over another.","Selection"],
["Project sponsor","The stakeholder who initiates and champions a strategic business initiative.","Selection"],
["One-point estimate","A single estimate from one expert.","Estimating"],
["Three-point estimate","(Optimistic + Most likely + Pessimistic) / 3, a simple average. Used when opinions vary. NOT the PERT weighted formula on C722.","Estimating"],
["Activity estimates","The key component of a calendarized budget (the tasks with cost and time).","Estimating"],
["After activities, build schedule","Once activities have cost, duration, and sequence, the next step is creating the project schedule.","Estimating"],
["Resource histogram","Shows resource over/under-allocation so you can level resource usage.","Estimating"],
["Schedule compression","Fast-tracking (run tasks in parallel), crashing (add resources, costs more), scope reduction (drop scope).","Scheduling"],
["Crashing risk (WGU)","Reduced quality of deliverables.","Scheduling"],
["Obsolete design at phase gate","Terminate the project and release its resources.","Scheduling"],
["Critical path","The longest-duration path through the network; it sets the shortest possible project duration.","Scheduling"],
["Risk responses","Avoid (eliminate it), Mitigate (reduce it), Transfer (shift it), Accept (live with it).","Risk & Change"],
["Risk avoidance","Lock a fixed price or keep a familiar tool to remove the risk entirely.","Risk & Change"],
["Risk register categories","External, Technical, Organizational.","Risk & Change"],
["Change management phases","Preparing for the change, Managing the change, Reinforcing the change.","Risk & Change"],
["Preparing for the change","Set up and adjust baselines for a change (e.g., adding omitted scope).","Risk & Change"],
["Reinforcing the change","Rewards and recognition that sustain the change.","Risk & Change"],
["Protect the baseline","Route change requests through a formal change management system to influence performance.","Risk & Change"],
["CPI","Cost performance index. Measures cost efficiency. Formula EV / AC.","Monitor & Close"],
["SPI","Schedule performance index. Measures time (schedule) efficiency. Formula EV / PV.","Monitor & Close"],
["CV","Cost variance. Tells you if you are meeting budget expectations. Formula EV - AC.","Monitor & Close"],
["Lessons learned review","Closing retrospective on what went right and wrong. Military name: after action report (AAR).","Monitor & Close"],
["Stage completion","The customer validates one segment/stage of the project.","Monitor & Close"],
["Deliverable completion","Full scope validated, invoices paid, and benefits realized (WGU terminology).","Monitor & Close"]
];
const FORMULAS=[
["Estimating (the only real calculation on this OA)",
 [["One-point","a single expert estimate","Used when one knowledgeable person provides the number."],
  ["Three-point","(O + M + P) / 3","Simple average of optimistic, most likely, pessimistic. This is the C722 version, NOT PERT (O + 4M + P)/6."],
  ["When to use three-point","opinions vary / a finite value is needed","Range of estimates that must be reconciled into one number."]],
 {"scenario":"An experienced tech upgrades in 15 minutes. Two new techs take 25 and 20 minutes. Using three-point estimating, how long per upgrade?",
  "steps":["Identify the three points: optimistic (fastest) = 15, most likely = 20, pessimistic (slowest) = 25.","Average them: (15 + 20 + 25) / 3 = 60 / 3 = 20 minutes."],
  "answer":"20 minutes. Just average the three values; do not weight the middle."},
 [["Three-point with 10, 28, and 31 minutes?","(10 + 28 + 31) / 3 = 69 / 3 = 23 minutes."],
  ["A single expert gives one duration estimate. Which technique is that?","One-point estimating."],
  ["Three-point with 6, 9, and 12 days?","(6 + 9 + 12) / 3 = 27 / 3 = 9 days."]]],
["EVM (know what each one MEASURES, no math on this OA)",
 [["CPI = EV / AC","measures COST EFFICIENCY","Above 1 = under budget, below 1 = over."],
  ["SPI = EV / PV","measures TIME (schedule) EFFICIENCY","Above 1 = ahead, below 1 = behind."],
  ["CV = EV - AC","tells you BUDGET performance","Positive = under budget, negative = over."],
  ["The OA question","'What is the purpose of X?'","CPI -> cost efficiency. SPI -> time efficiency. CV -> budget expectations."]],
 {"scenario":"The OA does not ask you to compute EVM on C722. It asks what each index is FOR. Lock the one-word answers.",
  "steps":["CPI is about COST efficiency.","SPI is about TIME efficiency.","CV is about the BUDGET."],
  "answer":"CPI = cost efficiency, SPI = time efficiency, CV = budget. That is all you need."},
 [["What is the purpose of CPI?","To measure cost efficiency."],
  ["What is the purpose of SPI?","To measure time (schedule) efficiency."],
  ["What is the purpose of CV analysis?","To determine if the project is meeting budget expectations."]]],
["Selection concepts (definitional, not number-crunching)",
 [["Time value of money","money now is worth more than money later","A dollar today beats a dollar in a year."],
  ["NPV","is future revenue worth more than today's costs?","Uses discounting of future cash flows."],
  ["IRR","the rate where PV of inflows = the investment","The discount rate at which NPV = 0."],
  ["Opportunity cost","the value of the alternative you give up","What you forfeit by choosing one project over another."],
  ["Payback period","time until cash received covers the cost","Shorter is better; ignores time value of money."]],
 {"scenario":"C722 tests these as definitions, not calculations. Match the phrase to the concept.",
  "steps":["'Worth today vs in the future' -> time value of money.","'Revenue tomorrow vs costs today' -> NPV.","'Future cash flows using time and interest' -> IRR.","'Alternative use of money' -> opportunity cost."],
  "answer":"Recognize the phrasing; you will not be asked to compute these on this OA."},
 [["Which concept: the value of what you give up choosing one project over another?","Opportunity cost."],
  ["Which concept: a dollar today is worth more than a dollar in a year?","Time value of money."],
  ["Which concept: the discount rate where present value of inflows equals the investment?","Internal rate of return (IRR)."]]]
];
const SEQUENCES=[
["Project activities: order from first to last",["Collecting customer requirements","Developing the work breakdown structure","Working to produce project deliverables","Customers evaluating the project outcomes","Capturing lessons learned"],"Requirements (initiating) -> WBS (planning) -> produce deliverables (executing) -> customer evaluation -> lessons learned (closing)."],
["Process groups in order",["Initiating","Planning","Executing","Monitoring & Controlling","Closing"],"The five PMBOK process groups. Monitoring & Controlling runs across the others but is sequenced here after executing."],
["Project phases (generic life cycle)",["Defining / Initiating","Planning","Executing","Closing"],"Define the project, plan how, execute the work, close it out. Most deliverable work happens in executing."]
];
const MATCHES=[
["Financial concept -> purpose",[["Time value of money","Money's worth today vs in the future"],["Net present value","Whether revenue tomorrow exceeds costs today"],["Internal rate of return","Future cash flows using time and interest rate"],["Opportunity cost","The alternative use of money you give up"]]],
["Non-numeric selection model -> trigger",[["Operating necessity","Must do it to keep operating"],["Competitive necessity","Competitors are doing it"],["Sacred cow","Leadership wants it, no evaluation"],["Checklist","A ranked list of evaluation questions"]]],
["Risk response -> action",[["Avoid","Remove the risk (fixed price, keep familiar tool)"],["Mitigate","Reduce probability or impact (hire experts)"],["Transfer","Shift the impact to a third party"],["Accept","Take no action and absorb it"]]],
["Change management phase -> example",[["Preparing for the change","Adjust baselines for omitted scope"],["Managing the change","Route a request through change control"],["Reinforcing the change","Rewards and recognition program"],["Closing / lessons learned","After action report"]]],
["Index/variance -> what it measures",[["CPI","Cost efficiency"],["SPI","Time (schedule) efficiency"],["CV","Budget expectations"],["Critical path","The longest path / shortest duration"]]]
];
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let topic="All";
const TOPICS=["All",...new Set(MCQS.map(m=>m[4]))];
function renderChips(){$("#chips").innerHTML=TOPICS.map(t=>`<button class="chip${t==topic?' on':''}" data-c="${t}">${t}</button>`).join("")}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;topic=b.dataset.c;renderChips();buildFC();buildMC()});
$$(".tab").forEach(t=>t.addEventListener("click",()=>{$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");$$(".panel").forEach(p=>p.classList.add("hide"));$("#"+t.dataset.t).classList.remove("hide")}));

let fcArr=[],fcI=0,fcFlip=false;
function fcFilter(){return topic=="All"?FLASHCARDS:FLASHCARDS.filter(c=>c[2]==topic)}
function buildFC(){fcArr=fcFilter();fcI=0;fcFlip=false;showFC()}
function showFC(){if(!fcArr.length){$("#fcterm").textContent="No cards";$("#fcdef").classList.add("hide");$("#fcpos").textContent="0 / 0";return}const c=fcArr[fcI];$("#fctag").textContent=c[2];$("#fcterm").textContent=c[0];$("#fcdef").textContent=c[1];$("#fcterm").classList.toggle("hide",fcFlip);$("#fcdef").classList.toggle("hide",!fcFlip);$("#fchint").textContent=fcFlip?"tap to flip back":"tap to flip";$("#fcpos").textContent=`${fcI+1} / ${fcArr.length}`}
$("#fccard").onclick=()=>{fcFlip=!fcFlip;showFC()};
$("#fcnext").onclick=()=>{fcI=(fcI+1)%fcArr.length;fcFlip=false;showFC()};
$("#fcprev").onclick=()=>{fcI=(fcI-1+fcArr.length)%fcArr.length;fcFlip=false;showFC()};
$("#fcshuf").onclick=()=>{fcArr=shuf(fcArr);fcI=0;fcFlip=false;showFC()};

function mcFilter(){return topic=="All"?MCQS.map((m,i)=>[m,i]):MCQS.map((m,i)=>[m,i]).filter(x=>x[0][4]==topic)}
let mcAns={};
function buildMC(){const list=mcFilter();$("#mclist").innerHTML=list.map(([m,gi])=>{
  const opts=m[1].map((o,oi)=>`<button class="opt" data-q="${gi}" data-o="${oi}">${o}</button>`).join("");
  return `<div class="q" id="q${gi}"><div class="qn">Q${gi+1} · ${m[4]}</div><div class="qt">${m[0]}</div>${opts}<div class="exp" id="e${gi}">${m[3]}</div></div>`}).join("");
  updateScore()}
$("#mclist").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(mcAns[q]!=null)return;mcAns[q]=o;const m=MCQS[q],cor=m[2];
  $$(`#q${q} .opt`).forEach(btn=>{const bo=+btn.dataset.o;if(bo==cor)btn.classList.add("correct");if(bo==o&&o!=cor)btn.classList.add("wrong");btn.style.cursor="default"});
  $("#e"+q).classList.add("show");updateScore()});
function updateScore(){const list=mcFilter().map(x=>x[1]);let done=0,right=0;list.forEach(q=>{if(mcAns[q]!=null){done++;if(mcAns[q]==MCQS[q][2])right++}});$("#mcscore").textContent=`${right} / ${done}  (${list.length} total)`}
$("#mcshuf").onclick=()=>{const sh=shuf(MCQS.map((m,i)=>i));const list=$("#mclist");const map={};$$("#mclist .q").forEach(el=>map[el.id]=el);list.innerHTML="";sh.forEach(i=>{if(topic=="All"||MCQS[i][4]==topic)list.appendChild(map["q"+i])})};
$("#mcreset").onclick=()=>{mcAns={};buildMC()};

function buildFM(){$("#fmlist").innerHTML=FORMULAS.map((g,gi)=>{
  const rows=g[1].map(f=>`<div class="frow"><div class="fl">${f[0]}</div><div class="fr2"><span class="eq">${f[1]}</span><span class="im">${f[2]}</span></div></div>`).join("");
  const ex=g[2];const exsteps=ex.steps.map(s=>`<div>• ${s}</div>`).join("");
  const prac=g[3].map((p,pi)=>`<div class="pracq"><div>${p[0]}</div><button class="btn rb" data-fg="${gi}" data-fp="${pi}">show answer</button><div class="pa" id="pa${gi}_${pi}">${p[1]}</div></div>`).join("");
  return `<div class="fgroup"><h3>${g[0]}</h3>${rows}
    <div class="work"><span class="wl">Worked example</span><div style="margin:5px 0">${ex.scenario}</div>${exsteps}<span class="ans">${ex.answer}</span></div>
    <div class="prac"><div style="color:var(--dim);font-size:11px;margin:10px 0 6px">Practice (tap to reveal):</div>${prac}</div></div>`}).join("")}
$("#fmlist").addEventListener("click",e=>{const b=e.target.closest("[data-fg]");if(!b)return;const el=$(`#pa${b.dataset.fg}_${b.dataset.fp}`);el.classList.toggle("show");b.textContent=el.classList.contains("show")?"hide answer":"show answer"});

function buildSQ(){$("#sqlist").innerHTML=SEQUENCES.map((s,si)=>{
  const items=shuf(s[1].map((t,i)=>[t,i]));
  const rows=items.map(([t,i])=>`<div class="slot" draggable="true" data-correct="${i}"><span class="num"></span><span>${t}</span></div>`).join("");
  return `<div class="q"><div class="qn">${s[0]}</div><div class="seq" id="seq${si}">${rows}</div><div class="bar" style="margin-top:8px"><button class="btn" data-check="${si}">check order</button><span class="exp" style="display:block;border:0;background:0;padding:0">${s[2]}</span></div></div>`}).join("");
  $$(".seq").forEach(seq=>enableDrag(seq))}
function enableDrag(seq){let dragEl=null;
  seq.addEventListener("dragstart",e=>{dragEl=e.target.closest(".slot");dragEl.classList.add("dragging")});
  seq.addEventListener("dragend",e=>{if(dragEl)dragEl.classList.remove("dragging");dragEl=null});
  seq.addEventListener("dragover",e=>{e.preventDefault();const after=getAfter(seq,e.clientY);if(!dragEl)return;if(after==null)seq.appendChild(dragEl);else seq.insertBefore(dragEl,after)})}
function getAfter(seq,y){const els=[...seq.querySelectorAll(".slot:not(.dragging)")];return els.reduce((c,ch)=>{const box=ch.getBoundingClientRect();const off=y-box.top-box.height/2;if(off<0&&off>c.offset)return{offset:off,element:ch};return c},{offset:-Infinity}).element}
$("#sqlist").addEventListener("click",e=>{const b=e.target.closest("[data-check]");if(!b)return;const seq=$("#seq"+b.dataset.check);[...seq.children].forEach((row,idx)=>{const ok=+row.dataset.correct==idx;row.classList.toggle("ok",ok);row.classList.toggle("no",!ok);row.querySelector(".num").textContent=idx+1})});

function buildMA(){$("#malist").innerHTML=MATCHES.map((m,mi)=>{
  const rights=shuf(m[1].map(p=>p[1]));
  const rows=m[1].map((p,pi)=>{
    const opts=rights.map(r=>`<option value="${r}">${r}</option>`).join("");
    return `<div class="mrow"><div class="mleft">${p[0]}</div><div class="msel"><select data-m="${mi}" data-correct="${p[1]}"><option value="">choose...</option>${opts}</select></div></div>`}).join("");
  return `<div class="q"><div class="qn">${m[0]}</div>${rows}<div class="bar" style="margin-top:8px"><button class="btn" data-checkm="${mi}">check</button></div></div>`}).join("")}
$("#malist").addEventListener("click",e=>{const b=e.target.closest("[data-checkm]");if(!b)return;$$(`select[data-m="${b.dataset.checkm}"]`).forEach(s=>{const ok=s.value==s.dataset.correct;s.classList.toggle("ok",ok);s.classList.toggle("no",!ok)})});

const NOTES=`
<div class="warn"><b>These are the real questions.</b> This bank is built from the 70-item pre-assessment, and WGU's OA mirrors it. Run the MCQ tab on shuffle until you clear it twice. Two fixes from the synthesized version: three-point estimate is the <span class="k">simple average (O+M+P)/3</span>, and EVM is <span class="k">conceptual only</span> (no EAC/VAC math on this OA).</div>
<h3>Process groups and phases</h3>
<p>Five process groups: <b>Initiating, Planning, Executing, Monitoring & Controlling, Closing.</b> Planning and Executing are the iterative ones.</p>
<div class="cut"><b>What happens where:</b> Initiating = charter + identify stakeholders. Planning = blueprints, estimates, prototypes, activities, quality, finalize budget AND schedule. Executing = implement the plan (most deliverable work). Closing = reconcile vendor accounts, lessons learned. PRINCE2 = <span class="k">PRojects IN a Controlled Environment</span>.</div>
<h3>Org structures and the PMO</h3>
<div class="cut"><b>Functional</b> = clear lines of authority, weak PM (examples: U.S. Dept of State, U.S. Dept of Energy). <b>PMO in a projectized org</b> = access to historical data from other projects. <b>PMO in any structure</b> = coordinates shared-resource usage.</div>
<h3>WBS and scope</h3>
<div class="cut"><b>Scope baseline = WBS + WBS dictionary + project scope statement.</b> A WBS can be organized by phases or deliverables. Bottom-up estimating needs the WBS first. Add detail by decomposing one level down (1.5.1 under 1.5). Deliverables must be measurable at closure (User training is too vague). Work-package approvals are documented by the <span class="k">SOW + RTM</span>. Adding scope without change control = <span class="k">scope creep</span>.</div>
<h3>Triple constraint</h3>
<table><tr><th>Objective</th><th>Constraint you flex</th></tr><tr><td>Work as fast as possible</td><td>Cost (add resources)</td></tr><tr><td>Work at the lowest cost</td><td>Time (extend it)</td></tr><tr><td>Incentive for early finish</td><td>Scope stays unchanged</td></tr></table>
<p>The triple constraint is <span class="k">Scope, Time, Cost</span>. Price is not one of them.</p>
<h3>Selection models</h3>
<div class="cut"><b>Non-numeric:</b> Operating necessity (must, to survive), Competitive necessity (competitors do it), Sacred cow (leadership says so, no analysis), Checklist (ranked questions; builds in operational + strategic impact but does not remove bias). The <b>sponsor</b> triggers a strategic initiative.</div>
<div class="cut"><b>Financial (definitions, not math):</b> Time value of money = a dollar now beats a dollar later. NPV = is future revenue worth more than today's costs. IRR = the rate where present value of inflows equals the investment. Opportunity cost = the alternative you give up.</div>
<h3>Estimating (the only real calc)</h3>
<div class="mn"><b>Three-point = (O + M + P) / 3</b>, a simple average. NOT the PERT weighted formula. One-point = a single expert estimate. Use three-point when opinions vary. Activity estimates are the key piece of a calendarized budget; after activities, you build the <span class="k">schedule</span>.</div>
<h3>Scheduling</h3>
<div class="cut"><b>Compression:</b> fast-track (parallel), crash (add resources, costs more; WGU risk = <span class="k">reduced quality</span>), scope reduction (drop scope). Critical path = the <span class="k">longest</span> path. Obsolete design at a phase gate = <span class="k">terminate and release resources</span>.</div>
<h3>Risk and change</h3>
<div class="cut"><b>Risk responses:</b> Avoid (remove it: fixed price, keep familiar tool), Mitigate (reduce it: hire experts), Transfer, Accept. Risk register categories = <span class="k">External, Technical, Organizational</span>. <b>Change phases:</b> Preparing (adjust baselines), Managing (route through change control to protect the baseline), Reinforcing (rewards and recognition).</div>
<h3>Monitoring, EVM, and closeout</h3>
<table><tr><th>Metric</th><th>What it measures</th></tr><tr><td>CPI (EV/AC)</td><td>Cost efficiency</td></tr><tr><td>SPI (EV/PV)</td><td>Time (schedule) efficiency</td></tr><tr><td>CV (EV-AC)</td><td>Budget</td></tr></table>
<div class="cut"><b>Closeout:</b> Lessons learned review = what went right/wrong (military: <span class="k">after action report</span>). <span class="k">Stage completion</span> = one segment validated. <span class="k">Deliverable completion</span> = full scope + invoices paid + benefits realized (WGU's odd wording, memorize it).</div>
`;
$("#notes").innerHTML=NOTES;

renderChips();buildFC();buildMC();buildFM();buildSQ();buildMA();
</script></body></html>
