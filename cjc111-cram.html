<style>
  :root{--bg:#0a0e0d;--bg2:#121817;--line:#1f2a27;--lime:#d4ff3a;--txt:#e7ece9;--dim:#8b9690;--good:#5ee08a;--bad:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{background:var(--bg);color:var(--txt);font-family:"JetBrains Mono",monospace;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:24px 18px 80px}
  h1,h2,h3{font-family:"Fraunces",serif;line-height:1.15}
  header h1{font-size:clamp(28px,6vw,46px);font-weight:900;color:var(--lime);letter-spacing:-0.02em}
  header p{color:var(--dim);font-size:13px;margin-top:6px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:20;border-bottom:1px solid var(--line)}
  .tab{background:var(--bg2);border:1px solid var(--line);color:var(--dim);padding:9px 14px;border-radius:8px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;transition:.15s}
  .tab:hover{border-color:var(--lime);color:var(--txt)}
  .tab.active{background:var(--lime);color:#0a0e0d;border-color:var(--lime);font-weight:700}
  .panel{display:none;animation:fade .2s}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--lime)}
  .btn.lime{background:var(--lime);color:#0a0e0d;border-color:var(--lime);font-weight:700}
  select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-family:"JetBrains Mono",monospace;font-size:13px}
  .pill{color:var(--dim);font-size:12px;margin-left:auto}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:34px 26px;cursor:pointer;position:relative;transition:.15s}
  .card:hover{border-color:var(--lime)}
  .card .side-label{position:absolute;top:12px;left:16px;font-size:11px;color:var(--lime);letter-spacing:.1em;text-transform:uppercase}
  .card .front{font-family:"Fraunces",serif;font-size:clamp(20px,4vw,30px);font-weight:600}
  .card .back{font-size:15px;color:var(--txt)}
  .card .tag{position:absolute;bottom:12px;right:16px;font-size:11px;color:var(--dim)}
  .q{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .q .num{color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.05em}
  .q .stem{font-size:15px;margin:8px 0 14px;font-family:"Fraunces",serif;font-weight:500}
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:14px;transition:.12s}
  .opt:hover{border-color:var(--lime)}
  .opt.correct{border-color:var(--good);background:rgba(94,224,138,.12);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.1);color:var(--bad)}
  .opt.locked{cursor:default}
  .expl{font-size:13px;color:var(--dim);margin-top:8px;padding-left:12px;border-left:2px solid var(--lime);display:none}
  .expl.show{display:block}
  .seq-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:7px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center;transition:.12s}
  .seq-item:hover{border-color:var(--lime)}
  .seq-item .order{min-width:26px;height:26px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--lime);font-weight:700}
  .seq-item.picked{border-color:var(--lime)}
  .seq-item.right{border-color:var(--good)}
  .seq-item.wrongpos{border-color:var(--bad)}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .match-col h3{font-size:13px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em;font-family:"JetBrains Mono",monospace;font-weight:700}
  .m-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font-size:13px;transition:.12s}
  .m-item:hover{border-color:var(--lime)}
  .m-item.sel{border-color:var(--lime);background:rgba(212,255,58,.08)}
  .m-item.done{border-color:var(--good);opacity:.55;cursor:default}
  .m-item.miss{border-color:var(--bad)}
  .notes h2{color:var(--lime);font-size:26px;margin:30px 0 6px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .notes h3{font-size:17px;margin:18px 0 4px;color:var(--txt)}
  .notes p,.notes li{font-size:14px;color:var(--txt)}
  .notes ul{margin:6px 0 10px 20px}
  .notes li{margin-bottom:4px}
  .notes b{color:var(--lime);font-weight:700}
  .notes .lo{font-size:11px;color:var(--dim);letter-spacing:.06em}
  .notes .key{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:13px}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:var(--bg2);color:var(--lime)}
  .scorebar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:10px 18px;font-size:13px;display:flex;gap:16px;justify-content:center;z-index:30}
  .scorebar b{color:var(--lime)}
  .done-msg{font-size:14px;margin-top:10px}
</style>

<body>
<div class="wrap">
  <header>
    <h1>CJC 111 — Cram</h1>
    <p>Gaines &amp; Miller, <i>Criminal Justice in Action</i> (11th ed.) — Ch. 1-5 // mapped to the learning objectives</p>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab active" data-p="cards">Flashcards</button>
    <button class="tab" data-p="mcq">MCQs</button>
    <button class="tab" data-p="seq">Sequencing</button>
    <button class="tab" data-p="match">Matching</button>
    <button class="tab" data-p="notes">Notes</button>
  </div>

  <section class="panel active" id="cards">
    <div class="ctrls">
      <select id="deckSel"></select>
      <button class="btn" id="shuf">Shuffle</button>
      <button class="btn" id="prev">‹ Prev</button>
      <button class="btn" id="next">Next ›</button>
      <span class="pill" id="cardCount"></span>
    </div>
    <div class="card" id="card">
      <span class="side-label" id="sideLbl">Term</span>
      <div class="front" id="cardText"></div>
      <span class="tag" id="cardTag"></span>
    </div>
    <p style="color:var(--dim);font-size:12px;margin-top:10px;text-align:center">tap card to flip</p>
  </section>

  <section class="panel" id="mcq">
    <div class="ctrls">
      <select id="mcqChap"></select>
      <button class="btn" id="mcqShuf">Shuffle</button>
      <button class="btn" id="mcqReset">Reset</button>
      <span class="pill" id="mcqProg"></span>
    </div>
    <div id="mcqList"></div>
  </section>

  <section class="panel" id="seq">
    <div class="ctrls">
      <select id="seqSel"></select>
      <button class="btn" id="seqShuf">Shuffle</button>
      <button class="btn lime" id="seqCheck">Check Order</button>
      <button class="btn" id="seqReset">Reset</button>
    </div>
    <p id="seqPrompt" style="font-family:'Fraunces',serif;font-size:16px;margin-bottom:12px"></p>
    <div id="seqList"></div>
    <p class="done-msg" id="seqMsg"></p>
  </section>

  <section class="panel" id="match">
    <div class="ctrls">
      <select id="matchSel"></select>
      <button class="btn" id="matchShuf">Shuffle</button>
      <button class="btn" id="matchReset">Reset</button>
      <span class="pill" id="matchProg"></span>
    </div>
    <div class="match-grid">
      <div class="match-col"><h3>Term</h3><div id="matchL"></div></div>
      <div class="match-col"><h3>Definition</h3><div id="matchR"></div></div>
    </div>
  </section>

  <section class="panel notes" id="notes"></section>
</div>

<div class="scorebar" id="scorebar" style="display:none">
  <span>Score: <b id="sbCorrect">0</b>/<b id="sbTotal">0</b></span>
  <span>Accuracy: <b id="sbAcc">—</b></span>
</div>

<script>
const FLASH = {
  "Ch 1 — CJ Today":[
    ["Consensus model","The view that a diverse group of citizens will naturally agree on which acts to outlaw; assumes people can share similar morals."],
    ["Conflict model","The view that in a diverse society, dominant groups exercise power by writing their own value systems into the criminal law."],
    ["Crime","Any action punishable under criminal statutes; an offense against society, prosecuted by the state, punishable by loss of freedom or life."],
    ["Two purposes of the CJ system","(1) Provide justice, treat all individuals equally under the law; (2) protect society, including fair treatment of victims and the accused."],
    ["Three levels of law enforcement","Federal (FBI, DEA, Secret Service), state, and local. Most CJ employees work locally because crime is mostly a local concern."],
    ["Elements of the corrections system","Probation, incarceration (jail or prison), community-based corrections facilities, and parole."],
    ["Formal vs. informal process","Formal = the mechanical legal steps from arrest to punishment. Informal = the discretion exercised at each step (e.g., a prosecutor declining to prosecute)."],
    ["Discretion","Authority to make operational decisions based on personal judgment; it creates the informal process."],
    ["Ethics","The moral principles that guide a person's sense of right and wrong; steers discretionary decisions toward society's values."],
    ["Firearm background check","Buyers from federally licensed dealers must pass a check; denied for signs of mental illness, a felony conviction, drug addiction, or domestic violence."],
    ["Internet & child pornography (3 reasons)","The internet allows (a) quick transmission, (b) security (untraceable emails, password-protected sites), and (c) anonymity for buyers and sellers."],
    ["White-collar crime","Nonviolent crime where the offender has legal access to the scene and acts in a seemingly legitimate way; victims are often unknown or unidentifiable."]
  ],
  "Ch 2 — Causes of Crime":[
    ["Hypothesis vs. theory","A hypothesis is a testable 'if...then' proposition; once enough authorities verify it, it becomes a theory that can explain behavior."],
    ["Rational choice theory","A person weighs the benefits of a crime against its potential costs; if the perceived benefits outweigh the costs, the crime is more likely."],
    ["Mental illness & violent crime (misperception)","Contrary to popular belief, only about 1 in 5 mass shooters have a severe mental disorder, and fewer than 3% of gun homicides involve a mentally ill offender."],
    ["Social disorganization theory","Crime is largely the product of unfavorable conditions in certain communities, or 'zones of disorganization.'"],
    ["Strain theory","Most people seek wealth and security; the strain of not being able to reach those goals through legal means pushes some toward crime."],
    ["Cultural deviance theory","People adapt to the values of a subculture that has its own standards of behavior, which may conflict with the law."],
    ["Social reality of crime","A social conflict theory: criminal law is a set of rules the powerful put in place to control and subdue those without power."],
    ["Learning theory","A branch of social process theory: people learn to be criminals from their family and peers."],
    ["Control theory","A branch of social process theory: most people avoid crime because they value the opinions of family and peers."],
    ["Labeling theory","A branch of social process theory: a person labeled a 'junkie' or 'thief' tends to become or remain whatever they were labeled."],
    ["Self-control theory","Low self-control in early childhood predicts adult offending; an impulsive child who solves problems with violence is at risk."],
    ["Medical vs. criminal model of addiction","Medical model: addicts are ill and commit petty crime to feed a habit. Criminal model: abusers endanger society and should be treated like any criminal."],
    ["Chronic offender (Wolfgang)","A juvenile or adult who commits multiple offenses; Wolfgang's 1970s research found a small group commits a disproportionate share of all crime."]
  ],
  "Ch 3 — The Crime Picture":[
    ["Civil law","Resolves disputes between private parties; the plaintiff seeks monetary damages by proving the defendant committed a tort (wrongful act)."],
    ["Criminal law","Exists to protect society from criminal behavior; the government prosecutes defendants charged with crimes."],
    ["Mala in se","An act that is inherently wrong or evil in itself (e.g., murder)."],
    ["Mala prohibita","An act that is illegal only because a particular society's laws prohibit it (e.g., gambling)."],
    ["NIBRS / UCR","The FBI compiles the Uniform Crime Reports using the National Incident-Based Reporting System (NIBRS), built from local police data."],
    ["Group A offenses","The 50+ NIBRS crimes against persons, property, and society that police are encouraged to report with full incident detail."],
    ["NCVS","National Crime Victimization Survey: an annual survey of ~110,000 households (Census Bureau + BJS) asking about crimes committed against them; captures unreported crime."],
    ["Self-reported survey","Asks individuals about criminal activity they may have taken part in themselves."],
    ["Victims' rights (3 ways)","The right to be informed, the right to be present at proceedings, and the right to be heard on prosecution, punishment, and release."],
    ["Routine activities theory (victimization)","Victimization is likely when three things meet: (a) a likely offender, (b) a suitable target, and (c) the absence of a capable guardian."],
    ["Three factors in crime rate change","(a) Levels of incarceration, (b) the size of the youth population (under 24 commit most crime), and (c) the health of the economy."],
    ["Income vs. race","Low family income, an absent parent, and not finishing high school predict crime regardless of race or ethnicity."],
    ["Women and incarceration","Rising female incarceration comes mostly from nonviolent drug-, alcohol-, and property-related offenses that wouldn't have meant prison decades ago."]
  ],
  "Ch 4 — Inside Criminal Law":[
    ["Four written sources of law","(a) Constitutions (U.S. and state), (b) statutes (Congress, state legislatures, local ordinances), (c) administrative regulations, and (d) case law."],
    ["Precedent","A decision that becomes the example or authority for deciding future cases with similar facts."],
    ["Stare decisis","'Stand by decided cases': judges in a jurisdiction are bound to follow that jurisdiction's precedents; promotes efficiency."],
    ["Two functions of criminal law","(1) Protect citizens from harm to person/property and to society's collective interests; (2) maintain and teach social values and boundaries."],

    ["Strict liability","Crimes where ignorance or mistake is no defense; e.g., speed-limit violations and statutory rape."],
    ["Insanity defense tests","M'Naghten (right-wrong test), ALI/MPC (substantial-capacity test), and the irresistible-impulse test."],
    ["Insanity defense reality","Rarely used and rarely successful; even when found not guilty by reason of insanity, the defendant goes to a mental health institution, not free."],
    ["Excuse defenses","The defendant isn't responsible: insanity, intoxication (voluntary or involuntary), and mistake."],
    ["Justification defenses","The act was justified: duress, justifiable use of force, necessity, and entrapment."],
    ["Entrapment","A justification defense: the criminal act was induced by government persuasion or trickery."],
    ["Duress","A justification defense requiring a threat of serious harm/death, harm greater than the crime, an immediate and inescapable threat, and no fault in getting involved."],
    ["Substantive vs. procedural law","Substantive = what acts are actually criminal. Procedural = the procedures that protect constitutional rights and limit arbitrary government power."],
    ["Due process clause","Limits government power; requires fair procedures and that criminal laws be reasonable and in the public interest."]
  ],
  "Ch 5 — Law Enforcement Today":[
    ["Four police responsibilities","(a) Enforce laws, (b) provide services, (c) prevent crime, and (d) preserve the peace."],
    ["Patronage system","During the political era of policing (1840-1930), bribes from citizens and businesses flowed to the local political party."],
    ["Intelligence-led policing","Uses past crime patterns to predict when and where crime will occur, letting departments focus resources on 'hot spots.'"],
    ["De-escalation","A strategy to reduce use of force: verbal commands, checking for mental illness or language barriers, increasing distance, and waiting for backup."],
    ["Police academy vs. field training","Academy = controlled classroom learning from instructors. Field training = real-world patrol alongside an experienced officer."],
    ["Benefits of female officers","Often put citizens at ease, are effective on service calls, rely on verbal skills over force, and are disciplined far less for excessive force."],
    ["Diverse police force advantage","Minority officers communicate more easily in diverse communities and have higher credibility, improving order-keeping and crime solving."],
    ["Local police vs. sheriffs","Both are local. Police answer to city government (chief appointed); sheriffs are county-level and elected, and they run local jails and provide courthouse security."],
    ["DHS key agencies","Customs and Border Protection (borders/Border Patrol), Immigration and Customs Enforcement (immigration/customs), and the Secret Service (protects officials/property)."],
    ["FBI duties","Safeguard national security from terrorism, investigate federal crimes (white-collar, kidnapping, bank robbery, civil rights), and support state/local police with labs and databases."]
  ]
};

const MCQ = {
  "Ch 1":[
    ["The model holding that a diverse society's citizens will naturally agree on which acts to outlaw is the:",["Conflict model","Consensus model","Crime control model","Due process model"],1,"The consensus model assumes diverse people share enough morals to agree on what should be criminal."],

    ["The three levels of law enforcement are:",["City, county, state","Federal, state, local","FBI, DEA, ATF","Police, courts, corrections"],1,"Our federal system creates federal, state, and local law enforcement; most work is local."],
    ["Which is an essential element of the corrections system?",["Arraignment","Parole","Indictment","Booking"],1,"Corrections includes probation, incarceration, community-based facilities, and parole."],
    ["A prosecutor choosing not to charge a suspect they believe is guilty is an example of the:",["Formal process","Informal process","Consensus model","Adversarial system"],1,"Discretion like declining to prosecute is what creates the informal criminal justice process."],
    ["A firearm purchase from a licensed dealer would be denied if the applicant:",["Is over age 65","Has a felony conviction","Lives out of state","Has never owned a gun"],1,"Background checks deny buyers showing mental illness, a felony conviction, drug addiction, or domestic violence."],
    ["A key way white-collar crime differs from violent or property crime is that:",["It is always more violent","The offender has legal access to the scene and victims are often unidentifiable","It is never prosecuted","It only occurs online"],1,"White-collar offenders act in a seemingly legitimate way with legal access; victims are often unknown."]
  ],
  "Ch 2":[
    ["In criminology, a hypothesis is:",["A proven law of behavior","A testable 'if...then' proposition","The same as a theory","An untestable belief"],1,"A hypothesis is a testable proposition; once repeatedly verified it becomes a theory."],
    ["Rational choice theory holds that a person commits a crime when:",["They are mentally ill","The perceived benefits outweigh the perceived costs","They were born criminal","They have low intelligence"],1,"Rational choice weighs benefits against costs; crime is likelier when benefits seem to win."],
    ["Research on mass shooters and mental illness shows that:",["Most mass shooters are mentally ill","Only about 1 in 5 mass shooters have a severe mental disorder","All gun homicides involve mental illness","Mental illness causes most violent crime"],1,"Only ~1 in 5 mass shooters have severe disorders, and under 3% of gun homicides involve a mentally ill offender."],
    ["Which is one of the three theories of social structure?",["Labeling theory","Social disorganization theory","Rational choice theory","Self-control theory"],1,"The three social structure theories are social disorganization, strain, and cultural deviance."],

    ["The 'social reality of crime' is a ___ theory.",["Social structure","Social conflict","Social process","Choice"],1,"It's a social conflict theory: law is rules the powerful use to control the powerless."],
    ["Which is a branch of social process theory?",["Cultural deviance","Learning theory","Strain theory","Social disorganization"],1,"The three social process branches are learning, control, and labeling theories."],
    ["Control theory holds that most people avoid crime because:",["They fear prison","They value the opinions of family and peers","They lack opportunity","They are naturally good"],1,"Control theory says bonds to family and peers dissuade most people from crime."],
    ["Self-control theory predicts adult offending based on:",["Income level","Low self-control in early childhood","Peer groups in adulthood","Neighborhood disorganization"],1,"Low childhood self-control, impulsivity and solving problems with violence, predicts adult offending."],
    ["The medical model of addiction views addicts as:",["Dangerous criminals","Ill individuals forced into petty crime to feed a habit","Rational decision-makers","Victims of labeling"],1,"The medical model treats addicts as ill; the criminal model treats them like any other criminal."],
    ["Wolfgang's research on chronic offenders found that:",["Crime is evenly spread across offenders","A small group commits a disproportionate share of crime","Chronic offenders age out quickly","Most crime is by first-timers"],1,"A small number of chronic offenders accounts for a disproportionately large amount of crime."]
  ],
  "Ch 3":[
    ["In civil law, the party seeking monetary damages is the:",["Defendant","Plaintiff","Prosecutor","Complainant"],1,"The plaintiff sues to recover damages by proving the defendant committed a tort."],
    ["Criminal law primarily exists to:",["Resolve private disputes","Protect society from criminal behavior","Award monetary damages","Settle contracts"],1,"Criminal law protects society; the government prosecutes the defendant."],
    ["An act that is inherently wrong, like murder, is:",["Mala prohibita","Mala in se","A tort","A misdemeanor"],1,"Mala in se = wrong in itself; mala prohibita = wrong only because banned."],
    ["The FBI compiles the Uniform Crime Reports using:",["The NCVS","The National Incident-Based Reporting System (NIBRS)","Self-report surveys","Census data only"],1,"The 11th edition: the UCR is built from NIBRS data submitted by local police."],
    ["'Group A' offenses in NIBRS are:",["Only violent crimes","50+ crimes against persons, property, and society","Federal crimes only","Crimes with no victims"],1,"Group A covers 50+ impactful crimes against persons, property, and society."],
    ["The National Crime Victimization Survey is valuable because it:",["Counts only reported crime","Includes crimes not reported to police","Is run by the FBI","Surveys offenders"],1,"The NCVS surveys ~110,000 households about victimization, capturing unreported crime."],
    ["Which is one of the three rights granted by victims' rights legislation?",["The right to sentence the offender","The right to be heard on prosecution, punishment, and release","The right to arrest the offender","The right to a cash payment"],1,"The three rights: to be informed, to be present, and to be heard on prosecution/punishment/release."],
    ["Routine activities theory says victimization is likely when there is a likely offender, a suitable target, and:",["A motive","The absence of a capable guardian","A weapon","A prior relationship"],1,"The third element is the absence of someone who could prevent the crime."],

const NOTES = `
<p class="lo" style="margin-bottom:14px">Built to match the chapter learning objectives, the test blueprint. Each section maps to an LO.</p>

<h2>Chapter 1 — Criminal Justice Today</h2>
<ul>
<li><b>Consensus vs. conflict model:</b> consensus = a diverse society still agrees on which acts to outlaw; conflict = dominant groups write their values into law.</li>
<li><b>Crime</b> = any action punishable under criminal statutes. It's an offense against society, so the <b>state</b> prosecutes (not the victim), and punishment can mean loss of freedom or life.</li>
<li><b>Two purposes of the CJ system:</b> (1) provide justice (equal treatment under law), (2) protect society (fair treatment of victims and the accused).</li>
<li><b>Three levels of law enforcement:</b> federal, state, local. Most CJ workers are local because crime is mostly local. Federal: FBI, DEA, Secret Service.</li>
<li><b>Corrections elements:</b> probation, incarceration (jail/prison), community-based corrections, parole.</li>
<li><b>Formal vs. informal process:</b> formal = the mechanical steps from arrest to punishment; informal = discretion at each step (a prosecutor can decline to charge even when they think the suspect is guilty).</li>
<li><b>Ethics</b> = moral principles guiding right/wrong; they steer discretionary decisions toward society's values.</li>
<li><b>Firearm background checks</b> deny buyers showing mental illness, a felony conviction, drug addiction, or domestic violence.</li>
<li><b>Internet & child pornography (3 reasons):</b> quick transmission, security (untraceable emails, password-protected sites), and anonymity.</li>
<li><b>White-collar crime</b> vs. violent/property: the offender has legal access to the scene and acts legitimately; victims are often unknown or unidentifiable.</li>
</ul>

<h2>Chapter 2 — Causes of Crime</h2>
<div class="key">Heads up: this chapter is NOT the deterrence/Beccaria/Lombroso material from the juvenile delinquency class. Gaines & Miller Ch 2 is about rational choice, social structure, social process, self-control, addiction, and chronic offenders.</div>
<ul>
<li><b>Hypothesis vs. theory:</b> a hypothesis is a testable 'if...then' statement; verified enough, it becomes a theory.</li>
<li><b>Rational choice theory:</b> weigh benefits vs. costs; crime is likelier when the perceived benefits win.</li>
<li><b>Mental illness misperception:</b> only ~1 in 5 mass shooters have a severe disorder; under 3% of gun homicides involve a mentally ill offender.</li>
<li><b>Three social structure theories:</b> social disorganization (bad community conditions), strain (blocked legal means to goals), cultural deviance (subculture's own standards).</li>
<li><b>Social reality of crime</b> (social conflict): law is rules the powerful use to control the powerless.</li>
<li><b>Three branches of social process theory:</b> learning (crime learned from family/peers), control (bonds to others keep us straight), labeling (the label sticks and shapes behavior).</li>
<li><b>Self-control theory:</b> low self-control in early childhood predicts adult offending.</li>
<li><b>Medical vs. criminal model of addiction:</b> medical = addicts are ill, criminal = treat them like any criminal.</li>
<li><b>Chronic offender (Wolfgang, 1970s):</b> a small group commits a disproportionate share of crime, driving longer-sentence laws.</li>
</ul>

<h2>Chapter 3 — The Crime Picture: Offenders and Victims</h2>
<ul>
<li><b>Civil vs. criminal law:</b> civil = private dispute, the <b>plaintiff</b> seeks damages for a <b>tort</b>; criminal = the state prosecutes to protect society.</li>
<li><b>Mala in se</b> (inherently wrong) vs. <b>mala prohibita</b> (wrong only because banned).</li>
<li><b>How the FBI measures crime:</b> the <b>UCR</b> is compiled using <b>NIBRS</b>. The 50+ <b>Group A offenses</b> are crimes against persons, property, and society. (This edition uses NIBRS/Group A, not the old Part I/Part II split.)</li>
<li><b>NCVS vs. self-report:</b> NCVS = ~110,000 households (Census + BJS), captures unreported crime; self-report = people report their own offending.</li>
<li><b>Victims' rights (3 ways):</b> to be informed, to be present at proceedings, to be heard on prosecution/punishment/release.</li>
<li><b>Routine activities theory of victimization:</b> likely offender + suitable target + absence of a capable guardian.</li>
<li><b>Three factors in crime-rate change:</b> incarceration levels, size of the youth population (under 24 commit most crime), and the economy.</li>
<li><b>Income over race:</b> low earning power, an absent parent, and no high school diploma predict crime regardless of race/ethnicity.</li>
<li><b>Women and incarceration:</b> the rise is mostly nonviolent drug, alcohol, and property offenses.</li>
</ul>

<h2>Chapter 4 — Inside Criminal Law</h2>
<ul>
<li><b>Four written sources:</b> constitutions, statutes (+ local ordinances), administrative regulations, and case law.</li>
<li><b>Precedent & stare decisis:</b> precedent is the authority for similar future cases; stare decisis binds judges to follow it, promoting efficiency.</li>
<li><b>Two functions of criminal law:</b> protect from harm (person/property + society), and maintain/teach social values.</li>
<li><b>Mens rea, four mental states:</b> purpose, knowledge, negligence, recklessness.</li>
<li><b>Strict liability:</b> no defense of ignorance/mistake (speeding, statutory rape).</li>
<li><b>Excuse defenses:</b> insanity (M'Naghten right-wrong, ALI/MPC substantial-capacity, irresistible-impulse), intoxication, mistake.</li>
<li><b>Justification defenses:</b> duress, justifiable use of force, necessity, entrapment.</li>
<li><b>Insanity reality:</b> rarely used, rarely works, and NGRI defendants go to a mental institution, not free.</li>
<li><b>Substantive vs. procedural:</b> substantive = what's a crime; procedural = the rules protecting rights and limiting government power.</li>
<li><b>Due process clause:</b> limits government power; demands fair procedure and reasonable laws.</li>
</ul>

<h2>Chapter 5 — Law Enforcement Today</h2>
<ul>
<li><b>Four police responsibilities:</b> enforce laws, provide services, prevent crime, preserve the peace.</li>
<li><b>Patronage system:</b> political era (1840-1930), bribes funded the local political party.</li>
<li><b>Intelligence-led policing:</b> predict crime from past patterns, focus on hot spots, stretch resources.</li>
<li><b>De-escalation:</b> verbal commands, check for mental illness/language barrier, increase distance, wait for backup.</li>
<li><b>Academy vs. field training:</b> academy = controlled classroom; field training = real-world patrol with a veteran.</li>
<li><b>Female officers:</b> put citizens at ease, lean on verbal skills, disciplined far less for excessive force.</li>
<li><b>Diverse force:</b> easier communication and higher credibility in diverse communities.</li>
<li><b>Police vs. sheriffs:</b> police = city, chief appointed; sheriffs = county, elected, and they run jails + courthouse security.</li>
<li><b>DHS agencies:</b> CBP (borders), ICE (immigration/customs), Secret Service (protection).</li>
<li><b>FBI:</b> national security/terrorism, federal crimes (white-collar, kidnapping, bank robbery, civil rights), and lab/database support to local police.</li>
</ul>

<div class="key" style="margin-top:24px"><b>Highest-yield items:</b> consensus vs conflict, the two CJ purposes, formal vs informal process (discretion), rational choice theory, the three social structure + three social process theories, chronic offenders (Wolfgang), NIBRS/Group A, NCVS vs self-report, routine activities theory, the four mens rea states, excuse vs justification defenses, the four police duties, and sheriffs vs local police.</div>
`;

let sbC=0,sbT=0;

function renderMcq(shuffle){let list=getMcqs();if(shuffle)list.sort(()=>Math.random()-.5);sbC=0;sbT=0;updateSb();const wrap=$('#mcqList');wrap.innerHTML='';$('#mcqProg').textContent=list.length+' questions';
  list.forEach((q,i)=>{const [stem,opts,ans,expl]=q;const div=document.createElement('div');div.className='q';div.innerHTML='<div class="num">Q'+(i+1)+'</div><div class="stem">'+stem+'</div>';
    opts.forEach((opt,oi)=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>{if(div.dataset.done)return;div.dataset.done='1';sbT++;div.querySelectorAll('.opt').forEach((x,xi)=>{x.classList.add('locked');if(xi===ans)x.classList.add('correct');});if(oi===ans)sbC++;else b.classList.add('wrong');div.querySelector('.expl').classList.add('show');updateSb();};div.appendChild(b);});

let seqState=[],seqPick=[];
function loadSeq(shuffle){const [prompt,items]=SEQ[seqSel.value];$('#seqPrompt').textContent=prompt;$('#seqMsg').textContent='';seqState=items.map((t,i)=>({t,correct:i}));if(shuffle!==false)seqState.sort(()=>Math.random()-.5);seqPick=[];renderSeq();}
function renderSeq(){const list=$('#seqList');list.innerHTML='';seqState.forEach((it,idx)=>{const d=document.createElement('div');d.className='seq-item';const pos=seqPick.indexOf(idx);if(pos>=0)d.classList.add('picked');d.innerHTML='<span class="order">'+(pos>=0?(pos+1):'·')+'</span><span>'+it.t+'</span>';d.onclick=()=>{const p=seqPick.indexOf(idx);if(p>=0)seqPick.splice(p,1);else seqPick.push(idx);renderSeq();$('#seqMsg').textContent='';};list.appendChild(d);});}
$('#seqCheck').onclick=()=>{if(seqPick.length!==seqState.length){$('#seqMsg').style.color='var(--bad)';$('#seqMsg').textContent='Pick every item in order first.';return;}let ok=true;$$('#seqList .seq-item').forEach(x=>x.classList.remove('right','wrongpos'));seqPick.forEach((stateIdx,position)=>{const correct=seqState[stateIdx].correct===position;if(!correct)ok=false;const el=$('#seqList').children[stateIdx];el.classList.add(correct?'right':'wrongpos');});$('#seqMsg').style.color=ok?'var(--good)':'var(--bad)';$('#seqMsg').textContent=ok?'Correct order! ✓':'Not quite, green = right spot, red = wrong spot.';};

const matchSel=$('#matchSel');

function renderMatch(){const L=$('#matchL'),R=$('#matchR');L.innerHTML='';R.innerHTML='';$('#matchProg').textContent=matched+' / '+mPairs.length+' matched';
  mLeft.forEach(l=>{const d=document.createElement('div');d.className='m-item';d.textContent=l.txt;if(l.done)d.classList.add('done');if(selL&&selL.id===l.id&&!l.done)d.classList.add('sel');d.onclick=()=>{if(l.done)return;selL=l;renderMatch();};L.appendChild(d);});
  mRight.forEach(r=>{const d=document.createElement('div');d.className='m-item';d.textContent=r.txt;if(r.done)d.classList.add('done');d.onclick=()=>{if(r.done||!selL)return;if(selL.id===r.id){mLeft.find(x=>x.id===r.id).done=true;r.done=true;matched++;selL=null;renderMatch();}else{d.classList.add('miss');setTimeout(()=>d.classList.remove('miss'),500);selL=null;renderMatch();}};R.appendChild(d);});}
