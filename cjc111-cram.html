<style>
  :root{
    --bg:#0a0e0d; --bg2:#121817; --line:#1f2a27; --lime:#d4ff3a;
    --txt:#e7ece9; --dim:#8b9690; --good:#5ee08a; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{background:var(--bg);color:var(--txt);font-family:"JetBrains Mono",monospace;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:24px 18px 80px}
  h1,h2,h3{font-family:"Fraunces",serif;line-height:1.15}
  header h1{font-size:clamp(28px,6vw,46px);font-weight:900;color:var(--lime);letter-spacing:-0.02em}
  header p{color:var(--dim);font-size:13px;margin-top:6px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:20;border-bottom:1px solid var(--line)}
  .tab{background:var(--bg2);border:1px solid var(--line);color:var(--dim);padding:9px 14px;border-radius:8px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;transition:.15s}
  .tab:hover{border-color:var(--lime);color:var(--txt)}
  .tab.active{background:var(--lime);color:#0a0e0d;border-color:var(--lime);font-weight:700}
  .panel{display:none;animation:fade .2s}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .btn{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--lime)}
  .btn.lime{background:var(--lime);color:#0a0e0d;border-color:var(--lime);font-weight:700}
  select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-family:"JetBrains Mono",monospace;font-size:13px}
  .pill{color:var(--dim);font-size:12px;margin-left:auto}
  /* flashcards */
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:34px 26px;cursor:pointer;position:relative;transition:.15s}
  .card:hover{border-color:var(--lime)}
  .card .side-label{position:absolute;top:12px;left:16px;font-size:11px;color:var(--lime);letter-spacing:.1em;text-transform:uppercase}
  .card .front{font-family:"Fraunces",serif;font-size:clamp(20px,4vw,30px);font-weight:600}
  .card .back{font-size:15px;color:var(--txt)}
  .card .tag{position:absolute;bottom:12px;right:16px;font-size:11px;color:var(--dim)}
  /* mcq */
  .q{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .q .num{color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.05em}
  .q .stem{font-size:15px;margin:8px 0 14px;font-family:"Fraunces",serif;font-weight:500}
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:14px;transition:.12s}
  .opt:hover{border-color:var(--lime)}
  .opt.correct{border-color:var(--good);background:rgba(94,224,138,.12);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.1);color:var(--bad)}
  .opt.locked{cursor:default}
  .expl{font-size:13px;color:var(--dim);margin-top:8px;padding-left:12px;border-left:2px solid var(--lime);display:none}
  .expl.show{display:block}
  /* sequencing */
  .seq-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:7px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center;transition:.12s}
  .seq-item:hover{border-color:var(--lime)}
  .seq-item .order{min-width:26px;height:26px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--lime);font-weight:700}
  .seq-item.picked{border-color:var(--lime)}
  .seq-item.right{border-color:var(--good)}
  .seq-item.wrongpos{border-color:var(--bad)}
  /* matching */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .match-col h3{font-size:13px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em;font-family:"JetBrains Mono",monospace;font-weight:700}
  .m-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font-size:13px;transition:.12s}
  .m-item:hover{border-color:var(--lime)}
  .m-item.sel{border-color:var(--lime);background:rgba(212,255,58,.08)}
  .m-item.done{border-color:var(--good);opacity:.55;cursor:default}
  .m-item.miss{border-color:var(--bad)}
  /* notes */
  .notes h2{color:var(--lime);font-size:26px;margin:30px 0 6px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .notes h3{font-size:18px;margin:18px 0 4px;color:var(--txt)}
  .notes p,.notes li{font-size:14px;color:var(--txt)}
  .notes ul{margin:6px 0 10px 20px}
  .notes li{margin-bottom:4px}
  .notes b{color:var(--lime);font-weight:700}
  .notes .key{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:13px}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:var(--bg2);color:var(--lime)}
  .scorebar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:10px 18px;font-size:13px;display:flex;gap:16px;justify-content:center;z-index:30}
  .scorebar b{color:var(--lime)}
  .done-msg{color:var(--good);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CJC 111 — Cram</h1>
    <p>Gaines &amp; Miller, <i>Criminal Justice in Action</i> (11th ed.) — Chapters 1-5 // exam prep</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-p="cards">Flashcards</button>
    <button class="tab" data-p="mcq">MCQs</button>
    <button class="tab" data-p="seq">Sequencing</button>
    <button class="tab" data-p="match">Matching</button>
    <button class="tab" data-p="notes">Notes</button>
  </div>

  <!-- FLASHCARDS -->
  <section class="panel active" id="cards">
    <div class="ctrls">
      <select id="deckSel"></select>
      <button class="btn" id="shuf">Shuffle</button>
      <button class="btn" id="prev">‹ Prev</button>
      <button class="btn" id="next">Next ›</button>
      <span class="pill" id="cardCount"></span>
    </div>
    <div class="card" id="card">
      <span class="side-label" id="sideLbl">Term</span>
      <div class="front" id="cardText"></div>
      <span class="tag" id="cardTag"></span>
    </div>
    <p style="color:var(--dim);font-size:12px;margin-top:10px;text-align:center">tap card to flip</p>
  </section>

  <!-- MCQ -->
  <section class="panel" id="mcq">
    <div class="ctrls">
      <select id="mcqChap"></select>
      <button class="btn" id="mcqShuf">Shuffle</button>
      <button class="btn" id="mcqReset">Reset</button>
      <span class="pill" id="mcqProg"></span>
    </div>
    <div id="mcqList"></div>
  </section>

  <!-- SEQUENCING -->
  <section class="panel" id="seq">
    <div class="ctrls">
      <select id="seqSel"></select>
      <button class="btn" id="seqShuf">Shuffle</button>
      <button class="btn lime" id="seqCheck">Check Order</button>
      <button class="btn" id="seqReset">Reset</button>
    </div>
    <p id="seqPrompt" style="font-family:'Fraunces',serif;font-size:16px;margin-bottom:12px"></p>
    <div id="seqList"></div>
    <p class="done-msg" id="seqMsg"></p>
  </section>

  <!-- MATCHING -->
  <section class="panel" id="match">
    <div class="ctrls">
      <select id="matchSel"></select>
      <button class="btn" id="matchShuf">Shuffle</button>
      <button class="btn" id="matchReset">Reset</button>
      <span class="pill" id="matchProg"></span>
    </div>
    <div class="match-grid">
      <div class="match-col"><h3>Term</h3><div id="matchL"></div></div>
      <div class="match-col"><h3>Definition</h3><div id="matchR"></div></div>
    </div>
  </section>

  <!-- NOTES -->
  <section class="panel notes" id="notes"></section>
</div>

<div class="scorebar" id="scorebar" style="display:none">
  <span>Score: <b id="sbCorrect">0</b>/<b id="sbTotal">0</b></span>
  <span>Accuracy: <b id="sbAcc">—</b></span>
</div>

<script>
/* ============ DATA ============ */
const FLASH = {
  "Ch 1 — CJ Today":[
    ["Crime","An act in violation of the law for which a punishment is prescribed by a governing authority."],
    ["Consensus model","A criminal justice model in which the majority of citizens in a society share the same values and beliefs; criminal acts conflict with these values and are deemed harmful to society."],
    ["Conflict model","A criminal justice model in which the content of criminal law is determined by the groups that hold economic, political, and social power in a community."],
    ["Integrated definition of crime","Gaines & Miller's combined definition: crime is an act punishable by law, that violates the values of society, and is committed by someone the criminal law holds responsible."],
    ["Crime control model (Packer)","A model that emphasizes efficiency, punishing offenders, and protecting society; values speed and finality."],
    ["Due process model (Packer)","A model that places primacy on the right of the individual to be protected from the power of the government; values formal procedure."],
    ["Federalism","A form of government in which a written constitution divides power between a central government and several regional governments (federal vs. the 50 states)."],
    ["The criminal justice system","The interlocking network of law enforcement agencies, courts, and corrections institutions designed to enforce criminal laws and protect society from criminal behavior."],
    ["Three components","Law enforcement (police), the courts, and corrections."],
    ["Discretion","The ability of individuals in the criminal justice system to make operational decisions based on personal judgment instead of formal rules or official information."],
    ["Formal vs. informal process","The formal process is the full legal sequence (arrest → corrections). The informal process is how cases actually get handled through discretion and cooperation among the work group."],
    ["Wedding cake model","A wedding cake-shaped model that explains why different cases receive different treatment: celebrated cases (top), serious felonies, less serious felonies, and misdemeanors (largest, bottom)."],
    ["Homeland security","The coordinated national effort to prevent terrorist attacks, reduce vulnerability, and recover from attacks; reshaped CJ after 9/11."],
    ["Ethics","The rules or standards of behavior governing a profession; tied to acting rightly even when no one is watching."]
  ],
  "Ch 2 — Causes of Crime":[
    ["Criminology","The scientific study of crime and the causes of criminal behavior."],
    ["Choice theory","School holding that people freely choose to commit crime after weighing the benefits against the costs (rooted in classical criminology)."],
    ["Classical criminology","Beccaria/Bentham: people are rational, motivated by greed, revenge, survival, or hedonism, and choose crime expecting more pleasure than pain."],
    ["Cesare Beccaria","Father of classical criminology; argued punishment should be swift, certain, and proportionate to deter crime."],
    ["Jeremy Bentham","Developed utilitarianism / the hedonistic calculus: people seek pleasure and avoid pain."],
    ["General deterrence","Punishing one offender to discourage the general public from committing crime."],
    ["Specific deterrence","Punishing an individual severely so that same offender will not reoffend."],
    ["Routine activities theory","Crime occurs when a motivated offender, a suitable target, and the absence of a capable guardian come together."],
    ["Trait theory","Crime stems from biological or psychological traits/abnormalities (positivism)."],
    ["Cesare Lombroso","Father of criminology; atavism / the 'born criminal' as an evolutionary throwback."],
    ["Psychodynamic theory","Freud-based: delinquency stems from an abnormal personality formed early in life."],
    ["Nature theory of intelligence","IQ is largely inherited/genetic; low-IQ individuals are predisposed to delinquency."],
    ["Nurture theory of intelligence","IQ is shaped by environment and socialization, not just genes."],
    ["Social disorganization theory","Crime is linked to neighborhood breakdown, poverty, and lack of social control (Chicago School, Shaw & McKay)."],
    ["Strain theory (Merton)","Crime results from the gap between cultural goals (success) and the legitimate means to reach them."],
    ["Differential association","Sutherland: criminal behavior is learned through interaction with others who favor lawbreaking."],
    ["Social control theory","Hirschi: people commit crime when their bonds to society (attachment, commitment, involvement, belief) are weak."],
    ["Labeling theory","Being labeled a criminal pushes a person deeper into criminal behavior and identity."],
    ["Edgework","Delinquent acts motivated by the thrill, exhilaration, and excitement of risky illegal behavior."],
    ["Social conflict theories","Crime is the product of class struggle and inequality; the powerful define crime to protect their own interests."],
    ["Life course theories","Look back to childhood: criminal behavior develops, persists, or stops across a person's life depending on changing influences (turning points)."],
    ["Victimology","The study of victims of crime, including who is victimized, why, and the patterns and consequences of victimization."],
    ["Drug-crime relationship","The link between drug use and crime: drugs can cause crime (to fund use or while impaired), crime can lead to drug use, or both share common roots."]
  ],
  "Ch 3 — The Crime Picture":[
    ["UCR (Uniform Crime Report)","FBI's annual count of crimes reported to police; uses the hierarchy rule, only counts the most serious offense per incident."],
    ["Part I / Index crimes","The serious offenses tracked by the UCR: murder, rape, robbery, aggravated assault, burglary, larceny-theft, motor vehicle theft, arson."],
    ["Part II offenses","Less serious crimes tracked by the UCR (e.g., simple assault, fraud, vandalism, drug offenses), recorded only when an arrest is made."],
    ["Hierarchy rule","UCR flaw: in a multi-offense incident, only the single most serious crime is counted, which undercounts total crime."],
    ["NIBRS","National Incident-Based Reporting System; more detailed than UCR, records every offense in an incident; replacing the old UCR summary system."],
    ["NCVS","National Crime Victimization Survey (BJS); surveys households to capture crime not reported to police."],
    ["Dark figure of crime","The large number of crimes that are never reported to or recorded by police."],
    ["Self-report survey","Method where individuals anonymously report their own offending."],
    ["Violent crime","Murder, rape, robbery, and assault, crimes involving force or threat of force."],
    ["Property crime","Burglary, larceny-theft, motor vehicle theft, and arson; no force against a person."],
    ["White-collar crime","Nonviolent crime committed for financial gain through deception by business/professional people (fraud, embezzlement)."],
    ["Organized crime","Ongoing criminal enterprise that supplies illegal goods/services for profit."],
    ["Chronic offender (Wolfgang)","A small group of repeat offenders responsible for a disproportionate share of all crime."],
    ["Age-crime relationship","Crime rates peak in the late teens and decline with age (aging-out)."]
  ],
  "Ch 4 — Inside Criminal Law":[
    ["Constitutional law","Law based on the U.S. Constitution and state constitutions; the supreme law of the land."],
    ["Statutory law","Written laws enacted by legislatures (Congress, state legislatures, city councils)."],
    ["Case law / precedent","Law made by appellate court decisions; guided by stare decisis (let the decision stand)."],
    ["Administrative law","Rules and regulations created by government agencies."],
    ["Stare decisis","'To stand by decided cases'; the principle that courts follow precedent."],
    ["Civil law vs criminal law","Civil = disputes between private parties (preponderance of evidence); Criminal = state vs. offender (beyond a reasonable doubt)."],
    ["Actus reus","The guilty act, a voluntary criminal act (or failure to act when legally required)."],
    ["Mens rea","The guilty mind, the intent or state of mind to commit a crime."],
    ["Concurrence","The guilty act and the guilty mind must occur together."],
    ["Felony vs misdemeanor","Felony = serious crime punishable by 1+ year in prison or death; misdemeanor = minor crime, usually under a year in jail."],
    ["Mala in se","Acts inherently wrong or evil in themselves (murder, rape)."],
    ["Mala prohibita","Acts wrong only because they are prohibited by law (drug possession, gambling)."],
    ["Strict liability","Crimes that require no mens rea, the act alone is enough (e.g., statutory rape)."],
    ["Insanity defense","Excuse defense: the defendant lacked the mental capacity to understand the wrongfulness of the act (M'Naghten, irresistible impulse, ALI/substantial capacity)."],
    ["Self-defense","Justification defense: use of force to protect oneself from imminent harm."],
    ["Entrapment","Justification defense: police induced a person to commit a crime they otherwise would not have."],
    ["Duress","Excuse: the defendant committed the act under threat of immediate harm."],
    ["Procedural criminal law","Rules governing how the law is enforced; protects defendants' rights (Bill of Rights)."]
  ],
  "Ch 5 — Law Enforcement Today":[
    ["Sir Robert Peel","Created the London Metropolitan Police in 1829; officers nicknamed 'bobbies'; father of modern policing."],
    ["Political era","1840s-1930s; police closely tied to local politics, widespread corruption."],
    ["Reform/Professional era","1930s-1970s; professionalization, improved salaries/training, reduced corruption (Vollmer, O.W. Wilson)."],
    ["Community era","1970s-present; community policing and problem-oriented policing, partnerships with citizens."],
    ["Intelligence-led policing (ILP)","Proactive strategy using data analysis to predict and prevent crime before it happens."],
    ["Local law enforcement","Municipal police departments and county sheriffs, the bulk of U.S. policing."],
    ["State law enforcement","State police and highway patrol agencies."],
    ["Federal law enforcement","FBI, DEA, ATF, U.S. Marshals, Secret Service, and DHS agencies."],
    ["Probationary period","Early period in an officer's career during which they can be fired without cause."],
    ["Field training officer (FTO)","Senior officer who trains and supervises a new recruit on the beat."],
    ["Recruitment","Process by which agencies build a pool of qualified applicants for hire."],
    ["Women in policing","About 12% of sworn officers; research shows little difference in performance vs. men."],
    ["Double marginality","Minority officers face suspicion from both white colleagues and their own community."],
    ["DHS","Department of Homeland Security; created in 2002 by consolidating 22 federal agencies."],
    ["Private security","Privately employed personnel who protect people/property; not sworn officers."]
  ]
};

const MCQ = {
  "Ch 1":[
    ["A crime is best defined as:",["Any act that society dislikes","An act in violation of the law for which a punishment is prescribed","Any immoral behavior","An act that harms another person"],1,"Crime is a legal concept: an act that breaks a law carrying a prescribed punishment, not just immoral or disliked behavior."],
    ["The view that criminal law reflects the shared values of the majority is the:",["Conflict model","Consensus model","Crime control model","Due process model"],1,"The consensus model holds that law expresses widely shared societal values."],
    ["Emphasizing the rights of the accused and formal procedure reflects the:",["Crime control model","Due process model","Conflict model","Wedding cake model"],1,"The due process model prioritizes protecting the accused and following correct procedure."],
    ["The crime control model emphasizes:",["Individual rights","Efficiency and punishing offenders","Rehabilitation only","Eliminating police discretion"],1,"Crime control values speed, efficiency, and finality in punishing offenders to protect society."],
    ["The three main components of the criminal justice system are:",["Police, courts, corrections","Federal, state, local","Arrest, trial, appeal","Crime, punishment, release"],0,"The system is built on law enforcement, the courts, and corrections."],
    ["The sharing of power between the national and state governments is called:",["Separation of powers","Federalism","Jurisdiction","Due process"],1,"Federalism divides authority between the national and state levels."],
    ["The authority to make decisions based on personal judgment rather than fixed rules is:",["Jurisdiction","Discretion","Probable cause","Sovereignty"],1,"Discretion is the judgment-based decision-making power exercised throughout the CJ system."],
    ["In the 'wedding cake' model, the largest layer is made up of:",["Celebrated cases","Serious felonies","Misdemeanors","Death penalty cases"],2,"Misdemeanors form the broad bottom layer, the bulk of cases; celebrated cases are the tiny top."],
    ["Which event most reshaped American criminal justice toward homeland security?",["The civil rights movement","The September 11, 2001 attacks","Prohibition","The war on drugs"],1,"The 9/11 attacks drove the shift toward homeland security and intelligence-led approaches."]
  ],
  "Ch 2":[
    ["Criminology is the scientific study of:",["Punishment only","Crime and the causes of criminal behavior","Courtroom procedure","Police organization"],1,"Criminology studies crime and why it happens."],
    ["Choice theory is rooted in which school of thought?",["Positivism","Classical criminology","Sociology","Psychiatry"],1,"Choice theory grows out of classical criminology and its assumption of free, rational choice."],
    ["According to classical criminology, people violate the law because they are motivated by:",["Genetics","Greed, revenge, survival, or hedonism","Brain damage","Poor diet"],1,"Classical thinkers saw crime as a rational pursuit of self-interest, greed, revenge, survival, hedonism."],
    ["Punishing an offender so that the general public is discouraged from crime is:",["Specific deterrence","General deterrence","Incapacitation","Rehabilitation"],1,"General deterrence targets everyone watching; specific deterrence targets the individual offender."],
    ["Who is considered the father of classical criminology?",["Cesare Lombroso","Cesare Beccaria","Sigmund Freud","Edwin Sutherland"],1,"Beccaria founded classical criminology; Lombroso is the father of (scientific) criminology."],
    ["Theories that link crime to biological or psychological abnormalities are:",["Choice theories","Trait theories","Conflict theories","Labeling theories"],1,"Trait theories (positivism) locate the cause of crime in the individual's makeup."],
    ["According to ___ theory, delinquency is the product of an abnormal personality formed early in life.",["Cognitive","Psychodynamic","Behavioral","Rational choice"],1,"Psychodynamic theory (Freud) traces crime to early personality damage."],
    ["The nature theory of intelligence argues that:",["IQ is shaped by environment","IQ is largely inherited and low IQ predisposes delinquency","IQ has no link to crime","IQ tests are invalid"],1,"Nature theory ties intelligence to genetics and links low IQ to delinquency; nurture theory says environment shapes IQ."],
    ["A poor diet has been linked to:",["Autism","Low IQ","Schizophrenia","Hypermasculinity"],1,"In biosocial trait theory, poor nutrition is linked to lower IQ and academic problems."],
    ["Merton's strain theory explains crime as the result of:",["Learned behavior","A gap between cultural goals and legitimate means","Weak social bonds","Genetic traits"],1,"Strain theory focuses on the disconnect between success goals and the means to achieve them."],
    ["Sutherland's differential association theory says criminal behavior is:",["Inherited","Learned through interaction with others","Caused by low IQ","A rational choice"],1,"Differential association holds that crime is learned in social interaction."],
    ["Delinquent acts done for the thrill and excitement are referred to as:",["Atavism","Edgework","Street code","Extraversion"],1,"Edgework describes deviance motivated by exhilaration and risk."],
    ["Theories that look back to childhood and trace how offending develops or stops over a person's life are:",["Choice theories","Life course theories","Trait theories","Conflict theories"],1,"Life course theories focus on development across the lifespan and turning points that start or stop offending."],
    ["The study of crime victims, who is victimized and why, is called:",["Criminology","Victimology","Penology","Sociology"],1,"Victimology specifically studies victims and patterns of victimization."],
    ["Regarding the drug-crime relationship, the text explains that:",["Drugs never cause crime","Drug use and crime are linked, drugs can lead to crime, crime to drug use, or both share common causes","Only alcohol is linked to crime","Crime always causes drug use"],1,"The text presents a two-way, complex link between drug use and crime rather than a one-way cause."]
  ],
  "Ch 3":[
    ["The FBI's annual count of crimes reported to police is the:",["NCVS","Uniform Crime Report (UCR)","NIBRS","Self-report survey"],1,"The UCR compiles crimes reported to police nationwide."],
    ["Which data source captures crimes NOT reported to police?",["UCR","NCVS","Part I crimes","The hierarchy rule"],1,"The NCVS surveys victims directly, capturing the 'dark figure' of unreported crime."],

const NOTES = `
<h2>Chapter 1 — Criminal Justice Today</h2>
<p><b>Crime</b> is an act in violation of the law for which a punishment is prescribed. Whether something is a crime is a <b>legal</b> question, not just a moral one.</p>
<h3>Two views of why we have laws</h3>
<ul>
<li><b>Consensus model</b> — laws reflect the shared values of the majority.</li>
<li><b>Conflict model</b> — laws reflect the values of the powerful, used to control others.</li>
</ul>
<h3>Two competing value systems</h3>
<div class="key"><b>Crime control model</b> = efficiency, speed, finality, punish offenders, protect society.<br><b>Due process model</b> = protect the rights of the accused, follow correct procedure, guard against error. These two are always in tension.</div>
<h3>Structure & process</h3>
<ul>
<li><b>Three components:</b> law enforcement (police), courts, corrections.</li>
<li><b>Federalism:</b> a written constitution splits power between the central government and the states.</li>
<li><b>Integrated definition of crime:</b> Gaines & Miller blend the consensus and conflict views, crime is an act punishable by law, that violates society's values, committed by someone the law holds responsible.</li>
<li><b>Discretion:</b> the ability to make operational decisions based on personal judgment instead of formal rules. It happens at every stage (cop deciding to arrest, prosecutor to charge, judge to sentence).</li>
<li><b>Formal vs. informal process:</b> the formal process is the legal sequence (arrest → corrections); the informal process is how cases really move through discretion and cooperation among the work group.</li>
<li><b>Wedding cake model:</b> explains why different cases get different treatment. Top = celebrated cases (tiny), then serious felonies, less serious felonies, and <b>misdemeanors</b> (the huge bottom layer).</li>
<li><b>9/11</b> shifted CJ toward homeland security and intelligence-led approaches.</li>
</ul>

<h2>Chapter 2 — Causes of Crime</h2>
<p><b>Criminology</b> is the scientific study of crime and its causes.</p>
<h3>Choice theory (classical school)</h3>
<ul>
<li><b>Beccaria</b> = father of classical criminology; punishment should be swift, certain, proportionate.</li>
<li><b>Bentham</b> = utilitarianism / hedonistic calculus (seek pleasure, avoid pain).</li>
<li>People are rational and choose crime for <b>greed, revenge, survival, or hedonism</b>.</li>
<li><b>General deterrence</b> (scare everyone) vs <b>specific deterrence</b> (scare the one offender). Deterrence needs punishment to be swift, severe, and <b>certain</b>, certainty is the weak link.</li>
<li><b>Routine activities theory:</b> motivated offender + suitable target + no capable guardian.</li>
</ul>
<h3>Trait theory (positivism)</h3>
<ul>
<li><b>Lombroso</b> = father of criminology; atavism / the "born criminal."</li>
<li><b>Biological/biosocial:</b> diet, hormones, neurology, genetics. Poor diet → low IQ → weak academics → higher crime risk. Boys with criminal fathers: 37% became multiple offenders.</li>
<li><b>Psychological:</b> psychodynamic (Freud, abnormal personality formed early), behavioral, cognitive.</li>
<li><b>Intelligence:</b> nature theory (IQ inherited, low IQ predisposes crime) vs nurture theory (IQ shaped by environment).</li>
</ul>
<h3>Sociological theories</h3>
<ul>
<li><b>Social disorganization</b> (Chicago School, Shaw & McKay) — crime tied to neighborhood breakdown.</li>
<li><b>Strain theory</b> (Merton) — gap between goals and legitimate means.</li>
<li><b>Differential association</b> (Sutherland) — crime is learned socially.</li>
<li><b>Social control</b> (Hirschi) — weak bonds (attachment, commitment, involvement, belief) free people to offend.</li>
<li><b>Labeling theory</b> — the criminal label pushes people deeper into crime.</li>
<li><b>Edgework</b> — crime for the thrill and excitement.</li>
<li><b>Social conflict theories</b> — crime grows out of class struggle and inequality.</li>
</ul>
<h3>The rest of Chapter 2 (don't skip these, the book devotes whole sections to them)</h3>
<ul>
<li><b>Life course theories</b> — "looking back to childhood." Offending develops, continues, or stops across a person's life depending on turning points (marriage, job, etc.).</li>
<li><b>Victimology</b> — the study of crime victims: who gets victimized, why, and the patterns/consequences.</li>
<li><b>The drug-crime link</b> — the connection runs both ways: drug use can drive crime (funding a habit or acting while impaired), crime can lead to drug use, or both can share common causes like poverty.</li>
</ul>

<h2>Chapter 3 — The Crime Picture: Offenders and Victims</h2>
<h3>Measuring crime</h3>
<div class="tbl-scroll"><table>
<tr><th>Source</th><th>Who runs it</th><th>Key feature</th></tr>
<tr><td>UCR</td><td>FBI</td><td>Crimes reported to police; hierarchy rule (most serious only)</td></tr>
<tr><td>NIBRS</td><td>FBI</td><td>Detailed, records every offense in an incident; replacing UCR</td></tr>
<tr><td>NCVS</td><td>BJS</td><td>Victim survey; captures unreported crime</td></tr>
<tr><td>Self-report</td><td>Researchers</td><td>Offenders report their own crimes anonymously</td></tr>
</table></div>
<div class="key"><b>Dark figure of crime</b> = all the crime that never gets reported to police. The NCVS exists to estimate it.</div>
<h3>Types of crime</h3>
<ul>
<li><b>Violent:</b> murder, rape, robbery, assault.</li>
<li><b>Property:</b> burglary, larceny-theft, motor vehicle theft, arson.</li>
<li><b>White-collar:</b> nonviolent, deception for financial gain (fraud, embezzlement).</li>
<li><b>Organized, public-order, and cyber/high-tech</b> crime round it out.</li>
</ul>
<h3>Correlates of crime</h3>
<ul>
<li><b>Age:</b> peaks in late teens, then ages out.</li>
<li><b>Chronic offenders</b> (Wolfgang): a small group commits most crime.</li>
<li>Gender, race/ethnicity, and class also correlate.</li>
</ul>

<h2>Chapter 4 — Inside Criminal Law</h2>
<h3>Four sources of American law</h3>
<ul>
<li><b>Constitutional law</b> — supreme law of the land.</li>
<li><b>Statutory law</b> — written, passed by legislatures.</li>
<li><b>Case law</b> — appellate decisions, guided by <b>stare decisis</b> (follow precedent).</li>
<li><b>Administrative law</b> — agency rules and regulations.</li>
</ul>
<h3>Civil vs criminal</h3>
<div class="key">Civil: private parties, <b>preponderance of the evidence</b>. Criminal: state vs offender, <b>beyond a reasonable doubt</b>.</div>
<h3>Purposes of criminal law</h3>
<ul>
<li><b>Legal function</b> — "protect and punish": maintain order by defining crimes and punishing those who commit them.</li>
<li><b>Social function</b> — "maintain and teach": express society's morals and reinforce shared values.</li>
</ul>
<h3>Elements of a crime</h3>
<ul>
<li><b>Actus reus</b> — the guilty act.</li>
<li><b>Mens rea</b> — the guilty mind / intent.</li>
<li><b>Concurrence</b> — act and intent occur together.</li>
<li>Plus causation, attendant circumstances, and harm.</li>
<li><b>Strict liability</b> crimes need no mens rea (e.g., statutory rape).</li>
</ul>
<h3>Classifying crimes</h3>
<ul>
<li><b>Felony</b> = 1+ year in prison or death. <b>Misdemeanor</b> = under a year in jail.</li>
<li><b>Mala in se</b> = inherently evil (murder). <b>Mala prohibita</b> = wrong only because banned (drug possession).</li>
</ul>
<h3>Defenses</h3>
<div class="tbl-scroll"><table>
<tr><th>Justification (act was right)</th><th>Excuse (not responsible)</th></tr>
<tr><td>Self-defense, necessity, duress*, entrapment</td><td>Insanity, infancy, intoxication, mistake</td></tr>
</table></div>
<p style="font-size:12px;color:var(--dim)">*Texts vary on whether duress is justification or excuse, check how Gaines &amp; Miller classifies it. Insanity tests: M'Naghten (right/wrong), irresistible impulse, ALI/substantial capacity.</p>

<h2>Chapter 5 — Law Enforcement Today</h2>
<h3>History</h3>
<ul>
<li>English roots: watch system, tithings; <b>Sir Robert Peel</b> created the London Metropolitan Police (<b>1829</b>), officers = "bobbies."</li>
</ul>
<h3>Eras of U.S. policing</h3>
<div class="tbl-scroll"><table>
<tr><th>Era</th><th>Rough dates</th><th>Defining feature</th></tr>
<tr><td>Political</td><td>1840s-1930s</td><td>Tied to politics, corruption</td></tr>
<tr><td>Reform / Professional</td><td>1930s-1970s</td><td>Professionalism, better pay/training (Vollmer, O.W. Wilson)</td></tr>
<tr><td>Community</td><td>1970s-present</td><td>Community & problem-oriented policing</td></tr>
<tr><td>Homeland security</td><td>post-9/11</td><td>Intelligence-led policing</td></tr>
</table></div>
<h3>Levels of law enforcement</h3>
<ul>
<li><b>Local:</b> municipal police + county sheriffs (most U.S. officers).</li>
<li><b>State:</b> state police, highway patrol.</li>
<li><b>Federal:</b> FBI, DEA, ATF, U.S. Marshals, Secret Service, DHS.</li>
</ul>
<h3>Recruitment & people</h3>
<ul>
<li>Process: application → tests/interview → background check → academy → <b>field training (FTO)</b> → <b>probationary period</b> (can be fired without cause).</li>
<li><b>Women</b> ≈ 12% of sworn officers; research shows little performance difference vs men.</li>
<li><b>Double marginality:</b> minority officers face suspicion from colleagues and their own community.</li>
<li><b>DHS</b> = 22 federal agencies combined (2002).</li>
</ul>
<div class="key" style="margin-top:24px"><b>Cram priorities:</b> deterrence types (general vs specific), the theory founders (Beccaria = classical, Lombroso = criminology, Freud = psychodynamic), the three crime-data sources, actus reus vs mens rea, felony vs misdemeanor, and the four policing eras. Those show up the most.</div>
`;

/* ============ LOGIC ============ */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

// tabs
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));
  $$('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  $('#'+t.dataset.p).classList.add('active');
  $('#scorebar').style.display = t.dataset.p==='mcq' ? 'flex':'none';
});

/* FLASHCARDS */
let deck=[], ci=0, flipped=false;
const deckSel=$('#deckSel');
Object.keys(FLASH).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;deckSel.appendChild(o);});
function loadDeck(){deck=FLASH[deckSel.value].slice();ci=0;flipped=false;render();}
function render(){
  const [f,b]=deck[ci];
  $('#cardText').textContent=flipped?b:f;
  $('#cardText').className=flipped?'back':'front';
  $('#sideLbl').textContent=flipped?'Definition':'Term';
  $('#cardTag').textContent=deckSel.value;
  $('#cardCount').textContent=(ci+1)+' / '+deck.length;
}
$('#card').onclick=()=>{flipped=!flipped;render();};
$('#next').onclick=()=>{ci=(ci+1)%deck.length;flipped=false;render();};
$('#prev').onclick=()=>{ci=(ci-1+deck.length)%deck.length;flipped=false;render();};
$('#shuf').onclick=()=>{deck.sort(()=>Math.random()-.5);ci=0;flipped=false;render();};
deckSel.onchange=loadDeck;
loadDeck();

/* MCQ */
let sbC=0, sbT=0;
const mcqChap=$('#mcqChap');
const oAll=document.createElement('option');oAll.value='ALL';oAll.textContent='All chapters';mcqChap.appendChild(oAll);
Object.keys(MCQ).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;mcqChap.appendChild(o);});
function getMcqs(){
  let list=[];
  if(mcqChap.value==='ALL'){Object.keys(MCQ).forEach(k=>MCQ[k].forEach(q=>list.push(q)));}
  else list=MCQ[mcqChap.value].slice();
  return list;
}
function renderMcq(shuffle){
  let list=getMcqs();
  if(shuffle)list.sort(()=>Math.random()-.5);
  sbC=0;sbT=0;updateSb();
  const wrap=$('#mcqList');wrap.innerHTML='';
  $('#mcqProg').textContent=list.length+' questions';
  list.forEach((q,i)=>{
    const [stem,opts,ans,expl]=q;
    const div=document.createElement('div');div.className='q';
    div.innerHTML='<div class="num">Q'+(i+1)+'</div><div class="stem">'+stem+'</div>';
    opts.forEach((opt,oi)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=opt;
      b.onclick=()=>{
        if(div.dataset.done)return;
        div.dataset.done='1';
        sbT++;
        const btns=div.querySelectorAll('.opt');
        btns.forEach((x,xi)=>{x.classList.add('locked');if(xi===ans)x.classList.add('correct');});
        if(oi===ans){sbC++;}else{b.classList.add('wrong');}
        div.querySelector('.expl').classList.add('show');
        updateSb();
      };
      div.appendChild(b);
    });
    const e=document.createElement('div');e.className='expl';e.textContent=expl;div.appendChild(e);
    wrap.appendChild(div);
  });
}
function updateSb(){
  $('#sbCorrect').textContent=sbC;$('#sbTotal').textContent=sbT;
  $('#sbAcc').textContent=sbT?Math.round(sbC/sbT*100)+'%':'—';
}
mcqChap.onchange=()=>renderMcq(false);
$('#mcqShuf').onclick=()=>renderMcq(true);
$('#mcqReset').onclick=()=>renderMcq(false);
renderMcq(false);

/* SEQUENCING */
const seqSel=$('#seqSel');
Object.keys(SEQ).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;seqSel.appendChild(o);});
let seqState=[], seqPick=[];
function loadSeq(shuffle){
  const [prompt,items]=SEQ[seqSel.value];
  $('#seqPrompt').textContent=prompt;
  $('#seqMsg').textContent='';
  seqState=items.map((t,i)=>({t,correct:i}));
  if(shuffle!==false)seqState.sort(()=>Math.random()-.5);
  seqPick=[];renderSeq();
}
function renderSeq(){
  const list=$('#seqList');list.innerHTML='';
  seqState.forEach((it,idx)=>{
    const d=document.createElement('div');d.className='seq-item';
    const pos=seqPick.indexOf(idx);
    if(pos>=0)d.classList.add('picked');
    d.innerHTML='<span class="order">'+(pos>=0?(pos+1):'·')+'</span><span>'+it.t+'</span>';
    d.onclick=()=>{
      const p=seqPick.indexOf(idx);
      if(p>=0)seqPick.splice(p,1);else seqPick.push(idx);
      renderSeq();$('#seqMsg').textContent='';
    };
    list.appendChild(d);
  });
}
$('#seqCheck').onclick=()=>{
  if(seqPick.length!==seqState.length){$('#seqMsg').style.color='var(--bad)';$('#seqMsg').textContent='Pick every item in order first.';return;}
  let ok=true;
  $$('#seqList .seq-item').forEach(x=>x.classList.remove('right','wrongpos'));
  seqPick.forEach((stateIdx,position)=>{
    const correct=seqState[stateIdx].correct===position;
    if(!correct)ok=false;
    const el=$('#seqList').children[stateIdx];
    el.classList.add(correct?'right':'wrongpos');
  });
  $('#seqMsg').style.color=ok?'var(--good)':'var(--bad)';
  $('#seqMsg').textContent=ok?'Correct order! ✓':'Not quite, green = right spot, red = wrong spot.';
};
$('#seqShuf').onclick=()=>loadSeq(true);
$('#seqReset').onclick=()=>{seqPick=[];renderSeq();$('#seqMsg').textContent='';};
seqSel.onchange=()=>loadSeq(true);
loadSeq(true);

/* MATCHING */
const matchSel=$('#matchSel');
Object.keys(MATCH).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;matchSel.appendChild(o);});
let mPairs=[], mLeft=[], mRight=[], selL=null, matched=0;
function loadMatch(){
  mPairs=MATCH[matchSel.value].map((p,i)=>({term:p[0],def:p[1],id:i}));
  mLeft=mPairs.map(p=>({txt:p.term,id:p.id})).sort(()=>Math.random()-.5);
  mRight=mPairs.map(p=>({txt:p.def,id:p.id})).sort(()=>Math.random()-.5);
  selL=null;matched=0;renderMatch();
}
function renderMatch(){
  const L=$('#matchL'),R=$('#matchR');L.innerHTML='';R.innerHTML='';
  $('#matchProg').textContent=matched+' / '+mPairs.length+' matched';
  mLeft.forEach(l=>{
    const d=document.createElement('div');d.className='m-item';d.textContent=l.txt;
    if(l.done)d.classList.add('done');
    if(selL&&selL.id===l.id&&!l.done)d.classList.add('sel');
    d.onclick=()=>{if(l.done)return;selL=l;renderMatch();};
    L.appendChild(d);
  });
  mRight.forEach(r=>{
    const d=document.createElement('div');d.className='m-item';d.textContent=r.txt;
    if(r.done)d.classList.add('done');
    d.onclick=()=>{
      if(r.done||!selL)return;
      if(selL.id===r.id){
        mLeft.find(x=>x.id===r.id).done=true;
        r.done=true;matched++;selL=null;renderMatch();
      }else{
        d.classList.add('miss');setTimeout(()=>d.classList.remove('miss'),500);
        selL=null;renderMatch();
      }
    };
    R.appendChild(d);
  });
}
matchSel.onchange=loadMatch;
$('#matchShuf').onclick=loadMatch;
$('#matchReset').onclick=loadMatch;
loadMatch();

/* NOTES */
$('#notes').innerHTML=NOTES;
</script>
