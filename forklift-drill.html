<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift Drill</title>
<meta property="og:title" content="Forklift Operator Drill">
<meta property="og:description" content="HamStudy-style mastery drill for the OSHA forklift written test. Auto-advances on correct, requeues misses until mastered, tracks Seen and Aptitude.">
<meta property="og:url" content="https://niggerfaggot.club/forklift-drill">
<meta name="twitter:card" content="summary">
<style>
:root{
  --bg:#e9edf0; --panel:#ffffff; --ink:#26313a; --sub:#6b7a87;
  --teal:#159fc9; --green:#43a047; --red:#e23b3b; --line:#d7dee4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:14px 12px 40px}
header{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:17px;font-weight:700}
.htxt .sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.rings{display:flex;gap:10px}
.ring{position:relative;width:56px;height:56px}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--sub)}
.ring .lbl b{font-size:12.5px;color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;color:var(--ink)}
.bar .spacer{flex:1}
.bar a{color:var(--sub);font-size:12.5px;text-decoration:none;border-bottom:1px dotted var(--sub);cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 16px}
.qtop{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px}
.qtxt{font-size:16.5px;line-height:1.45;font-weight:600;margin-bottom:14px}
.ans{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;line-height:1.4;cursor:pointer;margin-bottom:8px;color:var(--ink);transition:border-color .12s, background .12s}
.ans:hover{border-color:var(--teal)}
.ans .L{flex:0 0 22px;height:22px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.ans.correct{border-color:var(--green);background:#eef7ee}
.ans.correct .L{background:var(--green);border-color:var(--green);color:#fff}
.ans.wrong{border-color:var(--red);background:#fdefef}
.ans.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.ans:disabled{cursor:default}
.explain{display:none;border-left:3px solid var(--red);background:#fbf4f4;border-radius:0 8px 8px 0;padding:10px 12px;font-size:13.5px;line-height:1.45;color:#5a4444;margin-top:6px}
.explain.show{display:block}
.cont{display:none;margin-top:12px;text-align:center;font-size:13px;color:var(--sub)}
.cont.show{display:block}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:22px;font-weight:700;color:var(--green);margin-bottom:8px}
.done p{color:var(--sub);font-size:14px;margin-bottom:16px}
.done button{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14.5px;cursor:pointer}
footer{margin-top:14px;text-align:center;font-size:11.5px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htxt">
      <h1>Forklift Operator Drill</h1>
      <div class="sub">OSHA 1910.178 written-test prep &middot; Sunbelt class 8/27</div>
    </div>
    <div class="rings">
      <div class="ring">
        <svg width="56" height="56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--line)" stroke-width="5"/><circle id="seenArc" cx="28" cy="28" r="24" fill="none" stroke="var(--teal)" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg>
        <div class="lbl"><b id="seenPct">0%</b>Seen</div>
      </div>
      <div class="ring">
        <svg width="56" height="56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--line)" stroke-width="5"/><circle id="aptArc" cx="28" cy="28" r="24" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg>
        <div class="lbl"><b id="aptPct">0%</b>Apt</div>
      </div>
    </div>
  </header>
  <div class="bar">
    <select id="topicSel"></select>
    <div class="spacer"></div>
    <a id="resetLink">reset</a>
  </div>
  <div class="card" id="card">
    <div class="qtop"><span id="qTopic"></span><span id="qLeft"></span></div>
    <div class="qtxt" id="qtxt"></div>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="cont" id="cont">tap anywhere or press space to continue</div>
  </div>
  <footer>1&ndash;4 / A&ndash;D to answer &middot; two in a row retires a question</footer>
</div>
<script>
var MCQS = [["The forklift stability triangle is formed by the two front wheels and which third point?", ["The pivot pin at the center of the rear axle", "The center point of the counterweight at the rear frame", "The midpoint between the two rear wheel hubs", "The base of the mast at the carriage mounting"], 0, "Rear axle pivots on a center pin; that pin is the third point of the triangle.", "Stability"], ["A sit-down counterbalance truck stays upright as long as the combined center of gravity remains where?", ["Inside the stability triangle formed by the axles", "Directly above the centerline of the front axle", "Behind the vertical plane of the mast rail channels", "Within the combined footprint of all four tires"], 0, "Truck + load CG must stay inside the triangle, not the full tire footprint.", "Stability"], ["Raising a load high on the mast does what?", ["Moves the combined center of gravity up, reducing stability", "Shifts the counterweight moment rearward, adding stability", "Moves the load center closer to the mast, raising capacity", "Puts more weight on the steer axle, improving its traction"], 0, "Higher CG = smaller margin before it crosses the triangle edge.", "Stability"], ["On most capacity plates, the standard load center used to rate the truck is:", ["24 inches", "18 inches", "30 inches", "36 inches"], 0, "Ratings assume a 24-inch load center (half of a 48-inch pallet).", "Stability"], ["Carrying a load with a longer load center than the plate rating does what?", ["Reduces the maximum weight the truck can safely lift", "Requires the mast to be safely tilted fully forward", "Applies only when the load is raised above the guard", "Increases the counterweight force on the steer axle"], 0, "Longer load center = more forward moment = less capacity.", "Stability"], ["In a lateral tip-over on a sit-down truck, the operator should:", ["Stay in the seat, brace, and lean away from the fall", "Jump clear toward the high side, away from the fall, immediately", "Grip the wheel, brake hard, and steer into the fall", "Release the belt, then climb across toward the high side"], 0, "Stay belted in, brace feet, lean away. Jumping is how operators get crushed.", "Stability"], ["Turning at speed with an elevated load risks tip-over mainly because:", ["The center of gravity swings toward the triangle's edge", "The rear wheels lose their braking force in a turn", "The mast rails flex and let the load shift on the forks", "The counterweight lifts and unloads the drive tires"], 0, "Cornering force pushes the combined CG sideways toward the triangle boundary.", "Stability"], ["Rear-wheel steering means the operator must watch for:", ["Tail swing toward obstacles on the outside of a turn", "Fork drift toward the inside edge of the turning radius", "Loss of steering response at very low travel speeds", "Longer braking distance when turning with an empty truck"], 0, "The rear end swings wide opposite the turn. Clearance check every corner.", "Stability"], ["How often must a forklift be inspected?", ["At least daily, or after every shift in round-the-clock use", "At least weekly, with a documented monthly service check", "Before each lift, whenever it exceeds half rated capacity", "Only when a defect was reported by the previous operator"], 0, "1910.178(q)(7): daily exam, or per-shift when used around the clock.", "Inspection"], ["If the pre-op inspection finds a safety defect, the operator must:", ["Tag the truck out of service and report it for needed repair", "Log the defect in writing, then run it at reduced travel speed", "Finish out the current task, then park it for maintenance", "Repair the item personally before the start of the shift"], 0, "Remove from service immediately. Only authorized personnel repair.", "Inspection"], ["Which inspection check requires the power on?", ["Testing the service brakes, steering wheel, and horn", "Measuring tire condition, tread wear, and wheel lugs", "Inspecting fork heels, mast chains, and welds for cracks", "Checking fluid levels, hoses, and leaks under the truck"], 0, "Operational checks run powered; visual checks are done first, power off.", "Inspection"], ["A fork must be removed from service when:", ["Heel thickness is worn ten percent from the original", "Tip height difference is under three percent of length", "Hairline paint cracking shows at the hanger hooks", "A wear ridge is visible on the top face of the blade"], 0, "10% heel wear cuts capacity ~20%. Cracks and bent forks also condemn it.", "Inspection"], ["Seat belts on a sit-down rider truck:", ["Must be worn whenever the truck is in operation", "Are optional when the truck stays below five mph", "Are required only when carrying elevated loads", "May be removed when an overhead guard is fitted"], 0, "Belt stays on any time you operate. It is what saves you in a tip-over.", "Inspection"], ["Mounting and dismounting the truck requires:", ["Three points of contact while facing the machine", "Gripping the steering wheel to pull yourself up", "Facing away from the machine, one hand on the rail", "Stepping across the forks to reach the operator side"], 0, "Face the truck, three points of contact, never grab the wheel or levers.", "Inspection"], ["The overhead guard is designed to protect the operator from:", ["Small objects falling from elevated loads", "A full pallet load collapsing from height", "Impacts from striking low doorway headers", "Rollover crush forces during a lateral tip"], 0, "Rated for small falling objects only, not a full falling load.", "Inspection"], ["Before lifting, forks should be spaced:", ["As far apart as the load allows, centered on the carriage", "At the standard factory width, as set for the carriage plate", "No wider than half the total length of the pallet base", "Close together, concentrating the lift at the center"], 0, "Wide and centered = stable load. Adjust spacing to each load.", "Loads"], ["When traveling with a load, carry the forks:", ["Four to six inches off the floor with mast tilted back", "At axle height, keeping the mast perfectly vertical", "Twelve to eighteen inches up for dock and curb clearance", "Just below eye level, so the load stays in constant view"], 0, "Low and tilted back. High loads kill stability and visibility.", "Loads"], ["If a load blocks your forward view, you should:", ["Travel in reverse, looking in the direction of travel", "Raise the load just enough, then look clearly underneath it", "Sound the horn continuously and creep slowly forward", "Lean out beside the mast, watching around the load edge"], 0, "Drive it backwards. Never raise a load to see under it.", "Loads"], ["An off-center load on the forks:", ["Can cause the truck to tip over toward the heavy side", "May still be carried once secured with banding or shrink wrap", "Only matters when the mast is tilted forward at height", "Is corrected automatically by the side-shift function"], 0, "Off-center weight creates a side moment. Center it before lifting.", "Loads"], ["Rated capacity on the data plate assumes:", ["The stated load center and an upright mast", "A driver weight under two hundred pounds", "Forks set at their maximum spread width", "Travel on grades of less than five percent"], 0, "Capacity is only valid at the plated load center with the mast vertical.", "Loads"], ["Adding an attachment such as a clamp or rotator:", ["Reduces capacity and requires an updated data plate", "Raises capacity by moving the load center closer", "Has no effect when lifting below half capacity", "Changes nothing if the attachment locks to the carriage"], 0, "Attachments add weight and shift the load center. New plate required.", "Loads"], ["Standing under elevated forks is:", ["Prohibited at all times, whether loaded or empty", "Allowed briefly, when the forks are locked out", "Allowed when the levers are tagged, engine running", "Permitted for maintenance, with the engine shut off"], 0, "Never, for anyone. Maintenance under forks requires physical blocking.", "Loads"], ["To pick up a load from a rack at height:", ["Square up, level the forks, and insert fully under the load", "Approach at a slight angle, clearing both uprights, then insert deeper", "Tilt the mast forward while raising, to reach in deeper", "Lift the load slightly, before the forks are fully seated, then tilt"], 0, "Square, level, full insertion, then lift and tilt back slightly.", "Loads"], ["Lifting personnel is allowed only:", ["On an approved platform properly secured to the forks", "When two operators coordinate and spot the lift together", "For jobs lasting under fifteen minutes at low height", "If the person ties off fall protection to the mast rails"], 0, "Approved work platform only, secured, with controls manned.", "Loads"], ["On a grade over ten percent with a load, travel:", ["With the load pointed upgrade, going up and coming down", "With the load downgrade, keeping the view ahead of you clear", "In whichever direction gives the best view", "Sideways across the slope, reducing the effective grade"], 0, "Load upgrade both directions. Gravity holds the load against the mast.", "Traveling"], ["An unloaded truck on a ramp should travel with:", ["The forks pointed downgrade", "The forks pointed upgrade", "The counterweight pointed downgrade", "The mast tilted fully forward"], 0, "Empty truck: heavy end (counterweight) upgrade, so forks face downgrade.", "Traveling"], ["Safe following distance behind another truck is about:", ["Three truck lengths", "One truck length", "Ten truck lengths", "Half a truck length"], 0, "Roughly three lengths, or about a three second gap.", "Traveling"], ["At blind corners and intersections:", ["Slow down, sound the horn, and look both ways", "Flash the warning lights, keeping your travel speed steady", "Stop fully, dismount, and check the aisle", "Hug the inside wall to shorten the path"], 0, "Slow, horn, look. Hugging the inside wall puts tail swing into the aisle.", "Traveling"], ["Wet or slippery floors call for:", ["Slower travel speeds with gentle, gradual braking", "Higher tire pressure, paired with a wider fork spread", "Shorter following distance, staying in dry tracks", "Tilting the mast forward to add drive traction"], 0, "Slow down, brake early and soft. Nothing else compensates for traction.", "Traveling"], ["Dockboards and bridge plates must be:", ["Secured against movement and rated for the load", "Painted with high-visibility edge marking stripes", "Longer than the forklift wheelbase by two feet", "Inspected by a supervisor before every crossing"], 0, "Secured so they can't shift, with capacity for truck plus load.", "Traveling"], ["Before driving into a trailer at a dock, verify:", ["Wheels are chocked or the trailer is dock-locked", "The trailer lights are switched off at the panel", "The tractor remains coupled with brakes released", "The dock plate is angled downward into the trailer"], 0, "Chocks or a dock lock keep the trailer from creeping off the plate.", "Traveling"], ["Traveling with elevated forks is acceptable:", ["Only when depositing or retrieving at the rack face", "When the total travel distance is under twenty feet", "If the route is marked and pedestrians are cleared out", "Whenever the load weighs less than half rated capacity"], 0, "Raise at the rack, travel low everywhere else.", "Traveling"], ["Under OSHA, forklift operator certification is issued by:", ["The employer, after training and evaluation", "The state licensing board, after a road test", "OSHA area offices, after a written exam", "The truck manufacturer, after a factory course"], 0, "1910.178(l): the employer certifies training and evaluation. No state license.", "OSHA"], ["Operator performance must be re-evaluated at least every:", ["Three years", "Twelve months", "Five years", "Six months"], 0, "Evaluation at least once every three years.", "OSHA"], ["Refresher training is required after:", ["An accident, a near miss, or observed unsafe operation", "Every ninety days, on continuous, full-time forklift assignment", "Each annual review, when the safety program is updated", "Any transfer between crews, day shift, or night shift"], 0, "Also after assignment to a different truck type or workplace changes.", "OSHA"], ["The minimum age to operate a forklift in general industry is:", ["18 years", "16 years", "21 years", "17 years"], 0, "Under 18 is prohibited from powered industrial trucks in non-ag work.", "OSHA"], ["OSHA's powered industrial truck standard for general industry is:", ["29 CFR 1910.178", "29 CFR 1926.602", "29 CFR 1910.147", "29 CFR 1904.178"], 0, "1910.178. 1926.602 is construction equipment, 1910.147 is lockout/tagout.", "OSHA"], ["Certification from a prior employer:", ["Does not replace evaluation by the current employer", "Transfers fully when issued within the last three years", "Is valid anywhere, provided the truck class matches", "Expires only when the operator changes truck brands"], 0, "Cert is employer-specific. New employer must evaluate you regardless.", "OSHA"], ["Modifying a forklift, such as adding a counterweight, requires:", ["Written approval obtained from the manufacturer beforehand", "A load test witnessed and signed by the site supervisor", "Advance notification to the nearest OSHA area office", "Recertification of the operator on the modified setup"], 0, "1910.178(a)(4): no modifications affecting capacity without written OEM approval.", "OSHA"], ["Battery charging areas must have:", ["Ventilation, an eyewash station, and no open flames", "A dedicated attendant present during charging, day and night, on site", "Fire doors, rated for two hours, facing each charging stall", "Insulated floor mats, one placed beneath each stall"], 0, "Ventilation for hydrogen, eyewash for acid, ignition sources banned.", "Fuel"], ["Before changing or charging a battery:", ["Set the brake and keep metal tools off the battery top", "Tilt the mast forward, relieving hydraulic pressure", "Run the motor briefly, warming the cells up to their temperature", "Disconnect the horn circuit, preventing stray arcing"], 0, "Truck secured, no metal across terminals, vent caps in place.", "Fuel"], ["The main hazard from charging lead-acid batteries is:", ["Hydrogen gas, which can ignite with explosive force", "Carbon monoxide, which can pool near the floor drains", "Ozone, generated by the charger rectifier stack", "Nitrogen, displacing oxygen inside the cabinet"], 0, "Charging releases hydrogen. That is why ventilation and no-flame rules exist.", "Fuel"], ["When fueling a gasoline or diesel truck:", ["Shut the engine off and keep ignition sources away", "Keep the engine idling so the fuel pump stays primed", "Raise the forks to expose the tank filler neck", "Release the parking brake so the truck can be moved"], 0, "Engine off, no smoking, ventilated area. Same logic as any refueling.", "Fuel"], ["Operating an internal-combustion truck indoors risks:", ["Carbon monoxide buildup in poorly ventilated spaces", "Hydraulic fluid vapor forming at the pump housing", "Static discharge between the tires and the floor slab", "Fuel vapor migrating into the battery charging bays"], 0, "CO is odorless and accumulates fast in enclosed spaces.", "Fuel"], ["PPE for handling battery electrolyte includes:", ["A face shield plus acid-resistant gloves and an apron", "A half-face respirator fitted with organic vapor twin cartridges", "Cut-resistant sleeves with leather palm work gloves", "Hearing protection with steel-toed metatarsal boots"], 0, "Electrolyte is sulfuric acid. Splash protection, not vapor or cut protection.", "Fuel"], ["In shared aisles, the right of way belongs to:", ["Pedestrians, in every single situation, no exceptions", "The forklift, when loaded, within marked truck aisles", "Whichever party, truck or walker, entered the aisle first", "The forklift, whenever it is traveling in reverse"], 0, "Pedestrians always have the right of way. Full stop.", "Pedestrians"], ["A truck is considered unattended when the operator is:", ["25 feet or more away, or the truck is out of view", "More than 10 feet away, with the engine still left running", "Off the seat, for more than five minutes at a time", "Outside the marked aisle where the truck is parked"], 0, "1910.178(m)(5): 25 feet away or out of sight = unattended.", "Pedestrians"], ["Before leaving a truck unattended:", ["Lower the forks, set the parking brake, and shut off power", "Raise the forks, clearing tips from foot traffic, then leave", "Leave the engine idling, brake set, if returning within minutes", "Turn the wheels toward the aisle, key on, ready for restart"], 0, "Forks down, controls neutral, brake set, power off.", "Pedestrians"], ["Parking on an incline additionally requires:", ["Blocking or chocking the wheels in place", "Leaving the transmission in reverse gear", "Turning the steer tires fully sideways", "Resting the fork tips against a wall"], 0, "Chock the wheels. Gear position is not a parking brake.", "Pedestrians"], ["Riders on a forklift are allowed:", ["Only when a proper seat is provided for them", "When gripping the overhead guard with both hands", "For short moves at walking speed in the yard", "If they stand on the forks facing the operator"], 0, "No seat, no rider. No exceptions for distance or speed.", "Pedestrians"], ["Sound the horn:", ["At intersections, doorways, and where vision is blocked", "Whenever traveling in reverse, sounding it continuously", "Only when pedestrians, after warning, fail to yield", "Each time the forks, loaded or empty, pass eye level"], 0, "Horn at every blind spot and crossing, not as a constant siren.", "Pedestrians"], ["If a pedestrian steps into your travel path, first:", ["Bring the truck to a complete stop", "Swerve smoothly toward the clear side", "Sound the horn and slow your speed", "Wave them across while still rolling"], 0, "Stop. Then let them clear. Horn-and-slow is the trap answer.", "Pedestrians"], ["Horseplay and stunt driving are:", ["Prohibited at all times on any truck", "Tolerated in open yards away from all pedestrians", "Permitted when a supervisor is present", "Addressed only after a first warning"], 0, "Zero tolerance. This is also a refresher-training trigger.", "Pedestrians"]];
var LS_KEY = "forkliftdrill_v1";
var state = {};   // qi -> {c:consecutive corrects, hist:[]}
var queue = [];   // question indices, current filter only
var cur = -1;
var curOpts = []; // [{oi, t}] display order
var waiting = false;
var topic = "All";

function load(){ try{ var s=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); if(s&&typeof s==="object")state=s; }catch(e){} }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function st(i){ if(!state[i]) state[i]={c:0,hist:[]}; return state[i]; }
function pool(){ var r=[]; for(var i=0;i<MCQS.length;i++) if(topic==="All"||MCQS[i][4]===topic) r.push(i); return r; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function buildQueue(){
  queue = shuffle(pool().filter(function(i){ return st(i).c < 2; }));
}
function rings(){
  var p = pool(), seen=0, apt=0;
  p.forEach(function(i){ var s=st(i); if(s.hist.length>0)seen++; apt += Math.min(s.c,2)/2; });
  var sp = p.length? Math.round(100*seen/p.length):0;
  var ap = p.length? Math.round(100*apt/p.length):0;
  document.getElementById("seenPct").textContent = sp+"%";
  document.getElementById("aptPct").textContent = ap+"%";
  document.getElementById("seenArc").style.strokeDashoffset = 150.8*(1-sp/100);
  document.getElementById("aptArc").style.strokeDashoffset = 150.8*(1-ap/100);
}
function boldUnique(txt, others){
  var ow = {};
  others.forEach(function(o){ o.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).forEach(function(w){ ow[w]=1; }); });
  return txt.split(/(\s+)/).map(function(tok){
    var w = tok.toLowerCase().replace(/[^a-z0-9]/g,"");
    if(w && !ow[w]) return "<b>"+esc(tok)+"</b>";
    return esc(tok);
  }).join("");
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var advTimer = null;
function show(){
  if(advTimer){ clearTimeout(advTimer); advTimer = null; }
  waiting = false;
  var ex = document.getElementById("explain"), ct = document.getElementById("cont");
  if(ex) ex.className = "explain";
  if(ct) ct.className = "cont";
  if(queue.length===0){ return finish(); }
  if(!ex) return;
  cur = queue.shift();
  var m = MCQS[cur];
  curOpts = shuffle(m[1].map(function(t,oi){ return {oi:oi, t:t}; }));
  document.getElementById("qTopic").textContent = m[4];
  document.getElementById("qLeft").textContent = (queue.length+1)+" in queue";
  document.getElementById("qtxt").textContent = m[0];
  var box = document.getElementById("opts"); box.innerHTML = "";
  curOpts.forEach(function(o, di){
    var b = document.createElement("button");
    b.className = "ans"; b.setAttribute("data-disp", di);
    b.innerHTML = '<span class="L">'+String.fromCharCode(65+di)+'</span><span class="T">'+esc(o.t)+'</span>';
    b.addEventListener("click", function(){ answer(di); });
    box.appendChild(b);
  });
  rings();
}
function answer(di){
  if(waiting || cur<0) return;
  var m = MCQS[cur], s = st(cur);
  var pick = curOpts[di], correct = pick.oi === m[2];
  var btns = document.querySelectorAll("#opts .ans");
  btns.forEach(function(b){ b.disabled = true; });
  var keyDisp = -1;
  curOpts.forEach(function(o,i){ if(o.oi===m[2]) keyDisp=i; });
  // bold-on-reveal: bold words unique to the correct answer, only now
  var kb = btns[keyDisp].querySelector(".T");
  kb.innerHTML = boldUnique(m[1][m[2]], m[1].filter(function(_,i){return i!==m[2];}));
  btns[keyDisp].classList.add("correct");
  s.hist.push(correct?1:0);
  if(correct){
    s.c++;
    if(s.c < 2) queue.splice(Math.min(10, queue.length), 0, cur);
    save(); rings();
    advTimer = setTimeout(function(){ show(); }, 420);
  } else {
    btns[di].classList.add("wrong");
    s.c = 0;
    queue.splice(Math.min(3, queue.length), 0, cur);
    save(); rings();
    var ex = document.getElementById("explain");
    ex.textContent = m[3]; ex.className = "explain show";
    document.getElementById("cont").className = "cont show";
    waiting = true;
  }
}
function next(){ if(cur<0 && queue.length===0){ return; } show(); }
function finish(){
  cur = -1;
  document.getElementById("card").innerHTML =
    '<div class="done"><div class="big">Set mastered</div>'+
    '<p>Every question answered correctly twice. You are ready for the written test.</p>'+
    '<button id="again">Study again</button></div>';
  document.getElementById("again").addEventListener("click", function(){
    pool().forEach(function(i){ state[i]={c:0,hist:[]}; }); save();
    location.reload();
  });
  rings();
}
function setTopic(t){
  topic = t; buildQueue();
  if(queue.length===0 && pool().length>0){ finish(); }
  else {
    document.getElementById("card").innerHTML =
      '<div class="qtop"><span id="qTopic"></span><span id="qLeft"></span></div>'+
      '<div class="qtxt" id="qtxt"></div><div id="opts"></div>'+
      '<div class="explain" id="explain"></div>'+
      '<div class="cont" id="cont">tap anywhere or press space to continue</div>';
    show();
  }
}
// topic dropdown
(function(){
  load();
  var sel = document.getElementById("topicSel");
  var ts = ["All"]; MCQS.forEach(function(m){ if(ts.indexOf(m[4])<0) ts.push(m[4]); });
  ts.forEach(function(t){ var o=document.createElement("option"); o.value=t; o.textContent=t; sel.appendChild(o); });
  sel.addEventListener("change", function(){ setTopic(sel.value); });
  document.getElementById("resetLink").addEventListener("click", function(){
    if(confirm("Wipe all drill progress?")){ state={}; save(); location.reload(); }
  });
  document.addEventListener("keydown", function(e){
    if(waiting && (e.key===" "||e.key==="Enter")){ e.preventDefault(); next(); return; }
    if(cur<0||waiting||e.key.length!==1) return;
    var k = e.key.toUpperCase(), di=-1;
    if(k>="1"&&k<="9") di = parseInt(k)-1;
    else if(k>="A"&&k<="Z") di = k.charCodeAt(0)-65;
    if(di>=0 && di<curOpts.length) answer(di);
  });
  document.addEventListener("click", function(e){
    if(waiting && !e.target.closest(".ans")) next();
  });
  setTopic("All");
})();
</script>
